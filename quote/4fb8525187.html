<main class="wrap"><figure class="quote" id="q-4fb8525187" data-kw="">
<blockquote><p>In this verse Paul explains the difference between the true gospel and one that has been corrupted. The true gospel is unchanging, because it does not allow for any variation. Where there is variation, change, diminution, mixture or subtraction it ceases to be the true gospel and becomes false and corrupted. This is the reason why there are so many false religions in the world—Judaism, paganism, Islam and false Christianity. It also explains why the Christian religion, which is unique and unchanging, threatens all the others and is objected to by the entire world. …

Note the cleverness of Satan who begins by unsettling those whom he wants to deceive. First, he upsets them by calling the grace of God into question, and then he comforts them by persuading them that they will be saved if they follow the traditions of the popes and buy their indulgences. In the same way he started by upsetting the Galatians who had found peace of mind thanks to their ministers, and then he promised them peace again if they let themselves be transferred to another gospel and recognize and accept the need for circumcision and observance of the law. …

After condemning the work of the false apostles, Paul goes on to talk about their zeal and intentions. He does not say that they pervert the gospel of Christ but that they want to pervert it. They wanted to do that, but they could not achieve their desire. …

What were they doing? Were they denying the historical facts about Christ—his birth, miracles, crucifixion, death, burial, resurrection and exaltation to the right hand of the Father in heaven? Not at all! What they were saying is that unless you are circumcised and keep the law of Moses, you cannot be saved. Their intention was not to destroy Christianity but to add Judaism to it, and this was a brilliant example of how that strategy worked.

Even so, the apostle did not hesitate to say that they wanted to pervert the gospel of Christ. To add something to that gospel and make it a necessary article of faith is to pervert it, not to embellish it. The false apostles accepted the historical facts about Jesus but denied the sufficiency of the grace that he offered. The grace and power of the gospel of Christ for salvation is meant for every believer, both Jew and Greek. To add to it is to detract from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 26-27.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>

<blockquote><p>The typical reformed view and practice was that the material church buildings of Romanists, when cleansed, may be repurposed for good uses (1 Tim. 4:4–5). On the more exceptional cases where a Romanist building had been so notoriously idolatrous and scandalous, the scandal not removing with the removal of the idolatry, the reformed typically destroyed the building wholly, not allowing it to be further used. The Separatists, as seen here, were generally for destroying all the buildings that had been used by Romanists, not thinking it lawful to repurpose the material goods. See [also] ‘On Church Buildings &amp; Architecture’ (RBO)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; 1644; RBO, 2025), p. 295 fn. 727</span></figcaption>

<blockquote><p>…but it [instituted worship] concerns those outward ways and means whereby God has appointed that faith, and love, and fear of Him to be exercised and expressed unto his glory. And this kind of worship, though it depend not upon the nature of God, but upon his free and arbitrary disposal, and so was of old liable unto alterations, yet God did ever strictly require in the several states and conditions that his Church has gone through in the world. And this is that, which most commonly in the Scripture is called by the name of the worship of God; as that whereby all the acceptable actings of the souls of men towards him are expressed, and the only way of owning and acknowledging Him in the world, as also of entertaining a visible intercourse with Him. This therefore He calls for, and requires indispensibly of all that draw nigh to Him, and that because He is the Lord our God, Rev. 14:6-7; Mt. 4:10; Dt. 10:12-13. For his observance hereof does He so approve of Abraham, Gen. 18:19, and sets it down as an everlasting Law unto all others that in a holy observation thereof He will be sanctified in all that draw nigh unto Him, Lev. 10:1-3. His commands also concerning it are multiplyed in the Scripture, with the approbation of all those that attend unto them. We may not think to find acceptance with God or to inherit the promises, if supposing ourselves to adhere unto Him in worship internal and natural, we neglect that which is external and of his free appointment: for besides, that we renounce thereby our inward dependance on Him also in not observing his commands, as Adam did in transgressing an institution, we become wholly useless unto all the ends of his glory in the world, which is not the way to come to an enjoyment of Him. Neither do we only express and profess our inward moral, natural worship of God hereby, by which means it becomes the principal way and instrument of faith and trust exerting themselves in our obedience, but also it is a most effectual help and assistance unto the principle of that natural worship, strengthening the habit of it, and exciting it unto all suitable actings, unto its increase and growth.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…but it [instituted worship] concerns those outward ways and means whereby God has appointed that faith, and love, and fear of Him to be exercised and expressed unto his glory. And this kind of worship, though it depend not upon the nature of God, but upon his free and arbitrary disposal, and so was of old liable unto alterations, yet God did ever strictly require in the several states and conditions that his Church has gone through in the world. And this is that, which most commonly in the Scripture is called by the name of the worship of God; as that whereby all the acceptable actings of the souls of men towards him are expressed, and the only way of owning and acknowledging Him in the world, as also of entertaining a visible intercourse with Him. This therefore He calls for, and requires indispensibly of all that draw nigh to Him, and that because He is the Lord our God, Rev. 14:6-7; Mt. 4:10; Dt. 10:12-13. For his observance hereof does He so approve of Abraham, Gen. 18:19, and sets it down as an everlasting Law unto all others that in a holy observation thereof He will be sanctified in all that draw nigh unto Him, Lev. 10:1-3. His commands also concerning it are multiplyed in the Scripture, with the approbation of all those that attend unto them. We may not think to find acceptance with God or to inherit the promises, if supposing ourselves to adhere unto Him in worship internal and natural, we neglect that which is external and of his free appointment: for besides, that we renounce thereby our inward dependance on Him also in not observing his commands, as Adam did in transgressing an institution, we become wholly useless unto all the ends of his glory in the world, which is not the way to come to an enjoyment of Him. Neither do we only express and profess our inward moral, natural worship of God hereby, by which means it becomes the principal way and instrument of faith and trust exerting themselves in our obedience, but also it is a most effectual help and assistance unto the principle of that natural worship, strengthening the habit of it, and exciting it unto all suitable actings, unto its increase and growth.”

— John Owen, A Brief Instruction in the Worship of God, … (London: 1667) | Question 1, pp. 2-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6but+it+%5Binstituted+worship%5D+concerns+those+outward+ways+and+means+whereby+God+has+appointed+that+faith%2C+and+love%2C+and+fear+of+Him+to+be+exercised+and+expressed+unto+his+glory.+And+this+kind+of+worship%2C+though+it+depend+not+upon+the+nature+of+God%2C+but+upon+his+free+and+arbitrary+disposal%2C+and+so+was+of+old+liable+unto+alterations%2C+yet+God+did+ever+strictly+require+in+the+several+states+and+conditions+that+his+Church+has+gone+through+in+the+world.+And+this+is+that%2C+which+most+commonly+in+the+Scripture+is+called+by+the+name+of+the+worship+of+God%3B+as+that+whereby+all+the+acceptable+actings+of+the+souls+of+men+towards+him+are+expressed%2C+and+the+only+way+of+owning+and+acknowledging+Him+in+the+world%2C+as+also+of+entertaining+a+visible+intercourse+with+Him.+This+therefore+He+calls+for%2C+and+requires+indispensibly+of+all+that+draw+nigh+to+Him%2C+and+that+because+He+is+the+Lord+our+God%2C+Rev.+14%3A6-7%3B+Mt.+4%3A10%3B+Dt.+10%3A12-13.+For+his+observance+hereof+does+He+so+approve+of+Abraham%2C+Gen.+18%3A19%2C+and+sets+it+down+as+an+everlasting+Law+unto+all+others+that+in+a+holy+observation+thereof+He+will+be+sanctified+in+all+that+draw+nigh+unto+Him%2C+Lev.+10%3A1-3.+His+commands+also+concerning+it+are+multiplyed+in+the+Scripture%2C+with+the+approbation+of+all+those+that+attend+unto+them.+We+may+not+think+to+find+acceptance+with+God+or+to+inherit+the+promises%2C+if+supposing+ourselves+to+adhere+unto+Him+in+worship+internal+and+natural%2C+we+neglect+that+which+is+external+and+of+his+free+appointment%3A+for+besides%2C+that+we+renounce+thereby+our+inward+dependance+on+Him+also+in+not+observing+his+commands%2C+as+Adam+did+in+transgressing+an+institution%2C+we+become+wholly+useless+unto+all+the+ends+of+his+glory+in+the+world%2C+which+is+not+the+way+to+come+to+an+enjoyment+of+Him.+Neither+do+we+only+express+and+profess+our+inward+moral%2C+natural+worship+of+God+hereby%2C+by+which+means+it+becomes+the+principal+way+and+instrument+of+faith+and+trust+exerting+themselves+in+our+obedience%2C+but+also+it+is+a+most+effectual+help+and+assistance+unto+the+principle+of+that+natural+worship%2C+strengthening+the+habit+of+it%2C+and+exciting+it+unto+all+suitable+actings%2C+unto+its+increase+and+growth.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Brief+Instruction+in+the+Worship+of+God%2C+%E2%80%A6+%28London%3A+1667%29+%7C+Question+1%2C+pp.+2-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F26f022a668.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/26f022a668.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=but%20it%20%5Binstituted%20worship%5D%20concerns%20those,actings%2C%20unto%20its%20increase%20and%20growth&amp;text=but%20it%20%5Binstituted%20worship%5D%20concerns%20those%20outward%20ways&amp;text=all%20suitable%20actings%2C%20unto%20its%20increase%20and%20growth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…still I deny that they have been set over believers as legislators to prescribe a rule of life at their own hands, or bind the people committed to them to their decrees. When I say this, I mean that they are not at all entitled to insist that whatever they devise without authority from the Word of God shall be observed by the Church as matter of necessity. Since such power was unknown to the apostles, and was so often denied to the ministers of the Church by our Lord himself, I wonder how any have dared to usurp, and dare in the present day to defend it, without any precedent from the apostles, and against the manifest prohibition of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fe65e03a37" data-kw="">
<blockquote><p>4. Stephen [a deacon] did no more (Acts ch. 7) in his apology than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman who yet may not preach, 1 Cor. 14:34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165</span></figcaption>

— Samuel Rutherford, A Peaceable &amp; Temperate Plea… (London, 1642), p. 161">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+gives+us+occasion+to+speak+a+little+of+the+communion+with+other+men%E2%80%99s+sins%3A+We+partake+these+ways+of+the+Church%E2%80%99s+sins%E2%80%A6+5.+Those+that+do+not+rebuke+sin.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea%E2%80%A6+%28London%2C+1642%29%2C+p.+161&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf745d7f90.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af745d7f90.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=This%20gives%20us%20occasion%20to%20speak,Those%20that%20do%20not%20rebuke%20sin&amp;text=This%20gives%20us%20occasion%20to%20speak%20a%20little&amp;text=5.%20Those%20that%20do%20not%20rebuke%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7196856abe" data-kw="">
<blockquote><p>All the officers of the New Testament both ordinary and extraordinary are designed and distinguished by their names, or compellations, as apostles, evangelists, presbyters, deacons. The extraordinary and superior have upon good reason the names of the ordinary and inferior common unto them, as the apostles are called ‘elders’ (1 Pet. 5:1). But this is not reciprocal, for the ordinary and inferior are never called by the names of the extraordinary and superior: the deacon is not called an ‘elder,’ nor the pastor by the name of the ‘apostle’ or ‘evangelist’. It is true that Barnabas is called an ‘apostle’ (Acts 14:4, 14) because he was an apostle [messenger] of Christ as Paul was. Titus and others and Epaphroditus are only called ‘apostles’ or messengers of the Church (2 Cor. 8:23; Phil. 2:25). Whence it must follow that the office of a bishop is not an office superior to the office of a pastor, since the name ‘bishop’ is common to the pastor; and that the office of a bishop and the office of a pastor are not different, but one and the same office, since the names are altogether common in all the places of the New Testament (Acts 20:28; Phil 1:1; 1 Tim. 3:2; 1 Pet. 5:1), and the Syriac Interpreter has translated the one by the other (Tit. 1:7). What reason can there be, while the officers are distinguished by their names and the names of ‘bishop’ and ‘pastor’ are common, but that the office of the bishop and elder is one and the same office; the one name signifying, sapientiae maturitatem [a maturity of wisdom], and the other Industriam curae Pastoralis [the industry of the pastoral oversight], says Beda.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered</cite>, (1641), pp. 3-4</span></figcaption>

</figure><figure class="quote" id="q-ff60e40b66" data-kw="">
<blockquote><p>The minister of Christ must be as plain as Christ, as solemn as Christ, and as tender as Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @Tabletalk</cite>, Oct 25, 2020</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/pastors-and-teachers.html">Pastors and teachers</a></span><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>
<div class="actions"><button class="copy" data-copy="“The minister of Christ must be as plain as Christ, as solemn as Christ, and as tender as Christ.”

— W. G. T. Shedd, Quoted on X by @Tabletalk, Oct 25, 2020">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+minister+of+Christ+must+be+as+plain+as+Christ%2C+as+solemn+as+Christ%2C+and+as+tender+as+Christ.%E2%80%9D%0A%0A%E2%80%94+W.+G.+T.+Shedd%2C+Quoted+on+X+by+%40Tabletalk%2C+Oct+25%2C+2020&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff60e40b66.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff60e40b66.html">Permalink</a><a class="src" href="https://x.com/Tabletalk/status/1320485354135314433" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-c9aad96bec" data-kw="">
<blockquote><p>2. By ‘ministry’, called [Greek]… thereby generally are understood such offices as concerned the discipline of the Church: specially conversant about the body and temporal things, either to relieve their poverty, which was the office of deacons in the distribution of alms, or to cherish them in sickness, which was the charge of widows, whose office St. Paul describes, 1 Tim. 5, or to watch over their manners, which belonged unto the spiritual governors. … 6. ‘He that shows mercy’. 1. Some do understand this generally of all Christians, that they should give chearfully: as Chrysostom will have it the same with that precept, 2 Cor. 9:7, ‘he that soweth sparingly, shall reap sparingly:’ Theodoret, Haymo: but the apostle here speaks of the special offices of the Church. … 5. But their opinion is rather here to be approved which in the first place take the office of deacons to be described, such as were elected by the apostles, Acts 6, and here the office of such, as were assigned to have a care of strangers, exiles, the sick, such were the widows, whom St. Paul would not have chosen under 60 years, 1 Tim. 5. Thus Calvin, Beza, Martyr, Gualter, Faius, Pareus, with others. Now this showing of mercy: …3. such special works of mercy then are here understood, which belonged to the curing and attending upon the sick, aged, impotent, strangers, exiles, orphans, Pareus. 4. ‘with chearefulnes of heart’, gentleness in words, pleasantness of countenance: for all those are signified by hilarity or cheerfulness, Tolet: so Chrysostom… 3. again, such as were employed in these services, as old men and widows, are naturally given to morosity, and therefore they have need of this precept to dispose themselves to cheerfulness, Pareus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … (Cambridge, 1611), Biblical Exegesis, ch. 12, 3. ‘The Questions &amp; Doubts Discussed’, 16th Question, ‘Of these several offices here rehearsed by the apostle in particular’, pp. 546 &amp; 548-9 on Rom., 12:7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

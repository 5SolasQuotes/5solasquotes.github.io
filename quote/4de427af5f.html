<main class="wrap"><figure class="quote" id="q-4de427af5f" data-kw="">
<blockquote><p>…I do hereby grant and declare, that no person or persons, inhabiting in this province or territories, who shall confess and acknowledge One almighty God, the Creator, Upholder and Ruler of the World; and profess him or themselves obliged to live quietly under the civil government, shall be in any case molested or prejudiced, in his person or estate, because of his or their conscientious persuasion or practice… And all persons who also profess to believe in Jesus Christ, the Savior of the World, shall be capable (notwithstanding their other persuasions and practices in point of conscience and religion) to serve this government in any capacity, both legislatively and executively…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pennsylvania.html">William Penn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charter of Privileges Granted by William Penn to the Inhabitants of Pennsylvania and Territories</cite>, 1701 (Thorpe, 5.3077)</span></figcaption>

</figure><figure class="quote" id="q-dfcdf3c447" data-kw="">
<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Magistracy in an Exposition of the 82nd Psalm</cite>, pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-6241d380bd" data-kw="">
<blockquote><p>…and if the Church should tell the Magistrate his duty, as watchmen should do to all under their care, Eze. 3:16-19, Magistrate or other[wise]; if the Magistrate spare the life of a murderer, the watchmen are unfaithful if they complain not openly and tell the Magistrate he does not his duty; and upon the same ground, if the Magistrate must coerce with the sword seducing wolves and Jezebels, the pastors ought to admonish him. And it’s atheistic to say [that] the ‘Magistrate is conscious of sins against manners, and of his duty and obligation he needs no instigation.’ Because no Magistrate, be he an Ahab or a David, but he needs be quickened to his duty; and will send a murderer away, and a bloody Joab whom God will have not to live; and should the prophets be called instigatores [instigators] and savientes per alios [those raging through others], such as destroy men’s lives, when they tell the Magistrate [that] he is a murderer and guilty of innocent blood if he suffer the bloody man to live? Or should this be called tale-telling and the pastor thrusting of himself into a more disaffecting office to be a tale-teller, an apparitor [servant of a public official] or summoner of men to the civil Magistrate’s court, [in that] he made such a poor man be fined, and wife and children be starved because he is not of his opinion? [This is an absurd charge.] …Such a man of our [pastoral] charge [if he did not so complain of false teachers to the magistrate] is damned by his own conscience and devours the flock, as Arius [an early Church heresiarch] and Manes [of the Manicheans] did; such a one is a bloody murderer, a sorcerer; the Magistrate bears the sword to execute vengeance on evil doers, and yet [contrary to this, he] suffer[s] known murderers to live and be gray-haired: Are ministers, who are to warn fathers, teachers, masters, judges, kings, Jer. 1:10, nations and kingdoms of their duty, ‘thrusters of themselves into a disaffecting office, and apparitors and summoners of men before civil courts’ because they warn the Magistrate of his duty? Is this obtruding into another office to give warning to all to be free of the blood of all men? [Eze. 33:8-9] This is like the speech of a wicked King Amaziah, 2 Chron. 25:16, to the prophet who rebuked him, for seeking after the gods of the nations: ‘Art thou made of the king’s counsel? Forbear, why shouldest thou be smitten?’ I therefore summon this [Libertine] author to compeer [appear] before the Judge of the world, and give an account of this doctrine, for he speaks it against the faithful servants of God of the Church of Scotland, who complained to the king of idolatrous seducers and seminary priests and Jesuits, of bloody murderers, of grinders of the faces of the poor and incorrigible, scandalous offenders, whose wretched example was a shame to the gospel and brought guilt upon the land, that he might use the sword against such evil doers? And should ministers be apparitors and tale-tellers either against such as deserve capital punishment for sins against the Second Table as well as against the First Table? Woe will be to him that calls good evil and evil good. Is the necessary duty of the calling of a watchman to warn the Magistrate of his bloody omissions, for so the Lord calls it (Isa. 1.21-22; 3:12-15; Prov. 29:7; 31:8) and exhorts to it, an overdoing? and a tale-bearing?</p></blockquote>

t+Pretended+Liberty+of+Conscience%E2%80%A6+%281649%29%2C+ch.+3%2C+%E2%80%98The+Church+May+Complain+of+Heretics+%5Bto+the+Magistrate%5D%E2%80%99%2C+pp.+43-45&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6241d380bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6241d380bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/how-far-the-church-may-speak-to-civil-issues/#:~:text=and%20if%20the%20Church%20should%20tell,it%2C%20an%20overdoing%3F%20and%20a%20tale%2Dbearing&amp;text=and%20if%20the%20Church%20should%20tell%20the%20Magistrate&amp;text=exhorts%20to%20it%2C%20an%20overdoing%3F%20and%20a%20tale%2Dbearing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called [to the Savoy Conference] by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XI. They spake not against episcopacy, as it is a presidency among and over presbyters differing in degree, and not in office, called ‘order’, and that in a Church of the lowest species. …

XIII. They said nothing against metropolitans, patriarchs, lay-chancellors, commissaries, officials, surrogates, archdeacons, etc. as officers of the king, appointed to do nothing (besides the sacred ministry if they be clergymen) but what belongs to magistracy [according to circa sara].

XIV. They said nothing against any promise of obedience to them only in the capacities and in the exercise of the power forementioned.

XV. Much less did they ever oppose or question swearing to the king, according to the oaths of Allegiance and Supremacy: And I with diverse others also being (for some ends) entered as his chaplains in ordinary, took also that Oath of Fidelity which the king’s household servants take. XVI. We never were for any dishonoring of kings by public excommunications, much less by subjects or foreigners, whom kings never choose to be their pastors; but only in case of necessity, for such a denial of sacramental communion to them, as Bishop Andrewes in Tortura Torti and Bishop Bilson [The True Difference between Christian Subjection &amp; Unchristian Rebellion, pt. 3, pp. 376-77] plead for, which is but to forbear ourselves a sinful act. XVII. We never pleaded for any elders’ (or chancellors’) power of the keys, who are but laymen. XVIII. We never held that magistrates are bound to add their force by the sword to the censures of the Church as such, and to punish men more because the Church has by excommunication cast them out, or because they are not reconciled. XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

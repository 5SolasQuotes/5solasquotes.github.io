<main class="wrap"><figure class="quote" id="q-466404936c" data-kw="">
<blockquote><p>It appears, therefore, what the mode is by which the first cause moves and determines the secondary cause, without necessity and with the freedom of the secondary cause entirely unimpaired — through that priority of nature of the concurrence as it is from God as first cause, subordinating to itself in the very operation the secondary cause, and retaining by priority of nature its dignity in causing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View</cite>, p. 410</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b496daf9c" data-kw="Author of sin">
<blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Absolute Predestination</cite>, tr. Augustus Toplady, on the omnipotence of God</span></figcaption>

</figure><figure class="quote" id="q-78f1af44c6" data-kw="">
<blockquote><p>First: how God is not a cause when He permits. For if God were to give his efficacious grace to the will, it would not sin. I respond that this doubt is common to all and looks elsewhere. Briefly, however, I say that for us, who hold every sin to be an effect of reprobation [this is hard language which the Reformed often spoke against]… the response is at hand: namely, that God is not bound to exhibit efficacious grace, since through original sin its privation has been incurred [the Reformed agree with this]; and therefore the permission is just. [The Reformed generally disagree:] He does give sufficient grace, with which man can and without which he cannot avoid sin. And in that permission God foresees that the man will sin, as we have often taught with Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Difference with the Reformed</cite>, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

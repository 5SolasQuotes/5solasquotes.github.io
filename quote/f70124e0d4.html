<main class="wrap"><figure class="quote" id="q-f70124e0d4" data-kw="">
<blockquote><p>There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684), section 18, p. 205</span></figcaption>

</figure><figure class="quote" id="q-926b5fe04f" data-kw="">
<blockquote><p>First, that God offers to the men of this world, helps and means, either of the knowledge of God in Nature, or of grace in Christ: and that to this end, to lead them to repentance and salvation… Thus God offered to the carnal Israelites means of grace to purge them, to turn them, Prov. 1:13, to gather them, Mt. 23:37, to convince them, Jn. 16:8-9, to draw them with cords of man and bands of love, Hos. 11:4, to dress them to bring forth good fruit, Isa. 5:4. Secondly, that the means God uses for these good ends are in some measure sufficient (if they be not hindered by men) to bring them to the attainment of these ends: for when God says Himself, He uses these means for these ends; for us to say, these means are not sufficient for these ends, seems to me to derogate from the wisdom and sufficiency of God, whose works are all of them perfect, Deut. 32:4, and so sufficient for the ends for which He wrought them. Yet God forbid I should doubt of that which our Savior tells the Jews, ‘No man can come to Christ, except the Father draw him,’ Jn. 6:44, by the same almighty power and authority whereby He sent Christ into the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, ... (London, 1646), 5th Doubt, Question 5, pp. 207-8</span></figcaption>

</figure><figure class="quote" id="q-a4670b4bbd" data-kw="">
<blockquote><p>…the last place, 2 Chron. 29, out of which no more can be drawn but that the people worshipped whiles the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, (though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4; p. 72</span></figcaption>

<blockquote><p>3. When king Josiah made a solemn covenant (the effect whereof was a thorough reformation, the taking away of the ancient and long-continued high places, the destroying of Baal’s vessels, altars, priests, &amp;c. 2 Kings xxiii., throughout), he did not leave his covenant arbitrary; but “he caused all that were present in Jerusalem and Benjamin to stand to it,” 2 Chron. xxxiv. 32. In all which he is set forth as a precedent to Christian reformers, that they may know their duty in like cases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, (1649; Edinburgh: Robert Ogle and Oliver and Boyd, 1846), p. 86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c42b46fc70" data-kw="">
<blockquote><p>The officers that rule the world in God’s stead, as father mother, master, husband, lord and prince, are honoured, when the law, which Almighty God has committed unto them to rule with, is obeyed. Thy neighbour that is out of office is honored, when thou (as God has commanded thee) lovest Him as thyself, countest him as good as thyself, thinkest him as worthy of any thing as thyself, and comest lovingly to help him at all his need, as thou wouldest be holp thyself; because God hath made him like unto his own image, as well as thee, and Christ hath bought him as well as thee. If I hate the law, so I break it in mine heart; and both hate and dishonour God, the maker thereof. If I break it outwardly, then I dishonour God before the world, and the officer that ministers it. If I hurt my neighbour, then I dishonor my neighbor and Him that made him, and him also that bought him with his blood… If I be not ready to help my neighbor at his need, so I take his due honour from him, and dishonour him, and him that made him, and Him also that bought him with his blood, whose servant he is… In like manner, if the officer, abusing his power, compel the subject to do that which God forbiddeth, or to leave undone that which God commandeth, so he dishonoureth God in withdrawing his servant from him, and maketh an idol of his own lusts, in that he honoureth them above God; and he dishonoureth his brother in that he abuseth him, contrary unto the right use which God hath created him for, and Christ hath bought him for, which is to wait on God’s commandments. For if the officer be otherwise minded than this, the worst of these subjects is made by the hands of Him that made me, and bought with the blood of Him that bought me, and therefore, my brother; and I but his servant only, to defend him, and to keep him in the honour that God and Christ has set him, that no man dishonors him: he dishonours both God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57</span></figcaption>

<blockquote><p>Magistrates are likewise bound to suppress all idolatry and false worship within the limits of their jurisdiction. Idolatry being a superstitious worship given to an improper object, is expressly forbidden in the law of God. “Thou shalt have no other gods before me.” “Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth: Thou shalt not bow down thyself to them, nor serve them.” (Exod. xx. 3, 4, 5.)

In conformity with the spirit of these prohibitions, a witch, of old, was not to be suffered to live; because, pretending to supernatural power, she attempted to withdraw men’s dependence from God, the Creator and Possessor of heaven and earth, who worketh all things according to the counsel of his own will.

As the sin of idolatry is hurtful to the souls of men, it must also be ruinous to the kingdoms and states. If Christians be solemnly warned to “flee from idolatry,” (1 Cor. x. 14,) it must then be the duty of the civil magistrate to remove the temptation, as did reforming kings in the ancient dispensation. “And he (Hezekiah) did that which was right in the sight of the Lord, according to all that David his father did. He removed the high places, and brake the images, and cut down the groves, and brake in pieces the brazen serpent that Moses had made; for unto these days, the children of Israel did burn incense to it; and he called it Nehustan,” (a piece of brass, so named by was of derision.) (2 Kings xviii. 4.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-belfast-covenanter.html">The Belfast Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dissertation on Romans xiii. 1-6. ( Continued from page</cite></span></figcaption>

<blockquote><p>…for if Jeremiah, from the Lord, had not commanded expressly that both the king and kingdom of Judah should submit to the king of Babylon and serve him, and pray for him, as their lawful king, it had been as lawful for them to rebel against that tyrant as it was for them to fight against the Philistines and the king of Ammon;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 40</span></figcaption>

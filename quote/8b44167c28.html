<main class="wrap"><figure class="quote" id="q-8b44167c28" data-kw="">
<blockquote><p>‘Cut off’; By capital punishment by the magistrate, if the fact be notorious; by excommunication if the delinquent be out of the reach of him; or by the judgement of God, if the fact be secret, Ex. 31:14; Lev. 17:4; 18:29. Now this is not to be understood of children, but of those who by their age were capable of voluntary rebellion, refusing, or contemning the use of this sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-diodati.html">John Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pious Annotations on Gen. 17</cite>, verse 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-ad60a76b03" data-kw="">
<blockquote><p>What fruit or profit cometh of the baptizing of infants? It serveth for the parents’ comfort, for the sign being committed to the child (as by a printed seal) doth confirm the promise made to the godly parent: that the Lord, will be a God, not to him only, but to his seed also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion</cite>, trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’, p. 737</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-7516cb2aa2" data-kw="">
<blockquote><p>Those who are to be admitted to this sacrament must be found to have a competent knowledge of the fundamentals of the Christian religion, and to be of such an inoffensive walk and conversation, both towards God and their neighbors, that they are not known to be guilty of any scandal that merits church-censure. By the 12th chapter of the French Church Discipline, article 2, persons shall not be admitted to the Lord’s Supper till they be above twelve years of age. But I am sure, if children at nine years of age can express themselves piously and knowingly, showing that they have the grace signified and promised, the seal of the promise cannot warrantably be denied unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland</cite>, … (Edinburgh, 1770), bk. 2, Title 4, ‘Of the Lord’s Supper’, section 2, p. 97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<main class="wrap"><figure class="quote" id="q-d69ee4f244" data-kw="">
<blockquote><p>That the obligations to faith and obedience are personal. Every man is responsible for his religious faith and his moral conduct. He cannot transfer that responsibility to others; nor can others assume it in his stead. He must answer for himself; and if he must answer for himself, he must judge for himself. It will not avail him in the day of judgment to say that his parents or his Church taught him wrong. He should have listened to God, and obeyed Him rather than men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/reading-by-the-laity.html">Reading by the laity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/the-church/churchs-authority-and-power.html">Church&#x27;s Authority and Power</a> › <a href="../topics/the-church/churchs-authority-and-power/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-5b92934789" data-kw="">
<blockquote><p>Although we allow to individual believers the judgment of private discretion (because &quot;he that is spiritual judgeth all things&quot; [1 Cor. 2:15], and the apostle commands us to &quot;prove all things&quot; [1 Thess. 5:21]), we do not therefore assert in opposition to Peter (2 Pet. 1:20*) that the Scriptures are of private interpretation (idia epilysis). For epilysis here does not mean the interpretation of the Scriptures so much as the origin of the prophetic oracles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.33</span></figcaption>

</figure><figure class="quote" id="q-c78882c4a3" data-kw="">
<blockquote><p>If men abuse the Scriptures, this does not happen per se, but accidentally from the perversity of those who wrongfully wrest them to their own destruction. Otherwise (if on account of the abuse the use should be prohibited), the Scriptures ought to be taken away not only from the laity, but also from the teachers who abuse them far more. For heresies usually arise not from the common people and the unlearned, but from ecclesiastics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.18.5</span></figcaption>

</figure><figure class="quote" id="q-a067c1d621" data-kw="">
<blockquote><p>When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, Of the Fathers of the Church, DXIX, p. 297</span></figcaption>

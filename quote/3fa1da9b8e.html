<main class="wrap"><figure class="quote" id="q-3fa1da9b8e" data-kw="">
<blockquote><p>Observe that man of Sin or Antichrist, although singularly, and Emphatically, and as it were, personally pointed at, is not notwithstanding to be understood as terminated in any one individual person whatsoever; but as those many Antichrists make up that wicked society of Apostate Heretics, of what kind soever; so is this great Antichrist.

A chief of this great Apostacy, but as one in succession, though diverse in persons, so it is said of the Pope and Papacy That as to the place and office of the Papacy, all Popes from first to last, are but as one Pope, so when they say, the Pope is head of the Church, that is not intended of any one Pope alone, but of any and all in that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jones.html">Henry Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of antichrist preached at Christ-Church, Dublin, Novemb. 12, 1676. By the Right Reverend Father in God, HENRY, Lord Bishop of MEATH.</cite>, (2nd edn, London: Nathaniel Ponder, 1679), p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Observe that man of Sin or Antichrist, although singularly, and Emphatically, and as it were, personally pointed at, is not notwithstanding to be understood as terminated in any one individual person whatsoever; but as those many Antichrists make up that wicked society of Apostate Heretics, of what kind soever; so is this great Antichrist.

A chief of this great Apostacy, but as one in succession, though diverse in persons, so it is said of the Pope and Papacy That as to the place and office of the Papacy, all Popes from first to last, are but as one Pope, so when they say, the Pope is head of the Church, that is not intended of any one Pope alone, but of any and all in that succession.”

— Henry Jones, A sermon of antichrist preached at Christ-Church, Dublin, Novemb. 12, 1676. By the Right Reverend Father in God, HENRY, Lord Bishop of MEATH., (2nd edn, London: Nathaniel Ponder, 1679), p. 4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObserve+that+man+of+Sin+or+Antichrist%2C+although+singularly%2C+and+Emphatically%2C+and+as+it+were%2C+personally+pointed+at%2C+is+not+notwithstanding+to+be+understood+as+terminated+in+any+one+individual+person+whatsoever%3B+but+as+those+many+Antichrists+make+up+that+wicked+society+of+Apostate+Heretics%2C+of+what+kind+soever%3B+so+is+this+great+Antichrist.%0A%0AA+chief+of+this+great+Apostacy%2C+but+as+one+in+succession%2C+though+diverse+in+persons%2C+so+it+is+said+of+the+Pope+and+Papacy+That+as+to+the+place+and+office+of+the+Papacy%2C+all+Popes+from+first+to+last%2C+are+but+as+one+Pope%2C+so+when+they+say%2C+the+Pope+is+head+of+the+Church%2C+that+is+not+intended+of+any+one+Pope+alone%2C+but+of+any+and+all+in+that+succession.%E2%80%9D%0A%0A%E2%80%94+Henry+Jones%2C+A+sermon+of+antichrist+preached+at+Christ-Church%2C+Dublin%2C+Novemb.+12%2C+1676.+By+the+Right+Reverend+Father+in+God%2C+HENRY%2C+Lord+Bishop+of+MEATH.%2C+%282nd+edn%2C+London%3A+Nathaniel+Ponder%2C+1679%29%2C+p.+4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3fa1da9b8e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3fa1da9b8e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/19/henry-jones-the-antichrist-is-not-one-person/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d5433d3936" data-kw="">
<blockquote><p>Yea, we doubt not to prove the kingdom of the pope to be the kingdom and power of Antichrist. And therefore, my Lords, I cannot cease in the name of Christ Jesus to require of you that the matter may come in examination, and that ye, the estates of the realm, by your authority compel such as will be called bishops not only to desist from their cruel murdering of such as do study to promote God’s glory in detecting and disclosing the damnable impiety of that man of sin, the Roman Antichrist, but also that ye compel them to answer to such crimes as shall be laid to their charge for not righteously instructing the flock committed to their cares.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The appellation of John Knox from the cruel and most injust sentence pronounced against him by the false bishops and clergy of Scotland, with his supplication and exhortation to the nobility, estates and commonality of the same realm</cite>, (Geneva, 1558) in idem, On rebellion, ed. R. A. Mason (Cambridge, 1994), p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Yea, we doubt not to prove the kingdom of the pope to be the kingdom and power of Antichrist. And therefore, my Lords, I cannot cease in the name of Christ Jesus to require of you that the matter may come in examination, and that ye, the estates of the realm, by your authority compel such as will be called bishops not only to desist from their cruel murdering of such as do study to promote God’s glory in detecting and disclosing the damnable impiety of that man of sin, the Roman Antichrist, but also that ye compel them to answer to such crimes as shall be laid to their charge for not righteously instructing the flock committed to their cares.”

</figure><figure class="quote" id="q-49003e754d" data-kw="">
<blockquote><p>Certain it is that many popes have been notorious heretics, as Liberius and Felix, who were Arians; Honorius, a Monothelite; and John XXIII, who denied the immortality of the soul. In the papal see, several schisms have been, and divers times many popes together, excommunicating one another and reciprocally calling one another Antichrist; and of those Antichrists, the worst commonly overcame. So according to the very canons of the Roman Church, factions and corruptions in the creation of the popes have several times made their election void and therefore have broken the thread of that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, bk. 1, ch. 32</span></figcaption>

</figure><figure class="quote" id="q-75e42e09a6" data-kw="Primacy of Peter">

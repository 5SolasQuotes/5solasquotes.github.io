<blockquote><p>Divine worship is that which is performed in acknowledgement of Deity, or any divine excellency, in that to whom it is performed. This is due to God alone.</p></blockquote>

<blockquote><p>Answer [Bishop Sydserff]: How define ye worship? Opponent [Rutherford]: An act of man whereby God is immediately honored. Answer: Say also according to God’s command. Opponent: I will not say, when I define worship in general. If I should define lawful worship I would add this–that it be according to God’s command. I remit to your learning to think: If one thing can give nature both to genus and to species, you know good logic speaks against this. God’s command cannot but give being to worship and to this particular worship, to wit, to lawful worship; and [in] this [your] way I might say [that] idolatry, sacrificing to Satan as Indians do, slaying of children to Moloch, etc. shall not be false worship except they be urged as commanded of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Samuel Rutherford &amp; Thomas Sydserff, Bishop of Galloway, ‘An Discussing of Some Arguments Against Canons &amp; Ceremonies in God’s Worship’ 1636′ in Religious Controversy in Scotland, 1625-1639 ed. David G. Mullan in Scottish History Society, Fifth Series, vol 11 (Edinburgh: Scottish Historical Society, 1998)</cite>, p. 98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

0How%20define%20ye,be%20urged%20as%20commanded%20of%20God&amp;text=Answer%20%5BBishop%20Sydserff%5D%3A%20How%20define%20ye%20worship%3F%20Opponent&amp;text=except%20they%20be%20urged%20as%20commanded%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-81a5f538ea" data-kw="">
<blockquote><p>Worship is an homage performed to God immediately, in consideration of his excellency. This is Aquinas’s, and other of the schoolmens’ notion about worship, and it is a very good one.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-5510b393e4" data-kw="">
<blockquote><p>‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/shola-lee.html">Shola Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”You’re sold a lie’: How do you spot a cult’ (2025) at BBC.com</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-08672052eb" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration. Uncovering the head seems to be little older than Paul’s epistles to the Corinthians. The learned [Claudius] Salmasius [d. 1653, a French reformed classical scholar], thinks it but a national sign of honor, no ways universally received: But certainly it is not adoration: Though therefore we [men] receive the Supper of the Lord uncovered, no man can conclude from thence adoration of the elements, as we do from kneeling [before the Supper] conclude the same, as we shall [conclude] here for all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly either of God, or of these means: It is lawful to tremble at the Word, and for Josiah to weep before the book of the Law read, and for the martyrs to kiss the stake, as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (London, 1646)</cite>, pp. 89-90</span></figcaption>

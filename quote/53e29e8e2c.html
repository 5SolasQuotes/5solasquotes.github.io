<main class="wrap"><figure class="quote" id="q-53e29e8e2c" data-kw="">
<blockquote><p>The will of God,¹ as to all things, must always be fulfilled, – because as the Almighty can do everything possible, so, when the divine will is determined for positing something in being with final determination, it will be; but to will that with will of being well-pleased is to will it with the last determination that can be posited on the part of the omnipotent will willing the effect into being; therefore, in respect of whatever effect God is thus willing, it will be. ¹ The Vatican editors say this is against Scotus’ doctrine, and they refer to Rep. IA d. 46 nn. 17-18, 12-14, and to nn. 7-8 here below. … 7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation. 8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ordinatio</cite>, bk. 1, dist. 26-48 tr. Peter Simpson (2013 / 2023), dist. 46, Whether God’s Will of Good-Pleasure is always fulfilled? II. To the Principal Arguments, p. 197</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e1a300346" data-kw="">
<blockquote><p>And we consider an antecedent-will in God, and that antecedent will is before all; for by that will, God would have all men saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-donne.html">John Donne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Sermons. The Second Volume Preached</cite>, … (d. 1631; London: Flesher, 1649), Sermon 26, on Isa. 65:20 Donne</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“And we consider an antecedent-will in God, and that antecedent will is before all; for by that will, God would have all men saved.”

— John Donne, Fifty Sermons. The Second Volume Preached… (d. 1631; London: Flesher, 1649), Sermon 26, on Isa. 65:20 Donne">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+we+consider+an+antecedent-will+in+God%2C+and+that+antecedent+will+is+before+all%3B+for+by+that+will%2C+God+would+have+all+men+saved.%E2%80%9D%0A%0A%E2%80%94+John+Donne%2C+Fifty+Sermons.+The+Second+Volume+Preached%E2%80%A6+%28d.+1631%3B+London%3A+Flesher%2C+1649%29%2C+Sermon+26%2C+on+Isa.+65%3A20+Donne&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e1a300346.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e1a300346.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=And%20we%20consider%20an%20antecedent%2Dwill%20in,God%20would%20have%20all%20men%20saved&amp;text=And%20we%20consider%20an%20antecedent%2Dwill%20in%20God%2C%20and&amp;text=that%20will%2C%20God%20would%20have%20all%20men%20saved" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a1212302c" data-kw="">
<blockquote><p>Surely it is easy to observe that we are too fearful of some distinctions which carry in them a jealousy of former abuse and yet both may well be admitted in a good sense and serve for excellent purpose. As that (if we labor for our better understanding to explicate the one will of God by several notions of the antecedent and consequent will of God, which Paulus Ferrius, a reformed schoolman, approves by the suffrages of Zanchi, Polanus and other orthodox divines, to look at it a little running, as that which gives no small light to the business in hand. As there is wont to be conceived a double knowledge of God, the one of mere understanding whereby He foreknows all things that may be; the other of vision, or approbation, whereby he foreknows that which undoubtedly shall be, so there is a double will to be conceived of God answerable to this double knowledge: an antecedent will, which answers to the mere understanding whereby God wills every possible good without the consideration of the adjuncts appertaining to it; a consequent will answering to the knowledge of approbation, whereby (all circumstances prepensed) God does simply will this or that particular event as simply good to be and which is there upon impossible not to be. The one of these is a will of complacency, the other of prosecution; the one is as it were an optative will, the other an absolute. In the first of these God would have all to be saved because it is in a sort good in itself, in that the nature of man is ordainable to life and man has by God common helps seriously offered for the attaining thereof; neither can we think it other than pleasing to God that his creatures should both do well and fare well. In the latter He wills some of all to be saved, as not finding it simply good (all circumstances considered) to extend this favor to all; this appears in the effect, for if God absolutely willed it, it could not fail of being, neither does ought hinder, but these two may stand well together, a complacence in the blessedness of his creature and a will of his smart. For both that which we will in one regard, we may not will in another, as we may wish a felon to live as a man, to die as a malefactor; and besides, the possibility of one opposite does not hinder the act of another, as he that has power to run perhaps does sit or lie. Learned Zanchi methinks gives at once a good satisfaction as to this doubt (Of the Nature of God, 1.3, ch. 4); so to the ordinary exception whereat many have stumbled, of the pretended mockage of God’s invitations, where He means not, as some have misconceived, a serious effect. In the parable of the Gospel (says he) those which were first bidden to the marriage feast and came not, were they therefore mocked by the king because he only signified unto them what would be acceptable unto him and what was their duty to perform? and yet he did not command them to be compelled as he did the second guests to come to the wedding? Surely no, yet in the mean time, there was not the same will of the king in the inviting of the first and of the second, for in these second there was an absolute will of the king, that they should without fail come; and therefore he effectually caused them to come. In the former he only signified, and that fairly and ingenuously, what would be pleasing to him: Thus he. The entertainment of this one distinction, which has the allowance of orthodox and learned authors to be free from any danger or inconvenience, would mitigate this strife since it is that which the opponents contend for, which the defendents may yield without any sensible prejudice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (London: Cadwell, 1660), Via Media: the Way of Peace in the Five Busy Articles commonly known by the name of Arminius, Of the Fifth Article of Perseverance, pp. 376-78</span></figcaption>

<blockquote><p>359. XI. The next distinction of God’s will is into effectual and uneffectual. And here he that would see a great deal said on the question, Whether God have any uneffectual will, and whether man’s will can frustrate it, may see too much in a multitude of Schoolmen on [Lombard] Sentences, dist. 1, quest. 45 &amp; 46.¹ ¹ Aquinas, art. 1; Scotus, quest. unica; Durandus, quest. 1; Bonaventura, art. 1; Gregory Ariminiensis, quest. unica, art. 3; Pennot. bk. 4, ch. 22; Alvarez, De Auxiliis, disp. 32; Ruiz, De Voluntate, disp. 18; Granada, Of the Will of God, tract. 4, disp. 3; Suarez, bk. 4, Of Predestination, ch. 8; Gregory Valencia, disp. 1, quest. 19, p. 6; Cajetan; Nazar. Ban. Zum. Navar. Gonzal. Molina; Vasquez, etc. in [Aquinas, Summa] pt. 1, quest. 19, art. 6; Ripa. Arrub. Fasol. ibid.; Nic. D’Orbel., pt. 1, dist. 46 and many other Scotists, etc. Some answer (as D’Orbellis, etc.) that the voluntas beneplaciti [will of good-pleasure] is ever effectual, but not the voluntas signi; which yet seeing he well explains to be only the making of duty, he might well have said is still effectual to its proper primary effect. Gregory Ariminiensis (and many others) distinguish of the will of complacency and displicency, and that prosecutionis et fugae; and say the latter is effectual and not the former: which others say of the absolute will as distinct from the conditional. The plain truth I have oft opened before: God’s will is the first efficient, the chief dirigent and the final cause (in which the three principles, power, wisdom and goodness are eminent). 1. His efficient will is ever effectual and never frustrated. ‘Whatsoever pleased the Lord (to do) that He did in heaven and in earth, in the sea and in the depths.’ Ps. 135:6. ‘And who has resisted (this) his will?’ Rom. 9:19. 2. His directing will is ever effectual as to the making of the Law or rule, and of due or right thereby: For so far it is efficient of that effect: But it is too oft violated by our sin. 3. His final will or complacency, is God’s being pleased with the being, or action, or relation of the creature, and supposing it, [it] is not efficient [because it is an end, final goal], and therefore [it is] not effectual. And I know no need of more upon this question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology</cite>, ... (London: White, 1675), pt. 1, sect. 14, Of Several Distinctions of God’s Will, p. 56</span></figcaption>

<blockquote><p>XIX. Although God may be said to will the salvation of all by the will of sign [the revealed will] and to nill it by the beneplacit will [of decree], yet there is no contradiction here. Besides the fact that the universal proposition is to be understood not so much of the singulars of the genera as of the genera of the singulars, the former will relates to the mere approbation of God and the command of duty, while the latter is concerned with its futurition and fulfillment. The former denotes what is pleasing to God and what He has determined to enjoin upon man for the obtainment of salvation, but the latter what God Himself has decreed to do. But these two are not at variance: to will (i.e., to command man to believe) and to nill (i.e., to decree not to give him faith in order that he may believe)… XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, p. 224</span></figcaption>

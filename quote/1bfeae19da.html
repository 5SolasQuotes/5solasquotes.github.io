<main class="wrap"><figure class="quote" id="q-1bfeae19da" data-kw="">
<blockquote><p>And first, just as all by most holy Baptism have been made members of Christ’s Kingdom and then received the covenant of eternal salvation, [1] so Your Royal Majesty will make a law that orders parents to educate and establish their children in Christ’s faith and obedience with great care, with a just penalty appointed for those who themselves infect their children with either false doctrine or bad morals or permit them to be infected by others. [2] Next, it must provide that they diligently make the Church’s catechism known to them when they are old enough to understand it. For unless the foundation of the Church is firmly laid in early childhood through the catechism of Christ, its upbuilding will proceed very poorly from then on. For those who do not labour with utmost zeal to instruct and train those whom they have consecrated to Christ the Lord in Baptism expose themselves to dire retribution. For those who neglect this when it is in their control snatch back the children whom they have consecrated to the Lord and hand them over to the dominion of Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 280.</span></figcaption>

<blockquote><p>To whatever business anyone is devoted, it may be expected that his perfection in it shall be answerable to the time he has had to learn and perfect himself. Christians should not always remain babes, but should grow in Christian knowledge; and leaving the food of babes, which is milk, should learn to digest strong meat.

Doctrine. Every Christian should make a business of endeavouring to grow in knowledge in divinity.

This is indeed esteemed the business of divines and ministers: it is commonly thought to be their work, by the study of the Scriptures, and other instructive books, to gain knowledge; and most seem to think that it may be left to them, as what belongeth not to others. But if the Apostle had entertained this notion, he would never have blamed the Christian Hebrews for not having acquired knowledge enough to be teachers: or if he had thought that this concerned Christians in general only as a thing by the bye, and that their time should not in a considerable measure be taken up with this business, he never would have so much blamed them, that their proficiency in knowledge had not been answerable to the time which they had had to learn.</p></blockquote>

rmed Books Online</a></div>
</figure><figure class="quote" id="q-9b3d39ed78" data-kw="">
<blockquote><p>Undoubtedly ζητήσεις μωραὶ καὶ ἀπαίδευτοι, foolish questions as well as those that are ignorant or unlearned, greatly block the path to piety. The former concern matters that accomplish nothing for piety. The latter arise from ignorance of the doctrine of righteousness, arguments against the faith, or even το‹ς ἅ μὴ ἑωράκασιν ἐμβατεύουσιν (from those who take their stand) on what they have not seen, who have neither seen nor heard anything in the Word of God, but who habitually appear and rear up with profane feet. Therefore, κενοφωνίαι and λογομαχίαι, foolish talk and quarrels about words, greatly hinder edification. Indeed, into what sordid conditions men will fall, who understand neither Scripture nor its substance! With all their might they furnish obscure, new, erratic, and suspect ideas as ends for religion, reduce the faith to tragedy, or transform the words of God into dross as amid a fire, thereby weakening and emptying them.

Contrarily, those things necessary for piety include the thorough examination of the Word of God, comparison of spiritual matters with spiritual matters, demonstration of the truth that accords with piety, conscience, the foundation of religion and the ἀναλογίας τῆς πίστεως (analogy of faith)—the harmony and conformity of all that must be believed from the uniform witness of God through σύνεσιν (conscience) and ἐπίστασιν (care). Also necessary for piety is the serious examination and proper consideration of the weight of God’s Word, as well as the disciplined and careful comparison of the product of all these practices. The end of all this is to subject the mind to the divine witness and the ἀποδείξιν τοῦ Πνεύματος, demonstration of the Spirit.

The devil very much hates this greatest means of increasing and strengthening true religion and destroying wickedness. Therefore, he corrupts the minds of men, so that they do not give heed to sound doctrine and the force of Scripture. Although these men have the μόρφωσιν (form) and precise outline of piety, they deny it, with both παραδιατριβὰς (idle occupation) and leisure spent for gain. Instead, they pursue ἀντιθέσεις ψευδωνύμου γνώσεως, contradictions falsely called knowledge, preferring this account to the opinion of the πολυμαθείας (very learned), experience, and common sense. Full of zeal, these men multiply their wickedness in numerous schools and seminaries.

In contrast, when Scripture is taken as the standard, there is nothing that is a greater threat, is more insidious, opposes, and tears down ἐπισυναγωγα‹ς, congregations, more than τῶν σχολαζόντων τῇ μαθήσιν, those who lack devotion to the sacred truth. After that danger is the one in which students, in the face of the trials of this life, only have knowledge of the truth as it suits them to listen to or talk about it. These follies, which are inappropriate to those who are and are called brothers, must cause harm.

For this reason, those who have been appointed to the sacred ministry to shepherd the flocks by the consensus and recommendation of the church and called by the authority of the elders must devote themselves with more anxious care so that they are found diligent and active not only in the explanation and presentation of the main points of doctrine but also in discussions about the mystery of piety according to its revelation in the Scriptures, together with the refutation of errors and restraint of corruptions, fruitless questions, and unhelpful assertions about the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Doctrinæ de Fœdere et Testamento Dei: The Doctrine of the Covenant and Testament of God</cite>, trans. Casey Carmichael (1660; Grand Rapids MI: Reformation Heritage Books, 2016), preface to the reader, pp 1-2.</span></figcaption>

In contrast, when Scripture is taken as the standard, there is nothing that is a greater threat, is more insidious, opposes, and tears down ἐπισυναγωγα‹ς, congregations, more than τῶν σχολαζόντων τῇ μαθήσιν, those who lack devotion to the sacred truth. After that danger is the one in which students, in the face of the trials of this life, only have knowledge of the truth as it suits them to listen to or talk about it. These follies, which are inappropriate to those who are and are called brothers, must cause harm.

— Johannes Cocceius, Summa Doctrinæ de Fœdere et Testamento Dei: The Doctrine of the Covenant and Testament of God, trans. Casey Carmichael (1660; Grand Rapids MI: Reformation Heritage Books, 2016), preface to the reader, pp 1-2.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUndoubtedly+%CE%B6%CE%B7%CF%84%CE%AE%CF%83%CE%B5%CE%B9%CF%82+%CE%BC%CF%89%CF%81%CE%B1%E1%BD%B6+%CE%BA%CE%B1%E1%BD%B6+%E1%BC%80%CF%80%CE%B1%E1%BD%B7%CE%B4%CE%B5%CF%85%CF%84%CE%BF%CE%B9%2C+foolish+questions+as+well+as+those+that+are+ignorant+or+unlearned%2C+greatly+block+the+path+to+piety.+The+former+concern+matters+that+accomplish+nothing+for+piety.+The+latter+arise+from+ignorance+of+the+doctrine+of+righteousness%2C+arguments+against+the+faith%2C+or+even+%CF%84%CE%BF%E2%80%B9%CF%82+%E1%BC%85+%CE%BC%E1%BD%B4+%E1%BC%91%CF%89%CF%81%CE%AC%CE%BA%CE%B1%CF%83%CE%B9%CE%BD+%E1%BC%90%CE%BC%CE%B2%CE%B1%CF%84%CE%B5%E1%BD%BB%CE%BF%CF%85%CF%83%CE%B9%CE%BD+%28from+those+who+take+their+stand%29+on+what+they+have+not+seen%2C+who+have+neither+seen+nor+heard+anything+in+the+Word+of+God%2C+but+who+habitually+appear+and+rear+up+with+profane+feet.+Therefore%2C+%CE%BA%CE%B5%CE%BD%CE%BF%CF%86%CF%89%CE%BD%CE%AF%CE%B1%CE%B9+and+%CE%BB%CE%BF%CE%B3%CE%BF%CE%BC%CE%B1%CF%87%CE%AF%CE%B1%CE%B9%2C+foolish+talk+and+quarrels+about+words%2C+greatly+hinder+edification.+Indeed%2C+into+what+sordid+conditions+men+will+fall%2C+who+understand+neither+Scripture+nor+its+substance%21+With+all+their+might+they+furnish+obscure%2C+new%2C+erratic%2C+and+suspect+ideas+as+ends+for+religion%2C+reduce+the+faith+to+tragedy%2C+or+transform+the+words+of+God+into+dross+as+amid+a+fire%2C+thereby+weakening+and+emptying+them.%0A%0AContrarily%2C+those+things+necessary+for+piety+include+the+thorough+examination+of+the+Word+of+God%2C+comparison+of+spiritual+matters+with+spiritual+matters%2C+demonstration+of+the+truth+that+accords+with+piety%2C+conscience%2C+the+foundation+of+religion+and+the+%E1%BC%80%CE%BD%CE%B1%CE%BB%CE%BF%CE%B3%E1%BD%B7%CE%B1%CF%82+%CF%84%E1%BF%86%CF%82+%CF%80%E1%BD%B7%CF%83%CF%84%CE%B5%CF%89%CF%82+%28analogy+of+faith%29%E2%80%94the+harmony+and+conformity+of+all+that+must+be+believed+from+the+uniform+witness+of+God+through+%CF%83%E1%BD%BB%CE%BD%CE%B5%CF%83%CE%B9%CE%BD+%28conscience%29+and+%E1%BC%90%CF%80%E1%BD%B7%CF%83%CF%84%CE%B1%CF%83%CE%B9%CE%BD+%28care%29.+Also+necessary+for+piety+is+the+serious+examination+and+proper+consideration+of+the+weight+of+God%E2%80%99s+Word%2C+as+well+as+the+disciplined+and+careful+comparison+of+the+product+of+all+these+practices.+The+end+of+all+this+is+to+subject+the+mind+to+the+divine+witness+and+the+%E1%BC%80%CF%80%CE%BF%CE%B4%CE%B5%E1%BD%B7%CE%BE%CE%B9%CE%BD+%CF%84%CE%BF%E1%BF%A6+%CE%A0%CE%BD%CE%B5%E1%BD%BB%CE%BC%CE%B1%CF%84%CE%BF%CF%82%2C+demonstration+of+the+Spirit.%0A%0AThe+devil+very+much+hates+this+greatest+means+of+increasing+and+strengthening+true+religion+and+destroying+wickedness.+Therefore%2C+he+corrupts+the+minds+of+men%2C+so+that+they+do+not+give+heed+to+sound+doctrine+and+the+force+of+Scripture.+Although+these+men+have+the+%CE%BC%E1%BD%B9%CF%81%CF%86%CF%89%CF%83%CE%B9%CE%BD+%28form%29+and+precise+outline+of+piety%2C+they+deny+it%2C+with+both+%CF%80%CE%B1%CF%81%CE%B1%CE%B4%CE%B9%CE%B1%CF%84%CF%81%CE%B9%CE%B2%E1%BD%B0%CF%82+%28idle+occupation%29+and+leisure+spent+for+gain.+Instead%2C+they+pursue+%E1%BC%80%CE%BD%CF%84%CE%B9%CE%B8%E1%BD%B3%CF%83%CE%B5%CE%B9%CF%82+%CF%88%CE%B5%CF%85%CE%B4%CF%89%CE%BD%CF%8D%CE%BC%CE%BF%CF%85+%CE%B3%CE%BD%CF%8E%CF%83%CE%B5%CF%89%CF%82%2C+contradictions+falsely+called+knowledge%2C+preferring+this+account+to+the+opinion+of+the+%CF%80%CE%BF%CE%BB%CF%85%CE%BC%CE%B1%CE%B8%CE%B5%E1%BD%B7%CE%B1%CF%82+%28very+learned%29%2C+experience%2C+and+common+sense.+Full+of+zeal%2C+these+men+multiply+their+wickedness+in+numerous+schools+and+seminaries.%0A%0AIn+contrast%2C+when+Scripture+is+taken+as+the+standard%2C+there+is+nothing+that+is+a+greater+threat%2C+is+more+insidious%2C+opposes%2C+and+tears+down+%E1%BC%90%CF%80%CE%B9%CF%83%CF%85%CE%BD%CE%B1%CE%B3%CF%89%CE%B3%CE%B1%E2%80%B9%CF%82%2C+congregations%2C+more+than+%CF%84%E1%BF%B6%CE%BD+%CF%83%CF%87%CE%BF%CE%BB%CE%B1%CE%B6%CF%8C%CE%BD%CF%84%CF%89%CE%BD+%CF%84%E1%BF%87+%CE%BC%CE%B1%CE%B8%CE%AE%CF%83%CE%B9%CE%BD%2C+those+who+lack+devotion+to+the+sacred+truth.+After+that+danger+is+the+one+in+which+students%2C+in+the+face+of+the+trials+of+this+life%2C+only+have+knowledge+of+the+truth+as+it+suits+them+to+listen+to+or+talk+about+it.+These+follies%2C+which+are+inappropriate+to+those+who+are+and+are+called+brothers%2C+must+cause+harm.%0A%0AFor+this+reason%2C+those+who+have+been+appointed+to+the+sacred+ministry+to+shepherd+the+flocks+by+the+consensus+and+recommendation+of+the+church+and+called+by+the+authority+of+the+elders+must+devote+themselves+with+more+anxious+care+so+that+they+are+found+diligent+and+active+not+only+in+the+explanation+and+presentation+of+the+main+points+of+doctrine+but+also+in+discussions+about+the+mystery+of+piety+according+to+its+revelation+in+the+Scriptures%2C+together+with+the+refutation+of+errors+and+restraint+of+corruptions%2C+fruitless+questions%2C+and+unhelpful+assertions+about+the+Word+of+God.%E2%80%9D%0A%0A%E2%80%94+Johannes+Cocceius%2C+Summa+Doctrin%C3%A6+de+F%C5%93dere+et+Testamento+Dei%3A+The+Doctrine+of+the+Covenant+and+Testament+of+God%2C+trans.+Casey+Carmichael+%281660%3B+Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+2016%29%2C+preface+to+the+reader%2C+pp+1-2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b3d39ed78.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9b3d39ed78.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/22/johannes-cocceius-on-doctrine-and-piety/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

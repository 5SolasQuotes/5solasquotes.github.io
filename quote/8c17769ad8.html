<blockquote><p>2…. Now, in order that true religion may shine upon us, we ought to hold that it must take its beginning from heavenly doctrine and that no one can get even the slightest taste of right and sound doctrine unless he be a pupil of Scripture. Hence, there also emerges the beginning of true understanding when we reverently embrace what it pleases God there to witness of Himself… 3… Then we may perceive how necessary was such written proof of the heavenly doctrine…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-134828ed61" data-kw="">
<blockquote><p>… That this Commission may receive into ministerial communion such of the late conform ministers, as having qualified themselves according to law, shall apply personally to them, one by one, duly and orderly, and shall acknowledge, engage, and subscribe upon the end of the Confession of Faith, as follows, viz.: I… do sincerely own and declare, the above Confession of Faith, approven by former General Assemblies of this Church, and ratified by law in the year 1690, to be the confession of my faith; and that I own the doctrine therein contained to be the true doctrine which I will constantly adhere to; as likeways that I own and acknowledge Presbyterian Church government of this Church, now settled by law, by Kirk-Sessions, Presbyteries, Provincial Synods and General Assemblies, to be the only government of this Church, and that I will submit thereto, concur therewith, and never endeavour directly nor indirectly, the prejudice or subversion thereof… As also that the General Assembly require all Presbyteries and Synods, in their admitting or receiving any to ministerial communion, that they oblidge them to take and subscribe the same acknowledgment…</p></blockquote>

<blockquote><p>Wherefore custom is not made by examples, but by the assent, approbation and ordinance of the people… 11… But whereas he says that that use ought to be agreeing with reason, that is not enough: but this ought first to be preferred, that it must be agreeable to the Word of God. For that is to be accounted for the chiefest reason; and afterward let it be allowed by the institution of the people…</p></blockquote>

</figure><figure class="quote" id="q-b9cc3fe6ec" data-kw="">
<blockquote><p>New School ministers, while often perceived as enemies of confessional subscription, were in fact strong advocates of the principles of 1729. The leaders of the New School asserted that throughout the nineteenth century, the majority of New School members had maintained a solid attachment to the Presbyterian creed. They allowed more theological diversity than their Old School counterparts, but there were confessional boundaries to that latitude which they openly acknowledged. New School Presbyterians were moderate Calvinists who loved the Reformed Tradition but were unwilling to allow the West minster Standards to become the only test of one’s orthodoxy. While viewing itself as generally conservative, the New School also promoted an openness to express traditional Reformed theology in fresh ways.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43</cite>, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“New School ministers, while often perceived as enemies of confessional subscription, were in fact strong advocates of the principles of 1729. The leaders of the New School asserted that throughout the nineteenth century, the majority of New School members had maintained a solid attachment to the Presbyterian creed. They allowed more theological diversity than their Old School counterparts, but there were confessional boundaries to that latitude which they openly acknowledged. New School Presbyterians were moderate Calvinists who loved the Reformed Tradition but were unwilling to allow the West minster Standards to become the only test of one’s orthodoxy. While viewing itself as generally conservative, the New School also promoted an openness to express traditional Reformed theology in fresh ways.”

</figure><figure class="quote" id="q-b703fc07eb" data-kw="">
<blockquote><p>We are the rather induced to take this upon us (that is, to give some determination to the matters in difference) by finding upon a full conference that we have had with the learned men of several persuasions that the mischiefs under which both Church and State do at present suffer, do not result from any formed doctrine or conclusion which either party maintains or avows, but from the passion and appetite, and interest of particular persons, which contract greater prejudice to each other by those affections than would naturally arise from their opinions.</p></blockquote>

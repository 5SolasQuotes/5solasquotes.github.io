<main class="wrap"><figure class="quote" id="q-9bc4766b5d" data-kw="">
<blockquote><p>Again, if God reward none but them that seek Him, here appears the reason why so many papists die in our religion and (with us) cleave to Christ’s merits alone when they come to die – because their conscience then tells them that by their pilgrimages, relics, will-worships, and many more of their courses (ordinary in popery) they did never seek God but themselves and their own honour, gain, and credit. And full well know they that there is no reward due for such service. And therefore by their practice they make it a true saying that “it is good living a papist but dying a Protestant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), p. 69.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55ed48034e" data-kw="">
<blockquote><p>For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-gataker.html">Charles Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</span></figcaption>

</figure><figure class="quote" id="q-27d1b45792" data-kw="">
<blockquote><p>Reform your own lives and conversations; for how reasonable is it that you who make laws that others do not swear, you your selves should not? how fit is it that you who bind others to the keeping of the Sabbath, you your selves should sanctify it? And this again did undo Jehu, that although he pulled down Baal, yet he did not reform himself from Jeroboam’s sins: lege historiam ne fias historia, read the history of Jehu, lest thou thy self be made such an history to others.

Oh therefore let it be true of thee, that since thou hast been labouring in this public Reformation, thou hast been more holy, thou hast been more pure: Thou that hast endeavoured to make way for Christ in the Church and State, hast much more made way for him in thy own family: What will it profit to have holy Ordinances, holy Worship, if we our selves still remain unholy?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difficulty of and the encouragements to a reformation a sermon preached before the honourable House of Commons at the publick fast, Septem. 27, 1643</cite>, (London: Thomas Underhill, 1643), p. 27.</span></figcaption>

</figure><figure class="quote" id="q-64accecdb3" data-kw="">
<blockquote><p>That all the members of the catholic Church are united in this profession [of the Christian faith] is very true; but this is not all, they are bound to more than this, viz. to the exercise of the same specifical ordinances, to subjection to the same discipline, as also to love to one another, and where it is possible, to the celebrating together of the same numerical worship. And in any of these, to make any differences, is a breach of that union, that ought to be among the members of the catholic visible Church. … For when Christ has instituted that every church meeting together, and every member of the catholic Church, should exercise the same specifical ordinances, is not this a Church union, or union of Churches? And let it then be considered, that if every member of the Church catholic may be a member of any or every particular church, where providence may cast him (being rightly qualified thereunto), having right first to the same specifical ordinances as a member of the catholic, and then to the same numerical ordinances, where he comes and finds them (as some of his own way [that is congregationalism] do grant, and cannot well be denied), then the denial of such a person to join in those numerical ordinances [such as congregationalists practice] is a breach of that union and love which ought to be between the members of the catholic Church…</p></blockquote>

</figure><figure class="quote" id="q-98d5b59ac8" data-kw="">
<blockquote><p>I would have wanted to expound this in a more detailed and careful way, because all the ministers of the church are reminded by Paul’s example what they must do and how they must understand the purpose and goal of their ministry in order to be able to defend their teaching with similar confidence against whoever may come along. The essential point is that we preach God, not people. All human beings are liars, and so whatever they make up in their own mind is uncertain, dubious and unstable. In his own being, God is eternal, and so he always stays the same and does not change.…

Paul challenges the Galatians by appealing to their consciences in a way that those who are sure of themselves often do because they know that their self-confidence will also be perceived by their enemies. What he says here served his purpose very well. Those who want to please people have to say things that are pleasing to them, and so they keep quiet about things that they know others will find offensive. They are therefore forced to hide a great deal and to express many things in ways that are quite different from the way God reveals them in his Word. Paul says that he is not the kind of person who wants to please people, and by using that argument he attacks the false apostles, whom he accuses of pleasing the Jews, who were the most bitter persecutors of the gospel, by adding circumcision and the other ceremonies of the law to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

Paul challenges the Galatians by appealing to their consciences in a way that those who are sure of themselves often do because they know that their self-confidence will also be perceived by their enemies. What he says here served his purpose very well. Those who want to please people have to say things that are pleasing to them, and so they keep quiet about things that they know others will find offensive. They are therefore forced to hide a great deal and to express many things in ways that are quite different from the way God reveals them in his Word. Paul says that he is not the kind of person who wants to please people, and by using that argument he attacks the false apostles, whom he accuses of pleasing the Jews, who were the most bitter persecutors of the gospel, by adding circumcision and the other ceremonies of the law to it.”

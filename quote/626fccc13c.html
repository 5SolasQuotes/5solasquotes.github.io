<main class="wrap"><figure class="quote" id="q-626fccc13c" data-kw="">
<blockquote><p>It is an indubitable truth that the light of nature gives considerable information, with respect to the knowledge of God and divine things. That there is a supreme Being on whom every other being in the universe is dependent; that he is eternal, infinite in wisdom, power, goodness and justice, in a word, possessed of absolute perfection; that by him all things were at first created and are continually governed; that the affairs of mankind are, in a particular manner, the object of his attention; that there are laws of nature by which we are enabled to distinguish the difference betwixt just and unjust; finally, that the souls of men are immortal, and that there is a future state of rewards and punishment, all these truths are pretty clearly discovered by the light of nature. The heathens were not strangers to them, who had no other guide, with respect to such matters, but the aids derived from unassisted reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Revealed Religion</cite>, trans. William Crawford (1737; Belfast: James Magee, 1778), § 1, pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19d46ee560" data-kw="natural">
<blockquote><p>We find in man a natural law written upon each one’s conscience excusing and accusing them in good and bad actions, which therefore necessarily implies the knowledge of God, the legislator, by whose authority it binds men to obedience and proposes rewards or punishments. “The Gentiles, which have not the law” (i.e., the law of Moses) “do by nature the things contained in the law, these, having not the law, are a law unto themselves: which show the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the meanwhile accusing or else excusing one another” (Rom. 2:14, 15). This could not be said if conscience did not dictate to each one that there is a deity who approves of good actions and disapproves and punishes evil deeds. Nor are these objections of force: (1) the work of the law and not the law itself is said to be inscribed because with the apostle these are synonymous—“to be a law unto themselves” (v. 14) and “to have the work of the law written in their hearts” (v. 15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.3</span></figcaption>

ked</span></div>
</figure><figure class="quote" id="q-d2478435c2" data-kw="">
<blockquote><p>Of course, without special personal divine interposition there is a considerable amount of revelation of God’s being and perfections afforded by nature, — by the works of God’s hand, the constitution that He has given to man, and the providence and government which He constantly and silently exercises over him. God could not create such a world as this, and put and keep in it an intelligent being like man, without inlaying into the workmanship of His hands, and into His providence over it, incontestible evidence of His own existence, and considerable proofs, because traces of His wisdom, power, and goodness.

No one doubts, and our [Westminster] Confession in its very first clause admits, that in this there is a source of knowledge of God, or if you will, of revelation, thoroughly valuable and important; while science, glorious science, is continually reading it off to us more and more fully, some of her unwitting sons labouring in the service as the hardest driven Gibeonites we have ever chanced to come across sweating in their toil. Long and successfully may they toil, and much may they bring to light in proof of God’s necessary existence and God’s necessary perfections!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Doctrine of the Inspiration of Scripture (With a Prefatory Note on the Free Church College Committee’s Report, and with Remarks on Dr Marcus Dods’s Recent Sermon)</cite>, (1877; 4th edn, London: J. Nisbet, 1890), p. 11.</span></figcaption>

</figure><figure class="quote" id="q-4f63c5d071" data-kw="">
<blockquote><p>So the apostle in these two verses is shewing what that knowledge of God was which the Heathens had, and how they came by it. God’s eternal power and Godhead, which are in themselves invisible, was a thing the knowledge whereof was attainable by the light of nature. They had common principles of knowledge given them of God, whereby, looking upon the works of creation, they might safely and solidly gather, what a God he was and what was his due; so that they were rendered inexcusable in abusing this light; and their mouths were stopped, so that they had nothing to say for themselves, why they lived in ungodliness and unrighteousness. …

However the Lord Jehovah be it himself unsearchable, yet hath he left at much light in folks, that were they desirous, by the very principles of natural knowledge, they might see as much of God as might convince them that he only is to be worshipped, loved, and feared for it pleased the Lord that as much as might be sufficient for this end, should remain attainable by sand-blind nature; that is it that might be known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Paul the Apostle to the Romans, with Large Practical Observations; Delivered in Several Lectures</cite>, (Edinburgh: David Paterson, 1766), p. 34.</span></figcaption>

ormed Covenanter</a></div>
</figure><figure class="quote" id="q-e52cd4ef98" data-kw="">
<blockquote><p>Even though the natural knowledge of God is not salvific, it nevertheless serves a purpose and is useful for the following reasons:

(1) It teaches that God exists; that He is an invisible, spiritual Being; is infinite; is the first cause of all things; in His Being is infinitely exalted above all that exists; and is holy, omnipotent, good and just.

(2) It teaches that God is the cause of all things (also of him who meditates about God), and thus is sovereign Lord over all. It teaches that by His influence He upholds, governs, and directs all things according to His will, so that no one can stay His hand or say, “What doest Thou?”

(3) It teaches that every human being is obligated to Him with an irrevocable obligation to do His will as expressed in His law, which is revealed to him by virtue of the light of nature.

(4) By this man can view his sin and guilt against the background of God’s justice.

(5) It promotes the maintenance of human society.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ac48967e05" data-kw="">
<blockquote><p>‘Which believe in Him that raised up Jesus our Lord from the dead, who was delivered for our sins, and is risen again for our justification.’ …But here arises a doubt, by what means the apostle may seem to seioine and to put asunder these things one from the other: namely, the forgiveness of sin, and justification: and one the other side, the faith of the death, from the faith of the resurrection, when as it seems that by the faith of each part, of his death (I say) and of his resurrection is given not only remission of sins but also justification. … …wherefore there are yet behind two other very likely interpretations: Of which the first is, that in very deed, by the death of Christ was paid the price of our redemption. But, that it might be applied unto us, there needs the Holy Ghost, to move us to believe, and Christ to give unto us this Holy Ghost, rose again from death, sent abroad his apostles to preach into all parts of the world, and now also before the Father, executes the office of an intercessor and high priest: therefore is He said to have risen again to help us that we might obtain justification. Chrysostom seems to lean unto this sentence. The second exposition [as pertaining to inherent righteousness] is that the faith of the death and of the resurrection brings justification: but Paul seioyned them aptly to declare the analogy and proportion between them. Unto the death of Christ answers very well the forgiveness of sins, for by reason of them, death was due unto us. And as Christ, as touching this corruptible life, died, so also ought we, when we are justified to die unto sin. Again because justification seems herein to be declared in that we begin a new life, therefore is it referred unto the resurrection of Christ: for that he then seemed to have begun a celestial and happy life. Paul used in a maner the self-same form of words in this same epistle, when he says [Rom. 10]: ‘with the heart we believe unto righteousness: and with the mouth is confession made to salvation.’ For the faith of the heart both works righteousness and also brings salvation: but because salvation and instauration are chiefly declared in action, therefore he ascribed it to confession. But whither of these expositions is the truer, neither will I contend, nor also now declare. Of those things which have now been spoken, we gather a most sweet consolation: for thereby we do not only know the weight of sin, but also we understand that God bare a singular good love towards us: as one which gave his only begotten Son, and that unto the death to deliver us from sins. Farther, seeing Christ is said to have risen from the dead for our justification, we easily see that we are by Him called back to a new life: unto which yet we cannot aspire, except we be of Him elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Learned &amp; Fruitful Commentary upon the Epistle of St. Paul to the Romans</cite>, ... (d. 1562; London: 1568), on ch. 4, verse 25, p. 97</span></figcaption>

<blockquote><p>Neither does faith justify as the beginning of justification only: first, because there are no degrees of justification before God; for in the first act it is perfect: and to that act continued throughout this life, faith, as I showed before out of diverse of the Fathers, suffices. I say, suffices to justification: and therefore is not the beginning only, but also the continuance and consummation thereof: for as in the first act it justifies, so also in the continuance of justification: for by it we stand, and by it we live, and so long as we have faith, it is imputed unto us for righteousness even from faith to faith, as it was to Abraham, after he had long continued in the faith.</p></blockquote>

</figure><figure class="quote" id="q-d46ead5565" data-kw="">
<blockquote><p>When the world was lost by the one sin of Adam, the grace of Christ has not only abolished this sin and the death which it introduced, but also has at the same time taken away those endless sins… and brought as many as are of Christ into full justification; so that God has now not only forgiven them the sins both of Adam and of themselves, etc., but has at the same time given his Spirit of solid and perfect justice, to conform us to the image of the First-begotten. ‘Justification’ here occurs, which, as it is opposed to ‘condemnation,’ so it signifies properly that justification by which God absolves from all sins those that are Christ’s… and because he means a full justification, the perfect bestowal of justice is also contained in this justification; for it [justification] will then at length be consummated when along with sin, the last enemy, death, shall also have been destroyed, and the saints shall have been filled with every fruit of justice.</p></blockquote>

<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works. 3. The power of nature without illumination and grace. 4. The power of the Law. 5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

e+hereafter+to+decline+the+like+evils%2C+and+to+do+contrary+good+things.+For+by+these+we+are+prepared%2C+disposed+and+fitted+for+justification%3B+without+these+none+are+justified.+And+in+this+sense%2C+and+to+imply+a+necessity+of+these+to+be+found+in+us%2C+sometimes+the+Fathers+and+others+say+that+we+are+not+justified+by+faith+only.+And+we+all+agree%2C+that+it+is+not+our+conversion+to+God%2C+nor+the+change+we+find+in+ourselves%2C+that+can+any+way+make+us+stand+in+judgment+without+fear%2C+and+look+for+any+good+from+God%2C+otherwise+than+in+that+we+find+ourselves+so+disposed+and+fitted%2C+as+is+necessary+for+justification%2C+whence+we+assure+ourselves+God+will+in+mercy+accept+us+for+Christ%E2%80%99s+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Of+the+Church...+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+appendix%2C+ch.+11%2C+pp.+323-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16a6aa85d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16a6aa85d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Neither%20have%20we%20departed%20from%20the,mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake&amp;text=Neither%20have%20we%20departed%20from%20the%20doctrine%20of&amp;text=will%20in%20mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

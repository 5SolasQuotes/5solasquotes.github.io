<main class="wrap"><figure class="quote" id="q-e4c6f49a58" data-kw="">
<blockquote><p>The righteousness by which any are justified, is the righteousness of another, and not their own, even the righteousness of Christ; “Not having on mine own righteousness”, says the apostle (Philippians 3:9).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31ccf53a7e" data-kw="">
<blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-b37d09fdd4" data-kw="">
<blockquote><p>From this interpretation of Andrada I now finally understand what the Tridentine decree is after when it declares that justification consists of two parts, remission of sins and renewal, because they nevertheless say not long afterward that the sole formal cause of justification is the renewal, or love.</p></blockquote>

</figure><figure class="quote" id="q-d810229037" data-kw="">
<blockquote><p>That righteousness is not our proper righteousness—that is, inhering in us—whether it is conferred by us ourselves or infused by the Spirit of God into man, for that does not stand before the tribunal of God, as the following arguments show.</p></blockquote>

</figure><figure class="quote" id="q-4fcf1107c1" data-kw="">
<blockquote><p>Because all men be sinners and offenders against God, and breakers of His law and commandments, therefore can no man by His own acts, works, and deeds (seem they never so good) be justified, and made righteous before God: But every man of necessity is constrained to seek for another righteousness or justification, to be received at God’s own hands, that is to say, the forgiveness of his sins and trespasses, in such things as he hath offended. And this justification or righteousness, which we so receive of God’s mercy and Christ’s merits, embraced by faith, is taken, accepted, and allowed of God, for our perfect and full justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily of Salvation</cite>, First Book of Homilies, 1547</span></figcaption>

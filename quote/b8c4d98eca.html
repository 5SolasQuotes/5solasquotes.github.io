<main class="wrap"><figure class="quote" id="q-b8c4d98eca" data-kw="">
<blockquote><p>Man is brought forth into life not as by a mother, but as by a stepmother, nature, with a body naked and fragile and weak, and with a soul anxious for troubles, humble for fears, soft for labors, prone to lusts; in which, however, there is, as if buried, a certain divine fire of genius and mind.” ([as quoted by] Augustine, bk. 4, contr. Pelag.).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-709cf6ada5" data-kw="">
<blockquote><p>Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009) Feser is an Analytical Thomist.</span></figcaption>

</figure><figure class="quote" id="q-f32404dc04" data-kw="">
<blockquote><p>Man’s intellect, to go no further, since it attains universal and necessary truth, is not limited by material conditions and material organs. Hence man’s soul, the source of his intellect, is independent of matter, and hence survives the corruption of the human organism.</p></blockquote>

</figure><figure class="quote" id="q-d3995bf686" data-kw="">
<blockquote><p>XXIII. However, they insist that the immortality which befitted man in his original integrity should rather be called natural than supernatural, and indeed that the first man was in some sense naturally immortal… … XXVII. Nor do the theologians of the Roman School, as we have shown above, deny that the immortality which belonged to the first man before sin can in some respect and sense be called natural, namely, in so far as natural signifies what is inherent from the first origin and not adventitious and superadded. Also, in so far as natural is opposed to what is contrary to nature and signifies what adorns and perfects the same nature. XXVIII. The only remaining question is whether this immortality should be called natural or supernatural with respect to integral man, speaking simply. Protestants affirm this, while the Doctors of the Roman School deny it.</p></blockquote>

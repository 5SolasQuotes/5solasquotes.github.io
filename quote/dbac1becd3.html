<main class="wrap"><figure class="quote" id="q-dbac1becd3" data-kw="">
<blockquote><p>We are charged by the Separatists that we preach canons, and man’s constitutions, as God’s Word; But we answer: These are not taught for doctrines, but only serve for some passage and carriages touching God’s service, specially in Church government…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aedb36876d" data-kw="">
<blockquote><p>Now of Churches faulty and corrupted, some raze the foundation; others, on the true foundation build timber, hay, stubble. From those we must separate; from these we may not. Peter’s is eternal, ‘Whither shall we go from Thee; Thou hast the words of eternal life.’ (Jn. 6:68) Where these words are found, woe be to us if we be not found. Amongst many good separations then, yours cannot be separated from evil, for that we should so far separate from the evil that therefore we should separate from God’s children in the communion of the holy things of God, that for some (after your worst done) not-fundamental corruptions, we should separate from that Church in whose womb we were conceived, and from betwixt whose knees we fell to God: in a word (as one of yours once said) to separate not only from visible evil, but from visible good, as all Antichristian: who but yours can think less than absurd and impious? Grant we should be clean separated from the world, yet if we be not, must you be separated from us?¹ ¹ Neque propter paleam relinquim are am Domini, neque propter pisces malos rumpimus retia Domini. Augustine, Epistle 48 Do but stay till God have separated us from Himself: will the wise husbandman cast away his corn-heap for the chaff and dust? Shall the fisher cast away a good draught because his drag-net has weeds? Does God separate from the faithful soul, because it has some corruptions, her inmates, though not her commanders?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Common Apology of the Church of England against the Unjust Challenges of the over-just Sect, commonly called Brownists</cite>, … (London: Macham, 1610), sect. 4, pp. 10-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-d73260422e" data-kw="">
<blockquote><p>As for schismatics, that is, those who separate themselves from true Christian churches for some slight cause, whether in doctrine or discipline, our theologians distinguish between the authors of the schism and the people deceived by them. As for the authors of the schism, since they break the bond of charity, they acknowledge that they cannot belong to the invisible Church, whose bond and communion consist in faith, hope, and charity. But concerning the deceived people or those born in schism, they are less rigid and believe that there can be good men among them, not alien to the body of Christ but joined to it by true faith and charity; nor do they entirely exclude schismatic churches from the visible Church if they retain the foundations of doctrine and discipline, since they reserve this honor only for those who deny and overthrow the fundamentals of faith and discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Elucidation of the Status of Controversies about the Church Militant</cite>, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1,056</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-ce690e115a" data-kw="">

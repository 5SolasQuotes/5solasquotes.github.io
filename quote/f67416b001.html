<main class="wrap"><figure class="quote" id="q-f67416b001" data-kw="">
<blockquote><p>The nature of justifying faith, with respect unto that exercise of whereby we are justified, consists in the heart&#x27;s approbation of the way of justification and salvation of sinners by Jesus Christ proposed in the gospel, as proceeding from the grace, wisdom, and love of God, with its acquiescency therein as unto its own concernment and condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19f01e32d5" data-kw="">
<blockquote><p>Faith comprehends the knowledge of the mystery of God, and of Christ in the light of grace, the truth of which mystery the believer acknowledges with full assent of mind, on the authority of the testimony of God. And not only so, but he is also in love with that truth, exults therein and glorifies God; he likewise ardently desires communion with Christ … wherefore, when Christ is offered to him by the word and Spirit, he receives him with the greatest complacency of soul, leans and rests upon him, and gives and surrenders himself to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, 3.7.26</span></figcaption>

</figure><figure class="quote" id="q-553bd25b66" data-kw="">
<blockquote><p>The reception of that gift is faith: faith means not doing something but receiving something; it means not the earning of a reward but the acceptance of a gift. A man can never be said to obtain a thing for himself if he obtains it by faith; indeed to say that he obtains it by faith is only another way of saying that he does not obtain it for himself but permits another to obtain it for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Is Faith?</cite>, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-1d55c97862" data-kw="">
<blockquote><p>Faith is man’s response to God’s elective purpose. God’s choice of men is election; men’s choice of God is faith. In election God gives His promises, and by faith men receive them.</p></blockquote>

</figure><figure class="quote" id="q-3283612a44" data-kw="">
<blockquote><p>The efficient cause of justifying faith is the Holy Ghost. … The subject of this faith is the will and heart of man. Justifying or saving faith differs, therefore, from the other kinds of faith, because it alone is that assured confidence by which we apply unto ourselves the merit of Christ, which is done when we firmly believe that the righteousness of Christ is granted and imputed unto us, so that we are accounted just in the sight of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 21</span></figcaption>

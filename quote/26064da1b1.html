<blockquote><p>[Ex. 20:5] ‘And showing mercy unto thousands of them that love Me and keep my commandments.’ God’s justice reaches unto the third and fourth generation, but his mercy to the thousand[th] generation; and hence we may gather that God inclines more to mercy than to justice, and therefore when He punishes He is said, facere opus non suum, Isa. 28:21, that He may do his strange work, that is to punish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Moral Law, or Ten Commandments</cite>, … (London: Cotes, 1632), Explication of the Moral Law, bk. 1, 2nd Commandment, Exercitation 18, p. 134</span></figcaption>

</figure><figure class="quote" id="q-7375df7539" data-kw="">
<blockquote><p>The affections are, therefore [after quoting Venema and Ames], either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. Significantly, this figurative or metaphorical understanding of some of the divine affections as inward, permanent dispositions and others as ad extra manifestations of permanent dispositions in no way lessened the Reformed interest in the topic–nor did it in any way undermine the discussion of the divine affections in the works of popular piety written during the era of orthodoxy. It is even possible to argue the opposite, that the Reformed orthodox reading of the biblical language of divine affections as not indicating alterations of the divine essence but, nonetheless, as descriptive of genuine patterns of relationship between God and his creation, enhanced the interest of theologians, pastors, and authors of treatises of popular piety in the divine affections… …Nor, indeed, has the basic doctrinal assumption shifted: like the Reformers, the orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions. Because of the difficulties inherent in the term ‘affection,’ some of the Reformed prefer to speak of the divine ‘virtues.’ (Thus, Leigh, Treatise, II.x (pp. 78-79); Mastricht, Theoretico-practica theologia, II.xv.18-19.) The question of the ‘affections’ (affectiones or adfectiones) and ‘passions’ (passiones) of the divine will arises rather naturally as a result of the definition and discussion of the voluntas Dei, granting the context of traditional, Christian Aristotelianism and scholastic faculty psychology within which Protestant discussions of mind and will took place, both in the time of the Reformation and afterward. (See Muller, Unaccommodated Calvin, pp. 159-173; and idem, God, Creation, and Providence, pp. 143-149, 167-169, 191-207.) The terminology is itself interesting: the language of affections and passions is typically a language indicating the changeableness of a living being, specifically of the soul, in its sentiments or dispositions. Strictly, an affection or passion is an acquired quality. (Francois Bremondy, “Affection,” in Encyclopedie philosophique universelle, II/1, p. 49.) An affection is usually favorable or positive, whereas a passion is usually negative. Thus, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. (Cf. Heidanus, Corpus theol., II (p. 172); Venema, Inst. theol., viii (p. 180).) It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept. A passion, most strictly, is a form of suffering and would not have the connotation of a permanent disposition and certainly not of a disposition positively directed toward an object. Passions, moreover, indicate a declension from an original or natural condition that is at variance with the fundamental inclination of the individual–and, therefore, a loss of power or self-control. (Venema, Inst. theol., viii (p. 181).) A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.¹ ¹ (Ames, Marrow, I.iv.63; note that this understanding of affections and passions reflects the standard categories of predication, in which action and passion denote respectively, the act of a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 552-53</span></figcaption>

 a subject and the subject being acted upon: thus, the point of the theological argument is that God act[s] but is not acted upon.)”

ion+of+the+individual%E2%80%93and%2C+therefore%2C+a+loss+of+power+or+self-control.+%28Venema%2C+Inst.+theol.%2C+viii+%28p.+181%29.%29+A+virtue+is%2C+quite+simply%2C+a+moral+perfection%E2%80%93in+the+case+of+God%2C+the+perfection+of+his+understanding+and%2For+will.%C2%B9+%C2%B9+%28Ames%2C+Marrow%2C+I.iv.63%3B+note+that+this+understanding+of+affections+and+passions+reflects+the+standard+categories+of+predication%2C+in+which+action+and+passion+denote+respectively%2C+the+act+of+a+subject+and+the+subject+being+acted+upon%3A+thus%2C+the+point+of+the+theological+argument+is+that+God+act%5Bs%5D+but+is+not+acted+upon.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+pp.+552-53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7375df7539.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7375df7539.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting,act%5Bs%5D%20but%20is%20not%20acted%20upon&amp;text=The%20affections%20are%2C%20therefore%20%5Bafter%20quoting%20Venema%20and&amp;text=that%20God%20act%5Bs%5D%20but%20is%20not%20acted%20upon" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

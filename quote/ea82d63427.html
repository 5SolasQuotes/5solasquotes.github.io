<main class="wrap"><figure class="quote" id="q-ea82d63427" data-kw="">
<blockquote><p>You will say, ‘Yet it seems more happy to depart sooner out of this wretched life unto the heavenly rest than by long living to abide continual trouble and to lack that wished quiet the longer.’ I answer, If life of itself is the gift of God, then it is certainly good. If it be good, surely it is good of itself to enjoy it long. And for that, that sometimes in this life chances to come afflictions and many troubles, it is to be referred unto the accidents, and not to the substance itself of this goodness. Neither is the gift of God to be wished away, wherein He grants us to live and to tarry long in this life: and I speak not of the rest of the benefits wherewith God does both spiritually and corporally augment and garnish this our present life with all. Neither it follows that it is therefore evil to live because it is better to live in heaven than in earth. This present state, and the state of our life to come be not contraries, but of subordinate things one to another, as earth is also and heaven. The earth is good; heaven is better. It is in a sort good of itself to live; it is better if a man live honestly and uprightly; it is best of all, if it be given us to live in best sort and most happily, as we shall live in the country of Heaven. It takes not away that which is chiefly good, but does accomplish the goodness of those things which be of an inferior order [are] and conveniently set in order by God’s ordinance. The condition and nature of our soul is more noble than that of our body. And yet he must be worthy to have not body, nor soul whosoever will say the body is evil because the soul is better. Gold passes silver, yet silver is good, though gold be better. He is not worthy to have silver that in respect of gold sets nothing by silver. So likewise we must judge of our life. Let us acknowledge the gift of God, not only in the life to come, but also in this present life and in the long continuance thereof, if it come by the benefit of God. Let us not be wayward in God’s gifts, but kind. It is the part of a grateful mind so to commend the chief and best benefits, that withal he despise not the meaner and inferior. It is the voice of holy, not of carnal men that says, We have life, bless the Lord. And the Scripture rehearses among the benefits of God bestowed upon Abraham the father of the believers that he died in a good age, old and full of days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion</cite>, (1560; London, 1563) | 5th Commandment, fol. 75.a-b</span></figcaption>

<blockquote><p>People who find themselves at odds with a spiritually abusive pastor, will often feel isolated, shamed, ostracized, silenced, and made to feel like they are unsubmissive, insubordinate, and one who undermines the church’s God-given leadership. … Spiritual Abuse Is Often Used to Achieve Godly, Biblical Goals… abuse usually happens because a pastor is desperately trying to control his situation. He wants to control his staff, control the vision, control the direction of the church. Loyalty must be maintained at all costs. Nothing can be allowed to derail the ministry. And when people fall out of line (which tends to happen with human beings) then he cracks the whip… …when the abuse is uncovered, people often refuse to believe it. To allow such a possibility will wreck the tidy world they have built around that spiritual leader. So, the abusive pastor can often provide what seems to be credible ‘explanations’ for everything, while he is backed up by supporters who don’t want to see a successful ministry come to an end.</p></blockquote>

<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law.

3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty.

4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things.

5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie.

6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one.

7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know:

1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such.

2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause.

3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>

+on+men%E2%80%99s+free-will%2C+is+never+absolute%2C+but+has+many+degrees%2C+as+the+witness+is+more+or+less+credible%3B+so+there+is+a+certainty+by+men%E2%80%99s+report%2C+tradition+or+history+which+is+physical+and+wholly+infallible%3A+As+that+there+is+such+a+place+as+Rome%2C+Paris%2C+etc.+and+that+the+statutes+of+the+land+were+made+by+such+kings+and+parliaments+to+whom+they+are+ascribed%3B+and+that+there+have+been+such+kings%2C+etc.+For+proof+of+which+know%3A+1.+That+besides+the+free+acts%2C+the+will+has+some+acts+as+necessary+as+it+is+to+the+fire+to+burn%2C+viz.+To+Love+ourselves+and+felicity%2C+and+more+such.+2.+That+when+all+men+of+contrary+interest%2C+friends+and+foes%2C+agree+in+a+matter+that+has+sensible+evidence%2C+it+is+the+effect+of+such+a+necessitating+cause.+3.+And+there+is+no+cause+in+nature+that+can+make+them+so+agree+in+a+lie.+Therefore+it+is+a+natural+certainty.+Look+back+to+the+sixth+chapter.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Catechizing+of+Families%2C+a+Teacher+of+Householders+how+to+Teach+their+Households%2C+...+%28London%2C+1683%29%2C+ch.+42%2C+%E2%80%98Of+the+9th+Commandment%E2%80%99%2C+pp.+361-62&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52baa4154a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52baa4154a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/natural-law/#:~:text=2.%20We%20must%20believe%20none%20that,Look%20back%20to%20the%20sixth%20chapter&amp;text=2.%20We%20must%20believe%20none%20that%20speak%20against&amp;text=natural%20certainty.%20Look%20back%20to%20the%20sixth%20chapter" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

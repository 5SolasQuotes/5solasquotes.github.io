<main class="wrap"><figure class="quote" id="q-be062831dc" data-kw="">
<blockquote><p>That Law was to shew them their absolute need of an Expiatory Sacrifice to take away the guilt of sin from them. It was to convince them of sin; hence we read, Heb. 10.3. In these Sacrifices there is a remembrance of sins. There were hereupon in that Law many Ceremonial uncleanness by a positive Command, added unto such as were in themselves Moral, which was to give them a deeper Conviction of sin: and this Law requiring an Offering upon the breach of any Precept Moral or Ceremonial, under a severe threatening of being cut off from their People, in case of the Omission, told them, that the wrath of God certainly abode on them, except they obtained an Interest in, and applied themselves accordingly unto another who might make an Atonement unto God for them.

It said that they could not satisfy the Justice of God for their own sins, so as to obtain a discharge from the guilt of them, by any righteousness of their own, but must have a Sacrifice to do it for them, else the Condemnation must abide upon them. The Sacrifice was to be presented, their sins must be laid on the head of it, they must be confessed over it, it must then be slain, and its blood sprinkled and poured out, and we are told Heb. 9.22. Without shedding of blood there is no remission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The law established by the Gospel or, A brief discourse, wherein is asserted and declared, the great honour which is put upon the law of God, in the Gospel way of justification be faith alone. Being the substance of a sermon preached on the lecture in Boston, September 20. 1694</cite>, (Boston MA: Michael Perry, 1694), pp 8-9.</span></figcaption>

<blockquote><p>At the Reformation of religion, some learned and godly men were of opinion that in detestation of the Popish superstition which had overspread and soiled all the worship of God, the best way was to as far from the Church of Rome as possibly might be: Others, no less learned and godly than they thought it better to depart no further from the Romish Church than she had departed from the right way, partly that they that would might step over from them to us the more easily; partly that our departure from them might appear to be made rather of necessity than of choice, and not for things which might be tolerated, but for things intolerable. Both aimed at one mark, but did not shoot after one compass; and the wiser sort and more pious pleased themselves and were not displeased with others in this difference.</p></blockquote>

<blockquote><p>6. We believe that lawful rulers have power to forbid such ministers to preach in this or that place, or anywhere in their dominions, whose preaching is such as tends to do more harm than good.

7. Had we any reasonable conviction that our ministry is unnecessary, we would obey our rulers, though they silenced us causlessly, and would seek some other place or way of serving God.

8. In those times, places, and circumstances which persuade us that more hurt than good will come by it if we preach, we will then and there forbear it, though it be not as an act of formal obedience, nor a desertion of our office, or of the exercise of it at other times.

9. We judge it our duty to further the good success of the conformable ministers to the utmost of our power.

10. And we take schism to be a great sin, and that which we are bound to do the best we can not only to avoid ourselves, but to cure or hinder in others.</p></blockquote>

<blockquote><p>Should there be a gathering destitute of bread and wine, as perchance among the Indians, who for bread use the baked marrow of a certain tree, or a fixed root, or rice, or such other things, the gathering may–if, I say, there is no bread of corn–safely use what it is accustomed to use in place of bread. It is not so much the outward form and kind of corn that ought to be regarded, as the nourishment and what chiefly nourishes. The same must be said if wine is lacking. Something else might be applied, in place of wine, as scarcely any nation is discoverable, which has not some beverage which it uses to restore the spirits in place of wine.</p></blockquote>

<blockquote><p>And the Houshold of Onesiphorus. …As the apostle before, [2 Tim.] Ch. 1:16, prayed for the house of Onesiphorus, so here [2 Tim. 4:19] he salutes them. By ‘house’ here is meant (by a metonymy of the subject very frequent in Scripture) the people in the house, as wife, children, servants; which may serve as an answer to that cavil of the sottish illiterate Quakers who revile us for calling the place where the Church meets, ‘The Church’; when this metonymy is so frequent in Scripture, ‘The house’ for the people in the house, and ‘the Church’ for the people that meet in the church. The Apostle uses the very word Church in this very sense, 1 Cor. 14:28,35, ‘It is a shame for a woman to speak in the Church.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, Question 55, ‘Whether we may call the Meeting-Place a Church?’ in A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy… (London, 1658), on 2 Tim. 4:19, p. 460. Hall (1610–1665) was an English, presbyterian puritan who was ejected at the Great Ejection of 1662.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And the Houshold of Onesiphorus. …As the apostle before, [2 Tim.] Ch. 1:16, prayed for the house of Onesiphorus, so here [2 Tim. 4:19] he salutes them. By ‘house’ here is meant (by a metonymy of the subject very frequent in Scripture) the people in the house, as wife, children, servants; which may serve as an answer to that cavil of the sottish illiterate Quakers who revile us for calling the place where the Church meets, ‘The Church’; when this metonymy is so frequent in Scripture, ‘The house’ for the people in the house, and ‘the Church’ for the people that meet in the church. The Apostle uses the very word Church in this very sense, 1 Cor. 14:28,35, ‘It is a shame for a woman to speak in the Church.&#x27;”

— Thomas Hall, A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4, Question 55, ‘Whether we may call the Meeting-Place a Church?’ in A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy… (London, 1658), on 2 Tim. 4:19, p. 460. Hall (1610–1665) was an English, presbyterian puritan who was ejected at the Great Ejection of 1662.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+the+Houshold+of+Onesiphorus.+%E2%80%A6As+the+apostle+before%2C+%5B2+Tim.%5D+Ch.+1%3A16%2C+prayed+for+the+house+of+Onesiphorus%2C+so+here+%5B2+Tim.+4%3A19%5D+he+salutes+them.+By+%E2%80%98house%E2%80%99+here+is+meant+%28by+a+metonymy+of+the+subject+very+frequent+in+Scripture%29+the+people+in+the+house%2C+as+wife%2C+children%2C+servants%3B+which+may+serve+as+an+answer+to+that+cavil+of+the+sottish+illiterate+Quakers+who+revile+us+for+calling+the+place+where+the+Church+meets%2C+%E2%80%98The+Church%E2%80%99%3B+when+this+metonymy+is+so+frequent+in+Scripture%2C+%E2%80%98The+house%E2%80%99+for+the+people+in+the+house%2C+and+%E2%80%98the+Church%E2%80%99+for+the+people+that+meet+in+the+church.+The+Apostle+uses+the+very+word+Church+in+this+very+sense%2C+1+Cor.+14%3A28%2C35%2C+%E2%80%98It+is+a+shame+for+a+woman+to+speak+in+the+Church.%27%E2%80%9D%0A%0A%E2%80%94+Thomas+Hall%2C+A+Practical+%26+Polemical+Commentary%2C+Or+Exposition+upon+2+Tim.+3-4%2C+Question+55%2C+%E2%80%98Whether+we+may+call+the+Meeting-Place+a+Church%3F%E2%80%99+in+A+Practical+%26+Polemical+Commentary%2C+or%2C+Exposition+upon+the+Third+%26+Fourth+Chapters+of+the+Latter+Epistle+of+Saint+Paul+to+Timothy%E2%80%A6+%28London%2C+1658%29%2C+on+2+Tim.+4%3A19%2C+p.+460.+Hall+%281610%E2%80%931665%29+was+an+English%2C+presbyterian+puritan+who+was+ejected+at+the+Great+Ejection+of+1662.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcc7ada14c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a c

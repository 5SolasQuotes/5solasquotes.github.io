<blockquote><p>13. And it greatly wrongs such men that they never had right apprehensions of the nature and great necessity of vanity among believers and the Churches of Christ. They cry out ‘Truth must not be sold for peace,’ when they neither know aright what is truth or peace. But by ‘truth’ they mean their own doubtful opinions and by ‘peace’ they mean their own quietness with men. We easily confess that as peace signifies our freedom from persecution or sufferings, or from the reproach of men, the least holy truth is to be preferred before it, and more tenaciously held than it: But if by ‘peace’ they mean the unity and concord of believers or of the Church of God, they speak dangerously and suppose a pernicious falsehood, that God’s truth and such peace or concord may at any time be separated: And it is no wiselier spoken than if they had said, A man’s eye-sight or health is to be preferred before the union of his soul and body, or before the concord of head and heart, or before the conjunction of his members. When as non cutis nulla est affectio [without skin there is no sensation]. Destroy the subject and you destroy the accidents. Without union of parts, the Church is no Church; dividing it is destroying it. A house or kingdom divided cannot stand. And when it is no Church, it has no truth as a Church, nor anything that dividers did contend for. An Integral member may rather be cut off, than the whole should perish: But what member will separate itself from the body? Or who but a murderer will on pretense of curing, be a divider and dissolver? … 16. And they forget that as the body must have its due magnitude, as well as its comely scite [position] of parts; so we must be zealous for the greatness, as well as the purity, the extensive as well as the intensive growth of the Church. And if Christ’s flock be little, they dishonor it that would make it tenfold less than indeed it is; Jer. 30:19, ‘And out of them shall proceed thanksgiving, and the voice of them that make merry: And I will multiply them, and they shall not be few, and I will glorify them, and they shall not be small.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7daab76c8c" data-kw="">
<blockquote><p>Yet it is the verdict of some (Sarav., N. Fratri &amp; Amico, Art. 17) that the blame lies not upon the ceremonies, but upon ministers themselves, who leave their places and draw all this evil upon themselves. This is even as Nabal blamed David for breaking away from his master, when he was chased away against his will (1 Sam. 23:10); and as Julian, when he had impoverished the Christians, laughed them to scorn, as if they had impoverished themselves to get that blessing which Christ had promised to the poor. (Socrates, bk. 3, ch. 12) The Canon Law speaks for the lord’s bishops, which are persecuted from citty to city. ‘Nec ipsi in hoc peccant, quoniam non sponte sed coacte hoc agunt: sed illi qui eos persecuuntur: nec ipsis Episcopis hoc imputari potest, sed illis qui eos hoc agere cogunt.’ (Decr., pt. 2, causa. 7, q. 1, ch. 36) How is it that they are not ashamed, who say that ministers leave their own places and callings, when they would faine abide in them, and with heavy hearts are thrust from them. Neither is this all the injury which is occasioned by the ceremonies: they make godly and zealous Christians to be mocked and nicknamed puritans, except they can swallow the camel of conformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 5, p. 23</span></figcaption>

</figure><figure class="quote" id="q-e8d085700d" data-kw="">
<blockquote><p>Who are they that divide in judgement from all the Reformed Churches of Christ in the world, that have opinions and judgements differing from the opinions and judgements of all the Reformed Churches? we or the Anabaptists? we or the Separatists? we or the—? Possibly they will all say they are of the same opinion with the Reformed Churches in fundamentals as well as we, and their differences are but in minutioribus. Now supposing this to be true (as it may be in some of them), why then do they transgress the apostles’ rule? Why do they not, if that it be in matters of lesser moment wherein they differ from us, why do not they keep their opinions private, and have their faith unto themselves before God [Rom. 14:22]? Why do they upon so small differences (if the differences be so small) withdraw from communion with us and the rest of the Churches, and gather themselves into distinct and separate Churches; some of them not holding one body with us, others neither holding one body nor one baptism with us? Their agreeing with us and the Reformed Churches, in doctrines that are fundamental; their holding one Head and one faith, does not excuse them from being guilty of breach of unity and down-right schism, as long as they hold not one body, one baptism. Schisma (says Augustine) est eadem opinantem et eodem ritu utentem solo Congregationis delectari dissidio. ‘Schisme is, when a man that professes the same faith and worship, is delighted only with the difference of an assembly or congregation. And again, Schismaticos facit non diversa fides sed communion is disrupta societas: ‘It is not a differing faith, but breaking the fellowship of communion that makes men schismatics.’ And again, Schisma est, Recens Congregationis ex aliqua sententiarum diversitate dissensio: ‘Schism is a new or late dissension or disagreement of a congregation, arising from some diversity of opinion.’ It is Beza’s observation that the Corinthians did agree in the fundamentals of religion, and yet they had schisms among them, from whence he takes occasion to say,That [Greek], sive [Greek], est cum alij alijs hominibus sive externis ritibus it a sunt addicti, ut quamvis alioquin in ipsis religionis capitibus consentiant, tamen animis sint ab alienati et factiones quasdam ineant: ‘Schism or division’ (says he) ‘is this, when men are so addicted to some men, or to some outward rites, that though they do agree in the chief points of religion, yet they are estranged in their minds, and engage themselves into parties and factions’: Now who are they that though they professe to agree with us in doctrine, have yet made a secession, withdrawn themselves, gathered Churches, engaged parties? Consider and give sentence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of such as would Walk Worthy of the Gospel</cite>, (London: 1646), pp. 41-42 Newcomen (c. 1610–1669) was a Westminter divine. He appears to have been presbyterian and then became a congregationalist, before being ejected in the Great Ejection (1662).</span></figcaption>

ed+communion+is+disrupta+societas%3A+%E2%80%98It+is+not+a+differing+faith%2C+but+breaking+the+fellowship+of+communion+that+makes+men+schismatics.%E2%80%99+And+again%2C+Schisma+est%2C+Recens+Congregationis+ex+aliqua+sententiarum+diversitate+dissensio%3A+%E2%80%98Schism+is+a+new+or+late+dissension+or+disagreement+of+a+congregation%2C+arising+from+some+diversity+of+opinion.%E2%80%99+It+is+Beza%E2%80%99s+observation+that+the+Corinthians+did+agree+in+the+fundamentals+of+religion%2C+and+yet+they+had+schisms+among+them%2C+from+whence+he+takes+occasion+to+say%2CThat+%5BGreek%5D%2C+sive+%5BGreek%5D%2C+est+cum+alij+alijs+hominibus+sive+externis+ritibus+it+a+sunt+addicti%2C+ut+quamvis+alioquin+in+ipsis+religionis+capitibus+consentiant%2C+tamen+animis+sint+ab+alienati+et+factiones+quasdam+ineant%3A+%E2%80%98Schism+or+division%E2%80%99+%28says+he%29+%E2%80%98is+this%2C+when+men+are+so+addicted+to+some+men%2C+or+to+some+outward+rites%2C+that+though+they+do+agree+in+the+chief+points+of+religion%2C+yet+they+are+estranged+in+their+minds%2C+and+engage+themselves+into+parties+and+factions%E2%80%99%3A+Now+who+are+they+that+though+they+professe+to+agree+with+us+in+doctrine%2C+have+yet+made+a+secession%2C+withdrawn+themselves%2C+gathered+Churches%2C+engaged+parties%3F+Consider+and+give+sentence.%E2%80%9D%0A%0A%E2%80%94+Matthew+Newcomen%2C+The+Duty+of+such+as+would+Walk+Worthy+of+the+Gospel+%28London%3A+1646%29%2C+pp.+41-42+Newcomen+%28c.+1610%E2%80%931669%29+was+a+Westminter+divine.+He+appears+to+have+been+presbyterian+and+then+became+a+congregationalist%2C+before+being+ejected+in+the+Great+Ejection+%281662%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8d085700d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8d085700d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Who%20are%20they%20that%20divide%20in,engaged%20parties%3F%20Cons <blockquote><p>That in endeavoring union and healing men would not straiten it to an universal union in everything, in judgement and practice, but would resolve to have it with many things defective that need forbearance in persons that are united, which men may take up in these particulars: 1. There may be difference of judgement in many things, I mean in such things that are consistent with the foundation and edification; and such a forbearance would be resolved upon, and to do otherways were to think that either men had no reason at all, or that their understandings were perfect, or at least of equal reach. 2… certainly, if people ought to carry even to corrupt ministers who yet destroy not the foundation, as ministers, in the duties that becomes them to ministers in communion with them, while they continue such, then certainly ministers ought to keep that communion with ministers, that becomes their relations, seeing they are still ministers in that respect, as well as in the other. And if this corruption will not warrant separation in other ordinances, as was said in the close of the second part, then neither will it warrant division in the ordinance of government.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7040c89e4f" data-kw="">
<blockquote><p>Q. What are the outward signs of this sacrament? A. Sacramental elements and actions. Q. What are the sacramental actions of the minister? A. The taking, blessing, and breaking the bread, and giving it, with the wine, to the communicants. Q. What is signified by the breaking of the bread? A. God’s breaking and bruising Christ for our sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Questions &amp; Answers on the Shorter Catechism (RHB), pp. 320 &amp; 322</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b1da1a9cb3" data-kw="self-exam">
<blockquote><p>Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the peace of the church ought not to be disturbed, but it should be left to their freedom (as it is evident that both the ancient and also the modern uses vary).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.22</span></figcaption>

</figure><figure class="quote" id="q-653c665a8e" data-kw="">
<blockquote><p>…in the receiving of the blessed Sacrament we are to distinguish between the outward and the inward action of the communicant. In the outward, with our bodily mouth we receive really the visible elements of bread and wine; in the inward, we do by faith really receive the body and blood of our Lord; that is to say, we are truly and indeed made partakers of Christ crucified, to the spiritual strengthening of our inward man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Real Presence’ in Answers to a Jesuit: with other Tracts on Popery</cite>, pp. 41-73 | Ussher (p. 41):</span></figcaption>

</figure><figure class="quote" id="q-98a8c10b1e" data-kw="">
<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, (1619), pp. 33-34</span></figcaption>

</figure><figure class="quote" id="q-9438919582" data-kw="">
<blockquote><p>This toleration of drunkards and swearers in the Lord’s Church and at his Table infects and is apt to leaven all with their evil conversation, but does not leaven the worship to the fellow-worshippers, nor is the sin of private persons, yea nor of our ministers, who have not power to help it (but it is the fault of the Church), except you make no separation from a Church where a scandalous person is tolerated (for suffering more or fewer does not vary the species) to be a sin publicly to be repented, before any can be members of your Church, which is prodigious to us.</p></blockquote>

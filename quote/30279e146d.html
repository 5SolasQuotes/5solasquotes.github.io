<blockquote><p>To that which is asked about the work of mercy, it must be said that it is more proper to God to show mercy, because for the work of mercy nothing is required except God’s goodness; but for Him to exercise the severity of justice, our iniquity is presupposed; and therefore the former is more appropriated to God Himself than the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1, dist. 47, doubt 1 tr. AI by The Faith Received</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c387c9c582" data-kw="">
<blockquote><p>Jonah would not have shrunk from God’s command, had he been sent to the Ninevites to teach what he had been ordered to do among the chosen people. Had then a message been committed to Jonah, to set forth a gracious and merciful God to the Ninevites, he would not have hesitated a moment to offer his service. But as this express threatening, Nineveh shall be destroyed, was given him in charge, he became confounded, and sought at length to flee away rather than to execute such a command. Why so? Because he thus reasoned with himself, “I am to denounce a near ruin on the Ninevites; why does God command me to do this, except to invite these wretched men to repentance? Now if they repent, will not God be instantly ready to forgive them? He would otherwise deny his own nature: God cannot be unlike Himself, He cannot put off that disposition of which He has once testified to Moses [Ex. 34]. Since God, then, is reconcilable, if the Ninevites will return to the right way and flee to him, He will instantly embrace them: thus I shall be found to be false in my preaching.</p></blockquote>

<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: … 2. The nexus which intervenes between knowledge and will also demands that what one knows with the consciousness of knowledge, he also acknowledge according to the dignity and goodness of the thing which he observes in it; to which, attending, an intellectual being also tends and is borne toward it as toward a good thing—which belongs to the will. But this has place much more and more eminently in God, whose intellect, the more perfect it is, so much the more distinctly represents to His most absolute thought the truth and goodness of things in their objects: which things, when He approves, He wills well.</p></blockquote>

</figure><figure class="quote" id="q-57dee6ee5a" data-kw="">
<blockquote><p>[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-larkham.html">Thomas Larkham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Attributes of God Unfolded &amp; Applied</cite>, ... (London: Eglesfield, 1656) Larkham (1602–1669) was an English puritan clergyman and settler in New England., pp. 103-4</span></figcaption>

iserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.”

od+is+angry.+In+like+manner+when+we+see+the+%5Bhurtful%5D+rod+taken+of+and+cast+into+the+fire+%28which+is+an+effect+of+mercy%29+we+say+God+is+merciful.+But+mercy+in+God+signifies+two+things%3A+First%2C+an+inclination+in+his+heavenly+Majesty+to+show+mercy.+Secondly%2C+the+effects+of+his+supposed+affection%2C+which+is+his+helping+of+the+miserable+creature%2C+or+a+making+out+of+God+to+such+as+have+need+of+help+and+pity.+The+affection+of+mercy+in+men+is+known+by+that+grief+that+accompanies+it+%28Tanquam+a+nobis+notiori+vertus+ipsa+nomen+traxit%29%2C+but+such+a+companion+of+mercy+cannot+be+in+God.+O+mercy+is+a+glorious+attribute+of+God%2C+He+is+a+very+sea+of+mercy%2C+He+is+never+dry.+Amongst+men+he+that+is+fullest+of+pity+is+but+a+drop+of+it.+Their+pity+falls+infinitely+short+of+what+is+in+God.+And+this+mercy+of+God+is+either+general+to+all+his+creatures+or+special+unto+mankind+or+more+special+and+peculiar%3A+that+whereby+He+is+said+to+be+merciful+to+his+elect+unto+eternal+life+and+%5Bgives%5D+freedom+from+the+wrath+to+come.%E2%80%9D%0A%0A%E2%80%94+Thomas+Larkham%2C+The+Attributes+of+God+Unfolded+%26+Applied...+%28London%3A+Eglesfield%2C+1656%29+Larkham+%281602%E2%80%931669%29+was+an+English+puritan+clergyman+and+settler+in+New+England.%2C+pp.+103-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57dee6ee5a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57dee6ee5a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Margin%3A%5D%20%28What%20mercy%20is%20in%20God,freedom%20from%20the%20wrath%20to%20come&amp;text=Margin%3A%5D%20%28What%20mercy%20is%20in%20God%3A%20Miseri%20cordia&amp;text=and%20%5Bgives%5D%20freedom%20from%20the%20wrath%20to%20come" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

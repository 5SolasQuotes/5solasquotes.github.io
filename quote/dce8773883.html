<main class="wrap"><figure class="quote" id="q-dce8773883" data-kw="">
<blockquote><p>But suppose the statute is immoral, requiring of the citizen an act of omission properly a sin; how shall a free conscience then act? I answer: It asserts its higher law by refusing to be accessory to the sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Philosophy</cite>, (Mexico, MO, 1897), p. 390</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6cfc349ce3" data-kw="">
<blockquote><p>Fourthly, the flux and reflux (so to speak) of several successive [seatings of] tables [for the Lord’s Supper in one congregation], where there is a great number to communicate, and the repeating, or pronouncing and applying to those several tables of receivers, the words, ‘Take ye’, ‘eat ye’, which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ, when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they [the Independents] who so charge us [the presbyterians], ever make good what they allege, unless they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection [1 Cor. 15:6] (suppose I say, there had been so many communicants), yet He had given them all at once the elements, and had said but once, ‘Take ye, eat ye’, and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), ch. 18, ‘Of the Use of a Table in the Lord’s Supper’, p. 221</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-7b6f423734" data-kw="">
<blockquote><p>In all religious commands there must appear to the person that obeys some reason from a divine command; either particularly or generally requiring the thing. The mere will and authority of an another in these things is not reason enough to justify our obedience. In matters of that nature we must be very wary of idle and superfluous actions. To be of no use and insignificant is enough in worship to make a gesture or action sinful, yea, and an appropriated habit [garment] too. There lies no necessity upon the superior to command any such things, nay, to do it will be a sin unto him, as Gideon’s ephod was a snare to his house, Judg. 8:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reasonable Account why some Pious, Nonconforming Ministers in England Judge it Sinful for them to perform their ministerial acts</cite>, … (London: 1679), ch. 4, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-d6816a2724" data-kw="">
<blockquote><p>The gross impiety of which they had been accused was now well refuted; and yet they seem not to have been in every respect free from blame, because the Law forbids the erection of any kind of statues. It is easy, however, to excuse this by saying, that no kind of statues are condemned except those which are intended to represent God. To erect a heap of stones as a trophy, or in testimony of a miracle, or a memorial of some signal favor of God, the Law has nowhere prohibited. (Exodus 20:4; Leviticus 26:1; Deuteronomy 5:8) Otherwise, Joshua and many holy judges and kings after him, would have defiled themselves by profane innovation. But the only thing displeasing to God was to see the minds of men drawn hither and thither, so as to worship him in a gross and earthly manner. The children of Reuben, Gad, and Manasseh do all that is required for their exculpation, when they declare that they would use the altar only as a bond of brotherly union; and add a sufficient reason…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Joshua</cite>, 22 | v. 26</span></figcaption>

</figure><figure class="quote" id="q-2bd00eaff6" data-kw="">
<blockquote><p>In that [Independent] church also the doctrine of extreme unction was so far brought back that they began to anoint their sick with oil (PP); taking it as an ordinance of Christ, and a kind of a sacrament for the people, at least a holy ceremony, no less of divine institution than ordination and imposition of hands were for officers (QQ.)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8218f4a904" data-kw="">
<blockquote><p>And if the judgment of Voetius, Amesius and other learned men against all lusory [gaming] lots be of no authority, at least it should move you that even Mr. Gataker, and other that write for the lawfulness of them in that respect (as lusory lots) do yet lay down the rest of the requisites to make them lawful, which utterly condemn our common use of cards and dice, much more our gamesters: So that all the sober divines that ever I read or heard, condemn all these? And are you wiser than all of them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works</cite>, … (London: White, 1673), pt. 1, ch. 10, pt. 2, ‘Directions about Sports &amp; Recreations, &amp; Against Excess &amp; Sin Therein’, p. 462 Baxter was an English congregationalist puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38f6f0c33e" data-kw="">
<blockquote><p>The third kind of plays are mixed, which stand partly of hazard, and partly of wit, and in which hazard begins the game, and skill gets the victory: and that which defective by reason of hazard, is corrected by wit. To this kind are referred some games at the cards and tables. Now the common opinion of learned Divines is, that as they are not to be commended, so they are not simply to be condemned, and if they be used, they must be used very sparingly. Yet there be others that hold these mixed games to be unlawful, and judge the very dealing of the cards to be a lot, because it is a mere casual action. But (as I take it) the bare dealing of the cards is no more a lot, than the dealing of an alms, when the Prince’s almner puts his hand into his pocket, and gives, for example, to one man six pence, to another twelve pence, to another two pence, what comes forth without any choice. Now this casual distribution is not a lot, but only a casual action. And in a lot there must be two things. The first is, a casual act: the second, the applying of the foresaid act, to the determination of some particular and uncertain event. Now the dealing of the cards is a casual act; but the determination of the uncertain victory is not from the dealing of the cards in mixed games, but from the wit and skill, at least from the will of the players. But in things that are of the nature of a lot, the wit and will and a man has no stroke at all. Nevertheless, though the dealing of the cards and mixed games be no lots; yet it is far safer and better to abstain from them, than to use them, and where they are abolished, they are not to be restored again, because in common experience, many abuses and inconveniences attend upon them: and things unnecessary, when they are much abused, because they are abused, they must not be used, but rather removed, as the brazen serpent was, 2 Kings 18:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Cambridge, 1606), bk. 3, ch. 4, section 4, Question 2, ‘What kinds of recreations and sports are lawful and convenient, and what be unlawful and inconvenient?’, pp. 591-92 Perkins (1558–1602) was a leading English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-171f7303bd" data-kw="">
<blockquote><p>The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-7ca521123f" data-kw="">
<blockquote><p>Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations Divine &amp; Moral</cite>, … (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-42caf17fa2" data-kw="">
<blockquote><p>But in these games, pastimes, sports and plays at cards and dice, there is a certain distinction to be used. For, some of them are after such a sort played and passed over, that to the winning and obtaining of the victory, honest industry of the mind helps more than any blind casualty or chanceable hazard: insomuch that the awkward luck which falls out contrary to desire is supplied, amended and reformed by art and cunning. These kinds of play may not properly be termed ‘alea’ [chance] or hazardry, neither are they absolutely to be forbidden: only let measurable mean therein be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 6, ‘What the meaning of this word ‘Alea’ [Chance] properly is: and what Games &amp; Plays are contained and comprehended under the name thereof’ in A Discourse of Gaming, and Specially of Dice-Play in True &amp; Christian Friendship… Together also with a right excellent Invective… against the wicked exercise of diceplay, and other profane gaming (London: Veale, 1586) no page numbers</span></figcaption>

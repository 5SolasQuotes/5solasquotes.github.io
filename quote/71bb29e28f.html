<main class="wrap"><figure class="quote" id="q-71bb29e28f" data-kw="">
<blockquote><p>…to punish, is to inflict malum disconveniens naturae, an evil contrary to nature; but, in appointing rulers and in agreeing to laws, they [the people] consent they shall be punished by another, upon supposition of transgression, as the child willingly going to school submits himself in that to school discipline, if he shall fail against any school law;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 46">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6to+punish%2C+is+to+inflict+malum+disconveniens+naturae%2C+an+evil+contrary+to+nature%3B+but%2C+in+appointing+rulers+and+in+agreeing+to+laws%2C+they+%5Bthe+people%5D+consent+they+shall+be+punished+by+another%2C+upon+supposition+of+transgression%2C+as+the+child+willingly+going+to+school+submits+himself+in+that+to+school+discipline%2C+if+he+shall+fail+against+any+school+law%3B%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+46&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F71bb29e28f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/71bb29e28f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=to%20punish%2C%20is%20to%20inflict%20malum,shall%20fail%20against%20any%20school%20law&amp;text=to%20punish%2C%20is%20to%20inflict%20malum%20disconveniens%20naturae&amp;text=if%20he%20shall%20fail%20against%20any%20school%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b2ec6718f" data-kw="">
<blockquote><p>4. Personal power in man is the first; family power is the next; city and kingdom power supposes these and cannot destroy them. Hence subjects that are not mere slaves stand up to plead for their personal and domestic property, liberty and power, if my money, and limbs and life be not at the patron’s or the prince’s will, much less my soul. He is trusted with my estate and life; but I am first and more trusted with them. He may keep out ill physicians from the land, and encourage the good, but he has no power to tie me to an ill physician, nor to an ill diet, nor to ill servants, etc. The choice of these belongs to myself… I will not believe that the patron loves me and all the parish better than we love ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Answer to Dr. Edward Stillingfleet’s Charge of Separation</cite>, … (London: 1680), ‘A Reply to Dr. Stillingfleet’s Letter’, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-765006402a" data-kw="">
<blockquote><p>XXVII. Self-interest, self-Government and family-government are all antecedent to publick government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>

</figure><figure class="quote" id="q-ccc7c0d20b" data-kw="">

</figure><figure class="quote" id="q-fc6269b215" data-kw="">
<blockquote><p>The pursuit of covenanted uniformity [in 1643] aimed to compensate for the withering cooperation within the Anglo-Scottish relationship and the emergence of a fully anglocentric approach to the relationship between the Three Stuart Kingdoms. The priorities of an Independent minority at Westminster became paramount characterised by the emergence of a private interest at the expense of the public interest.</p></blockquote>

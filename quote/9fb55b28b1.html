<main class="wrap"><figure class="quote" id="q-9fb55b28b1" data-kw="">
<blockquote><p>We ought not to worship God with any other external Worship, than what himself hath commanded and appointed us in his holy Word.

The Scripture hath set us our Bounds for Worship, to which we must not add, and from which we ought not to diminish; for whosoever doth either the one or the other, must needs accuse the Rule either of Defect in things necessary, or of Superfluity in things unnecessary: which is an high Affront to the Wisdom of God, who as he is the Object, so he is the Prescriber of all that Worship which he will accept and reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London: Nathanael Ranew, 1692), pp 126-27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

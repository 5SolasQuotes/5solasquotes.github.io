<main class="wrap"><figure class="quote" id="q-e77cb7cd4e" data-kw="">
<blockquote><p>As to my studies, when I was settled in Simprin, I had very few books; which occasioned my borrowing, as I had access; and moreover, where I wanted to be satisfied in some particular points, obliged me to think of the same, if so I could find out what to rest satisfied in, not having access to consult many authors. And thus my scarcity of books proved a kind disposal of providence towards me; I, in that method, arriving at a greater distinctness and certainty in these points, than otherwise I could readily have obtained. The chief of these points I wanted to be satisfied in, were two; namely, the doctrine of the grace of God in Christ, and the subject of baptism.

As for the doctrine of grace, how the Lord was pleased to give my heart a set toward the preaching of Christ, and how I had several convictions of legality in my own practice, is already narrated. I had heard Mr. Mair often speak of being divorced from the law, dead to it, and the like; but I understood very little of the matter. Howbeit, my thoughts being, after my settlement at Simprin, turned that way, that I might understand somewhat of these things; some light, new to me, seemed to break up from the doctrine of Christ; but then I could not see how to reconcile the same with other things which seemed to be truth too. And I think, that among these first my s of light, was a notion, that the sins of believers in Christ, even while yet not actually repented of, did not make them, being in a state of grace, liable to eternal punishment. And on this head I did, by a letter, consult Mr. Murray in Penpont; but was not thoroughly satisfied with what he advanced upon it.

Meanwhile, being still on the scent, as I was sitting one day in a house of Simprin, I espied above the window-head two little old books; which when I had taken down, I found entitled, the one “The Marrow of Modern Divinity,” the other, “Christ’s Blood Flowing Freely to Sinners.” These I reckon had been brought home from England by the master of the house, a soldier in the time of the civil wars. Finding them to point to the subject I was in particular concern about, I brought them both away. The latter, a book of [John] Saltmarsh’s, I relished not; and I think I returned it without reading it quite through. The other, being the first part only of the Marrow, I relished greatly; and having purchased it at length from the owner, kept it from that time to this day; and it is still to be found among my books. I found it to come close to the points I was in quest of; and to shew the consistency of these, which I could not reconcile before; so that I rejoiced in it, as a light which the Lord had seasonably struck up to me in my darkness.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13395f7f0e" data-kw="">
<blockquote><p>Because, where the doctrine itself is sound and pure, and the ceremonies used to a civil honesty and decency, the inconveniences are rather to be passed by in silence than that by occasion of them men should proceed to contentions and more grievous tumults; Calvin, Epistle 303, fol. 497. Because, albeit these things be not to be approved, yet, sometimes these indifferent things, howsoever offensive and burdensome, are to be born withal, so far forth (quoad aliter non liceat) as conveniently we cannot do otherwise, lest if men contend about them more bitterly then they ought, it be both an hindrance to the progress of the Gospel, and the things which in their own nature are indifferent, be taught by our vehement contention to be plainly wicked; which two points do bring with them most grievous inconveniences; P. Martyr to [John] Hooper, Common Places, folio 1086 [p. 117]. And therefore these things which the pastors cannot change, they should rather bear withal, than by forsaking the Church for that cause they should give occasion for far greater and more dangerous mischiefs unto Satan, who seeks nothing else; Beza, Epistle 12, fol. 99. … Because we must give place unto the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience, Acts 28:11; 19:10, 26; 15:28-29; Master [William] Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 482-83. Because if we cannot do the good that most we desire, in such exquisite manner as we would, we must content ourselves with the mean, and in things which are good and to be done, it is the safest course to satisfy ourselves in doing the less, lest in venturing to do the more, which cannot be, we grow to the extremity, and so fail or offend in our action, Eccl. 7:16; read the proofs: Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 483-86.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 163-65</span></figcaption>

<blockquote><p>And where greater unity is most desirable, it must first be considered how much of it is possible, or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world. … It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>

<blockquote><p>§ 53. But how comes it to pass then, that these blessed means of grace, these conveyances of the Spirit are so often ineffectual? Many men do daily pray, often hear and read the Word of God, have been engraffed into the body of Christ by baptism, and many times receive the blessed eucharist, and yet little or no news do they hear of the Spirit, very little stirrings of the heart, few good motions do they feel within, they are never the better, nor a whit the more enriched, either with spiritual gifts or graces for the use of these means: The cause whereof is the hardness of man’s heart, which receives not the impressions of the Spirit; the corruption of man’s nature, which quenches the sacred fires of piety and charity, before they be well enkindled in the soul; the exorbitant and unruly lusts of the flesh, and of the world, which resist the good motions, lustings, and strivings of the Spirit of God. Intus existens prohibet alienum; when the fruits of the flesh have overgrown the soul, there’s no room for the fruits of the Spirit to take rooting there: These two kinds of fruits cannot grow both in one heart, but the one will choak, overgrow, and destroy the other. To this outward means of grace then, and of the Spirit, the inward qualifications, the infitting of the soul to receive the impressions of the Spirit must be added…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel</cite>, … with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman., pp. 152-53</span></figcaption>

<blockquote><p>1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26)… Neither will it salve the business, to say, there is a voluntas signi [will of sign] in all this; for what is voluntas signi, if it be not signum voluntatis [asign of the will]? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart? When God makes his great gospel supper, and says, ‘Come, for all things are ready;’ he is not, he cannot be like him with the evil eye, who says, Eat and drink, but his heart is not with thee, (Prov.xxiii.6.7.) No, God’s heart goes along with every offer of grace; he never calls, but in a serious manner.</p></blockquote>

<blockquote><p>II. This punishment (this disobedience having been posited) the divine nature first of all requires, for God is a consuming fire who cannot bear sin (Deut 4:24, Hab 1:13). Yet we do not want God to act irrationally (just as elementary fire), but most rationally, concomitantly to his nature but not antecedently, for he is a rational and intelligent fire who, although he can transfer the burning to another combustible thing, yet cannot suspend it totally:

      1. Because God hates and abhors sin to the utmost, and hatred (like all affections) belongs to God according to its effects, and signifies in him 1) opposition to the hated thing, 2) rejection and damnation and grave punishment of the one who perpetrates that hated thing, as even Vorstius teaches (Notes on Disp. 10 on God, thesis 20).

      2. God as the best being, by necessity of nature is zealous for his own glory, which is the end of all his actions, which does not happen unless by vindicating the contempt of himself which he suffers through sin, which is not expiated except through punishment.

      3. The supreme Lord by necessity of nature requires supreme acknowledgment of himself, which is denied to him through sin, which cannot be repaired except through the acknowledgment of the despiser by which he may experience how grave and sad is the contempt of his master. And these things are so true that even in civil affairs, neglect of his majesty cannot consist with the supreme magistrate; nor therefore through this is God rendered impotent, as the Socinian Gitichius deduces from this (Against Lucius, Argument 2). For he cannot deny himself (2 Tim 2:13) nor his glory. Secondly, the truth of the divine threats, by which the highest torments await sinners, demands this punishment (see the previous thesis).

III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied. But what can man do for this? His demerit is infinite (by the previous thesis)… IV… Hence fall:

      1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.).

      2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

      3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

      4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. Onku with AI (Utrecht, 1650) Latin</span></figcaption>

— Johannes Hoornbeeck, ‘Theological Disputation on the Satisfaction of Christ’, tr. Onku with AI (Utrecht, 1650) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+This+punishment+%28this+disobedience+having+been+posited%29+the+divine+nature+first+of+all+requires%2C+for+God+is+a+consuming+fire+who+cannot+bear+sin+%28Deut+4%3A24%2C+Hab+1%3A13%29.+Yet+we+do+not+want+God+to+act+irrationally+%28just+as+elementary+fire%29%2C+but+most+rationally%2C+concomitantly+to+his+nature+but+not+antecedently%2C+for+he+is+a+rational+and+intelligent+fire+who%2C+although+he+can+transfer+the+burning+to+another+combustible+thing%2C+yet+cannot+suspend+it+totally%3A+1.+Because+God+hates+and+abhors+sin+to+the+utmost%2C+and+hatred+%28like+all+affections%29+belongs+to+God+according+to+its+effects%2C+and+signifies+in+him+1%29+opposition+to+the+hated+thing%2C+2%29+rejection+and+damnation+and+grave+punishment+of+the+one+who+perpetrates+that+hated+thing%2C+as+even+Vorstius+teaches+%28Notes+on+Disp.+10+on+God%2C+thesis+20%29.+2.+God+as+the+best+being%2C+by+necessity+of+nature+is+zealous+for+his+own+glory%2C+which+is+the+end+of+all+his+actions%2C+which+does+not+happen+unless+by+vindicating+the+contempt+of+himself+which+he+suffers+through+sin%2C+which+is+not+expiated+except+through+punishment.+3.+The+supreme+Lord+by+necessity+of+nature+requires+supreme+acknowledgment+of+himself%2C+which+is+denied+to+him+through+sin%2C+which+cannot+be+repaired+except+through+the+acknowledgment+of+the+despiser+by+which+he+may+experience+how+grave+and+sad+is+the+contempt+of+his+master.+And+these+things+are+so+true+that+even+in+civil+affairs%2C+neglect+of+his+majesty+cannot+consist+with+the+supreme+magistrate%3B+nor+therefore+through+this+is+God+rendered+impotent%2C+as+the+Socinian+Gitichius+deduces+from+this+%28Against+Lucius%2C+Argument+2%29.+For+he+cannot+deny+himself+%282+Tim+2%3A13%29+nor+his+glory.+Secondly%2C+the+truth+of+the+divine+threats%2C+by+which+the+highest+torments+await+sinners%2C+demands+this+punishment+%28see+the+previous+thesis%29.+III.+Hence+if+any+are+vindicated+from+this+servitude+%28as+it+is+certain+that+all+the+elect+have+been+and+will+be+vindicated%29%2C+it+is+necessary+that+this+acknowledgment%2C+that+is%2C+the+restitution+of+honor%2C+be+exhibited+to+the+supreme+Lord+and+Ruler+injured+and+offended+by+our+disobedience%2C+and+that+his+laws+and+exactions+be+satisfied.+But+what+can+man+do+for+this%3F+His+demerit+is+infinite+%28by+the+previous+thesis%29%E2%80%A6+IV%E2%80%A6+Hence+fall%3A+1.+The+mimicry+of+the+Socinians+arguing+against+the+satisfaction+of+Christ+from+the+gratuitous+remission+made+to+us%2C+and+refuting+our+arguments+for+it+%28see+Socinus%2C+De+Servatore%2C+part+3%2C+ch.+2%2C+and+Praelections+ch.+117%2C+%C2%A75%3B+Volkelius+and+Gitichius+ibid.%29.+2.+Their+argument+from+Eph+4%3A32+that+we+ought+to+forgive+our+brothers+as+God+has+forgiven+us.+Right%21+Gratuitous+remission+has+come+about+for+us%2C+but+on+account+of+Christ%E2%80%99s+satisfaction+%E2%80%9Cin+Christ%E2%80%9D+%28as+the+Apostle+adds+there%29%2C+through+whose+blood+we+have+remission+of+sins+from+the+riches+of+divine+grace+%28Eph+1%3A7%29.+Indeed%2C+what+is+clearer+for+the+possibility+of+composing+most+strict+satisfaction+and+gratuitous+remission+than+the+example+of+Paul+entreating+remission+for+Onesimus+and+offering+his+own+payment+%28Philem+10%2C12%2C18-19%29%3F+3.+Nor+is+the+transfer+of+our+obligation+to+Christ+repugnant+to+divine+justice+%28as+Socinus+argues%2C+part+3%2C+ch.+3%29.+It+is+indeed+essential+to+sin+that+it+be+set+in+order+through+punishment%2C+but+it+is+not+essential+that+it+be+vindicated+in+the+very+one+who+sinned.+For+God+is+placated+provided+that+esteem+is+restored+to+him+and+his+laws+satisfied+%28for+in+these+he+was+injured%2C+by+Thesis+1%29.+But+this+is+done+through+Jesus+Christ%3B+indeed%2C+it+can+be+done+through+him+alone%2C+because+he+alone+has+order+and+proportion+with+God.+4.+Nor+does+it+oppose+the+truth+of+%5BGod%E2%80%99s%5D+threats+%28as+Socinus+ibid.%29%2C+since+that+too+is+preserved+provided+that+someone+sponsors+for+those+who+sinned.+They+indeed+have+this+from+transgression%2C+that+they+are+under+obligation+to+punishments%2C+but+it+is+not+required+that+the+transgression+actually+be+vindicated+in+them%2C+as+was+just+said.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98Theological+Disputation+on+the+Satisfaction+of+Christ%E2%80%99%2C+tr.+Onku+with+AI+%28Utrecht%2C+1650%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fba8359bcde.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ba8359bcde.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-justice-of-god/#:~:text=II.%20This%20punishment%20%28this%20disobedience%20having,in%20them%2C%20as%20was%20just%20said&amp;text=II.%20This%20punishment%20%28this%20disobedience%20having%20been%20posited&amp;text=be%20vindicated%20in%20them%2C%20as%20was%20just%20said" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-840df9d4d5" data-kw="">
<blockquote><p>It’s much worthy of observation, how that sweet evangelic invitation is conceived, Isa. 55:1… For the interjection, ‘Ho’, is a mark of sorrowing, as ‘ah’, or ‘woe, everyone that thirsts’. It expresses two things: 1. A vehemency and a serious and unfeigned ardency of desire that we do what is our duty, and the concatenation of these two, extremely desired of God, our coming to Christ and our salvation. This moral connection between faith and salvation is desired of God with his will of approbation, complacency, and moral liking, without all dissimulation, most unfeignedly [margin: What the revealed will of God is]; … …we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect though not any one of men or angel obey… We are hence taught to acknowledge no love to be in God which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good… yet does not the Lord’s general love fall short of what He wills to them.</p></blockquote>

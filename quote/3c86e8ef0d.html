<main class="wrap"><figure class="quote" id="q-3c86e8ef0d" data-kw="">
<blockquote><p>Question. Wherein stands the eternity of the Covenant of Grace? And what other properties there be of the Covenant? Answer. The Law and Covenant of Works is a rule of everlasting righteousness, and so may be called an everlasting righteousness, containing precepts of the Law of nature intrinsically good, such as to know love, fear, trust in Him as the only true God: and in this sense it is an eternal Covenant. But 1. it is not eternal in the positives of the Second, and Fourth, and Fifth Commands, the way of worship, the means, as ceremonies, Sabbath, magistracy, and such like, which are not to continue in the life to come, and so neither faith nor hope in God through Christ, 1 Cor. 13:13; Rom. 8:24-25; 2 Cor. 5:7, nor a Temple, nor ordinances, nor the Kingdom of Christ as now dispensed are to be the binding rule for eternity to such as are confederates of the Covenant of Grace, Rev. 21:22,23; 1 Cor. 15:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh, 1655), p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 19, Creation, p. 344</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>6. The question concerning particular works, or permitted recreations, is wholly useless and trifling: for quod lege prohibitoriâ vetitum non est, permissum intelligitur, says the law: all that is permitted which in the negative precept is not forbidden: But as for some persons to give themselves great liberties of sport on that day is neither pious nor prudent; so to deny some to others is neither just nor charitable. The plowman sits still in the Church and the Priest labours; and the wearied man is permitted to his refreshment, and others not permitted because they need it not (Ordinary Gloss on Mt. 28); and there is no violation of any commandement of God, even when there is a profanation of the day indulged upon pious and worthy considerations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 366</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

olasquotes.github.io%2Fquote%2F81490dfea0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/81490dfea0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=6.%20The%20question%20concerning%20particular%20works,indulged%20upon%20pious%20and%20worthy%20considerations&amp;text=6.%20The%20question%20concerning%20particular%20works%2C%20or%20permitted&amp;text=the%20day%20indulged%20upon%20pious%20and%20worthy%20considerations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. Hence that the body may be fit to discharge these duties aright there is something to be done for it on that Day. The body has a dependence on means for the maintaining of the vigor and activity of it whereby it may be fit to attend the service it is appointed to without tiring, fainting or giving in: and it stands in need of this as well for Sabbath service, as for the business of this life; for we are to do these with our might, as well as the other: whatsoever is requisite for this, must be very proper for the Day…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity</cite>, … (Boston, 1726), Sermon 172, Q. 60, pp. 584-88</span></figcaption>

<blockquote><p>…young men who would ‘endure long and hard labor in so much that after twelve hours hard work they will go in the evening to football, stoole ball, cricket, prison-base, wrestling, cugel throwing, or some such like vehement exercise.&#x27;” 7 Richard Baxter maintained that the argument from lack of spare time on week-days was a “sad argument to be used by them that by racking of rents do keep them (laboring people) in poverty.”8 The Puritan protest against Sabbath profanation was also a protest against overwork on the other six days of the week. But the truth is, it is not the minds of poor laboring men, that are overworked and tired on week-days, but it is their bodies; and therefore there is no recreation so suitable to them as the ease of the body, and the holy and joyful exercise of the mind, upon their Creator, and their Redeemer, and their everlasting rest.9 1 Bownd, Sabbathum Veteris, p. 271; cf. Dudley Fenner, A Short and Profitable Treatise, of lavvful and unlavvful Recreations; William Perkins, 1558-1602: English Puritanist, ed. by Thomas F. Merrill (Nieuwkoop, 1966), pp. 217-22 with extracts from Perkins’ The Whole Treatise of Cases of Conscience, Book 3. 2 Elton, An Exposition of the Ten Commandments, pp. 54-56; George Walker, The Doctrine of the Holy Weekly Sabbath (London, 1641), p. 157; Richard Baxter, The Divine Appointment of the Lord’s Day, pp. 440, 444-445. 3 Cf. Nicolas Bifield (Byfield), The Beginning of the Doctrine of Christ, or, A Catalogue of Sinnes (London, 1636), p. 63. 4 For a survey of the relative truth of this point, see Carl Bridenbaugh, Vexed and Troubled Englishmen, 1590-1642 (New York, 1968), pp. 109-118. 5 John Dod and Robert Cleaver, A Plaine and Familiar Exposition of the Ten Commandments (London, 1628), p. 140. 6 Percy Scholes (The Puritans and Music in England and New England(London, 1934), pp. 104-111) mentions the provisions of a bill presented to Parliament in 1647 which allowed every other Tuesday to be designated as a holiday. Scholes’ judicious treatment of the Puritan attitude toward recreation is refreshing as well as accurate; cf. also pp. 302-331. Compare Hugh Martin, Puritanism and Richard Baxter (London, 1954), pp. 101-106. 7 Bridenbaugh, Vexed, p. 115. 8 Baxter, Divine Appointment, p. 444. 9 Ibid., p. 445.</p></blockquote>

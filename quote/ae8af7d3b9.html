<main class="wrap"><figure class="quote" id="q-ae8af7d3b9" data-kw="">
<blockquote><p>A Church without government must be a Church without order and without power. Even a State, to be powerful and united, must be well governed. If there be government, there must be the rulers and the ruled. If there are no rulers, or if all are rulers, there is no government; and if there is no government, unity breaks up, compactness is gone, discipline is impossible, purity is hopeless.

The moment two or three are gathered together in the name of Jesus, government begins; and when the two or three are multiplied, then government develops itself, and the necessity for the control of law and for the recognition of some to carry out that law becomes indispensable. If all things in the Church are to be done decently and in order, law and administration must step in, otherwise every man will do what is right in his own eyes.

In the Church, as in the State, there have been in all centuries two extremes of rule — despotism and socialism. Did the Head of the Church mean either of these? Do we find, either in His own words or in those of His apostles, any intimation of these? He meant His Church to be governed. Has He anywhere indicated His purpose that it should be governed by one or governed by all?

Perhaps the ecclesiastical tendencies of our day do not favour the former so much as the latter, yet still it is needful that these two opposing governmental systems should be examined. It may be found that there is a more excellent way than either, a way which preserves all that is good in both, and yet exhibits something more perfect, more sufficient, and more scriptural than they.</p></blockquote>

<blockquote><p>The late patrons of Anabaptism among us would make the world believe that this Sect had for its Author the famous Berengarius, and for its fomenters four hundred years ago, the old prede­cessors of Protestants, commonly called Albi­genses: but who will be pleased to consult the fountain of this allegation shall find Berengarius absolved from this crime by that very mouth whence alone the slander did proceed. Bishop Guitmund lays on the back of Deacon Beren­garius the load of so many contumelies as he is able to invent, only for his boldness to oppose the common Doctrine of that time, the corporal presence of Christs body in the bread of the Sacrament: among other things he challenges him for the deny­ing baptism to infants, but if any should require a proof this heavy charge, Guitmund professes that none can be given, avow­ing that Berengarius did never bring any such Doctrine in pub­lic, knowing that no Scripture could be alleged for it, and that no creature would take such an absurdity from his hand (A); Ju­stice therefore does require that Berengarius be freed of that crime, since his very adversary confesses that it was never made appear by any known profession; for crimes that appear not are reputed by just men as not existing (M. Tombes, Ex­amin. p. 20, 21). Concerning the Albigenses, the man that lays the slander of Anabaptism upon them is Petrus Cluniacensis, but how unjustly I offer to be considered not only from this general very true and confessed ground, that the Popish Writers of that time do charge these honest and pious men of Albi with many both errors and crimes, whereof all equitable men believe them to have been most innocent; but also from three particular observations: First, they are not challenged by Cluniacensis as direct and express deniers of paedobaptism, but for their affirming the impossibi­lity of infants believing, and of their impossible salvation with­out faith, he alleges upon them by way of consequence, that they did also maintain the Baptism of infants to be unprofitable and null (B). The learned know how much uses to be said against the burdening of men with all the consequents of their tenets, espe­cially when the party rejects them, and the things themselves have no necessary dependence. Secondly, the antecedent where­upon this consequent is builded, we much doubt if ever it came in the thoughts of the Albigenses. That these gracious and ortho­dox men should have been so absurd as to damn absolutely all infants dying in their infancy, which never any of the grossest heretics to this day did affirm; we must be pardoned to deny our belief to ten witnesses of much better faith then the Abbot of Cluny. Thirdly, that which Cassander avows in that same place helps to evidence the slander of Cluniacensis: the Waldenses were the children and immediate successors of the Albigenses, many of their writs yet extant shew how rigid and punctual observers the children were of their Fathers ways: now it is Cassander’s remark verified by the writs and known practice to this day of all the Waldenses that they have been constant paedo­baptists (C). He must therefore be a man of greater authority then any Friar or Monk of these dark times, who shall be able to persuade that their Fathers the Albigenses were against infants baptism. Wherefore notwithstanding of all which is misalleged from Cassander we may safely with all Protestant Writers affirm that the first known Fathers of Anabaptism were Nicholas Stock and Thomas Muntzer, who in the year 1522 began to sow the tares of that sect in Saxony with too great success. Neither Me­lancthon nor Ca­rolostadius did ever favor an­tipaedobaptism. What some allege of Melancthon and Carolostadius their favor towards these men, of Melancthon it is most false as many of his writs declare (D), unless it be understood of his good and extraordinary meek na­ture, whereby he was ever inclined to pity the worst of men so long as there was any hope by loving dealing to do them good. Carolostadius indeed was a rash hot headed man, and at the beginning did give too much countenance to the Anabaptists, albeit not in the point of Antipaedobaptism (E), so far as we can find; but wherein soever he favored these fanatic men, he did quick­ly repent and made his public retractions to the satisfaction of Luther’ss own mind (F). M. Tombs by all his diligence to search for ancient and renow­ned friends to his Clients the Anabaptists, does but raise dust to darken the air about himself: all who will be at the pains to consider these very testimonies which he alleges, shall find that no Divine of good fame did ever join with that sect: for the spirit that did reign therein was so evidently malignant, that a small measure of discretion did ever serve to discover and avoid him.</p></blockquote>

<blockquote><p>I know that many heap up arguments and bring us long rolls of authorities for episcopacy. And I know that Gersom, Bucer, Beza, [Calderwood’s] Altare Damascenum, Parker, Baynes, Salmasius, Blondel, Prynne (in his Catalogue of Writers against Bishops, and in his History of Bishops, pt. 2, ch. 3 and Unbishopping of Timothy and Titus), Dr. Reynolds and others do give us as long a train of arguments and authorities on the other side… but, methinks all those men that have without prejudice read the authors that I have mentioned (especially Bucer, Parker, and Blondel, and Salmasius), yea, though they have read all that ever was writ on the other side, should be so apprehensive of a difficulty in the business as to be moderate and modest in the censure of their brethren, and not to degrade or excommunicate all that differ from them. … And to have cited Calvin, Beza, Chamier, Pareus, Musculus or any of those multitudes of foreign divines that are known to be against them would have been labor in vain; and so it would have been to have cited Reynolds, Whitaker, Dr. Humphrey and such like at home, who are some known to be against them, and some no fast friends to them.</p></blockquote>

</figure><figure class="quote" id="q-833dd0b898" data-kw="">
<blockquote><p>PATRONAGE is usually defined to be the exercise of a power of presentation to a Church, which power is held solely in virtue of some secular qualification, such as inheritance or purchase. … In a matter relating to the appointment of the office-bearers of the Church, our ultimate appeal must be “to the law and to the testimony.” Were it true, as some allege, that Scripture lays down no general principles or definite rule, for the guidance of the Church in the election of her office bearers, this matter would fall to be regulated by an enlightened regard to utility; but we trust to make it plain in the course of the following observations, that we are not left by Scripture altogether in the dark, in a matter which so nearly concerns the interests of the Church.

Amid much that is distressing and painful in the circumstances in which the Church of Scotland is now placed in its relations with the Civil Power, it is matter of sincere gratification that these very circumstances are forcing her office-bearers and members back upon first principles—constraining them to abandon all temporizing shifts and expedients, and to take their stand upon the broad and sure basis of the everlasting and unchangeable word of God.

It was a great step in advance towards right principles which the General Assembly made in 1834, when the old doctrine of Non-intrusion was asserted, and effective steps taken to have that principle carried into operation in every case of settlement. It was a still further and more gratifying advance in the same direction, when, five years thereafter, the Assembly took up the language, and resumed the tone of the ancient Assemblies of the Church, and declared the free and unfettered prerogatives which the Lord Jesus Christ, as King and Head of his Church, had conferred upon her.

It is impossible to attach too much importance to this declaration, whether we regard it merely in the light of a testimony in behalf of a great scriptural truth, or as the most healthful indication which could have been afforded, that the Church of Scotland, after a long and dreary period of defalcation, had rid herself of the notion, which lay upon her like an incubus, and paralysed her energies, that she was a mere civil corporation, existing for civil ends.

This idea, fostered under the reign of Moderatism, and forming indeed the very essence of it, had wrought most deadly mischief, not only as regarded the matter of settlement, in which the great thing to be considered was, not the “perfecting of the Saints,” but the following out of the will of the patron; but also as regarded the matter of preaching, in which the great thing to be considered was, not the winning of souls to Christ, but the rearing up of good citizens, on the basis of a cold and secular Morality.

One thing only remains, so far as regards the assertion of principles, to set the Church upon the platform of her ancient standards, and that is, to re-declare the indefeasible right of the members of the Church to elect their own office-bearers. This principle appears necessarily to flow from that of the spiritual independence of the Church, and it is practically one of the most important consequences which result from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

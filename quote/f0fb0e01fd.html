<blockquote><p>The Covenant of Grace first made with Adam after his fall. The liberty thereby given to man, proveth that we gain more by Christ then we lost in Adam. Of the renewing of it with Noah. The form of renewing it with Abraham, and revealing it more plainly by 7 things.

Of the renewing of it with Israel at mount Sinai and by Moses. That it is called the Old Covenant in respect of the New Covenant in the Gospel. That it is mixt of the Covenant of Works, and of the Covenant of Grace. The reasons why God in making it did renew the Covenant of Works, and mingle it with the Covenant of Grace made with man in Christ after his fall. … The agreement between the pure and plain Covenant of Grace in the Gospel, and the mixt Covenant which God made with Israel on mount Horeb, by the ministry of Moses, which consisted partly of the Covenant of Works, and partly of the Covenant of Grace.</p></blockquote>

<blockquote><p>As therefore I have showed in what sense the covenant of grace is called “the new covenant,” in this distinction and opposition, so I shall propose sundry things which relate unto the nature of the first covenant, which manifest it to have been a distinct covenant, and not a mere administration of the covenant of grace: — 1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends.</p></blockquote>

</figure><figure class="quote" id="q-ce0d0714fd" data-kw="">
<blockquote><p>God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man. Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit. The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works, which was entered into with Adam, and renewed on Mount Sinai. These two covenants indeed agree with each other in various particulars:—of both, God is the author; in both there are the same contracting parties; in both is promised eternal life and happiness: but they differ also in many respects; in the covenant of works God is considered as Creator and Lord, in the covenant of grace as Redeemer and Father; in the first there were was no mediator, in the second Christ is the Mediator; in the one God dealt with man as upright, in the other he deals with man as a sinner; the former depended on man’s own obedience, the latter depends on the obedience of Christ; in the former was promised life, namely, a state consisting of all good things; in the latter is promised salvation, which, along with life, includes also deliverance from sin and death; in the first God required works, saying, Do this and live; in the second he requires faith, saying, Believe, and thou shall be saved. The covenant of grace does indeed require works of righteousness, but not that we may merit eternal life by them; nor does the imperfection of Christian obedience, provided it be sincere, stand in the way of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 281–82.</span></figcaption>

<blockquote><p>Particularly noteworthy are his treatments of the Noahic and Mosaic covenants as integral to the overarching covenant of grace.” – Ryan McGraw . . The History of the Development of the Doctrine of the Covenant of Grace Whole of Church History eds. Waters, Reid &amp; Muether – pt. 2, chs. 14-20 in Covenant Theology: Biblical, Theological &amp; Historical Perspectives Pre (Crossway, 2020) ToC . In the Early Church Duncan, J. Ligon – The Covenant Idea in Ante-Nicene Theology PhD diss. (Edinburgh, 1995) Abstract: “This thesis argues that the covenant idea was more significant in the writings of particular ante-Nicene theologians than has generally been admitted in patristic research or general surveys of the history of the covenant idea in the Christian tradition… This investigation reveals that the covenant idea functions in several arenas of early Christian thought. It is employed (1) to stress moral obligations incumbent upon Christians; (2) to show God’s grace in including the Gentiles in the Abrahamic blessings; (3) to deny the reception of these promises to the Israel of the flesh, that is, Israel considered merely as an ethnic entity; (4) to demonstrate continuity in the divine economy; and (5) to explain discontinuity in the divine economy. In reviewing the role of early Christian covenant thought in these areas, this thesis argues that (1) the pre-Nicene theologians usually take OT covenant passages (not NT passages) as the starting point in their applications of the covenant concept to Christian living; (2) the early Christian use of the covenant idea evidences that they understood the covenant to be both unilateral and bilateral, promissory and obligatory, to bring divine blessings and entail human obedience; (3) these writings also show that, from the very earliest times, Christian authors (following OT and NT examples) have employed the covenant concept as a key structural idea in their presentations of redemptive history; (4) contrary to the suggestions of previous studies, there is no evidence of a gap in the usage of the covenant idea after the era of the NT writings; (5) the covenant idea was closely linked to the early Christian self-understanding as the people of God; (6) the covenant idea is not monolithic in the thought of the authors surveyed. It is employed with differing emphases and takes on varying shades of meaning in their respective writings… This study is significant for at least these following reasons: (1) It confirms current research on the Jewish matrix of early Christianity, from a vantage-point not yet exploited. (2) It reviews in greater detail the early Christian covenant thought which is now being acknowledged to have been influential on the sixteenth-century Reformers (such as Bullinger and Calvin). (3) As the first extensive patristic survey of the covenant idea, it fills a significant lacuna in the history of ideas…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-g-myers.html">Stephen G. Myers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God to Us: Covenant Theology in Scripture</cite>, (RHB, 2021) 368, pp. ToC</span></figcaption>

<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>

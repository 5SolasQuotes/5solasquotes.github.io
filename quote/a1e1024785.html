<main class="wrap"><figure class="quote" id="q-a1e1024785" data-kw="">
<blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect.

IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1635), ch. 27, ‘How far, and in what sense Christ died for all’, pp. 226-28</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95071b0da1" data-kw="">
<blockquote><p>How did Christ condemn and pass sentence on the wicked world in his death? 1. He did it legally, in that his offering of a sufficient ransom for sin, there is a seal put on the condemnation of all impenitent men, that they shall ‘not see life but the wrath of God’ (that they were by nature under, being the captives of the Law) ‘abides on them,’ Jn. 3:36. ‘Because they believe not in the Son of God,’ Jn. 16:9. Christ’s dying day was the unbelievers’ doomsday.</p></blockquote>

</figure><figure class="quote" id="q-42f7ff9a1c" data-kw="">
<blockquote><p>Position 1. As there is no merit, good deserving, work or hire in the miserable sinner dying in his blood, dead in sins, out of his wit and disobedient, deceived and serving diverse lusts, Eze. 16:4-8; Eph. 2:1-4; Tit. 3:3-4, so there is as much love, man-kindness and free grace in heaven in the breast of Christ as would save all in hell, or out of hell. I speak this in regard, not of the Lord’s intention, as if He did bear all and every one of mankind a good will, purposing to save them. But because their lies and flows such a sea and ocean of infinite love about the heart and in the bowels of Jesus Christ as would over-save and out-love infinite worlds of sinners (so all could come and draw and drink, and suck the breasts of overflowings of Christ’s free grace) in regard of the intrinsical weight and magnitude of this love, that if you appoint banks to channel or marches to bound this free love, God should not be God, nor the Redeemer the Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 233</span></figcaption>

</figure><figure class="quote" id="q-19c4498eb6" data-kw="sufficient efficient">
<blockquote><p>It is not asked with respect to the value and sufficiency of the death of Christ—whether it was in itself sufficient for the salvation of all men. For it is confessed by all that since its value is infinite, it would have been entirely sufficient for the redemption of each and every one, if God had seen fit to extend it to the whole world. And here belongs the distinction used by the fathers and retained by many divines—that Christ “died sufficiently for all, but efficiently for the elect only.” For this being understood of the dignity of Christ’s death is perfectly true (although the phrase would be less accurate if referred to the will and purpose of Christ).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0edcc5e7a1" data-kw="">
<blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds</cite>, … (London: Bishop, 1584), p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e41b00c66f" data-kw="">
<blockquote><p>13. Reason is employed on both sides, as an instrument, not a judge or norm. So that neither are they to be listened to who defer to it more than is fair in theological matters, and demand the things of faith from its scales, who are the Socinians; nor those who pointlessly begrudge its use in theological argumentation and forming consequences, which the Verronian Papists do, and some Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors</cite>, (1658) tr. Charles Johnson</span></figcaption>

</figure><figure class="quote" id="q-22c305050e" data-kw="">
<blockquote><p>Althought God is not manifest to the senses comprehensively as he is in himself, yet he can be perceived apprehensively as shining in his works, appearing in signs, heard in the word and manifested in the fabric of the whole universe. (2) It is a false assumption that there is nothing in the intellect which was not before in some sense. For universals are in the intellect and never were in any sense. A mind is known as also an angel, yet they are never pereceived or seen except from their effects. Why therefore may not God be most certainly known in the mind from his works and a posteriori, although we cannot perceive Him with our eyes or any of the other bodily senses.</p></blockquote>

</figure><figure class="quote" id="q-6ac70eebd0" data-kw="">
<blockquote><p>Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 4-5</span></figcaption>

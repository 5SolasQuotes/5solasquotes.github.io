<main class="wrap"><figure class="quote" id="q-120097347c" data-kw="">
<blockquote><p>The state of the case is really this, — that the faithful are never reconciled to God without the gift of regeneration; nay, we are for this end justified, — that we may afterwards serve God in holiness of life. Christ indeed does not cleanse us by his blood, nor render God propitious to us by his expiation, in any other way than by making us partakers of his Spirit, who renews us to a holy life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 6:2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/sanctification-and-justification.html">Sanctification and Justification</a> › <a href="../topics/sanctification/sanctification-and-justification/distinct-but-inseparable.html">Distinct but inseparable</a></span><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/distinguished-but-inseparable.html">Distinguished but inseparable</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-155e914340" data-kw="">
<blockquote><p>We acknowledge, then, that as soon as any one is justified, renewal also necessarily follows: and there is no dispute as to whether or not Christ sanctifies all whom he justifies. It were to rend the gospel, and divide Christ himself, to attempt to separate the righteousness which we obtain by faith from repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, p. 86</span></figcaption>

</figure><figure class="quote" id="q-665a3f7064" data-kw="">
<blockquote><p>The answer is very easy: as Christ cannot be divided into parts, so the two things, justification and sanctification, which we perceive to be united together in him, are inseparable. Whomsoever, therefore, God receives into his favor, he presents with the Spirit of adoption, whose agency forms them anew into his image.</p></blockquote>

</figure><figure class="quote" id="q-5c90d8b706" data-kw="">
<blockquote><p>We are justified not without works yet not through works, since in our sharing in Christ, which justifies us, [progressive] sanctification is just as much included as [imputed] righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.16.1</span></figcaption>

</figure><figure class="quote" id="q-a0d64276a6" data-kw="">

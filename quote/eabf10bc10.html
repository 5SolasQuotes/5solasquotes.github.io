<main class="wrap"><figure class="quote" id="q-eabf10bc10" data-kw="">
<blockquote><p>III. …The instrumental cause [of baptism] is a legitimately called minister. IV. Therefore we do not regard baptism by a layman [privatus], or by a woman, as valid, as the papists do. If there is no circumstance in a worldly government when a private citizen may do anything without authoization, how much less could such a corruption in his Church please Christ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (London, 1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 22, ‘The Seals or Sacraments…’, p. 121; ch. 23, p. 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“III. …The instrumental cause [of baptism] is a legitimately called minister. IV. Therefore we do not regard baptism by a layman [privatus], or by a woman, as valid, as the papists do. If there is no circumstance in a worldly government when a private citizen may do anything without authoization, how much less could such a corruption in his Church please Christ?”

— Johannes Wolleb, Abridgment of Christian Divinity (London, 1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 22, ‘The Seals or Sacraments…’, p. 121; ch. 23, p. 129.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+%E2%80%A6The+instrumental+cause+%5Bof+baptism%5D+is+a+legitimately+called+minister.+IV.+Therefore+we+do+not+regard+baptism+by+a+layman+%5Bprivatus%5D%2C+or+by+a+woman%2C+as+valid%2C+as+the+papists+do.+If+there+is+no+circumstance+in+a+worldly+government+when+a+private+citizen+may+do+anything+without+authoization%2C+how+much+less+could+such+a+corruption+in+his+Church+please+Christ%3F%E2%80%9D%0A%0A%E2%80%94+Johannes+Wolleb%2C+Abridgment+of+Christian+Divinity+%28London%2C+1626%29+in+ed.+John+Beardslee%2C+Reformed+Dogmatics%3A+J.+Wollebius%2C+G.+Voetius+%26+F.+Turretin+%28Oxford+Univ.+Press%2C+1965%29%2C+ch.+22%2C+%E2%80%98The+Seals+or+Sacraments%E2%80%A6%E2%80%99%2C+p.+121%3B+ch.+23%2C+p.+129.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feabf10bc10.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eabf10bc10.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=The%20instrumental%20cause%20%5Bof%20baptism%5D%20is,corruption%20in%20his%20Church%20please%20Christ&amp;text=The%20instrumental%20cause%20%5Bof%20baptism%5D%20is%20a%20legitimately&amp;text=such%20a%20corruption%20in%20his%20Church%20please%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-997e1d62c0" data-kw="">
<blockquote><p>Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cotton.html">William Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Private Communion’ in The Second &amp; Last Part of the Answer to the Reasons for Refusal of Subscription, pp. 65-78 in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605), p. 66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?”

</figure><figure class="quote" id="q-1f85e5fd28" data-kw="intention">
<blockquote><p>(1) The personal sin of one does not injure another who does not share in it. Now the defect of intention of the minister is the personal sin of that minister. Therefore it does not injure another not partaking of it—him, namely, who is the partaker of the sacrament rightly celebrated. However, it would injure him, if from the defect of that intention, the sacrament would be made void. 2. Because there is the same relation of the sacrament as of the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.7.5</span></figcaption>

</figure><figure class="quote" id="q-28a371500c" data-kw="">
<blockquote><p>Dr. Forbess goes about to warrant private baptism by Philip’s baptizing the eunuch, there being no greater company present, so far as we can gather from the narration of Luke, Acts 8. As likewise by Paul and Silas, their baptizing the goaler [jailer] and all his in his own private house, Acts 16. Touching the first of those places, we answer: 1. How thinks he that a man of so great authority and charge was alone in his journey? We suppose a great man traveling in a chariot must have some number of attendants, especially having come to a solemn worship at Jerusalem. 2. What Philip then did, the extraordinary direction of the Spirit guided him unto it, vv. 29, 39. As to the other place, there was in that time of persecution no liberty for Christians to meet together in temples and public places as now there is. Wherefore the example of Paul and Silas does prove the lawfulness of the like deed in the like case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 6, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

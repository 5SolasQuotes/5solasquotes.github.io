<main class="wrap"><figure class="quote" id="q-e228cd5910" data-kw="">
<blockquote><p>1. Do but consider, as faith is the condition required on our part, so it is the only condition; there is no more, no other thing required to bring you in to Christ, nor to bring you into communion or fellowship, or participation of Himself, nor of the benefits of his death, but faith: If you do believe, Christ is yours, and if you do believe you are justified and if you do believe you shall be saved and if you do believe you have an immediate, certain and full interest in Christ and his merits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed in the Everlasting Covenant</cite>, ... (London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, sect. 8, Whether Jesus Christ as Mediator died for all and every man?, p. 284</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9306965dc9" data-kw="">
<blockquote><p>We do not say that the confidence by which we are justified is the forgiveness of sins already perceived, nor that the object of this confidence is the forgiveness of sins previously perceived; but that confidence by which we each believe our sins are forgiven in the present, not properly in the past or future, although both pertain to justifying faith, but not to the high, so to speak, formal aspect of justifying. When, therefore, the Gospel word offers mercy and forgiveness of sins through Christ to every believer, faith does not only believe in general that this is true, that sins will indeed be forgiven to all who truly believe in Christ, but also the believer confidently persuades himself that this promise applies to him, and by that act of confidence, he is then forgiven his sin, and it becomes his happiness mentioned by the apostle in Rom. 4:7. Just as by extending a hand and accepting a gift, the beneficiary who has approached becomes a participant. Thus, in a faithful person, there are simultaneously forgiveness of sins and confidence about that forgiveness; and by the faith through which that mercy and special grace were received, it is afterward retained, and what was believed about the future is embraced in the present, and what about the past remains certain afterward. But one who believes he will be justified if he believes in Jesus Christ is not yet justified in the past unless he believes in the present that righteousness is given to him, which he receives by the same act. What is later believed about the past does not justify him but presupposes him as justified. All these acts are of the same justifying faith, the first indeed predisposes to justification, the second properly justifies, the third pacifies the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXV. This is also the doctrine of the Professors of Leiden, critiqued in the eleventh chapter of the Remonstrants’ Confession, whose author is Andreas Rivetus. They say:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-e231ecdd56" data-kw="">
<blockquote><p>Faith alone also justifies, insofar as it denotes a certain obedience which awaits the promise as a free gift; in which respect it formally consists indeed in the application of the promise. Yet certain dispositions precede this very act of faith (concerning which see Pareus, book 10 on Justification against Bellarmine, chapter 3), and fruits follow it. Hence it connotes several virtues or acts, both preceding and consequent, and it is opposed to that obedience which does not expect the promise as a wholly gratuitous gift, but as a reward set forth under the condition of some work, beyond mere acceptance and the gratitude owed—such as by its nature is usually required in every donation, however free. And this kind of [latter legal] obedience is peculiarly called by the apostle and by the Latins a “work,” and properly “merit”; and those who obey under this condition are called “workers” (Rom. 4:4; 11:6). And if this proposition is thus explained, those works which cannot coexist with faith—that is, which are done with confidence in and an opinion of merit—are altogether excluded, so that they are denied not only to justify, but even to be present either in one who is justified, or in the act of justifying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-crocius.html">Ludovicus Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma</cite>, bk. 4, ch. 7, p. 1223, as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 369-70, trans. ChatGPT-5 Crocius (1586 – 1653 or 1655) was a German reformed minister, a delegate at the Synod of Dort and a professor of theology and philosophy in Bremen.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>Paul attributes justification to faith alone, but living and effective. But James removes justification from faith alone, but that dead and hypocritical.</p></blockquote>

</figure><figure class="quote" id="q-f7715e2f2a" data-kw="Works follow justification">
<blockquote><p>A person is justified freely by faith without works (Rom. 3:24); yea, justification is of the wicked (Rom. 4:5; 5:6). No good works can be granted which precede his justification as causes, but only which follow as the effects and fruits springing from the faith of remission (Lk. 7:47; 1 Tim. 1:5).</p></blockquote>

<blockquote><p>I do not, however, concede to [Rome] that Paedobaptism had its origin the Tradition of the Church. It certainly appears to be founded on the institution of God, and to have derived its origin from circumcision. It would have little foundation if it depended only on the will of man. Accordingly, we must hold it as an universal rule, that no Sacrament is legitimate, unless it be of God and not of men. But to return to the present subject; not only the Blessing of the Pascal taper, the Exorcism of Water, and similar follies, which are of endless number, but the ritual of the Mass, and all the impious worship of this description, they make perfectly pure by a simple process, by merely giving them the name of Traditions, so that everything to which time has given a kind of prescriptive right is, as it were, placed beyond controversy, and holds up its head among the commandments of God. Will no man oppose this? Nay, rather a thousand times incur the obloquy of disturbing the peace, than by perfidious dissimulation betray the essential truth which is here endangered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, On The Truth Method of Giving Peace to Christendom in Tracts Relating to the Reformation, vol. 3, trans. Henry Beveridge (Edinburgh: Calvin Translation Society, 1851), 269.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

idelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58300845ed" data-kw="">
<blockquote><p>IX. (5) Because the children of believers are holy; therefore they ought to be baptized. For since they have the thing signified, they cannot and ought not to be deprived of the sign (Acts 10:47). “The unbelieving wife,” says the apostle, “is sanctified by the husband: else were your children unclean; but now are they holy” (1 Cor. 7:14). They are called holy, however, not because they are legitimate (as some suppose), because he was not speaking of that and nothing would thus be ascribed to them above the children of unbelievers, who can also be legitimate. But they are said to be holy by a federal holiness (i.e., Christians and belonging to the church). Therefore ἀκάθαρτον and ἅγιον here designate heathen and Christian (in which sense the word קדושה is often used by the Talmudists). “Offspring” is said to be “begotten in holiness” or “out of holiness” (i.e., when the parents were made proselytes or while they were still heathen). The children (τέκνα) of the Gentiles were unclean (ἀκίθαρτα) to them (from Acts 10:28) and of the Jews holy (ἅγιά), to which meaning (well known to the nation) allusion is made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P &amp; R Publishing, 1992–1997), 19.20.9 (p. 417–18). [modified according to the 1688 Latin text by the substitution of Greek and Hebrew words for the transliteration in the Dennison edit</span></figcaption>

</figure><figure class="quote" id="q-7ed806c3ce" data-kw="">
<blockquote><p>The earliest known example of a Catechetical work is the “Teaching of the Twelve Apostles,” which Athanasius names among the “books not included in the Canon, but appointed by the Fathers to be read by those who are just recently coming to us, and wish to be instructed in the word of godliness (κατηχεῖσθαι τὸν τῆς εὐσεβείας λόγον).” This use of the Didache for the instruction of recent converts from Paganism agrees with its original purpose as stated in the longer title, “Teaching of the Lord through the Twelve Apostles for the Gentiles.” The first six chapters are evidently adapted for those who need elementary instruction, more particularly for Catechumens of Gentile descent, as distinct from Jewish candidates for Baptisms. The remaining chapters of the Didaché relate chiefly to the administration of Baptism, to Prayer, Fasting, and the services of the Lord’s Day, and to the celebration of the Agape and Eucharist. This same division of subjects is observed in the two classes of S. Cyril’s Catechetical Lectures: the first class, including the Procatechesis, consists of XIX Lectures addressed to candidates for Baptism, and these are followed by five “Mystagogic” Lectures, so called as being explanations of the Sacramental Mysteries to the newly-baptized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-hamilton-gifford.html">Edward Hamilton Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Catechetical Lectures of S. Cyril</cite>, ed. Philip Schaff and Henry Wace, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), xii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-14dc9f6d20" data-kw="">
<blockquote><p>But where I added, that in the name of Jesus Christ we baptize, though I said no more than the Scripture says [i.e. Acts 2:38; 8:12,16; 19:5], yet he [Mr. Hussey] is pleased to object against me… I cited plain texts to prove that baptism is done in the name of Christ… But how does baptizing in the name of Christ, as Mediator, agree with the commission to baptize in the name of the Father, Son and Holy Ghost?… First, I say, the question is of things or actions, not of words. Mr. Hussey (it seems) did apprehend my meaning, as if I had intended an expression to be made in the act of baptizing, thus: ‘I baptize thee in the name of Jesus Christ.’ But [on the contrary] I speak of the action, not of the expression, even as in another instance I gave: our assembling together is in the name of Christ, though we do not say in terminis [in the very terms], ‘We are now assembled in the name of Christ.’ In baptism Christ does not command us to say either these words, ‘I baptize thee in the name of Christ;’ or these, ‘I baptize thee in the name of the Father, Son and Holy Ghost:’ but we are commanded to do the thing, both in the name of Christ as Mediator, and in the name of the Father, Son and Holy Ghost; but in different respects. A minister of Christ does both preach and baptize in the name of Christ, as Mediator; that is, vice Christi, in Christ’s stead [see 2 Cor. 5:20], and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our commission to preach and baptize, by Mr. Hussey’s confession. So that to preach and baptize epi to onomati Iesou Christou [in the name of Jesus Christ] (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38), comprehends a formal commission, power and authority, given and derived from Christ. I say not that it comprehends no more, but this it does comprehend. But when Christ bids us baptize eis ta onoma, ‘unto’, or ‘into’, or ‘in the name’ of the Father, Son and Holy Ghost, Mt. 28:19, this does relate to the end and effect of baptism, or the good of the baptized (if we understand the words properly), not the authority of the baptizer, as if a formal commission were there given him from the Father, Son and Holy Ghost. So that to baptize on ‘in’ or ‘unto’ the name of the Father, Son and Holy Ghost, is properly meant both of sealing the parties’ right and title to the enjoyment of God Himself, as their God by covenant, and their interest in the love of God, the grace of Christ, and of the communion of the Holy Ghost; and of dedicating the party to the knowledge, profession, faith, love, and obedience of God the Father, Son and Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, p. 110-111</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But where I added, that in the name of Jesus Christ we baptize, though I said no more than the Scripture says [i.e. Acts 2:38; 8:12,16; 19:5], yet he [Mr. Hussey] is pleased to object against me… I cited plain texts to prove that baptism is done in the name of Christ… But how does baptizing in the name of Christ, as Mediator, agree with the commission to baptize in the name of the Father, Son and Holy Ghost?… First, I say, the question is of things or actions, not of words. Mr. Hussey (it seems) did apprehend my meaning, as if I had intended an expression to be made in the act of baptizing, thus: ‘I baptize thee in the name of Jesus Christ.’ But [on the contrary] I speak of the action, not of the expression, even as in another instance I gave: our assembling together is in the name of Christ, though we do not say in terminis [in the very terms], ‘We are now assembled in the name of Christ.’ In baptism Christ does not command us to say either these words, ‘I baptize thee in the name of Christ;’ or these, ‘I baptize thee in the name of the Father, Son and Holy Ghost:’ but we are commanded to do the thing, both in the name of Christ as Mediator, and in the name of the Father, Son and Holy Ghost; but in different respects. A minister of Christ does both preach and baptize in the name of Christ, as Mediator; that is, vice Christi, in Christ’s stead [see 2 Cor. 5:20], and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our commission to preach and baptize, by Mr. Hussey’s confession. So that to preach and baptize epi to onomati Iesou Christou [in the name of Jesus Christ] (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38), comprehends a formal commission, power and authority, given and derived from Christ. I say not that it comprehends no more, but this it does comprehend. But when Christ bids us baptize eis ta onoma, ‘unto’, or ‘into’, or ‘in the name’ of the Father, Son and Holy Ghost, Mt. 28:19, this does relate to the end and effect of baptism, or the good of the baptized (if we understand the words properly), not the authority of the baptizer, as if a formal commission were there given him from the Father, Son and Holy Ghost. So that to baptize on ‘in’ or ‘unto’ the name of the Father, Son and Holy Ghost, is properly meant both of sealing the parties’ right and title to the enjoyment of God Himself, as their God by covenant, and their interest in the love of God, the grace of Christ, and of the communion of the Holy Ghost; and of dedicating the party to the knowledge, profession, faith, love, and obedience of God the Father, Son and Holy Ghost.”

— George Gillespie, Aaron’s Rod Blossoming, p. 110-111">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+where+I+added%2C+that+in+the+name+of+Jesus+Christ+we+baptize%2C+though+I+said+no+more+than+the+Scripture+says+%5Bi.e.+Acts+2%3A38%3B+8%3A12%2C16%3B+19%3A5%5D%2C+yet+he+%5BMr.+Hussey%5D+is+pleased+to+object+against+me%E2%80%A6+I+cited+plain+texts+to+prove+that+baptism+is+done+in+the+name+of+Christ%E2%80%A6+But+how+does+baptizing+in+the+name+of+Christ%2C+as+Mediator%2C+agree+with+the+commission+to+baptize+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3F%E2%80%A6+First%2C+I+say%2C+the+question+is+of+things+or+actions%2C+not+of+words.+Mr.+Hussey+%28it+seems%29+did+apprehend+my+meaning%2C+as+if+I+had+intended+an+expression+to+be+made+in+the+act+of+baptizing%2C+thus%3A+%E2%80%98I+baptize+thee+in+the+name+of+Jesus+Christ.%E2%80%99+But+%5Bon+the+contrary%5D+I+speak+of+the+action%2C+not+of+the+expression%2C+even+as+in+another+instance+I+gave%3A+our+assembling+together+is+in+the+name+of+Christ%2C+though+we+do+not+say+in+terminis+%5Bin+the+very+terms%5D%2C+%E2%80%98We+are+now+assembled+in+the+name+of+Christ.%E2%80%99+In+baptism+Christ+does+not+command+us+to+say+either+these+words%2C+%E2%80%98I+baptize+thee+in+the+name+of+Christ%3B%E2%80%99+or+these%2C+%E2%80%98I+baptize+thee+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3A%E2%80%99+but+we+are+commanded+to+do+the+thing%2C+both+in+the+name+of+Christ+as+Mediator%2C+and+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3B+but+in+different+respects.+A+minister+of+Christ+does+both+preach+and+baptize+in+the+name+of+Christ%2C+as+Mediator%3B+that+is%2C+vice+Christi%2C+in+Christ%E2%80%99s+stead+%5Bsee+2+Cor.+5%3A20%5D%2C+and+having+authority+for+that+effect+from+Christ%2C+as+Mediator%3B+for+Christ%2C+as+Mediator%2C+gave+us+our+commission+to+preach+and+baptize%2C+by+Mr.+Hussey%E2%80%99s+confession.+So+that+to+preach+and+baptize+epi+to+onomati+Iesou+Christou+%5Bin+the+name+of+Jesus+Christ%5D+%28which+we+find+both+of+preaching%2C+Lk.+24%3A47%2C+and+of+baptizing%2C+Acts+2%3A38%29%2C+comprehends+a+formal+commission%2C+power+and+authority%2C+given+and+derived+from+Christ.+I+say+not+that+it+comprehends+no+more%2C+but+this+it+does+comprehend.+But+when+Christ+bids+us+baptize+eis+ta+onoma%2C+%E2%80%98unto%E2%80%99%2C+or+%E2%80%98into%E2%80%99%2C+or+%E2%80%98in+the+name%E2%80%99+of+the+Father%2C+Son+and+Holy+Ghost%2C+Mt.+28%3A19%2C+this+does+relate+to+the+end+and+effect+of+baptism%2C+or+the+good+of+the+baptized+%28if+we+understand+the+words+properly%29%2C+not+the+authority+of+the+baptizer%2C+as+if+a+formal+commission+were+there+given+him+from+the+Father%2C+Son+and+Holy+Ghost.+So+that+to+baptize+on+%E2%80%98in%E2%80%99+or+%E2%80%98unto%E2%80%99+the+name+of+the+Father%2C+Son+and+Holy+Ghost%2C+is+properly+meant+both+of+sealing+the+parties%E2%80%99+right+and+title+to+the+enjoyment+of+God+Himself%2C+as+their+God+by+covenant%2C+and+their+interest+in+the+love+of+God%2C+the+grace+of+Christ%2C+and+of+the+communion+of+the+Holy+Ghost%3B+and+of+dedicating+the+party+to+the+knowledge%2C+profession%2C+faith%2C+love%2C+and+obedience+of+God+the+Father%2C+Son+and+Holy+Ghost.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Aaron%E2%80%99s+Rod+Blossoming%2C+p.+110-111&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14dc9f6d20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14dc9f6d20.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=But%20where%20I%20added%2C%20that%20in,the%20Father%2C%20Son%20and%20Holy%20Ghost&amp;text=But%20where%20I%20added%2C%20that%20in%20the%20name&amp;text=of%20God%20the%20Father%2C%20Son%20and%20Holy%20Ghost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5c51c841fc" data-kw="">
<blockquote><p>For that reason we detest the error of the Anabaptists who are not content with a single baptism once received and also condemn the baptism of the children of believers. We believe our children ought to be baptized and sealed with the sign of the covenant, as little children were circumcised in Israel on the basis of the same promises made to our children. And truly, Christ has shed his blood no less for washing the little children of believers than he did for adults. Therefore they ought to receive the sign and sacrament of what Christ has done for them, just as the Lord commanded in the law that by offering a lamb for them the sacrament of the suffering and death of Christ would be granted them shortly after their birth. This was the sacrament of Jesus Christ. Furthermore, baptism does for our children what circumcision did for the Jewish people. That is why Paul calls baptism the “circumcision of Christ.</p></blockquote>

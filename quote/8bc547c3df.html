<main class="wrap"><figure class="quote" id="q-8bc547c3df" data-kw="">
<blockquote><p>The Church-Government of which I here speak [and argue for], is a Church-government in its morals: To exclude those things that are merely physical and human in this government, as a pulpit of this or that matter, stone or timber, or of this timber, or of any other kind; a communion-table of this, or that form; a cup of wood, or of metal, as silver, tin, etc…. but what sort of river the water of baptism be, is merely physical, not moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government and Excommunication</cite>, (London, 1646) | Introduction, pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-4e0c59e4d5" data-kw="">
<blockquote><p>That the very body of Christ is offered in the Lord’s Supper. For as we take the bread to be the body of Christ sacramentally by resemblance, and no otherwise, so the breaking of bread is sacramentally the sacrificing or offering of Christ upon the cross. And thus the fathers have termed the eucharist an immolation of Christ, because it is a commemoration of his sacrifice upon the cross. Augustine, Epistle 23, ‘Neither does he lie which says Christ was offered. For if sacraments had not the resemblance of things whereof they are sacraments, they should in no wise be sacraments. But from a resemblance, they often take their names.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-644a4b274b" data-kw="">
<blockquote><p>I. When two commandments of the moral law are opposite in respect of use as we can not do them both at the same time: then the lesser commandment gives place to the greater and does not bind for that instant. Example 1. God commands one thing, and the magistrate commands the flat contrary: in this case which of these two commandments must be obeyed, ‘Honor God,’ or, ‘Honor the Magistrate’? The answer is, that the latter must give place to the former, and the former must only be obeyed. Acts 4:19, ‘Whether it be right in the sight of God to obey you rather than God judge ye.’ II. The 4th Commandment prescribes rest on the Sabbath day. Now it [falls?] out that at the same time [that] a whole town set on fire, and the Sixth Commandment requires our help in saving our neighbor’s life and goods. Now of these two commandments, which must be obeyed? For both cannot. The answer is that the Fourth Commandment at this time is to give place, and the Sixth Commandment alone binds the conscience: so as then (if need should require) a man might labor all the day without offence to God. Mt. 9:13, ‘I will have mercy and not sacrifice.’ And the rule must not be omitted that charity towards our neighbor is subordinate to the love of God, and therefore must give place to it. For this cause the commandment concerning charity must give place to the commandment concerning love to God: and when the case so falls out that we must either offend our neighbor or God, we must rather offend our neighbor than God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, … (Cambridge, 1596), pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

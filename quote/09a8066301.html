<main class="wrap"><figure class="quote" id="q-09a8066301" data-kw="">
<blockquote><p>…we will distinguish with the School-men a two-fold power, the power of Order, and the power of Jurisdiction; which are different in sundry respects.

1. The power of order comprehends such things as a minister by virtue of his ordination, may do without a commission from any presbytery, or assembly of the Church, as to preach the Word, to minister the sacraments, to celebrate marriage, to visit the sick, to catechize, to admonish, etc. The power of jurisdiction comprehends such things as a minister cannot do by himself, nor by virtue of his ordination; but they are done by a session, presbytery, or synod; and sometimes by a minister, or ministers, having commission, and authority from the same, such as ordination and admission, suspension, deprivation and excommunication, and receiving again into the Church, and making of laws and constitutions ecclesiastical and such like; whereof we boldly maintain, that there is no part of ecclesiastical jurisdiction, in the power of one man, but of many met together in the name of Christ.

2. The power of order is the radical and fundamental power, and makes a minister susceptive, and capable of the power of jurisdiction.

3. The power of order goes no further than the court of conscience; the power of jurisdiction is exercised in external and ecclesiastical courts. Fourthly, the power of order is sometime unlawful in the use, yet not void in itself. The power of Jurisdiction when it is unlawful in the use, it is also void in itself. If a minister do any act of jurisdiction, as to excommunicate, or absolve without his own parish, wanting also the consent of the ministry and elders of the bounds where he does the same, such acts are void in themselves, and of no effect. But if without his own charge, and without the consent aforesaid, he baptize an infant, or do any such thing belonging to the power of order, though his act be unlawful, yet is the thing itself of force, and the sacrament remains a true sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (1641), pp. 12-14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-61e1f1f8ad" data-kw="">
<blockquote><p>But soon after a new acquaintance provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgie and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640 the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacy (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was, that I setled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government.</p></blockquote>

<blockquote><p>28. We have, therefore, a most excellent and sure mark to distinguish… the legitimate observances of the Church, if we remember that one of two things, or both together, are always intended, viz., that in the sacred assembly of the faithful, all things may be done decently, and with becoming dignity, and that human society may be maintained. In order by certain bonds, as It were, of moderation and humanity… since nothing here is sought but the maintenance of charity by a common office… 30. …the whole sum of righteousness, and all the parts of divine worship, and everything necessary to salvation, the Lord has faithfully comprehended, and clearly unfolded, in his sacred oracles, so that in them He alone is the only Master to be heard. But as in external discipline and ceremonies [he used as an example bowing in prayer], he has not been pleased to prescribe every particular that we ought to observe, (he foresaw that this depended on the nature of the times, and that one form would not suit all ages, in them we must have recourse to the general rules which he has given, employing them to test whatever the necessity of the Church may require to be enjoined for order and decency. Lastly, as he has not delivered any express command, because things of this nature are not necessary to salvation, and, for the edification of the Church, should be accommodated to the varying circumstances of each age and nation, it will be proper, as the interest of the Church may require, to change and abrogate the old, as well as to introduce new forms. I confess, indeed, that we are not to innovate rashly or incessantly, or for trivial causes. Charity is the best judge of what tends to hurt or to edify: if we allow her to be guide, all things will be safe. 31. Things which have been appointed according to this rule, it is the duty of the Christian people to observe with a free conscience indeed, and without superstition, but also with a pious and ready inclination to obey…</p></blockquote>

<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>

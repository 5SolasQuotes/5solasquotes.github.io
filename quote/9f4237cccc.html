<main class="wrap"><figure class="quote" id="q-9f4237cccc" data-kw="">
<blockquote><p>I know that even by some of the Fathers these two places, to wit, Eph. 4:11-12 and 1 Tim. 3:2 with 8, are adduced for the same end [for bishops]: because, in the first place, the apostle reckons out both extraordinary and ordinary preaching-officers, without making any mention of bishops: which could not be, if they were not the same with pastors that are named, as Ambrose on the place asserts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation</cite>, (Edinburgh, 1658), pp. 223-33, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d46314e2f" data-kw="">
<blockquote><p>The Jewish subordinations, being no temple ordnances, nor typical or ceremonial, do in the moral equity of them concern us as well as them; at least we may with much more reason urge an argument, a pari ratione [from the reason of parity], from subordinations in the Jewish Church to prove a subordination still; then our brethren can argue from thence against it: For the grounds of that subordination being from moral equity; and the ends and necessity of it being the same, now as then (viz. revolving difficult cases, ordering matters of common concernment, reforming offences in inferior societies, receiving appeals, redressing of injuries and neglect in mal-administration, etc.) the same reason still remains, that for the same ends and purposes, there should be subordinations now in the Chrisitan Church that was then in the Jewish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons presented by the Dissenting Brethren against certain propositions concerning presbyterial government</cite>, … Together with the answer of the Assembly of Divines to those reasons of Dissent (London, T.R., 1648), p. 147</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 1.39.28–29</span></figcaption>

</figure><figure class="quote" id="q-18b2d420e5" data-kw="">
<blockquote><p>That the people’s approbation of a king is not necessary, is the saying of Beilarmine and the papists, and that the people choose their ministers in the apostolic church, not by a necessity of a divine commandment, but to conciliate love betwixt pastor and people.</p></blockquote>

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+the+people%E2%80%99s+approbation+of+a+king+is+not+necessary%2C+is+the+saying+of+Beilarmine+and+the+papists%2C+and+that+the+people+choose+their+ministers+in+the+apostolic+church%2C+not+by+a+necessity+of+a+divine+commandment%2C+but+to+conciliate+love+betwixt+pastor+and+people.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F18b2d420e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/18b2d420e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/erastianism/patronage#:~:text=That%20the%20people%E2%80%99s%20approbation%20of%20a,conciliate%20love%20betwixt%20pastor%20and%20people&amp;text=That%20the%20people%E2%80%99s%20approbation%20of%20a%20king%20is&amp;text=but%20to%20conciliate%20love%20betwixt%20pastor%20and%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-09a8066301" data-kw="">
<blockquote><p>…we will distinguish with the School-men a two-fold power, the power of Order, and the power of Jurisdiction; which are different in sundry respects. 1. The power of order comprehends such things as a minister by virtue of his ordination, may do without a commission from any presbytery, or assembly of the Church, as to preach the Word, to minister the sacraments, to celebrate marriage, to visit the sick, to catechize, to admonish, etc. The power of jurisdiction comprehends such things as a minister cannot do by himself, nor by virtue of his ordination; but they are done by a session, presbytery, or synod; and sometimes by a minister, or ministers, having commission, and authority from the same, such as ordination and admission, suspension, deprivation and excommunication, and receiving again into the Church, and making of laws and constitutions ecclesiastical and such like; whereof we boldly maintain, that there is no part of ecclesiastical jurisdiction, in the power of one man, but of many met together in the name of Christ. 2. The power of order is the radical and fundamental power, and makes a minister susceptive, and capable of the power of jurisdiction. 3. The power of order goes no further than the court of conscience; the power of jurisdiction is exercised in external and ecclesiastical courts. Fourthly, the power of order is sometime unlawful in the use, yet not void in itself. The power of Jurisdiction when it is unlawful in the use, it is also void in itself. If a minister do any act of jurisdiction, as to excommunicate, or absolve without his own parish, wanting also the consent of the ministry and elders of the bounds where he does the same, such acts are void in themselves, and of no effect. But if without his own charge, and without the consent aforesaid, he baptize an infant, or do any such thing belonging to the power of order, though his act be unlawful, yet is the thing itself of force, and the sacrament remains a true sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (1641), pp. 12-14</span></figcaption>

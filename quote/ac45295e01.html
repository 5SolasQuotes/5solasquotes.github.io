<blockquote><p>There was a little Christian child who was asked, when she was dying, why she was so happy? ‘Because,’ she said, ‘I am going to be with Christ.’ ‘But,’ they said to her, ‘perhaps Christ will leave heaven.’ ‘Ah! Then,’ she said, ‘I will leave it, too, and go with Him.’ It is our very heaven to be with Christ; we shall see eye to eye.</p></blockquote>

<blockquote><p>To the eternal death which awaits the damned, eternal life is opposed—the fulfillment and crown of all of Christ’s benefits. So great a good as neither eye has seen, nor ear heard, nor has it entered into the heart of anyone to conceive, and will not enter until we, obtaining our wish, ascend thither and know as we are known, and no longer walk by faith, but by sight.</p></blockquote>

</figure><figure class="quote" id="q-84a6e98317" data-kw="">
<blockquote><p>Such works (that obtain a reward) are not only those of condign merit, but also: (1) the execution of a donation or almsgiving that is entirely gratuitous, which a poor man, humbly and faithfully waiting for it, does not render void by contempt or ingratitude; (2) the execution of a promise which is made not only under the condition of accepting and not despising the gift (a condition which no donation is so free as not to include), but also of a certain work besides—on which account it is in some sense meritorious, even though there may perhaps be no equality or commutation between this work and the promised reward; as, for example, if a father promises a jewel to his son who takes bitter medicine. Yet this is not a purely gratuitous donation, since the thing does not begin to be owed as soon as the promise is accepted, but when the condition has been fulfilled; nor is it properly merit of condignity, since the one acting benefits himself rather than gives something to another for which he ought to receive an equal price. But it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children to whom God has promised rewards, we admit.</p></blockquote>

<blockquote><p>4. In the first operation of this light of glory, believers shall so behold the glory of Christ, and the glory of God in Him, as that therewith and thereby they shall be immediately and universally changed into his likeness. They shall be as He is, when they shall see Him as He is. There is no growth in glory, as to parts— there may be as to degrees. Additions may be outwardly made unto what is at first received as by the resurrection of the body; but the internal light of glory and its transforming efficacy is capable of no degrees, though new revelations may be made unto it unto eternity. For the infinite fountain of life and light, and goodness, can never be fathomed, much less exhausted. And what God spake on the entrance of sin, by the way of contempt and reproach, ‘Behold, the man is become like one of us!’ upbraiding him with what he had foolishly designed—on the accomplishment of the work of his grace, He says in love and infinite goodness, “Man is become like one of us, in the perfect restoration of our image in him.’ This is the first effect of the light of glory. … 4. …For, as it is expressly assigned thereunto in the Scripture, so whereas it contains the perfect operation of our minds and souls in a perfect state, on the most perfect object, it is the only mea.ns of our blessedness. And this is the true cause whence there neither is nor can be any satiety or weariness in heaven, in the eternal contemplation of the same glory. For not only the object of our sight is absolutely infinite, which can never be searched unto the bottom, yea, is perpetually new unto a finite understanding; but our subjective blessedness consisting in continual fresh communications from the infinite fulness of the divine nature, derived unto us through vision, is always new, and always will be so to eternity. Herein shall all the saints of God drink of the rivers of pleasure that are at his right hand, be satisfied with his likeness, and refresh themselves in the eternal springs of life, light, and joy for evermore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations &amp; Discourses on the Glory of Christ, ch. 14, ‘Other Differences…’ in Works, vol. 1</cite>, pp. 412-14</span></figcaption>

</figure><figure class="quote" id="q-b0cd5d6e63" data-kw="">
<blockquote><p>For affections or passions in man, they are of two sorts: 1. Sensual belonging to the sensitive appetite and directed by the fantasy: these are common to brute beasts with us, and arise from one like temper and constitution in both. The object of these is all natural good or evil. 2. Rational, appertaining to the reasonable appetite or will, and guided by the understanding. These are proper to man, and they have their original from the substance of the reasonable soul, in which they always remain, not only when it is in the body, but even when tis severed from it. For fear, hope, love, hatred, joy, grief, etc. are in the damned and blessed spirits as well as living men. The object of these properly human passions is all moral and spiritual good or evil. I need not among so many learned, artists stand curiously upon the distinction of these two sorts of passions in man: the identity of names in both sorts has caused some confusion, but in reason the diversity of their nature is evident. Wherefore I go on to see what is meant by excitation or stirring up of the affections: whereby we can understand nothing else but their right and orderly motions about their proper objects. As in the particulars, sensual passions are then duly excited when they are moved about any natural good or evil, according to the instinct of nature in brute beasts and according to the same instinct of nature in man, but guided and moderated by right reason. Reasonable affections are then duly stirred up when their motions about all spiritual and moral good or evil are conformable to the quality of the object affected and to the rules of a rightly informed understanding.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For affections or passions in man, they are of two sorts: 1. Sensual belonging to the sensitive appetite and directed by the fantasy: these are common to brute beasts with us, and arise from one like temper and constitution in both. The object of these is all natural good or evil. 2. Rational, appertaining to the reasonable appetite or will, and guided by the understanding. These are proper to man, and they have their original from the substance of the reasonable soul, in which they always remain, not only when it is in the body, but even when tis severed from it. For fear, hope, love, hatred, joy, grief, etc. are in the damned and blessed spirits as well as living men. The object of these properly human passions is all moral and spiritual good or evil. I need not among so many learned, artists stand curiously upon the distinction of these two sorts of passions in man: the identity of names in both sorts has caused some confusion, but in reason the diversity of their nature is evident. Wherefore I go on to see what is meant by excitation or stirring up of the affections: whereby we can understand nothing else but their right and orderly motions about their proper objects. As in the particulars, sensual passions are then duly excited when they are moved about any natural good or evil, according to the instinct of nature in brute beasts and according to the same instinct of nature in man, but guided and moderated by right reason. Reasonable affections are then duly stirred up when their motions about all spiritual and moral good or evil are conformable to the quality of the object affected and to the rules of a rightly informed understanding.”

— William Pemble, Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), pp. 125-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+affections+or+passions+in+man%2C+they+are+of+two+sorts%3A+1.+Sensual+belonging+to+the+sensitive+appetite+and+directed+by+the+fantasy%3A+these+are+common+to+brute+beasts+with+us%2C+and+arise+from+one+like+temper+and+constitution+in+both.+The+object+of+these+is+all+natural+good+or+evil.+2.+Rational%2C+appertaining+to+the+reasonable+appetite+or+will%2C+and+guided+by+the+understanding.+These+are+proper+to+man%2C+and+they+have+their+original+from+the+substance+of+the+reasonable+soul%2C+in+which+they+always+remain%2C+not+only+when+it+is+in+the+body%2C+but+even+when+tis+severed+from+it.+For+fear%2C+hope%2C+love%2C+hatred%2C+joy%2C+grief%2C+etc.+are+in+the+damned+and+blessed+spirits+as+well+as+living+men.+The+object+of+these+properly+human+passions+is+all+moral+and+spiritual+good+or+evil.+I+need+not+among+so+many+learned%2C+artists+stand+curiously+upon+the+distinction+of+these+two+sorts+of+passions+in+man%3A+the+identity+of+names+in+both+sorts+has+caused+some+confusion%2C+but+in+reason+the+diversity+of+their+nature+is+evident.+Wherefore+I+go+on+to+see+what+is+meant+by+excitation+or+stirring+up+of+the+affections%3A+whereby+we+can+understand+nothing+else+but+their+right+and+orderly+motions+about+their+proper+objects.+As+in+the+particulars%2C+sensual+passions+are+then+duly+excited+when+they+are+moved+about+any+natural+good+or+evil%2C+according+to+the+instinct+of+nature+in+brute+beasts+and+according+to+the+same+instinct+of+nature+in+man%2C+but+guided+and+moderated+by+right+reason.+Reasonable+affections+are+then+duly+stirred+up+when+their+motions+about+all+spiritual+and+moral+good+or+evil+are+conformable+to+the+quality+of+the+object+affected+and+to+the+rules+of+a+rightly+informed+understanding.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%

<main class="wrap"><figure class="quote" id="q-d1735d511f" data-kw="">
<blockquote><p>The human nature of Christ is the only true tabernacle, wherein God would dwell personally and substantially. The dwelling of God with men was ever looked on as an infinite condescension. So Solomon expressed it, in his prayer at the dedication of the temple, “But will God indeed dwell on the earth? Behold, the heaven and heaven of heavens cannot contain thee,” 1 Kings viii. 27. But there are various degrees of this condescension, various kinds of this inhabitation of God among men. Under the old testament, he dwelt in the tabernacle and temple, by many symbols and pledges of his glorious presence.

Such in especial were the ark and mercy-seat; whence that which was done before the ark is said to be done “before the LORD,” Exod. xxx. 8. This was, as Solomon expresseth it, a great condescension in the infinite, incomprehensible God; and there was a great glory accompanying this his presence. Under the new testament, God dwelleth in his saints by his Spirit, whereby they become a holy temple unto him. And of this inhabitation of God I have treated elsewhere. But his dwelling in the human nature of Christ is quite of another nature than either of these; and his love with his condescension, inconceivably more conspicuous than in them.

Hence is that expression of our apostle. “In him dwelleth all the fulness of the Godhead bodily,” Col. ii. 9. It is not any sign or token, it is not any effect of the divine power, goodness, and grace, that dwells in him, but “the fulness of the Godhead;” that is, the divine nature itself. And this dwelleth in him “bodily;” that is, by the assumption of the body or the human nature into personal subsistence with the Son of God. How glorious should this be in our eyes! How did they admire the condescension of God of old, in his dwelling in the tabernacle and temple by the glorious signs of his presence! and yet was it all but a dark representation and shadow of this glorious love and grace, whereby he dwells in our nature in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 21-22.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Mortification of Sin in Believers, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>

</figure><figure class="quote" id="q-c734929aa3" data-kw="">
<blockquote><p>According to the Westminster Confession, ‘It pleased God the Father, Son, and Holy Ghost, for the manifestation of the glory of His eternal power, wisdom, and goodness, in the beginning, to create, or make of nothing, the world, and all things therein whether visible or invisible, in the space of six days; and all very good.’ (IV.I) Some scholars have argued that this does not require confessional adherents to believe in six-day creation, even though such a conclusion appears to go against the obvious meaning of the words. This argument does not appear to harmonise with the primary sources, moreover. William Gouge, an important member of the Westminster Assembly, argues that the seventh-day of the creation week lasted for twenty-four hours and maintains that this was also the length of the other days:

3. Q. Of how many hours doth the Sabbath day consist?

A. Of four and twenty. Gen. 2.3.

The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), p. 2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-c49d678bc0" data-kw="">
<blockquote><p>Yea further, times and places which are applied to the worship of God as circumstances only for outward order and policy may be by a private Christian applied to a civil use, for in so doing he breaks not the ordinance of the Church: For example, material churches are appointed to be the receptacles of Christian assemblies, and that only for such common commodity and decency, which has place as well in civil as in holy meetings, and not for any holiness conceived to be in them more than in other houses. Now if I be standing in a churchyard when it rains, may not I go into the church that I may be defended from the injury of the weather? If I must meet with certain men for putting order to some of my worldly affairs, and it fall out that we cannot conveniently meet in any part but in the church, may we not there keep our tryst? A material church then may serve for a civil use, the same way that it serves to a holy use.</p></blockquote>

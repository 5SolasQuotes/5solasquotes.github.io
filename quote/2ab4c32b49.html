<main class="wrap"><figure class="quote" id="q-2ab4c32b49" data-kw="">
<blockquote><p>The learned and renowned [reformed] professors of Leiden answer [that] the end of synods is not by any means, good or bad, to remove controversies, but to bury them by the power of the Word. 2. Only external peace separated from truth should not be intended [by synods regarding controversies], but [external peace should be] conjoined with truth and peace of conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38d5a0ab65" data-kw="">
<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is: 1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed. 2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew</cite>, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 29-34</span></figcaption>

</figure><figure class="quote" id="q-2c8bcddfb8" data-kw="">
<blockquote><p>Those articles of religion wherein the divines of both sides [of the reformed and Lutherans] do fully agree are abundantly sufficient, both for a Christian man’s salvation and likewise for the establishing of a firm and lasting peace in the Churches of God. As for the rest… they are such as may perhaps not unfitly be sent to the divinity-schools, there to be thoroughly discussed: but by no means ought they to disquiet the peace either of any Christian soul or of God’s holy Church… our good and gracious Savior passed over with silence and toleration great and grievous errors in comparison of these… and that too even in such as were of his own household and retinue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Opinions of Certain Reverend &amp; Learned Divines concerning the Fundamental Points of the True Protestant Religion, &amp; the Right Government of Reformed Churches</cite>, ([Oxford] Downes, 1643), “Opinion of Joseph Hall,”, pp. 1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-ca5bdad230" data-kw="">
<blockquote><p>We must therefore know, it is not every seperation from that which is called a Church that is a note of an Antichristian spirit, but it must be known whether that were the true Church; now this Church St. John speaks of was the true Church, for it was from such whose sins were forgiven; now if it be not a true Church that they break from, it is no sign of Antichrist: 2 Chron. 11:16, such as set their hearts to seek the Lord, separated themselves from those that followed Jeroboam, and came to Jerusalem; so the apostles were fain to seperate from the Church of the Jews which persecuted Christ, and them, and so constituted a Church by themselves, a Christian Church; so then it is not a seperation from a false Church, but a true, that is a sign of an Antichristian spirit. … Use 2. It may teach us what to judge of the Separatists, or Brownists, are they of Antichrist? Surely their practise is blame-worthy: 1. Because they seperate, where Christ keeps fellowship, Rev. 1:18; and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? If they be converted, where had they their conversion? 2. Have not many of God’s servants heretofore kept company with Churches as corrupt as ours are? Did not Peter and John keep company with them and shall they be more pure and curious? 3. Christ commands: ‘If thy brother offends admonish him; if he hear thee not, take two or three more; if he hear not them, then tell it to the Church, and if he hear not the Church, let him be to thee as an heathen, or publican;’ (Mt. 18:17) but if the church hear not thy complaint, He does not say let the church be as an heathen, or publican;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John</cite>, (London: Parkhurst, 1658), on 1 Jn. 2:19, pp. 155-56</span></figcaption>

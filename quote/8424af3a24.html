<main class="wrap"><figure class="quote" id="q-8424af3a24" data-kw="">
<blockquote><p>Do you think that the Supper of the Lord ought to be celebrated in any other place than in the common and public congregation? Answer: This was a custom in the beginning of the old Church, that the sacrament should be sent by deacons to the sick that were absent from the public meeting, that is to say, at that time that the mysteries were celebrated of the rest in that meeting, because it was meet that those whom one disease did let [prevent] to be present in body, should be accompted as if they were present: neither do I doubt but that that thing brought great comfort to those that were sick, the which custom I would very gladly [wish it] were restored. But whether it be meet to be celebrated to the sick at that time when the Supper of the Lord is not ministred in the Church, of this I greatly doubt. … Notwithstanding I do acknowledge that in this case it is somewhat diverse. For although it were very meet that these mysteries throughout [the] whole [of] Christendom, albeit in diverse places, yet notwithstanding daily also if it were possible, or at least upon appointed and set days were celebrated, which should profit very much to the witnessing of that same mutual fellowship and consolation in Christ: notwithstanding forasmuch as neither of both can be obtained for many just and necessary causes it seems, I know not in what sort to be contrary to the institution of the Supper of the Lord, that all the rest of the Church omitting it, some one house extraordinarily should celebrate those mysteries. Moreover, unless that were done amongst all those that were sick, how shall the suspicion of partiality in respecting of persons be shunned? Now if the Supper of the Lord be to be ministered amongst all that are sick, let pastors see by what means the profanation thereof may be avoided and how they may satisfy and undergo so great labors. The custom therefore of certain [persons] do nothing at all [to] move me, although that it be very ancient, because the matter is to be judged not by examples, but by reasons… But if a man think that he can shun all these inconveniences, and think that those mysteries may be ministred to a sick man in the congregration, he requiring it, upon these conditions I would not be against this custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 242, ‘Of the Celebration of the Supper of the Lord in Private Houses besides the Time of the Ecclesiastical Meeting’ in The Other Part of Christian Questions &amp; Answers, which is Concerning the Sacraments (London, 1580), no page numbers</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80b701bb47" data-kw="">
<blockquote><p>In the [Scottish] Book of Common Order [‘The Order of Baptism’]… it is said that the sacraments are not ordained of God to be used in private corners, as charmers and sorcerers use[d] to do, but left to the congregation, and necessarily annexed to God’s Word as seals of the same. In the [general] assembly holden at Edinburgh… [Oct. 17,] 1581 [session 3], it was ordained that the sacraments be not ministered in private houses, but solemnly, according to the good order hitherto observed. But in the late pretended assembly holden at Perth, anno 1618, it was ordained [in its Acts] that the minister shall not refuse to baptize infants in private houses when great need compels the parents to crave it, but the great need is not specified, and therefore left to the judgement of every corrupt minister who shall be willing to pleasure his parishoner upon pretence of any alleged necessity, as a rainy day, or the saving of some charges [expenses], as a dinner, etc. Such like the minister must not refuse to administrate the communion in a private house beside him… It is required only that there be three or four of good religion and conversation present to communicate with him. But, which shakes all loose, these must be free of all impediments. What if they be not free? What suppose there were forty, let be four, if it be not celebrated in the congregation, it is but a private communion. … 2. …Because we cannot attain to a visible communion in the holy things of God immediately with the whole Church-militant, we enjoy it mediately by our communion in a particular congregation… … He [Dr. Lindsay] wrests also that place in Matthew [ch. 18], where Christ promised to be in the midst of two or three convened in his name, as if three or four convened to the administration of baptism or the Lord’s Supper, were a sufficient number to make up a lawful assembly… Christ speaks not there, as Master [Thomas] Cartwright has already answered, of the public administering of the Word and sacraments, but of the proceeding in the Church discipline. … It is a sinew of public assemblies, a hedge of our profession, a band of love and representation of our communion and fellowship, which is and ought to be among the members of the congregation. It is not a part, or two, or three, but the whole body of the congregation which is compared to one bread, when the apostle says, ‘We that are many are one bread, and one body, for we are partakers afore bread,’ 1 Cor. 10:17. Because it is not possible to us to celebrate a sacramental union with the whole Church militant, the Lord has appointed us to keep a sacramentall communion with some particular congregation or visible Church. … A company convened apart from the rest to communicate with the sick person is not united by themselves into the body of a Church, far less three of four, as take, the English [Anglican] service book means to be a number sufficient, seeing they allow the communion to be ministred to three or four in the Church, and in the time of plague, sweat, or such other like contagious sicknesses, the minister may communicate with the person diseased alone… says Bullinger (Decade 5, sermon 9). That is, ‘Seeing it is not a public or general meeting, when three or four communicate with the sick, they say nothing to purpose who say, that the supper may be celebrated beside the sick, if others also communicate.’ … The elements were sent to the absents in time, or immediately after the action in Justin Martyr’s time. Which was the first abuse we read of. After followed reservation of the eucharist for the use of the sick, which was a greater abuse, and carrying of it home to their houses. The opinion of the necessity of private communions did grow to such a height…</p></blockquote>

</figure><figure class="quote" id="q-cc25ddb50f" data-kw="">
<blockquote><p>Herein now we disprove the papistical doctrine which allows of private masses and teaches that the priest offers up the body and blood of our Lord for the standers by; and that by the mass he applies the merit of redemption unto them that with devotion come to that sacrifice. For as there is no one word of the Lord extant that commands the priests to sacrifice or privately to apply the supper for others, or that promises anything unto them that stand by and look on it (for He says, “Do this; eat ye and drink ye all in the remembrance of me;” He says not, ‘Look upon the priests only while they be eating and drinking for you’)… … Concerning the place where the supper is to be celebrated, I find no contention has been amongst the most ancient ministers of the Church. It is read how that our Lord Jesus used the hall of a certain private man’s house. And also the apostle Paul both preached and brake bread at Troas in a certain dining-place (Acts 20)… At this present there seems no place to be more worthy or more commodious to celebrate the holy supper in, than that which is appointed for doctrine and prayer. For so have we learned of St. Paul, 1 Cor. ch. 11. Howbeit, if tyrannical power will not suffer us to have a church, what shall let us but that we may reverently celebrate the supper in honest private houses?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decades (Parker Society, 1852), 5th Decade, Sermon 9, ‘Of the Lord’s Holy Supper’</cite>, pp. 417-8</span></figcaption>

</figure><figure class="quote" id="q-128651e0cf" data-kw="">
<blockquote><p>For St. Paul’s baptizing in the house of the jailor had been more fit for him [John Whitgift], for unto his place it may be easily answered that Cornelius, having so great a family, as it is like he had, and besides that diverse soldiors underneath him, and further his friends and his acquaintance which he had called, had a competent number, and as many as would make a congregation, and as could commodiously be preached unto in one place. But the answer to both these examples, and other such like, as that St. Paul baptized in the house of Ananias [Acts 9] is easy. For there being persecutions at that time, so that it was not safe, neither for the minister nor for the people, to be seen, it was meet that they should do it in houses, which otherwise they would have done in open places: and then those houses which receive the congregation are not, as I have showed, for the time to be counted private houses: and further in places where the gospel has not been received, nor no church gathered, but one only household embracing the Gospel, I say in such a case, and especially in the time of persecution, where should the ministers preach, or minister the sacraments more conveniently than in that house where those professors of the gospel be? Now to draw this into our churches, which may safely come into open places, and where the church and congregation stands of diverse households, is a token of greate want of judgment, in shuffling those things together which, for the great diversity of their natures, will not be mingled.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9e5ff02224" data-kw="">
<blockquote><p>When we use the word faith strictly and properly we mean that for certain reasons apprehended by us we are satisfied as to the reality, reliability or truth of a certain event, object or person… When it has respect to a person we mean that we credit him as trustworthy in respect of that character which is under consideration… … To sum up, faith is trust. Trust presupposes an object. An object evokes our trust when there is an antecedent judgment of the mind that the object is trustworthy. This judgment is formed by the evaluation of evidence as sufficient. It is a state of mind induced by considerations objective to ourselves though always apprehended by our minds. … In this case it is useless or futile to try to ground this conviction [that the Scripture is the Word of God] upon rational argumentation based upon evidence extraneous to the sum total of the data with which the Christian revelation confronts us. It might seem that such argumentation is necessary in order to avoid the charge of arguing in a circle. But it will become apparent how impossible it is to produce by evidence extraneous to the Scripture the faith which has as its object the Scripture itself. The Reformers were aware of the fallacy attaching to argumentation on the basis of extrinsic evidence, and so they laid down the principle that Scripture is autopistic, that is, self-authenticating, and this means that the evidence validating the faith of Scripture as the Word of God is the Scripture itself. This is to say that it contains within itself the evidence of its divine origin, character, and authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Faith’ in Collected Writings 2.235-6, 237, 241</cite></span></figcaption>

</figure><figure class="quote" id="q-1308e1101d" data-kw="">
<blockquote><p>29. Furthermore, we do not say that the Gospel and the New Testament demand no condition at all, for the condition of faith and new obedience (which is everywhere impressed on us) is demanded. But God provides these conditions freely, and their imperfect quality forms no hinderance to salvation (which flows from another source), so long as they are genuine.</p></blockquote>

</figure><figure class="quote" id="q-07466e7fed" data-kw="">
<blockquote><p>Faith in Christ crucified is not commanded in the Law. For the apostle in Rom. 4:4–5 and 10:5–6, 11 sets faith in opposition to the Law; and in Gal. 3:12 he says that ‘The Law is not of faith,’ because the Law promises life to those who do the things contained in it. Therefore, faith is not comprehended under the Law. Nor indeed can there be any commerce between the Law and Christ as Mediator: “You are severed from Christ, you who are justified by the Law; you have fallen from grace” (Gal. 5:4). Faith in Christ crucified is a certain kind of righteousness: for it is obedience, and as it were a conformity to the command of God, as in 1 Jn. 3:23, “This is his commandment, that we should believe on the name of his Son,” and Jn. 3:36, “He who believes in the Son has eternal life; but he who does not obey the Son shall not see life, but the wrath of God abides on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reconciliation of a Sinner… in which the Doctrine of the Anglican Church on the Justification of the Ungodly is explicated and defended (Basil, 1624), bk. 1, ch. 6</cite>, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

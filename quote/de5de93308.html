<main class="wrap"><figure class="quote" id="q-de5de93308" data-kw="">
<blockquote><p>Where these causes are not, [viz. the being constrained to profess, believe or practice contrary to the Rule of Faith, or being deprived of means altogether necessary, or most expedient to salvation] but men may communicate without sin, professing the truth, and enjoy all ordinances as the freemen of Christ: Men must not separate from a Church, though there be corruption in it, to gather into a new Church, which may be more pure, and in some respects more comfortable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, c. 23</cite>, p. 162, 163 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f6b4c66580" data-kw="">
<blockquote><p>Though a Church of schismatics retaining the sound Faith, yet separating from others, be deserted by any, it is a negative separation from a true Church, and laudable. As the faithful in Augustine’s time did well in separating from the Donatists; for with them they were never one in that faction, though they separated not from the true Faith holden by Donatists, but kept a positive union with them: So do all the faithful well to separate from the churches of the separatists.</p></blockquote>

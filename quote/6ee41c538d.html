<main class="wrap"><figure class="quote" id="q-6ee41c538d" data-kw="">
<blockquote><p>[see p. 75 of Wolter’s Summary] 68. When being is divided through contradictory attributes opposite to each other with respect to being, one of the dividing attributes belongs to a perfection in being and the other to imperfection. The reason is that one extreme of the disjunction formally involves the negation of the other. But both perfections cannot formally be perfections simply or pure perfections, because, from conclusion 62, pure perfections cannot formally exclude each other. Likewise, both extremes cannot formally be imperfections or mixed perfections, otherwise no being could be infinite (against conclusion 65). But a true disjunctive should include under one or other extreme every actual or potential being. Therefore one extreme is a perfection (a pure perfection) and the other an imperfection (a mixed perfection). 69. From this follows a general law of disjunction, namely that in disjunct properties of being, when the extreme that is less noble is posited of any being, the other more noble extreme can be deduced about some other being (see Scotus, Oxon. 1, d. 39, q. un, n. 13). The reason is that the one extreme involves imperfection and is therefore finite, while the other involves perfection simply, or pure perfection. But from conclusion 65, if something is finite, something else is infinite and has all pure perfections in the highest degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’, ‘Conclusions respecting Reality’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>1. The medieval scholastics that Roman Catholics turn to for the doctrine of God, such as Thomas Aquinas and Bonaventure, were completely ignorant of Greek and Hebrew, so they are incapable of giving a useful discussion of the names of God. Only one question of Aquinas’s Summa is devoted to the names of God ([pt. 1] q. 13), and it doesn’t actually state what his names are and what they mean, how they are used in Scripture, etc. Instead, it focuses on scholastic questions like “Whether any name can be applied to God substantially?” and “Whether what is said of God and of creatures is univocally predicated of them?” Protestant writers, meanwhile, such as Zanchi, Polanus, etc, give lengthy and profound analyses of the names of God in Greek and Hebrew.” (Charles Johnson, ‘No, Roman Catholic authors are not better on the doctrine of God’) . God’s Attributes Agreements Calvin: “I am that I am</p></blockquote>

</figure><figure class="quote" id="q-22c305050e" data-kw="">
<blockquote><p>Althought God is not manifest to the senses comprehensively as he is in himself, yet he can be perceived apprehensively as shining in his works, appearing in signs, heard in the word and manifested in the fabric of the whole universe. (2) It is a false assumption that there is nothing in the intellect which was not before in some sense. For universals are in the intellect and never were in any sense. A mind is known as also an angel, yet they are never pereceived or seen except from their effects. Why therefore may not God be most certainly known in the mind from his works and a posteriori, although we cannot perceive Him with our eyes or any of the other bodily senses.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-dc7a50961f" data-kw="">
<blockquote><p>The time of the creation, as here I take it in general, is not only the first moment of time, as in this [first] verse it signifies, but also the six days mentioned distinctly in the rest of the chapter. For the highest heaven, and the rude matter, the earth, were created in the first moment of time, and all other things in the space of six days, as the history most plainly teaches… …or if I incline to any opinion concerning the time of the year, it is that the world was created in the Spring, when the day and night are equal and both of one length in all the world, that is, in the month [Hebrew] Abib, which is part of March and part of April.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 1, pp. 7-8. See also p. 6 for more similar context.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“The time of the creation, as here I take it in general, is not only the first moment of time, as in this [first] verse it signifies, but also the six days mentioned distinctly in the rest of the chapter. For the highest heaven, and the rude matter, the earth, were created in the first moment of time, and all other things in the space of six days, as the history most plainly teaches… …or if I incline to any opinion concerning the time of the year, it is that the world was created in the Spring, when the day and night are equal and both of one length in all the world, that is, in the month [Hebrew] Abib, which is part of March and part of April.”

— George Walker, The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons… (London: Barlet, 1641), Of the Creation of the World, ch. 1, pp. 7-8. See also p. 6 for more similar context.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+time+of+the+creation%2C+as+here+I+take+it+in+general%2C+is+not+only+the+first+moment+of+time%2C+as+in+this+%5Bfirst%5D+verse+it+signifies%2C+but+also+the+six+days+mentioned+distinctly+in+the+rest+of+the+chapter.+For+the+highest+heaven%2C+and+the+rude+matter%2C+the+earth%2C+were+created+in+the+first+moment+of+time%2C+and+all+other+things+in+the+space+of+six+days%2C+as+the+history+most+plainly+teaches%E2%80%A6+%E2%80%A6or+if+I+incline+to+any+opinion+concerning+the+time+of+the+year%2C+it+is+that+the+world+was+created+in+the+Spring%2C+when+the+day+and+night+are+equal+and+both+of+one+length+in+all+the+world%2C+that+is%2C+in+the+month+%5BHebrew%5D+Abib%2C+which+is+part+of+March+and+part+of+April.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+History+of+the+Creation+as+it+is+Written+by+Moses+in+the+First+%26+Second+Chapters+of+Genesis%3A+Plainly+Opened+%26+Expounded+in+Several+Sermons%E2%80%A6+%28London%3A+Barlet%2C+1641%29%2C+Of+the+Creation+of+the+World%2C+ch.+1%2C+pp.+7-8.+See+also+p.+6+for+more+similar+context.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc7a50961f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc7a50961f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=The%20time%20of%20the%20creation%2C%20as,of%20March%20and%20part%20of%20April&amp;text=The%20time%20of%20the%20creation%2C%20as%20here%20I&amp;text=is%20part%20of%20March%20and%20part%20of%20April" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-919683fb10" data-kw="">
<blockquote><p>Q. 10. How did God create man? A. God created man male and female, after his own image, in knowledge, righteousness, and holiness, with dominion over the creatures. (Gen. 1:26-28; Col. 3:10; Eph. 4:24) … Q. 59. Which day of the seven hath God appointed to be the weekly Sabbath? A. From the beginning of the world to the resurrection of Christ, God appointed the seventh day of the week to be the weekly Sabbath; and the first day of the week, ever since, to continue to the end of the world, which is the Christian Sabbath. (Gen. 2:2-3; 1 Cor. 16:1-2; Acts 20:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shorter Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-54fedc6566" data-kw="">
<blockquote><p>It is therefore clear from the foregoing, that if there be an intellect which knows all things by its essence, then its essence must needs have all things in itself immaterially; thus the early philosophers held that the essence of the soul, that it may know all things, must be actually composed of the principles of all material things. Now this is proper to God, that His Essence comprise all things immaterially as effects pre-exist virtually in their cause. God alone, therefore, understands all things through His Essence: but neither the human soul nor the angels can do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 84, art. 2, I answer that</span></figcaption>

<blockquote><p>As God is perfect in His works, He bestowed perfection on all of them according to their capacity: God’s works are perfect (Deut 32:4). He Himself is simply perfect by the fact that all things are pre-contained in Him, not as component parts, but as united in one simple whole, as Dionysius says (Div. Nom. v); in the same way as various effects pre-exist in their cause, according to its one virtue.</p></blockquote>

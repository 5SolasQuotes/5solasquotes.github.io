</figure><figure class="quote" id="q-3d3b7daf0e" data-kw="">
<blockquote><p>The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16</cite>, (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45, p. 1094</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><figure class="quote" id="q-1cd6b34de3" data-kw="unpardonable">
<blockquote><p>This was opposed by the decree of the National Synod which met at Charenton in 1644, which sanctioned and confirmed the doctrine received in our churches concerning the imputation of Adam’s first sin and the hereditary corruption flowing upon all. The words of the decree are as follows: “Whereas a report has been made to the Synod of certain writings, printed and manuscript, by which the nature of original sin is made to consist solely in the hereditary corruption, originally residing in all men, but the imputation of the first sin of Adam is denied; the Synod condemns the aforesaid doctrine so far as it restricts the nature of original sin to the mere hereditary corruption of Adam’s posterity, excluding the imputation of the first sin by which he fell; and, under the penalty of censures of all kinds, forbids all pastors, professors and others who may treat this subject, to depart from the common opinion of all Protestant churches, which, besides corruption, have always acknowledged the aforesaid imputation to the whole posterity of Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.9</span></figcaption>

<blockquote><p>I shall not go about to define or circumscribe exactly the bounds wherein to conclude wilful sinning: I shall not confine this evil spirit with any circle: because I would have every one to look well about, lest the case be his own…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16</cite>, (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45, p. 1,098</span></figcaption>

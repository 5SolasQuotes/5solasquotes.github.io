<main class="wrap"><figure class="quote" id="q-f1ec973001" data-kw="">
<blockquote><p>But our [Reformed] theologians and very many of the Pontificists, both Jesuits and Dominicans, follow a different opinion, and deservedly; for it is certain that the human will is so efficaciously moved and prevented by divine grace that it is infallibly determined to the act of conversion. But whether this determination of the will by grace happens through moral but efficacious persuasions alone [on the intellect, with the will necessarily following], or also through a physical and immediate inclination of the will (which I deem more probable), is not something we should now discuss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658), Theological Determinations, ‘The Grace of Conversion Determines the Will’</cite>, p. 171</span></figcaption>

<main class="wrap"><figure class="quote" id="q-56c628c96a" data-kw="">
<blockquote><p>Whatsoever worship is offered up to God by the minister, whether in prayer conceived by himself or devised by others, it is in the name of the congregation: but every phrase, petition or branch of petition is not approved by their presence, silence, or saying ‘Amen’ to the prayers in general… The presence of the people was never deemed interpretatively a consent to every thing that was there done. The prayers which for matter God disallows we ought to disallow, but as God disallows them, and as He calls us forth to bear witness to his truth. But it is one thing to tolerate, another to approve; one thing to disallow the method or form, another the matter; one thing privately to dislike, another openly to witness against a thing as in no wise to be born withal; one thing to speak when we are called forth, another to thrust ourselves forth unadvisedly. Some things are to be born with in brethren whereof we are not bound so much as to admonish them, unless we be entirely familiar and of intimate acquaintance: Some things we must bear with though upon admonition they be not amended. The people must bear with some infirmities in their minister, both in preaching and prayer, as he must with some wants in them, without so much as taking notice of them to admonish by way of censure.¹ ¹ “Sins are either controvertable or manifest: If controvertable and doubtful, men ought to bear one with another’s different judgment; if they do not, but any for this make a breach of Separation, they sin.” Henry Ainsworth, Against Mr. Bern. Reas. Removed, p. 17 And if upon admonition he cannot be of their minds in everything, they must not reject and cast him off, no more than he is to cut them off because in every point they conform not to his pleasure. If the parties be stubborn, and will not hear admonitions, but rather grow more perverse and desperate, even to rent and tear in pieces such as seek to reclaim them, we are not bound to make known our judgment and profession unto them, unless we be lawfully called of God thereunto. And if the greater part be in errour and so stiff that they would sooner persecute the better than reform, if it be not in matters fundamental or bordering thereupon, or noxious and pernicious to be concealed, I know not that either that innocent [person] is allowed to separate from the exercises of religion for that cause, or bound to admonish them of their error. He that taught to suffer the tares rather then to pluck up the wheat with them (Mt. 13:29), has showed a reason for this judgement. (See Calvin, Epistle 117) ‘This I do infinitely grieve at’ (said Augustine): ‘that many most wholesome precepts of divine Scripture are little regarded, and in the meantime all is so full of many presumption, that he is more grievously found fault with who during this octaves touches the earth with his naked foot than he that shall bury his soul in drunkenness. And after, I cannot approve them, and I think they are to be cut off wheresoever we have power. Many of these things, for fear of scandalizing many holy persons, or provoking those that are turbulent, I dare not freely disallow.’ That every private Christian should in public manner question the doctrine of his minister or the prayers of the congregation, and declare his dislike in whatsoever is not agreeable to his particular opinion, in such manner as is mentioned, is neither commanded of God, nor consonant to right reason, is not agreeable to order, peace, love, or Christian moderation, and of necessity must fill the church with confusion, disorder, rents and schisms.</p></blockquote>

<blockquote><p>First, that the iniquity of the Queen Regent and disorder ought in nowise to withdraw neither our hearts, neither yet the hearts of other subjects, from the obedience due unto our sovereign. Secondly, that if we deposed the said Queen Regent rather of malic and private envy, than for the preservation of the commonwealth, and for that her sins appeared uncurable, that we should not escape God’s just judgment, howsoever that she had deserved rejection from honors. And thirdly,” he required, “that no such sentence should be pronounced against her, but that upon known and open repentance, and upon her conversion to the commonwealth, and submission to the nobility, place shall be granted unto her of regress to the same honors from the which, for just causes, she justly might be deprived.</p></blockquote>

</figure><figure class="quote" id="q-74159f9800" data-kw="">
<blockquote><p>And for my part this I say, and I say it with much integrity, I never yet took up religion by parties, in the lump; I have found by trial of things, that there is some truth on all sides. I have found holiness where you would little think it, and so likewise truth; and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion. My brethren, this rule that I have now mentioned (which I profess I have lived by, and shall do while I live), I know I shall never please men in it. Why? it is plain, For this is the nature and condition of all mankind; if a man dissents from others in one thing, he loses them in all the rest; and therefore if a man do take what is good of all sides, he is apt to lose them all, but he pleases Christ by it, and so will I for this particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, p. 559</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And for my part this I say, and I say it with much integrity, I never yet took up religion by parties, in the lump; I have found by trial of things, that there is some truth on all sides. I have found holiness where you would little think it, and so likewise truth; and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion. My brethren, this rule that I have now mentioned (which I profess I have lived by, and shall do while I live), I know I shall never please men in it. Why? it is plain, For this is the nature and condition of all mankind; if a man dissents from others in one thing, he loses them in all the rest; and therefore if a man do take what is good of all sides, he is apt to lose them all, but he pleases Christ by it, and so will I for this particular.”

— Thomas Goodwin, Works, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, p. 559">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+for+my+part+this+I+say%2C+and+I+say+it+with+much+integrity%2C+I+never+yet+took+up+religion+by+parties%2C+in+the+lump%3B+I+have+found+by+trial+of+things%2C+that+there+is+some+truth+on+all+sides.+I+have+found+holiness+where+you+would+little+think+it%2C+and+so+likewise+truth%3B+and+I+have+learned+this+principle%2C+which+I+hope+I+shall+never+lay+down+till+I+am+swallowed+up+of+immortality%3B+and+that+is+that+which+I+said+before%3A+To+acknowledge+every+good+thing%2C+and+hold+communion+with+it%2C+in+men%2C+in+churches%2C+or+whatsoever+else.+I+learn+this+from+Paul%3B+I+learn+this+from+Jesus+Christ+Himself%3A+He+fills+all+in+all%3B+He+is+in+the+hearts+of+his+people%2C+and+fills+them+in+his+ordinances+to+this+day%3B+and+where+Jesus+Christ+fills%2C+why+should+we+deny+an+acknowledgment+and+a+right+hand+of+fellowship+and+communion.+My+brethren%2C+this+rule+that+I+have+now+mentioned+%28which+I+profess+I+have+lived+by%2C+and+shall+do+while+I+live%29%2C+I+know+I+shall+never+please+men+in+it.+Why%3F+it+is+plain%2C+For+this+is+the+nature+and+condition+of+all+mankind%3B+if+a+man+dissents+from+others+in+one+thing%2C+he+loses+them+in+all+the+rest%3B+and+therefore+if+a+man+do+take+what+is+good+of+all+sides%2C+he+is+apt+to+lose+them+all%2C+but+he+pleases+Christ+by+it%2C+and+so+will+I+for+this+particular.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+Works%2C+12+vols.+%28d.+1680%3B+Edinburgh%3A+Nichol%2C+1861%29%2C+vol.+1%2C+Exposition+of+Eph.+1+%281681%29%2C+sermon+36%2C+on+1%3A22-23%2C+p.+559&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74159f9800.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74159f9800.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=And%20for%20my%

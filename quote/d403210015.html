<blockquote><p>Speaking of the Jews nationally Jesus said: “The kingdom of God shall be taken away from you and shall be given to a nation bringing forth the fruits thereof” (Matt. 21:43). And after the woes pronounced upon the Scribes and Pharisees, He said: “Behold, your house is left unto you desolate” (Matt. 23:38). Interpreting those words in the light of history, we see that the privilege of being God’s representative in the world and of proclaiming the Gospel to the world has been taken away from Israel as a nation and has been given to the Christian Church. Similarly, the Apostle Paul, also speaking of the Jews nationally, said that “wrath is come upon them to the uttermost” (I Thess. 2:16) – which again leaves no room for a revival of Judaism, nor for a Jewish era of any kind. But it does leave room for the conversion of the Jews as individuals along with individuals from all other national groups, even for the large majority of individuals within these groups, as the Church progresses in the world.

Judaism as a legitimate religious system was brought to its full end and abolished by the crucifixion of Christ, not merely because the nation acting officially through its Sanhedrin rejected the Messiah, but because God’s purpose with it was finished. With the establishment of the Christian Church Judaism should have made a smooth and willing transition into Christianity, and should thereby have disappeared as the flower falls away before the developing fruit. Its continued existence as a bitter rival and enemy of the Christian Church after the time of Christ, and particularly its revival after the judgment of God had fallen on its so heavily in the destruction of Jerusalem and the dispersal of the people in the 70 A.D., was sinful. No divine favour could rest upon such a movement, but only divine disfavour – such as it indeed has suffered through the centuries.

Bitter persecution of any Jews who accepted Christianity because a characteristic and distinguished mark of this revived Judaism as it followed the traditions of the Pharisees and Sadducees who had opposed Christ so bitterly during the days of His flesh. Jews who became Christians, thus ostracized from their fellow Jews, tended to merge into the Gentile communities in which they found themselves, which was the natural and providentially appointed thing for them to do. Revived Judaism made it extremely hard to reach individual Jews with the Gospel. In a broader treatment of this whole subject Dr. Albertus Pieters, in a book entitled, The Seed of Abraham, has shown very conclusively that the Christian Church is the legitimate heir and successor of Old Testament Israel, and that the Old Testament prophecies and promises so far as they remain unfulfilled are to be fulfilled not to the Jews as a national group but to the Church which is the New Testament Israel.

Furthermore, this revived Judaism built again the middle wall of partition and so made it possible to perpetuate through the centuries the distinction between Jews and Gentiles. The continuance of this bitterly anti-Christian racial group has brought no good to themselves, and there has been strife and antagonism in practically every nation where they have gone. They have not been a happy people. One need only think of the pogroms in Russia, the ghettos of eastern Europe, the many restrictions and persecutions that they have suffered in Italy, Spain, Poland, and other countries, and in our own day the campaign of extermination waged against them in Germany by Hitler.

At the present time we see this problem in a particularly aggravated form in the Near East, where the recently established nation of Israel has ruthlessly displaced an Arab population and seeks to expand further into the surrounding regions, some 900,000 Arabs in refugee camps around the borders of Israel being one of the chief continuing causes for bitterness. There a nation of less than two million Jews is surrounded by a solid block of Arab nations with a population of some 40 million. Israel is not a self-sustaining nation, and her existence to date has been heavily subsidized by American money and equipment – much of it undoubtedly having been given for the purpose of influencing the Jewish vote in this country.

There is no indication that the age-old rivalry between Jew and Arab can be settled in the foreseeable future. Indeed, on several occasions it has seemed that World War Three might easily be triggered by a rash or provocative act either by Israel or the Arab states, e.g., an act such as Israel’s invasion of Egypt in 1956. The mere fact that these people are Jews does not in itself give them any more moral or legal right to Palestine than to the United States or any other part of the world. This does not mean, of course, that the Arabs are any less anti-Christian or any less inclined toward provocative acts than are the Jews. But the fact of the matter is that the existence of Israel as a nation and its support by the West has done more than all other causes combined to alienate the Arab world with its rich resources of oil and to drive it toward the Russian sphere of influence.</p></blockquote>

<blockquote><p>To stir up every one to help forward this glorious work of the Jews’ conversion; they were sometimes the chief, and the first born; though now their dignity is gone, and they are as prisoners in the pit; help we to restore them to their former liberty, lift them out of the pit into which they are fallen; If it were but our enemies beast, we were bound to help it out, how much more these that have been the people of God, and have such promises made unto them?

What shall we do to help forward their calling and conversion?

Take away (as much as in us lies) the stumbling block, which hinders their coming in; and these blocks are two; First, The one is the Idolatry of Christian Churches, especially that of Rome, whiles we do anything to uphold these Idolatries, we doe put the stumbling block before them, to hinder them; but take away these stones and blocks which they stumble at, and then their way will be more easy and plain. Secondly, The other is the carnalness and licentiousness of the lives of Christians, this is a great stumbling block unto them; remove this from before them, let them see a spirit of grace shining upon us, and appearing in our lives: and then we shall make plain the way of the Lord for them to return to Sion, see Esay 57.14.

Intreat the Lord for them, that he would visit them in due time, be we their remembrancers before the Lord; they have long lain in the dungeon, as Esa. 42.22. and been made a prey of, and there hath been none to say, restore, let us therefore speak unto God in their behalf, and say, Lord restore thy ancient people, bring them back to the fellowship of thy Church; take to you the words of Micah, Chap. 7.14. Feed thy people with thy rod, and the flock of thine inheritance in the midst of Carmel; let them feed in Bashan and Gilead, as in old time; commend their estate unto God, and the rather should we do this, Because

1. They prayed for us when we were no people, that we might be the people of God, Psal. 67.1, 2. When the salvation of God was revealed to them, they prayed that it might be revealed unto us; We have a little sister (said they) Cant. 8.8. They took thought for us, we being then that little sister, and so let us do for them.

2. It is from them that the means of salvation is come to us, the Law is called their Law, Joh. 10.34. It was given as an inheritance to the children of Israel, Deut. 33.4. And the spiritual things of the Gospel, are called their spiritual things, Rom. 15.27. And thence is that in Esa. 2.3. The Law shall go forth of Sion, and the word of the Lord from Jerusalem: yea, and of them came Christ concerning the flesh, Rom. 9. All the means of grace and salvation, are theirs first, and from them they come unto us; and thence it is that Christ himself tells us, That salvation is of the Jews, Joh. 4.22. We owe them this therefore, as a requital unto them.

3. Consider a further good that shall come unto ourselves by their calling unto Christ, there shall be an increase of blessing coming to ourselves. Great light shall be manifested, and knowledge shall increase, Esa. 24. ult. The light of the Sun, and of the Moon shall be darkened, by the light which shall come from that Church, the light of the Jewish Church which was but as the light of the Moon, and the light of the Gentile Churches, which is as the Sun, shall both be dim in comparison of the light which shall be in that Church, when the glory of the Lord is risen upon them. See Esa. 60.1.2. which speaks of the estate of the Jewish Church after their calling, as appears by that which goes before, Chap. 59. end. Many of those dark Prophecies, which now lie hid in obscurity, shall then be brought to light; the accomplishment of them will then give us the interpretation.

4. Admit we neither had received benefit from them hitherto, nor could expect any further blessing hereafter, yet consider the glory which shall then come to Christ by their coming in, the glory of his kingdom shall be enlarged, Jerusalem shall be a throne of glory to him, Jer. 3.17. then shall the Lord be glorified in them, all the house of Israel shall glory in the Lord, Esa. 45.25. and shall draw others of the Gentiles unto them.

5. If there were neither good to ourselves, nor glory to Christ by their calling, yet even pity and compassion should move us; consider who they are, even the children of Abraham our father, and Sarah our mother; they are our brethren, and our flesh; and how should it pity us to see the children of our father in the dungeon, and prison-pit? Oh pray for them, that the blessing of Abraham their father may come upon them.</p></blockquote>

<blockquote><p>THAT a General Conversion of the Israelitish Nation, is according to the Scriptures to be expected in the latter Ages of the World, is nothing but what Christians in all Ages have believed. So the Ancients (Fathers as they are called) who lived towards the Primitive Times. So the Schoolmen in the dark Days of Popery.

So the chief Reformers in this and the last Century, all which I have elsewhere made to appear, and therefore shall not again mention the Names of those great Authors, whether ancient or modern, which have declared their Judgment, and given their Testimony to what we assert as a glorious Truth.</p></blockquote>

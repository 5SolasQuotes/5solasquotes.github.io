<main class="wrap"><figure class="quote" id="q-e45f732c01" data-kw="">
<blockquote><p>Thesis XVI. The duration of original sin is its affection by which original sin begins from the first origin of human conception and lasts to the end of his life… For since perfect regeneration is not given in this life, and the baptized sometimes become more wicked than the unbaptized, it is a necessary consequence that original sin is not taken away in this life with respect to its existence, but only with respect to its guilt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 7 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3288340cc" data-kw="">
<blockquote><p>Note also that by being ‘sanctified to Christ as a peculiar people,’ we intend first the real change, commonly called sanctification, and also the relation that thence follows, of being a separated, sanctified, dedicated, peculiar people.</p></blockquote>

</figure><figure class="quote" id="q-425a07252a" data-kw="">
<blockquote><p>Sanctification then may be described [as] The grace of God infused into the soul of a sinner, and purifying it by faith… Thirdly, both sanctification and justification are alike owing to faith as their immediate cause, next under God’s Spirit, as may be gathered from the prayer of Christ for his disciples: ‘Sanctify them through thy truth: thy word is truth,’ [Jn. 17:17] that is, the doctrine of Faith, received. To which faith, the effect of sanctification is ascribed by St. Peter in the Acts, whereby the hearts of the gentiles were purified or sanctified. (Acts 15:9 [‘And put no difference between us and them, purifying their hearts by faith.’])</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17, pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-f3489fda81" data-kw="">
<blockquote><p>First, in the Creation; his essence and attributes are clearly revealed, his absolute power, unerring wisdom, and infinite goodness are discovered to every capacity; therefore the apostle urges this as the most proper argument to convince the heathens, Acts 14:15, ‘That they should turn from their vanities, to the living God which made heaven and earth, and sea, and all things that are therein.’ To this they must naturally assent, as shadows represent the figure of those bodies from whence they are derived; so in the world there are such traces of the divine perfections that it is easy to infer there is a Sovereign being which is the cause of it; all the creatures and their various excellencies are as so many beams which reflect upon this Sun, or lines which direct to this Center; nay, the meanest being carries some impression of the first cause, as the image of a prince is stamped upon a penny, as well as upon greater money; the beasts will instruct, and the mute fishes teach the atheist there is a God; and though he is not discerned by the outward sight, yet the understanding will as certainly discover him as it does an invisible spirit in a living body…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in The Morning Exercise Methodized… by several Ministers of the City of London… (London: E.M. for Ralph Smith, 1660), Sermon 2, ‘God is’, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

rst%2C%20in%20the%20Creation%3B%20his%20essence,invisible%20spirit%20in%20a%20living%20body&amp;text=First%2C%20in%20the%20Creation%3B%20his%20essence%20and%20attributes&amp;text=does%20an%20invisible%20spirit%20in%20a%20living%20body" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-53c3a82b63" data-kw="">
<blockquote><p>Whether the infusion of grace is required for justification? It is distinguished. Whether some movement of free choice and faith is required? It is affirmed with a distinction. … Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, 9. ‘Justification’, Of Justification in General in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2, tract 3 Abbr.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

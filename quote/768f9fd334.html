<blockquote><p>The doctrine of justification, which now follows, is one of the chief articles of our faith, not only because it treats of those things which are fundamental, but also because it is most frequently called in question by heretics. The controversies between the church and heretics have respect principally to two points: the one is concerning God, and the other concerning the justification of man in the sight of God. And such is the importance of these doctrines that if either one of them be overthrown, the other parts of our faith easily fall to pieces. Hence it becomes necessary for us, to fortify and establish ourselves, especially in these doctrines, against all the assaults of heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Orthodox Doctrine of the Explication of the Catechism, on Q. 7</cite></span></figcaption>

<blockquote><p>And it is inquired what it is whereon their continuation in this state does on their part depend; or what is required of them that they may be justified unto the end. And this as some say is not faith alone, but also the works of sincere obedience. And none can deny but that they are required of all them that are justified, whilst they continue in a state of justification on this side glory… …that which was the necessity of owning a personal obedience in justified persons, is on all hands absolutely agreed…</p></blockquote>

<blockquote><p>‘Which believe in Him that raised up Jesus our Lord from the dead, who was delivered for our sins, and is risen again for our justification.’ …But here arises a doubt, by what means the apostle may seem to seioine and to put asunder these things one from the other: namely, the forgiveness of sin, and justification: and one the other side, the faith of the death, from the faith of the resurrection, when as it seems that by the faith of each part, of his death (I say) and of his resurrection is given not only remission of sins but also justification. … …wherefore there are yet behind two other very likely interpretations: Of which the first is, that in very deed, by the death of Christ was paid the price of our redemption. But, that it might be applied unto us, there needs the Holy Ghost, to move us to believe, and Christ to give unto us this Holy Ghost, rose again from death, sent abroad his apostles to preach into all parts of the world, and now also before the Father, executes the office of an intercessor and high priest: therefore is He said to have risen again to help us that we might obtain justification. Chrysostom seems to lean unto this sentence. The second exposition [as pertaining to inherent righteousness] is that the faith of the death and of the resurrection brings justification: but Paul seioyned them aptly to declare the analogy and proportion between them. Unto the death of Christ answers very well the forgiveness of sins, for by reason of them, death was due unto us. And as Christ, as touching this corruptible life, died, so also ought we, when we are justified to die unto sin. Again because justification seems herein to be declared in that we begin a new life, therefore is it referred unto the resurrection of Christ: for that he then seemed to have begun a celestial and happy life. Paul used in a maner the self-same form of words in this same epistle, when he says [Rom. 10]: ‘with the heart we believe unto righteousness: and with the mouth is confession made to salvation.’ For the faith of the heart both works righteousness and also brings salvation: but because salvation and instauration are chiefly declared in action, therefore he ascribed it to confession. But whither of these expositions is the truer, neither will I contend, nor also now declare. Of those things which have now been spoken, we gather a most sweet consolation: for thereby we do not only know the weight of sin, but also we understand that God bare a singular good love towards us: as one which gave his only begotten Son, and that unto the death to deliver us from sins. Farther, seeing Christ is said to have risen from the dead for our justification, we easily see that we are by Him called back to a new life: unto which yet we cannot aspire, except we be of Him elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Learned &amp; Fruitful Commentary upon the Epistle of St. Paul to the Romans</cite>, ... (d. 1562; London: 1568), on ch. 4, verse 25, p. 97</span></figcaption>

<blockquote><p>Thus a Christian man is righteous and a sinner at the same time, holy and profane, an enemy of God and a child of God.* None of the sophists will admit this paradox, because they do not understand the true meaning of justification. This was why they forced men to go on doing good works until they would not feel any sin at all. By this means they drove to the point of insanity many men who tried with all their might to become completely righteous in a formal sense but could not accomplish it. And innumerable persons even among the authors of this wicked dogma were driven into despair at the hour of death, which is what would have happened to me if Christ had not looked at me in mercy and liberated me from this error. We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph. 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.” As I have said, therefore, any Christian is a supreme pontiff, because, first, he offers and slaughters his reason and the mind of the flesh, and, secondly, he attributes to God the glory of being righteous, truthful, patient, kind, and merciful. This is the continuous evening and morning sacrifice in the New Testament. The evening sacrifice is to kill the reason, and the morning sacrifice is to glorify God. Thus a Christian is involved, daily and perpetually, in this double sacrifice and in its practice. No one can adequately proclaim the value and the dignity of Christian sacrifice. Therefore this is a marvelous definition of Christian righteousness: it is a divine imputation or reckoning as righteousness or to righteousness, for the sake of our faith in Christ or for the sake of Christ. When the sophists hear this definition, they laugh; for they suppose that righteousness is a certain quality that is first infused into the soul and then distributed through all the members. They cannot strip off the thoughts of reason, which declares that righteousness is a right judgment and a right will. Therefore this inestimable gift excels all reason, that without any works God reckons and acknowledges as righteous the man who takes hold by faith of His Son, who was sent into the world, who was born, who suffered, and who was crucified for us.</p></blockquote>

the glory of being righteous, truthful, patient, kind, and merciful. This is the continuous evening and morning sacrifice in the New Testament. The evening sacrifice is to kill the reason, and the morning sacrifice is to glorify God. Thus a Christian is involved, daily and perpetually, in this double sacrifice and in its practice. No one can adequately proclaim the value and the dignity of Christian sacrifice. Therefore this is a marvelous definition of Christian righteousness: it is a divine imputation or reckoning as righteousness or to righteousness, for the sake of our faith in Christ or for the sake of Christ. When the sophists hear this definition, they laugh; for they suppose that righteousness is a certain quality that is first infused into the soul and then distributed through all the members. They cannot strip off the thoughts of reason, which declares that righteousness is a right judgment and a right will. Therefore this inestimable gift excels all reason, that without any works God reckons and acknowledges as righteous the man who takes hold by faith of His Son, who was sent into the world, who was born, who suffered, and who was crucified for us.”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 232–34.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+a+Christian+man+is+righteous+and+a+sinner+at+the+same+time%2C+holy+and+profane%2C+an+enemy+of+God+and+a+child+of+God.%2A+None+of+the+sophists+will+admit+this+paradox%2C+because+they+do+not+understand+the+true+meaning+of+justification.+This+was+why+they+forced+men+to+go+on+doing+good+works+until+they+would+not+feel+any+sin+at+all.+By+this+means+they+drove+to+the+point+of+insanity+many+men+who+tried+with+all+their+might+to+become+completely+righteous+in+a+formal+sense+but+could+not+accomplish+it.+And+innumerable+persons+even+among+the+authors+of+this+wicked+dogma+were+driven+into+despair+at+the+hour+of+death%2C+which+is+what+would+have+happened+to+me+if+Christ+had+not+looked+at+me+in+mercy+and+liberated+me+from+this+error.+We%2C+on+the+other+hand%2C+teach+and+comfort+an+afflicted+sinner+this+way%3A+%E2%80%9CBrother%2C+it+is+impossible+for+you+to+become+so+righteous+in+this+life+that+your+body+is+as+clear+and+spotless+as+the+sun.+You+still+have+spots+and+wrinkles+%28Eph.+5%3A27%29%2C+and+yet+you+are+holy.%E2%80%9D+But+you+say%3A+%E2%80%9CHow+can+I+be+holy+when+I+have+sin+and+am+aware+of+it%3F%E2%80%9D+%E2%80%9CThat+you+feel+and+acknowledge+sin%E2%80%94this+is+good.+Thank+God%2C+and+do+not+despair.+It+is+one+step+toward+health+when+a+sick+man+admits+and+confesses+his+disease.%E2%80%9D+%E2%80%9CBut+how+will+I+be+liberated+from+sin%3F%E2%80%9D+%E2%80%9CRun+to+Christ%2C+the+Physician%2C+who+heals+the+contrite+of+heart+and+saves+sinners.+Believe+in+Him.+If+you+believe%2C+you+are+righteous%2C+because+you+attribute+to+God+the+glory+of+being+almighty%2C+merciful%2C+truthful%2C+etc.+You+justify+and+praise+God.+In+short%2C+you+attribute+divinity+and+everything+to+Him.+And+the+sin+that+still+remains+in+you+is+not+imputed+but+is+forgiven+for+the+sake+of+Christ%2C+in+whom+you+believe+and+who+is+perfectly+righteous+in+a+formal+sense.+His+righteousness+is+yours%3B+your+sin+is+His.%E2%80%9D+As+I+have+said%2C+therefore%2C+any+Christian+is+a+supreme+pontiff%2C+because%2C+first%2C+he+offers+and+slaughters+his+reason+and+the+mind+of+the+flesh%2C+and%2C+secondly%2C+he+attributes+to+God+the+glory+of+being+righteous%2C+truthful%2C+patient%2C+kind%2C+and+merciful.+This+is+the+continuous+evening+and+morning+sacrifice+in+the+New+Testament.+The+evening+sacrifice+is+to+kill+the+reason%2C+and+the+morning+sacrifice+is+to+glorify+God.+Thus+a+Christian+is+involved%2C+daily+and+perpetually%2C+in+this+double+sacrifice+and+in+its+practice.+No+one+can+adequately+proclaim+the+value+and+the+dignity+of+Christian+sacrifice.+Therefore+this+is+a+marvelous+definition+of+Christian+righteousness%3A+it+is+a+divine+imputation+or+reckoning+as+righteousness+or+to+righteousness%2C+for+the+sake+of+our+faith+in+Christ+or+for+the+sake+of+Christ.+When+the+sophists+hear+this+definition%2C+they+laugh%3B+for+they+suppose+that+righteousness+is+a+certain+quality+that+is+first+infused+into+the+soul+and+then+distributed+through+all+the+members.+They+cannot+strip+off+the+thoughts+of+reason%2C+which+declares+that+righteousness+is+a+right+judgment+and+a+right+will.+Therefore+this+inestimable+gift+excels+all+reason%2C+that+without+any+works+God+reckons+and+acknowledges+as+righteous+the+man+who+takes+hold+by+faith+of+His+Son%2C+who+was+sent+into+the+world%2C+who+was+born%2C+who+suffered%2C+and+who+was+crucified+for+us.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1-4%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+232%E2%80%9334.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2eced062aa.html&amp;via=5Solas" target="_blank" rel <blockquote><p>We think that even the adversaries acknowledge that, in justification, the remission of sins is necessary first. For we all are under sin. Wherefore we reason thus: To attain the remission of sins is to be justified, according to Ps. 32:1, ‘Blessed is he whose transgression is forgiven.’ By faith alone in Christ, not through love, not because of love or works, do we acquire the remission of sins, although love follows faith. Therefore by faith alone we are justified, understanding justification as the making of a righteous man out of an unrighteous, or that he be regenerated.</p></blockquote>

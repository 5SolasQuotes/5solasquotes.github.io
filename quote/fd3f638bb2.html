<main class="wrap"><figure class="quote" id="q-fd3f638bb2" data-kw="">
<blockquote><p>Not long since [during the times of Romanism] what a stir was there about the more than decent, even superstitious adorning of temples, and building of altars, and brave canopies, what sumptuous things and fine knacks had they, and all to set out a pompous superstitious way of worship? This altogether prevailed; as for the purity and simplicity of Gods ways and worship, how was it trampled under feet as an unworthy contemptible thing? But these things that for a while seemed so glorious, begin to vanish, and we hope ere long will come to nothing, the very memory of them shall perish, the purity of God’s worship, and the simplicity of the Gospel in God’s ordinances shall recover their beauty and glory when those braveries shall be no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Prophesy of Hosea</cite>, … (d. 1646; London, 1652), on 2:16-18, p. 412</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking; that poor souls, which ought to have been ruled by the doctrine of Christ, are oppressed by cruel bondage; that nothing is seen in the Christian Church that is not deformed and debased; that the grace of Christ not only lies half-buried, but is partly torn to pieces, partly altogether extinguished.</p></blockquote>

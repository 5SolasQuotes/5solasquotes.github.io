<main class="wrap"><figure class="quote" id="q-49b281ea0b" data-kw="">
<blockquote><p>The Son, as God, hath a natural dominion over all. To this he can be no more appointed than he can be to be God. On what account he hath his divine nature, on the same he hath all the attributes and perfections of it, with all things that necessarily on any supposition attend it, as supreme dominion doth. Nor doth this denotation of him respect merely the human nature; for although the Lord Christ performed all the acts of his mediatory office in and by the human nature, yet he did them not as man, but as God and man in one person, John i. 14, Acts xx. 28. And therefore unto him, as such, do the privileges belong that he is vested with on the account of his being mediator.

Nothing, indeed, can be added unto him as God, but there may be to him who is God, in respect of his condescension to discharge an office in another nature which he did assume. … This one “Deus altissimus,” “most high God,” absolutely, in respect of his divine nature, cannot be appointed an heir by any other. But he who is so this high God as to be the eternal Son of the Father, and made man, may, in respect of the office which in the nature of man he undertook to discharge, by his Father be made “heir of all.” …

And such weight doth the Scripture lay upon this glorious investiture of Christ in his inheritance, that it speaks of his whole power as then first granted unto him, Rom. xiv. 9; Phil. ii. 7-10; and the reason of it is, because he had then actually performed that work and duty upon the consideration whereof that power and authority were eternally designed and originally granted unto him. God’s actual committing all power over all things and persons in heaven and earth, to be exerted and managed for the ends of his mediation, declaring this act, grant, and delegation by his resurrection, ascension, and sitting at his right hand, is that which this word denotes.

THINGS that are subject unto the Lord Jesus may be referred unto four heads; for they are either, — 1. Spiritual; or, 2. Ecclesiastical; or, 3. Political; or, 4. Natural.

Again, Spiritual are either, (1.) Temporal, as, [1.] Grace; [2.] Gifts; or (2.) Eternal, as glory. Ecclesiastical or church things are either, (1.) Judaical, or old testament things; or, (2.) Christian, or things of the new testament.

Political and civil things may be considered as they are managed, (1.) By his friends; (2.) His enemies. …

III. He is Lord also of political things. All the governments the world, that are set up and exercised therein for the good of mankind, and the preservation of society according to the rules of equity and righteousness, — over all these, and those who in and by them exercise rule and authority amongst men, is he lord and king.

He alone is the absolute potentate; the highest on the earth are in a subordination unto him. That, 1. He was designed unto, Ps. lxxxix. 27. And accordingly he is, 2. made Lord of lords, and King of kings, Rev. xvii. 14, xix. 16; 1 Tim. vi. 15. And, 3. He exerciseth dominion answerable unto his title, Rev. vi. 14-17, xvii. 14, xix. 16-20; Ps. ii. 8, 9; Isa. lx. 60; Mic. v. 7-9. And, 4. Hath hence right to send his gospel into all nations in the world, attended with the worship by him prescribed, Matt. xxviii. 19; Ps. ii. 9-12; which none of the rulers or governors of the world have any right to refuse or oppose; nor can so do, but upon their utmost peril And, 5. All kingdoms shall at length be brought into a professed subjection to him and his gospel, and have all their rule disposed of unto the interest of his church and saints, Dan. vii. 27; Isa. lx. 12; Rev. xix. 16-19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 40-41, 45, 49, 68.</span></figcaption>

<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>

<blockquote><p>9. Third, out of this union depends the conjunction or collation of the operations, since one nature with the other is conjoined, its energies, that is, actions, [work] to one effect, or work of redemption: by the deity working those things which are required of immensity, humanity things human, which is a proper instrument for the deity, it subserving it and with the deity it works things henomenos ou dieremenos, that is ‘unitedly, not separately’. Thus it is called theandrikon apotelesma, so Damascus, bk. 3, ch. 19 terms it, ‘a theandric energy’.</p></blockquote>

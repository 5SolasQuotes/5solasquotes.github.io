<main class="wrap"><figure class="quote" id="q-c84efdb233" data-kw="">
<blockquote><p>XIV. In addition, it is worth inquiring how faith influences justification, or how it stands in relation to justification: (1) it certainly does not influence it as its meritorious cause, either totally or partially, because Scripture not only testifies constantly that we are justified freely by the grace of God (Rom. 3:24; Eph. 2:8–9), but it also refers our justification to the righteousness of Christ as our only dikaioma on account of which we are justified (Rom. 3:25; Phil. 3:9). Nor (2) on account of our faith considered in any way as our righteousness which is admitted in the gospel by God by way of acceptilation, in place of full obedience to the law, because Scripture nowhere says that we are justified on account of faith, but only by faith, and in addition, it wholly refers that on account of which we are justified to Christ’s righteousness (Rom. 5:18; 3:25). Nor (3) by faith insofar as that speaks of and implies an obedience to the commands of Christ on account of which through the pure grace of God we are justified, because Scripture throughout contrasts faith and obedience or good works (Rom. 3:27–28; Eph. 2:8–9; Gal. 2:16). Perhaps (4) it justifies as an instrument by which we take hold of Christ. Protestants generally think in this way, and certainly truly, if only you take this with due distinction. And so that you may do this, we must distinguish between passive and active justification. In passive justification, we are persuaded that we are justified by God, or from it we conclude that we are justified by God. In this way it certainly can be said that we are justified by faith as an instrument, insofar as in the practical syllogism, by means of which we conclude that we are infallibly justified, faith stands as the middle term: “The one who believes is justified; I believe; therefore, I am justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, sect. 14, ‘How faith influences justification: How it does not influence’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe16c4c0fb" data-kw="">
<blockquote><p>How faith is a condition. XI. As to the former, when we say that faith is a condition of the covenant, we do not mean it absolutely and according to its nature and essence. It is contained under obedience as being commanded by the law (just as the other virtues) and so it cannot be contradistinguished from it. Hence it cannot be accepted for righteousness or the obedience of the law because such a judgment would not be in accordance with the truth (since faith is only the smallest part of that righteousness). Rather it must be considered relatively and instrumentally, inasmuch as it embraces Christ and applies to him for righteousness and through him obtains the right to eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James Dennison Jr., trans. George Giger, 3 vols. (P&amp;R, 1992–1997), vol. 2, Question 3, ‘Is the covenant of grace conditional and what are its conditions?’ pp. 184–85 When Turretin says faith “cannot be contradistinguished from” obedience, he is saying the two are not so utterly contradictory as to be incompatible with each other in some way.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-e5b5a788f8" data-kw="">
<blockquote><p>The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that he has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, he is the object of our faith in our absolute justification; and so he is as unto the continuation of it. So our whole progress in our justified estate, in all the degrees of it, is ascribed unto faith alone.</p></blockquote>

<blockquote><p>DEATH OF HUGH MARTIN.

The Rev. Dr Hugh Martin died Edinburgh on Sabbath evening. Born in Aberdeen in 1822, he was educated at the Grammar School and Marischal College. He became a prominent member of the Mathematical Society of London, and was for three years Mathematical Examiner to the Edinburgh University.

He went with the Free Church at the Disruption, and his first charge was at Panbride. Carnoustie and Panbride were at the time becoming resorts of the people of Dundee, and many of these supported the young minister. The Earl of Dalhousie granted a site, and a handsome church and comfortable manse were reared.

Soon afterwards Mr Martin succeeded the late minister of Free Greyfriars, Edinburgh, where had a large congregation, and many students attended his church. He took a keen interest in ecclesiastical questions, and was often heard on the floor the General Assembly of the Free Church, especially in the debates on union and education. His leanings were generally to the Conservative view.

He was the author of “Christ’s Presence in the Gospel History,” “The Atonement,” “The Prophet Jonah,” and “The Shadows of Calvary.” In recognition of these the University of Edinburgh conferred on him the degree of D.D. Dr Martin, who has been delicate health for some years, leaves a widow and five of a family, including an only son, who is a clergyman in Edinburgh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aberdeen-evening-express.html">Aberdeen Evening Express</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aberdeen Evening Express</cite>, 16 June 1885.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f75f43af8" data-kw="">
<blockquote><p>Obiection 2: Secondly, Christ took on Him man’s nature; He became man like to us: therefore, say some, He may be resembled, and an image of Him may be made. Question: How is this to be answered? Answer: Thus, Christ being both God and Man, the chief thing that makes him Christ is his Godhead, and that cannot be expressed by an image; and therefore an image made to resemble whole-Christ must needs be a living image, leaving out the chief part of Christ, which is his Godhead: so that an image made of Christ, either separates his Godhead from his manhood, or else it makes his Godhead to be such as may be circumscribed: both which are gross errors; therefore there may no image of Christ be made. Objection 3: May not Christ as well be painted with colors as set before us with words in a sermon? Question: How is this to be answered? Answer: No: the one God allows in his Word, namely the describing of Christ in speech, in the preaching of the Word and administration of the sacraments, but not the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words</cite>, … (d. 1624; London: Robert Mylbourne, 1625), God’s Holy Mind touching matters Moral, which Himself uttered in Ten Words, or Ten Commandments…, p. 30</span></figcaption>

</figure><figure class="quote" id="q-9daedfcafe" data-kw="">
<blockquote><p>Question 11. What duties are done by the people? … (4.) Saying “amen” audibly to the blessing. … As for an audible pronouncing of “amen,” if the minds of them that pronounce it have been upon that which the minister uttered, and their hearts have given consent thereto, it comprises altogether as much as the minister has uttered. This is the only warrantable means for people to utter their minds in a congregation. It must, therefore, be uttered by everyone, altogether, so loud, as the minister may hear their consent, as well as they hear what he has uttered in their name. For the one is as requisite as the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, 1641, pp. 3-4.</span></figcaption>

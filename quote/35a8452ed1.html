<main class="wrap"><figure class="quote" id="q-35a8452ed1" data-kw="">
<blockquote><p>Whether may not Christians lawfully sing David’s or Moses’ Psalms? and how may it appear? Answered affirmatively: Eph. 5:19, where, under those three heads, of Psalms, and Hymns, and Spiritual songs, David’s Psalms are contained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works</cite>, (London, 1682), p. 256</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6de9a84be" data-kw="">
<blockquote><p>David’s Psalms are so full of praises, that they are called Tehillim, praises. Therefore the Apostles in that, Eph. 5, Col. 3, and Matt 26:30, use a Greek word of the same signification; namely, humnos, a hymn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Musick, or, The Singing of David’s Psalms</cite>, (London: Printed for Henry Overton, 1644), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-db563e53ef" data-kw="">
<blockquote><p>In 1643, White was chosen to serve among the Westminster Assembly of Divines. When the Assembly swore to uphold the Solemn League and Covenant on September 25, 1643, John Lightfoot recorded in his Journal that “Mr. White prayed near upon an hour.” White attended faithfully and contributed diligently to the work of the Assembly, and was in fact married to the sister of Cornelius Burgess, his co-assessor at the Assembly. While the Assembly was engaged in a battle over whose metrical Psalter would be chosen to serve as the instrument of uniformity and “get the civil sanction,” the leading candidates being Francis Rous and William Barton. White, who had prepared his own version of the metrical Psalms, preferred not to publish it while the debate was going on, in the interests of harmony. It was published posthumously with the permission of his son under the title David’s Psalms in Metre, agreeable to the Hebrew. To be sung in usual Tunes To the benefit of the Churches of Christ (1655) and shows his poetic skills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Psalms in meter. Agreeable to the Hebrew</cite>, 1655 | Background to White’s psalter by Andrew Myers:</span></figcaption>

<blockquote><p>Q. 17. Which are the principal institutions of the gospel to be observed in the worship of God? A. The calling, gathering and settling of churches, with their officers, as the seat and subject of all other solemn instituted worship;¹ prayer, with thanksgiving;² singing of psalms;³ preaching the Word… ¹ Mt. 28:19,20; Acts 2:41-42; 1 Cor. 12:28; Eph. 4:11-12; Mt. 18:17-18; 1 Cor. 4:17; 7:17; Acts 14:23; Titus 1:5; 1 Tim. 3:15; ² 1 Tim. 2:1; Acts 6:4; 13:2-3; ³ Eph. 5:19; Col. 3:16;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Independents’ Catechism</cite>, (d. 1683), vol. 15, p. 477</span></figcaption>

</figure><figure class="quote" id="q-395d8ecd70" data-kw="">
<blockquote><p>Towards God the duty is set down, that when we are merry and cheerful, to sing psalms and hymns unto God, ver. 16. And therefore St. James saith, chap. 5:13, ‘if any be merry, let him sing psalms ;’ … …a hymn, is a song of thanksgiving for a benefit received, and therefore our Savior, after his supper, sang an hymn, Mt. 26:30, viz., for a particular benefit. Lastly, a song is a more general thing than either the psalm or hymn, viz., wherein we give thanks, not for particular benefits, but for general blessings received at God’s hands, as when David praised the Lord for the works of creation, as the heavens, etc., Ps. 104… Use. These must be spiritual songs, viz. holy psalms and songs, not profane and wicked love-songs…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, (d. 1603; rep. Edinburgh, 1864), Sermon 26, on Col. 3:16-17, p. 55, rt. col.</span></figcaption>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

<blockquote><p>First, we need to keep in mind the Fregean point that a difference in sense does not entail a difference in reference. To use Frege’s famous example, the sense of the expression “the morning star” is different from the sense of the expression “the evening star.” But these two expressions refer to one and the same thing, viz. the planet Venus. Similarly, expressions like “the God of the Christians” and “the God of the Muslims” differ in sense, but it doesn’t follow from that alone that they don’t refer to the same God… Second, even a speaker’s erroneous beliefs don’t entail that he is not referring to the same thing that speakers with correct beliefs are referring to… Similarly, the fact that Muslims have what Christians regard as a number of erroneous beliefs about God does not by itself entail that Muslims and Christians are not referring to the same thing when they use the expression “God.</p></blockquote>

d it online · Reformed Books Online</a></div>

<blockquote><p>And upon these [previously listed] terms I (and I believe everybody else) will willingly consent to their readmission [under a limited-political toleration]. If any desire further satisfaction in this particular, either from civilians, schoolmen, casuists, canonists, historians, or other divines, he may consult these or such like: I. Justinian Cod. de Judaeis &amp; Caelicolis, bk. 1, title 12 and the gloss there. II. Codex Theodosianus de Judaeis, Caelicolis &amp; Samaritanis, bk. 16, title 8, p. 515. III. Jacobi Sirmondi, Appendix Cod. Theodosiani, leg. 6. p. 14 &amp; leg. 4, p. 11. IV. Marquardus de Susanis Tractatu de Judaeis, &amp; aliis Infidelibus inter tractatus Illustrium, tome 14, p. 28. See Bernardum, Hieronimum, Alexandrum Iltum, aliosque Auctores ab eo ibidem citatos. V. Mathaeus Wesenbecius in Comentario in Codicem Justinianeum de Judeis, title 9, p. 14. VI. Decretum Gregorii extra de Judaeis, &amp; Saracenis, bk. 6, title 6. VII. Clementinar. bk. 5, title 2, de Judaeis. VIII. Corvini Jus Canonicum, tit. de Judaeis, p. 295. IX. Frederick Balduin, Cases of Conscience, bk. 2, ch. 6, case 5, p. 188. X. Capitulare Caroli Magni, bk. 6, ch. 120 &amp; 308. XI. Henry Alting, Problematum Theolog. pt. 2, problem 21, p. 340. XII. Petrus Crespetius in summa Eccles. Disciplinae Verbo Judaeus, p. 520 etc. fuse. XIII. Philip Melanchthon, Epistles, bk. 1, epistle 68, p. 75 in edit. Corn. Bee. XIV. Martin Becanus, in compendio manualis, bk. 5, ch. 17, p. 509. XV. Decretum Concilii Viennensis contra Judaeos apud Hen. Canisium Lect. Antiquarum, tome 1, p. 621 &amp; apud Binium, tome 3, parte altera, p. 1,493. XVI. Filiucius, Cases of Conscience, tract 22, ch. 5, p. 40, col. 2, de Judaismo. XVII. Johannes de Lugo, Of the Power of Divine Faith, disp. 22, sect. 4 and authors cited there. XVIII. Bodinus, Of the Republic, bk. 3-4. XIX. Statutum de Judaismo apud D. Edvardum Cooke, Institit. pt. 2, p. 506 &amp; Commentarium ejus in dictum Statutum. XX. Aquinas, [Summa] pt. 2 of 2, quest. 10-11 where various things on the Jews occur. XXI. Erasmus Brockmannus, Systemate Theologiae, universae, art. 41, ch. 2, quest. 9, tome 2, p. 5,043. XXII. Basilica Lenuclavii, bk. 1, title 1, ch. 9, de Judaeis, p. 2. XXIII. Jerome of the Holy Faith, Book contra the Jews. XXIV. Petrus Galatinus, de Arcanis Catholicae veritatis. XXV. Gilbertus Genebrardus, in Symbolae fidei Judeorum è R. Mos. Aegyptio, etc. XXVI. Vide etiam (si placet) Scriptores (innumeros pene) quos exhibet Georgius Draudius in Bibliothea Classica inter Libros Theologicos, pp. 349-50, etc. Alii alios de facili addant.</p></blockquote>

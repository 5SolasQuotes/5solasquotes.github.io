<blockquote><p>2. It is not said that deacons were ordained with fasting and prayer, Acts 6, as the elders are chosen in every Church, Acts 14:23, and as hands are laid upon Paul and Barnabas; Acts 13:3-4, but simply that the apostles, Acts 6:6, prayed and laid their hands on them. Which seemeth to me to be nothing but a sign of praying over the deacons, and no ceremony or sacrament conferring on them the Holy Ghost: And Steven his working of miracles, and speaking with wisdom irresistible was but the fruit of that grace and extraordinary measure of the Holy Ghost abundantly poured forth on all ranks of persons in those days when the prophecy of Joel was now taking its accomplishment; Acts 2:16-19; Joel 2:28-29. which grace was in Steven before he was ordained a deacon by the laying on of hands. Acts 6:3-5. And the Text saith not that Steven did wonders and signs amongst the people by virtue of imposition of hands, or of his deaconry, but because he was full of faith and power. v. 8, else you must make working of miracles a gift bestowed on all those who serve tables, and are not to give themselves to continual praying and the ministry of the Word. I think papists will not say so much of all their priests; and we can say it of none of our pastors, nor doth Chysostom say that Steven, as a deacon, and by virtue of the office of a deacon wrought miracles, but only that his miracles and disputing was a mere consequent of laying on of hands. Further, laying on of hands was taken from the custom of blessing amongst the Jews, Christ laid his hands upon young children and blessed them, yet did he not, thereby, design them to any office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Part 1, ch. 7, section 7, ‘Of Deacons’, pp. 169-70</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf842d1c29" data-kw="">
<blockquote><p>Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 24, Question 20, pp. 547-48</span></figcaption>

<blockquote><p>III. Second, this special call is either internal or external. The former is that by which the heart itself is excited by God to consecrate itself to the work of the ministry (of which Paul speaks in 1 Tim. 3:1). This is rather a disposition of mind to receive the call than a call properly so called. By it, a man is conscious before God that he is impelled to undertake this office not by ambition or avarice or any other carnal affection, but from a sincere love of God and a desire to build up the church. The latter, however, is that by which a man thus disposedis expressly called to exercise the office.</p></blockquote>

<blockquote><p>The apostles have preached the Gospel to us from the Lord Jesus Christ; Jesus Christ [has done so] from God. Christ therefore was sent forth by God, and the apostles by Christ. Both these appointments, then, were made in an orderly way, according to the will of God. Having therefore received their orders, and being fully assured by the resurrection of our Lord Jesus Christ, and established in the Word of God, with full assurance of the Holy Ghost, they went forth proclaiming that the kingdom of God was at hand. And thus preaching through countries and cities, they appointed the firstfruits [of their labours], having first proved them by the Spirit, to be bishops and deacons of those who should afterwards believe. Nor was this any new thing, since indeed many ages before it was written concerning bishops and deacons. For thus saith the Scripture in a certain place, ‘I will appoint their bishops in righteousness, and their deacons in faith.’ [Isa. 60:17 LXX]</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The apostles have preached the Gospel to us from the Lord Jesus Christ; Jesus Christ [has done so] from God. Christ therefore was sent forth by God, and the apostles by Christ. Both these appointments, then, were made in an orderly way, according to the will of God. Having therefore received their orders, and being fully assured by the resurrection of our Lord Jesus Christ, and established in the Word of God, with full assurance of the Holy Ghost, they went forth proclaiming that the kingdom of God was at hand. And thus preaching through countries and cities, they appointed the firstfruits [of their labours], having first proved them by the Spirit, to be bishops and deacons of those who should afterwards believe. Nor was this any new thing, since indeed many ages before it was written concerning bishops and deacons. For thus saith the Scripture in a certain place, ‘I will appoint their bishops in righteousness, and their deacons in faith.’ [Isa. 60:17 LXX]”

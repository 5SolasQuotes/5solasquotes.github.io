<main class="wrap"><figure class="quote" id="q-2fe58a00b8" data-kw="">
<blockquote><p>Therefore whoever knows well how to distinguish the Gospel from the Law should give thanks to God and know that he is a real theologian. I admit that in the time of temptation I myself do not know how to do this as I should. The way to distinguish the one from the other is to locate the Gospel in heaven and the Law on earth, to call the righteousness of the Gospel heavenly and divine and the righteousness of the Law earthly and human, and to distinguish as sharply between the righteousness of the Gospel and that of the Law as God distinguishes between heaven and earth or between light and darkness or between day and night. Let the one be like the light and the day, and the other like the darkness and the night. If we could only put an even greater distance between them! Therefore if the issue is faith, heavenly righteousness, or conscience, let us leave the Law out of consideration altogether and let it remain on the earth. But if the issue is works, then let us light the lamp of works and of the righteousness of the Law in the night. So let the sun and the immense light of the Gospel and of grace shine in the day, and let the lamp of the Law shine in the night. These two must be distinguished in your mind in such a way that when your conscience is completely terrified by a sense of sin, you will think of yourself. “At the moment you are busy on earth. Here let the ass work, let him serve and carry the burden that has been laid upon him; that is, let the body and its members be subject to the Law. But when you ascend into heaven, leave the ass with his burdens on earth; for the conscience has no relation to the Law or to works or to earthly righteousness. Thus the ass remains in the valley; but the conscience ascends the mountain with Isaac, knowing absolutely nothing about the Law or its works but looking only to the forgiveness of sins and the pure righteousness offered and given in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Galatians</cite>, On Galatians 2:14 in Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 115–16</span></figcaption>

<blockquote><p>In this way we can admit not only that there is a partial righteousness in works (as our adversaries maintain), but that they are approved by God as if they were absolutely perfect. If we remember on what foundation this is rested, every difficulty will be solved. The first time when a work begins to be acceptable is when it is received with pardon. And whence pardon, but just because God looks upon us and all that belongs to us as in Christ? Therefore, as we ourselves when ingrafted into Christ appear righteous before God, because our iniquities are covered with his innocence; so our works are, and are deemed righteous, because every thing otherwise defective in them being buried by the purity of Christ is not imputed. Thus we may justly say, that not only ourselves, but our works also, are justified by faith alone. Now, if that righteousness of works, whatever it be, depends on faith and free justification, and is produced by it, it ought to be included under it and, so to speak, made subordinate to it, as the effect to its cause; so far is it from being entitled to be set up to impair or destroy the doctrine of justification. Thus Paul, to prove that our blessedness depends not on our works, but on the mercy of God, makes special use of the words of David, “Blessed is he whose transgression is forgiven, whose sin is covered;” “Blessed is the man unto whom the Lord imputeth not iniquity.” Should any one here obtrude the numberless passages in which blessedness seems to be attributed to works, as, “Blessed is the man that feareth the Lord;” “He that has mercy on the poor, happy is he;” “Blessed is the man that walketh not in the counsel of the ungodly,” and “that endureth temptation;” “Blessed are they that keep judgment,” that are “pure in heart,” “meek,” “merciful,”, they cannot make out that Paul’s doctrine is not true. For seeing that the qualities thus extolled never all so exist in man as to obtain for him the approbation of God, it follows, that man is always miserable until he is exempted from misery by the pardon of his sins. Since, then, all the kinds of blessedness extolled in the Scripture are vain so that man derives no benefit from them until he obtains blessedness by the forgiveness of sins, a forgiveness which makes way for them, it follows that this is not only the chief and highest, but the only blessedness, unless you are prepared to maintain that it is impaired by things which owe their entire existence to it. There is much less to trouble us in the name of righteous which is usually given to believers. I admit that they are so called from the holiness of their lives, but as they rather exert themselves in the study of righteousness than fulfill righteousness itself, any degree of it which they possess must yield to justification by faith, to which it is owing that it is what it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.10</span></figcaption>

</figure><figure class="quote" id="q-6ef0405c03" data-kw="">
<blockquote><p>From all these absurdities [of the sacrament of penance] the doctrine which we deliver is completely free. For absolution is conditional, allowing the sinner to trust that God is propitious to Him, provided he sincerely seek expiation in the sacrifice of Christ, and accept of the grace offered to him. Thus, he cannot err who, in the capacity of a herald, promulgates what has been dictated to him from the Word of God. The sinner, again, can receive a clear and sure absolution when, in regard to embracing the grace of Christ, the simple condition annexed is in terms of the general rule of our Master Himself—a rule impiously spurned by the Papacy—’According to your faith be it unto you,’ (Mt. 9:29).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845) Note Calvin speaking of repentance as a “condition” for the forgiveness of sins in vol. 2, bk. 3, ch. 3, sect. 20, p. 174., vol. 2, bk. 3, ch. 4, sect. 22, p. 212</span></figcaption>

<blockquote><p>What are the different opinions as to the relation between faith and love? 1st. The Romanists, in order to maintain their doctrine that faith alone is not saving, distinguish between a formed, or perfect, and an unformed faith. They acknowledge that faith is distinct from love, but maintain that love is essential to render faith meritorious and effectual as the instrument of our salvation. 2d. Some have regarded love as the root out of which faith springs. 3d. The true view is that love is the immediate and necessary effect of faith. Faith includes the spiritual apprehension of the beauty and excellence of the truth, and an act of the will embracing it and relying upon it. Yet these graces can not be analytically separated, since they mutually involve one another. There can be no love without faith, nor any faith without love. Faith apprehends the loveliness of the object, the heart spontaneously loves it. Thus “faith works by love,” since these affections are the source of those motives that control the will. The Romish doctrine is inconsistent with the essential principles of the gospel. Faith is not a work, nor can it have, when formed or unformed, any merit, it is essentially a self-emptying act, which saves by laying hold of the merits of Christ. It leads to works, and proves itself by its fruits, but in its relation to justification it is in its very nature a strong protest against the merits of all human works, Gal. 3:10, 11; Eph. 2:8, 9. The Protestant doctrine that love is the fruit of faith is established by what the Scriptures declare concerning faith, that it “sanctifies,” “works by love,” “overcomes the world,” Gal. 5:6; Acts 26:18; 1 John 5:4. This is accomplished thus—by faith we are united to Christ, Eph. 3:17, and so become partakers of his Spirit, 1 John 3:24, one of the fruits of the Spirit is love, Gal. 5:22, and love is the principle of all obedience, Rom. 13:10.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0d0240d760" data-kw="">
<blockquote><p>Secondly, the Church being but one, this point and principle is to be holden, that there is no salvation out of the Church, as there is no condemnation to them that are of the Church, and consequently every one that looks to be saved by Christ, must necessarily range himself in that number, that so he may become a member and citizen of this one catholic Church. For as out of the sheepfold are goats, dogs, swine, wolves, and such like, so out of the Church are sorcerers, and whoremongers, and murderers, and idolaters, and whosoever loves and makes lies, Rev. 22. Such albeit they may be in the Church for a season, yet are not of the Church, for they remain not in it. They that were not in the ark of Noah, perished in the waters: so out of the Church, and out of this flock and sheepfold all are condemned. Hence it is that Luke teaches, ‘The Lord added to the Church from day to day such as should be saved.’ [Acts 2] So Solomon, Cant. 4, ‘A garden enclosed is my Sister, my Spouse, a Spring shut up, a Fountain sealed.’ This is plain in these four respects. First, because Christ Jesus is the only head of the Church, by whom all parts as by certain joints and sinews are knit and coupled together: but out of the militant Church there is no Christ, for He always walks in the midst of the seven golden candlesticks… Thirdly, out of the Church there are no ordinary means to come to salvation. Now what are the means to attain salvation? They are these, hearing, faith, prayer, the sacraments, and such like. But out of the bosom of the Church there is no sound preaching of the Word, no true believing in Christ, no devout calling upon God, no right partaking of the sacraments, no sincere holinesse of life, no brotherly communion of saints, no pure worshipping of God according to his Word. These are the privileges of the Church, and the marks whereby it is known, Acts 2, ‘They continued stedfastly in the apostles’ doctrine, and fellowship, and in breaking of bread, and in prayers.’ Where these are not, there can be no Church, nor salvation. Fourthly, the Church and the world are quite contrary the one to the other. Christ prays not for the world, as he does for the Church, and for all the parts and members of it, Jn. 17:9, 14, ‘the whole world lyeth in wickedness,’ only the Church is an holy company which follows the ways and practices the works of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Treatises</cite>, … (London: Cotes, 1632), Physic Against Famine, pp. 42-44</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e696627f2a" data-kw="communion join church">
<blockquote><p>For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers. Also that thus we may know what that assembly is to which it is necessary that we should join ourselves that we may obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.12.1c</span></figcaption>

</figure><figure class="quote" id="q-bf4c3b0d77" data-kw="">
<blockquote><p>The seconde rule is, that there is no salvation out of the Church, and that therefore every one which is to be saved must become a member and a citizen of the catholic and apostolic Church: and such as remain forever out of the same perish eternally. Therefore St. John says, ‘They went out of us, they were not of us, for if they had been of us,’ they would have remained with us: but this comes to pass that it might appear that they are not all of us.’ And again, that such as be holy are in the city of God, but without, that is, forth of the Church are dogs, enchanters,whoremongers, adulterers, etc. And the ark out of which all perished, figured the Church, out of which all are condemned. And for this cause St. Luke says that ‘the Lord added to the Church from day to day such as should be saved.’ [Acts 2] And the reason hereof is plain: for without Christ there is no salvation, but out of the militant Church there is no Christ nor faith in Christ: and therefore no salvation. Again, forth of the militant Church there are no means of salvation, no preaching of the word, no invocation of God’s name, no sacraments, and therefore no salvation. For this cause every man must be admonished evermore to join himself to some particular Church† being a sound member of the catholic Church. † [A “particular Church”, as seen by many quotes on this webpage, often referred in that era to some national or regional Church, such as that of England, Germany, Constantinople, etc., not necessarily a local church, especially when the Anglican Church in that era (which Perkins was a part of) often did not have local sessions of elders with local church membership in any proper sense.] The third rule is that the Church which here we believe is only one, as Christ Himself speaks, ‘My dove is alone, and my undefiled is the only daughter of her mother.’ [Song 6:8] And as there is only one God and one Redeemer, one faith, one baptism and one way of salvation by Christ only, so there is but one Church alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, ... (Cambridge: Legatt, 1595), An Exposition of the Creed, pp. 486-87</span></figcaption>

<blockquote><p>This book explores the Westminster Confession of Faith’s claim that ‘there is no ordinary possibility of salvation’ outside of the Church by asking what it means, whether it is biblical, and why it is important. The author concludes that the Westminster Confession rightly stresses the role of the Church in bringing people to salvation without making this claim absolute.</p></blockquote>

<blockquote><p>3. We must know that there is no salvation out of this Church; such as never become members of it, must eternally perish: they that are true members, shall be saved. If they had been of us, they would have continued with us: but they went out from us, that it might be manifest they were not of us. Without are dogs and scorners, etc. All out of the ark perished in the waters. ‘The Lord added to the Church daily such as should bee saved.’ First, because there is no means of salvation out of it; no word to teach, no sacraments to confirm. And especially because out of the Church there is no Christ, and out of Christ no salvation. Who have not the Church their mother, cannot have God their Father… ‘The general assembly’ [Heb. 12:23]: this is the property of the Church; ‘General’. It is catholic in three respects; of Time, of Persons, of Place… Thus we see the property of this Church, catholic or general. It is one, but not tied to one time, nor one place, nor one person: it is catholic to all times, to all places, to all persons… …I desire to express two things: one for distinction, the other for instruction. First for distinction betwixt this Generall assembly and particular churches: then for instruction, to show who be true members of this catholic Church. 1. The main difference between them consists in this: that the catholic Church is always invisible, the members thereof only known to God: particular churches are sometimes invisible, and lying hid; other times manifest in the open profession of Christ’s name.</p></blockquote>

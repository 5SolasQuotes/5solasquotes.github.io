<main class="wrap"><figure class="quote" id="q-16892bad42" data-kw="">
<blockquote><p>There is also a great difference between toleration and accommodation. By accommodation I understand an agreement of dissenters with the rest of the Church in practical conclusions, so that if any difference be, it is in their principles, not in their practices, and so not obvious, apparent and scandalous to people. I had rather go two miles in an accommodation (yea as many as the word of God will suffer me) than one mile in toleration. For in that way there is no schism, no rent in Israel, but ‘the Lord one, and his name one.’ In this way [of toleration] there is temple against temple, and altar against altar, Manasseh against Ephraim, and Ephraim against Manasseh, and they both against Judah: a misery from which the Lord deliver us. I do not deny, but if a safe and happy accommodation is impossible, such a toleration as I have formerly spoken of, is not to be disallowed. But the accommodation is a more excellent way, and that which is to be rather embraced, yea endeavored for and followed after, according to the apostle’s rule (which Isidorua Pelusiota did long since observe to be the best and happiest way of putting an end to divisions and dissensions in the Church). Let us therefore as many as be perfect be thus minded: and if in anything ye be otherwise minded, God shall reveal even this unto you. Nevertheless whereto we have already attained, let us walk by the same rule, let us mind the same thing (Phil 3:15-16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty (London, 1645) This was printed anonymously.</cite></span></figcaption>

</figure><figure class="quote" id="q-096963ca8c" data-kw="">
<blockquote><p>In this context researchers differentiate the colloquies on inaugurating reform in the early years of the Reformation (which were to prepare for the secular government’s decision to introduce new teaching and ecclesiastical practice or to legitimize such a decision) from the later religious dialogues that ideally aimed at a convergence of two religious parties. Contemporaries hardly noticed this difference… Despite all the parallels with the medieval process of disputation, sixteenth-century religious colloquies differed from the academic model at essential points… The representatives of the Reformation decisively rejected the syllogism of Scholasticism as a relevant structure for argumentation for determining theological truth and untruth. A hermeneutic based upon and drawn from Holy Scripture was to govern the establishing of the truth, not arguments based on major and minor premises.</p></blockquote>

<blockquote><p>Excess of passion in opposing evil, though not to be justified, yet shows a better spirit than a calm temper when there is just cause of being moved. It is better that the water should run somewhat muddily than not run at all. Job had more grace in his ill temper than his friends in their seemingly wise demeanour. Actions stained with some defects are more acceptable than empty compliments.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-41da05d05d" data-kw="">
<blockquote><p>Q. 32 Why is this covenant also called a testament?

A. First, because the term testament began to be used in the church instead of the term covenant.

Second, because just as a testament is not valid without the death of the testator, so also this covenant could not be valid without the death of Christ.

Q. 33 What is the difference between the Old and the New Testament?

A. It is the same testament or covenant of God with all the elect from the first promise given in Paradise, concerning the seed of the woman who would crush the head of the serpent, to the end of the world.

But they are called Old and New Testaments because some of the circumstances and signs of the covenant were changed.

First, in the Old they believed in the Christ who was still to come; in the New we believe in the Christ who has been revealed.

Second, the Old contained the promise of the preservation of the nation of Israel until the time of Christ; in the New we have only the general promise of the preservation of the church under various governments.

Third, the Old had levitical ceremonies, for which, having been abolished in the New, Christ instituted baptism and the Lord’s supper.

Fourth, the Old was more obscure; the New is clearer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Large Catechism</cite>, (1561), trans. Fred H. Klooster and John Medendrop; http://links.christreformed.org/doctrinevision/ursinus_project.pdf.</span></figcaption>

<blockquote><p>For here I observe, that men of learning in other respects have stumbled, who, when explaining the nature of those Sacraments, too incautiously blend things belonging to a quite different covenant. Nothing is here to be brought in which does not belong to the covenant of works, the promises of that covenant, and the duties of man under the same; all which are most distinct from the covenant of grace. Here we are to say nothing of Christ, nothing of justifying faith in him, nothing of our ceasing from our own works as impure, nor any thing of that rest after the miseries of this life. All these belong to another covenant. I do not, however, deny, that the unsearchable wisdom of God did appoint and order these symbols in such a manner that the remembrance of them, after the fall, might be able to instruct man in many things relating to the covenant of grace and its mediator. As that, according to Paul, the first Adam himself was a type of the second; Eve, curiously formed out of Adam’s rib while asleep, was a type of the church, as it were, taken from Christ in virtue of his death; and that the first marriage represented that great mystery which regards Christ and the church. These things, however, were neither known nor thought of in a state of nature; nor to be mentioned in a discourse on the Sacraments of the covenant of works. Having premised these things, let us now inquire into each particular with all the care possible, beginning with Paradise.</p></blockquote>

<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>

<blockquote><p>The covenants of a church are her glory; God’s covenant of grace and promise, and their covenants of duty and gratitude, Rom. ix. 4, it is said of the Old Testament church “To them belonged the adoption, the glory, and the covenants.” God’s covenant of grace and promise is the glory of a church. It was the misery of the poor Gentiles under the Old Testament, before the coming of Christ, that they were “strangers to the covenants of promise.” This is the church’s charter for all her immunities and privileges, visible or invisible, for the life that now is, and that which is to come: and it is “an everlasting covenant, well ordered in all things and sure:” and him that takes hold of this covenant, “even him will God bring to his holy mountain, and make joyful in his house of prayer,” Is. Ivi.

Now, this covenant hangs upon Christ, the nail fastened in a sure place; for God has “given him for a covenant unto the people;” it was made with him as a second Adam, and with his seed in him; he has fulfilled the condition of it, by the holiness of his nature, the obedience of his life, and the satisfaction made by his death; his fulfilling the commands and demands of the broken covenant of works, is the very condition of the covenant of grace, and by virtue of his doing so the cry comes out. Is. Iv. 1, “Ho, every one that thirsteth, come ye to the waters; he that hath no money, let him come; come, buy wine and milk without money, and without price.” The covenant, and all the blessings and promises of it, hang upon this blessed nail; they are all in him, and “in him yea and amen.”

Again, our covenants for duty, obedience, and gratitude, they hang upon this blessed nail. These are the glory of a church and land, as they were unto the church of Israel. God avouched them to be his peculiar people, and they avouched him, by solemn covenant, to be their God; on which account they are called Hephzibah, and Beulah; a people married to the Lord. This was the glory of this land, and of the three nations, though perfidiously broken, burnt, and buried. Blessed be God there is some small degree of a resurrection of these solemn covenants, by what has been lately transacted in this place.

But now, I say the glory of all our covenants, and engagements into personal or public reformation and obedience, must needs hang upon this nail fastened in a sure place. When men engage to duty in a legal way, in the strength of their own covenants, vows, promises, and resolutions, without fastening faith’s gripes upon the nail in a sure place, for righteousness and strength, they do only make to themselves ropes of sand, that will fall asunder as fast as they can make them. Christ only is “the strength of Israel;” all our funds of grace lie in him, “in whom it has pleased the Father that all fulness should dwell.”

And whatever duty we engage to should be in the strength of promised grace for assistance, and in the faith of his righteousness and intercession for acceptance: Is. xlv. 24, “Surely, shall one say, In the Lord have I righteousness and strength. I will go (says David) in the strength of the Lord God: I will make mention of thy righteousness, even of thine only.” And it is in this way that his commandments are not grievous, his yoke easy, and his burden light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ considered as the nail fastened in a sure place, bearing all the glory of his Father s house. A sermon preached at Stirling, December 28, 1743, immediately before the renovation of our solemn covenants, by the ministers of the Associate Presbytery. And some other sermons preached afterwards u</cite></span></figcaption>

+wine+and+milk+without+money%2C+and+without+price.%E2%80%9D+The+covenant%2C+and+all+the+blessings+and+promises+of+it%2C+hang+upon+this+blessed+nail%3B+they+are+all+in+him%2C+and+%E2%80%9Cin+him+yea+and+amen.%E2%80%9D%0A%0AAgain%2C+our+covenants+for+duty%2C+obedience%2C+and+gratitude%2C+they+hang+upon+this+blessed+nail.+These+are+the+glory+of+a+church+and+land%2C+as+they+were+unto+the+church+of+Israel.+God+avouched+them+to+be+his+peculiar+people%2C+and+they+avouched+him%2C+by+solemn+covenant%2C+to+be+their+God%3B+on+which+account+they+are+called+Hephzibah%2C+and+Beulah%3B+a+people+married+to+the+Lord.+This+was+the+glory+of+this+land%2C+and+of+the+three+nations%2C+though+perfidiously+broken%2C+burnt%2C+and+buried.+Blessed+be+God+there+is+some+small+degree+of+a+resurrection+of+these+solemn+covenants%2C+by+what+has+been+lately+transacted+in+this+place.%0A%0ABut+now%2C+I+say+the+glory+of+all+our+covenants%2C+and+engagements+into+personal+or+public+reformation+and+obedience%2C+must+needs+hang+upon+this+nail+fastened+in+a+sure+place.+When+men+engage+to+duty+in+a+legal+way%2C+in+the+strength+of+their+own+covenants%2C+vows%2C+promises%2C+and+resolutions%2C+without+fastening+faith%E2%80%99s+gripes+upon+the+nail+in+a+sure+place%2C+for+righteousness+and+strength%2C+they+do+only+make+to+themselves+ropes+of+sand%2C+that+will+fall+asunder+as+fast+as+they+can+make+them.+Christ+only+is+%E2%80%9Cthe+strength+of+Israel%3B%E2%80%9D+all+our+funds+of+grace+lie+in+him%2C+%E2%80%9Cin+whom+it+has+pleased+the+Father+that+all+fulness+should+dwell.%E2%80%9D%0A%0AAnd+whatever+duty+we+engage+to+should+be+in+the+strength+of+promised+grace+for+assistance%2C+and+in+the+faith+of+his+righteousness+and+intercession+for+acceptance%3A+Is.+xlv.+24%2C+%E2%80%9CSurely%2C+shall+one+say%2C+In+the+Lord+have+I+righteousness+and+strength.+I+will+go+%28says+David%29+in+the+strength+of+the+Lord+God%3A+I+will+make+mention+of+thy+righteousness%2C+even+of+thine+only.%E2%80%9D+And+it+is+in+this+way+that+his+commandments+are+not+grievous%2C+his+yoke+easy%2C+and+his+burden+light.%E2%80%9D%0A%0A%E2%80%94+Ebenezer+Erskine%2C+Christ+considered+as+the+nail+fastened+in+a+sure+place%2C+bearing+all+the+glory+of+his+Father+s+house.+A+sermon+preached+at+Stirling%2C+December+28%2C+1743%2C+immediately+before+the+renovation+of+our+solemn+covenants%2C+by+the+ministers+of+the+Associate+Presbytery.+And+some+other+sermons+preached+afterwards+u&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b6ce3afc7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9b6ce3afc7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/30/ebenezer-erskine-on-the-covenant-of-grace-and-the-covenants-of-duty/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mk. 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Mt. 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatenings, 1 Jn. 5:23, Mt. 11:21; witness those pathetical lamentations, Mt. 23:37, Lk. 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners;</p></blockquote>

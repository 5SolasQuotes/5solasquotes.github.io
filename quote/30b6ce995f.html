<main class="wrap"><figure class="quote" id="q-30b6ce995f" data-kw="">
<blockquote><p>That they who propose to themselves ease, pleasure, riches, or honour, are not suited for the Ministry of the Gospel. For if the pastors of cattle undertake a laborious life, so that Jacob could truly say concerning the pastoral life. In the day the drought consumed me, and the frost by night; and my sleep departed from mine eyes, Gen. xxxi. 40, then how much more does it behove the pastors of souls, from whom God will require whatever shall be lost through their indolence, to shrink from no labour?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 328.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af417d0dd5" data-kw="">
<blockquote><p>As a minister who has tolerable gifts for preaching may yet need the writings of other men before hand, and may bring both their matter and method into the pulpit, yea and oft times their words; so that though he have gifts, yet being weak, he may use the gifts of others. I have been counseled since I was silenced [in 1662] to compose sermons myself and give them in writing to some weak minister that has an excellent voice and utterance and to let him preach them. And really if I had not known that such have good books enough at hand for such a use, I think I should have done it: And who can prove that this had been his sin? And yet this was a using of another man’s gifts instead of his own. And I have heard men that are much against parish churches and liturgies wish that some unlearned men of good utterance might read some excellent sermon books to the people in ignorant places that can get no better: And who can prove the reading of a homily unlawful?</p></blockquote>

<blockquote><p>I cannot set this forth in any plainer speech than David hath done in this short saying, ‘Kiss the Son, lest he be angry, and so you perish in the right way,’ Ps. ii. 12. By which speech the prophet teacheth, that God cannot be honoured by any other means than by that which Christ his Son hath taught, who saith himself in the fifth of John, ‘He that honoureth the Son, honoureth the Father; he that dishonoureth the Son, dishonoureth the Father.’

So that he meaneth in this place, that if you worship not the Son as he hath commanded, then you dishonour him; if you dishonour him, then you anger him; if you anger him, he casteth you off; if he casteth you off, then you err from the right way; and if you err from the right way, then you perish. For the avoiding whereof, all godly magistrates have had a special care to meditate in the law of the Lord; such were Moses, Joshua, David, Solomon, Asa, Jehoshaphat, Hezekiah, &amp;c. Of whose good example God grant all godly magistrates to make good use.</p></blockquote>

<blockquote><p>The Greek word κατηχησις (catechesis) is derived from κατηχεω (catecheo), as κατχισμος (catechismos) is from κατχιζω (catechizo). Both words, according to their common signification, mean to sound, to resound, to instruct by word of mouth, and to repeat the sayings of another. κατηχεω (catecheo) more properly, however, signifies to teach the first principles and rudiments of some particular doctrine. As applied to the doctrine of the church, and as understood when thus used, it means to teach the first principles of the Christian religion, in which sense it occurs in Luke 1:4, Acts 18:25, Galatians 6:6, etc. Hence, catechesis in its most general and comprehensive sense, means the first brief and elementary instruction which is given by word of mouth in relation to the rudiments of any particular doctrine. As used by the church, however, it signifies a system of instruction relating to the first principles of the Christian religion, designed for the ignorant and unlearned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus Doctrinae Orthodoxae on Heidelberg Catechism Q. 30</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-1dc5a90de5" data-kw="">
<blockquote><p>But dost thou think that nothing ought to be determined concerning the place [for baptism]? Answer: Yea, seeing all things must be done in the Church comely and in order: and forasmuch as baptism is a part of the ministry of the Gospel, I think that one and the same place is to be used both for the Word and sacraments, so as baptism be ministered in the public congregation of the Church and with common prayer [mid-week], neither will I rashly admit those, I cannot tell what, cases of necessity, that some allege to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Other Part of Christian Questions &amp; Answers, which is concerning the Sacraments</cite>, … (London, 1580), 151st Question</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-997e1d62c0" data-kw="">
<blockquote><p>Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cotton.html">William Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Private Communion’ in The Second &amp; Last Part of the Answer to the Reasons for Refusal of Subscription, pp. 65-78 in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605), p. 66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?”

e-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Can%20these%20men%20%5Bdissenters,to%20prove%20what%20they%20now%20reprove&amp;text=Can%20these%20men%20%5Bdissenters&amp;text=enjoin%20us%20to%20prove%20what%20they%20now%20reprove" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-80f4c94ea9" data-kw="">
<blockquote><p>First ‘private’ signifies that which is done privily in a clanculary [clandestine] manner by stealth, without authority contrary to God’s Word by Jesuits, seminary priests, schismatical teachers, and the like; in which sort, if any of our [antagonist] brethren mean, they prove nothing against us, for our [Anglican] Church generally condemns such conventicles, whether of heretics, or schismatics. Secondly, private baptism signifies in the meaning of the [Prayer] Book, that which is administered by a lawful minister at home, where the child is born, a competent number being assembled, the child being weak, the church or chapel far distant, the season of the year oversharp, the way very inconvenient, all which, or the like occasions, are matters of circumstance; the lawfulness of baptism is no way frustrated, nor made void, nor against God’s Word, nor a private action. For as one well notes, ‘Sacraments though they be in private places administered, yet are public actions.’ ([Andrew Willet] Synopsis Papismi, p. 490)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cotton.html">William Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Private Communion’ in Answer to the Reasons for Refusal of Subscription in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605), p. 194 Cotton was an Anglican bishop.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

<blockquote><p>Secondly, the sick like[ly] to die [are excluded from the Supper]: for Christ would have this communion not to be private and domestical, but ecclesiastical, and public: neither does the want [lack], but the contempt of the same hurt the party that does not communicate…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/trelcatius.html">Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, … (London, 1610), ‘Of the Lord’s Supper’, pp. 373-74</span></figcaption>

</figure><figure class="quote" id="q-2a35968f71" data-kw="">
<blockquote><p>Secondly, as this sacrament being a communion admonishes that we are all one in Christ: so it teaches that it is to be received of many together in the church, not of one alone, and therefore it overthrows the private masses of the church of Rome, where one partakes all and the rest of the Church nothing at all. There is a flat opposition between these two: so that the communion cannot be a private mass, and private mass cannot be a communion. That which is ordained and prepared for many, delivered unto many, and received of many, cannot stand with the mass, where the priest prepares for himself, not for the people: he speaks to himself, not to the church: he receives himself alone, not with his brethren: all which are directly contrary to the apostles rule, ‘Tarry one for another.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), bk. 3, ‘Of the Lord’s Supper’, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

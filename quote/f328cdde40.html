<blockquote><p>…external adoration is due two ways: 1. When we approach God in immediate acts of worship, as prayer, and praises. 2. When it pleases God in an extraordinary manner to appear in his glory; the due season then for external signs of inward homage and reverence is when we perform these immediate acts of worship in our assemblies, or if God shall please, to give glorious signs of his extraordinary presence, as he did to Moses when the Bush was burning but not consumed, or as the Lord appeared, after Solomon had made an end of praying, when the fire came down from Heaven and the glory of the Lord filled the house; then all the Children of Israel, beholding the fire and glory of the Lord, bowed themselves and worshipped; whensoever the Lord does thus appear, external adoration is due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craghead.html">Robert Craghead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to a Late Book entitled, A Discourse concerning the Inventions of Men in the Worship of God, by William, Lord Bishop of Derry... (Edinburgh: Anderson, 1694), ch. 4, ‘Of Bodily Worship’, section 2, p. 96 Craghead (1633–1711) was a presbyterian minister, born in Scotland, who ministered in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

ernal%20adoration%20is%20due&amp;text=external%20adoration%20is%20due%20two%20ways%3A%201.%20When&amp;text=Lord%20does%20thus%20appear%2C%20external%20adoration%20is%20due" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-27bfb2857b" data-kw="">
<blockquote><p>Whereunto it was replied that then Cassander’s images (not for adoration, but for information and incitement) are not Popish, which the Rejoinder does not only grant, but also proves it, by the consent of Calvin himself (Institutes, book 1, ch. 11, sect. 12), where he says, that historical images, or pictures, may have some use, in teaching, and putting, in remembrance. Now for this, let it be considered that Calvin in that section speaks only of ordinary pictures for teaching and putting in remembrance of that which they represent of themselves, without any ecclesiastical institution, as certain words written do signify a certain meaning without any special institution. Such (it may be) would be the picture of Ananias in a white surplice, signifying with other pictures agreeable to the story, that Paul esteemed and called him a whited wall (Acts 23:3). But in the very next section, which is the thirteenth, Calvin, disputing against setting up of any images in churches, does sufficiently declare that he allowed of no ceremonial religious use of images, such as is of our cross and surplice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship</cite>, pp. 283-84 (1633)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<main class="wrap"><figure class="quote" id="q-e15e1b5f18" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing, and we are not only to shun that which gives scandal, but also that whereupon follows a scandal taken, whatsoever it be, if it be not necessary. This is so evident, that Papists themselves subscribe to it, for both Cardinal Cajetan and Dominicus Bannes say that we should abstain even spiritualibus non necessariis [non-necessary spiritual things] when scandal rises out of them. … XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious; and from things that are not necessary, we ought to abstain for the scandal of the malicious as well as for the scandal of the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, p. 32-33</span></figcaption>

</figure><figure class="quote" id="q-993c3a2447" data-kw="">
<blockquote><p>I was a hearty Revolutioner, and a great adorer of God’s goodness to these lands in sending that great man, King William, to overthrow our enemies and redeem us from slavery. Yet the aforesaid nine grievances [on pp. 232-33] stuck close with me, and stumbled me greatly; whereupon I had thoughts to go off the country. But alas, alas! before that project was ripe, I met with some, who otherwise were good men, but they had stated a separation from church and state, after the Revolution, because of the aforesaid nine grievances, to which they added many more. I at least was overcome with their arguments, joined with them, in the inadvertent simplicity of my heart, and being influenced with a zeal not altogether according to knowlege, I continued embarked in communion with them for some time, which laid a foundation for a train of many after trials to me; for I quickly found that I was out of the frying-pan into the heart of the fire: for, though Isaw great reason for these grievances on the government side, yet, amongst the dissenters, I found many grievances, some of which were intolerable unto me…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted</cite>, (Edinburgh: Oliphant, 1827), p. 234</span></figcaption>

</figure><figure class="quote" id="q-678f093652" data-kw="">
<blockquote><p>To treat with us upon that posture, or upon such terms, is a treatment neither scriptural, reasonable, just nor fair; nor is it the habile way to get grievances redressed. If this be the condition of union, it can never take place in our day, nor in any other period for what I know; at this rate ye proclaim a perpetual war. Nor is there any condescension here; for we might return to the Church of Rome, would they redress just grievances, and return to their happy state wherein they were when the apostle Paul wrote his epistle to the Romans. But, to make Church communion necessarily depend on such a redress in every part, is both destitute of a necessary warrant from the Word, and requires a standing-out until the Churches of Christ be brought to such a state as we are never like to see, nor for what I know is contained within the verge of the Lord’s gracious promises unto his Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

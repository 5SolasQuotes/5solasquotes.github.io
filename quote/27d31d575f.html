<main class="wrap"><figure class="quote" id="q-27d31d575f" data-kw="">
<blockquote><p>In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f507a876f" data-kw="">
<blockquote><p>Nor is the right of examination founded in this—that we ought to believe ourselves wiser and more sagacious than entire synods and the whole true church; but in this—that since the privilege of infallibility has been granted by God to no church or pastor, nor are we certain whether they who compose ecclesiastical assemblies are members of the true church and faithful servants of God, who are partakers of the Holy Spirit and follow his guidance; nay, it can happen (and it has too often happened) that such assemblies have erred in their decisions. Hence no other means is left for the believer to know the legitimate authority of these assemblies and the decisions made by them with the certainty of faith, than a comparison and examination of them with the word of God, which he not only permits as possible and lawful, but commands as just and necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.34</span></figcaption>

</figure><figure class="quote" id="q-e71cf0d322" data-kw="">
<blockquote><p>1st Conclusion. To show that our Church was a visible Church before Luther arose, and that our Reformers were lawfully called of God and the Church, is a question of fact: and cannot be proved by the Word of God. Because the Word of God is not a chronicle of these who were the true Church and truly called to the ministry since the apostles departed this life. 2. Because these must be proved by sense, and the testimony of human writings, who can err. 2nd Conclusion. Yet may it be gathered from human writers that the visible Church of protestants this day, has been since the apostles’ days. I mean the determinate persons may be known by human reasons and signs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 1, ch. 8, section 8, p. 229</span></figcaption>

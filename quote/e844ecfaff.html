<blockquote><p>It is evident, however, from the apostolic history, that the Apostles used whatever kind of bread was at hand. There is no significance either in the kind of bread or in the form of the loaf. It is enough that it is bread. This makes it the proper emblem of Him who declared himself to be the true bread which came down from heaven.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6286596b73" data-kw="">
<blockquote><p>Were it that we had no precept of Christ to [‘Do this’] but only the example of his doing it in the first institution, this should be a rule for us to observe it punctually, excepting in such circumstances which only occasionally and accidentally happened therein… Which doctrine we are now to try by the judgement of antiquity… In the days of Pope Julius, anno 337, there arose many giddy spirits which violated the holy institution of Christ in this sacrament when as some consecrated milk instead of wine, others sopped the bread in the cup, a third sort squeezed grapes there-into. These, and the like, that holy Pope did condemn, but how? By pretense of custom only? No, but by the obligation of Christ, his example, and institution of this sacrament, in these words following: Because these are contrary (says he) to evangelical and apostolical doctrine and ecclesiastical custom, as is easily proved from the fountain of truth, from whence the sacraments had their first ordinance; for when our Master of Truth commended this to his disciples, He gave to none milk, but bread only, and the cup. Nor does the Gospel mention the sopping of bread, but of giving bread apart, and the cup also apart, etc. So Pope Julius [see the original latin]. Long after this, the Council of Braccara (about the year of our Lord, 675) [footnote] withstood the complemental custom of receiving both kinds [of bread and wine] in dipped sops, but wot [know] you why? Hearken, even because it is not revealed in the Gospel of Christ’s institution. Ponder the Testimony in the margin [of the book] and you shall find it point-blank contradictory to your opinion and practice. Which reasoning of the bishops of that council had been very loose and lavish, except they had believed that the form of institution of Christ, concerning the participation of both kinds, was as commandatory as well for the people as the priest.</p></blockquote>

</figure><figure class="quote" id="q-752dfaf3c6" data-kw="">
<blockquote><p>Secondly, it was not of the substance of the institution [of the Lord’s Supper] to eat unleavened bread, no more than to eat it at night… we are not more bound to the one, than to the other. Again, Christ used unleavened bread because it was the usual bread at that time: so we do use that which is the usual bread in our time. And St. Paul speaketh of such bread as was usual among the gentiles, when he saith, ‘The bread which we break’, 1. Cor. 10:17. Ergo, ordinary bread and leavened [is] to be used, not unleavened.</p></blockquote>

<blockquote><p>…the Rejoinder [in opposition to Ames] answers that sopping of bread in wine is worse than the cross: 1. Because the cross makes no alteration, of what Christ did ordain, saying ‘Do this.’ 2. It is not substituted in the place of baptism, as sops in wine were by those heretics in place of the [Lord’s] Supper. 3. It is not esteemed an instrumental sign of any grace given by the use of it, as they took their sops to be. 4. Their sopping destroyed the very sacrament. …But [Ames answers]: 1. Addition is as evil as alteration. For when Christ said, ‘Do this,’ He meant as well, do this only, as do this all. Fac hoc totum: fac hoc tantum: as [Jerome] Zanchi expounds it. Addition also is some alteration, if not of the things instituted, yet of the institution, as making it insufficient or incomplete by itself alone.</p></blockquote>

</figure><figure class="quote" id="q-efc52c85f3" data-kw="">
<blockquote><p>The second matter to be considered in reference to this sacrament is the external signs. We must here take note of the signs and the ceremonies associated with them. The signs are identical to those used in meals in order to nourish and refresh the body: bread and wine. One is to be neither superstitious nor concerned regarding the kind of bread and wine. The bread and wine which Christ used were such as were available and in common use. It is credible that in light of the Passover Christ used unleavened bread; but that was incidental, for leavened bread was neither permitted to be used nor was it available in Jerusalem at that time. It is therefore not necessary to follow suit in this respect. It must be bread which one commonly uses for nourishment, thus to typify the spiritual nourishment of the soul. The wafers of the Papists and the Lutherans consist more of foam than of bread, and are not suitable for nourishment and strengthening. This is contrary to the institution of the Lord’s Supper; Christ had no wafers, but took bread, broke off fragments, and gave them to the disciples. He did not give a wafer to anyone. … Common substances must be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The second matter to be considered in reference to this sacrament is the external signs. We must here take note of the signs and the ceremonies associated with them. The signs are identical to those used in meals in order to nourish and refresh the body: bread and wine. One is to be neither superstitious nor concerned regarding the kind of bread and wine. The bread and wine which Christ used were such as were available and in common use. It is credible that in light of the Passover Christ used unleavened bread; but that was incidental, for leavened bread was neither permitted to be used nor was it available in Jerusalem at that time. It is therefore not necessary to follow suit in this respect. It must be bread which one commonly uses for nourishment, thus to typify the spiritual nourishment of the soul. The wafers of the Papists and the Lutherans consist more of foam than of bread, and are not suitable for nourishment and strengthening. This is contrary to the institution of the Lord’s Supper; Christ had no wafers, but took bread, broke off fragments, and gave them to the disciples. He did not give a wafer to anyone. … Common substances must be used without superstition.”

— Wilhelmus à Brakel, This quote was compiled by Andy Webb">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+matter+to+be+considered+in+reference+to+this+sacrament+is+the+external+signs.+We+must+here+take+note+of+the+signs+and+the+ceremonies+associated+with+them.+The+signs+are+identical+to+those+used+in+meals+in+order+to+nourish+and+refresh+the+body%3A+bread+and+wine.+One+is+to+be+neither+superstitious+nor+concerned+regarding+the+kind+of+bread+and+wine.+The+bread+and+wine+which+Christ+used+were+such+as+were+available+and+in+common+use.+It+is+credible+that+in+light+of+the+Passover+Christ+used+unleavened+bread%3B+but+that+was+incidental%2C+for+leavened+bread+was+neither+permitted+to+be+used+nor+was+it+available+in+Jerusalem+at+that+time.+It+is+therefore+not+necessary+to+follow+suit+in+this+respect.+It+must+be+bread+which+one+commonly+uses+for+nourishment%2C+thus+to+typify+the+spiritual+nourishment+of+the+soul.+The+wafers+of+the+Papists+and+the+Lutherans+consist+more+of+foam+than+of+bread%2C+and+are+not+suitable+for+nourishment+and+strengthening.+This+is+contrary+to+the+institution+of+the+Lord%E2%80%99s+Supper%3B+Christ+had+no+wafers%2C+but+took+bread%2C+broke+off+fragments%2C+and+gave+them+to+the+disciples.+He+did+not+give+a+wafer+to+anyone.+%E2%80%A6+Common+substances+must+be+used+without+superstition.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+This+quote+was+compiled+by+Andy+Webb&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefc52c85f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efc52c85f3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/quotes-on-common-bread-in-the-lords-supper/#:~:text=The%20second%20matter%20to%20be%20considered,substances%20must%20be%20used%20without%20superstition." rel="noopener" target="_blank">Read it online · Reformed Books Online

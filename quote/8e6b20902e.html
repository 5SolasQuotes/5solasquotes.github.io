<main class="wrap"><figure class="quote" id="q-8e6b20902e" data-kw="Creeds below Scripture">
<blockquote><p>The authority of confessions ought indeed to be great with the pious in the churches, but still sinking below the authority of the Scripture. For the latter is a rule, they the thing ruled. It alone is self-credible (autopistos) with respect to words as well as to things, divine and infallible; they, as divine in things, still in words and manner of treatment are human writings. Faith is immediately and absolutely due to it; to them an examination is due and that having been made, if they agree with the word, faith. It is the constant and immutable canon of faith; while they are subject to revision and new examination, in which it is right not only to explain and amplify them, but also to correct whatever fault should be found in them and reform according to the rule of the word. Hence it is evident that they err here in excess who hold such confessions as the rule of the truth itself and make them equal to the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac32f176d6" data-kw="">

</figure><figure class="quote" id="q-c89569f066" data-kw="councils can err">
<blockquote><p>The question does not simply concern the invisible church of the elect or the universality of believers, whether it can err in the foundation (which our doctrine concerning the perseverance of the saints sufficiently proves is slanderously charged upon us), but whether it is to be said to be so infallible as to be exposed to no error (which we deny). The question is not properly of the collective visible church of believers, but especially of the representative church in councils and of the Roman pontiff.</p></blockquote>

</figure><figure class="quote" id="q-ec975dbf30" data-kw="Councils Authority of councils Sola Scriptura">
<blockquote><p>What, then, you will say, is there no authority in the definitions of councils? Yes, indeed; for I do not contend that all councils are to be condemned, and all their acts rescinded, or, as it is said, made one complete erasure. But you are bringing them all (it will be said) under subordination, and so leaving every one at liberty to receive or reject the decrees of councils as he pleases. By no means; but whenever the decree of a council is produced, the first thing I would wish to be done is, to examine at what time it was held, on what occasion, with what intention, and who were present at it; next I would bring the subject discussed to the standard of Scripture. … In this way, councils would be duly respected, and yet the highest place would be given to Scripture, everything being brought to it as a test.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.8</span></figcaption>

</figure><figure class="quote" id="q-31fa497d99" data-kw="Councils contradict councils">
<blockquote><p>Nor is there any ground for whispering to me, that when councils are at variance, one or other of them is not a lawful council. For how shall we ascertain this? Just, if I mistake not, by judging from Scripture that the decrees are not orthodox. For this alone is the sure law of discrimination.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-efe1da18ef" data-kw="">
<blockquote><p>XIV… “And so that you may do this, we must distinguish between passive and active justification. In passive justification, we are persuaded that we are justified by God, or from it we conclude that we are justified by God. In this way it certainly can be said that we are justified by faith as an instrument, insofar as in the practical syllogism, by means of which we conclude that we are infallibly justified, faith stands as the middle term: “The one who believes is justified; I believe; therefore, I am justified.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04a4146caa" data-kw="">
<blockquote><p>It is a clear case, that these three [belief, fear and love] are the only means, yea a perfectly sufficient means to make the solder and the union between God and man, and to bring a man to the possession and fruition of God (for this comprehends the whole man), so that the whole man is possessed of God, and inflamed by God, when his understanding knows Him, and sees the excellency that is in Him, and when the affections of his heart cleave to Him, and close with the most sovereign affections of fear and love, and then when all his whole man is at the command of this, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-stoughton.html">John Stoughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Richard Baxter, Richard Baxter’s Confession (1655), ch. 10, sect. 3, p. 398-99 Stoughton (1593?–1639) | Sermon 7</cite>, p. 63</span></figcaption>

</figure><figure class="quote" id="q-ec8337d7c9" data-kw="">
<blockquote><p>We further say that good works justify us in St. James’s sense, Jm. 2:14. There is a double justification: 1. A justification of a man from sin in the sight of God. 2. Of a Christian from hypocrisy in the sight of both God and man; the first way a man is justified only by the blood of Christ; the second way by good works; for we must know a man’s conscience has two burdens. 1. My sins are great and liable to damnation; how shall I be acquit of that? From this our own works cannot justify us; it is done only by the blood of Christ. 2. I: But the blood of Christ cleanses only true Christians that are in Christ and have true grace; but you are an hypocrite; how shall I now be quit from the imputation of hypocrisy? In that I am justified by my works, let it appear to myself and others that I have lived in all uprightness, 2 Cor. 1:12; so that justification from hypocrisy before God and man is from the witness of my upright and unblameable life, so that I am justified from a double accusation: from the one by one way, from the other by another way. I am a sinner, that I cannot deny; my best works are sinful; therefore from that I am justified only by the blood of Christ. But Christ’s blood belongs not to you; you are an hypocrite; now how shall I know the sincerity of faith but from the fruits, which is an holy and righteous life, so that if I walk so, I justify myself from that imputation. How does Hezekiah help himself when God spake bitter things? ‘Remember how I have walked before Thee with an upright heart,’ 2 Jn. 3; Isa. 53:11. How do I know that I know Him? Why if I keep his commandments; therefore we say that an holy life is an evident sign of our fellowship with God: it glorifies God; it stops slanders and brings on others; and besides all this, a godly life will justify us from hypocrisy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary… upon the First Epistle General of John (d. 1652; London: 1658), on 1 Jn. 1:7, “Doctrine: To walk in the light is a certain mark of true fellowship with God”</cite>, p. 31</span></figcaption>

</figure><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

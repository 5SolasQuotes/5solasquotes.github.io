<main class="wrap"><figure class="quote" id="q-354cc7d39c" data-kw="">
<blockquote><p>Add unto these a distinction betwixt a congregation lying alone in an island, province or nation, and a congregation bordering with sister churches. If either there be but one congregation in a kingdom or province, or if there be many far distant one from another, so that their pastors and elders cannot ordinarily meet together, then may a particular congregation do many things by itself alone, which it ought not to do where there are adjacent neighbouring congregations, together with which it may and should have a common presbytery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (1641), p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26f1ea2082" data-kw="">
<blockquote><p>It is true, they [the Independents] object that the apostles, Mt. 18, were commanded to preach to all nations, but pastors are not so now, but are commanded to feed the flock over which God has appointed them, Acts 20:28; but it is as true [that] the apostles were commanded to preach to all nations, in opposition to the charge that the prophets of old were to speak to the people of Israel only, and the apostles, Mt. 10, [were] forbidden to preach to the Samaritans and gentiles; and it is as true that God’s Spirit limited the apostles to preach to Macedonia, not to Bithynia; Now because this particular direction for places is wanting in the Church, it is certain that a man is yet a pastor in office in relation to as many as God’s hand of providence shall send him unto, though he be chosen by a people to feed ordinarily one determinate flock, and though he be not an extraordinary and immediately inspired planter of Churches, or the first planter, as were the apostles, yet is he a pastor in relation to all. And if this be not said: 1. It were simply unlawful for pastors now to plant churches and spread the Gospel to those nations who have not heard it, because all pastors now are ordinary [according to congregationalists], and none are immediately inspired apostles: but it is certain what the apostles did by an extraordinary gift, as such immediately called pastors, it is unlawful for ordinary pastors to attempt to do, as to attempt to speak with tongues, and to plant Churches by speaking with tongues and confirming it with miracles is unlawful. Papists, as Bellarmine, Suarez, Acosta, ascribe this to the Pope and his apostles. Our divines answer that the apostles that way have no successors; But what the apostles did by an ordinary pastoral gift, as to preach the Word, administrate the Sacraments, to erect and plant Churches by ordinary gifts, where the pastors can speak to the Churches by an ordinary gift in their own language, they are obliged both within and without the congregation, to preach as pastors, because where God gives gifts pastoral to pastors, he commands them to exercise these gifts, else they dig their Lord’s talent in the earth: but God gives to pastors pastoral gifts to preach to others than their own congregation, and to administrate the seals to them also, and to plant churches. Therefore, it is presumed that the Church does give authority and an external ministerial calling to the exercise of these gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, pp. 207-8</span></figcaption>

<blockquote><p>[Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, disputation 19, thesis 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leiden, Synopsis of Pure Theology, disputation [??], thesis 17, p. 605; [William] Bucanus, in loc., Common place 42, question 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, et munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Commentary on the same, Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trocherig, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.</p></blockquote>

<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it:

1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein.

2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita.

3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>

2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita.

3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.”

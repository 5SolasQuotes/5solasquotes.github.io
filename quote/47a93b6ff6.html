<main class="wrap"><figure class="quote" id="q-47a93b6ff6" data-kw="">
<blockquote><p>If believers as giving Peter’s confession, and as builded upon the rock, Christ, by this place made a ministerial Church, by Christ, and gifted with the power of the keys, then the Ministry &amp; official power of preaching and binding and loosing should be made as stable and firm from defection, as the Church of elect believers, against whom the gates of hell cannot prevail: now besides that this is most untrue since, visible Churches do fall away, as these seven Churches in Asia, the Church of Corinth, Ephesus, Galatia, Thessalonica may prove, when as it is impossible that the elect Believers in Christ can fall away, it shall also give good warrant to Papists, to make such use of this place, as they do, that the Church may err in points of conversation and life, but cannot fall from the rock, nor be overcome by the powers of Hell in the definition of Articles of Faith.

So Gretser, Bellarmine, Suarez, Gregor, de Valent, Cardi, Hosius, Turrecremata, reason from this place; and the connexion must be good, if the Ministerial power not only be given to the Church as to the Object, that is, for the good and salvation of the Church, but also to the Church as to the Subject, who hath all the power of the Keys, and may use it also, because they are believers and builded upon the rock Christ; nothing hindereth, but Ministerial power should be as stable and free from being overcome with the ports of Hell, as the Christian state of perseverance in grace. Now we see, these who have Ministerial power, abuse it, and fall from the rock and perish eternally; which we cannot say of these, who by Faith are builded upon the Rock Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), pp 14-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e616d3acac" data-kw="">
<blockquote><p>In 1661, Bishop Rust’s ‘A Letter of Resolution Concerning Origen and the Chief of his Opinions,’ was published anonymously with the support of his fellow Cambridge Platonists. This treatise is a bold defence of Origen’s teachings about the pre-existence of souls and the salvation of all God’s rational creatures… the influence that it and the Cambridge Platonists had on the flourishing of universalism in the following century was enormous. If the sixteenth century provided the fertile soil, it was the seventeenth century which sowed the seeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell</cite>, (2025)</span></figcaption>

<blockquote><p>What is ‘happiness’ after all? Is it a matter of ‘getting what you want’? Is it a matter of maximizing pleasure and minimizing pain, as Bentham and Mill held (albeit in different ways)? On these conceptions, happiness seems to be definable in terms of the subjective states of the agent. On an Aristotelian or classical natural law conception, though, it is something objective, a matter of living in accordance with one’s nature, understood as a fixed essence entailing a natural end or purpose.</p></blockquote>

<blockquote><p>38. Can we say very much about heaven and the blessings of heaven? No, for this far surpasses our understanding. We know only: … b) The enjoyment of heaven is in the first place the enjoyment of God, the visio Dei, a ‘beholding of God.’ This is not to be understood one-sidedly in an intellectualistic manner but in all its magnitude. The nearness of God will affect every capacity of man, and every capacity will react to it. Theologians usually speak of visio [seeing], amor [love], gaudium [joy], gloria [glory]; others of knowing, serving, enjoying and glorifying God (cf. 1 Cor. 13:9-13). It has been asked whether this will be a seeing with physical eyes. This is not to be assumed. God is not visible to the senses. The Mediator certainly is. No one has ever seen God. This seeing follows on faith. It is thus something that is comparable with faith but that still does not necessarily need to be a perceiving with the senses. There will thus be a perception of God, yet such that it is not a material entity that appears to us. c) The enjoyment of heaven in fellowship with God is eternal life in all its fullness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. Richard B. Gaffin 1 vol. ed. (Lexham Press, 2020), Ecclesiology, the Means of Grace, Eschatology, pt. 3, Eschatology, ch. 7, ‘General Eschatology’, pp. 1153-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

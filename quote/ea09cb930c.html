<blockquote><p>Works are considered: 1. In their own dignity and merit: 2. In the acceptation of God’s goodness, or as they are done by a Christian, pleasing to God, pardoned and beloved in Christ. And in this wise God accepts them as righteous, and imputes them to man for righteousness, etc.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3eaa37cff6" data-kw="">
<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, pp. 121</span></figcaption>

</figure><figure class="quote" id="q-eaa89a1389" data-kw="">
<blockquote><p>(2) Works required by the Law are either wrought before faith, without the aid of grace; or after believing, by the help of the Holy Ghost. The former are excluded from our justification, but not the latter. (3) Works of Obedience wrought after grace received, may be considered either as sincere only, or absolutely perfect according to what was originally required in the Covenant of Works. Those of the latter sort are excluded from any place in our justification, but not those of the former. … (5) Justification may be considered either as to its beginning or as unto its continuation, and so it has diverse causes under these diverse respects. (6) Works may be considered either as meritorious ex condigno, so as their merit should arise from their own intrinsic worth, or ex congruo only with respect unto the Covenant and promise of God. Those of the first sort are excluded at least from the first justification; the latter may have place both in the first and second. (7) Moral causes may be of many sorts; preparatory, dispository, meritorious, conditionally efficient, or only sine quibus non [without which nothing]. And we must diligently inquire in what sense, under the notion of what cause or causes, our works are excluded from our justification and under what notions they are necessary thereunto. And there is no one of these distinctions but it needs many more to explain it, which accordingly are made use of by learned men.</p></blockquote>

</figure><figure class="quote" id="q-a6e7e6bf5f" data-kw="">
<blockquote><p>the word ‘justify’ has two meanings, the first signifies to absolve anyone from crimes… and to pronounce him just, and is opposed to the word ‘to condemn;’ and this signification is altogether forensic. The other meaning of the word is, that a man is made just from being unjust, as also to be sanctified is, to be made holy from being profane; in which signication the apostle has said, ‘And such were some of you, etc. [1 Cor. 6:11]’, i.e. you have been made, from being unclean, clean, holy from being profane, just from being unjust, by the Holy Ghost, on account of Christ, in whom you believe. To which meaning relates that passage also, which we read in the Revelation, ‘He that is just, let him be justified still more,’ i.e. let him become in truth, from being just, still more just, viz., in the same way as from being unjust, he had been made just. And the Fathers and especially S. Augustine, have interpreted the word in this sense… These are two certain meanings of this word ‘to justify’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, vol. 6, thesis 13, p. 81 [or 84?] in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, p. 155</span></figcaption>

</figure><figure class="quote" id="q-0faa64e055" data-kw="">
<blockquote><p>The word ‘justification’ I take in a wide sense, so as to embrace whatever we obtain from Christ, whether by imputation, or by the efficacy of the Spirit in sanctifying us… Thus also the word ‘to justify’ is taken in Rom. 8:30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Titus 3:7, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, p. 153</span></figcaption>

<blockquote><p>Moreover, the law of Moses is an example of the natural law, most suitably expressing the common notions of nature endowed by natural law. For the principles and conclusions of the natural law, that is, those common notions of nature, are perfectly expressed in the law of Moses. These common notions not only exist in the corrupted nature of man, but also existed in the pure and original nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, trans. Todd M. Rester, ed. Andrew M. McGinnis (Grand Rapids: CLP Academic 2015), 60.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c42b46fc70" data-kw="">
<blockquote><p>The officers that rule the world in God’s stead, as father mother, master, husband, lord and prince, are honoured, when the law, which Almighty God has committed unto them to rule with, is obeyed. Thy neighbour that is out of office is honored, when thou (as God has commanded thee) lovest Him as thyself, countest him as good as thyself, thinkest him as worthy of any thing as thyself, and comest lovingly to help him at all his need, as thou wouldest be holp thyself; because God hath made him like unto his own image, as well as thee, and Christ hath bought him as well as thee. If I hate the law, so I break it in mine heart; and both hate and dishonour God, the maker thereof. If I break it outwardly, then I dishonour God before the world, and the officer that ministers it. If I hurt my neighbour, then I dishonor my neighbor and Him that made him, and him also that bought him with his blood… If I be not ready to help my neighbor at his need, so I take his due honour from him, and dishonour him, and him that made him, and Him also that bought him with his blood, whose servant he is… In like manner, if the officer, abusing his power, compel the subject to do that which God forbiddeth, or to leave undone that which God commandeth, so he dishonoureth God in withdrawing his servant from him, and maketh an idol of his own lusts, in that he honoureth them above God; and he dishonoureth his brother in that he abuseth him, contrary unto the right use which God hath created him for, and Christ hath bought him for, which is to wait on God’s commandments. For if the officer be otherwise minded than this, the worst of these subjects is made by the hands of Him that made me, and bought with the blood of Him that bought me, and therefore, my brother; and I but his servant only, to defend him, and to keep him in the honour that God and Christ has set him, that no man dishonors him: he dishonours both God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57</span></figcaption>

</figure><figure class="quote" id="q-993670cede" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?… All civil power is immediately from God in its root; in that, 1st, God has made man a social creature, and one who inclines to be governed by man; then certainly He must have put this power in man’s nature: so are we, by good reason, taught by Aristotle. 2nd, God and nature intends the policy and peace of mankind, then must God and nature have given to mankind a power to compass this end; and this must be a power of government… As domestic society is by nature’s instinct…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 1</span></figcaption>

<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>

<blockquote><p>This consideration may be very useful: For it may first serve to be a cure of two great ills in this land: One is of such as conceive that the Law of God, belongs not to Christians; They may as well say that common and natural equity belongs not to Christians. Is it not written in the heart of man by nature? Is it not confirmed by Jesus Christ? Is it not recommended to Christians by the apostles? Is it not established by faith? Is not the observing of it, a testimony of our communion with God? Is not the end of it love from a pure heart, a good conscience, and faith unfeigned? Is it thankfulness to God, because we are delivered from the condemnation, coaction [compulsory force], and rigor of the Law, not to acknowledge the obligation of the Law? Shall not the domestics of the house of God observe the commandments of God, or shall they not be grieved when they transgress and observe them not?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached to the Honorable House of Commons at their Late Solemn Fast, Wed., Dec. 27 on Ezra 7:23</cite>, (1643), p. 30</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This consideration may be very useful: For it may first serve to be a cure of two great ills in this land: One is of such as conceive that the Law of God, belongs not to Christians; They may as well say that common and natural equity belongs not to Christians. Is it not written in the heart of man by nature? Is it not confirmed by Jesus Christ? Is it not recommended to Christians by the apostles? Is it not established by faith? Is not the observing of it, a testimony of our communion with God? Is not the end of it love from a pure heart, a good conscience, and faith unfeigned? Is it thankfulness to God, because we are delivered from the condemnation, coaction [compulsory force], and rigor of the Law, not to acknowledge the obligation of the Law? Shall not the domestics of the house of God observe the commandments of God, or shall they not be grieved when they transgress and observe them not?”

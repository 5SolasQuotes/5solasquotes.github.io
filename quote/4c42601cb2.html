<main class="wrap"><figure class="quote" id="q-4c42601cb2" data-kw="">
<blockquote><p>I. The first thing I have to show is the general excellence of freedom.

On this point some readers may think it needless to say anything: they imagine that all men know the value of freedom, and that to dwell on it is a mere waste of time. I do not agree with such people at all. I believe that myriads of Englishmen know nothing of the blessings which they enjoy in their own land: they have grown up from infancy to manhood in the midst of free institutions. They have not the least idea of the state of things in other countries: they are ignorant alike of those two worst forms of tyranny,—the crushing tyranny of a cruel military despot, and the intolerant tyranny of an unreasoning mob. In short, many Englishmen know nothing of the value of liberty, just because they have been born in the middle of it, and have never been for a moment without it.

I call then on every one who reads this paper to remember that liberty is one of the greatest temporal blessings that man can have on this side the grave. We live in a land where our bodies are free. So long as we hurt nobody’s person, or property, or character, no one can touch us: the poorest man’s house is his castle. We live in a land where our actions are free. So long as we support ourselves, we are free to choose what we will do, where we will go, and how we will spend our time. We live in a land where our consciences are free. So long as we hold quietly on our own way, and do not interfere with others, we are free to worship God as we please, and no man can compel us to take his way to heaven. We live in a land where no foreigner rules over us. Our laws are made and altered by Englishmen like ourselves, and our Governors dwell by our side, bone of our bone and flesh of our flesh.

In short, we have every kind of freedom to an extent which no other nation on earth can equal. We have personal freedom, civil freedom, religious freedom, and national freedom. We have free bodies, free consciences, free speech, free thought, free action, free Bibles, a free press, and free homes. How vast is this list of privileges! How endless the comforts which it contains! The full value of them can never perhaps be known. Well said the Jewish Rabbins in ancient days: ‘If the sea were ink and the world parchment, it would never serve to describe the praises of liberty.’

The want of this freedom has been the most fertile cause of misery to nations in every age of the world. What reader of the Bible can fail to remember the sorrows of the children of Israel, when they were bondmen under Pharaoh in Egypt, or under Philistines in Canaan? What student of history needs to be reminded of the woes inflicted on the Netherlands, Poland, Spain, and Italy by the hand of foreign oppressors, or the Inquisition? Who, even in our own time, has not heard of that enormous fountain of wretchedness, the slavery of the Negro race? No misery certainly is so great as the misery of slavery.

To win and preserve freedom has been the aim of many national struggles which have deluged the earth with blood. Liberty has been the cause in which myriads of Greeks, and Romans, and Germans, and Poles, and Swiss, and Englishmen, and Americans have willingly laid down their lives. No price has been thought too great to pay in order that nations might be free.

The champions of freedom in every age have been justly esteemed among the greatest benefactors of mankind. Such names as Moses and Gideon in Jewish history, such names as the Spartan Leonidas, the Roman Horatius, the German Martin Luther, the Swedish Gustavus Vasa, the Swiss William Tell, the Scotch Robert Bruce and John Knox, the English Alfred and Hampden and the Puritans, the American George Washington, are deservedly embalmed in history, and will never be forgotten. To be the mother of many patriots is the highest praise of a nation.

The enemies of freedom in every age have been rightly regarded as the pests and nuisances of their times. Such names as Pharaoh in Egypt, Dionysius at Syracuse, Nero at Rome, Charles IX. in France, bloody Mary in England, are names which will never be rescued from disgrace. The public opinion of mankind will never cease to condemn them, on the one ground that they would not let people be free.</p></blockquote>

<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God: the power that is, must be from God; the magistrate, as magistrate, is good in nature of office, and the intrinsic end of his office (Rom. 13:4), ‘for he is the minister of God for thy good;’ and, therefore, a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power; and is no more from God, but from sinful nature and the old serpent, than a license to sin.</p></blockquote>

</figure><figure class="quote" id="q-33c24143a8" data-kw="">
<blockquote><p>But here it is requisite, that we make a difference betwixt the office which is the good ordinance of God, and the evil person that doth not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that cometh of other causes, and the fault thereof is the men of persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupteth the ways of God, and by his own fault and naughtiness transgresseth God’s ordinance, so far, that he doth worthily deserve the name of devilish power, and not divine authority[.]

[W]e have an example of this in the magistrate of Jerusalem. For although he was able to refer the beginning of his power by degrees to Moses, and so to God himself who ordained it — yet, because he arrests the Saviour in the garden and binds him, it is said to his servants, “Ye are come out as it were to a thief with swords and staves; when I was with you daily in the temple, ye stretched not forth your hands against me. But this is even your hour, and the power of darkness.” Lo, here he calleth the ordinary magistrate the power of the devil, when he abuseth his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office.

Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil: for whereas he hung up and beheaded the apostles of Christ, moving a bloody persecution against the church, that sprang not from elsewhere than from the devil, the father of murder. So then, verily, we ought not at any time to defend the tyrannical power, and say that it is of God: for tyranny is not a divine, but a devilish, kind of government; and tyrants themselves are properly the servants of the devil, and not of God.</p></blockquote>

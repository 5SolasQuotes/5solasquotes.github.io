<blockquote><p>§XXIII. The opposite of liberty is necessity; yet not just any. Not: (1) the Necessity of Servitude, which is the state of man after the Lapse, in which man is subject to the yoke of sin and the misery flowing from it; whence the will of men has become a servant of sin, from Jn. 8:34; 2 Pet. 2:19; Rom. 7:14, without the destruction of natural liberty, which a servant exercises just as freely in things pertaining to his own sphere as a master does in those that pertain to his sphere; since, notwithstanding the servitude of sin, free will has remained immune from the necessity of this or that crime, and is free in animal, economic, civil, and moral matters of the natural order. … Nor (3) the Necessity of Dependence on God in becoming and being, and in operating; as that which is common to all creatures, not only the irrational, but also the rational; since, this dependence being saved, the mode of dependence is and remains various or diverse for the variety of creatures and agents: for intellectual creatures and free agents do not depend on God in the manner of stupid brutes, much less in the manner of statues or of turning metal plates, but as intellectual and free agents, which, being endowed with an internal active principle, exercise and determine their own acts under divine providence and grace, and are thence capable of a gratuitous reward or a just punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707) Latin Holtzfus was a German reformed divine.</cite>, ch. 1, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not. 2. Therefore to such the impossibility is not physical, but moral. 3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.) 4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations. 5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.) 6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.</p></blockquote>

<blockquote><p>§XVII. The ultimate judgment of the practical intellect is indeed a condition without which the will does not ordinarily operate; In the meantime, however, the will is not determined by the practical judgment of the intellect. Which, against the Thomists and certain of the Reformed, to whom Bellarmine accedes here in bk. 3 of On Grace &amp; Free Will, ch. 8, the Scotists and others rightly deny, who teach that the ultimate judgment of the practical intellect does not necessarily determine the will, for: (1) Scripture teaches that men often act, or choose something against the light of the intellect, or the dictate of right reason and grace, as in: Job 21:14, ‘They said to God, depart from us, we do not want the knowledge of thy ways.’ Ch. 24:13, ‘They were rebellious to the light.’ Lk. 12:47, ‘The servant who knew the will of his Lord, and did not prepare himself, nor did according to his will, will be beaten with many stripes.’ Jm. 4:17, ‘To him who knows to do good and does it not, to him it is sin.’ (2) Whence they are damned who have acted against the dictate of the intellect or of right reason. Jn. 3:19, ‘This is the judgment, because men loved darkness more than the light: for their works were evil.’ Rom. 2:1-2, ‘Thou art inexcusable, O man, whosoever thou art that judgest. For wherein thou judgest another, thou condemnest thyself: for thou dost the same things which thou judgest.’ vv. 17-18 ff., ‘If thou art called a Jew, and restest in the law, and makest thy boast of God, and knowest his will, and approvest the more profitable things, being instructed by the law, art confident that thou thyself art a guide of the blind, a light of them that are in darkness, an instructor of the foolish, a teacher of infants, having the form of knowledge and of truth in the law. Thou therefore that teachest another, teachest not thyself? thou that preachest that men should not steal, stealest? Thou that sayest, men should not commit adultery, dost thou commit adultery? thou that abhorrest idols, dost thou commit sacrilege? Thou that makest thy boast of the law, by transgression of the law dishonourest God.’ Eze. 12:2, ‘They have eyes to see, and see not: and ears to hear, and hear not: for they are a provoking house.’ cf. Eze. 33:31-32; Zech. 7:11-12; Jer. 6:16-17; Jn. 5:40; ch. 8:46; ch. 15:22; Acts 7:51; ch. 13:46; Mt. 11:21. (3) If the will were necessarily determined by the ultimate judgment of the practical intellect, it would follow that the will acts not freely but naturally. (4) This opinion being admitted, the will would not be an active faculty that moves and determines, but a passive one, moved and determined; which should rather be said of the intellect. (5) It would follow that the will could never prefer a lesser good to a greater good; and (6) from two equal goods it could choose neither. But experience teaches the contrary. (7) There would be no voluntary, deliberate sins against conscience; against the passages cited in n. 2; for to sin voluntarily and against conscience is to cry out against the ultimate judgment of the practical intellect. (8) There would be no blasphemy against the Holy Spirit, against Mt. 12:31-32; Mk. 3:28-29; Heb. 6:4-6; 10:29. The intellect therefore moves the will indeed, but not physically, but morally, as a guide, not as a master; and the will depends on the intellect, but not as from an effective principle of volition, but as from a condition without which it would not be. In agreement are: Peter Molinæus, Enodatio Gravissimarum Quaestionum, Tract 6, quest. 2, p. 192; Ames, On Conscience &amp; its Law or Cases, bk. 1, ch. 7, §6-7; Robert Baron, Metaphysica Generalis, sect. 12, disp. 1, n. 20, 29 ff., pp. 325, 335 ff.; G.J. Voss, On Idolatry, §3, ch. 43; Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 3, subsect. 3, art. 1, §10 ff.; Baxter, Method of Theology, pt. 1, ch. 5, n. 35-37, p. 160; ch. 8, n. 106, p. 208; ch. 14, n. 68-70, pp. 276-77; and from the Cartesian hypothesis, Burmann, Synopsis, bk. 2, ch. 11, §5; Wittich, Pacific Theology, ch. 11, §126-27. Compare also Hornejus, Moral Philosophy, bk. 2, ch. 5-6, 10 ff.; and from the Scholastics, Suarez, Metaphysical Disputations, 19, sect. 6, n. 2; Becanus, Scholastic Theology, pt. 2, tract 1, ch. 2, quest. 5; Arriaga, Disputations on Physics, 8, sect. 2; Fonseca, etc.; also Boyvin, Philosophy of Scotus, pt. 4, pt. 1, disp. 2, quest. 1 and Theology of Scotus, pt. 2, Tract on the Grace of Christ, ch. 2, quest. 4.</p></blockquote>

 not commit adultery, dost thou commit adultery? thou that abhorrest idols, dost thou commit sacrilege? Thou that makest thy boast of the law, by transgression of the law dishonourest God.’ Eze. 12:2, ‘They have eyes to see, and see not: and ears to hear, and hear not: for they are a provoking house.’ cf. Eze. 33:31-32; Zech. 7:11-12; Jer. 6:16-17; Jn. 5:40; ch. 8:46; ch. 15:22; Acts 7:51; ch. 13:46; Mt. 11:21. (3) If the will were necessarily determined by the ultimate judgment of the practical intellect, it would follow that the will acts not freely but naturally. (4) This opinion being admitted, the will would not be an active faculty that moves and determines, but a passive one, moved and determined; which should rather be said of the intellect. (5) It would follow that the will could never prefer a lesser good to a greater good; and (6) from two equal goods it could choose neither. But experience teaches the contrary. (7) There would be no voluntary, deliberate sins against conscience; against the passages cited in n. 2; for to sin voluntarily and against conscience is to cry out against the ultimate judgment of the practical intellect. (8) There would be no blasphemy against the Holy Spirit, against Mt. 12:31-32; Mk. 3:28-29; Heb. 6:4-6; 10:29. The intellect therefore moves the will indeed, but not physically, but morally, as a guide, not as a master; and the will depends on the intellect, but not as from an effective principle of volition, but as from a condition without which it would not be. In agreement are: Peter Molinæus, Enodatio Gravissimarum Quaestionum, Tract 6, quest. 2, p. 192; Ames, On Conscience &amp; its Law or Cases, bk. 1, ch. 7, §6-7; Robert Baron, Metaphysica Generalis, sect. 12, disp. 1, n. 20, 29 ff., pp. 325, 335 ff.; G.J. Voss, On Idolatry, §3, ch. 43; Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 3, subsect. 3, art. 1, §10 ff.; Baxter, Method of Theology, pt. 1, ch. 5, n. 35-37, p. 160; ch. 8, n. 106, p. 208; ch. 14, n. 68-70, pp. 276-77; and from the Cartesian hypothesis, Burmann, Synopsis, bk. 2, ch. 11, §5; Wittich, Pacific Theology, ch. 11, §126-27. Compare also Hornejus, Moral Philosophy, bk. 2, ch. 5-6, 10 ff.; and from the Scholastics, Suarez, Metaphysical Disputations, 19, sect. 6, n. 2; Becanus, Scholastic Theology, pt. 2, tract 1, ch. 2, quest. 5; Arriaga, Disputations on Physics, 8, sect. 2; Fonseca, etc.; also Boyvin, Philosophy of Scotus, pt. 4, pt. 1, disp. 2, quest. 1 and Theology of Scotus, pt. 2, Tract on the Grace of Christ, ch. 2, quest. 4.”

— Barthold Holtzfuz, ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 9-11 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7XVII.+The+ultimate+judgment+of+the+practical+intellect+is+indeed+a+condition+without+which+the+will+does+not+ordinarily+operate%3B+In+the+meantime%2C+however%2C+the+will+is+not+determined+by+the+practical+judgment+of+the+intellect.+Which%2C+against+the+Thomists+and+certain+of+the+Reformed%2C+to+whom+Bellarmine+accedes+here+in+bk.+3+of+On+Grace+%26+Free+Will%2C+ch.+8%2C+the+Scotists+and+others+rightly+deny%2C+who+teach+that+the+ultimate+judgment+of+the+practical+intellect+does+not+necessarily+determine+the+will%2C+for%3A+%281%29+Scripture+teaches+that+men+often+act%2C+or+choose+something+against+the+light+of+the+intellect%2C+or+the+dictate+of+right+reason+and+grace%2C+as+in%3A+Job+21%3A14%2C+%E2%80%98They+said+to+God%2C+depart+from+us%2C+we+do+not+want+the+knowledge+of+thy+ways.%E2%80%99+Ch.+24%3A13%2C+%E2%80%98They+were+rebellious+to+the+light.%E2%80%99+Lk.+12%3A47%2C+%E2%80%98The+servant+who+knew+the+will+of+his+Lord%2C+and+did+not+prepare+himself%2C+nor+did+according+to+his+will%2C+will+be+beaten+with+many+stripes.%E2%80%99+Jm.+4%3A17%2C+%E2%80%98To+him+who+knows+to+do+good+and+does+it+not%2C+to+him+it+is+sin.%E2%80%99+%282%29+Whence+they+are+damned+who+have+acted+against+the+dictate+of+the+intellect+or+of+right+reason.+Jn.+3%3A19%2C+%E2%80%98This+is+the+judgment%2C+because+men+loved+darkness+more+than+the+light%3A+for+their+works+were+evil.%E2%80%99+Rom.+2%3A1-2%2C+%E2%80%98Thou+art+inexcusable%2C+O+man%2C+whosoever+thou+art+that+judgest.+For+wherein+thou+judgest+another%2C+thou+condemnest+thyself%3A+for+thou+dost+the+same+things+which+thou+judgest.%E2%80%99+vv.+17-18+ff.%2C+%E2%80%98If+thou+art+called+a+Jew%2C+and+restest+in+the+law%2C+and+makest+thy+boast+of+God%2C+and+knowest+his+will%2C+and+approvest+the+more+profitable+things%2C+being+instructed+by+the+law%2C+art+confident+that+thou+thyself+art+a+guide+of+the+blind%2C+a+light+of+them+that+are+in+darkness%2C+an+instructor+of+the+foolish%2C+a+teacher+of+infants%2C+having+the+form+of+knowledge+and+of+truth+in+the+law.+Thou+therefore+that+teachest+another%2C+teachest+not+thyself%3F+thou+that+preachest+that+men+should+not+steal%2C+stealest%3F+Thou+that+sayest%2C+men+should+not+commit+adultery%2C+dost+thou+commit+adultery%3F+thou+that+abhorrest+idols%2C+dost+thou+commit+sacrilege%3F+Thou+that+makest+thy+boast+of+the+law%2C+by+transgression+of+the+law+dishonourest+God.%E2%80%99+Eze.+12%3A2%2C+%E2%80%98They+have+eyes+to+see%2C+and+see+not%3A+and+ears+to+hear%2C+and+hear+not%3A+for+they+are+a+provoking+house.%E2%80%99+cf.+Eze.+33%3A31-32%3B+Zech.+7%3A11-12%3B+Jer.+6%3A16-17%3B+Jn.+5%3A40%3B+ch.+8%3A46%3B+ch.+15%3A22%3B+Acts+7%3A51%3B+ch.+13%3A46%3B+Mt.+11%3A21.+%283%29+If+the+will+were+necessarily+determined+by+the+ultimate+judgment+of+the+practical+intellect%2C+it+would+follow+that+the+will+acts+not+freely+but+naturally.+%284%29+This+opinion+being+admitted%2C+the+will+would+not+be+an+active+faculty+that+moves+and+determines%2C+but+a+passive+one%2C+moved+and+determined%3B+which+should+rather+be+said+of+the+intellect.+%285%29+It+would+follow+that+the+will+could+never+prefer+a+lesser+good+to+a+greater+good%3B+and+%286%29+from+two+equal+goods+it+could+choose+neither.+But+experience+teaches+the+contrary.+%287%29+There+would+be+no+voluntary%2C+deliberate+sins+against+conscience%3B+against+the+passages+cited+in+n.+2%3B+for+to+sin+voluntarily+and+against+conscience+is+to+cry+out+against+the+ultimate+judgment+of+the+practical+intellect.+%288%29+There+would+be+no+blasphemy+against+the+Holy+Spirit%2C+against+Mt.+12%3A31-32%3B+Mk.+3%3A28-29%3B+Heb.+6%3A4-6%3B+10%3A29.+The+intellect+therefore+moves+the+will+indeed%2C+but+not+physically%2C+but+morally%2C+as+a+guide%2C+not+as+a+master%3B+and+the+will+depends+on+the+intellect%2C+but+not+as+from+an+effective+principle+of+volition%2C+but+as+from+a+condition+without+which+it+would+not+be.+In+agreement+are%3A+Peter+Molin%C3%A6us%2C+Enodatio+Gravissimarum+Quaestionum%2C+Tract+6%2C+quest.+2%2C+p.+192%3B+Ames%2C+On+Conscience+%26+its+Law+or+Cases%2C+bk.+1%2C+ch.+7%2C+%C2%A76-7%3B+Robert+Baron%2C+Metaphysica+Generalis%2C+sect.+12%2C+disp.+1%2C+n.+20%2C+29+ff.%2C+pp.+325%2C+335+ff.%3B+G.J.+Voss%2C+On+Idolatry%2C+%C2%A73%2C+ch.+43%3B+Dn.+D.+Samuel+Strimesius%2C+Praxiologia+Apodictica%2C+ch.+3%2C+subsect.+3%2C+art.+1%2C+%C2%A710+ff.%3B+Baxter%2C+Method+of+Theology%2C+pt.+1%2C+ch.+5%2C+n.+35-37%2C+p.+160%3B+ch.+8%2C+n.+106%2C+p.+208%3B+ch.+14%2C+n.+68-70%2C+pp.+276-77%3B+and+from+the+Cartesian+hypothesis%2C+Burmann%2C+Synopsis%2C+bk.+2%2C+ch.+11%2C+%C2%A75%3B+Wittich%2C+Pacific+Theology%2C+ch.+11%2C+%C2%A7126-27.+Compare+also+Hornejus%2C+Moral+Philosophy%2C+bk.+2%2C+ch.+5-6%2C+10+ff.%3B+and+from+the+Scholastics%2C+Suarez%2C+Metaphysical+Disputations%2C+19%2C+sect.+6%2C+n.+2%3B+Becanus%2C+Scholastic+Theology%2C+pt.+2%2C+tract+1%2C+ch.+2%2C+quest.+5%3B+Arriaga%2C+Disputations+on+Physics%2C+8%2C+sect.+2%3B+Fonseca%2C+etc.%3B+also+Boyvin%2C+Philosophy+of+Scotus%2C+pt.+4%2C+pt.+1%2C+disp.+2%2C+quest.+1+and+Theology+of+Scotus%2C+pt.+2%2C+Tract+on+the+Grace+of+Christ%2C+ch.+2%2C+quest.+4.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfuz%2C+%E2%80%98Theological+Dissertation+on+the+Free+Will+of+Man%E2%80%99+trans.+AI+by+Nosferatu+%28Frankfurt%3A+Zeitler%2C+1707%29%2C+pp.+9-11+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F775d6d6784.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/775d6d6784.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=XVII.%20The%20ultimate%20judgment%20of%20the,of%20Christ%2C%20ch.%202%2C%20quest.%204&amp;text=XVII.%20The%20ultimate%20judgment%20of%20the%20practical%20intellect&amp;text=the%20Grace%20of%20Christ%2C%20ch.%202%2C%20quest.%204" rel="noopener" target="_blank">Read it onl <blockquote><p>Moreover, what the orthodox fathers and the scholastics who followed their steps handed down very well was commonly known: namely that the natural gifts have been corrupted and the supernatural ones lost. So from this statement we establish that supernatural theology, which by the sin of man had been, as it were, rejected and most undeservedly spurned, retreated from here to the heavens; and natural theology, as all the other things which arise from nature, was corrupted. For how could it have remained uncorrupted in a subject that was corrupted in every part?</p></blockquote>

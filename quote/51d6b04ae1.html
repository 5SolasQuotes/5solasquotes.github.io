<main class="wrap"><figure class="quote" id="q-51d6b04ae1" data-kw="">
<blockquote><p>The fact is, that the doctrine of Development has to encounter a great historical difficulty, which it can only remove by an enormous assumption. The doctrine is, that Christ&#x27;s original revelation contained seeds and germs of truths destined, under the Divine guidance, to expand to a certain definite form. If this be true, that expansion would take place wherever these germs were planted. It does not depend on where a tree is planted, whether it springs up a cedar or a bramble-bush, or whether it brings forth figs or grapes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/apostolic-tradition.html">Apostolic tradition</a></span></div>

</figure><figure class="quote" id="q-8317e796d9" data-kw="">

<main class="wrap"><figure class="quote" id="q-2d6a3c152a" data-kw="">
<blockquote><p>Note, the rules of a strict discipline must not be made too strict, but so as to admit of a dispensation when the necessity of a case calls for it, which therefore, in making vows of that nature, it is wisdom to provide expressly for, that the way may be made the more clear, and we may not afterwards be forced to say, ‘It was an error,’ Eccl. 5:6. Commands of that nature are to be understood with such limitations. These Rechabites would have tempted God, and not trusted Him, if they had not used proper means for their own safety in a time of common calamity [which they did, Jer. 35:11], notwithstanding the law and custom of their family [Jer. 35:7-10].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, vv. 1-11</span></figcaption>

<blockquote><p>The Prelate [John Maxwell] objects out of Spalato, Arnisaeus and Hugo Grotius… All government and superiority in rulers is not primely and only for the subjects’ good; for some are by God and nature appointed for the mutual and inseparable good of the superior and inferior, as in the government of husband and wife, or father and son; and in herili dominio, in the government of a lord and his servant, the good and benefit of the servant is but secondary and consecutively intended, it is not the principal end, but the external and adventitious [end], as the gain that comes to a physician is not the proper and internal end of his art, but follows only from his practice of medicine.</p></blockquote>

<blockquote><p>It was no marvel therefore, although Chrysostom and others did fall sometimes into the commendation of the monkish and hermetic life. But their hermits and monks are so unlike the pope’s creatures… 1. For first… 4. Fourthly, there was permitted unto them care of wives, of family, and private possession, so that the same were moderate and not against the care of the soul: contrary to your laws, which thrust upon them the vow of wilful poverty.</p></blockquote>

</figure><figure class="quote" id="q-692c5a2f69" data-kw="">
<blockquote><p>Of three kinds of liberty, and how servitude is agreeable to the Law of Nature. But here it will further be demanded, whether servitude be agreeable to the Law of nature, and how it comes to pass, that the Lord suffered the Israelites being a free people, to be servants one unto another. For the deciding of this doubt, there is a threefold kind of liberty to be considered, a natural liberty, civil, and spiritual. 1. The natural liberty I call that, wherein Adam was created, being subdued to no bondage, neither spiritual of sin, nor corporal in any outward subjection to any creature: but as he had a freedom of will, and was made Lord of his affections within, that he needed not to have sinned, unless he would himself: so he had the dominion of the creatures given unto him. This original liberty of nature considered, servitude and bondage was brought in as a punishment of sin, and so is not simply, and of itself agreeable to the Law of nature. 2. But now since Adam’s fall, there is another kind of civil liberty, and civil servitude opposite unto it. Civil liberty is defined to be a natural faculty, for every man to do as himself likes. . . unless one be hindered by force or in right; for that is no true liberty for a man against right, to do what him likes . . . Now this servitude simply accords not with nature, as the Apostle says, If yet thou mayest be free, use it rather, 1 Cor. 7.21. showing that every one by nature desires liberty and freedom. But after a sort this servitude is agreeable to nature, not simply, or of itself, but as other punishments are said to be natural, as tending to the maintenance of society among men which is properly natural. And if it be objected, why since all men are fallen in Adam, and so brought into subjection, why all likewise become not servants: the answer is, that two things must be considered in this our corrupt state: the one is the Law of corruption, brought in by sin, the other the goodness of God: that although all men are subject by sin to the same bondage and corruption, yet the goodness of God qualifies that slavish condition of nature, as that some do enjoy an outward liberty and freedom: like as in the inward faculties of the soul, the Lord gives unto some more light of understanding, dexterity of wit, profoundness of judgement, and other natural gifts, than unto others. 3. The spiritual liberty is wrought in us by grace in Christ, which is from the subjection of sin, and malediction of the Law; that our conscience is no more terrified with slavish fear, but we are at peace with God: and beside, by this spiritual liberty, the faithful have restored unto them the dominion over all creatures: that though not in external possession, yet in a spiritual right, all things are theirs, whether the world, life, death, things present or things to come, 1 Cor. 3.22. and all things work to the best, to those that love God, Rom. 8.28. So these may very well stand together, external servitude, and spiritual freedom: it is possible for one to bee a freeman to God, and yet a servant in the world, and another to be a bondman to sin, and yet free in the world: for there are divers objects of these two kinds of liberty and bondage; the outward freedom respects this life and state, the free use of riches, and pleasures of this life: the spiritual and internal freedom hath set before it the salvation of the soul, the favor of God, and life eternal. Christian religion then overthrows not the diversity of degrees among men: But as Christ, though he were by his spiritual right, free from all taxes and impositions, yet lest he should offend, payed poll money, Matt. 17. so Christians, though they are made free by faith in the Son, yet for the maintenance of peace and love, and avoiding of offence, in disturbing the temporal State, they are bound as well as others, to be subject unto the powers of this world[.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum: that is, A Sixfold Commentary</cite>, … (London, 1633), on Ex. 21, Question 10</span></figcaption>

t+into+subjection%2C+why+all+likewise+become+not+servants%3A+the+answer+is%2C+that+two+things+must+be+considered+in+this+our+corrupt+state%3A+the+one+is+the+Law+of+corruption%2C+brought+in+by+sin%2C+the+other+the+goodness+of+God%3A+that+although+all+men+are+subject+by+sin+to+the+same+bondage+and+corruption%2C+yet+the+goodness+of+God+qualifies+that+slavish+condition+of+nature%2C+as+that+some+do+enjoy+an+outward+liberty+and+freedom%3A+like+as+in+the+inward+faculties+of+the+soul%2C+the+Lord+gives+unto+some+more+light+of+understanding%2C+dexterity+of+wit%2C+profoundness+of+judgement%2C+and+other+natural+gifts%2C+than+unto+others.+3.+The+spiritual+liberty+is+wrought+in+us+by+grace+in+Christ%2C+which+is+from+the+subjection+of+sin%2C+and+malediction+of+the+Law%3B+that+our+conscience+is+no+more+terrified+with+slavish+fear%2C+but+we+are+at+peace+with+God%3A+and+beside%2C+by+this+spiritual+liberty%2C+the+faithful+have+restored+unto+them+the+dominion+over+all+creatures%3A+that+though+not+in+external+possession%2C+yet+in+a+spiritual+right%2C+all+things+are+theirs%2C+whether+the+world%2C+life%2C+death%2C+things+present+or+things+to+come%2C+1+Cor.+3.22.+and+all+things+work+to+the+best%2C+to+those+that+love+God%2C+Rom.+8.28.+So+these+may+very+well+stand+together%2C+external+servitude%2C+and+spiritual+freedom%3A+it+is+possible+for+one+to+bee+a+freeman+to+God%2C+and+yet+a+servant+in+the+world%2C+and+another+to+be+a+bondman+to+sin%2C+and+yet+free+in+the+world%3A+for+there+are+divers+objects+of+these+two+kinds+of+liberty+and+bondage%3B+the+outward+freedom+respects+this+life+and+state%2C+the+free+use+of+riches%2C+and+pleasures+of+this+life%3A+the+spiritual+and+internal+freedom+hath+set+before+it+the+salvation+of+the+soul%2C+the+favor+of+God%2C+and+life+eternal.+Christian+religion+then+overthrows+not+the+diversity+of+degrees+among+men%3A+But+as+Christ%2C+though+he+were+by+his+spiritual+right%2C+free+from+all+taxes+and+impositions%2C+yet+lest+he+should+offend%2C+payed+poll+money%2C+Matt.+17.+so+Christians%2C+though+they+are+made+free+by+faith+in+the+Son%2C+yet+for+the+maintenance+of+peace+and+love%2C+and+avoiding+of+offence%2C+in+disturbing+the+temporal+State%2C+they+are+bound+as+well+as+others%2C+to+be+subject+unto+the+powers+of+this+world%5B.%5D%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+Hexapla+in+Genesin+%26+Exodum%E2%80%A6+%28London%2C+1633%29%2C+on+Ex.+21%2C+Question+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F692c5a2f69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/692c5a2f69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/slavery/#:~:text=Of%20three%20kinds%20of%20liberty%2C%20and,unto%20the%20powers%20of%20this%20world&amp;text=Of%20three%20kinds%20of%20liberty%2C%20and%20how%20servitude&amp;text=be%20subject%20unto%20the%20powers%20of%20this%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XVIII. The natural law cannot be said to have undergone a change… XIX. Nor by the introduction of slavery; while before, by the primeval law [Gen. 1], all were free. They were not otherwise free than inasmuch as they were free from criminality. When this entered [with the Fall of Adam], slavery passed upon all. For he who assails another’s liberty deservedly loses his own. Nor if the law of nature makes all men equal with regard to nature does it follow that they are equal with regard to qualities and external condition.</p></blockquote>

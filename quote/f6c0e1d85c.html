<main class="wrap"><figure class="quote" id="q-f6c0e1d85c" data-kw="">
<blockquote><p>VIII. It belongs to man, then, to deviate from the divine law, yet not to all men: for infants, although on account of the covenant breaking committed in Adam (Rom. 5:12) they are devoid of the original righteousness which from the law of their own rational nature they are bound to have, and therefore are imbued with original sin, yet because they do not have a law prescribed for them, according to which they should order their actions, they do not commit actual sin (Rom. 5:14), for which reason they in this respect called innocent (Ps. 106:38), inasmuch as they cannot discern between their right hand and their left hand (Jonah 4:11), and thus neither can discern the law of God. But to adolescents and to adults, to all with the exception of Christ. Accordingly, adolescents are subject to actual sin, as soon as they are so endowed with reason that they can distinguish what is commanded from what is prohibited; but at what year of age this happens is difficult to determine, because wickedness in many makes up for the deficiency of age. Then also adults, inasmuch as there belongs to them preeminently that verse, “It has been shown you, O man, what is good” (Mic. 6:8); but all adults (1 Kings 8:46; Ps. 14:3; Eccl. 7:20), even the regenerate (Ps. 130:3; 143:2, 10; Matt. 6:12); indeed, even the blessed virgin herself (John 2:4) with the exception only of the Savior, who knew no sin (2 Cor. 5:21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 8, p. 493</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27682b7137" data-kw="">
<blockquote><p>It is not very just to chastise men for the offenses of their natural ancestors, but to take the fiction of ancestry in a corporate succession as a ground for punishing men who have no relation to guilty acts, except in names and general descriptions, is a sort of refinement in injustice belonging to the philosophy of this enlightened age… [they punish] men, many, if not most, of whom abhor the violent conduct of… former times as much as their present persecutors can do, and who would be as loud and as strong in the expression of that sense, if they were not well aware of the purposes for which all this declamation is employed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reflections on the Revolution in France</cite>, … (1790)</span></figcaption>

</figure><figure class="quote" id="q-60059685a9" data-kw="">
<blockquote><p>However, from the fact that the apostle assigns death to consummated sin, the Romanists wrongly infer that non-consummated sin is not worthy of death, but only of temporal punishments, that is, so that they may hold to venial sin, and from that, their purgatory. They attend too little to the fact that the apostle does not say that only sin consummated by the full consent of the will gives birth to death, since elsewhere Paul assigns death to concupiscence (Rom. 7:5), namely that concupiscence which he did not know was sin (v. 7). Accordingly, he intends only that consummated sin gives birth preeminently to death, insofar as it includes two degrees of sin, internal as well as external.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’ | section 2, pp. 490-91</span></figcaption>

</figure><figure class="quote" id="q-f28ca9d143" data-kw="">
<blockquote><p>1. Men enter and initiate themselves in a vicious practice by smaller sins. Heinous sins are too alarming for the conscience of a young sinner; and therefore he only ventures upon such as are smaller, at first. Every particular kind of vice creeps in this gradual manner.

2. Having once begun in the ways of sin, he ventures upon something greater and more daring. His courage grows with his experience. Now, sins of a deeper die do not look so frightful as before. Custom makes everything familiar. No person who once breaks over the limits of a clear conscience knows where he shall stop.

3. Open sins soon throw a man into the hands of ungodly companions. Open sins determine his character, and give him a place with the ungodly. He shuns the society of good men, because their presence is a restraint, and their example a reproof to him. There are none with whom he can associate but the ungodly.

4. In the next stage, the sinner begins to feel the force of habit and inveterate custom; he becomes rooted and settled in an evil way.—Those who have been long habituated to any sin, how hopeless is their reform! One single act of sin seems nothing; but one after another imperceptibly strengthens the disposition, and enslaves the unhappy criminal beyond the hope of recovery.

5. The next stage in a sinner’s course is to lose the sense of shame, and sin boldly and openly. So long as shame remains, it is a great drawback. But it is an evidence of an uncommon height of impiety, when natural shame is gone.

6. Another stage in the sinner’s progress is to harden himself so far as to sin without remorse of conscience. The frequent repetition of sins stupefies the conscience. They, as it were, weary it out, and drive it to despair. It ceases all its reproofs, and, like a frequently discouraged friend, suffers the infatuated sinner to take his course. And hence, 7. Hardened sinners often come to boast and glory in their wickedness. It is something to be beyond shame; but it is still more to glory in wickedness, and esteem it honorable. Glorious ambition indeed! 8. Not content with being wicked themselves, they use all their arts and influence to make others wicked also. They are zealous in sinning, and industrious in the promotion of the infernal cause.—They extinguish the fear of God in others, and laugh down their own conscientious scruples. And now, 9. To close the scene, those who have thus far hardened themselves, are given up by God to judicial blindness of mind and hardness of heart. They are marked out as vessels of wrath fitted to destruction. This is the consequence of their obstinacy. They are devoted the judgment they deserve. Reader! view it with terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evangelical Guardian</cite>, 4.10 (February 1847), pp. 461-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

</figure><figure class="quote" id="q-143f18ee47" data-kw="">
<blockquote><p>Once more, it is named, &quot;lust&quot; or &quot;concupiscence&quot;; which is sin itself, and the mother of all sin; it consists of various branches, called fleshly lusts, and worldly lusts, the lust of the flesh, the lust of the eyes, and the pride of life (Romans 7:7; Jam. 1:15; 1 John 2:15).</p></blockquote>

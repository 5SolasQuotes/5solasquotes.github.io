<main class="wrap"><figure class="quote" id="q-5d867ad12d" data-kw="">
<blockquote><p>Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons, but must make conscience of it that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13], to obey the human ordinances of men in authority; from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances and that we be careful not to offend private men in free ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London, 1637), on 1 Tim. 2:13, pp. 436–37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-78607ed934" data-kw="">
<blockquote><p>Yet if the miscarriage be so great in the [authorities’] ordering even of these circumstances or in the manner of duties, as shall overthrow the duty itself and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey… then… we are not bound to follow… in such a case, but otherwise we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), 5th Disputation, ch. 12,; p. 461</span></figcaption>

</figure><figure class="quote" id="q-d7a94b00e0" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the Magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15. (Circumcision was a burden, Acts 15:10, and these burthens were necessary things, v. 28, and they were said to do well if they observe them, v. 29.) And Moses may make an ordinance about the use of a bill of divorcement, which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things, and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God, except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London, 1637), on 1 Tim. 2:13, pp. 434-35</span></figcaption>

</figure><figure class="quote" id="q-de25237a54" data-kw="">
<blockquote><p>…we most heartily wish any disease of this Church to be timeously prevented and cured. But withal we wish this to be done without a rupture, and such a dangerous division… which in itself is a sore disease, and from which in holy Scripture we are often and very earnestly dehorted. Dionysius [†264], Bishop of Alexandria, in his epistle to Novatus, recorded by Eusebius, Histories, bk. 6, ch. 45, worthily says: ‘You ought rather to have suffered anything whatsoever for avoiding of cutting asunder the Kirk of God: and martyrdom for keeping the Kirk from schism is no less glorious than which is suffered for not committing idolatry. And in my opinion also it is greater: for in suffering martyrdom for not committing idolatry, a man suffers for one, even for his own soul; but here a man suffers martyrdom for the whole Kirk.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-aberdeen-doctors.html">Scottish Aberdeen Doctors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duplies of the Ministers &amp; Professors of Aberdeen to Second Answers of some Reverend Brethren, concerning the Late</cite>, [National] Covenant (Aberdeen: Raban, 1638), “First Duply”, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

 Online</a></div>
</figure><figure class="quote" id="q-c5e83ac39d" data-kw="">
<blockquote><p>The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member… Much more must the temporal commodity of single men give place to the churches’ welfare (which will not stand with disorder)… If you plead inconveniencies to them: Remember then it is no matter of conscience, but of worldly commodity: and may not I set the general good of the churches against any man’s commodity?</p></blockquote>

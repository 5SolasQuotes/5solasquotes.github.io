<main class="wrap"><figure class="quote" id="q-0fbb204596" data-kw="">
<blockquote><p>The fundamental principle that lies at the basis of the whole argument is this, that in regard to the ordinance of public worship it is the province of God, and not the province of man, to determine both the terms and the manner of such worship.

The sinner has no right to dictate, but must submissively learn from God both the conditions and the manner in which God will permit his approach for the purpose even of worshipping Him. The path of approach to God was shut and barred in consequence of man’s sin: it was impossible for man himself to renew the intercourse which had been so solemnly closed by the judicial sentence which excluded him from the presence and favour of his God. Could that path ever again be opened up, and the communion of God with man and of man with God ever again be renewed? This was a question for God alone to determine.

If it could, on what terms was the renewal of intercourse to take place, and in what manner was the fellowship of the creature with his Creator again to be maintained? This, too, was a question no less than the former for God alone to resolve. The sinner could not, from the very nature of the case, presume to dictate to God either the conditions on which his intercourse with God ought to be once more allowed, or the manner in which it might rightly and properly be continued. These were questions which could only be determined by a regard to the principles of God’s moral government, and which none but God was competent to decide.

Public worship is no other than the manner and the way in which sinners, associated together in a Church state, are permitted in their collective capacity to hold intercourse with God, to maintain in a right and befitting way their fellowship with Him, and to approach Him day by day in acceptable communion. The manner of such intercourse, as well as the conditions on which it was possible to renew it at all, is a matter in regard to which it was the province of God, and not of man, to dictate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 340-41.</span></figcaption>

<blockquote><p>…suppose the 〈◊〉 of churches in a city meet at nine of the clock for God’s 〈◊〉, and in the country parishes adjoining, where many people live at a great distance from their churches, they meet at ten or half an hour after nine, nay in the same church at one and the same time [as they have feed animals, etc. and can’t leave sooner], whilst the Word of God is read or preached, those that sit in seats may have their heads uncovered, and those that stand in allies may keep on their hats the whole sermon〈◊〉, because the crowd or throng may render it inconvenient to keep them off. Now in both these instances there is not uniformity in the same circumstances, and yet there may be order observed, and confusion may very well, notwithstanding, be avoided in all the parts of God’s worship and service.</p></blockquote>

<blockquote><p>[Error:] To cry down the very being and use of these external ordinances as being but forms, and the spiritual frame of the heart is made all in all. Thus there are blasphemous heretics that cry down the sacraments, the ministry, yea, the Scripture itself, yea Christ Himself, as being but forms, and we ought to have communion with God immediately. But it is elsewhere to be showed that Christ has appointed an external form of communion in his Church, which consists in reading, and preaching of the Word, administration and receiving of sacraments, prayer, and Church-government and censures, with a ministry from Him, all which are of a perpetual institution for the substantials of them, and to cry down these forms which God has appointed as means to beget and increase grace, which are in the gracious use of them a solemn acknowledging and owning of God, is a Beelzebub error as I may so say and a false doctrine in the first magnitude: we are therefore to sail between these extremes neither resting upon externals in religion, as enough without Christ and regeneration, or on the contrary abolishing and neglecting the use of them.</p></blockquote>

<blockquote><p>If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... ([Leiden] 1637), | pt. 4, ‘Against the Indifferency of the Ceremonies’ | ch. 3, ‘Whether There be Anything Indifferent In Actu Exercito [In the Exercised Act]?’ No., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.”

— George Gillespie, A Dispute Against the English-Popish Ceremonies, ... ([Leiden] 1637), | pt. 4, ‘Against the Indifferency of the Ceremonies’ | ch. 3, ‘Whether There be Anything Indifferent In Actu Exercito [In the Exercised Act]?’ No., p. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+it+be+said+that+the+best+man+who+lives+ties+not+himself+to+these+rules%2C+in+the+use+of+every+indifferent+thing%2C+but+oftimes+uses+or+omits+a+thing+of+that+nature+at+his+own+pleasure.+I+answer%3A+In+many+things+we+offend+all.+And+who+can+understand+his+errors%3F+But+in+the+mean+time%2C+the+rules+of+the+Word+limit+us+so+strictly+that+we+may+never+use+a+thing+in+its+own+nature+indifferent+at+our+arbitrament+and+pleasure%2C+and+that+the+use+of+it+is+never+lawful+to+us+except+it+be+done+piously+for+God%E2%80%99s+glory%2C+profitably+for+man%E2%80%99s+edification+and+purely+with+full+assurance+that+that+which+we+do+is+approved+of+God.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Dispute+Against+the+English-Popish+Ceremonies%2C+...+%28%5BLeiden%5D+1637%29%2C+%7C+pt.+4%2C+%E2%80%98Against+the+Indifferency+of+the+Ceremonies%E2%80%99+%7C+ch.+3%2C+%E2%80%98Whether+There+be+Anything+Indifferent+In+Actu+Exercito+%5BIn+the+Exercised+Act%5D%3F%E2%80%99+No.%2C+p.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F09b3b03b78.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/09b3b03b78.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-things-indifferent-adiaphora/#:~:text=If%20it%20be%20said%20that%20the,we%20do%20is%20approved%20of%20God&amp;text=If%20it%20be%20said%20that%20the%20best%20man&amp;text=that%20which%20we%20do%20is%20approved%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

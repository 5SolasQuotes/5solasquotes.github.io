<blockquote><p>4. Christ to provide for his flock has taken another course than to authorize bishops and pastors [which Corbet takes to be one office] to do their work by delegates, namely, to command the ordaining of more bishops or elders as need requires. … But I do not question, but a bishop may have an assistant or assistants of his own order, either occasionally in case of present disability or justifiable avocation; or statedly when the flock that is under his personal oversight requires more work than one man can do. And then the said assistants are not his vicars, but colleagues, performing each of them their own part in the work and service of their Lord Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>§5. ‘Of the Delegation of Spiritual Power’ in The Remains… (d. 1680; London: Parkhurst, 1684), ‘Of the Ministry’</cite>, pp. 41-42</span></figcaption>

<blockquote><p>Diverse resolve that text [Rom. 12:6-7] thus, that first the apostle makes a general division of ecclesiastical offices, ‘prophesy’, comprehending these that labour in the Word and doctrine; ‘ministry’ comprehending those that labor not in the Word and doctrine… Ministry, he subdivides into the office of the ruling elder, deacon, and the other of showing mercy, which was committed sometimes to old men, sometimes to widows.</p></blockquote>

</figure><figure class="quote" id="q-8501f6da9f" data-kw="">
<blockquote><p>The sense is, not that judgment shall not pass against him but by such a number of witnesses, or that the evidence upon his trial shall consist of such a number; for this is no other than what ought to be in the case of a private member, and of every man, according to Deuteronomy 19:15. But the sense is, that the affair of an elder shall not be put upon a trial, much less sentence pass, until it has been privately proved against him, by proper testimonies, beyond all exception; only in such a case, should a church admit a charge against its elder. The reason of this rule is, because of his high office and the honour of the church, which is concerned in his, as well as of religion; for it carries in it some degree of scandal for such a person to be charged, even though he may be cleared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Tim.</cite>, 5:19</span></figcaption>

</figure><figure class="quote" id="q-2d7bd346a7" data-kw="">
<blockquote><p>Notwithstanding of all the multiplicity of Popish orders, yet Peter Lombard (pt. 4, distinction 4) treading the vestiges of the primitive simplicity, did observe that the apostles left only two sacred orders to be perpetual in the Church, the order of deacons and the order of elders. The administration of deacons is exercised about things bodily. The administration of elders about things spiritual. The former about the goods: the latter about the government of the Church. Now elders are of three sorts: 1. Preaching Elders, or Pastors, 2. Teaching Elders or Doctors, 3. Ruling Elders. All these are elders, because they have voice in presbyteries and all assemblies of the Church, and the government of the Church is incumbent to them all: nor only to the pastor and elder, but to the doctor also. The bishop of Dune, in his Examen conjurationis Scoticae [‘Examination of the Scottish Conjuration’], p. 35, alleges that our Church of Scotland did never yet determine whether doctors and deacons have right of voicing in the consistories and assemblies of the Church. But had he read our book of Policy, he might have found that it excludes deacons from being members of presbyteries and assemblies, ch. 8, but admits doctors into the same, ch. 5. The doctor being an elder, as said is, should assist the pastor in the government of the Kirk and concur with the elders, his brethren, in all assemblies, by reason the interpretation of the Word, which is [the] only judge in ecclesiastical matters, is committed to his charge. But they differ in that the pastor labors in the Word of exhortation, that is, by the gift of wisdom, applies the Word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labours in the Word of doctrine, that is, without such applications as the pastor uses, by simple teaching he preserves the truth and sound interpretation of the Scriptures against all heresy and error. The ruling elder does neither of these, but labours in the government and policy of the Church only. The apostle has distinguished these three sorts of elders, 1 Tim. 5:17, ‘Let elders that rule well be counted worthy of double honour, especially they who labour in the Word and doctrine,’ where, as Beza notes, he distinguishes the Word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7-8, he distinguishes teaching from exhortation: and 1 Cor. 12:8 puts the Word of wisdom and the word of knowledge for two different things. Now beside those elders which labour in the Word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the Word nor doctrine, but in ruling well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geroge-gillespie.html">Geroge Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders…. (Edinburgh: Bryson, 1641), ch. 2</cite>, pp. 8-10</span></figcaption>

d+that+in+season+and+out+of+season%2C+as+he+knows+their+particular+cases+to+require.+The+doctor+labours+in+the+Word+of+doctrine%2C+that+is%2C+without+such+applications+as+the+pastor+uses%2C+by+simple+teaching+he+preserves+the+truth+and+sound+interpretation+of+the+Scriptures+against+all+heresy+and+error.+The+ruling+elder+does+neither+of+these%2C+but+labours+in+the+government+and+policy+of+the+Church+only.+The+apostle+has+distinguished+these+three+sorts+of+elders%2C+1+Tim.+5%3A17%2C+%E2%80%98Let+elders+that+rule+well+be+counted+worthy+of+double+honour%2C+especially+they+who+labour+in+the+Word+and+doctrine%2C%E2%80%99+where%2C+as+Beza+notes%2C+he+distinguishes+the+Word%2C+which+is+the+pastor%E2%80%99s+part%2C+from+doctrine%2C+which+is+the+doctor%E2%80%99s+part.+Even+as+Rom.+12%3A7-8%2C+he+distinguishes+teaching+from+exhortation%3A+and+1+Cor.+12%3A8+puts+the+Word+of+wisdom+and+the+word+of+knowledge+for+two+different+things.+Now+beside+those+elders+which+labour+in+the+Word%2C+and+those+which+labor+in+doctrine%2C+Paul+speaks+to+Timothy+of+a+third+sort+of+elders%2C+which+labor+neither+in+the+Word+nor+doctrine%2C+but+in+ruling+well.%E2%80%9D%0A%0A%E2%80%94+Geroge+Gillespie%2C+An+Assertion+of+the+Government+of+the+Church+of+Scotland+in+the+Points+of+Ruling-Elders%E2%80%A6.+%28Edinburgh%3A+Bryson%2C+1641%29%2C+ch.+2%2C+pp.+8-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d7bd346a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d7bd346a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/teachers/#:~:text=Notwithstanding%20of%20all%20the%20multiplicity%20of,nor%20doctrine%2C%20but%20in%20ruling%20well&amp;text=Notwithstanding%20of%20all%20the%20multiplicity%20of%20Popish%20orders&amp;text=the%20Word%20nor%20doctrine%2C%20but%20in%20ruling%20well" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

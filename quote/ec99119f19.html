<main class="wrap"><figure class="quote" id="q-ec99119f19" data-kw="Depravity" data-pol="">
<blockquote><p>We hold that all human desires are evil, and we charge them with sin not in as far as they are natural, but because they are inordinate, and inordinate because nothing pure and upright can proceed from a corrupt and polluted nature.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.12</figcaption>

<main class="wrap"><figure class="quote" id="q-af4ea12f82" data-kw="">
<blockquote><p>Augustine: … First of all, I think there should be a discussion whether a charging enemy or a murderer attacking from ambush may be killed without lust, but for the sake of one’s life, freedom, or chastity.

Evodius: How can I think that people are free of lust if they fight ferociously for things that can be lost against their will? On the other hand, if such things cannot be lost, what need is there to resort to killing someone for their sake?

Augustine: Therefore, the law is unjust which grants permission (a) to a traveller to kill a highway robber, so as not to be killed himself; (b) to any man or woman to slay a rapist in his onslaught, if possible, before enduring rape. Indeed, the law bids a soldier to kill the enemy, and if he holds back from this bloodshed he pays the penalties from his commander. Surely we will not dream of calling these laws unjust – or rather, not to call them “laws” at all, for a law that is not just does not seem to me to be a law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Free Choice of the Will</cite>, (c. 387-95), ed. and trans. Peter King (Cambridge: Cambridge University Press, 2010), 1.5.11.32-33.</span></figcaption>

<blockquote><p>For the priesthood being changed, of necessity there is also a change of the law. (Hebrews 7:12)

When preaching on the above text (around the time of the Westminster Assembly) William Gouge, the important Westminster divine, gave the following directions for making sense of the Mosaic judicials (hence, this is an important source for understanding Westminster Confession 19:4-5):

Sec. 69. Of the judicial law of the Jews.

Besides the ceremonial law, the Jews had a judicial law, proper and peculiar to that polity. This law concerned especially their civil estate. Many branches of that law appertained to the Jewish priesthood; as, the particular laws about the cities of refuge, wither such as slew any unawares fled, and there abode till the death of the high priest, Num. xxxv. 25. And laws about lepers, which the priest was to judge, Lev. xiv. 3. And sundry other cases which the priest was to judge of, Deut. xvii. 9. So also the laws of distinguishing tribes, Num. xxxvi. 7; of reserving inheritances to special tribes and families, of selling them to the next of kin, Ruth iv. 4; of raising seed to a brother that died without issue, Gen. xxxviii. 8, 9; of all manner of freedoms at the year of jubilee, Lev. xxv. 13, &amp;c.

There were other branches of the judicial law which rested upon common equity, and were means of keeping the moral law: as putting to death idolaters and such as enticed others thereunto; and witches, and wilful murderers, and other notorious malefactors. So likewise laws against incest and incestuous marriages; laws of reverencing and obeying superiors and governors; and of dealing justly in borrowing, restoring, buying, selling, and all manner of contracts, Exod. xxii. 20; Deut. xiii. 9; Exod. xx. 18; Num. xxxv. 30; Lev. xx. 11, &amp;c., xix. 32, 35.

The former sort were abolished together with the priesthood.

The latter remain as good directions to order even Christian polities accordingly.

1. By these kinds of laws the wisdom of God was manifested in observing what was fit for the particular kind and condition of people; and in giving them answerable laws, and yet not tying all nations and states thereunto.

2. That liberty which God affordeth to others to have laws most agreeable to their own country, so as they be not contrary to equity and piety, bindeth them more obediently to submit themselves to their own wholesome laws, and to keep peace, unity, and amity among themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary on the whole epistle of the Hebrews. Being the substance of thirty years’ Wednesday’s lectures at Blackfriars,</cite>, London (1655; 3 vols, Edinburgh, 1866), 2: 123.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

rrowing%2C+restoring%2C+buying%2C+selling%2C+and+all+manner+of+contracts%2C+Exod.+xxii.+20%3B+Deut.+xiii.+9%3B+Exod.+xx.+18%3B+Num.+xxxv.+30%3B+Lev.+xx.+11%2C+%26c.%2C+xix.+32%2C+35.%0A%0AThe+former+sort+were+abolished+together+with+the+priesthood.%0A%0AThe+latter+remain+as+good+directions+to+order+even+Christian+polities+accordingly.%0A%0A1.+By+these+kinds+of+laws+the+wisdom+of+God+was+manifested+in+observing+what+was+fit+for+the+particular+kind+and+condition+of+people%3B+and+in+giving+them+answerable+laws%2C+and+yet+not+tying+all+nations+and+states+thereunto.%0A%0A2.+That+liberty+which+God+affordeth+to+others+to+have+laws+most+agreeable+to+their+own+country%2C+so+as+they+be+not+contrary+to+equity+and+piety%2C+bindeth+them+more+obediently+to+submit+themselves+to+their+own+wholesome+laws%2C+and+to+keep+peace%2C+unity%2C+and+amity+among+themselves.%E2%80%9D%0A%0A%E2%80%94+William+Gouge%2C+A+commentary+on+the+whole+epistle+of+the+Hebrews.+Being+the+substance+of+thirty+years%E2%80%99+Wednesday%E2%80%99s+lectures+at+Blackfriars%2C%2C+London+%281655%3B+3+vols%2C+Edinburgh%2C+1866%29%2C+2%3A+123.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3bcbfcc230.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3bcbfcc230.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/11/12/william-gouge-on-the-judicial-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

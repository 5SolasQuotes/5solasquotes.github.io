<main class="wrap"><figure class="quote" id="q-bcb367c1ba" data-kw="">
<blockquote><p>Verse 16. ‘Thine eyes did see my substance yet being unperfect,’ etc.] That is, so soon as ever I was conceived, whilst I was yet an imperfect embryo: and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them; that is, all those members of my body, which in continuance of time grew to have their perfect shape, were as clearly seen by thee, even when as yet there was none of them that had their shape and proportion, as those things are seen by men…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

0our%20Savior,the%20work%20of%20the%20Holy%20Spirit&amp;text=the%20body%20of%20Christ%20our%20Savior%20did%20not&amp;text=power%20and%20the%20work%20of%20the%20Holy%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(1)… Even if conception be contravened in certain instances, this is not necessarily contra-acting the design of one’s faculty and intention for procreation generally. (2) Numerous counter-examples prove Feser’s syllogism invalid, including counter-acting chosen bodily functions for some greater good. … (4) Feser’s (right) allowance for destroying and surgically removing one’s organs for a higher good, from the greater to the lesser, allows contra-acting them in the realization of their natural ends, which hence is not inherently wrong. (5) Sexual pleasure is directly subordinate to marital unity, which unity is more foundational than procreation, per the Word; hence sexual pleasure need not always be subordinate to conception or procreation. This ought to be recognized, and is by most, from nature’s light. … (7) Conception and all relating to it, including its rate, was cursed by God for man’s sin, and is so far not a standard to us… (8) Human flourishing is a greater and more foundational natural, teleological purpose and good than sex organs and contra-acting them in some way. Hence, so contra-acting, which is not inherently wrong, is right when it results in greater human flourishing, which could not occur (or would not best occur) except through this means… … (10) Aiming at a higher good and partially fulfilling it so far as one morally can (though it necessarily involve a partial counter-acting of an essential, facultative end) is good and is not an immoral deficiency. (11) God has provided through nature both natural and artificial contraceptive means, which most of history has recognized (whether giving Him thanks for it or not, Rom. 1:21). God set Adam in the garden to improve even pure-nature itself. (12) The further principles inherent in reality, as elucidated in this article, go much further to synthesizing and explaining the ethical balance of the gradations of our variegated circumstances in common life, which is much preferable, that one’s ethics reflect reality, in contrast to the anti-contraception view, which herein is seen to be extreme, and thus distorted and unnatural. (13) Feser’s syllogism, while true for God, yet, it appears, cannot account for: (1) how simultaneous natural and positive laws differently bear upon man, (2) temptation or (3) self-denial, (4) including with respect to our Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture</cite>, (RBO, 2025) | Fentiman delves into natural law in arguing the opposite, with 13 counter-arguments to Feser’s main argument. One counter-example (amongst many others) Fentiman uses against Feser’s syllogism is choosing to use artificial pain relievers: they contra-act an essential (and very important) end of one’s natural faculty for the greater good of the flourishing of the person, as nearly everyone (rightly) accepts. Here are some of Fentiman’s summary conclusions:</span></figcaption>

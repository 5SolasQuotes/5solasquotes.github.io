<main class="wrap"><figure class="quote" id="q-5a23c6a00a" data-kw="">
<blockquote><p>[T]he name of God doth signify whatsoever proprieties of perfection, attributes or virtues, God hath revealed and declared in his word concerning his essence, his will, and his works: as that he is wise, just, great, terrible, good, gentle, merciful, patient, penitent, jealous, visiting iniquity, and such like.

The Jews because they will not pronounce the name Jehovah, in stead thereof use Shem. Thence the Caldie paraphrase for God himself, putteth Shem and Hashem, a name, Gen. 10.9. for the virtues or perfections of God, are the very essence of God. Now that name of God cannot be hallowed by any addition, infusion, access, or increase of holiness: as it is written of us, He that is holy, let him be more holy, Apoc. 22.11. for it is holy in it self, that is, severed and exempt from, excelling and exceeding all other common and profane things in purity and holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>‘with her head uncovered’. It may seem strange from whom the Corinthian women should take up this custom, since the Jewish women were not allowed to go into the streets, or into any open and public place, unveiled (Maimonides, Hilch. Ishot, ch. 24, sect. 12). It was a Jewish law, that they should go out nowhere bare-headed (Babylonian Talmud, Cethubot, fol. 72. 1): yea, it was reckoned scandalous and ignominious to do so. Hence it is said, שגלוי הראש גנאי להם, “that uncovering of the head is a reproach” to the daughters of Israel (Rabbi Solomon Jarchi on Numb. 5:19)… So that there it should seem that these Corinthians followed the examples of the heathens: but then, though it might be the custom of some nations for women to go abroad bare headed; yet at their solemnities, where and when they were admitted, for they were not everywhere and always, they used to attend with their heads veiled and covered (Alex., ab Alex. Genial. Dier., bk. 4, ch. 17)… ‘for that is even all one as if she were shaven’; to be without a veil, or some sort of covering on her head, according to the custom of the country, is the same thing as if her head was shaved;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11</cite>, v. 5</span></figcaption>

</figure><figure class="quote" id="q-27e7cc0633" data-kw="">
<blockquote><p>The question is not whether reason is the instrument by which or the medium through which we can be drawn to faith. For we acknowledge that reason can be both: the former indeed always and everywhere; the later with regard to presupposed articles. Rather the question is whether it is the first principle from which the doctrines of faith are proved; or the foundation upon which they are built, so that we must hold to be false in things of faith what the nature light or human reason cannot comprehend. This we deny. . . . If reason is the principle of faith, then first it would follow that all religion is natural and demonstrable by natural reason and natural light. Thus nature and grace, natural and supernatural revelation would be confounded. . . . A ministerial and organic relation is quite different from a principial and despotic. . . . We must observe the distinction between an instrument of faith and the foundation of faith. . . . The Lutherans falsely object to us that we hold reason to be the principle and rule of demonstration in controversies because we sometimes draw arguments from reason, and argue from reason against the ubiquity of Christ’s body. For we assign to reason only a ministerial and instrumental, not a principal office. And if, in compound questions, we use reason for the purpose of proof, it bears the relation not of a principle but of means from which theologian argues; and the are not with us primary arguments, but only secondary and auxiliary forces. Besides, while theologian uses arguments drawn from reason, he does it rather as a philosopher rather than as a theologian. As to the ubiquity of the body of Christ, we reject this doctrine both philosophically and theologically, because it is absurd and contradicts the first principles of theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.8.4, 5, 6, 24</span></figcaption>

</figure><figure class="quote" id="q-3e0815db23" data-kw="">
<blockquote><p>And yet by all this which hath been spoken, we do not go about so to disable natural reason, as to leave it no room at all in matters of supernatural assent. For though nature alone be not able to comprehend grace, yet grace is able to use nature: and being in itself a spiritual eye-salve, when it hath healed and rectified reason, it then applieth it as an instrument more exactly to discover the connexion and mutual consequences and joinings of spiritual doctrines together.

Besides, thus much vigour we may safely attribute to natural reason alone, that by the force of such premises as itself can frame, the falseness, vanity, and insufficiency unto human happiness of all other religions or doctrines which are not Christian, may, by a wise man, be evidently discovered. Neither have there been wanting, amongst infidels and idolaters, men of more generous, piercing, and impartial judgements, who have made bold to confess the vanity of that polytheism and corrupt worship which was amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 145-46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

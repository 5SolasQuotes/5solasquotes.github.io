<main class="wrap"><figure class="quote" id="q-9f457c32af" data-kw="">
<blockquote><p>As to the charge of schism, they,” viz. the Assembly’s committee, “admit that difference in judgment in some particular points is no schism, nor does an inconformity to some things enjoined deserve that name; but our Brethren” (says that committee) “desire further to set up separate communions, which is a manifest rupture of our societies into others, and is therefore a schism in the body: This is setting up altar against altar, allowing our Churches to be true Churches, as the Independents do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f4347ee5eb" data-kw="">
<blockquote><p>The most that these [particular] arguments of our [separatist] Brethren do prove, is but that it is lawful to go, and dwell in a congregation where Christ is worshiped in all his ordinances, rather than to remain in that congregation where He is not worshipped in all his ordinances and where the Church censures are neglected, which to us is no separation from the visible Church, but [only] a removal from one part of the visible Church to another, as he separates not out of the house, who removes from the gallery, to remain and lie and eat in the chamber of the same house, because the gallery is cold and smokey, and the chamber not so, for he has not made a vow never to set his foot in the gallery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 1, ch. 4, section 4, question 5, p. 73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-28a183f89f" data-kw="">
<blockquote><p>These differences were a sad trial and temptation to the Church, and occasioned many sad animosities and alienations in affection both amongst ministers and people, obstructed greatly the power of godliness and edification amongst all, and did beget much prejudice, envy and emulation, that many looked more at their own image in others than the image of God in them, and accordingly rejected them; which always falls in in differences amongst the godly. But after king Charles in the 1660 returned from his exile, then their eyes were opened to see the evil of division, etc.</p></blockquote>

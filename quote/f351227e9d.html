<main class="wrap"><figure class="quote" id="q-f351227e9d" data-kw="">
<blockquote><p>Another reason which may be briefly mentioned for the fact that the atoning death of Jesus is a ground of prayer lies in the consideration that it properly merits a hearing for the petitions of those who trust in Him. The co-presence of His divine nature with His human rendered His sacrifice of Himself infinitely valuable and meritorious. He through the eternal Spirit, says the apostle, offered Himself without spot to God. His divine nature was the altar which sustained the gift of His human nature and sanctified it to the great end for which it was sacrificed. The prayers of the believer, though worthless in themselves, are, when laid upon the sacrifice of Christ, sanctified by the same altar. The infinite merits of the atonement of Jesus impart worth and dignity to his petitions, purchase for them audience with God, and lend them their own rich perfume as they ascend before the throne of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grounds of Prayer in George A. Blackburn (ed.), Sermons by Rev. John L. Girardeau, D.D., LL.D., Late Professor in the Theological Seminary, Columbia, S.C.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26878d10ee" data-kw="">
<blockquote><p>There follows the other part of the disputation on merit, in which we must discuss “what and how many conditions are necessary for a work to be called truly and properly meritorious of eternal happiness.” … Seven conditions in all seem to be required, three of which are granted by all, while the other four are in controversy. The first condition is that it be a good work. For evil works do indeed merit, but punishment, not reward. … The second condition is that the good work be done in obedience to God. For merit implies a relation to a reward to be received from another; hence he who merits, merits with someone. The third, that he who merits be a wayfarer. For in this life is the race and the battle; in the next, the prize and the crown. … The fourth, that the work be not only good but also free. The fifth, that he who merits be a friend of God and pleasing to him. The sixth, that a promise intervene. The seventh, that the work proceed from the virtue of charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.10 (translated from the Latin)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-ebc99aad94" data-kw="">

</figure><figure class="quote" id="q-a702a69ba8" data-kw="">
<blockquote><p>Since the initiative belongs to God in the order of grace, no one can merit the initial grace of forgiveness and justification, at the beginning of conversion. Moved by the Holy Spirit and by charity, we can then merit for ourselves and for others the graces needed for our sanctification, for the increase of grace and charity, and for the attainment of eternal life. Even temporal goods like health and friendship can be merited in accordance with God&#x27;s wisdom.</p></blockquote>

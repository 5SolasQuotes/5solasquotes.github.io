<main class="wrap"><figure class="quote" id="q-0bc8c102ca" data-kw="">
<blockquote><p>I propound it to you, whether some of you have not held out some other public worship than the reformed Churches hold, namely hymns and anointing the sick members of the Church with oil; as also, whether a little before your coming over into England, some members of the Church of Arnheim [Netherlands], did not propound the holy kiss, or the kiss of love, to be practiced by church-members; Nay whether by some persons in that Church, was it not begun to be used and practiced; And in this enumeration of the parts of public worship, I desire to know why you put in “etc.” and what is meant by “etc.” for that implies more parts than you enumerate. And we know, etc. is a dangerous and suspicious phrase ever since the late [Anglican] Canons and Oath, for under that “etc.” may be meant prophesying and hymns, and anointing with oil, and the kiss of love, and many other parts which the reformed Churches practice not, and so your public worship may be made up of many other parts than the worship of all other reformed Churches, and that there is great cause to speak thus, and doubt, appears, because I know not, nor cannot reckon up any other part of public worship used every Lord’s Day in the reformed Churches than the particulars mentioned by you without an etc. and therefore what you mean by under “etc.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644)</cite>, pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c57a2c187" data-kw="">
<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert Macward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… (1671), 3rd Dialogue</cite>, pp. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-73072cf5f0" data-kw="">
<blockquote><p>To the place of Mt. 15, even you Bishop [John] Hooper had rather receive your meat with your hands washed than with your hands unwashed (as the Pharisees did). To Col. 2, whatsoever is spoken there of beggarly and weak elements appertains to superstition: by which superstition these things were exacted as matters necessary or profitable to salvation, even after Christ was revealed: And whatsoever abuse there be of these garments [for ministers] (or the like ceremonies) that sticks not on the garments, but in impure minds.</p></blockquote>

</figure><figure class="quote" id="q-9298e19dcf" data-kw="">
<blockquote><p>Anointing the sick with oil was held in that [flagship Independent] Church of Arnheim [Netherlands], as a standing ordinance for church members, (for others [of other churches] had no right to that ordinance), as laying on of hands was a standing ordinance for church officers: There was a writing amongst them in many hands, proving it to be so, and there were some cases propounded, with what oil the sick members of the Church were to be anointed, and there was a resolution of the case, namely with olive oil. A copy of this writing some ministers of the [Westminster] Assembly have perused, and one of them has it amongst his papers in the country. [Thomas] Mr. Goodwin did anoint a gentlewoman (whose name I conceal) when she was sick, and she recovered after it (they say).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644)</cite>, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-293341cf5f" data-kw="">
<blockquote><p>Those who exaggeratingly refer to other Christian ministers sound in the fundamentals, albeit erring in other respects, as the sons of Belial or priests of Baal worshipping in the high places (where literal idolatry was used and other gods sacrificed to, a matter of fundamentals or tending to overturn them),¹ as the Separatists did,² are not harmless, but slanderous; cure yourself of that warped intoxication and protect others from it. ¹ Lev. 26:30; Dt. 12:2; 1 Kn. 11:7; 14:23; 2 Kn. 18:4; 21:3, 5; 23:20; 2 Chron. 11:15; 14:3–5; 28:25; 2 Chron. 31:1; 33:3, 17–19; 34:3; Ps. 78:58; Jer. 32:35; 48:35; Eze. 6:6, 13. ² Robert Browne, An Answer to Master Cartwright… (London: 1585), p. 48; Henry Barrow, A Collection of Certain Letters &amp; Conferences… ([Dordrecht] 1590), p. 27; idem, A Plain Refutation of Mr. G. Giffard’s Reproachful Book (Dordrecht, 1591), pp. 2, 7, 63, 189, 216, 223.</p></blockquote>

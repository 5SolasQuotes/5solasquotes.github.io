<blockquote><p>4. The word ‘sanctification‘ also signifies the same thing for the main as conversion does, only with these small differences following: 1. The word is more comprehensive, for it signifies our whole state of dedication or devotedness to God, which comprehends in it these four things: 1. The change of a man’s qualities, whereby he is made fit for the service of God; having his heart bent towards Him, and set upon Him. 2. The actual dedication or devoting of a man’s self to God by faith and a holy covenant, especially in baptism, by solemn vow or engagement. 3. The relation of a person so dedicated or devoted to God; as he is one set apart to Him for holy uses; and it is from this relation especially that the word ‘sanctification’ is used. 4. The holiness of life that follows hereupon; in the actual living to God, to whom we are devoted. Sanctification comprehends all this, and so comprehends in it vocation and somewhat more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, p. 9</span></figcaption>

<blockquote><p>2. It [special effectual calling] has usually in Scripture a principal respect to the first effect on the soul, even the act of faith itself above all other graces, and following obedience: yet not excluding the latter, but sometimes plainly comprehending them. So that some divines conceive that vocation is a work different from sanctification, because they conceive that it is only the Spirit’s causing the first act of faith in the soul, and by that act a habit is effected, and therewith the seed of all graces, which they call the work of sanctification. And indeed the word ‘vocation’ has special respect to the Gospel-call, to the act of believing in Christ, and the proper effect of that call, even our actual belief. But sometime it comprehends the whole Christian relation and state, as Heb. 3:1 and 2 Pet. 1:10, etc.</p></blockquote>

<blockquote><p>The word saint in general signifies a person separated, or one set apart from others; Holiness is our separation from the world unto God: holy persons are separated persons; that’s their state.</p></blockquote>

<blockquote><p>Q. 2. On the Way that we Know God Positively we can say, following the lead of Scotus (Oxon. 1 d. 3 part one q.1) that our knowledge of God is: 1) Positive and not merely negative, because a purely negative knowledge is no knowledge. 2) Quidditative or essential and not merely knowledge of his existence or attributes, for in understanding existence or property we must pre-understand some quasi-subject in which we understand that quasi-property to be present in; therefore we do not merely understand whether God is but to some extent and imperfectly what God is. 3) Not merely in a concept analogous to the concept of a creature which, concept is altogether other than the one said of a creature, but in some concept univocal to God and creatures. This is plain directly from experience and indirectly follows once innatism, illuminationism, and ontologism have been rejected (see below). 4) Proper, but through concepts composed of common concepts. We can attain to many concepts proper to God that do not belong to creatures, for example, supreme being, infinite good, pure act, supreme legislator, etc. But concepts of this sort are not proper notions from proper notions but from transcendental notions, as first, supreme, being, good, which are predicated in common of God and creatures. 5) Notions abstracted from creatures, for as Scotus says, “All metaphysical investigation of God proceeds as follows: a) by considering the formal idea of something, and b) by taking away from that formal idea the imperfection that it has in creatures, and c) by keeping that formal idea and attributing to it altogether supreme perfection, and by thus attributing it to God” (Oxon. ibid.). Note the triple way, namely of affirmation, of negation, and of eminence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotus scholar and writes from that perspective., p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-06fa1177e8" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: … IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience… Now the proper character of this new practice of holiness is perfection or integrity, which consists in this: … 5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely. 6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16. 7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.</p></blockquote>

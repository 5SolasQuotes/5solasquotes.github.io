<main class="wrap"><figure class="quote" id="q-5affed3a6d" data-kw="">
<blockquote><p>When they [Baptists] allege that all the cases of baptism recorded in the New Testament are those of adults, and employ this as an argument against the baptism of infants, we object at once to the conclusion as wholly unwarranted from the premises.

The cases of baptism administered by the apostles, and first ministers of Christianity, were evidently those of persons who, like the converts from Jew and Gentile under the ministrations of Christian missionaries in our own day, were convinced by the power of the truth, and embraced it; and were, in consequence, baptized as the badge of their profession and the seal of their privileges. But we have not on record in the New Testament a single instance of the child of a Christian parent being allowed to grow up to adult age before being baptized; while there is strong presumptive evidence to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Treatise on Christian Baptism</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh: Andrew Elliott, 1876), 3: 59-60.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>30. But those in whom true faith is found are all and only those who are predestined to eternal life. For that faith falls to them from the decree of divine election; and therefore it is called by Paul, “the faith of God’s elect,” Tit. 1:1. Whence it happens that without it no one can be saved, nor does anyone have it who does not obtain salvation. For that assent which imitates true faith in some of the reprobate is temporary faith, about which we spoke above: and it must be distinguished from justifying and saving faith.

31. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God does not cleanse from every stain of original sin all the infants whom he admits into his heavenly kingdom, into which nothing polluted or defiled enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, He undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues.

32. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>

</figure><figure class="quote" id="q-7516cb2aa2" data-kw="">
<blockquote><p>Those who are to be admitted to this sacrament must be found to have a competent knowledge of the fundamentals of the Christian religion, and to be of such an inoffensive walk and conversation, both towards God and their neighbors, that they are not known to be guilty of any scandal that merits church-censure. By the 12th chapter of the French Church Discipline, article 2, persons shall not be admitted to the Lord’s Supper till they be above twelve years of age. But I am sure, if children at nine years of age can express themselves piously and knowingly, showing that they have the grace signified and promised, the seal of the promise cannot warrantably be denied unto them.</p></blockquote>

<blockquote><p>XXXI. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God would purge from every stain of original sin as many infants as he admits into his heavenly kingdom, which nothing defiled and contaminated enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, he undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. XXXII. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the Apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXXI. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God would purge from every stain of original sin as many infants as he admits into his heavenly kingdom, which nothing defiled and contaminated enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, he undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. XXXII. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the Apostle says that it was freely given to them to believe in Christ, Phil. 1:29.”

— Louis Le Blanc, ‘Theological Theses on Faith’ in Theological Theses put forth at Various Times at the Academy of Sedan 3rd, ed. tr. Onku with AI (1645; London: Moses Pitt, 1683), p. 6 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXXI.+But+as+to+what+is+often+asked+here%2C+whether+elect+and+saved+infants+also+have+faith%2C+it+is+plain+indeed+that+they+cannot+have+actual+faith%3B+but+nothing+prohibits+a+certain+habitual+faith%2C+or+rather+the+seed+and+root+of+faith%2C+from+being+infused+in+them.+And+certainly+it+cannot+happen+that+God+would+purge+from+every+stain+of+original+sin+as+many+infants+as+he+admits+into+his+heavenly+kingdom%2C+which+nothing+defiled+and+contaminated+enters.+Since+therefore+original+sin+in+infants+includes+a+certain+seed+of+unbelief%2C+just+as+of+all+vices%2C+while+God+cleanses+them%2C+he+undoubtedly+takes+away+that+innate+unbelief%2C+and+so+infuses+the+principle+and+a+certain+seed+of+faith.+For+God+does+not+purge+his+own+from+vices+except+by+infusing+the+contrary+habits+of+virtues.+XXXII.+Moreover%2C+whatever+that+may+be%2C+whether+faith+or+the+root+of+faith+and+disposition+to+faith+which+can+be+found+in+infants%2C+it+is+beyond+controversy+that+it+must+be+attributed+to+God+alone%2C+and+that+the+offices+of+man+do+not+concur+with+it%3A+nor+can+it+be+called+into+doubt+by+anyone%3A+but+Scripture+also+manifestly+teaches+that+the+same+must+be+thought+about+the+faith+of+adults%2C+for+it+calls+faith+the+gift+of+God%2C+Eph.+2%3A8%2C+%E2%80%9CBy+grace+you+have+been+saved+through+faith%2C+and+that+not+of+yourselves%2C+it+is+the+gift+of+God.%E2%80%9D+And+to+the+Philippians+the+Apostle+says+that+it+was+freely+given+to+them+to+believe+in+Christ%2C+Phil.+1%3A29.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+%E2%80%98Theological+Theses+on+Faith%E2%80%99+in+Theological+Theses+put+forth+at+Various+Times+at+the+Academy+of+Sedan+3rd%2C+ed.+tr.+Onku+with+AI+%2

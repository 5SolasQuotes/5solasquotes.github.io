<main class="wrap"><figure class="quote" id="q-8255fdcb02" data-kw="">
<blockquote><p>But perchance thou wilt ask: If the opening of the eyes be from God alone, to what purpose shall advice be given to thee, in a matter that lies not in thee, and which is not effected by advice, but by supernatural operation? To this I answer that although the power that must enlighten thee does descend from above, yet usually it does communicate itself unto us by the service of certain means, left with us here below. Again, when grace does first breath upon us, it works by degrees, which degrees being by some neglected, or misconstrued, it has bred unto them a greater difficulty and hardness of travail in the new birth; but being perceived and duly entertained, they turn into testimonials unto us, yea to encouragements unto farther degrees of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rous.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Happiness</cite>, ... (London: Stansby, 1619), pt. 3 Rous was a Westminster divine. | 2. ‘How a man may get this faculty which unites man to God’, pp. 228-30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-588c25032e" data-kw="">
<blockquote><p>The Galatians were truly regenerated, and had received Christ into their hearts: yet their graces were so choked and quenched, that He was as it were without fashion or form: so that the apostle did as it were travail again until Christ was fashioned anew in them (Gal. 4:19). David also upon the committing of his sin was brought unto that case, that he prayed God to create in him a new spirit (Ps. 51). What, was the Spirit quite gone? No, for by and by after he prays that God would not take his Holy Spirit from him: but the graces thereof were wonderfully decayed, and therefore he desires that they might be renewed. But that none may abuse this doctrine, let us consider what punishments do follow upon the quenching of the Spirit in this sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seven Godly &amp; Fruitful Sermons</cite>, … (London: Kyngston, 1614), ‘Of extinguishing the graces of the Spirit’, pp. 202-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-7287d3d095" data-kw="">
<blockquote><p>…Under which two excuses [in the text] are comprehended all others of like sort, which flesh and blood does minister, for hindering to rise and open to Christ, and obey his calling, such as we see, Mt. 22, and are usually suggested by our corruption, as the quitting of our pleasure, or profit, our ease, credit, or companions, if we do so; and that we shall fall in disgust, hatred, and obloquy, and other like inconveniences: Neither is it a fit time as yet (but as Felix said to Paul, Acts 24:25) we may take a more convenient season for that, or the like purposes, etc. Such excuses do absenters of themselves from public exercises of divine worship, make, and profaners of the Lord’s Sabbath; such also do covetous extortioners, revengeful oppressors: unclean whoremongers, riotous, drunkards and the like, frame to themselves, and obtrude, and all for this end, to keep Christ out, though He frequently call and knock at their door to enter in. Observations: 1. We see hereby, that it is not an easy matter, but a very hard and difficult one to bring the soul and Christ together, into a near and constant fellowship… but take heed to his voice who calls and knocks, and, as the Father spake at Christ’s baptism from heaven, hear Him and obey. 2. We see, how strong is carnal corruption, and remnants of sin in the regenerate, to hold Christ at the door, and to sleight his voice, calling on the•… to open; and therefore, how much more stronger is the same in the unregenerate, and it is no marvel that they open not unto Him and disobey his voice.</p></blockquote>

</figure><figure class="quote" id="q-c3ac55e150" data-kw="">
<blockquote><p>7th Doctrine: That Jesus Christ will not refuse to come in to the soul of the vilest sinner, when once it is made heartily willing to open to Him. ‘If any man open, I will come in to him.’ [Rev. 3:20] It is not unworthiness, but unwillingness that bars any man from Christ: thousands have missed of Christ by their unwillingness, but Christ never put off one soul upon account of its unworthiness; Christ is not the sale, but the gift of God; you come not to make a bargain, but to receive a free gift: Faith is a marriage with Christ, wherein nothing but your hearty consent is expected; so runs the strain of the whole Scriptures, Isa. 55:1, ‘Ho, every one that thirsteth, come ye to the waters…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Duty under the Present Gospel Liberty from Rev. 3</cite>, verse 20: wherein is opened the admirable condescension and patience of Christ in waiting upon trifling and obstinate sinners… (London: Wotton, 1689), sermon 7, doctrine 7, p. 231</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

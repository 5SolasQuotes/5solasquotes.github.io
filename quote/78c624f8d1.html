<main class="wrap"><figure class="quote" id="q-78c624f8d1" data-kw="">
<blockquote><p>Our Lord’s welcome to children, pronounced in the days of his flesh, implies their membership, “Suffer the little children to come unto me, … for of such is the kingdom of God.” [Mark 10:14] The “kingdom of God” here evidently means the visible Church; and the Saviour expressly declares that infants belong to the Church, and are numbered with his disciples. When it is said “of such,” &amp;c., it cannot merely mean that persons of a childlike disposition compose the kingdom of God, for this would assign no proper reason why infants should be brought to Christ, nor for our Lord’s being displeased with the disciples for seeking to hinder their approach.

If infants are thus declared by our Lord to belong to his Church, then there is certainly no proper reason why they may not be formally and solemnly declared such by baptism. Besides, it cannot be affirmed that they may not have been baptized on this occasion. Our Lord baptized not, but his disciples; and by laying his hands on them, and blessing them, He as solemnly received them as they could have been by the external rite which denotes the conveyance of spiritual blessings. In his discourse to Nicodemus, our Lord declares that none enter his kingdom but such as are born of water, &amp;c.; and the expression being generally understood to contain an allusion to baptism by water, they are excluded from the kingdom of God. Devoid of membership in the Church here, they are cut off from the hopes of eternal salvation – a conclusion this from which, although avowed by some Baptist writers, the pious mind recoils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A practical treatise on Christian baptism</cite>, (1853) in Works: doctrinal and practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), iii, 73-4.</span></figcaption>

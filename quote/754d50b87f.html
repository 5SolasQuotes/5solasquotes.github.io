<main class="wrap"><figure class="quote" id="q-754d50b87f" data-kw="">
<blockquote><p>…upon the first moment that a man believes he is justified, and all his sins-past are actually pardoned, his sins to come virtually, so that no following sin shall unjustify him; though it may take away his aptitude for heaven, yet not his right: and though his sin may deserve damnation, and without actual repentance and faith he cannot be saved, yet grace shall be given to enable him to repent and believe, so that though there must be nova remissio [a new remission], yet there is not nova justificatio [a new justification]; though a new remission is needful, yet not a new justification; pardon of sin is a continued act, but our justification quoad statum [as far as the state] is done simul et semel, ‘once and for all’; this you know to be the Orthodox opinion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-warren.html">Thomas Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unbelievers No Subjects of Justification, Nor of Mystical Union to Christ… (London, 1654), ch. 11</cite>, pp. 250-51</span></figcaption>

<blockquote><p>18. That imputation of the righteousness of Christ is neither fictitious, nor ideal, nor absurd; nor does it overthrow the δικαιοκρισία [dikaiokrisia, righteous judgment] of God, nor does it clash with human reason or practice. Nay, it is established by the Pontificals themselves through the trafficking of papal indulgences and the market of satisfactions and pardons, where the λογισμός [logismos, reckoning/imputation] and communication of another’s righteousness — albeit fictitious — is manifestly taught. It is no wonder, however, that the imputation of the righteousness of Christ is denied and opposed in this matter by those who neither know nor feel the union of ourselves with Christ and the power and efficacy thereof, and who prefer the means of salvation to be profitable to themselves [as independent workers] rather than gratuitous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

lank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XXXVIII… Nor is he [Christopher Wittich] alone in considering sincere love of God and Christ among the essential acts of faith. [Marcus F.] Wendelin shares this sentiment. Although he reduces the parts of faith to three –knowledge, assent, and confidence – he nevertheless teaches that love also pertains to the acts of faith. For he proves that not only the intellect but also the will is the subject of faith, “Because faith is also love, and love is an act of the will,” which he supports with the testimony of Augustine saying, “To believe in Christ is to love Christ.” In Christian Theology, bk. 2, ch. 24, in the explanation of the eighth thesis. XXXIX. Similar views can be found in [Daniel] Chamier, who also uses the same argument to prove that faith is in the will, not just in the intellect. He says, ‘All love is an act of the will; but faith is love; therefore, it is an act of the will.’ He proves that faith is love because true faith is that which believes in God: But to believe in God is to love God, according to Augustine, ‘What is it to believe in God? To believe is to love.’ (Pancratia, vol. 3, bk. 12, ch. 4, no. 16). XL. And Wittich himself in the previously cited place brings forward the words of Cocceius, a professor at Leiden University while he was alive. ‘That faith,’ he says: ‘is a kind of love of God, by which I love God as the one who atones for sins and heals from the disease and penalty of sin, that I may be to His glory.’ (On the Last Words of Moses, p. 336). And in another place: ‘Therefore, faith is inherently connected with charity; since faith itself is nothing but the outpouring of Christ’s charity in our hearts, its sensation, and reciprocal recognition. One loves because they believe; and if they do not love, they do not believe.’ (in Examen Apologiae, p. 209). But many among the Reformed theologians think differently, like Samuel Maresius, Robert Baronius, Bucanus, and ultimately all who place faith solely in the intellect, like Peter du Moulin and the Professors of Saumur. For all of them indeed teach that the love of God arises from true faith and is an effect inseparable from it, yet they do not want it to be an act elicited by faith, as that would confuse faith with charity. … XCVI. Similarly, there is doubt about whether love is a formal and essential act of faith. Esteemed scholars such as Chamier, Wendelin, Wittich, and Cocceius assert it, while others deny it. For my part, I think some distinction is necessary here. Faith can be taken in two ways: First, precisely, according to what it has distinct from hope, charity, and other Christian virtues. In this sense, love is not a formal act of faith but pertains to another virtue, namely, charity. Secondly, faith is taken for a composite of several acts or habits, which are included under the term “faith working through love.” This is how many Reformed authors understand faith in this question, not as a single act or simple habit but as a complex of several acts or habits. From this, it follows that sincere love of God and Christ, without which faith cannot be conceived as living and working through love, undoubtedly belongs to faith as an essential act. . . In Lutheranism Article 1600’s Calov, Abraham – Thoughts on Objective Justification tr. Souksamay K. Phetsanghane 47 pp. in Biblia Illustrata (1672-1676; 2014), on 2 Cor. 5:18‐19; Rom. 3:23‐24; 4:25; 5:18‐19 with a bibliography Presented for the Southwestern Conference of the Western Wisconsin District of the Wisconsin Evangelical Lutheran Synod, Winter Conference, Feb. 25, 2014, St. John Lutheran, Baraboo, WI Calov (1612–1686) was a professor of theology at Konigsberg and Wittenberg and one of the champions of Lutheran orthodoxy in the 17th century. ‘Objective Justification’ refers to the erroneous notion of an objective, universal and conditional justification of all people through the work of Christ. While this doctrine is largely absent from the historic creeds of Lutheranism and Lutheran orthodoxy (which emphasized an actual, personal justification by faith), yet Phetsanghane seeks to show that this doctrine was taught to some minor extent, and incidentally, in some of the orthodox Lutheran theologians (principally Abraham Calov, 1612-1686) and it may be contained in some implicit form in some early historic Lutheran confessions. . Historical On the Post-Reformation Article Fesko, J.V. – ‘Reformed Orthodoxy on Imputation. Active &amp; Passive Justification’ in Perichoresis, vol. 14, issue 3 (2016), pp. 61-80 Abstract: “The doctrine of imputation is common to Early Modern Lutheran and Reformed theology, but Reformed orthodox theologians employed the distinction between the active and passive justification of the believer. Active justification is the objective imputation of Christ’s righteousness and passive justification is the subjective reception of the same. This distinction is a unique contribution in Reformed orthodox dogmatics and was used in polemics against Roman Catholic, Arminian, and Socinian theologians. This essay also compares Reformed orthodox formulations with Lutheran orthodox understandings of how they preserved the extra nos [outside of us] of Christ’s righteousness in justification. The Reformed orthodox employed the active-passive justification distinction in conjunction with the decree and the doctrine of the covenant of redemption, whereas the Lutheran orthodox logically placed justification first in the order of salvation. Both groups maintain the extra nos of Christ’s imputed righteousness but do so in different ways.</p></blockquote>

s+inherently+connected+with+charity%3B+since+faith+itself+is+nothing+but+the+outpouring+of+Christ%E2%80%99s+charity+in+our+hearts%2C+its+sensation%2C+and+reciprocal+recognition.+One+loves+because+they+believe%3B+and+if+they+do+not+love%2C+they+do+not+believe.%E2%80%99+%28in+Examen+Apologiae%2C+p.+209%29.+But+many+among+the+Reformed+theologians+think+differently%2C+like+Samuel+Maresius%2C+Robert+Baronius%2C+Bucanus%2C+and+ultimately+all+who+place+faith+solely+in+the+intellect%2C+like+Peter+du+Moulin+and+the+Professors+of+Saumur.+For+all+of+them+indeed+teach+that+the+love+of+God+arises+from+true+faith+and+is+an+effect+inseparable+from+it%2C+yet+they+do+not+want+it+to+be+an+act+elicited+by+faith%2C+as+that+would+confuse+faith+with+charity.+%E2%80%A6+XCVI.+Similarly%2C+there+is+doubt+about+whether+love+is+a+formal+and+essential+act+of+faith.+Esteemed+scholars+such+as+Chamier%2C+Wendelin%2C+Wittich%2C+and+Cocceius+assert+it%2C+while+others+deny+it.+For+my+part%2C+I+think+some+distinction+is+necessary+here.+Faith+can+be+taken+in+two+ways%3A+First%2C+precisely%2C+according+to+what+it+has+distinct+from+hope%2C+charity%2C+and+other+Christian+virtues.+In+this+sense%2C+love+is+not+a+formal+act+of+faith+but+pertains+to+another+virtue%2C+namely%2C+charity.+Secondly%2C+faith+is+taken+for+a+composite+of+several+acts+or+habits%2C+which+are+included+under+the+term+%E2%80%9Cfaith+working+through+love.%E2%80%9D+This+is+how+many+Reformed+authors+understand+faith+in+this+question%2C+not+as+a+single+act+or+simple+habit+but+as+a+complex+of+several+acts+or+habits.+From+this%2C+it+follows+that+sincere+love+of+God+and+Christ%2C+without+which+faith+cannot+be+conceived+as+living+and+working+through+love%2C+undoubtedly+belongs+to+faith+as+an+essential+act.+.+.+In+Lutheranism+Article+1600%E2%80%99s+Calov%2C+Abraham+%E2%80%93+Thoughts+on+Objective+Justification+tr.+Souksamay+K.+Phetsanghane+47+pp.+in+Biblia+Illustrata+%281672-1676%3B+2014%29%2C+on+2+Cor.+5%3A18%E2%80%9019%3B+Rom.+3%3A23%E2%80%9024%3B+4%3A25%3B+5%3A18%E2%80%9019+with+a+bibliography+Presented+for+the+Southwestern+Conference+of+the+Western+Wisconsin+District+of+the+Wisconsin+Evangelical+Lutheran+Synod%2C+Winter+Conference%2C+Feb.+25%2C+2014%2C+St.+John+Lutheran%2C+Baraboo%2C+WI+Calov+%281612%E2%80%931686%29+was+a+professor+of+theology+at+Konigsberg+and+Wittenberg+and+one+of+the+champions+of+Lutheran+orthodoxy+in+the+17th+century.+%E2%80%98Objective+Justification%E2%80%99+refers+to+the+erroneous+notion+of+an+objective%2C+universal+and+conditional+justification+of+all+people+through+the+work+of+Christ.+While+this+doctrine+is+largely+absent+from+the+historic+creeds+of+Lutheranism+and+Lutheran+orthodoxy+%28which+emphasized+an+actual%2C+personal+justification+by+faith%29%2C+yet+Phetsanghane+seeks+to+show+that+this+doctrine+was+taught+to+some+minor+extent%2C+and+incidentally%2C+in+some+of+the+orthodox+Lutheran+theologians+%28principally+Abraham+Calov%2C+1612-1686%29+and+it+may+be+contained+in+some+implicit+form+in+some+early+historic+Lutheran+confessions.+.+Historical+On+the+Post-Reformation+Article+Fesko%2C+J.V.+%E2%80%93+%E2%80%98Reformed+Orthodoxy+on+Imputation.+Active+%26+Passive+Justification%E2%80%99+in+Perichoresis%2C+vol.+14%2C+issue+3+%282016%29%2C+pp.+61-80+Abstract%3A+%E2%80%9CThe+doctrine+of+imputation+is+common+to+Early+Modern+Lutheran+and+Reformed+theology%2C+but+Reformed+orthodox+theologians+employed+the+distinction+between+the+active+and+passive+justification+of+the+believer.+Active+justification+is+the+objective+imputation+of+Christ%E2%80%99s+righteousness+and+passive+justification+is+the+subjective+reception+of+the+same.+This+distinction+is+a+unique+contribution+in+Reformed+orthodox+dogmatics+and+was+used+in+polemics+against+Roman+Catholic%2C+Arminian%2C+and+Socinian+theologians.+This+essay+also+compares+Reformed+orthodox+formulations+with+Lutheran+orthodox+understandings+of+how+they+preserved+the+extra+nos+%5Boutside+of+us%5D+of+Christ%E2%80%99s+righteousness+in+justification.+The+Reformed+orthodox+employed+the+active-passive+justification+distinction+in+conjunction+with+the+decree+and+the+doctrine+of+the+covenant+of+redemption%2C+whereas+the+Lutheran+orthodox+logically+placed+justification+first+in+the+order+of+salvation.+Both+groups+maintain+the+extra+nos+of+Christ%E2%80%99s+imputed+righteousness+but+do+so+in+different+ways.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98On+Justifying+Faith%E2%80%99%2C+pt.+1%2C+pp.+145%2C+162+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa83c9369be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a83c9369be.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=XXXVIII%E2%80%A6%20Nor%20is%20he%20%5BChristopher%20Wittich%5D,but%20do%20so%20in%20different%20ways." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>By ‘works’ here [Rev. 20:12-13] are we judged and justified, and not by faith only, as also James 2:24 testifies, meaning hereby that of lively faith and of the good works that follow thereupon man is justified, and not of that dead faith that is by itself alone, without any good works: otherwise were the words of Paul (Rom. 3:28) express contrary to this text, and to James; for, says Paul, ‘We are justified by faith, without the works of the Law,’ that is to say, not without good works whatsoever, but meaning that we are justified by lively faith with such small good works as our weak nature will suffer that faith to produce, although it be without the precise works that the Law requires: and for confirmation of this interpretation, and union of these texts, ye shall find both James and Paul agree in diverse places, that faith without works is a dead faith, and serves nothing to justification. And again, they agree both that all works (how good soever they seem) that proceed not from faith, are evil. And so it is all one to say with Saint Paul, We are justified by fruitful faith, or faith that produces good works, although not the works that the Law requires, or to say with James, and here with Saint John, we are justified by faithful works, seeing a working faith and faithful works are inseparable, and none can have the one without the other. So for conclusion, these works, by the which here we are judged, are to be esteemed good or evil, not in themselves, or insofar as they satisfy the Law (for so were all works evil and imperfect), but insofar forth as they have or want faith adjoined with them, they are accounted good or evil only.</p></blockquote>

<blockquote><p>Mr. Anthony Wotton, a man, by Mr. Walker’s own confession, of special note for his piety, life and learning, while he lived, which both the University of Cambridge and the City of London are able also to give ample testimony unto;” – Mr. Anthony Wotton’s Defence, Preface, p. 3 Wiki: “In 1611 George Walker (1581?-1651) accused him of Socinianism; this led to a ‘conference’ of learned divines, which ended in Wotton’s vindication. The controversy went on till 1615, and in 1641, long after Wotton’s death, Walker repeated his accusations. This provoked Mr. Anthony Wotton’s Defence (Cambridge, 1641, published under the name of Thomas Gataker, who, however, only wrote the postscript, the Defence being by Wotton’s son, Samuel… Walker replied in A True Relation of the Chief Passages between Mr. Anthony Wotton and Mr. George Walker in … 1611, and in the Years next following … till 1615 (London, 1642, 4to).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6603c441e1" data-kw="">
<blockquote><p>And, therefore, when we speak generally about faith, let us know that there is a kind of faith which is perceived by the understanding only, and afterwards quickly disappears, because it is not fixed in the heart; and that is the faith which James calls dead; but true faith always depends on the Spirit of regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospel according to John</cite>, John 2:23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44993ee873" data-kw="against implicit faith">
<blockquote><p>This is “implicit faith” (which they say suffices for the salvation of the laity if they believe what the church believes, although they may not know what the church believes, or what it ought to believe, or what church is to be believed). This is called “the faith of Carbonarius” because being asked what he believed, he answered, “What the church believes.” Again being asked what the church believed, he said, “What I believe.” The design of the Romanists is to keep the people in ignorance that the yoke of traditions and of all kinds of errors and superstitions may the more easily be placed upon them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.3–4</span></figcaption>

</figure><figure class="quote" id="q-af4be4a6a4" data-kw="">

</figure><figure class="quote" id="q-7db9d5d022" data-kw="temporary vs saving faith">
<blockquote><p>Whether a true believer who is called according to God’s purpose and truly justified, furnished with a faith not dogmatical and temporary, but living and saving, can (no less as to God and the event, than as to himself) lose faith, not only objectively (which believes), but also subjectively (by which he believes); not only demeritoriously, but effectively (totally); not only for a time, but finally. We deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.16.7</span></figcaption>

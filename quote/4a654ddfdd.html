</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-184a168527" data-kw="">
<blockquote><p>The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ [Rev. 3:20] it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Acquaintance &amp; Highest Honor of Christians, or a Discourse of Acquaintance with God</cite>, (London: Parker, 1679), ch. 4, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-4810e02ee2" data-kw="">
<blockquote><p>I answer that, Everything is said to be good so far as it is perfect; for in that way only is it desirable (as shown above, AA. 1, 3). Now a thing is said to be perfect if it lacks nothing according to the mode of its perfection. But since everything is what it is by its form (and since the form presupposes certain things, and from the form certain things necessarily follow), in order for a thing to be perfect and good it must have a form, together with all that precedes and follows upon that form. … Further, upon the form follows an inclination to the end, or to an action, or something of the sort; for everything, in so far as it is in act, acts and tends towards that which is in accordance with its form;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 5, art. 5, Whether the essence of goodness consists in mode, species and order?, I answer that</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-0902f1baa4" data-kw="">
<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions, pp. 560-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=goodness%20%28bonitas%29%20is%20that%20act%20of,God%20and%20contrary%20to%20his%20virtues&amp;text=goodness%20%28bonitas%29%20is%20that%20act%20of%20the%20divine&amp;text=displeasing%20to%20God%20and%20contrary%20to%20his%20virtues" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e96acf3b2" data-kw="">
<blockquote><p>‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 28, verse 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Important religious colloquies were also held beyond the borders of the Holy Roman Empire, extending beyond regional dialogues. The Colloquy of Poissy in France and the “Colloquium Charitativum” of Thorn in Poland are among the most well known, but there were more.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6dbb8b038c" data-kw="">
<blockquote><p>Tota ratio Schismatis, the very essence of a schism consists in the separating from the Church, I say, from the true and orthodoxal Church. It is a renting or dissolving of that unity which ought to be amongst Christians; See Mr. [Stephen] Marshall’s Sermon on Rom. 12:4-5. It was a memorable speech of Calvin, who said he would willingly travel all over the seas and countries in the world to put an end to the differences that were in the Reformed Churches. [John] Cameron well distinguishes of a double schism:

1. Negative, which is a bare secession or subduction, and is unlawful. Non separatio sed causa facit Schismaticum [Not the separation but the cause that makes the schismatic]. Cassander.

2. Positive, when there is a certain consociation, which uses ecclesiastical laws, the Word of God and administration of the sacraments separatim [in a separated way], which he calls setting up an altar against an altar; this is called schism Antonomastic [Greek], and [Greek], says he [in] De Ecclesia. Different forms of Churches and Church-government in one state must needs lay a foundation of strife and division therein. It is no wisdom (says Mr. [John] Dury in a letter [about congregationalists]) in a state, to reject an approved way of government, which all the best reformed Churches have received all this while, and acknowledged to be God’s way, and by experience found to be safe, sound; and instead of it to take up another, which it is not yet known what it is, nor was ever tried but in two or at the most three churches, and that for the space of a few years. The slighter the cause of separation, the greater the fault of schism; when men hold the same Faith and orthodox truths, yet separate for lesser matters. The true saints in the 7 Churches of the Revelation were never bid go out of them though they were very corrupt, as they were out of Babylon, Mr. [Richard] Vines. The first separatist in the Scripture (says one) was Cain, Gen. 4:16. Enforcements to love are clear, 1 Cor. 13:1. That question of Separation in Scripture is dark. See Mr. [George] Gillespie, Miscellaneous Questions, ch. 10 and 15, and Mr. [Thomas] Manton on James 3. 17. Schisma est secessio in religionis negotio vel temeraria vel injusta, Cameron, De Ecclesia. Schism is a causeless separation from external communion with any true Church of Christ: Mr. [John] Ball, Against Separation, ch. 8. Schism is a breach of the unity of the Church. Dr. Field, bk. 3, Of the Church, ch. 5. We do not leave communion of true Churches for corruptions and sins, but only abstain from the practice of evil in our own persons, and witness against it in others, still holding communion with the Churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London: A.M., 1654), bk. 4, ch. 22, ‘Schism’, pp. 376-77</span></figcaption>

<blockquote><p>…he [John Sprint] says that the suffering of deprivation for refusing to conform breeds and produces sundry scandals. First says he, it is the occasion of fraternal discord. O egregious impudency! who sees not that the ceremonies are the incendiary sparkles from which the fire of contention has its being and burning? so that conforming (not refusing) is the furnishing of fuel and casting of faggots to the fire.</p></blockquote>

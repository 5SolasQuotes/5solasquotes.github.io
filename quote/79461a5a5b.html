<blockquote><p>Wherefore examine your own hearts and consciences… call yourselves to an account for your unlawful gaming and sporting, your immoderate drinking, your Lord’s Day breaking, your lascivious dancing, your chambering and wantonness; and if the remembrance of these your former sins be loathsome unto you…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0bc8c102ca" data-kw="">
<blockquote><p>I propound it to you, whether some of you have not held out some other public worship than the reformed Churches hold, namely hymns and anointing the sick members of the Church with oil; as also, whether a little before your coming over into England, some members of the Church of Arnheim [Netherlands], did not propound the holy kiss, or the kiss of love, to be practiced by church-members; Nay whether by some persons in that Church, was it not begun to be used and practiced; And in this enumeration of the parts of public worship, I desire to know why you put in “etc.” and what is meant by “etc.” for that implies more parts than you enumerate. And we know, etc. is a dangerous and suspicious phrase ever since the late [Anglican] Canons and Oath, for under that “etc.” may be meant prophesying and hymns, and anointing with oil, and the kiss of love, and many other parts which the reformed Churches practice not, and so your public worship may be made up of many other parts than the worship of all other reformed Churches, and that there is great cause to speak thus, and doubt, appears, because I know not, nor cannot reckon up any other part of public worship used every Lord’s Day in the reformed Churches than the particulars mentioned by you without an etc. and therefore what you mean by under “etc.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-8b4283b22d" data-kw="">
<blockquote><p>If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), Pt. 3, Ch. 7, Sections 7, pp. 131-3</span></figcaption>

them+from+the+power+and+authority+of+the+Church.+And+further%2C+if+any+such+reasons+be+to+be+give+forth+for+the+ceremonies%2C+why+are+they+so+long+kept+up+from+us%3F%E2%80%A6+It+will+be+answered+%28I+know%29%2C+that+if+they+Church+command+anything+repugnant+to+God%E2%80%99s+Word+we+are+not+bound+to+do+it%2C+nor+to+receive+it+as+lawful%2C+though+the+Church+judge+so+of+it%3B+but+otherwise%2C+if+that+which+the+Church+judges+to+be+agreeable+to+the+law+of+God+and+nature+%28and+in+that+respect+prescribes%29+be+not+repugnant+to+the+Word+of+God%2C+but+in+itself+indifferent%2C+then+are+we+to+embrace+it+as+convenient%2C+and+consonant+to+the+law+of+God+and+nature%2C+neither+ought+we+to+call+in+question+the+lawfulness+of+it.+But+I+reply%2C+that+%5Bin+this+case%5D+either+we+must+judge+a+thing+to+be+repugnant+or+not+repugnant+to+the+Word%2C+to+be+indifferent+or+not+indifferent+in+itself%2C+%5Bmerely%5D+because+the+Church+judges+so+of+it+%5Bwhich+is+insufficient+to+conscience%5D%2C+or+else+because+the+Church+proves+unto+us+by+an+evident+reason+that+it+is+so%E2%80%A6+the+argument+is+still+set+afoot+%5Bincomplete%5D%3B+then+we+must+receive+everything+%28be+it+ever+so+bad%29+as+indifferent%2C+if+only+the+Church+happen+so+to+judge+of+it%3B+for+quod+competit+alicui+qua+tale%2C+etc.+So+that+if+we+receive+anything+as+indifferent%2C+for+this+respect%2C+because+the+Church+judges+it+to+be+so%2C+then+shall+we+receive+everything+for+indifferent+which+the+Church+shall+so+judge+of+%5Bwhich+is+absurd%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29%2C+Pt.+3%2C+Ch.+7%2C+Sections+7%2C+pp.+131-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b4283b22d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b4283b22d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=If%20the%20Church%20prescribe%20anything%20lawfully,so%20judge%20of%20%5Bwhich%20is%20absurd&amp;text=If%20the%20Church%20prescribe%20anything%20lawfully%2C%20so%20that&amp;text=Church%20shall%20so%20judge%20of%20%5Bwhich%20is%20absurd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The [opposing] Doctor takes needless pains to prove sitting in the act of receiving the sacramental elements of bread and wine, not to be necessary. For we hold not sitting in special [to be] absolutely necessary in the act of receiving, but [rather] a table-gesture in general, whether sitting or standing about the table, we hold necessary; howbeit not to the essence, yet to the right ministration of the sacrament. And of these two table gestures, we hold sitting most aggreeable to the institution: for Christ setting down before his apostles, a pattern, conformed whereunto they should celebrate that holy action thereafter, celebrated the same sitting: and this gesture ougt not to be changed, no not in another table gesture without some urgent necessity. To stand at the minister’s hand [giving the elements], or to take in passing by, we account [to be] no table-gesture; for there is no use in that case more of a table-gesture, than if it were a dressor, or cup-board; and that kind of gesture takes away the distribution of the communicants [between themselves], which is not taken away by standing about the table. … Casaubonus does acknowledge the gesture of Christ and his apostles at the Paschal supper to have been not a simple lying, but a gesture consisting partly of sitting, and lying… Seeing therefore the Hebrew, Chaldaic and Rabbinical writers do interpret the one word indifferently by the other [whether sitting or lying], our vulgar translators [of the Bible] have done right in expressing Christ’s gesture by the word ‘sitting’. The Doctor himself at Perth Assembly [1618] confessed that our gesture of upright sitting and his apostles’ gesture at the Paschal supper were analoga [analogous]. If Christ had celebrated the Paschal supper in the days of David [1 Sam. 4:18; 20:25-34] or Solomon [1 Kings 2:19; 10:19; 2 Kings 4:10; 2 Chron. 9:18], before the custom of sitting at table in beds entered among the Jews [as a cultural custom], He had used the gesture of upright sitting, as the Jews did then and as the Jews do at this day when they celebrate the Paschal supper.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The [opposing] Doctor takes needless pains to prove sitting in the act of receiving the sacramental elements of bread and wine, not to be necessary. For we hold not sitting in special [to be] absolutely necessary in the act of receiving, but [rather] a table-gesture in general, whether sitting or standing about the table, we hold necessary; howbeit not to the essence, yet to the right ministration of the sacrament. And of these two table gestures, we hold sitting most aggreeable to the institution: for Christ setting down before his apostles, a pattern, conformed whereunto they should celebrate that holy action thereafter, celebrated the same sitting: and this gesture ougt not to be changed, no not in another table gesture without some urgent necessity. To stand at the minister’s hand [giving the elements], or to take in passing by, we account [to be] no table-gesture; for there is no use in that case more of a table-gesture, than if it were a dressor, or cup-board; and that kind of gesture takes away the distribution of the communicants [between themselves], which is not taken away by standing about the table. … Casaubonus does acknowledge the gesture of Christ and his apostles at the Paschal supper to have been not a simple lying, but a gesture consisting partly of sitting, and lying… Seeing therefore the Hebrew, Chaldaic and Rabbinical writers do interpret the one word indifferently by the other [whether sitting or lying], our vulgar translators [of the Bible] have done right in expressing Christ’s gesture by the word ‘sitting’. The Doctor himself at Perth Assembly [1618] confessed that our gesture of upright sitting and his apostles’ gesture at the Paschal supper were analoga [analogous]. If Christ had celebrated the Paschal supper in the days of David [1 Sam. 4:18; 20:25-34] or Solomon [1 Kings 2:19; 10:19; 2 Kings 4:10; 2 Chron. 9:18], before the custom of sitting at table in beds entered among the Jews [as a cultural custom], He had used the gesture of upright sitting, as the Jews did then and as the Jews do at this day when they celebrate the Paschal supper.”

<blockquote><p>By a ‘ceremony’ I understand an external rite in or about the worship of God. By ‘significant ceremonies’ I understand rites in divine worship signifying some material point of religion. There is no controversy about those outward actions that by nature or general custom signify the reverence of the mind, as kneeling and lifting up our eyes and hands to Heaven in token of devotion to the God of Heaven, and being uncovered in prayer, etc. But the question is of those that signify merely by the force of authoritative institution or private arbitrary intention. Such significant things, though they may have some natural aptitude to signify such and such points of religion, yet they do not actually signify, but [only signify] as arbitrarily designed thereunto. It is generally received that significant ceremonies in taking an oath may lawfully be used, and that not only such as naturally signify, as lifting up the hand towards Heaven, but such also as signify by institution, as laying the hand on a book or kissing the book. Now though the end of an oath may be a civil thing, as the ending of a controversy, yet the formal of it is divine worship. And the aforesaid ceremonies are expressive of the very external part of it, and they actually signify by force of institution. Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words. The Christians heretofore, being among infidels, might lawfully have the figure of the cross somewhere visible about them to show that they were Christians. For the meaning was no more than if they had said, “We are Christians.” But it may be replied this was no act of divine worship, but an indicant or speaking sign towards men. With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution. And if instituted signs of devotion in general be lawful, I see not why signs of some special part of devotion, or mystery in religion, should be unlawful. I am more confident of the warrantableness of rites and ceremonies of worship that are used only instead of so many words pronounced, than of those that are added to words for their more solemn ratification, as seals are to a writing or federal signs to a verbal contract. Nevertheless, the forementioned ceremonies of swearing seem added to the words of the oath for more solemn ratification; and it alters not the case whether the words be read by him that administers or pronounced by him that takes the oath, for either way they are his words that takes the oath. Likewise I have more confidence of the warrantableness of those significant ceremonies that are of private arbitrary intention than of those that are of authoritative institution; also of those that are used occasionally and pro hic et nunc [for here and now], than of those that are used statedly. Furthermore I apprehend that significant ceremonies of divine worship are more apt to degenerate into superstition; and if they be multiplied, that religion is therewith loaded as with unprofitable luggage; and that it is a form of religion rather Mosaic than evangelical, wherein spiritual worship is most regarded. I think also that significant ceremonies are not necessary in genere, as those things are which are left to the determination of human authority, and so not to be instituted and imposed in the ordinary divine service. I apprehend that our Lord Christ has instituted all those stated ordinances of positive worship that are necessary to the Church universal, and therefore that more of the same nature are not to be devised by men. If any significant ceremonies be indeed necessary for some parts of the catholic Church in respect of time and place, there seems to me a fairer plea for their institution in those times and places; but the controverted ceremonies among us seem to be necessary for the whole Church in every age, if at all necessary. Significant ceremonies of the same nature and reason with those perpetual ordinances that Christ has instituted for the universal Church may not be instituted by man, and particularly such as are made symbols of the Covenant of Grace and Christianity. In matters doubted among sober Christians, superiors should take heed of strict imposing, and thereby wresting the consciences of their subjects and overstraining them to a compliance with them, in derogation to God’s authority in their consciences. If superiors command that which is above their sphere to command, namely, things not necessary in genere, yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>

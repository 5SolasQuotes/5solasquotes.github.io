<blockquote><p>Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100</cite>, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85e6a0f083" data-kw="">
<blockquote><p>…in the Revelation that Ecce venio [‘Behold, I come’] (Rev. 16:15) tells us the King of Glory is not far off. O then (as it is in the Psalm) ‘Lift up yourselves ye everlasting gates, that the King of Glory may enter in.’ (Ps. 24:7) The heart is the gate at which Christ must enter, ’tis the fort, the citadel which He would have yielded into his possession, ‘My son give me thy heart (Prov. 23:26); Let us therefore prepare our hearts for the entertainment of so great a guest, that so our souls may hold the same course hereafter which our prayers here do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-king.html">Henry King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Lord’s Prayer delivered in Certain Sermons… (London: Haviland, 1628), ‘Thy Kingdom Come’, p. 129 King (1592-1669) was an Anglican bishop and poet.</cite></span></figcaption>

</figure><figure class="quote" id="q-2ec24cdd2c" data-kw="">
<blockquote><p>Others (Immanuel Tremellius &amp; Thomas Wilcox) interpret this of the doors of our heart, according to that Apoc. 3:20, ‘Behold I stand at the doors and knock, if any man hear my voice and open the door, I will come in unto him, etc.’ In the Gospel’s history we find that Christ had a fourfold entertainment among men. Some received Him into house, not into heart, as Simon the Pharisee (Lk. 7:44), who gave Him no kiss, nor water to his feet: some into heart, but not into house, as the faithful centurion, esteeming himself unworthy that Christ (Mt. 8:8) shouId come under his roof: some neither into soul nor heart, as the graceIess Gergesites, Mt. 8:54; some both into house and heart, as Lazarus (Jn. 11:11, 15), Mary (Lk. 10:38), Martha. Now that Christ may dwell in our hearts by faith (Eph. 3:17), and that our bodies may be temples of his Holy Spirit (1 Cor. 6:19); we must as our prophet exhorts here, ‘lift up our souls,’ that is, in the words of St. Paul, Col. 3:2, our affections must be set on things which are above, and not on things which are on earth, if we desire to lift up our heart unto Christ’s verity, we may not lift it up unto the world’s vanity (Augustine in location), that is, we must not fasten our love too much upon the things of this life, but on those pleasures at God’s right hand, which are evermore… O Lord, which art the God of my salvation (Ps. 18:47), I lift my heart to Thee (Ps. 25:1), desirous to seek Thee, both in the right ubi, ‘where’ Thou mayst be found, and in the right quando, ‘while’ Thou mayst be found: Open my dull ears and hard heart, that thy Son my Savior may come in and dwell with me: Grant me grace that I may still hear while He calls, open while He knocks, and hold Him also when I have Him, that I may both ascend thine hill, and stand in thine holy place, that I may not only sojourn in thy tabernacle, but also rest and dwell upon the mountain of thine holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | Ascension Day Evening Prayer, Psalm 24</cite>, p. 912</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

ndo%2C+%E2%80%98while%E2%80%99+Thou+mayst+be+found%3A+Open+my+dull+ears+and+hard+heart%2C+that+thy+Son+my+Savior+may+come+in+and+dwell+with+me%3A+Grant+me+grace+that+I+may+still+hear+while+He+calls%2C+open+while+He+knocks%2C+and+hold+Him+also+when+I+have+Him%2C+that+I+may+both+ascend+thine+hill%2C+and+stand+in+thine+holy+place%2C+that+I+may+not+only+sojourn+in+thy+tabernacle%2C+but+also+rest+and+dwell+upon+the+mountain+of+thine+holiness.%E2%80%9D%0A%0A%E2%80%94+John+Boys%2C+Exposition+of+the+Dominical+%5BLordly%5D+Epistles+%26+Gospels+used+in+our+English+Liturgy...+%28d.+1625%3B+1638%29+%7C+Ascension+Day+Evening+Prayer%2C+Psalm+24%2C+p.+912&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ec24cdd2c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ec24cdd2c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Others%20%28Immanuel%20Tremellius%20%26%20Thomas%20Wilcox%29,upon%20the%20mountain%20of%20thine%20holiness." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-619c122c44" data-kw="">
<blockquote><p>Were not the heart closed, the door shut, Christ would not need to knock; were not the sinner unwilling to open, Christ would not be put to stand knocking, the heart would open to Him at his first approach, at his first knock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100</cite>, p. 45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-c2d83d2e37" data-kw="">
<blockquote><p>Oh believe it, God has not one drop of mercy for the finally obstinate and rebellious sinner. In this world, God’s mercy (as it were) goes a begging to them, ‘tis brought to their very doors and offered to them; Christ stands at the door and knocks for entrance. They actually enjoy many outward mercies, and spiritual eternal mercies are offered to them and urged on them; but when God’s patience is ended, let them cry and pray as long as they will, not the least drop of mercy shall be obtained for them. And as they shall not have the least drop of mercy, so they shall have wrath and misery without mixture; pain without mitigation or intermission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-wadsworth.html">Benjamin Wadsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twelve Single Sermons on Various Subjects (Boston: B. Green, 1717), Sermon 9, ‘God’s Bow Bent &amp; Sword Drawn against the Wicked’, pp. 183–85 Wadsworth (1670–1737) was an American Congregational minister and president of Harvard.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“Oh believe it, God has not one drop of mercy for the finally obstinate and rebellious sinner. In this world, God’s mercy (as it were) goes a begging to them, ‘tis brought to their very doors and offered to them; Christ stands at the door and knocks for entrance. They actually enjoy many outward mercies, and spiritual eternal mercies are offered to them and urged on them; but when God’s patience is ended, let them cry and pray as long as they will, not the least drop of mercy shall be obtained for them. And as they shall not have the least drop of mercy, so they shall have wrath and misery without mixture; pain without mitigation or intermission.”

— Benjamin Wadsworth, Twelve Single Sermons on Various Subjects (Boston: B. Green, 1717), Sermon 9, ‘God’s Bow Bent &amp; Sword Drawn against the Wicked’, pp. 183–85 Wadsworth (1670–1737) was an American Congregational minister and president of Harvard.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COh+believe+it%2C+God+has+not+one+drop+of+mercy+for+the+finally+obstinate+and+rebellious+sinner.+In+this+world%2C+God%E2%80%99s+mercy+%28as+it+were%29+goes+a+begging+to+them%2C+%E2%80%98tis+brought+to+their+very+doors+and+offered+to+them%3B+Christ+stands+at+the+door+and+knocks+for+entrance.+They+actually+enjoy+many+outward+mercies%2C+and+spiritual+eternal+mercies+are+offered+to+them+and+urged+on+them%3B+but+when+God%E2%80%99s+patience+is+ended%2C+let+them+cry+and+pray+as+long+as+they+will%2C+not+the+least+drop+of+mercy+shall+be+obtained+for+them.+And+as+they+shall+not+have+the+least+drop+of+mercy%2C+so+they+shall+have+wrath+and+misery+without+mixture%3B+pain+without+mitigation+or+intermission.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Wadsworth%2C+Twelve+Single+Sermons+on+Various+Subjects+%28Boston%3A+B.+Green%2C+1717%29%2C+Sermon+9%2C+%E2%80%98God%E2%80%99s+Bow+Bent+%26+Sword+Drawn+against+the+Wicked%E2%80%99%2C+pp.+183%E2%80%9385+Wadsworth+%281670%E2%80%931737%29+was+an+American+Congregational+minister+and+president+of+Harvard.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc2d83d2e37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c2d83d2e37.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Oh%20believe%20it%2C%20God%20has%20not,mixture%3B%20pain%20without%20mitigation%20or%20intermission." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-a357c874ee" data-kw="">
<blockquote><p>Col. 3:16, ‘Let the word of Christ dwell in you richly in all wisdom, teaching and admonishing one another in Psalms, hymns, and spiritual songs, singing with grace in your hearts to the Lord,’ etc. He did not here mean (in this place) any new Psalms or hymns, for he bade them admonish each other in those Psalms and hymns; therefore those Psalms and hymns were then Canonical: although I could wish that upon some occasion (were it not for startling the weak in knowledge) that some preacher that were a solid man, would frame a Psalm for that special occasion (for he that can make a prayer according to the Word, is able also to make a Psalm) but this I think would be inconvenient; but this is fit to be done, viz. the preacher himself should fit a Psalm out of the Book of Psalms for the several occasions, and suitable to his sermon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-palmer.html">George Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sectaries Unmasked and Confuted, by the treating upon diverse points of doctrine in debate betwixt the Presbyterialists and Sectarists, Anabaptists, Independents, and Papists</cite>, (London, 1647), p. 45. Palmer was an English presbyterian. The concession that Palmer makes below actually shows that such a practice as composing a hymn upon a special occasion was not in fact being done.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Col. 3:16, ‘Let the word of Christ dwell in you richly in all wisdom, teaching and admonishing one another in Psalms, hymns, and spiritual songs, singing with grace in your hearts to the Lord,’ etc. He did not here mean (in this place) any new Psalms or hymns, for he bade them admonish each other in those Psalms and hymns; therefore those Psalms and hymns were then Canonical: although I could wish that upon some occasion (were it not for startling the weak in knowledge) that some preacher that were a solid man, would frame a Psalm for that special occasion (for he that can make a prayer according to the Word, is able also to make a Psalm) but this I think would be inconvenient; but this is fit to be done, viz. the preacher himself should fit a Psalm out of the Book of Psalms for the several occasions, and suitable to his sermon.”

nk</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Col.%203%3A16%2C%20%E2%80%98Let%20the%20word%20of,occasions%2C%20and%20suitable%20to%20his%20sermon&amp;text=Col.%203%3A16%2C%20%E2%80%98Let%20the%20word%20of%20Christ%20dwell&amp;text=the%20several%20occasions%2C%20and%20suitable%20to%20his%20sermon" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74fab6d43f" data-kw="">
<blockquote><p>The worship of God is commanded by our assemblies to be in private families, as catechizing by the master of the family (or some other better gifted in every family; Deut. 6:6-8; Gen. 18:19; Eph. 6:1-3; 2 Tim. 3:15), and praying (Zech. 12:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 20, 13th Article, ‘Private Worship’, p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-da8993a229" data-kw="">
<blockquote><p>One of the main reasons that the Dutch church in this country [of America] returned to its independent status [from the national Dutch Church] in 1857 was dissatisfaction with the status of that church’s psalmody. Consequently, when the Christian Reformed Church was formed in 1857, it reaffirmed its commitment to the Psalms. Until its revision in 1932, Article 69 of the Church Order of the Christian Reformed Church read: In the churches only the 150 Psalms of David, the Ten Commandments, the Lord’s Prayer, the Twelve Articles of Faith, the Songs of Mary, Zacharias, and Simoen, the Morning and Evening Hymns, and the hymn of Prayer before the Sermon, shall be sung.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, p. 219</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-653b7211b4" data-kw="">
<blockquote><p>It is storied of Caius Marius Victorius, who lived about three hundred years after Christ, and to his old age continued a Pagan; but at last being convinced of the Christian verity, he came to Simplicianus, and told him he would be a Christian; but neither he nor the church could believe it, it being so rare an example for any to be converted at his age; but at last seeing it was real, there was a shouting and gladness, and singing of psalms in all churches; the people crying, Caius Marius Victorius. is become a Christian!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 5, ‘Husbandry Spiritualized’, p. 120</span></figcaption>

</figure><figure class="quote" id="q-418dcaee1c" data-kw="">

<blockquote><p>James Dick gives political conservatives some schooling on the pernicious nature of national constitutions that do not recognise Christ’s Lordship:‎

[A] national constitution if it be not according to the will of Christ, is, notwithstanding verbal professions to the contrary, at variance with His will, and so, being shaped in rebellion against Him and in rejection of the wise principles of His kingdom, it leads to rebellion and to the casting off, one by one, of the cords of His authority, which national traditions or national sentiment may have for a time retained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Civil rulers serving the Lord: or, the scriptural doctrine of national religion. A sermon, at the opening of the Reformed Presbyterian Synod of Scotland May 15th, 1882</cite>, (Edinburgh, 1882), p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>If we will well flee sin, let us keep us as far from it, as we can, and take heed not only to touch it, but also to come near it, for it is so infectious a plague, and so stinking and dangerous a poison, that although one keep himself back from it so far as is possible, yet can he not avoid, but that he shall be infected &amp; corrupted therewith. A man cannot have so small acquaintance therewith, but that immediately it will be turned into over great familiarity and boldness, and then into a customer, which cannot be shaken off: as we see it by experience in all sorts of sin.

And to know these more plainly, let us take one example which may serve us for all the rest, and which shall be very agreeable to the matter, we have in hand; let us consider by what way a harlot cometh to the last step of infamy and abomination: she slippeth not, nor slideth away like an eel as a common harlot at the first day, but first she beginneth to wander a little out of the bonds of modesty, shamefastness, and honesty, which ought to be in a woman that is virtuous and full of the fear of God: she delighteth to hear &amp; speak dishonest and infamous words, and to sing filthy and wicked songs: she taketh pleasure in dances, and to be conversant amongst lusty youths, and feedeth her eyes with their gesture &amp; countenances, &amp; her ears to hear their amorous and lascivious talk: after she hath once abandoned her eyes and ears, she is no longer whole and chaste.

For we cannot think that woman truly chaste, which is not so in heart and mind, and in all parts and members of her body, they that know what honesty and chastity is, will judge hereof in this sort, for they cannot call things, but by their name: but they which take pleasure in such pastimes, as harlots, and such other worldlings, carnal folks, and courtesans, which can disguise and change the names of things, will not call these lascivious love tricks wicked wantonness, but civility and courtesy, notwithstanding whatsoever name, men give to the thing, yet shall it be always, what it is, and shall not change the nature, for the alteration and change of names: seeing then the eyes &amp; ears are already won, the other parts are not very sure: after these follow other dalliances as tickings or toyings, which defile the body yet somewhat more and more enflameth to whoredom:

[W]hen chastity is once violated so far, it will go hard, if in short space it perish not altogether, and that whoredom follow not incontinently thereupon, notwithstanding at the beginning there will be some shame fastness, which will keep it secret: but after by process of time and long custom, this shamefastness will fall by little and little, so that the secret harlot will become altogether impudent without any shame at all, or fear of God or man. As much may we say of all other sins: for it is all one reason: By little steps a man cometh to the heap and depth of sin: But I have willingly taken the example of whoredom, because it is most like unto idolatry.</p></blockquote>

<blockquote><p>Fourthly, it may inform us, if our God be so holy and pure, then his worship also must be pure. What should a pure God do with an impure and mixed worship? He will have no plowing with an ox and an ass… Dt. 22:10-11. There is no serving Him and idols too, Josh. 24:19. He tells these idolaters, ‘Ye cannot serve the Lord, for He is an holy and a jealous God’ that can endure no co-rival in his worship. He will have all done there according to the pattern; we must set up nothing in his worship without the warrant of his Word, Mt. 28:20. Whatsoever He commands, not whatsoever men command, must we observe to do. God’s courts are courts of holiness and therefore no uncleanness must be set up there, Isa. 62:9… Fifthly, it informs us that the persons must be pure: As the worship must be pure, so must the worshippers; The God of purity must have pure servants: the fountain of holiness will have none but holy followers. It is a disgrace to an eminent holy man to have a bastard lay claim to him. Ps. 50:16, To the wicked says God, ‘What hast thou to do to declare my statutes?’ Whenever we come to worship this glorious God, we must wash our hands in innocency, Ps. 26:6, and purge our families from sin, as Jacob did his from idols before he went to Bethel, Gen. 35:1-3. The people must be sanctified and prepared before the Lord will deliver his holy Law unto them; then and not tell then does God speak, Ex. 19:14-15 compared with 20:1. He will not take a wicked man by the hand. What communion has light with darkness, purity with impurity, virtue with vice, beauty with deformity, life with death, or the chiefest good with the foulest evil? There must be always a purging of our hearts from sin before we draw nigh to God in praying, hearing, sacraments, etc. else the Lord will abhor both us and our duties, and will answer us according to our idols, Eze. 14:3-4. Under the Law, if any man came to offer a sacrifice with his uncleanness on him, he must be cut off; there must be washing and cleansing before he came; so in all our approaches to God in duty there must be not only a habitual, but also an actual fitting and preparing of ourselves for the work. Therefore when James (4:8) had commanded us to draw nigh to God, he presently adds, ‘Cleanse your hands ye sinners, and purify your hearts.’ Our hearts are not fit to serve the living God till they be purged from dead works, Heb. 9:14; God will not vouchsafe to reason with us, nor to have any communion with us, till we have first washed ourselves and made us clean; Isa. 1:16-18, ‘Then come let us reason together.’ The Lord will be worshipped in the beauty of holiness or not at all, Ps. 96:9, there is no pleasing Him without it, and none that ever had it in truth but pleased him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Holiness</cite>, … (London: 1655), ch. 2, pp. 44-47</span></figcaption>

— Thomas Hall, The Beauty of Holiness, … (London: 1655), ch. 2, pp. 44-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFourthly%2C+it+may+inform+us%2C+if+our+God+be+so+holy+and+pure%2C+then+his+worship+also+must+be+pure.+What+should+a+pure+God+do+with+an+impure+and+mixed+worship%3F+He+will+have+no+plowing+with+an+ox+and+an+ass%E2%80%A6+Dt.+22%3A10-11.+There+is+no+serving+Him+and+idols+too%2C+Josh.+24%3A19.+He+tells+these+idolaters%2C+%E2%80%98Ye+cannot+serve+the+Lord%2C+for+He+is+an+holy+and+a+jealous+God%E2%80%99+that+can+endure+no+co-rival+in+his+worship.+He+will+have+all+done+there+according+to+the+pattern%3B+we+must+set+up+nothing+in+his+worship+without+the+warrant+of+his+Word%2C+Mt.+28%3A20.+Whatsoever+He+commands%2C+not+whatsoever+men+command%2C+must+we+observe+to+do.+God%E2%80%99s+courts+are+courts+of+holiness+and+therefore+no+uncleanness+must+be+set+up+there%2C+Isa.+62%3A9%E2%80%A6+Fifthly%2C+it+informs+us+that+the+persons+must+be+pure%3A+As+the+worship+must+be+pure%2C+so+must+the+worshippers%3B+The+God+of+purity+must+have+pure+servants%3A+the+fountain+of+holiness+will+have+none+but+holy+followers.+It+is+a+disgrace+to+an+eminent+holy+man+to+have+a+bastard+lay+claim+to+him.+Ps.+50%3A16%2C+To+the+wicked+says+God%2C+%E2%80%98What+hast+thou+to+do+to+declare+my+statutes%3F%E2%80%99+Whenever+we+come+to+worship+this+glorious+God%2C+we+must+wash+our+hands+in+innocency%2C+Ps.+26%3A6%2C+and+purge+our+families+from+sin%2C+as+Jacob+did+his+from+idols+before+he+went+to+Bethel%2C+Gen.+35%3A1-3.+The+people+must+be+sanctified+and+prepared+before+the+Lord+will+deliver+his+holy+Law+unto+them%3B+then+and+not+tell+then+does+God+speak%2C+Ex.+19%3A14-15+compared+with+20%3A1.+He+will+not+take+a+wicked+man+by+the+hand.+What+communion+has+light+with+darkness%2C+purity+with+impurity%2C+virtue+with+vice%2C+beauty+with+deformity%2C+life+with+death%2C+or+the+chiefest+good+with+the+foulest+evil%3F+There+must+be+always+a+purging+of+our+hearts+from+sin+befor <blockquote><p>When therefore you meet with those that fear God, make improvement of the communion of saints, not only by communicating in natural, and temporal good things as you are able, and as there is need; but especially in the communion of things spiritual, edifying yourselves in your most holy faith, by holy speech and conference, and in due time and place) in reading the holy Scriptures &amp; good books, and by prayer, and singing of Psalms together (Col. 3:16, Rules of singing). That your singing may please God, and edify yourself and others, observe these: Sing as in Gods sight, and, in matter of prayer &amp; praise speak of God in singing. The matter of your song must be spiritual, either indited by the Spirit, or composed of matter agreeing thereunto (Col. 3:16). You must sing with understanding. You must sing with judgement, being able in private to make choice of Psalms befitting the present times and occasions; And both in private and public to apply the Psalm sung to your own particular, as when and how to pray and praise in the words of the Psalm, taking heed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, … (London, 1631), ch. 9, ‘Of keeping Company, as in the sight of God’, section 3, p. 236-7. While Scudder in the passage immediately below allows Col. 3:16 to speak of uninspired compositions in the context of private or social conference, yet the only reference in the book to the content of the Church’s public praise is to ‘psalms’ simply, as is documented below.</span></figcaption>

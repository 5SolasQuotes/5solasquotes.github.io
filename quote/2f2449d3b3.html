<main class="wrap"><figure class="quote" id="q-2f2449d3b3" data-kw="">
<blockquote><p>Why does the [Larger] Catechism place glorifying God before enjoying God?

Because the most important element in the purpose of human life is glorifying God, while enjoying God is strictly subordinate to glorifying God. In our religious life, we should always place the chief emphasis on glorifying God. The person who does this will truly enjoy God, both here and hereafter.

But the person who thinks of enjoying God apart from glorifying God is in danger of supposing that God exists for man instead of man for God. To stress enjoying God more than glorifying God will result in a falsely mystical or emotional type of religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Studies in the Larger Catechism of the Westminster Assembly in Blue Banner Faith and Life</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

<blockquote><p>22. Regarding its first moment regeneration happens instantaneously. Theologians are accustomed to distinguish regeneration from justification in this respect: namely, that regeneration is simlutaneously and at once whole, whereas justification is not simultaneously and at once whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse</cite>, (1644) | ch. 14, ‘On Regeneration’, pp. 246-47 [translation has been emended]</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72955c6db7" data-kw="">
<blockquote><p>Verse 24, ‘You see therefore, that by works a man is justified, and not by faith only?’ This passage is easily reconciled with those things which Paul seems to argue to the contrary everywhere, if we establish, which is most true, that the apostle James is not dealing here with one single justification, which is accomplished partly by faith, partly by works, but with two distinct ones, of which the former is from faith and from faith only; the latter is from works. For since a twofold accusation is brought against the faithful, one from God, the law and conscience, by which they are held guilty of many sins; the other from the Devil and the wicked, by whom they are falsely accused of hypocrisy, a mercenary spirit, impiety and heinous crimes, a twofold justification is required: One by which, though truly sinners in themselves, they are absolved freely for Christ’s sake from the guilt of their sins, which justification is by faith alone without works. The other, by which, as truly sanctified and regenerated, they are absolved from those false accusations of the Devil and the wicked, which justification is sought from works. James urges that both must be joined, and therefore that man is not justified by faith only, but also by works. That is, it is not sufficient that he be justified by faith from the sins he has committed, but it is further required that he be justified also by works from the sins of which he is falsely accused, and from which he is immune through regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans</cite>, … to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on James 2:24, p. 215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“Verse 24, ‘You see therefore, that by works a man is justified, and not by faith only?’ This passage is easily reconciled with those things which Paul seems to argue to the contrary everywhere, if we establish, which is most true, that the apostle James is not dealing here with one single justification, which is accomplished partly by faith, partly by works, but with two distinct ones, of which the former is from faith and from faith only; the latter is from works. For since a twofold accusation is brought against the faithful, one from God, the law and conscience, by which they are held guilty of many sins; the other from the Devil and the wicked, by whom they are falsely accused of hypocrisy, a mercenary spirit, impiety and heinous crimes, a twofold justification is required: One by which, though truly sinners in themselves, they are absolved freely for Christ’s sake from the guilt of their sins, which justification is by faith alone without works. The other, by which, as truly sanctified and regenerated, they are absolved from those false accusations of the Devil and the wicked, which justification is sought from works. James urges that both must be joined, and therefore that man is not justified by faith only, but also by works. That is, it is not sufficient that he be justified by faith from the sins he has committed, but it is further required that he be justified also by works from the sins of which he is falsely accused, and from which he is immune through regeneration.”

— Ludovicus de Dieu, Animadversions on Romans… to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on James 2:24, p. 215">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVerse+24%2C+%E2%80%98You+see+therefore%2C+that+by+works+a+man+is+justified%2C+and+not+by+faith+only%3F%E2%80%99+This+passage+is+easily+reconciled+with+those+things+which+Paul+seems+to+argue+to+the+contrary+everywhere%2C+if+we+establish%2C+which+is+most+true%2C+that+the+apostle+James+is+not+dealing+here+with+one+single+justification%2C+which+is+accomplished+partly+by+faith%2C+partly+by+works%2C+but+with+two+distinct+ones%2C+of+which+the+former+is+from+faith+and+from+faith+only%3B+the+latter+is+from+works.+For+since+a+twofold+accusation+is+brought+against+the+faithful%2C+one+from+God%2C+the+law+and+conscience%2C+by+which+they+are+held+guilty+of+many+sins%3B+the+other+from+the+Devil+and+the+wicked%2C+by+whom+they+are+falsely+accused+of+hypocrisy%2C+a+mercenary+spirit%2C+impiety+and+heinous+crimes%2C+a+twofold+justification+is+required%3A+One+by+which%2C+though+truly+sinners+in+themselves%2C+they+are+absolved+freely+for+Christ%E2%80%99s+sake+from+the+guilt+of+their+sins%2C+which+justification+is+by+faith+alone+without+works.+The+other%2C+by+which%2C+as+truly+sanctified+and+regenerated%2C+they+are+absolved+from+those+false+accusations+of+the+Devil+and+the+wicked%2C+which+justification+is+sought+from+works.+James+urges+that+both+must+be+joined%2C+and+therefore+that+man+is+not+justified+by+faith+only%2C+but+also+by+works.+That+is%2C+it+is+not+sufficient+that+he+be+justified+by+faith+from+the+sins+he+has+committed%2C+but+it+is+further+required+that+he+be+justified+also+by+works+from+the+sins+of+which+he+is+falsely+accused%2C+and+from+which+he+is+immune+through+regeneration.%E2%80%9D%0A%0A%E2%80%94+Ludovicus+de+Dieu%2C+Animadversions+on+Romans%E2%80%A6+to+which+is+added%2C+a+Gleaning+on+the+rest+of+the+same+Apostle%E2%80%99s%2C+as+well+as+the+Catholic+Epistles+%28Leiden%3A+Elzeviers%2C+1646%29+de+Dieu+%281590-1642%29+was+a+Dutch+reformed+minister+and+a+leading+orientalist.+%7C+on+James+2%3A24%2C+p.+215&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72955c6db7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72955c6db7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Verse%2024%2C%20%E2%80%98You%20see%20therefore%2C%20that,which%20he%20is%20immune%20through%20regeneration&amp;text=Verse%2024%2C%20%E2%80%98You%20see%20therefore%2C%20that%20by%20works&amp;text=and%20from%20which%20he%20is%20immune%20through%20regeneration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4687edc845" data-kw="">
<blockquote><p>…those [who err] who imagine that a faithful and regenerate man, by committing any crime or grievous sin, does for a sin loose his faith and justification. And of this first assertion there seem also to be two degrees. For when they say that a faithful man by committing a grievous sin does loose his faith, they mean either the act of faith only or the habit [the abiding principle of it] also. If the act only, which is [for the person] to believe [the] remission of [his] sin, and namely of that crime which he has committed, and whereof he has not as yet repented, we acknowledge that that act of faith when a man is fallen into a great sin is interrupted, until he rise again by repentance. But here is their error in that they think, because the act of faith is interrupted, that therefore there is an intercession of justification and reconciliation with God, and a falling from the state of grace and salvation, into the fearful state of damnation. Unless for the qualifying of their opinion they shall say that they speak not of justification in foro caelesti, ‘in the court of heaven,’ but in foro conscientiae, ‘in the court of their conscience,’ and of falling for a time from the assurance of salvation into the guilt of damnation, which if they shall avouch, there shall not need to be any controversy betwixt us. For we do confess that a man cannot be assured of the remission of any crime whilst he continues in it without repentance: and that howsoever there is no condemnation to them that are in Christ Jesus; yet a faithful man by committing any crime incurs the anger of God and provokes his judgments and not only deserves damnation, and is in himself guilty, or contracts the guilt of death, but many times also by the terror and trouble of his own conscience, aggravated partly by afflictions, partly by spiritual desertions and partly by the temptation of Satan, is, in his own opinion, in the state of damnation. But if we will speak properly, justification is to be considered an act of God, for it is God that justifies, and such an act as depends upon his eternal counsel and proceed[s] from his grace given unto us in Christ before all secular times [before the foundation of the world]. For whom He elects, them He calls, and whom He calls according to his purpose, them and no other He justifies, and whom He justifies, them and all them He glorifies. This act of God, which from our effectual vocation is continued to our glorification, is not interrupted, though the act of faith, which is the apprehension of it, be interrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace, or an Exposition upon Luke 1:73-75</cite>, (Dublin, 1631), ch. 5, pp. 290-91</span></figcaption>

</figure><figure class="quote" id="q-993551a145" data-kw="">
<blockquote><p>And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

</figure><figure class="quote" id="q-7c686c264f" data-kw="">
<blockquote><p>Justification is one, and immovable: That it is, and in what way XVIII. The justification taught so far is certainly one, and only one, first (1) by reason of the immutable divine decree (Gal. 3:8; Rom. 8:30), so that, just as all things are (Acts 15:18) so also the number of those to be justified, the abstract number as well as the concrete number, is known to him from eternity (2 Tim. 2:19), although from this eternal decree it ought not to be said that he justified actually from eternity (Gal. 3:8). (2) By reason of Christ, on whom, as the common principle and head of those to be justified, God placed each and every sin of each and every elect person, once and for all (2 Cor. 5:19). Finally, (3) also by reason of himself, insofar as after faith, once it is begun, it will continue without any interruption for eternity, nor will the sins of those once truly justified ever be actually revived again, although by succeeding sins they deserve to be revived (Ezek. 18:24). Yet this is so by such a unity that consists in flux, insofar as to individual sins, as soon as they have been perpetrated, after particular faith and repentance, the satisfaction and merits of Christ must be applied individually. And for this reason, as we have already taught, it has its own stages: (a) its beginning, which happens immediately after the first act of faith (John 3:16; 1:12); (b) its continuation, which is accomplished through continued acts of believing and repenting, according to the repetition and renewal of sins (2 Sam. 12:13); (c) its consummation, which will be accomplished before the tribunal as if by the living voice of the Judge (Matt. 25:34). And so also each person once justified can be, from faith and repentance, by virtue of the unmoved promise of God, infallibly certain of his own justification (John 3:16; Acts 10:43), because God cannot lie (Titus 1:2; Heb. 6:17–18).</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“Justification is one, and immovable: That it is, and in what way XVIII. The justification taught so far is certainly one, and only one, first (1) by reason of the immutable divine decree (Gal. 3:8; Rom. 8:30), so that, just as all things are (Acts 15:18) so also the number of those to be justified, the abstract number as well as the concrete number, is known to him from eternity (2 Tim. 2:19), although from this eternal decree it ought not to be said that he justified actually from eternity (Gal. 3:8). (2) By reason of Christ, on whom, as the common principle and head of those to be justified, God placed each and every sin of each and every elect person, once and for all (2 Cor. 5:19). Finally, (3) also by reason of himself, insofar as after faith, once it is begun, it will continue without any interruption for eternity, nor will the sins of those once truly justified ever be actually revived again, although by succeeding sins they deserve to be revived (Ezek. 18:24). Yet this is so by such a unity that consists in flux, insofar as to individual sins, as soon as they have been perpetrated, after particular faith and repentance, the satisfaction and merits of Christ must be applied individually. And for this reason, as we have already taught, it has its own stages: (a) its beginning, which happens immediately after the first act of faith (John 3:16; 1:12); (b) its continuation, which is accomplished through continued acts of believing and repenting, according to the repetition and renewal of sins (2 Sam. 12:13); (c) its consummation, which will be accomplished before the tribunal as if by the living voice of the Judge (Matt. 25:34). And so also each person once justified can be, from faith and repentance, by virtue of the unmoved promise of God, infallibly certain of his own justification (John 3:16; Acts 10:43), because God cannot lie (Titus 1:2; Heb. 6:17–18).”

— Petrus van Mastricht, Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 124">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+is+one%2C+and+immovable%3A+That+it+is%2C+and+in+what+way+XVIII.+The+justification+taught+so+far+is+certainly+one%2C+and+only+one%2C+first+%281%29+by+reason+of+the+immutable+divine+decree+%28Gal.+3%3A8%3B+Rom.+8%3A30%29%2C+so+that%2C+just+as+all+things+are+%28Acts+15%3A18%29+so+also+the+number+of+those+to+be+justified%2C+the+abstract+number+as+well+as+the+concrete+number%2C+is+known+to+him+from+eternity+%282+Tim.+2%3A19%29%2C+although+from+this+eternal+decree+it+ought+not+to+be+said+that+he+justified+actually+from+eternity+%28Gal.+3%3A8%29.+%282%29+By+reason+of+Christ%2C+on+whom%2C+as+the+common+principle+and+head+of+those+to+be+justified%2C+God+placed+each+and+every+sin+of+each+and+every+elect+person%2C+once+and+for+all+%282+Cor.+5%3A19%29.+Finally%2C+%283%29+also+by+reason+of+himself%2C+insofar+as+after+faith%2C+once+it+is+begun%2C+it+will+continue+without+any+interruption+for+eternity%2C+nor+will+the+sins+of+those+once+truly+justified+ever+be+actually+revived+again%2C+although+by+succeeding+sins+they+deserve+to+be+revived+%28Ezek.+18%3A24%29.+Yet+this+is+so+by+such+a+unity+that+consists+in+flux%2C+insofar+as+to+individual+sins%2C+as+soon+as+they+have+been+perpetrated%2C+after+particular+faith+and+repentance%2C+the+satisfaction+and+merits+of+Christ+must+be+applied+individually.+And+for+this+reason%2C+as+we+have+already+taught%2C+it+has+its+own+stages%3A+%28a%29+its+beginning%2C+which+happens+immediately+after+the+first+act+of+faith+%28John+3%3A16%3B+1%3A12%29%3B+%28b%29+its+continuation%2C+which+is+accomplished+through+continued+acts+of+believing+and+repenting%2C+according+to+the+repetition+and+renewal+of+sins+%282+Sam.+12%3A13%29%3B+%28c%29+its+consummation%2C+which+will+be+accomplished+before+the+tribunal+as+if+by+the+living+voice+of+the+Judge+%28Matt.+25%3A34%29.+And+so+also+each+person+once+justified+can+be%2C+from+faith+and+repentance%2C+by+virtue+of+the+unmoved+promise+of+God%2C+infallibly+certain+of+his+own+justification+%28John+3%3A16%3B+Acts+10%3A43%29%2C+because+God+cannot+lie+%28Titus+1%3A2%3B+Heb.+6%3A17%E2%80%9318%29.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%282nd+ed.+1698%3B+RHB%29%2C+vol.+5%2C+pt.+1%2C+bk.+6%2C+ch.+6%2C+%E2%80%98The+Justification+of+those+to+be+Redeemed%E2%80%99%2C+p.+124&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c686c264f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7c686c264f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=Justification%20is%20one%2C%20and%20immovable%3A%20That,cannot%20lie%20%28Titus%201%3A2%3B%20Heb.%206%3A17%E2%80%9318&amp;text=Justification%20is%20one%2C%20and%20immovable%3A%20That%20it%20is&amp;text=because%20God%20cannot%20lie%20%28Titus%201%3A2%3B%20Heb.%206%3A17%E2%80%9318" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

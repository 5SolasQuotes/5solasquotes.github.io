<main class="wrap"><figure class="quote" id="q-2e9a0f1074" data-kw="" data-pol="">
<blockquote><p>We constantly want to justify ourselves before God, to be good enough without Christ. But God does not want us to trust in our goodness. He does not want us to make up for our past sins through present obedience. He does not want us to think that we are good enough to go to heaven by comparing ourselves to the Hitlers and Stalins of the world. Comparisons are useless when it comes to establishing righteousness before God. God crucified His one and only Son for our justification, and He wants us to trust in Him alone. When it comes to being justified, faith plus anything else is quicksand. The only ground for right standing before God is Christ Jesus grabbed ahold of by faith.</p></blockquote>
<figcaption>— <a href="../authors/jay-harvey.html">Jay Harvey</a>, <cite>Don’t Call it a Comeback</cite>, p. 101</figcaption>
<div class="meta"><a class="tag" href="../topics/salvation/justification.html">Justification</a></div>

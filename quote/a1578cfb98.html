<main class="wrap"><figure class="quote" id="q-a1578cfb98" data-kw="">
<blockquote><p>The parts of the Epistle, besides the beginning and conclusion, are two. The first shows the only and spiritual ground of sinners’ Justification by faith in Christ, to Chap. 12.

The other part treats concerning the holy course of life, which justified persons should live; to the end of the Chapter.

That which appertains to the first part, presently after the beginning of the Epistle, the Apostle undertakes to prove, THAT NO MAN CAN BE JUSTIFIED BY INHERENT RIGHTEOUSNESS, BUT BY THE RIGHTEOUSNESS OF CHRIST ONLY, APPREHENDED BY FAITH ALONE, AND FREELY OF HIS GRACE IMPUTED, BY GOD, TO US THAT BELIEVE.

This Position he proves by ten Arguments; whereof the two first are in the first Chapter. The third in the second Chapter; the seven other in the third Chapter.

To the further fixing of these Arguments, he sub-joins a sevenfold proof of this doctrine

The FIRST is, That Abraham was justified by Faith alone. Chap. 4.

The SECOND is, That this only reason of our justification, affords us comfort against the just anger of God, and original sin, the poison which Adam derived upon us. Chap. 5.

The THIRD is, That this ground of our justification very much conduces to promote sanctification in them that are justified. Chap. 6.

The FOURTH is, That this ground of our justification only yields comfort to the afflicted consciences of them that are justified upon their imperfect obedience, and the reliques of sin dwelling in them. Chap. 7.

The FIFTH is, That this ground of our justification fenceth those that are justified, and sanctified, not only against condemnation, or all the evils to be feared after this life; but also confirms and comforts against all the troubles and afflictions, to which the Children of God are obnoxious in this life. Chap. 8.

The SIXTH proof is, That by experience it is found, that the Jews seeking righteousness from their works, fall short of it; and that the Gentiles, destitute of all shew of inherent righteousness, by faith in Jesus Christ, have obtained true and saving righteousness. Chap. 9. Where, from occasion of the Jews cutting off, election and reprobation is handled.

The which rejection of the Jews, being apparent and manifest to all the Churches, (because of their foolish incredulity and obstinacy) he proves to be just. Chap. 10.

Yet all the Jews not to be despised, because the obstinacy of that Nation is to last but for a time, which he shews. Chap. 11.

In the other part of the Epistle, wherein he treats of sanctification in the lives of all those that are justified, (1) After a serious obtestation, that all who are justified should consecrate themselves unto God, and all the Ministers of the Gospel, maintaining peace amongst themselves, every one according to his ability should promote the sanctification and salvation of the faithful; He gives general Precepts about Sanctity. Chap. 12. (2) He descends to more special duties towards the Magistrate, and their neighbours of all degrees, according to the Law of Charity. Chap. 13. (3) He handles the mutual duties of the faithful, in a prudent use of their Christian liberty. Chap. 14. and in the former part of Chap. 15.

Lastly, Assuring the Romans of his love, and authority, in the remaining part of Chapter 15. with salutations of the Saints, he concludes his Epistle. Chap. 16.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39c2e2c7c7" data-kw="">
<blockquote><p>I. Faith taken theologically in general is the assent which we give to God speaking, when we are certainly persuaded that something is true, moved to that by Divine Authority. And by this faith is distinguished from opinion, which is a timid and uncertain assent. Likewise from knowledge, which is indeed a certain assent; but one which rests on demonstration or some evident argument, not truly on anyone’s testimony. Finally, from human faith, which acquiesces in the authority of men.

II. Therefore not every assent, even applied to those things which are contained in the Word of God, should be considered faith. For if someone certainly and firmly holds some dogma of religion, such as the creation of all things out of nothing: yet not impelled to that by divine revelation, but by some reason which seems necessary to him, to that extent he does not have faith… … XXIX. Certainly those who place faith also in the will are moved to that because they confuse trust with faith, and think trust is the principal act of faith and as it were its form. But in that they are deceived, or do not speak accurately enough. For trust is an effect of faith, not truly an act and form of faith. And if we want to speak properly, trust pertains to hope, not to faith. For it is nothing other than hope strengthened and confirmed. And certainly the apostle manifestly distinguishes trust from faith in Eph. 3:12, “In Christ,” he says, “we have boldness and access with confidence through faith in him.” Where faith is placed as the cause of trust or confidence, since we are said to have trust or confidence through faith: which would be said absurdly if trust and faith were the same thing. For this being posited, the sense of the passage would be, “Through trust we have trust”; which is nugatory.</p></blockquote>

</figure><figure class="quote" id="q-f6cbf50387" data-kw="Justification">
<blockquote><p>Those whom God effectually calls, he also freely justifies, not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous; not for anything wrought in them, or done by them, but for Christ&#x27;s sake alone; not by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing Christ&#x27;s active obedience unto the whole law, and passive obedience in his death for their whole and sole righteousness by faith, which faith they have not of themselves; it is the gift of God.</p></blockquote>

</figure><figure class="quote" id="q-48a87b3406" data-kw="Supererogation Imputed righteousness">
<blockquote><p>They say that good works are not of such intrinsic worth as to be sufficient to procure justification, but it is owing to accepting grace that they have this effect. Then because they are forced to confess that here the righteousness of works is always imperfect, they grant that so long as we are in this life we stand in need of the forgiveness of sin in order to supply the deficiency of works, but that the faults which are committed are compensated by works of supererogation. I answer, that the grace which they call accepting, is nothing else than the free goodness with which the Father embraces us in Christ when he clothes us with the innocence of Christ, and accepts it as ours, so that in consideration of it he regards us as holy, pure, and innocent. For the righteousness of Christ (as it alone is perfect, so it alone can stand the scrutiny of God) must be sisted for us, and as a surety represent us judicially.</p></blockquote>

</figure><figure class="quote" id="q-63d7fca270" data-kw="">
<blockquote><p>23. This orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: …

2. Of the Pontificals:

1. Who interpret justification as justification [i.e., a making just] rather than justihabition [i.e., a holding just]; who press inherent righteousness and assail imputed righteousness as putative; who confound the righteousness of the cause and of the person, the legal and the evangelical, and weave a patchwork from both; and who thereby divide the business of justification between God and man, grace and free will. Who partition justification into a First and a Second: to the former they build up preparations and merits of congruity; to the latter they lay as foundation merits of condignity.

2. Who confound justifying faith with other species of faith; who deny that fiducial apprehension of Christ; who maintain it to be separable from charity, not only actual but also habitual; who contend that faith justifies only initially and incipiently, but good works completively.

3. Who deny either the perfection, or the stability, or the sense of justification in the justified, and heap up entire cartloads of errors in this place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

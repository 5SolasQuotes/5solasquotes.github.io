</figure><figure class="quote" id="q-da668ac3be" data-kw="">
<blockquote><p>The formal cause, they say, is the justice of God; not that justice, whereby he himself is just; but that which he communicateth unto us, whereby we truly both are counted just, and also are so indeed. By which words they understand the renewing of a man now regenerate, and his new forming by grace and the holy Ghost. The which things, that they are done in a man already justified, we deny not: but that justification consisteth therein, we cannot grant.</p></blockquote>

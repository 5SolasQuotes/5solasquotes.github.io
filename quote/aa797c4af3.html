<main class="wrap"><figure class="quote" id="q-aa797c4af3" data-kw="">
<blockquote><p>The holy scriptures are the sure foundation upon which our subordinate standards are built, and by which they are well supported and established. Let the thousands of sinners know, that you have professed your faith in the doctrines, the whole doctrines contained in the Confession and Catechisms; and that you have come under a most solemn vow, that you will maintain and defend these doctrines.

Having opened your mouth unto the Lord, you must by no means violate such solemn engagements, even to please thousands of sinners; you must not do evil, that good may come. Backsliding and apostacy are not appointed means for gaining thousands of sinners to the love of the truth as it is in Jesus. We have no reason to expect his blessing, but his threatened curse to attend such sinful conduct, Zech. v. 3, 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-willis.html">William Willis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A smooth stone from the brook. Or, An humble attempt to prevent backsliding from the principles of the covenanted Church of Scotland, in some letters to the Rev. George Lawson</cite>, (Glasgow: M. Ogle, 1799), p. 38.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcd03ed59b" data-kw="">
<blockquote><p>Q. 112. What is required in the third commandment? A. The third commandment requires, That the name of God, his titles, attributes, ordinances, the word, sacraments, prayer, oaths, vows, lots,[r] his works, and whatsoever else there is whereby he makes himself known, be holily and reverently used in thought,[t] meditation,[v] word,[w] and writing;[x] by an holy profession,[y] and answerable conversation,[z] to the glory of God,[a] and the good of ourselves,[b] and others.[c] … [r] Acts 1:24,26. [s] Job 36:24. [t] Mal. 3:16. [v] Ps. 8. [w] Col. 3:17. Ps. 105:2,5. [x] Ps. 102:18. [y] 1 Pet. 3:15. Micah 4:5. [z] Phil. 1:27. [a] 1 Cor. 10:31. [b] Jer. 32:39. [c] 1 Pet. 2:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-19b096a9df" data-kw="">
<blockquote><p>Although the oath which Joshua and the princes of Israel made to the Gibeonites was made unadvisedly, and without asking counsel from the mouth of the Lord, yet, some hundred years after, being broken, that breach brought a national judgment, till justice was done upon the offenders. How much more may a national judgment be feared, if even in our days the contempt and violation of a most lawful and sacred oath be winked at? Surely God will not wink at their sin who wink at his dishonour. Better not to have vowed than not to pay and perform.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of miscellany questions</cite>, (1649; Edinburgh, 1844), p. 86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

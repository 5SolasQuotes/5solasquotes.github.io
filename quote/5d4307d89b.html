<blockquote><p>whereas having forty-two children (as one poverty stricken family had) might be considered by God to be poor stewardship since they simply were not able to feed and clothe those children? When Scripture insists that “if anyone does not provide for his own, and especially for those of his household, he has denied the faith and is worse than an unbeliever” (1 Tim. 5:8)… It might be wise for such a person to heed the admonition in Proverbs 24:27, which commands us to make financial provision for our family before we build or expand our family.</p></blockquote>

</figure><figure class="quote" id="q-5b778fc720" data-kw="">
<blockquote><p>…we cannot give an account of the whole process of generation, which consists of conception, formation or the delineation of the several parts, and animation by infusing the soul; but this we know, that it far surpasses all finite power. And without doubt Monsieur Descartes, who was so thinking a philosopher, would never have ascribed this great work to mere mechanism, but that he was unawares betrayed into it by his solving of other things by mechanic principles: So that it would be expected that he should make an uniform piece of philosophy. And thence he was, as it were, forced to go through with his work that he had begun, and to maintain that all is done mechanically, even in the production of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Demonstration of the Existence &amp; Providence of God</cite>, … (London, 1696), 2nd Part, ch. 6, pp. 109-110</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>‘and in sin has my mother conceived me’ …he having original sin from his parents, was in that sin ‘conceived’, that is, fostered and nourished in his mother’s womb, and brought forth in the same, for so largely do I take the word of ‘conceiving’, the beginning of a thing being put for the growth, proceeding and continuance of the same thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-wilcox.html">Thomas Wilcox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Very Godly &amp; Learned Exposition upon the Whole Book of Psalms</cite>, (1591), on Ps. 51, p. 151 Wilcox (c.1549-1608) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-b9ddfd8d5f" data-kw="">
<blockquote><p>In the conception of Christ we must observe and consider three things. The framing of the manhood, the sanctifying of it, and the personal union of the manhood with the Godhead. And howsoever I distinguish these three for order’s sake, yet must we know and remember, that they are all wrought at one and the same instant of time. For when the Holy Ghost frames and sanctifies the manhood in the womb of the virgin: at the very same moment it is received into the unity of the second person… As for his soul, it was not derived from the soul of the virgin Mary as a part thereof, but it was made as the souls of all other men be, of nothing by the power of God, and placed in the body; both of them from the first moment of their being, having their subsistence in the person of the son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (Cambridge, 1595), p. 157</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

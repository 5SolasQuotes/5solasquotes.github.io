<blockquote><p>Meanwhile we remark, that this principle, instead of being a principle, either of oppression on the one hand, or slavish submission on the other, is the great charter of Christian liberty, and of the elevated dignity of Christ’s freemen; while the opposite principle is not only the badge, but the instrument of tyranny on the one hand, and of slavish submission to the impositions and inventions of men on the other. It is no slavery, and no degradation to submit to the commands, and walk according to the rules prescribed by the Majesty of heaven and earth. “I will walk at liberty, because I seek thy precepts,” said David. ” Ye shall know the truth, and the truth shall make you free,” says our Lord; …

This is verified by the whole facts alike of individual and of social history, civil and ecclesiastical. That is the history of individual and monkish fanaticism? Not a history, in the first instance, of bad men, but the history of good men following their own inventions, and putting in practice their own devices, and being “wise above what was written;” and the whole issuing in the excesses of folly, and the most enormous crimes of lust and murder. What is the history of the whole gorgeous and burdensome, and even puerile, ceremonial and ritual of Rome, now being copied and imitated in the Church of England at the present moment?

Not the history of things positively forbidden by the Bible in so many words, but the history of things which are “not prescribed in Holy Scripture.” If one man is at liberty to plead for his own invention, because it is not forbidden in the Bible, why may not another do the same for his, and forthwith set it up, on the principle that all is lawful in the worship of God which is not forbidden? What right have the anti-ritualists of England, unless they adopt our principle, to disturb the public peace by their present opposition] Nay, what right have such parties to oppose the ritual of Antichrist himself?

Very different is the case when the Christian man and the Christian church can demand, ” By what Bible authority do you these things? and who gave you this authority?”

Would that the professing church of Christ—would that Christian men might seriously ponder, in the first instance, the great principle to which we have given expression in the words of the Westminster Confession of Faith. It is one which seems to us just, reasonable, and scriptural, and of unspeakable importance to the liberty and highest interests of the Christian church, and their only security against the irruptions of the Papacy, and the introduction of its worst practices into the Church of England.

We tell them, and tell all men, that history, experience, and rational reflection, show that men waste their breath against all such inventions, and gratuitously disturb the peace both of Church and State, if they cannot plead the authority of the Word of God for what they are doing; and what is more, they disturb it in vain—for ”will-worship,” sanctioned, will have its own way, and human nature, “priest and people, love to have it so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 17-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e33c54de6" data-kw="">
<blockquote><p>Those who wish to know the bearing of Scripture on human hymns as matter of God’s worship should read the two excellent little treatises, respectively entitled, The True Psalmody, and The Public Worship of God, the first of which is an American publication, and the other was penned by the late Dr. [James] Gibson.

It is enough to state here that the Psalms are as much superior to uninspired hymns as God’s Word is to man’s word, and we ought to serve God with the best; that there is no warrant for worshipping God with human hymns, and therefore we have no ground for hoping that such praise will be accepted; and, further, while admitting that metrical translations of other portions of the Bible are not to be compared with mere human hymns, the fact of God’s having gathered the Psalms, Songs and Hymns of various inspired writers into one Book of Psalms, seems conclusively to show that that Book alone was meant to serve as our manual of praise.

Christ specially referred to “the Book of Psalms,” and Paul, quoting the words, “Thou art my Son, this day have I begotten thee,” says they are “ written in the second Psalm,” thus indicating that they were then arranged in their present order. There must be some reason why the Prayer or Psalm of Moses in the 90th Psalm found a place in that Book, though his Song in the 15th chapter of Exodus did not; why David’s Psalm of thanksgiving, when the ark was brought to Zion, is reproduced in the 105th, 96th, and 106th Psalms; why the 14th and 53rd Psalms are almost exactly the same; and why the 108th Psalm is embodied in the 57th and 60th. The reason given above seems the most satisfactory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hymnology of the Scottish Reformation. I. in Original Secession Magazine</cite></span></figcaption>

<blockquote><p>In the Middle Ages Thomas not only asserted that as rational beings human beings can—without supernatural grace—know natural truths but also testifies that it is impossible for there to be “some knowledge which is totally false without any admixture of some truth” and in this connection appeals to the words of Beda and Augustine: “There is no false doctrine which does not at some time mix some truth with falsehoods.” The Reformed theologians were even better positioned to recognize this by their doctrine of common grace. By it they were protected, on the one hand, from the Pelagian error, which taught the sufficiency of natural theology and linked salvation to the sufficiency of natural theology, but could, on the other hand, recognize all the truth, beauty, and goodness that is present also in the pagan world. Science, art, moral, domestic, and societal life, etc., were derived from that common grace and acknowledged and commended with gratitude. As a rule this operation of common grace, though perceived in the life of morality and intellect, society and state, was less frequently recognized in the religions of pagans. In the latter context the Reformed only spoke of natural religion, innate and acquired, but the connection between this natural religion and the [pagan] religions was not developed. The religions were traced to deception or demonic influences. However, an operation of God’s Spirit and of his common grace is discernible not only in science and art, morality and law, but also in the religions. Calvin rightly spoke of a “seed of religion,” a “sense of divinity.” Founders of religion, after all, were not impostors or agents of Satan but men who, being religiously inclined, had to fulfill a mission to their time and people and often exerted a beneficial influence on the life of peoples. The various religions, however mixed with error they may have been, to some extent met people’s religious needs and brought consolation amidst the pain and sorrow of life. What comes to us from the pagan world are not just cries of despair but also expressions of confidence, hope, resignation, peace, submission, patience, etc. All the elements and forms that are essential to religion (a concept of God, a sense of guilt, a desire for redemption, sacrifice, priesthood, temple, cult, prayer, etc.), though corrupted, nevertheless do also occur in pagan religions. Here and there even unconscious predictions and striking expectations of a better and purer religion are voiced. Hence Christianity is not only positioned antithetically toward paganism; it is also paganism’s fulfillment. Christianity is the true religion, therefore also the highest and purest; it is the truth of all religions. What in paganism is the caricature, the living original is here. What is appearance there is essence here. What is sought there can be found here. Christianity is the explanation of “ethnicism.” Christ is the Promised One to Israel and the desire of all the Gentiles. Israel and the church are elect for the benefit of humankind. In Abraham’s seed all the nations of the earth will be blessed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, trans. John Bolt, and John Vriend (Grand Rapids, MI: Baker Academic, 2003), 1.319–20.</span></figcaption>

— Herman Bavinck, Reformed Dogmatics: God and Creation, trans. John Bolt, and John Vriend (Grand Rapids, MI: Baker Academic, 2003), 1.319–20.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+Middle+Ages+Thomas+not+only+asserted+that+as+rational+beings+human+beings+can%E2%80%94without+supernatural+grace%E2%80%94know+natural+truths+but+also+testifies+that+it+is+impossible+for+there+to+be+%E2%80%9Csome+knowledge+which+is+totally+false+without+any+admixture+of+some+truth%E2%80%9D+and+in+this+connection+appeals+to+the+words+of+Beda+and+Augustine%3A+%E2%80%9CThere+is+no+false+doctrine+which+does+not+at+some+time+mix+some+truth+with+falsehoods.%E2%80%9D+The+Reformed+theologians+were+even+better+positioned+to+recognize+this+by+their+doctrine+of+common+grace.+By+it+they+were+protected%2C+on+the+one+hand%2C+from+the+Pelagian+error%2C+which+taught+the+sufficiency+of+natural+theology+and+linked+salvation+to+the+sufficiency+of+natural+theology%2C+but+could%2C+on+the+other+hand%2C+recognize+all+the+truth%2C+beauty%2C+and+goodness+that+is+present+also+in+the+pagan+world.+Science%2C+art%2C+moral%2C+domestic%2C+and+societal+life%2C+etc.%2C+were+derived+from+that+common+grace+and+acknowledged+and+commended+with+gratitude.+As+a+rule+this+operation+of+common+grace%2C+though+perceived+in+the+life+of+morality+and+intellect%2C+society+and+state%2C+was+less+frequently+recognized+in+the+religions+of+pagans.+In+the+latter+context+the+Reformed+only+spoke+of+natural+religion%2C+innate+and+acquired%2C+but+the+connection+between+this+natural+religion+and+the+%5Bpagan%5D+religions+was+not+developed.+The+religions+were+traced+to+deception+or+demonic+influences.+However%2C+an+operation+of+God%E2%80%99s+Spirit+and+of+his+common+grace+is+discernible+not+only+in+science+and+art%2C+morality+and+law%2C+but+also+in+the+religions.+Calvin+rightly+spoke+of+a+%E2%80%9Cseed+of+religion%2C%E2%80%9D+a+%E2%80%9Csense+of+divinity.%E2%80%9D+Founders+of+religion%2C+after+all%2C+were+not+impostors+or+agents+of+Satan+but+men+who%2C+being+religiously+inclined%2C+had+to+fulfill+a+mission+to+their+time+and+people+and+often+exerted+a+beneficial+influence+on+the+life+of+peoples.+The+various+religions%2C+however+mixed+with+error+they+may+have+been%2C+to+some+extent+met+people%E2%80%99s+religious+needs+and+brought+consolation+amidst+the+pain+and+sorrow+of+life.+What+comes+to+us+from+the+pagan+world+are+not+just+cries+of+despair+but+also+expressions+of+confidence%2C+hope%2C+resignation%2C+peace%2C+submission%2C+patience%2C+etc.+All+the+elements+and+forms+that+are+essential+to+religion+%28a+concept+of+God%2C+a+sense+of+guilt%2C+a+desire+for+redemption%2C+sacrifice%2C+priesthood%2C+temple%2C+cult%2C+prayer%2C+etc.%29%2C+though+corrupted%2C+nevertheless+do+also+occur+in+pagan+religions.+Here+and+there+even+unconscious+predictions+and+striking+expectations+of+a+better+and+purer+religion+are+voiced.+Hence+Christianity+is+not+only+positioned+antithetically+toward+paganism%3B+it+is+also+paganism%E2%80%99s+fulfillment.+Christianity+is+the+true+religion%2C+therefore+also+the+highest+and+purest%3B+it+is+the+truth+of+all+religions.+What+in+paganism+is+the+caricature%2C+the+living+original+is+here.+What+is+appearance+there+is+essence+here.+What+is+sought+there+can+be+found+here.+Christianity+is+the+explanation+of+%E2%80%9Cethnicism.%E2%80%9D+Christ+is+the+Promised+One+to+Israel+and+the+desire+of+all+the+Gentiles.+Israel+and+the+church+are+elect+for+the+benefit+of+humankind.+In+Abraham%E2%80%99s+seed+all+the+nations+of+the+earth+will+be+blessed.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+trans.+John+Bolt%2C+and+John+Vriend+%28Grand+Rapids%2C+MI%3A+Baker+Academic%2C+2003%29%2C+1.319%E2%80%9320.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3db3260045.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3db3260045.html">Permalink</a><a class="src" href="https://heidelblog. <blockquote><p>For, 2. This would be acceptable to God. This ‘willing’ mind is accepted (2 Cor. 8:12), when accompanied with sincere endeavors. When men purpose that which is good, and endeavour according to their ability to perform also, God will accept of what they have, or can do, and not reject them for what they have not, and what is not in their power to do: and this is true as to other things besides the work of charity… It is accepted, indeed, where there is a performance as far as we are able, and when providence hinders the performance, as in David’s case concerning building a house for the Lord, 2 Sam. 7:1-29.</p></blockquote>

</figure><figure class="quote" id="q-e4f17b278c" data-kw="">
<blockquote><p>Legislating upon, and even against, the Word of God, is the burning, yea, the damning spot on Britain’s escutcheon. A part of the daily wailings of Cassandra, as she roamed throughout her father’s halls, is given us by the poet, thus – “Cry, Trojans, cry, a Helen and a woe.” Cassandra-like, my wail is, cry, Britain, cry, legislation upon and against the Bible, and a woe; cry, Britain, cry, the national support given to Popery, Prelacy, and Erastianism, and a woe; cry, Britain, cry, shameful Sabbath desecration, and a woe; cry, Britain, cry, the yet unconfessed and unrepented of, act of national apostacy and perjury, when the Solemn League and National Covenant were publicly burned at Linlithgow, May 29 1661 (an act acquiesced in by every church in the Three Kingdoms with the exception of the R. P. Church), and a woe! “Hear, O earth: behold, I will bring evil upon this people, even the fruit of their thoughts, because they have not hearkened unto my words, nor to my law, but rejected it” (Jer. vi. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 16.</span></figcaption>

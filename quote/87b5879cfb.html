<blockquote><p>I make a decree that in every dominion of my kingdom men must tremble and fear before the God of Daniel. Daniel 6:26

Samuel Rutherford did not believe that the decree of Darius (cited above) was evidence of conversion to the worship of the true God. He gave six reasons for this, not all of which are convincing. Nevertheless, his sixth reason flags up an interesting point:

There is nothing here of the means to instruct his people in the knowledge of the true God. And to command religion without information of the minds, is rather tyranny over the conscience, than true zeal.</p></blockquote>

</figure><figure class="quote" id="q-ccff3f6b3e" data-kw="">
<blockquote><p>Though Saul’s destroying of the Amalekites in that cause was moral, in regard ‘they lay in wait for Israel, when they came out of Egypt,’ and so of perpetual obligation, yet the destroying of them, 1 Sam. 15, is temporary and obliges not us:

1. Because that generation were their sons, not those same persons that oppressed Israel when they came out of Egypt, and we may not punish the sons for the sins of their fathers with death; therefore God’s positive command to Saul, and the reason, ‘I remember what Amalek did’ (in Moses his time) ‘therefore kill them,’ does not oblige us, except we had the like command.

2. Because the slaying of man, woman, infant and suckling, ox and sheep, was temporary and cannot have a perpetually obligatory ground in the Law of nature or natural justice obliging us.

3. Where there is an injury done to God against the Law of nature and against our brethren in drawing them from serving the true God, and a punishment commanded by God to be inflicted once; that punishment, or the like in substance and nature, must ever be such as obliges us in the like cases; The learned professors in Leiden say, ‘They can see no reason but they must oblige under the New Testament.’ I confess when the fault is ceremonial, though the punishment be real, as the cutting off of an infant not circumcised [Gen. 17:14], and some punishments inflicted on the leper, it is not reason the Law should oblige us in the New Testament, either as touching the punishment or the degree. Because these punishments for typical faults are ordained to teach rather than to be punishments, and the Magistrate by no light of nature could make laws against unbaptized infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), p. 299</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-68842f4715" data-kw="">
<blockquote><p>At a public meeting held at Edinburgh in February 1840 on the church’s spiritual independence, the Revd Alexander Moody Stuart argued that the non-intrusionists would continue to obey the magistrate in civil matters while refusing to countenance the state’s usurpation of the church’s spiritual jurisdiction:

However her own province might be interfered with – her rights disregarded or herself trampled upon – she would never therefore be provoked to interfere in the King’s secular court, or create any disturbance of any kind. How much soever we might suffer in the maintenance of our spiritual liberties, she would still not only obey the magistrate in all other things, but would obey cheerfully and without a grudge. She would rejoice in her suffering, and yet obeying. …

There was, indeed, a standard raised, bearing the inscription, – “the Lord Jesus Christ the Head of the Church,” and because we rallied around it, the world said that we were contending merely for our honour; but that standard for which we strove was planted in the very heart of the citadel of Zion, and if we lost the standard, we lost the citadel – the citadel of the living God – the city of the great King.

That for which we were now contending had from the first been the crown and glory of the Church of Scotland; for nearly three hundred years she had by grace been enabled to preserve it; and He who sits in the midst of the seven golden candlesticks, was now saying, “Behold! I come quickly; hold that fast which thou hast, that no man take thy crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-moody-stuart.html">A. Moody Stuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 26 February 1840.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-249b65165e" data-kw="">
<blockquote><p>[T]heology must be taught according to a certain method, and it must be the kind of method in which theory and practice always walk in step together. In fact, they must walk together in such a way that theory precedes and practice follows in every one of theology’s articles. For the apostle commands Timothy (1) to teach just as much as to exhort all the heads of theology. First he should certainly teach, and then he should exhort.

For this reason, (2) the covenant is spoken of as a “covenant ordered in every respect” (2 Sam. 23:5); not only is it called such because the covenant of grace is itself most well ordered, but also because its records, in which theology is preserved, present themselves as set down in a most suitable manner. For this reason, (3) the apostle says that the approved “worker” is the one who “rightly divides” the Word of truth” (2 Tim. 2:15). But one cannot divide what has not been rightly constructed. (4) The worship that theology propounds is called “reasonable” (Rom. 12:1) because it has been arranged according to the laws of right reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.III, p. 67.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

<blockquote><p>XIII. The scripture is very perspicuous in such things as be necessary to salvation; and therefore ought to be read of all.

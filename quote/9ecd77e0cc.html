<main class="wrap"><figure class="quote" id="q-9ecd77e0cc" data-kw="">
<blockquote><p>The law shows us “what manner of persons [we ought] to be in all holy conversation and godliness” (2 Peter 3:11), but it does not inform us by what means we may become such (Luke 10:27–28). Whereas, the gospel teaches us how we may be made such—namely, by union and communion with Christ in His righteousness and fullness, or by the imputation of His righteousness to us and the sanctification of His Spirit in us (Acts 16:31; 1 Cor. 1:30; 2 Cor. 5:21; Gal. 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 132–33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-0be51627bb" data-kw="">
<blockquote><p>Besides, you mistake him [Tertullian] if you think he meant by the name of ‘tradition’ a tradition of the apostles. For whatsoever custom not written in the scripture was kept by the faithful, that, because it was delivered by some body from whom the use thereof was taken, he says it came in by tradition. In so much that he affirms it both of Jewish customs before the apostles, as that their women covered their faces with vails…</p></blockquote>

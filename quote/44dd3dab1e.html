<blockquote><p>21. It is great self-condemnation in them that cannot bear to be censured, nor scarce be contradicted, yet thus to censure almost all the Church. 22. They that think that conforming ministers are guilty of great sin must consider what diversity of education, company and interest may do, even on men of conscience, and that we have all our sins. And it’s sinful uncharitableness to think and speak worse of them than they deserve and to talk against all for the faults of some. 23. So great is God’s mercy to this land in yet giving many godly able ministers to the public churches that it is sinful ingratitude to overlook or deny it, though many others be never so bad.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6867dcfd5e" data-kw="">
<blockquote><p>So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved: 1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law. 2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock. 3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">Degrees of Impurities</a></span><span class="wk"><span class="lbl">Work:</span> <cite>London Ministers | A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop.</cite>, p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-e7cf9558af" data-kw="">
<blockquote><p>God will manifest that He is displeased with such duties that thou doest perform; He will manifest it one way or other that He is a holy God, and He does not accept of such unholy things as thou doest tender up to Him; for the truth is, if God should accept of such unholy things from men, God may be said to be like unto themselves. As a man if he does entertain any as his familiar friend that is naught and wicked, it is his disgrace and dishonour… So God may employ the most wicked men in the world in some outward services, but if He should accept of them in his worship, it would be a dishonour to God, and therefore God, that He might sanctify his own name, He will manifest his displeasure at one time or other against such duties of worship you that perform worship in a formal manner and with unclean, vile hearts;</p></blockquote>

<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 328. 1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way. 2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years. 3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>

</figure><figure class="quote" id="q-e6b9a9fb6c" data-kw="">
<blockquote><p>The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign (1544) in Tracts &amp; Letters relating to the Reformation, tr. &amp; ed. Henry Beveridge, 7 vols. (Edinburgh: Calvin Translation Society, 1844), 1.189</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.”

— John Calvin, The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign (1544) in Tracts &amp; Letters relating to the Reformation, tr. &amp; ed. Henry Beveridge, 7 vols. (Edinburgh: Calvin Translation Society, 1844), 1.189">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+mockery+which+worships+God+with+nought+but+external+gestures+and+absurd+human+fictions%2C+how+could+we%2C+without+sin%2C+allow+to+pass+unrebuked%3F+We+know+how+much+He+hates+hypocrisy%2C+and+yet+in+that+fictitious+worship%2C+which+was+everywhere+in+use%2C+hypocrisy+reigned.+We+hear+how+bitter+the+terms+in+which+the+Prophets+inveigh+against+all+worship+fabricated+by+human+rashness.+But+a+good+intention%2C+i.e.+an+insane+licence+of+daring+whatever+man+pleased%2C+was+deemed+the+perfection+of+worship.+For+it+is+certain+that+in+the+whole+body+of+worship+which+had+been+estabhshed%2C+there+was+scarcely+a+single+observance+which+had+an+authoritative+sanction+from+the+Word+of+God.+We+are+not+in+this+matter+to+stand+either+by+our+own+or+by+other+men%E2%80%99s+judgments.+We+must+listen+to+the+voice+of+God%2C+and+hear+in+what+estimation+He+holds+that+profanation+of+worship+which+is+displayed+when+men%2C+overleaping+the+boundaries+of+His+Word%2C+run+riot+in+their+own+inventions.+The+reasons+which+he+assigns+for+punishing+the+Israelites+with+blindness%2C+after+they+had+lost+the+pious+and+holy+discipline+of+the+Church%2C+are+two%2C+viz.%2C+the+prevalence+of+hypocrisy%2C+and+will-worship+%28ethelothreskeian%29%2C+meaning+thereby+a+form+of+worship+contrived+by+man.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+The+Necessity+of+Reforming+the+Church%2C+Presented+to+the+Imperial+Diet+at+Spires%2C+A.D.+1544%2C+in+the+name+of+all+who+want+Christ+to+Reign+%281544%29+in+Tracts+%26+Letters+relating+to+the+Reformation%2C+tr.+%26+ed.+Henry+Beveridge%2C+7+vols.+%28Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+1.189&

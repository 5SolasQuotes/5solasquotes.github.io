<main class="wrap"><figure class="quote" id="q-8032717e6d" data-kw="">
<blockquote><p>Oh! the wise invention of the teacher who contrived that while we were singing we should at the same time learn something useful; by this means, too, the teachings are in a certain way impressed more deeply on our minds. Even a forceful lesson does not always endure, but what enters the mind with joy and pleasure somehow becomes more firmly impressed upon it.

What, in fact, can you not learn from the psalms? Can you not learn the grandeur of courage? The exactness of justice? The nobility of self-control? The perfection of prudence? A manner of penance [repentance]? The measure of patience? And whatever other good things you might mention? Therein is perfect theology, a prediction of the coming of Christ in the flesh, a threat of judgment, a hope of resurrection, a fear of punishment, promises of glory, an unveiling of mysteries; all things, as if in some great public treasury, are stored up in the Book of Psalms.

To it, although there are many musical instruments, the prophet adapted the so-called harp, showing, as it seems to me, that the gift from the Spirit resounded in his ears from above. With the cithara and the lyre the bronze from beneath responds with sound to the plucking, but the harp has the source of its harmonic rhythms from above, in order that we may be careful to seek the things above and not be borne down by the sweetness of the melody to the passions of the flesh. And I believe this, namely, that the words of prophecy are made clear to us in a profound and wise manner through the structure of the instrument, because those who are orderly and harmonious in soul possess an easy path to the things above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 10 on Psalm 1</cite>, 2 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 153-54.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4842eb8ff8" data-kw="">
<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>

</figure><figure class="quote" id="q-b2e68becf5" data-kw="">
<blockquote><p>The 72d Psalm is an eminent instance of Christ being the subject matter of praise; the person spoken of. To apply it exclusively to David or to Solomon would contradict the facts of history and be little short of impiety. An infinitely greater than David or Solomon is here. While the petition with which the Psalm begins can apply to them both, in a far higher sense it applies to him who is both David’s Son and Lord. In this song the Old Testament worshipper prayed for the establishment and perpetuity of the kingdom of the Messiah before he came into the world. We in singing it and other Messianic songs celebrate the greatness of the kingdom and the glory of the King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-sproull.html">Thomas Sproull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Psalms in Reformed Presbyterian and Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-06eedf8df6" data-kw="">
<blockquote><p>VIII. Did David, as the psalmist of Israel, write all the psalms?

No. He wrote probably more than one half of them. Yet they are called by his name (David, Heb. 4:7. Rom. 11:9) because he was employed more extensively than any other, in this part of the word of God, as the amanuensis of the Holy Ghost.

IX. What name was originally given to that part of the Holy Scriptures which is thus called David?

It was called “Tehillim,” that is, hymns or praises, because it was given as the matter of divine praise to the church of God in every future age. It is also called “Psalms,” because many of these “spiritual songs” were, at the temple worship, sung with the psaltery. Parts of the book have other names, as Mizmor, Shir (46, title), Tehillah (145, title), Tephilah (17,86,102, titles), Prayers, Shir-hammacholoth (120-134) – Odes of Ascension. They are also called, in the Septuagint, Psalmoi.

X. When were the Tehillim, or Psalms written and formed into a book?

They were written in a manner similar to the other parts of Scripture Heb. 1:1, during a period of nearly one thousand years, and were collected into one book, probably by “Ezra the priest, a scribe of the law of the God of heaven.” They stood in their present numerical order in the days of the apostles. Acts 13:33.

XI. Were other songs, beside those contained in the Book of Psalms, composed during that period?

Yes, many. Such as the Song of Deborah Judg. 5:12, the song of the well Num. 21:17, 18, the 1005 songs of Solomon, and others.

XII. Were not these then given as the matter of her praise, or are they not commanded to be sung by the church in all future ages?

No. As we read of different books in Scripture, such as the book of Gad, of Nathan, of Jehu, of Jasher, and the Epistle from Laodicea, which were not collected into the sacred canon, by the Holy Ghost, so we thus know, that by the same divine sovereignty, the songs thus noticed, or even recorded, were ephemeral as matter of praise; while the songs contained in the “Sepher Tehillim,” or Book of Psalms, and collected and placed in one book by the Spirit, are a part of “the word of God, which liveth and abideth forever,” selected by infinite wisdom, and given expressly as the matter of praise to the church until the end of time. The same principle applies to any isolated and occasional hymns or songs, which may be found in the New Testament.

XIII. Were any attempts made to add to the Book of Psalms, after it was completed?

Yes. The 151st psalm was fabricated, and attempted to be added to the then perfect book, nearly three hundred years before “the Christian era.” Septuagint, Psa. 151st.

XIV. Is such an attempt authorized by God?

No. It arises from the depravity of our nature, and the opposition of our wills to the divine will, and consequently forms a part of what the Holy Ghost calls “will worship,” which has a show of wisdom. Col. 2:23.

XV. Is, then, this book called the Book of Psalms, by the Holy Ghost?

It is so called, both by Jesus Christ and by the Spirit. Luke 20:42; Acts 1:20; Heb. 4:7.

XVI. Was it given to the Jewish church to be the matter of praise to God?

Yes. 1 Chron. 16:7; 25:1, 5; Psa. 81:1; . Neh. 12:8, 46; Psa. 137:3, 4; Ezra 3:10.

XVII. Was the Jewish church in reality different from the Christian?

No. They are the same church, under different dispensations. Acts 7:38; Heb. 4:2; Gal. 4:3, 4.

XVIII. When Christ came “to fulfil all righteousness,” and by his evangelists and apostles to complete the oracles of God, did he, or they, praise Jehovah by singing psalms?

Yes, both did. Matt. 26:30; Mark 14:26; Acts 16:25; Psa. 22:2; Heb. 2:13.

XIX. Did they deliver, by inspiration, any other “psalms, hymns, or spiritual songs,” than those contained “in David”? Heb. 4:7.

No. One such psalm or song would be a treasure for the edification of the saints, if “the Psalms” had been simply Jewish; and yet it would not afford a precedent or warrant for uninspired men to make human hymns, and sing them as praise to God. Isa. 1:12. Hos. 13:2.

XX. What is a human hymn, psalm, or spiritual song?

One, of which the arrangement and composition are made by uninspired men, and not by the authority and wisdom of God, even although the sentiment be taken from, and agree with, some portion of Scripture. It has “a show of wisdom;” yet it is only man’s opinion which will be opposed and contradicted by the opinion of some other man metrically expressed, in language, to his mind, equally scriptural. Consequently, “of making many ‘hymn’ books there is no end.” We have now more than one for each Sabbath in the year, all supplanting “the Lord’s song,” (songs), and in their turn supplanted by the poetical skill and caprice of other men. Such compositions, as matter of praise, are, moreover, purely “will worship.” Isa. 1:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-blaikie.html">Alexander Blaikie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism of Praise</cite>, (1849; Boston: S. K. Whipple and Co, 1854), pp 8-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

Yes, many. Such as the Song of Deborah Judg. 5:12, the song of the well Num. 21:17, 18, the 1005 songs of Solomon, and others.

XII. Were not these then given as the matter of her praise, or are they not commanded to be sung by the church in all future ages?

No. As we read of different books in Scripture, such as the book of Gad, of Nathan, of Jehu, of Jasher, and the Epistle from Laodicea, which were not collected into the sacred canon, by the Holy Ghost, so we thus know, that by the same divine sovereignty, the songs thus noticed, or even recorded, were ephemeral as matter of praise; while the songs contained in the “Sepher Tehillim,” or Book of Psalms, and collected and placed in one book by the Spirit, are a part of “the word of God, which liveth and abideth forever,” selected by infinite wisdom, and given expressly as the matter of praise to the church until the end of time. The same principle applies to any isolated and occasional hymns or songs, which may be found in the New Testament.

XIII. Were any attempts made to add to the Book of Psalms, after it was completed?

Yes. The 151st psalm was fabricated, and attempted to be added to the then perfect book, nearly three hundred years before “the Christian era.” Septuagint, Psa. 151st.

XIV. Is such an attempt authorized by God?

No. It arises from the depravity of our nature, and the opposition of our wills to the divine will, and consequently forms a part of what the Holy Ghost calls “will worship,” which has a show of wisdom. Col. 2:23.

XV. Is, then, this book called the Book of Psalms, by the Holy Ghost?

It is so called, both by Jesus Christ and by the Spirit. Luke 20:42; Acts 1:20; Heb. 4:7.

XVI. Was it given to the Jewish church to be the matter of praise to God?

Yes. 1 Chron. 16:7; 25:1, 5; Psa. 81:1; . Neh. 12:8, 46; Psa. 137:3, 4; Ezra 3:10.

XVII. Was the Jewish church in reality different from the Christian?

No. They are the same church, under different dispensations. Acts 7:38; Heb. 4:2; Gal. 4:3, 4.

XVIII. When Christ came “to fulfil all righteousness,” and by his evangelists and apostles to complete the oracles of God, did he, or they, praise Jehovah by singing psalms?

Yes, both did. Matt. 26:30; Mark 14:26; Acts 16:25; Psa. 22:2; Heb. 2:13.

XIX. Did they deliver, by inspiration, any other “psalms, hymns, or spiritual songs,” than those contained “in David”? Heb. 4:7.

No. One such psalm or song would be a treasure for the edification of the saints, if “the Psalms” had been simply Jewish; and yet it would not afford a precedent or warrant for uninspired men to make human hymns, and sing them as praise to God. Isa. 1:12. Hos. 13:2.

XX. What is a human hymn, psalm, or spiritual song?

One, of which the arrangement and composition are made by uninspired men, and not by the authority and wisdom of God, even although the sentiment be taken from, and agree with, some portion of Scripture. It has “a show of wisdom;” yet it is only man’s opinion which will be opposed and contradicted by the opinion of some other man metrically expressed, in language, to his mind, equally scriptural. Consequently, “of making many ‘hymn’ books there is no end.” We have now more than one for each Sabbath in the year, all supplanting “the Lord’s song,” (songs), and in their turn supplanted by the poetical skill and caprice of other men. Such compositions, as matter of praise, are, moreover, purely “will worship.” Isa. 1:12.”

sung+by+the+church+in+all+future+ages%3F%0A%0ANo.+As+we+read+of+different+books+in+Scripture%2C+such+as+the+book+of+Gad%2C+of+Nathan%2C+of+Jehu%2C+of+Jasher%2C+and+the+Epistle+from+Laodicea%2C+which+were+not+collected+into+the+sacred+canon%2C+by+the+Holy+Ghost%2C+so+we+thus+know%2C+that+by+the+same+divine+sovereignty%2C+the+songs+thus+noticed%2C+or+even+recorded%2C+were+ephemeral+as+matter+of+praise%3B+while+the+songs+contained+in+the+%E2%80%9CSepher+Tehillim%2C%E2%80%9D+or+Book+of+Psalms%2C+and+collected+and+placed+in+one+book+by+the+Spirit%2C+are+a+part+of+%E2%80%9Cthe+word+of+God%2C+which+liveth+and+abideth+forever%2C%E2%80%9D+selected+by+infinite+wisdom%2C+and+given+expressly+as+the+matter+of+praise+to+the+church+until+the+end+of+time.+The+same+principle+applies+to+any+isolated+and+occasional+hymns+or+songs%2C+which+may+be+found+in+the+New+Testament.%0A%0AXIII.+Were+any+attempts+made+to+add+to+the+Book+of+Psalms%2C+after+it+was+completed%3F%0A%0AYes.+The+151st+psalm+was+fabricated%2C+and+attempted+to+be+added+to+the+then+perfect+book%2C+nearly+three+hundred+years+before+%E2%80%9Cthe+Christian+era.%E2%80%9D+Septuagint%2C+Psa.+151st.%0A%0AXIV.+Is+such+an+attempt+authorized+by+God%3F%0A%0ANo.+It+arises+from+the+depravity+of+our+nature%2C+and+the+opposition+of+our+wills+to+the+divine+will%2C+and+consequently+forms+a+part+of+what+the+Holy+Ghost+calls+%E2%80%9Cwill+worship%2C%E2%80%9D+which+has+a+show+of+wisdom.+Col.+2%3A23.%0A%0AXV.+Is%2C+then%2C+this+book+called+the+Book+of+Psalms%2C+by+the+Holy+Ghost%3F%0A%0AIt+is+so+called%2C+both+by+Jesus+Christ+and+by+the+Spirit.+Luke+20%3A42%3B+Acts+1%3A20%3B+Heb.+4%3A7.%0A%0AXVI.+Was+it+given+to+the+Jewish+church+to+be+the+matter+of+praise+to+God%3F%0A%0AYes.+1+Chron.+16%3A7%3B+25%3A1%2C+5%3B+Psa.+81%3A1%3B+.+Neh.+12%3A8%2C+46%3B+Psa.+137%3A3%2C+4%3B+Ezra+3%3A10.%0A%0AXVII.+Was+the+Jewish+church+in+reality+different+from+the+Christian%3F%0A%0ANo.+They+are+the+same+church%2C+under+different+dispensations.+Acts+7%3A38%3B+Heb.+4%3A2%3B+Gal.+4%3A3%2C+4.%0A%0AXVIII.+When+Christ+came+%E2%80%9Cto+fulfil+all+righteousness%2C%E2%80%9D+and+by+his+evangelists+and+apostles+to+complete+the+oracles+of+God%2C+did+he%2C+or+they%2C+praise+Jehovah+by+singing+psalms%3F%0A%0AYes%2C+both+did.+Matt.+26%3A30%3B+Mark+14%3A26%3B+Acts+16%3A25%3B+Psa.+22%3A2%3B+Heb.+2%3A13.%0A%0AXIX.+Did+they+deliver%2C+by+inspiration%2C+any+other+%E2%80%9Cpsalms%2C+hymns%2C+or+spiritual+songs%2C%E2%80%9D+than+those+contained+%E2%80%9Cin+David%E2%80%9D%3F+Heb.+4%3A7.%0A%0ANo.+One+such+psalm+or+song+would+be+a+treasure+for+the+edification+of+the+saints%2C+if+%E2%80%9Cthe+Psalms%E2%80%9D+had+been+simply+Jewish%3B+and+yet+it+would+not+afford+a+precedent+or+warrant+for+uninspired+men+to+make+human+hymns%2C+and+sing+them+as+praise+to+God.+Isa.+1%3A12.+Hos.+13%3A2.%0A%0AXX.+What+is+a+human+hymn%2C+psalm%2C+or+spiritual+song%3F%0A%0AOne%2C+of+which+the+arrangement+and+composition+are+made+by+uninspired+men%2C+and+not+by+the+authority+and+wisdom+of+God%2C+even+although+the+sentiment+be+taken+from%2C+and+agree+with%2C+some+portion+of+Scripture.+It+has+%E2%80%9Ca+show+of+wisdom%3B%E2%80%9D+yet+it+is+only+man%E2%80%99s+opinion+which+will+be+opposed+and+contradicted+by+the+opinion+of+some+other+man+metrically+expressed%2C+in+language%2C+to+his+mind%2C+equally+scriptural.+Consequently%2C+%E2%80%9Cof+making+many+%E2%80%98hymn%E2%80%99+books+there+is+no+end.%E2%80%9D+We+have+now+more+than+one+for+each+Sabbath+in+the+year%2C+all+supplanting+%E2%80%9Cthe+Lord%E2%80%99s+song%2C%E2%80%9D+%28songs%29%2C+and+in+their+turn+supplanted+by+the+poetical+skill+and+caprice+of+other+men.+Such+compositions%2C+as+matter+of+praise%2C+are%2C+moreover%2C+purely+%E2%80%9Cwill+worship.%E2%80%9D+Isa.+1%3A12.%E2%80%9D%0A%0A%E2%80%94+Alexander+Blaikie%2C+A+Catechism+of+Praise%2C+%281849%3B+Boston%3A+S.+K.+Whipple+and+Co%2C+1854%29%2C+pp+8-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06eedf8df6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X <blockquote><p>The oldest of the Conclusions, so far as is known, is that to Psalm 148 [only], which is found in the 1575 edition by Bassandyne, at the very end of the volume… Though the introduction of these compositions is involved in obscurity, it cannot be supposed that they were forced into the Psalm Book against the wishes of the church authorities… It is more conceivable that they were inserted quietly, on the printer’s own responsibility or that of other private parties; and their disappearance from most of the subsequent editions lends countenance to this conjecture. Even those for common metre are wanting in so important an edition of 1615. Very possibly those who had Episcopal leanings had most to do with their first introduction; but the absence of any trace of controversy on the subject warrants the inference that other parties acquiesced, so far at least as to make the use of them a matter of forebearance. It may also be inferred from the state of the psalm books that they were used only to a partial extent till after 1615.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-17712e12df" data-kw="">
<blockquote><p>Shew a regard to him, by espousing his cause, the interest of his house and kingdom. Sirs, the cause of Christ is upon the field at this day; the covenanted standard of Scotland is displayed, in opposition to that course of defection which the whole land is gone into, and which the judicatories of the established church are carrying on, with might and main. The cry is given, “Who is on the Lord’s side?” let them “come up to the help of the Lord, to the help of the Lord against the mighty.”

Some, both ministers and Christians, profess friendship unto the cause of Christ, his covenanted doctrine, discipline, worship, and government: but they love to dwell at ease, and, like Issachar, to crouch under the burden: but I have little skill if that be the Lord’s way, and the Lord’s call, when others are jeoparding themselves “in the high places of the field,” for the cause and testimony of Jesus.

I may say to such, be who they will, as the prophet said to Israel, in a day of defection from the Lord, “How long halt ye between two opinions? If Baal be God, serve him, and if Jehovah be God,” then serve and follow him. If the judicatories of the church be fighting the cause of Christ, and building the Lord’s house, then cleave to them, and good reason: but if they be building Jericho, instead of Jerusalem; if they be pulling down the work of God, instead of building it up; if the ark of God, his covenanted cause and testimony, be carried without the camp, it is time to follow it; let “us go out therefore unto him without the camp, bearing his reproach.”

And if folk shift following Christ, his cause and sworn testimony, especially when it is espoused by a handful upon all hazards, they need to consider upon it in time, lest that sentence go against them; “Curse ye Meroz, curse ye bitterly the inhabitants thereof, because they came not to the help of the Lord, to the help of the Lord against the mighty.” Christ and his cause will carry the day without you; but take heed that he don’t resent it, ere all be done; his frowns and down-looks are heavier than the frowns of all the men on earth, or angels in heaven, or devils in hell.</p></blockquote>

</figure><figure class="quote" id="q-5497843023" data-kw="">
<blockquote><p>If, therefore, magistrates command that which is prejudicial to the general welfare of the society, or dishonourable to God, the Supreme Governor of it, they ought to be disobeyed. And, if they be habitually cruel and tyrannical, they ought to be resisted and deposed, if circumstances permit.

1. When the great body of the subjects are much alienated in affection, a revolution may be accomplished without much hazard or hurt.

2. By resisting tyrannical princes in proper circumstances, nations have often preserved their lives as well as their liberties from impending ruin.

3. Such resistance, prudently managed, is an effectual warning to other magistrates to beware of abusing and opposing their subjects.

4. In mixed forms of government, the propriety of resistance is most clear as well as most easy: as when a parliament resists a king, or a king resists a parliament, in defence of the common liberties of the nation. – Nevertheless, as princes are exposed to many and uncommon difficulties, and are apt to be imposed on by their confidents:- and as their real designs are not easily penetrated, and often not to be pried into by their subjects; – and as resistance ordinarily occasions much bloodshed and misery, – subjects ought to put the best construction upon the conduct of their governors that it can justly admit, – and never proceed to violent measures but where it is absolutely necessary, and where there is an hopeful prospect of success.</p></blockquote>

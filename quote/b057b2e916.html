<main class="wrap"><figure class="quote" id="q-b057b2e916" data-kw="">
<blockquote><p>Radical Two Kingdom theology (R2K) affirms that while Christ is Lord of both the ecclesiastical and political realm, the latter kingdom is to be governed by natural law as opposed to biblical law. However, the American Reformed Presbyterian, Samuel B. Wylie, helpfully explains what Covenanters’ mean by the two kingdoms and how both kingdoms are to submit to the written law of God:

Though both these branches are put under the Mediator’s control, yet they are so, under different regulations. Ecclesiastical power is delegated to him in such a manner that all ordinances and institutions, necessary to the formal organization of a visible church, flow immediately from him as Mediator. Matt. 16:18. He is the builder of the church, the author of all her sacred institutions. All ecclesiastical functionaries, likewise, receive their authority from him, in the same character, for every part of their administration. Hence, Matt. 16:19, he commits unto them the keys of the kingdom, and the exclusive power of binding and loosing. But civil power is under a different regulation. It flows immediately from God Creator, as the Governor of the universe. Jer. 10:7: “Who would not fear thee, O King of nations?” It existed previously to the fall, and would necessarily have existed, even had we never revolted from God; though, no doubt, in that case, it would not have been clothed with some of its present modifications. Man’s subjection to the moral government of his Maker, would have been similar to that of beings of a more dignified order.

Civil government does not, as some modern politicians affirm, originate either in the people, as its fountain, or in the vices consequent upon the fall. Among the angels, who retained their primitive rectitude, we find certain orders, suggested by the denominations of Archangels, Thrones, Dominions, Principalities, and Powers, Col. 1:16. This testifies regular subordination among them, agreeable to the constitutional laws of their nature, and their amenability to God, their Creator and Lord. But though civil government is no new order of things, predicated upon the fall, nor, like the ministry, in all its circumstances, flowing immediately from Christ as Mediator; yet it is among the all things committed to him by the donation of the Father, Eph. 1:22.

Its officers likewise, are enjoined, under pain of perdition, to make all their administrations bend to the honour of Immanuel: and the body politic indispensably bound to modify their constitutions by his word, when in his goodness he has revealed it unto them. Ps. 2:10,12: “Be wise now, therefore, O ye kings: be instructed, ye judges of the earth. Serve the Lord with fear, and rejoice with trembling. Kiss the Son, lest he be angry, and ye perish from the way, when his wrath is kindled but a little.” Can any thing be more explicit in demonstrating the obligation of the civil authorities to render homage and respect to Messiah?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-b-wylie.html">Samuel B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 8-9.</span></figcaption>

</figure><figure class="quote" id="q-eb0523f404" data-kw="">
<blockquote><p>Although this blog accepts the basic tenet of theonomy (that the penal sanctions are, for the most part, of perpetual obligation), nevertheless, some dangerous notions concerning the judicial law have been popular in certain American theonomic circles. Among the most perverse is the denial of the Lex Triplex: the threefold division of the law into moral, judicial, and ceremonial categories. While this distinction is not absolute (many divines recognised that various laws fell into both moral and judicial categories), nonetheless, it is a useful way of distinguishing between different types of laws. The early Reformed believed that the moral-judicial laws remained valid. Owing to their emphasis on the Lex Triplex, however, they did not come to the fanatical conclusion that the entire judicial law of Moses was binding on modern states. Many American theonomists recognise this in the abstract, but fall into fallacious reasoning when it comes to applying the law today (for instance, thinking that the Old Testament gleaning-laws can be slavishly followed in modern, industrial society). If they had only properly understood the Lex Triplex such errors could have been easily avoided. To this end, Henry Bullinger warns us that denial of the Lex Triplex is a sign of madness:

Now it is to be marked, that in Moses’ judicial law there are many things proper and peculiar to the Jewish nation, and so ordained, according to the state of the place, time, and persons, that, if we should go about to thrust on and apply them all to other nations, we should seem to shew ourselves more than half mad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 342.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>That this Author saith, God commanded those that transgressed his holy Law with an high hand, and presumptuously to be killed, lest they should live and profane his holy things; I defend not: But sure Erastus erreth, who will have all such to be killed by the Magistrate under the New Testament, because they were killed in the Old: Then are we to stone men that gathereth sticks on the Lord’s Day; the child that is stubborn to his Parents, the Virgins, daughters of Ministers that committeth fornication are to be put to death. Why, but then the whole judicial Law of God shall oblige us Christians as Carolosladius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them, so it was mysterious teach of us, how God hated such and such sins, and mysteries of that kind are gone with the other shadows. But we read not (saith Erastus) where Christ hath changed those Laws in the New Testament. It is true, Christ hath not said in particular, I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated until the evening; nor hath he said particularly of every carnal Ordinance and judicial Law, it is abolished. Be we conceive, the whole bulk of the judicial Law, as judicial, and as it concerned the Republick of the Jews only, is abolished, though the moral equity of all those be not abolished; also some punishments were merely symbolical, to teach the detestation of such a vice, as the boaring with an aul the ear of him that loved his Master, and desired still to serve him, and the making of him his perpetual servant. I should think the punishing with death the man that gathered sticks on the Sabbath was such; and in all this, the punishing of a sin against the Moral Law by the Magistrate, is Moral and perpetual; but the punishing of every sin against the Moral Law, tali modo, so and so, with death, which spitting on the face: I much doubt if these punishments in particular, and in their positive determination to the people of the Jews, be moral and perpetual: As he that would marry a captive woman of another Religion, is to cause her first pare her nails, and wash herself, and give her a month, or less time to lament the death of her Parents, which was a Judicial, not a Ceremonial Law; that this should be perpetual, because Christ in particular hath not abolished it, to me seems most unjust; for as Paul saith, He that is Circumcised becomes a debtor to the whole Law, sure to all the Ceremonies of Moses his Law: So I argue, à pari, from the like, He that will keep one judicial Law, because judicial and given by Moses, becometh debtor to keep the whole judicial Law, under pain of God’s eternal wrath.</p></blockquote>

<blockquote><p>4. It is, therefore, a diabolical opinion, which has possessed the minds of almost all those who lay claim to gentility, that they cannot bear, even a reproachful word, without the loss of their honour and their reputation; but are under the necessity of seeking revenge in a duel, at the manifest peril of their own lives, and a plain attack upon the life of another.

This more than heathenish opinion can be refuted by many arguments:

1. We pull down the very foundation of what we are striving to build, by laying down this maxim. It is not a sign of a cowardly or ignoble mind, nor disgraceful or mean in a Christian, to bear injuries, but to inflict them. This was briefly proved above, when we were reasoning on meekness, patience, and their acts: we will now add, that this was even approved by the very heathens, especially the wiser among them.

Socrates, as we find in Plato (in his Gorgia) draws the conclusion, that every injury is dishonourable and infamous to the inflictor of it, not to him who suffers it; and that, as he says himself, for the strongest and most solid reasons … Aristotle follows the same opinion in his Ethics 5. cap. 11, giving this reason; To inflict an injury is the effect of dishonesty; and on that account dishonourable and infamous: but to suffer one with equanimity is the effect of virtue, and therefore glorious.

Seneca, in that book where he professedly considers whether an injury can affect a wise man, writes; We ought to despise injuries, and what I may call the shadow of injuries, contumely, whether they fall deservedly or undeservedly upon us. If deservedly, it is not contumely, but judgment given; if undeservedly, it is for him who did the injury, and not for me to be ashamed of it. That we may not accumulate more from profane authors, we have the opinion of Christ himself, Matt. v. 11, Blessed are ye when men shall revile you.

2. Should we grant that injury or contumely has been cast upon us, and that to do this is criminal; nevertheless it by no means follows, that it is lawful to repel it by means of a duel: and that for these reasons;

1. No one ought to be judge in his own cause; and, least of all, one who is disturbed with anger, violence, and the passion of revenge. Tertullian, De patient, says, What have I to do with a passion, which 1 cannot govern through impatience?

2. Individuals do injury to God and his vicarious representative, the magistrate, when they seek to revenge themselves by private means. Vengeance is mine, and I will repay, saith the Lord, Deut. xxxii. 35; and Rom. xiii. 14, Paul says of the magistrate, He beareth not the sword in vain. But he would bear it in vain, if it was allowed to an individual to draw the sword at his own pleasure.

3. Duellists would punish every injury with the same punishment, namely, death; which is not the judgment of a generous man, but of a madman. Now every punishment inflicted by one possessed of all his faculties, ought to be commensurate with the offence.

We shall conclude with the saying of Christ. Matt. xxvi. 52, All they that take the sword shall perish with the sword; that is, as Augustine interprets it, Every one who without legitimate authority granted to him, or enjoining him so to do, shall arm himself against the life of any man, shall perish either by the sword of man, or that of Divine vengeance. From all these reasons it appears clear, that they are absolutely madmen, who follow the opinions of the many, renouncing the doctrine of Christ: so that they may retain the name of Gentlemen, they do not fear the title of homicide; and, finally, so that they may avoid a suspicion of false infamy, they leap into the very pit of hell itself.</p></blockquote>

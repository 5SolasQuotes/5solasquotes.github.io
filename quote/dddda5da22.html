<main class="wrap"><figure class="quote" id="q-dddda5da22" data-kw="">
<blockquote><p>Q. What sorts of public theft are there?

A. Two, either in Church, or Common-wealth.

Q. What is Church theft?

A. It is called Sacrilege, consisting partly in things spirituall, and partly in things temporal.

Q. What is the sacrilege that consists in things spiritual?

A. When the Church is deprived of sound doctrine, through the insufficiency, or negligence, or corruption of he Pastors and Teachers.

Q. Who are they that sin in this kind of sacrilege?

A. Either Ministers, or people.

Q. What Ministers do sin therein?

A. First, the ignorant, insufficient, and dumb Ministers, which take wages, &amp; cannot do their duty; with the makers &amp; maintainers of them. 2. The idle negligent Ministers; whither refer Monks, Friers, Nuns, &amp;c.

Q. How do the people sin herein?

A. When they not only are content to be under such Ministers, as either cannot, or will not reprove them of their sins, but also desire and seek for them.

Q. What is that Sacrilege which consists in things temporal?

A. When the goods of the Church are taken from them to whom they belong; or when men make sale or merchandize of Benefices and Church-livings.

Q. What is the theft of the Common-wealth?

A. When the common goods are either taken away, or applied to any private use, or when rewards are given, or taken, to corrupt judgment; or when men become like false coiners of money, washers, or clippers, or the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (London: Thomas Man, 1616), pp 151-52.</span></figcaption>

<blockquote><p>How much more unbeseeming and disorderly were it in the Church (which Nicolaides himself, even where he disputes against the necessity of ordination, Refut: tract: de missione minister, ch. 10, p. 113, acknowledges to be more perfect than any politic republic in the world) for any man to assume to himself power and authority which is not given him, or which he has a non habente potestatem [‘from not having the power’], or to intrude himself into any public administration unto which he is not appointed. It was justly complained of as a great disorder under the prelates that midwives were permitted to baptize upon pretence of a case of necessity, yea that deacons were permitted to baptize, because the administration of baptism does neither belong to deacons nor to private persons.</p></blockquote>

<blockquote><p>The fifth mark is “the continued succession of bishops without any interruption, from the apostles even to our times.” But here (in the first place), we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). Nay, since the church is ambulatory and not tied down to this or that place, such also is its succession. (b) It is not proper because it belongs also to false teachers. Annas and Caiaphas succeeded Aaron in the priesthood; the scribes and Pharisees succeeded the fathers and the interpreters of the law; Arians succeeded the orthodox; the Greek church (which the Romanists consider schismatical and heretical) glories in an uninterrupted succession of bishops from the apostles. Bellarmine himself confesses that “the church cannot necessarily be inferred to be where a succession is” (“De Notis Ecclesiae,” 4.8 Opera [1857], 2:118). (c) A local and personal succession can be without a succession of doctrine. Therefore it cannot be a mark of the church because it cannot be a true church which does not have the apostolic doctrine. For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.13.28</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 18.13.28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20fifth%20mark%20is%20%E2%80%9Cthe%20continued%20succession%20of%20bishops%20without%20any%20interruption%2C%20from%20the%20apostles%20even%20to%20our%20times.%E2%80%9D%20But%20here%20%28in%20the%20first%20place%29%2C%20we%20must%20distinguish%20succession%3A%20one%20is%20personal%20and%20local%2C%20as%20to%20persons%20and%20places%3B%20another%20is%20doctrinal%2C%20as%20to%20faith.%20We%20do%20not%20deny%20that%20the%20latter%20is%20a%20mark%20and%20thus%20it%20coincides%20with%20ours.%20But%20the%20former%20%28of%20which%20we%20treat%20here%29%20cannot%20be%20a%20mark.%20%28a%29%20It%20is%20merely%20contingent%20and%20aside%20from%20the%20nature%20of%20the%20church%2C%20unless%20it%20is%20founded%20on%20unity%20of%20sound%20doctrine%20and%20true%20faith%20%28Eph.%204%3A4%2C%205%2C%2011%2C%2012%29.%20Nay%2C%20since%20the%20church%20is%20ambulatory%20and%20not%20tied%20down%20to%20this%20or%20that%20place%2C%20such%20also%20is%20its%20succession.%20%28b%29%20It%20is%20not%20proper%20because%20it%20belongs%20also%20to%20false%20teachers.%20Annas%20and%20Caiaphas%20succeeded%20Aaron%20in%20the%20priesthood%3B%20the%20scribes%20and%20Pharisees%20succeeded%20the%20fathers%20and%20the%20interpreters%20of%20the%20law%3B%20Arians%20succeeded%20the%20orthodox%3B%20the%20Greek%20church%20%28which%20the%20Romanists%20consider%20schismatical%20and%20heretical%29%20glories%20in%20an%20uninterrupted%20succession%20of%20bishops%20from%20the%20apostles.%20Bellarmine%20himself%20confesses%20that%20%E2%80%9Cthe%20church%20cannot%20necessarily%20be%20inferred%20to%20be%20where%20a%20succession%20is%E2%80%9D%20%28%E2%80%9CDe%20Notis%20Ecclesiae%2C%E2%80%9D%204.8%20Opera%20%5B1857%5D%2C%202%3A118%29.%20%28c%29%20A%20local%20and%20personal%20succession%20can%20be%20without%20a%20succession%20of%20doctrine.%20Therefore%20it%20cannot%20be%20a%20mark%20of%20the%20church%20because%20it%20cannot%20be%20a%20true%20church%20which%20does%20not%20have%20the%20apostolic%20doctrine.%20For%20the%20church%20is%20not%20to%20be%20sought%20in%20walls%20and%20temples%2C%20but%20in%20doctrines.%20The%20church%20is%20where%20true%20faith%20is.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2018.13.28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F602d94bbb6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/602d94bbb6.html">Permalink</a><span class="src none">No free online copy linked</span></div>

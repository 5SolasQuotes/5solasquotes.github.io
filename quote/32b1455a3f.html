<main class="wrap"><figure class="quote" id="q-32b1455a3f" data-kw="">
<blockquote><p>There is nothing in the World (I am very confident) lies so near the heart of a gracious Christian, next to the Glory of God and his own Soul’s Eternal happiness, as the Spiritual good of his dear Children: nature binds him to love his own: Christianity regulateth and Spiritualiseth this love: fondness is not true love, but faithfulness: love to their bodies is but brutish without love to their Souls: it’s like a doting on the Case, and throwing away the Jewel, the Soul is the man, the unseen part is the best part; where the Soul is lodged, when parted from the Body, there must the Body lodge, in Heaven or Hell:

Oh that men understood and well digested this! surely they would not so unweariedly toil and tread to get Estates for their Children, and take no care of their precious Souls, and know not when they Dye whether he that comes after them shall be a Wise man or a Fool: if he be a wise man, a little will serve him, with God’s blessing: if wicked he puts a Sword into the hand of a Fool to do himself and others a greater mischief:

Oh how much better is it for their own peace and their Children’s profit to plead the Covenant, to Instruct, Correct, Admonish, Counsel, Comfort and encourage their Children in the ways of God, and use their utmost Endeavour to make them God’s Children: an Ancient thus writes, God commands Parents to hoard up Discipline, not Money for their Children, things of a perpetual not perishing nature: what a base and sordid thing is it to prefer a Swine to a Son! to provide for a Beast and cast out a Child! and yet most Parents bestow more care of their Cattel than of their Children’s Souls: they give their Children nature, but deny them nurture:

Yea they propagate corruption to them, but do not travel over them till Christ be formed in them: they glory in being Fathers of their Flesh, but cry not to the Father of Spirits for the best life in their Children’s dead Souls: they promise at their Baptism, to bring them up in the nurture and admonition of the Lord, but know not what that meaneth, and have no heart to learn, that they may teach:

Oh what account will these perjured Parents give another day? Remember God will call you to account, what Answer will you give, when he shall Say? where is the Child’s Soul, that I committed to thy trust? what care hast thou taken of it? where are thy Tears, Prayers, Groanings, Earnings of Bowels for thine own Bowels? didst thou not know that thy Child had a Soul? that its Soul was polluted with Sin? that it must be born again not only of Water but of the Spirit: or could not be Saved? that though I was to be the Efficient cause, yet thou must be the Instrument to begin and carry on this Work, and hast thou struck one stroke in this work by faithful endeavours?

[O]r hast thou earnestly desired me to do that for thy Child that thou couldest not? thou knowest thou hast done neither, and therefore thy Child’s Blood shall be reqiured at thy hands: what Apology wilt thou then make for thy self? Dost thou think to come off by Saying, I sent him to School to learn, or to the Minister to be Catechised? this is more than some will do, but is this all? is not paternal care thy personal duty? was not thou charged with thy Child’s Soul? may not God justly blast other teachers pains as a punishment of thy negligence? and doth not thy bad Example at home unravel all that others teach them? Wo, Wo be to such wicked wretched Parents!</p></blockquote>

<blockquote><p>For rulers are not a terror to good works, but to evil. Do you want to be unafraid of the authority? Do what is good, and you will have praise from the same. (Romans 13:3)

<blockquote><p>Observe first that he says, “he will cling to his wife” and not “wives.” Next, he says, “the two will be one flesh.” Here polygamy is manifestly condemned, which so effects one flesh that it also pulls man apart into many fleshes. Indeed, it is also true that, after the first institution, that custom prevailed among the fathers. But now I do not dispute how this was done rightly. I say with Christ that it was not this way from the beginning, but neither is anything corrected better than when it is led back to the first institution.</p></blockquote>

<blockquote><p>The rational soul is infused around the third day from the conception of the seed, understand if the conception proceeds to life and is not frustrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | Others who deny that the soul is infused immediately from conception do not agree among themselves at what point of time or with how many days having passed, the intellective soul is united to the body. Valles in his Controversies, bk. 2, ch. 9 at the end says that females are never formed before the fortieth day, but males are formed in thirty or thirty-five days. The Coimbrans in their commentary on Aristotle’s On the Soul, bk. 2, article 2, section 2 say that the more common opinion, which they also follow, is that in males the conformation of the body is completed, and consequently the soul infused, around the fortieth day, in females around the eightieth. Feyens in his treatise, On the Formation of the Fetus, question 8, conclusion 2, says:</span></figcaption>

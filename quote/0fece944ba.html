<blockquote><p>potentia absoluta: absolute power; the omnipotence of God limited only be the law of noncontradiction. According to his potentia absoluta, God can effect all possibility, constrained only by his own nature. Things which are by nature evil and either impossible or noncompossible things (like square circles) fall outside of the realm of God’s power. The term emphasizes the transcendence and omnipotence of God by setting God even above and beyond the laws he has ordained for the operation of his universe…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, (Baker, 1985), p. 231</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f3a9aa7ba8" data-kw="">
<blockquote><p>Perhaps the most detailed Reformed responses to this new concept [of middle knowledge] were written by William Twisse (ca. 1577-1646) and Voetius… Virtually all Reformed orthodox theologians rejected this solution because it made God dependent on his finite creatures. Moreover, they considered middle knowledge to be superfluous because necessary and free knowledge already covered all knowable objects. According to Voetius, God indeed knows what free creatures would do in certain circumstances, but this knowledge presupposes the divine decree and thus in the end amounts to a variation of free [decreed] knowledge. Otherwise, this knowledge would be necessary, evoking Stoic fate that eliminates divine and human freedom alike. For the Reformed orthodox, contingent reality was rooted in the divine will rather than in knowledge. In this they followed the Augustinian-Franciscan tradition, together with most Dominicans and Franciscans of their age (Voetius 1648, 264-339; Twisse 1639; Beck 2007, 264-322, 435-39; Bac 2010, 41-210).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-beck.html">Andreas Beck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘God, Creation, and Providence in Post-Reformation Reformed Theology’, p. 202 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

%3B%20Bac%202010%2C%2041%2D210&amp;text=Perhaps%20the%20most%20detailed%20Reformed%20responses%20to%20this&amp;text=1639%3B%20Beck%202007%2C%20264%2D322%2C%20435%2D39%3B%20Bac%202010%2C%2041%2D210" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1439f7a282" data-kw="">
<blockquote><p>I. Should the root of all possibility and impossibility be rightly established in God Himself? Affirmative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653), Appendix Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I. Should the root of all possibility and impossibility be rightly established in God Himself? Affirmative.”

— Andreas Essenius, ‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653), Appendix Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+Should+the+root+of+all+possibility+and+impossibility+be+rightly+established+in+God+Himself%3F+Affirmative.%E2%80%9D%0A%0A%E2%80%94+Andreas+Essenius%2C+%E2%80%98Theological+Disputation+on+the+Image+of+God+in+Man%E2%80%99+Download+tr.+Jonathan+Tomes+%28Utrecht%3A+Johannes+Waesberg%2C+1653%29%2C+Appendix+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1439f7a282.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1439f7a282.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-possibilities-hypotheticals/#:~:text=I.%20Should%20the%20root%20of%20all,rightly%20established%20in%20God%20Himself%3F%20Affirmative&amp;text=I.%20Should%20the%20root%20of%20all%20possibility%20and&amp;text=impossibility%20be%20rightly%20established%20in%20God%20Himself%3F%20Affirmative" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a1e8359159" data-kw="">
<blockquote><p>In the Reformed view, both Catholic Counter-Reformation (L. Molina) and Remonstrant theology (Arminius) had modified this ‘will-based-theology’ [of Augustine and the Reformed] by their adaptation of middle knowledge (scientia media), resulting in a ‘knowledge-based-theology’ in which there is no room for real contingency (Maccovius 1641b, 103-4; Bac 2010). For Maccovius and most of seventeenth-century Reformed theologians, the main problem of the concept of middle knowledge is that it undermines the fundamental distinction between Creator and creature. Middle knowledge, used to describe a category of divine knowledge structurally or logically antecedent to God’s will, implies a necessity of the objects of divine knowledge (Maccovius 1641a, 25-26). Because middle knowledge postulates objects extra Deum [outside God] that precede his will, a logical contradiction is involved: objects outside God always presuppose the divine will. Finally. if God’s middle knowledge also contains his decree, then this would imply that it is impossible for God to choose an alternative (Maccovius 1641a, 25). Middle knowledge, then, approximates Stoic fate (fatum Stoicum), a natural or absolute necessity so inherent in the essential nature of things that even God is made dependent, like Homer’s Jupiter [who was constrained by nature] (Maccovius 1641b, 253).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willem-j-van-asselt.html">Willem J. van Asselt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Christ, Predestination, and Covenant in Post-Reformation Reformed Theology’</cite>, 2. ‘Predestination…’, pp. 218-9 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>
<div class="actions"><button class="copy" data-copy="“In the Reformed view, both Catholic Counter-Reformation (L. Molina) and Remonstrant theology (Arminius) had modified this ‘will-based-theology’ [of Augustine and the Reformed] by their adaptation of middle knowledge (scientia media), resulting in a ‘knowledge-based-theology’ in which there is no room for real contingency (Maccovius 1641b, 103-4; Bac 2010). For Maccovius and most of seventeenth-century Reformed theologians, the main problem of the concept of middle knowledge is that it undermines the fundamental distinction between Creator and creature. Middle knowledge, used to describe a category of divine knowledge structurally or logically antecedent to God’s will, implies a necessity of the objects of divine knowledge (Maccovius 1641a, 25-26). Because middle knowledge postulates objects extra Deum [outside God] that precede his will, a logical contradiction is involved: objects outside God always presuppose the divine will. Finally. if God’s middle knowledge also contains his decree, then this would imply that it is impossible for God to choose an alternative (Maccovius 1641a, 25). Middle knowledge, then, approximates Stoic fate (fatum Stoicum), a natural or absolute necessity so inherent in the essential nature of things that even God is made dependent, like Homer’s Jupiter [who was constrained by nature] (Maccovius 1641b, 253).”

8-9+in+eds.+Lehner%2C+Muller%2C+Roeber%2C+The+Oxford+Handbook+of+Early+Modern+Theology%2C+1600-1800+%28Oxford%2C+2016%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa1e8359159.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a1e8359159.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/middle-knowledge/#:~:text=In%20the%20Reformed%20view%2C%20both%20Catholic,constrained%20by%20nature%5D%20%28Maccovius%201641b%2C%20253&amp;text=In%20the%20Reformed%20view%2C%20both%20Catholic%20Counter%2DReformation%20%28L&amp;text=who%20was%20constrained%20by%20nature%5D%20%28Maccovius%201641b%2C%20253" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6df0d8e330" data-kw="">
<blockquote><p>1) A thing is possible because God is able to produce it. It is not, conversely, because it is possible that God is able to produce it. This is proved by God’s priority and independence. 2) Intrinsic possibility is not prior in nature to extrinsic possibility, nor is it the cause of the latter. On the contrary, since a thing can possibly be made by the truly and infinitely powerful God Himself, the source of all being, for that reason [the thing] is also intrinsically possible because the essence of God is the root and rule of all truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/melchior-leydekker.html">Melchior Leydekker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fax veritatis seu exercitationes ad nonnullas controversias quae hodie in Blegio</cite>, … (Leiden: Gaesbeeck &amp; Lopex, 1677), pp. 242-46 tr. Aza Goudriaan, ch. 8, ‘Samuel Rutherford on the Divine Origin of Possibility’ in ed. Aaron C. Denlinger – Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, p. 154 Leydekker followed Rutherford on the subject.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

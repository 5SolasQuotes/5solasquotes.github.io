<main class="wrap"><figure class="quote" id="q-d2afebb253" data-kw="">
<blockquote><p>One of the most distressing accompaniments of revival excitements has been a tendency which has often showed itself in connection with them to sexual irregularities. This tendency does not seem to find its account, solely at least, in the low level of culture of the populations which have furnished the materials on which these revivals chiefly worked. And it certainly is not to be confounded with the opportunity taken by evil-minded persons from the conditions created by the revivals for corrupt practices.

The opportunity has been afforded and improved, the camp meetings of course supplying the most flagrant instances. R[obert B.]. Davidson, describing the great Kentucky revival at the opening of the century, feels bound to consecrate a section to the “too free communication of the sexes,” and, although he excuses himself from giving details on account of the delicacy of the subject, he tells us plainly that dissolute characters of both sexes frequented the camps “to take advantage of the opportunities afforded by the prevailing licence and disorder.”

This, however, was only incidental to the revivals themselves. What needs to be recognized is that the nervous exaltation, which was the direct product of the revival methods too frequently employed, seems not merely to have broken down the restraints to the unchecked discharge of other than religious emotions, but to have opened the channels for their discharge, and even to have incited to it, – so that, as W. Hepworth Dixon puts it in vivid phrase, “the passions seemed to be all unloosed, and to go astray without let or guide.”

It was the participators in the revival excitement themselves who went astray. John Lyle, reviewing the case of the women who had been the subjects of the “falling exercise” prior to November, 1802, found several “by the most unequivocal proofs, to have since fallen still more wofully; no fewer than four individuals having transgressed in the most flagrant manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Humphrey Noyes and his “Bible Communists I. The Environment’, Bibliotheca Sacra</cite></span></figcaption>

<blockquote><p>5th Consideration. I see not but we may separate from the Lord’s Supper where bread is adored, and from baptism where the sign of the cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the word and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church.</p></blockquote>

</figure><figure class="quote" id="q-75d4a8d894" data-kw="">
<blockquote><p>Although the Covenanters opposed “detestable neutrality” in the cause of God and truth, they were not legalistic in their precision. For instance, although they believed in the regulative principle of worship, to the point that they would have died rather than partake in human inventions, they did not quarrel about matters of a circumstantial nature. Indeed, we should keep in mind that, far from being reactionary obscurantists, they accepted a new confession of faith, a new directory for worship, and a new psalter (the products of an assembly of divines held in England; although this did not involve radical doctrinal change). Their maturity contrasts favourably with the fanaticism of some nowadays who will go to war over matters such as psalm-versions or even the tunes which psalms are sung to (such people evidently do not understand the distinction between an element and a circumstance, which is key to understanding the regulative principle). Samuel Rutherford has very strong words to say against those who engage in such legalism:

These are the right precisians who contend for substance, for God, for heaven, for the purity of the gospel. And certainly God is not a thing indifferent, and excellent Jesus Christ is no circumstance; but those who are damnable precisians who contend for feathers and things indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached to the honourable House of Commons at their late solemn fast, Wednesday, January 31, 1643/44 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish commissioners to the Westminster Assembly of divines</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-034818ef77" data-kw="">
<blockquote><p>Certainly in Christ’s time both liturgies by forms and also prayers by habit were used [Lk. 18:11-13]. And yet Christ never interposed in the controversy, so as to condemn the one or the other. He condemns the Pharisees for making long prayers to cover their devouring widows’ houses, and for their praying to be seen of men: But whether their prayers were a liturgy and set form, or whether they were extemporary, He takes no notice, as telling us that He condemned neither! (And it’s likely the Pharisees’ long liturgy was in many things worse than ours, though the psalms were a great part of it: and yet Christ and his apostles oft joined with them, and never condemned them). Nay as far as I can find, the Pharisees and other Jews were not in this so blind and quarrelsome as we; nor never made a controversy of it, nor ever presumed to condemn either liturgies or prayers by habit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 32, p. 176</span></figcaption>

<blockquote><p>If it be here replied that the actions which make up mediate worship, must be actions of the Second Table, not of the First… I answer: It is the verdict of the Word and the common consent of all divines that all the actions and duties which concern our brother as the next object and end, and so determine upon him are required, and regulated by the Second Table: since therefore these things of comliness and order are of this nature, by the Rejoinder’s grant, I do not see how it can be avoided with any colour of reason but they must be commanded in the Second Table, and so come under the definition of mediate worship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), Manuduction, ch. 12, ‘Concerning Worship’, p. 137</span></figcaption>

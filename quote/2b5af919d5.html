<main class="wrap"><figure class="quote" id="q-2b5af919d5" data-kw="">
<blockquote><p>God hath all life, glory, goodness, blessedness, in and of himself; and is alone in and unto himself all-sufficient, not standing in need of any creatures which he hath made, nor deriving any glory from them, but only manifesting his own glory in, by, unto, and upon them: he is the alone fountain of all being, of whom, through whom, and to whom, are all things;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession 2.2</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17e6751446" data-kw="">
<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-b5f431b62f" data-kw="">
<blockquote><p>So then He freely undertook to do and suffer whatever on his part was required; and therein owns Himself the servant of the Father, because He would obey his will and serve his purposes in the nature which He would assume for that end, Isa. 42:1, 6; 49:8-9; Zech. 13:7; and therein acknowledgeth Him to be his Lord, Ps. 16:2, unto whom He owed all homage and obedience…</p></blockquote>

</figure><figure class="quote" id="q-3133fb710f" data-kw="Socinians Trinity">
<blockquote><p>In the one divine essence are there three distinct persons: the Father, Son and Holy Spirit? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.25</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In the one divine essence are there three distinct persons: the Father, Son and Holy Spirit? We affirm against the Socinians.”

— Francis Turretin, Institutes of Elenctic Theology, 3.25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn%20the%20one%20divine%20essence%20are%20there%20three%20distinct%20persons%3A%20the%20Father%2C%20Son%20and%20Holy%20Spirit%3F%20We%20affirm%20against%20the%20Socinians.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3133fb710f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3133fb710f.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-183aba85a8" data-kw="">
<blockquote><p>A commonplace of the history of doctrine has it that the East (following the Cappadocian Fathers) and the West (following Augustine) adopt radically divergent accounts of the Trinity, though it is less commonly agreed just what the differences between the accounts are. For example, it is often held in the textbooks that the Eastern view somehow ‘starts from’ the persons, whereas the Western view somehow ‘starts from’ the essence… Ayres is clearly correct in supposing that this characterization of the matter is false, and I would like to develop that assessment here. … What I shall do here is briefly consider a couple of philosophical theories on the relations between particulars and universals (section I), and then show how, if at all, the theories could dovetail with Trinitarian theology (section II). In my final section – section III – I attempt to deal with an objection to my analysis, namely that Eastern views, as commonly understood, seem compatible with ‘social’ views of the Trinity in ways that Western views do not. I shall argue that this analysis is mistaken, both on historical and on conceptual grounds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Two Models of the Trinity?’ in Heythrop Journal XLIII (2002)</cite>, pp. 275–94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

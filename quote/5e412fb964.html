<main class="wrap"><figure class="quote" id="q-5e412fb964" data-kw="">
<blockquote><p>If a huge and a most mighty army of enemies should overcome any country, killing and spoiling wheresoever they came, so as they could not quickly or easily be driven out again, what should the inhabitants of that country do to provide for the safety of themselves and their children?

First they must fly into the strong defensed cities and tarry there until by Gods help the country might be delivered out of their enemies hands. Next least being besieged they should perish by famine or be constrained to yield themselves to the enemy, they must look for as plentiful provision of vitals as may be.

And because unless the Lord do keep the city, the watchman watcheth but in vain, therefore all the people must with earnest prayers call upon God daily to be with them, keep and defend them. Hereunto it is needful that all within the city observe constantly a brotherly faith, love, peace and concord among themselves: ‘Sith every kingdom divided in it self (as the Lord used to say) cannot stand’ and even the heathen do witness that ‘by concord small matters grow to increase; by discord great things fall to decay.’

Neither is the health of body to be neglected, wherein the citizens must be kept sound and strong as much as may be, for the profit and defense of the common wealth. For the sick and diseased especially at such a time can profit the common state very little, nay they are a great burden and cumbrance to it so far are they from being able to fight against the enemy. Therefore it is very needful that every one look to his health.

Then there is need of a careful and diligent watch, least the foes by any sudden assault or by some deceit or underminings should pierce into the city and set upon us unawares and unprovided. Hereupon are night watches provided. But how can there be any watching without sobriety? For by surfeiting and drunkenness heavy sleep is provoked, so that there can no watch bee kept. Therefore, least being over drowned in wine and sleep, we should be catched by our enemies we have need of sobriety.

And what is more needful then always to have weapons in our hands whereby we our selves may both be kept and defended from the blows of our enemies and may also be able to repel and put back the enemy? Therefore, over and besides our strong walls and well defensed rampiers the citizens themselves must also be ready in their armour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), 1: 59-61.</span></figcaption>

<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the [Scottish, civil] indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>

<blockquote><p>It is ridiculous to profess to find in this a decision of Christ on the subject of war; far more so to find in it a decision against even defensive war as sinful, or against the profession of a soldier as in itself unlawful. It is equally absurd to plead this text in support of what used to be called the divine right of kings, in virtue of which it was held that they might be guilty of extortion and oppression towards their subjects to any extent, while their victims were forbidden by Scripture to rise and resent the tyranny, or rise and throw off the tyrant. The words of Jesus give no countenance to the notion that all war is sinful; and as little to the equally unfounded idea that all revolutions must be rebellions.

We live, as Britons, under a constitution guaranteed to us by a revolution settlement, which was righteous and good, and which banished from the throne a dynasty whom the nation declared, most justly, had forfeited its love and its submission, and whom the judgment of God upon their wickedness has since pursued into extinction. And as we live in internal tranquillity under God, in virtue of a settlement secured by a just revolution; we ought to be prepared in like manner to guard our external relations by readiness, when necessary, for defensive war.

The righteousness, in certain cases, of revolution within; and the righteousness, in certain cases also, of war without; are principles indeed absolutely necessary to the maintenance of peace within the nation itself, and of peace with those around us. And these are principles sanctioned in many passages of Scripture, and certainly not condemned by the words before us.

We venture also very strongly to assert that the admirable historian [J. H. Merle d’Aubigné] of the Reformation has done deep injustice to one of the finest portraits in his noble picture gallery, we mean Zwingle, whom, simply because he died in the field, sword in hand, he represents as having forgotten that the “weapons of our warfare are not carnal,” and as having violated the command which Jesus here gives to Peter. We are persuaded that the lawfulness of the battle in which the great Swiss reformer fell, is not to be settled by the off-hand quotation of this or any other text.

The fact that they were religious men in Switzerland was no reason why they should see, without a struggle, their fatherland overrun and devastated by the wild troops of their allied persecuting foes. Apart from their love to the gospel, it will be no easy matter for any historian to show that the Swiss did wrong in risking their liberties on the issue of battle; and most certainly the introduction into the question of their religious rights as Christians, which they loved and sought to guard even more than their liberties as men, will not make it any easier to prove that they sinned in fighting to defend and retain them. We feel interested in the question; for the memory of our covenanted forefathers in one period of their history stands in the same position, and must share the same fate, as the memory of Zwingle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Calvary: Gethsemane – The Arrest – The Trial</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 175-77.</span></figcaption>

.+Merle+d%E2%80%99Aubign%C3%A9%5D+of+the+Reformation+has+done+deep+injustice+to+one+of+the+finest+portraits+in+his+noble+picture+gallery%2C+we+mean+Zwingle%2C+whom%2C+simply+because+he+died+in+the+field%2C+sword+in+hand%2C+he+represents+as+having+forgotten+that+the+%E2%80%9Cweapons+of+our+warfare+are+not+carnal%2C%E2%80%9D+and+as+having+violated+the+command+which+Jesus+here+gives+to+Peter.+We+are+persuaded+that+the+lawfulness+of+the+battle+in+which+the+great+Swiss+reformer+fell%2C+is+not+to+be+settled+by+the+off-hand+quotation+of+this+or+any+other+text.%0A%0AThe+fact+that+they+were+religious+men+in+Switzerland+was+no+reason+why+they+should+see%2C+without+a+struggle%2C+their+fatherland+overrun+and+devastated+by+the+wild+troops+of+their+allied+persecuting+foes.+Apart+from+their+love+to+the+gospel%2C+it+will+be+no+easy+matter+for+any+historian+to+show+that+the+Swiss+did+wrong+in+risking+their+liberties+on+the+issue+of+battle%3B+and+most+certainly+the+introduction+into+the+question+of+their+religious+rights+as+Christians%2C+which+they+loved+and+sought+to+guard+even+more+than+their+liberties+as+men%2C+will+not+make+it+any+easier+to+prove+that+they+sinned+in+fighting+to+defend+and+retain+them.+We+feel+interested+in+the+question%3B+for+the+memory+of+our+covenanted+forefathers+in+one+period+of+their+history+stands+in+the+same+position%2C+and+must+share+the+same+fate%2C+as+the+memory+of+Zwingle.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Shadow+of+Calvary%3A+Gethsemane+%E2%80%93+The+Arrest+%E2%80%93+The+Trial%2C+%28Edinburgh%3A+Lyon+%26+Gemmell%2C+1875%29%2C+pp+175-77.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcf42d56e33.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cf42d56e33.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/09/hugh-martin-in-defence-of-the-glorious-revolution-and-ulrich-zwinglis-bearing-of-arms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…green and raw deliverances are plagues of God, not mercies; the plague is nine times removed, but Pharaoh’s heart is neither softened nor humbled, the scum abideth in the bloody city, as the Lord complains, Eze. 24:6, ‘Therefore thus saith the Lord God, Woe to the bloody City, to the pot whose scum is therein, and whose scum is not gone out;’ the prophet in Chaldea heard that Jerusalem had been boiled with the sword of the Lord, but the scum of their idolatry and blood remained in them; whilst the wicked of these kingdoms, malignants, bloody Irish, rotten hearted men, such backsliders and perjured apostates, as are in Scotland, delivered to Satan and excommunicated, while these taste of the gall and wormwood of the wrath of God in this war, the hand of God cannot be removed, and therefore that must be taken notice of, Jer. 6:29, ‘The bellows are burnt, the lead is consumed of the fire, the founder melteth in vain: for the wicked are not plucked away;’ O that our Lord would boil out on the fire the scum of both kingdoms. The whoredoms of Popish Egypt, and the ceremonies, the inventions of men are not mourned for by the pastors of the Lord, sure, I am, not by most of the ministers in Scotland…</p></blockquote>

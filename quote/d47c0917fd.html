<main class="wrap"><figure class="quote" id="q-d47c0917fd" data-kw="">
<blockquote><p>In the first place I say that the deity which the Papists worship, under that highest and most glorious name of God, is imaginary and fictitious. For it is agreed among all that the true God is supremely and perfectly just and merciful. But neither is that justice perfect which rests in human satisfactions, nor is that mercy perfect which only supplies what is lacking to the merits of men. Let the Papists go, then, and boast that they worship the true God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/holiness-and-justice.html">Holiness and Justice</a></span><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.19</span></figcaption>

</figure><figure class="quote" id="q-8d08e1330a" data-kw="Holiness Author of sin">
<blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote>

</figure><figure class="quote" id="q-d5bb7e8c5d" data-kw="">
<blockquote><p>In the past, God had left sins unpunished. He could conceivably be accused of overlooking sin since He had not required punishment for it. Now, however, He has put forth Jesus. This proves that God is just (His wrath required the sacrifice) and that He is the justifier of those who have faith in Jesus (His love provided the sacrifice for them).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/millard-erickson.html">Millard Erickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 828</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d47c0917fd" data-kw="">
<blockquote><p>And in the first place I say that the deity which the Papists worship, under that highest and most glorious name of God, is imaginary and fictitious. For it is agreed among all that the true God is supremely and perfectly just and merciful. But neither is that justice perfect which rests in human satisfactions, nor is that mercy perfect which only supplies what is lacking to the merits of men. Let the Papists go, then, and boast that they worship the true God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 2, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-84de3e55fc" data-kw="">
<blockquote><p>For this I affirm (and would that I could not, for such just causes, affirm it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>

</figure><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 100</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fc70d38fca" data-kw="">
<blockquote><p>VI. The Purpose and Extent of the Atonement 5. THE WIDER BEARING OF THE ATONEMENT. The question may be raised, whether the atonement wrought by Christ for the salvation of the elect, and of the elect only, has any wider bearing… Several Reformed theologians hold that, though Christ suffered and died only for the purpose of saving the elect, many benefits of the cross of Christ do actually — and that also according to the plan of God — accrue to the benefit of those who do not accept Christ by faith. They believe that the blessings of common grace also result from the atoning work of Christ. [Cf. Witsius, De Verbonden II, 9.4; Turretin, Loc. XIV, Q. 14, Sec. 11; Cunningham, Hist. Theol. II, p. 332; Hodge, The Atonement, 358 and elsewhere; Grosheide in the Evangelical Quarterly, April, 1940, p. 127. Cf. also Strong, Syst. Theol., p. 772.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1950)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5cd726bb37" data-kw="">
<blockquote><p>41. And indeed, God loves all his creatures, insofar as they are his creatures, but not with the same level of love. For he loves some in Christ, whom he chose in Christ from eternity according to the will of his good pleasure. He does not love the reprobate in the same way, whom nevertheless he does not damn as innocent, but on account of their voluntary wickedness and willful unbelief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Disputation on that Place of Paul</cite>, 1 Cor. 15:22, ‘As in Adam All Die, so in Christ All shall be Made Alive’, &amp; of this Question, Whether Christ has Died for All?, pt. 5 tr. Michael Lynch (Heidelberg, 1589)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>Nebuchadnezzar… was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven… And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation. And all the inhabitants of the earth are reputed as nothing: and He doeth according to his will in the army of heaven, and among the inhabitants of the earth… At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f9804783ca" data-kw="">
<blockquote><p>My design is to indicate how slowly the process ran out its course, by which a Lutheran and a Reformed Church arose in Germany in the sixteenth century… These [Lutheran and Reformed] reformations are then [popularly] thought of as like two circles, which merely touch each other; or, according to others, which really intersect, and have large segments in common, but which yetnever cover exactly the same space, or were drawn from one center… It is easy to refute this false opinion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed in the Sixteenth Century” in Presbyterian &amp; Reformed Review, vol. 5, no. 19 (July, 1894), pp. 415-33</cite>, p. 415</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-24523dec6b" data-kw="">
<blockquote><p>XI… Nor do we notice here the more rigid judgments of some of those who take their name from the great Luther, who, carried away by sinister prejudices, are accustomed to attack us. For however harshly they may have treated us, we do not cease to honor them with brotherly affection. And if, their prejudices and private affections being laid aside, they would seriously examine the thing itself by the law of love, truth and Christian prudence, they would not be so much averse to a pious syncretism and reconciliation with us, or at least a mutual toleration, to which not a few of the more moderate among them are not indisposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 3, 18th Topic, question 15, “Are the evangelical and Reformed churches true churches of Christ?”</cite>, p. 143</span></figcaption>

</figure><figure class="quote" id="q-e6ee3afac0" data-kw="">
<blockquote><p>[Eckhardi says:] This we accept of infants, who are so in the covenant due to the faith of the parents, that they are justified by the faith of the parents. …I respond 1. not all infants of pious parents are received in the Covenant of God: so it was said of Ishmael which was the son of Abraham; and of Esau which was the son of Isaac. 2. Of the impious, or such as the Turks and other heathens, and their infants passing away in infancy, they all are certainly condemned, as is evident from 1 Cor. 7:14, indeed they are such as are unclean. If, however, it is understood that the impious are in the Covenant as far as the external society, I say even that God may not only look to this, but to the grandfather and the grandfather’s grandfather, so that it may be indeed such children frequently are in the Covenant with God, and the Covenant has been taken hold of for them by previous parents. …but where they are already adolescents, they having their own faith, then this faith [of others] is the more not necessary for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Maccovius Revived, or Manuscripts of his… ed. Nicolaas Arnoldi (Amsterdam, 1659) | ‘Anti-Eckhardus’ [Heinrich Eckhardi 1580-1624] | 17. On Justification 671 | III. ‘Whether anyone is able to be justified by the faith of another, being destitute of their own?’ 672</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-4fbf76523b" data-kw="">
<blockquote><p>XIII. What chiefly prevents the Reformed from uniting with the Roman Church, while they are ready to reconcile with those who follow the Augsburg Confession, is that in the public and external worship of those singularly devoted to the Augsburg Confession, there is nothing that could gravely scandalize the Reformed and prevent them from attending in good conscience. Conversely, there is nothing in the Reformed worship that could reasonably offend the conscience of other Protestants or be a stumbling block to them. In neither case is anything publicly adored that is not believed and professed by both to be God. But the public and external worship of the Roman Church primarily consists of practices that the Reformed cannot, in good conscience, either perform or approve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’</cite>, p. 952 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

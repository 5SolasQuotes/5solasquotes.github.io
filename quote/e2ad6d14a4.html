<main class="wrap"><figure class="quote" id="q-e2ad6d14a4" data-kw="">
<blockquote><p>The law of the Sabbath in part has its ground in the universal and permanent needs of human nature, and especially of men embraced under an economy of redemption. It is designed — (1.) To keep in remembrance the fact that God created the world and all its inhabitants (Gen ii. 2, 3; Ex. xx. 11), which is the great fundamental fact in all religion, whether natural or revealed. (2.) As changed to the first day of the week it is designed to keep in remembrance the fact of the ascension of the crucified Redeemer and his session at the right hand of power, the great central fact in the religion of Christ. (3.) To be a perpetual type of the eternal Sabbath of the saints which remains. Heb. iv. 3-11. (4.) To afford a suitable time for the public and private worship of God and the religious instruction of the people. (5.) To afford a suitable period of rest from the wear and tear of labour, which is rendered alike physically and morally necessary from the present constitution of human nature and from the condition of man in this world.

All of these reasons for the institution of the Sabbath have their ground in human nature, and remain in full force among all men of all nations, in all stages of intellectual and moral development. Hence the Sabbath was introduced as a divine institution at the creation of the race, and was then enjoined upon man as man, and hence upon the race generally and in perpetuity. Gen. ii. 2, 3.

Hence we find that the Jews (Gen. vii. 10; viii. 10; xxix. 27, 28; Job ii. 13), and all Gentile nations also, as the Egyptians, Arabians, Indians, etc., divided their time by weeks, or periods of seven days, from the earliest ages. Hence before the giving of the law the Jews were required to observe the Sabbath. Ex. xvi. 23. Hence also the law with respect to the Sabbath has been incorporated into the Decalogue, as one of the ten requirements in which the entire moral law, touching all our relations to God and to our fellow-men, is generalized and condensed.

It was written by the finger of God on stone. It is put side by side with the commandments which require us to love God, to honour his name, and which forbid unchastity and murder. It was put, as a part of the “testimonies of God,” under the “mercy-seat,” at the foundation of his throne. And hence, when the great commandment is uttered, God does not say, “I appoint to you a Sabbath-day,” but, “remember the Sabbath day, to keep it holy,” — evidently implying that he was referring to a wellknown and pre-existent institution common to the Jews with the Gentiles.

And the reason annexed for the enactment of the law is not a fact peculiar to Jewish history, but a fact underlying all the relations God sustains to the entire race, and, as before shown, the fact out of which the Sabbatic institution had originated thousands of years before — “For in six days the Lord made heaven and earth, the sea,” etc. Ex. xx. 8-ll. So Christ says, “The Sabbath was made for man;” that is, for mankind. Mark ii. 27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ed. William H. Goold (British edn, London: T. Nelson and Sons, 1870), pp 281-82.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-629d1dd748" data-kw="">
<blockquote><p>Those virtues which more immediately respect God, appeared in Christ in the work that he did for our redemption. There appeared in him an holy fear and reverence towards God the Father. Christ had a greater trial of his virtue in this respect than any other had, from the honourableness of his person. This was the temptation of the angels that fell, to cast off their worship of God, and reverence of his majesty, that they were beings of such exalted dignity and worthiness themselves.

But Christ was infinitely more worthy and honourable than they; for he was the eternal Son of God, and his person was equal to the person of God the Father: and yet, as he had taken on him the office of mediator, and the nature of man, he was full of reverence towards God. He adored him in the most reverential manner time after time. So he manifested a wonderful love towards God.

The angels give great testimonies of their love towards God, in their constancy and agility in doing the will of God; and many saints have given great testimonies of their love, who, from love to God, have endured great labours and sufferings, but none ever gave such testimonies of love to God as Christ has given; none ever performed such a labour of love as he, and suffered so much from love to God. So he manifested the most wonderful submission to the will of God. Never was any one’s submission so tried as his was. So he manifested the most wonderful spirit of obedience that ever was manifested.</p></blockquote>

<blockquote><p>Vers. 20. Wherefore if ye be dead with Christ from the Rudiments of the world; why, as though living in the world, are ye subject to Ordinances?

The third Admonition follows with a reprehension, because they had subjected themselves to decrees or human traditions and doctrines of men, determining Religion, in those things which God hath not determined. There are five Arguments of the Admonition or Reprehension: (1) Because ye are freed by the death of Christ from all carnal rudiments of Religion, such as Judaical ceremonies, so that you have no further to do with them, ye ought not to admit the decrees and precepts of men, as if as yet after the manner of children under Rudiments, ye were obnoxious to such sort of Elements.

The force of this first Argument consisteth in these five things: (1) Christ hath fulfilled that which was prefigured by Moses his ceremonies, and by his death hath abrogated those typical ceremonies, and that shadowy manner of teaching the Church and worshipping God, so that the legal Covenant cannot exact anything more from him, than that which was paid and perfected in his death.

(2) Christ dying, all in Covenant are dead judicially with him, whose person Christ hath born: Therefore the legal Covenant could exact nothing more from them, for whose sake Christ died, than the Laws of men required of those that are dead: For all in him are reckoned as dead.

(3) All ceremonial Precepts in respect of the authority commanding, were divine and heavenly until Christ: But now abolished through Christ, they cease to be divine, and begin to be human elements, or rudiments worldly and carnal, not so much in respect to the things commanded, as to the mundane authority commanding them.

(4) So long as the Colossians were not converted to Christ, but did live in the world as worldlings free from righteousness, so they were slaves to devils and men, obnoxious to all manner of servitude, and to all kind of evil.

(5) But now after they were one body with Christ, they were made free by faith, and also were set at liberty from all evil, neither ought they to submit themselves to any yoke, unless to that which Christ would have them subjugated, and consequently they ought not to be subject in the business of Religion to the opinions and traditions of men.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Vers. 20. Wherefore if ye be dead with Christ from the Rudiments of the world; why, as though living in the world, are ye subject to Ordinances?

The third Admonition follows with a reprehension, because they had subjected themselves to decrees or human traditions and doctrines of men, determining Religion, in those things which God hath not determined. There are five Arguments of the Admonition or Reprehension: (1) Because ye are freed by the death of Christ from all carnal rudiments of Religion, such as Judaical ceremonies, so that you have no further to do with them, ye ought not to admit the decrees and precepts of men, as if as yet after the manner of children under Rudiments, ye were obnoxious to such sort of Elements.

The force of this first Argument consisteth in these five things: (1) Christ hath fulfilled that which was prefigured by Moses his ceremonies, and by his death hath abrogated those typical ceremonies, and that shadowy manner of teaching the Church and worshipping God, so that the legal Covenant cannot exact anything more from him, than that which was paid and perfected in his death.

(2) Christ dying, all in Covenant are dead judicially with him, whose person Christ hath born: Therefore the legal Covenant could exact nothing more from them, for whose sake Christ died, than the Laws of men required of those that are dead: For all in him are reckoned as dead.

(3) All ceremonial Precepts in respect of the authority commanding, were divine and heavenly until Christ: But now abolished through Christ, they cease to be divine, and begin to be human elements, or rudiments worldly and carnal, not so much in respect to the things commanded, as to the mundane authority commanding them.

(4) So long as the Colossians were not converted to Christ, but did live in the world as worldlings free from righteousness, so they were slaves to devils and men, obnoxious to all manner of servitude, and to all kind of evil.

(5) But now after they were one body with Christ, they were made free by faith, and also were set at liberty from all evil, neither ought they to submit themselves to any yoke, unless to that which Christ would have them subjugated, and consequently they ought not to be subject in the business of Religion to the opinions and traditions of men.”

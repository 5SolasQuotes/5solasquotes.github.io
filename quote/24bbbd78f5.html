<main class="wrap"><figure class="quote" id="q-24bbbd78f5" data-kw="">
<blockquote><p>…in the case of a rational substance, an end toward which it is directed can be known intellectually, and that the will or rational appetite just is that power by virtue of which such a subtance can aim at an end qua grasped by the intellect.ª ª We can, of course, also aim at ends that are not grasped by the intellect. For example, any human being aims at the end of circulating blood through his body, just by virtue of having a heart and blood vessels, and does so even if he is completely unaware of the existence of this circulatory system. It is precisely because we can iam at such ends without the intellect being cognizent of them that their pursuit is not the subject of the will. A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 1, ch. 4, ‘The Will’; pp. 137-38</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6b2cfa0ec6" data-kw="">
<blockquote><p>III… Although this concept cannot be conveniently defined, since it is not a single entity by its nature but rather an aggregate of various diverse natures, and therefore defies categorization according to logical principles, it can be most conveniently described as the conformity of man, according to his measure, to the supreme perfection of God. As D. Ames presents it in Medulla Theologiae (Book 1, Chapter 8, Sections 9 and 68), it is helpful to analyze this further. It is called conformity because an image, as such, is a kind of likeness expressed from another; therefore, it must be described through similarity and conformity, not identity… The subject of this image, both directly and indirectly, is man. Here we note two points: first, that man can be considered in his fourfold state: as whole in creation, fallen in corruption, restored in regeneration, and glorified in glorification. For each of these states, a different aspect of the image is attributed to him by the Holy Scriptures in various ways… Secondly, we must note, following Genesis 1:26-28, that women are by no means excluded from this image… Furthermore, the phrase “according to his measure” is not without significance, for although this conformity is in itself most perfect, it varies according to the capacity of its subjects (since it applies differently to angels than to humans). Consequently, this image was also implanted in humans according to their measure—that is, perfectly (for nothing imperfect comes from God), yet in a way divinely adjusted to their capacity, as they were not endowed with supreme perfection. Lastly, the phrase “to the supreme perfection of God” alludes to the genuine archetype and original exemplar to which man, as a secondary type and copy, is said to conform. The reason for this conformity is explained in the prolegomena. I will add only this: that this communication should in no way be conceived as formal but only effective, by way of effect… IV… Therefore, we examine the parts or the substance from which it (as previously mentioned, it is composed of multiple elements) consists, in three aspects: first, those concerning the body; second, those concerning the soul, which are further divided into 1) essence, 2) faculties, and 3) habits; and third, those concerning the whole composite… although various parts constituting this image are enumerated here, it should be understood that not all contribute equally—some antecedently and presuppositionally, others formally and primarily, and still others consequentially and sequentially.</p></blockquote>

</figure><figure class="quote" id="q-c16e5bdc40" data-kw="">
<blockquote><p>But I add, that, as the Son was the common head [by creation] both of men and angels, so the dignity which was conferred on man belonged to the angels also. For when we hear them called the sons of God (Ps. lxxxii. 6) it would be incongruous to deny that they were endued with some quality in which they resembled the Father. But if He was pleased that his glory should be represented in men and angels, and made manifest in both natures, it is ignorant trifling in Osiander to say that angels were postponed to men, because they did not bear the image of Christ. They could not constantly enjoy the immediate presence of God if they were not like to Him; nor does Paul teach (Col. iii. 10) that men are renewed in the image of God in any other way than by being associated with angels, that they may be united together under one head. In fine, if we believe Christ our felicity will be perfected when we shall have been received into the heavens, and made like the angels. But if Osiander is entitled to infer that the primary type of the image of God was in the man Christ, on the same ground may anyone maintain that Christ behoved to partake of the angelic nature, seeing that angels also possess the image of God.</p></blockquote>

<blockquote><p>The image consists antecedently in nature (as to the spirituality and immortality of the soul); formally in rectitude or original righteousness; consequently in the dominion and immortality of the whole man (which was the brightness of that shining image and the rays striking out in all directions which illumined the whole man).</p></blockquote>

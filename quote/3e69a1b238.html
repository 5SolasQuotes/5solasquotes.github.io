<blockquote><p>Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.</p></blockquote>

</figure><figure class="quote" id="q-16910d1a50" data-kw="">
<blockquote><p>We hold that the Scriptures are most perfect, containing in them all doctrines needful to salvation, whether they concern faith or manners: and therefore we acknowledge no such traditions beside the written word, which shall be necessary to salvation; so as he which believe them not, cannot be saved.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We hold that the Scriptures are most perfect, containing in them all doctrines needful to salvation, whether they concern faith or manners: and therefore we acknowledge no such traditions beside the written word, which shall be necessary to salvation; so as he which believe them not, cannot be saved.”

</figure><figure class="quote" id="q-0df9e898c7" data-kw="">
<blockquote><p>I must turn to the Word of God. In questions of this kind it matters nothing what the world thinks right or wrong. There is only one sure test of truth. What says the Scripture? What is written in the Bible? What is the mind of the Holy Spirit? If we cannot submit our judgments to this infallible umpire, it is useless to pretend that we have any religion at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, ch. on The Heart, p. 322</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-6165730314" data-kw="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned; at least, we take it for granted in this inquiry that infallible inspirations in the discovery of things not before revealed are ceased in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</span></figcaption>

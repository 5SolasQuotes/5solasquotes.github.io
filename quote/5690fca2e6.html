<main class="wrap"><figure class="quote" id="q-5690fca2e6" data-kw="">
<blockquote><p>…we have in these verses a remarkable testimony to Christ’s infinite superiority over all that are born of women… There is a constant tendency in human nature to ‘hear man’ [contrast Mt. 17:5]. Bishops, priests, deacons, popes, cardinals, councils, presbyterian preachers, and independent ministers, are continually exalted to a place which God never intended them to fill, and made practically to usurp the honor of Christ. Against this tendency let us all watch, and be on our guard. Let these solemn words of the vision ever ring in our ears, ‘Hear ye Christ.’ [Mt. 17:5] The best of men are only men at their very best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels, on John ch. 9</cite>, 17:1-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-63ffae41b2" data-kw="">
<blockquote><p>Answer: To distribute in a civil and natural way requires not a man full of the Holy Ghost, but to distribute in simplicity and with the grace of heavenly cheerfulness, Rom. 12:8, and with the qualities of a complete deacon, 1 Tim. 3:[9,] 12-14, requires the Holy Ghost [Acts 6:3-5], though they may be good deacons who are not full of the Holy Ghost; but such [persons full of the Holy Ghost] were chosen: 1. Because this was to be a rule to all deacons to the world’s end, and the rule should be as straight and perfect as can be; 2. Because there were choice of such men as those in the apostolic Church, and [there is] reason that God be served with the best of his own; 3. The Holy Ghost is required for sanctification, as well as for gifts of preaching, Luke 1:15; Mt. 10:20. 4. Stephen [a deacon] did no more (Acts ch. 7) in his apology than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman, who yet may not preach, 1 Cor. 14:34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<main class="wrap"><figure class="quote" id="q-d8f6b1f4d1" data-kw="">
<blockquote><p>A prayer upon the Lord’s prayer.

O Most mighty Lord and eternal God, who hast by thy dear son Christ Jesus our Lord and Saviour, reconciled unto thy self all things in heaven and earth, and in him haste made an everlasting bond and covenant with us thy faithful children, that thou wilt not only be our God, but also our most loving and merciful Father, whereof as a pledge thou hast given us thy holy Spirit of adoption, whereby we may with boldness and full trust and confidence come to thee by hearty prayer, as unto our most loving and merciful Father, being assured that thou wilt not deny us any thing which thou knowest shall be expedient for us: grant we beseech thee (dear Father) that we being fully persuaded in our hearts of this thy fatherly love and affection towards us, may be stirred up to make our petitions with such an affection, ardent desire, love and reverence to thy majesty, that our minds be not carried away with by thoughts creeping in, but without all wandering may be fully bent and attentive to the thing we ask, and fully staid upon thy merciful and just protection.

We then beseech thee (dear Father) that thou wilt strengthen our hearts with thy holy Spirit, that considering thou hast made all things for the glory of thy Name, so we may in all our doings, enterprises, counsels and purposes, chiefly above all things seek thy Glory: that we may fully acknowledge thee not only the Author of all things, but the ruler, guider and governor of all things, both in Heaven and earth: that we never diminish thine incomprehensible Glory, by attributing unto our selves any power, strength, or ability to do, will, or think that which is good: but from our hearts we may acknowledge all our goodness to come from thee, yielding for the same continually praise and thanksgiving to thy glorious Name: that we never by distrusting thy merciful providence, dishonour thy Name, but that even in our greatest distress we may put our full confidence in thee, not looking upon our weakness, but staying upon thy power and promises, by hearty prayer fleeing unto thee our only refuge: that our whole life may be so framed according to thy holy will in all points, that thy glorious Name in us may be sanctified, and that we be not an occasion that thy holy Name be blasphemed through our wicked life and conversation.

Let thy Kingdom (most merciful Father) appear, and manifestly be declared in all the world, but especially amongst thy Church, and faithful flock: declare thy self Lord and King over them, ruling them by the sceptre of thy holy word, and force of thy holy Spirit. Increase the number of faithful Pastors and Preachers amongst the people: bless their labours to the increase of this Kingdom of thy dear Son Jesus Christ, and to the destruction of the kingdom of Satan and antichrist. Suppress the rage of the enemies, that they may know that thou, O Lord, doest reign in all ages, to the behoof of thy Church and terror of thine enemies.

Grant these mercies good lord, not only to the whole Church in general, but especially to every one of us thy Children particularly: Grant that we may effectually feel the force of this thy Kingdom in our hearts. Beat down in us our old corrupt Adam, with all sinful delights, thoughts, motions, and desires: and renew in us day by day our spiritual and inward man, that we may be wholly bent to delight, think, desire, and do those things which be acceptable in thy sight.

Frame our hearts (good Lord) with such humble obedience to thy holy will, that we may be heartily well content with whatsoever it pleaseth thy goodness to lay upon us: that we never cease in our miseries, but continually call upon thee by hearty prayers, although we feel no release at all, yet that still patiently we may abide, and quietly wait for thy good leisure and appointed time of deliverance, when thou knowest it shall be most expedient for us.

Grant us, dear Father, that all our counsels, studies, labours and endeavours, being by thy holy spirit guided and framed, we may every one in that vocation in which thou haste placed him, so faithfully travail, to the discharging of our consciences, and edifying of thy Church, that our accompt may be found acceptable before thy throne and Judgement seat. So blesse our labours and travels, that we may have sufficient for the preserving of this present life, and be content with those benefits which thou shalt bestow upon us, whether they be many or few, acknowledging them to be received of thee: not greedily to care for them or vainly to delight in them, but thankfully esteem of them, as thy benefits bestowed upon us, and as faithful Stewards moderately to use them to the relief of our brethren, and the discharge of our consciences.

Increase in us (good Lord) the gift of faith, that we may daily more and more in our souls and consciences be assured, that our sins be defaced, clean blotted out, and covered with the full, perfect, and sufficient sacrifice of thy dear Son Christ Jesus our Lord and Saviour once made for vs that we are united, knit, and made one body with him, partakers of his righteousness, justification, and holiness, and even fellow heirs with him of everlasting life: that we may unfeignedly from the bottom of our hearts love thee for this thine unspeakable goodness and mercy: forgiving from our hearts our brethren which doe offend us, pray for them, love, cherish, and comfort them as fellow members all of one body, with perfect natural love and compassion linked together to our head Christ Jesus.

Strengthen us, good Lord, with thy holy spirit, that we be not overcome with the subtle suggestions and sinful motions of Satan the devil: hold us up with thy merciful hand that we sleep not in sin, that we be not drawn away with the wicked world, nor the enticements of the flesh, to delight in wickedness: but so arm us with thy mighty power, that we may strongly abide all the assaults and subtle sleights of our ghostly enemy, and sincerely to walk before thy face, both in prosperity and adversity, to thy honour and glory, the health of our souls, &amp; profit of thy Church, through Jesus Christ our only Lord and Saviour. Amen.</p></blockquote>

<blockquote><p>The reasons why secret prayer is the mark of a sincere heart are as follows: A sincere heart busies itself about heart work to mortify sin, to quicken grace, to observe and resist temptation, to secure and advance his evidences; therefore, it is much conversant with secret prayer. … The more a saint converses with his own heart, the more he searches his spirit. He labours to walk before God, as being always in His sight, but especially when he presents himself at the footstool of mercy.</p></blockquote>

<blockquote><p>And in this way, under the head of prayer, which is an offering up of desires, there may be comprehended the consideration of the whole motives by which men are induced to engage in theological study, and in preparing for the work of the ministry. The motive by which men should be led to engage in theological study is a real desire to attain to the knowledge of God’s revealed will, and the grounds of reason of this desire, the causes that produce it, and keep it in strong and vigorous exercise, should be right views of its nature, excellence, and objects, as coming from God, as making him known to us, and as communicated by him to men, in order that they, through the knowledge and belief of it, may be saved from eternal misery, and enabled to glorify God and to enjoy him for ever.

It is because theology, as taught in the word of God, is possessed of this character, and intended to be the means of effecting these results, that you should desire the knowledge of it. And as candidates for the office of the ministry, you should seek and desire the knowledge of it, not only for your own salvation, but in order that, devoting your lives to the making it known to others, you may become the instruments of saving the souls of your fellow-men.

A desire to attain to a full knowledge of God’s revealed will, and generally to acquire all the qualifications necessary for entering upon the work of the ministry, originating in such views as these, clearly apprehended, and deeply impressed upon your hearts, will ever be accompanied with profound humility, with a deep sense of responsibility, and with a firm determination to be unwearied and persevering, to spare no pains, and to shrink from no sacrifice, in the use of all the means by which the necessary knowledge may be acquired, and the due qualifications may be secured. And the first and most indispensable of all requisites is, that you have such a desire, founded upon such views and considerations; and whenever this desire becomes at any time weak and languid, you are to seek to have it strengthened and invigorated by meditation upon the value of divine truth, and the preciousness of the salvation of souls.

When this desire has been really called forth in your hearts—and without it your labours and studies in acquiring theological knowledge cannot be expected to lead to any important practical results, but only to harden your hearts and prove offensive to God—then you will feel constrained to offer it up to God in prayer, under a conviction that he alone can gratify it, and animated by the assurance that he has promised his Holy Spirit to them that ask him.

If all your studies, and especially all your attempts to ascertain the meaning of the statements of God’s word, are not accompanied by fervent prayer for the outpouring of the Holy Spirit, the inference is irresistible, either that you do not really desire to become savingly acquainted with divine truth for your own benefit and that of others, or else that you do not really believe that God alone can bestow this knowledge, and that he usually gives it in answer to prayer.

And it is most proper that, in connection with this topic, you should examine carefully into the state of your hearts, and into the motives which have led you to engage in a course of theological study, the desires by which you are animated in the prosecution of it, and the objects which you have in view. Without right views and deep impressions of the origin and source, the character and objects of theological truth, you can have no right and well-principled desire to acquire the knowledge of it, and without such a desire existing in your heart, and distinctly recognised and felt there, you can present no sincere or acceptable prayer to God for the enlightening influences of the Holy Spirit.

Where no desire exists in the heart, of course it cannot be offered up; and where a desire for the outpouring of the Holy Spirit is not offered up, there is no reason to expect that the Spirit will be given. If you are not yet aware that a useful and really valuable knowledge of theology must come from the Holy Spirit, and is usually given in answer to prayer, you are still ignorant of the first principles of God’s oracles; and if you have no real and ardent desire to get this knowledge, and are not ready and resolved to abound and to persevere in the use of all the means which may contribute to the attainment of it, then your attendance here is a mockery, it is a hypocritical profession which does not correspond with the actual state of your hearts; and in that case it would be much safer and more expedient for you to direct your attention to some other object of pursuit.

Your prayers thus become tests of your character and motives—plain indications of the real desires that exist in your hearts, and of the objects which you are really aiming at. Although a desire to have the enlightening influences of the Holy Spirit is the only right basis, and will prove the only efficient source of prayer for his outpouring, yet it is to be remembered that the desire must not only exist, but must also be offered up.

Men are very apt to deceive themselves in regard to the state of their hearts, and the character of their desires and affections. They are not naturally inclined to pray, and you must beware of being satisfied with any other evidence of the existence and strength of that desire, under the influence of which you profess to be acting, except the fervency and the frequency with which you offer it up to God in prayer.</p></blockquote>

<blockquote><p>O Lord God, our hearts rejoice in Thee, because we rejoice in Thy salvation. For Thou art holy; for there is none beside Thee, neither is there any rock like our God. Thou art a God of knowledge, and by Thee actions are weighed. Thou makest poor and makest rich; Thou bringest low and liftest up; for the pillars of the earth are the Lord’s, and He hath set the world upon them. Thou wilt keep the feet of Thy saints; for by strength shall no man prevail.

Blessed be the Lord, the God of Israel; for He hath visited and wrought redemption for His people, and hath raised up salvation for us in the house of His servant David, as He spake by the mouth of His holy prophets since the world began. Thou hast remembered Thy holy covenant, to give knowledge of salvation unto Thy people in the remission of their sins; because of the tender mercy of our God, whereby the day-spring from on high shall visit us, to shine upon them that sit in darkness and the shadow of death; to guide our feet in the way of peace. Now unto the King of the ages, incorruptible, invisible, only God, be honour and glory to ages of ages.

We supplicate, O God, on behalf of this Theological Seminary, that in everything it may be enriched in every word and in all knowledge in Christ Jesus, so as to come behind in no gift, and that while we wait for the revelation of our Lord Jesus Christ, it may be confirmed by Him unto the end. Let the spirit of the Lord be here as liberty, that all who come to be made sufficient ministers of the new covenant of the Spirit that giveth light, may, with unveiled face reflecting as a mirror the glory of the Lord, be transformed into the same image from glory to glory. Thou that saidst: Light shine out of darkness, shine in our hearts to give the light of the knowledge of the glory of God in the face of Jesus Christ.

O God, who hast given unto us the sure word of prophecy that came by men who spake from God being moved by the Holy Ghost, cause the Directors of this Seminary to take heed thereto, as unto a lamp shining in a dark place until the day dawn and day star arise in our hearts. Make them diligent to have these things at every time called to remembrance, and enable them to set as teachers in this school of prophets men that have renounced the hidden things of shame, and that walk not in craftiness, nor handle the Word of God deceitfully, but by manifestation of the truth commend themselves to every man’s conscience in the sight of God.

On behalf of the Professors and Instructors, we beseech Thee, O God, that as they have received the word, so Thou wouldst cause them to continue steadfastly in the apostles’ teaching, and in fellowship and prayers. Cause them to know how men ought to behave themselves in the house of God which is the church of the living God, the pillar and ground of the truth: and make them able teachers of the same, that the ministers trained by them may be men that strive not about words to the subverting of them that hear, but present themselves approved unto God, workmen that need not be ashamed, handling aright the word of God.

We beseech Thee, O God, for him who at this time is to be separated unto teaching the gospel of God, which Thou promisedst afore through the prophets in the Holy Scripture concerning Thy Son, who was born of the seed of David, who was declared to be the Son of God with power according to the spirit of holiness by the resurrection of the dead. Grant that when handling this word of prophecy he may not be ashamed of the gospel, but may set it forth as the power of God unto salvation to every one that believeth.

And because at this time there are many teachers who are foolish men and slow of heart to believe in all that the prophets have spoken, may the spirit of Christ, beginning from Moses and all the prophets, interpret to him in all the Old Testament scriptures the things concerning Christ. Make him able to teach the rising ministry that what was there written was written for their learning, that through comfort of the Scriptures they might have hope.

Be pleased, O God, to cause the whole body of students of divinity in this Seminary, and all that succeed them, to be of the same mind one with another according to Jesus Christ, that they may with one mouth glorify the God and Father of our Lord Jesus Christ. Fill them with all joy and peace in believing, that they may abound in hope, in the power of the Holy Ghost.

Have mercy upon us according to Thy loving-kindness, and forgive all our iniquities. Help us at this time to worship Thee acceptably. Approve and bless what we now do in the name of Jesus Christ our Lord; to Whom, with the Father and the Holy Ghost, we would give all the glory, now and forever. Amen.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“O Lord God, our hearts rejoice in Thee, because we rejoice in Thy salvation. For Thou art holy; for there is none beside Thee, neither is there any rock like our God. Thou art a God of knowledge, and by Thee actions are weighed. Thou makest poor and makest rich; Thou bringest low and liftest up; for the pillars of the earth are the Lord’s, and He hath set the world upon them. Thou wilt keep the feet of Thy saints; for by strength shall no man prevail.

We supplicate, O God, on behalf of this Theological Seminary, that in everything it may be enriched in every word and in all knowledge in Christ Jesus, so as to come behind in no gift, and that while we wait for the revelation of our Lord Jesus Christ, it may be confirmed by Him unto the end. Let the spirit of the Lord be here as liberty, that all who come to be made sufficient ministers of the new covenant of the Spirit that giveth light, may, with unveiled face reflecting as a mirror the glory of the Lord, be transformed into the same image from glory to glory. Thou that saidst: Light shine out of darkness, shine in our hearts to give the light of the knowledge of the glory of God in the face of Jesus Christ.

O God, who hast given unto us the sure word of prophecy that came by men who spake from God being moved by the Holy Ghost, cause the Directors of this Seminary to take heed thereto, as unto a lamp shining in a dark place until the day dawn and day star arise in our hearts. Make them diligent to have these things at every time called to remembrance, and enable them to set as teachers in this school of prophets men that have renounced the hidden things of shame, and that walk not in craftiness, nor handle the Word of God deceitfully, but by manifestation of the truth commend themselves to every man’s conscience in the sight of God.

On behalf of the Professors and Instructors, we beseech Thee, O God, that as they have received the word, so Thou wouldst cause them to continue steadfastly in the apostles’ teaching, and in fellowship and prayers. Cause them to know how men ought to behave themselves in the house of God which is the church of the living God, the pillar and ground of the truth: and make them able teachers of the same, that the ministers trained by them may be men that strive not about words to the subverting of them that hear, but present themselves approved unto God, workmen that need not be ashamed, handling aright the word of God.

We beseech Thee, O God, for him who at this time is to be separated unto teaching the gospel of God, which Thou promisedst afore through the prophets in the Holy Scripture concerning Thy Son, who was born of the seed of David, who was declared to be the Son of God with power according to the spirit of holiness by the resurrection of the dead. Grant that when handling this word of prophecy he may not be ashamed of the gospel, but may set it forth as the power of God unto salvation to every one that believeth.

And because at this time there are many teachers who are foolish men and slow of heart to believe in all that the prophets have spoken, may the spirit of Christ, beginning from Moses and all the prophets, interpret to him in all the Old Testament scriptures the things concerning Christ. Make him able to teach the rising ministry that what was there written was written for their learning, that through comfort of the Scriptures they might have hope.

Be pleased, O God, to cause the whole body of students of divinity in this Seminary, and all that succeed them, to be of the same mind one with another according to Jesus Christ, that they may with one mouth glorify the God and Father of our Lord Jesus Christ. Fill them with all joy and peace in believing, that they may abound in hope, in the power of the Holy Ghost.

Have mercy upon us according to Thy loving-kindness, and forgive all our iniquities. Help us at this time to worship Thee acceptably. Approve and bless what we now do in the name of Jesus Christ our Lord; to Whom, with the Father and the Holy Ghost, we would give all the glory, now and forever. Amen.”

— Samuel T. Lowrie, Prayer in Robert Dick Wilson, The Lower Criticism of the Old Testament as a preparation for the Higher Criticism. Inaugural Address of the Rev. Robert Dick Wilson, Ph.D., D.D., as Professor of Semitic Philology and Old Testament Criticism in the Theological Seminary of the Presbyterian Church Prince">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CO+Lord+God%2C+our+hearts+rejoice+in+Thee%2C+because+we+rejoice+in+Thy+salvation.+For+Thou+art+holy%3B+for+there+is+none+beside+Thee%2C+neither+is+there+any+rock+like+our+God.+Thou+art+a+God+of+knowledge%2C+and+by+Thee+actions+are+weighed.+Thou+makest+poor+and+makest+rich%3B+Thou+bringest+low+and+liftest+up%3B+for+the+pillars+of+the+earth+are+the+Lord%E2%80%99s%2C+and+He+hath+set+the+world+upon+them.+Thou+wilt+keep+the+feet+of+Thy+saints%3B+for+by+strength+shall+no+man+prevail.%0A%0ABlessed+be+the+Lord%2C+the+God+of+Israel%3B+for+He+hath+visited+and+wrought+redemption+for+His+people%2C+and+hath+raised+up+salvation+for+us+in+the+house+of+His+servant+David%2C+as+He+spake+by+the+mouth+of+His+holy+prophets+since+the+world+began.+Thou+hast+remembered+Thy+holy+covenant%2C+to+give+knowledge+of+salvation+unto+Thy+people+in+the+remission+of+their+sins%3B+because+of+the+tender+mercy+of+our+God%2C+whereby+the+day-spring+from+on+high+shall+visit+us%2C+to+shine+upon+them+that+sit+in+darkness+and+the+shadow+of+death%3B+to+guide+our+feet+in+the+way+of+peace.+Now+unto+the+King+of+the+ages%2C+incorruptible%2C+invisible%2C+only+God%2C+be+honour+and+glory+to+ages+of+ages.%0A%0AWe+supplicate%2C+O+God%2C+on+behalf+of+this+Theological+Seminary%2C+that+in+everything+it+may+be+enriched+in+every+word+and+in+all+knowledge+in+Christ+Jesus%2C+so+as+to+come+behind+in+no+gift%2C+and+that+while+we+wait+for+the+revelation+of+our+Lord+Jesus+Christ%2C+it+may+be+confirmed+by+Him+unto+the+end.+Let+the+spirit+of+the+Lord+be+here+as+liberty%2C+that+all+who+come+to+be+made+sufficient+ministers+of+the+new+covenant+of+the+Spirit+that+giveth+light%2C+may%2C+with+unveiled+face+reflecting+as+a+mirror+the+glory+of+the+Lord%2C+be+transformed+into+the+same+image+from+glory+to+glory.+Thou+that+saidst%3A+Light+shine+out+of+darkness%2C+shine+in+our+hearts+to+give+the+light+of+the+knowledge+of+the+glory+of+God+in+the+face+of+Jesus+Christ.%0A%0AO+God%2C+who+hast+given+unto+us+the+sure+word+of+prophecy+that+came+by+men+who+spake+from+God+being+moved+by+the+Holy+Ghost%2C+cause+the+Directors+of+this+Seminary+to+take+heed+thereto%2C+as+unto+a+lamp+shining+in+a+dark+place+until+the+day+dawn+and+day+star+arise+in+our+hearts.+Make+them+diligent+to+have+these+things+at+every+time+called+to+remembrance%2C+and+enable+them+to+set+as+teachers+in+this+school+of+prophets+men+that+have+renounced+the+hidden+things+of+shame%2C+and+that+walk+not+in+craftiness%2C+nor+handle+the+Word+of+God+deceitfully%2C+but+by+manifestation+of+the+truth+commend+themselves+to+every+man%E2%80%99s+conscience+in+the+sight+of+God.%0A%0AOn+behalf+of+the+Professors+and+Instructors%2C+we+beseech+Thee%2C+O+God%2C+that+as+they+have+received+the+word%2C+so+Thou+wouldst+cause+them+to+continue+steadfastly+in+the+apostles%E2%80%99+teaching%2C+and+in+fellowship+and+prayers.+Cause+them+to+know+how+men+ought+to+behave+themselves+in+the+house+of+God+which+is+the+church+of+the+living+God%2C+the+pillar+and+ground+of+the+truth%3A+and+make+them+able+teachers+of+the+same%2C+that+the+ministers+trained+by+them+may+be+men+that+strive+not+about+words+to+the+subverting+of+them+that+hear%2C+but+present+themselves+approved+unto+God%2C+workmen+that+need+not+be+ashamed%2C+handling+aright+the+word+of+God.%0A%0AWe+beseech+Thee%2C+O+God%2C+for+him+who+at+this+time+is+to+be+separated+unto+teaching+the+gospel+of+God%2C+which+Thou+promisedst+afore+through+the+prophets+in+the+Holy+Scripture+concerning+Thy+Son%2C+who+was+born+of+the+seed+of+David%2C+who+was+declared+to+be+the+Son+of+God+with+power+according+to+the+spirit+of+holiness+by+the+resurrection+of+the+dead.+Grant+that+when+handling+this+word+of+prophecy+he+may+not+be+ashamed+of+the+gospel%2C+but+may+set+it+forth+as+the+power+of+God+unto+salvation+to+every+one+that+believeth.%0A%0AAnd+because+at+this+time+there+are+many+teachers+who+are+foolish+men+and+slow+of+heart+to+believe+in+all+that+the+prophets+have+spoken%2C+may+the+spirit+of+Christ%2C+beginning+from+Moses+and+all+the+prophets%2C+interpret+to+him+in+all+the+Old+Testament+scriptures+the+things+concerning+Christ.+Make+him+able+to+teach+the+rising+ministry+that+what+was+there+written+was+written+for+their+learning%2C+that+through+comfort+of+the+Scriptures+they+might+have+hope.%0A%0ABe+pleased%2C+O+God%2C+to+cause+the+whole+body+of+students+of+divinity+in+this+Seminary%2C+and+all+that+succeed+them%2C+to+be+of+the+same+mind+one+with+another+according+to+Jesus+Christ%2C+that+they+may+with+one+mouth+glorify+the+God+and+Father+of+our+Lord+Jesus+Christ.+Fill+them+with+all+joy+and+peace+in+believing%2C+that+they+may+abound+in+hope%2C+in+the+power+of+the+Holy+Ghost.%0A%0AHave+mercy+upon+us+according+to+Thy+loving-kindness%2C+and+forgive+all+our+iniquities.+Help+us+at+this+time+to+worship+Thee+acceptably.+Approve+and+bless+what+we+now+do+in+the+name+of+Jesus+Christ+our+Lord%3B+to+Whom%2C+with+the+Father+and+the+Holy+Ghost%2C+we+would+give+all+the+glory%2C+now+and+forever.+Amen.%E2%80%9D%0A%0A%E2%80%94+Samuel+T.+Lowrie%2C+Prayer+in+Robert+Dick+Wilson%2C+The+Lower+Criticism+of+the+Old+Testament+as+a+preparation+for+the+Higher+Criticism.+Inaugural+Address+of+the+Rev.+Robert+Dick+Wilson%2C+Ph.D.%2C+D.D.%2C+as+Professor+of+Semitic+Philology+and+Old+Testament+Criticism+in+the+Theological+Seminary+of+the+Presbyterian+Church+Prince&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4035e267ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4035e267ed.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/08/samuel-t-lowries-prayer-at-the-ina

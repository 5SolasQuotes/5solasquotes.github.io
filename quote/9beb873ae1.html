<main class="wrap"><figure class="quote" id="q-9beb873ae1" data-kw="">
<blockquote><p>Canon 8: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon 9: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/helvetic-consensus-formula.html">Helvetic Consensus Formula</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Helvetic Consensus Formula</cite>, 1675</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef5dce598c" data-kw="">
<blockquote><p>At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos</cite>, ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

</figure><figure class="quote" id="q-b72020f7f1" data-kw="eternal life">
<blockquote><p>However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run). The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance.</p></blockquote>

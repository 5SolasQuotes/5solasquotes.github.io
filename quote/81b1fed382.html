<main class="wrap"><figure class="quote" id="q-81b1fed382" data-kw="">
<blockquote><p>Without vital godliness there can be no true zeal for God’s honour and glory; without It there can be no firm, lasting bond of union, no hearty, steady co-operation—no real, desirable peace. But let vital godliness prevail—let personal religion animate us, and every gracious result will flow from it; the glory of the Lord will be in the midst of us, and a wall of fire will encircle us.

Indeed, the Christian is not warranted to pray for temporal blessings for himself or for his country, but in connexion with, or subordination to, those that are spiritual; and that man who seeks and prays for his country’s spiritual and eternal weal, merits better of his country than the man who seeks and strives for her highest earthly glory and aggrandizement—aye, who is successful in securing it; for what, let me ask, is temporal weal to spiritual health—to eternal happiness?

What is all earthly good compared with a renewed and sanctified heart? What is peace with man compared with peace with God? What is deliverance from human oppression compared with rescue from the galling yoke of sin? What is security from the wrath of man to deliverance from the wrath of God? A compassionate heart bleeds for the poverty, the bondage, the carnage of his fellow-creatures; but a sanctified heart, not neglectful of these, feels more deeply for their ignorance, their guilt, their depravity, and the fearful consequences flowing from them. And how can we hope for this result, either personally or generally, but by vital godliness possessing the heart, by the spirit of vital religion pervading the land?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-293726fbc1" data-kw="">
<blockquote><p>The Church did formerly of late confer with Christ, and refused to open to Him when He was knocking and showering down influences of grace [in the Song of Solomon]; now she is glad to confer:

1. With the smiting watchmen [Church officers], where she found little of Christ.

2. Next with private Christians in assemblies. This is a mean of the Lords showering down of influences in the public and domestic, or less public meetings of his saints; for ordinances of all sorts that are appointed of Christ, they drop down savory and seasonable dews. The Lord writes in his book the savory conferences of such as fear the Lord’s name, Mal. 3:16; and three things follow:

1. The Lord owns such as are his.

2. His forbearance though there be faults in their service.

3. His making known to his the difference betwixt such as serve God, and such as serve Him not: and Zech. 8, the inhabitants of one city encourage the inhabitants of another; and the fruits of it is:

1. Praying.

2. Owning the saints. And they take hold of the skirt of a Jew; and both say Christians meeting for prayer and conference want not God, who rains down impressions of grace upon them as his people, especially when they warm one another; as many coals in one heap make a great fire. Nor is the acting of the Spirit tied only to the public ministry; the saints take to their houses clusters of wine-grapes, which they feed upon at home. Let the saints meet, and by conference and prayer draw down new influences of the Spirit, Jude 20; Isa. 2:1-3; Jer. 50:4-5; Col. 3:16; Heb. 3:13 &amp; 10:24; 1 Thess. 5:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, Influences of the Life of Grace (1659), ch. 11, pp. 307-8</span></figcaption>

</figure><figure class="quote" id="q-79172732ee" data-kw="">
<blockquote><p>We may learn that our religion is an experimental religion; it is a discovery of a saving remedy to perishing sinners, a remedy that is all power, and works many effects that may be, nay, that must be felt. Well then, if ye have no experience of the power of the death of Christ to those ends mentioned, ye are no Christians. Notions of truth make no man such, it is experience of the power of God, and sight, conviction of the wisdom of God herein, that does. The kingdom of God is not in work, but in power. …

Is Christ the power of God to salvation? O labour for experimental acquaintance with this power; power may be felt, let it be seen by your life that Christ is power, and that you have an interest in it; seek an experience of it this night for quickening grace, love, faith, repentance, and killing sin, and this will prepare you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion Sermons (1770) in Faith and Justification</cite></span></figcaption>

</figure><figure class="quote" id="q-0c9abdfe15" data-kw="">
<blockquote><p>Grace breeds delight in God, and delight breeds Meditation. A duty wherein consists the essentials of Religion, and which nourisheth the very life blood of it; and that the Psalmist may shew how much the godly man is habituated and inured to this blessed work of Meditation, he subjoins, in his Law doth he meditate day and night; not but that there may be sometimes intermission; God allows time for our calling, he grants some relaxation, but when it is said, the godly man meditates day and night, the meaning is, frequently; he is much conversant in the duty.

‘Tis a command of God to pray without ceasing, 1 These. 5.17. The meaning is, not that we should be always praying (as the Euchites held) but that we should every day set some time apart for prayer; so Drusius and others interpret it. We read in the old Law it was called the continual sacrifice; not that the people of Israel did nothing else but sacrifice, but because they had their stated hours every morning and evening they offered, therefore it was called the continual sacrifice; thus the godly man is said to meditate day and night, that is, he is often at this work, he is no stranger to meditation. …

That a good Christian is a meditating Christian, Psalm 119.15. I will meditate in thy precepts, 1 Tim. 4.15. Meditate upon these things. Meditation is the chewing upon the truths we have heard; The beasts in the old Law that did not chew the cud were unclean; the Christian that doth not by meditation chew the cud, is to be accounted unclean. Meditation is like the watering of the seed, it makes the fruits of grace flourish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian on the mount: or, A treatise concerning meditation. Wherein the necessity, useful</cite>, ness, excellency of Meditation is at large discussed (London: Ralph Smith, 1657), pp 58-60.</span></figcaption>

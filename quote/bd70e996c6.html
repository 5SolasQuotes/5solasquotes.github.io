<main class="wrap"><figure class="quote" id="q-bd70e996c6" data-kw="">
<blockquote><p>[Margin Note:] What sparkles of grace all have For the first: God engages all men as Christ’s debtors thus far: that it is mercy that they live or have any opportunity of seeking God, whatever be the means, natural or supernatural; whereas for the sin of Adam God might by a like justice have destroyed the world and all mankind, vanity is penally inflicted on all the servants for treason of the master against the King of Heaven and earth; but in Christ there be two mitigations:

1. One is that the servants are not destroyed for the sin of the master.

2. That as the forefated lord is restored, so the sick servants groaning under vanity shall be delivered from that bondage they come under for the sin of man, Rom. 8:20-22. Hence it is, though we be outlaws by nature, that now by a privilige of grace from the Mediator, the tenants receive and lodge the master because Christ has taken off the statute and act of forfeiture.

2. No man living on earth, but he is beholding to Christ (though many know Him not) for common helps of providence, and experiences do teach him some more of God by nature.

3. The sound of Christ, God revealed in the Gospel in the apostles’ ministry, is declared and is gone to the ends of the earth and to the nations, Ps. 19:4; Rom. 10:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), p. 365</span></figcaption>

</figure><figure class="quote" id="q-60a16bbd50" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind, in supplying their necessities, with the light and warmth of the sun, and with the rain; as well as a special love and favor, which He exercises only toward those that are good, and members of Christ; so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Poole’s English Annotations on the Holy Bible</span></figcaption>

ine</a></div>
</figure><figure class="quote" id="q-f272c40d97" data-kw="">
<blockquote><p>Common grace is great and undeserved mercy to a sinner, and would save him if he did not resist and frustrate it. In and by it, ‘God commandeth all men everywhere to repent,’ and whoever repents will find mercy… Scripture denies that God is under obligation to follow up his defeated common grace with his irresistible special grace. It asserts his just liberty to do as He pleases in regard to imparting that measure of grace which produces the new birth, and makes the sinner ‘willing in the day of God’s power.’… God sincerely desires that the sinner would hear his outward call, and that his common grace might succeed with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 5, pp. 48-51</span></figcaption>

</figure><figure class="quote" id="q-52a1cbc84b" data-kw="">
<blockquote><p>4. A change from the offers of Grace, to the Revelations of Wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11. True in the 1 Pet. 3:19-20, we read of Christ’s preaching by his Spirit to the Spirits in Prison, that is, to souls in Hell: But mark, when was it that he preach’d to them? not when in prison, but in the days of Noah, when they lived in the world. There is never an offer of grace and love made to souls in the Grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost.

5. A Change from fair probabilities to utter Impossibilities of Life and Salvation; a sad change still: Now is the accepted time, now is the day of Salvation; now, and not hereafter, 2 Cor. 6:2. Now there is a fair probability of the worst of Sinners to be saved, if they will look after Salvation, and mind their eternal Concerns; Christ is both able and willing to save: To save was the end of his coming into the World, and of all he did and suffered here, 1 Tim. 1:15. Now they are besought and entreated to be reconciled to God, 2 Cor. 5:19,20, but when Death comes, that changes these fair probabilities into utter Impossibilities of Life and Salvation. Therefore mark: Now (says the Apostle) is the day of Salvation; that is, now whilst Life lasts, and while the Gospel is preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1674(?) | The Great Concern, or A Serious Warning to a Timely and Thorough Preparation for Death (London: Printed for J. Robinson, at the Golden Lyon in St. Paul’s Church-Yard; and B. Aylmer at the three Pigeons in Cornhill, 1674), 73–75. The two quotes below were compiled by Tony Byrne</span></figcaption>

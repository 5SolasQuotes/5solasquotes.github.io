<blockquote><p>10. Whether bishops or priests [presbyters] were first? and if the priests were first, then the priest made the bishop?

The bishops and priests were at one time, and were not two things, but both one office in the beginning of Christ’s religion.

11. Whether a bishop hath authority to make a priest by the scripture, or no? and whether any other, but only a bishop, may make a priest?

A bishop may make a priest by the scripture, and so may princes and governors also, and that by the authority of God committed to them, and the people also by their election: for as we read that bishops have done it, so christian emperors and princes usually have done it; and the people, before christian princes were, commonly did elect their bishops and priests.

12. Whether in the new Testament be required any consecration of a bishop and priest, or only appointing to the office be sufficient?

In the new Testament, he that is appointed to be a bishop or a priest, needeth no consecration by the scripture; for election or appointing thereto is sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Questions and Answers Concerning the Sacraments and the Appointment and Power of Bishops and Priests</cite>, (1540) in Miscellaneous Writings and Letters of Thomas Cranmer, Archbishop of Canterbury, ed. John Edmund Cox (Cambridge: The Parker Society, 1846), p. 117.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-71bfe04587" data-kw="">
<blockquote><p>But some one will ask, How is it then, that certain excellent persons, and of position in the Church, are often permitted by God to preach novel doctrines to Catholics? A proper question, certainly, and one which ought to be very carefully and fully dealt with, but answered at the same time, not in reliance upon one’s own ability, but by the authority of the divine Law, and by appeal to the Church’s determination.

Let us listen, then, to Holy Moses, and let him teach us why learned men, and such as because of their knowledge are even called Prophets by the apostle, are sometimes permitted to put forth novel doctrines, which the Old Testament is wont, by way of allegory, to call “strange gods,” forasmuch as heretics pay the same sort of reverence to their notions that the Gentiles do to their gods.

Blessed Moses, then, writes thus in Deuteronomy: “If there arise among you a prophet or a dreamer of dreams,” that is, one holding office as a Doctor in the Church, who is believed by his disciples or auditors to teach by revelation: well,—what follows? “and giveth thee a sign or a wonder, and the sign or the wonder come to pass whereof he spake,”—he is pointing to some eminent doctor, whose learning is such that his followers believe him not only to know things human, but, moreover, to foreknow things superhuman, such as, their disciples commonly boast, were Valentinus, Donatus, Photinus, Apollinaris, and the rest of that sort!

What next? “And shall say to thee, Let us go after other gods, whom thou knowest not, and serve them.” What are those other gods but strange errors which thou knowest not, that is, new and such as were never heard of before? “And let us serve them;” that is, “Let us believe them, follow them.” What last? “Thou shalt not hearken to the words of that prophet or dreamer of dreams.” And why, I pray thee, does not God forbid to be taught what God forbids to be heard? “For the Lord, your God, trieth you, to know whether you love Him with all your heart and with all your soul.”

The reason is clearer than day why Divine Providence sometimes permits certain doctors of the Churches to preach new doctrines—“That the Lord your God may try you;” he says. And assuredly it is a great trial when one whom thou believest to be a prophet, a disciple of prophets, a doctor and defender of the truth, whom thou hast folded to thy breast with the utmost veneration and love, when such a one of a sudden secretly and furtively brings in noxious errors, which thou canst neither quickly detect, being held by the prestige of former authority, nor lightly think it right to condemn, being prevented by affection for thine old master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vincent-of-lerins.html">Vincent of Lérins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commonitory for the Antiquity and Universality of the Catholic Faith Against the Profane Novelties of all Heresies</cite>, (434), 10.27-28 in Nicene and Post-Nicene Fathers 2, 11: 137-38.</span></figcaption>

<blockquote><p>For it is a grave and important matter, and one which is of vital concern both to Christ and the world at large, that we take steps to help the youth. By so doing we will be taking steps to help also ourselves and everybody else. Bear in mind that such insidious, subtle, and crafty attacks of the devil must be met with great Christian determination. My dear sirs, if we have to spend such large sums every year on guns, roads, bridges, dams, and countless similar items to insure the temporal peace and prosperity of a city, why should not much more be devoted to the poor neglected youth – at least enough to engage one or two competent men to teach school?</p></blockquote>

<blockquote><p>Vers. 22. Lay hands suddenly on no man; neither be partakers of other men’s sins: Keep thy self pure.

Precept 5. That he do not rashly receive any one into the sacred Ministry, without mature deliberation, and examination preceding, he do not lay hands (which was the sign of Ordination) upon any one: He gives two Reasons of it.

Neither] Reas. 1. Lest if he should ordain one unfitting, in this very thing he should communicate with him in his sins, and by consequence in his punishments.

Thy self] Reas. 2. Because thou oughtest to keep thy self pure from defilements; and therefore from the ordaining of an unworthy man; If happily the rest of the Presbytery at any time shall determine to admit an unfit man to the Ministry, or one that is not approved, keep thy self pure, neither consent thou, but labour by all means so to preserve purity and holiness, that thou keep off from all affinity with sin, as much as in thee lies. He explains the parts of this Precept in the two next following verses, the meaning of the latter part, of being himself pure, vers. 23. and shews the meaning of the former part, vers. 24.

Vers. 23. Drink no longer water, but use a little wine for thy stomach’s sake, and thine often infirmities.

As to the latter part of the Precept, of keeping himself pure; because the Apostle knew that Timothy by reason of his earnest endeavours after purity and chastity, had been injurious to his own health, therefore by the way he adviseth him, that he do not so understand the Precept of keeping himself pure, as to neglect his health and render himself unfit for the works of his Calling, but use an holy prudence, and in subduing his body, by drinking of water, to use a little wine as it were physically, and for the necessity of health, lest if he should proceed in not favouring his weak stomach, and his body labouring under often infirmities, immediately the tabernacle of his body should fall to decay, and the Church should be deprived of so profitable an instrument.

Vers. 24. Some men’s sins are open before hand, going before to judgement: And some men they follow after.

As to what concerns the meaning of the former part of the Precept, Lest he should partake of other men’s sins; he shews that he spake of open sins, which may be known, and avoided, not of private, which fall not under observation; and that he beware, lest he partake of other men’s sins, and in laying hands rashly on no man; he shews in this, that using examination, and trial, the open sins of any one that is unworthy may be known, as also the open virtues of men meet to be admitted to the Ministry of the Gospel.

For the sins of some Candidates of the Ministry are so manifest, that they prevent the examination and judgement of the Church, that they may easily be rejected. For before the judgement of the Church can determine about them, there is matter in readiness, in their open sins, for their condemnation, or rejection from the Ministry, by the opinion of the Ecclesiastical Senate: And the sins of others, upon examination premised, and the judgement of the Church concerning them being given, are brought forth into the light.

Vers. 25. Likewise also the good works of some, are manifest before-hand, and they that are otherwise cannot be hid.

In like manner the virtue of some that are Candidates to the Ministry, and their good works, are so manifestly known, that it is easy for the Church to judge them fit to be admitted. But the works of those that are otherwise, or upon examination had, and inquisition made, are not manifest, or so secret, that they cannot be known of men, they are to be left to God, nor can they long bee hid, but in their own time will be brought to light, that if the Church cannot prevent, but those hypocrites are admitted to the Ministry, yet care may be had, where they are already made manifest, that they be dealt with according to the Discipline of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 168.</span></figcaption>

Precept 5. That he do not rashly receive any one into the sacred Ministry, without mature deliberation, and examination preceding, he do not lay hands (which was the sign of Ordination) upon any one: He gives two Reasons of it.

Neither] Reas. 1. Lest if he should ordain one unfitting, in this very thing he should communicate with him in his sins, and by consequence in his punishments.

Thy self] Reas. 2. Because thou oughtest to keep thy self pure from defilements; and therefore from the ordaining of an unworthy man; If happily the rest of the Presbytery at any time shall determine to admit an unfit man to the Ministry, or one that is not approved, keep thy self pure, neither consent thou, but labour by all means so to preserve purity and holiness, that thou keep off from all affinity with sin, as much as in thee lies. He explains the parts of this Precept in the two next following verses, the meaning of the latter part, of being himself pure, vers. 23. and shews the meaning of the former part, vers. 24.

Vers. 23. Drink no longer water, but use a little wine for thy stomach’s sake, and thine often infirmities.

As to the latter part of the Precept, of keeping himself pure; because the Apostle knew that Timothy by reason of his earnest endeavours after purity and chastity, had been injurious to his own health, therefore by the way he adviseth him, that he do not so understand the Precept of keeping himself pure, as to neglect his health and render himself unfit for the works of his Calling, but use an holy prudence, and in subduing his body, by drinking of water, to use a little wine as it were physically, and for the necessity of health, lest if he should proceed in not favouring his weak stomach, and his body labouring under often infirmities, immediately the tabernacle of his body should fall to decay, and the Church should be deprived of so profitable an instrument.

Vers. 24. Some men’s sins are open before hand, going before to judgement: And some men they follow after.

As to what concerns the meaning of the former part of the Precept, Lest he should partake of other men’s sins; he shews that he spake of open sins, which may be known, and avoided, not of private, which fall not under observation; and that he beware, lest he partake of other men’s sins, and in laying hands rashly on no man; he shews in this, that using examination, and trial, the open sins of any one that is unworthy may be known, as also the open virtues of men meet to be admitted to the Ministry of the Gospel.

For the sins of some Candidates of the Ministry are so manifest, that they prevent the examination and judgement of the Church, that they may easily be rejected. For before the judgement of the Church can determine about them, there is matter in readiness, in their open sins, for their condemnation, or rejection from the Ministry, by the opinion of the Ecclesiastical Senate: And the sins of others, upon examination premised, and the judgement of the Church concerning them being given, are brought forth into the light.

Vers. 25. Likewise also the good works of some, are manifest before-hand, and they that are otherwise cannot be hid.

In like manner the virtue of some that are Candidates to the Ministry, and their good works, are so manifestly known, that it is easy for the Church to judge them fit to be admitted. But the works of those that are otherwise, or upon examination had, and inquisition made, are not manifest, or so secret, that they cannot be known of men, they are to be left to God, nor can they long bee hid, but in their own time will be brought to light, that if the Church cannot prevent, but those hypocrites are admitted to the Ministry, yet care may be had, where they are already made manifest, that they be dealt with according to the Discipline of the Church.”

— David Dickson, An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened, (London: Francis Eglesfield, 1659), p. 168.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVers.+22.+Lay+hands+suddenly+on+no+man%3B+neither+be+partakers+of+other+men%E2%80%99s+sins%3A+Keep+thy+self+pure.%0A%0APrecept+5.+That+he+do+not+rashly+receive+any+one+into+the+sacred+Ministry%2C+without+mature+deliberation%2C+and+examination+preceding%2C+he+do+not+lay+hands+%28which+was+the+sign+of+Ordination%29+upon+any+one%3A+He+gives+two+Reasons+of+it.%0A%0ANeither%5D+Reas.+1.+Lest+if+he+should+ordain+one+unfitting%2C+in+this+very+thing+he+should+communicate+with+him+in+his+sins%2C+and+by+consequence+in+his+punishments.%0A%0AThy+self%5D+Reas.+2.+Because+thou+oughtest+to+keep+thy+self+pure+from+defilements%3B+and+therefore+from+the+ordaining+of+an+unworthy+man%3B+If+happily+the+rest+of+the+Presbytery+at+any+time+shall+determine+to+admit+an+unfit+man+to+the+Ministry%2C+or+one+that+is+not+approved%2C+keep+thy+self+pure%2C+neither+consent+thou%2C+but+labour+by+all+means+so+to+preserve+purity+and+holiness%2C+that+thou+keep+off+from+all+affinity+with+sin%2C+as+much+as+in+thee+lies.+He+explains+the+parts+of+this+Precept+in+the+two+next+following+verses%2C+the+meaning+of+the+latter+part%2C+of+being+himself+pure%2C+vers.+23.+and+shews+the+meaning+of+the+former+part%2C+vers.+24.%0A%0AVers.+23.+Drink+no+longer+water%2C+but+use+a+little+wine+for+thy+stomach%E2%80%99s+sake%2C+and+thine+often+infirmities.%0A%0AAs+to+the+latter+part+of+the+Precept%2C+of+keeping+himself+pure%3B+because+the+Apostle+knew+that+Timothy+by+reason+of+his+earnest+endeavours+after+purity+and+chastity%2C+had+been+injurious+to+his+own+health%2C+therefore+by+the+way+he+adviseth+him%2C+that+he+do+not+so+understand+the+Precept+of+keeping+himself+pure%2C+as+to+neglect+his+health+and+render+himself+unfit+for+the+works+of+his+Calling%2C+but+use+an+holy+prudence%2C+and+in+subduing+his+body%2C+by+drinking+of+water%2C+to+use+a+little+wine+as+it+were+physically%2C+and+for+the+necessity+of+health%2C+lest+if+he+should+proceed+in+not+favouring+his+weak+stomach%2C+and+his+body+labouring+under+often+infirmities%2C+immediately+the+tabernacle+of+his+body+should+fall+to+decay%2C+and+the+Church+should+be+deprived+of+so+profitable+an+instrument.%0A%0AVers.+24.+Some+men%E2%80%99s+sins+are+open+before+hand%2C+going+before+to+judgement%3A+And+some+men+they+follow+after.%0A%0AAs+to+what+concerns+the+meaning+of+the+former+part+of+the+Precept%2C+Lest+he+should+partake+of+other+men%E2%80%99s+sins%3B+he+shews+that+he+spake+of+open+sins%2C+which+may+be+known%2C+and+avoided%2C+not+of+private%2C+which+fall+not+under+observation%3B+and+that+he+beware%2C+lest+he+partake+of+other+men%E2%80%99s+sins%2C+and+in+laying+hands+rashly+on+no+man%3B+he+shews+in+this%2C+that+using+examination%2C+and+trial%2C+the+open+sins+of+any+one+that+is+unworthy+may+be+known%2C+as+also+the+open+virtues+of+men+meet+to+be+admitted+to+the+Ministry+of+the+Gospel.%0A%0AFor+the+sins+of+some+Candidates+of+the+Ministry+are+so+manifest%2C+that+they+prevent+the+examination+and+judgement+of+the+Church%2C+that+they+may+easily+be+rejected.+For+before+the+judgement+of+the+Church+can+determine+about+them%2C+there+is+matter+in+readiness%2C+in+their+open+sins%2C+for+their+condemnation%2C+or+rejection+from+the+Ministry%2C+by+the+opinion+of+the+Ecclesiastical+Senate%3A+And+the+sins+of+others%2C+upon+examination+premised%2C+and+the+judgement+of+the+Church+concerning+them+being+given%2C+are+brought+forth+into+the+light.%0A%0AVers.+25.+Likewise+also+the+good+works+of+some%2C+are+manifest+before-hand%2C+and+they+that+are+otherwise+cannot+be+hid.%0A%0AIn+like+manner+the+virtue+of+some+that+are+Candidates+to+the+Ministry%2C+and+their+good+works%2C+are+so+manifestly+known%2C

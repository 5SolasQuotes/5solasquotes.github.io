<main class="wrap"><figure class="quote" id="q-cf0f47a498" data-kw="">
<blockquote><p>Another ground of love among friends, is societas periculi, et 〈◊〉, when men partake of the same danger or deliverance, as captives under the Turk delivered by the same ransom. This ground of love we have, who being all in danger of hell and become captives of Satan, are delivered by the same ransom, by Christ. This makes friendship and causes love in men that never saw one another before. 3. Now for proximus, it is defined ab use, of the use and benefit that one has by another. God has not given to any man such gifts, but that he needs the gifts of his brother. God has not given all his gifts to any one, and therefore there is none but has need of another: and therefore 〈◊〉 et utilitas, use and utility, are the grounds of propinquity, and make men become proximi, neighbors. 4. Lastly, there is 〈◊〉 instituti; both amongst 〈◊〉, friends and neighbors, all do tendere ad idem, tend to one and the same end; that is, to be partakers of the blessedness, which the angels of God enjoy: for this is institutum 〈◊〉, et proximi 〈◊〉, et amici, et nostrum omnium, the end and scope of my brother, neighbor, friend, and myself, and of all of us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments (d. 1626; 1675), 5th Commandment</cite>, p. 315</span></figcaption>

</figure><figure class="quote" id="q-e8d63176d2" data-kw="">
<blockquote><p>First, the communion of the Church does not consist in a local union, neither the separation, in removing of places: For there are a great many without, if we look to the place, who yet are within according to charity, and many again in place, that yet if we consider faith, are without: but the true Christian communion consists in the union of faith, and in the union of charity, which St. Augustine calls the nearness, or rather the neighborhood and dwelling together (as I may say) of hearts and agreement in doctrine: and the true separation, in the diversity or contrarieties of the self-same things. Now concerning the union of faith, it consists in that heavenly doctrine, which is comprehended unto us in the old and new Testament, tending only to this point, to make us feel our sin, and to show us a remedy therefore, in one only Jesus Christ crucified… We are therefore united in the Faith, with the patriarchs, prophets, apostles, martyrs, ancient doctors, and generally with the whole Church that was before the Law, under the Law, and under grace, yea and under the tyranny of Antichrist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter [in controversy with Romanism] (London: Barker, 1579), ch. 10, n.p.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

on-of-the-saints/#:~:text=First%2C%20the%20communion%20of%20the%20Church,and%20under%20the%20tyranny%20of%20Antichrist&amp;text=First%2C%20the%20communion%20of%20the%20Church%20does%20not&amp;text=grace%2C%20yea%20and%20under%20the%20tyranny%20of%20Antichrist" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5a64543543" data-kw="">
<blockquote><p>One further element in the doctrine presents itself in the declaration that this communion is to be extended, so far as God gives opportunity, unto ‘all those who in every place call upon the name of the Lord Jesus.’… Whatever may or may not be realized as yet in fact, it still is true in principle that this communion of saints, contemplated as a gracious sentiment, knows no boundaries of creed or polity or worship — knows no geographic or other outward limitations. This is obvious from the nature of the sentiment, and from its source and ground, as seen in the underlying union of every genuine saint with Christ Himself. Having fellowship with Him, deriving their common life from him, engaged alike in his one great vineyard, all saints of necessity have fellowship one with another — a fellowship as wide as the earth and enduring as time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-morris.html">Edward Morris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology of the Westminster Symbols: A Commentary, Historical, Doctrinal, Practical on the Confession of Faith &amp; Catechisms… (1900), Lecture 12, The Church of God, 4. ‘Communion of Saints: its Extent &amp; Nature’</cite>, pp. 619-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

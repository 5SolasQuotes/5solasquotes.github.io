<main class="wrap"><figure class="quote" id="q-c9c712c2e5" data-kw="">
<blockquote><p>We entertain the most heartfelt belief in that doctrine of the Westminster Confession of Faith, which teaches, “that God alone is Lord of the conscience, and has left it free from the doctrines and commandments of men,” &amp;c. If Paul would not be judged with respect to holidays, or new moons, or (the Jewish) Sabbath days, we, after his example, object to have censorious verdicts passed on us in regard to Good Friday, or Christmas, or Ash-Wednesday, or the feast, fast, or vigil of this or that evangelist or saint. And we should feel quite free in regard to Sunday, if it were simply ordained by “the church.”

The objection to the philosophic view is this, that a day resting merely on utility, would, in our opinion, lose all its binding authority on the conscience. It would be observed when convenient, and only then. While all would do their best to take suitable rest or recreation some time or other, it would be difficult to obtain such concert in regard to the seasons of repose as might leave the greater part of the population free to attend divine worship.

The generality of men, we fear, would “forsake the assembling of themselves together, as the manner of some is;” and though museums, crystal palaces, scientific lectures, and other schemes designed to benefit the masses-all, so far as they go, teaching truth, and therefore helpful to religion-might tend to diffuse light in regard to the Creator and his works; still the complaint of the prophet might be brought against them all—“They have healed the hurt of the daughter of my people slightly.” The barrier they would raise against the inroads of evil, would, we fear, be but feeble; and, despite their influence, irreligion, with its invariable concomitant immorality, would roll like a flood over the land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-hunter.html">Robert Hunter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Literature of the Sabbath Question in British and Foreign Evangelical Review</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b1285d36e5" data-kw="">
<blockquote><p>He shall see more largely of the travail of his soul when his people shall have sent forth his gospel into all nations, and it shall have been blessed for the conversion of the whole heathen—when the corn of wheat that has fallen into the ground and died, shall bring forth much fruit, and the handful of corn in the earth upon the top of the mountains shall shake with fruit like Lebanon for abundance.

Now, we anticipate the period when the entire world shall be recovered to an acknowledgment of the true God and Jesus Christ whom he has sent, and when the spiritual reign of truth and piety shall be unlimited. For the whole earth is to be filled with His glory. The little leaven is to leaven the whole lump. The kingdoms of this world are to become the kingdoms of our Lord, and he shall reign for ever. The stone cut out without hands is to become a great mountain and fill the whole earth.

The doom of every Pagan temple is pronounced. The debasing influence of idolatry shall everywhere yield to the renovating force of Christian truth, and the pollutions of heathenism disappear before the extended empire of Immanuel. When this time comes, as come it shall, it will be the fruit of the Redeemer’s sacrifice, and will add even to the sum of his felicity.

And what benevolent spirit, looking to the present debased state of the world, would not rejoice when every solitary place is gladdened with the voice of the gospel—and the earth yields her increase—and God, even our own God, doth bless us—and the Christian graces blossom like the rose of Sharon, where now the spiritual wilderness stretches out in dreary monotony—and “the wolf dwells with the lamb, and the leopard lies down with the kid, and the calf, and the young lion, and the fatling together; and a little child shall lead them. And there shall be nothing to hurt nor to destroy in all my holy mountain, saith the Lord; for the earth shall be full of the knowledge of the Lord, as the waters cover the sea.</p></blockquote>

</figure><figure class="quote" id="q-d897e7cab1" data-kw="">
<blockquote><p>We are told by hymnologers that there is no mention in such psalms of the “sweet name of Jesus.” But is there in the hymns in question? But what Christian minister what Christian elder, nay, what Christian child, who has had a godly father or mother, does not know who the Refuge of the believer is? Does any soul ever sing such a psalm without rejoicing in that name as “ointment poured forth,” as the way into this Refuge, and in the Holy Spirit, who, in God’s infinite grace, has guided him into it? It is very shallow piety indeed that needs all this to be put in words in a song of praise.

It is not the nature of truly lifting up of the soul to God in trust, and hope, and joy, to do it in the details of a doctrinal and theological discussion, whether in thanksgiving, in penitence, or prayer. So the psalms express the essence of them all. What Christian congregation in this land does not know the Redeemer, the name of Jesus, and the Holy Spirit? Did David not know it when he sang Psalm Ixxxviii. 1 — “Lord God, my Saviour,” (my Jesus) “day and night, Before thee cried have I,”- etc.

Nay, did Abraham not know it when he “saw his day afar off, and was glad”? Our Lord himself hath amply taught us, both personally, and by His inspired apostles, that they did; and are we not to know it when we sing Psalms il., xvi., xxii., xxiii., xlv., cx., cxviii., and many others?

To sing these psalms with our gospel light, is to enjoy the communion of saints from the beginning of the church on earth even until now — a communion in praise, at least, which sectarian hymns from their very nature completely destroy, and raise the spirit of controversy rather than kindle the lofty flame of pure devotion. Who does not know what is the child’s true hymn — “The Lord’s my Shepherd?” What child does not know who He was — the great and the good Shepherd, who giveth His life for the sheep, and who “carrieth the lambs in His bosom;” and who said, “Suffer the little children to come unto me”?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 135-36.</span></figcaption>

<blockquote><p>DEARLY Beloved in God, after you have heard so eagerly the Gospel and the teachings of the holy Apostles, now for the fourth year, teachings which Almighty God has been merciful enough to publish to you through my weak efforts, the majority of you, thank God, have been greatly fired with the love of God and of your neighbour. You have also begun faithfully to embrace and to take unto yourselves the teachings of the Gospel and the liberty which they give, so that after you have tried and tasted the sweetness of the heavenly bread by which man lives, no other food has since been able to please you. And, as when the children of Israel were led out of Egypt, at first impatient and unaccustomed to the hard journey, they sometimes in vexation wished themselves back in Egypt, with the food left there, such as garlic, onions, leeks, and flesh-pots, they still entirely forgot such complaints when they had come into the promised land and had tasted its luscious fruits: thus also some among us leapt and jumped unseemly at the first spurring—as still some do now, who like a horse neither are able nor ought to rid themselves of the spur of the Gospel;—still, in time they have become so tractable and so accustomed to the salt and good fruit of the Gospel, which they find abundantly in it, that they not only avoid the former darkness, labour, food, and yoke of Egypt, but also are vexed with all brothers, that is, Christians, wherever they do not venture to make free use of Christian liberty. And in order to show this, some have issued German poems, some have entered into friendly talks and discussions in public rooms and at gatherings; some now at last during this fast—and it was their opinion that no one else could be offended by it—at home, and when they were together, have eaten meat, eggs, cheese, and other food hitherto unused in fasts. But this opinion of theirs was wrong; for some were offended, and that, too, from simple good intentions; and others, not from love of God or of his commands (as far as I can judge), but that they might reject that which teaches and warns common men, and they might not agree with their opinions, acted as though they were injured and offended, in order that they might increase the discord. The third part of the hypocrites of a false spirit did the same, and secretly excited the civil authorities, saying that such things neither should nor would be allowed, that it would destroy the fasts, just as though they never could fast, if the poor labourer, at this time of spring, having to bear most heavily the burden and heat of the day, ate such food for the support of his body and on account of his work. Indeed, all these have so troubled the matter and made it worse, that the honourable Council of our city was obliged to attend to the matter. And when the previously mentioned evangelically instructed people found that they were likely to be punished, it was their purpose to protect themselves by means of the Scriptures, which, however, not one of the Council had been wise enough to understand, so that he could accept or reject them. What should I do, as one to whom the care of souls and the Gospel have been entrusted, except search the Scriptures, particularly again, and bring them as a light into this darkness of error, so that no one, from ignorance or lack of recognition, injuring or attacking another come into great regret, especially since those who eat are not triflers or clowns, but honest folk and of good conscience? Wherefore, it would stand very evil with me, that I, as a careless shepherd and one only for the sake of selfish gain, should treat the sheep entrusted to my care, so that I did not strengthen the weak and protect the strong. I have therefore made a sermon about the choice or difference of food, in which sermon nothing but the Holy Gospels and the teachings of the Apostles have been used, which greatly delighted the majority and emancipated them. But those, whose mind and conscience is defiled, as Paul says [Titus, 1:15], it only made mad. But since I have used only the above-mentioned Scriptures, and since those people cry out none the less unfairly, so loud that their cries are heard elsewhere, and since they that hear are vexed on account of their simplicity and ignorance of the matter, it seems to me to be necessary to explain the thing from the Scriptures, so that every one depending on the Divine Scriptures may maintain himself against the enemies of the Scriptures.</p></blockquote>

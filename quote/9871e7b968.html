<main class="wrap"><figure class="quote" id="q-9871e7b968" data-kw="">
<blockquote><p>The question concerning the true frame of the Lord’s Tabernacle, the New Testament Church, in point of Government, hath been a Ball of dispute long tost in this Island; this Contest might have long since had its exit, and issued in sound and solid Peace, and union upon this head, had we all with a single heart and eye, looked to the Pattern shewed upon the Mount, and listened to the discoveries so often made to us, from the lovely Oracles of the Word, Ezek. chap. 43. v. 11. of the form of the House, and the fashion thereof, and the goings out thereof, and the comings in thereof, &amp; all the forms thereof, and all the Ordinances thereof, and all the forms thereof, and all the Laws thereof, that we might keep the whole form thereof, and all the Ordinances thereof, and do them.

Had we renounced the wisdom of the flesh, and got the penitent heart, and been ashamed for all we have done amiss; and, (as the Author of this Paper well expresses it in his Preface) preferred Religion to Interest, and the power of Godliness to that of Dominion. But restless Ambition, and love of Dominion over the House of God, and over their Brethren, and fellow servants, as they began in the Christian Churches Infancy, and had an early tincture in the Apostles (though our Lord nipt the first buds of this bitter Root, and crushed this Cockatrice in the shell, shewing them, that humble Ministerial Diligence was the apex of their greatness) so the fermentation of this distemper continuing in most men, and by the influence of Satan upon man’s wicked heart, diffusing it self in after Generations, hath been a spreading gangrene, still hindering the reception, and improvement of this Ordinance, of the Gospel Church-Government, whereof Scripture and Experience are irrefragable witnesses.

The Apostle Paul tells us: the mystery of iniquity was working in his time, and the Embryo of the Prelatical Hierarchy, and a Papistical, consequently, then formed; which we find after stirring in the counteractings, and contradiction of a Diotrophes, (that early aspiring Primate,) even unto the Apostle John. Hence the Apostle Peter in his exhortation to Pastors of the Church, doth so [anxiously] dehort them from those two grand &amp; Satanical enchantments, viz. Covetousness, and Lording over God’s Heritage; which no doubt had its influence for checking these evils for a considerable time. But the early-sown tears of the Evil one, did by piece-meal discover themselves, first, in the advance of Beza’s human Episcopacy, the fixt Moderator, or proestos, which was next, (by the influence of the restless temper) screwed up to the Satanical, as he calls it, viz. the Diocesion Prelacy, swallowing up, and enhancing all the decisive Authority and Power of Pastors in Government; then the ascension was made to the Arch-bishops, and Metropolitans’ Office, and Power, and by an inevitable necessity to the Culmen of the Papal Monarchy at last.

The Lord having in this evening of time, and the days of Reformation, by the light of the Gospel, discovered the mystery of iniquity, and of the Papal Hierarchy consequently; and caused his People to hear his call, to come out of Babylon, and be separated from that detestable Synagogue, the Reformed Churches has generally had so deep a sense of the connexion of Popery and Prelacy, that together with the one, they found themselves obliged to reject the other; and in their Confessions, and by the Writings of their most famous, burning and shining Lights, have witnessed against this corruption of Government, as well as against that Synagogue’s errors in point of Doctrine; …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-forrester.html">Thomas Forrester</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A counter-essay, or, A vindication and assertion of Calvin and Beza’s presbyterian judgment and principles; drawn from their writings</cite>, (Edinburgh: Andrew Anderson, 1692), preface.</span></figcaption>

<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>

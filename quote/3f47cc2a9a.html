<main class="wrap"><figure class="quote" id="q-3f47cc2a9a" data-kw="">
<blockquote><p>There were others who, although they believed that the Word was not changed into flesh but assumed it, nevertheless said that he assumed flesh without a soul; for if he had assumed flesh with a soul, the Evangelist would have said, the Word was made flesh with a soul. This was the error of Arius, who said that there was no soul in Christ, but that the Word of God was there in place of a soul.

The falsity of this opinion is obvious, both because it is in conflict with Sacred Scripture, which often mentions the soul of Christ, as: my soul is sad, even to the point of death (Matt 26:38), and because certain affections of the soul are observed in Christ which can not possibly exist in the Word of God or in flesh alone: he began to be sorrowful and troubled (Matt 26:37). Also, God cannot be the form of a body. Nor can an angel be united to a body as its form, since an angel, according to its very nature, is separated from body, whereas a soul is united to a body as its form. Consequently, the Word of God cannot be the form of a body.

Furthermore, it is plain that flesh does not acquire the specific nature of flesh except through its soul. This is shown by the fact that when the soul has withdrawn from the body of a man or a cow, the flesh of the man or the cow is called flesh only in an equivocal sense. So if the Word did not assume flesh with a soul, it is obvious that he did not assume flesh. But the Word was made flesh; therefore, he assumed flesh with a soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Evangelium S. Ioannis Lectura</cite>, (1270-72), C.1.L7.n167, 167.2-3.</span></figcaption>

<blockquote><p>ENGLISHMEN and Americans frequently use the word “sensualist” to describe one in whom the animal appetites are predominant. We shall see that it is a just charge against the Sensualistic philosophy, that it not seldom inclines its advocates to this dominion of beastly lusts. But it is not from this fact that we draw the phrase by which we name it.

The Sensualistic philosophy is that theory, which resolves all the powers of the human spirit into the functions of the five senses, and modifications thereof. It is the philosophy which finds all its rudiments in sensation. It not only denies to the spirit of man all innate ideas, but all innate powers of originating ideas, save those given us from our senses. It consequently attempts to account for every general and every abstract judgment, as an empirical result of our sensations, and consistently denies the validity of any à priori ideas. Such was the philosophy which was dominant in France at the close of the eighteenth century; and which, untaught by the frightful results it produced there, is now striving again to establish its dominion among us towards the close of the nineteenth age. …

Let it then be understood, that the philosophy which I maintain against the Sensualistic, or exclusively empirical, and which has just been described, shall be called the Rational. It holds that the human intelligence is not a bundle of organs, but a pure spirit; it asserts for man a Reason, and not merely senses and their modifications.

In the eighteenth century, the Sensualistic philosophy appeared under many phases; it does so again in the nineteenth. But it always has its characteristic traits, and carries its own dangers to truth, virtue, and happiness. One attempt of this criticism of it will be to show that it always involves tendencies to erroneous logic, vitiating even the physical sciences, which it is wont to claim as its peculiar clients; to universal scepticism; to idealism; to nihilism; to the obliterating of moral distinctions, and the destruction of moral responsibility; to materialism; to a denial of the supernatural; and thus, to atheism.

Let us be understood: we do not charge that every Sensualistic philosopher holds to all these results, or approves them; we charge that they are all latent in the system, and that one or another of them is continually making itself patent in the outgrowth of this philosophy. Of this, one of the most instructive proofs is the historical; for there “the tree is known by its fruits.” We shall, therefore, prepare the way for the stricter criticism, by a brief, but perspicuous review of the chief movements of Sensualism, especially in our own age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sensualistic Philosophy of the Nineteenth Century, Considered</cite>, (New York: Anson D. F. Randolph &amp; Company, 1875), pp 1, 2-3.</span></figcaption>

</figure><figure class="quote" id="q-e54fea7c48" data-kw="">
<blockquote><p>…the difficulty to do good, proneness to evil, contrariety between the powers and faculties of the soul, and the rebellion of the meaner against the superior and better, are not the conditions of nature, as it was or might have been in itself before the entrance of sin, but that all these proceed from the putting of the powers of the soul, by the loss of grace, out of that course, which by the law of God and nature they were to hold. For does not the condition of man’s nature require that amongst things inquired after, thought of, and known, God should be the first? and amongst things desired and loved, nothing should be desired and loved more or before Him, nor otherwise than for Him? and is it not clear and evident, that if God be the first thing that is thought of, sought after, and loved, and that nothing be sought after or respected, but after and for God, that there will be no proneness to evil, difficultire to do good, contrariety between the powers of the soul, and rebellion of the meaner and inferior against the better and superior? surely there is none that can or will make question of it. Now it is confessed by the best learned amongst the Schoolmen, that howsoever it be not so in the course of our understanding, in this state wherein we are, yet according to the course of the nature of our understanding simply considered, it should be so, that God should be the first thing sought after and known by us. … By this which has ben said [including the quotes by Scotus and Bonaventure], it is evident that according to the course of nature not disordered, nor put out of course, the first thing that is inquired after, thought of and known, is God, and that He is the first good that is desired and loved, and that no other thing is desired or loved but after Him, and for Him. So that none of the things formerly mentioned can be found in the nature of man, unless it be put out of course. Whence grows the contrariety between the meaner and better, superior and inferior faculties of the soul, but from hence, that the soul in this state of her aversion from God, takes the beginning of all her knowledge from the senses, apprehends particular things as good upon the first view, and to be desired, which afterwards upon better consideration, in respects not considered at the first, she finds are not good nor desirable? And whence is the rebellion of the inferior against the superior, but from hence, that the superior having cast off the dependance it formerly had upon God and respect unto Him, the inferior also casts off the respect it had to it? ‘What could have been more just than that he should receive retaliation in kind? God is the life of the soul, and the soul is the life of the body. By sinning the soul willingly lost its power to live; let it unwillingly lose also its power to give life. Having freely driven away life—since it did not wish to live—let it not be able to bestow life on whom, or in what measure, it may wish. The soul would not be ruled by God; let it be unable to rule the body. If it does not obey its superior, why should it command its inferior? The Creator found His creature rebellious against Himself; let the soul likewise find its own handmaid (the body) rebellious against it. Man was found a transgressor of the divine law; let him find another law in his members opposing the law of his mind and bringing him into captivity to the law of sin. And since sin sets a separation between us and God, let death likewise set a separation between our body and ourselves.’ Bernard of Clairvaux, Sermon to the Knights of the Temple, ch. 11, ‘Of the Sepulcher’ From hence likewise is that danger of erring, whereunto man is subject; for apprehending particular things first, his knowledge is imperfect and confused; and not without much labor and danger of erring does he come to the distinct knowledge of any thing. And hence also flows that ignorance that is found in men; for taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.</p></blockquote>

— Richard Field, Other citations (work not named), Of the Church (Oxford: Turner, 1628), bk. 3, Answer to Berely, ch. 5, pp. 252-54 Field (1561–1616) was an English ecclesiological theologian associated with the work of Richard Hooker.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+difficulty+to+do+good%2C+proneness+to+evil%2C+contrariety+between+the+powers+and+faculties+of+the+soul%2C+and+the+rebellion+of+the+meaner+against+the+superior+and+better%2C+are+not+the+conditions+of+nature%2C+as+it+was+or+might+have+been+in+itself+before+the+entrance+of+sin%2C+but+that+all+these+proceed+from+the+putting+of+the+powers+of+the+soul%2C+by+the+loss+of+grace%2C+out+of+that+course%2C+which+by+the+law+of+God+and+nature+they+were+to+hold.+For+does+not+the+condition+of+man%E2%80%99s+nature+require+that+amongst+things+inquired+after%2C+thought+of%2C+and+known%2C+God+should+be+the+first%3F+and+amongst+things+desired+and+loved%2C+nothing+should+be+desired+and+loved+more+or+before+Him%2C+nor+otherwise+than+for+Him%3F+and+is+it+not+clear+and+evident%2C+that+if+God+be+the+first+thing+that+is+thought+of%2C+sought+after%2C+and+loved%2C+and+that+nothing+be+sought+after+or+respected%2C+but+after+and+for+God%2C+that+there+will+be+no+proneness+to+evil%2C+difficultire+to+do+good%2C+contrariety+between+the+powers+of+the+soul%2C+and+rebellion+of+the+meaner+and+inferior+against+the+better+and+superior%3F+surely+there+is+none+that+can+or+will+make+question+of+it.+Now+it+is+confessed+by+the+best+learned+amongst+the+Schoolmen%2C+that+howsoever+it+be+not+so+in+the+course+of+our+understanding%2C+in+this+state+wherein+we+are%2C+yet+according+to+the+course+of+the+nature+of+our+understanding+simply+considered%2C+it+should+be+so%2C+that+God+should+be+the+first+thing+sought+after+and+known+by+us.+%E2%80%A6+By+this+which+has+ben+said+%5Bincluding+the+quotes+by+Scotus+and+Bonaventure%5D%2C+it+is+evident+that+according+to+the+course+of+nature+not+disordered%2C+nor+put+out+of+course%2C+the+first+thing+that+is+inquired+after%2C+thought+of+and+known%2C+is+God%2C+and+that+He+is+the+first+good+that+is+desired+and+loved%2C+and+that+no+other+thing+is+desired+or+loved+but+after+Him%2C+and+for+Him.+So+that+none+of+the+things+formerly+mentioned+can+be+found+in+the+nature+of+man%2C+unless+it+be+put+out+of+course.+Whence+grows+the+contrariety+between+the+meaner+and+better%2C+superior+and+inferior+faculties+of+the+soul%2C+but+from+hence%2C+that+the+soul+in+this+state+of+her+aversion+from+God%2C+takes+the+beginning+of+all+her+knowledge+from+the+senses%2C+apprehends+particular+things+as+good+upon+the+first+view%2C+and+to+be+desired%2C+which+afterwards+upon+better+consideration%2C+in+respects+not+considered+at+the+first%2C+she+finds+are+not+good+nor+desirable%3F+And+whence+is+the+rebellion+of+the+inferior+against+the+superior%2C+but+from+hence%2C+that+the+superior+having+cast+off+the+dependance+it+formerly+had+upon+God+and+respect+unto+Him%2C+the+inferior+also+casts+off+the+respect+it+had+to+it%3F+%E2%80%98What+could+have+been+more+just+than+that+he+should+receive+retaliation+in+kind%3F+God+is+the+life+of+the+soul%2C+and+the+soul+is+the+life+of+the+body.+By+sinning+the+soul+willingly+lost+its+power+to+live%3B+let+it+unwillingly+lose+also+its+power+to+give+life.+Having+freely+driven+away+life%E2%80%94since+it+did+not+wish+to+live%E2%80%94let+it+not+be+able+to+bestow+life+on+whom%2C+or+in+what+measure%2C+it+may+wish.+The+soul+would+not+be+ruled+by+God%3B+let+it+be+unable+to+rule+the+body.+If+it+does+not+obey+its+superior%2C+why+should+it+command+its+inferior%3F+The+Creator+found+His+creature+rebellious+against+Himself%3B+let+the+soul+likewise+find+its+own+handmaid+%28the+body%29+rebellious+against+it.+Man+was+found+a+transgressor+of+the+divine+law%3B+let+him+find+another+law+in+his+members+opposing+the+law+of+his+mind+and+bringing+him+into+captivity+to+the+law+of+sin.+And+since+sin+sets+a+separation+between+us+and+God%2C+let+death+likewise+set+a+separation+between+our+body+and+ourselves.%E2%80%99+Bernard+of+Clairvaux%2C+Sermon+to+the+Knights+of+the+Temple%2C+ch.+11%2C+%E2%80%98Of+the+Sepulcher%E2%80%99+From+hence+likewise+is+that+danger+of+erring%2C+whereunto+man+is+subject%3B+for+apprehending+particular+things+first%2C+his+knowledge+is+imperfect+and+confused%3B+and+not+without+much+labor+and+danger+of+erring+does+he+come+to+the+distinct+knowledge+of+any+thing.+And+hence+also+flows+that+ignorance+that+is+found+in+men%3B+for+taking+the+beginning+of+all+the+knowledge+they+have+from+the+senses%2C+they+know+no+more+touching+anything+than+may+be+discerned+by+the+accidents+and+outward+effects+of+it%2C+and+so+never+come+to+know+anything+in+the+essence+of+it%2C+or+immediately+as+it+is+in+itself.+So+that+according+to+that+which+before+I+noted%2C+out+of+the+book+called+Destructorium+vitiorum%2C+as+a+man+may+know+in+the+dark%2C+the+length%2C+breadth+and+other+dimensions+of+a+thing%2C+but+not+whether+it+be+fair+or+foul%2C+white+or+black.+So+men+in+this+obscurity+of+discerning%2C+may+find+out+that+there+is+a+God%2C+and+that+He+is+the+beginning+and+cause+of+all+things%3A+but+they+cannot+know+how+fair%2C+how+good%2C+how+merciful%2C+and+how+glorious+He+is%2C+that+so+they+may+love+Him%2C+fear+Him%2C+honour+Him%2C+and+trust+in+Him+as+God%2C+unless+they+have+an+illumination+of+grace.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+Answer+to+Berely%2C+ch.+5%2C+pp.+252-54+Field+%281561%E2%80%931616%29+was+an+English+ecclesiological+theologian+associated+with+the+work+of+Richard+Hooker.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe54fea7c48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e54fea7c48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-epistemology/#:~:text=the%20difficulty%20to%20do%20good%2C%20proneness,they%20have%20an%20illumination%20of%20 <blockquote><p>Althought God is not manifest to the senses comprehensively as he is in himself, yet he can be perceived apprehensively as shining in his works, appearing in signs, heard in the word and manifested in the fabric of the whole universe. (2) It is a false assumption that there is nothing in the intellect which was not before in some sense. For universals are in the intellect and never were in any sense. A mind is known as also an angel, yet they are never pereceived or seen except from their effects. Why therefore may not God be most certainly known in the mind from his works and a posteriori, although we cannot perceive Him with our eyes or any of the other bodily senses.</p></blockquote>

</figure><figure class="quote" id="q-2c44db3fe2" data-kw="">
<blockquote><p>And this distinction [between actuality and potentiality] is metaphysical, not scientific (in the modern sense of “scientific’”). That is to say, it is a description of reality that is more general and basic than any scientific theory, resting as it does on facts (about change) that science itself takes for granted. Hence it is valid whatever the empirical scientific facts turn out to be; and (to repeat what was said earlier) while that doesn’t mean that it cannot be subjected to rational evaluation or criticism, such criticism can only come from some alternative metaphysical theory, not from empirical science… Aristotelian metaphysical ideas are, as I keep saying and as will be established by the end of the next chapter, unavoidable, whether the early modern philosophers thought so or not… the distinction I am making, between metaphysical ideas and scientific ones, is just an obvious one to make. As noted before, empirical science must take many things for granted, such as the existence of patterns of cause and effect. Thus, while it might be able to establish whether some particular causal relationship exists, it cannot possibly establish whether causation as such is real or not, given that its method presupposes its existence. Nor, at the most general level and for the same reasons, can it tell us what causation per se is or what kinds of causation exist. And so on for notions like actuality, potentiality, substance, attribute, form, and so on. Empirical science of its very nature cannot give us the full story about these matters; but metaphysics just is the rational investigation of them. Hence metaphysics is obviously different from empirical science.</p></blockquote>

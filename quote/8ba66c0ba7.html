<main class="wrap"><figure class="quote" id="q-8ba66c0ba7" data-kw="">
<blockquote><p>In the abolishing of the monuments of idolatry, they [Independents and congregationalists] agree so far with the Brownists [separatists], that they will not name the days of the week, the months of the year, the places of meeting after the ordinary manner; Yet they make no scruple to use the churches builded in the time of Popery, nor of bells [for calling to public worship, etc.], though invented by a Pope and baptized with all the Popish superstitions. How this does stand with their principles, I do not well know…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (1645), ch. 6</cite>, pp. 116-17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ddf34f9955" data-kw="">
<blockquote><p>The many portentous idolatries by which the Church of God is deformed — the many defilements of superstitions — the many profanations of sacred things — the vast sink of errors must not be touched. There is to be no diminution of the tyrannical yoke of impious laws by which miserable consciences have been ensnared; but all who desire any change are to be judged heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a></span></div>

</figure><figure class="quote" id="q-da10e894b5" data-kw="">
<blockquote><p>To make such images and representations to be used in divine worship, is not simply evil, as appears by the brazen serpent, a temporary ordinance for an occasion in the wilderness; and by the cherubims on the mercy-seat, a stated ordinance for the Mosaical dispensation. There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 18</cite>, p. 205</span></figcaption>

894b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da10e894b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=To%20make%20such%20images%20and%20representations,the%20same%20as%20a%20bright%20medium&amp;text=To%20make%20such%20images%20and%20representations%20to%20be&amp;text=shining%20through%20the%20same%20as%20a%20bright%20medium" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9568da3cfe" data-kw="Queen of Heaven Idolatry Paganism">

</figure><figure class="quote" id="q-08d8e4b231" data-kw="">
<blockquote><p>Objection: Be it true that crosses were purposely appointed to be adored, yet not so now. The Jews would not admit of the image of Caesar in the Church, yet they abolished it not, but admitted it in their coin… [Rutherford’s] Answer: 1. Though the cross were first framed for no adoration… … 5. We remove not crosses from coinage, no more than the Jews did the image of Caesar. But we agree with them [the Jews], [Richard] Hooker [an Anglican] being judge, in banishing them from the worship.</p></blockquote>

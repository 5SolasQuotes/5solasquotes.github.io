<main class="wrap"><figure class="quote" id="q-57c738a3a2" data-kw="">
<blockquote><p>Let your affection, then, be drawn out by us more and more as we nearly say to you what Ruth said to Naomi. We came here to become the same body with you. And as your God is our God, your people will from now on also be our people, your laws will be our laws, and your interests our interests. Where you live we will live; where you die we will die and we will be buried in your tombs. Love us, then, as your brothers and your countrymen, and kindly look down on our weaknesses. We were born in a climate that doesn’t give to everyone the wise, discreet and restrained temperament that yours gives to you. Put up with us, for as it is proper that we should conform ourselves as much as is possible to your prudence, we also hope that you in fairness will not hold against us all of our weaknesses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-claude.html">Jean Claude</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon on Ecclesiastes 7:14: Delivered during a Fast Day at The Hague, the Netherlands, on November 21, 1681 , trans. Charles K. Telfer in Mid-American Journal of Theology</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ec5f76753" data-kw="">
<blockquote><p>…so neither is the prince to be obeyed, using his authority against God, in commanding impious and unhonest things: we must give unto Caesar the things that are Caesar’s and unto God the things which are God’s, we may not give unto the prince the things which are God’s, that is, the conscience. And in this case the apostles give us a rule, to obey God rather than man, Acts 4:19, when obedience then is denied in unjust and unlawful things, not the authority which is God’s ordinance, but the abuse of the authority is gainsaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … ([Cambridge] 1611), ch. 13, 3. The Questions &amp; Doubts Discussed, Question 17, ‘How far the Magistrate is to be Obeyed, and wherein not to be Obeyed?’, p. 588</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-f9b552319a" data-kw="">
<blockquote><p>Next to the enactment of just and wholesome laws, the due administration of them is of the highest importance to a community. This has accordingly engaged the particular attention of every people who have attained to any considerable degree of civilisation.

The most enlightened nations have separated the judicial from the legislative authority, rendered judges, in the discharge of their functions, independent of the supreme executive magistrate in the state, and adopted other precautions, with the view of keeping the channels by which justice is dispensed through all the departments of society pure and uncorrupted.

Nor is the jealousy which they manifested on this head to be censured as excessive. By the wise and impartial administration of justice a people have been reconciled to the rule of a usurper, and tyranny itself has become tolerable; whereas the neglect or perversion of justice has made them unhappy and discontented under the best form of political government.

The salutary effects of righteous judgment are not confined to the securing of individual rights, the repressing of the bad, and the protecting of the good and peaceable. Under its fostering shade every useful art and every liberal science flourish; the honour of the laws being preserved unsullied, a cheerful obedience is yielded to their authority; morality is promoted by an exhibition of the connexion which subsists between its essential principles and the temporal welfare of men; and piety is indirectly, but powerfully, strengthened by the thoughts being irresistibly raised to the fountain of all justice, and by the representation, faint indeed, but not scenic, which is given of the great assize before which all must at last appear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Judgment. Delivered at the opening of the Synod of Original Seceders, Edinburgh, September, 1829 in Sermons</cite></span></figcaption>

</figure><figure class="quote" id="q-8b3be8949a" data-kw="">
<blockquote><p>The presbyterian government is more limited and less arbitrary than the independent government of single congregations, which, exempting themselves from the presbyterial subordination, and from being accountable to, and censurable by, classes or synods, must needs be supposed to exercise a much more unlimited or arbitrary power than the presbyterial churches do […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s rod blossoming; or, the divine ordinance of church government vindicated</cite>, (1646; Edinburgh, 1844), p. 84.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-27a50a3489" data-kw="">
<blockquote><p>To be more plain, let me be more particular. The Voluntaries mistake us, if they conceive us to be Voluntaries. We hold by the duty of Government to give of their resources and their means for the maintenance of a gospel ministry in the land; and we pray that their eyes may be opened, so that they may learn how to acquit themselves as the protectors of the Church, and not as its corrupters or its tyrants. We pray that the sin of Uzziah, into which they have fallen, may be forgiven them, and that those days of light and blessedness may speedily arrive, when “kings shall be the nursing-fathers, and queens the nursing-mothers” of our Zion.

In a word, we hold that every part and every function of a common-wealth should be leavened with Christianity, and that every functionary, from the highest to the lowest, should, in their respective spheres, do all that in them lies to countenance and uphold it. That is to say, though we quit the Establishment, we go out on the Establishment principle — we quit a vitiated Establishment, but would rejoice in returning to a pure one. To express it otherwise — we are the advocates for a national recognition and national support of religion — and we are not Voluntaries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proceedings of the General Assembly of the Free Church of Scotland; with A Sketch of the Proceedings of the Residuary Assembly. 1843, ed. John Baillie (Edinburgh: W. P. Kennedy, 1843), p. 12.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<main class="wrap"><figure class="quote" id="q-2afe7caaae" data-kw="">
<blockquote><p>As for regeneration or conversion in the second moment, it can be analogically conceived thus: I. The one generating is the Holy Spirit through second grace as through a plastic power. II. The matter of generation and seed is the new creature implanted in the first moment of regeneration, from which those acts are elicited. III. The form is the second act of faith, which as it were actuates and πληροῖ [plēroi, fills/fulfills] that seed of regeneration. IV. Preparatory dispositions are certain acts of repentance preceding faith. V. Mixture is the actual union of faith with the promises of the Gospel, Heb. 4:2. VI. Animation of the fetus, or introduction of the form, is when by actual faith Christ is applied for justification. VII. The first thing emanating from the form now introduced, or the elicited act, is the reflexive act of faith. VIII. To which follows the impetrated act: namely, the ἐνέργεια [energeia, energy/activity] of charity. IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man. So faith, although it is the first act of the new creature, indeed as it were the radical principle of the whole new creature, yet its second act, at least the complete and formed or sensible one, is exercised nearly among the last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9306965dc9" data-kw="">
<blockquote><p>We do not say that the confidence by which we are justified is the forgiveness of sins already perceived, nor that the object of this confidence is the forgiveness of sins previously perceived; but that confidence by which we each believe our sins are forgiven in the present, not properly in the past or future, although both pertain to justifying faith, but not to the high, so to speak, formal aspect of justifying. When, therefore, the Gospel word offers mercy and forgiveness of sins through Christ to every believer, faith does not only believe in general that this is true, that sins will indeed be forgiven to all who truly believe in Christ, but also the believer confidently persuades himself that this promise applies to him, and by that act of confidence, he is then forgiven his sin, and it becomes his happiness mentioned by the apostle in Rom. 4:7. Just as by extending a hand and accepting a gift, the beneficiary who has approached becomes a participant. Thus, in a faithful person, there are simultaneously forgiveness of sins and confidence about that forgiveness; and by the faith through which that mercy and special grace were received, it is afterward retained, and what was believed about the future is embraced in the present, and what about the past remains certain afterward. But one who believes he will be justified if he believes in Jesus Christ is not yet justified in the past unless he believes in the present that righteousness is given to him, which he receives by the same act. What is later believed about the past does not justify him but presupposes him as justified. All these acts are of the same justifying faith, the first indeed predisposes to justification, the second properly justifies, the third pacifies the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXV. This is also the doctrine of the Professors of Leiden, critiqued in the eleventh chapter of the Remonstrants’ Confession, whose author is Andreas Rivetus. They say:</cite></span></figcaption>

<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Key of Saving Knowledge, Opening out of the Holy Scriptures the Right Way &amp; Straight Passage to Eternal Life… (London: Badger, 1641)</cite>, pp. 79-82</span></figcaption>

<blockquote><p>36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical. 37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense. 38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical. 37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense. 38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.”

— Friedrich Spanheim, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C36.+The+instrument+of+application+is+faith%2C+not+theoretical+but+practical%2C+nor+an+act+of+the+mind+only+but+also+of+the+heart%2C+and+that+not+superficial+but+radical.+37.+But+this+faith+is+regarded+in+application+neither+habitually+or+qualitatively%2C+but+only+relatively+and+organically%2C+whence+the+benefit+of+justification+is+promiscuously+ascribed%2C+sometimes+to+the+instrument%2C+sometimes+to+the+object+apprehended+through+the+instrument%2C+in+an+identical+sense.+38.+The+instruments+of+producing+this+faith+are+the+Word+and+sacraments%2C+not+by+reason+of+inherent+virtue%2C+but+by+reason+of+adhering+blessing%2C+and+that+from+God%E2%80%99s+ordination.+Whence+both+the+use+of+the+Word+and+Sacraments+is+to+be+employed%2C+yet+to+be+circumscribed%2C+and+neither+is+to+be+attributed+to+the+instruments+what+belongs+to+Him+who+acts+through+instruments%2C+nor+is+God+to+be+bound+to+them%2C+but+man+only%2C+nor+is+the+same+latitude+to+be+judged+of+our+duty+and+of+grace.+39.+The+efficient+cause+of+this+faith+is+God%E2%80%99s+Spirit%2C+who+through+internal+calling+produces+its+act%2C+through+sanctification+its+habit%2C+and+through+this+omnimodo-sanctity+according+to+parts%2C+although+not+according+to+degrees%2C+both+as+to+the+repurgation+of+faculties+corrupted+through+sin+and+as+to+the+convenient+subordination+of+them+inverted+through+sin.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Lat

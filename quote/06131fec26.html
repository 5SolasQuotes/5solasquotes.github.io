</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75f12122c0" data-kw="">
<blockquote><p>…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads:

1. The gesture of sitting, which Christ Himself also used.

2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.</p></blockquote>

</figure><figure class="quote" id="q-2bb3d36ea3" data-kw="">
<blockquote><p>And withal, there is no doubt but these ceremonies may be changed and varied according to the diversity and alteration of times and nations, and other circumstances. St. Augustine says in defence of this point (Ad Marcellinus, Epistle 5), Non itaque verum est quod dicitur, Semel recte factum 〈◊〉 est mutandum: mutata quippe temporis causa, etc…. Yet in ceremonies there are these four rules or cautions to be observed:

1. That they be not over many, and that those which be enjoined be necessary, according to the time and place wherein we live, according to the apostles’ example, who enjoined few things to those believing gentiles, Acts 15:28-29.

2. That the ceremonies enjoined be for edification, and not destructive to that which the substance builds and sets up. And this is the apostle’s counsel, ‘Let all things be done to edifying.’ (1 Cor. 14:26) For a destroyer (according to this rule) is a transgressor. (Gal. 2:18) And in this respect it is that the same apostle prohibits prayer in an unknown tongue. (1 Cor. 14:4)

3. That they be such as conduce to order: to which all things must be squared 〈 Greek 〉 according to order, (as the same apostle), else there will be confusion in the Church, and God is not the author of confusion. (1 Cor. 14:33)

4. Lastly, 〈 Greek 〉, that they be for decency. They must be such as make for the decent service of God. And therefore it is that the apostle inveighed against covering of the head and face [for men] in religious exercises. It was an uncomely and undecent thing for men to be covered, or women uncovered in the Church. (1 Cor. 11:4)</p></blockquote>

<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>

<blockquote><p>22. They that think that conforming ministers are guilty of great sin must consider what diversity of education, company and interest may do, even on men of conscience, and that we have all our sins. And it’s sinful uncharitableness to think and speak worse of them than they deserve and to talk against all for the faults of some. …

24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not. ¹ [The Anglican parish churches tended to have a simpler and more plain and Scriptural worship than the cathedral churches of the cities, which had many more human and showy additions. Many of the older non-conformist ministers that separated from the cathedral worship yet would not separate in principle from the parish churches. Baxter was of this mind.]

25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²</p></blockquote>

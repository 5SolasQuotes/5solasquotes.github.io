<blockquote><p>Sinners will never come to Christ; nor Obtain any Saving Advantage from him, until they are first brought to an awakening Sense of their Sin and Guilt, and of their undone perishing Condition, while Enemies to God and Heirs of Hell. They must see their Danger before they’ll fly from it.

Whatever Hope any may entertain of Salvation, while continuing in an Estate of carnal Security, their Hopes will be cut off; and their Expectations perish. They must be convinced of their present miserable Estate, either by the gracious Influences of the Spirit of God, or by a dreadful Experience of his eternal Wrath.

Conviction of Sin is the first Operation of the Spirit of God, in Order to a Sinners Saving Conversion to him. Accordingly our blessed Lord promises to send the Comforter, to convince the World of Sin, Joh. xvi.8. and this is exemplified to us, in all the Conversions we have a particular Account of in the New Testament. Thus St. Peter’s Hearers, from an awakening Sense of their Danger, are pricked in their Heart, and cried out to the Apostles, Men and Brethren, what shall we do? Acts. ii.37. Thus the Jailer from like Distress and Terrors came trembling, and fell down before Paul and Silas, saying, Sirs, What shall I do to be saved? And thus Saul trembling and astonished, said, Lord What wilt thou have me to do? Acts. ix.6 —

Such Convictions are sometimes begun in the Soul by the Means of some awakening Providence, sometimes by Christian Conferences, sometimes by public, and sometimes by private Ordinances; and even sometimes by the immediate Influences of the Spirit of God, without any known Means or outward Occasion whatsoever: But the Means which God, is most usually pleased to bless unto this End, is the Ministry of the Gospel. It has pleased God, by the Foolishness of Preaching to save those that believe, 1 Cor. 1.21.

These Convictions of which I speak, are ordinarily begun in the Soul, from a view of some more gross Pollutions and more aggravated Impieties and Enormities, that the guilty Sinner sees himself chargeable with. These stare him in the Face, lay just hold on his Conscience; and set before him, a fearful Prospect of that fiery Indignation, that is like to consume him. These lie down and rise with him, and follow him wherever he goes, and whatever he does, till his Soul is filled with Terror and Amazement. But then, if these Convictions have any good Effect upon the Soul, they won’t stop here, until the Sinner is brought to see, that innumerable Evils have compassed him about, that his Iniquities have taken hold upon him, that he cannot look up; that they are more than the Hairs of his Head; and therefore, his Heart faileth him, according to that in in Psal. xl.12.

He must be brought to see, that his Sins are vastly numerous and greatly aggravated, that every Station, every Relation, Circumstance and Capacity of his Life, are filled up with Sin, till he is even brought to admire the Patience and long-suffering of God; that such a Guilty Wretch as he should be out of Hell. From this dreadful view of his Case will he be brought to look to the Sin of his Nature, the Cursed Source and Fountain of all these Swarms of Lust that have thus acted than Part in his Heart and Life, until he cry out with the Psalmist, Behold I was shapen in Iniquity, and in Sin did my Mother Conceive me. Psal. LI.8. And with the Apostle, I am Carnal, sold under Sin, Rom. vii.14. …

There is indeed a great Difference in the manner, Degree, and Duration of these Convictions, even in those upon whom they have a saving Effect, Some are more suddenly surprised with a Sight of their undone Estate, others more gradually brought to a Sense of it. Some are more sorely broken with distressing and distracting Terrors from an affrighting View of the Weight of their Guilt, of the Wrath of an incensed God; and of the dreadful Damnation they have in Prospect; others in their greatest Distresses, have stronger Hopes to Support them from Sinking under such unutterable Anguish.

Some for a long Time agonize under these Horrors of Conscience; and are for Years together kept under a Spirit of Bondage; others are quickly brought to the Foot-Stool of God’s Mercy, to Rest with Comfort in an absolute Dependence upon Christ alone for Justification and Life. But how different soever these Convictions may be, none will ever be brought to Christ, till they are convinced that they are undone, helpless, and hopeless in themselves, and until they are brought to an utter Despair of Salvation, from any Thing they do or can do for their own Relief.</p></blockquote>

<blockquote><p>Temptation: God has a double calling of men: an outward calling, by preaching the Word in men’s ears; an inward, by the irresistible work of the Spirit in their hearts. The outward calling is a part of God’s outward will: the inward and effectual calling is a part of his secret will. He calls me only with the outward call: and therefore I cannot be assured of God’s goodwill and meaning that I should believe, repent and be saved. Minister: You misconceive Gods calling. His outward calling by preaching the word in men’s ears is a means to convey the sense of the word preached inwardly to their understandings, and mediante intellectu [the intellect mediating], inwardly to stir up their wills to the doing of such things as they now see would make for their eternal good. And I appeal unto your own knowledge and experience: Did the Word preached never pierce further than your ears? Has it not enlightened your understanding with the wholesome doctrine of the gospel? Has not God’s Spirit at some time or other by the Word inwardly moved you to break off your sinful and lustful courses and to lead a sober, just and religious life? Why do you, contrary to your own conscience, falsely accuse God of affording you a bare outward calling, but no inward? Why do you traduce Him as not willing that you should believe, repent and so be saved? Take it for a certain rule: God always wills men should do those things which by his Word-written He enjoins them to do, and by his Spirit enlightening and inciting He so helps them to do that it is only the voluntary perverseness and stubbornness of their own wills resisting the Word and the Spirit which hinders them from doing those things which they should. It is true that God can make any hard and resisting heart a soft and obedient heart; and He does it where He has an eternal purpose out of special mercy so to do: And it is as true that God may justly leave a stubborn heart to his own resistency and perverseness; and this He does where He has purposed in justice so to do. Deus miseretur cujus vult, et quem vult indurat [God shows mercy to whom He wills, and He hardens whom He wills, Rom. 9:18]. If you long to be assured of this secret meaning or purpose of God towards you in particular before you resolve upon your repentance, I can assure you that it is the Devil who has stirred up in you a longing after a thing impossible that so he may procure your destruction. Strive therefore to bring this foolish and wicked fancy out of your mind and to judge of the meaning of God which belongs unto you according to his Word revealed unto you, leaving his secret and unsearchable will unto Himself.</p></blockquote>

<blockquote><p>(4) Wilfully. Christ comes and stands; He stands and knocks. Why does He not enter? Why, you will not open. He stands, He is ready to take possession; why is He yet without? Why, you will not give it Him. If Christ did not stand, did not knock, you might pretend a better reason why ye do not open. But when He stands ready to enter, what can be alleged why he is not admitted, but because you will not open?</p></blockquote>

</figure><figure class="quote" id="q-b761e8eb79" data-kw="">
<blockquote><p>That great Scriptural doctrine, man’s need of preventing and converting grace, stands out here, as if written with a sunbeam. It becomes all who question that doctrine to look at this passage and consider. Let them observe that seeing Christ’s miracles, hearing Christ’s teaching, living in Christ’s own company, were not enough to make men believers. The mere possession of spiritual privileges never yet made any one a Christian. All is useless without the effectual and applying work of God the Holy Spirit. No wonder that our Lord said in another place, “No man can come to me, except the Father who has sent me draw him.” (John 6:44.)

The true servants of Christ in every age will do well to remember this. They are often surprised and troubled to find that in religion they stand alone. They are apt to fancy that it must be their own fault that all around them are not converted like themselves. They are ready to blame themselves because their families remain worldly and unbelieving. But let them look at the verse before us. In our Lord Jesus Christ there was no fault either in temper, word, or deed. Yet even Christ’s own “brethren did not believe in Him.”

Our blessed Master has truly learned by experience how to sympathize with all his people who stand alone. This is a thought “full of sweet, pleasant, and unspeakable comfort.” He knows the heart of every isolated believer, and can be touched with the feeling of his trials. He has drunk this bitter cup. He has passed through this fire. Let all who are fainting and cast down, because brothers and sisters despise their religion, turn to Christ for comfort, and pour out their hearts before Him. He “Himself hath suffered being tempted” in this way, and He can help as well as feel. (Heb. 2:18.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 2-3.</span></figcaption>

<blockquote><p>Ineffectual calling is of the reprobate.—It is called ineffectual not per se [in-of-itself] but per accidens [by accident, or contrary to its intention], not in respect of God who calls, but in respect of men who have deaf ears of the heart. In itself calling is always effectual, although it is not so in those who are perishing, as the sun is effective by his light in itself, although it by no means illumines the blind.</p></blockquote>

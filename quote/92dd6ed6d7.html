<main class="wrap"><figure class="quote" id="q-92dd6ed6d7" data-kw="Mary|Queen of Heaven" data-pol="mary">
<blockquote><p>If God disapproved that men on earth constituted a King for themselves, without consulting him: what will he say of the worms of the earth, who without an oracle from God, constitute a Queen of heaven, and erect for her a throne of majesty, without asking at the mouth of God?</p></blockquote>
<figcaption>— <a href="../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a94e564bfc" data-kw="Mary|Queen of Heaven|King" data-pol="mary">
<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>
<figcaption>— <a href="../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption>

</figure><figure class="quote" id="q-b48112252c" data-kw="Mary|Queen of Heaven|Mediator" data-pol="mary">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption>— <a href="../authors/theodore-beza.html">Theodore Beza</a>, <cite>A Brief and Pithy Sum of Christian Faith (Confession, 1560)</cite>, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</figcaption>

</figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary|Mediator|Invocation of saints" data-pol="mary|saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption>— <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ (1558)</cite></figcaption>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary|Queen of Heaven|Satan|Grace" data-pol="mary">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</figcaption>

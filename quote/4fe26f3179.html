</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e132c236f" data-kw="">
<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacob-andreae.html">Jacob Andreae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 497 Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-c270919e61" data-kw="">
<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, [Against] Dr. Owen’s Vindicator… (London: Parkhurst, 1684), section 2, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

+such.+God+has+commanded+men+to+choose+such+things+as+these+by+the+rules+of+edification%2C+love%2C+peace%2C+concord%2C+order%2C+decency%2C+winning+those+without%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Communion+Doubly+Defended+by+%5BAgainst%5D+Dr.+Owen%E2%80%99s+Vindicator%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29%2C+section+2%2C+p.+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc270919e61.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c270919e61.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=XIV.%20God%20has%20by%20Nature%20and,order%2C%20decency%2C%20winning%20those%20without%2C%20etc&amp;text=XIV.%20God%20has%20by%20Nature%20and%20Scripture%20obliged&amp;text=peace%2C%20concord%2C%20order%2C%20decency%2C%20winning%20those%20without%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-86e0d15ddc" data-kw="">
<blockquote><p>In natural things, it is to be noted that the whole fulness of perfection due to a thing, is not from the mere substantial form that gives it its species since a thing derives much from supervening accidents, as man does from shape, color and the like; and if any one of these accidents be out of due proportion, evil is the result. So it is with action. For the plenitude of its goodness does not consist wholly in its species, but also in certain additions which accrue to it by reason of certain accidents: and such are its due circumstances. Wherefore if something be wanting that is requisite as a due circumstance the action will be evil. … Circumstances are outside an action inasmuch as they are not part of its essence; but they are in an action as accidents thereof… Every accident is not accidentally in its subject, for some are proper accidents; and of these every art takes notice. And thus it is that the circumstances of actions are considered in the doctrine of morals… Since good and being are convertible, according as being is predicated of substance and of accident, so is good predicated of a thing both in respect of its essential being, and in respect of its accidental being; and this, both in natural things and in moral actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 3. ‘Whether man’s action may be good or evil from a circumstance?’ [Yes]</span></figcaption>

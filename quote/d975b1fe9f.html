<main class="wrap"><figure class="quote" id="q-d975b1fe9f" data-kw="">
<blockquote><p>Absolutely, man cannot exact anything from God, since all things are his; yet, given his will and pact, by which he wills not to require our works of us gratis but to render a reward according to the proportion of the works, we can truly exact the reward from him: just as a slave cannot absolutely ask any reward of his master, since all that the slave acquires he acquires for his master; yet if it please the master to give him his works as his own, and to promise a reward for them as though they were not owed to him, he will by right ask a reward for his works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80548af3e9" data-kw="Merit">
<blockquote><p>I ask, what need was there to introduce the word Merit, when the value of works might have been fully expressed by another term, and without offense? The quantity of offense contained in it the world shows to its great loss. It is certain that, being a high sounding term, it can only obscure the grace of God, and inspire men with pernicious pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span></div>

</figure><figure class="quote" id="q-c3573a6dea" data-kw="">
<blockquote><p>There is no definite doctrinal decision in this matter. The concept meritum de congruo is not without ambiguity, inasmuch as the claim arising from it can be greater or less, hence the opinions of theologians are divided. a) Meritum de congruo and the sinner. A person in mortal sin can merit de congruo, by his free co-operation with actual grace, further actual graces in preparation for justification, and finally the grace of justification itself. (Sent. probabilis.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §25, 2</span></figcaption>

— Ludwig Ott, Fundamentals of Catholic Dogma, bk. 4, pt. 1, sec. 2, §25, 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere%20is%20no%20definite%20doctrinal%20decision%20in%20this%20matter.%20The%20concept%20meritum%20de%20congruo%20is%20not%20without%20ambiguity%2C%20inasmuch%20as%20the%20claim%20arising%20from%20it%20can%20be%20greater%20or%20less%2C%20hence%20the%20opinions%20of%20theologians%20are%20divided.%20a%29%20Meritum%20de%20congruo%20and%20the%20sinner.%20A%20person%20in%20mortal%20sin%20can%20merit%20de%20congruo%2C%20by%20his%20free%20co-operation%20with%20actual%20grace%2C%20further%20actual%20graces%20in%20preparation%20for%20justification%2C%20and%20finally%20the%20grace%20of%20justification%20itself.%20%28Sent.%20probabilis.%29%E2%80%9D%0A%0A%E2%80%94%20Ludwig%20Ott%2C%20Fundamentals%20of%20Catholic%20Dogma%2C%20bk.%204%2C%20pt.%201%2C%20sec.%202%2C%20%C2%A725%2C%202&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc3573a6dea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c3573a6dea.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7ee8450474" data-kw="">
<blockquote><p>If any one saith, that the good works of one that is justified are in such manner the gifts of God, as that they are not also the good merits of him that is justified; or, that the said justified, by the good works which he performs through the grace of God and the merit of Jesus Christ, whose living member he is, does not truly merit increase of grace, eternal life, and the attainment of that eternal life,-if so be, however, that he depart in grace,-and also an increase of glory; let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, can. 32</span></figcaption>

— Council of Trent, Decree on Justification, sess. 6, can. 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf%20any%20one%20saith%2C%20that%20the%20good%20works%20of%20one%20that%20is%20justified%20are%20in%20such%20manner%20the%20gifts%20of%20God%2C%20as%20that%20they%20are%20not%20also%20the%20good%20merits%20of%20him%20that%20is%20justified%3B%20or%2C%20that%20the%20said%20justified%2C%20by%20the%20good%20works%20which%20he%20performs%20through%20the%20grace%20of%20God%20and%20the%20merit%20of%20Jesus%20Christ%2C%20whose%20living%20member%20he%20is%2C%20does%20not%20truly%20merit%20increase%20of%20grace%2C%20eternal%20life%2C%20and%20the%20attainment%20of%20that%20eternal%20life%2C-if%20so%20be%2C%20however%2C%20that%20he%20depart%20in%20grace%2C-and%20also%20an%20increase%20of%20glory%3B%20let%20him%20be%20anathema.%E2%80%9D%0A%0A%E2%80%94%20Council%20of%20Trent%2C%20Decree%20on%20Justification%2C%20sess.%206%2C%20can.%2032&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ee8450474.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ee8450474.html">Permalink</a><a class="src" href="https://history.hanover.edu/texts/trent/ct06.html" rel="noopener" target="_blank">Read it online · Hanover Historical Texts</a></div>
</figure><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d920932169" data-kw="">
<blockquote><p>At the revolution, when all things were prepared for the establishment of popery and slavery, he [God] wrought a marvellous deliverance, and made the very seas, winds, and storms, as well as a branch of our enslavers’ roots, to fight for the re-establishment of our protestant religion and liberties, Deut. xxxii. 36. Psal. xciv. 12-15. cxxxv. 14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>State of Britain s Debt to God’ in John Brown and Ebenezer Brown (eds), Select Remains of the Rev. John Brown, Late Minister of the Gospel at Haddington</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b7047b830e" data-kw="">
<blockquote><p>XVII. As extraordinary evils require extraordinary helps, so the Magistrate may do many things in a time of the Church’s gathering, backsliding or corruption which he cannot do so long as the Church is in a well constitut[ed] &amp; reformed condition: But from this to infer that he may demolish the established order and fabric of a right[ly] constitut[ed] and reformed Church, on purpose to give a proof of his extraordinary power, by reducing the same into order again; Or that he may make use of this extraordinary power, when the ordinary and appointed means are to be had, and also in case to effectuate the cure; to infer this (I say) were both impious and incongruous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, … (1681), p. 45</span></figcaption>

</figure><figure class="quote" id="q-dd7252cd57" data-kw="">
<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23, p. 220</span></figcaption>

<blockquote><p>Quest. What is the fifth Commandment?

Answ. Honour thy Father, and thy mother, that thy days may be long in the land, which the Lord thy God giveth thee.

Quest. Who are here meant by Father and mother?

Answ. All our superiors, whether in Family, School, Church, and Commonwealth.</p></blockquote>

<blockquote><p>6. The object of the king’s power is not simply a peaceable life, and external peace of human societies, but also honesty and godliness, but to be procured by a civil, politic, regal and coactive way, by the sword of the secular arm, as the object of the Church power is honesty and godliness to be procured by a ministerial, ecclesiastical, and spiritual power, without any forcing of men by external power.</p></blockquote>

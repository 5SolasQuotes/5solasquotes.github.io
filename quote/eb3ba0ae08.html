<main class="wrap"><figure class="quote" id="q-eb3ba0ae08" data-kw="">
<blockquote><p>But I the rather assent to Alexander Hales, because I have read somewhere, I think it is in Hospinian, de Templis, that the Pope has no organ-piping music in his Church or chapel. And these I account the relics of ancient simplicity in worship, which the Pope received from the first bishops of Rome, and regarded not to make alterations of, without advantage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, p. 430</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab0bb2d83a" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Intro, pp. 88-89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind, in supplying their necessities, with the light and warmth of the sun… yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls…</p></blockquote>

</figure><figure class="quote" id="q-078a1af5af" data-kw="">
<blockquote><p>Now albeit Nature (as was said) teach all men that there is a eternal and mighty God, who should be worshipped and honored by them. Yet it descends not unto such particular precepts as can have any show of making ought for significant ceremonies Omnibus enim innatum est et in animo quasi insculptum, esse deos: but yet quales sint, says Cicero, varium est. And as Nature has not taught men to know the Nature and the attributes of the Godhead, together with the sacred Trinity of persons in the same: so neither has it taught what sort or manner of worship should be given unto God, Lex naturalis rerum communium est, and does only inform us with those common notions called [Greek]. Concerning the worship of God, it speaks only de genere, not de specie. Wherefore there can be no inference from that worship which the Law of Nature requires, either of any distinct kind of worship, or of any ceremony in that kind. No more than it follows, Si est animal, est Asinus [‘If it is an animal, it is a donkey’]; for à genere ad speciem non valet consequentia affirmando.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 9, p. 202</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

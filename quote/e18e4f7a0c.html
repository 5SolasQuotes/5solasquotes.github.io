<blockquote><p>But while the conduct of Calvin, in the case of Servetus, must be judged of mainly and primarily by the truth or falsehood of the doctrine of the lawfulness of putting heretics and blasphemers to death, — and while every one now concedes that, tried by this test, it cannot be defended, it is quite possible that there may be other collateral views of the matter, which may materially affect our estimate of the different parties, and tell powerfully in the way either of palliation or of aggravation.

Indeed, the only fair and honest question in regard to the case of Servetus, now that the lawfulness of putting heretics to death has been long abandoned, is this — Does Calvin’s conduct in the matter furnish evidence that he was a bad or cruel man? Does it prove him to have been in any respect worse than the other Reformers — that is, worse than the best men of his age? This is the only question which is now entitled to consideration, and this question, we venture to assert, must be answered in the negative, by every one who is not perverted by hatred of the truth which Calvin taught, by every one who is possessed of impartiality and candour. The leading considerations which prove that this is the only answer that can be given to the question, we shall merely state, without enlarging upon them.

1. The doctrine of the lawfulness and duty of putting heretics and blasphemers to death, was then almost universally held, by Protestants as well as Papists, – by men of unquestionable piety and benevolence, if there were any such persons, – and those who were zealous for God’s truth were then not only willing but anxious to act upon this doctrine whenever opportunity occurred.

There is no need to produce evidence of this position; but it may be proper to advert here to a statement which seems to contradict it, made by Dr Stebbing thinks that Henry has gone too far in defending Calvin, and in his anxiety to repudiate all concurrence in this, he makes the following statement, in his preface: “Henry has defended Calvin in the case of Servetus with admirable ability; but the translator believes still, as he has ever believed, that when men enjoy so large a share of light and wisdom as Calvin possessed, they cannot be justified, if guilty of persecution, because they lived in times when wicked and vulgar minds warred against the rights of human conscience.”

Now this statement obviously and necessarily implies, that in Calvin’s time it was only “wicked and vulgar minds” who countenanced persecution, and that Calvin’s conduct is indefensible, because he agreed on this point only with the wicked and the vulgar, and differed from the better and higher class of minds, among his contemporaries. This is what Dr Stebbing has said. But of course he could not mean to say this; for he must have known, if he gave any attention to what he was saying, that the statement is unquestionably false.

Every one knows that in Calvin’s time the defence of persecuting principles was not confined to the “wicked and vulgar”, but was almost universally held, even among the best and highest minds. It is to be presumed that Mr Wallace did not perceive the folly or the falsehood of this statement of Dr Stebbing’s, when he quoted it with so much gusto, and set it forth as a “well-merited censure from the pen of one of Calvin’s most ardent admirers.”

2. Servetus was not only a heretic and blasphemer, but one about whom there was everything to provoke and nothing to conciliate. More than twenty years before his death he had put forth views which led Bucer, one of the most moderate of the Reformers, to declare that he ought to be torn in pieces. He continued thereafter to lead a life of deliberate hypocrisy, living for many years in the house of a popish prelate, conforming outwardly to the Church of Rome, while, at the same time, he embraced every safe opportunity of propagating his offensive heresies and blasphemies against the most sacred and fundamental doctrines of Christianity.

He repeatedly denied, upon oath, all knowledge of the books which he had published, and he conducted himself during his trial with reckless violence and mendacity. We do not mention these things as if they excused or palliated his being put to death, but merely as illustrating the unreasonableness and unfairness of attempting to represent the case as one of peculiar aggravation, or as specially entitled to sympathy. Chaufepie, whose article on Servetus in the 4th volume of his Continuation of Bayle’s Dictionary is, perhaps, upon the whole, the best and fairest view of the subject that exists, says: “Unfortunately for this great man (Calvin) he is more odious to certain people than Servetus is. They cannot resolve to render him the justice, which no impartial person can refuse to him, without doing an injury to his own judgment.”

3. Servetus had been convicted of heresy and blasphemy by a Popish tribunal at Vienne, and had been condemned to be burned by a slow fire; and he escaped from prison and came to Geneva with that sentence hanging over him. During his trial at Geneva the Popish authorities transmitted the sentence they had pronounced against him, and reclaimed him, that they might carry it into execution. It was then put to Servetus, whether he would go back to Vienne or go on with his trial at Geneva. He preferred to remain where he was, and there is good reason to believe that the determination of the civil authorities at Geneva to pronounce and execute upon him a sentence of death, was, in some measure, produced by the fear that the Papists would charge them with being indifferent, if not favourable, to heresy, if they spared him.

There is abundant evidence that this consideration operated, to some extent, as a motive, upon the conduct of the Protestant churches at the time of the Reformation. As a specimen of this, we may refer to Bishop Jewel’s “Apology of the Church of England,” a work which was approved of by the Convocation, and thus clothed with public authority. In the third chapter of the Apology, sect. 2, Jewel boasts, that Protestants not only detested and denounced all the heretics who had been condemned by the ancient church, but also that, when any of these heresies broke out amongst them, “they seriously and severely coerced the broachers of them with lawful and civil punishments.”

If this was distinctly set forth and boasted of as an ordinary rule of procedure, in opposition to Popish allegations, we cannot doubt that the consideration would operate most powerfully, in so very peculiar, and indeed unexampled, a case as that of Servetus, in which not only had a popish tribunal condemned him to the flames, but had publicly demanded his person that they might put that sentence in execution. In these circumstances, no Protestant tribunal could be expected to do anything else but pronounce a similar sentence, unless either the proof of the charge of heresy and blasphemy had failed, or they had believed it to be unlawful to put heretics and blasphemers to death.

4. Although Calvin, after having, notwithstanding extreme personal provocation, done everything in his power to convince Servetus of his errors, approved of putting him to death as an incorrigible heretic and blasphemer, he exerted his influence, but without success, to prevent his being burned, and to effect that he might be put to death by some less cruel and offensive process; so that to talk, as is often done, of Calvin burning Servetus, is simply and literally a falsehood.

5. The Reformers generally, and more especially two of the mildest and most moderate of them all, both in their theological views and in their general character, – Melancthon, representing the Lutherans, and Bullinger, representing the Zwinglians, – gave their full, formal, public approbation to the proceedings which took place in Geneva in the case of Servetus.

6. Archbishop Cranmer exerted all his influence with King Edward, and succeeded thereby, though not without great difficulty, in effecting the burning of two heretics – one of them a woman and the other a foreigner – whose offences were in every respect, and tried by any standard whatever, far less aggravated than Servetus’s.</p></blockquote>

urned%2C+and+to+effect+that+he+might+be+put+to+death+by+some+less+cruel+and+offensive+process%3B+so+that+to+talk%2C+as+is+often+done%2C+of+Calvin+burning+Servetus%2C+is+simply+and+literally+a+falsehood.%0A%0A5.+The+Reformers+generally%2C+and+more+especially+two+of+the+mildest+and+most+moderate+of+them+all%2C+both+in+their+theological+views+and+in+their+general+character%2C+%E2%80%93+Melancthon%2C+representing+the+Lutherans%2C+and+Bullinger%2C+representing+the+Zwinglians%2C+%E2%80%93+gave+their+full%2C+formal%2C+public+approbation+to+the+proceedings+which+took+place+in+Geneva+in+the+case+of+Servetus.%0A%0A6.+Archbishop+Cranmer+exerted+all+his+influence+with+King+Edward%2C+and+succeeded+thereby%2C+though+not+without+great+difficulty%2C+in+effecting+the+burning+of+two+heretics+%E2%80%93+one+of+them+a+woman+and+the+other+a+foreigner+%E2%80%93+whose+offences+were+in+every+respect%2C+and+tried+by+any+standard+whatever%2C+far+less+aggravated+than+Servetus%E2%80%99s.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+John+Calvin+in+The+Reformers+and+the+Theology+of+the+Reformation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe18e4f7a0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e18e4f7a0c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/30/william-cunningham-on-the-reformers-and-the-punishment-of-heresy-and-blasphemy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-c06acbe19d" data-kw="">
<blockquote><p>He that hath taken upon him the charge and oversight of the Church of God, let him well weigh and consider, whether he have carefully discharged his duty, both in doctrine &amp; life, so that the glory of God by him thereby hath been the rather favoured and propagated, and the consciences of many effectually stayed &amp; comforted.

Whether in matters touching God and Christian religion, he hath set forth and uttered in the Church, any thing doubtful and uncertain, in steed of certain truth, and undoubted verity. Whether he be spotted and infected with any heresy, or unsound opinion. Whether he have at all times to the uttermost of his ability and skill, endeavoured to beat down and confute all corrupt doctrines.

Whether he have patiently winked at, &amp; quietly suffered any rites wherein hath been either apparent superstition, or otherwise any notable offence and inconvenience: As gadding and ranging about with procession, countenancing in corners, superstitious usage of holy water, pilgrimages, and vows to be performed in some certain places, and with certain appointed solemnities and ceremonies, whereby there are commonly committed sundry lewd attempts and many lamentable enormities.

Whether he have admitted any to be teachers in the Church, which were either unmeet or unable sincerely and discreetly to deliver the word of God: or any corrupt and unsound preachers, that willingly deprave the texts of the scriptures, and purposely misconstrue the words of truth, to confirm and establish their own fantastical, or rather fanatical, opinions.</p></blockquote>

</figure><figure class="quote" id="q-23b5ad438a" data-kw="">
<blockquote><p>If Owen be admitted to be, as by common consent he seems to be regarded, the ‘David’ of the Puritan host, and Howe, and Baxter, and Thomas Goodwin to be the ‘first three’ of its worthies, we believe that the second trio must include the name of David Clarkson, associated probably with those of Charnock and Sibbes, or perhaps Flavel. It is manifest, however, that such a statement is to be taken only in a very general sense. In some respects, Sibbes is as much superior to Goodwin, as in others Goodwin is superior to Sibbes; while in some most important particulars, and especially in respect of clearness and liveliness, Owen himself is unquestionably below all the seven others who have been named, and many others who might have been mentioned.

From the very nature of the case, the question of precedence amongst writers cannot be determined but in a vague and general way. No man would ever think of asking the question whether Shakespeare or Bacon were the greater genius, the better writer; or even the more limited question, whether Hume or Gibbon were the better historian, Addison or Johnson the more accomplished essayist. And in the domain of Christian and theological literature, the qualities of different writers are manifestly incommensurable.

There are diversities of gifts; and it may not be determined whether the possession of a larger measure of one gift, and a smaller measure of another, be more or less valuable than that of a greater degree of the latter, and a less measure of the former. The clear eye of one may be as precious as the fine ear of another; the delicate touch of one as the firm standing of another; and the eye may not say to the ear, I have no need of thee, nor yet the hand to the foot, I have no need of thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-smith.html">Thomas Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory Note in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-af417d0dd5" data-kw="">
<blockquote><p>As a minister who has tolerable gifts for preaching may yet need the writings of other men before hand, and may bring both their matter and method into the pulpit, yea and oft times their words; so that though he have gifts, yet being weak, he may use the gifts of others. I have been counseled since I was silenced [in 1662] to compose sermons myself and give them in writing to some weak minister that has an excellent voice and utterance and to let him preach them. And really if I had not known that such have good books enough at hand for such a use, I think I should have done it: And who can prove that this had been his sin? And yet this was a using of another man’s gifts instead of his own. And I have heard men that are much against parish churches and liturgies wish that some unlearned men of good utterance might read some excellent sermon books to the people in ignorant places that can get no better: And who can prove the reading of a homily unlawful?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>
<div class="actions"><button class="copy" data-copy="“As a minister who has tolerable gifts for preaching may yet need the writings of other men before hand, and may bring both their matter and method into the pulpit, yea and oft times their words; so that though he have gifts, yet being weak, he may use the gifts of others. I have been counseled since I was silenced [in 1662] to compose sermons myself and give them in writing to some weak minister that has an excellent voice and utterance and to let him preach them. And really if I had not known that such have good books enough at hand for such a use, I think I should have done it: And who can prove that this had been his sin? And yet this was a using of another man’s gifts instead of his own. And I have heard men that are much against parish churches and liturgies wish that some unlearned men of good utterance might read some excellent sermon books to the people in ignorant places that can get no better: And who can prove the reading of a homily unlawful?”

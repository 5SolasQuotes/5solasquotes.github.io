<blockquote><p>Whatsoever therefore is to be found among the Gentiles agreeable to truth and honesty, that is to be referred to God, the author of all goodness: and on the other side, whatsoever is contrary to the truth, that must be attributed to the corrupt nature and evil affections of mankind.</p></blockquote>

<blockquote><p>§V. As to liberty itself; there remained in the will of lapsed man:

1. Immunity from the necessity of coaction, or external violence, by reason of elicited acts.

2. Immunity from internal physical necessity.

3. The liberty of exercise or of contradiction, which is between willing or not willing; loving or not loving; acting or not acting.

4. The liberty of specification, by which the will, from two or more things or species which can be recalled to the sphere of doable things in the state of corruption, can choose one and neglect another. §VI. The objects which pertain to the sphere of doable things in the state of reigning corruption, before conversion, are all those things which are subject to the senses and to natural reason, and do not surpass human grasp. And they are:

1. Actions merely natural and animal, e.g., to eat, to drink, to be awake, to sleep, to be moved from a place, to rest.

2. The inventions or apprehensions of sciences and arts, concerning which see Calvin, Institutes, bk. 2, ch. 2, §14.

3. Civil and economic actions, such as to care for a family and the commonwealth, and in them to do or omit one’s duty.

4. Moral actions of the natural order, and those which pertain to common ethics, Rom. 2:14-15… Hence the virtues of the gentiles, produced by the general aid of God, as to their substance, are true moral virtues of the natural order, consisting of the same internal form, object, means and acts; although by reason of their mode, adjuncts, circumstances, and also their end, they often had notable defects, in respect of which Augustine calls them, by a broad signification, ‘sins’, although elsewhere he commends the virtues of the gentiles, as in Of the Spirit &amp; the Letter, ch. 27; Epistle 99 to Evodius; also Epistle 130; and the book, On the Grace of Christ, ch. 24. See Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 7, §5; D. Johann Fabricius, Systema Theologicum, locus 3, aphorism 2, p. 277. Nor does the passage Rom. 14:23 stand in the way, for there Paul by ‘faith’ does not understand saving faith, but the dictate of conscience, by which something is judged to be licit or illicit. §VII. But to this sphere in no way pertain spiritual actions, which cannot be elicited and performed except by the Spirit of God vivifying, illuminating, acting, operating, regenerating and sanctifying in certain degrees. In respect of these, we rightly teach that the natural powers of free will are not only bound, attenuated, impeded, wounded and broken, but plainly lost, destroyed, extinguished, and null, against the Pelagians, Semi-Pelagians, Socinians, Remonstrants, Mennonites; and in part also the Greeks, Synergists and Pontificists, of whom see Bellarmine, bk. 6 of On the Loss of Grace &amp; the State of Sin, ch. 16; Coster, Enchiridion, ch. 5, p. 190. §VIII. Against whom we assert that unregenerate man in the state of dominant corruption, or before his conversion, has from himself no natural powers, whether in the intellect or in the will, for… keep[ing] the precepts of God, and do[ing] good works, pleasing to God and saving for himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, pp. 20-22 Latin Holtzfus was a German reformed divine.</span></figcaption>

</figure><figure class="quote" id="q-ea26cac1d4" data-kw="">
<blockquote><p>Neither does the renewed confidence of perseverance produce immorality or lack of concern for godliness in those put back on their feet after a fall, but it produces a much greater concern to observe carefully the ways which the Lord prepared in advance. They observe these ways in order that by walking in them they may maintain the assurance of their perseverance, lest, by their abuse of God’s fatherly goodness, the face of the gracious God (for the godly, looking upon that face is sweeter than life, but its withdrawal is bitterer than death) turn away from them again, with the result that they fall into greater anguish of spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 13</span></figcaption>

</figure><figure class="quote" id="q-bf9c25224b" data-kw="">
<blockquote><p>When men would express the removal of somewhat absolutely necessary, they use to say, this were Solem è mundo tollere, to take the Sun out of the World. If that were removed, how would all beauty vanish, and (as some think) all motion cease? The potter’s wheel (say they) could not turn upon earth, if the Sun should not move in heaven.

So take Christ from a soul, ’tis impotent to all good, Without me ye can do nothing, John 15. 5. Were it not for the Sun it would be perpetual night in the world, notwithstanding all the torches that could be lighted; yea notwithstanding all the light of the moon and stars. It is neither the torch-light of natural parts and creature-comforts; nor the star-light of civil honesty and common gifts; nor the moon-light of temporary faith and formal profession, that can make it day in the soul, till the Sun of righteousness arise and shine there.

Once indeed there was a time, when fruits were produced without a Sun; when God, to prevent the idolizing of this creature as the only cause of all fertility, enabled the earth to bring forth on the third day, whereas the Sun was not made till the fourth: But never was there any the least moment of time since the fall, wherein man could bring forth fruit to God without the cooperation of Christ. He that hath not the Son hath not life, 1 Iohn 5. 12. Neither can any vital action be performed but by his special grace.</p></blockquote>

— John Arrowsmith, A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7, (London: Samuel Man, 1647), pp 9-10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+men+would+express+the+removal+of+somewhat+absolutely+necessary%2C+they+use+to+say%2C+this+were+Solem+%C3%A8+mundo+tollere%2C+to+take+the+Sun+out+of+the+World.+If+that+were+removed%2C+how+would+all+beauty+vanish%2C+and+%28as+some+think%29+all+motion+cease%3F+The+potter%E2%80%99s+wheel+%28say+they%29+could+not+turn+upon+earth%2C+if+the+Sun+should+not+move+in+heaven.%0A%0ASo+take+Christ+from+a+soul%2C+%E2%80%99tis+impotent+to+all+good%2C+Without+me+ye+can+do+nothing%2C+John+15.+5.+Were+it+not+for+the+Sun+it+would+be+perpetual+night+in+the+world%2C+notwithstanding+all+the+torches+that+could+be+lighted%3B+yea+notwithstanding+all+the+light+of+the+moon+and+stars.+It+is+neither+the+torch-light+of+natural+parts+and+creature-comforts%3B+nor+the+star-light+of+civil+honesty+and+common+gifts%3B+nor+the+moon-light+of+temporary+faith+and+formal+profession%2C+that+can+make+it+day+in+the+soul%2C+till+the+Sun+of+righteousness+arise+and+shine+there.%0A%0AOnce+indeed+there+was+a+time%2C+when+fruits+were+produced+without+a+Sun%3B+when+God%2C+to+prevent+the+idolizing+of+this+creature+as+the+only+cause+of+all+fertility%2C+enabled+the+earth+to+bring+forth+on+the+third+day%2C+whereas+the+Sun+was+not+made+till+the+fourth%3A+But+never+was+there+any+the+least+moment+of+time+since+the+fall%2C+wherein+man+could+bring+forth+fruit+to+God+without+the+cooperation+of+Christ.+He+that+hath+not+the+Son+hath+not+life%2C+1+Iohn+5.+12.+Neither+can+any+vital+action+be+performed+but+by+his+special+grace.%E2%80%9D%0A%0A%E2%80%94+John+Arrowsmith%2C+A+great+wonder+in+heaven%2C+or%2C+A+lively+picture+of+the+militant

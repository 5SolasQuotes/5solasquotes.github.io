<blockquote><p>[Objection:] Sixthly, if it be the will of God that the death of Christ should be available for the immediate reconciliation of some of the elect, without any condition performed by them, then it was his will that it should be for all of them. But it is the will of God that it should be available for the immediate reconciliation of some of the elect, viz. infants, or else they cannot be reconciled. I answer: Mr. [William] Eyre is hardly put to it, that he must run to the Philistines to sharpen his goad; this argument is taken from [Francis] Suarez [a Romanist], who argues against faith in general upon this ground, because infants are justified without it. Now this argument proves, if it proves anything at all, that we are justified without it, and not before it, and so believers are not the sole subjects of justification, as Mr. Eyre elsewhere affirms; but the case of infants is not to be urged in most questions, especially when we are speaking of what God requires in those that are adulti, ‘of age’ unto salvation; but I deny his minor and affirm that infants are not united to Christ without faith; they are saved by faith as well as we. Thus [Jerome] Zanchi (tome 5, Commentary on Hosea, p. 28): Ut uniamur huic capiti Christo, Spiritus propriae fidei per sese omnibus ipsis etiam parvulis pernecessarius est; justus enim ex sola fide sua vivet, non aliena: assensus autem propriae voluntatis omnibus adultis est necessarius, etc.’ ‘ac proinde etiam parvuli quodammodo sibi ponunt hoc caput, cum Spiritu fidei interno in hoc caput donantur:’ ‘That we may be united to Christ, the spirit of a man’s own faith by itself is necessary to all, yea to infants also; for the just shall live by his own faith, not by another man’s; but the assent of our own proper will is necessary to all that are of age.’ And a little after he says: ‘and therefore also infants do in a manner appoint themselves this head, when they are given unto this head by the internal Spirit of faith.’ So also learned [Andrew] Rivet (ad vers. Babyl Jesui. Tom., [section ?] 297, p. 254.): Agnoscimus Deum in infantibus supplere quod deest propter aetatis imbecillitatem interna Spiritus sui operatione, qui fidei semen in ipsis ingenerat, et vi sua eis applicat meritum Christi, cujus suo tempore in eis sensum est excitaturus: ‘We acknowledge that God supplies in infants what is wanting through the weakness of their age by the internal work of his Spirit, who engenders a seed of faith, and by his power applies the merits of Christ to them, whereof He will raise up a sense in his time;’ Therefore I acknowledge there is at least wrought in them semen fidei, ‘a seed of faith’, by which they become members of Christ, and that relation which is in their faith to Christ’s merits is the instrument by which they obtain remission of sins, and without which they could not be saved. Nor may this seem strange, seeing we grant that in men grown up they are merely passive in the first work of grace, their understandings and wills no ways concurring antecedently to this work; and seeing it is a work wrought in us without us, why may not children be capable of this? Besides, if Adam had stood, even infants before the use of reason had been sanctified, and Christ was so from the womb, and John Baptist, and infants received the seal of the righteousness of faith; and are they capable of the seal of the righteousness of faith, and not of faith? And therefore though they have not the use of knowledge, this hinders not a seed and work of faith; they have not actual reason, yet they have reasonable souls; and when it is said that faith comes by hearing [Rom. 10], it is to be applied to persons that are of age, to whom the ordinary means to beget faith is hearing of the Word preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-warren.html">Thomas Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unbelievers No Subjects of Justification</cite>, … (London: Browne, 1654), pp. 247-49</span></figcaption>

<blockquote><p>5. When we teach the perseverance of the saints in a state of justification once obtained, we do not deny that the quality, or exercise of the faithful or righteous man is mutable or may be lost, by reason of the subject matter; but we affirm that the special love of God does not permit, that he who by believing in Christ shall have been justified and adopted as a son of God, by losing that faith and holiness should cease to be a child of God and perish for ever.</p></blockquote>

<blockquote><p>I. Children of pagans, of whatever age and however they have come into the power of Christians, whether legitimately or illegitimately, if they are taken into Christian families as their slaves or servants, who can be manumitted [released] again at their masters’ pleasure and ejected from Christian families, should not be baptized, but should first be taught the Christian religion, and a confession of the same should be required from them before they are admitted to baptism. For such children of pagans are not and should not be considered members of the visible church either by right of birth or by right of adoption into Christian families. Not by right of birth, for they are born outside the church from unbelieving and polluted parents, and therefore they themselves are also rightly considered unbelieving and polluted, according to 1 Corinthians 7:14. Not by right of adoption into Christian families, for this, if it is done only for the sake of servitude and with reserved liberty of expulsion, makes no one a member of the church. For thus in the Old Testament, in the families of faithful patriarchs, and in the time of the primitive apostolic church in Christian families, many children were born from pagan servants, who nevertheless were outside the church no less than their parents, and were not considered its members, until their parents, having abandoned paganism, transferred to the Jewish or Christian religion and brought their children with them to the church. Nor does the example of Abraham in Genesis 17 stand opposed [to our position], who also circumcised those bought with money and foreigners. For Abraham did not force such unwilling ones to circumcision, nor did he admit them while still unbelieving, for otherwise God’s covenant would have been profaned. Instead, he first instructed them in the doctrine of the covenant and circumcised those who embraced that doctrine along with their infants.</p></blockquote>

<blockquote><p>24. Thus the Lord, when he chose Abraham for himself, did not commence with circumcision, in the meanwhile concealing what he meant by that sign, but first announced that He intended to make a covenant with him, and, after his faith in the promise, made him partaker of the sacrament. Why does the sacrament come after faith in Abraham, and precede all intelligence in his son Isaac? It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly. If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations. This undoubtedly is the reason why the Lord sometimes declares that the children born to the Israelites are begotten and born to Him (Eze. 16:20; 23:37) For He undoubtedly gives the place of sons to the children of those to whose seed He has promised that He will be a Father. But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and fallacious. In that view, Paul says that the gentiles, so long as they were plunged in idolatry, were strangers to the covenant (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellowship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism. To this we must refer the narrative of the evangelist, that those who were baptized by John confessed their sins (Mt. 3:6). This example, we hold, ought to be observed in the present day. Were a Turk to offer himself for baptism, we would not at once perform the rite without receiving a confession which was satisfactory to the Church.</p></blockquote>

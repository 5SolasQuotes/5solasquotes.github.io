<main class="wrap"><figure class="quote" id="q-0446f415c2" data-kw="">
<blockquote><p>In these Ten Commandments was contained the sum and essence of all the law that was given unto Israel. Everything else in the way of law, that was delivered to the chosen people, had its foundation in those moral principles and precepts which the Decalogue contains.

This law laid down the rule of man’s obedience, — the righteous and immutable rule which defines and regulates his duty to God on the one hand, and to his fellow-creatures on the other.

The judicial law which, by Divine authority, was separately and subsequently instituted, was nothing more than the application of the great maxims of the moral law, to the government of Israel, as a church and nation placed under theocratic rule. In the details of that judicial law, there were necessarily, in such circumstances, many provisions of a merely local and temporary nature — intended for that people alone, and for the peculiar economy under which they lived. But in all its leading objects and aims, the judicial law of ancient Israel drew its spirit and derived its highest authority, from the law that was written on tables of stone.

Nor was it otherwise in the case of the ceremonial law. That law of meats and drinks, and divers washings and sacrifices of slain beasts, and other carnal ordinances, was, no doubt, in its literal and outward form, a purely positive institution, which had no moral worth or efficacy in itself considered. But nevertheless, the moral law — the law of the Ten Commandments — lay underneath it all. To transgress the moral law was to sin against God. And what was the great end and design of the ceremonial law, but to make palpable the awful and momentous fact, that sin is the abominable thing which God hates; and that without holiness — the holiness which the moral law embodies and demands — no man shall see the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Relation of the Law, as Given to Israel, to the Mission and Work of Christ in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9aec2c78b0" data-kw="">
<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them?… …whereas it might bee thought, that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places… …that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks.</p></blockquote>

<blockquote><p>…the Rejoinder [of an opponent] brings abundance of instances [for human ceremonies in worship though they had been idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which are a form of natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

</figure><figure class="quote" id="q-59d7b78d34" data-kw="">
<blockquote><p>Indeed, nothing like the example of a ceremony has been exhibited thus far. On the laying on of hands and of the holy kiss, we speak below.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 7. ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, pp. 422-460 “On the public controversies [previously] explicated, we respond to various problems and questions on the ceremonies, by which the nature and properties of them may be the better laid open. I divide them into problems on ceremonies in general and on ceremonies in particular. The first classes [on ceremonies in general] pertain to what it is, or the definition, or the causes or properties.” | On the definition of a ceremony: | 11th Problem, ‘Whether in the time of the N.T. there were instiuted, or observed by the apostles ceremonies properly called sacred and mystical, whether in their signifying or working, which however were not parts of divine worship, nor instituted by divine law, nor consequently necessary by the necessity of a precept? I respond: No.’, p. 425</span></figcaption>

<blockquote><p>What say you of that part, [Quest.] which is Typical and Ceremonial?

Though they cease and be abolished as to our practice, [Answ.] yet they are perpetual, and still a part of holy scripture, as for our teaching and learning, The Types and figures of the Law are a kind of Prophesies, for they do in certain Actions set forth Christ to come, and the benefits by him; as the Prophets did by their words and writings, they still teach and instruct, and we may fetch Arguments of faith and duty from them, as Paul doth in the Epistle to the Hebrews, and other places (as for example) if the Question be between us and the Socinians, whether Christ by dying did make Atonement for sin. We say, yea, and the Law and the daily Burnt offerings and sin offerings doe teach the same: if ye ask of the manner how? Answer, it is by sprinkling the sinner, (that is) by applying it to our own souls.

If the question be about Ministers and their maintenance, in the New Testament the Apostle proves it to be the peoples duty from the Law. 1 Cor. 9.7. Who goes a warfare at his own Charge? That’s Paul’s Argument; Ministers must be paid as well as soldiers, and he fortifies his reason by Testimony of old Testament ver. 8. Say I these things as a man? Or saith not the Law the same? For it is written in the Law of Moses, Thou shalt not muzzle the mouth of the Ox, that treadeth out the Corn; The same proof he uses upon another occasion. 1 Tim. 5.17.18.

But Paul’s proof is faulty, because it is a Ceremonial proof, [Obj.] and so denies Christ to be come in the flesh.

God intended in that Law, to teach us something, [Answ.] that is moral, (namely) that God doth take care for Ministers, and for his Labourers in his word, more than for Oxen; and if that Law be written for our sakes; then why may not other things written in the Ceremonial Law, teach a moral duty, as well as that? The Ceremonial law, as it doth set forth Christ, so also the duty of Christians in their holy administrations: Thus the Purging out of Leaven, did teach the putting away of filthy affections from our holy services, and polluted people from the society of the Church, 1 Cor. 5.7.13. So the sprinkling of the unclean, doth teach, that when we present any service to the Lord, we must renew our repentance, and not come with defiled hearts or hands, 1 Tim. 2.8. By the consecrating of the first fruits we are taught, that we ought to be consecrated as holy unto the Lord, as a kind of first fruits of his creatures, Jam. 1.18. Rev. 14.4.

We are not subject to those Ordinances to do them, we offer not the sacrifices, because Christ is come; yet look what they signify, they teach, and they serve for our learning, as is said.

But there is Heb. 7.18. [Obj.] A disannulling of the Commandment for the weakness and unprofitableness of it.

The meaning is this, [Answ. 1] that the blood of those sacrifices did not take away sin by any power or virtue, that was in them; they of themselves are weak and beggarly, if any body should rest in them, as the Carnal Jews did; and therefore, he says, those Ordinances were to cease, and give place, when the true Sacrifice, Jesus Christ was offered; which alone did and could take away sin; The law made nothing perfect, but in their relative use and end, they did lead unto Christ, that better hope, who made all perfect; For his blood served for the redemption of sins and transgressions, which were committed under the first Testament. So that the way of Salvation taught then in Types, and now without them; the substance of the Covenant is one and the same, only that former manner of Administering waxeth old, and is put into a new way, which is significantly expressed, Heb. 7.12.

There is … not an abolishing of the substance of the Covenant, but a Transposition of it into another way; As a Tenant, that holds by Copy, if he obtain to hold in Fee, the latter grant doth indeed actually null the former Tenure, yet not the former Benefit, his Tenure is mended, being changed into Fee simple: So the coming of the New Testament doth better our Tenure, but alters not the Promises, Commands, Counsels in the Old. For as the substance of the Priesthood was not to end, as having no more a being on the Earth, but only translated upon other persons. I will take of the Gentiles for Priests and Levites: So the matter of the Covenant was not destroyed, and taken quite away, but only changed into another Form, other Sacraments, and yet the same; other for the Sign, the same for Substance, the same spiritual meat and drink, the same Rock, Jesus Christ.

I answer, [Answ. 2] That when the Apostle there speaks of disannulling the Old Testament, he doth not mean the Books of the Old Testament, but that old manner of publishing, administering, and applying the Covenant.

The Books of the Old Testament had Christ for their principal scope and subject. Moses wrote of me, if ye believe Moses, you would believe me, if ye believe not Moses, ye cannot soundly believe the Apostles: Thus they reasoned and persuaded the things concerning Jesus out of the Law, and Prophets. Wherefore we conclude, that the Scriptures of the Old Testament, are to be retained still in force, as the good Word of God written for our learning, and a Word that still speaks unto us as unto Children, in Doctrines, in Exhortations, in Consolations.</p></blockquote>

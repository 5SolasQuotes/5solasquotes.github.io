<blockquote><p>Whatever is committed against right reason, the same is committed against God and divine law (Rom. 2:12, 14–15), insofar as the law of God made known through nature is identical with the law which is published by a living voice or writing [in Scripture]…</p></blockquote>

</figure><figure class="quote" id="q-93e36ab959" data-kw="">
<blockquote><p>If the Scriptures be what they claim to be, the word of God, they are the work of one mind, and that mind divine. From this it follows that Scripture cannot contradict Scripture. God cannot teach in one place anything which is inconsistent with what He teaches in another. Hence Scripture must explain Scripture. If a passage admits of different interpretations, that only can be the true one which agrees with what the Bible teaches elsewhere on the same subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>

</figure><figure class="quote" id="q-6c1d4a94c7" data-kw="">
<blockquote><p>Let this then be a sure axiom - that there is no word of God to which place should be given in the Church save that which is contained, first, in the Law and the Prophets; and, secondly, in the writings of the Apostles, and that the only due method of teaching in the Church is according to the prescription and rule of his word.</p></blockquote>

</figure><figure class="quote" id="q-27a9e0c727" data-kw="">
<blockquote><p>As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

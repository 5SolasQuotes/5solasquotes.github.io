<main class="wrap"><figure class="quote" id="q-816ed4b644" data-kw="">
<blockquote><p>5. We know the Tabernacle and Temple were corporal things made with hands and that they are things different from the spiritual things that they signify, as the sign and the thing signified; as therefore the Lord is express in the elements and rites of the Supper of the Lord, because all of them, bread, wine, taking, eating, breaking, pouring out the wine, drinking, are teaching and edifying signs; and our Lord never left it to the wisdom of men to devise signes to teach themselves: So in like manner, should the Lord expressly specify all the teaching and signifying signs in the Old Testament; and as Moses might devise none of his own, but was tied to follow the pattern which the Lord Himself showed to him in the mount: So are we now under the New Testament tied to the pattern of that same will revealed in the Word; and it is laid on us not to be wise above that which was written; and it is of perpetual equity: The supreme Lawgiver never left it to the wisdom of angels, or men, or prophet, apostle or Church, to serve and worship God as they thought good: But He Himself particularly prescribed the way, signs, and means: And because God has not been pleased in the New Testament to specify types of Christ incarnate, and come in the flesh already; therefore are we obliged in conscience to believe, and practise no more, either in doctrinals, or teaching types, or positives of Church-policy, than our pattern in the mount, the Scripture has warranted to us, to be the will of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), pp. 49-50</span></figcaption>

</figure><figure class="quote" id="q-ffa696fb07" data-kw="">
<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 4</span></figcaption>

<blockquote><p>…yet in formal terms, they [the congregationalists] do deny the most gracious of their brethren to live beside them in New-England in the presbyterial way of the old non-conformists: yea, in print they avow that whoever refuses their tenet of Independency, were they otherwise never so orthodox and pious, they ought not to be admitted to the sacraments, nor enjoy any church privileges: as people who cannot be wholly, but at most are in part only converted: Yea, as such who must be taken for antichristian spirits, for enemies to Christ and his kingdom: Neither have I heard that any of them now for many years have either celebrated to others or received themselves the sacraments in any English church.</p></blockquote>

</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;”

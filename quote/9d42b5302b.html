<main class="wrap"><figure class="quote" id="q-9d42b5302b" data-kw="">
<blockquote><p>That right means be used with speed and diligence for the healing of our divisions and the uniting of all the true Churches of Christ (at least in these nations; and O that your endeavors might be extended much further) to which end I shall mention but these two means of most evident necessity:

1. That there be one Scripture-creed, or confession of Faith, agreed on by a general assembly of able ministers duly and freely chosen hereunto, which shall contain nothing but matter of evident necessity and verity. This will serve:

1. For a test to the Churches, to discern the sound professors from the unsound (as to their doctrine) and to know them with whom they may close as brethren, and whom they must reject.

2. For a test to the magistrate, of the orthodox to be encouraged, and of the intollerably heterodox, which it seems is intended in the 37th Article [of the 39 Articles] of the late formed government, where all that will have liberty must profess (faith in God by Jesus Christ), which in a Christian sense must comprehend every true fundamental or article of our Faith: And, no doubt, it is not the bare speaking of those words in an unchristian sense that is intended (As if a Ranter should say that himself is God, and his mate is Jesus Christ). 2. That there be a public establishment of the necessary liberty of the Churches to meet by their officers and delegates on all just occasions, in assemblies smaller or greater (even national when it is necessary), seeing without such associations and communion in assemblies, the unity and concord of the Churches is not like to be maintained. I exclude not the magistrate’s interest or oversight, to see that they do not transgress their bounds. As you love Christ and his Church and Gospel, and men’s souls, neglect not these unquestionable points of his interest, and make them your first and chiefest business, and let none be preferred before Him till you know them to be of more authority over you and better friends to you than Christ is…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Treatises tending to Awaken Secure Sinners</cite>, … (London: Rothwell, 1656), ‘To the Right, Honorable Serjeant Glyn’, n.p.</span></figcaption>

ds.+As+you+love+Christ+and+his+Church+and+Gospel%2C+and+men%E2%80%99s+souls%2C+neglect+not+these+unquestionable+points+of+his+interest%2C+and+make+them+your+first+and+chiefest+business%2C+and+let+none+be+preferred+before+Him+till+you+know+them+to+be+of+more+authority+over+you+and+better+friends+to+you+than+Christ+is%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Three+Treatises+tending+to+Awaken+Secure+Sinners%2C+%E2%80%A6+%28London%3A+Rothwell%2C+1656%29%2C+%E2%80%98To+the+Right%2C+Honorable+Serjeant+Glyn%E2%80%99%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d42b5302b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d42b5302b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=That%20right%20means%20be%20used%20with,friends%20to%20you%20than%20Christ%20is&amp;text=That%20right%20means%20be%20used%20with%20speed%20and&amp;text=and%20better%20friends%20to%20you%20than%20Christ%20is" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b8961fb64f" data-kw="">
<blockquote><p>Before the rise of Luther, the Albigenses and others acted rightly in making a negative separation (for they did not communicate with the idolatry of the Papists), although before condemnation, persecution, and expulsion, they did not make a positive separation by forming another new visible Church. Where there are some fundamental errors in the Church, it is not immediately permissible to make a positive separation. Christ commanded to hear those who sit in Moses’ seat [Mt. 23:1-3], although they taught some things that overturned the foundation and rejected Christ. Nor does separation from an Orthodox Church due to some errors within it separate from Christ; for only separation from Orthodox faith separates from Christ, which opposes internal communion with Christ and the Church. But external separation alone is not internal separation; indeed, he who is thus separated retains internal communion with the Church in Orthodox faith, and therefore with Christ. We deem weak and feeble the argument of the Remonstrants [Arminians], who refuse to separate from Arians, Socinians, Anti-Trinitarians, Anabaptists, for they do not dare to consign all such to hell or ban them from heaven; as though it were not the Word of God, but our judgment concerning the salvation and damnation of men, that is the rule of our communion with the Church! If, however, we are compelled, in external communion, to communicate with errors,¹ even non-fundamental ones, in a Church not erring in fundamentals, then it is permissible to make a partial separation, not a total one; a negative, not a positive one.² The reason is that it is never lawful to communicate with the unfruitful works of darkness: Eph. 5:11. ¹ [Note this phrase is ambiguous. It may mean being present amidst secondary errors, or being compelled to personally sin.] ² [Yet denominationalism, “by forming another new visible Church,” is a positive separation.] … the Papists do not possess true faith; they err in the fundamental truths. They do not have the Holy Scripture with us as the sufficient canon of faith and morals… They nullify the mediatorial office of Christ by adding other mediators and saviors to Him. They deny the satisfaction of Christ, provided by His bloody death and the obedience rendered on our behalf, as they attempt to satisfy God for sins by themselves and others… Thus, there can be no union in faith with them, for they subvert that faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI (1639-1642; 1668; Monergism, 2024), ch. 1, ‘Of the Holy Scripture’, pp. 83-85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-831c2c1777" data-kw="">

<blockquote><p>The judicious and great divine Calvin does upon this account exceedingly aggrege the divisions amongst some English in Frankfort [over the Anglican ceremonies], who… did even there contend for matters of little moment. This (says he, Epistle 200) was exceeding intempestive, or untimeous, and exceeding offensive to the Church of Christ, and unbecoming their case: And although he utterly disapproved these ceremonies, as unbecoming the Church of Christ, yet does he (Epistle 206) press moderation on both sides, using these words… ‘As I did exhort these who were not of one mind with you to stretch themselves with all possible moderation, so it did displease me that there was upon the other hand by you nothing ceded or remitted.’</p></blockquote>

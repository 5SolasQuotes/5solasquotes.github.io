<main class="wrap"><figure class="quote" id="q-f32416af31" data-kw="">
<blockquote><p>Excess in apparel, as it argueth the levity and wantonness of the mind, by daily changing of fashions, apishly imitating the French, Spanish, &amp; Italian cut: so doth it transform us into their lewd manners: wherein not youths only, but old Dotards also (whom it as well beseemeth, as a Fiddle doth an Ass) do offend. Every man in his Velvet, Silks, Gold, Silver, Pearls, whereas in the mean time, the poor and needy in great numbers starve for cold &amp; nakedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-lavater.html">Ludwig Lavater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Christian sermons, made by Lodovike Lavatere, minister of Zurich in Helvetia, of famine and dearth of victuals</cite>, trans. William Barlow (London: Thomas Creed, 1596), p. 76.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e627d178b5" data-kw="">
<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-5759bc8177" data-kw="">
<blockquote><p>1. Q. Is the Sabbath moral, or ceremonial?

A. Moral.

That is accounted moral, which (as a rule of life) bindeth all persons, in all places, at all times.

2. Q. How appears it to be moral?

A. I. It was sanctified in Adam’s innocency. Gen. 2.2, 3. Adam in his innocent estate was a public person, and bore in his loins all man-kind: and that without distinction of Jew and Gentile. That therefore which was given him in charge appertained to all that in any age should come from him.

2. It is one of the ten precepts of the moral law. Ex. 20.8. It is not an appendix to another precept: but an intire [sic] precept in it self. If it be abrogated, or made ceremonial, there are but nine precepts of the moral law: contrary to these express Scriptures, Exod, 34. 28. Deut. 4. 13. &amp; 10.4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-b26669486a" data-kw="Mary">
<blockquote><p>As at other times, he put a comparative neglect upon his mother, which seemed purposely designed to obviate the extravagant respect which men in aftertimes would be apt to pay her. Our respect ought to be guided and governed by Christ&#x27;s; now the virgin Mary, or Christ&#x27;s mother, is not equalled with, but postponed to, ordinary believers, on whom Christ here puts a superlative honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, Mark 3:31-35</span></figcaption>

</figure><figure class="quote" id="q-b594fdc98b" data-kw="">
<blockquote><p>Before there was a written word, the Triune God spake unto men through revelations, visions, dreams and audible voices; but now that the complete word is written, these have ceased; God and Christ now speak only through the given Word, which being impressed by the Holy Spirit upon the heart, is powerful unto the salvation of the elect.

We must not become carried away with the enthusiasts and despise the Word, as alas! many do; but the Word, the written Word must be precious unto us; thereby we must walk, thereby alone proving all things, taking heed thereto as unto a light that shineth in a dark place; all experiences which are not through, agreeable to, and in unison with the Word, are but suggestions of the devil, pure imaginations and idle fancies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), pp 118-19.</span></figcaption>

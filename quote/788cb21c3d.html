</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de9c7888de" data-kw="">
<blockquote><p>By the Understanding, Will, and Affection, the Soul doth (as it were) enter into God, and God into the Soul; whence followeth (as it were) a mutual in-being of one in another, and an intimate vital union between God and the Soul. Either the vision, fruition, and love of God, is Blessednesse, or there is no Blessednesse; God is not God, Heaven is not Heaven; the Creature, according to the best, namely, the Gospel-dispensation of God, is capable of no more, needs no more, can have no more; God in Christ doth no more for Man, man needs no more from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, London, 1654, ch. 15, p. 335</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a> › <a href="../topics/union-with-christ/nature-of-union/mystical-union.html">Mystical union</a></span></div>

</figure><figure class="quote" id="q-58c1fdd9d1" data-kw="">
<blockquote><p>Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems</cite>, … (Utrecht, 1643) n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-a469aee8d1" data-kw="Faith">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a> › <a href="../topics/union-with-christ/nature-of-union/mystical-union.html">Mystical union</a></span></div>

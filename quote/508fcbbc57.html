<blockquote><p>2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10.

3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 515</span></figcaption>

</figure><figure class="quote" id="q-27a39a0ec1" data-kw="">
<blockquote><p>Protestants also believe that lust or concupiscence in the regenerate, as including a remaining tendency towards what is sinful, and the first or earliest motions of this tendency in the heart, though not deliberately consented to and followed out, is itself truly and properly sinful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, ch. 19 (The Doctrine of the Fall)</span></figcaption>

— William Cunningham, Historical Theology, ch. 19 (The Doctrine of the Fall)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProtestants+also+believe+that+lust+or+concupiscence+in+the+regenerate%2C+as+including+a+remaining+tendency+towards+what+is+sinful%2C+and+the+first+or+earliest+motions+of+this+tendency+in+the+heart%2C+though+not+deliberately+consented+to+and+followed+out%2C+is+itself+truly+and+properly+sinful.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Historical+Theology%2C+ch.+19+%28The+Doctrine+of+the+Fall%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27a39a0ec1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27a39a0ec1.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28historical+theology%29+AND+creator%3A%28cunningham%2C+william%29" rel="noopener" target="_blank">Read it online · Internet Archive (2 vols.)</a></div>
</figure><figure class="quote" id="q-3fd84ecb2b" data-kw="">
<blockquote><p>Forsomuch then as it appears by most substantial reasons that the corrupt lusts which remain in us after baptism are sins; now it rests that we see unto what kind or part of sins they belong. Sin may seem thus to be divided: that there is one thing, which may be forgiven, and another thing, which cannot. Transgression against the law of God, which is never forgiven, is sin against the Holy Ghost. But if sin may be forgiven, that may be two manner of ways: for either it is so forgiven as we must of necessity altogether depart from it; which we see come to pass in sore and grievous sins, which Paul says do separate us from the kingdom of God, and commonly be called mortal: and those be called small or venial sins, without the which man’s life cannot here be led. [Note in margin: 1 Cor. 6:9, or else be so forgiven, as we depart not from them; partly, through ignorance engrafted in us, and partly, by reason of the infirmity, wherewith we be infected.] [Note in margin: Lust and the first motions motions unto evil, be in their own nature mortal] Paul has put a notable difference between these sins, when he exhorts us that we should not suffer sin to reign in us. (Rom. 6:1) And of this third kind of sins the apostle complained, when he said, ‘O unhappy man that I am! Who shall deliver me from the body of this death? (Rom. 7:24)’ And of these sins do we mean, when we teach, that the works of men, notwithstanding they be godly men, be not without deadly sins; for that we do nothing without this kind of defects. And such kind of defects be deadly, because in their own nature they deserve death: for the reward of sin is death. Further also, for that so long as we carry about with us these blemishes of corruption, we cannot enjoy the life eternal: for so long are we excluded from it, until by death we have put off all corruption. Moreover, it is written; ‘Cursed be every one, which abides not in all the things which are written in the words of this law.’ And he which complains with Paul, that he does not the good which he would, does not perform all the things, which the law requires, nor is not utterly without curse: though the same, through the mercy of God, be not imputed unto him unto eternal destruction. [Note in margin: By the mercy of God they be not imputed to damnation]</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Forsomuch then as it appears by most substantial reasons that the corrupt lusts which remain in us after baptism are sins; now it rests that we see unto what kind or part of sins they belong. Sin may seem thus to be divided: that there is one thing, which may be forgiven, and another thing, which cannot. Transgression against the law of God, which is never forgiven, is sin against the Holy Ghost. But if sin may be forgiven, that may be two manner of ways: for either it is so forgiven as we must of necessity altogether depart from it; which we see come to pass in sore and grievous sins, which Paul says do separate us from the kingdom of God, and commonly be called mortal: and those be called small or venial sins, without the which man’s life cannot here be led. [Note in margin: 1 Cor. 6:9, or else be so forgiven, as we depart not from them; partly, through ignorance engrafted in us, and partly, by reason of the infirmity, wherewith we be infected.] [Note in margin: Lust and the first motions motions unto evil, be in their own nature mortal] Paul has put a notable difference between these sins, when he exhorts us that we should not suffer sin to reign in us. (Rom. 6:1) And of this third kind of sins the apostle complained, when he said, ‘O unhappy man that I am! Who shall deliver me from the body of this death? (Rom. 7:24)’ And of these sins do we mean, when we teach, that the works of men, notwithstanding they be godly men, be not without deadly sins; for that we do nothing without this kind of defects. And such kind of defects be deadly, because in their own nature they deserve death: for the reward of sin is death. Further also, for that so long as we carry about with us these blemishes of corruption, we cannot enjoy the life eternal: for so long are we excluded from it, until by death we have put off all corruption. Moreover, it is written; ‘Cursed be every one, which abides not in all the things which are written in the words of this law.’ And he which complains with Paul, that he does not the good which he would, does not perform all the things, which the law requires, nor is not utterly without curse: though the same, through the mercy of God, be not imputed unto him unto eternal destruction. [Note in margin: By the mercy of God they be not imputed to damnation]”

— Peter Martyr Vermigli, Common Places, II.2.26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CForsomuch+then+as+it+appears+by+most+substantial+reasons+that+the+corrupt+lusts+which+remain+in+us+after+baptism+are+sins%3B+now+it+rests+that+we+see+unto+what+kind+or+part+of+sins+they+belong.+Sin+may+seem+thus+to+be+divided%3A+that+there+is+one+thing%2C+which+may+be+forgiven%2C+and+another+thing%2C+which+cannot.+Transgression+against+the+law+of+God%2C+which+is+never+forgiven%2C+is+sin+against+the+Holy+Ghost.+But+if+sin+may+be+forgiven%2C+that+may+be+two+manner+of+ways%3A+for+either+it+is+so+forgiven+as+we+must+of+necessity+altogether+depart+from+it%3B+which+we+see+come+to+pass+in+sore+and+grievous+sins%2C+which+Paul+says+do+separate+us+from+the+kingdom+of+God%2C+and+commonly+be+called+mortal%3A+and+those+be+called+small+or+venial+sins%2C+without+the+which+man%E2%80%99s+life+cannot+here+be+led.+%5BNote+in+margin%3A+1+Cor.+6%3A9%2C+or+else+be+so+forgiven%2C+as+we+depart+not+from+them%3B+partly%2C+through+ignorance+engrafted+in+us%2C+and+partly%2C+by+reason+of+the+infirmity%2C+wherewith+we+be+infected.%5D+%5BNote+in+margin%3A+Lust+and+the+first+motions+motions+unto+evil%2C+be+in+their+own+nature+mortal%5D+Paul+has+put+a+notable+difference+between+these+sins%2C+when+he+exhorts+us+that+we+should+not+suffer+sin+to+reign+in+us.+%28Rom.+6%3A1%29+And+of+this+third+kind+of+sins+the+apostle+complained%2C+when+he+said%2C+%E2%80%98O+unhappy+man+that+I+am%21+Who+shall+deliver+me+from+the+body+of+this+death%3F+%28Rom.+7%3A24%29%E2%80%99+And+of+these+sins+do+we+mean%2C+when+we+teach%2C+that+the+works+of+men%2C+notwithstanding+they+be+godly+men%2C+be+not+without+deadly+sins%3B+for+that+we+do+nothing+without+this+kind+of+defects.+And+such+kind+of+defects+be+deadly%2C+because+in+their+own+nature+they+deserve+death%3A+for+the+reward+of+sin+is+death.+Further+also%2C+for+that+so+long+as+we+carry+about+with+us+these+blemishes+of+corruption%2C+we+cannot+enjoy+the+l

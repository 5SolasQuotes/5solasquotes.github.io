<blockquote><p>…nor is it inconvenient to say that Papists as baptized and under that reduplication are members of the visible Church, though as baptized thus and thus they be not members of the true, visible Church, professing the sound faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5</cite>, p. 219</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, p. 24</span></figcaption>

</figure><figure class="quote" id="q-abd7767cf3" data-kw="">
<blockquote><p>Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized; not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such [by] that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because: 1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb. 2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644), pt. 1, pp. 204-8, 229, 235 irregular numbering</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-3173b205cc" data-kw="">
<blockquote><p>Previously, men had looked to the Church for all the trustworthy knowledge of God obtainable, and as well for all the communications of grace accessible. Calvin taught them that neither function has been committed to the Church, but God the Holy Spirit has retained both in His own hands and confers both knowledge of God and communion with God on whom He will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin and Calvinism</cite>, Appendix, &quot;Calvin as a Theologian,&quot; p. 492</span></figcaption>

</figure><figure class="quote" id="q-589dc34cd3" data-kw="">
<blockquote><p>XXI. Let us now lastly consider the threatenings, whether there be any such in this covenant. It cannot indeed be denied, but that, in the doctrine of Christ and the apostles, we frequently meet with very many comminations, which have their peculiar respect to the covenant of grace, and which could not have thus been set before us if there had been no such covenant. For instance,—whoever shall not believe in Christ—whoever shall despise the counsel of God against his own soul—whoever shall not obey the Gospel, shall be condemned. And these threatenings seem to be distinguished from those which are evidently legal; such as the following: “Cursed is he that continueth not in all things,” &amp;c. Yet, if we would weigh the matter narrowly, the covenant of grace has no threatenings so peculiar to itself, but what may well be referred to the law, from which every curse proceeds. XXII. Which I would explain thus: we no where hear of any threatenings which may and ought not to be deduced from that threatening, which doubtless is purely legal, “Cursed is every one that continueth not in all things,” &amp;c. In this most general threatening are included the other more particular ones. Moreover, when salvation by Christ alone is proposed, in the covenant of grace, as the principal truth, the law, which enjoins man to embrace with a firm faith every truth made known to him by God, obliges him to receive this truth in particular, and be delighted with the glory of God shining forth in it, and that his own salvation is connected with the glory of God. Should we deny that the law lays us under this obligation, we should then affirm that the law does not enjoin us to acknowledge God as true, and that there is a holy love of God and of ourselves which the law does not command; all which are most absurd. I go further: When man, as the law prescribes, receives the truth of the Gospel with a lively faith, then not the law, but the Gospel, promises salvation to him. For the law knows of no other promise, than what depends on the condition of perfect obedience. But should man slight and obstinately reject that truth proposed to him, he sins against the law, and so incurs its curse, according to the general rule so often inculcated. And since we have supposed the Gospel declaring that salvation flows from the faith of Christ alone, the law enjoins that all who desire salvation should seek it by the faith of Christ alone; and consequently it cannot but thunder the curse against those who, rejecting the Gospel, believe not on Christ. As, therefore, unbelief, or the rejecting the Gospel, is a sin against the law, which is the only perfect rule of all virtue (it can be called a sin against the Gospel, only objectively), so every threatening of the curse and of wrath against unbelievers and the despisers of the Gospel, must come from and be reduced to the law; but then it is to the law as now subservient to the covenant of grace. XXIII. In the discourses of the Prophets, Christ, and his apostles, there is a certain mixture of various doctrines, which, indeed, are closely connected, and mutually subservient; each of which ought to be reduced to their proper heads, so that the promises of grace be referred to the Gospel, all injunctions of duty and all threatenings against transgressors to the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God &amp; Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, 2 vols. (London: Tegg &amp; Son, 1837), vol. 1, pp. 252–58; italics original. See also Herman Witsius, The Economy of the Covenants Between God &amp; Man, 2 vols. (1822; RHB, 2017), vol. 1</cite>, pp. 284–91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

od+shining+forth+in+it%2C+and+that+his+own+salvation+is+connected+with+the+glory+of+God.+Should+we+deny+that+the+law+lays+us+under+this+obligation%2C+we+should+then+affirm+that+the+law+does+not+enjoin+us+to+acknowledge+God+as+true%2C+and+that+there+is+a+holy+love+of+God+and+of+ourselves+which+the+law+does+not+command%3B+all+which+are+most+absurd.+I+go+further%3A+When+man%2C+as+the+law+prescribes%2C+receives+the+truth+of+the+Gospel+with+a+lively+faith%2C+then+not+the+law%2C+but+the+Gospel%2C+promises+salvation+to+him.+For+the+law+knows+of+no+other+promise%2C+than+what+depends+on+the+condition+of+perfect+obedience.+But+should+man+slight+and+obstinately+reject+that+truth+proposed+to+him%2C+he+sins+against+the+law%2C+and+so+incurs+its+curse%2C+according+to+the+general+rule+so+often+inculcated.+And+since+we+have+supposed+the+Gospel+declaring+that+salvation+flows+from+the+faith+of+Christ+alone%2C+the+law+enjoins+that+all+who+desire+salvation+should+seek+it+by+the+faith+of+Christ+alone%3B+and+consequently+it+cannot+but+thunder+the+curse+against+those+who%2C+rejecting+the+Gospel%2C+believe+not+on+Christ.+As%2C+therefore%2C+unbelief%2C+or+the+rejecting+the+Gospel%2C+is+a+sin+against+the+law%2C+which+is+the+only+perfect+rule+of+all+virtue+%28it+can+be+called+a+sin+against+the+Gospel%2C+only+objectively%29%2C+so+every+threatening+of+the+curse+and+of+wrath+against+unbelievers+and+the+despisers+of+the+Gospel%2C+must+come+from+and+be+reduced+to+the+law%3B+but+then+it+is+to+the+law+as+now+subservient+to+the+covenant+of+grace.+XXIII.+In+the+discourses+of+the+Prophets%2C+Christ%2C+and+his+apostles%2C+there+is+a+certain+mixture+of+various+doctrines%2C+which%2C+indeed%2C+are+closely+connected%2C+and+mutually+subservient%3B+each+of+which+ought+to+be+reduced+to+their+proper+heads%2C+so+that+the+promises+of+grace+be+referred+to+the+Gospel%2C+all+injunctions+of+duty+and+all+threatenings+against+transgressors+to+the+law.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+%26+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+2+vols.+%28London%3A+Tegg+%26+Son%2C+1837%29%2C+vol.+1%2C+pp.+252%E2%80%9358%3B+italics+original.+See+also+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+%26+Man%2C+2+vols.+%281822%3B+RHB%2C+2017%29%2C+vol.+1%2C+pp.+284%E2%80%9391&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F589dc34cd3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/589dc34cd3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-covenant-of-grace-is-with-the-visible-church/#:~:text=XXI.%20Let%20us%20now%20lastly%20consider,threatenings%20against%20transgressors%20to%20the%20law." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

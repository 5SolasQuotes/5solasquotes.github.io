<main class="wrap"><figure class="quote" id="q-2529fcd89b" data-kw="">
<blockquote><p>I will not stand in argument, whether faith be a part of repentance, or does by any other means depend upon it. It seems to me a notable point of folly to go about to tie matters of divinity to precepts of logic: for we learn not that of the Lord’s apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, ed. Thomas Harding (1549; Cambridge: Parker Society, 1850), vol. 3, 4th Decade, 2nd Sermon, ‘Of Repentance &amp; the Causes thereof…’, p. 62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“I will not stand in argument, whether faith be a part of repentance, or does by any other means depend upon it. It seems to me a notable point of folly to go about to tie matters of divinity to precepts of logic: for we learn not that of the Lord’s apostles.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59214cadd3" data-kw="">
<blockquote><p>1. Justification is an action, by which God makes an ungodly man righteous, according to the good pleasure of his will, and without any merit of his own for salvation… 9. Therefore, although it is said figuratively, yet fittingly and truly, we say that we are justified by faith alone, comparing it with works and merits, and not by the works of the law, but by faith freely in our Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction: On Justification by Faith in Theological Theses for Exercises in Public Disputations in the Famous Academy at Leiden</cite>, (1584) at ReformedOrthodoxy.org The relevance here is Junius defining the issue as one of merit and saying that Justification by faith is a figurative expression.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-a279f3b688" data-kw="">
<blockquote><p>The commandment to embrace the Mediator by faith also conjoins repentance: according to that saying of John the Baptist, Mk. 1:15, Repent ye, and believe the Gospel. Thus God Himself from heaven reveals the Mediator, and commands that He be embraced by true faith, Mt. 17:5, this is my beloved Son, in whom I am well pleased; hear ye Him. The promise is expressed, Jn. 3:16, God so loved the world, that He gave His only begotten Son, that whosoever believeth in Him should not perish, but have everlasting life. … The external call, which ordinarily is made through the ministers and preachers of the word, concerns adults, and not the elect alone, even if these primarily, but also reprobates, to whom God also reveals the Mediator, and, should they repent, commands them to expect life from Him: and that unto this end, that, with the condition of repentance and faith neglected, without which salvation through Christ come to no one, they are made ἀναπολόγητοι or inexcusable, and understand the just cause of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Gospel-Offer &amp; Covenant of Grace Wendelin (1584-1652)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

excusable%2C%20and%20understand%20the%20just%20cause%20of%20damnation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-278e492040" data-kw="">
<blockquote><p>Whether the infusion of grace is required for justification? It is distinguished. Whether some movement of free choice and faith is required? It is affirmed with a distinction. Whether a movement of free choice contra sin? It is disintinguished. Whether the remission of sins is to number the premises and prerequisites of justification? It is denied. Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished. … Whether it [justification] precedes repentance? It is distinguished. … Whether and in what way the law and penitence are able to be said to concur unto our justification? It is explained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, 9. ‘Justification’, Of Justification in General in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2, tract 3 Abbr.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

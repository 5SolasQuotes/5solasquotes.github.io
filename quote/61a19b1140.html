<blockquote><p>92. Two difficulties arise here: the first concerns the statement that the God of glory was crucified. For Christ’s godhead, according to which Christ is called the Lord of glory, cannot suffer anything.

The answer is that Christ is one person subsisting in two natures, the human and the divine. Hence he can be described by names drawn from either nature; furthermore, no matter what the name by which he is designated, it can be predicated of him, because there is but one person underlying both natures. Consequently, we can say that the man created the stars and that the Lord of glory was crucified; however, it was not as man that he created the stars, but as God; nor was it as God that he was crucified, but as man.

Hence this phrase refutes Nestorius’ error asserting that there is one nature, composed of God and man, in Christ; because if Nestorius were correct, it would not be true to say that Lord of glory was crucified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super 1 ad Corinthios</cite>, C. 2, L. 2, 92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Peter Lombard has some interesting things to say about Cornelius in Acts 10 (when discussing Augustine’s comments on the same subject): “Note carefully how he says that there cannot be salvation without faith in Christ, and yet Cornelius’ prayers were heard before he believed in Christ. This may be understood in this sense: namely, before he knew that Christ, in whom he believed under a mystery, had become incarnate.” [1] In other words, Cornelius was not an unbeliever but one trusting in the coming Messiah. Before coming into contact with the apostle Peter, however, he was one that had not yet realised that Jesus of Nazareth was the incarnate Christ owing to a lack of information.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sentences</cite>, trans. Giulio Silano (1150; 4 vols, Toronto, 2007), III, d. 25, c. 4, a. 3.</span></figcaption>

<blockquote><p>The Most Illustrious COCCEIUS, in ad ultimum Mosis, § 74, says these words, “It comes here to be wondered at, even a new pestilence sprouting at this time, of those that induce the soul to doubt, whether they themselves be, see, hear, etc. Wretched mortals, who reason against their own sense, doubting themselves to be, and daring to profess themselves to be infidels and ἀθέους/atheists, at least while they are willing to doubt; thereon they are going to apply themselves to this, that they might question all things, with respect to which they are able to delay their confidence (which the Scripture calls reasonings and murmurings), and remove from themselves the knowledge of God and His ways.” Add what things are found in his Summa Theologiæ, chapter VIII, § 25, opera, tome 7, page 160.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-e54fea7c48" data-kw="">
<blockquote><p>…the difficulty to do good, proneness to evil, contrariety between the powers and faculties of the soul, and the rebellion of the meaner against the superior and better, are not the conditions of nature, as it was or might have been in itself before the entrance of sin, but that all these proceed from the putting of the powers of the soul, by the loss of grace, out of that course, which by the law of God and nature they were to hold. For does not the condition of man’s nature require that amongst things inquired after, thought of, and known, God should be the first? and amongst things desired and loved, nothing should be desired and loved more or before Him, nor otherwise than for Him? and is it not clear and evident, that if God be the first thing that is thought of, sought after, and loved, and that nothing be sought after or respected, but after and for God, that there will be no proneness to evil, difficultire to do good, contrariety between the powers of the soul, and rebellion of the meaner and inferior against the better and superior? surely there is none that can or will make question of it. Now it is confessed by the best learned amongst the Schoolmen, that howsoever it be not so in the course of our understanding, in this state wherein we are, yet according to the course of the nature of our understanding simply considered, it should be so, that God should be the first thing sought after and known by us. … By this which has ben said [including the quotes by Scotus and Bonaventure], it is evident that according to the course of nature not disordered, nor put out of course, the first thing that is inquired after, thought of and known, is God, and that He is the first good that is desired and loved, and that no other thing is desired or loved but after Him, and for Him. So that none of the things formerly mentioned can be found in the nature of man, unless it be put out of course. Whence grows the contrariety between the meaner and better, superior and inferior faculties of the soul, but from hence, that the soul in this state of her aversion from God, takes the beginning of all her knowledge from the senses, apprehends particular things as good upon the first view, and to be desired, which afterwards upon better consideration, in respects not considered at the first, she finds are not good nor desirable? And whence is the rebellion of the inferior against the superior, but from hence, that the superior having cast off the dependance it formerly had upon God and respect unto Him, the inferior also casts off the respect it had to it? ‘What could have been more just than that he should receive retaliation in kind? God is the life of the soul, and the soul is the life of the body. By sinning the soul willingly lost its power to live; let it unwillingly lose also its power to give life. Having freely driven away life—since it did not wish to live—let it not be able to bestow life on whom, or in what measure, it may wish. The soul would not be ruled by God; let it be unable to rule the body. If it does not obey its superior, why should it command its inferior? The Creator found His creature rebellious against Himself; let the soul likewise find its own handmaid (the body) rebellious against it. Man was found a transgressor of the divine law; let him find another law in his members opposing the law of his mind and bringing him into captivity to the law of sin. And since sin sets a separation between us and God, let death likewise set a separation between our body and ourselves.’ Bernard of Clairvaux, Sermon to the Knights of the Temple, ch. 11, ‘Of the Sepulcher’ From hence likewise is that danger of erring, whereunto man is subject; for apprehending particular things first, his knowledge is imperfect and confused; and not without much labor and danger of erring does he come to the distinct knowledge of any thing. And hence also flows that ignorance that is found in men; for taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-field.html">Richard Field</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Church (Oxford: Turner, 1628), bk. 3, Answer to Berely, ch. 5, pp. 252-54 Field (1561–1616) was an English ecclesiological theologian associated with the work of Richard Hooker.</span></figcaption>

or taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.”

+out+of+course%2C+the+first+thing+that+is+inquired+after%2C+thought+of+and+known%2C+is+God%2C+and+that+He+is+the+first+good+that+is+desired+and+loved%2C+and+that+no+other+thing+is+desired+or+loved+but+after+Him%2C+and+for+Him.+So+that+none+of+the+things+formerly+mentioned+can+be+found+in+the+nature+of+man%2C+unless+it+be+put+out+of+course.+Whence+grows+the+contrariety+between+the+meaner+and+better%2C+superior+and+inferior+faculties+of+the+soul%2C+but+from+hence%2C+that+the+soul+in+this+state+of+her+aversion+from+God%2C+takes+the+beginning+of+all+her+knowledge+from+the+senses%2C+apprehends+particular+things+as+good+upon+the+first+view%2C+and+to+be+desired%2C+which+afterwards+upon+better+consideration%2C+in+respects+not+considered+at+the+first%2C+she+finds+are+not+good+nor+desirable%3F+And+whence+is+the+rebellion+of+the+inferior+against+the+superior%2C+but+from+hence%2C+that+the+superior+having+cast+off+the+dependance+it+formerly+had+upon+God+and+respect+unto+Him%2C+the+inferior+also+casts+off+the+respect+it+had+to+it%3F+%E2%80%98What+could+have+been+more+just+than+that+he+should+receive+retaliation+in+kind%3F+God+is+the+life+of+the+soul%2C+and+the+soul+is+the+life+of+the+body.+By+sinning+the+soul+willingly+lost+its+power+to+live%3B+let+it+unwillingly+lose+also+its+power+to+give+life.+Having+freely+driven+away+life%E2%80%94since+it+did+not+wish+to+live%E2%80%94let+it+not+be+able+to+bestow+life+on+whom%2C+or+in+what+measure%2C+it+may+wish.+The+soul+would+not+be+ruled+by+God%3B+let+it+be+unable+to+rule+the+body.+If+it+does+not+obey+its+superior%2C+why+should+it+command+its+inferior%3F+The+Creator+found+His+creature+rebellious+against+Himself%3B+let+the+soul+likewise+find+its+own+handmaid+%28the+body%29+rebellious+against+it.+Man+was+found+a+transgressor+of+the+divine+law%3B+let+him+find+another+law+in+his+members+opposing+the+law+of+his+mind+and+bringing+him+into+captivity+to+the+law+of+sin.+And+since+sin+sets+a+separation+between+us+and+God%2C+let+death+likewise+set+a+separation+between+our+body+and+ourselves.%E2%80%99+Bernard+of+Clairvaux%2C+Sermon+to+the+Knights+of+the+Temple%2C+ch.+11%2C+%E2%80%98Of+the+Sepulcher%E2%80%99+From+hence+likewise+is+that+danger+of+erring%2C+whereunto+man+is+subject%3B+for+apprehending+particular+things+first%2C+his+knowledge+is+imperfect+and+confused%3B+and+not+without+much+labor+and+danger+of+erring+does+he+come+to+the+distinct+knowledge+of+any+thing.+And+hence+also+flows+that+ignorance+that+is+found+in+men%3B+for+taking+the+beginning+of+all+the+knowledge+they+have+from+the+senses%2C+they+know+no+more+touching+anything+than+may+be+discerned+by+the+accidents+and+outward+effects+of+it%2C+and+so+never+come+to+know+anything+in+the+essence+of+it%2C+or+immediately+as+it+is+in+itself.+So+that+according+to+that+which+before+I+noted%2C+out+of+the+book+called+Destructorium+vitiorum%2C+as+a+man+may+know+in+the+dark%2C+the+length%2C+breadth+and+other+dimensions+of+a+thing%2C+but+not+whether+it+be+fair+or+foul%2C+white+or+black.+So+men+in+this+obscurity+of+discerning%2C+may+find+out+that+there+is+a+God%2C+and+that+He+is+the+beginning+and+cause+of+all+things%3A+but+they+cannot+know+how+fair%2C+how+good%2C+how+merciful%2C+and+how+glorious+He+is%2C+that+so+they+may+love+Him%2C+fear+Him%2C+honour+Him%2C+and+trust+in+Him+as+God%2C+unless+they+have+an+illumination+of+grace.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+Answer+to+Berely%2C+ch.+5%2C+pp.+252-54+Field+%281561%E2%80%931616%29+was+an+English+ecclesiological+theologian+associated+with+the+work+of+Richard+Hooker.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe54fea7c48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e54fea7c48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-epistemology/#:~:text=the%20difficulty%20to%20do%20good%2C%20proneness,they%20have%20an%20illumination%20of%20grace&amp;text=the%20difficulty%20to%20do%20good%2C%20proneness%20to%20evil&amp;text=God%2C%20unless%20they%20have%20an%20illumination%20of%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Schoolmen say that a law, properly so called, is both illuminative and impulsive: illuminative, to inform and direct the judgement; impulsive, to move and apply the will to action. (Suarez, Of Laws, bk. 1, ch. 5; Cospensis curs. Theol tract. 13, disp. 1, sect. 1) And accordingly there are two names in this text [Eze. 43:11] given to Christ’s laws and institutions: one which imports the instruction and information of our minds: another which signifies a deep imprinting or engraving (and that is made upon our hearts and affections), such as a pen of iron and other instruments could make upon a stone.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0564ac0f2e" data-kw="">
<blockquote><p>The Reformers in general enjoyed ordinarily the assured belief that they were in a state of grace, and would be finally saved. They felt the importance of this grace in the arduous work in which they were engaged. They saw abundant ground in Scripture for the general position, that believers might be and should be assured of their own salvation.

They inculcated this position upon their followers, persuaded that personal assurance would at once tend to preserve them from the perverting influence of Popish sophists, and fit them for doing and bearing all God’s will concerning them. The Romanists, on the other hand, laboured to show that believers could have no full and well-grounded assurance that they had attained to a condition of safety, except either by special revelation, or by the testimony of the church; their object of course being to make men feel themselves entirely dependent upon the church for security or certainty on all subjects of interest and importance, and to deprive them of the energy and confidence which a well-founded assurance of personal salvation was fitted to produce, in contending against the prestige of ecclesiastical authority and influence.

The Reformers, in order to show that the assurance which might be attained without either a special revelation or the testimony of the church, was full and perfect, were led to identify it with our belief in the doctrines of God’s Word, and to represent it as necessarily included or implied in the act or exercise of justifying and saving faith; nay, even sometimes to give it as the very definition of saving faith, that it is a belief that our own sins have been forgiven, and that we have been brought into a state of grace. This seemed to be an obvious and ready method of giving to the belief of our personal safety for eternity the very highest degree of certainty, and hence many of the Reformers were tempted to adopt it.

This view was certainly exaggerated and erroneous. It is very evident that no man can be legitimately assured of his own salvation simply by understanding and believing what is contained or implied in the actual statements of Scripture. Some additional element of a different kind must be brought in, in order to warrant such an assurance; something in the state or condition of the man himself must be in some way ascertained and known in order to this result. It may not, indeed, always require any lengthened or elaborate process of self-examination to ascertain what is needful to be known about men themselves, in order to their being assured that they have been brought into a state of grace.

The circumstances that preceded and accompanied their conversion may have been such as to leave them in no doubt about their having passed from darkness to light. Their present consciousness may testify at once and explicitly to the existence in them of those things which the Bible informs us accompany salvation. But still it is true, that another element than any thing contained in Scripture must be brought in as a part of the foundation of their assurance.

And when they are called upon to state and vindicate to themselves or to others the grounds of their assurance, they must of necessity proceed, in substance, in the line of the familiar syllogism, “Whosoever believeth in the Lord Jesus Christ shall be saved; I believe, and therefore,” &amp;c. There is no possibility of avoiding, in substance, some such process as this; and while the major proposition is proved by Scripture, the minor can be established only by some use of materials derived from consciousness and self-examination.

There are no positions connected with religion which can be so certain as those which are directly and immediately taught in Scripture, and which are usually said to be believed with the certainty of faith, or of divine faith. The introduction of an element, as necessary to the conclusion, derived from a different source, viz., from the knowledge of what we ourselves are, must be admitted in fairness to complicate the evidence, and to affect the kind, if not the degree, of the certainty or assurance that may result from it.

It is unwarrantable to give as the definition of saving faith, the belief that my sins are forgiven; for it is not true that my sins are forgiven until I believe, and it holds true universally, that God requires us to believe nothing which is not true before we believe it, and which may not be propounded to us to be believed, accompanied at the same time with satisfactory evidence of its truth: and if so, the belief that our sins are forgiven, and that we have been brought into a state of grace, must be posterior in the order of nature, if not of time, to the act of faith by which the change is effected, and cannot therefore form a necessary constituent element of the act itself, cannot be its essence or belong to its essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sir William Hamilton on the Doctrine of Assurance in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>It would spirit our faith, when we shall see his blood confirming an everlasting covenant, wherein God promises to be gracious. All the promises centred in the cross, received their life from his death, and are from thence reflected on us. Where can faith find a vigour but in the royalties of mercy, displayed in the satisfaction of justice? Where can it find a life, but in the views of its proper object?

When we behold a Christ crucified, how can we distrust God, that hath in that, as a plain tablet, writ this language, that he will spare nothing for us, since he hath not spared the best he had. What greater assurance can he give? Where is there anything in heaven or earth that can be a greater pledge of his affection?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8012655f8e" data-kw="">
<blockquote><p>To my mind the whole subject is to be decided not by the exegesis of any difficult passage in St. Paul’s letters, but by common sense, by expediency, and by a regard for the law of nature and by what the Church has found to be good in the past. Now, you may interpret those passages as you please, but is not this the fact, that the principle there laid down has been accepted as sound by the Church in all generations? Take even those Churches that have long admitted women to ordination on the same footing as men. Why is it that there is no tendency to increase the number of women as ministers? There must be some great and almost indefinable law of nature that is against the thing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clarence-e-mccartney.html">Clarence Macartney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Place of Woman in the Church’ in</cite>, ed. J.R. Fleming, Proceedings of the Eleventh General Council of the Alliance of Reformed Churches holding the Presbyterian System, held at Pittsburgh, 1921 (Edinburgh: Office of the Alliance, 1922), pp. 157-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“To my mind the whole subject is to be decided not by the exegesis of any difficult passage in St. Paul’s letters, but by common sense, by expediency, and by a regard for the law of nature and by what the Church has found to be good in the past. Now, you may interpret those passages as you please, but is not this the fact, that the principle there laid down has been accepted as sound by the Church in all generations? Take even those Churches that have long admitted women to ordination on the same footing as men. Why is it that there is no tendency to increase the number of women as ministers? There must be some great and almost indefinable law of nature that is against the thing…”

</figure><figure class="quote" id="q-95255754b2" data-kw="">
<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146</cite>, (to Evangelus), §1</span></figcaption>

</figure><figure class="quote" id="q-a57c628b10" data-kw="">
<blockquote><p>After he [Cartwright’s opponent] says that ‘those words cannot be extended unto all the precepts,’ first because, ‘the office of widows should be then necessary:’ But he does not consider that St. Paul ordains them not simply, but upon condition. If he [Paul] had instituted the eldership with condition, if he had ordained that office [of elder] rather for the maintenance of the persons themselves than for the service of the church, if he had left so small choice of those to this office, as to that, namely that none might be chosen but poor, none but destitute of all friends, none under the age of sixty years: then he [the opponent] had said somewhat. And even now the perpetuity of that commandment touching widows remains in that sort [as] it was given: that is upon condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, (1577), ‘That the Church Government by an Eldership in Every Congregation is by the Ordinance of God &amp; Perpetual’, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<blockquote><p>Only since the mid-twentieth century have Lutherans and Reformed entered into lasting agreements that have resulted in the full communion relationship of today.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-g-appold.html">Kenneth G. Appold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Lutheran-Reformed Relations: A Brief Historical</cite>, p. 53</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb27eb3ed6" data-kw="">
<blockquote><p>Till far on in the second half of the century of the Reformation there were, properly speaking, only Evangelicals or Protestants; and the names Lutherans, Zwinglians, Calvinists were by all authorities of that time entirely repudiated. (Zanchius in a letter complains of people applying to themselves such names.)… in Frankfort [Germany] those who held the views of the Swiss, by the advice of Dathen, let their children be baptized by the city clergy who held Lutheran opinions; and when Calvin in September, 1556, was called as arbitrator to Frankfort, the wine of honor was poured out to him. Moreover, the states of the empire that were inclined to the Swiss doctrine were not excluded, in the year 1555, in the compact entitled ‘the Religious Peace;’ and there was then in Germany only one Protestant Church which in that Peace received on the basis of the Augsburg Confession toleration, or rather equal authorization… The doctrine of predestination was nto then matter of dispute. (…Calvin writes in 1560 to Zerkint of Bern, that up to this year no one had taken exception to the doctrine of predestination (v. Op. Omnia, Strassburg edition, Vol. xvii, 238)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 416</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

ine.com/on-lutheranism/#:~:text=Till%20far%20on%20in%20the%20second,Omnia%2C%20Strassburg%20edition%2C%20Vol.%20xvii%2C%20238&amp;text=Till%20far%20on%20in%20the%20second%20half%20of&amp;text=v.%20Op.%20Omnia%2C%20Strassburg%20edition%2C%20Vol.%20xvii%2C%20238" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e6ee3afac0" data-kw="">
<blockquote><p>[Eckhardi says:] This we accept of infants, who are so in the covenant due to the faith of the parents, that they are justified by the faith of the parents. …I respond 1. not all infants of pious parents are received in the Covenant of God: so it was said of Ishmael which was the son of Abraham; and of Esau which was the son of Isaac. 2. Of the impious, or such as the Turks and other heathens, and their infants passing away in infancy, they all are certainly condemned, as is evident from 1 Cor. 7:14, indeed they are such as are unclean. If, however, it is understood that the impious are in the Covenant as far as the external society, I say even that God may not only look to this, but to the grandfather and the grandfather’s grandfather, so that it may be indeed such children frequently are in the Covenant with God, and the Covenant has been taken hold of for them by previous parents. …but where they are already adolescents, they having their own faith, then this faith [of others] is the more not necessary for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Maccovius Revived, or Manuscripts of his</cite>, … ed. Nicolaas Arnoldi (Amsterdam, 1659) | ‘Anti-Eckhardus’ [Heinrich Eckhardi 1580-1624] | 17. On Justification 671 | III. ‘Whether anyone is able to be justified by the faith of another, being destitute of their own?’ 672</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

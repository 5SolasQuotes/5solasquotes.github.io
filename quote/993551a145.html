</figure><figure class="quote" id="q-cd461b1d8a" data-kw="">
<blockquote><p>You may remember that I said (a word perhaps that some think much of) that the question betwixt us and Rome is not whether we be justified by faith or no? But whether we be justified at all; I will make it good. There are two graces, righteousness imputed, which implies forgiveness of sins; and righteousness inherent, which is that grace of sanctification begun. They utterly deny that there is any righteousness but righteousness inherent. They say forgiveness of sins is nothing but sanctification. A new doctrine never heard of in the Church of God, till these last days, till the spawn of the Jesuits devised it. Forgiveness of sin is this, that God will never charge me with it again. They say that forgiveness of sin is an abolishing of sin in the subject, where is true remission; as much as to say, There is no justification distinct from sanctification: whereas the apostle distinguishes them, when as he says, ‘The Son of God is made unto us wisdom, righteousness, sanctification and redemption’: ‘He is made unto us’ (of God). By the way let me expound it unto you. Christ has three offices; A Prophetical, Regal and Sacerdotical office… The work of Christ’s priestly office is to be a propitiation for our sins; sanctification proceeds from the scepter of his kingdom: The one is without me, the other within me. The one receives degrees, the other not. As a man that is holy may be more holy; but imputed righteousness does not more forgive one man than another. Imputation is without augmentation or diminution. Those things which have diverse contraries, cannot be one and the same thing. Justification and sanctification have diverse contraries. The contrary to justification is condemnation; but the contrary to sanctification is wickedness, and false-dealing, etc. Aristotle distinguishes homonymous words and bids you consider their contraries; thus you see the difference between these two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 16th Sermon, on Rom. 5:1, pp. 421-23</span></figcaption>

</figure><figure class="quote" id="q-4c0ff5d669" data-kw="">
<blockquote><p>Hence the Scripture always attributes our justification to the free grace of God, diligently excluding any works we can do; and certainly if in the continuance of our justification, that be always retained by mere grace, so that no works of ours, though regenerated, and endowed with an heavenly principle within, are causal of it…</p></blockquote>

<blockquote><p>Justification is one, and immovable: That it is, and in what way XVIII. The justification taught so far is certainly one, and only one, first (1) by reason of the immutable divine decree (Gal. 3:8; Rom. 8:30), so that, just as all things are (Acts 15:18) so also the number of those to be justified, the abstract number as well as the concrete number, is known to him from eternity (2 Tim. 2:19), although from this eternal decree it ought not to be said that he justified actually from eternity (Gal. 3:8). (2) By reason of Christ, on whom, as the common principle and head of those to be justified, God placed each and every sin of each and every elect person, once and for all (2 Cor. 5:19). Finally, (3) also by reason of himself, insofar as after faith, once it is begun, it will continue without any interruption for eternity, nor will the sins of those once truly justified ever be actually revived again, although by succeeding sins they deserve to be revived (Ezek. 18:24). Yet this is so by such a unity that consists in flux, insofar as to individual sins, as soon as they have been perpetrated, after particular faith and repentance, the satisfaction and merits of Christ must be applied individually. And for this reason, as we have already taught, it has its own stages: (a) its beginning, which happens immediately after the first act of faith (John 3:16; 1:12); (b) its continuation, which is accomplished through continued acts of believing and repenting, according to the repetition and renewal of sins (2 Sam. 12:13); (c) its consummation, which will be accomplished before the tribunal as if by the living voice of the Judge (Matt. 25:34). And so also each person once justified can be, from faith and repentance, by virtue of the unmoved promise of God, infallibly certain of his own justification (John 3:16; Acts 10:43), because God cannot lie (Titus 1:2; Heb. 6:17–18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 124</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Justification is one, and immovable: That it is, and in what way XVIII. The justification taught so far is certainly one, and only one, first (1) by reason of the immutable divine decree (Gal. 3:8; Rom. 8:30), so that, just as all things are (Acts 15:18) so also the number of those to be justified, the abstract number as well as the concrete number, is known to him from eternity (2 Tim. 2:19), although from this eternal decree it ought not to be said that he justified actually from eternity (Gal. 3:8). (2) By reason of Christ, on whom, as the common principle and head of those to be justified, God placed each and every sin of each and every elect person, once and for all (2 Cor. 5:19). Finally, (3) also by reason of himself, insofar as after faith, once it is begun, it will continue without any interruption for eternity, nor will the sins of those once truly justified ever be actually revived again, although by succeeding sins they deserve to be revived (Ezek. 18:24). Yet this is so by such a unity that consists in flux, insofar as to individual sins, as soon as they have been perpetrated, after particular faith and repentance, the satisfaction and merits of Christ must be applied individually. And for this reason, as we have already taught, it has its own stages: (a) its beginning, which happens immediately after the first act of faith (John 3:16; 1:12); (b) its continuation, which is accomplished through continued acts of believing and repenting, according to the repetition and renewal of sins (2 Sam. 12:13); (c) its consummation, which will be accomplished before the tribunal as if by the living voice of the Judge (Matt. 25:34). And so also each person once justified can be, from faith and repentance, by virtue of the unmoved promise of God, infallibly certain of his own justification (John 3:16; Acts 10:43), because God cannot lie (Titus 1:2; Heb. 6:17–18).”

— Petrus van Mastricht, Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 124">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+is+one%2C+and+immovable%3A+That+it+is%2C+and+in+what+way+XVIII.+The+justification+taught+so+far+is+certainly+one%2C+and+only+one%2C+first+%281%29+by+reason+of+the+immutable+divine+decree+%28Gal.+3%3A8%3B+Rom.+8%3A30%29%2C+so+that%2C+just+as+all+things+are+%28Acts+15%3A18%29+so+also+the+number+of+those+to+be+justified%2C+the+abstract+number+as+well+as+the+concrete+number%2C+is+known+to+him+from+eternity+%282+Tim.+2%3A19%29%2C+although+from+this+eternal+decree+it+ought+not+to+be+said+that+he+justified+actually+from+eternity+%28Gal.+3%3A8%29.+%282%29+By+reason+of+Christ%2C+on+whom%2C+as+the+common+principle+and+head+of+those+to+be+justified%2C+God+placed+each+and+every+sin+of+each+and+every+elect+person%2C+once+and+for+all+%282+Cor.+5%3A19%29.+Finally%2C+%283%29+also+by+reason+of+himself%2C+insofar+as+after+faith%2C+once+it+is+begun%2C+it+will+continue+without+any+interruption+for+eternity%2C+nor+will+the+sins+of+those+once+truly+justified+ever+be+actually+revived+again%2C+although+by+succeeding+sins+they+deserve+to+be+revived+%28Ezek.+18%3A24%29.+Yet+this+is+so+by+such+a+unity+that+consists+in+flux%2C+insofar+as+to+individual+sins%2C+as+soon+as+they+have+been+perpetrated%2C+after+particular+faith+and+repentance%2C+the+satisfaction+and+merits+of+Christ+must+be+applied+individually.+And+for+this+reason%2C+as+we+have+already+taught%2C+it+has+its+own+stages%3A+%28a%29+its+beginning%2C+which+happens+immediately+after+the+first+act+of+faith+%28John+3%3A16%3B+1%3A12%29%3B+%28b%29+its+continuation%2C+which+is+accomplished+through+continued+acts+of+believing+and+repenting%2C+according+to+the+repetition+and+renewal+of+sins+%282+Sam.+12%3A13%29%3B+%28c%29+its+consummation%2C+which+will+be+accomplished+before+the+tribunal+as+if+by+the+l

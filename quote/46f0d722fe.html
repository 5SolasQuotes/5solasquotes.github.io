<main class="wrap"><figure class="quote" id="q-46f0d722fe" data-kw="">
<blockquote><p>Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 4th Decade, Case 1, ‘Whether the Marriage of a Son or Daughter without or against the Parents’ Consent may be Accounted Lawful?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 293-95</span></figcaption>

<blockquote><p>§18. Of a child’s carriage in case a parent provide an unfit mate or none at all. … 2nd Question, “What if the parent be negligent, and in due time provide no fit match? May not the child provide one for himself? Answer: A parent’s negligence is not a sufficient pretext to make a child [wholly] cast off that subiection which he owes to his parent. Yet I deny not but that a child knowing where a fit match is to be had, may make known as much to his parent (as Sampson did) and crave both his consent and help thereunto, Judg. 14:2. And if his parent give no ear to his humble suit, he may use the mediation of his kindred or other friends. Yea if necessity require that the child be married, and his parent add wilfulness to negligence, and will not be moved at all, neither by the humble suit of his child, nor by the earnest solicitation of any friends, means may be made to the Magistrate (who is in God’s place over the parent as well as over the child, and ought to afford relief unto the child) and what the Magistrate does in that case is as good a warrant to the child as if the parent had done it. The like means may be used if a parent be an idolater, heretic, or atheist, and will not yield that his child be married to any but to one of his own profession and disposition.</p></blockquote>

<blockquote><p>Secondly: neither is there any contradiction in these words, of themselves: for to know which are the canonical books may be held to be a substantial point and belonging to the faith, and yet not simply necessary to salvation: he knows little if he cannot distinguish between a simple and absolute necessity, and a necessity not absolute: as some things are absolutely necessary to salvation without the which a man cannot be saved: as Heb. 10:36… But in another sense the apostles write, Acts 15:28, “It seemed good, etc. to lay no more burden upon you than these necessary things”: yet was it not simply necessary to abstain from blood and things strangled, but convenient and profitable for that time because of offence: so to know which books are canonical, though it be not simply necessary to salvation, if a man hold the foundation: yet is it necessary, as a profitable mean for the increase of faith: and though it be not so substantial as the foundation of faith, yet is it substantial, as many necessary parts in an house are beside the foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retection, or Discovery of a False Detection Containing a True Defence of Two Books, entitled, Synopsis Papismi, and Tetrastylon Papisticum</cite>, (1603), pp. 70-71</span></figcaption>

<blockquote><p>Objection: But Paul and Timothy delivered some decrees, ordained by the apostles and elders, to be kept, Acts 16:4. Answer: 1. They must know [that] their power [was] subjected and inferior to this apostolical [power]. 2. Even the apostles themselves gave no decrees but such as were comprehended in the written Word, as in Acts 15:29, “It seemeth good to the Holy Ghost and us to lay no other burden but in these necessary things”, wherein, besides that in ordering the Church, we see they had such an immediate assistance of the Holy Ghost that they could not err: so also the things decreed were according to the written Word: as the things offered to idols and fornication were condemned in the moral law: the eating of blood forbidden to Noah, before Moses, and in the law: partly, because there was some symbol in it of the blood of Christ, by which the soul is purged, and partly to avoid the note of inhumanity and cruelty. And things strangled were before the apostles’ times prohibited for the former reason, lest blood not let out should be eaten. Which two latter, although their nature were changed and free in themselves after Christ, yet the apostle in the time of gathering the Church of the Jews and gentiles, because he would have no bones of dissension cast between them and [would] avoid the scandal for a time required them, and forbore to abrogate them, but would have them for the time retained without all opinion of worship, necessity and much less of merit: by all which bonds the Papists would fasten upon us all their human inventions so that all their allegations are too weak to remove us from this hold, so immovably grounded upon the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, 89-90. Taylor was a reformed puritan.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-66a913b15c" data-kw="">
<blockquote><p>In the field, or in the bed, clothed with gown or cloak, when we pray or preach, are mere accidents and circumstances of praying and preaching, and we grant them to be variable and indifferent; howbeit, they admit of regulation-moral, and so are not simply indifferent; for to pray in the fields and streets, to be seen of men, is vain glory. But I hope they are not indifferent in your [Forbes’] meaning, as are surplice, holy-days, etc. For you will not say the Church may make laws that no prayers be but in the fields, no preaching except the preacher be clothed with a cloak. … 3. Place or habit does not constitute praying and preaching in their specific nature; that were a wonder, for their objects do constitute their nature, and their objects are God and God’s Word;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, pp. 649-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c03c3aae9e" data-kw="">
<blockquote><p>…(as that sex is prone to follow the fashion) and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby (as the apostle speaks) dishonored their heads; that is, were unseemly accoutred, and dressed on their head: which he proves by three Arguments; partly from nature, which having given women their hair for a covering, taught them to be covered, as a sign of subjection; the manner of this covering being to be measured by the custom of the nation: Lastly, by an argument à pari, from men, for whom even themselves being judges, it would be an uncomely thing to wear a vail, that is, a woman’s habit; so by the like reason, was it as uncomely for a woman to be without a vail, that is, in the guise and dress of a man. And howsoever the devils of the gentiles, sometimes took pleasure in uncomeliness, and absurd garbs and gestures; yet the God whom they worshipped with his holy angels, who were present at their devotions, loved a comely accommodation, agreeable to nature and custom, in such as worshipped him. For this cause therefore (says he) ought a woman to have a covering on her head, because of the angels. Lastly, he concludes it, from the example and custom both of the Jewish and Christian Churches, neither of which had any such use, for their women to be unveiled in their sacred assemblies: If any man (says he) be contentious, (that is, will not be satisfied with these reasons) let him know, that we, (that is, we of the circumcision) have no such custom, nor the Church of God. For so, with St. Ambrose, Anselm, and some of the ancients, I take the meaning of the apostle to be in those words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-mede.html">Joseph Mede</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Diatribae Discourses on Diverse Texts of Scripture (London, 1642-1648), Discourses on Diverse Texts of Scripture, Sermon on 1 Cor. 11:5</cite>, pp. 182-83</span></figcaption>

</figure><figure class="quote" id="q-3f89644db8" data-kw="">
<blockquote><p>It is partly true, that ‘the men’ were peculiar in their dress, but it is not at all true, that they adopted any kind of badge, or that they wore a uniform that distinguished them as a class. In the circle in which they moved, there were attempts made, by the careless and worldly, to follow, at a distance, the mutations of fashion in their attire. The men would not, and, merely, on that account, their dress was peculiar. It was often the case, that they wore long hair, partly, because a regard to appearances did not remind them of cutting it, and, partly, that they might discountenance the attempts at clipping and combing ‘after the fashion,’ by which many around them evidenced their conformity to the world. It is true, also, that they often appeared with a handkerchief on their heads, but so did many besides them, who met to worship under a scorching sun, and regarded it as unbecoming to have a hat or a bonnet on their heads. If their dress seemed peculiar, it was only because it was old-fashioned, even in the highlands. Its singularity was not owing to any affectation, or to an undue regard to what was external and trivial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-kennedy.html">John Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Days of the Fathers in Ross-Shire 4th ed. (Toronto: James Campbell &amp; Son, 1867)</cite>, pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-3b1b27c588" data-kw="">
<blockquote><p>Hence forth will I now touch certain points what I would have in your common assemblies observed and kept, and what I would were avoided, that in them nothing be done either unorderly, or contentiously, or riotously… One thing more must I tell you, which is yet of no great importance, nor [is] much weighty, but such as may, if the time and place so require, be changed… Lesse hurt were it, if ye in such points agreed, since they be but externe matters, nor make so much to the furtherance of Gospel-like godliness.</p></blockquote>

</figure><figure class="quote" id="q-bfbcffb020" data-kw="">
<blockquote><p>We are accustomed to testify without hesitation that this reverence–even if it principally resides in the attitude of the heart of a person who, with a certain righteous dread, regards God as present with Him, a heavenly banquet as present, and the angels as present–nevertheless is also present in the external elements [signis]. I mean things like kneeling during common prayers, an uncovered head, and properly greeting those from whose hand we receive the mysteries–in a word, in our whole deportment and demeanor. And anyone who behaved differently would not leave without a severe rebuke.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper (RHB, 2016)</cite>, p. 113</span></figcaption>

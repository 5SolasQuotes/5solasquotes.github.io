<main class="wrap"><figure class="quote" id="q-c6bf230a07" data-kw="">
<blockquote><p>VII. When the Scripture then says that Christ died for all, that He gave Himself a ransom for all, that He died for all, that He is a propitiation for the sins of the whole world: this is necessarily understood, either of the greatness of the price, or of the sufficiency of his merit for all men, or of the effectual redemption of all Jews and Gentiles that embrace by faith the benefits of his death: For in these, says Ambrose, a certain kind of universality is conceived [see footnote]. And this is no more repugnant [as the adversaries claim it is] to the doctrine of the Gospel than if some [adversaries] should say that Christ by his death did indifferently redeem and reconcile to God faithful Christians, and faithless Turks, heathens, Epicures, hypocrites, etc. although they receive not the merit of Christ by faith: which [latter] opinion [of the adversaries] is both impious, and repugnant to God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645)</cite>, pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98181c01cb" data-kw="">
<blockquote><p>II. We believe also that this death of Christ alone, is a perfect and sufficient ransom, to expiate and abolish all the sins of the whole world, that the merit of his justice is immense, that the medicine of his death is universal, the ever-flowing and inexhausted spring of life eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645)</cite>, pp. 694-98</span></figcaption>

</figure><figure class="quote" id="q-b3d5828935" data-kw="">
<blockquote><p>2. Nor does the deity of Christ stand in the way, which, since it itself demands satisfaction, does not seem able to receive it from itself, for justice is toward another (Socinus part 3, ch. 5). For I deny that a real diversity must always intervene between the one who makes satisfaction and the one to whom it is made (which is sufficiently refuted from civil affairs: the treasurer general, when his stipend is owed to him, is the same one who ought to pay and to whom it ought to be paid). A moral and virtual distinction suffices here, that is, a diversity of status and mode of subsistence. And thus in Christ, the formal principle of Christ’s actions as Mediator is different from the formal principle as God, whence Christ considered κατ᾽ οἰκονομίαν [according to the economy] made satisfaction to the second person of the divinity considered οὐσιωδῶς [essentially].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’ tr. by AI by Onku (Utrecht, 1650) Latin</cite></span></figcaption>

0%5Bessentially" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</span></figcaption>

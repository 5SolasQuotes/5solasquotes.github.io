<main class="wrap"><figure class="quote" id="q-17f9b362bf" data-kw="">
<blockquote><p>12. When we say that the pure ministry of the Word and pure celebration of the sacraments is a fit pledge and earnest, so that we may safely recognise a church in every society in which both exist, our meaning is that we are never to discard it so long as these remain, though it may otherwise teem with numerous faults. Nay, even in the administration of Word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith; for why should it be regarded as a ground of dissension between churches, if one, without any spirit of contention or perverseness in dogmatising, hold that the soul on quitting the body flies to heaven, and another, without venturing to speak positively as to the abode, holds it for certain that it lives with the Lord? The words of the apostle are, “Let us therefore, as many as be perfect, be thus minded: and if in anything ye be otherwise minded, God shall reveal even this unto you,” (Phil. 3:15) Does he not sufficiently intimate that a difference of opinion as to these matters which are not absolutely necessary, ought not to be a ground of dissension among Christians? The best thing, indeed, is to be perfectly agreed, but seeing there is no man who is not involved in some mist of ignorance, we must either have no church at all, or pardon delusion in those things of which one may be ignorant, without violating the substance of religion and forfeiting salvation. Here, however, I have no wish to patronise even the minutest errors, as if I thought it right to foster them by flattery or connivance; what I say is, that we are not on account of every minute difference to abandon a church, provided it retain sound and unimpaired that doctrine in which the safety of piety consists, and keep the use of the sacraments instituted by the Lord. Meanwhile, if we strive to reform what is offensive, we act in the discharge of duty. To this effect are the words of Paul, “If anything be revealed to another that sits by, let the first hold his peace.” (1 Cor. 14:30) From this it is evident that to each member of the Church, according to his measure of grace, the study of public edification has been assigned, provided it be done decently and in order. In other words, we must neither renounce the communion of the Church, nor, continuing in it, disturb peace and discipline when duly arranged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr. Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 1, §12, pp. 23-25</span></figcaption>

<blockquote><p>Concerning the communion of charity or love, which consists in suffering and bearing the evils one of another, and in not lightly condemning one another: we hold all them for the true members of Christ which worship one God in spirit and in truth, and hope for their salvation in one Jesus Christ alone, the Son of God come in the flesh, and crucified for the sins of the world, which is the foundation of salvation to all men. We desire all union and agreement with them, in whatsoeuer countries and regions they are, and whatsoever corruptions may be yet remaining amongst them, not only in manner, but also in certain points of doctrine, bewailing the bodily servitude which they endure, and praying the Father of light, that it will please Him to enlighten them more and more by his Holy Spirit.</p></blockquote>

<blockquote><p>the constant and earnest wish of all good men for these hundred years past… that the Protestant Churches which differ one from another about some points of religion, laying aside or at least moderating on both sides their over-tenacious adhering to their own opinions, may now at length be united and made up into one body… we [the reformed and Lutherans] are not at variance about any fundamental point of Christian religion, or such wherein men may not safely be of either opinion without hazarding their salvation… we make no doubt but every man would then readily wish for this much-desired communion, which none ever shunned or refused but out of a kind of religion and conscience, conceiving it unlawful to entertain a communion with any that are not of the same belief and opinion with themselves: so soon as men on both sides shall be wrought off from this superstitious conceit, they will gladly run and rush (as it were) into one another’s arms and embraces… how foul and scandalous a thing, how hurtful to both sides, how dangerous and pernicious to the whole Christian world this Schism is which has hitherto divided and distracted us… seeing we confess that whatsoever is of necessity for salvation to be believed or done by us, it is all clearly and plainly laid down in this Gospel, what hinders why we may not jointly confirm and ratify those articles wherein we both agree? and for those other points about which we differ, we may express them in such words and phrases as the sacred Scriptures afford us…</p></blockquote>

<blockquote><p>Let there be no strife between us and you, for we be brethren: and is not the Canaanite and the Perizzite yet in the land? O let it not be told in Gath, nor published in the streets of Ashkelon! Let it not be said that there can be no unity in the Church… It shall be no grief of heart to you afterward, that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government, as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Act. 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’ Alas, how shall our divisions and contentions hinder the preaching and learning of Christ, and the edifying one another in love! Is Christ divided? says the apostle. There is but one Christ, yea the Head and the Body makes one Christ, so that you cannot divide the Body without dividing Christ. Is there so much as a seam in all Christ’s garment? Is it not woven throughout from the top to the bottom? Will you have one half of Israel to follow Tibni, and another half to follow Omri? O brethren, we shall be one in heaven, let us pack up differences in this place of our pilgrimage the best way we can. Nay, we will not despair of unity in this world. Has not God promised to give us ‘one heart and one way’? (Jer. 32:39; Eze. 11:19) And that Ephraim shall not envy Judah, and Judah shall not vex Ephraim, but they shall flee upon the shoulders of the Philistines toward the East, they shall spoil them of the East together? Isa. 11:13,14 Has not the Mediator (whom the Father hears always) prayed that all his may be one? (John 17:21) Brethren, it is not impossible, pray for it, endeavor it, press hard toward the mark of accommodation. How much better is it that you be one with the other Reformed Churches, though somewhat straitened and bound up, than to be divided though at full liberty and elbow-room?</p></blockquote>

<blockquote><p>Mr. Hooker, Mr. Thomas Goodwin, and Mr. Philip Nye [congregationalists] give them [the eldership of a local church] only an authoritative directing power [to ordain new elders], such as parents have in the marriage of their daughter, which is an authority extrinsic, which the magistrate and pastor in their kind have; but the virgin has the only formal and intrinsic power to consent and so to make the marriage, and to dissent so as it shall be no marriage: In which case the Fraternity only, or Male-church formally [according to congregationalists], intrinsically judges, and may judge, though there were no officers, as the maid may marry, though parents and tutors were dead; and the directive authority of the officers may be wanting [lacking], as the directive authority of the magistrate may be wanting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 3, p. 308</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e49b6da69f" data-kw="">
<blockquote><p>Monogamy is a distinctive aspect of the Christian tradition. Polygamy existed in most ancient societies, but Christian authorities opposed the practice, in part to distinguish monogamous Christianity from other faiths. By the early modern period, polygamy was rare in Christian Europe, and it had gained a negative reputation because of its association with sexual excess and lust. During the Reformation, however, certain individuals, including Luther himself, condoned polygamy, and Lutheran doctrine was compatible with plural marriage in some ways. After an ill-fated attempt [by Anabaptists] to establish a polygamous community at Munster, however, it became much more difficult to support polygamy, as the practice was further tainted by association with religious radicalism and lustful, degenerate behavior. During the English Revolution, the downfall of censorship and the tumultuous political climate allowed some English authors to write in support of plural marriage, using both practical and religious arguments. Yet, the majority of authors condemned the practice. Plural marriage continued to be associated with pagan and barbaric culture, and accusations of polygamy were used to undermine and discredit one’s enemies. In the literature of travel and colonisation, accusations of polygamy were used to demean and vilify peoples such as Jews and Turks. The existence of polygamy in Europe’s colonies helped Christian Europeans to maintain a sense of superiority over the pagan, barbaric indigenous inhabitants and helped to establish a shared European and Christian identity. In the writings of the Reformation and the Revolution, along with the literature of travel and colonisation, polygamy became a boundary marker between Christians and non-Christians, Catholics and Protestants, radicals and non-radicals, civilised countries and barbaric countries, and England and its colonies. Polygamy’s function as a boundary marker, more than any theological reasons, was the reason why plural marriage did not gain significant support in early modern England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lisa-loughead.html">Lisa Loughead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perception of Polygamy in Early Modern England MA thesis</cite>, (Nova Scotia: Dalhousie University, 2008) 150 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-6e81acd84b" data-kw="">
<blockquote><p>But then (say they) this makes things arbitrary and indifferent to become necessary. This is true: but you must conceive that a thing may be said to be necessary two ways: necessary in itself, and necessary in the outward submission to the use of it. In itself, a thing indifferent cannot be made necessary. It is always as it is by nature, and conscience informed must so judge it; yet in the outward use, for the peace of the Church, it may upon command become necessary. After the death of Christ, till the destruction of the temple, abstaining from things strangled and blood, circumcision, legal vows and purifyings were indifferent in themselves, (for else the apostles would not have used them so): yet for the peace of some churches they were judged necessary to be yielded in love; and so may it be in other things: yet the indifferent nature of things is not taken away, but the necessary use prescribed for the peace of the church, upon better grounds than that we should suffer ourselves to be unsettled from royal power [as in his day with the civil government instituting ceremonies].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, Section 10, pp. 94-95 Abbot was a reformed Anglican.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<main class="wrap"><figure class="quote" id="q-6add7e7249" data-kw="">
<blockquote><p>Now as concerning the condition of the Church and work of God in that land, ye remember that although I shunned not, according to my poor measure, and as occasion offered, and necessity required, to show my mind of public matters, dangers and duties of the time, yet I used not very much to insist upon such things, as not being much inclined or able for disputing: And, having found by frequent experience, that so soon as any were gained to close indeed with Christ, and lay religion to heart in earnest, these generally, out of a native principle, became presently sound in the controversies of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

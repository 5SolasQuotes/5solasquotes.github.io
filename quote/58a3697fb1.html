<blockquote><p>[Thomas:] ‘God is the first cause moving both natural causes and voluntary causes; and just as by moving natural causes He does not take away the fact that their acts are natural, so by moving voluntary causes He does not take away the fact that their actions are voluntary, but rather brings this about in them — for He operates in each according to its property.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-8d48e99a77" data-kw="">
<blockquote><p>For that determination of God toward concurring with the secondary cause does not arise from a necessity imposed immediately by the action of the secondary cause, but from the reason of providence, by which the universal first cause must concur with the particular secondary causes. And this is clear from the fact that he concurs in this way with all causes, even the necessary ones, for the common reason of providence. But in the mode of concurring, he exhibits necessary concurrence to natural and necessary causes, and contingent concurrence to contingent and free ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, pp. 411-12</span></figcaption>

ree%20ones" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fcfddb7a0b" data-kw="Author of sin Permission">
<blockquote><p>God doth not infuse the lust, or excite it, though he doth present the object about which the lust is exercised. God delivered up Christ to the Jews, he presented him to them, but never commanded them to crucify him, nor infused that malice into them, nor quickened it; but he, seeing such a frame, withdrew his restraining grace, and left them to the conduct of their own vitiated wills. … God created the grape, and filled the vine with a sprightliness, but he doth never infuse a drunken frame into a man, or excite it. … In short, though it be by God&#x27;s permission that we can do evil, yet it is not by his inspiration that we will to do evil; that is wholly from ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite></span></figcaption>

</figure><figure class="quote" id="q-e32cfba195" data-kw="">
<blockquote><p>XXX. These and many similar points [discussed above on Romanism generally] are elaborated at length by Louis de Molina in his Concord of Free Will with the Gifts of Grace, quest. 14, disp. 26. He first asserts that God concurs with secondary causes in their operations and effects in such a way that just as the secondary cause immediately elicits its operation and produces its term or effect, so God immediately influences with it in the same operation and produces the term or effect through that operation or action. Secondly, he asserts that when God concurs with secondary causes, He influences as a universal cause with an indifferent influence towards various actions and effects. This general influence is determined to specific kinds of actions and effects by the particular influence of the secondary causes, which varies according to the nature of each in acting. Just as the influence of the sun, which is also universal, is determined by the influence of a man to produce a human being, and by the influence of a horse to produce a horse. If the cause is free, it is in its power to influence in such a way that this action rather than that one is produced, such as willing rather than not willing or walking rather than sitting, and this effect rather than that one, namely this artifact rather than another. Or it may even suspend its influence entirely so that there is no action at all. Thirdly, he asserts that the influence of God through universal concurrence is not sufficient for the production of any effect without the particular influence of the secondary cause by which it is determined, nor is the particular influence of the secondary cause sufficient without the influence of God through universal concurrence by which it is assisted, which, according to the ordinary law, He never denies. These two influences mutually depend on each other to exist in nature. Indeed, there are not two actions but one numerically, which as it comes from God influencing in this way is called universal concurrence, but as it comes from the secondary cause, for example from fire causing heat, is called the concurrence or influence of the fire. This action is specified not because it is from God through universal concurrence but because it is from the fire with God cooperating through its particular power. XXXI. The doctors who hold this explanation of divine concurrence think they can easily show how such concurrence can be reconciled with the freedom of human actions. For since two kinds of freedom are usually attributed to the will—one concerning the exercise of the act and the other concerning its specification—this divine concurrence, as explained, prejudices neither. Not the former, which concerns the exercise, since this concurrence does not impose the necessity of acting on the will. For the will does not act because God acts but rather conversely, God acts because the will acts, although they both begin to act at the same moment in time and nature. Scholastic terms express this by saying that the will acts prior in nature to God, not by priority of the instant in which but of the order from which. XXXII. Although the will can do nothing at all without God concurring, according to the law established by God when He created it free, that concurrence is always available to it because God willed and decreed from eternity to concur with every work of the free will when it determines itself to act. Nevertheless, the will is equally free concerning the specification of its act. For that the will acts well or badly, avoids or seeks this rather than that, does not proceed from any power of divine concurrence but from the proper determination of the will, which freely uses the divine concurrence, indifferent in itself, to produce an action of this rather than that kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 343-44 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXX. These and many similar points [discussed above on Romanism generally] are elaborated at length by Louis de Molina in his Concord of Free Will with the Gifts of Grace, quest. 14, disp. 26. He first asserts that God concurs with secondary causes in their operations and effects in such a way that just as the secondary cause immediately elicits its operation and produces its term or effect, so God immediately influences with it in the same operation and produces the term or effect through that operation or action. Secondly, he asserts that when God concurs with secondary causes, He influences as a universal cause with an indifferent influence towards various actions and effects. This general influence is determined to specific kinds of actions and effects by the particular influence of the secondary causes, which varies according to the nature of each in acting. Just as the influence of the sun, which is also universal, is determined by the influence of a man to produce a human being, and by the influence of a horse to produce a horse. If the cause is free, it is in its power to influence in such a way that this action rather than that one is produced, such as willing rather than not willing or walking rather than sitting, and this effect rather than that one, namely this artifact rather than another. Or it may even suspend its influence entirely so that there is no action at all. Thirdly, he asserts that the influence of God through universal concurrence is not sufficient for the production of any effect without the particular influence of the secondary cause by which it is determined, nor is the particular influence of the secondary cause sufficient without the influence of God through universal concurrence by which it is assisted, which, according to the ordinary law, He never denies. These two influences mutually depend on each other to exist in nature. Indeed, there are not two actions but one numerically, which as it comes from God influencing in this way is called universal concurrence, but as it comes from the secondary cause, for example from fire causing heat, is called the concurrence or influence of the fire. This action is specified not because it is from God through universal concurrence but because it is from the fire with God cooperating through its particular power. XXXI. The doctors who hold this explanation of divine concurrence think they can easily show how such concurrence can be reconciled with the freedom of human actions. For since two kinds of freedom are usually attributed to the will—one concerning the exercise of the act and the other concerning its specification—this divine concurrence, as explained, prejudices neither. Not the former, which concerns the exercise, since this concurrence does not impose the necessity of acting on the will. For the will does not act because God acts but rather conversely, God acts because the will acts, although they both begin to act at the same moment in time and nature. Scholastic terms express this by saying that the will acts prior in nature to God, not by priority of the instant in which but of the order from which. XXXII. Although the will can do nothing at all without God concurring, according to the law established by God when He created it free, that concurrence is always available to it because God willed and decreed from eternity to concur with every work of the free will when it determines itself to act. Nevertheless, the will is equally free concerning the specification of its act. For that the will acts well or badly, avoids or seeks this rather than that, does not proceed from any power of divine concurrence but from the proper determination of the will, which freely uses the divine concurrence, indifferent in itself, to produce an action of this rather than that kind.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 343-44 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXX.+These+and+many+similar+points+%5Bdiscussed+above+on+Romanism+generally%5D+are+elaborated+at+length+by+Louis+de+Molina+in+his+Concord+of+Free+Will+with+the+Gifts+of+Grace%2C+quest.+14%2C+disp.+26.+He+first+asserts+that+God+concurs+with+secondary+causes+in+their+operations+and+effects+in+such+a+way+that+just+as+the+secondary+cause+immediately+elicits+its+operation+and+produces+its+term+or+effect%2C+so+God+immediately+influences+with+it+in+the+same+operation+and+produces+the+term+or+effect+through+that+operation+or+action.+Secondly%2C+he+asserts+that+when+God+concurs+with+secondary+causes%2C+He+influences+as+a+universal+cause+with+an+indifferent+influence+towards+various+actions+and+effects.+This+general+influence+is+determined+to+specific+kinds+of+actions+and+effects+by+the+particular+influence+of+the+secondary+causes%2C+which+varies+according+to+the+nature+of+each+in+acting.+Just+as+the+influence+of+the+sun%2C+which+is+also+universal%2C+is+determined+by+the+influence+of+a+man+to+produce+a+human+being%2C+and+by+the+influence+of+a+horse+to+produce+a+horse.+If+the+cause+is+free%2C+it+is+in+its+power+to+influence+in+such+a+way+that+this+action+rather+than+that+one+is+produced%2C+such+as+willing+rather+than+not+willing+or+walking+rather+than+sitting%2C+and+this+effect+rather+than+that+one%2C+namely+this+artifact+rather+than+another.+Or+it+may+even+suspend+its+influence+entirely+so+that+there+is+no+action+at+all.+Thirdly%2C+he+asserts+that+the+influence+of+God+through+universal+concurrence+is+not+sufficient+for+the+production+of+any+effect+without+the+particular+influence+of+the+secondary+cause+by+which+it+is+determined%2C+nor+is+the+particular+influence+of+the+secondary+cause+sufficient+without+the+influence+of+God+through+universal+concurrence+by+which+it+is+assisted%2C+which%2C+according+to+the+ordinary+law%2C+He+never+denies.+These+two+influences+mutually+depend+on+each+other+to+exist+in+nature.+Indeed%2C+there+are+not+two+actions+but+one+numerically%2C+which+as+it+comes+from+God+influencing+in+this+way+is+called+universal+concurrence%2C+but+as+it+comes+from+the+secondary+cause%2C+for+example+from+fire+causing+heat%2C+is+called+the+concurrence+or+influence+of+the+fire.+This+action+is+specified+not+because+it+is+from+God+through+universal+concurrence+but+because+it+is+from+the+fire+with+God+cooperating+through+its+particular+power.+XXXI.+The+doctors+who+hold+this+explanation+of+divine+concurrence+think+they+can+easily+show+how+such+concurrence+can+be+reconciled+with+the+freedom+of+human+actions.+For+since+two+kinds+of+freedom+are+usually+attributed+to+the+will%E2%80%94one+concerning+the+exercise+of+the+act+and+the+other+concerning+its+specification%E2%80%94this+divine+concurrence%2C+as+explained%2C+prejudices+neither.+Not+the+former%2C+which+concerns+the+exercise%2C+since+this+concurrence+does+not+impose+the+necessity+of+acting+on+the+will.+For+the+will+does+not+act+because+God+acts+but+rather+conversely%2C+God+acts+because+the+will+acts%2C+although+they+both+begin+to+act+at+the+same+moment+in+time+and+nature.+Scholastic+terms+express+this+by+saying+that+the+will+acts+prior+in+nature+to+God%2C+not+by+priority+of+the+instant+in+which+but+of+the+order+from+which.+XXXII.+Although+the+will+can+do+nothing+at+all+without+God+concurring%2C+according+to+the+law+established+by+God+when+He+created+it+free%2C+that+concurrence+is+always+available+to+it+because+God+willed+and+decreed+from+eternity+to+concur+with+every+work+of+the+free+will+when+it+determines+itself+to+act.+Nevertheless%2C+the+will+is+equally+free+concerning+the+specification+of+its+act.+For+that+the+will+acts+well+or+badly%2C+avoids+or+seeks+this+rather+than+that%2C+does+not+proceed+from+any+power+of+divine+concurrence+but+from+the+proper+determination+of+the+will%2C+which+freely+uses+the+divine+concurrence%2C+indifferent+in+itself%2C+to+produce+an+action+of+this+rather+than+that+kind.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98How+Divine+Concurrence+can+be+Reconciled+with+Free+Will%E2%80%99%2C+pp.+343-44+Latin+Le+Blanc+%281614-1675%29+was+a+French+reformed+professor+of+theology+at+Sedan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe32cfba195.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e32cfba195.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=XXX.%20These%20and%20many%20similar%20points,of%20this%20rather%20than%20that%20kind&amp;text=XXX.%20These%20and%20many%20similar%20points%20%5Bdiscussed%20above&amp;text=an%20action%20of%20this%20rather%20than%20that%20kind" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

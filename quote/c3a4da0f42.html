<main class="wrap"><figure class="quote" id="q-c3a4da0f42" data-kw="providence wisdom">
<blockquote><p>That there is a Providence. The wisdom of God would not be so perspicuous, were there not a providence in the world. It is eminent in the creation, but more illustrious in the government of the creatures. A musician discovers more skill in the touching an instrument, and ordering the strings, to sound what notes he pleaseth, than he doth in the first framing and making of it. All God’s providences are but his touch of the strings of this great instrument of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on Divine Providence</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-in-general.html">Providence in General</a> › <a href="../topics/providence/providence-in-general/against-epicureans-and-chance.html">Against Epicureans and chance</a></span><span class="t"><a href="../topics/providence/government.html">Government</a> › <a href="../topics/providence/government/of-nations.html">Of nations</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee0846291f" data-kw="">
<blockquote><p>He studies not the Scripture as he should, which studies not providence as he should; we should compare Gods promises and providences together. What we hear of him in his Word, with what we see in his Works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, London, 1654, bk. 3, ch. 9, “Of God’s Providence,” p. 301</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-in-general.html">Providence in General</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>
<div class="actions"><button class="copy" data-copy="“He studies not the Scripture as he should, which studies not providence as he should; we should compare Gods promises and providences together. What we hear of him in his Word, with what we see in his Works.”

</figure><figure class="quote" id="q-f2494a6812" data-kw="Contentment Wisdom">
<blockquote><p>We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (variety and order of providence)</span></figcaption>

</figure><figure class="quote" id="q-9116ca8fe1" data-kw="all things providence">
<blockquote><p>We believe that all things without exception are under divine providence: whether heavenly or sublunary, great or small, necessary and natural or free and contingent. Thus nothing in the nature of things can be granted or happen which does not depend upon it. God created all things, therefore he also takes care of all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.3.1–2</span></figcaption>

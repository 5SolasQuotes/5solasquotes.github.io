<main class="wrap"><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude... (London: Maxey, 1654), on verse 19, Observations</cite>, p. 593</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cc17e63d71" data-kw="">

</figure><figure class="quote" id="q-37625135af" data-kw="">
<blockquote><p>My mind being thus many years immersed in studies of this nature, and I having also long wearied myself in searching what fathers and schoolmen have said of such things before us, and my genius abhorring confusion and equivocals, I came by many years longer study to perceive that most of the doctrinal controversies among Protestants (that I say not in the Christian world) are far more about equivocal words than matter; and it wounded my soul to perceive what work both tyrannical and unskillful, disputing clergymen had made these thirteen hundred years in the world! And experience since the year 1643 till this year, 1675, has loudly called to me to repent of my own prejudices, sidings and censurings of causes and persons not understood, and of all the miscarriages of my ministry and life, which have been thereby caused; and to make it my chief work to call men that are within my hearing to more peaceable thoughts, affections and practices: And my endeavours have not been in vain, in that the ministers of the country where I lived, were very many of such a peaceable temper (though since cast out [at the Great Ejection, 1662]), (and a great number more through the land by God’s grace (rather than any endeavors of mine) are so minded). But the sons of the coal were exasperated the more against me, and accounted him to be against every man that called all men to love and peace, and was for no man as in a contrary way. And now looking daily in this posture, when God calls me hence (summoned by an incurable disease to hasten all that ever I will do in this world) being uncapable of prevailing with the present Church disturbers, I do apply myself to posterity, leaving them the sad warning of their ancestors’ distractions, as a pillar of salt, and acquainting them what I have found to be the cause of our calamities, and therein they will find the cure themselves. II. I Have oft taken the boldness (constrainedly) to say that I doubt not but the contentions of the clergy have done far more hurt to the Christian world than the most bloody wars of princes. … 13. No man is sufficiently apprehensive of the greatness of the curse in the confusion of tongues [Gen. 10]: whereby as we can preach but to few nations in the world, so we cannot intelligibly converse with one another. All words (being arbitrary signs) are ambiguous; And few disputers have the jealousy and skill which is necessary to discuss equivocations, and to agree of the meaning of all their terms before they use them in disputing: And so taking verbal differences for material, does keep up most of the wretched academical and theological wars of the world. 14. And nothing here undoes all the world in point of wisdom, so much as over-hasty judging or prefidence: It is natural to almost all to fasten presently upon the first appearances and to be confident before they have half tried: In cases where seven and seven years serious study is necessary to a thorough digested knowledge, every novice will presently conclude as if he were sure. And then as everyone is apt to be confident, so to be tenacious; every error leading on more, and the reputation of the person being concerned in it, mutability being a shame: And so it becomes a very difficult thing to unlearn the errors once learned; as white paper is easier [to be] written on than that which is written on before. 15. And then no man knows his own error (else it were no error), nor knows what another man’s perceptions are, nor what any other man knows more than he. 16…. And by all these means almost all are of the opinion of the country where they live, or of those that they most reverence, or which are most for their interest; and boldly condemn the rest not understood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.</cite></span></figcaption>

nce%2C+or+which+are+most+for+their+interest%3B+and+boldly+condemn+the+rest+not+understood.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology%2C+Plain%2C+Pure%2C+Peaceable...+%28London%3A+White%2C+1675%29%2C+Preface%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F37625135af.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/37625135af.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=My%20mind%20being%20thus%20many%20years,boldly%20condemn%20the%20rest%20not%20understood&amp;text=My%20mind%20being%20thus%20many%20years%20immersed%20in&amp;text=interest%3B%20and%20boldly%20condemn%20the%20rest%20not%20understood" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And because in this matter it chiefly behoves to know who is truly said to be an heretic or whom is a schismatic: of these matters I will first of all speak these few words. St. Augustine thinks that this difference there is between an heretic and a schismatic: That a heretic does corrupt the sincerity of faith and doctrine of the apostles with his wicked doctrine; and a schismatic, although he sin not at all against the pure doctrine and sincere faith, yet he rashly separates himself from the Church, breaking the bond of unity. And surely he properly is an heretic, whosoever he be that contrary to the Scripture, which is the Word of God, against the Articles of Faith,¹ or against the sound opinions of the Church grounded on the Word of God, through hope of any temporal commodity, of his own brain and fleshly choice chooses, receives, teaches, follows strange things, and stiffly retaining does both defend them and spread them abroad. ¹ [This likely refers to the Apostles’ Creed, which was also known as the 12 Articles, and around which Bullinger’s Decades was roughly organized.] By the imperial edict of Augustus Cesar, Gratian, Valentinian and Theodosius, they are defined to be catholics or Christians who continue in that religion which St. Peter taught the church of Rome and which blessed Damasus and St. Peter, bishop of Alexandria, did teach, that is to say, confessing according to the teaching of the apostles and doctrine of the Gospel the only Godhead of the Father, and of the Son, and of the Holy Ghost in equal majesty and in an holy Trinity. And again they are by them declared to be heretics, who follow contrary opinions, whom they accompt both mad and infamous, and worthy of punishment. And he is a scismatic, whosoever he be that separates himself from the unity of the true Church of God, and either himself gathers together new assemblies, or joins himself to congregations gathered by others, albeit in doctrine he err little or nothing.</p></blockquote>

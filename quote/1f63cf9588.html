<main class="wrap"><figure class="quote" id="q-1f63cf9588" data-kw="">
<blockquote><p>The Apostles left more Officers in one Church than one, Phil. i. 1. with the Bishops, that is, the Pastors, Teachers and Elders. No Pastor or Teacher, but he is the Pastor or Teacher of one Congregation, and no more, Acts xx. 7, 28. God hath many Overseers to one Flock, not committed many, Flocks to one Overseer; therefore Non-residency is against the Rule of Christ. …

Two Sorts of Officers in the Church are ordinary, and they are Bishops and Deacons, Phil. i. 1. That these are ordinary, and that these are all, may appear by the Direction of the Apostle to Timothy, how to carry himself in the Church of God in constitution of Officers: He nameth these Two, 1 Tim. iii. 1, 8. Bishops and Deacons: Whom he doth mean by the Bishops? you may see, Acts xx. 17, with 28, the Flock over which God hath made you ἐπισκόπους, Overseers; those he calleth Elders, ver. 17. calleth Bishops, ver. 28. Tit. i. 5,7. and the same he calleth Elders, ver. 5. are called Bishops, ver. 7. For Deacons, see Acts vi. 2, 3, 4. the Deacons for the Church at Jerusalem; and Paul giveth Directions to Timothy about them, and it is a perpetual Charge to the Church. Compare 1 Tim iii. 14, 15. with 1 Tim. vi. 13, 14. Bishops and Deacons must be kept to the Coming of CHRIST in the Church, not so Apostles, Prophets, Evangelists. …

Quest. What Sort of Bishops hath God set in his Church?

Answ. Two; some Pastors and Teachers, some ruling Elders, under Two Heads; some labour in Word and Doctrine, and of those some are Pastors, some Teachers: Others rule only, and labour not in Word and Doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government and Discipline of the Churches of Christ, set down by way of Questions and Answers, with an Explanation and Application of the same</cite>, (London: John Clark, 1722), pp 19, 40, 46.</span></figcaption>

</figure><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>

<blockquote><p>2. We see also that though ministers are virtually both elders and deacons (as the apostles were), yet ought they to regulate their exercising of both these with respect to the former two. And, 3. that elders and deacons ought in governing and overseeing the poor to have special respect to keep ministers from being burdened or toiled with these, that they may have freedom to follow the ministry of the Word as the main thing: Yea, even to have much access to privacy and solitariness, which is both most necessary for and a well becoming duty to a minister; This is a special end of the appointment of these officers, and in reference to which they are helps, 1 Cor. 12:28, both to the people and to the ministers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh, 1659), pt. 2, ch. 2, p. 70</span></figcaption>

</figure><figure class="quote" id="q-7ecc71505d" data-kw="">
<blockquote><p>Discoursing of Bishops, and having described their character, and the qualities which they ought to possess, and having passed over the order of Presbyters, he proceeds to that of Deacons. The reason of this omission was, that between Presbyters and Bishops there was no great difference. Both had undertaken the office of Teachers and Presidents in the Church, and what he has said concerning Bishops is applicable to Presbyters. For they are only superior in having the power of ordination, and seem to have no other advantage over Presbyters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on First Timothy</cite>, hom. 11 (on 1 Tim. 3:8)</span></figcaption>

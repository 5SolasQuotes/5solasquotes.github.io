<main class="wrap"><figure class="quote" id="q-6167a2af9c" data-kw="">
<blockquote><p>Redemption is a real deliverance from the evils of punishment, which is actually nothing but the carrying out of the sentence of justification. For in justification we are pronounced just and awarded the judgement of life. In glorification the life that results from the pronouncement and award is given to us: We have it in actual possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 1.30.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2cd2fb423" data-kw="">
<blockquote><p>[The gospel according to Romanism] overturns the nature of justification, and at best it does put in sanctification in the room thereof; and there is never any distinct ground laid, by which a sinner may come to receive a sentence of absolution before God, but this, to wit, justification, is lost by the former doctrine; and they acknowledge no such thing distinct from regeneration or sanctification, as if no such act as justification were needful or mentioned in Scripture, as distinct from these; and, in effect, it leaves a sinner to a way of salvation that wants [lacks] justification in it: and therefore cannot profit him. For by denying that which is the formal cause of justification, they deny itself, seeing that gives it a being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Naphtali Press) vol. 3, p. 198</span></figcaption>

</figure><figure class="quote" id="q-dc860b657c" data-kw="">
<blockquote><p>If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes, not to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on Gal. 2, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/article-of-a-standing-or-falling-church.html">The Article of a Standing or Falling Church</a> › <a href="../topics/justification/article-of-a-standing-or-falling-church/the-dividing-line-with-rome.html">The dividing line with Rome</a></span><span class="t"><a href="../topics/justification/roman-justification.html">Roman Justification</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a></span></div>

</figure><figure class="quote" id="q-db3512187e" data-kw="">
<blockquote><p>To speak of complete, perfect justification of the law before God, such as that which angels have and men who are saved will have in eternity, is to speak of justification as conformity with God, which is as much to say, with God’s law; for God is thus as He gives Himself to be known in the law. This perfect justification in eternity means God Himself is in the saved [seligen]. As St. Paul says, “God will be all in all” [cf. 1 Cor. 15:28; 12:6; Col. 3:11], that is, God Himself is in the saved, and makes them like Himself, so that they are entirely pure, without sin. As John says, ‘We will be like Him’ [1 Jn. 3:2]. St. Paul speaks about this complete and perfect justification in Gal. 5:5, ‘For through the Spirit, by faith, we wait for the hope of righteousness.’ Although in this mortal life believers have a spark, the gospel nevertheless preaches to us the justification of Christ, of the Mediator between God and us, and says that the Mediator’s entire obedience, from his Incarnation until the Resurrection, is the true justification which is pleasing to God, and is the merit for us. God forgives us our sins, and accepted us, in that He imputes righteousness to us for the sake of the Son, although we are still weak and sinful. We must, however, accept this imputed righteousness with faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Melanchthon on Christian Doctrine, Loci Communes</cite>, 1555 trans. Clyde L. Manschreck (NY: Oxford Univ. Press, 1965), Locus 13, Of the Word, p. 161</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-4ea3eb7df3" data-kw="">
<blockquote><p>Touching the latter, how far he will extol the peppercorn of our own works, and righteousness to justification and salvation he does not here (though afterward, he does) in express words signify. But that he means to extol them, he does enough plainly give us to understand: when he says that the purchase did not only serve to advance the value and efficacy of that grain of pepper, his meaning must be (at least) that Christ died, and by his death, has purchased to the peppercorn of man’s righteousness, a value and efficacy in part, though not only to justify us, so that our righteousness must go cheek by cheek with the righteousness of Christ to justification. … If the adding of our righteousness to the righteousness of Christ for our justification, be an unlawful, exulting of our own, and depressing of Christ’s righteousness, then, to bring our own righteousness with the righteousness of Christ, in the least part to justify, is as truly an unlawful, depression of Christ’s righteousness, and advancing of our own, as if we had brought it in the highest degree wholly and alone to justify us: and so by his account, Christ died to make man, though not the only, yet in part, a savior of himself.</p></blockquote>

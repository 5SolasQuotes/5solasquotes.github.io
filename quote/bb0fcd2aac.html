<main class="wrap"><figure class="quote" id="q-bb0fcd2aac" data-kw="">
<blockquote><p>6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’</cite>, p. 687</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.”

— Zacharias Ursinus, The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’, p. 687">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6th+Objection%3A+The+Messiah+brings+everlasting+justice+and+righteousness.+Imputed+righteousness+is+not+eternal.+Therefore+we+are+not+thereby+justified.+Answer%3A+It+is+said+that+Christ%E2%80%99s+righteousness+shall+be+an+everlasting+righteousness%3B+but+after+a+diverse+manner.+For+in+the+life+to+come+we+shall+be+just+after+another+manner+than+in+this+life.+For+although+we+shall+then+be+just+by+the+same+righteousness%2C+even+by+the+righteousness+of+Christ+imputed+unto+us%3A+yet+with+this+shall+also+the+legal+justice+and+righteousness+be+continued%2C+so+that+then+also+by+the+legal+righteousness+we+shall+be+perfectly+just%2C+because+now+only+we+are%2C+as+concerning+that%2C+but+in+part+and+beginning+just.+Each+justice%2C+both+the+justice+of+the+Law%2C+and+the+justice+of+the+Gospel%2C+is+eternal%2C+by+continuation%3A+And+the+justice+and+righteousness+of+the+Gospel%2C+that+is%2C+the+justice+of+Christ+imputed+unto+us%2C+is+eternal+by+continuation+of+the+imputation%3A+The+justice+of+the+Law+is+eternal+by+continuation+of+good+works%2C+even+as+it+is+continued+by+good+works%2C+first%2C+and+beginning+in+this+life%2C+until+at+length+after+this+life+it+be+perfected%2C+and+become+perfect%2C+and+so+continue+to+all+eternity.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+%E2%80%98Of+Justification%E2%80%99%2C+7.+%E2%80%98Why+Christ%E2%80%99s+satisfaction+is+made+ours+by+faith+only%E2%80%99%2C+%E2%80%98Objections+against+this+Doctrine+of+Justification%E2%80%99%2C+p.+687&amp;url=https%3A%2F%2F5solasquotes.git </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d7e242940" data-kw="">
<blockquote><p>XXII… (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed, such that for the first constitution of justification, besides faith, not even the presence of good works is necessary, just as for the first constitution of fleshly marriage nothing is required but a consent of the spouses, because God justifies the ungodly (Rom. 4:5); then for its continuation their coexistence is required, just as for the continuation of marriage a coexistence of marriage duties is required, because faith working through love is required (Gal. 5:6); and finally for the consummation (insofar as the possession of eternal life is pronounced), the preexistence of good works is also required for the possession of eternal life (Mt. 25:35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’</cite>, p. 128</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

e</a></div>
</figure><figure class="quote" id="q-b1bbe60525" data-kw="">
<blockquote><p>Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established as the seal” ([Lugioyo] 52).</p></blockquote>

</figure><figure class="quote" id="q-bdfa54a8fa" data-kw="">
<blockquote><p>The apostle signifies the same thing by different words when he says, ‘Ye are washed, ye are sanctified, ye are justified:’ he has said, ‘ye are washed,’ on account of holy baptism; ‘ye are sanctified,’ on account of the Holy Ghost; but ‘ye are justified,’ on account of justifying faith, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On 1 Cor,. 6:11 in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4</cite>, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“The apostle signifies the same thing by different words when he says, ‘Ye are washed, ye are sanctified, ye are justified:’ he has said, ‘ye are washed,’ on account of holy baptism; ‘ye are sanctified,’ on account of the Holy Ghost; but ‘ye are justified,’ on account of justifying faith, etc.”

<main class="wrap"><figure class="quote" id="q-dda33fab82" data-kw="">
<blockquote><p>TO WHAT USE THE LAW WAS GIVEN.

First, that is should declare unto us the will of God, how we ought to live, and what works we ought to do, that we may please the Lord our God. …

Secondly, that is should reveal and open unto us our sin and wickedness, while we consider how unable we be of ourselves to do that which the holy, righteous, and good law of God requireth of us to be done. …

Thirdly, after we have learned our weakness, our wretchedness, our sin, our wickedness, by comparing our strength and life with the law of God, which proveth us all sinners and worthy of eternal damnation, lest we should fall into desperation, and so be damned, the law was given of God to be a school-master unto us to lead us unto Christ, the alone end and perfect fulfiller of all the laws of God; that we, through faith taking upon us his righteousness, and his fulfilling of the law, might be found blameless through him in the sight of God, and so be made inheritors of everlasting glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), pp 496-97.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ca815d96e5" data-kw="uses absolute relative rule">
<blockquote><p>A twofold use of the law may be laid down—absolute and relative. The former regards the law in itself; the latter regards the law in relation to the various states of man. The absolute (which obtains in every state of man) is that it may be a unique, full and certain rule of things to be done and avoided by each of us as well towards God as his neighbor. Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.2</span></figcaption>

</figure><figure class="quote" id="q-5d75c22e42" data-kw="natural law conscience">
<blockquote><p>Many arguments prove the existence of such a natural law. First, the voice of Scripture asserts that “the Gentiles which have not the law” (to wit, the written law of Moses) as the Jews “do by nature the things contained in the law, and are a law unto themselves: since they show the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the meanwhile accusing or else excusing one another” (Rom. 2:14, 15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.1.12</span></figcaption>

</figure><figure class="quote" id="q-280290dbac" data-kw="">
<blockquote><p>I have endeavoured to give the Law its due, and the Gospel its due, remembering that of Luther […] He that knoweth how to distinguish between Law and Gospel, let him give thanks to God, and know that he is a Divine.</p></blockquote>

</figure><figure class="quote" id="q-be4c076f2a" data-kw="">
<blockquote><p>When Paul says, “The law is not of faith,” he sets down the main difference between the law and the gospel. The law promises life to him that performs perfect obedience, and that for his works. The gospel promises life to him that does nothing in the cause of his salvation, but only believes in Christ. And it promises salvation to him that believes, yet not for his faith, or for any works else, but for the merit of Christ. The law then requires doing to salvation; and the gospel, believing, and nothing else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 177.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-00dece6c2a" data-kw="">
<blockquote><p>This fire was a type or declaration of the presence of God in the Person of the Son. For with respect unto the Father He is called an angel, the Angel of the Covenant; but absolutely in Himself, He was Jehovah, the God of Abraham, etc. And of his presence the fire was a proper representation. For in his nature He is as a consuming fire; and his present work was the delivery of the Church out of a fiery trial. This fire placed itself in a bush, where it burned, but the bush was not consumed: And although the continuance of the fire in the bush was but for a short season, a present appearance; yet thence was God said to dwell in the bush; the goodwill of Him that dwelt in the bush; Deut. 33:16. And this is so spoken because the being of the fire in the bush for a season was a type of Him in whom the fulness of the Godhead dwelt bodily, and that forever, Col. 2:9. Of Him who was made flesh and dwelt among us, Jn. 1:14. The eternal fire of the divine nature dwells in the bush of our frail nature, yet is not consumed thereby. God thus dwells in this bush, with all his goodwill towards sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations &amp; Discourses on the Glory of Christ</cite>, … (d. 1683; London: Marshall, 1691), ch. 3, pp. 41-42</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f75f43af8" data-kw="">
<blockquote><p>Obiection 2: Secondly, Christ took on Him man’s nature; He became man like to us: therefore, say some, He may be resembled, and an image of Him may be made. Question: How is this to be answered? Answer: Thus, Christ being both God and Man, the chief thing that makes him Christ is his Godhead, and that cannot be expressed by an image; and therefore an image made to resemble whole-Christ must needs be a living image, leaving out the chief part of Christ, which is his Godhead: so that an image made of Christ, either separates his Godhead from his manhood, or else it makes his Godhead to be such as may be circumscribed: both which are gross errors; therefore there may no image of Christ be made. Objection 3: May not Christ as well be painted with colors as set before us with words in a sermon? Question: How is this to be answered? Answer: No: the one God allows in his Word, namely the describing of Christ in speech, in the preaching of the Word and administration of the sacraments, but not the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words</cite>, … (d. 1624; London: Robert Mylbourne, 1625), God’s Holy Mind touching matters Moral, which Himself uttered in Ten Words, or Ten Commandments…, p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>In fact let us learn how greatly our nature inclines toward idolatry.… That saying of Horace still stands: once the gods of fools are born of fear. Or rather, as Scripture teaches, once the true knowledge of God has been blotted out by sin, the mind of man becomes a perpetual forge of idols.… Man will be compelled to confess that he is a transient being, and that those whose images he worships were once mortals like himself; yet he transfers divinity to them.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-379021b5c3" data-kw="">
<blockquote><p>The Gibbites in 1681, and Russelites in 1682, and for some years, did maintain the same unhappy principles and practices [as the later M’Millianites after 1689]; and stated their testimonies against paying of excise and customs, and other fool things, not only for themselves, but separation from all that durst not go their lengths, even when imprisoned together going as far from us as the walls of the prison would allow them, and stopping their ears when we went about publick worship three times a day, which was our ordinary in each room… It is a piece of demented infatuation to make little or no difference betwixt that period [before 1689] and this [period after 1689 during toleration], and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols</cite>, ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript, p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c322100d5" data-kw="">
<blockquote><p>It is agreed on by all real Christians that man being made an intelligent, free agent, not under bruitish necessitating determination by objects, is governed by God by the moral way of law; that is by the signification of his Ruler’s will, making his duty, and not by mere natural or forcible motion: And it is agreed that God Himself is his only absolute Universal Ruler, and his laws given in nature and by revelation are the only universal laws, which no human power can abrogate or dispense with: And that kings and magistrates are his ministers for men’s good, and have no power but from Him, and none against Him or his laws; and that it is not man but God, by whom we must all be judged to everlasting reward or punishment: And therefore that all men must obey God before men, and must not fear them that can but kill the body, but Him who is able to cast both soul and body into Hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (London: Parkhurst, 1689), Preface</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-c1a1f211d5" data-kw="">
<blockquote><p>But Magistrates as Magistrates hold forth in their Law-abstinence from those same sins of adultery, incest, murder; But:

1. Not to the consciences of their subjects, but to the outer man as members of the commonwealth.

2. Not under the pain of eternal wrath and condemnation, before the judge of quick and dead: Magistrates as Magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if Magistrates do persuade the equity of abstinence from adultery, incest, murder, in their statutes, or acts of parliament, from the Word of God, from the sixth and seventh command of the Decalogue, from the judgement and eternal punishment that follows these sins, they so persuade not as magistrates, but as divines, and as godly and Christian men…

3. Magistrates as Magistrates hold forth in their Law, abstinence from these sins, not as the ambassadors of Christ, craving subjection of conscience and divine-faith to those charges, but only external obedience: for though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience; nor is he in Christ’s stead to lay divine bands on the conscience, to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order, and as the Creator, and Founder, and another of human societies and of Peace, to exact external obedience, and to lay bands on your hands not to shed innocent blood, and on your body not to defile it with adultery, or incest, nor to violate the chastity of your brother… when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 550-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

<blockquote><p>21. ‘Moreover, thou shalt provide out of all the people.’… meaning, thou shalt choose out and take the most worthy, so that such an office be not entrusted rashly to any one that offers. But this was most reasonable, among a free people, that the judges should not be chosen for their wealth or rank, but for their superiority in virtue. Yet although it be right that regard should be chiefly had to virtue, so that if any one of the lower orders be found more suitable than others, he should be preferred to the noble or the rich; still should any one choose to, lay this down as a perpetual and necessary rule, he will be justly accounted contentious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Exodus</cite>, 18, v. 21</span></figcaption>

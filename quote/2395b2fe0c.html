<main class="wrap"><figure class="quote" id="q-2395b2fe0c" data-kw="">
<blockquote><p>God’s approbation sends sure premonitory tokens before it; every “petition”4 may both deceive and be deceived. And so, according to the circumstances and disposition, and even age, of each individual, the delay of baptism is preferable; principally, however, in the case of little children [parvulos]. For why is it necessary—if (baptism itself) is not so necessary5—that the sponsors likewise should be thrust into danger? Who both themselves, by reason of mortality, may fail to fulfil their promises, and may be disappointed by the development of an evil disposition, in those for whom they stood? The Lord does indeed say, “Forbid them not to come unto me.”6 Let them “come,” then, while they are growing up; let them “come” while they are learning, while they are learning whither to come;7 let them become Christians8 when they have become able to know Christ. Why does the innocent period of life [innocens aetas] hasten to the “remission of sins?” More caution will be exercised in worldly9 matters: so that one who is not trusted with earthly substance is trusted with divine! Let them know how to “ask” for salvation, that you may seem (at least) to have given “to him that asketh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Baptism 18, in Latin Christianity: Its Founder, Tertullian, ed. Alexander Roberts, James Donaldson, and A. Cleveland Coxe, trans. S. Thelwall, vol. 3, The Ante-Nicene Fathers (Buffalo, NY: Christian Literature Company, 1885), 678.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, Book XI, ch. II, Of the Efficacy of the Sacraments</span></figcaption>

</figure><figure class="quote" id="q-b107b86234" data-kw="">
<blockquote><p>Question 72. Is then the external baptism with water, the washing away of sin itself? Answer. Not at all, for the blood of Jesus Christ only, and the Holy Ghost, cleanse us from all sin. …So when it is said, “Baptism saves us,” is “the washing of regeneration,” and “the washing away of sin;” it is the same thing as to say, Baptism is the sign of all these things. Question 73. Why then doth the Holy Ghost call baptism “the washing of regeneration,” and “the washing away of sins?” Answer. God speaks thus not without great cause, to wit, not only thereby to teach us, that, as the filth of the body is purged away by water, so our sins are removed by the blood and Spirit of Jesus Christ; but especially that, by this divine pledge and sign, he may assure us that we are spiritually cleansed from our sins as really as we are externally washed with water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Lord’s Day 27, Q. 72–73</span></figcaption>

</figure><figure class="quote" id="q-d32d893a76" data-kw="">
<blockquote><p>This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him… 2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (Edinburgh: Ogle &amp; Boyd), p. 47</span></figcaption>

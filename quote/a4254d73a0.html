<main class="wrap"><figure class="quote" id="q-a4254d73a0" data-kw="">
<blockquote><p>For, if God granted to temporal and passible things to beget what they are, how much more did He who is eternal and impassible beget no other than He is Himself: one Father an only Son, to our unutterable wonder, since He begot Him with no suffering on His part, and with such complete equality to Himself that the Son does not excel Him either in power or in age!

All He has and can do He attributes to His Father, not to Himself, because He is not of Himself but of the Father. For, He is equal to the Father and this also He received from the Father, but He did not so receive His being equal as if He had previously been unequal and was born equal, but, as He is always born, so He is always equal. Therefore, He did not beget one unequal and add equality to Him at birth, but He gave it to Him in begetting Him because He begot Him equal, not unequal. Therefore, being in the form of God, it was not robbery in Him to be equal to God; since He assumed this at birth, He did not presume it by pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 170 from Alypius and Augustine to Maximus, c. 415 in Letters: Volume IV</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">

</figure><figure class="quote" id="q-a84fb18dc6" data-kw="">
<blockquote><p>As the essence of the Godhead is common to the several persons, they have a common intelligence, will, and power. There are not in God three intelligences, three wills, three efficiencies. The Three are one God, and therefore have one mind and will. This intimate union was expressed in the Greek Church by the word perichoresis, which the Latin words inexistentia, inhabitatio, and intercommunio, were used to explain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-eb2c42b026" data-kw="Spirit distinct person">
<blockquote><p>To tell us, that he will come unto us, that he will be our comforter, that he will teach us, lead us, guide us; that he spake of old in and by the prophets,—that they were moved by him, acted by him; that he “searcheth the deep things of God,” works as he will; that he appointeth to himself ministers in the church;—in a word, to declare, in places innumerable, what he hath done, what he doth, what he will do, what he says and speaks, how he acts and proceeds, is to ascribe unto him a distinct subsistence from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, IV</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a909d705d8" data-kw="">
<blockquote><p>He [God] will plead with our nobility and gentry. For three transgressions and for four He will not turn away their punishment.

(1.) For their compliance with the apostacy. And

(2.) For by their making the people to sin, partly by example, and partly by being in some measure executors of the laws of the rulers.

(3.) For their not helping the Lord against the mighty, but abiding in the tents of their riches, ease and wealth, and not countenancing the Lord’s work. Even the best of them are guilty, in regard that when they should have stood against the invasion, they have at least been silent and at ease in Zion.

(4.) For their oppression of the poor and racking of rents. Therefore shall their houses and lands be turned over to others, and the very nettles shall grow up in the place where their tables stood, and their posterity shall beg their bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-welwood.html">John Welwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

</figure><figure class="quote" id="q-a791fd42df" data-kw="">
<blockquote><p>1. That the government of the Church is not Monarchical, no Monarch save Christ alone is Head and King of the Church, though every Monarch that’s truly Christian be a King in the Church; For it is one thing to be a King in the Church, and another to be King over the Church.

2. Every King as a member of the Church, is in an Ecclesiastical sense subject to the discipline of the Church; for such a kind of subjection will well consist with his Civil Sovereignty, because it is not a Civil Subjection. Judicious [John] Camero[n] was a man very tender of pitching upon any conclusion which might be prejudicial unto Kingly power, and he useth an excellent similitude to illustrate this point: As it is in the cure of the body, so is it in the cure of the Soul; now a King for the Cure of his body, must patiently yield himself to his College of Physicians, for though he rule over them as a King, yet he must be ruled by them as a patient. In like manner a wise King will (and every King ought to) be persuaded by the College Ecclesiastical in point of discipline to obey the Rules and orders of Jesus Christ; for the King in this point doth not obey the College, but Christ himself.

3. It is well known that Kings and Emperors have been subjected to Episcopal, and too often enslaved by Prelatical power. Who knows not that the Bishop [Ambrose] of Milan would not admit the Emperor to the Communion till he had repented of that outrage, and bloodshed at Thessalonica, which was occasioned by the Emperor’s passionate Command? It is generally confessed, that Ambrose did well in rejecting the Emperor from the Communion, and that the Emperor was no less an Emperor, and a far better man by submitting to a Minister of the Gospel, preaching, and administering some part of the discipline of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), pp 30-31.</span></figcaption>

</figure><figure class="quote" id="q-ebdf5e31d2" data-kw="">
<blockquote><p>Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)”

— Travis Fentiman, “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists, (1604; RBO, 2025), pp. 150-51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWamphray+argues%2C+%E2%80%982.+If+the+Council%E2%80%99s+act+or+grant%E2%80%A6+be+sinful%2C+then+the+giving+of+this+bond+%5Bby+the+indulged%5D%E2%80%A6+must+be+much+more+sinful%E2%80%A6%E2%80%99+Yet+it+is+plain%2C+though+an+authority+sin+in+giving+commands%2C+it+is+not+necessarily+sinful+for+one+to+keep%2C+or+promise+to+keep%2C+those+commands+%28otherwise+there+would+be+no+such+thing+as+passive+obedience%2C+but+there+is%29.+%5BRichard%5D+Baxter+had+previously%2C+rightly+argued+at+length%C2%B9+against+the+view+Wamphray+puts+forth%3B+Baxter%E2%80%99s+position+was+precisely+the+indulged+ministers%E2%80%99+viewpoint.%C2%B2+%C2%B9+Baxter%2C+Five+Disputations%2C+5th+Disputation%2C+ch.+12%2C+%E2%80%9DIt+may+be+very+sinful+to+command+some+ceremonies%2C+when+yet+it+may+be+the+subjects%E2%80%99+duty+to+use+them+when+they+are+commanded%2C%E2%80%9D+pp.+460%E2%80%9363.+%C2%B2+Bairdie%3A+%E2%80%9Cyour+indulged+ministers%2C+looking+upon+these+statuted+rules%2C+at+least+ways%2C+as+unjust+upon+their+matter%2C+have+never+embraced+nor+observed+them%2C+except+it+be+in+some+civil+points+%28inflicted+on+them+as+penal%29%2C+and+that+only+so+far+as+they+judged+might+be+lawfully+submitted+unto%2C+however+unjustly+imposed.%E2%80%9D+Balm+from+Gilead%2C+p.+77.+Saul+unjustly+required+100+Philistine+foreskins+for+David+to+marry+his+daughter.+David+gave+200+%281+Sam.+18%3A17%E2%80%9327%29+and+could+have+promised+to+do+so+in+that+broken+and+declining+Church.+The+king+of+Babylon+sinfully+exacted+from+king+Zedekiah+of+Israel+an+oath+to+serve+him.+Zedekiah+broke+this+oath+and+would+not+serve+him+in+that+broken+and+declining+Church-state.+God+condemned+Zedekiah+for+it%2C+seeing+as+he+should+have+kept+the+sinfully+exacted+service+%28Eze.+17%3A11%E2%80%9319%29.+The+magistrates+sinfully

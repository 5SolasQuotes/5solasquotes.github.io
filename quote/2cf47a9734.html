<blockquote><p>I long ago began a treatise [Baxter’s Catholick Theology] to reconcile the Arminians and Anti-Arminians in these matters… And because I know not whether ever I shall live to reassume it… I must give the judicious a few hints of the media [means] of conciliation which I would have used: … 20. The doctrine of God’s antecedent and consequent will must be better explained, as being but his governing will, so called from legislation and judgment, which are the antecedent and consequent parts of government. 21. So must God’s will de naturalibus et moralibus [of natural and moral things], and his legislative antecedent will be well opened, and the uselessness and confusion of the distinction of signi [sign] and beneplaciti [good-pleasure] manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry… (London: Parkhurst, 1681)</cite>, pp. 122-23, 127</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0db55133c7" data-kw="">
<blockquote><p>The will of God is God by one simple act, absolutely willing the being of whatsoever He pleases. That distinction of the absolute and conditional will, as also that of the antecedent and consequent will of God, are both unsound. God wills it to be a truth that whosoever believes shall be saved: He likewise wills it to be the duty of Judas to believe: Hence follows (in case) a will of approbation concerning things in their own nature possible, which yet never shall be: as namely, the acceptation of the obedience of the reprobates; but it does not follow that God has conditionally willed the acceptation of the obedience of the reprobates. God decrees the coexistence of two extremes conditionally cohering, as the faith and salvation of Judas, the sight of such miracles and repentance in the Tyrians: the being of which extremes themselves He has not decreed. Though the things willed be conditioned, yet the volition or willing of God concerning those things is absolute. The authors and approvers of the second distinction, understand by the antecedent will of God (John Damascene, Of the Orthodox Faith, bk. 2, ch. 29), his will concerning the creature looking at it as in itself, without any consideration of after-circumstances: so they say God wills all men, even the reprobate to be saved: this they call his first will, and it is, say they, uncertain. By the consequent will of God, they understand his will concerning the creature looked at, not only as in itself, but together with after-adjuncts and circumstances, as sin, etc. This they call his second will, and it is, say they, certain. As a judge looking upon such a person as in himself, accounts it best that he should live; but looking upon him in second respects, as a murderer, etc. he accounts it best that he should die. The vanity of both these distinctions appears in that they are repugnant to the simplicity, perfection and independence of the first cause. The will of God in the decree, and the revealing of part thereof in the command, do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 17-18</span></figcaption>

</figure><figure class="quote" id="q-c67f6c7c3c" data-kw="">
<blockquote><p>Having proved it [the Mosaic deliverance of the 10 Commandments] is a covenant, all the difficulty remains in declaring what covenant it is; for here is much difference of judgements, even with the learned and orthodox… Some explain it thus: God (say they) had a primary or antecedent will in giving of the Law, or a secondary and consequent: His primary will was to hold out perfect and exact righteousness, against which the apostle argues and proves no man can be justified thereby: but then God, knowing man’s impotency and inability, did secondarily command repentance and promises a gracious acceptance through Christ; and this [understanding] may be very well received, if it be not vexed with ill interpretations. But, lastly, this way I shall go: The Law (as to this purpose) may be considered more largely, as that whole doctrine delivered on Mount Sinai with the preface and promises adjoined and all things that may be reduced to it; or more strictly, as it is an abstracted rule of righteousness, holding forth life upon no terms but perfect obedience. Now take it in the former sense: it was a covenant of grace; take it in the later sense, as abstracted from Moses’s administration of it, and so it was not of grace, but works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants… (London: Underhill, 1647), Lecture 24, on Dt. 4:13</cite>, pp. 231-33</span></figcaption>

</figure><figure class="quote" id="q-3f80f93133" data-kw="">
<blockquote><p>Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature, or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature. (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved, as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 13</span></figcaption>

</figure><figure class="quote" id="q-afaf7a01ca" data-kw="">
<blockquote><p>What we will antecedently, we do not will simply, but in a qualified sense; because the will is compared to things as they are in themselves: but in themselves they are in particular, hence we simply will something, according as we will it considering all particular circumstances, which is to will consequently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-baptiste-gonet.html">Jean Baptiste Gonet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shield of Thomistic Theology, 5 vols. 10th ed. (1667; Antwerp: Pitteri, 1744), vol. 1, tract 4, On the Will of God &amp; his Providence, disp. 4, Antecedent &amp; Consequent Will of God tr. AI by The Faith Received | Thomists, however, with the Holy Doctor, think that the antecedent will is that by which something is loved considered only in itself, and as abstracted from the circumstances with which it is posited in reality. But [they think] the consequent [will is] that which is terminated at things according to all circumstances in particular, as they are to be posited in execution and in reality. I say therefore: | Fourth, you will infer that the antecedent will is a will only in a qualified sense (secundum quid), while the consequent will is a will in an unqualified sense (simpliciter). For, as St. Thomas says here, art. 6, reply to obj. 1:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

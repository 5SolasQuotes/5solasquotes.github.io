<main class="wrap"><figure class="quote" id="q-79880cc2c6" data-kw="">
<blockquote><p>Q. So much of the Preface: How are the Commandments divided?

A. Into two Tables: whereof the first contain our duties to God, in the four first Commandments; and the other those to our neighbour, in the six other Commandments.

Q. What are those towards God?

A. Such as concern his worship; and therefore to be preferred before the other towards our neighbour.

Q. How may that be shewed?

A. By the inequality of the persons offended, God, and man; then also by the punishments assigned in the Scripture: for the breaches of the first Table, are to be more severely punished, then the breaches of the second. As he that revileth the Magistrate shall bear his sin, but he that blasphemeth God, shall be stoned to death. Which serveth to discover the crafty practices of the Papists, who would make men believe that the chiefest and most meritorious good Works, of all, required in the Law of God, are the works of the second Table; as Charity, alms-deeds, thereby deceiving the people to enrich themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), p. 78.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f629dc1361" data-kw="">
<blockquote><p>In regard then to the place which it occupies, it forms one of the Ten Commandments; all the rest of which are confessedly of eternal obligation, and were delivered in a very different manner, indeed, from the ceremonial law, which was to be binding on the Church only under the Mosaic dispensation.

The Ten Commandments were spoken by God himself from amidst the thunders and lightnings of mount Sinai, in the hearing of all the people; and he added no more, but wrote them once and again on two tables of stone, and delivered them unto Moses, to be by him deposited in the ark which was placed under the mercy-seat in the Holy of Holies.

It was not so with any other law or commandment enjoined upon Israel. All the rest were delivered to Moses in the mount, beyond the hearing of the Assembly of Israel: they were written by Moses in a book; and, though carefully preserved, still, as has been well observed, they were placed, not in, but by the side of the ark, as if to intimate that they might one day be separated and removed from it. But the Ten Commandments were placed in the ark under the mercy-seat, intimating that they were to receive their fulfilment in Him of whom the ark was a type, even Christ who is the “end of the law for righteousness to every one that believeth,” and without whose perfect obedience to the law there never could have been a mercy-seat for sinners to approach.

It is impossible, I think, seriously to consider all these circumstances, without being convinced that it was the purpose of God to distinguish the Fourth Commandment above all precepts and institutions of a mere positive or ceremonial nature—that, in fact, he has given to it all the weight and permanency of a moral obligation.

And, indeed, it is plain that, in substance, it is of a moral nature; for if, as God’s rational creatures, we are under an eternal obligation, in some way or other, to worship and do him homage, then some portion of time must necessarily be devoted to that duty; and though our reason might not be able to discover, in the nature of the thing, any necessity for that time being limited to one day rather than another, yet, did we understand the constitution of our nature as God understands it, or could we estimate as he estimates the tendency and the influence of his institutions, as they are calculated to affect us; I doubt not we should perceive something very different from a mere arbitrary arrangement, in his expressly appointing one whole day in seven to be a holy Sabbath to himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-f9e83fa791" data-kw="schoolmaster lead to Christ law-work conviction humiliation">
<blockquote><p>In the restored state of grace, it has a varied use with respect to the elect, both before and after their conversions. Antecedently, it serves (a) to convince and humble man so that (his own misery and weakness being felt) he despairs of himself and renounces confidence in his own righteousness and merit and rests upon the mercy of God alone. (b) To lead men to Christ, not indeed primarily and by itself (because the law does not know Christ), but by the accident of grace, inasmuch as it impels man (cast down and despairing of his own strength) to seek the remedy of saving grace. Under this relation, it is called by Paul “a schoolmaster” unto Christ (Gal. 3:24) and Christ is called “the end of the law” (Rom. 10:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.10</span></figcaption>

<blockquote><p>Obj. 9. That is not to be taught in the church which increases sin. The law increases sin. (Rom. 7:8.) Therefore, it is not to be taught. Ans. There is here a fallacy of accident in the minor proposition. The law increases sin by an accident, or on account of the corruption of man, and that in two ways. First, because the nature of man is so depraved and alienated from God, that men do not perform what they know to be pleasing to God; and, on the other hand, what they know to be prohibited by God, that they desire, and do with the greatest willingness. Secondly, because it works wrath, when men fret and murmur against God, hate and turn away from him, and rush into despair according as the law reveals to them a knowledge of their sins, and the punishment which they deserve in consequence thereof. The law in itself produces righteousness, conformity with God, love to God, etc. The law also in itself increases sin, if we understand the word increase in a different sense, viz., that it shows unto us, and brings it to pass that we acknowledge the greatness and magnitude of our sins; but not that it so increases sin as that which in itself is small is made greater and more aggravated. There are, therefore, four terms in this syllogism, in consequence of the ambiguity of the word increase in the minor proposition.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Obj. 9. That is not to be taught in the church which increases sin. The law increases sin. (Rom. 7:8.) Therefore, it is not to be taught. Ans. There is here a fallacy of accident in the minor proposition. The law increases sin by an accident, or on account of the corruption of man, and that in two ways. First, because the nature of man is so depraved and alienated from God, that men do not perform what they know to be pleasing to God; and, on the other hand, what they know to be prohibited by God, that they desire, and do with the greatest willingness. Secondly, because it works wrath, when men fret and murmur against God, hate and turn away from him, and rush into despair according as the law reveals to them a knowledge of their sins, and the punishment which they deserve in consequence thereof. The law in itself produces righteousness, conformity with God, love to God, etc. The law also in itself increases sin, if we understand the word increase in a different sense, viz., that it shows unto us, and brings it to pass that we acknowledge the greatness and magnitude of our sins; but not that it so increases sin as that which in itself is small is made greater and more aggravated. There are, therefore, four terms in this syllogism, in consequence of the ambiguity of the word increase in the minor proposition.”

— Zacharias Ursinus, The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObj.+9.+That+is+not+to+be+taught+in+the+church+which+increases+sin.+The+law+increases+sin.+%28Rom.+7%3A8.%29+Therefore%2C+it+is+not+to+be+taught.+Ans.+There+is+here+a+fallacy+of+accident+in+the+minor+proposition.+The+law+increases+sin+by+an+accident%2C+or+on+account+of+the+corruption+of+man%2C+and+that+in+two+ways.+First%2C+because+the+nature+of+man+is+so+depraved+and+alienated+from+God%2C+that+men+do+not+perform+what+they+know+to+be+pleasing+to+God%3B+and%2C+on+the+other+hand%2C+what+they+know+to+be+prohibited+by+God%2C+that+they+desire%2C+and+do+with+the+greatest+willingness.+Secondly%2C+because+it+works+wrath%2C+when+men+fret+and+murmur+against+God%2C+hate+and+turn+away+from+him%2C+and+rush+into+despair+according+as+the+law+reveals+to+them+a+knowledge+of+their+sins%2C+and+the+punishment+which+they+deserve+in+consequence+thereof.+The+law+in+itself+produces+righteousness%2C+conformity+with+God%2C+love+to+God%2C+etc.+The+law+also+in+itself+increases+sin%2C+if+we+understand+the+word+increase+in+a+different+sense%2C+viz.%2C+that+it+shows+unto+us%2C+and+brings+it+to+pass+that+we+acknowledge+the+greatness+and+magnitude+of+our+sins%3B+but+not+that+it+so+increases+sin+as+that+which+in+itself+is+small+is+made+greater+and+more+aggravated.+There+are%2C+therefore%2C+four+terms+in+this+syllogism%2C+in+consequence+of+the+ambiguity+of+the+word+increase+in+the+minor+proposition.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Commentary+of+Dr.+Zacharias+Ursinus+on+the+Heidelberg+Catechism%2C+trans.+George+W.+Williard+%28Cincinnati%3A+Elm+Street+Printing+Company%2C+1888%29%2C+616%E2%80%9318.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e3afd8f49.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="per

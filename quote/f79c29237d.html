<blockquote><p>It’s the common trap of the Papists to put ignorant people to prove the calling of the ministers, or forsake them. They that preach the Gospel and do the office (though faultily), and are in possession [of it], have a calling sufficient to justifie the hearers, when it may not be enough to justify themselves: [they have] a better call than the high priests that Christ did send men to.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67a848c7de" data-kw="">
<blockquote><p>1. Jesus preached peace (Eph. 2:17); don’t be a better preacher than Jesus. 2. Preach first to yourself. 3. Preach from your heart, not only to their heart. 4. Leverage your own distress. 5. How much do you have to hate the people to try to impress them rather than help them? 6. A pervasive tone of encouragement. 7. Vivid imagery. Visceral, sensory. Littered with analogues. 8. They’re more distressed than they’re revealing. 9. The power is in the Word, not your cleverness. 10. The Spirit works with your weakness and need, not our strength and sufficiency. 11. Think yourself full, pray yourself aglow. 12. Be concrete, not abstract. 13. Specificity communicates universality. 14. Be clear. Lewis: sheep. If you given them a route to misunderstand, they’ll take it. 15. Be simple but not simplistic. 16. Ruthlessly cut everything extraneous. 17. Smile. And mean it. Preaching is an act of pastoral love. 18. Doctrine is not enough; but, people do want to know doctrine. 19. Regularly reveal something of your own weakness. 20. Let them know of exegetical discoveries new to you. 21. Don’t ask adjectives to do the work verbs should be doing. 22. Make the gospel clear at some point. 23. Both unbelievers and believers are present. 24. Both eager and stagnant belieers are present. 25. Remember, and speak directly to, the kids. 26. Speak in your natural everyday voice; resist every form of ‘the preacher’s voice’. 27. Handle objections. 28. When on the fence, shorter is better. 29. Quit preaching while you still have them. 30. You don’t look as happy as you are; so stretch for joy. 31. If they feel loved by you (Phil. 4:1), they will feel hurt with you (Phil. 4:14). 32. ‘We will hear you again about this’ (Acts 17:32). Intrigue them with Jesus, even if they haven’t collapsed into his arms yet. 33. Don’t let your main points be transposable onto any other text in the Bible. 34. Slow down to notice every actual word of the text–what it says, and doesn’t say. 35. Calm down and be yourself. 36. Be a farmer, not a penny stock trader. Crock pot, not microwave. 37. They don’t need eloquence; they need radiance. 38. T.F. Tenney: ‘Preach every sermon like your son is sitting on the last row and giving church one last chance.’ 39. Tincture. Give them a taste of what Jesus himself is like. Rutherford.</p></blockquote>

</figure><figure class="quote" id="q-8252d74455" data-kw="">
<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4. 3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29. 4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether. 5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>

ormedbooksonline.com/on-catechizing/#:~:text=2.%20It%20%5Bthe%20form%20of%20sound,no%20man%20take%20away%20thy%20crown&amp;text=2.%20It%20%5Bthe%20form%20of%20sound%20words%5D%20is&amp;text=hast%2C%20let%20no%20man%20take%20away%20thy%20crown" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Several of them [common Scottish people, after the second indulgence in 1672] were taught to believe, and urge a position, in itself of most dangerous consequences, that it is unlawful to hear a minister who was guilty of failures in his entry upon ministerial work, or mistakes in his management of it. I wish the remains of this dangerous position may be entirely out from among us;</p></blockquote>

<blockquote><p>4. By this wild interpretation [of 1 Tim. 5:17 by prelates] men may be [Greek] well-governing pastors, who labor not in the Word and doctrine, and so the dumb [non-preaching] prelates, who hold it all one to be damned to a pulpit, and to a man-mill, shall be pastors worthy of double honor. Now Paul will not say this of a right bishop, 1 Tim. 3:2; Tit. 1:9, because good governing in a pastor includes laboring in the Word and doctrine, as the whole includes the part: For preaching is a special act of overseeing and well-governing of souls, Jer. 1:10; 2 Tim: 4:2. Because the Word is the instrument of pastoral governing, how can pastors rule well by using aright the Word of God, except they labor in the Word, which is the shepherd’s staff: of right governing and painful preaching, Heb. 13:17; Acts 20:28-31.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 19, p. 285</span></figcaption>

<div class="actions"><button class="copy" data-copy="“4. By this wild interpretation [of 1 Tim. 5:17 by prelates] men may be [Greek] well-governing pastors, who labor not in the Word and doctrine, and so the dumb [non-preaching] prelates, who hold it all one to be damned to a pulpit, and to a man-mill, shall be pastors worthy of double honor. Now Paul will not say this of a right bishop, 1 Tim. 3:2; Tit. 1:9, because good governing in a pastor includes laboring in the Word and doctrine, as the whole includes the part: For preaching is a special act of overseeing and well-governing of souls, Jer. 1:10; 2 Tim: 4:2. Because the Word is the instrument of pastoral governing, how can pastors rule well by using aright the Word of God, except they labor in the Word, which is the shepherd’s staff: of right governing and painful preaching, Heb. 13:17; Acts 20:28-31.”

<blockquote><p>Therefore, whoever is justified is still a sinner; and yet he is considered fully and perfectly righteous by God who pardons and is merciful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Disputation Concerning Justification (1536) | Luther’s Works, 34:152–53 (HT: Inwoo Lee)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

— Martin Luther, The Disputation Concerning Justification (1536) | Luther’s Works, 34:152–53 (HT: Inwoo Lee)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+whoever+is+justified+is+still+a+sinner%3B+and+yet+he+is+considered+fully+and+perfectly+righteous+by+God+who+pardons+and+is+merciful.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+The+Disputation+Concerning+Justification+%281536%29+%7C+Luther%E2%80%99s+Works%2C+34%3A152%E2%80%9353+%28HT%3A+Inwoo+Lee%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ed0b75515.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ed0b75515.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/08/find-a-church-where-it-is-preached-weekly/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bacfbd6ff5" data-kw="">
<blockquote><p>But believers sin greatly after they are in a justified state, and so stand in need of renewed pardon, from time to time. That believers sin after they are in a justified state, sad experience, as well as God’s Word, does daily show; but the sins of those who are in a justified state come under another consideration, for their “persons are not under the law,” (or legal covenant) Rom. 6:14. They are in Christ, who is “the end of the law for righteousness, to every one that believeth,” Rom. 10:4. So that as believers have nothing to do with the law, so as to seek justification for their persons, by their obedience to the same; neither can the law, with its condemning power, reach them, so as to bring them into legal condemnation again: so that unless the covenant of grace be made void, the believer’s justified state remains, and he is no more under the law forever. … But if the saints are not under the law, or legal covenant, then it should seem from thence that they need no pardon of sin, and so ought not in their daily prayers to pray for the same: so where there is no law there is no transgression. Though believers are not under the law, or legal covenant, yet it does not from thence follow that they stand in no need of daily pardon. Indeed, they stand not in need of such pardon as unbelievers stand in need of, they are under a legal condemnation, obnoxious to the curse, and stand in need of a change of their state, God being to them a God of terror. But if at any time they are, through grace, brought savingly to believe in Christ, then God, as a God of all grace, freely justifies them, by remitting of their sins, and imputing of Christ’s righteousness for their justification, and properly this is Scripture justification, Rom. 4:6, 8. But believers standing in relation to God, as children to a tender-hearted Father, this alters the case quite, and shows a vast difference between the state of the one and of the other, the believer being “justified from all things,” Acts 13:39, and the unbeliever being “condemned already,” John 3:18. Now though God deal as a Judge with those that continue in their unbelief, yet He deals as a tender-hearted Father with all true believers. “Like as a father pitieth his children, so the Lord pitieth them that fear him: yea, he remembereth that we are dust,” Ps. 103:13-14. Now when the saints sin against a loving Father, then does God come forth with his fatherly corrections: “Then will I visit their transgressions with the rod, and their iniquity with stripes,” Ps. 89:32. And sometimes in a very sore manner; “Behold thou art wroth, for we have sinned,” Isa. 64:5. Indeed the sins of the saints shall not make void God’s covenant, therefore the prophet comes in the next words, saying, In those, that is, in thy mercies, is continuance, and we shall be saved; yet they highly provoke a tender-hearted Father by sinning against Him; and as often as the saints sin against their heavenly Father, in this their new covenant relation, so oft they stand in need of fatherly forgiveness. Thus with holy David, who had sinned in the matter of Uriah, yet when brought to confess the same, “Nathan said unto David, The Lord hath put away thy sin, thou shalt not die,” 2 Sam. 12:13; for by God’s law adulterers ought to be put to death, Lev. 20:10. Now God remitting this temporal chastisement to David, is said to pardon, or put away his sin: and the Church cried out, Lam. 3:42, “We have transgressed and rebelled, thou hast not pardoned;” that is, their afflictions were not removed. And in this sense God oft lets sin lie on his otherwise justified children for some time unpardoned, and as often as He is pleased to remit these chastisements, so often He may be said to pardon his children; and as long as the saints sin against their God and Father in their new covenant relation, so long shall we need renewed pardon, which will be whilst we are in this world. And this should keep the saints at the throne of grace, daily begging of pardon, confessing of sin, bewailing of corrupt nature, and entreating a farther discovery of their covenant state. Now in this respect, the saints daily need pardon of sin, and a more full discovery of their new covenant relation with God; so that it is not true in every respect, you see, to say all pardon is at once: but with respect to the justifying of our persons, in a proper sense, justification is but one constant, complete act of grace, admitting of no degrees, nor revocation, but remains firm for ever. But if God correct his justified children for their sins, does it not dishonour the cross of Christ? That God does correct his saints here for their sins, and not only from them, as some would have it, is most plain from the New, as well as from the Old Testament… So that though God does not, as a judge, take vengeance on his justified children for their sins, yet as a loving Father He assuredly corrects them when they go astray. And certainly there can be no good argument drawn from the perfection of Christ’s satisfaction, to exempt believers from fatherly corrections here for their going astray. Nay, holy David looks on God’s corrective dispensations, as his keeping of covenant with him: “I know, O Lord, thy judgments are right (that is, thy corrections) and that them in faithfulness hast afflicted me,” Ps. 119:75.</p></blockquote>

<blockquote><p>Would ye then obtain justification in Christ? You must previously possess Christ. But you cannot possess him without being made a partaker of his sanctification: for Christ cannot be divided. Since the Lord, therefore, does not grant us the enjoyment of these blessings without bestowing himself, he bestows both at once but never the one without the other. Thus it appears how true it is that we are justified not without, and yet not by works, since in the participation of Christ, by which we are justified, is contained not less sanctification than justification.</p></blockquote>

— John Calvin, Institutes of the Christian Religion, 3.16.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWould%20ye%20then%20obtain%20justification%20in%20Christ%3F%20You%20must%20previously%20possess%20Christ.%20But%20you%20cannot%20possess%20him%20without%20being%20made%20a%20partaker%20of%20his%20sanctification%3A%20for%20Christ%20cannot%20be%20divided.%20Since%20the%20Lord%2C%20therefore%2C%20does%20not%20grant%20us%20the%20enjoyment%20of%20these%20blessings%20without%20bestowing%20himself%2C%20he%20bestows%20both%20at%20once%20but%20never%20the%20one%20without%20the%20other.%20Thus%20it%20appears%20how%20true%20it%20is%20that%20we%20are%20justified%20not%20without%2C%20and%20yet%20not%20by%20works%2C%20since%20in%20the%20participation%20of%20Christ%2C%20by%20which%20we%20are%20justified%2C%20is%20contained%20not%20less%20sanctification%20than%20justification.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.16.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa5833f0a1f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a5833f0a1f.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-c88e043db4" data-kw="">
<blockquote><p>It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>

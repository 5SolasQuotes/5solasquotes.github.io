<main class="wrap"><figure class="quote" id="q-8825e7f669" data-kw="">
<blockquote><p>Object. Perhaps the promises and threatnings of God, are his conditional decree, and depending upon the performance of the condition by the pleasure of man. Answ. But this cannot truly be said: For if it should be so, this decree would not be certain by the will of God, although the event was certainly foreseen by him: Also nothing can be imagined more absurd, than to appoint God to decree any thing with a condition is fulfilled.

But God willeth nothing, which he willed not from eternity. Indeed God doth promise life under the condition of obedience, but he doth decree nothing under that doubtful condition. He doth not elect Peter if he shall believe, but he electeth him to faith, that he might be saved: Neither was he only willing to preserve the Ninevites if they would be turned, but he also gave them repentance whereby they turned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 4.7, p. 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

enanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6fe375315b" data-kw="">
<blockquote><p>It is, then, universally acknowledged that we must believe the Deity to be not only almighty, but just, and good, and wise, and everything else that suggests excellence. It follows, therefore, in the present dispensation of things, that it is not the case that some particular one of these Divine attributes freely displays itself in creation, while there is another that is not present there; for, speaking once for all, no one of those exalted terms, when disjoined from the rest, is by itself alone a virtue, nor is the good really good unless allied with what is just, and wise, and mighty (for what is unjust, or unwise, or powerless, is not good, neither is power, when disjoined from the principle of justice and of wisdom, to be considered in the light of virtue; such species of power is brutal and tyrannous; and so, as to the rest, if what is wise be carried beyond the limits of what is just, or if what is just be not contemplated along with might and goodness, cases of that sort one would more properly call vice; for how can what comes short of perfection be reckoned among things that are good?). If, then, it is fitting that all excellences should be combined in the views we have of God, let us see whether this Dispensation as regards man fails in any of those conceptions which we should entertain of Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Catechism</cite>, (c. 385), 20 in Nicene and Post-Nicene Fathers 2, 5: 491.</span></figcaption>

</figure><figure class="quote" id="q-e33d02e0fa" data-kw="">
<blockquote><p>For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end [such as salvation in the gospel call] is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’, pp. 398-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-f-stapfer.html">Johann F. Stapfer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Attributes Dependent upon the Divine Intellect</cite>, [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

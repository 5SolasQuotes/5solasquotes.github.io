<blockquote><p>Although the law as a rule of duty to believers requires perfect obedience from them, yet it admits of God’s accepting their sincere obedience performed in faith, though it is imperfect. It admits of His accepting this obedience not indeed as any part of their justifying righteousness, not as the foundation of His acceptance of their persons as righteous, but as the fruit and evidence of their being vitally united to His beloved Son as Jehovah their Righteousness, and of their being already accepted in Him (Eph. 1:6; Heb. 13:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 34–35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95f67b534e" data-kw="">
<blockquote><p>Our justice or righteousness, that is, the justice or righteousness of the Gospel, whereby we are just in the sight of God, is not our conformity with the Law: but it is Christ’s satisfaction performed unto the Law for us, or the punishment, which He sustained for us, and so his whole humiliation (that is, his taking of flesh, his undertaking of servitude, penury, ignominy, and infirmity: his suffering of that bitter passion and death: all which He did undergo for us, but willingly) and that humiliation and satisfaction freely of God imputed unto us his faithful and believers. 1 Cor. 2:2, ‘I esteemed not to know anything among you, save Jesus Christ and Him crucified.’ Col. 2:10, ‘Ye are complete in Him.’ Rom. 5:19, ‘By the obedience of one shall many be made righteous.’ Isa. 53:5-6, ‘With his stripes we are healed. The Lord hath laid upon him the iniquity of us all.’ Now that Christ might perform obedience and satisfy for us, it behoved Him to be our Mediator, being by Himself just and holy, Heb. 7:26, ‘For such an High-Priest it became us to have, holy, harmeless, undefiled, separate from sinners, and made higher than the heavens.’ All these things are true perfectly and wholly in Christ. For He has perfectly fulfilled the Law for us: 1. by the holiness of his human nature. 2.by his obedience: for He became obedient unto the death, even the death of the cross: And the former fulfilling of the law, namely, the holiness of Christ’s human nature, was requisite for the other, even for his obedience. This obedience and satisfaction of Christ is our satisfaction, and our proper iustice, for which we please God, for which we are received into favor with God the Father, and which is imputed unto us. That former fulfilling of the Law is indeed imputed also unto us, namely the humiliation and justice or righteousness of Christ’s human nature, that we may be reputed holy before God: but this holiness of Christ is imputed unto us for his obedience or satisfaction sake: because He satisfied for us God’s justice, in sustaining eternal punishment and pains, which we should have sustained everlastingly. Hence is it, that the effusion of Christ’s blood (as being the complement and consummation of Christ’s satisfaction) is only said to be our justice and righteousness. 1 Jn. 1:7, ‘The blood of Jesus Christ cleanseth us from all sin,’ that is, not only from that which is past, but also from that which is to come. … 5. How Christ’s satisfaction is made our justice and righteousness: This question is adjoined because it seems absurd that we should be justified by that which is another man’s, and not ours. The satisfaction or justice of Christ is made ours, or applied unto us, two ways, that is, by a double application. The former application is God’s, who in respect of that fulfilling of the Law performed by Christ, accepts us, and applies the same unto us; that is, He imputes it, no less than if we had never sinned, or at least had paid and suffered sufficient punishment for our sins. For albeit to justify signifies to make just, yet in the Church it signifies another thing, and is taken in another sense. Or God does apply it, when He imputes the fulfilling of the Law performed by Christ unto us, even as if it were performed by us, neither will at all punish us. But to impute, is, to accept Christ’s satisfaction, performed to this end, that it might be our justice and righteousness. We then also apply unto us the fulfilling of the Law performed by Christ, when we are steadfastly persuaded, that God does impute, apply and give it unto us, and for it reputes us for just, absolving us from all guilt… That which we have now spoken of both applications, both God’s, and ours, does manifestly show what is meant in this place by justifying: Which is, that, to justify, is not to make one just who is uniust: but to repute him for just and righteous who is uniust, and to absolve the unjust and unrighteous from all guilt, and not to punish him, and this for another’s justice and righteousness imputed by faith unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 4 What is our iustice &amp; 5 How Christ’s satisfaction is made our justice and righteousness, pp. 680-82</span></figcaption>

<blockquote><p>How faith is a condition. XI. As to the former, when we say that faith is a condition of the covenant, we do not mean it absolutely and according to its nature and essence… Rather it must be considered relatively and instrumentally, inasmuch as it embraces Christ and applies to Him for righteousness and through him obtains the right to eternal life. First, it is distinguished from the works of the law (which could not be done if it were taken absolutely because thus it is a work of the law)… Therefore it [being a condition] cannot be ascribed to faith materially (inasmuch as it is a work), but instrumentally (inasmuch as it is the hand apprehending).</p></blockquote>

<blockquote><p>As this is a great error [to mingle law and gospel], so it is a very dangerous error. If a man attempts to add any works of his own to the consummate righteousness of Jesus Christ as the ground of his justification before God, Christ profits him nothing. The obedience and death of Christ have “become of no effect” to him. “Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing. For I testify again to every man that is circumcised, that he is a debtor to do the whole law. Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace” (Gal. 5:2–4). If a man tries to connect his own performances with the righteousness of Jesus Christ for the pardon of his sins and the acceptance of his person as righteous in the sight of God, he deprives himself of all benefit from that perfect righteousness. If he relies on his own works of obedience for even the smallest part of his title to eternal life, “he is a debtor to do the whole law” in its covenant form, and he fixes himself under the dreadful curse of it. Christ will profit him nothing unless he relies on His infinitely glorious righteousness only for all his title to justification and eternal life. A sinner depends on the righteousness of Christ for justification to no good purpose if he does not rely on it only, and neither in whole nor in part on his own obedience.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As this is a great error [to mingle law and gospel], so it is a very dangerous error. If a man attempts to add any works of his own to the consummate righteousness of Jesus Christ as the ground of his justification before God, Christ profits him nothing. The obedience and death of Christ have “become of no effect” to him. “Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing. For I testify again to every man that is circumcised, that he is a debtor to do the whole law. Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace” (Gal. 5:2–4). If a man tries to connect his own performances with the righteousness of Jesus Christ for the pardon of his sins and the acceptance of his person as righteous in the sight of God, he deprives himself of all benefit from that perfect righteousness. If he relies on his own works of obedience for even the smallest part of his title to eternal life, “he is a debtor to do the whole law” in its covenant form, and he fixes himself under the dreadful curse of it. Christ will profit him nothing unless he relies on His infinitely glorious righteousness only for all his title to justification and eternal life. A sinner depends on the righteousness of Christ for justification to no good purpose if he does not rely on it only, and neither in whole nor in part on his own obedience.”

— John Colquhoun, A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 128. Emphasis Added.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+this+is+a+great+error+%5Bto+mingle+law+and+gospel%5D%2C+so+it+is+a+very+dangerous+error.+If+a+man+attempts+to+add+any+works+of+his+own+to+the+consummate+righteousness+of+Jesus+Christ+as+the+ground+of+his+justification+before+God%2C+Christ+profits+him+nothing.+The+obedience+and+death+of+Christ+have+%E2%80%9Cbecome+of+no+effect%E2%80%9D+to+him.+%E2%80%9CBehold%2C+I+Paul+say+unto+you%2C+that+if+ye+be+circumcised%2C+Christ+shall+profit+you+nothing.+For+I+testify+again+to+every+man+that+is+circumcised%2C+that+he+is+a+debtor+to+do+the+whole+law.+Christ+is+become+of+no+effect+unto+you%2C+whosoever+of+you+are+justified+by+the+law%3B+ye+are+fallen+from+grace%E2%80%9D+%28Gal.+5%3A2%E2%80%934%29.+If+a+man+tries+to+connect+his+own+performances+with+the+righteousness+of+Jesus+Christ+for+the+pardon+of+his+sins+and+the+acceptance+of+his+person+as+righteous+in+the+sight+of+God%2C+he+deprives+himself+of+all+benefit+from+that+perfect+righteousness.+If+he+relies+on+his+own+works+of+obedience+for+even+the+smallest+part+of+his+title+to+eternal+life%2C+%E2%80%9Che+is+a+debtor+to+do+the+whole+law%E2%80%9D+in+its+covenant+form%2C+and+he+fixes+himself+under+the+dreadful+curse+of+it.+Christ+will+profit+him+nothing+unless+he+relies+on+His+infinitely+glorious+righteousness+only+for+all+his+title+to+justification+and+eternal+life.+A+sinner+depends+on+the+righteousness+of+Christ+for+justification+to+no+good+purpose+if+he+does+not+rely+on+it+only%2C+and+neither+in+whole+nor+in+part+on+his+own+obedience.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+and+Gospel+%28Grand+Rapids%3A+Reformation+Heritage+Books%29%2C+128.+Emphasis+Added.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb304bdf8c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../ </figure><figure class="quote" id="q-0302ebf39b" data-kw="">
<blockquote><p>When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. When we say by faith only, this opposes all other graces of the same order, but not the merits of Christ or the efficacy of God’s grace; the apostle, Rom. 4, makes it all one to prove a man justified by grace, Christ and by faith. It is to be considered as alone in the act of justification, but not in the subject justified; therefore that is a reproach cast on Protestants to call them Solifidians.</p></blockquote>

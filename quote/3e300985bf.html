<main class="wrap"><figure class="quote" id="q-3e300985bf" data-kw="">
<blockquote><p>A distinction after some work of the mind (distinction of reason, logical distinction, mental distinction) is a lack of identity that arises from an operation of the mind, whether with or without a foundation in the thing. Such a distinction flourishes between several concepts of one and the same reality and it is acquired insofar as the mind conceives the same thing according to diverse and distinct concepts each one of which represents the whole reality, but partially and not totally. The concepts are distinct and diverse but incomplete and inclusive. This distinction is either: A. with a foundation in the thing (a distinction of reasoned reason, intentional or virtual distinction), if from the real diversity of the effect that arises from one and the same formal cause the intellect has a reason or a foundation for distinguishing diverse respects in the cause itself. So in the light of the sun, for instance, there is a distinction between the powers of heating, illumining, and liquefying; in the human intellect there is a distinction between the faculties of conceiving, judging, and reasoning. B. without a foundation in the thing (distinction purely mental, distinction of reasoning reason) if the reason for distinguishing is not found in the thing but in some being of reason, for instance the distinction between man and humanity, or between ‘man’ and ‘man’s’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, ‘On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-77bbf58820" data-kw="">
<blockquote><p>As domestic society is by nature’s instinct, so is civil society natural, in radice, ‘in the root’, and voluntary, in modo, ‘in the manner’ of coalescing. Politic power of government agrees not to man, singly, as one man, except in that root of reasonable nature; but supposing that men be combined in societies, or that one family cannot contain a society, it is natural that they join in a civil society, though the manner of union in a politic body, as Bodine says, be voluntary, Gen. 10:10; 15:7 and Suarez says (tome 1, On Laws, bk. 3, ch. 3), That a power of making laws is given by God as a property flowing from nature, Qui dat formam, dat consequentia ad formam, Not by any special action or grant different from creation; nor will he have it to result from nature while men be united into one politic body: which union being made, that power follows without any new action of the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (London: Field, 1644), Question 2, ‘Whether or not government be warranted by the Law of nature’, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

 Online</a></div>
</figure><figure class="quote" id="q-badf2ca8b8" data-kw="">
<blockquote><p>Spiritual substance is distinguished from matter by the characteristic of self-motion, or motion ab intra [from inside]. Matter must be moved from without, by another material substance impinging upon it. But mind moves from within. Its motion is not from external impact, but is self-motion. Adam was created a spirit. The instant, therefore, that he was created, he had all the characteristics that distinguish spirit from matter. One of these, and one of the most important, is self-motion. But self-motion is self-determination, and self-determination is inclination. The Scripture asserts that Adam was created a ‘living soul.’ Life implies motion; and the motion in this case was not mechanical or material, but the motion of mind. Thus in creating a rational spirit, God creates a self-moving essence, and this is a self-determining will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (NY: Charles Scribner’s Sons, 1888), vol. 2, ch. 2, ‘Man’s Primitive State’, p. 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-69092f7def" data-kw="">
<blockquote><p>Man is a personal body created in God’s image. The Bible makes quite clear that man’s hope is in resurrection of the body, not release from the body (John 2:19-22; Lk. 24:40; Rom. 8:23; 1 Cor; 15:3-4, 44, 48-49; 2 Cor. 5:1-5; Isa. 26:19; 66:22-23; Dan. 12:2). Moreover, it is embodied existence which is the criterion of future judgment (2 Cor. 5:10; Heb. 9:27). We may not know all the answers with respect to the intermediate state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/greg-bahnsen.html">Greg Bahnsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Mind / Body Problem in Biblical Perspective’</cite>, (Covenant Media Foundation, 1972) 10 pp. | Yet Bahnsen is seriously weak on death and the intermediate state (if his view can even adequately explain these things, which it is not clear it can):</span></figcaption>

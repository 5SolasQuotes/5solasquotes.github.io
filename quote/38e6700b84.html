<main class="wrap"><figure class="quote" id="q-38e6700b84" data-kw="" data-pol="">
<blockquote><p>For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.</p></blockquote>
<figcaption>— <a href="../authors/william-whitaker.html">William Whitaker</a>, <cite>A Disputation on Holy Scripture</cite>, Question III, ch. 10</figcaption>

<figcaption>— <a href="../authors/william-s-plumer.html">William S. Plumer</a>, <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Special Kindness of Providence Towards Godly Men”</figcaption>

</figure><figure class="quote" id="q-22b111434a" data-kw="" data-pol="">

<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 1.1, 1.6</figcaption>

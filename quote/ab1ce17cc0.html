<main class="wrap"><figure class="quote" id="q-ab1ce17cc0" data-kw="">
<blockquote><p>For there be some errors in light things, not fundamental in religion, upon which a separation may happen, by the pride and pertinacy of some pastors, even of them that are orthodox: As the error of the Quartadecimani, who celebrated the feast of Easter precisely upon the fourteenth day of the moon of March; for which cause Victor, bishop of Rome, separated himself from their communion; wherein, although the error was on their side, yet the schism was on Victor’s side, and he was more guilty than they… For no doubt but that such separations commonly happen by the ambition of the pastors that lead the people, who groan under that yoke, and desire concord, grieving for the separation. Yea it may happen that both the Churches that forsake their mutual communion are both in the wrong. It may happen also, that the party that hath the truth on his side, is cause of the schism, by the harshness, or ambition, or want of charity of them that govern. As when two brothers are quarrelling, they are brothers nevertheless: So it is possible that two dissenting churches will be nevertheless members of the same body, in God’s account, whose wisdom is not obnoxious to our violence… I could wish also that a man should not be pronounced an heretic that is ignorant of some article of Faith by a simple and negative ignorance, such as is that of infants; not by an obstinate ignorance, which arms itself with reasons against the truth. Thus the apostles were at first ignorant of the resurrection, and were not heretics for that. I wish also that an error be not presently called an heresy, when it is about a light thing, not about the fundamentals of Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, … (London: White, 1662), bk. 1, ch. 7, pp. 14-15</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3df12a43cc" data-kw="">
<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors</cite>, ... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ity%20of%20Church%2Dsocieties&amp;text=And%20I%20make%20no%20doubt%20but%20some%20opinions&amp;text=and%20seasonable%20use%20to%20the%20tranquillity%20of%20Church%2Dsocieties" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-amos-comenius.html">John Amos Comenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Labyrinth of the World &amp; the Paradise of the Heart</cite>, ed. and tr. Count Lutzow (1623; Dent, 1905) 306 pp., p. 23</span></figcaption>

is+Age+%26+of+Posterity%2C+or%2C+The+Copies+of+Certain+Letters+Written+by+Mr.+John+Dury+to+a+Worthy+Knight+at+his+Earnest+Desire%2C+Showing+Briefly+what+a+Public+Good+is+%26+how+by+the+best+Means+of+Reformation+in+learning+%26+religion+it+may+be+Advanced+to+Some+Perfection+%281642%29+50+pp.+Giles+Firmin+%E2%80%93+Separation+Examined%3A+or+a+Treatise+wherein+the+Grounds+for+Separation+from+the+Ministry+%26+Churches+of+England+are+weighed+and+found+too+light%E2%80%A6+Also+an+humble+request+presented+to+the+congregational+divines%2C+that+since+the+differences+between+them+and+the+classical+%5Bpresbyterial%5D-divines+are+very+small%2C+they+would+please+to+strike+in+with+the+classical-divines+in+carrying+on+the+work+of+reformation%E2%80%A6+%28London%3A+R.I.%2C+1652%29+111+pp.+Firmin+%281614%E2%80%931697%29+was+a+puritan+English+minister+who+appeared+to+lean+congregationalist%2C+but+could+submit+to+episcopacy+and+presbyterianism.+He+actively+promoted+Baxter%E2%80%99s+model+of+persons+of+different+persuasions+in+Church+government+uniting+in+a+consensus+practice+%28as+Phil.+3%3A15-16+says+Christians+ought+to+do%29.+Firmin+was+ejected+in+the+Great+Ejection+of+1662.+Baxter%2C+Richard+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29+145+pp.+ToC+See+the+second+part+of+this%2C+%E2%80%98An+Explication+of+some+Passages+in+the+foregoing+Propositions..+with+an+Answer+to+some+Objections%E2%80%99+at+EEBO.+For+background+to+Baxter%E2%80%99s+paradigmatic+and+influential+association+of+moderates+of+the+differing+parties+for+the+sake+of+the+Gospel+and+pastoral+work+%28during+a+political+and+ecclesiastical+vacuum%29%2C+and+the+other+similar+associations+which+were+modeled+after+it%2C+see+Tim+Cooper%2C+When+Christians+Disagree%3A+Lessons+from+the+Fractured+Relationship+of+John+Owen+and+Richard+Baxter+%28Crossway%2C+2024%29%2C+pp.+23%2C+91-92%2C+104.+For+the+creedal+Profession+and+20+Propositions+of+the+discipline+of+the+Association%2C+typed+out%2C+see+below.+See+also+%E2%80%98A+Brief+Explication+of+Some+Passages+in+the+Profession%E2%80%99.+%E2%80%98An+Explication+of+Some+Passages+in+the+Propositions%E2%80%99+gives+a+lot+more+of+the+philosophy+of+the+whole.+Cooper%3A+%E2%80%9CEngland+had+a+divided+church.+Even+among+puritans%2C+fault+lines+had+visibly+widened+under+the+pressure+of+the+civil+war+and+its+aftermath.+After+his+own+traumatic+experience+of+the+war%2C+Baxter+longed+for+order+and+peace%2C+and+he+developed+a+lifelong+yearning+to+bring+Christians+together+in+unity.+He+identified+four+main+parties+within+the+English+church+%28Congregationalists%2C+Episcopalians%2C+Erastians%2C+and+Presbyterians%29%2C+but+he+felt+that+the+moderates+within+each+party+held+similar+views+and%2C+more+importantly%2C+could+work+together+in+practice+even+if+their+principles+varied.+He+believed+that+if+England%E2%80%99s+ministers+simply+got+on+with+the+work+of+ministry%2C+they+would+be+too+busy+to+notice+how+their+differing+doctrines+of+church+government+might+otherwise+keep+them+apart.+So+he+formed+the+Worcestershire+Association%2C+a+network+open+to+local+parish+ministers+of+all+stripes+who+met+monthly+for+the+purpose+of+mutual+edification+and+encouragement.+In+1653+they+published+their+agreement+to+work+together%2C+and+similar+ministerial+associations+sprang+up+in+other+counties.%E2%80%9D%0A%0A%E2%80%94+John+Amos+Comenius%2C+The+Labyrinth+of+the+World+%26+the+Paradise+of+the+Heart+ed.+and+tr.+Count+Lutzow+%281623%3B+Dent%2C+1905%29+306+pp.%2C+p.+23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f4649e9c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f4649e9c9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=During%20his%20formative%20years%2C%20while

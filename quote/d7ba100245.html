<blockquote><p>(4) Wilfully. Christ comes and stands; He stands and knocks. Why does He not enter? Why, you will not open. He stands, He is ready to take possession; why is He yet without? Why, you will not give it Him. If Christ did not stand, did not knock, you might pretend a better reason why ye do not open. But when He stands ready to enter, what can be alleged why he is not admitted, but because you will not open?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works</cite>, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100, p. 61</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e19224ab05" data-kw="">
<blockquote><p>It will be seen, then, that the doctrine of the irresistibility, or insuperability, of divine grace in conversion is a necessary consequence of scriptural views of man’s entire depravity, and his inability by nature to will anything spiritually good; and that all that Calvinists intend to set forth in maintaining this doctrine, is declared when they assert that it is necessary that men’s will be renewed, and that, in the commencement of the process by which this renovation is effected, they are wholly passive,—incapable of co-operating with divine grace, or with the Holy Spirit operating upon them, until He has, by His own almighty power, effected an important change upon them. This change is sometimes called regeneration, when that word is taken in its most limited sense, as distinguished from conversion [the exercise of faith in Christ and repentance]; and, in that case, regeneration means the first implantation of spiritual life,—the process of vivification, or making alive,—while conversion describes the process by which men, now quickened and renewed,—no longer passive, but active,—do willingly turn to God, and embrace Jesus Christ as all their salvation and all their desire; and the whole is comprehended under the designation of effectual calling, which includes the whole work of the Spirit, in applying to men the blessings which Christ purchased, and in effecting that important change in their condition and character which is, in every instance, indispensable to salvation. An essential part of this process is the renovation of the will, or the giving it a new capacity or tendency,—a power of willing what is spiritually good,—whereas before it could will only what was spiritually evil. And it is important to have our attention directed to this feature in the process, as it is that right views of which most directly oppose and exclude Arminian errors upon this subject. In the description of effectual calling, given in the [Westminster] Shorter Catechism, it is said to be “a work of God’s Spirit, whereby, convincing us of sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He does persuade and enable us to embrace Jesus Christ freely offered to us in the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 2, 1862, reprinted Banner of Truth, 1994, Ch. 25, The Arminian Controversy, Section 6, Efficacious &amp; Irresistible Grace, pp. 411-12</span></figcaption>

<blockquote><p>9. There must be a satisfaction with the terms of the gospel, and the heart must actually close with Christ, as He is offered in the gospel. The heart must open to Him, and take Him in, Rev. 3:20. The soul must embrace and receive Him, John 1:12. The man must take Him, as his Lord and Master King, Priest and Prophet; must give up himself to Him as his Leader and Commander, and resolve to follow Him in all things, and thus close a bargain with Him. … 8. That, as to them, all Christ’s entreaties, motives, allurements, patience and long suffering, his standing at the door and knocking, till his locks be wet with the dew, etc., are in vain: yea, they are contemptuously rejected, despised, slighted, and undervalued.</p></blockquote>

</figure><figure class="quote" id="q-d16b64007b" data-kw="">
<blockquote><p>The second way He presses it, verse 20, is, by a most instant and importunate pursuing of His offer, with a protestation of his being there, and of his making the same. This is done four ways;

1. By showing His work and posture, I stand at the door and knock. Hearts are naturally as castles shut and guarded by the Devil against Christ: When He comes with His ordinances, He does thereby, as it were, lay a siege at them, and by His word knock at the doors thereof to gain their consent; and the more pungently he presses by His ordinances, He is said to knock the more: And in this respect, Song 5:2, His voice is said to knock at the believer’s door in their sleepy condition. Here these two things are imported:

1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on.

2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.</p></blockquote>

1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on.

2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.”

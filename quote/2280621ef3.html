<blockquote><p>Ma. What is our duty to do, that we may come rightly to the Lord’s Supper?

Sch. To examine our selves, whether we be the true members of Christ.

Ma. By what tokens shall we know this?

Sch. First, if we heartily repent us of our sins. Next, if we stay our selves and rest in a sure hope of God’s mercy through Christ, with a thankful remembrance of our Redemption purchased by his death. Moreover, if we conceive an earnest mind, and determinate purpose to lead our life godly hereafter. Finally, seeing in the Lord’s Supper is contained a token of friendship and love among men, if we bear brotherly love to our neighbours, that is to all men, without any evil or hatred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>

<blockquote><p>Vers. 23. For I have received of the Lord that which also I delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread,

24. And when he had given thanks, he brake it, and said, Take, eat, this is my body which is broken for you: this do in remembrance of me.

That he may correct these errors; First he sets down the institution of the Sacrament, to vers. 27. and then he exhorts them to, and teaches them the lawful use of this Sacrament, to the end. As for the institution of the Supper, he shews that the Lord Jesus being about to suffer, by way of Testament, set his seal to the Covenant of Grace, which by his mediation he entered into between God and the Church: Whereby the glorious memory of his death might be celebrated in the world, till his second coming, and might be delivered to the faithful, and being delivered, it might judicially confirm a right to his person, and the benefits of his sufferings, and a living virtue flowing from his death, resurrection, and exaltation, to the sanctification and salvation of Believers, and that by the symbols of this holy Banquet, and holy Communion with God, and amongst themselves.

To which end Christ sitting at Table with his Disciples, after the eating of the Paschal Lamb; First, Took Bread, and sanctified it by giving of thanks, brake, and gave it to his Disciples, commanding them to take and eat; further, he declared the Bread received and eaten, to be his body represented after a Sacramental manner, that it being given for our Redemption, and after a judicial manner, applied to us; and lastly, he commanded that his Disciples, or all the faithful should imitate this his action in the Church, in remembrance of him, who had paid the price of Redemption by the sufferings of his body.

Vers. 25. After the same manner also he took the Cup, when he had supped, saying, This Cup is the New Testament in my blood: this do you, as oft as ye drink it, in remembrance of me.

That which concerns the other part of the Supper follows: In the same Supper, (viz. after the Paschal Supper) when the Bread was distributed, Christ took the Cup with Wine, sanctified by the giving of thanks, gave it to the Disciples to drink; further concerning the Cup he declared, That it being taken and drunk, was that new Covenant of Grace, between God and the Church, established Sacramentally by his blood, i. e. As it is ratified on God’s part that gives, so it is confirmed on the believers part that receives, and judicially applied and sealed: Lastly, He commanded that his Disciples should frequently imitate him in this action, in remembrance of him, who had paid the price of Redemption for the Church by the shedding of his blood.

Vers. 26. For as often as ye eat this Bread, and drink this Cup, ye do shew the Lord’s death till he come.

And that we might acknowledge, that of two Elements, Bread and Wine, one Supper (frequently to be celebrated in the Church) ought to be made; the Apostle would have perpetuated in the Church, a public commemoration of our Lord’s death, by the often reiteration of this Sacrament, and that because Christ would not be present in his body with the Church, before the last judgement, by this Sacrament he would that the memorial of the Churches redemption, by his death, might be preserved and celebrated, until he come out of Heaven in the last day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 58-59.</span></figcaption>

<blockquote><p>And let them not here allege, That I am deceived in the opinion that I have of the substance of the Eucharist. For the question is not, whether the Eucharist be bread or not, (this should be disputed apart) but whether he who believes that it is bread in substance, can adore it, without making himself guilty of Sacrilege, and giving a creature that honour which is due to the Creator.

For if one should grant, That he cannot (which we now are coming to demonstrate from the premises very evidently) I have gained the point that I intended to prove: it being clear, that this supposeth We have had reason to separate from Rome, seeing we believe that the Eucharist is bread in substance; it being impossible for us to yield to that worship, which she desires we should give it, unless we give to a creature that, which we are bound to give only to the Creator. Whence all the odious question concerning schism is ended.

For we call that schism, which is a separation made without necessity. So that when my conscience forbids me under pain of God’s wrath, and my own damnation, to obey that which you command me in this particular, ’tis evident, that it is not fancy, pleasure, or faction, but a pure necessity that constraineth me to separate from you. If you cannot tax this my opinion, much less can you condemn my separation.

Accuse me if you please of stupidity, For not being able to conceive, how a body that is in heaven can be at the same time in a thousand places on earth; how all the quantity of a complete man can be brought within one single point; how a thing, that my sense and reason knoweth to be bread, and the H. Scripture calleth oftentimes bread, can not be bread at all for all this; but the very Creator of the world.

Blame as much as you please the dullness of my spirit, that cannot comprehend a whit of these pretended mysteries. But once presuppose my belief to be true, and then you cannot shew me wherein I do amiss in separating from you. At this time ’tis sufficient, that I have shown, that our separation is not contrary to charity, which obligeth no man to embrace that, in favour or love of his neighbour, which he believes disagreeable to God’s will, and pernicious to his own soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 31-32.</span></figcaption>

B+how+a+thing%2C+that+my+sense+and+reason+knoweth+to+be+bread%2C+and+the+H.+Scripture+calleth+oftentimes+bread%2C+can+not+be+bread+at+all+for+all+this%3B+but+the+very+Creator+of+the+world.%0A%0ABlame+as+much+as+you+please+the+dullness+of+my+spirit%2C+that+cannot+comprehend+a+whit+of+these+pretended+mysteries.+But+once+presuppose+my+belief+to+be+true%2C+and+then+you+cannot+shew+me+wherein+I+do+amiss+in+separating+from+you.+At+this+time+%E2%80%99tis+sufficient%2C+that+I+have+shown%2C+that+our+separation+is+not+contrary+to+charity%2C+which+obligeth+no+man+to+embrace+that%2C+in+favour+or+love+of+his+neighbour%2C+which+he+believes+disagreeable+to+God%E2%80%99s+will%2C+and+pernicious+to+his+own+soul.%E2%80%9D%0A%0A%E2%80%94+Jean+Daill%C3%A9%2C+An+apology+for+the+Reformed+churches+wherein+is+shewed+the+necessity+of+their+separation+from+the+Church+of+Rome%3A+against+those+who+accuse+them+of+making+a+schism+in+Christendom%2C+trans.+Thomas+Smith+%28Cambridge%3A+University+of+Cambridge%2C+1653%29%2C+pp+31-32.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee07e90ee8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ee07e90ee8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/13/jean-daille-romes-idolatrous-view-of-eucharist-renders-her-schismatic/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>VIII. None but the faithful do truly eat Christ’s true flesh.

But albeit the flesh of Christ be offered unto all in the supper to be eaten, yet we believe that it is truly eaten of the faithful only, both because they alone have communion with Christ and with his flesh and blood, and others have not, neither by receiving the bread are made partakers of him, and also because they alone have the Spirit of Christ by virtue of whom only the flesh of Christ is truly communicated, yea, and also because they alone do bring true faith, without which the same cannot be truly received and eaten. For Christ giveth not his true body to be truly and indeed eaten, but only to them, which do as well believe that the same was betrayed for them unto death, and his blood shed for remission of their sins, as those words to be true: ‘This is my body.’</p></blockquote>

</figure><figure class="quote" id="q-02fc0c8db1" data-kw="institution words">
<blockquote><p>The reasons are various. First, here belong all those which have been adduced against the proper sense and transubstantiation, to which we add the following. (1) From the words of institution, which cannot admit that corporeal presence; both because Christ’s body is proposed in the Supper to us and represented by the sacramental signs as dead and his blood as poured out of his veins (in which manner it is impossible for Christ’s body to be made present to us at this day corporeally and indistantly [adiastatōs], since he can die no more); and because Christ commands us “to do this in remembrance of him” (Lk. 22:19).</p></blockquote>

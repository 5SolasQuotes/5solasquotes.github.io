<main class="wrap"><figure class="quote" id="q-55b3c85c6b" data-kw="">
<blockquote><p>XIII. A second rock to be avoided here is Eutychianism… who… confounded the two natures into one… one nature is neither changed nor converted by the hypostatical union into the other. Nor are the natures so confounded or mixed with each other that each of them does not retain its own properties and conditions. XIV. The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6-7, 11); (2) two wills are ascribed to Him (‘not my will, but thine, be done,’ Lk. 22:42). Nor does it follow that there are two [persons] willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will. (3) Contraries are ascribed to Christ, which could not be if there were not two natures in Him (as that He would depart from the world and remain with us forever; that a child was born, who is the Father of eternity; that He suffered death and was made alive; in the form of God and in the form of a servant, etc.). XV. Although the efficient cause of the operations of Christ is one alone, still the exciting cause is twofold–the divinity and humanity. The work upon which both exciting (egergema) causes exert their power is one, but the action (energeia) is twofold.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 2, 13th Topic, Q. 7, ‘Was the hypostatical union of the two natures of Christ such that neither the person is divided nor the natures confounded? We affirm against Nestorius &amp; Eutyches.’</cite>, pp. 320-21</span></figcaption>

</figure><figure class="quote" id="q-72f383c48f" data-kw="">
<blockquote><p>Natural self is to be denied as well as corrupt self, as appears by the example of Christ, who had no corrupt self to deny, and yet ’tis said, Rom. 15:3, ‘He pleased not Himself.’ Christ had an innocent natural will, by which He loved his natural life and peace; ‘Father let this cup pass.’ But He submitted it to God; ‘Not my will, but thine be done,’ Mt. 26:39. Therefore we also must not only deny self as corrupted by sin, but self as separate from God. How else shall we submit to God in these things wherein He may lay a restraint upon us, or put us to trial about them, whether we love them in order to Him, they being things which otherwise we may affect. And besides, to love any thing apart from God, and to seek it apart from God and rejoice in it apart from God, without any reference and respect to God, is to make the creature the last end, in which the action terminates, which is an invading of God’s prerogative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew... (London: Robinson, 1684), Sermons on 2 Cor. 5, sermon 29, on 2 Cor. 5:15</cite>, p. 184</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>
<div class="actions"><button class="copy" data-copy="“Natural self is to be denied as well as corrupt self, as appears by the example of Christ, who had no corrupt self to deny, and yet ’tis said, Rom. 15:3, ‘He pleased not Himself.’ Christ had an innocent natural will, by which He loved his natural life and peace; ‘Father let this cup pass.’ But He submitted it to God; ‘Not my will, but thine be done,’ Mt. 26:39. Therefore we also must not only deny self as corrupted by sin, but self as separate from God. How else shall we submit to God in these things wherein He may lay a restraint upon us, or put us to trial about them, whether we love them in order to Him, they being things which otherwise we may affect. And besides, to love any thing apart from God, and to seek it apart from God and rejoice in it apart from God, without any reference and respect to God, is to make the creature the last end, in which the action terminates, which is an invading of God’s prerogative.”

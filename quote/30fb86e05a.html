<main class="wrap"><figure class="quote" id="q-30fb86e05a" data-kw="">
<blockquote><p>Section 5. Note that things not determined of God [for public worship] and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous. A superior may not institute a superfluous thing that is not simply evil, though sometimes the inferior may lawfully obey therein; or to speak more properly, [the inferior may] lawfully do the thing to avoid inconvenience, or to testify respect to the superior, though in that particular he has no lawful power to command. Note also, that of things necessary in genere, the superior may not lawfully determine for such species, as, though not simply evil, may have a tendency to evil or be evil in the consequence, when he may determine that which will not be evil in the consequence. Yet the inferior may obey, or rather observe the thing commanded, when the evil consequence of non-observance will be greater than the evil consequence of observance. Section 6. If superiors command that which is above their sphere to command [for public worship], namely, things not necessary in genere [by its kind], yet if they be not simply evil, subjects may¹ do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be.² In this case it is not formal obedience,³ but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet</cite>, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Thomas Parkhurst, 1684), pt. 3 Corbet (d. 1680) was an English, congregationalist puritan.</span></figcaption>

<blockquote><p>Furthermore that must be observed: what kind of idolatry that is which saint Paul says may fall into a brother and yet he retain the name of ‘brother’. (1 Cor. 8, 10) This appears upon the discourse he makes in that epistle to have been only a sitting down to eat at the feast of idolaters, made in honor of their idols, without any honor done to idols by sacrifice or bodily worship, and without any conscience of that meat more than of other. Which although he prove a species of idolatry: yet was that one of the least and lightest kinds, and such as holding still the foundation of Christianity, could not without obstinacy in it, cut [him] from the church. Whereby [it] falls out that the papists, which in their idolatry raze the foundations of true religion, cannot, by that place, come into any account of the church of God.</p></blockquote>

<blockquote><p>40. I have before proved how faulty the priests’ calling was in Christ’s time, and the Temple and synagogue worship, and the Pharisees’ long liturgies, on pretence whereof they devoured widows’ houses, and their corrupt doctrine, and how great the faults were in the Churches of Corinth, Galatia, Ephesus, Sardis, Laodicea, Thyatira, Pergamos [Rev. 2-3], and those that James wrote to, from which none were commanded to depart;¹ And to condemn Christ or his apostles as favoring or using sinful communion is worse in Christians than it was in the Pharisees.</p></blockquote>

</figure><figure class="quote" id="q-3b7d563a92" data-kw="">
<blockquote><p>Because, whereas the ministers are willing to reform abuses, and the magistrate is peremptory and resolute not to reform for some reasons of policy, the minister in that case is not to leave his ministry, or to trouble the Church, intempestiuis clamoribus, or to contest or contend with the magistrate: The reason is, because this course tends to the overthrow of the Church, and is opposite to that charity which he owes unto Christ and to his church, out of which ground and rule he ought to preach, and to hold on in the course of his ministry. He ought indeed to teach publicly and privately (as the matter requires) what is to be done, but this he must perform without sedition and troubling of the Church, but peaceably and discreetly. Charity will inform the pastor, if he love the Church indeed, how he ought in these cases to behave himself; Zanchi, On Philippians 1, fol. 45. Look also: Musculus, loc. pt. 2, Of Traditions, §6, fol. 31. …Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it; Zanchi, ibid. … Because if pastors cannot reform all things which need amendment, according to their desire, they must not therefore cast away their ministry, or trouble the whole Church with an unusual asperity. The reason: Because all godly ground and form of ecclesiastical discipline ought ever to have respect and have reference to the unity of the Spirit in the bond of peace, which the apostle commanded to be kept by serving one another; and which rule not being kept, the medicine of discipline grows to be superfluous and pernicious. It is confessed that pastors ought with their uttermost endeavors to labor that there remain no corruption in the Church: but they must use that wisdom which our Savior prescribes, lest by plucking up the tares, they hurt the good corn. Wherefore the precept of the apostle of separating the evil (or of mending corruption) must by no means be neglected, cum sine periculo violandae pacis fieri potest, when it may be done without the danger of violation of the Churches’ peace: for else He would not have it done. Calvin, Institutes, bk. 4, ch. 12, §11, 13.</p></blockquote>

— John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’, pp. 166-67">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause%2C+whereas+the+ministers+are+willing+to+reform+abuses%2C+and+the+magistrate+is+peremptory+and+resolute+not+to+reform+for+some+reasons+of+policy%2C+the+minister+in+that+case+is+not+to+leave+his+ministry%2C+or+to+trouble+the+Church%2C+intempestiuis+clamoribus%2C+or+to+contest+or+contend+with+the+magistrate%3A+The+reason+is%2C+because+this+course+tends+to+the+overthrow+of+the+Church%2C+and+is+opposite+to+that+charity+which+he+owes+unto+Christ+and+to+his+church%2C+out+of+which+ground+and+rule+he+ought+to+preach%2C+and+to+hold+on+in+the+course+of+his+ministry.+He+ought+indeed+to+teach+publicly+and+privately+%28as+the+matter+requires%29+what+is+to+be+done%2C+but+this+he+must+perform+without+sedition+and+troubling+of+the+Church%2C+but+peaceably+and+discreetly.+Charity+will+inform+the+pastor%2C+if+he+love+the+Church+indeed%2C+how+he+ought+in+these+cases+to+behave+himself%3B+Zanchi%2C+On+Philippians+1%2C+fol.+45.+Look+also%3A+Musculus%2C+loc.+pt.+2%2C+Of+Traditions%2C+%C2%A76%2C+fol.+31.+%E2%80%A6Wherefore+many+things+are+to+be+tolerated+by+the+ministers+that+the+peace+of+churches+be+not+rent+and+that+schisms+may+be+avoided%2C+so+that+they+be+not+such+things+or+doctrines+which+do+fight+with+the+foundation+and+do+heave+at+it%3B+Zanchi%2C+ibid.+%E2%80%A6+Because+if+pastors+cannot+reform+all+things+which+need+amendment%2C+according+to+their+desire%2C+they+must+not+therefore+cast+away+their+ministry%2C+or+trouble+the+whole+Church+with+an+unusual+asperity.+The+reason%3A+Because+all+godly+ground+and+form+of+ecclesiastical+discipline+ought+ever+to+have+respect+and+have+reference+to+the+unity+of+the+Spirit+in+the+bond+of+peace%2C+which+the+apostle+commanded+to+be+kept+by+serving+one+another%3B+and+which+rule+

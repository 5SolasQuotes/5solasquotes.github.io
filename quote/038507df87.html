<main class="wrap"><figure class="quote" id="q-038507df87" data-kw="">
<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: … 2. The nexus which intervenes between knowledge and will also demands that what one knows with the consciousness of knowledge, he also acknowledge according to the dignity and goodness of the thing which he observes in it; to which, attending, an intellectual being also tends and is borne toward it as toward a good thing—which belongs to the will. But this has place much more and more eminently in God, whose intellect, the more perfect it is, so much the more distinctly represents to His most absolute thought the truth and goodness of things in their objects: which things, when He approves, He wills well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed… (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0902f1baa4" data-kw="">
<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions</cite>, pp. 560-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-91bd89865c" data-kw="">
<blockquote><p>(3) What encouragement a repenting returning sinner has to hope for pardon and life according to this promise… he has this to support himself with, that God’s nature, property, and delight, is to have mercy and to forgive, for He has said (Eze. 18:23): “Have I any pleasure at all that the wicked should die? No, by no means; you never had any cause given you to think so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible, on Ezekiel 18, vv. 21-29</cite></span></figcaption>

</figure><figure class="quote" id="q-21f5ef72eb" data-kw="">
<blockquote><p>Thus then is Christ made use of as the way to the Father in the point of justification when the poor weakened sinner, convinced of his sin and misery, of his own inability to help himself, of the insufficiency of all means beside Christ, of Christ’s all-sufficiency, readiness and willingness to help, of the equity and reasonableness of the conditions on which He is offered, and life through Him, is now content and fully satisfied with this way, actually renouncing all other ways whatsoever, and does with heart and hand embrace Jesus Christ and take Him as He is offered in the gospel to make use of Him for all things, to lean to Him and rest upon Him in all hazards; and particularly to refuge itself in his wings and to rest there with complacency, satisfaction and delight; and hide itself from the wrath of God and all accusations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Way the Truth &amp; the Life (1677), ch. 6, How Christ is Made Use of for Justification, as a Way</cite></span></figcaption>

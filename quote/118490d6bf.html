<main class="wrap"><figure class="quote" id="q-118490d6bf" data-kw="">
<blockquote><p>The next publick controversie which Satan hath raised to disturb the Churches, is about the practice of singing Scripture-Psalms, on purpose to deprive the Saints of the benefit of that soul-raising, and heart-ravishing Ordinance, by which God is publickly and solemnly praised, and the spirits filled with the glory of God …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of These Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), p. 175.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

— Cuthbert Sidenham, A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of These Times; Infant-Baptism and Singing of Psalms, (London: Robert White, 1654), p. 175.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+next+publick+controversie+which+Satan+hath+raised+to+disturb+the+Churches%2C+is+about+the+practice+of+singing+Scripture-Psalms%2C+on+purpose+to+deprive+the+Saints+of+the+benefit+of+that+soul-raising%2C+and+heart-ravishing+Ordinance%2C+by+which+God+is+publickly+and+solemnly+praised%2C+and+the+spirits+filled+with+the+glory+of+God+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Cuthbert+Sidenham%2C+A+Christian%2C+Sober+%26+Plain+Exercitation+on+the+Two+Grand+Practical+Controversies+of+These+Times%3B+Infant-Baptism+and+Singing+of+Psalms%2C+%28London%3A+Robert+White%2C+1654%29%2C+p.+175.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F118490d6bf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/118490d6bf.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/02/13/cuthbert-sidenham-on-satans-opposition-to-psalm-singing/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-edb6dbde66" data-kw="">
<blockquote><p>‘Sing to the Lord, O ye his saints.’ Not if someone utters the words of the psalm with his mouth, does that one sing to the Lord; but, all who send up the psalmody from a clean heart, and who are holy, maintaining righteousness toward God, these are able to sing to God, harmoniously guided by the spiritual rhythms.

How many stand there, coming from fornication? How many from theft? How many concealing in their hearts deceit? How many lying? They think they are singing, although, in truth they are not singing. For, the Scripture invites the saint to the singing of psalms. ‘A bad tree cannot bear good fruit.’ nor a bad heart utter words of life. Therefore, ‘make the tree good and its fruits good.’ Cleanse your hearts, in order that you may bear fruit in the spirit and may be able, after becoming saints, to sing psalms intelligently to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-basil.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 14 on Psalm 29</cite>, 3 in Saint Basil’s Exegetic Homilies, trans. Agnes Clare Way in The Fathers of the Church: A New Translation, Volume 46 (Washington DC, 1963), pp 217-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

How many stand there, coming from fornication? How many from theft? How many concealing in their hearts deceit? How many lying? They think they are singing, although, in truth they are not singing. For, the Scripture invites the saint to the singing of psalms. ‘A bad tree cannot bear good fruit.’ nor a bad heart utter words of life. Therefore, ‘make the tree good and its fruits good.’ Cleanse your hearts, in order that you may bear fruit in the spirit and may be able, after becoming saints, to sing psalms intelligently to the Lord.”

</figure><figure class="quote" id="q-4290caeba9" data-kw="">
<blockquote><p>Meanwhile, a certain Hilary, a Catholic layman of tribunitial rank, incited to anger, for some reason or other, against the ministers of God, as often happens, in abusive, censorious language, wherever it was possible, was violently attacking the custom which, at the time, had been introduced in Carthage, of singing hymns from the Book of Psalms either before the oblation or when what had been offered was being distributed to the people; he insisted that this should not be done. At the urging of my brethren, I answered him; the book is called Against Hilary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Retractations</cite>, (ch. 37), ed. Roy Joseph Deferrari, trans. Mary Inez Bogan, vol. 60, The Fathers of the Church (Washington, DC: The Catholic University of America Press, 1968), 140 (italics added).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-2feedc2893" data-kw="">
<blockquote><p>Mr. Flavel after this, returned to Dartmouth, where with his family and dear people he blessed God for his mercies towards him. He was in a little time after confined close prisoner to his house, where many of his dear flock stole in over night, or betimes on the Lord’s Day in the morning, to enjoy the benefit of his labors, and spend the sabbath in hearing, praying, singing of psalms, and holy discourses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, Life of Flavel, p. ix, vol. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-5d1d7cee19" data-kw="">
<blockquote><p>Psalms are song by emperors; the common people rejoice in them. Each man does his utmost in singing what will be a blessing to all. Psalms are sung in the home and rehearsed on the streets. The psalm is learned without labor and remembered with delight. Psalmody unites those who disagree, makes friends of those at odds, and brings together those who are out of charity with one another. Who could retain a grievance against the man whom he had joined in singing before God? The singing of praise is the very bond of unity, when the whole people join a single act of song.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition 9</cite>, trans. Erik Routley in The Church and Music (London: Duckworth, 1950), 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<main class="wrap"><figure class="quote" id="q-a787f58d8f" data-kw="">
<blockquote><p>But yet let me freely tell you, that there is one step in Mr. Erskine’s conduct that I am not able to justify; it is, When the synod of Perth and Stirling resolved to give him a modest rebuke, he did not silently receive it. I should never have advised my worthy brother Mr. Erskine to have made any confession of a fault even in his expressions, when his conscience justified him in the same; but I cannot think that his silence at the time that either the synod or General Assembly rebuked him, when they resolved thereby to finish the process, would be construed an acknowledgment of a fault: I am sure that the history of our blessed Lord’s sufferings bears expressly, that, when He was accused of many things before Pilate, He answered nothing; and when he was urged by the self-condemned heathen judge, He still continued silent; and I am persuaded that no good Christian can allege that his silence did import any confession of a fault, yea, it was a fulfilling of the Scripture, Isa. 53:7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6fb58ae13f" data-kw="">
<blockquote><p>Beware of separating new lights; to separate from, or gather Churches out of the true reformed or reforming Churches, has not the least warrant from the Word of God: When we see this or that amiss in a Church we are bidden exhort one another, and provoke one another to good, but not to separate, Heb. 10:24-25. Zwingli conferred amicably with the Anabaptists in Zurich as with dissenting brethren; and no course was taken to suppress or restrain them by the secular power, till they grew to gather Churches out of the true reformed Churches: But when it came to that, they could not be suffered or forborne, it was thought necessary to restrain them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-1ae744ad4b" data-kw="">
<blockquote><p>And we must also add that whatever be their original and constitution, if all their governors were as the apostles, yet have they no power but what is for edification, and not for destruction; If they do or shall appoint and impose on men what tends unto the destruction of their souls, and not unto their edification, as it is fallen out in the Church of Rome; not only particular churches, but every individual believer is warranted to withdraw from their communion… Let none mistake themselves herein, believers are not made for churches, but churches are appointed for believers. Their edification, their guidance and direction in the profession of the faith and performance of divine worship in assemblies according to the mind of God, is their use and end; without which they are of no signification. The end of Christ in the constitution of his churches, was not the molding of his disciples into such ecclesiastical shapes, as might be subservient unto the power, interest, advantages and dignity of them that may in any season come to be over them; but to constitute a way and order of giving such officers unto them, as might be in all things useful and subservient unto their edification; as is expresly affirmed, Eph. 4:11-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Vindication of the Non-Conformists from the Charge of Schism… (1680)</cite>, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

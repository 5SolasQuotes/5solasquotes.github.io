<main class="wrap"><figure class="quote" id="q-9a6ca930c0" data-kw="">
<blockquote><p>…I intend not in this relation to set down all things which they [the New England churches] hold or practice in discipline or church-government, but such things only or for the most part, wherein there lies some difference between them and us, or other the best Reformed Churches. Neither do I intend to wrap up all and every one of the elders (much less members) of the New England churches in the same imputations: Forasmuch as it is most certain that though in practice they act generally all alike, yet in their opinion of things practiced, much more in the grounds and reasons thereof, some of them do not only differ from the rest but have stiffly opposed the rest therein, which I write to preserve the just repute of some eminent persons there from such censures and hard opinions as others of them, perhaps, may seem to merit and incur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers… (London, 1644) Rathband was a Westminster divine. | Preface</cite></span></figcaption>

oopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d81995a250" data-kw="">
<blockquote><p>First Argument [of Rutherford]: In the first receiving of members by the apostles, there was but a professed willingness to receive the Gospel, howbeit some received it not from the heart. Mr. Hooker answereth: ‘There was not only a professed willingness, but a practical reformation, that in the judgement of charity giveth grounds of hope that there is something real, before the contrary appear; Therefore, Peter who received Magus upon his approbation of the truth and outward conformity thereunto in the course of his life, rejected him as one in the gall of bitterness, who had no share in Christ, and therefore certainly would not suffer him in the privileges of communion, so persisting without repentance.’ [Rutherford’s] Answer 1: [Hooker says:] ‘Not professed willingness, but also practical reformation is required.’ But is not professed willingness in murderers of Christ, who said, ‘What shall we doe to be saved?’ some practical reformation? There is nothing but conjectures that the apostles did not admit all and every one of the three thousand until they had experience of their state of grace and judicially determined so of them all. ([Margin note:] Mr. Hooker neither proves, nor can prove that the apostles had habitual experience in so few hours, all and every one of the 3,000 (Acts 2) gave evidence of real conversion to the apostles.) (2). This practical reformation was not an experience of their practice of savory walking, required by Mr. Hooker (p. 1. ch. 2, pp. 14-15) in visible saints before admission, except some four or five hours time may create an habitual experience, for the same very day they were baptized (Acts 2:41). (3) Mr. Hooker should prove that the apostles found this practical reformation in all, Ananias, Saphira, and the whole 3000; and that the apostles tried and smelled the savouriness of saving grace in all; in Saphira; the text giveth not the least jot of this, we must take it upon the naked assertion of Mr. Hooker (4) That this practical reformation gave to the apostles’ judgement of charity ground of hope that there was something real, that is, the whole number, about three thousand (none excepted, for all were made Church-saints visible) gave grounds of hope that they were all really (otherwise their speaking and hearing the word was real, that is, not imaginary) internally and effectually called, and born over again of the spirit, and so chosen to life eternal from eternity, before the apostles durst, without the offending of God, admit them to Church-fellowship and visible communion; those [things] (I say) must be proven. If I durst [dare], I am not far from judging the godly and judicious in cold-blood, free of heat of dispute, dare not so judge of the text, Acts 2 or Acts 8. (5) There is no shadow, Acts 8, that Peter (Mr. Hooker should say Philip) admitted not Magus while he saw such grounds of the sorcerer’s real conversion and real predestination to glory. (6) Peter said that Magus had no share in Christ. True, but said he that he was an unbaptized man who had no share in the visible Church? No. (7) But he would not suffer Magus to share in the privileges of communion, he persisting without repentance. True, but it is no answer to the argument from the manner of receiving in, this is something to the casting out, (8) that Peter reproveth him in the gall of bitterness [and] 2. Exhorts him to repent, to pray for pardon, [these last two things] were great privileges of Church-communion bestowed upon Magus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14</cite>, pp. 56-57</span></figcaption>

</figure><figure class="quote" id="q-f72e0777f9" data-kw="">
<blockquote><p>For as a Relation unto a particular visible Church walking according to the Order and Rule of the Gospel, is the Duty of every Believer to give himself up unto; as that which is a means appointed and sanctified to the furtherance of his Edification and Salvation; so where it cannot be obtained through invincible outward Impediments, or is omitted through ignorance of Duty, or is on just Causes refused where opportunities make a tender of it; or where the being and benefit of it is lost through the Apostasie of those Churches whereunto any persons did belong, the utter want of it, and that alwayes, is not such as necessarily infers the eternal loss of their Souls who suffer under it.</p></blockquote>

</figure><figure class="quote" id="q-33602b5782" data-kw="">
<blockquote><p>If they be converted from heathens, they are not first converted into this or that particular church, but converted first into the Church catholic, and then secondarily admitted members of this or that particular congregation… They are made members of the whole, by conversion to the faith, and initiated by the sacrament of baptism externally, but are secondarily made members of a particular congregation, by cohabitation, or consociation. Suppose a man had abundance of sheep as Abraham, Isaac, Jacob, and Job, who had 14,000, and these sheep had all one brand of the owners upon them, and these sheep were divided into several flocks, under several shepherds, in several sheep-walks, of the same owners, according to his appointment: the primary consideration of any of these sheep or flocks is not that they are under such a keeper, in such a sheep walk, but the first consideration of them is that they are such a man’s sheep, either bought or bred etc. bearing his brand and fed by his servants, on his ground; and then the more particular and secondary consideration and notion is that they are under such a particular shepherd in such a particular walk. And so the first consideration of any part of Gods flock, whether person or congregation is that they are God’s people, born or converted to Him, fed and nourished by his ordinances and ministers, and then the particular secondary notion is that they are fed by such a pastor in such a place.</p></blockquote>

— Samuel Hudson, The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645), pp. 30-31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+they+be+converted+from+heathens%2C+they+are+not+first+converted+into+this+or+that+particular+church%2C+but+converted+first+into+the+Church+catholic%2C+and+then+secondarily+admitted+members+of+this+or+that+particular+congregation%E2%80%A6+They+are+made+members+of+the+whole%2C+by+conversion+to+the+faith%2C+and+initiated+by+the+sacrament+of+baptism+externally%2C+but+are+secondarily+made+members+of+a+particular+congregation%2C+by+cohabitation%2C+or+consociation.+Suppose+a+man+had+abundance+of+sheep+as+Abraham%2C+Isaac%2C+Jacob%2C+and+Job%2C+who+had+14%2C000%2C+and+these+sheep+had+all+one+brand+of+the+owners+upon+them%2C+and+these+sheep+were+divided+into+several+flocks%2C+under+several+shepherds%2C+in+several+sheep-walks%2C+of+the+same+owners%2C+according+to+his+appointment%3A+the+primary+consideration+of+any+of+these+sheep+or+flocks+is+not+that+they+are+under+such+a+keeper%2C+in+such+a+sheep+walk%2C+but+the+first+consideration+of+them+is+that+they+are+such+a+man%E2%80%99s+sheep%2C+either+bought+or+bred+etc.+bearing+his+brand+and+fed+by+his+servants%2C+on+his+ground%3B+and+then+the+more+particular+and+secondary+consideration+and+notion+is+that+they+are+under+such+a+particular+shepherd+in+such+a+particular+walk.+And+so+the+first+consideration+of+any+part+of+Gods+flock%2C+whether+person+or+congregation+is+that+they+are+God%E2%80%99s+people%2C+born+or+converted+to+Him%2C+fed+and+nourished+by+his+ordinances+and+ministers%2C+and+then+the+particular+secondary+notion+is+that+they+are+fed+by+such+a+pastor+in+such+a+place.%E2%80%9D%0A%0A%E2%80%94+Samuel+Hudson%2C+The+Essence+%26+Unity+of+the+Church%2C+catholic%2C+visible%3A+and+the+Priority+thereof+in+regard+of+Particular+Churches+Discussed+%28London%2C+1645%29%2C+pp.+30-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F33602b5782.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33602b5782.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=If%20they%20be%20converted%20from%20heathens,a%20pastor%20in%20such%20a%20place&amp;text=If%20they%20be%20converted%20from%20heathens%2C%20they%20are&amp;text=by%20such%20a%20pastor%20in%20such%20a%20place" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Profession of Christianity is every man’s Church-title. No man is to prove the sincerity of his own profession; nor may the Church require such proof at his hands; For how can a man prove to another the sincerity of his own heart? But the fuller testimony he gives of it, the better it is: And therefore none should refuse to make his own profession, as fully credible to the church as he is able; nor is the church to be blamed for enquiring after the fullest credibility, so be it they do it but ad melius esse [to the better existence], and not ad esse [to the existence of it]; not laying his title upon it, nor refusing him for want [lack] of it. But every profession as such is credible in some degree, which is not disproved. Because men are, under God, the only competent judges of their own hearts: and the belief of one another is the ground of human converse: And it is an injury to any man to account him a liar, without sufficient proof. He that will disprove a man’s profession must prove first that he does not tolerably understand what he says; secondly, or that he speaks not seriously, but in jest; or not voluntarily, but in hypocrisy by constraint, or for some by end: Thirdly, or that he contradicts his own words by some more credible words or deeds. And if you never yet thus disproved men’s profession of Christianity before the pastors of the church and yet cry out against the pastors for admitting them, you are not true reformers, but disorderly mutineers and peevish censurers in the Church of Christ. Christ’s orders and men’s right, and all church-justice, must not be trodden down and sacrificed to your humor and arbitrary way.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e430f5a8c3" data-kw="">
<blockquote><p>GOD, whose judgments no man can comprehend, whose ways cannot be found out, and whose will ought to stop all men’s mouths, according to the determinate and unchangeable purpose of his will, by the virtue whereof all things are made, yea even those things which are evil and execrable (not in that they be wrought by his divine counsel, but forasmuch as they proceed of the prince of the air, and that spirit which works in the children of disobedience) has determined from before all beginning with himself, to create all things in their time, for his glory, and namely men: whom he has made after two sorts, clean contrary one to the other.

Whereof he makes the one sort (which it pleased him to choose by his secret will and purpose) partakers of his glory through his mercy, and these we call according to the word of God, the vessels of honour, the elect, the children of promise, and predestinate to salvation: and the others, whom likewise it pleased him to ordain to damnation (that he might show forth his wrath and power, to be glorified also in them) we do call the vessels of dishonour and wrath, the reprobate and cast off from all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Totius Christianismi</cite>, trans. William Whittingham, rev. R. Scott Clark (Geneva, 1575; 2002), p. 4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebc535f853" data-kw="">
<blockquote><p>If this is the nature of the promises, let us now see whether there be any inconsistency between the two things--viz. that God, by an eternal decree, fixed the number of those whom he is pleased to embrace in love, and on whom he is pleased to display his wrath, and that he offers salvation indiscriminately to all. I hold that they are perfectly consistent, for all that is meant by the promise is, just that his mercy is offered to all who desire and implore it, and this none do, save those whom he has enlightened. Moreover, he enlightens those whom he has predestinated to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.24.17</span></figcaption>

</figure><figure class="quote" id="q-f59b161fb7" data-kw="">
<blockquote><p>2… When sinners shall consider they were in a fair way to the kingdom; they had a possibility of salvation; though the door of Heaven were strait, yet it was open; they had the means of grace; the jubilee of the gospel was proclaimed in their ears; God called but they refused; Jesus Christ offered them a plaister of his own blood to heal them, but they trampled it under foot; the Holy Spirit stood at the door of their heart knocking and crying to them to receive Christ and Heaven, but they repulsed the Spirit and sent away this Dove, and now they have, through their own folly and willfulness, lost the Kingdom of Heaven.</p></blockquote>

</figure><figure class="quote" id="q-b096402687" data-kw="">
<blockquote><p>Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful.</p></blockquote>

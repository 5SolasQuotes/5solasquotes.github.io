<main class="wrap"><figure class="quote" id="q-dea14f771e" data-kw="">
<blockquote><p>Judicial laws may be judicial and Mosaical, and so not obligatory to us, according to the degree and quality of punishment, such as in Deuteronomy 13, the destroying the city, and devoting all therein to a curse; we may not do the like in the like degree of punishment, to all that receive and defend idolaters and blasphemers in their city. And yet that some punishment by the sword be inflicted upon such a city, is of perpetual obligation; because the magistrate bears the sword to take vengeance on ill doers, and so on these that are partakers of his ill deeds, who brings another gospel, I John 5:10. . . . . Because the slaying of man, woman, infant, and suckling, ox and sheep, was temporary, and cannot have a perpetually obligatory ground in the law of nature or natural justice obliging us. . . . . No man but sees the punishment of theft is of common moral equity, and obligeth all nations, but the manner or degree of punishment is more positive: as to punish theft by restoring four oxen for the stealing of one ox, doth not so oblige all nations, but some other bodily punishment, as whipping, may be used against thieves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (London: R.I. for Andrew Crook, 1649), 298-99. Quoted in Sherman Isbell, “The Divine Law of Political Israel Expired: General Equity.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

uel-rutherford-contra-theonomy-on-general-equity/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c31eee4ece" data-kw="">
<blockquote><p>…to say [as the opponent does], that the Word teaches the Church to abstain from blood (Acts 15), is a part of the perfection of the Scripture, and yet the Scripture teaches that abstinence from blood, not as an eternal and unalterable Law, for we are not now tied to abstain from blood, therefore the Scripture may make the man of God perfect in some works that are alterable and changeable: This (I say) is no answer, for saying that God should now make abstinence from blood and things strangled indifferent (Acts 15), as He made them in that interval of time when the [Levitical] ceremonies were mortal [alive] but not deadly and unlawful, as is clear in that Paul circumcised Timothy (Acts 16:1-3), that rite being then indifferent; and yet he writes in another case when the Gospel is now fully promulgated, that to be circumcised makes a man a debtor in conscience to keep the whole Law of Moses, and so to abstain from eating of blood and things strangled must be a falling from the grace of Christ and an apostasy from the Gospel (Gal. 5:1-7). The like I say of observing of days (Rom. 14:5-6) which were indifferent and [yet] in another case (Gal. 4:9-10; Col. 2:16-17) [were] deadly, unlawful and not necessary. So the matter (Acts 15), which in the case of scandalizing the weak, is abstinence from things indifferent, say ‘that they are indifferent’ binds as a perpetual law to the end of the world, and binds us this same very day (Rom. 14:20) in the morality of it, as abstinence from murdering one for whom Christ died, (Rom. 14:15; 1 Cor. 8:12-13; 1 Cor. 10:26-28). And upon the ground laid by prelates, which is most false and untrue, to wit, that many positive things in Church government, such as are [by] prelates deemed to be warranted by apostolic, though not by Divine, right: ceremonies and crossing, kneeling to bread, altars, surplice, rochet, corner-cap, yea, and circumcision, a passover lamb, and all the Jewish ceremonies, though with another spirit and intention than to shadow forth Christ to come in the flesh, [are] imagined to be indifferent and alterable things, we hold that all these are to be abstained from as eating of blood and things strangled of old were. If you say they are as indifferent as blood and some meats were in the case (Acts 15; Rom. 14; 1 Cor. 8; 1 Cor. 10), its a most false principle as we shall hear, and therefore the Scripture, if it make the man of God perfect to every good work, as the apostle says, it must teach us to abstain from all these as scandalous [things], and must set down as perfect and particular directions for Church-Government as Paul does (Rom. 14) set down a particular platform, how we shall eschew murder for scandalizing our brethren in the use of things indifferent, is spiritual murder (Rom. 14:15,20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Introduction, p. 8-9</span></figcaption>

<blockquote><p>In Latin children are called pignora, that is pledges, as if I should say, a pledge of the husbands love to the wife, and a pledge of the wife’s love toward the husband: for there is nothing which does so knit love between the man and the wife, as the fruit of the womb… If a woman have many defects (as Leah had) yet this is the mends which she makes her husband to bring him children, which is the right wedding ring that seals and makes up as it were the marriage.</p></blockquote>

<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>

<blockquote><p>…hereafter provision must be made for spiritual ministers, who may instruct the sick in faith towards God, and comfort them up with hope of salvation, and take care of their souls, whom the Preservers [specially appointed civil officials for the plague] shall so choose in every parish, that they take not to so weighty a matter, whosoever comes first to hand, but such as they shall have known to be singularly given unto godliness, holiness, sobriety, and chastity… But if, peradventure, there can no such be found among the ordinary ministers, out of the rest of the people there must be chosen such, which come unto the next degrees of the foresaid virtues. For in this miserable time the things of most perfection come not always to be had. Therefore, as they say, ‘As we can, when as we would we may not.’ When such at length are chosen, whom the Preservers shall have judged meet and sufficient for every parish, it may not by any means be suffered that they go to any other than such as being taken with the plague, require their help. For I have said before, and say still, that not only the outward and common infectious air, but also contagious breaths and infectious breathings, or blowings, which are gathered and afterwards imparted to the whole: and others that are sick by the keepers, by such as sit by them, by the ministers of the church going hither and thither and standing by the infected, yea many times also by them that are dead, ought specially to be avoided. Which thing, when as by daily experience we are taught, and have proved also unto us to be true, by all means we have to take heed, lest that we leave the cause of this so great a disease in others, whom with all diligence we have, for fear of infection, put apart. Hereunto you may add, which we have oftentimes no less experience of, that many sick persons also (I speak not of such as are infected with the plague), albeit they be not infected with the company of such ministers, yet they will nevertheless refuse their presence for fear of the infection. Whereupon also this inconvenience will arise, yet they had rather receive never so simple comfort at the hands either of some of their own household, who for the most part are unmeet for this purpose, or else die alone than to undergo a double mischief…</p></blockquote>

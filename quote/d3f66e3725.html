<main class="wrap"><figure class="quote" id="q-d3f66e3725" data-kw="">
<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/south-carolina.html">State of South Carolina</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of South Carolina</cite>, 1788 (Thorpe, 6.3249-50, 3252, 3255-6)</span></figcaption>

</figure><figure class="quote" id="q-dca7c69c7e" data-kw="">
<blockquote><p>I am sure, the Reformed Churches and all our writers argue that as many as have souls, Popes, prelates and Roman clergy ought to be subject by this text [Rom. 13:1] to the good laws of the Christian emperors, and that all men, none excepted, neither clergy (as they call them) nor others, but are obliged by this Scripture and 1 Pet. 2 and Titus 3, to give obedience and subjection to all lawful magistrates, heathen and Christian, and to their laws, and to pay tribute and to be judged by them, whereas papists plead exemption to Churchmen…</p></blockquote>

</figure><figure class="quote" id="q-752bf8d5c6" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called [to the Savoy Conference] by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XI. They spake not against episcopacy, as it is a presidency among and over presbyters differing in degree, and not in office, called ‘order’, and that in a Church of the lowest species. … XIII. They said nothing against metropolitans, patriarchs, lay-chancellors, commissaries, officials, surrogates, archdeacons, etc. as officers of the king, appointed to do nothing (besides the sacred ministry if they be clergymen) but what belongs to magistracy [according to circa sara]. XIV. They said nothing against any promise of obedience to them only in the capacities and in the exercise of the power forementioned. XV. Much less did they ever oppose or question swearing to the king, according to the oaths of Allegiance and Supremacy: And I with diverse others also being (for some ends) entered as his chaplains in ordinary, took also that Oath of Fidelity which the king’s household servants take. XVI. We never were for any dishonoring of kings by public excommunications, much less by subjects or foreigners, whom kings never choose to be their pastors; but only in case of necessity, for such a denial of sacramental communion to them, as Bishop Andrewes in Tortura Torti and Bishop Bilson [The True Difference between Christian Subjection &amp; Unchristian Rebellion, pt. 3, pp. 376-77] plead for, which is but to forbear ourselves a sinful act. XVII. We never pleaded for any elders’ (or chancellors’) power of the keys, who are but laymen. XVIII. We never held that magistrates are bound to add their force by the sword to the censures of the Church as such, and to punish men more because the Church has by excommunication cast them out, or because they are not reconciled. XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689) The preface is dated 1683., ch. 3, pp. 11-13</span></figcaption>

bjection+%26+Unchristian+Rebellion%2C+pt.+3%2C+pp.+376-77%5D+plead+for%2C+which+is+but+to+forbear+ourselves+a+sinful+act.+XVII.+We+never+pleaded+for+any+elders%E2%80%99+%28or+chancellors%E2%80%99%29+power+of+the+keys%2C+who+are+but+laymen.+XVIII.+We+never+held+that+magistrates+are+bound+to+add+their+force+by+the+sword+to+the+censures+of+the+Church+as+such%2C+and+to+punish+men+more+because+the+Church+has+by+excommunication+cast+them+out%2C+or+because+they+are+not+reconciled.+XIX.+We+never+thought+that+things+indifferent+do+become+unlawful+to+us+because+the+magistrate+commands+them.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued+%281683%3B+London%3A+Parkhurst%2C+1689%29+The+preface+is+dated+1683.%2C+ch.+3%2C+pp.+11-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F752bf8d5c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/752bf8d5c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/church-state-relations/erastianism/#:~:text=But%20those%20%5Bleading%20presbyterian%20and%20congregationalist,us%20because%20the%20magistrate%20commands%20them&amp;text=But%20those%20%5Bleading%20presbyterian%20and%20congregationalist%20ministers%5D%20that&amp;text=unlawful%20to%20us%20because%20the%20magistrate%20commands%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

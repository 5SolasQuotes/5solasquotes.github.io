<blockquote><p>The main question then is, concerning State Toleration. Concerning which some do affirm. That whatever the Church may do in Inflicting Church Censures on Heretics, Maintainers of Heterodox Opinions: Yet, say they, no civil Punishment, such as Death, Imprisonment, Mulcts, or Fines, should be inflicted on any Error or Blasphemy whatsoever; providing the Maintainers of them carry themselves peaceably, do not trouble the State, or do evil against the Commonwealth in civil Things:

We again on the contrary do hold, That it is the Duty of the Civil Magistrate to suppress Error, Heresy, and every sin against the First Table, as well as it is his Duty to suppress Adultery, Fornication, Sedition, and other sins against the Second Table: And that he is not only bound to suppress Errors and Blasphemies, that are contrary to fundamental Truths, or the Light of Nature; but all Error contrary to other points of Truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors of toleration, Erastianism, Independency and separation. Delivered in some sermons from I John 4.1. Preached in the year 1652. To which are added four sermons preached on several occasions</cite>, (1652; Edinburgh, 1692), p. 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b38788c2a6" data-kw="">
<blockquote><p>[M]odern pedagogy has emancipated us, whether we be in the pulpit or in the professor’s chair or in the pew, from anything so irksome as earnest labor in the acquisition of knowledge. It never seems to occur to many modern teachers that the primary business of the teacher is to study the subject that he is going to teach. Instead of studying the subject that he is going to teach, he studies “education”; a knowledge of the methodology of teaching takes the place of a knowledge of the particular branch of literature, history or science to which a man has devoted his life. This substitution of methodology for content in the preparation of the teacher is based upon a particular view of what education is. It is based upon the view that education consists primarily, not in the imparting of information, but in a training of the faculties of the child; that the business of the teacher is not to teach, but to develop in the child a faculty which will enable the child to learn.

This child-centred notion of education seems to involve emancipation from a vast amount of drudgery. It used to be thought necessary to do some hard work at school. When a textbook was given to a class, it was expected that the contents of the textbook should be mastered. But now all that has been changed. Storing up facts in the mind was a long and painful process, and it is indeed comforting to know that we can now do without it. Away with all drudgery and all hard work! Self-expression has taken their place, A great pedagogic discovery has been made the discovery that it is possible to think with a completely empty mind.

It cannot be said that the results of the discovery are impressive. This child-centred notion of education has resulted, particularly in America, where it has been most ruthlessly applied, in a boundless superficiality of which. we Americans certainly have little reason to be proud; but it has probably not been confined to America by any means. I wonder when the reaction will come. I wonder when we shall have that revival of learning which we so much need, and which I verily believe might be, in the providence of God, as was the Renaissance of the fifteenth century, the precursor of a Reformation in the Church.

When that revival of learning comes, we may be sure that it will sweep away the present absurd over-emphasis upon methodology in teaching at the expense of content. We shall never have a true revival of learning until teachers turn their attention away from the mere mental processes of the child out into the marvelous richness and variety of the universe and of human life. Not teachers who have studied the methodology of teaching, but teachers who are on fire with a love of the subjects that they are going to teach are the real torch-bearers of intellectual advance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Importance of Christian Scholarship for Evangelism. An Address Delivered in London before the Bible League, June 17, 1932 in Christianity Today</cite></span></figcaption>

</figure><figure class="quote" id="q-1d340ee561" data-kw="">
<blockquote><p>It was formerly stated, that one in which a divine right or the warrant for any duty is established, is by approved examples in scripture. The word of God contains examples to persons in every character and station of life. In particular, it exhibits examples of godly magistrates. But where do we read, in all the book of God, of approved magistrates who confined themselves, in their official capacity, to civil matters, and the secular interests of mankind, and who did not employ their authority for the advancement of religion? We have a large account of the conduct of Moses and Joshua, David and Solomon, Asa and Jehoshaphat, Hezekiah and Josiah. Who will deny that their actions are recorded as an example to rulers? But they are commended chiefly for the warm zeal and activity, which they displayed in their station, in settling or reforming religion, providing for the instruction of their subjects, and the due administration of divine ordinances. No magistrate, who consults the Bible, will ever imagine that religious matters are excluded from his province. This notion must have been imbibed from some very different source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Some have upon these words made a question whether it be lawful for the husband or the wife separated for adultery to marry again while each other lives. As to the party offending, it may be a question; but as to the innocent person offended, it is no question, for the adultery of the person offending has dissolved the knot of marriage by the Divine law. It is true that the knot cannot be dissolved without the freedom of both persons each from another, but yet it seemeth against reason that both persons should have the like liberty to a second marriage. For:

1. The adulteress is by God’s law a dead woman, and so in no capacity to a second marriage.

2. It is unreasonable that she should make an advantage of her own sin and error.

3. This might be the occasion of adultery, to give a wicked person a legal liberty to satisfy an extravagant lust. But for the innocent person, it is as unreasonable that he or she should be punished for the sin of another.</p></blockquote>

<blockquote><p>But we can hardly say the physical fact of the genetic uniqueness of human fetal tissue is the basis of all the anxious inquiry, for the same uniqueness prevails in the animal world…. …when the fetus becomes a human being… the “breath of life” and the “blood which is the life” are applicable to animals as well as men. The biblical description of man’s distinctive creation “in the divine image” refers to a quality of life that, though it depends upon breath and blood, is not equated with them… although Augustine and Thomas condemned deliberate interference with the life of the fetus, they considered it homicide only when the fetus was possessed of a human soul.</p></blockquote>

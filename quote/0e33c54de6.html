<main class="wrap"><figure class="quote" id="q-0e33c54de6" data-kw="">
<blockquote><p>Those who wish to know the bearing of Scripture on human hymns as matter of God’s worship should read the two excellent little treatises, respectively entitled, The True Psalmody, and The Public Worship of God, the first of which is an American publication, and the other was penned by the late Dr. [James] Gibson.

It is enough to state here that the Psalms are as much superior to uninspired hymns as God’s Word is to man’s word, and we ought to serve God with the best; that there is no warrant for worshipping God with human hymns, and therefore we have no ground for hoping that such praise will be accepted; and, further, while admitting that metrical translations of other portions of the Bible are not to be compared with mere human hymns, the fact of God’s having gathered the Psalms, Songs and Hymns of various inspired writers into one Book of Psalms, seems conclusively to show that that Book alone was meant to serve as our manual of praise.

Christ specially referred to “the Book of Psalms,” and Paul, quoting the words, “Thou art my Son, this day have I begotten thee,” says they are “ written in the second Psalm,” thus indicating that they were then arranged in their present order. There must be some reason why the Prayer or Psalm of Moses in the 90th Psalm found a place in that Book, though his Song in the 15th chapter of Exodus did not; why David’s Psalm of thanksgiving, when the ark was brought to Zion, is reproduced in the 105th, 96th, and 106th Psalms; why the 14th and 53rd Psalms are almost exactly the same; and why the 108th Psalm is embodied in the 57th and 60th. The reason given above seems the most satisfactory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hymnology of the Scottish Reformation. I. in Original Secession Magazine</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2e68becf5" data-kw="">
<blockquote><p>The 72d Psalm is an eminent instance of Christ being the subject matter of praise; the person spoken of. To apply it exclusively to David or to Solomon would contradict the facts of history and be little short of impiety. An infinitely greater than David or Solomon is here. While the petition with which the Psalm begins can apply to them both, in a far higher sense it applies to him who is both David’s Son and Lord. In this song the Old Testament worshipper prayed for the establishment and perpetuity of the kingdom of the Messiah before he came into the world. We in singing it and other Messianic songs celebrate the greatness of the kingdom and the glory of the King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-sproull.html">Thomas Sproull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Psalms in Reformed Presbyterian and Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-0fa7d1695a" data-kw="">
<blockquote><p>…you say we ‘are not bound, or rather have no warrant to use the Psalms in meter or with tunes.’ To this I answer, that we are bound to sing is evident, both from Scripture-precept and example; and that we are thereby warranted to have the Psalms in meter with tunes is as clear, as both are necessary, at least convenient in the propriety of our language, for the use of singing: I deny not, but prose may be sung; but seeing it is certain that our language has no such exact prosody, as either to render it easily measurable, or the measures distinguishable by points and accents; nay that the import of the music or tonici accentus, in the Hebrew, qui olim moderabantur harmoniam musicam, is so far now lost and unknown, that if we were now to sing the Hebrew Psalms, we could not make use of them: Pray, Sir, leave us but the way of meter in place of points and accents until you teach us better grammar: whereas you hint, that we ‘may have all David‘s instruments as well as tunes’, if you could learn us to sing without tunes, as we may well do without organs, I shall not contend, but seeing that David did, no doubt, invent and introduce these his instruments, as well by the special direction of the Spirit, as he did all other things anent the service of the Temple, and that the Primitive Christians, worshipping more in the simplicity of the Spirit than in outward shows, canebant assâ voce non […], I think you may now put up your pipes and spare the cost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered, pp. 277-278. MacWard was the protege of Samuel Rutherford.</span></figcaption>

</figure><figure class="quote" id="q-10bee237fb" data-kw="">
<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…”

— Nicholas Bownd, The True Doctrine of the Sabbath, (1595/1606; Naphtali &amp; RHB, 2015) Emphasis in the original. See also pp. 402-3. | Book 2, ch. 11, ‘Private Worship: Singing of Psalms’, pp. 396-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+if+we+look+into+the+book+of+Psalms%2C+we+shall+find+not+only+a+great+many+which+do+generally+concern+the+estate+of+the+whole+Church%2C+and+therefore+are+most+fit+to+be+sung+in+the+common+assemblies%E2%80%A6+%E2%80%A6+And+if+the+private+singing+of+psalms+were+not+so+necessary+a+duty+of+Christians+as+it+is%2C+to+what+end+serves+that+earnest+exhortation+of+the+apostle+to+the+Colossians%3F+Let+the+word+of+Christ+dwell+in+you+plenteously+in+all+wisdom%2C+teaching+and+admonishing+one+another+in+psalms%2C+and+hymns%2C+and+spiritual+songs%2C+singing+with+grace+in+your+hearts+to+the+Lord+%28Col.+3%3A16%29.+Where+he+teaches+the+whole+Church+how+they+should+behave+themselves+in+their+private+meetings%E2%80%A6+they+should+sing+spiritual+songs%2C+whereof+there+are+so+many+kinds%2C+as+appears+by+the+diverse+words+he+uses+in+this+place%2C+as+when+he+says%2C+psalms%2C+hymns%2C+and+spiritual+songs.+Whereunto+agrees+that+which+he+writes+unto+the+Ephesians%3A+Be+not+drunken+with+wine%E2%80%A6+speaking+unto+yourselves+in+psalms%2C+and+hymns%2C+and+spiritual+songs%E2%80%A6+%28Eph.+5%3A18-20%29%E2%80%A6+they+on+the+contrary+should+in+the+midst+of+these+things+%28being+guided+by+God%E2%80%99s+Spirit%29+burst+forth+into+the+praises+of+God+through+Jesus+Christ%3B+and+testify+their+holy+mirth%2C+not+of+the+flesh%2C+but+of+the+Spirit%2C+by+singing+Psalms%3B+whereof+there+are+so+many+sundry+kinds%2C+that+for+every+time+we+shall+be+fitted+with+some+one+or+other+%5Bpsalm%2C+hymn%2C+or+spiritual+song.%5D+Let+us+not+therefore+deny+so+manifest+a+truth%2C+but+acknowledge+as+the+Word+teaches+us%2C+that+the+Lord+requires+of+us+in+our+private+meetings+upon+the+Lord%E2%80%99s+Day%2C+and+when+we+are+alone+by+ourselves%2C+to+sing+psalms%2C+as+well+as+in+the+church.+And+though+I+do+not+bind+men+unto+this%E2%80%93for+be+it+far+from+me+that+I+should+lay+any+heavier+burden+upon+any%2C+than+the+Word+of+God+itself+binds%E2%80%93bind+them+I+say+unto+this%2C+that+in+all+their+mirth+they+should+sing+psalms%2C+as+might+seem+the+places+alleged+do+import%E2%80%A6+For+as+that+is%E2%80%A6+a+blessed+heaviness+that+makes+us+seek+unto+the+Lord%3B+so+that+is+a+godly+mirth+that+ends+with+singing+of+psalms%2C+and+a+heavenly+joy%2C+that+at+leastwise+makes+us+more+fit+to+serve+God.+.+pp.+406-7+What+Makes+it+Comely+%E2%80%A6So+though+to+sing+be+never+so+comely+in+its+own+nature%2C+yet+it+become+not+us%2C+except+we+be+prepared+for+it%2C+and+do+sing+David%E2%80%99s+psalms+%5Bnot+so+much+with+David%E2%80%99s+harp%2C%5D+as+with+David%E2%80%99s+spirit.+Therefore+the+apostle%2C+writing+to+the+Ephesians%2C+wills+them+in+singing+to+make+melody+in+their+hearts+to+the+Lord+%28Eph.+5%3A19%29%2C+and+not+to+sing+with+the+tongue+only%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Nicholas+Bownd%2C+The+True+Doctrine+of+the+Sabbath%2C+%281595%2F1606%3B+Naphtali+%26+RHB%2C+2015%29+Emphasis+in+the+original.+See+also+pp.+402-3.+%7C+Book+2%2C+ch.+11%2C+%E2%80%98Private+Worship%3A+Singing+of+Psalms%E2%80%99%2C+pp.+396-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F10bee237fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/10bee237fb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=And%20if%20we%20look%20into%20the,to%20sing%20with%20the%20tongue%20only&amp;text=And%20if%20we%20look%20into%20the%20book%20of&amp;text=and%20not%20to%20sing%20with%20the%20tongue%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

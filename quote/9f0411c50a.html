</figure><figure class="quote" id="q-a3500b3359" data-kw="">
<blockquote><p>We offer and we perform all obedience which God has commanded, and we deny neither toll, tribute nor fear to her nor officers: We only bridle her blind rage, in which she would erect and maintain idolatry, and would murder our brethren who refuse the same. Neither yet fear we in this present day, that against us she makes a malicious lie, where that she says that it is not religion we go about, but a plain usurpation of authority: God forbid that such impiety should enter into our hearts, that we should make his holy religion a cloak and cover of our iniquity. From the beginning of this controversy ’tis evidently known what have been our requests, which, if the rest of the nobility and commonality of Scotland will cause to be performed unto us, if then in us appear any sign of rebellion, let us be reputed and punished as traitors, etc.</p></blockquote>

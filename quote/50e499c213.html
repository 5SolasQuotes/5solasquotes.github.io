<main class="wrap"><figure class="quote" id="q-50e499c213" data-kw="">
<blockquote><p>…original sin consists in this, that it opposes the same law as to the inclination or habitude. Consequently this inbred propensity or habit of inordinate concupiscence, which makes man prone to transgress the law of God, is Original Sin. …he who has within him a defect, habit, or propensity contrary to the law of original creation is infected by Original Sin… …we must understand that the word concupiscence sometimes denotes the mere faculty of desire… we grant that it is a good creature of God. Sometimes it denotes the contagion or unruly tendency, which has infected the faculty itself; and this disorder, we say, is formally repugnant to that rectitude which God has impressed upon the same faculty…. …the corrupt disposition, which inclines internally to actual sin, is most properly Original Sin. …so although the faculty of desire itself is not sin, yet the inclination and propensity of it to evil is sin; even in one asleep, when it does not at all actually incline to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification: or The Disputatio de justitia habituali et actuali</cite>, tr. Allport (1844), vol. 1, ch. 18, pp. 126-27</span></figcaption>

</figure><figure class="quote" id="q-83c0e1cb6b" data-kw="">
<blockquote><p>1. Because in a question of law all ignorance is moral and culpably evil to any who undertakes actions upon conscience of obedience to others; for to all within the visible Church the Word of God is exactly perfect for faith and manners, and everyone is obliged to know all conclusions of law that are determinable by God’s Word. 2. Every one in his actions is to do out of a plerophory, and a full persuasion, of heart, that what he does pleases God, Rom. 14:14, ‘I know and am persuaded by the Lord Jesus that nothing is unclean of itself.’ 3. We are to do nothing but what is lawful and what in our consciences we are persuaded is lawful, and are to know what is sin and what is no sin… because every one is obliged to know morally what concerns his conscience, that he be not guilty before God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644) | pt. 1, ch. 3, Section 3, Question 4, pp. 41-49</span></figcaption>

</figure><figure class="quote" id="q-d7c656a53b" data-kw="">
<blockquote><p>V. (3) The question is not whether a distinction relative to the administration of divine providence in the covenant of grace in punishing the sins of believers can be admitted; whether certain sins in believers can be called mortal because they are grievous and atrocious, which more deeply wound and injure conscience, hinder the act of justifying faith and take away present fitness for the kingdom of heaven (upon which therefore he denounces wrath and indignation; yea, threatens exclusion from the kingdom of heaven and eternal death, like those treated of in 1 Cor, 6:10 and Col. 3:5); whether others, however, may be called venial, which are lighter and of daily commission, not hindering the rule and operation of grace, nor taking away the sense of God’s favor or the confidence of the pardon of sin (such as the rebellious motions of concupiscence, of which Paul complains in Rom. 7–defects and blemishes adhering even to the best works of the renewed). There are some of our party who think the distinction of mortal and venial sin can be retained in this sense, as Robert Baron, following the theologians of Great Britain, in his Judicio de Perseverantia, although it does not seem sufficiently appropriate on account of our opponents; the distinction of heavy and light sins is better. The question simply concerns the nature of sins in themselves according to the strictness of the law. We think all are mortal, none truly venial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

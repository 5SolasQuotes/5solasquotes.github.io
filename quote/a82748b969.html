</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6201f5bc82" data-kw="">
<blockquote><p>It is an untruth which Raphael de la Torres [a Dominican Romanist], with other schoolmen say, that with the same religion by which we honor holy men, we honor God; upon this reason, because holiness in them is a participation of the divine nature, therefore God must be the intrinsical end, and formal reason for which we honor the saints. [1.] For holiness in saints is a participation of the divine nature; but it is a temporary and a created participation, it is not the same very holiness that is in God; but the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature; and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God, commanded in the First Table of the Law. 2. When I bow to the gray-haired, and to the king, I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man, that I am then bowing to the God of heaven and Worshipping God: No acts terminated upon saints living or dead are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646), Introduction, section 6</cite>, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

20Raphael%20de%20la&amp;text=Word%2C%20are%20not%20properly%20acts%20of%20adoring%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ab0bb2d83a" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646) | Intro</cite>, pp. 88-89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-e766727110" data-kw="">
<blockquote><p>[Natural worship] is to know God, to acknowledge Him to be God, and glorify Him as God. Now man, as a dependent creature, stands in need of help in this concern; much more fallen man, who has no natural light left in him, to direct him how to worship God acceptably. And therefore God has pleased to show him a way, wherein he may do it; and to this way belong all the institutions appointed to man since the fall.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, Sermon 159</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-26081e435a" data-kw="">
<blockquote><p>With regard to the form to be observed in receiving the sacraments, it is not without reason that you entertain doubts and scruples, for nothing is better than to abide by that pure simplicity which we hold from the Son of God, whose ordinance ought to be our single rule, to which also the usage of the apostles was perfectly conformable. And indeed the moment we deviate ever so little from it, our admixture of human invention cannot fail to be a corruption. But it seems to us that your condition is different from that of the pastors of the place and the great body of the people. If the pastors did their duty, they would employ all their endeavours to retrench those superfluities which do not tend to edification, or rather which serve to obscure the clearness of the gospel. The [civil] governors on their part would also do well to see to it. It is a vice to be condemned so far as they are concerned, that they keep up these unmeaning mummeries — which are as it were a residue of Popish superstitions, the recollection of which we should strive as much as in us lies to exterminate. But in your capacity of private individuals, not only you may lawfully, but what is more, you should support and suffer such abuses as it is not in your power to correct. We do not hold lighted candles in the celebration of the eucharist, nor figured bread to be such indifferent things that we would willingly consent to their introduction, or approve of them, though we object not to accommodate ourselves to the use of them, where they have been already established, when we have no authority to oppose them. If we were called upon to receive such ceremonies, we should hold ourselves bound according to the position in which God has placed us, to admit of no compromise in resisting their introduction, and in maintaining constantly the purity which the church confided to us already possesses. But should our lot be cast in some place where a different form prevails, there is not one of us who from spite against a candle or a chasuble [a ministerial vestment] would consent to separate himself from the body of the church, and so deprive himself of the use of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters, vol 3 (Philadelphia: Presbyterian Board of Publication), Letter 346, ‘To the Brethren of Wezel’, pp. 30-31. Calvin is speaking to reformed refugees attending Lutheran churches. See the whole letter in general.</cite></span></figcaption>

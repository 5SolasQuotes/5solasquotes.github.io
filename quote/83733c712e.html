<main class="wrap"><figure class="quote" id="q-83733c712e" data-kw="">
<blockquote><p>Augustine reminds us that divine omnipotence does not mean that God can do what is contradictory or at odds with his perfection:

He cannot will and not will at the same time. For justice cannot wish to do what is unjust; wisdom cannot wish what is foolish; truth cannot wish what is false. Whence we are reminded that the omnipotent God cannot do not only what the Apostle states: ‘He cannot disown himself,’ but many other things as well. Behold, I say this and I do not dare to say it in accordance with His truth, because I do not dare to deny that the omnipotent God cannot die, cannot be changed, cannot be deceived, cannot become wretched, cannot be overcome. Far be it that the Omnipotent One should be able to do these things and other things of this sort. And for that very reason not only does truth show that He is omnipotent because he cannot do these things, but truth also concludes that he who can do such things is not omnipotent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Liturgical Seasons</cite>, trans. Mary Sarah Muldowney in The Fathers of the Church, 38: 134 (Sermon 214).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d95edf01bb" data-kw="">
<blockquote><p>Three things about the worship of God are to be considered:

1. The kinds of it…

2. The parts of it…

3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>

</figure><figure class="quote" id="q-740a1e495c" data-kw="">
<blockquote><p>It is good to sing psalms, especially if they are sung to the Lord and with reverence, but it is not good if the psalms are used without any reverence either at dinner parties with drinking or in the churches for profit. Likewise, an oath made under the name of God is good if it is done in a trial and reverently with the fear of the Lord. It is not good if it is done rashly and lightly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Righteousness, Oaths, and Usury: A Commentary on Psalm 15</cite>, trans. Todd M. Rester (1573; Grand Rapids MI: Christian’s Library Press, 2013), p. 68.</span></figcaption>

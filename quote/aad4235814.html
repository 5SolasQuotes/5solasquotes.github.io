<main class="wrap"><figure class="quote" id="q-aad4235814" data-kw="">
<blockquote><p>What corruptions are got into the worship of God, is not unknown to you, the Worthies of our Israel, turn your hand upon us and purely purge out all the dross is there. If things be not evident to you, make an exact scrutiny, and whatever you find without Christ’s superscription, is adulterate, he will not own nor bless it. Ius divinum, is his stamp, and what hath that Christ will own.

O suffer nothing to be in his House, which hath not a divine impression upon it, which is not after Christ, Col. 2 8. and for the future let nothing be brought in which is after men and not after Christ; let no worldly rudiments approach his presence, when Nadab and Abihu, brought strange fire into the worship of God, fire went out from the Lord and made them a Sacrifice; there was nothing against their fire, but this was it, they had no Warrant for it, God commanded it not, Levit. 10. 1, 2.

Let some fiery law go forth from you that may scorch all such as shall hereafter dare to join their posts with Gods, and mingle their chaff with his Wheat, and let not any laws be of force, that may countenance such evils, uphold suspected things, or prejudice the liberty of tender consciences, yea ways of worship which may prove snares to you, or your Posterity; put the Axe of your power unto them, and hew them down.</p></blockquote>

<blockquote><p>Q. 34. Seeing the Lord’s day is for the commemoration of Christ’s resurrection, must we cease the commemoration of the works of creation, for which the seventh-day sabbath was appointed?

A. No: the appointing of the Lord’s day is accumulative, and not diminutive, as to what we were to do on the sabbath. God did not cease to be our Creator and the God of nature, by becoming our Redeemer and the God of grace; we owe more praise to our Creator, and not less. The greater and the subsequent and more perfect work comprehendeth the lesser, antecedent, and imperfect. The Lord’s day is to be spent in praising God, both as our Creator and Redeemer; the creation itself being now delivered into the hands of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 131.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-9c6e5cd948" data-kw="">
<blockquote><p>There is a lot of psychological distress involved in even talking about it. I don’t care for the overuse of words like ‘trauma,’ but it really has felt traumatic, and we weren’t suffering the worst of it by any means. Our family has been shunned by the pastor because he didn’t believe we voted for him to be installed [as the pastor], although we did; you don’t realize how much damage it does to have your spiritual leader refuse to even speak to you, because it starts to seem normal. I was also reprimanded when one of the elders found out that I asked a question about the church’s unconventional sacramental practices to someone outside the church. There have been sustained, vicious attacks on family members by the session [of elders]. There is consistent abuse of Matthew 18 to stifle any publicly voiced criticisms of actions by the session. There is a lack of transparency: for example, the session refuses to release a comprehensive budget to the congregation, and makes major purchases without a congregational vote. Church discipline has no established procedure, and excommunication is done behind closed doors, without a public trial or public testimony by witnesses. Excommunications are also based on manufactured sins; the current excommunication, for example, is based on the charge of “living in darkness.” The pastor has literally pronounced eternal damnation over people who have criticized him in public. The session has even gone after people who left the church and are no longer members, going so far as to contact people’s ex-spouses to attempt to find incriminating information about them to convey to the non-member’s new pastor. They also routinely spread around information that was given in confidence for counseling purposes. Everyone we’ve told who is not in the church is appalled; in retrospect we wonder why it took so long for us to leave, but it really is painful. It was hard to leave for a number of reasons. First, we had a lot of specific doctrinal agreements with that church, that most other churches don’t share. Along with that came like-minded friends who we really did not want to give up. Things got incrementally worse over a long time, and quite often the leadership had semi-plausible explanations for their actions which were not easy to disprove. The worst of it was not targeted at us, and we thought we could just keep our heads down and avoid interacting with the session. We wished we could more vocally confront them, but the people being abused asked that we not get involved, so we didn’t feel that we could. Over time the cognitive dissonance grew worse, and it seemed to us the Holy Spirit had entirely withdrawn from the church. The church moving to a new building that was much farther away gave us a ready excuse to go elsewhere that couldn’t be argued with. Then the final decision was made for us when the pastor purported to damn our relative; that’s a bell that can’t really be unrung, and we couldn’t commune in good faith after that. We are members of the congregation. We are hoping the elders will just leave us alone, but they have harassed people who have left before, so we are trying to get under the shelter of another church quickly. We did a complete communication blackout. We blocked all of the communication outlets from all of the elders, so we won’t have to even see anything they might send which could tempt us to reply. Articles on spiritual abuse do capture very well the experience of being in the situation, the damage it does and the psychological consequences of getting out.</p></blockquote>

th+family%2C+Pennsylvania%2C+USA&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c6e5cd948.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c6e5cd948.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cults/#:~:text=There%20is%20a%20lot%20of%20psychological,the%20psychological%20consequences%20of%20getting%20out&amp;text=There%20is%20a%20lot%20of%20psychological%20distress%20involved&amp;text=does%20and%20the%20psychological%20consequences%20of%20getting%20out" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-98709b5b6d" data-kw="">
<blockquote><p>That the Word and sacraments are not administered rightly and exactly, secundum [in Latin], as altogether agreeing with the prescript of the Lord, no not in all the world; yet albeit they be not administred according to that exact rule, and by reason of our frailty cannot be suddenly reformed, yet may they be so performed that they may be pleasing unto God and healthfull to the Church, yet so as the defect should be lamented and acknowledged; which point if it be not granted, there will be no pure or true Church in all the world; Zachary Ursinus, Catechism, pt. 2, to question 84, fol. 620. That albeit many evil things do go along and be done, yet these things are done by such as hinder reformation, and by the disobedient; not by such as wish and sue for amendment: For ‘blessed are they who hunger and thirst after righteousness,’ Mt. 5:6, (that is) which do desire good things to be done in the Church, which if they be not done it is not their fault: they may in that case retain a good conscience; Ursinus, ibid., fol. 618.</p></blockquote>

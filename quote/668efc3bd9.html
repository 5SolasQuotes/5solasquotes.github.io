</figure><figure class="quote" id="q-1670871fbd" data-kw="">
<blockquote><p>Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Jonathan Edwards &amp; the Absence of Free Choice: A Parting of Ways in the Reformed Tradition” 71 min., Sept. 29th</cite>, 2010, at Trinity Evangelical Divinity School, being the Inaugural Lecture for the Jonathan Edwards Center. This lecture is in article form above.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.”

— Richard Muller, “Jonathan Edwards &amp; the Absence of Free Choice: A Parting of Ways in the Reformed Tradition” 71 min., Sept. 29th, 2010, at Trinity Evangelical Divinity School, being the Inaugural Lecture for the Jonathan Edwards Center. This lecture is in article form above.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJonathan+Edwards+is+often+regarded+as+an+epitome+of+Calvinism+for+his+teaching+on+the+freedom+of+will%2C+though+he+was%2C+in+his+own+time+and+for+a+century+after+his+death%2C+a+much-debated+thinker+whose+views+polarized+Reformed+circles.+This+lecture+will+concentrate+on+Edwards%E2%80%99s+reception+in+Britain%2C+which+has+received+little+attention+despite+its+significance+in+the+Reformed+tradition.+Concentrating+on+two+historical+contexts%2C+Dr.+Muller+will+consider+the+mixed+reception+of+Edwards%E2%80%99+thought%2C+note+differences+between+Edwards+and+the+older+Reformed+orthodoxy%2C+and+point+to+a+parting+of+the+ways+in+the+Reformed+tradition+that+took+place+largely+in+the+eighteenth+century.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+%E2%80%9CJonathan+Edwards+%26+the+Absence+of+Free+Choice%3A+A+Parting+of+Ways+in+the+Reformed+Tradition%E2%80%9D+71+min.%2C+Sept.+29th%2C+2010%2C+at+Trinity+Evangelical+Divinity+School%2C+being+the+Inaugural+Lecture+for+the+Jonathan+Edwards+Center.+This+lecture+is+in+article+form+above.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1670871fbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1670871fbd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=Jonathan%20Edwards%20is%20often%20regarded%20as,place%20largely%20in%20the%20eighteenth%20century&amp;text=Jonathan%20Edwards%20is%20often%20regarded%20as%20an%20epitome&amp;text=that%20took%20place%20largely%20in%20the%20eighteenth%20century" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b943e00d91" data-kw="">
<blockquote><p>Thesis XX. Whence it appears not only that all and every heir of Adam is universally corrupt, but also totally corrupt, namely both with respect to the soul, and with respect to the body, and finally with respect to the whole composite being. For it should not be thought as if only the body were corrupt, or even only the soul, but the whole man, as great as he is, is corrupt. For just as the image of God was not in the soul alone, nor even in the body alone, but in man and therefore in the whole composite, so also this original sin should be attributed not only to the soul and body, but to the whole composite consisting of soul and body; which can be best gathered from the opposite, regeneration, which pertains not to one or the other part of man, but to the whole man. … Thesis XXII. That the soul is corrupt is, alas, sufficiently clear from the depravation both of the intellect, which, although it may discern something in matters contributing to the convenience of civil life, yet in spiritual matters pertaining to the true worship of God and the salvation of our soul, it is not so much dim-sighted as blind, unless the Lord gives a mind to understand, eyes to see, etc. For its wisdom is enmity against God, holding those things which are of the Spirit of God for foolishness. And although worldly men sometimes understand something, yet they have it not from flesh and blood, but from the revelation of God the heavenly Father. Then of the will, which is placed in the same plight as the intellect. For original sin has so depraved the will that it in no way wills the spiritual good, namely, neither with respect to substance, nor with respect to manner, that is, from faith and for the glory of God. Whence the heart of man is not undeservedly called fraudulent, hardened, whose imagination is evil from his youth. Thesis XXIII. The body is so corrupt that, first in general, our members present themselves as weapons of unrighteousness for sin; then in particular, the mouth is full of curses and bitterness; the tongue is deceitful and the lips are filled with the venom of asps; the throat is an open sepulcher; the eyes are either lustful and evil; the hands are ready for theft; the belly is a god; the knees are bent to idolatry; the feet are swift to shed innocent blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), pp. 9-10 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>

</figure><figure class="quote" id="q-d46b7af116" data-kw="">
<blockquote><p>So that God’s decree is the cause of their necessity, contingency, spontaneity, and freedom. All these different qualities which are in second causes or effects, are derived from the will of God, who appointed them to be of that nature. It is He that fits necessary causes to necessary effects, and contingent ones to those that are contingent, and so on. Whatever comes to pass necessarily, so comes to pass by virtue of the divine decrees; and whatever happens contingently, and etc. so happens because of the same decree. The second causes do always retain their own particular nature and property, and their effects accordingly are necessary or causal, or proceed from mere sense or spontaneous motion, or from reason and will: but the first cause is immutable, and with respect to his foreknowledge and decree all effects and events are immutable, necessary, fix’d and stable, and cannot be otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Veritas Redux: Evangelical Truths Restored: Namely, Those Concerning God’s Eternal Decrees, The Liberty of Man’s Will, Grace &amp; Conversion, The Extent &amp; Efficacy of Christ’s Redemption, &amp; Perseverance in Grace</cite>, pp. 265-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

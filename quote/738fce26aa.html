<blockquote><p>The problem with EFS is not Arianism, but the fact that it entails tritheism. Advocates of EFS are… replacing terms like ‘unbegotten’ and ‘begotten’ with the ideas ‘authority’ and ‘submission’… EFS is more in the line of what might be called polytheistic homoiousianism, whereby the Father and the Son have distinct natures, but each is still eternally divine… Because Chalcedonian Christology insists that Jesus has two natures but only one hypostasis, dyothelitism [the orthodox doctrine that Christ has a divine will and a distinct human will] as a development of Chalcedonian Christology necessitates the recognition that a will must be a property of nature [and not the Person] in order for there to be two wills in Christ. To posit such terms as ‘obedience’ and ‘submission’ that imply a distinction of wills between the Father and the Son while affirming dyothelite Christology entails a distinction of natures between the Father and Son (and Spirit) resulting in tritheism… After this historical account, a word study of the term ‘submission’ will demonstrate that the term clearly implies an activity of the will yielding to another will and should therefore be rejected as an eternal property of a divine hypostasis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/butner-jr-d-glenn.html">Butner, Jr., D. Glenn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Eternal Functional Subordination and the Problem of the Divine Will’ 19 pp. in JETS 58/1 (2015) 131–49 The article is also here.</cite>, p. 132-3</span></figcaption>

<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>

<blockquote><p>This union [of the person of the Son with the human nature in the inarnation] can be viewed either in respect of the principle or in respect of the terminus. In the former sense, it is attributed to the whole Trinity, by the power of which such union is made (to wit, by a transient action of God by which he united in the person of the Logos, the humanity of Christ). In the latter, it belongs to the Logos alone because it is terminated on him. Although the person of the Logos may well be said to have been incarnate, yet the Trinity itself may not because the incarnation is not terminated on the divine nature absolutely, but on the person of the Logos relatively.</p></blockquote>

<blockquote><p>VI. On the Personality of God. The use has spread among pantheists of denying God’s true and real personality, so that those who defend a personal God are accused by them of anthropomorphism, as if the notion of personality cannot apply to God without anthropomorphizing Him, or constituting Him in the image and likeness of humans. These views are widely disseminated in Hegelian philosophy, as can be seen in Vera’s Introduction à la philosophie de Hegel. Avant-propos, p. 20, and the following (2nd edition). However, to deny the existence of a personal God is tantamount to denying God Himself, nor does asserting the personal nature of God lead to anthropomorphism. Let us prove both assertions. VII. The Admission of a Personal God. We defined elsewhere a suppositum, which is a perfectly subsistent substance, self-owned and incommunicable to another. From this it follows that since substantiality, by virtue of its subsistence, is the perfection by which substance exceeds accidents, a fortiori, perfect subsistence, by which a substance becomes self-owned and incommunicable to another, exhibits true and real perfection. And because a spiritual nature is the most perfect among beings, a subsisting complete subsistence (which is therefore called a person, as we stated in Ontology loc. cit.), implies something supremely perfect. Or, as St. Thomas says in STh. I, q. 29, a. 3, “Person signifies what is most perfect in all nature — that is, a subsistent individual of a rational nature.” We have indeed proved the truly and really existing First Efficient Cause of all substances, the Most Perfect Being, the Supreme Reason ordering all created things towards their end; therefore, the first Substance truly exists, most perfect in the notion of subsistence, and therefore fully self-owned and incommunicable, supremely intelligent, most notably endowed with the requisites for the notion of personality; and this first substance is called God. Consequently, God is truly a person, with a personality distinct from other things, as proven against pantheists. However, the term “person” is not applied to God in the same way as it is to creatures but in a more excellent manner, just as other names are attributed to God in a more excellent manner than to creatures. Those who wish to deny a personal God should indeed be considered atheists. For without a doubt, they either concede that God is a real substance, perfectly subsistent and intelligent in Himself, and by this admission, they must acknowledge God as personal, as is evident from what has been said, or they deny to God proper perfect substantiality and intelligence, and in this second hypothesis, God becomes something abstract or indeterminate, like every universal, as the adversaries indeed contend. However, what is abstract, as abstract, and what is indeterminate, as indeterminate, etc., exists not in reality outside the mind but in the mind itself, without its proper actions; for they do not act unless through singulars. Therefore, an impersonal God is merely a concept of reason, and thus by word only God is left, while in reality God is removed. Moreover, not only are the assertions about anthropomorphism absurd but also blatantly ridiculous. For they suppose that the notion of personality requires a body, or that real infinity is incompatible with personality; yet they fail to realize that if personality is a perfection derived uniquely from a spiritual nature, then to any subsisting substance, the notion of personality must correspond to the extent to which it is more spiritual, dissociated from and independent of the body, and possesses the most perfect nature. Now, God is in the highest degree of spirituality and infinite perfection. Therefore, He is in the highest degree of personality, so that personality in God not only does not imply anthropomorphism but essentially excludes it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“VI. On the Personality of God. The use has spread among pantheists of denying God’s true and real personality, so that those who defend a personal God are accused by them of anthropomorphism, as if the notion of personality cannot apply to God without anthropomorphizing Him, or constituting Him in the image and likeness of humans. These views are widely disseminated in Hegelian philosophy, as can be seen in Vera’s Introduction à la philosophie de Hegel. Avant-propos, p. 20, and the following (2nd edition). However, to deny the existence of a personal God is tantamount to denying God Himself, nor does asserting the personal nature of God lead to anthropomorphism. Let us prove both assertions. VII. The Admission of a Personal God. We defined elsewhere a suppositum, which is a perfectly subsistent substance, self-owned and incommunicable to another. From this it follows that since substantiality, by virtue of its subsistence, is the perfection by which substance exceeds accidents, a fortiori, perfect subsistence, by which a substance becomes self-owned and incommunicable to another, exhibits true and real perfection. And because a spiritual nature is the most perfect among beings, a subsisting complete subsistence (which is therefore called a person, as we stated in Ontology loc. cit.), implies something supremely perfect. Or, as St. Thomas says in STh. I, q. 29, a. 3, “Person signifies what is most perfect in all nature — that is, a subsistent individual of a rational nature.” We have indeed proved the truly and really existing First Efficient Cause of all substances, the Most Perfect Being, the Supreme Reason ordering all created things towards their end; therefore, the first Substance truly exists, most perfect in the notion of subsistence, and therefore fully self-owned and incommunicable, supremely intelligent, most notably endowed with the requisites for the notion of personality; and this first substance is called God. Consequently, God is truly a person, with a personality distinct from other things, as proven against pantheists. However, the term “person” is not applied to God in the same way as it is to creatures but in a more excellent manner, just as other names are attributed to God in a more excellent manner than to creatures. Those who wish to deny a personal God should indeed be considered atheists. For without a doubt, they either concede that God is a real substance, perfectly subsistent and intelligent in Himself, and by this admission, they must acknowledge God as personal, as is evident from what has been said, or they deny to God proper perfect substantiality and intelligence, and in this second hypothesis, God becomes something abstract or indeterminate, like every universal, as the adversaries indeed contend. However, what is abstract, as abstract, and what is indeterminate, as indeterminate, etc., exists not in reality outside the mind but in the mind itself, without its proper actions; for they do not act unless through singulars. Therefore, an impersonal God is merely a concept of reason, and thus by word only God is left, while in reality God is removed. Moreover, not only are the assertions about anthropomorphism absurd but also blatantly ridiculous. For they suppose that the notion of personality requires a body, or that real infinity is incompatible with personality; yet they fail to realize that if personality is a perfection derived uniquely from a spiritual nature, then to any subsisting substance, the notion of personality must correspond to the extent to which it is more spiritual, dissociated from and independent of the body, and possesses the most perfect nature. Now, God is in the highest degree of spirituality and infinite perfection. Therefore, He is in the highest degree of personality, so that personality in God not only does not imply anthropomorphism but essentially excludes it.”

— O.P. Cardinal Tommaso Maria Zigliara, Summa philosophica in usum scholarum, vol. 2, Theologia naturalis, De simpliciatate Divinae naturae, pp. 414–16 Zigliara (1833–1893), as quoted in Fanatic Thomist, “Personal God &amp; Classical Theism: Friends or Foes?”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVI.+On+the+Personality+of+God.+The+use+has+spread+among+pantheists+of+denying+God%E2%80%99s+true+and+real+personality%2C+so+that+those+who+defend+a+personal+God+are+accused+by+them+of+anthropomorphism%2C+as+if+the+notion+of+personality+cannot+apply+to+God+without+anthropomorphizing+Him%2C+or+constituting+Him+in+the+image+and+likeness+of+humans.+These+views+are+widely+disseminated+in+Hegelian+philosophy%2C+as+can+be+seen+in+Vera%E2%80%99s+Introduction+%C3%A0+la+philosophie+de+Hegel.+Avant-propos%2C+p.+20%2C+and+the+following+%282nd+edition%29.+However%2C+to+deny+the+existence+of+a+personal+God+is+tantamount+to+denying+God+Himself%2C+nor+does+asserting+the+personal+nature+of+God+lead+to+anthropomorphism.+Let+us+prove+both+assertions.+VII.+The+Admission+of+a+Personal+God.+We+defined+elsewhere+a+suppositum%2C+which+is+a+perfectly+subsistent+substance%2C+self-owned+and+incommunicable+to+another.+From+this+it+follows+that+since+substantiality%2C+by+virtue+of+its+subsistence%2C+is+the+perfection+by+which+substance+exceeds+accidents%2C+a+fortiori%2C+perfect+subsistence%2C+by+which+a+substance+becomes+self-owned+and+incommunicable+to+another%2C+exhibits+true+and+real+perfection.+And+because+a+spiritual+nature+is+the+most+perfect+among+beings%2C+a+subsisting+complete+subsistence+%28which+is+therefore+called+a+person%2C+as+we+stated+in+Ontology+loc.+cit.%29%2C+implies+something+supremely+perfect.+Or%2C+as+St.+Thomas+says+in+STh.+I%2C+q.+29%2C+a.+3%2C+%E2%80%9CPerson+signifies+what+is+most+perfect+in+all+nature+%E2%80%94+that+is%2C+a+subsistent+individual+of+a+rational+nature.%E2%80%9D+We+have+indeed+proved+the+truly+and+really+existing+First+Efficient+Cause+of+all+substances%2C+the+Most+Perfect+Being%2C+the+Supreme+Reason+ordering+all+created+things+towards+their+end%3B+therefore%2C+the+first+Substance+truly+exists%2C+most+perfect+in+the+notion+of+subsistence%2C+and+therefore+fully+self-owned+and+incommunicable%2C+supremely+intelligent%2C+most+notably+endowed+with+the+requisites+for+the+notion+of+personality%3B+and+this+first+substance+is+called+God.+Consequently%2C+God+is+truly+a+person%2C+with+a+personality+distinct+from+other+things%2C+as+proven+against+pantheists.+However%2C+the+term+%E2%80%9Cperson%E2%80%9D+is+not+applied+to+God+in+the+same+way+as+it+is+to+creatures+but+in+a+more+excellent+manner%2C+just+as+other+names+are+attributed+to+God+in+a+more+excellent+manner+than+to+creatures.+Those+who+wish+to+deny+a+personal+God+should+indeed+be+considered+atheists.+For+without+a+doubt%2C+they+either+concede+that+God+is+a+real+substance%2C+perfectly+subsistent+and+intelligent+in+Himself%2C+and+by+this+admission%2C+they+must+acknowledge+God+as+personal%2C+as+is+evident+from+what+has+been+said%2C+or+they+deny+to+God+proper+perfect+substantiality+and+intelligence%2C+and+in+this+second+hypothesis%2C+God+becomes+something+abstract+or+indeterminate%2C+like+every+universal%2C+as+the+adversaries+indeed+contend.+However%2C+what+is+abstract%2C+as+abstract%2C+and+what+is+indeterminate%2C+as+indeterminate%2C+etc.%2C+exists+not+in+reality+outside+the+mind+but+in+the+mind+itself%2C+without+its+proper+actions%3B+for+they+do+not+act+unless+through+singulars.+Therefore%2C+an+impersonal+God+is+merely+a+concept+of+reason%2C+and+thus+by+word+only+God+is+left%2C+while+in+reality+God+is+removed.+Moreover%2C+not+only+are+the+assertions+about+anthropomorphism+absurd+but+also+blatantly+ridiculous.+For+they+suppose+that+the+notion+of+personality+requires+a+body%2C+or+that+real+infinity+is+incompatible+with+personality%3B+yet+they+fail+to+realize+that+if+personality+is+a+perfection+derived+uniquely+from+a+spiritual+nature%2C+then+to+any+subsisting+substance%2C+the+notion+of+personality+must+correspond+to+the+extent+to+which+it+is+more+spiritual%2C+dissociated+from+and+independent+of+the+body%2C+and+possesses+the+most+perfect+nature.+Now%2C+God+is+in+the+highest+degree+of+spirituality+and+infinite+perfection.+Therefore%2C+He+is+in+the+highest+degree+of+personality%2C+so+that+personality+in+God+not+only+does+not+imply+anthropomorphism+but+essentially+excludes+it.%E2%80%9D%0A%0A%E2%80%94+O.P.+Cardinal+Tommaso+Maria+Zigliara%2C+Summa+philosophica+in+usum+scholarum%2C+vol.+2%2C+Theologia+naturalis%2C+De+simpliciatate+Divinae+naturae%2C+pp.+414%E2%80%9316+Zigliara+%281833%E2%80%931893%29%2C+as+quoted+in+Fanatic+Thomist%2C+%E2%80%9CPersonal+God+%26+Classical+Theism%3A+Friends+or+Foes%3F%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F810bff375c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/810bff375c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=VI.%20On%20the%20Personality%20of%20God.,imply%20anthropomorphism%20but%20essentially%20excludes%20it." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. If this pure and vital act be considered with reference to God’s own essence, they cannot be distinguished, because God’s essence is a pure act. The self-same divine essence is both the act, and object in these immanent actions, which do not pass out of God towards, and therefore have no relation at all to, or denomination from, any external object. God does know and will all things within Himself naturally, and necessarily; it’s his nature to love Himself; here is no distinction imaginable.</p></blockquote>

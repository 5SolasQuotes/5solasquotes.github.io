<blockquote><p>Although a Gentile by birth, Cornelius, was yet a proselyte by religion. Although he could not believe that the Messiah had come and was that Jesus whom Peter preached, yet he could not believe with the Jews from the oracles of the prophets that he would come. Thus he is not to be reckoned among the Gentiles, but among the patriarchs who looked for salvation from a Redeemer not yet manifested. Hence by the advent of Peter, he did not receive a beginning, but an increase of faith.</p></blockquote>

<blockquote><p>Doct. II. That it is in vain for any sinful persons to expect Gods turning to them in mercy and favour, who do not turn unto him with true repentance and reformation; but while they continue in their sins, they must expect that God will come forth against them, as the Lord of Hosts, commanding and ordering all his Creatures against them for their hurt. …

First, Turning to the Lord, implies, 1. That by sin continued in, men turn from the Lord, and against the Lord: as when men turn from one another in enmity, they turn their backs one to another, and their faces to opposite objects; so it is in this case, continuers in sin turn from God and his Word, to Sin, and the World, and Satan, which are opposite to God in his holy and righteous Laws; and God turns his face and favour from them, and his wrath and indignation against them. Hence it is that the Lord saith of those that disobey the instructions of his word, that they have turned the back to him, and not the face, Jerem. 32. 33. and accordingly he threatneth them, that he will shew them his back, and not his face, in the day of their calamity. Thus you see what this turning to the Lord implies.

Secondly, This turning to the Lord imports two things; Repentance for, and from all their evil ways; and Reformation of them: A hearty turning to God, through faith in Christ, and unfeigned love to God in Christ, with an universal conformity to his holy and righteous Rules and ways; as they resolved in Isa. 26.13. It is true, that we cannot turn unto God of our selves, till he turn us unto himself, as you may see in Deut. 29.2, 3, 4. yet, when God calleth the vessels of mercy to turn unto him, and addeth his Promise for their encouragement thereunto, his Spirit in and by the promise, works converting grace in them: which works in them 1. Hearty prayer unto God to convert them, as Isai. 63.17. Jerem. 31.18. Lam. 5.31. 2. Actual Conversion to God, in answer to God’s calling them thereunto, Psal. 27.8. as in Jer. 31.22. This turning to God is right,

1. When it ariseth from right motives. The right motives of turning to God, are not Temporal, only for removing of some temporal Affliction, whether felt or feared; or for obtaining some temporal good, which we want and desire: for such a turning is not to the Lord, but to our selves, as you may see in Hos. 7.16. with Zech. 7.5. But the right motives of turning to God are Eternal, viz. A serious and fixed apprehension of Eternal life and death, in relation to God, and his everlasting favour and wrath, in the incomprehensible greatness and vastness of them: when these are not transient and vanishing, but fixed in the heart by the Spirit, and when they are looked at, not as far off, but as present; Then they work an effectual and present conversion to God. Therefore Christ taught his Disciples to use this motive in preaching the Gospel, for the conversion of sinners to God, Mark 16.16. and Christ himself used the same motive, Joh. 3.18, 36. and the reason is, because then a man seeth better and stronger reasons for his turning to God, then the world can give for his continuing in sin, 2 Cor. 4.18. from love to God, Psal. 97.10. Ye that love the Lord, hate evil.

2. When it’s done in a right manner, with the whole heart, Joel 2.12. that is, when a full resolution of turning to God, follows a full illumination and conviction; otherwise, when men have some motives to turn, but not enough, they are not fully convinced, and so they turn but by halves, and feignedly, Jer. 3.10. Hence a right turning to God, is described as the Effect opening men’s eyes, Acts 26.18. wherein is included the opening of their hearts, as in Acts 16.14. Lydia.

3. When it produceth suitable effects: 1. That sin, which had dominion in them, is dispossessed, and grace is made Master of the house; so as though sin gets in and dwells in them, yet it is by intrusion and usurpation, as a Thief or Enemy, which are expelled as soon as they are discovered, and sufficient strength is gained. 2. That sin is hated; as the Lord commanded Israel to do against Amalek, 1 Sam. 15.3. this appears,

1. By their thrusting out the motions and lusts of sin out of their hearts with indignation, Isa. 30.22. and shutting the doors of the Soul, the Eyes and Ears, against temptations to it. They say in effect, as Ephraim did, in Hos. 14.8. What have I to do any more with Idols? Thus Amnon dealt with Tamar, 1 Sam. 13.15, 17.

2. By their seeking the utter destruction and full mortification of sin: for, hatred is implacable against the whole kind, as we see in a Wolf against all Sheep; nothing will satisfy but the death of its object, as the Lord commanded Israel to do against Amalek, 1 Sam. 15.3.

3. By a continual fight against sin, till it be fully subdued. Gal. 5.17. The flesh lusteth against the Spirit, and the Spirit against the flesh. 1 Pet. 2.11. Dearly beloved, I beseech you as strangers and pilgrims, abstain from fleshly lusts, which war against the soul. Hence they will account them their best friends that help them against sin, their worst enemy.</p></blockquote>

<blockquote><p>As a ground of security that we shall inherit the promises, it is not enough that we can point to a time when we were numbered amongst the members of the visible church. The believer, it is true, draws encouragement from a review of the way by which God has led him, and may legitimately infer, that “He who hath begun a good work” in him “will perform it until the day of Christ.” Yet profession may be mistaken for conversion. However highly we may have been favoured with the means of grace—however regular our attendance on these means may have been—nay, however great may have been our seeming delight in the enjoyment of them, we may never, in reality, have laid hold of Christ.

He only that “endureth to the end shall be saved.” The Lord’s people will undoubtedly be so “kept by the power of God,” as to make it manifest, at the great day, that not one of them has been lost. Yet, during the entire period of their life on earth, they will be found “running with patience the race that is set before them; forgetting the things which are behind, and reaching forth unto those things which are before,” they will be ever “pressing towards the mark for the prize of the high calling of God in Christ Jesus.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As a ground of security that we shall inherit the promises, it is not enough that we can point to a time when we were numbered amongst the members of the visible church. The believer, it is true, draws encouragement from a review of the way by which God has led him, and may legitimately infer, that “He who hath begun a good work” in him “will perform it until the day of Christ.” Yet profession may be mistaken for conversion. However highly we may have been favoured with the means of grace—however regular our attendance on these means may have been—nay, however great may have been our seeming delight in the enjoyment of them, we may never, in reality, have laid hold of Christ.

He only that “endureth to the end shall be saved.” The Lord’s people will undoubtedly be so “kept by the power of God,” as to make it manifest, at the great day, that not one of them has been lost. Yet, during the entire period of their life on earth, they will be found “running with patience the race that is set before them; forgetting the things which are behind, and reaching forth unto those things which are before,” they will be ever “pressing towards the mark for the prize of the high calling of God in Christ Jesus.”

arget="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91246aac61.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/20/thomas-doig-a-profession-is-not-conversion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-35317a98cc" data-kw="">
<blockquote><p>These things, beloved, we write unto you, not merely to admonish you of your duty, but also to remind ourselves. For we are struggling on the same arena, and the same conflict is assigned to both of us. Wherefore let us give up vain and fruitless cares, and approach to the glorious and venerable rule of our holy calling.

Let us attend to what is good, pleasing, and acceptable in the sight of Him who formed us. Let us look steadfastly to the blood of Christ, and see how precious that blood is to God, which, having been shed for our salvation, has set the grace of repentance before the whole world.

Let us turn to every age that has passed, and learn that, from generation to generation, the Lord has granted a place of repentance to all such as would be converted unto Him. Noah preached repentance, and as many as listened to him were saved. Jonah proclaimed destruction to the Ninevites; but they, repenting of their sins, propitiated God by prayer, and obtained salvation, although they were aliens [to the covenant] of God.</p></blockquote>

</figure><figure class="quote" id="q-29968d7c8a" data-kw="">
<blockquote><p>The first step to true and sound repentance is to be wounded and disquieted in our hearts for sin, until our souls be pierced, and as it were struck through with the feeling of our corruptions, and of God’s displeasure, due unto us for the same, we have not made any entrance into the ways of godliness, nor laid the very foundation of the works of conversion, therefore the Prophet Joel exhorting the Israelites to repentance, biddeth them, rent their hearts: that is, the first stone that must be laid in this building: their hearts must be crushed and broken, for the wickedness committed against the Majesty of God; till then there is no turning unto him: one may as well bid a prisoner that is in strong hold, and hath bolts and fetters upon his heels, walk abroad and take the fresh air, and not remain any longer in that dark &amp; loathsome dungeon, as bid one that hath not his heart crushed &amp; humbled to turn unto the Lord: alas he is held fast in the chains of Satan, and cannot stir one foot to God-ward; therefore is it noted in those converts, Act. 2. 37. that They were pricked in their hearts] when they began the work of repentance, the rebukes of God had wakened their drowsy consciences, so that they saw their sins and God’s vengeance due unto them, and the words of Peter had gone through their hearts, even as a two edged sword, and then they were fit to bee soundly healed and comforted, when they had been pierced, and thoroughly wounded by the Arrows of God.

1 First, till the heart be broken for sin, there can be no plain confession of sin, and therefore no repentance. Men naturally are like wild Ass-Colts, nothing will work upon them, nor bring them unto any good frame or order; though they hear often of their faults, they will not acknowledge them, but be still unruly and untamed, as Paul was before his conversion; so long as he was heart-whole in his own conceit, though he had heard many excellent Sermons (no doubt,) yet he was like a beast still, never bewailing nor confessing his grievous offences, till the Lord had taken him down, and thoroughly mastered him.

2 Nay further, men are so far from taking pains to come to a true acknowledgement of their iniquities, till such time as there is a breach made into their hearts by godly sorrow, they do not so much as desire to be delivered from them, nor make any reckoning of God’s mercy for the pardoning of them: till such time as they become mourners for sin, they cannot possibly hunger and thirst after righteousness. And indeed what reason is there that they should esteem of that medicine which will cure, when they do not feel themselves to be sick? they think it a matter worth the looking after, to be freed from poverty, from infamy, from the pestilence, &amp;c. but as for the corruptions of their nature, and the sinfulness of their ways, they were never much troubled with them, and therefore they make little account to be delivered from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal</cite>, (London: William Welbie, 1611), pp 2-4.</span></figcaption>

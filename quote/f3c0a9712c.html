<main class="wrap"><figure class="quote" id="q-f3c0a9712c" data-kw="">
<blockquote><p>It is not enough that a doctrine be erroneous, or that it be dangerous in its tendency; if it be not subversive of one or more of the constituent elements of the Reformed faith, it is not incompatible with the honest adoption of our Confession. It cannot be denied that ever since the Reformation, more or less diversity in the statement and explanation of the doctrines of Calvinism has prevailed in the Reformed Churches. It is equally notorious that for fifty or sixty years such diversities have existed and been tolerated in our own church; nay, that they still exist, and are avowed by Old-school men. If a man holds that all mankind, since the fall of Adam, and in consequence of his sin, are born in a state of condemnation and sin, whether he accounts for that fact on the ground of immediate or mediate imputation, or on the realistic theory, he was regarded as within the integrity of the system. In like manner, if he admitted the sinner’s inability, it was not considered as a proper ground of discipline that he regarded that inability as moral, instead of natural as well as moral… We do not say that the diversities above referred to are unimportant. We regard many of them as of great importance. All we say is, that they have existed, and been tolerated in the purest Calvinistic churches, our own among the rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Retrospect of the History of the Princeton Review’ in The Biblical Repertory &amp; Princeton Review</cite>, (Philadelphia: Peter Walker, 1870–1871), pp. 22–23</span></figcaption>

<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>Some writers, as has been already observed, have allowed that sinners are the subjects of an inability which arises from the depravity; but they still contend that this is not all, but that they are both naturally and morally unable to believe in Christ; and this they think agreeable to the Scriptures, which represent them as both unable and unwilling to come to Him for life. But these two kinds of inability cannot consist with each other, so as both to exist in the same subject and towards the same thing. A moral inability supposes a natural ability. He who never, in any state, was possessed of the power of seeing, cannot be said to shut his eyes against the light. If the Jews had not been possessed of natural powers equal to the knowledge of Christ’s doctrine, there had been no justice in that cutting question and answer, “Why do ye not understand my speech? Because ye cannot hear my word.” [Jn. 8:41] A total physical inability must, of necessity, supersede a moral one. To suppose, therefore, that the phrase, “No man can come to Me,” [Jn. 6:44] is meant to describe the former; and, “Ye will not come to Me that ye may have life,” [Jn. 5:40] the latter; is to suppose that our Savior taught what is self contradictory. Some have supposed that, in attributing physical or natural power to men, we deny their natural depravity. Through the poverty of language, words are obliged to be used in different senses. When we speak of men as by nature depraved, we do not mean to convey the idea of sin being an essential part of human nature, or of the constitution of man: our meaning is that it is not a mere effect of education and example; but is, from his very birth, so interwoven through all his powers, so ingrained, as it were, in his very soul, as to grow up with him, and become natural to him. On the other hand, when the term natural is used as opposed to moral, and applied to the powers of the soul, it is designed to express those faculties which are strictly a part of our nature as men, and which are necessary to our being accountable creatures. By confounding these ideas we may be always disputing, and bring nothing to an issue. … Some have alleged that ‘natural power is only sufficient to perform natural things, and that spiritual power is required to the performance of spiritual things.’ But this statement is far from accurate. Natural power is as necessary to the performance of spiritual as of natural things; we must possess the powers of men in order to perform the duties of good men. And as to spiritual power, or, which is the same thing, a right state of mind, it is not properly a faculty of the soul, but a quality which it possesses; and which, though it be essential to the actual performance of spiritual obedience, yet is not necessary to our being under obligation to perform it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-fuller.html">Andrew Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Worthy of All Acceptation</cite>, ‘On the Inability of Sinners to Believe in Christ &amp; do Things Spiritually Good’ (1781), pt. 3, ‘Objections Answered’, in Works, pp. 172-73</span></figcaption>

ion+of+man%3A+our+meaning+is+that+it+is+not+a+mere+effect+of+education+and+example%3B+but+is%2C+from+his+very+birth%2C+so+interwoven+through+all+his+powers%2C+so+ingrained%2C+as+it+were%2C+in+his+very+soul%2C+as+to+grow+up+with+him%2C+and+become+natural+to+him.+On+the+other+hand%2C+when+the+term+natural+is+used+as+opposed+to+moral%2C+and+applied+to+the+powers+of+the+soul%2C+it+is+designed+to+express+those+faculties+which+are+strictly+a+part+of+our+nature+as+men%2C+and+which+are+necessary+to+our+being+accountable+creatures.+By+confounding+these+ideas+we+may+be+always+disputing%2C+and+bring+nothing+to+an+issue.+%E2%80%A6+Some+have+alleged+that+%E2%80%98natural+power+is+only+sufficient+to+perform+natural+things%2C+and+that+spiritual+power+is+required+to+the+performance+of+spiritual+things.%E2%80%99+But+this+statement+is+far+from+accurate.+Natural+power+is+as+necessary+to+the+performance+of+spiritual+as+of+natural+things%3B+we+must+possess+the+powers+of+men+in+order+to+perform+the+duties+of+good+men.+And+as+to+spiritual+power%2C+or%2C+which+is+the+same+thing%2C+a+right+state+of+mind%2C+it+is+not+properly+a+faculty+of+the+soul%2C+but+a+quality+which+it+possesses%3B+and+which%2C+though+it+be+essential+to+the+actual+performance+of+spiritual+obedience%2C+yet+is+not+necessary+to+our+being+under+obligation+to+perform+it.%E2%80%9D%0A%0A%E2%80%94+Andrew+Fuller+Answers+Objections%2C+%E2%80%98On+the+Inability+of+Sinners+to+Believe+in+Christ+%26+do+Things+Spiritually+Good%E2%80%99+%281781%29+in+pt.+3%2C+%E2%80%98Objections+Answered%E2%80%99+in+The+Gospel+Worthy+of+All+Acceptation%2C+in+Works%2C+pp.+172-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b88a5fd30.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b88a5fd30.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=Some%20writers%2C%20as%20has%20been%20already,being%20under%20obligation%20to%20perform%20it&amp;text=Some%20writers%2C%20as%20has%20been%20already%20observed%2C%20have&amp;text=to%20our%20being%20under%20obligation%20to%20perform%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b52c99742" data-kw="">
<blockquote><p>In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…</p></blockquote>

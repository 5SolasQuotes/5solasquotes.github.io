<blockquote><p>But if it is objected that even the law of Mohammed has been received by many, the answer is that the cases are not alike, because he subjugated them by oppressing them and by force of arms, but the apostles by dying brought others to the faith, and by working signs and prodigies. For he proposed things which pertain to pleasure and lasciviousness, but Christ and the apostles contempt for earthly things: when you received the word of God, which you heard from us, you received it . . . as the word of God (1 Thess 2:13).</p></blockquote>

<blockquote><p>The mind of man is a tabula rasa not absolutely, but relatively as to discursion and dianoetical knowledge (which is acquired necessarily by inferring one thing from another); but not as to apprehensive and intuitive knowledge. For even according to Paul, the work of the law is in such a manner written in the hearts of the Gentiles that they do by nature the things contained in the law. Hence is a twofold inscription upon the heart of man: the one of God in the remains of his image and the natural law; the other of the Devil by sin.</p></blockquote>

<blockquote><p>A controversy respecting the atonement sprang up between Duns Scotus and the followers of Aquinas, which involved fundamental principles in ethics and religion, and divided the Romish Church into two great parties of Thomists and Scotists. Duns Scotus denied the Anselmic doctrine that sin is of infinite demerit, and consequently denied that the suffering of Christ is of infinite value. The relation of the atonement of the Son of God to the sin of mankind, he maintained, is merely an arbitrary and constituted one. The principle upon which he founded his theory was: “Tantum valet omne creatum oblatum, pro quanto acceptat Deus illud, et non plus.” There is no interior fitness and adaptation between Christ’s atonement and man’s sin. God was pleased to accept this particular sacrifice as an offset and equivalent for human transgression, not from any intrinsic value in it, but because he so pleased. He might have accepted any other substitute, or he might have dispensed with accepting any substitute at all. In opposition to this view, the followers of Aquinas maintained the old Anselmic theory of the infinite demerit of sin, and the infinite and objective value of Christ’s satisfaction. In this controversy, the soteriology of the adherents of Aquinas is more in harmony with the Protestant view and feeling; so that we might reverse what Melanchthon remarks of Augustine, and say, that “the opinion of Aquinas is more pertinent, fit and convenient when he disputed than it was when not disputing.” And yet it would be difficult to see how the followers of Aquinas could in the end avoid the conclusions of Duns Scotus, if they started from that doctrine of a relative necessity of satisfying justice which we have seen Aquinas held, in common with all the Schoolmen excepting Anselm. If omnipotence and bare will are more ultimate in the Divine Nature than justice and truth are, then it is difficult to see how Scotus can be censured for holding, that in the last analysis God can dispense with an atonement altogether, and that whatever value the existing judicial provision possesses in the divine plan, it possesses not in itself, but solely by virtue of its optional acceptance by the Omnipotent One who is not limited by anything, not even by his own moral attributes. The controversy, however, ran high between the adherents of Aquinas and Scotus,—the Dominican order generally siding with the former, and the Franciscan with the latter. The Nominalists in philosophy also naturally favoured the views of Scotus, as his theory was that of a nominal and putative satisfaction, in distinction from a real and objective one. The extravagantly speculative minds of the age, those who have given the reputation of hair-splitting and excessive dialectics to Scholasticism, also adopted the positions of Scotus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of Theology</cite>, (New York: Scribners) 2.315</span></figcaption>

</figure><figure class="quote" id="q-dc3d5105c3" data-kw="">
<blockquote><p>Part of Heider’s project is to argue that Suárez was in fact a moderate realist, despite widespread characterizations of him, both by his immediate successors and by recent scholars, as essentially a nominalist. Such characterizations gain strength from Suárez’s own statement that he perhaps differed from the nominalists only modo loquendi (97). Heider, however, argues that it makes more sense to regard Suárez as a moderate realist, of broadly the same stripe as Poinsot, Mastri, and Belluto. It is not always entirely clear, though, wherein Heider disagrees with other commentators. Do they offer substantively different interpretations of Suárez, or are they using different taxonomies, with more or less strict usages of the term “nominalist?” In particular, it is worth noting that, if the crude, but widely used, division between realism and nominalism is employed, moderate realism is a species of nominalism, rather than the realism its name suggests. The great strength of this book is Heider’s masterful, detailed examination of three representative accounts from sixteenth- and seventeenth-century Scholasticism. Suárez offers an original blend of Thomist, Scotist, and nominalist elements; Poinsot’s account is more purely ad mentem Thomi, while Mastri and Belluto take an approach ad mentem Scoti. Of course, there were other streams of thought in the period, but Heider reasonably takes these to be the most important ones… Heider rightly presents Suárez as the first Scholastic of a venerable early modern tradition, rather than as the last schoolman. The present volume decisively dismantles the latter characterization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-heider.html">Daniel Heider</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universals in Second Scholasticism</cite>, (1548–1617), João Poinsot O.P. (1589–1644) and Bartolomeo Mastri da Meldola O.F.M. Conv. (1602–1673)/Bonaventura Belluto O.F.M. Conv. (1600–1676) (Amsterdam: John Benjamins Publishing Company, 2014) 344 pp. | See this review by Sydney Penner. Penner:</span></figcaption>

<blockquote><p>1. Homeostasis: living things regulate themselves internally and thereby preserve themselves.

2. Metabolism: the living being takes in external matter/energy and uses it to sustain itself.

3. Adaptation: the organism changes its internal condition so as to maintain itself in its environment.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-024d08910a" data-kw="">
<blockquote><p>In yet another example of philosophical debate, Reformed concerns over the doctrine of providence and divine foreknowledge of future contingents associated with the rejection of Molinism, brought Reformed orthodox writers into dialogue with Dominican opponents of Molinism and led to the adoption or adaptation on the part of many of the Reformed of the concept of divine concurrence understood as “physical premotion” (praemotio physica). William Twisse advocated the concept, Francis Turretin adapted it selectively, and Richard Baxter polemicized against it as a form of determinism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011)</cite>, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>
<div class="actions"><button class="copy" data-copy="“In yet another example of philosophical debate, Reformed concerns over the doctrine of providence and divine foreknowledge of future contingents associated with the rejection of Molinism, brought Reformed orthodox writers into dialogue with Dominican opponents of Molinism and led to the adoption or adaptation on the part of many of the Reformed of the concept of divine concurrence understood as “physical premotion” (praemotio physica). William Twisse advocated the concept, Francis Turretin adapted it selectively, and Richard Baxter polemicized against it as a form of determinism.”

— Richard Muller, ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011), p. 23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+yet+another+example+of+philosophical+debate%2C+Reformed+concerns+over+the+doctrine+of+providence+and+divine+foreknowledge+of+future+contingents+associated+with+the+rejection+of+Molinism%2C+brought+Reformed+orthodox+writers+into+dialogue+with+Dominican+opponents+of+Molinism+and+led+to+the+adoption+or+adaptation+on+the+part+of+many+of+the+Reformed+of+the+concept+of+divine+concurrence+understood+as+%E2%80%9Cphysical+premotion%E2%80%9D+%28praemotio+physica%29.+William+Twisse+advocated+the+concept%2C+Francis+Turretin+adapted+it+selectively%2C+and+Richard+Baxter+polemicized+against+it+as+a+form+of+determinism.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+ch.+1%2C+%E2%80%9CDiversity+in+the+Reformed+Tradition%3A+a+Historiographical+Introduction%E2%80%9D+in+eds.+Haykin+%26+Jones%2C+Drawn+into+Controversie%3A+Reformed+Theological+Diversity+%26+Debates+within+Seventeenth-Century+British+Puritanism+%28V%26R%2C+2011%29%2C+p.+23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F024d08910a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/024d08910a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=In%20yet%20another%20example%20of%20philosophical,it%20as%20a%20form%20of%20determinism&amp;text=In%20yet%20another%20example%20of%20philosophical%20debate%2C%20Reformed&amp;text=polemicized%20against%20it%20as%20a%20form%20of%20determinism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2c0347ac9" data-kw="">
<blockquote><p>I first note that Thomas in this matter taught exactly the same as Scotus with regard to premotion and the determination of the secondary cause by the first, in general. In particular, however, Scotus expressly rejected that physical predetermining quality and a similar influence through something else impressed antecedently in the free will — which many Thomists posited, because Thomas manifestly neither posited nor rejected it, from which they took occasion to introduce it. But Thomas, if my judgment carries any weight, never required it; nor could I find a place in him where he would admit it. And this I have often publicly affirmed in the very presence of Thomists. Therefore I hold that Thomas and Scotus are in agreement on excluding that quality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo’s Judgment</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

ty&amp;text=I%20first%20note%20that%20Thomas%20in%20this%20matter&amp;text=Scotus%20are%20in%20agreement%20on%20excluding%20that%20quality" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d43476860a" data-kw="">
<blockquote><p>All the acts necessary for war-making are, in an eminent manner, ascribed to God, as (1) The Lord fights for his own people. (2) The Lord scattered the enemies. (3) The Lord slew Og, king of Bashan. (4) The battle is the Lord’s. (5) The victory [is] the Lord’s; therefore Israel never fought a battle. So Deut. 32[:10], The Lord alone led his people — the Lord led them in the wilderness — their bow and their sword gave them not the land. God wrought all their works for them (Isa. 26:12), therefore Moses led them not; therefore the people went not on their own legs through the wilderness; therefore the people never shot an arrow, never drew a sword. It follows not. God did all these as the first, eminent, principal and efficacious pre-determinator of the creature (though this Arminian and popish prelate [John Maxwell] mind not so to honour God).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 18</span></figcaption>

</figure><figure class="quote" id="q-5f0eaba27e" data-kw="Author of sin">
<blockquote><p>God by his influence is indeed the principal cause of the act itself, but man is the sole cause of the sin itself, which is in that act. … Nor can even one theologian be shown who has said that God is the author of lawlessness, or of sin insofar as it is sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §32</span></figcaption>

</figure><figure class="quote" id="q-b7e4f428d6" data-kw="">
<blockquote><p>How may we attribute this same work to God, to Satan, and to man as author, without either excusing Satan as associated with God, or making God the author of evil? Easily, if we consider first the end, and then the manner, of acting. The Lord&#x27;s purpose is to exercise the patience of His servant by calamity; Satan endeavors to drive him to desperation; the Chaldeans strive to acquire gain from another&#x27;s property contrary to law and right. So great is the diversity of purpose that already strongly marks the deed. There is no less difference in the manner. The Lord permits Satan to afflict His servant; He hands the Chaldeans over to be impelled by Satan, having chosen them as His ministers for this task. Satan with his poison darts arouses the wicked minds of the Chaldeans to execute that evil deed. They dash madly into injustice, and they render all their members guilty and befoul them by the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.4.2</span></figcaption>

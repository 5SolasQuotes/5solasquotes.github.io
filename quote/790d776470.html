<blockquote><p>Must those who feel spiritually weak abstain from participation in the Lord’s Supper, from listening to the divine Word and from the prayers, because they think they have no faith or question whether they have any?

Answer: By no means, for God must be sought with constant yearning, also when the feeling of his nearness is not experienced. In addition, it is by these means that the life of the Spirit is maintained, just as we eat food to preserve life, even though we have neither desire nor appetite for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius-and-johannes-hoornbeeck.html">Gisbertus Voetius and Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Desertion</cite>, trans. John Vriend and Harry Boonstra, ed. M. Eugene Osterhaven (1659; Grand Rapids MI: Reformation Heritage Books, 2003), p. 51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4808383cac" data-kw="">
<blockquote><p>The proofs which are alleged [for Christ’s physical presence in communion] from the omnipotency of God, do infer no corporal presence of Christ in the Supper. Not the First; because the omnipotency of God excludeth, both things contrary to his nature, and things contradictory; and not to be able to do those things, is not a point of weakness, but of infinite power, and constancy. Not the Second; because his first apparition was heavenly, which nothing furthereth the presence of Christ on earth: The second, was in the night, which appeared not to the eyes, but to the mind.

Not the Third; because the Fathers treated, either of the presence of Christ, as touching his person, as Chrysostom; or of the Sacramental presence of his body in the Supper, as Ambrose; or of the effect of the eating of his body, as Cyril, and Theophilact: or lastly, they spake Hyperbolically, as Augustine.

Not the Fourth; because, to reason from the divine nature, to the human, and from the one part of man, which is spiritual, to the other, which is corporal, is even proportionally inconsequent. Not the Fifth; because it is one thing to treat of the mysteries, which go beyond Nature; but another thing of the miracles which overthrow nature. Not the Sixt; because of those things, which are equally united, the one cannot be any where else, where the other is not, or may not be; and to attribute to Christ two bodies equally united, were a monstrous thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved</cite>, trans. John Gawen (London: Francis Burton, 1610), 2.13, pp 430-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-94c732a7ae" data-kw="">
<blockquote><p>…understanding that of the prayer and communion in the sacraments, it [communicating with infidels and unbelievers] does admit exception: for notwithstanding if it were in my choice to avoid them, I ought not to join with them, yet having no authority, or no strength and power to make good the authority of separating of them, I ought not therefore to cease the service of God which is commanded. … Howbeit there is here [in 1 Cor. 5] to be considered that one which avoids such a man’s company at the table ordained for the belly, shall not therefore be bound to abstain from the Lord’s table prepared for the spiritual nourishment. Because although it be in him to deprive him from his own table, yet is it not so in his power to put him from the table of the Lord. And if the case were so that the person excommunicated were placed at your table by the prince whose authority in such a case you cannot avoid, and order taken that you should never eat but he should eat with you, I ask you herein whether you think that you should rather famish yourself than take of the same table with him. And if you esteem that you ought rather to eat of the same dish with him than pine to death, much more ought you to take at the Lord’s table with him rather than by abstaining run in danger of a spiritual famine. So that when a Christian is forbidden to forbear to eat with an excommunicated person one way or other, it is with this caution, so far forth as by abstaining from his necessary nourishment inward or outward he become not a murderer of his own person, which is so often as for the presence of the wicked (whom he is not able to decline) he hinders the good estate of himself either bodily or ghostly [spiritually]. Where if you say that these are cases supposed and which never come to practice, it is sufficient answer that they may come to practice if they never did, and therefore have the same strength of reason as if they were of continual experience. Howbeit you may consider this more apparently in a faithful woman, whose husband being excommunicated commands her to bear him company at the table. And forasmuch as the Church discipline does not overthrow the authority of the husband in his house, which is of God as well as the other, the wife is to yield unto her husband, although it be not without testimony of grief in that behalf. How much more should she so do, if her husband would be so froward as not to let her have any nourishment but at his board [table].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951), ‘Letter to Mrs. Stubbes his sister-in-law to persuade her from Brownism’, pp. 72-73</span></figcaption>

<blockquote><p>VIII. None but the faithful do truly eat Christ’s true flesh.

But albeit the flesh of Christ be offered unto all in the supper to be eaten, yet we believe that it is truly eaten of the faithful only, both because they alone have communion with Christ and with his flesh and blood, and others have not, neither by receiving the bread are made partakers of him, and also because they alone have the Spirit of Christ by virtue of whom only the flesh of Christ is truly communicated, yea, and also because they alone do bring true faith, without which the same cannot be truly received and eaten. For Christ giveth not his true body to be truly and indeed eaten, but only to them, which do as well believe that the same was betrayed for them unto death, and his blood shed for remission of their sins, as those words to be true: ‘This is my body.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, eds Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XVI.VIII, 1: 305-07.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>
<div class="actions"><button class="copy" data-copy="“VIII. None but the faithful do truly eat Christ’s true flesh.

But albeit the flesh of Christ be offered unto all in the supper to be eaten, yet we believe that it is truly eaten of the faithful only, both because they alone have communion with Christ and with his flesh and blood, and others have not, neither by receiving the bread are made partakers of him, and also because they alone have the Spirit of Christ by virtue of whom only the flesh of Christ is truly communicated, yea, and also because they alone do bring true faith, without which the same cannot be truly received and eaten. For Christ giveth not his true body to be truly and indeed eaten, but only to them, which do as well believe that the same was betrayed for them unto death, and his blood shed for remission of their sins, as those words to be true: ‘This is my body.’”

— Jerome Zanchi, De religione christiana fides – Confession of Christian Religion, eds Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XVI.VIII, 1: 305-07.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+None+but+the+faithful+do+truly+eat+Christ%E2%80%99s+true+flesh.%0A%0ABut+albeit+the+flesh+of+Christ+be+offered+unto+all+in+the+supper+to+be+eaten%2C+yet+we+believe+that+it+is+truly+eaten+of+the+faithful+only%2C+both+because+they+alone+have+communion+with+Christ+and+with+his+flesh+and+blood%2C+and+others+have+not%2C+neither+by+receiving+the+bread+are+made+partakers+of+him%2C+and+also+because+they+alone+have+the+Spirit+of+Christ+by+virtue+of+whom+only+the+flesh+of+Christ+is+truly+communicated%2C+yea%2C+and+also+because+they+alone+do+bring+true+faith%2C+without+which+the+same+cannot+be+truly+received+and+eaten.+For+Christ+giveth+not+his+true+body+to+be+truly+and+indeed+eaten%2C+but+only+to+them%2C+which+do+as+well+believe+that+the+same+was+betrayed+for+them+unto+death%2C+and+his+blood+shed+for+remission+of+their+sins%2C+as+those+words+to+be+true%3A+%E2%80%98This+is+my+body.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+De+religione+christiana+fides+%E2%80%93+Confession+of+Christian+Religion%2C+eds+Luca+Baschera+and+Christian+Moser%2C+Studies+in+the+History+of+Christian+Traditions%2C+vol.+135+%281585%3B+2+vols%2C+Leiden%3A+Brill%2C+2007%29%2C+XVI.VIII%2C+1%3A+305-07.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75a9263317.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75a9263317.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/23/girolamo-zanchi-the-faithful-eat-christs-flesh-in-communion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

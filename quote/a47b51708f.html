<main class="wrap"><figure class="quote" id="q-a47b51708f" data-kw="">
<blockquote><p>But to answer more clearly to the point in hand: We must first consider that mere or purely conditional decrees, or conditional volitions, agree not with the perfection of the divine nature. Volitiones pure conditionales sunt alienae a sapientia et prudentia Dei. (Ruiz, De Voluntate, disp. 20, §1) [Volitions that are purely conditional are incompatible with the wisdom and prudence of God.] Voluntas Dei conditionata dici potest, non quia actu feratur in objectum sub conditione, sed quia ex illa voluntate quae praesens est alia oriretur si conditio in objecto poneretur. (Vasqez, in 1st part, disp. 83, p. 511) [The will of God may be called conditional, not because it is actually directed toward its object under a condition, but because from that will which is presently existing another would arise if the condition were to be posited in the object.] The speeches therefore above-cited out of Scripture do not imply a conditional will in God suspended for any moment of time, and then post purificatam conditionem [after the condition has been fulfilled], becoming an absolute and effectual will (see Ruiz, De Scientia, disp. 71, §7), as the like conditional propositions do in us, who have neither knowledge whether the condition will be certainly performed or no, nor yet power in ourselves to work the condition whereupon the future act of our will was suspended. (Ruiz, De Voluntate, disp. 8, §7) But in God, who knows eternally what every man will do or not do, and who in Himself has an absolute power and freedom to make men do any good whereunto He makes promise of reward, and to leave them to their own defective freewill in doing those things for which He has threatened desertion and destruction, these conditional decrees or volitions must be far otherwise conceived: namely, not purely but mixedly conditionalia [conditionals], that is, grounded in some absolute revealed decree of God to the performance whereof He has tied Himself. For example; It is an absolute decree of the divine will published in the gospel that whosoever repents, believes, perseveres, shall be saved: From hence is derived that mixed conditional decree: If Cain, if Judas, if any other repent and believe, they shall be saved. Now such mixed conditional decrees carry no contradiction to the absolute decrees of election and non-election or reprobation. For who sees not that these two propositions may well stand together: I will that if Judas repent and believe he shall have remission and salvation; I will not give unto Judas the gift of repentance, of faith, and of eternal life? The former conditional proposition contains all which this author [Davenant is writing against] can truly collect from the testimonies alleged; and the latter does as truly infer that absolute reprobation for which we contend. For the absolute decree of God resolving not to give faith, repentance and eternal life unto Judas, is that which we understand by the word ‘reprobation’: and this is never abrogated by any conditional promise founded in any universal absolute decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer to his Five Reasons against Absolute Reprobation’, pp. 225-27</span></figcaption>

<blockquote><p>This comes in here as a token of God’s displeasure at those who married strange wives; He threatens to withdraw from them his Spirit, whom they had grieved by such marriages, contrary to their convictions: fleshly lusts are often punished with spiritual judgments, the sorest of all judgments. Or as another occasion of the great wickedness of the old world; the Spirit of the Lord, being provoked by their resistance of his motions, ceased to strive with them, and then all religion was soon lost among them. This He warns them of before, that they might not further vex his Holy Spirit, but by their prayers might stay Him with them. Observe in this verse, I. God’s resolution not always to strive with man by his Spirit. The Spirit then strove by Noah’s preaching (1 Pt. 3:19–20) and by inward checks, but it was in vain with the most of men; therefore, says God, He shall not always strive. Note, 1. The blessed Spirit strives with sinners, by the convictions and admonitions of conscience, to turn them from sin to God. If the Spirit be resisted, quenched, and striven against, though He strive long, he will not strive always, Hos. 4:17. Those are ripening apace for ruin whom the Spirit of grace has left off striving with. II. The reason of this resolution: For that he also is flesh, that is, incurably corrupt, and carnal, and sensual, so that it is labor lost to strive with him. Can the Ethiopian change his skin? He also, that is, All, one as well as another, they have all sunk into the mire of flesh. Note, 1. It is the corrupt nature, and the inclination of the soul towards the flesh, that oppose the Spirit’s strivings and render them ineffectual. When a sinner has long adhered to that interest, and sided with the flesh against the Spirit, the Spirit justly withdraws his agency, and strives no more. None lose the Spirit’s strivings but those that have first forfeited them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 6:3</span></figcaption>

<blockquote><p>Objection 2: Mt. 23:37, ‘How often would I have gathered thy children together, and thou wouldst not. How did Christ will, and so will that He complains of those who would not, if He had not through his help made them able [to] will, whom He knew could not will? Answer. Christ is here said to have willed to gather them together, not by the will of his good pleasure, which may never be resisted, but by his signifying or revealed will. For He is said to will to gather all unto Himself, because by the preaching of the Word He calls all in common unto salvation, and prefixes to Himself this end of preaching, that they should commit themselves to his protection and fidelity. By this will therefore He may will to gather the Jews together, though in the meantime He do not help them, that they themselves may be able to will.</p></blockquote>

<blockquote><p>The words of the apostle, ‘God will have all men to be saved,’ etc. can be understood in three ways. First, by a restricted application, in which case they would mean, as Augustine says (De praed. sanct. i, 8: Enchiridion 103), God wills all men to be saved that are saved, not because there is no man whom He does not wish saved, but because there is no man saved whose salvation He does not will. Second, they can be understood as applying to every class of individuals, not to every individual of each class; in which case they mean that God wills some men of every class and condition to be saved, males and females, Jews and Gentiles, great and small, but not all of every condition. Third, according to Damascene (De Fide Orth. ii, 29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>

<blockquote><p>In the next place you [Thomas Jackson, an Arminian] touch upon a distinction much talked of, and as much advanced by some as cried down by others. Yet both Scotus and Durandus give a tolerable, and Aquinas with the Dominicans after him, an orthodox interpretation thereof, though neither suitable to the mind of [John] Damascene, commonly reputed the father of it. Yet look what in this kind is wanting in them is supplied by [Gregory] Arminiensis, who gives both an orthodox construction thereof, and that also in conformity to the opinion of Damascene, of whose text he gives a very sound and orthodox interpretation and the more orthodox the more opposite to their constructions who, with great cry of words draw it to the countenancing of their Arminian tenets without cause. Love, you say, is the fruit of God’s antecedent will, wrath and severity are the proper effects of his consequent will. Fruit and effect you make all one (as with good reason you may). Now what, I pray you, is this effect which you call love? You seem to intimate that they are the effects of creation, as when you say, ‘Every particular faculty of soul or body is a pledge undoubted of God’s love.’ Yet faculties of souls and bodies are found in beasts, but God’s antecedent will in Damascene is referred wholly unto men. Neither does Damascene at all refer it to the work of creation, but makes it to be that whereby God will have all to be saved. Liberty of will is proper to man in distinction from beasts, but who sees not that this indifferently makes him obnoxious unto damnation as well as capable of salvation? Then when you say wrath and severity is the effect of God’s consequent will, what do you mean by ‘wrath’? Is it either a resolution to take vengeance, or the execution of vengeance itself? I think you take it for the execution of vengeance itself. Now there is an execution of reward also properly opposite unto this which, whether it be the same love you speak of, it became you to express so much, or whether you conceive it to be different, yet it were fit you should take notice of it and acknowledge that this is a fruit of God’s consequent will as well as wrath; that as effectually presupposing obedience, as this disobedience: and that love in rewarding is every way as infallibly consequent to the obeying of God’s will revealed as wrath is of our neglecting and despising it. A full explication of this distinction you promise in good time; how well you perform it we may in good time consider with God’s help. Next you enter upon another form of the same distinction (as you pretend) and you suffer it to fly with one wing, for you talk of God’s absolute will (which you seem to confound with God’s antecedent will), but as touching the member congruously opposite, you leave us to seek for that. But as it is we are to consider it: God’s absolute will was (you say) to have men capable of Heaven and Hell, of joys and miseries immortal. This cannot be understood of God’s consequent will; for this absolute will is indifferent to end in the bestowing of reward or punishment, and is immediately terminated only in making man capable of either; but his consequent will is not so indifferent. For the only effect thereof you mention to be wrath and severity, and this presupposes rather than causes capableness. Neither can this absolute will be the antecedent will of God according to Damascene’s meaning. For the antecedent will in Damascene is only referred to the will of God, whereby He wills man’s salvation: but this absolute will is (you say) to have men capable of Heaven and Hell. To help this, you tell us that this absolute will (whose possible objects are two) is in the first place set on man’s eternal joy. But you do not proceed to show on what it is set in the next place, as if by such like incongruities you desired rather to confound your reader [rather] than to satisfy him. Yet by the tenor of your discourse you leave it to us to guess that in the second place, to wit upon the despising of God’s love, it is set upon a man’s damnation. So that by this your doctrine, both God’s antecedent will and consequent will is all one, and that is God’s absolute will. But no such thing is found in Damascene, from whom, such as you are, do usually take this distinction of will antecedent in God and will consequent: And indeed you do well to make one as absolute as another; for like as wrath, the fruit of this will of God in the second place (as you imply) has not its course but upon presupposition of disobedience; so in like manner, the proper opposite to wrath on the other side, the fruit of this will of God in the first place, has not its course but upon presupposition of obedience.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c4af89eb80" data-kw="">
<blockquote><p>The Father’s appointing him to be a sacrifice, doth not impair his own willingness in undertaking. The Father is said to send him and deliver him, John iii. 84, Rom. viii. 32; not that the Son was over-persuaded, or came only out of obedience, without any inclination of his own. The Father being the root and fountain of the deity, all actions are originally ascribed to him, though common to all; so he is first in order of being, as he is first in order of working.

The Father is said to deliver him, because the first motion of redemption is supposed to arise from the will and motion of the Father; yet the love of Christ was the spring of all mediatory actions, and his taking our nature on him; and therefore he is no less said to give himself, than the Father is said to give him to us and for us. God is said to set him forth, Rom. iii. 25; yet he is said to come, Mat. xx. 28, not thrust out or forced to come. God lays our sins upon him, yet Christ is said to bear them.

His engagement was an act of choice, liberty, and affection. He could not be constrained by his Father to undertake it; his will was as free in consenting, as his Father was in proposing. The Spirit is said to be sent by the Father and the Son, to take of Christ’s and show it to us, to fit those for heaven that are given to Christ; yet his distributions are according to his own will: 1 Cor. xii. 11, ‘Dividing to every man according as he will.’

If you consider Christ as one God with the Father, there is but one and the same will in both. Will belongs to essence or nature; the essence of God being one, there are not in God divers wills, though the Godhead be in divers persons, because the power of willing is the nature, not a personal propriety.

The decree of redemption was joint in Father and Son. What Christ decreed as God, he executed as man; and what he willed from eternity, he began in time to will as man, Christ, as God, gave himself to death with the same will and’ by the same action as the Father gave him; but as man he gave himself by a will inspired by the Father.

Yet for our conception’s sake the Scripture represents things so as if they were distinct wills, which yet we must not imagine, any more than because the Scripture, in condescension to our weakness, represents God with eyes, and ears, and hands, we must conceive God to have a fleshly body like ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Voluntariness of Christ’s Death</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 543-44.</span></figcaption>

<blockquote><p>Consider those men who are devoted to horse racing. They are named after the colours and the sides on which they have placed themselves. You know the names without my mentioning them. If it is thus that you have got the name of Christian, the mere title is a very small thing even though you pride yourself upon it. But if it is because you believe Him to be God, shew your faith by your works. If the Son is a creature, even now also you are worshipping the creature instead of the Creator. If the Holy Ghost is a creature, you are baptized in vain, and are only sound on two sides, or rather not even on them; but on one you are altogether in danger.

Imagine the Trinity to be a single pearl, alike on all sides and equally glistening. If any part of the pearl be injured; the whole beauty of the stone is gone. So when you dishonour the Son in order to honour the Father, He does not accept your honour. The Father doth not glory in the dishonour of the Son. If a wise Son maketh a glad Father, how much more doth the honour of the Son become that of the Father! And if you also accept this saying, My Son, glory not in the dishonour of thy Father, similarly the Father doth not glory in the Son’s dishonour. If you dishonour the Holy Ghost, the Son receiveth not your honour. For though He be not of the Father in the same way as the Son, yet He is of the same Father.

Either honour the whole or dishonour the whole, so as to have a consistent mind. I cannot accept your half piety. I would have you altogether pious, but in the way that I desire. Pardon my affection: I am grieved even for those who hate me. You were one of my members, even though you are now cut off: perhaps you will again become a member; and therefore I speak kindly. Thus much for the sake of the Eunuchs, that they may be chaste in respect of the Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oration XXXVII. On the Words of the Gospel, “When Jesus had finished these sayings,” etc. – S. Matt. XIX. I.</cite>, (n.d.), 6-7 in Nicene and Post-Nicene Fathers 2, 7: 343.</span></figcaption>

<blockquote><p>Engages narrative theology and post-metaphysical thought of the last 75 years by retrieving the exegetical and metaphysical account of Aquinas.” – Mark Jones Wanless, Brandon L. – Universality &amp; the Divine Essence: St. Thomas Aquinas on the Unity Characteristic of the Trinitarian Persons a Masters thesis (University of St. Thomas, 2015) 92 pp. Introduction: “The greatest of the Scholastic doctors understood himself as a conduit of the wisdom he himself received from earlier doctors of the Church. This medieval method of theology—originating in part with such persons as St. John of Damascus in the East and Peter Lombard in the West—amounted to a synthetic engagement of the patristic theologians with the goal of producing a unified and holistic theological account of the faith… …The disagreement itself regards the proper predication of the relation of the three persons of the Trinity to the divine nature, and whether we can speak of the divine essence as a universal, that is, as a relation of three individuals to a species. In other words, are the trinitarian persons three individuals of the one divine species of divinity? Augustine argues in the negative, whereas [John the] Damascene speaks affirmatively…. After addressing the specifics of the relative positions of Augustine and Damascene, and their treatment by Peter Lombard in his Sentences in the following chapter, I will spend the bulk of this paper examining Aquinas’s theology of the Trinity… he uniquely provides a definitive account of the various concepts needed to thoroughly understand the relation of individuals to a species and its applicability to the Godhead… Aquinas proves on multiple levels that, properly speaking, God cannot be said to be a divine species with three subordinate individuals… I will also show how it is that Aquinas recognizes some similarities (and thus allows for Damascene’s position) between the species/individual relationship and that of the divine essence and persons… What follows in this paper is a relatively unique Thomistic analysis of this question, putting to use his trinitarian and metaphysical principles as a way to understand all the critical implications of a relationship of universality between essence and persons in the Godhead.</p></blockquote>

d+cannot+be+said+to+be+a+divine+species+with+three+subordinate+individuals%E2%80%A6+I+will+also+show+how+it+is+that+Aquinas+recognizes+some+similarities+%28and+thus+allows+for+Damascene%E2%80%99s+position%29+between+the+species%2Findividual+relationship+and+that+of+the+divine+essence+and+persons%E2%80%A6+What+follows+in+this+paper+is+a+relatively+unique+Thomistic+analysis+of+this+question%2C+putting+to+use+his+trinitarian+and+metaphysical+principles+as+a+way+to+understand+all+the+critical+implications+of+a+relationship+of+universality+between+essence+and+persons+in+the+Godhead.%E2%80%9D%0A%0A%E2%80%94+Matthew+Levering%2C+Scripture+%26+Metaphysics%2C+%28Blackwell%2C+2004%29+266%2C+pp.+ToC&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F789947dfe9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/789947dfe9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=Engages%20narrative%20theology%20and%20post%2Dmetaphysical%20thought,essence%20and%20persons%20in%20the%20Godhead&amp;text=Engages%20narrative%20theology%20and%20post%2Dmetaphysical%20thought%20of%20the&amp;text=universality%20between%20essence%20and%20persons%20in%20the%20Godhead" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5edfc0ba95" data-kw="Old Testament Trinity">
<blockquote><p>From the arguments adduced by us before to prove the necessity of this doctrine as a fundamental article, it might be satisfactorily inferred that it was revealed and known under the Old Testament (since fundamentals are the same among all believers). … It therefore becomes necessary to establish against both the truth of this mystery not only from the New, but also from the Old Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.26.1</span></figcaption>

</figure><figure class="quote" id="q-42b723756a" data-kw="">
<blockquote><p>That Christ is Deus de Deo, God of God, is thus clearly proved out of Scripture; whosoever is God and the Son of God, must needs be God of God; but Christ is God and the Son of God, ergo &amp;c. But it hath been objected, if he be God of God, then he must have his essence communicated to him from the Father, and so be essentiatus a patre, essentiated, or natured from the Father: this will not follow, no more then that Socrates is essentiatus a Sophronisco, but only that he is genitus a patre, begotten of his Father, and so is recipiens essentiam, or habens essentiam communicatam a patre; which manner of speech is approved of by Beza, filius est a patre per ineffabilem totius essentiae communicationem ab aeterno: the Son is from the Father by an unspeakable communication of his whole essence from eternity: and Symlerus, non negamus silium haberea essentiam a Deo patre, sed essentiam genitam negamus: we do not deny that the Son hath his essence from God the Father, but we deny that the essence is begotten, and why should we boggle at this phrase, when our Lord himself acknowledgeth, Ioh. 5.26. omnia mihi data sunt a patre meo, &amp; pater dedit filio habere vitam in se, all things are given me of my Father?

Neither doth this any way contradict Calvin his autotheos, God of himself; which form of expression, though some protestants as well as papists have excepted against, yet I am of [William] Whitaker’s mind, in his answer to the 7th reason of Campian, that it is verissime &amp; sanstissime dictum, most truly and religiously spoken; nam si ex se Deus non est, omnino Deus non est: for if he be not God of himself, he is not God at all: let St Augustine be the umpire, and reconcile both, Christus ad se Deus, dicitur ad patrem filius; Christ may be considered two ways, either absolutely, and so he is Deus ex se, God of himself, as the Father is and the holy Spirit; or relatively, as filius, and so he is Deus de Deo, as he is the Son, so he is God of God: yea but these phrases may be taken in an ill sense, and so may all the Articles of the Creed, as you may see in the Parisian censure set out by the Jesuits; nay so may the whole Scripture, as St Peter teacheth us, which … the ignorant &amp; unstable pervert: what then, must we weed up all the flowers of Paradise, because heretics, like spiders, suck such juice out of them which they turn into poison?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacra nemesis, The Levite’s scourge, or, Mercurius disciplined. Also diverse remarkable disputes and resolved in the Assembly of Divines related, episcopacy asserted, truth righted, innocency vindicated against detraction</cite>, (Oxford: Leonard Lichfield, 1644), pp 17-18.</span></figcaption>

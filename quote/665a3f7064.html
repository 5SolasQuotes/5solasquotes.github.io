<main class="wrap"><figure class="quote" id="q-665a3f7064" data-kw="">
<blockquote><p>The answer is very easy: as Christ cannot be divided into parts, so the two things, justification and sanctification, which we perceive to be united together in him, are inseparable. Whomsoever, therefore, God receives into his favor, he presents with the Spirit of adoption, whose agency forms them anew into his image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-120097347c" data-kw="">
<blockquote><p>The state of the case is really this, — that the faithful are never reconciled to God without the gift of regeneration; nay, we are for this end justified, — that we may afterwards serve God in holiness of life. Christ indeed does not cleanse us by his blood, nor render God propitious to us by his expiation, in any other way than by making us partakers of his Spirit, who renews us to a holy life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 6:2</span></figcaption>

</figure><figure class="quote" id="q-052ea44d12" data-kw="">
<blockquote><p>Now, since Christ confers upon us, and we obtain by faith, both free reconciliation and newness of life, reason and order require that I should here begin to treat of both. The shortest transition, however, will be from faith to repentance; for repentance being properly understood it will better appear how a man is justified freely by faith alone, and yet that holiness of life, real holiness, as it is called, is inseparable from the free imputation of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.1</span></figcaption>

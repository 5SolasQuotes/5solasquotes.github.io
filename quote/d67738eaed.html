<main class="wrap"><figure class="quote" id="q-d67738eaed" data-kw="">
<blockquote><p>We may now readily perceive the difference between the Essence of God, and the Persons, subsisting in the divine essence. By the term, Essence, we are to understand, in reference to this subject, that which the eternal Father, Son, and Holy Spirit are considered, and declared to be, singly and absolutely in themselves, and which is common to the three. By the term, Person, however, we are to understand that which the three persons of the Godhead are considered and declared to be individually and relatively, or as compared with each other, and which they are according to the mode of existence peculiar to each. Or, we may define Essence as the very being of God—the very, eternal, and only Deity—whilst the term Person refers to the mode, or manner, in which the being of God, or the divine essence, subsists in each of these three. God the Father is that Being who is of himself, and not from another. The Son is that self-same Being, or essence, not of himself, but of the Father. The Holy Spirit is in like manner the self-same Being, not of himself, but from the Father and the Son. Thus the Being, or divine essence, of there persons of the Godhead is one and the same in number. But to be of himself, or from another—from one, or from two; that is, to have this one divine essence of himself, or to have it communicated from another—from one or from two, expresses the mode of existence which is three-fold and distinct; to wit, to be of himself, to be begotten or generated, and to proceed; and hence, the three persons which are expressed by the term, Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Cincinnati, OH: Elm Street Printing Company, 1888), 130. (modified)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d403a142c2" data-kw="">
<blockquote><p>The Word is that through which the Holy Spirit commences and confirms faith in us, and for this reason, should go before the sacraments. The sacraments are means through which the Holy Spirit confirms faith already called into exercise, and for this reason ought to follow the Word. The reason of this difference is that the sacraments do not exert any influence unless they be understood. There is no desire for that which is unknown. There must, therefore, necessarily be some explanation of the sacraments out of the Word before they are observed. The case is different, however, in regard to the infants of the church: for in them the Holy Spirit neither begins, nor confirms faith by means of the Word; but by an inward working; and that because they are also included in the covenant and promise of God, being born in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, following his commentary on Q&amp;A #7, 352 (on Heidelberg 67)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-ffeea9e3e5" data-kw="undivided external works">
<blockquote><p>Although the external works are undivided and equally common to the single persons (both on the part of the principle and on the part of the accomplishment), yet they are distinguished by order and by terms. For the order of operating follows the order of subsisting. As therefore the Father is from himself, so he works from himself; as the Son is from the Father, so he works from the Father; as the Holy Spirit is from both, so he works from both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.27</span></figcaption>

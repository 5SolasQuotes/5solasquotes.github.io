<blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it [reason] can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Use of Reason in Matters of Faith’ in Willem J. van Asselt, Introduction to Reformed Scholasticism</cite>, (RHB, 2011), Appendix 2, pp. 226-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<blockquote><p>39. It is a dreadful thing to be over-bold, rash and presumptuous, in speaking and asserting anything without clear proof, of God’s knowledge and will, especially to reduce them to all the modes and methods of a man, even as to the order of his acts: seeing we are forced to confess that even intellection and volition are spoken of God with exceeding great impropriety, and man’s acts, which are the prius significatum [the primary meaning], are further below God’s than a worm is below a man. Therefore were it not that the presumption of the schools and polemical writers has made that necessary as defensive, which else would not be so, I should scarce dare to say this little following.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), sect. 4, ‘Of God’s relations to the creature…’</span></figcaption>

</figure><figure class="quote" id="q-32b5ee0652" data-kw="">
<blockquote><p>XV. So far is the inferior part of the soul [the carnal desires] from contending of itself with the superior [that which is rational and spiritual] that on the contrary (according to the Philosopher [Aristotle]), it was born to obey (peitharchein pephyke) and is naturally subordinated to it (Aristotle, Nichomachean Ethics 10.9.4 [Loeb, 628-29]). The propensions of both can be diverse, but not contrary in themselves (rather only accidentally on account of sin). Man could be carried naturally towards both sensible and spiritual good, but in their own order and without a rebellion between the flesh and the spirit. Thus the soul would always hold dominion and the flesh obey and subject all its own motions and inclinations to it. The sensible good is contained in the intelligible good and the object of the sensitive appetite stands related to the object of the natural (as the means to the end). Therefore, as long as man regarded the sensible good as the means, there was no vice in him. But when departing from God, he began to be drawn to the object of the sensitive appetite as his ultimate end and highest good (which was effected by sin). At length the disorder (ataxia) arose which disturbed the order constituted by God. Therefore, we must accurately distinguish here the appetite (which was natural and ordinate) from that which was preternatural and inordinate [as in Romanism]. The latter is repugnant to reason, but not equally the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, The Reformed View | Institutes (P&amp;R) | vol. 1, 5th Topic, ‘Creation’, Q. 11, ‘Was Original Righteousness Natural or Supernatural? The Former we Affirm, the Latter we Deny Against the Romanists.’, p. 473</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-41388c7879" data-kw="">
<blockquote><p>Man truly begets man, although the soul is created by God, not because he only bestows him a body, nor because he prepares the body for receiving the soul… but because from the man who begets comes the very action by which the rational soul is substantially united to the body, and begins to inform, inhabit, and fill the whole material of the body. Thus in our opinion, the begetting of man is located in that action by which, through prolific virtue, the soul is joined by an essential bond to the body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Exercise, on the Origin of the Soul &amp; the Propagation of Sin, in which the Common View is Explained &amp; Defended, &amp; All the Ways in which Others Explain the Passing Down</cite>, [Traductionem] of Souls &amp; the Propagation of Sin are Confuted in Philosophy Serving Theology, that is, a Pius &amp; Sober Explication of Philosophical Questions Occurring Occassionally in Theological Disputations (Oxford, 1641) ToC, p. 84</span></figcaption>

</figure><figure class="quote" id="q-2e7bfd0106" data-kw="">
<blockquote><p>The many ethical gradations of common life arise from the intermix of the natural teleologies of our variegated and shuffling circumstances, according to their qualities, weights and proportions, mixed with the same in positive laws. Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved² (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. ² An example is posing a hypothetical situation for moral judgment. Usually the moral judgment is made quickly based on one’s moral sensibilities, and rationalizations are then come up with to justify the moral judgment. This article has constantly posed such scenarios, appealing to persons’ upright common sense, leaving the principles of why such is right to be worked out (as has been done). It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, [Edward] Feser’ (RBO, 2025) | 12. ‘Gradation of Principles &amp; Practices’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The many ethical gradations of common life arise from the intermix of the natural teleologies of our variegated and shuffling circumstances, according to their qualities, weights and proportions, mixed with the same in positive laws. Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved² (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. ² An example is posing a hypothetical situation for moral judgment. Usually the moral judgment is made quickly based on one’s moral sensibilities, and rationalizations are then come up with to justify the moral judgment. This article has constantly posed such scenarios, appealing to persons’ upright common sense, leaving the principles of why such is right to be worked out (as has been done). It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…”

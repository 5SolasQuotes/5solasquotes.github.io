<main class="wrap"><figure class="quote" id="q-93c967ff1f" data-kw="">
<blockquote><p>XIX. We are not simply departed from the church of Rome, but κατα τι, in some respect.

For we have not simply and in all things forsaken the church of Rome, but only in those things, wherein it hath fallen from the apostolic church and even from it self and from the old and sound church.

Neither are we gone with any other meaning, but that if it would return amended and reformed to the ancient state, we would also return unto it and have communion with it and in their own congregations.

Which that it may one day come to pass, we beseech the Lord Jesus with our whole heart. For what were more to be wished of every good man then that, where we were by our baptism born a new, there we might live even to our lives end? So it were in the Lord. I Hier[onymus] Zanchius with my whole family pronounce this to be witnessed to the whole church, even to the world’s end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser (1585; 2 vols, Leiden: Brill, 2007), XXIV.XIX, 1: 415.</span></figcaption>

</figure><figure class="quote" id="q-ce5619f376" data-kw="">

<main class="wrap"><figure class="quote" id="q-c5b0899b59" data-kw="">
<blockquote><p>That God did intend the salvation and repentance of those to whom he never gave repentance and salvation, I hold it as impossible for you or any man to prove, as to pull God down from the throne of his omnipotency, or disrobe him of his immutable perfection: For, unless God continues to intend their repentance and salvation, even when they are damned, he must be mutable; and if he did will and desire their salvation, the reason why they failed of salvation must needs be, because God was not able to procure it. I never met yet with any other then vile shifts, to avoid these consequences, both in Arminius, and others that follow him.

But consider we your proofs: nay, what proof do you bring to prove the point you undertake, namely, that God doth not only intend their repentance, but that in the first place; and yet you cannot deny but that this, which you say God intends in the first place, never comes to pass: whereas the other, which God intends (you confess) though in a latter place, doth come to pass. But because I think it were absurd to conceive, that God intends their repentance whom he purposeth to harden, lest they should convert, and God should heal them; therefore I am willing to consider what you bring to the contrary.

Your first place is out of Deut. 8. 16. Who fed thee in the wilderness with manna, which thy fathers knew not, to humble thee, and to prove thee, and that he might do thee good in thy latter end. That of humbling thee, Junius and Piscator reads thus, ut affligeret te; belike, partly in reference to that which followeth, and to prove thee; (for as much as temporal humiliation hath more congruity to the proving of them, than spiritual; as whereby they humble themselves, and which followeth the proving of them, rather than goeth before it;) partly in reference to the third Verse, going before, where it is said more at full, Therefore he humbled thee, and made thee hungry, and fed thee with manna, which thou knewest not, neither did thy fathers know it; that he might teach thee, that man liveth not by bread only.

By which words we may gather a fair interpretation of that you allege: If it be spoken of humiliation spiritual, thus, He fed thee with manna to humble thee; that is, to teach thee to humble thy self: and so indeed his providence, providing alike to them all, did equally teach them all to humble themselves. But did God intend that every one should, de facto, humble himself? why then did he not give them eyes to see, and ears to hear, and an heart to perceive, as Deut. 29. 4. Moses tells them plainly, saying, Yet the Lord hath not given you an heart to perceive, and eyes to see, and ears to hear, unto this day.

I deny not but God did manifest, by the course of his providence towards them, what he did require and deserve at their hands, namely, that they should humble themselves to walk with the Lord their God; and the phrase, to humble thee, applied even to the most carnal, may have a fair construction, that thou shouldst be humbled, or, humble thy self, understanding it ex officio; for hereby he did manifest that this was their duty, answerable to God’s proceedings with them: and yet further, considering that he representeth his own gracious proceedings with them, by the proceedings of an earthly father with his children, Verse 5. Know therefore in thine heart, that as a man nurtureth his son, so the Lord thy God nurtureth thee; no marvel if he expresseth his affections and desires towards them, suitable to the desires and affections of an earthly father, who being not able effectually to procure their amendment, yet desires it.

And this is God’s usual course, to express himself in such language … But, shall we hereupon take liberty to build doctrines, as touching the nature of God, as if that which is figuratively uttered were properly delivered? He proved them all, I confess, and upon the probation some proved good silver, and others no better than dross; and thereupon he did good to the one in their latter end, and not unto the other: Neither did he ever purpose, that good in their latter end should redound unto any, but as they should be humbled: wherein, humiliation is made the condition of doing them good, not of God’s purpose or intention: And withal, God gave unto those that were truly mortified, that is, truly humbled, hearts to perceive, eyes to see, and ears to hear; but he gave not the like grace unto all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), pp 81-83.</span></figcaption>

<blockquote><p>And, in the first place, I assume as admitted by all orthodox writers upon the subject, although it is not safe to pry too curiously into the secrets of the divine counsels or to draw too confident conclusions concerning the lot of those dying in infancy, that a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honored with the saving fellowship of his covenant. For it would be altogether wrong to suppose that the promise made to Abraham (“I will be thy God, and the God of thy seed after thee”) has been either revoked or brought within narrower limits by the introduction of the better dispensation, especially seeing that Peter, on the glorious day of Pentecost, impressed upon his hearers that the promise of the Spirit of grace was given not to themselves only but also to their children; and that the Lord Jesus took up in his arms the children of covenanted parents, blessed them, and, in a word, declared that of such is the kingdom of heaven (which Scripture testimonies I do not feel myself called to dwell upon at present, as I have expounded them at length in another place). … Indeed, the height and depth of eternal predestination forbids us to pry into its hidden things with more than a lawful curiosity. Yet, judging soberly, there can be nothing to prevent us from conferring the sign and seal of the covenant upon those whom it is proper to acknowledge as the covenanted people of God; meanwhile the secret things of predestination have been left to God according to his freedom. … XIV. From all this we infer that there is no such thing signified and sealed, much less conferred, upon all covenanted infants in baptism as a kind of common justification, regeneration, and sanctification, which shall place them in a state of salvation prior to the use of reason and become insufficient for their salvation after they have grown up, nor any remission of original sin, whether revocable or irrevocable; but that the whole efficacy of baptism, insofar as it implies a state of salvation even conformably with that period of life, belongs exclusively to infants who are elected. Hence, among orthodox theologians disputing about the efficacy of baptism, the question is chiefly, if not solely: What benefits does it confer upon elect infants, who alone in the estimation of God have, strictly speaking, a right to it?</p></blockquote>

ed+people+of+God%3B+meanwhile+the+secret+things+of+predestination+have+been+left+to+God+according+to+his+freedom.+%E2%80%A6+XIV.+From+all+this+we+infer+that+there+is+no+such+thing+signified+and+sealed%2C+much+less+conferred%2C+upon+all+covenanted+infants+in+baptism+as+a+kind+of+common+justification%2C+regeneration%2C+and+sanctification%2C+which+shall+place+them+in+a+state+of+salvation+prior+to+the+use+of+reason+and+become+insufficient+for+their+salvation+after+they+have+grown+up%2C+nor+any+remission+of+original+sin%2C+whether+revocable+or+irrevocable%3B+but+that+the+whole+efficacy+of+baptism%2C+insofar+as+it+implies+a+state+of+salvation+even+conformably+with+that+period+of+life%2C+belongs+exclusively+to+infants+who+are+elected.+Hence%2C+among+orthodox+theologians+disputing+about+the+efficacy+of+baptism%2C+the+question+is+chiefly%2C+if+not+solely%3A+What+benefits+does+it+confer+upon+elect+infants%2C+who+alone+in+the+estimation+of+God+have%2C+strictly+speaking%2C+a+right+to+it%3F%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+%E2%80%98On+the+Efficacy+%26+Utility+of+Baptism%2C+p.+127%2C+130%2C+137+in+MJT+17+%282006%29%2C+originally+an+appendix+in+William+Marshall%2C+Popery+in+The+Full+Corn%2C+the+Ear%2C+and+the+Blade%3B+or%2C+The+Doctrine+of+Baptism+in+the+Popish%2C+Episcopalian%2C+and+Congregational+Churches%3B+with+a+Defence+of+the+Calvinistic+or+Presbyterian+View+%28Edinburgh%3A+Paton+and+Ritchie%2C+1852%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd927a7639.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd927a7639.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-salvation-of-infants-in-without-the-church/#:~:text=And%2C%20in%20the%20first%20place%2C%20I,strictly%20speaking%2C%20a%20right%20to%20it&amp;text=And%2C%20in%20the%20first%20place%2C%20I%20assume%20as&amp;text=God%20have%2C%20strictly%20speaking%2C%20a%20right%20to%20it" rel="noopener" target="_blank">Read it online

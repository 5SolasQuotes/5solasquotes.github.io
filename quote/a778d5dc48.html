<main class="wrap"><figure class="quote" id="q-a778d5dc48" data-kw="">
<blockquote><p>…the minister who is to preach is to… to call upon the Lord to this effect: ‘To acknowledge our great sinfulness, First, by reason of original sin, which… doth defile our best actions… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed. And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, Of Public Prayer before the Sermon</span></figcaption>

<blockquote><p>[Gen. 22] Verse 12: ‘Seeing for my sake thou hast not spared thine only son.’ God accepts the resolute purpose and will of Abraham for the done deed. An obedient will then is accepted before God as the work itself: as the Apostle says, ‘If first there be a willing mind, God accepts it according to that a man has, not according to that he has not, 2 Cor. 8:12. [So Wolfgang] Musculus.</p></blockquote>

<blockquote><p>…the retaining and using of temples [church buildings] which have been polluted with idols, be not in itself unlawful, yet the retaining of every such temple is not ever necessary, but sometimes it is expedient for further extirpation of superstition to demolish and destroy some such temples as have been horribly abused to idolatry, as Calvin (Commentary on Dt. 12:2 [80th sermon on Dt., on 12:1-5, pp. 491-92]) also and Zanchius (On the 4th Commandment, col. 709 [in All the Theological Works (1649), vol. 4]) do plainly insinuate.</p></blockquote>

</figure><figure class="quote" id="q-1ecbd54048" data-kw="">
<blockquote><p>But we desire to see your commandment why for every particular act, that in a large sense is idolatrous, adjoined to the true worship of God, we should forbear our presence at the worship itself, or be said to communicate in the sin there committed? For then no man might present himself with good conscience at any public worship of God where anything is done amiss, for matter or manner, which is in effect to say, he cannot be present at any at all. 4. To communicate in the ordinances of God with the ministers of the Church of England is not to like, approve or reverence the institutions of men in the exercises of religion, nor to communicate with the teacher in his sin, nor in ought else that is amiss. For the worship is of God both for matter and manner. … To eat of meats sacrificed unto idols in the idol temple is to communicate with idolaters. These things are evident and freely granted. But the assembly met to call upon God, in the mediation of Jesus Christ alone, to hear the doctrine of salvation,soundly and purely preached, to receive the sacrament rightly administered, is not a false idolatrous assembly: they that repair unto it be not idolatrous or false worshippers. If you esteem of them as they show themselves by outward signs, you must esteem them to be of the true religion, and the true worshippers of God according to his will; the ministry in that assembly to be true, sound and faithful and of God for substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, (1642), pp. 105-6</span></figcaption>

<blockquote><p>But if you will indeed continue as I see that you have begun, I now declare to you beforehand that it will come to pass that what has happened to other disturbers of the Churches may happen also to you and to all your followers (if there should be any)… namely, that you may learn too late that you have harmed no one more than yourself.</p></blockquote>

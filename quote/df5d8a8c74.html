<main class="wrap"><figure class="quote" id="q-df5d8a8c74" data-kw="">
<blockquote><p>We are not conscious to ourselves of anything done against our brethren that deserves such a severe censure from them; What trespass have we committed against any article of our Confession of Faith? or wherein have we transgressed against any of the received principles or the approven rules of this Church, that our Mother’s sons are so very angry with us as to threaten to cast us out of the Lord’s Vineyard?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4efb55a7e7" data-kw="">
<blockquote><p>It is one thing most requisite, that the true Kirk is discerned from the filthy synagogues by clear and perfect notes, lest we, being deceived, receive and embrace to our condmenation the one for the other. The notes therefore of the true Church of God, we believe, confess and avow to be: First, the true preaching of the Word of God, wherein God has revealed Himself to us, as the writings of the prophets and apostles do declare. Secondly, the right administration of the sacraments of Jesus Christ, which must be annexed unto the Word and promise of God, to seal and confirm the same in our hearts. Lastly, ecclesiastical discipline uprightly administered as God’s Word prescribes, whereby vice is repressed and virtue nourished. Wheresoever then these former notes are seen, and of any time continue (be the number never so few, about two or three) there, without all doubt, is the true Church of Christ, who, according to his promise, is in the midst of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-ccdcf103c5" data-kw="">
<blockquote><p>4. You [Gilbert Burnet] suggest, that ‘Non-conformists think, they may quit the communion of the Church, if, in their opinion, [the Church is] not in the truth in every point’… in name of all true non-conformists, that as they do not think they may quit the communion of the Church, if in their opinion, [it is] not in the truth, unless the difference be both real [as opposed to only a mistaken perception, etc.], &amp; in profession and practice; so it is not every real difference in profession or practice that they hold to be a sufficient cause; nor do they judge that, even the cause being sufficient, the separation should be always carried to the extremity [furthest point]; but the sound and clear rule which they propose for Christian practice in this matter is that, where the controverted difference is such as would render a conjunction therein either [1.] sinful or [2.] contagious [infectious], then a just and proportionate separation, precisely and with all tenderness, commensurate to the exigence [need], is the safer course.</p></blockquote>

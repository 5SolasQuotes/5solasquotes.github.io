<main class="wrap"><figure class="quote" id="q-64a808511d" data-kw="">
<blockquote><p>[1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek, Acts 2:44], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“[1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek, Acts 2:44], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?”

ther%20Mr.%20%5BGeorge%5D%20Gillespie%20%28Assertion%20of&amp;text=Acts%2010%3A9%29%20could%20ordinarily%20contain%20so%20many%20thousands" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3689e7fb25" data-kw="">

</figure><figure class="quote" id="q-f2f9ef2aec" data-kw="">
<blockquote><p>Another feature of the book [of Common Order, 1564] was that it was so framed as to make responsive worship impossible. The worshipper was to follow the continuous prayers with silent accord… At Frankfort [Germany] the signal for the outbreak of hostilities between the two parties was the loud responses of the Anglicans when a liturgy of compromise was read. The ground which Knox had taken up there, he was not likely to abandon in Scotland. His position would be that the people’s vocal part in divine service was the singing of Psalms; for the preface to the original Geneva Book says: ‘Prayers are after two manner of sorts, that is, either in words only or else with song joined thereunto.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-leishman.html">Thomas Leishman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ritual of the Church’ in</cite>, ed. Story, Robert, The Church of Scotland, Past and Present (1890 ff.), vol. 5, p. 327</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-db1a5c7268" data-kw="">
<blockquote><p>They seem sometimes so to speak, as if it greatly offended them, that such hymns and psalms as are Scripture should in common prayer be otherwise used than the rest of the Scripture is wont: sometime displeased they are at the artificial music which we add unto psalms of this kind, or of any other nature else; sometime the plainest and the most intelligible rehearsal of them yet they savor not, because it is done by interlocution, and with a mutual return of sentences from side to side.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hooker</cite>, (1554-1600), a defender of the status quo in the Church of England, here lists the English puritans’ complaints with the English liturgy. Laws of Ecclesiastical Polity, Book 5, chs. 35, 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-7013ecfd96" data-kw="">
<blockquote><p>We believe therefore, the duty of a godly magistrate is… Sixthly, to carry a special care to the goods of the church, that they may be bestowed on the right, that is on the true godly, uses; and that all necessary things be supplied to the Church and to the ministers thereof.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

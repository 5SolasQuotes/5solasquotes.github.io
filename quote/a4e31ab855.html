<main class="wrap"><figure class="quote" id="q-a4e31ab855" data-kw="">
<blockquote><p>III. …the formation of the body, which was completed at once, and not over a period of time, like the bodies of other men; and in the breathing in of a rational soul. Whereas in ordinary generation the time required for formation of the body is forty days, the body of Christ was absolutely completed in a moment. Otherwise Christ would have been conceived not a man but as an embryo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology in</cite>, (1625), ch. 16, ‘The Person of Christ the God-Man’, section 2, propositions in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“III. …the formation of the body, which was completed at once, and not over a period of time, like the bodies of other men; and in the breathing in of a rational soul. Whereas in ordinary generation the time required for formation of the body is forty days, the body of Christ was absolutely completed in a moment. Otherwise Christ would have been conceived not a man but as an embryo.”

</figure><figure class="quote" id="q-5b778fc720" data-kw="">
<blockquote><p>…we cannot give an account of the whole process of generation, which consists of conception, formation or the delineation of the several parts, and animation by infusing the soul; but this we know, that it far surpasses all finite power. And without doubt Monsieur Descartes, who was so thinking a philosopher, would never have ascribed this great work to mere mechanism, but that he was unawares betrayed into it by his solving of other things by mechanic principles: So that it would be expected that he should make an uniform piece of philosophy. And thence he was, as it were, forced to go through with his work that he had begun, and to maintain that all is done mechanically, even in the production of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Demonstration of the Existence &amp; Providence of God</cite>, … (London, 1696), 2nd Part, ch. 6, pp. 109-110</span></figcaption>

</figure><figure class="quote" id="q-c0a787b362" data-kw="">
<blockquote><p>If it be further demanded, whether in case that death follows, it be to be understood of any child, how little time soever the mother has gone with it? I answer with Simlerus that we must distinguish between a child formed and unformed, if the child were an embryo, not yet perfected, although it perished, the party, by whose stroke, was not to be put to death, but for such only as was come to perfection, so likewise Augustine and Jerome in Decretis, Causa 32, Question 2, Ch. Mosis, and the words of the text, ‘life for life’, seem to make for it, that a man’s life must not be paid but for one living and perfected, and the Septuagint make this plain by rendering, ‘not death’, [Hebrew], ‘not formed’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, … (London, 1653), Exodus, ch. 21, p. 558</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

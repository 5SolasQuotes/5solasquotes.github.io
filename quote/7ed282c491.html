<main class="wrap"><figure class="quote" id="q-7ed282c491" data-kw="">
<blockquote><p>Truly, we neither put off the yoke of obedience from us; neither do we disorder realms; neither do we set up or pull down kings; nor translate governments; nor give our kings poison to drink; nor yet hold to them our feet to be kissed; nor, opprobriously triumphing over them, leap into their necks with our feet. This rather is our profession; this is our doctrine: that every soul, of what calling soever he be--be he monk, be he preacher, be he prophet, be he Apostle--ought to be subject to kings and magistrates; yea, and that the Bishop of Rome himself--unless he will seem greater than Evangelists, than the Prophets, or the Apostles--ought both to acknowledge and to call the emperor his lord and master, which the old Bishops of Rome, who lived in times of more grace, ever did. Our common teaching also is, that we ought so to obey princes as men sent of God; and that whoso withstandeth them, withstandeth God&#x27;s ordinance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/temporal-power.html">Temporal power</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a5b0c6743" data-kw="">
<blockquote><p>If God be Jehovah, the supreme Lord, then it condemns the blasphemous papists, who speak after this manner, &#x27;Our Lord God the Pope.&#x27; Is it a wonder the pope lifts his triple crown above the head of kings and emperors, when he usurps God&#x27;s title, &quot;shewing himself that he is God?&quot; 2 Thess. 2:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 29</span></figcaption>

</figure><figure class="quote" id="q-75fb9ddff4" data-kw="">
<blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 214</span></figcaption>

</figure><figure class="quote" id="q-09308723bf" data-kw="">
<blockquote><p>No sooner is such a word spoken but immediately the wicked bestial lives, the ignorance, atheisms, and horrid ends of many of them, present themselves to the thoughts of men, and a tremor comes over their hearts to hear men open their mouths with such blasphemies as to affirm that the Lord Christ did as much manifest his divinity and power in such beasts as in his own person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Fiat Lux</cite>, ch. 21</span></figcaption>

</figure><figure class="quote" id="q-9eb0413e17" data-kw="">
<blockquote><p>I have said that the Popes abused their power by exercising it, not in the interests of the peoples whom they claimed to govern, but in their own; and I must add, not in the interests of anything that can plausibly claim the high name of religion, but of the most vulgar ambition. For the Popes were not content with the lofty position of being supreme judges over temporal princes: they wanted to be temporal princes themselves; and when they sought to aggrandize their dominions they freely used the spiritual weapon of excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XXIII</span></figcaption>

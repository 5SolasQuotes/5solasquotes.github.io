<blockquote><p>Object. § I. But here mark a plot of spiritual treason. Satan, joining with our corruption, setteth the wit on work to persuade the soul that this inward rebellion is not so bad, because it is natural to us, as a condition of nature rising out of the first principles in our creation, and was curbed in by the bridle of original righteousness, which they would have accessory and supernatural, and therefore allege that concupiscence is less odious and more excusable in us, and so no great danger in yielding and betraying our souls unto it, and by that means persuading us that that which is our deadliest enemy hath no harm in it, nor meaneth any to us.

Ans. This rebellion of lusts against the understanding is not natural, as our nature came out of God’s hands at the first, Gen. i. 27; for this, being evil and the cause of evil, could not come from God, who is good and the cause of all good, and nothing but good, who, upon the creation of all things, pronounced them good, and, after the creation of man, pronounced of all things that they were very good, ver. 31. Now, that which is ill and very ill cannot be seated at the same time in that which is good and very good. God created man at the first right; he of himself ‘sought out many inventions,’ Eccles. vii. 29.

As God beautified the heaven with stars, and decked the earth with variety of plants, and herbs, and flowers, so he adorned man, his prime creature hero below, with all those endowments that were fit for a happy condition; and original righteousness was fit and due to an original and happy condition. Therefore, as the angels were created with all angelical perfections, and as our bodies were created in an absolute temper of all the humours, so the soul was created in that sweet harmony wherein there was no discord, as an instrument in tune, fit to be moved to any duty; as a clean, neat glass, the soul represented God’s image and holiness.

§.II. Therefore it is so far, that concupiscence should be natural, that the contrary to it, namely, righteousness, wherein Adam was created, was natural to him; though it were planted in man’s nature by God, and so in regard of the cause of it, was supernatural; yet because it was agreeable to that happy condition, without which he could not subsist, in that respect it was natural, and should have been derived, if he had stood, together with his nature, to his posterity. As heat in the air, though it hath its first impression from the heat of the sun, yet is natural, because it agreeth to the nature of that element; and though man be compounded of a spiritual and earthly substance, yet it is natural that the baser earthly part should be subject to the superior, because where there is different degrees of worthiness, it is fit there should be a subordination of the meaner to that which is in order higher.

The body naturally desires food and bodily contentments, yet in a man endued with reason, this desire is governed so as it becomes not inordinate. A beast sins not in its appetite, because it hath no power above to order it. A man that lives in a solitary place, far remote from company, may take his liberty to live as it pleaseth him; but if he comes to live under the government of some well-ordered city, then he is bound to submit to the laws and customs of that city, under penalty upon any breach of order; so the risings of the soul, howsoever in other creatures they are not blameable, having no commander in themselves, above them, yet in man they are to be ordered by reason and judgment.

Therefore it cannot be, that concupiscence should be natural, in regard of the state of creation. It was Adam’s sin; which had many sins in the womb of it, that brought this disorder upon the soul. Adam’s person first corrupted our nature, and nature being corrupted, corrupts our persons, and our persons being corrupted, increase the corruption of our nature, by custom of sinning, which is another nature in us. As a stream, the farther it runs from the spring head, the more it enlargeth its channel, by the running of lesser rivers into it, until it empties itself into the sea; so corruption, till it be overpowered by grace, swelleth bigger and bigger, so that though this disorder was not natural, in regard of the first creation, yet since the fall it has become natural, even as we call that which is common to the whole kind, and propagated from parents to their children, to be natural; so that it is both natural and against nature, natural now, but against nature in its first perfection.

And because corruption is natural to us, therefore, 1, We delight in it; whence it comes to pass, that our souls are carried along in an easy current, to the committing of any sin without opposition. 2. Because it is natural, therefore it is unwearied and restless, as light bodies are not wearied in their motion upwards, nor heavy bodies in their motion downwards, nor a stream in its running to the sea, because it is natural: hence it is that the ‘old man,’ Eph. iv. 22, is never tired in the ‘works of the flesh,’ Gal. v. 19, nor never drawn dry.

When men cannot act sin, yet they will love sin, and act it over again by pleasing thoughts of it, and by sinful speculations suck out the delight of sin; and are grieved, not for their sin, but because they want strength and opportunity to commit it; if sin would not leave them, they would never leave sin. This corruption of our nature is not wrought in us by reason and persuasions, for then it might be satisfied with reasons, but it is in us by way of a natural inclination, as iron is carried to the loadstone; and till our natures be altered, no reason will long prevail, but our sinful disposition, as a stream stopped for a little while, will break out with greater violence.

3. Being natural, it needs no help, as the earth needs no tillage to bring forth weeds. When our corrupt nature is carried contrary to that which is good, it is carried of itself, as when Satan lies or murders, it comes from his own cursed nature; and though Satan joineth with our corrupt nature, yet the proneness to sin, and the consent unto it, is of ourselves.</p></blockquote>

</figure><figure class="quote" id="q-6586ea429d" data-kw="">
<blockquote><p>The predicate; “They have crucified the flesh, with the affections and lusts.” By flesh we are here to understand carnal concupiscence, the workings and motions of corrupt nature; and by the affections we are to understand, not the natural, but the inordinate affections; for Christ does not abolish and destroy, but correct and regulate the affections of those that are in him:

And by crucifying the flesh, we are not to understand the total extinction or perfect subduing of corrupt nature, but only the deposing of corruption from its regency and dominion in the soul; its dominion is taken away, though its life be prolonged for a season; but yet, as death surely, though slowly, follows crucifixion, (the life of crucified persons gradually departing frown them, with their blood) it is just so in the mortification of sin; and therefore what the apostle in this place calls crucifying, he calls in Rom. 8:13. mortifying. “If ye, through the Spirit, do mortify,” … if ye put to death the deeds of the body:

But he chuses, in this place, to call it crucifying, to show not only the conformity there is betwixt the death of Christ and the death of sin, in respect of shame, pain, and lingering slowness; but to denote also the principal means and instruments of mortification, viz. the death, or cross of Jesus Christ, in the virtue whereof believers do mortify the corruptions of their flesh; the great arguments and persuasives to mortification being drawn from the sufferings of Christ for sin. In a word, he does not say, They that believe Christ was crucified for sin, are Christ’s; but they, and they only, are his, who feel as well as profess the power and efficacy of the sufferings of Christ, in the mortification and subduing of their lusts and sinful affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Gospel-Redemption</cite>, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 369.</span></figcaption>

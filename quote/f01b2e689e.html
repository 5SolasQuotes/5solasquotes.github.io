<main class="wrap"><figure class="quote" id="q-f01b2e689e" data-kw="">
<blockquote><p>If then nothing be good [simply] because rulers command it; but, by the contrary, they do lawfully command it because it is good. The Church’s power is one and the same in things indifferent, and necessary in matters of doctrine, discipline and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find preexistent goodness in doctrine, discipline, and matters of order. Therefore, will of authority, as will, has no power to dispose of the east circumstance of time, place or person; but the Church’s power is ministerial and determined to what is good, expedient and convenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 648-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5bb02d34fe" data-kw="">
<blockquote><p>Calvin, Beza, yea, all our writers condemn blind obedience as brutish… …concerns his conscience, knowing that he must do it in faith as he does all his moral actions; Ergo [Therefore], the magistrate must examine what he practices in his office, according to the Word, and must not take it upon the mere authority of the Church, else his faith in these moral acts of his office should be resolved ultimately on the authority of the Church, not on the Word of God, which no doubt is Popery; for so the warrant of the magistrate’s conscience should not be, ‘Thus saith the Lord,’ but ‘Thus saith the Church in their decrees.’ … 2. It’s against Scripture and reason that… all others, should obey the decrees of the Church with a blind faith, without inquiring in the warrants and grounds of their decrees, which is as good Popery as magistrates and all men are to believe as the Church believes with an implicit faith; so ignorance shall be the mother of devotion; Whoever impute[s] this to us, who have suffered for non-conformity, and upon this ground, that synods can err… … Thus they are servants and slaves who are obliged to follow the judgment of councils absolutely, without limitation; and because they say it, whether they warrant their decrees by the Word of God or not, that is a true major proposition: But now the assumption is most false, for neither magistrates nor any other are to follow the judgment of the Church absolutely, without limitation, and because they say it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 595-9</span></figcaption>

</figure><figure class="quote" id="q-204b98b007" data-kw="">
<blockquote><p>St. Augustine says, ‘The church ought not to be preferred before Jesus Christ. For He always judges truly; but the ecclesiastical judges often may deceive themselves and truly do so.’ For who condemned Jesus Christ? A council lawfully assembled, if we consider that outward succession and appearance. Who concluded that those who were baptized by heretics should be re-baptized? A council in Africa where St. Cyprian was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theodore Beza’s Confession</cite>, (1560): A Brief &amp; Pithy Sum of Christian Faith’, 5th Point, ‘Of the Church’, 12. ‘How Far We May Differ from Councils’ in Reformed Confessions of the 16th &amp; 17th Centuries, ed. Dennison (RHB, 2010), vol. 2, pp. 311-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“St. Augustine says, ‘The church ought not to be preferred before Jesus Christ. For He always judges truly; but the ecclesiastical judges often may deceive themselves and truly do so.’ For who condemned Jesus Christ? A council lawfully assembled, if we consider that outward succession and appearance. Who concluded that those who were baptized by heretics should be re-baptized? A council in Africa where St. Cyprian was.”

— Theodore Beza, ‘Theodore Beza’s Confession (1560): A Brief &amp; Pithy Sum of Christian Faith’, 5th Point, ‘Of the Church’, 12. ‘How Far We May Differ from Councils’ in Reformed Confessions of the 16th &amp; 17th Centuries, ed. Dennison (RHB, 2010), vol. 2, pp. 311-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSt.+Augustine+says%2C+%E2%80%98The+church+ought+not+to+be+preferred+before+Jesus+Christ.+For+He+always+judges+truly%3B+but+the+ecclesiastical+judges+often+may+deceive+themselves+and+truly+do+so.%E2%80%99+For+who+condemned+Jesus+Christ%3F+A+council+lawfully+assembled%2C+if+we+consider+that+outward+succession+and+appearance.+Who+concluded+that+those+who+were+baptized+by+heretics+should+be+re-baptized%3F+A+council+in+Africa+where+St.+Cyprian+was.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+%E2%80%98Theodore+Beza%E2%80%99s+Confession+%281560%29%3A+A+Brief+%26+Pithy+Sum+of+Christian+Faith%E2%80%99%2C+5th+Point%2C+%E2%80%98Of+the+Church%E2%80%99%2C+12.+%E2%80%98How+Far+We+May+Differ+from+Councils%E2%80%99+in+Reformed+Confessions+of+the+16th+%26+17th+Centuries%2C+ed.+Dennison+%28RHB%2C+2010%29%2C+vol.+2%2C+pp.+311-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F204b98b007.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/204b98b007.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-guilt-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=St.%20Augustine%20says%2C%20%E2%80%98The%20church%20ought,in%20Africa%20where%20St.%20Cyprian%20was&amp;text=St.%20Augustine%20says%2C%20%E2%80%98The%20church%20ought%20not%20to&amp;text=A%20council%20in%20Africa%20where%20St.%20Cyprian%20was" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-039d0d1ff8" data-kw="">
<blockquote><p>But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; and when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this [absolute, necessary, passive] submission [to erroneous Church decisions] which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny, because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, it being for matter God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: a Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), pp. 46-47</span></figcaption>

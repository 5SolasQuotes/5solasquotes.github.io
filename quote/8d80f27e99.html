<main class="wrap"><figure class="quote" id="q-8d80f27e99" data-kw="">
<blockquote><p>For though holy works do not justify, yet by them a man is continued in a state and condition of justification: so that did not the Covenant of Grace interpose, gross and wicked ways would cut off our justification and put us in a state of condemnation.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8abb1b53b8" data-kw="">
<blockquote><p>We had said, following the apostle and all Scripture, that there is a twofold righteousness of the saints by which they are just before God and men. One is Christ’s, perfect, on which all their hope of God’s grace and salvation and eternal life entirely rests. The other is begun in them by the Spirit of Christ, in which they ought not to trust, because it is always imperfect while they live here and cannot be approved by God except out of his liberal and infinite mercy and the merit of Christ. By this righteousness no one is justified before God with the justification of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans</cite>, … to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | He adds on, p. 308:</span></figcaption>

</figure><figure class="quote" id="q-e2f2c4ad9c" data-kw="">
<blockquote><p>1. Active justification differs from passive justification. In Latin, the nouns ending in –io are generally interpreted in this way [as active and passive]. God justifies and we are justified.

2. Passive justification is later than faith. Passive justification follows after passive faith, because it is through faith that we receive the remission of sins, Act 26:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy</cite>, (1644), ch. 13, ‘On Justification’, p. 231</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-dc9dafded1" data-kw="">
<blockquote><p>20. Justification does not free from sin and death directly by taking away the blame or stain or all the effects of sin; rather it removes the guilty obligation to undergo eternal death. Rom. 8:1, 33-34, ‘There is no condemnation… Who shall lay anything to their charge?… who shall condemn?

21. Nor does it take away guilt so that the deserving of punishment is removed from sin. This cannot be taken away as long sin itself remains. But justification does take away guilt so that its haunting or deadly effects vanish. …

23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted.

24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning.

25. Yet those who are justified need daily the forgiveness of sins. This is true because the continuance of grace is necessary to them; the consciousness and manifestation of forgiveness increases more and more as individual sins require it; and the execution of the sentence which is pronounced in justification may thus be carried out and completed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (Baker, 1997), ch. 27, ‘Justification’, pp. 163-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-cb9a80134c" data-kw="">
<blockquote><p>3. Actually, in himself is man said to be justified, when he has the possession of it: But this actual justification has its degrees of progression. The beginning thereof is laid in our first union and incorporation into Christ: The consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission. Between both these there is a progressive work of justification, by the constant actings of the Spirit applying the blood of Christ, by the hand of faith, to the quiet and comfort of the soul. The first you may term initial justification, the latter perfective, and this between I would call progressive, it is the fruit of the first and the preludial assurance of the latter: This is wrought and sealed in the second sacrament [the Supper], as the former is in the first sacrament [baptism]: and both these branches of sacramental justification are to us the pre-assurance of that complemental and perfective justification; The sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession; even the first of these acts is not transacted without the seed and spirit of faith, much less the successive agitations, and progress of the work. Thus every way faith is considered as equal with, yea as foregoing the work of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bedford.html">Thomas Bedford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of the Chief Points of Antinomianism</cite>, … (London: Field, 1647), ch. 3, ‘A Brief Answer to the Arguments of H. D. by him brought to prove Justification before Faith, i.e. before the act of Believing’, pp. 32-33 Bedford and Ambrose were sharing some notes one way or the other.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<main class="wrap"><figure class="quote" id="q-440b84dd2e" data-kw="">
<blockquote><p>The proper and genuine cause of this sanction and disparity is the will and good pleasure of God, etc. which is apposite to nature, namely on account of the greater flux of humors and corruption of blood, and the greater languor of the one giving birth in the birth of a female; for as Theodoret teaches, women are wont to labor more gravely when they bear a female than when a male.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | Cornelius a Lapide in his commentary on Leviticus 12, after attacking the opinion of Maldonado, concludes:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“The proper and genuine cause of this sanction and disparity is the will and good pleasure of God, etc. which is apposite to nature, namely on account of the greater flux of humors and corruption of blood, and the greater languor of the one giving birth in the birth of a female; for as Theodoret teaches, women are wont to labor more gravely when they bear a female than when a male.”

0genuine%20cause%20of,a%20female%20than%20when%20a%20male." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b9ddfd8d5f" data-kw="">
<blockquote><p>In the conception of Christ we must observe and consider three things. The framing of the manhood, the sanctifying of it, and the personal union of the manhood with the Godhead. And howsoever I distinguish these three for order’s sake, yet must we know and remember, that they are all wrought at one and the same instant of time. For when the Holy Ghost frames and sanctifies the manhood in the womb of the virgin: at the very same moment it is received into the unity of the second person… As for his soul, it was not derived from the soul of the virgin Mary as a part thereof, but it was made as the souls of all other men be, of nothing by the power of God, and placed in the body; both of them from the first moment of their being, having their subsistence in the person of the son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles… (Cambridge, 1595)</cite>, p. 157</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-dbf669f70d" data-kw="">
<blockquote><p>In Voetius’s view it is valid to say that some unborn foetuses have ‘a human life’ and others have not. He refers to Exodus 21:22-23 as a passage suggesting that not all abortions of foetuses are the same. He shows a certain flexibility as to the estimated time when a foetus is animated [ensouled], but maintains that the soul can only ‘be brought into an organized body’… Zechariah 12:1, a text that speaks of ‘…the Lord, which… formeth the spirit of man within him’ (AV)… Voetius obviously thought that initially there is no soul for an embryo that has yet to be formed. He cites various opinions on the time when an embryo is animated… Voet thinks it is prudent not to move beyond the latter estimate [of the 30th to 40th day], and leaves further debate to physicians. The former estimate seems to have been motivated by references to both Aristotle and the Bible (Lev. 12[:2-6]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006)</cite>, pp. 239-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“In Voetius’s view it is valid to say that some unborn foetuses have ‘a human life’ and others have not. He refers to Exodus 21:22-23 as a passage suggesting that not all abortions of foetuses are the same. He shows a certain flexibility as to the estimated time when a foetus is animated [ensouled], but maintains that the soul can only ‘be brought into an organized body’… Zechariah 12:1, a text that speaks of ‘…the Lord, which… formeth the spirit of man within him’ (AV)… Voetius obviously thought that initially there is no soul for an embryo that has yet to be formed. He cites various opinions on the time when an embryo is animated… Voet thinks it is prudent not to move beyond the latter estimate [of the 30th to 40th day], and leaves further debate to physicians. The former estimate seems to have been motivated by references to both Aristotle and the Bible (Lev. 12[:2-6]).”

nd%20the%20Bible%20%28Lev.%2012%5B%3A2%2D6%5D%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6f5ecac610" data-kw="">
<blockquote><p>Nor outside the body, but within the body already formed organically, such that by creating, it is infused into it, and by infusing, it is created in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 190-91 of ch. 5, section 14 in Theological Institutes harmonized from the Best Authors (Leiden: Moyard, 1658) | Why does Maccovius disagree with Aristotle? It seems he is making the same point Mastricht did (as quoted in Fentiman, p. 12). The Lord forms the spirit of man within him (Zech. 12:1). Mastricht says:</cite></span></figcaption>

</figure><figure class="quote" id="q-b65636a96f" data-kw="">
<blockquote><p>But if it is doubted about the animation of the fetus – whether a religious giving or procuring a potion for abortion, or advising or lending assistance, incurs irregularity? I respond that in the contentious forum, where the question is about punishment, interpretation ought to be made in the milder part: Law, ‘By interpretation,’ Digest, ‘On punishments.’ But in the forum of the soul, where the question is about placating God and amendment, one ought to consider himself a murderer, because in such matters the safer way is to be chosen, as in ch. ‘A young man,’ on betrothal, and it belongs to good minds to fear fault there where there is no fault: ch. ‘To his hearing’ at the end, dist. 5, argument from ch. ‘To his hearing,’ on homicide. See Navarrus in the Manual, ch. 27, n. 223.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2, ‘On Creation’, pt. 8, ‘On Man’, pp. 264-67 Latin | So that we may now give some taste to students and others who do not have leisure to inquire laboriously into these things, or who do not have the books at hand, we set down these conclusions: | 5th conclusion: It is homicide to procure the abortion of an animated fetus, when it is doubted whether the fetus is animated. In the papacy most teach that [the state of] irregularity is incurred by such a one, because he is doubtful whether he is a murderer. [Rom. 14:23]</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>2. Although separation be never allowable, and secession be not alway at an instant practicable; yet we suppose, in some cases, simple abstinence, if it be not offensive in the manner and circumstances, if it be not made customary, and if the ground be so convincing and the case so gross that it will affect any ingenuous hearer, and so evident that there is no access to any acquainted in such places to deny the same, or that there be a present undecided process concerning such things before a competent judge; in some such cases, I say, as might be supposed, we conceive abstinence were not rigidly to be misconstructed, it being for the time the burden of such persons that they cannot join; and, it may be, having some public complaint of such a thing to make-out, and in dependence elsewhere: Although we will not strengthen any to follow this way, nor can it be pretended to where the case is not singularly horrid; yet supposing it to be such, we conceive it is the safest one way for the person’s peace, and the preventing of offence together; yet, much christian prudence is to be exercised in the conveying of the same, if it were by removing for a time, or otherways, that there appear to be no public contempt; but we conceive this case is so rarely incident, and possibly that there needs be little said of it, much less should there be any needless debate or rent entertained upon the consideration or notion thereof. And certainly the case before us, of the admitting of the Nicolaitans and Jezebel, considering their doctrine and deeds, is more horrid than readily can be supposed; and yet it would seem that though this defect should still have continued, the Lord does require no other thing of private professors, but their continuing-in, or holding fast of, their former personal purity, which is all the burden that He does lay upon them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, (1659), Part 2, ch. 15, p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-0fc5ccaccb" data-kw="">

<blockquote><p>On the part of the people generally, of course, there was no intention of seeking an armed confrontation with the government. The only aim of the majority who attended the field-meetings was to worship God according to their consciences–and to resort to justified self-defence if pushed to extremity… By 1677–or at least by the end of that year–a movement had become established which sought to stiffen the pattern of resistance, and in various ways to carry the battle to the authorities. The acknowledged leader of this movement was Robert Hamilton [who was 27 years old]… Hamilton, who had earlier had a reputation as a profligate, had apparently undergone a radical spiritual experience, and had set himself up as a champion of orthodoxy and of opposition to compromise… …Hamilton and his associates… With their support, and primarily at their instigation, some of the younger preachers began to hold meetings on the boundaries of, and even within, the parishes of such [indulged] ministers, with the object of drawing away their people from attending their services. This unmistakably aggressive stance was fully in line with Hamilton’s view of how to proceed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 76-77</span></figcaption>

<blockquote><p>Here is the Tongue, the grand instrument of Speech, which is a Faculty that God hath vouchsafed to Man alone, and therefore we are obliged to make use of it in celebrating the Praises of our Creator, who hath given it us on purpose to extol his Infinite Wisdom and Providence in the structure and frame of our Bodies, and particularly of this Noble Part, whereby we not only make known his Perfections, but hold Converse with our Brethren in the World. We can never sufficiently admire the Excellency and Usefulness of this divine Gift of Speaking.</p></blockquote>

<blockquote><p>The first great object of Christian love is God. And rightly to understand the nature, or estimate the value of this affection, it is necessary to bear in mind the natural condition of the human heart with respect to God. That is a condition of aversion and enmity. We cannot imagine more strong or energetic language than that which is employed in the Scriptures to describe it. “The carnal mind is enmity against God; for it is not subject to the law of God, neither indeed can be.” Rom. viii. 7. The mind, in its natural condition, not merely discovers its enmity, but is, in its very constitution, enmity itself, nor, until it is wholly renewed by the sanctifying operation of the Spirit, can it be otherwise than opposed to God and his law.

This sinful condition of man is proved by the whole of his history, if we only contemplate his conduct with relation to the character, or the commands, or the will of God. Instead of gratefully acknowledging God under the character in which he is revealed in the Scriptures, men are disposed to create an image after their own fancy, and bow down before it; instead of joyfully meeting his commandments, they are universally disobeyed; and instead of meekly bearing his will, it is blamed and resisted. Can there be plainer or fuller evidence of a state of alienation and enmity?

To overcome this enmity and to beget love for God, he is presented in the Scriptures under the most endearing character. One example may be cited from the 5th chapter in the second epistle to the Corinthians, where the apostle proclaims, “God was in Christ reconciling the world unto himself, not imputing their trespasses unto them;” and then, on the ground of that revelation, addresses the exhortation, “Be ye reconciled to God.” Jehovah is set forth calling upon sinners, offering to them pardon, entreating them to return, and providing for their eternal good.

It is the office of the Spirit to open the mind to an apprehension of him in this endearing revelation; and as soon as he is thus seen by the eye of faith, the soul becomes filled with sorrow and shame for having sinned against him—it is overcome by an affecting sense of his grace and mercy—estrangement gives place to fellowship, and enmity to love, and the result of this operation is reconciliation to God. So long as the mind is unenlightened by the Spirit, and apprehends not God, as he is revealed in Christ, there is enmity against him; but as soon as it is enabled thus to behold him, its enmity is overcome, and it is constrained to love him.

Nor will this love remain concealed in the heart. It will soon express itself in many outward manifestations. Gratitude will flow from the lips under a deep sense of undeserved favours; zeal will prompt to vigorous exertion for the honour of God; the heart will repose with confidence in him, conscious of security; and the delight of the whole man will be in God and his ways, saying with David, “Whom have I in heaven but thee? and there is none upon the earth that I desire besides thee.”

Christians should feel the imperative duty of cultivating this love to God. They should meditate much upon the character and love of God. Did they select such a passage as that in Rom. v. 6-8, and enter into its views, how deeply would it affect them? “When we were without strength, in due time Christ died for the ungodly. For scarcely for a righteous man will one die, yet peradventure for a good man some would even dare to die. But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.”

Think of him who loved us, of the manner in which he expressed his love, and of the character and condition of those whom he loved; and surely it must be felt that it is both our duty and privilege to love God, and not to rest without seeking to reach the holy and heavenly requirement, “Thou shalt love the Lord thy God with all thy heart, with all thy soul, and with all thy mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fruit of the Spirit – Love in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-9d81b301a0" data-kw="">
<blockquote><p>Do not imagine that no one can please God while he is engaged in military service. Among such was holy David to whom the Lord gave such high testimony. Among such were many just men of that time. Among such, also, was that centurion who said to the Lord: ‘I am not worthy that thou shouldst enter under my roof, but only say the word and my servant shall be healed. For I also am a man, subject to authority, having under me soldiers, and I say to this one: Go, and he goeth, and to another: Come, and he cometh; and to my servant: Do this, and he doth it’; of him the Lord said: ‘Amen I say to you I have not found so great faith in Israel.’ Among such, also, was that Cornelius to whom the angel was sent, who said: ‘Cornelius, thy prayer is heard and thy alms are accepted,’ when he advised him to send to the blessed Apostle Peter, to hear from him what he ought to do. And to summon the Apostle to him he sent a religious soldier.

Among such, also, were those who came for baptism to John, the holy precursor of the Lord and friend of the bridegroom, of whom the Lord said: ‘There hath not arisen among them that are born of women a greater one than John the Baptist.’ When they asked him what they ought to do, he answered them: ‘Do violence to no man, neither calumniate any man, and be content with your pay.’ Obviously, he did not forbid them to serve in the army when he commanded them to be satisfied with their pay.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Do not imagine that no one can please God while he is engaged in military service. Among such was holy David to whom the Lord gave such high testimony. Among such were many just men of that time. Among such, also, was that centurion who said to the Lord: ‘I am not worthy that thou shouldst enter under my roof, but only say the word and my servant shall be healed. For I also am a man, subject to authority, having under me soldiers, and I say to this one: Go, and he goeth, and to another: Come, and he cometh; and to my servant: Do this, and he doth it’; of him the Lord said: ‘Amen I say to you I have not found so great faith in Israel.’ Among such, also, was that Cornelius to whom the angel was sent, who said: ‘Cornelius, thy prayer is heard and thy alms are accepted,’ when he advised him to send to the blessed Apostle Peter, to hear from him what he ought to do. And to summon the Apostle to him he sent a religious soldier.

Among such, also, were those who came for baptism to John, the holy precursor of the Lord and friend of the bridegroom, of whom the Lord said: ‘There hath not arisen among them that are born of women a greater one than John the Baptist.’ When they asked him what they ought to do, he answered them: ‘Do violence to no man, neither calumniate any man, and be content with your pay.’ Obviously, he did not forbid them to serve in the army when he commanded them to be satisfied with their pay.”

— Augustine of Hippo, Letter to Boniface, c. 418 (no. 189) in Saint Augustine Letters: Volume IV (c. 420-30), trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 30 (Washington D.C.: The Catholic University of America Press, 1955), p. 268.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDo+not+imagine+that+no+one+can+please+God+while+he+is+engaged+in+military+service.+Among+such+was+holy+David+to+whom+the+Lord+gave+such+high+testimony.+Among+such+were+many+just+men+of+that+time.+Among+such%2C+also%2C+was+that+centurion+who+said+to+the+Lord%3A+%E2%80%98I+am+not+worthy+that+thou+shouldst+enter+under+my+roof%2C+but+only+say+the+word+and+my+servant+shall+be+healed.+For+I+also+am+a+man%2C+subject+to+authority%2C+having+under+me+soldiers%2C+and+I+say+to+this+one%3A+Go%2C+and+he+goeth%2C+and+to+another%3A+Come%2C+and+he+cometh%3B+and+to+my+servant%3A+Do+this%2C+and+he+doth+it%E2%80%99%3B+of+him+the+Lord+said%3A+%E2%80%98Amen+I+say+to+you+I+have+not+found+so+great+faith+in+Israel.%E2%80%99+Among+such%2C+also%2C+was+that+Cornelius+to+whom+the+angel+was+sent%2C+who+said%3A+%E2%80%98Cornelius%2C+thy+prayer+is+heard+and+thy+alms+are+accepted%2C%E2%80%99+when+he+advised+him+to+send+to+the+blessed+Apostle+Peter%2C+to+hear+from+him+what+he+ought+to+do.+And+to+summon+the+Apostle+to+him+he+sent+a+religious+soldier.%0A%0AAmong+such%2C+also%2C+were+those+who+came+for+baptism+to+John%2C+the+holy+precursor+of+the+Lord+and+friend+of+the+bridegroom%2C+of+whom+the+Lord+said%3A+%E2%80%98There+hath+not+arisen+among+them+that+are+born+of+women+a+greater+one+than+John+the+Baptist.%E2%80%99+When+they+asked+him+what+they+ought+to+do%2C+he+answered+them%3A+%E2%80%98Do+violence+to+no+man%2C+neither+calumniate+any+man%2C+and+be+content+with+your+pay.%E2%80%99+Obviously%2C+he+did+not+forbid+them+to+serve+in+the+army+when+he+commanded+them+to+be+satisfied+with+their+pay.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Letter+to+Boniface%2C+c.+418+%28no.+189%29+in+Saint+Augustine+Letters%3A+Volume+IV+%28c.+420-30%29%2C+trans.+Wilfred+Parsons%2C+The+Fathers+of+the+Church%3A+A+New+Translation%2C+vol.+30+%28Washington+D.C.%3A+The+Catholic+University+of+America+Press%2C+1955%29%2C+p.+268.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d81b301a0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d81b301a0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/06/16/augustine-of-hippo-on-the-lawfulness-of-military-service/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-900968f3a8" data-kw="">
<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>

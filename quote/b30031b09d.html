<main class="wrap"><figure class="quote" id="q-b30031b09d" data-kw="">
<blockquote><p>Although some of Richard Sibbes’s comments in his book on Josiah’s Reformation lend too much weight to an Erastian position, nevertheless, he accurately distinguishes between the civil magistrate’s lawful authority circa sacra (concerning religious matters) and the church’s authority in sacris (in intrinsically sacred matters):

[A]s a chief right, the ordering of the matters of religion belongs to the care of the prince. But there are two things in religion: first, intrinsecal [sic], within the church, as to preach, administer the sacraments, and ordain ministers. These he ought not to do. But for those things that are without it, these belong to him. If any of those that are placed in church or commonwealth do not their duty, it is fitting for him to correct. He ought to set all a-going without, and to remove abuses, but not to meddle with the things within the church aforesaid, as to execute the same, but to oversee and govern their execution, and those persons whose proper office it is to execute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Josiah’s Reformation. Laid open in four sermons</cite>, (London, 1637) in Works of Richard Sibbes, ed. A. B. Grosart (1862-3; 7 vols, Edinburgh, 1983), vi, 88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5676122dcd" data-kw="">
<blockquote><p>In affirming that the church discipline of the Scottish Reformation is that which principally distinguishes it from the Reformation achieved in other countries, I would not be understood to mean that our fathers alone of all the Reformers taught that Christ has given commandment and authority to the church, to watch carefully over the deportment of her members, admonishing and if necessary casting out those who wantonly violate the law of God.

This was no peculiarity of theirs; nor were they singular even when they taught that the duty and the responsibility connected with the exercise of discipline belong to the church exclusively, and he quite beyond the province of the civil magistrate. These principles (and it is well to remember the fact) are embodied in the public Confessions of nearly all the reformed churches; they are to be found in the Augsburg Confession and other symbolical books of the Lutheran church, in the Gallican and second Helvetic Confessions also, as well as in the documents of the Scottish Reformation.

The distinguishing and honourable peculiarity of our fathers was this, that they not only united their solemn testimony to that of their foreign brethren regarding the law of Christ on the subject of church discipline, but inculcated that law with an energy, and reduced it to practice with a fidelity and persistency unparalleled elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-binnie.html">William Binnie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church Discipline of the Scottish Reformation in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

</figure><figure class="quote" id="q-661fb6a393" data-kw="">
<blockquote><p>For the nation and kingdom that will not serve thee shall perish, yea, those nation shall be utterly wasted.” (Isaiah 60:12) …

If the expression does not ascribe to the Church any control over the State, it still more clearly forbids the idea that the State may exercise control over the Church. This, indeed, if it were at all permitted, would be to reverse the statement of the text, and to make out the line of duty to be, not that nations should serve the Church, but that the Church should serve the nations of the earth.

Whatever subjection the Church, both collectively and in her individual members, may give the State in civil things, she is not only free from this subjection in spiritual matters — that is, in all those things in which she is a church — in all those matters in which her being as a Church consists — but is warranted to expect and to claim the service of the State. Not only will the fulfilment of the prediction in the text “make an end of the Erastian controversy,” [George Gillespie] — the mere announcement should have prevented its rise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-lumsden.html">James Lumsden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Nations to the Church, and their Danger in Neglecting it in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-ef2014537d" data-kw="">
<blockquote><p>And so the kingly power in general as given for the good of all human societies in general, is from God the Creator for the good of all societies whither heathen or Christian. So Nebuchadnezzar, Darius, Nero, and Julian were essentially kings, and yet had not their kingly power immediately from the Mediator Christ, except in this general sense that the kingly power is a lawful ordinance of God warranted by the Word of God and Testament of our Testator Jesus Christ, because these are essentially kings and lawful magistrates who either never heard of Christ, nor any thing of God; but only that He is Creator of the world, or then who persecute and hate the name of Jesus Christ… Now Formalists, denying such to be lawful kings, as either know not Christ, or believe not in Him, join hands with Papists, and make way for Anabaptistical anarchy, that a persecuting or an unbelieving king is no king, not to be obeyed, but to be turned out of his throne: And to this meaning, Calvin, Viret and Cartwright teach that the kingly power flows immediately from God the Creator, not from God in the Mediator Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), ch. 19, p. 295</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

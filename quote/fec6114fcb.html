<main class="wrap"><figure class="quote" id="q-fec6114fcb" data-kw="">
<blockquote><p>He [Baynes] subsequently discusses the difference of the words in terms of the manner of singing. He does say that a spiritual song might be one which is framed according to the Scripture (Baynes, [ed. London, 1658,] p. 505), but makes no suggestion that this is to be used in an ordinary public worship context. When he comes to “the sum of the verse,” he speaks of “singing both in private and publick, which this Scripture and Col. 3:16 do commend;” but where he speaks of the church service he confines his terms to “Psalms”—”and all things, Psalms, Prayers in the Church must be to edify” (p. 505). When he finally applies the passage he provides this maxim: “get the spirit of David to sing a Psalm of David” (p. 506).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Winzer, ‘Westminster and Worship Examined</cite>, Matthew Winzer, ‘Westminster and Worship Examined: a Review of Nick Needham’s Essay on the Westminster Confession of Faith’s Teaching Concerning the Regulative Principle, the Singing of Psalms, and the Use of Musical Instruments in the Public Worship of God’ from The Confessional Presbyterian #4 (2008), p. 264</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f31f72356f" data-kw="">
<blockquote><p>He falls next on the doxology… We [Scottish presbyterians] do not use it, but we never laid such weight on using it as to forbear all communion with a congregation where it is used; I called it a ‘human composure’… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

— Gilbert Rule, The Good Old Way Defended… (Edinburgh: 1697), sect. 10, p. 258">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+falls+next+on+the+doxology%E2%80%A6+We+%5BScottish+presbyterians%5D+do+not+use+it%2C+but+we+never+laid+such+weight+on+using+it+as+to+forbear+all+communion+with+a+congregation+where+it+is+used%3B+I+called+it+a+%E2%80%98human+composure%E2%80%99%E2%80%A6+for+I+think+neither+ancient+nor+modern+divines+will+call+them+schismatics+who+cordially+join+with+the+Church+where+they+live+in+all+of+her+worship%2C+except+this%3B%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+The+Good+Old+Way+Defended%E2%80%A6+%28Edinburgh%3A+1697%29%2C+sect.+10%2C+p.+258&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff31f72356f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f31f72356f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=He%20falls%20next%20on%20the%20doxology,all%20of%20her%20worship%2C%20except%20this&amp;text=He%20falls%20next%20on%20the%20doxology&amp;text=live%20in%20all%20of%20her%20worship%2C%20except%20this" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4842eb8ff8" data-kw="">
<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 152 Lectures upon Psalm 51… (London, 1635), Lecture 1, p. 4-5 This section is occasioned upon the title of Ps. 51, that it is a psalm of David ‘to the chief musician’.</span></figcaption>

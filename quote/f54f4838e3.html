<main class="wrap"><figure class="quote" id="q-f54f4838e3" data-kw="">
<blockquote><p>In Romans 2:4, it [longsuffering] is associated with the goodness and forbearance of God, and subsumed under his goodness, as that which is despised by the impenitent who treasures up for himself wrath in the day of wrath, who does not know that the goodness of God “leadeth him to repentance” (eis metanoian se agei). The choice of the verb agein is to be noted. Since the impenitent are in view, it cannot refer to efficacious grace. Nevertheless, it is a strong verb as its use in Romans 8:14 shows: “As many as are led by the Spirit of God, these are the sons of God” (cf. Gal. 5:18). It must be understood as a constraining influence flowing from the goodness of God which is calculated to bring men to repentance. The construction in Romans 2:4 is remarkably similar to that in II Peter 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’, On 2 Pet., 3:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-221bfde8a3" data-kw="">
<blockquote><p>As for the divine commiseration of sinners, it shows that their death and damnation are not things primarily well-pleasing unto God: but it shows not that God must become an hypocrite and a dissembler if He have eternally decreed to permit them to incur death and damnation by their own default. For God’s mercy being actio sublevantis [an act of taking away] and not passio condolentis [a passion of suffering with], it ties Him not to do all He can for redeeming any man out of his misery; but his action is ordered and limited by his own free-will. It is the height and riches of God’s mercy which from everlasting has prepared for the elect only, and in time bestows upon them only that special and effectual grace which infallibly brings them unto glory. It is a lower degree of mercy (and yet true mercy too) which is showed to the non-elect or reprobate, in preparing for them and bestowing upon them such means of grace as by their own default are made ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, … (Cambridge, 1641), ‘Whether absolute reprobation oppugn the truth and sincerity of God’, pp. 357-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

0own%20default%20are%20made%20ineffectual" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b8cb63195f" data-kw="">
<blockquote><p>I answer that… Therefore, that toward which God has ordered the creature with regard to himself is said to be willed by him as by a first intention or by an antecedent will. But when a creature is impeded from this end because of its defect, God still fulfills in it the goodness of which it is capable; and this pertains, as it were, to his second intention and it is called a consequent will. Thus, since God made all men for blessedness, he is said to will the salvation of all men by an antecedent will; but since some are turned against their own salvation, whom the order of his wisdom does not allow to come to salvation because of their defect, he fulfills in them what pertains to his goodness in another way, namely, condemning them by justice; so that whereas they do not attain to the first order of his will, they fall into the second; and while they do not carry out God’s will, the will of God is fulfilled in them. However, the very defect of sin by which someone is rendered worthy of punishment in the present or else the future is not willed by God either by an antecedent or a consequent will, but it is only permitted by him… and neither did he order him to salvation according to the order of predestination, which is the order of absolute will; rather, to the extent that this order is from himself, he gave to him a nature ordered to beatitude. Reply Obj. 1: Neither order nor distinction comes from the act of the will, but only from the things willed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the divine will can be distinguished by antecedent and consequent?’ in Disputed Questions, On Truth</cite>, question 23, On the Will of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-3f75434c08" data-kw="">
<blockquote><p>It may be asked, how came these obnoxious and oppressive laws [concerning mandatory vaccination] to be placed upon our statute books? Did the people desire them or ask for them? No! Never. Without the knowledge or consent of the public these laws were clandestinely smuggled through indifferent, ignorant and incompetent Legislatures at the instance of a fraction of mercenary “lymph” manufacturers and politician-doctors, i. e., medicine-men who combine politics with physic in their business, men who have a stake in vaccination and are pecuniarily and professionally interested in the dissemination of disease among the people, men who regard the acquisition of the almighty “plunker” as of paramount importance to all considerations for the public health.

This language may sound harsh, but it is not too harsh to be literally true. Through the persistence of these medical factions and their accomplices (the “lymph” purveyors), these odious laws were lobbied through our various Legislatures without the knowledge or consent of the public. The members of politico-medical factions at whose instigation and for whose special benefit and pecuniary advantage these monopolitic laws were passed have the shield of the State thrown over them while they brazenly pose as benefactors of mankind.

These assassins of the public health have the assurance to ask the people to believe that these disease-prescribing laws were framed and passed in the interest of the public health. The pretext that these statutes were enacted in the interest of the public health is a hypocritical pretense. While that was the ostensible purpose of the law, they were actually passed for the selfish interest of and at the persistent solicitation of the venal clique of fee-hungry medical politicians and mercenary “lymph” manufacturers, who live and thrive at the expense of the public health.

Like many other pernicious practices which infest society, this State-supported practice has its pecuniary incentives. That the money-value is the principal motive which actuates many doctors in their advocacy of this ruinous practice cannot be doubted by any observer who has given the subject serious attention. Pecuniary interest, professional pride, reluctance to admit professional error are just as likely to lead astray members of the medical profession as those of any other business or profession by which men gain a livelihood.

If it were possible to eliminate the commercial feature from the vaccination enterprise, the solicitude of the vaccinating doctors and the “lymph” manufacturers for the welfare of “the dear people” would soon be found drooping. We all know how prone human nature is in this age of ultra-commercialism to nurse and cherish opinions so long as they favour our self-interest. Doctors are no exception to the general rule in this respect. They are human beings, no better and no worse than the members of other professions. Were it not that their pecuniary interests and professional credit are so intimately interwoven with the Jennerian delusion, they would gladly abandon the dreadful practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-w-hodge.html">J. W. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practice of Medicine. State-Inflicted Disease in our Public Schools in Medical Century</cite></span></figcaption>

<blockquote><p>…and I declare before God and the world that it was far from the intention of those that contrived it [the SL&amp;C], to wrong the King and his posterity… and the foresaid supplication doth manifestly declare their intent being only to have settled a conformity in Kirk government throughout all his Majesty’s dominions… I do further declare before God and the World that they [the English] are guilty of the breach of the Sacred Covenant, and that we have discharged our duty thereof (which is only promissory &amp; conditional as all oaths de futuro [of the future] are) by endeavoring to effectuate it quantum in nobis erat [insofar as we are in it], and that we are absolved in foro poli &amp; soli [in the sight of the city and self] of any oath or vow contained therein, insofar as concerns the settling of religion in the Kirk of England and Ireland, and that we are only bound thereby to preserve the Reformation of Religion in our own Kirk and Kingdom [of Scotland]… Therefore I exhort and conjure you, again and again, in the bowels of our Lord Christ, and words of a dying man, especially my brethren of the ministry… to stand fast and firm to this point of your Covenant, which you were bound to before by the Law of God and of this Land [of Scotland], and never suffer your selves by all the gilded allurement of this world, which will prove bitter and deceitful at last, to relinquish it.</p></blockquote>

<blockquote><p>§25… We must distinguish: 1. between a lawful impose or contracter, and a violent usurper or robber that injuriously compels us to swear.

2. Between the obvious usual sense of the words and an unusual forced sense.

3. Between a sincere, involuntary misunderstanding the imposer, and a voluntary fraudulent reservation or private sense.

4. Between one that I owe something to antecedently, and one that I owe nothing to but by the mere self-obligation of my vow.

5. Between an imposer that is himself the culpable cause of my misunderstanding him, and one that is not the cause, but my own weakness or negligence is the cause.

6. Between a case where both senses may be kept, and a case where they cannot, being inconsistent. … Proposition 6. If the imposer be a robber or usurper, or one that I owe nothing to in justice, but what I oblige myself to by my oath, I am not then bound at all to keep my oath in his sense, if my own sense was according to the common use of the words. Proposition 7. Though I may not lie to a robber or tyrant that unjustly imposes promises or oaths upon me, yet if he put an oath or promise on me which is good and lawful in the proper usual sense of the words, though bad in his sense (which is contrary to the plain words), whether I may take this to save my liberty or life, I leave to the consideration of the judicious: that which may be said against it is, that oaths must not be used indirectly and dissemblingly. That which may be said for it is:

1. That I have no obligation to fit my words to his personal private sense.

2. That I deceive him not, but only permit him to deceive himself, as long as it is he and not I that misuses the words.

3. That I am to have chief respect to the public sense: and it is not his sense, but mine that is the public sense.

4. That the saving of a man’s life or liberty is cause enough for the taking [of] a lawful oath. [Baxter elsewhere says this: “Lawyer: But as you have said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.</p></blockquote>

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, ... (London, 1673), pt. 3, ch. 5 | title 2, p. 705">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A725%E2%80%A6+We+must+distinguish%3A+1.+between+a+lawful+impose+or+contracter%2C+and+a+violent+usurper+or+robber+that+injuriously+compels+us+to+swear.+2.+Between+the+obvious+usual+sense+of+the+words+and+an+unusual+forced+sense.+3.+Between+a+sincere%2C+involuntary+misunderstanding+the+imposer%2C+and+a+voluntary+fraudulent+reservation+or+private+sense.+4.+Between+one+that+I+owe+something+to+antecedently%2C+and+one+that+I+owe+nothing+to+but+by+the+mere+self-obligation+of+my+vow.+5.+Between+an+imposer+that+is+himself+the+culpable+cause+of+my+misunderstanding+him%2C+and+one+that+is+not+the+cause%2C+but+my+own+weakness+or+negligence+is+the+cause.+6.+Between+a+case+where+both+senses+may+be+kept%2C+and+a+case+where+they+cannot%2C+being+inconsistent.+%E2%80%A6+Proposition+6.+If+the+imposer+be+a+robber+or+usurper%2C+or+one+that+I+owe+nothing+to+in+justice%2C+but+what+I+oblige+myself+to+by+my+oath%2C+I+am+not+then+bound+at+all+to+keep+my+oath+in+his+sense%2C+if+my+own+sense+was+according+to+the+common+use+of+the+words.+Proposition+7.+Though+I+may+not+lie+to+a+robber+or+tyrant+that+unjustly+imposes+promises+or+oaths+upon+me%2C+yet+if+he+put+an+oath+or+promise+on+me+which+is+good+and+lawful+in+the+proper+usual+sense+of+the+words%2C+though+bad+in+his+sense+%28which+is+contrary+to+the+plain+words%29%2C+whether+I+may+take+this+to+save+my+liberty+or+life%2C+I+leave+to+the+consideration+of+the+judicious%3A+that+which+may+be+said+against+it+is%2C+that+oaths+must+not+be+used+indirectly+and+dissemblingly.+That+which+may+be+said+for+it+is%3A+1.+That+I+have+no+obligation+to+fit+my+words+to+his+personal+private+sense.+2.+That+I+deceive+him+not%2C+but+only+permit+him+to+deceive+himself%2C+as+long+as+it+is+he+and+not+I+that+misuses+the+words.+3.+That+I+am+to+have+chief+respect+to+the+public+sense%3A+and+it+is+not+his+sense%2C+but+mine+that+is+the+public+sense.+4.+That+the+saving+of+a+man%E2%80%99s+life+or+liberty+is+cause+enough+for+the+taking+%5Bof%5D+a+lawful+oath.+%5BBaxter+elsewhere+says+this%3A+%E2%80%9CLawyer%3A+But+as+you+have+said+that+those+great+men%2C+%5BHugo%5D+Grotius+and+Bishop+Jeremy+Taylor+were+for+profitable+lying%2C+so+you+know+that+worthy+Latitudinarian+doctor+who+was+wont+to+say+that+if+false+knaves+would+turn+him+out+of+his+ministry+and+living+by+ensnaring+impositions%2C+he+would+take+the+words+in+the+best+sense+he+could+subdue+them+to%2C+whatever+the+authors+meant%3B+and+it+was+as+lawful+for+him+to+defend+himself+against+knaves+with+his+tongue%2C+as+with+his+hands+and+sword.+%E2%80%A6+%C2%A732.+Rule+18.+Though+an+oath+imposed+by+an+usurper+or+by+violence+is+not+to+be+taken+in+formal+obedience%2C+nor+at+all%2C+unless+the+greatness+of+the+benefit+require+it%2C+yet+being+taken+it+is+nevertheless+obligatory+%28supposing+nothing+else+do+make+it+void%29.+Man+is+a+free+agent+and+cannot+be+forced+though+he+may+be+frightened%3A+If+he+swear+to+a+thief+for+the+saving+of+his+life%2C+he+voluntarily+does+choose+the+inconveniences+of+the+oath+as+a+means+to+save+his+life.+Therefore+being+a+voluntary+act+it+is+obligatory.+Else+there+should+be+no+obligation+on+us+to+suffer+for+Christ%2C+but+anything+might+be+sworn+or+done+to+escape+suffering%3A+See+of+this+Dr.+Sanderson+largely%2C+Lectures+4%2C+sect.+14-16.+The+imposition+and+the+oath+are+different+things.+In+the+imposition%2C+a+thief+or+tyrant+is+the+party+commanding%2C+and+I+am+the+party+commanded%3A+And+his+having+no+authority+to+command+me%2C+does+nullify+only+his+command+and+makes+me+not+obliged+to+obey+him%2C+nor+to+take+it+in+any+obedience+to+him%3A+But+yet+if+I+do+take+it+without+any+authority+obliging+me+%28as+private+oaths+are+taken%29%2C+it+is+still+an+oath+or+vow%2C+in+which+the+parties+are+God+and+man%3A+Man+vowing+and+making+himself+a+debtor+to+God%3A+And+God+has+authority+to+require+me+to+keep+my+vows%2C+when+men+have+no+authority+to+require+me+to+make+them.+All+men+confess+that+private+Vows+bind%3A+And+the+nullity+of+the+imposer%E2%80%99s+authority+makes+them+but+private+vows.+This+case+is+easy+and+commonly+agreed+on.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%28London%2C+1673%29%2C+pt.+3%2C+ch.+5+%7C+title+2%2C+p.+705&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F51c3b75087.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51c3b75087.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=We%20must%20distinguish%3A%201.%20between%20a,is%20easy%20and%20commonly%20agreed%20on&amp;text=We%20must%20distinguish%3A%201.%20between%20a%20lawful%20impose&amp;text=This%20case%20is%20easy%20and%20commonly%20agreed%20on" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c4cb59ace1" data-kw="">
<blockquote><p>This work is important as it was the first commentary on the Westminster Confession, and from its same generation. When it was printed is significant. Dickson died in 1662, when the anti-presbyterian Charles II was king. The work was first printed (in a pirated form) in 1684, in the midst of the Killing Times. While not seeking to draw too much from this, yet it does give support that the generation of Westminster divines did not understand their Confession’s teaching on upholding the validity of the rule of non-Christians, or those of different religions, as only applicable to non-Christian, non-covenanted nations, but rather that it applied to their own Christian and covenanted nations of their time (England and Scotland).</p></blockquote>

<blockquote><p>[A]s your princes and rulers are criminal, with your bishops, of all idolatry committed, and of all the innocent blood that is shed for the testimony of Christ’s truth, and that because they maintain them in their tyranny, so are you (I mean so many of you as give no plain confession to the contrary) criminal and guilty with your princes and rulers, of the same crimes, because ye assist and maintain your princes in their blind rage, and give no declaration that their tyranny displeaseth you.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-40676c9f4b" data-kw="">
<blockquote><p>It is not enough that you abstain from violent wrong and oppression which ungodly men exercise against their subjects, but ye are further bound, to wit, that ye rule above them for their wealth. Which ye cannot do if that ye, either by negligence not providing true pastors, or yet by your maintenance of such as be ravening wolves, suffer their souls to starve and perish for lack of true food which is Christ’s Evangel sincerely preached. […] And therefore I fear not to affirm that which God shall one day justify: that by your offices ye be bound not only to repress their tyranny, but also to punish them as thieves and murderers, as idolaters and blasphemers of God, and in their rooms ye are bound to place true preachers of Christ’s Evangel for the instruction, comfort and salvation of your subjects, above whom else shall never the Holy Ghost acknowledge that you rule in justice for their profit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The appellation of John Knox from the cruel and most injust sentence pronounced against him by the false bishops and clergy of Scotland, with his supplication and exhortation to the nobility, estates and commonality of the same realm</cite>, (Geneva, 1558) in idem, On rebellion, ed. R. A. Mason (Cambridge, 1994), pp 86-7.</span></figcaption>

<blockquote><p>For rulers are not a terror to good works, but to evil. Do you want to be unafraid of the authority? Do what is good, and you will have praise from the same. (Romans 13:3)

ne · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-81609f3c8d" data-kw="">
<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10).

2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6).

3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment.

4. No glory to God could arise from this but rather the dishonor of a tyrannical lord.

5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing.

2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself.

3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such.

4. We are permitted to kill innocent creatures. Reply.

1. Not rational ones.

2. Irrational ones (bruta) for our use (2 Pet. 2:12).

3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, pp. 84-85, 112-13, 121-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<main class="wrap"><figure class="quote" id="q-60d84d2a26" data-kw="">
<blockquote><p>But, lest any honest Christian should by his frequent distractions be discouraged from his duties, or in his holy duties, I shall… prevent such a temptation by laying down some encouragements: … The fifth encouragement is that our God can gather some sense out of a distracted duty, and do us some good by it. Rom. 8:27, ‘He that searcheth the hearts, knoweth what is the mind of the Spirit;’ ’tis true of our spirit as well as of God’s. The great searcher of hearts knows what you came pregnant with, what you meant, though you missed it in the delivery. He can tell what was written in the letter, though it did miscarry, and will answer your godly meaning, and overlook your unwilling failing, Ps. 103:13, ‘As a father pitieth his children, so the Lord…’ Why, the child comes sometimes full of a suit to the Father, and he is quite out in his tale, has forgotten what he would have, but the Father knows what he wants and what he would have said, and grants the whole. And so, provided thou be a child, and art heartily sensible of thy wants, and comest panting to the Throne of Grace; thy heavenly Father will accept thy meaning, and grant thy petition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote against Distractions, or an Endeavor to Serve the Church in the Daily Case of Wanderings in the Worship of God (London: 1667), ch. 9</cite>, pp. 204, 213-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c00382ea43" data-kw="">
<blockquote><p>14th Objection: They object: To be present at a mass is to countenance an idol worship; so to be present in a church worship where there is any error in the worship is to countenance the error. For what worship we countenance to that we say, ‘Amen,’ and so we must consent to the wrong constitution of a church where are profane people? Answer: To countenance a worship professedly idolatrous, where the name of the worship imports the worshipping of a false god, is unlawful, for others do interpret our presence [as] a joint worshipping with them. But our presence at every lawful worship that is acknowledged lawful, does not give so much as interpretatively signification of our consent to every particular in the worship, because hearing, discerning, choosing or refusing, believing or not believing, according as you find the points agreeable to God’s Word, or dissonant therefrom, intervenes between your presence at the worship, and your consent to the worship. Now the act of consenting, approving and receiving the point of worship is formally to partake of the worship, else we could not obey the precept (1 Thess. 5:21) ‘Try all things.’ Some things in the preacher are to be borne with; The preachers of the Separation have not an apostolic and infallible spirit; if any of them preach unsound doctrine, the presence of the hearers does not involve them in the guilt of the preacher’s erroneous worship. The Pharisees corrupting of the Law was known and rebuked by Christ, but yet Christ forbade Separation. ‘Hear them’ (Matt. 23) ‘they sit in Moses’ chair.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (London, 1642), ch. 11</cite>, pp. 162-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-81a0827718" data-kw="">
<blockquote><p>In the beginning of the blessed Reformation, our wise and pious ancestors took care to set forth an order for redress of many things, which they then, by the Word, discovered to be vain erroneous, superstitious, and idolatrous, in the public worship of God. This occasioned many godly and learned men to rejoice much in the Book of Common Prayer, at that time set forth… Howbeit, long and sad experience hath made it manifest, that the Liturgy used in the Church of England, (notwithstanding all the pains and religious intentions of the compilers of it) hath proved an offence, not only to many of the godly at home, but also to the reformed Churches abroad. For, not to speak of urging the reading of all the prayers, which very greatly increased the burden of it, the many unprofitable and burdensome ceremonies contained in it have occasioned much mischief, as well by disquieting the consciences of many godly ministers and people, who could not yield unto them… …the [Anglican] Liturgy hath been a great means, as on the one hand to make and increase an idle and unedifying ministry… so, on the other side, it hath been (and ever would be, if continued) a matter of endless strife and contention in the Church… especially in these latter times, wherein God vouchsafeth to his people more and better means for the discovery of error and superstition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship | Preface</cite></span></figcaption>

the%20blessed,the%20discovery%20of%20error%20and%20superstition%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ec32e2afb4" data-kw="">
<blockquote><p>We never held it unlawful to do one of these actions, though it were by mistake unlawfully commanded; e. g. If the rulers prescribe a time, place, metre, tune, etc. unfit, if it be not so bad as to overthrow the ends and use of the worship, the fault of the commander will not disoblige us from the duty of obeying. And whereas some argue that no man has authority to sin; therefore, we are not bound to obey that which is no act of authority, I answer: Rulers have authority to command that which is good though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined. We never pray without some fault in the manner, and yet must rather do it so than not at all. The mistaken ruler bids us not sin: It’s his sin to choose a mis-circumstance; and it is not his own action that he bids us do, but ours: And it’s to us a lawful circumstance, because [it is] necessary to concord and commanded, though mistakingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2</cite>, pp. 13-14</span></figcaption>

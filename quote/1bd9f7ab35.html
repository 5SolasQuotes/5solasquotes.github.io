<main class="wrap"><figure class="quote" id="q-1bd9f7ab35" data-kw="">
<blockquote><p>And first, as to His work of active obedience. In being made “under the law” He had become bound as the covenant head and representative of His chosen people, to fulfil all righteousness. The law under which He had thus placed himself, was obviously that very law which God gave to Israel in the wilderness.

He could not redeem Israel from the law to which they were subject, by taking upon himself the obligations of some other or different law. They, beyond all question, were under the law engraven on the tables of stone; and only by taking up the same position could He meet the necessities of their case.

Equally obvious and certain it is, that if the law as given to Israel was a merely Jewish law — if it was a law the obligation of which rested on that people alone, and which was to be done away so soon as their peculiar economy came to an end — then, and in that case, the obedience which Christ rendered to that law, could be of no avail to justify any but the Jews. On the footing of such a view of the law, Christ could not be, as He actually is, “the end of the law for righteousness to every one that believeth,” (Rom. x. 4); but only to every Jew that believeth.

It is true, indeed, that the righteousness which Christ wrought out, went unspeakably beyond the righteousness of the Scribes and Pharisees. It was the law as interpreted by the Sermon on the Mount, whose righteousness He fulfilled — a righteousness which looked not to actions merely, but to the motives in which they originated, and to the spirit in which they were performed — a righteousness which looked to the very thoughts and intents of the heart. But by the commentary upon the law which the Sermon on the Mount presents, there is not so much as one jot or tittle added to the law, as given to Israel at Sinai.

That commentary showed the law to be “exceeding broad;” but the Psalmist, long before, had pronounced it to be so; and all that broadness was embraced in the Ten Commandments. That commentary showed the law to be “spiritual,” as Paul subsequently testified that it is; but all that spirituality was inherent in it from the first. There may be a show and semblance of putting honour upon Christ, in disparaging the Decalogue — the law as embodied in the Ten Commandments, — and in speaking of the law as abrogated, or at the very least absorbed by the Gospel.

But so to disparage the Decalogue, is simply to disparage the work of Christ. It was the righteousness of that very Decalogue which He fulfilled. It was that very Decalogue, the sum and essence of all whose commandments, the Lord was setting forth, when He said by Moses to His people of old—”Hear, O Israel; the Lord our God is one Lord: and thou shalt love the Lord thy God with all thine heart, and with all thy soul, and with all thy might,” (Deut. vi., 4, 5).

And was it not of His own perfect obedience to that very command Christ was speaking, when He said to His disciples, beside the well in Samaria — “My meat is to do the will of Him that sent Me, and to finish His work,” (John iv. 24). Christ had no other gods before that one only living and true God. He worshipped that God in spirit and in truth. He hallowed that God’s name. He remembered the Sabbath-day to keep it holy — He honoured His parents according to the flesh. He loved His neighbour as himself — for he went about doing good — and in all the relations of life, He was holy, harmless, undefiled, and separate from sinners.

What David said typically, Christ could say in the strictness and fulness of literal truth, “I delight to do Thy will, O my God: yea, Thy law is within my heart,” (Psa. xl., 8). It is impossible, in a word, to point to so much as one solitary act or utterance of that holy and spotless life which He led on earth, from the cradle to the cross, that is not included in the righteousness of the law as given to Israel on the two tables of stone. It was that law that was in His heart; and it was that law, the holiness, justice, and goodness of which was exemplified in His life. In Him “there was no sin,” because in Him there was no transgression of that law’s commands. And it is in virtue of His perfect obedience to that law in our stead that this is the name by which He is called — “the Lord our Righteousness.</p></blockquote>

<blockquote><p>Verse 4. That the righteousness of the law might be fulfilled in us, &amp;c. This verse expresses the design of God in sending his Son, and in condemning sin the flesh. He did thus condemn it, ἵνα, in order that the righteousness of the law might be fulfilled. The meaning, therefore, of this passage is determined by the view taken of ver.

3. If that verse means, that God, by sending his Son, destroyed sin us, then of course this verse must mean, ‘He destroyed sin, in order that we should fulfil the law;’ i.e. that we should be holy. But if ver. 3 is understood of the sacrificial death of Christ, and of the condemnation of sin him as the substitute of sinners, then this verse must be understood of justification, and not of sanctification. He condemned sin, in order that the demands of the law might be satisfied. This is the view of the passage given even by the majority of the early Fathers, and by almost all evangelical interpreters, including the Reformers. “Qui intelligunt Spiritu Christi renovatos legem implere, commentum a sensu Pauli penitus alienum afferunt; neque enim eo usque proficiunt fideles, quamdia peregrinantur in mundo, ut justificatio legis in illis plena sit, vel integra. Ergo hoc ad veniam referre necesse est; quia, dum nobis accepta fertur Christi obedientia, legi satisfactum est, ut pro justis censeamur.” That this is the true meaning of the passage appears not only from the connection and the course of the argument, but also from the following considerations:

1. It is consistent with the strict and natural meaning of the words. The word δικαίωμα, here used, means, first, something righteous, and then, second, something declared to be righteous and obligatory, an ordinance or precept; and, third, a righteous decision, a just judgment, as when in Rom. 1:29, the heathen are said to know the δικαίωμα, the righteous judgment of God; and, fourth, the act of declaring righteous, justification. In this sense δικαίωμα is antithetical to κατάκριμα. The δικαίωμα τοῦ νόμου, therefore, may mean, the righteous requirement of the law, that which satisfies its demands. In strict accordance therefore with the sense of the words, we may explain the passage to mean, ‘that the demands of the law might be satisfied in us.’ That is, that we might be justified. Christ was condemned, that to us there might be no condemnation. He was made sin, that we might be made righteousness, 2 Cor. 5:21. Or, if we take δικαίωμα in the sense of (Rechtfertigungsurtheil) a declaration of righteousness, an act of justification, the same idea is expressed: ‘Sin was condemned in Christ, in order that the sentence of justification might be fulfilled, or carried into effect in us.’ This is the explanation which Eckermann, Köllner, Philippi, and other modern interpreters adopt.

2. The analogy of Scripture. To make this passage teach the doctrine of subjective justification, that we are freed from condemnation or delivered from the law by our inward sanctification, is to contradict the plain teaching of the Bible, and the whole drift and argument of this epistle.

3. The concluding clause of the verse, (who walk not after the flesh, &amp;c.) demands the interpretation given above. In the other view of the passage, the latter clause is altogether unnecessary. Why should Paul say, that Christ died in order that they should be holy who are holy, i.e. those who walk not after the flesh? On the other hand, the second clause of the verse is specially pertinent, if the first treats of justification. The benefits of Christ’s death are experienced only by those who walk not after the flesh. The gospel is not antinomian. Those only are justified who are also sanctified. Holiness is the fruit and evidence of reconciliation with God. There is no condemnation to those who walk after the Spirit; and the righteousness of the law is fulfilled by those who walk after the Spirit. In both cases, the latter clause is designed to describe the class of persons who are entitled to appropriate to themselves the promise of justification in Christ.

<blockquote><p>Whether it is rightly said by Johannes Piscator on Rom. 8:4 [“That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.”]: ‘Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.’ We deny it.</p></blockquote>

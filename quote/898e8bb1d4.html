<main class="wrap"><figure class="quote" id="q-898e8bb1d4" data-kw="">
<blockquote><p>O Father of Light, who hast been pleased to vouchsafe unto us poor miserable sinners, who by nature sit in darkness and in the shadow of death, the light to direct us through the darkness of this world unto the light of glory, We beseech thee to pardon all our sins, and to open the blind eyes of our understanding, that we may rightly conceive thy Word, and withal to give us grace rightly to apply it unto our own hearts, and to yield all holy obedience thereunto through Jesus Christ our Lord and only Saviour. Amen.</p></blockquote>

<blockquote><p>45. The fifth petition e Next follows: &quot;Forgive us our debts&quot; [Matt. 6:12]. With this and the following petition, Christ briefly embraces all that makes for the heavenly life, as the spiritual covenant that God has made for the salvation of his church rests on these two members alone: &quot;I shall write my laws upon their hearts,&quot; and, &quot;I shall be merciful toward their iniquity&quot; [Jer. 31:33 p.; cf. ch. 33:8]. Here Christ begins with forgiveness of sins, then presently adds the second grace: that God protect us by the power of his Spirit and sustain us by his aid so we may stand unvanquished against all temptations. e(a) He calls sins &quot;debts&quot; because we owe penalty for them, aand we could in no way satisfy it unless we were released by this forgiveness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20</span></figcaption>

<blockquote><p>Almighty God and heavenly Father, You have promised to hear and answer our requests which we make to you in the name of Your beloved Son, Jesus Christ our Lord. We are further taught by Him and His apostles to gather together in His name, with the promise that He will be among us and will intercede for us before You, that we may receive and obtain all things on which we are agreed on earth. You bid us pray, first, for those whom you have set up over us, our leaders and governors. Next, for the needs of all Your people, and of all men everywhere. Therefore, trusting in Your holy truth and in Your promise, and being assembled here before You in Jesus’ name, we lovingly beseech You, our God and Father, in Your infinite mercy, freely to pardon our transgressions, and so to lift our thoughts and desires to You that we may heartily call upon You according to Your good will and pleasure. We therefore pray, heavenly Father, for all princes and lords, Your servants to whom you have committed the rule of justice. Most particularly do we pray for the rulers of this city, that you will endue them with Your Spirit, who alone is gracious and sovereign, and daily increase His gifts in them, that they, acknowledging Your Son Jesus Christ to be King of kings and Lord of lords, with full power in heaven and on earth, may seek to serve Him and exalt His reign in all their dominions, and may according to Your will, guide and govern their subjects, who are the work of Your hands and the sheep of Your pasture. And may we, Your people, here and everywhere, being kept in peace and tranquility, serve You in holiness and righteousness. And, free from the fear of our enemies, may be give You praise all our days. We pray also, true Father and Saviour, for all whom You have ordained as pastors to Your people, who have the care of souls and the administration of Your holy gospel. May You lead and direct them by Your Holy Spirit, that they may be found faithful and true ministers of Your glory, always striving to gather and bring home the erring and wayward sheep to the Lord Jesus Christ, our chief Shepherd and principal Bishop, that they might daily prosper and grow in Him in all righteousness and holiness. Grant, moreover, that all churches may be delivered from the mouths or ravening wolves and hirelings, who follow their own purposes and ambitions, and have no care fore the honour of Your holy name and the welfare of Your flock. Next we pray, most gracious God and merciful Father, for all men generally. Since you desire all men to acknowledge You as Saviour of the world, through the redemption won by our Lord Jesus Christ, may those who do not know Him, being in darkness and captive to ignorance and error– may they by the light of Your Holy Spirit and the preaching of Your gospel, be led into the way of salvation, which is to know You, the only true God, and Jesus Christ whom you have sent. May those whom You have already visited with Your grace, and enlightened by the knowledge of Your Word, grow in all goodness, enriched by Your spiritual blessing, so that together we may all worship You with heart and voice, giving honour and homage to Christ, our Master, King and Lawgiver. Likewise, O God of all comfort, we commend to You all whom You visit and chastise with cross and tribulation, whether it be through poverty or prison, sickness or exile, or affliction of body or mind. May You make known to them Your fatherly love, and assure them that their chastisement is for amendment of life. And may they with willing heart turn to You and, being converted, receive Your comfort, being delivered from every distress. Finally, O God and Father, grant also that we, who are gathered here in Jesus’ name to hear His Word, may, without dissembling or hypocrisy, acknowledge that by nature we are lost, that we deserve Your punishment, and daily heap up condemnation to ourselves by our wretched and unruly lives. Help us to see that in us there is nothing good, and that flesh and blood can never inherit Your kingdom. May be gladly and with steadfast trust submit to your Lord Jesus Christ, our only Saviour and Redeemer. And may He so live in us that, our old Adam being put to death, we may rise to a new and better life, to the praise and glory of Your name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Beatitudes</cite>, trans. by Robert White (Carlisle, PA: Banner of Truth, 1562/2006), 83–85.</span></figcaption>

</figure><figure class="quote" id="q-b5e9ec14e4" data-kw="">
<blockquote><p>The full assurance of obtaining what we want must not chill our supplications for it. Who can have greater assurance of supply than our Redeemer had of assistance in his task, and exaltation after it? Insured by the promises to him, backed by the oath of God, that he should be a priest for ever, of which he had at this time a sense and impression upon his heart, John xiii. 1, 3, he knew that he should ‘depart out of this world unto the Father;’ and ‘knowing that the Father had given all things into his hands, that he was come from God, and went to God,’ yet he prays for that glory. Promises are not damps, but incentives and guides, to prayer; they are to inflame us, not to cool us.

How can we pray in faith without a promise, which is the ground of faith, since prayer is nothing but a putting promises in suit! Precepts command us to pray, and promises direct us what to pray for, with hopes of success. The promises of a seed to Christ stand firm, yet he is now in heaven an advocate interceding for it. As Christ, though assured, hath nothing without asking, so neither can his members. Promises encourage to put in our claim to them, and not our waiving it. When Daniel knew that the term of the church’s captivity was near expired, according to the promise of God, he buckles more to prayer, Dan. ix. 2, 3</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The full assurance of obtaining what we want must not chill our supplications for it. Who can have greater assurance of supply than our Redeemer had of assistance in his task, and exaltation after it? Insured by the promises to him, backed by the oath of God, that he should be a priest for ever, of which he had at this time a sense and impression upon his heart, John xiii. 1, 3, he knew that he should ‘depart out of this world unto the Father;’ and ‘knowing that the Father had given all things into his hands, that he was come from God, and went to God,’ yet he prays for that glory. Promises are not damps, but incentives and guides, to prayer; they are to inflame us, not to cool us.

How can we pray in faith without a promise, which is the ground of faith, since prayer is nothing but a putting promises in suit! Precepts command us to pray, and promises direct us what to pray for, with hopes of success. The promises of a seed to Christ stand firm, yet he is now in heaven an advocate interceding for it. As Christ, though assured, hath nothing without asking, so neither can his members. Promises encourage to put in our claim to them, and not our waiving it. When Daniel knew that the term of the church’s captivity was near expired, according to the promise of God, he buckles more to prayer, Dan. ix. 2, 3”

— Stephen Charnock, , A Discourse on the Knowledge of God, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 6-7.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+full+assurance+of+obtaining+what+we+want+must+not+chill+our+supplications+for+it.+Who+can+have+greater+assurance+of+supply+than+our+Redeemer+had+of+assistance+in+his+task%2C+and+exaltation+after+it%3F+Insured+by+the+promises+to+him%2C+backed+by+the+oath+of+God%2C+that+he+should+be+a+priest+for+ever%2C+of+which+he+had+at+this+time+a+sense+and+impression+upon+his+heart%2C+John+xiii.+1%2C+3%2C+he+knew+that+he+should+%E2%80%98depart+out+of+this+world+unto+the+Father%3B%E2%80%99+and+%E2%80%98knowing+that+the+Father+had+given+all+things+into+his+hands%2C+that+he+was+come+from+God%2C+and+went+to+God%2C%E2%80%99+yet+he+prays+for+that+glory.+Promises+are+not+damps%2C+but+incentives+and+guides%2C+to+prayer%3B+they+are+to+inflame+us%2C+not+to+cool+us.%0A%0AHow+can+we+pray+in+faith+without+a+promise%2C+which+is+the+ground+of+faith%2C+since+prayer+is+nothing+but+a+putting+promises+in+suit%21+Precepts+command+us+to+pray%2C+and+promises+direct+us+what+to+pray+for%2C+with+hopes+of+success.+The+promises+of+a+seed+to+Christ+stand+firm%2C+yet+he+is+now+in+heaven+an+advocate+interceding+for+it.+As+Christ%2C+though+assured%2C+hath+nothing+without+asking%2C+so+neither+can+his+members.+Promises+encourage+to+put+in+our+claim+to+them%2C+and+not+our+waiving+it.+When+Daniel+knew+that+the+term+of+the+church%E2%80%99s+captivity+was+near+expired%2C+according+to+the+promise+of+God%2C+he+buckles+more+to+prayer%2C+Dan.+ix.+2%2C+3%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+%2C+A+Discourse+on+the+Knowledge+of+God%2C+in+The+Complete+Works+of+Stephen+Charnock%2C+B.D.+%285+vols%2C+Edinburgh%3A+James+Nichol%2C+1865%29%2C+4%3A+6-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5e9ec14e4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class=" <blockquote><p>The fast is indicted [called and set] eight days before, and the causes laid open for preparing of the people for humiliation (as Joel 2:1-3; Isa. 22:12,13). We have no anniversary [annual] and set fasts or feasts either, because God Himself by his judgment imminent, or already inflicted, or by permitting his people to follow their own ways, calls to fasting and mourning (Isa. 22:13, Joel 2:1-6, etc.), and so by his mercies and wonderful deliverances calls to extraordinary joy of thanksgiving (Ps. 118:24). The doctrine of the Law is preached (as Joel 2 and Isa 58), and the fast observed with abstinence from meat and drink, and carnal and ordinary pleasures (Joel 2:16).</p></blockquote>

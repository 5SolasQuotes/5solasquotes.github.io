<main class="wrap"><figure class="quote" id="q-9ca53cbb5f" data-kw="">
<blockquote><p>At which union [of the two natures in Christ’s incarnation] also, (4) prefigured in the bush that was burning yet not consumed, in which was the angel of Jehovah (the angel of the presence, Isa. 63:9; the angel of the covenant, Mal. 3:1), Moses marveled in Exodus 3:2–3, ‘I will now turn aside, and see this great sight.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Todd Rester &amp; Michael Spangler (RHB), vol. 4, bk. 5; ch. 4, section 35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b07f9bac9e" data-kw="">
<blockquote><p>We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be lead to the knowledge of God without painted or carved images. Now peradventure some will say that Christ has a body, and likewise have saints, and therefore of them we may have images although of God there can be made no image. And further they wil say that the cause why images were forbid was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images. Yet as I will not utterly deny but they may be had, so I think it more convenient for Christ’s religion that they should be taken out of Christian men’s churches than that they should be placed in the temple [church building] of God. And of this my opinion I will show you certain good grounds, to the intent that whan you be demanded why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Instruction into Christian Religion</cite>, (London: 1548), A Short Instruction Concerning the Ten Commandments, First Sermon, no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

tures%20which%20declare&amp;text=into%20the%20church%20by%20the%20occasion%20of%20images" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e5e5b6cb6c" data-kw="">
<blockquote><p>I will analyze how a group of Byzantine seals mark a subgroup of this elite [class] that emerged at the forefront of Byzantine society at the beginning of the iconoclast era… The common feature shared by these seals is that they all contain quotations of the Psalms, and represent nearly the only quotations—scriptural or otherwise—that occur on Byzantine seals. This short-lived sigillographic trend was, moreover, restricted to prominent early iconoclast lay officials.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joe-glynias.html">Joe Glynias</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayerful Iconoclasts</cite>, (726–750)’ in Dumbarton Oaks Papers, vol. 71 (2017), pp. 65-93, pp. 65-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“I will analyze how a group of Byzantine seals mark a subgroup of this elite [class] that emerged at the forefront of Byzantine society at the beginning of the iconoclast era… The common feature shared by these seals is that they all contain quotations of the Psalms, and represent nearly the only quotations—scriptural or otherwise—that occur on Byzantine seals. This short-lived sigillographic trend was, moreover, restricted to prominent early iconoclast lay officials.”

</figure><figure class="quote" id="q-3abe51af7d" data-kw="">
<blockquote><p>Perhaps the Father’s flock, the little chosen flock of Christ, is with his son Moses, some faithful shepherd in the backside of a desert coming to the mountain of God, and there see visions of the flaming bush and the Angel of the Covenant in it? Dost thou delight where Christ does feed, though in secret and retired corners, and holdest communion with saints there?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-lee.html">Samuel Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on Mortality</cite>, … (London, 1669), ch. 8, p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-0314faa90f" data-kw="">
<blockquote><p>why does Moses in this place [Dt. 33:16] set Him in the bush? It is because God had there showed Himself unto Him… God considers how it is for our benefit to have some familiarity with Him: and thereupon He yields to our rudeness, and takes upon Him as it were a new shape, howbeit not which is contrary (as I said afore), but to the intent that we should not be scared, nor take occasion to shrink from Him. Now then, He allures us gently, and therewithal He stops to us and makes Himself as it were mean [lowly] unto us…. But we see how He showed Himself to the fathers of old-time under certain shapes. As for example when He talked with Jacob in Bethel, it was because Jacob needed such confirmation (Gen. 28:13)… …as if he should say, ‘…he appeared to me in the bush, and there I knew his majesty…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 196, pp. 1215-16</span></figcaption>

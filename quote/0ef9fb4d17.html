<main class="wrap"><figure class="quote" id="q-0ef9fb4d17" data-kw="">
<blockquote><p>I had never read one Socinian, nor much of any Arminians… and I remembered two or three things in Dr. [William] Twisse (whom I most esteemed) which inclined me to moderation in the five Articles [disputed between Arminians and the Reformed]: … 5. That faith is but causa dispositiva justificationis, and so is repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e120f7bfe8" data-kw="">
<blockquote><p>Adoption, that also is a privilege we receive in this life; yea a learned man ([William] Forbes in his book where he handles the order of God’s graces [Modest Considerations...]) makes adoption (as I take it) to be the first, and to go before justification; yet the apostle, Rom. 8:23, calls the Last Day, the day of adoption. Hence 1 Jn. 3:2, the apostle, though he says, ‘We are now the sons of God,’ yet he says ‘it does not appear what we shall be,’ because the glory God at the Last Day will put upon us is so far transcendent and superlative to what now we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures (London: Miller, 1651), Lecture 29, on Acts 3:19</cite>, p. 256</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“Adoption, that also is a privilege we receive in this life; yea a learned man ([William] Forbes in his book where he handles the order of God’s graces [Modest Considerations...]) makes adoption (as I take it) to be the first, and to go before justification; yet the apostle, Rom. 8:23, calls the Last Day, the day of adoption. Hence 1 Jn. 3:2, the apostle, though he says, ‘We are now the sons of God,’ yet he says ‘it does not appear what we shall be,’ because the glory God at the Last Day will put upon us is so far transcendent and superlative to what now we are.”

</figure><figure class="quote" id="q-ea94fcd418" data-kw="">
<blockquote><p>Believe me, the crown and glory of the Gospel is justification by faith, without the deeds of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, ch. on Justification</span></figcaption>

— J. C. Ryle, Old Paths, ch. on Justification">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBelieve+me%2C+the+crown+and+glory+of+the+Gospel+is+justification+by+faith%2C+without+the+deeds+of+the+law.%E2%80%9D%0A%0A%E2%80%94+J.+C.+Ryle%2C+Old+Paths%2C+ch.+on+Justification&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fea94fcd418.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ea94fcd418.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-07466e7fed" data-kw="">
<blockquote><p>Faith in Christ crucified is not commanded in the Law. For the apostle in Rom. 4:4–5 and 10:5–6, 11 sets faith in opposition to the Law; and in Gal. 3:12 he says that ‘The Law is not of faith,’ because the Law promises life to those who do the things contained in it. Therefore, faith is not comprehended under the Law. Nor indeed can there be any commerce between the Law and Christ as Mediator: “You are severed from Christ, you who are justified by the Law; you have fallen from grace” (Gal. 5:4). Faith in Christ crucified is a certain kind of righteousness: for it is obedience, and as it were a conformity to the command of God, as in 1 Jn. 3:23, “This is his commandment, that we should believe on the name of his Son,” and Jn. 3:36, “He who believes in the Son has eternal life; but he who does not obey the Son shall not see life, but the wrath of God abides on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reconciliation of a Sinner… in which the Doctrine of the Anglican Church on the Justification of the Ungodly is explicated and defended (Basil, 1624), bk. 1, ch. 6</cite>, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d06f8999c0" data-kw="">
<blockquote><p>For faith, termed special mercy, naturally precedes justification in a repentant sinner, as seen in the tax collector who first pleads for mercy through faith; ‘God, be merciful to me a sinner,’ meaning, he trusts he will receive forgiveness of sins. This faith also accompanies justification; during the act of justification, he trusts that his sins are forgiven. Furthermore, it follows justification; for, justified, he descends to his house with the same confidence that his sins have been forgiven. Hence, he later infers that the special object of justifying faith is the promise of the Gospel about the future, present, and past, to each one, to me, to you, to him, believing in the Son, through faith in His blood, sins will be, are being, and have been forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXVII. Similar views are seen in Paraeus. He states:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

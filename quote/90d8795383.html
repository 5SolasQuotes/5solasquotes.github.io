<main class="wrap"><figure class="quote" id="q-90d8795383" data-kw="">
<blockquote><p>John Cameron [the teacher of Amyraut] set the tendency in motion which in different lands has tried to mediate between the consistent scheme of the Reformed Faith and the Arminianism which was set aside by the findings of the Synod of Dordt… The issues of his mongrel compromising teaching were far reaching. The church of his adoption felt the effects of his teaching to such an extent as that the Theology of the later Huguenots was to a large extent revolutionised. Their influence in turn told on Richard Baxter and on all the varieties of teaching that can be traced back to his type of doctrine. It affected the thinking of New England; and as a return tide on its way back over the Atlantic it determined the teaching of the English Edwardians, both Independent and Baptist. The force of the current that was thus changing the older Calvinism beat at last on the Reformed teaching of Scotland in circles other than those of the Neonomians. It found more channels than one in which to flow. New England Revivalism did its share of the work; and the influence of modern Calvinism in English Nonconformity also contributed its quota. Along with the disintegrating work of the New Light movement, which was of home [i.e., Scottish] growth and which spoke of an uneasy spirit of dissatisfaction with long accepted truth and of a restlessness that was in quest of something new, the various streams of influence that derived remotely from Cameron are responsible for the collapse of the Confessional orthodoxy which had for ages found a home in his native country.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/supralapsarians.html">John Macleod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scottish Theology</cite>, pp. 61-62</span></figcaption>

<blockquote><p>If the idea of a real succession in time between the parts of the divine decree be relinquished, as it must be; then this scheme is perfectly illusory, in representing God as decreeing to send Christ to provide a redemption to be offered to all, on condition of faith, and this out of His general compassion. For if He foresees the certain rejection of all at the time, and at the same time purposes sovereignly to withhold the grace which would work faith in the soul, from some, this scheme of election really makes Christ to be related, in God’s purpose, to the non-elect, no more closely nor beneficially than the stricter Calvinistic scheme. But second and chiefly, it represents Christ as not purchasing for His people the grace of effectual calling, by which they are persuaded and enabled to embrace redemption. But God’s purpose to confer this is represented as disconnected with Christ and His purchase, and subsequent, in order, to His work, and the foresight of its rejection by sinners. Whereas Scripture represents that this gift, along with all other graces of redemption, is given us in Christ, having been purchased for His people by Him (Eph. 1:3; Phil. 1:29; Heb. 12:2)</p></blockquote>

</figure><figure class="quote" id="q-a7cdc96c37" data-kw="">
<blockquote><p>‘Who has made us fit.’ Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (Jn. 10), for his Church only (Eph. 1), not for the world (Jn. 17). And therefore when the Scripture says Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the elect: for all, that is, for the elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the gentiles also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (1617), on Col. 1:12, p. 99</span></figcaption>

<blockquote><p>That disease is curable for which a sovereign medicine may be found, but cured it is not till the medicine be applied to the patient; and if it so fall out, that the medicine being not applied, the party miscarries, we say he was lost, not because his sickness was incurable, but because there wanted a care to apply that to him that might have helped him.</p></blockquote>

</figure><figure class="quote" id="q-b59e97c5ff" data-kw="">
<blockquote><p>It has been maintained that the [Westminster] Assembly formulated at least one section so as to allow for an Amyraldian doctrine of the atonement. The Minutes of the Assembly give no support to this contention. There are three principles enunciated in the [Westminster] Confession that exclude the Amyraldian view. The first is that redemption has been purchased for the elect. ‘The Lord Jesus, by His perfect obedience, and sacrifice of Himself… purchased, not only reconciliation, but an everlasting inheritance in the kingdom of heaven, for all those whom the Father hath given unto him’ (8:5). The second is that impetration and application are coextensive. ‘To all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same’ (8:8). This excludes any form of universal atonement. The redemption purchased includes, as the preceding quotation implies, the purchase of an everlasting inheritance, and this is therefore said to be communicated to all for whom redemption was purchased. If all were included then all would be the partakers of the everlasting inheritance in the kingdom of heaven, a position clearly denied in the Confession elsewhere. The third principle is the exclusiveness of redemption. ‘Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only’ (3:4). In the preceding sentence the elect are said to have been ‘redeemed by Christ’; now it is said that they alone are redeemed. Other lines of argument could be elicited from the Confession to show that it allowed for no form of universal atonement, not even the hypothetical universalism propounded on the floor of the Assembly. But the foregoing principles are sufficient to show that the particularism in terms of which the whole doctrine of salvation is constructed is not sacrificed at the point of the atonement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings of John Murray</cite>, (Edinburgh: Banner, 1982), vol. 4, pp. 255-256</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“It has been maintained that the [Westminster] Assembly formulated at least one section so as to allow for an Amyraldian doctrine of the atonement. The Minutes of the Assembly give no support to this contention. There are three principles enunciated in the [Westminster] Confession that exclude the Amyraldian view. The first is that redemption has been purchased for the elect. ‘The Lord Jesus, by His perfect obedience, and sacrifice of Himself… purchased, not only reconciliation, but an everlasting inheritance in the kingdom of heaven, for all those whom the Father hath given unto him’ (8:5). The second is that impetration and application are coextensive. ‘To all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same’ (8:8). This excludes any form of universal atonement. The redemption purchased includes, as the preceding quotation implies, the purchase of an everlasting inheritance, and this is therefore said to be communicated to all for whom redemption was purchased. If all were included then all would be the partakers of the everlasting inheritance in the kingdom of heaven, a position clearly denied in the Confession elsewhere. The third principle is the exclusiveness of redemption. ‘Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only’ (3:4). In the preceding sentence the elect are said to have been ‘redeemed by Christ’; now it is said that they alone are redeemed. Other lines of argument could be elicited from the Confession to show that it allowed for no form of universal atonement, not even the hypothetical universalism propounded on the floor of the Assembly. But the foregoing principles are sufficient to show that the particularism in terms of which the whole doctrine of salvation is constructed is not sacrificed at the point of the atonement.”

— John Murray, Collected Writings of John Murray (Edinburgh: Banner, 1982), vol. 4, pp. 255-256">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+has+been+maintained+that+the+%5BWestminster%5D+Assembly+formulated+at+least+one+section+so+as+to+allow+for+an+Amyraldian+doctrine+of+the+atonement.+The+Minutes+of+the+Assembly+give+no+support+to+this+contention.+There+are+three+principles+enunciated+in+the+%5BWestminster%5D+Confession+that+exclude+the+Amyraldian+view.+The+first+is+that+redemption+has+been+purchased+for+the+elect.+%E2%80%98The+Lord+Jesus%2C+by+His+perfect+obedience%2C+and+sacrifice+of+Himself%E2%80%A6+purchased%2C+not+only+reconciliation%2C+but+an+everlasting+inheritance+in+the+kingdom+of+heaven%2C+for+all+those+whom+the+Father+hath+given+unto+him%E2%80%99+%288%3A5%29.+The+second+is+that+impetration+and+application+are+coextensive.+%E2%80%98To+all+those+for+whom+Christ+hath+purchased+redemption%2C+he+doth+certainly+and+effectually+apply+and+communicate+the+same%E2%80%99+%288%3A8%29.+This+excludes+any+form+of+universal+atonement.+The+redemption+purchased+includes%2C+as+the+preceding+quotation+implies%2C+the+purchase+of+an+everlasting+inheritance%2C+and+this+is+therefore+said+to+be+communicated+to+all+for+whom+redemption+was+purchased.+If+all+were+included+then+all+would+be+the+partakers+of+the+everlasting+inheritance+in+the+kingdom+of+heaven%2C+a+position+clearly+denied+in+the+Confession+elsewhere.+The+third+principle+is+the+exclusiveness+of+redemption.+%E2%80%98Neither+are+any+other+redeemed+by+Christ%2C+effectually+called%2C+justified%2C+adopted%2C+sanctified%2C+and+saved%2C+but+the+elect+only%E2%80%99+%283%3A4%29.+In+the+preceding+sentence+the+elect+are+said+to+have+been+%E2%80%98redeemed+by+Christ%E2%80%99%3B+now+it+is+said+that+they+alone+are+redeemed.+Other+lines+of+argument+could+be+elicited+from+the+Confession+to+show+that+it+allowed+for+no+form+of+universal+atonement%2C+not+even+the+hypothetical+universalism+propounded+

<blockquote><p>…everyone who believes in the traditional doctrine of creation ex nihilo also makes a non-entity the object of the divine decree. The universe, just like the elect in Rutherford’s ordo decretorum [order of the decrees], is creandum et nondum creatum [to be created but is not created] when God first makes his decree.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ffa6eaa88" data-kw="">
<blockquote><p>…on the matter of election (which he [Vermigli] identifies with predestination), God’s will in eternity is seen to be the exclusive cause. The effect of this election assumes Augustine’s anthropology by viewing all humanity as a massa perditionis [a ruined mass], doomed to eternal condemnation unless God intercedes. Divine election is portrayed positively as the rescue of the doomed sinner, who can do nothing to secure his own deliverance. After being elected from the mass of fallen sinners in eternity past… the elect embrace Christ in time and thus inherit eternal life. … Vermigli’s doctrine is an unequivocal double predestination, but he differs from other Reformers, such as Ulrich Zwingli. The latter advocates a strict symmetrical double predestination, but Vermigli constructs an asymmetrical version of this doctrine. According to Vermigli, God does not deal with the elect in precisely the same way he deals with the non-elect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/infralapsarians.html">Frank A. James</a></span><span class="wk"><span class="lbl">Work:</span> <cite>the translator of Vermigli’s Predestination &amp; Justification in The Peter Martyr Library, vol 8, ‘Translator’s Introduction’</cite>, pp. xxviii-xxix. See the larger surrounding discussion which highlights and explains some seeming supra-strains of thought in Vermigli.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<blockquote><p>2. That the only moving and efficient cause of election and predestination unto life is the mere good pleasure and grace of God, not the consideration of any foreseen faith, perseverance, good works, good will, good endeavors, or any other quality or condition whatsoever in the persons elected. 3. That though sin be the only cause of damnation, yet the sole and primary cause of reprobation or non-election (that is, why God does pass by this man rather than another, why He rejected Esau, when He elected Jacob) is the mere freewill and pleasure of God: not the confideration or foresight of any actual sin, infidelity, or final impenitency in the persons rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of England’s Old Antithesis to New Arminianism</cite>, … (London: Matthewes, 1629), pp. 49-50</span></figcaption>

</figure><figure class="quote" id="q-ed0cd0edfa" data-kw="">
<blockquote><p>Finally, the end [of God’s creating the world] is twofold: The first and highest is the glory of God, Prov. 16:4, Rom. 11:36, 1 Cor. 8:6, Col. 1:16; which consists in the manifestation of His goodness, wisdom, and power (both by God and by the intelligent creature of God). … Then the second, subordinate to the first and tending toward it, is twofold: The first is the utility of the creature, Ps. 104… The last is the eternal salvation of all the elect in heaven, Mt. 25:34 and 22:30, Rom. 9:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>

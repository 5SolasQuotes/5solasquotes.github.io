<main class="wrap"><figure class="quote" id="q-3fdffb58ff" data-kw="seals">
<blockquote><p>The particularity of the covenant of grace appears from various considerations. (1) From its destination because there was no universal purpose and will in God to pity the whole human race, but a particular will to select and appoint unto salvation a certain number from the common corrupt mass (as has been proved in full, Volume I, Topic IV, Question 17). Therefore, as no such covenant was decided upon in the counsel of God, so neither was it made in time. 2. From its procurement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d728e80f6a" data-kw="abraham">
<blockquote><p>The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8). Hence he brings forward the justification of Abraham by faith as an</p></blockquote>

d728e80f6a.html">Permalink</a><a class="src" href="https://drive.google.com/file/d/1YcwwT0MNnEuPwYSOy3Gfw-0tA7Jvm9N8/view?usp=drivesdk" rel="noopener" target="_blank">Read it online · Drive (Nick&#x27;s copy)</a></div>
</figure><figure class="quote" id="q-4ce0cb580a" data-kw="new cov">
<blockquote><p>The new covenant is also taken in a twofold manner either broadly, inasmuch as it stands for the covenant of grace in general made with sinners, which existed under the Old Testament as well before Christ appeared as under the New after he had been manifested; or strictly, for the covenant of grace promulgated after the manifestation of Christ in the flesh, which should continue to the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.5</span></figcaption>

</figure><figure class="quote" id="q-fb228d71e6" data-kw="">
<blockquote><p>That the tender of the gospel to the conversion of sinners, is absolutely free (John 3:14–15; 1:12; Isa. 55:1; John 7:37), no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the law, or preceding ministry of the law, but only and alone the naked soul, as a sinner and ungodly to receive Christ (1 Tim. 1:15; Rom. 4:5; 5:8), as crucified, dead, and buried, and risen again, being made a prince and a Savior for such sinners…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a> › <a href="../topics/the-covenant-of-grace/the-gospel-offer/free-offer.html">Free offer</a></span><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a></span></div>

</figure><figure class="quote" id="q-71eec92229" data-kw="surety">
<blockquote><p>Moreover, here at the outset, we ought to come back to what we before observed—that this covenant of grace (instituted between an offended God and sinful, guilty man) could not have been ratified except by the intervention of a mediator, to reconcile the parties at variance with each other and perform the office of a surety, not only in the name of God (promising that he would fulfill the promises of the covenant, if we would fulfill its conditions—as, following Socinus, Curcellaeus falsely quibbles); but also to God for us—that he will fulfill all those conditions for us, which being performed, the inheritance according to the testament will come to us (most especially as to the fullest satisfaction to be given to divine justice for our sins). Nor does any controversy exist here among the orthodox, but only with the Socinians and their associates (against whom we will argue when we treat of the satisfaction). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.9.2</span></figcaption>

</figure><figure class="quote" id="q-36fc3bfe73" data-kw="">
<blockquote><p>Q. 4. In what time did God create all things? A. God created all things in the space of six days. He could have created all things together in a moment, but he took six days’ time to work in, and rested on the seventh day, that we might the better apprehend the order of the creation, and that we might imitate Him in working but six days of the week, and in resting on the seventh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explicatory Catechism; or, An Explanation of the Assembly’s Shorter Catechism</cite>, (1673; NY: Deare, 1806), Question 9, ‘What is the work of creation?’, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1d83a2433e" data-kw="">
<blockquote><p>The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, ch. 1, verse 10, section 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.”

</figure><figure class="quote" id="q-35ced3f6a9" data-kw="">
<blockquote><p>In his comprehensive series of disputations on creation that were originally held in 1638-1639, Voetius does not omit a discussion on how creation took place. In this context not much attention is given to the issue of the six days as such (although the work of creation is explained in its six days order), but Voetius maintains that creation took place in six days. He therefore rejects the ancient theory that the world was created at once (in instanti).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 3.1 ‘Creation in 6 Days’ in ch. 2, ‘Creation, Mosaic Physics, Copernicanism &amp; Divine Accommodation’ in Reformed Orthodoxy and Philosophy, 1625-1750: Gisbertus Voetius, Petrus Van Mastricht, and Anthonius Driessen Pre (Boston: Brill, 2006), pp. 105-13, p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“In his comprehensive series of disputations on creation that were originally held in 1638-1639, Voetius does not omit a discussion on how creation took place. In this context not much attention is given to the issue of the six days as such (although the work of creation is explained in its six days order), but Voetius maintains that creation took place in six days. He therefore rejects the ancient theory that the world was created at once (in instanti).”

— Aza Goudriaan, 3.1 ‘Creation in 6 Days’ in ch. 2, ‘Creation, Mosaic Physics, Copernicanism &amp; Divine Accommodation’ in Reformed Orthodoxy and Philosophy, 1625-1750: Gisbertus Voetius, Petrus Van Mastricht, and Anthonius Driessen Pre (Boston: Brill, 2006), pp. 105-13, p. 105">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+his+comprehensive+series+of+disputations+on+creation+that+were+originally+held+in+1638-1639%2C+Voetius+does+not+omit+a+discussion+on+how+creation+took+place.+In+this+context+not+much+attention+is+given+to+the+issue+of+the+six+days+as+such+%28although+the+work+of+creation+is+explained+in+its+six+days+order%29%2C+but+Voetius+maintains+that+creation+took+place+in+six+days.+He+therefore+rejects+the+ancient+theory+that+the+world+was+created+at+once+%28in+instanti%29.%E2%80%9D%0A%0A%E2%80%94+Aza+Goudriaan%2C+3.1+%E2%80%98Creation+in+6+Days%E2%80%99+in+ch.+2%2C+%E2%80%98Creation%2C+Mosaic+Physics%2C+Copernicanism+%26+Divine+Accommodation%E2%80%99+in+Reformed+Orthodoxy+and+Philosophy%2C+1625-1750%3A+Gisbertus+Voetius%2C+Petrus+Van+Mastricht%2C+and+Anthonius+Driessen+Pre+%28Boston%3A+Brill%2C+2006%29%2C+pp.+105-13%2C+p.+105&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F35ced3f6a9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/35ced3f6a9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-long-god-took-in-creating/#:~:text=In%20his%20comprehensive%20series%20of%20disputations,was%20created%20at%20once%20%28in%20instanti&amp;text=In%20his%20comprehensive%20series%20of%20disputations%20on%20creation&amp;text=the%20world%20was%20created%20at%20once%20%28in%20instanti" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

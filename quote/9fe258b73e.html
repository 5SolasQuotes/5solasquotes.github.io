<main class="wrap"><figure class="quote" id="q-9fe258b73e" data-kw="">
<blockquote><p>Man, on the other hand, whose nature was to be a mean between the angelic and bestial, [God] created in such sort, that if he remained in subjection to His Creator as his rightful Lord, and piously kept His commandments, he should pass into the company of the angels; and obtain, without the intervention of death, a blessed and endless immortality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The City of God, XII.21 in Nicene &amp; Post-Nicene Fathers, First Series</cite>, ed. by Schafff, Philip, vol. 2 (Peabody, Massachusetts: Hendrickson Publishers, 1999), p. 241</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“Man, on the other hand, whose nature was to be a mean between the angelic and bestial, [God] created in such sort, that if he remained in subjection to His Creator as his rightful Lord, and piously kept His commandments, he should pass into the company of the angels; and obtain, without the intervention of death, a blessed and endless immortality.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86a6f25ed5" data-kw="covenant reward">
<blockquote><p>By his own right, God could indeed have prescribed obedience to man (created by him) without any promise of reward. But in order to temper that supreme dominion with his goodness, he added a covenant consisting in the promise of a reward and the stipulation of obedience. As he wished to assert more strongly his own right over man, so he demonstrated the highest benignity in this—that he (himself in need of nothing) willed to invite to a nearer communion with him the creature already subject to him by right of creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a> › <a href="../topics/the-covenant-of-works/nature-of-the-covenant/covenant-of-nature.html">Covenant of nature</a></span><span class="t"><a href="../topics/the-covenant-of-works/parties-and-headship.html">Parties and Headship</a> › <a href="../topics/the-covenant-of-works/parties-and-headship/god-and-adam.html">God and Adam</a></span></div>

</figure><figure class="quote" id="q-d2b2d7251f" data-kw="covenant of nature works">
<blockquote><p>The covenant of nature is that which God the Creator made with innocent man as his creature, concerning the giving of eternal happiness and life under the condition of perfect and personal obedience. It is called “natural,” not from natural obligation (which God does not have towards man), but because it is founded on the nature of man (as it was at first created by God) and on his integrity or powers. It is also called “legal” because the condition on man’s part was the observation of the law of nature engraved within him; and of “works” because it depended upon works or his proper obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.5</span></figcaption>

</figure><figure class="quote" id="q-ab0c86a4f5" data-kw="">
<blockquote><p>Because power of life and death is by a positive law, presupposing sin and the fall of man; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1d18119d92" data-kw="">
<blockquote><p>First, by His resurrection He has overcome death, that He might make us partakers of the righteousness which He has obtained for us by His death. Secondly, by His power we are also now raised up to a new life. Thirdly, the resurrection of Christ is to us a sure pledge of our blessed resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heidelberg-catechism.html">Heidelberg Catechism</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(1563)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection.html">Resurrection</a></span></div>

— Heidelberg Catechism, (1563)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+by+His+resurrection+He+has+overcome+death%2C+that+He+might+make+us+partakers+of+the+righteousness+which+He+has+obtained+for+us+by+His+death.+Secondly%2C+by+His+power+we+are+also+now+raised+up+to+a+new+life.+Thirdly%2C+the+resurrection+of+Christ+is+to+us+a+sure+pledge+of+our+blessed+resurrection.%E2%80%9D%0A%0A%E2%80%94+Heidelberg+Catechism%2C+%281563%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d18119d92.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d18119d92.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/45-what-benefit-do-we-receive-from-the-resurrection-of-christ/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed34e8b466" data-kw="">
<blockquote><p>Properly speaking, Christ&#x27;s Resurrection is not the meritorious cause, but the efficient and exemplar cause of our resurrection.... And since, as was stated above (Reply to Objection 2), the primary cause of human resurrection is the Divine justice, from which Christ has &quot;the power of passing judgment, because He is the Son of Man&quot; (John 5:27); the efficient power of His Resurrection extends to the good and wicked alike, who are subject to His judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, III, q. 56, a. 1, ad 3</span></figcaption>

</figure><figure class="quote" id="q-071d511bb9" data-kw="">
<blockquote><p>X. While Christ remained on the earth, however, his body was not advanced to that full perfection of glory, which it has possessed ever since its exaltation above the heavens. From condescension to the weakness of the disciples, he suffered it to be somewhat obscured, so as not visibly to shine forth in all its brightness, during the forty days he conversed with them. They must, otherwise, have been incapable of looking stedfastly upon him, and far less able to behold his splendour, than were the Israelites of old, to behold the radiant face of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations on What Is Commonly Called the Apostles’ Creed, trans. Donald Fraser, vol. 2 (London: Khull, Blackie &amp; Co., 1823), 171.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection.html">Resurrection</a></span></div>

</figure><figure class="quote" id="q-08cd10f158" data-kw="">
<blockquote><p>The sovereignty of the Lord Jesus over all creatures, doth plainly foreshew a resurrection of the bad, as well as of the good. Indeed, the unjust shall not arise, by virtue of any relation they stand in to the Lord Jesus, as the saints shall; but yet, because all are delivered into his hand, and he made sovereign Lord over them; therefore by an act of his sovereign power, they that are ungodly, shall arise</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Resurrection of the Dead, and Eternal Judgment</cite>, The Resurrection of the Wicked</span></figcaption>

</figure><figure class="quote" id="q-38afa42374" data-kw="">
<blockquote><p>…Aquinas’s conception of the resurrection… holds that the soul of a person persists between death and resurrection, so that there is continuity between the person who died and the later person whose body is indistinguishable from that of the person who died. If Socrates is ressurected, he will be Socrates and not a mere replica because the same one soul, which had informed the matter of Socrates’ body before he died, comes to inform that matter again… Another thing philoophy can tell us is that if a resurrection were to occur, only God could bring it about. That, in any event, was Aquinas’s view (Cf. Summa Theologiae, Supplement, 75.3). Natural material causes can no more reunite soul and body than they could generate a soul in the first place. Nor could even an angelic intellect reunite a soul and its body, since angels can only manipulate natural causes, even if they can do so more powerfully than we can (Cf. Summa Theologiae I.65.3-4 and I.105.1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 519-21 of Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 11</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a></span></div>

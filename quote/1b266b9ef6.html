<main class="wrap"><figure class="quote" id="q-1b266b9ef6" data-kw="">
<blockquote><p>9. Third, out of this union depends the conjunction or collation of the operations, since one nature with the other is conjoined, its energies, that is, actions, [work] to one effect, or work of redemption: by the deity working those things which are required of immensity, humanity things human, which is a proper instrument for the deity, it subserving it and with the deity it works things henomenos ou dieremenos, that is ‘unitedly, not separately’. Thus it is called theandrikon apotelesma, so Damascus, bk. 3, ch. 19 terms it, ‘a theandric energy’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-martinius.html">Matthew Martinius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 11-12, sections 9-10 in A Brief Confession on the Person of Christ… (Herborne, 1604)</span></figcaption>

</figure><figure class="quote" id="q-9541e39dd5" data-kw="">
<blockquote><p>The ancients† insist much upon that proof John 16:15, ‘All things that the Father hath are mine’, compared with John 10:30, ‘I and my Father are one’, and John 10:37, ‘If I do not the works of my Father, believe me not; for from hence they do conclude, that Christ has the same divine nature and Godhead with the Father; they both have the same divine and essential titles and attributes, and perform the same inward operations in reference to all creatures whatsoever; † Epiphanius, contra Apostolicos, see Cyril in John, ch. 3 &amp; 8; Jerome on Zech. 2; Ambrose, bk. 5, Of Faith, ch. 4; Augustine, contra Pascen tium: ‘nemo igitur jam calumnia turde verbo; et si enim verbum ipsum in Lege scriptum non reperitur, res tamen reperitur, ego et Pater unum sumus’, Epistle 174. and therefore they did farther infer that they had reason to use the word ‘Consubstantial’ [one substance]; for though the word is not in Scripture, yet the sense and meaning of it is orthodox and canonical, because evidently deduced from these texts and some other Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite>, … (London, 1650), ch. 4, p. 26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

— Francis Cheynell, The Divine Trinunity… (London, 1650), ch. 4, p. 26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+ancients%E2%80%A0+insist+much+upon+that+proof+John+16%3A15%2C+%E2%80%98All+things+that+the+Father+hath+are+mine%E2%80%99%2C+compared+with+John+10%3A30%2C+%E2%80%98I+and+my+Father+are+one%E2%80%99%2C+and+John+10%3A37%2C+%E2%80%98If+I+do+not+the+works+of+my+Father%2C+believe+me+not%3B+for+from+hence+they+do+conclude%2C+that+Christ+has+the+same+divine+nature+and+Godhead+with+the+Father%3B+they+both+have+the+same+divine+and+essential+titles+and+attributes%2C+and+perform+the+same+inward+operations+in+reference+to+all+creatures+whatsoever%3B+%E2%80%A0+Epiphanius%2C+contra+Apostolicos%2C+see+Cyril+in+John%2C+ch.+3+%26+8%3B+Jerome+on+Zech.+2%3B+Ambrose%2C+bk.+5%2C+Of+Faith%2C+ch.+4%3B+Augustine%2C+contra+Pascen+tium%3A+%E2%80%98nemo+igitur+jam+calumnia+turde+verbo%3B+et+si+enim+verbum+ipsum+in+Lege+scriptum+non+reperitur%2C+res+tamen+reperitur%2C+ego+et+Pater+unum+sumus%E2%80%99%2C+Epistle+174.+and+therefore+they+did+farther+infer+that+they+had+reason+to+use+the+word+%E2%80%98Consubstantial%E2%80%99+%5Bone+substance%5D%3B+for+though+the+word+is+not+in+Scripture%2C+yet+the+sense+and+meaning+of+it+is+orthodox+and+canonical%2C+because+evidently+deduced+from+these+texts+and+some+other+Scriptures.%E2%80%9D%0A%0A%E2%80%94+Francis+Cheynell%2C+The+Divine+Trinunity%E2%80%A6+%28London%2C+1650%29%2C+ch.+4%2C+p.+26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9541e39dd5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9541e39dd5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-two-operations-energies-of-the-mediator-divine-human-unto-the-same-effect-apotelesma/#:~:text=The%20ancients%E2%80%A0%20insist%20much%20upon%20that,these%20texts%20and%20some%20other%20Scriptures&amp;text=The%20ancients%E2%80%A0%20insist%20much%20upon%20that%20proof%20John&amp;text=deduced%20from%20these%20texts%20and%20some%20other%20Scriptures" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9a1fd841cf" data-kw="">
<blockquote><p>None of us teaches that the man Christ should not be worshiped, but we deny only that the humanity should be worshiped. For the man is one thing and the humanity is another. The man Christ is to be worship[ped] since he is God. But the humanity, that is, the flesh of Christ, is not God. Therefore it is not also an object of worship, even though it has been personally united to the Word [logos]. We worship the whole Christ, but not the Whole of Christ, that is, the humamty with the Deity. We will explain this with an analogy. I worship a king or prince clothed in purple, crowned, holding a scepter in his right hand. In that worship I do not pay heed to the crown which he wears on his head or to the purple with which he is dressed or to the scepter which he holds in his hand. Nevertheless I do not separate the crown, the purple or the scepter from the king. So also in the religious adoration of Christ, we direct our invocation to the Son of God, that is, to his divinity, as to the sole, proper object of religious adoration, and not to his humanity. Nevertheless we do not separate the humanity from the deity of the Son of God. For we distinguish the natures and their properties; we do not separate them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586</cite>, ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), p. 403</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-59a3bd9ca4" data-kw="">
<blockquote><p>It is one thing to worship a man, and another to worship the humanity… You will worship the Lord your God, and serve Him only. Flesh, that is, the humanity of Christ, is not the Lord God. Therefore it ought not be worshipped… But John does not say [in ch. 1], The flesh became Word, but rather he says, The Word became flesh… Flesh is not God. Therefore it is not to be worshipped… I reject this proposition: Flesh should be worshipped, for the same reason I reject this proposition: Flesh is God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586</cite>, ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), pp. 420-23</span></figcaption>

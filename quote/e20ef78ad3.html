<blockquote><p>He [Owen] intimates that it is not in our power to close with some and not withal. This is his first error. Though man give us no such power, God does: as it is in my power to believe all that one speaks truly and well, and not that which he speaks amiss. I am not bound to own all that any preacher or priest shall say in the church. God put it in the disciples’ power to beware of the leaven of the Pharisees [Mt. 16:6], and yet to hear them [Mt. 23:1-3]. Proving all things [1 Thess. 5:21] is not approving all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 25</span></figcaption>

<blockquote><p>Distinction 2. If the sins be against the worship of God, as idolatry, or sins of a wicked conversation, the worship of God remaining pure and sound, at least in professed fundamentals. 3. If the idolatry be essential idolatry, as the adoring of the work of men’s hands, or only idolatry by participation, as Popish ceremonies, the surplice and cross, being as means of worship, but not adored, and so being idols by participation, as [William] Ames and Mr. [John] Ball do well distinguish (Fresh Suit Against Ceremonies [pt. 2, ch. 2, sect. 10-14, p. 207, says 107]; Answer to Mr. Cann, pt. 2, p. 23), and before them, so does the learned [John] Reynolds (De [romanae ecclesiae] idololatria, bk. 2, ch. 2) and [Thomas] Bilson (of Chri. Ar. Subject., part 4, pp. 321-22) make use of the distinction. …

5. Diverse degrees of separation are to be considered: hence these considerations: … 2. If the whole and most part of the Church turn idolatrous and worship idols (which is essential idolatry), we are to separate from that Church: the Levites and the two tribes did well, as Mr. Ball says, to make a separation from Jeroboam’s calves; and the godly, laudably, 2 Kings 16:11, did not separate from the Israel and Church of God because the altar of Damascus was set up, and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34 [vv. 14, 28], idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10 [v. 21]. Paul does not command separation from the Church of Corinth and the Table of the Lord there. … 5th Consideration. I see not but we may¹ separate from the Lord’s Supper where bread is adored and from baptism where the sign of the Cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the Word, and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church. ¹ [Note that Rutherford says we “may”, and not that it is a necessity. As Samuel Bolton says on this page, one might be physially forced to attend the mass, yet this is without guilt. Baxter, also on this page, argues that one may submit to one’s baby being baptized with the sign of the cross in certain necessary conditions.]

6. We may well hold that [Pseudo?] Ambrose says well that a Church wanting the foundation of the apostles, is to be forsaken (Commentary on Luke, bk. 6, ch. 1 [This work is not in Patrologia Latina vols. 14-17 and may not be rightly attributed, yet see this reference for it]). …

8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews though they rejected Christ, till they openly blasphemed, Acts 13:44-46; Acts 18:6. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean; from henceforth I will go to the Gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews who denied the Messiah and persecuted his servants, Acts 4; Acts 5, seeing there was a cleaner Church to which converts might join themselves, Acts 2:40-42.

9. There is no just cause to leave a less clean Church (if it be a true Church) and to go to a purer and cleaner, though one who is a member of no Church have liberty of election to join to that Church which he conceives to be purest and cleanest.</p></blockquote>

<blockquote><p>10. Therefore our bare presence is no signification that we approve all that is done in that assembly. The very nature of Christian communion is a profession of the contrary: we being bound by God to communicate in good and not to own the evil. And if men command us to own all that they there do, their command cannot bind us against God’s, nor make our presence a profession that we obey them against God: it being God that is the Master of us and our work, and Christianity itself being a profession that we obey God before man. Else man by commanding us to own some ill word or circumstance might drive us from all Christian communion. If men should command us in our private meetings to do it for an ill end or an ill principle (as in obedience to usurpers [such as Oliver Cromwell in the 1650’s]) we must not therefore forbear all private meetings, nor will our bare meeting signify our obedience to such commands. If the pastor of a single church (or many associated) tell the people, ‘Your meeting must be to own e.g. Anabaptistry, Antinomianism, Presbytery, Erastianism, Separation, etc.’ this binds them not either to own it or to withdraw without some greater reason. He is no master of their faith.

11. Nor will the bare knowing beforehand that the pastor will say or do somewhat unlawful[ly] make our presence guilty of approving it. We know beforehand that we and all men are sinners, and shall sin in what we do: And we may suppose men will speak as they think: And as we know not but any man may speak amiss till we hear what he says, so when we know that the pastors have tolerable errors, and will vent them, it will not make us guilty of their sin, nor bind us to depart: We meet to own Christianity and not all that the man will say or do (known or unknown). I know before that I shall have many faults in my own prayer (disorder, dullness, etc.) which I do not own, though herein I am guilty.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“10. Therefore our bare presence is no signification that we approve all that is done in that assembly. The very nature of Christian communion is a profession of the contrary: we being bound by God to communicate in good and not to own the evil. And if men command us to own all that they there do, their command cannot bind us against God’s, nor make our presence a profession that we obey them against God: it being God that is the Master of us and our work, and Christianity itself being a profession that we obey God before man. Else man by commanding us to own some ill word or circumstance might drive us from all Christian communion. If men should command us in our private meetings to do it for an ill end or an ill principle (as in obedience to usurpers [such as Oliver Cromwell in the 1650’s]) we must not therefore forbear all private meetings, nor will our bare meeting signify our obedience to such commands. If the pastor of a single church (or many associated) tell the people, ‘Your meeting must be to own e.g. Anabaptistry, Antinomianism, Presbytery, Erastianism, Separation, etc.’ this binds them not either to own it or to withdraw without some greater reason. He is no master of their faith.

— Richard Baxter, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Bare Presence does not Imply Complete Approval">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C10.+Therefore+our+bare+presence+is+no+signification+that+we+approve+all+that+is+done+in+that+assembly.+The+very+nature+of+Christian+communion+is+a+profession+of+the+contrary%3A+we+being+bound+by+God+to+communicate+in+good+and+not+to+own+the+evil.+And+if+men+command+us+to+own+all+that+they+there+do%2C+their+command+cannot+bind+us+against+God%E2%80%99s%2C+nor+make+our+presence+a+profession+that+we+obey+them+against+God%3A+it+being+God+that+is+the+Master+of+us+and+our+work%2C+and+Christianity+itself+being+a+profession+that+we+obey+God+before+man.+Else+man+by+commanding+us+to+own+some+ill+word+or+circumstance+might+drive+us+from+all+Christian+communion.+If+men+should+command+us+in+our+private+meetings+to+do+it+for+an+ill+end+or+an+ill+principle+%28as+in+obedience+to+usurpers+%5Bsuch+as+Oliver+Cromwell+in+the+1650%E2%80%99s%5D%29+we+must+not+therefore+forbear+all+private+meetings%2C+nor+will+our+bare+meeting+signify+our+obedience+to+such+commands.+If+the+pastor+of+a+single+church+%28or+many+associated%29+tell+the+people%2C+%E2%80%98Your+meeting+must+be+to+own+e.g.+Anabaptistry%2C+Antinomianism%2C+Presbytery%2C+Erastianism%2C+Separation%2C+etc.%E2%80%99+this+binds+them+not+either+to+own+it+or+to+withdraw+without+some+greater+reason.+He+is+no+master+of+their+faith.+11.+Nor+will+the+bare+knowing+beforehand+that+the+pastor+will+say+or+do+somewhat+unlawful%5Bly%5D+make+our+presence+guilty+of+approving+it.+We+know+beforehand+that+we+and+all+men+are+sinners%2C+and+shall+sin+in+what+we+do%3A+And+we+may+suppose+men+will+speak+as+they+think%3A+And+as+we+know+not+but+any+man+may+speak+amiss+till+we+hear+what+he+says%2C+so+when+we+know+that+the+pastors+have+tolerable+errors%2C+and+will+vent+them%2C+it+will+not+make+us+guilty+of+their+sin%2C+nor+bind+us+to+depart%3A+We+meet+to+own+Christianity+and+not+all+that+the+man+will+say+or+do+%28known+or+unknown%29.+I+know+before+that+I+shall+have+many+faults+in+my+own+prayer+%28disorder%2C+dullness%2C+etc.%29+which+I+do+not+own%2C+though+herein+I+am+guilty.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Communion+Doubly+Defended+by+Dr.+Owen%E2%80%99s+Vindicator+%26+Richard+Baxter%2C+Detailed+%7C+Catholic+Communion+Doubly+Defended+by+Dr.+Owen%E2%80%99s+Vindicator+%26+Richard+Baxter%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29%2C+section+2%2C+pp.+9-14+%7C+Bare+Presence+does+not+Imply+Complete+Approval&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F517e935f34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/517e935f34.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=10.%20Therefore%20our%20bare%20presence%20is,own%2C%20though%20herein%20I%20am%20guilty&amp;text=10.%20Therefore%20our%20bare%20presence%20is%20no%20signification&amp;text=do%20not%20own%2C%20though%20herein%20I%20am%20guilty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cbced76d48" data-kw="">
<blockquote><p>11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship.

12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.</p></blockquote>

<blockquote><p>In a word, God has bound all his ministers to use all their gifts to the churches’ greatest edification: But to use a more defective form, with liberty to use my best gifts also, and to exercise my ministry publicly to all, is more to the churches’ edification than to use my own gifts only a few days in a corner and then to lie in prison and use them no more. Though no man must of choice prefer the less congruous before the more congruous, when he is free (which I confess is a sin), yet it is a duty to prefer a less congruous order before none, or before a better for a day with a restraint of that and all our ministry hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 32, p. 186</span></figcaption>

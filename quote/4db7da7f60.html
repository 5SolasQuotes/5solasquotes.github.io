<main class="wrap"><figure class="quote" id="q-4db7da7f60" data-kw="">
<blockquote><p>Ma. Is this Church which thou speakest of, a visible or invisible Church?

Sch. Here in the Creed is properly entreated of the congregation of those, whom God by his secret election hath adopted to himself through Christ: which Church can neither be seen with eyes, nor can continually be known by signs. Yet there is a Church of God visible, or that may be seen, the tokens and marks whereof he doth show and open unto us.

Ma. What be those tokens?

Sch. Wheresoever the Gospel of Christ our Saviour is sincerely taught, God by prayer truly called upon in the name of Christ, the holy Sacraments are rightly administered, the discipline duly used, there the company of Christian men and women assembled, is a visible Church of Christ.

Ma. Are not then all they that be in this visible Church, of the number of the elect to everlasting life?

Sch. Many by hypocrisy and counterfeiting of godliness, do join themselves to this fellowship which are nothing less than true members of the Church. But for as much as wheresoever the word of God is sincerely taught, and his Sacraments rightly ministered, there are ever some appointed to salvation by Christ : we count all the whole company to be the Church of God, seeing also that Christ promiseth, that himself will be present with two or three that he gathered together in his Name.

Ma. Why dost thou after the Church make mention also of the forgiveness of sins?

Sch. First, because the keys wherewith Heaven is to be opened &amp; shut, that is, the power of binding and loosing, of reserving and forgiving of sins, which standeth in the ministry of the Word of God, is by Christ given and committed to the Church, and properly belongeth unto the Church. Secondarily, because no man obtaineth forgiveness of sins, that is not a true member of the Church which is the body of Christ : that is, such a one as doth not earnestly, godlily, holily, yea and continually, and to the end embrace and maintain the common fellowship of the Church.

Ma. Is there then no hope of Salvation out of the Church?

Sch. Out of it can be nothing but damnation, death, and destruction. For what hope of life can remain in the members when they are pluckt asunder, and cut off from the head and body?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>

<blockquote><p>Objection: But is not this an approven distinction, that persons are within the Covenant, either externally, professedly, visibly, or internally, really, or according to the intention of God? Therefore, such as are externally within the Covenant, are not really and indeed within the Covenant of Grace. Answer: The adverb really relates to the real fruit of the fulfilled covenant, and so such as are only externally within the covenant are not really within the covenant, for God never directed, nor intended to bestow the blessing covenanted, nor grace to perform the condition of the covenant upon them. But they are really covenanted and engaged by their consented profession to fulfill the covenant. And as the commands and threatenings of the covenant of grace lay on a real obligation upon such as are only externally in covenant, either to obey or suffer, so the promise of the covenant imposes an engagement and obligation upon such to believe the promise; but sometimes we say the promises of the covenant of grace are not really made to the reprobate within the visible church, because God intends and decrees to, and for them, neither the blessing promised, nor the saving grace to fulfill the condition or to believe.</p></blockquote>

<blockquote><p>XXI. Let us now lastly consider the threatenings, whether there be any such in this covenant. It cannot indeed be denied, but that, in the doctrine of Christ and the apostles, we frequently meet with very many comminations, which have their peculiar respect to the covenant of grace, and which could not have thus been set before us if there had been no such covenant. For instance,—whoever shall not believe in Christ—whoever shall despise the counsel of God against his own soul—whoever shall not obey the Gospel, shall be condemned. And these threatenings seem to be distinguished from those which are evidently legal; such as the following: “Cursed is he that continueth not in all things,” &amp;c. Yet, if we would weigh the matter narrowly, the covenant of grace has no threatenings so peculiar to itself, but what may well be referred to the law, from which every curse proceeds. XXII. Which I would explain thus: we no where hear of any threatenings which may and ought not to be deduced from that threatening, which doubtless is purely legal, “Cursed is every one that continueth not in all things,” &amp;c. In this most general threatening are included the other more particular ones. Moreover, when salvation by Christ alone is proposed, in the covenant of grace, as the principal truth, the law, which enjoins man to embrace with a firm faith every truth made known to him by God, obliges him to receive this truth in particular, and be delighted with the glory of God shining forth in it, and that his own salvation is connected with the glory of God. Should we deny that the law lays us under this obligation, we should then affirm that the law does not enjoin us to acknowledge God as true, and that there is a holy love of God and of ourselves which the law does not command; all which are most absurd. I go further: When man, as the law prescribes, receives the truth of the Gospel with a lively faith, then not the law, but the Gospel, promises salvation to him. For the law knows of no other promise, than what depends on the condition of perfect obedience. But should man slight and obstinately reject that truth proposed to him, he sins against the law, and so incurs its curse, according to the general rule so often inculcated. And since we have supposed the Gospel declaring that salvation flows from the faith of Christ alone, the law enjoins that all who desire salvation should seek it by the faith of Christ alone; and consequently it cannot but thunder the curse against those who, rejecting the Gospel, believe not on Christ. As, therefore, unbelief, or the rejecting the Gospel, is a sin against the law, which is the only perfect rule of all virtue (it can be called a sin against the Gospel, only objectively), so every threatening of the curse and of wrath against unbelievers and the despisers of the Gospel, must come from and be reduced to the law; but then it is to the law as now subservient to the covenant of grace. XXIII. In the discourses of the Prophets, Christ, and his apostles, there is a certain mixture of various doctrines, which, indeed, are closely connected, and mutually subservient; each of which ought to be reduced to their proper heads, so that the promises of grace be referred to the Gospel, all injunctions of duty and all threatenings against transgressors to the law.</p></blockquote>

— Herman Witsius, The Economy of the Covenants between God and Man, trans. William Crookshank, 2 vols. (London: Tegg &amp; Son, 1837), vol. 1, pp. 252–58; italics original. See also Herman Witsius, The Economy of the Covenants Between God &amp; Man, 2 vols. (1822; RHB, 2017), vol. 1, pp. 284–91">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXI.+Let+us+now+lastly+consider+the+threatenings%2C+whether+there+be+any+such+in+this+covenant.+It+cannot+indeed+be+denied%2C+but+that%2C+in+the+doctrine+of+Christ+and+the+apostles%2C+we+frequently+meet+with+very+many+comminations%2C+which+have+their+peculiar+respect+to+the+covenant+of+grace%2C+and+which+could+not+have+thus+been+set+before+us+if+there+had+been+no+such+covenant.+For+instance%2C%E2%80%94whoever+shall+not+believe+in+Christ%E2%80%94whoever+shall+despise+the+counsel+of+God+against+his+own+soul%E2%80%94whoever+shall+not+obey+the+Gospel%2C+shall+be+condemned.+And+these+threatenings+seem+to+be+distinguished+from+those+which+are+evidently+legal%3B+such+as+the+following%3A+%E2%80%9CCursed+is+he+that+continueth+not+in+all+things%2C%E2%80%9D+%26c.+Yet%2C+if+we+would+weigh+the+matter+narrowly%2C+the+covenant+of+grace+has+no+threatenings+so+peculiar+to+itself%2C+but+what+may+well+be+referred+to+the+law%2C+from+which+every+curse+proceeds.+XXII.+Which+I+would+explain+thus%3A+we+no+where+hear+of+any+threatenings+which+may+and+ought+not+to+be+deduced+from+that+threatening%2C+which+doubtless+is+purely+legal%2C+%E2%80%9CCursed+is+every+one+that+continueth+not+in+all+things%2C%E2%80%9D+%26c.+In+this+most+general+threatening+are+included+the+other+more+particular+ones.+Moreover%2C+when+salvation+by+Christ+alone+is+proposed%2C+in+the+covenant+of+grace%2C+as+the+principal+truth%2C+the+law%2C+which+enjoins+man+to+embrace+with+a+firm+faith+every+truth+made+known+to+him+by+God%2C+obliges+him+to+receive+this+truth+in+particular%2C+and+be+delighted+with+the+glory+of+God+shining+forth+in+it%2C+and+that+his+own+salvation+is+connected+with+the+glory+of+God.+Should+we+deny+that+the+law+lays+us+under+this+obligation%2C+we+should+then+affirm+that+the+law+does+not+enjoin+us+to+acknowledge+God+as+true%2C+and+that+there+is+a+holy+love+of+God+and+of+ourselves+which+the+law+does+not+command%3B+all+which+are+most+absurd.+I+go+further%3A+When+man%2C+as+the+law+prescribes%2C+receives+the+truth+of+the+Gospel+with+a+lively+faith%2C+then+not+the+law%2C+but+the+Gospel%2C+promises+salvation+to+him.+For+the+law+knows+of+no+other+promise%2C+than+what+depends+on+the+condition+of+perfect+obedience.+But+should+man+slight+and+obstinately+reject+that+truth+proposed+to+him%2C+he+sins+against+the+law%2C+and+so+incurs+its+curse%2C+according+to+the+general+rule+so+often+inculcated.+And+since+we+have+supposed+the+Gospel+declaring+that+salvation+flows+from+the+faith+of+Christ+alone%2C+the+law+enjoins+that+all+who+desire+salvation+should+seek+it+by+the+faith+of+Christ+alone%3B+and+consequently+it+cannot+but+thunder+the+curse+against+those+who%2C+rejecting+the+Gospel%2C+believe+not+on+Christ.+As%2C+therefore%2C+unbelief%2C+or+the+rejecting+the+Gospel%2C+is+a+sin+against+the+law%2C+which+is+the+only+perfect+rule+of+all+virtue+%28it+can+be+called+a+sin+against+the+Gospel%2C+only+objectively%29%2C+so+every+threatening+of+the+curse+and+of+wrath+against+unbelievers+and+the+despisers+of+the+Gospel%2C+must+come+from+and+be+reduced+to+the+law%3B+but+then+it+is+to+the+law+as+now+subservient+to+the+covenant+of+grace.+XXIII.+In+the+discourses+of+the+Prophets%2C+Christ%2C+and+his+apostles%2C+there+is+a+certain+mixture+of+various+doctrines%2C+which%2C+indeed%2C+are+closely+connected%2C+and+mutually+subservient%3B+each+of+which+ought+to+be+reduced+to+their+proper+heads%2C+so+that+the+promises+of+grace+be+referred+to+the+Gospel%2C+all+injunctions+of+duty+and+all+threatenings+against+transgressors+to+the+law.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%2C+trans.+William+Crookshank%2C+2+vols.+%28London%3A+Tegg+%26+Son%2C+1837%29%2C+vol.+1%2C+pp.+252%E2%80%9358%3B+italics+original.+See+also+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+%26+Man%2C+2+vols.+%281822%3B+RHB%2C+2017%29%2C+vol.+1%2C+pp.+284%E2%80%9391&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F589dc34cd3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/589dc34cd3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-covenant-of-grace-is-with-the-visible-church/#:~:text=XXI.%20Let%20us%20now%20lastly%20consider,threatenings%20against%20transgressors%20to%20the%20law&amp;text=XXI.%20Let%20us%20now%20lastly%20consider%20the%20threatenings&amp;text=and%20all%20threatenings%20against%20transgressors%20to%20the%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Then the visible church was not betrothed to Christ as a chaste Virgin: contrary to this our Brethren alleged, 1 Cor. 11. 1 2, 3. 3. Not only is conversion professedly true in the judgment of charity, but also in the judgement of verity, essential to a visible church as you teach; and so none can be a member of the visible church, but he who is a member of the invisible Church, which is Anabaptism. 4. Three thousand in one day were added to the visible church, who could not (as I have proved) all be approved to the conscience one of another, as true converts, Acts 2. Since amongst them were Ananias and Saphira, and the time was short.

5. If we are to bear one another’s burdens, and so fulfil the Law of Christ, and if grace may be beside many and great sins, as we see in Asa, in Salomon who remained the children of God, under many out breakings, if the children of God may be the children of God, and yet some of them habitually proud, passionate, some of them worldly minded, some talkative and imprudently rash in zeal, some lustful, some slothful, some ambitious, yea and if Simon Magus his profession, though false, was esteemed sufficient, for to give him baptism, the Seal of the covenant, Acts 8. 9. Then it is not required that all the members of the visible church be such as positively we know (so far as human knowledge can reach) that they are converted, yea if this were true, then special commandments would be given, that as we are to examine and try our selves, 1 Cor. 11. 28. 2 Cor. 13. 5. And to try officers before they be admitted, 1 Tim. 3. 10. 1 Tim. 5 22. and to try the spirits of Prophets and their Doctrine, 1 John 4. 1. and, 1 Thess. 5. 21. Acts 17. 13. So would God in his Word give a charge, that we try, examine and judge carefully one another, and that every man labour to be satisfied in conscience anent the regeneration one of another. But such commandments we read not of.

6. If many be brought and called into the visible church, of purpose both on Gods revealed intention in his Word to convert them, and on the churches part that they may be converted; Then doth not the church consist of these who are professedly converted, but the former is true; Ergo, so is the latter.

The proposition is sure, these whom God purposeth to convert by making them Church-members, they are not Church-members because they are already converted. I prove the assumption, because. 1. The contrary doctrine, to wit, that none are under a pastor’s care till they be first converted, maketh to the eversion of the public Ministry, and gratifieth Arminians and Socinians, as before I observed, because Faith cometh not by hearing of sent pastors, as God’s ordinance is, Rom. 10. 14. but by the contrary, we ask a warrant from the Testament of Christ, that now since the Apostles are not in the Earth, private men not sent to preach, should be ordinary Fishers of men, and gatherers of Christ’s church and Kingdom.

2. That Christ hath provided no Pastors nor Teachers to watch over the Elect, yet remaining in the Kingdom of darkness, and that Christ ascending on high, as a victorious King hath not given Pastors and Teachers by office to bring in his redeemed flock, which he hath bought with his blood, Acts 20. 28. 3. It is against the nature of the visible Kingdom of Christ which is a drawnet and an officina, a workhouse of external calling into Christ, even such as are serving their honour, buying a Farm; and their gain, buying five yoke of Oxen; and their lusts, having married a Wife. Luk. 14. 16, 17 18. 4. It is against the nature of the Ministry, and Wisdoms maids, sent out to compel them to come in. Luke 14. 23. Matthew 22. 4, 5, 6. Prov. 9. 2, 3, 4, 5. who are yet without.</p></blockquote>

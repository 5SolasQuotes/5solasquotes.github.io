<main class="wrap"><figure class="quote" id="q-60278f979b" data-kw="">
<blockquote><p>The papers on the other side blame Mr. Hamilton and his party as discouraging the men, and doing nothing but clamouring against those who were sent to the duke, and such as were for an accommodation; they allege, Mr. Hamilton, and these who were warmest, were soonest out of the field… but [the covenanters] were never able to make their horses face the cannon; and, in the wheeling, or taking up their ground, they fell foul upon some of their own men formed near them, and put them in some disorder: and those nearest them, seeing this, took it to be a flight, and the whole army fell into confusion, and fled; and one who was present there writes to me, Mr Hamilton was among the foremost, “leaving the world to debate whether he acted most like a traitor, coward, or fool.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 107</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-a3500b3359" data-kw="">
<blockquote><p>We offer and we perform all obedience which God has commanded, and we deny neither toll, tribute nor fear to her nor officers: We only bridle her blind rage, in which she would erect and maintain idolatry, and would murder our brethren who refuse the same. Neither yet fear we in this present day, that against us she makes a malicious lie, where that she says that it is not religion we go about, but a plain usurpation of authority: God forbid that such impiety should enter into our hearts, that we should make his holy religion a cloak and cover of our iniquity. From the beginning of this controversy ’tis evidently known what have been our requests, which, if the rest of the nobility and commonality of Scotland will cause to be performed unto us, if then in us appear any sign of rebellion, let us be reputed and punished as traitors, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

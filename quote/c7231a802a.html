</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ef0f1ec65" data-kw="">
<blockquote><p>201. There is in the very essence of the natural power or faculty, besides the vis vel virtus agendi, a certain natural inclination to some things, which is inseparable from it, from which the schoolmen say even of the will that it is quaedam natura, et pondus animae. So the soul is inclined or propense (and not only able) to activity as such, to intellection as such, to volition as such; and objectively to truth as such, and to natural good and felicity as such. And there is an inclination of the soul, which is not essential and inseparable, but is much under the power of the will, and may be got and lost.

202. This adventitious disposition is found in the soul in various degrees: 1. When it is in such a degree only, as that immediately and properly without any other power added, the will may be said to be able to act thus or thus, then it is called a moral power: [2.] But when it is in such a degree as that we are disposed to act promptly and easily, it is called a habit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), sect. 10, ‘Of Natural &amp; Moral Power as Foreseen’; pp. 36-37</span></figcaption>

<blockquote><p>Righteousness, which is commonly called ‘Original’, is part of this image, and consists in that rectitude of human nature by which the affections obeyed the will, the will obeyed reason, and reason obeyed God. Since this was implanted in the first man in creation itself, Gen. 1:26-27, 31; 2:25; Eph. 4:24, it is rightly called ‘natural’. Through this man had free will unto good, but mutably. For when God did not preserve him, he could by a fallacious appearance of the object defect unto evil, as the event taught a little later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God.</p></blockquote>

</figure><figure class="quote" id="q-8a312a8286" data-kw="">
<blockquote><p>Some infer from this passage that men were content with herbs and fruits until the deluge, and that it was even unlawful for them to eat flesh. And this seems the more probable, because God confines, in some way, the food of mankind within certain limits. Then after the deluge [Gen. 9], He expressly grants them the use of flesh. These reasons, however are not sufficiently strong: for it may be adduced on the opposite side, that the first men offered sacrifices from their flocks [Gen. 4]. This, moreover, is the law of sacrificing rightly, not to offer unto God anything except what He has granted to our use. Lastly men were clothed in skins [Gen. 3:21]; therefore it was lawful for them to kill animals. For these reasons, I think it will be better for us to assert nothing concerning this matter. Let it suffice for us, that herbs and the fruits of trees were given them as their common food; yet it is not to be doubted that this was abundantly sufficient for their highest gratification. For they judge prudently who maintain that the earth was so marred by the deluge, that we retain scarcely a moderate portion of the original benediction. Even immediately after the fall of man, it had already begun to bring forth degenerate and noxious fruits, but at the deluge, the change became still greater. Yet, however this may be, God certainly did not intend that man should be slenderly and sparingly sustained; but rather, by these words, He promises a liberal abundance, which should leave nothing wanting to a sweet and pleasant life. For Moses relates how beneficent the Lord had been to them, in bestowing on them all things which they could desire, that their ingratitude might have the less excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1, verse 28</span></figcaption>

— John Calvin, Commentary on Gen. 1, verse 28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSome+infer+from+this+passage+that+men+were+content+with+herbs+and+fruits+until+the+deluge%2C+and+that+it+was+even+unlawful+for+them+to+eat+flesh.+And+this+seems+the+more+probable%2C+because+God+confines%2C+in+some+way%2C+the+food+of+mankind+within+certain+limits.+Then+after+the+deluge+%5BGen.+9%5D%2C+He+expressly+grants+them+the+use+of+flesh.+These+reasons%2C+however+are+not+sufficiently+strong%3A+for+it+may+be+adduced+on+the+opposite+side%2C+that+the+first+men+offered+sacrifices+from+their+flocks+%5BGen.+4%5D.+This%2C+moreover%2C+is+the+law+of+sacrificing+rightly%2C+not+to+offer+unto+God+anything+except+what+He+has+granted+to+our+use.+Lastly+men+were+clothed+in+skins+%5BGen.+3%3A21%5D%3B+therefore+it+was+lawful+for+them+to+kill+animals.+For+these+reasons%2C+I+think+it+will+be+better+for+us+to+assert+nothing+concerning+this+matter.+Let+it+suffice+for+us%2C+that+herbs+and+the+fruits+of+trees+were+given+them+as+their+common+food%3B+yet+it+is+not+to+be+doubted+that+this+was+abundantly+sufficient+for+their+highest+gratification.+For+they+judge+prudently+who+maintain+that+the+earth+was+so+marred+by+the+deluge%2C+that+we+retain+scarcely+a+moderate+portion+of+the+original+benediction.+Even+immediately+after+the+fall+of+man%2C+it+had+already+begun+to+bring+forth+degenerate+and+noxious+fruits%2C+but+at+the+deluge%2C+the+change+became+still+greater.+Yet%2C+however+this+may+be%2C+God+certainly+did+not+intend+that+man+should+be+slenderly+and+sparingly+sustained%3B+but+rather%2C+by+these+words%2C+He+promises+a+liberal+abundance%2C+which+should+leave+nothing+wanting+to+a+sweet+and+pleasant+life.+For+Moses+relates+how+beneficent+the+Lord+had+been+to+them%2C+in+bestowing+on+them+all+things+which+they+could+desire%2C+that+their+ingratitude+might+have+the+less+excuse.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Gen.+1%2C+verse+28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a312a8286.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a312a8286.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=Some%20infer%20from%20this%20passage%20that,ingratitude%20might%20have%20the%20less%20excuse&amp;text=Some%20infer%20from%20this%20passage%20that%20men%20were&amp;text=that%20their%20ingratitude%20might%20have%20the%20less%20excuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

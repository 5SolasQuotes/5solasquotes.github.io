<blockquote><p>[19] Q. What is the outward theological calling? An. It is medium ad salitem [a means to salt], as the word and sacraments and the members of the visible church belong unto it. [20] Q. What is that inward theological calling? An. It is when God’s word brings [God’s word’s ring?] does not rest in our outward ears but comes into the heart and works somewhat there. [21] Q. How many ways [is] this taken? An. It is either effectual or ineffectual. [22] Q. What is the inward ineffectual calling? An. When it comes into the heart and falls as on stony ground. [23] Q. How far may this inward ineffectual calling bring us? An. To these four degrees of grace principally. 1. It may bring a man to see his own sin &amp; misery. 2ly. It may so work upon him, as it may bring him to have a desire after the thing persuaded [for?] 3ly It may bring him to some kind of degree of possession of the thing called for. 4ly It may bring him to some outward correspondence, as to reform many sins. [24] Q. Why then is it called an ineffectual calling? An. Because it does not fully persuade [the] heart to come in. … [30] Q. By what wording in scripture is our vocation expressed? An. By many expressions: as first by alluring and persuading. Hos. 2:14. 2ly by inviting and compelling. Math 22:4. 3ly by stretching out of the hand. Rom. 10:21. 4ly by beseeching, 2 Cor. 5:20. 5ly by drawing us. John 6.44. Lastly by apprehending. [31] Q. Do all these properly belong to effectual calling? An. No, the four first may be applied to ineffectual calling. … [38] Q. Whither do effectual and ineffectual calling differ in this respect or no, do not both come from God? An. They agree in this that both proceed from God, yet they differ in regard of the manner of work, for God does the work not secundum propositum [according to the purpose], but secundum obviam [according to the thing encountered]. … [55] Q. What and how many are the instrumental causes of our vocation? An. They are of two sorts either primary or secondary? [56] Q. What were the primary? An. The word. [57] Q. In what propositions was that expressed? An. James 5:11 [1:21?] suggests the word is the ordinary means whereby He calls and so by consequence the ministry of it. 2d. That it was but an instrumental cause under God and so it’s called the [sassed?] of God, the arm of god and sometime the power of God. 3ly. That as it’s but an instrumental cause so it did only belong to those which are adults, for infants may be said to be sanctified but not called. 4. That it was but a separable instrument. [58] Q. How can we say if the converting word is a separable means? An. For two reasons: Because the word may be without the Spirit. 2. Because the Spirit may be and may call some without the word. … [86] Q. Now you have spoken of the primary instruments of salvation as the word and sacraments. What are the secondary instruments? An. They are many as: 1. The mercies and favors of God common to all. Rom. 10:21 [“But to Israel he saith, All day long I have stretched forth my hands unto a disobedient and gainsaying people.”]. Bounty is one thing that may cause love so that one main instrument or means God uses to call us home which is to draw us with the thick cords of love [Hos. 11:4]. … [95] Q. Whether do effectual and ineffectual calling differ in this [Q: 94: ‘who are they whom God is thus pleased to call’]? An. Yes, for the ineffectual calling, many are called but few are chosen.</p></blockquote>

<blockquote><p>2. Touching the second difference, which is their vocation or calling, we must note that there is a twofold calling, vel [either]

1. Inefficaciter, formally, or effectually[?]. 2. efficaciter, formally, or effectually. The 1. is outwardly: the 2. is inwardly. The 1. general: the 2. special. Of the first, our Savior says ‘Many are called, but few are chosen.’ (Mt.) Of the second, the apostle says, ‘whom He has predestinated, them He calls,’ (Rom. 8) i.e. effectually. Now touching the outward calling, we must note that as many are called, so He calls them many ways, especially:

1. By the painful preaching of his Word.

2. By the manifold benefits of his grace.

3. By the manifest judgments of his anger. De [concerning]

1. God gave his Word, and great were the number of the preachers (God calls us diverse ways. Ps. 68:11), and He commanded them to preach unto all nations; and so their sound went unto all lands, to all countries, to all places, but especially to this place, where there are painful men, learned men that do often preach and continually call; and yet I fear their preaching is unrespected, I am sure themselves are unregarded… … …

2. God seeks to draw men unto Him in the chains of love, when He gives unto them, beneficia nimis copiosa multa, et magna, et privata, et positiva, many and great blessings, thereby to allure them unto his service.

3. If men will not turn, nor answer to the first and second call, then will He whet his glittering sword and his hand shall take hold of vengeance, He will pour out the vial of his wrath, thereby to convert them or confound them: and no marvel, for debet amor laesus irasci, love too much provoked must wax angry. All these ways has God called us: the preachers cried, and do cry and call continually, his blessings have been manifold and his judgments have been manifested in some measure upon our nation. O then let us take heed unto ourselves and not harden our hearts any longer, but let us hearken unto his voice, lest He swear in his wrath that we shall not enter into his rest. But indeed all these kinds of outward callings are but in vain, and bring no benefit unless the Lord calls us inwardly by his Spirit, for:

1. Nisi spiritus adsit cordi audientis, inanis est labor docentis (‘In vain is all outward calling, unless we be inwardly called by God’s Spirit.’ Gregory, Homily 30, Super Evangel.): In vain do we preach unto your ears, unless the Spirit of God does open your hearts, as He did the heart of Lydia, that you may believe our preaching, as she did the preaching of Paul.

2. All the blessings of the world will but puff us up with pride (as they did the Israelites, as Moses shows, dilectus meus impinguatus calcitrauit, my beloved, fatted and enlarged, spurned with his heels) unless God does give us the grace to use those blessings to the glory of his name.

3. All punishments and all judgments will sooner work desperation than conversion in a sinful soul, unless the grace of God work true humility in us, to make a right use of his fatherly chastisements. And this experience daily shows: First, the Word is preached, the one believes, the other refuses it. Secondly, God bestows his blessings upon men, the one is puffed up with pride, the other is truly thankful. Thirdly, God sends his judgments, the one grows desperate with Saul, the other is humbled with David. And what is the cause of this? to the one sort, He sends his messengers only to call them outwardly, to the other sort He sends his Spirit and gives his grace to make them yield unto his calling: and this effectual calling of the saints to believe the Gospel and to obey the voice of God is the effect and fruit of the love of God. Whensoever therefore we be outwardly called by what way or means soever it be, let us presently pray to God that He would inwardly work in our hearts to incline them to yield unto his calling, else will the outward calling bring no benefit, but only make us without excuse. And so much of their vocation.</p></blockquote>

<blockquote><p>Explanation 31. That we may the better know what effectual calling is, we are to consider of a double call, which does many times prove ineffectual, as: (1) Outward, in the preaching of the Word and the voice of the rod or any providence whatsoever, which does call men to repentance, faith and holiness; but notwithstanding all these outward calls, there are millions in the world who turn the deaf ear to God and will not return to Him by repentance, nor come to Christ by faith. (2dly) There is an inward call which is no less ineffectual than the former, and it is the Spirit’s call, as when He proceeds no further than that which divines call a common work, as: (1.) Common illumination, or some kind of floating knowledge in the head concerning the Word of God and spiritual matters; and no doubt but many men who have wicked hearts and lead bad lives may be well stored with gifts of this kind, as Judas for one. (2.) Some kind of flashy affections excited and stirred up in the soul towards good things, called foretastes of the powers of the world to come; and such was in Herod and Balaam. (3.) Some kind of faint languishing inclinations in the will to obedience, such as Herod had when he did many things. (4.) Some kind of sense of sin, both in its guilt and horror, such as Judas had; and yet notwithstanding all this inward work of the Spirit, his call may be ineffectual. And if all this may be without success, then no wonder if the Arminians’ call, that of moral suasion, or of arguments, do prove no better. But then (2dly) There is another inward call of the Spirit, which is effectual to the elect; sc. that whereby the Spirit does not only call, but enable them to come at his call, as when He does renew the mind and change the will, sanctify the heart, purify the conscience and affections, and does work a lively faith in such persons, and repentance from dead works.</p></blockquote>

</figure><figure class="quote" id="q-a0437de7b1" data-kw="">
<blockquote><p>We have spoken at large of the participation of the grace of Christ and the benefits of the Gospel: Now we are come unto the means whereby God does effect these things. Show therefore how and in what manner God does offer and communicate the Covenant of Grace unto mankind? By vocation or calling, Rom. 8:30; Heb. 3:1, when God, by the means of his Word and Spirit acquainting men with his gracious purpose of salvation by Christ, invites them to come unto Him, Hos. 2:14, and revealing unto them his Covenant of grace, Mt. 11:27; 16:17; Jn. 14:21; Ps. 25:14, brings them out of darkness to light, Acts 26:18. Is this calling of one sort only? No: there is an external gathering common to all, together with some light of the Spirit and certain fruits of the same, attained unto by some that are not heirs of the promise: for many are called with this outward and ineffectual calling, who are not chosen, Isa. 48:12; Mt. 22:14. And there is an internal and effectual calling, peculiar to those few that are elect; whereby unfeigned faith and true repentance is wrought in the heart of God’s chosen; and God (become in Christ their Father) does not only outwardly by his Word invite, but inwardly also, and powerfully by his Spirit allure and win their hearts to cleave to Him inseparably unto salvation, Gen. 9:27; Ps. 25:14; 60:6. 5. 4; Joel 2:32; Acts 2:39. How do both these kinds of callings differ? Howsoever we are to judge charitably of all outwardly called, 1 Cor. 1:2, because who among them is also inwardly called, is only known to God, 2 Tim. 2:19, yet does this outward calling differ from the inward.

1. In that it is wrought only by outward means, and common illumination, Heb. 4:2, without the spirit of regeneration, Jude verse 19, or any portion of saving faith, Lk. 8:13.

2. In that they are admitted only to an outward and temporary league of formal profession, Acts 8:13; Rom. 9:4-5, not to that entire fellowship with Christ required unto salvation, 1 Jn. 2:19; 1 Cor. 1:8-9. What are the means which God has appointed to call us by? They are partly inward, and partly outward, 1 Thess. 5:19-20; Acts 10:44. What are the inward? The Spirit of God, which is given by the outward things, Gal. 3:2-3; 1 Tim. 1:14. What mean you by the Spirit of God in this place? That power of God which works in the hearts of men things which the natural discourse of reason is not able to attain unto. Being incomprehensible, how may we come to some understanding and sense of it? By the things whereunto it is compared:

1. To wind, Acts 2, to show the marvelous power of it in operation.

2. To oil, Heb. 1:9, that is of a hot nature that pierces and supplies.

3. To water, Jn. 4, that cools, scours and cleanses.

4. To fire, Mt. 3; Acts 2, that severs dross and good metal. How is the operation of it? Diverse; as softening and hardening, enlightening and darkening, which it works after a diverse manner, by the Word in the hearts of the elect and reprobate, according to the good pleasure of God’s secret will only, and after that, according to the good pleasure of his revealed will; so that the lawful use thereof is rewarded with a gracious increase of blessing, and the abuse punished with further hardness to condemnation. What then does the Spirit work in the wicked? Finding them hard, it hardens them more to their further condemnation. What does the same Spirit work in the godly? Faith, whereby they take hold on Christ with all his benefits, Eph. 2:8. What are the outward things which God has given to call us by? They are either common to the whole world, or proper to the Church. What are the things common to the whole world? God’s works not unprofitably given, although not sufficient to salvation. Is not the knowledge of the wisdom, power and goodness of God in the creation and government of the heaven and earth, with the things that are in them, sufficient to make us wise to salvation? No: First, it serves rather for further condemnation without the Word, Rom. 1:19-21. Secondly, as by and with the Word, the due meditation and consideration of God’s works is a good help to further us in religion and in the graces of God’s Spirit, 1 Cor. 1:21-22.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, … (London: M.F., 1645), ‘Hitherto we have treated of the rule and square of our sanctification…’, pp. 394-96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

— James Ussher, A Body of Divinity: Or, the Sum and Substance of Christian Religion, Eighth Edition, … (London: M.F., 1645), ‘Hitherto we have treated of the rule and square of our sanctification…’, pp. 394-96">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+have+spoken+at+large+of+the+participation+of+the+grace+of+Christ+and+the+benefits+of+the+Gospel%3A+Now+we+are+come+unto+the+means+whereby+God+does+effect+these+things.+Show+therefore+how+and+in+what+manner+God+does+offer+and+communicate+the+Covenant+of+Grace+unto+mankind%3F+By+vocation+or+calling%2C+Rom.+8%3A30%3B+Heb.+3%3A1%2C+when+God%2C+by+the+means+of+his+Word+and+Spirit+acquainting+men+with+his+gracious+purpose+of+salvation+by+Christ%2C+invites+them+to+come+unto+Him%2C+Hos.+2%3A14%2C+and+revealing+unto+them+his+Covenant+of+grace%2C+Mt.+11%3A27%3B+16%3A17%3B+Jn.+14%3A21%3B+Ps.+25%3A14%2C+brings+them+out+of+darkness+to+light%2C+Acts+26%3A18.+Is+this+calling+of+one+sort+only%3F+No%3A+there+is+an+external+gathering+common+to+all%2C+together+with+some+light+of+the+Spirit+and+certain+fruits+of+the+same%2C+attained+unto+by+some+that+are+not+heirs+of+the+promise%3A+for+many+are+called+with+this+outward+and+ineffectual+calling%2C+who+are+not+chosen%2C+Isa.+48%3A12%3B+Mt.+22%3A14.+And+there+is+an+internal+and+effectual+calling%2C+peculiar+to+those+few+that+are+elect%3B+whereby+unfeigned+faith+and+true+repentance+is+wrought+in+the+heart+of+God%E2%80%99s+chosen%3B+and+God+%28become+in+Christ+their+Father%29+does+not+only+outwardly+by+his+Word+invite%2C+but+inwardly+also%2C+and+powerfully+by+his+Spirit+allure+and+win+their+hearts+to+cleave+to+Him+inseparably+unto+salvation%2C+Gen.+9%3A27%3B+Ps.+25%3A14%3B+60%3A6.+5.+4%3B+Joel+2%3A32%3B+Acts+2%3A39.+How+do+both+these+kinds+of+callings+differ%3F+Howsoever+we+are+to+judge+charitably+of+all+outwardly+called%2C+1+Cor.+1%3A2%2C+because+who+among+them+is+also+inwardly+called%2C+is+only+known+to+God%2C+2+Tim.+2%3A19%2C+yet+does+this+outward+calling+differ+from+the+inward.+1.+In+that+it+is+wrought+only+by+outward+means%2C+and+common+illumination%2C+Heb.+4%3A2%2C+without+the+spirit+of+regeneration%2C+Jude+verse+19%2C+or+any+portion+of+saving+faith%2C+Lk.+8%3A13.+2.+In+that+they+are+admitted+only+to+an+outward+and+temporary+league+of+formal+profession%2C+Acts+8%3A13%3B+Rom.+9%3A4-5%2C+not+to+that+entire+fellowship+with+Christ+required+unto+salvation%2C+1+Jn.+2%3A19%3B+1+Cor.+1%3A8-9.+What+are+the+means+which+God+has+appointed+to+call+us+by%3F+They+are+partly+inward%2C+and+partly+outward%2C+1+Thess.+5%3A19-20%3B+Acts+10%3A44.+What+are+the+inward%3F+The+Spirit+of+God%2C+which+is+given+by+the+outward+things%2C+Gal.+3%3A2-3%3B+1+Tim.+1%3A14.+What+mean+you+by+the+Spirit+of+God+in+this+place%3F+That+power+of+God+which+works+in+the+hearts+of+men+things+which+the+natural+discourse+of+reason+is+not+able+to+attain+unto.+Being+incomprehensible%2C+how+may+we+come+to+some+understanding+and+sense+of+it%3F+By+the+things+whereunto+it+is+compared%3A+1.+To+wind%2C+Acts+2%2C+to+show+the+marvelous+power+of+it+in+operation.+2.+To+oil%2C+Heb.+1%3A9%2C+that+is+of+a+hot+nature+that+pierces+and+supplies.+3.+To+water%2C+Jn.+4%2C+that+cools%2C+scours+and+cleanses.+4.+To+fire%2C+Mt.+3%3B+Acts+2%2C+that+severs+dross+and+good+metal.+How+is+the+operation+of+it%3F+Diverse%3B+as+softening+and+hardening%2C+enlightening+and+darkening%2C+which+it+works+after+a+diverse+manner%2C+by+the+Word+in+the+hearts+of+the+elect+and+reprobate%2C+according+to+the+good+pleasure+of+God%E2%80%99s+secret+will+only%2C+and+after+that%2C+according+to+the+good+pleasure+of+his+revealed+will%3B+so+that+the+lawful+use+thereof+is+rewarded+with+a+gracious+increase+of+blessing%2C+and+the+abuse+punished+with+further+hardness+to+condemnation.+What+then+does+the+Spirit+work+in+the+wicked%3F+Finding+them+hard%2C+it+hardens+them+more+to+their+further+condemnation.+What+does+the+same+Spirit+work+in+the+godly%3F+Faith%2C+whereby+they+take+hold+on+Christ+with+all+his+benefits%2C+Eph.+2%3A8.+What+are+the+outward+things+which+God+has+given+to+call+us+by%3F+They+are+either+common+to+the+whole+world%2C+or+proper+to+the+Church.+What+are+the+things+common+to+the+whole+world%3F+God%E2%80%99s+works+not+unprofitably+given%2C+although+not+sufficient+to+salvation.+Is+not+the+knowledge+of+the+wisdom%2C+power+and+goodness+of+God+in+the+creation+and+government+of+the+heaven+and+earth%2C+with+the+things+that+are+in+them%2C+sufficient+to+make+us+wise+to+salvation%3F+No%3A+First%2C+it+serves+rather+for+further+condemnation+without+the+Word%2C+Rom.+1%3A19-21.+Secondly%2C+as+by+and+with+the+Word%2C+the+due+meditation+and+consideration+of+God%E2%80%99s+works+is+a+good+help+to+further+us+in+religion+and+in+the+graces+of+God%E2%80%99s+Spirit%2C+1+Cor.+1%3A21-22.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+A+Body+of+Divinity%3A+Or%2C+the+Sum+and+Substance+of+Christian+Religion%2C+Eighth+Edition%2C+%E2%80%A6+%28London%3A+M.F.%2C+1645%29%2C+%E2%80%98Hitherto+we+have+treated+of+the+rule+and+square+of+our+sanctification%E2%80%A6%E2%80%99%2C+pp.+394-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa0437de7b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a0437de7b1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-calling/#:~:text=We%20have%20spoken%20at%20large%20of,of%20God%E2%80%99s%20Spirit%2C%201%20Cor.%201%3A21%2D22&amp;text=We%20have%20spoken%20at%20large%20of%20the%20participation&amp;text=the%20graces%20of%20God%E2%80%99s%20Spirit%2C%201%20Cor.%201%3A21%2D22" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>First, that it does not follow necessarily that whosoever has that taste there mentioned [in 1 Pet. 2:3] shall not be saved: for men may have that taste, and finding it ineffectual, go on till they find a true taste: That taste is dangerous if men fall away, else there may be good use of those tastes: For it brings men near the kingdom of God and makes preparation for true grace.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a0cd96dd73" data-kw="">
<blockquote><p>This serves to decry unto us the blind error of many ages before us, wherein it has been thought, and is by Papists at this day, to be a state of perfection, to live as a monk or hermit out of all societies, in some desert place, and there to spend their whole life in contemplation only, and that voluntarily. They magnify this estate so much, that hereby they think to merit eternal life at the hands of God. But these believers did neither voluntarily, nor with opinion of merit, betake themselves to this solitary life, but on necessity. Indeed, this [monastic] kind of life has no warrant in God’s word because every Christian is a member of two Kingdoms; of Christ’s Kingdom of grace and of that particular state where he dwells. By reason of this dual membership, he has has a twofold calling: temporal and spiritual. In both of which he must walk diligently so long as he can doing the duties both of a child of God and of a member of that commonwealth where he lives. Now, when a man goes voluntarily to lead a solitary life, he forsakes his temporal calling altogether and performs the other but negligently because he withdraws himself from many duties of piety, whereby the people might be furthered Godward, which none can do with a good conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses Leading to the Heavenly Canaan or A Commentary Upon Hebrews Chapter 11</cite>, (Cambridge, 1607, 1618), 195.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cb473f394" data-kw="">
<blockquote><p>…especially seeing his Majesty shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>

</figure><figure class="quote" id="q-59450087e5" data-kw="">
<blockquote><p>…and the soul of Christ, from the first moment of its infusion, was a subject capable of a fulness of grace, as unto its habitual residence and in-being, though the actual exercise of it was suspended for a while, until the organs of the body were fitted for it. This, therefore, it received by this first unction of the Spirit. Hence, from his conception, he was “holy,” as well as “harmless” and “undefiled,” Heb. 7:26; a “holy thing,” Luke 1:35; radically filled with a perfection of grace and wisdom, inasmuch as the Father “gave Him not the Spirit by measure,” John 3:34.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d608331739" data-kw="">
<blockquote><p>Though many storms and floods arise and beat against them, yet they shall never be able to take them off that foundation and rock which by faith they are fastened upon; notwithstanding, through unbelief and the temptations of Satan, the sensible sight of the light and love of God may for a time be clouded and obscured from them, yet he is still the same, and they shall be sure to be kept by the power of God unto salvation, where they shall enjoy their purchased possession, they being engraven upon the palm of his hands, and their names having been written in the book of life from all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 17.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a> › <a href="../topics/perseverance-of-the-saints/nature-of-perseverance/preservation-of-the-saints.html">Preservation of the saints</a></span></div>

</figure><figure class="quote" id="q-965b1a1ef8" data-kw="">
<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 54</span></figcaption>

</figure><figure class="quote" id="q-5bb3907a8e" data-kw="">
<blockquote><p>The Lord has called you into the fellowship of His Son Jesus Christ, and by that act and deed He has put you into the place of infallible safeguard. If you are indeed a believer you are one with Jesus, and therefore you are secure. Do you not see that it must be so? You must be confirmed to the end until the day of His appearing, if you have indeed been made one with Jesus by the irrevocable act of God. Christ and the believing sinner are in the same boat: unless Jesus sinks, the believer will never drown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, p. 89</span></figcaption>

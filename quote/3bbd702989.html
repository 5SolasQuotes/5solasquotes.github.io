<blockquote><p>Yea, but to believe the English scriptures, or the Bible translated into English to be the word of God; This is no foundation of Christian Religion.

This is but an old piece of Popery in an Independent dress. The Papists to discredit our Translations, and to keep the people from Reading the Scriptures, and so to keep up the Church’s Authority, are wont to Cavil and say, the English scriptures are no foundation of Christian Religion.

Thus that Jesuit, with whom Doctor White has to do, lays this for his first conclusion (namely) that the scripture alone, especially as translated into the English Tongue, cannot be the rule of Faith: He gives two Reasons for his Assertion. The first is, because these Translations are not infallible, as the Rule of Faith must be; for neither were the Scripture immediately written by the Holy Ghost in our language neither were the Translators assisted by the Spirit infallible, as appears by the often change, and correcting of the Translations, which shews, that some of them were defective. — How can an unlearned man be sure, that this Translation, which now I have, or you have, does not err, unless you admit the Authority of the Church, to assure us, that such and such a Translation doth not err?

For answer hereunto, I lay down these two Conclusions: First, that Divine Truth in English, is as truly the Word of God, as the same Scriptures delivered in the Original, Hebrew or Greek; yet with this difference, that the same is perfectly, immediately, and most absolutely in the Original Hebrew and Greek, in other Translations, as the vessels wherein it is presented to us, and as far forth as they do agree with the Originals: And every Translation agreeing with the Original in the matter, is the same Canonical Scripture that Hebrew or Greek is, even as it is the same Water, which is in the Fountain, and in the Stream; we say this is the Water of such or such a Well, or Spring, because it came from thence; so it is in this business, when the Apostles spake the wonderful works of God in the languages of all Nations (that were at Jerusalem) wherein they were born; the Doctrine was the same to all, of the same Truth and Divine Authority in the several Languages:

And this Doctrine is the Rule we seek for, and the foundation upon which our Religion is grounded, and it is all one thing, whether it be brought to my understanding in Welch, or English, or Greek, or Latin: All Language, or Writing, is but the Vessel, the Symbol, or Declaration of the Rule, not the Rule it self: It is a certain form or means by which the divine Truth cometh unto us, as things are contained in their words, and because the Doctrine and matter of the Texts not made known unto me but by words, and a language which I understand; therefore I say, the Scripture in English is the rule and ground of my Faith; whereupon I relying, have not a human, but a divine Authority for my Faith. Even as an unbeliever coming to our Sermons, is convinced of all, and judged of all, and he will acknowledge the Divine Truth of God, although by a humane voice in preaching, it be conveyed unto him, so we enjoy the infallible Doctrine of the Scripture, though by a man’s Translation it be manifested unto me.

My second conclusion is this; That to believe this to be so (that is) to believe the scripture in English to be the word of God, is a necessary means for grounding of Faith and Religion in the hearts of English people.

The reason is, because the rule of faith must be first both certain, and secondly known. For if it be not certain, it is no rule at all, and if it be not known, it is no rule to us. Wherefore God hath taught us by corporal letters, which we see and read, what he would have us believe concerning him; But to him that heareth not, or that believeth not, Truth and Error, light and darkness is all one. Observe the Apostles reasoning, How shall they call on him, in whom they have not believed? (believing you see is the foundation of that part of Christian Religion, (namely) holy invocation) and how shall they believe in him, of whom they have not heard? if they do not understand the mind of God by hearing, and hearing it as from God, as the word of God and not of Man, it is no more than if they heard a piece of Virgil, or Caesar’s Commentaries; for how can we preach to the convincing of consciences, and settling of their souls in the way of Religion, except they be persuaded, that he that preacheth, speaketh from God?

Lastly, what comfort can there be in that Religion, which we are not persuaded is of God? no Religion is able to bring us unto God, but that which came from God, if I doubt of that, I have no Religion at all.

But how can we believe the Scriptures translated into English, to be of God, seeing Translations are not so infallible, as the rule of faith must be, in many places they do not agree with the Originals?

Let the English Translation of the Bible stand for true, until the Jesuit or the Sectary be able to prove the contrary.

O, but I cannot believe them to be true, because the Translators were not assisted immediately by the holy Ghost.

Such extraordinary assistance is needful to one, that shall indite any part of Scripture, but not to a Translator, for a man by his skill in both Languages, by the ordinary helps of prayer and industry is able to open in the English tongue, what was before locked up in the Original Hebrew, or Greek. As a Spanish or Danish Ambassador, delivers his Message, and receives his answer by an Interpreter. — The interpreter needs not any inspiration, but by his skill in both languages, and his fidelity, he delivers the true mind of one Nation to another: So it is in this case, the Translator is God’s interpreter to a strange people.

Oh! But by the often change and variable Translations, it seems that some have erred.

Ans. … Our English Speech doth vary and change: Books of Law and History, written in Old English three hundred years ago, are hardly understood now, and therefore there will need a new translation of them, yet without any alteration in the matter: so in respect of words, and manner of speech, a Translation may be defective, when as it is not erroneous for the sense.

… We do not say this or that Translation is the Rule and Judge, but the Divine Truth translated; the knowledge whereof is brought to us in the Translation, as the Vessel, wherein the Rule is presented to us, as is abovesaid.</p></blockquote>

<blockquote><p>So then, brothers, stand firm and hold to the traditions that you were taught by us, either by our spoken word or by our letter (2 Thessalonians 2:15)

6. Though we blame this in papists, yet we reject not all traditions:—

[1.] Because scripture itself is a tradition, as we proved before, and is conveyed to us by the most credible means, which we have no reason to doubt of. The scriptures of the Old Testament were preserved by the Jews, ‘to whom were committed the oracles of God.’ Rom. iii. 2, Protestants received all the books which they admitted into their canon. And for the books of the New Testament, the Christian church hath received them as the writings of those whose names they bear. And by the constant universal tradition of the church they are transmitted to us; and we have no more reason to doubt of them than we do of statutes and laws made by kings and parliaments who lived long before we had a being.

Yea; we may be much more confident, as the matter is of greater weight and consequence, and these writings have the signature and stamp of God’s Spirit on them, and have been blessed by God to the converting and sanctifying of many souls; and have been delivered down to us by a succession of believers unto this very day. And by them Christianity hath been preserved in the world, notwithstanding the wickedness of it, and hath held up head against all the encounters of time. The persecutions of adverse powers have not suppressed it, nor the disputes of enemies silenced the profession of it; but still from age to age God’s truth is received and transmitted to posterity.

[2.] Because the truth of Christianity depending upon matter of fact, chiefly Christ’s rising from the dead, it can only be proved by a testimony which, in so extraordinary a case, must be made valuable, and authorised to the world by the miracles accompanying it. Now the notice of these things is brought to us by tradition, which, being unquestionable, giveth us as good ground of faith as it did to them that lived in the apostles’ time, and heard their doctrine and saw their miracles. God’s wonderful works were never intended for the benefit of that age only in which they were done, but for the benefit also of those that should hear of them by any credible means what soever, Ps. cxlv. 4; Joel i. 3; Ps. lxxviii. 3-7: these things were told them ‘that they might set their hope in God,’ &amp;c.

[3.] Because there are some doctrines drawn by just consequence from scripture, but are the more confirmed to us when they are backed with constant church usage and practice; as baptism of infants, Lord’s-day, singing of psalms in our public worship, &amp;c.

[4.] Because there are certain words which are not found in scripture indeed, yet agreeable thereto, and are very useful to discover the frauds of heretics; as Trinity, divine providence, consubstantial, procession of the Holy Ghost, satisfaction, &amp;c.

[5.] We reject not all church history, or the records of ancient writers concerning the providences of God in their days in owning the gospel, which make much for our instruction in manners, and help to encourage us to put our trust in God.

[6.] There are certain usages and innocent customs or circumstances, common to sacred and other actions, which we despise not, but acknowledge and receive as far as their own variable nature and condition requireth; not rejecting them, because anciently practised; nor regarding them, when the general law of edification requireth the omission of them.

But that which we detest is, that the traditions of men should be made equal in dignity and authority with the express revelation of God; yea, that manifest corruptions and usurpations,—as making Rome the mistress of other churches, and superinducing the Pope as the head of the universal visible church, and the vicar of Christ, without his leave and appointment, and such like other points, should be obtruded upon the world as apostolical traditions, and to be received with like religious reverence as we do articles of faith set down in scripture. This is that we cannot sufficiently abhor, as apparently false, and destructive to Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The Complete Works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 133-35.</span></figcaption>

<blockquote><p>The third property of Scripture adduced, is its perspicuity (section 7): and here again the Confession is no less precise and guarded than clear and decided in its assertions. The perspicuity of Scripture is sharply affirmed, in the sense that the saving truth is declared to be placed in Scripture within the reach of all sincere seekers after it. But the limitations of its perspicuity are very fully and carefully stated. It is only “those things which are necessary to be known, believed, and observed, for salvation” that are said to lie perspicuously in Scripture. Even these things are not said to be plainly delivered on every occasion in which they fall to be mentioned or treated in Scripture; but only “in some place of Scripture or other.” Nor is it even stated that they all are anywhere so clearly propounded and opened as that they may easily be understood unto perfection; but only so as that “a sufficient understanding of them” may be attained. Nor yet are they affirmed to be equally understandable by all; but only that they are so clearly spread on the face of Scripture that every man, learned or unlearned, may attain a sufficient understanding of them to secure his salvation and peace. The variety of Scripture is here fully recognized—its frequent obscurities, its difficulties, its problems, and its profound depths darkening to all human gaze. The variety of mental acumen and teachableness of heart brought to the study of Scripture, is sufficiently recognized. But the fact that the Scriptures, despite all their obscurities, are a people’s book, is sharply and decisively asserted; and with it the right of the unlearned man to them, and his capacity to make full use of them for the main purpose for which they were given; and as well, the openness of the Scriptures to the “due use of the ordinary means.” In a word there is combined here an adequate recognition of the profundity of the Scriptures and their occasional obscurity, with an equally clear assertion of the popular character of the Word of God as a message to every one of His children. We must not overlook, in passing, that it is by “a due use of the ordinary means” that the learned and unlearned alike are said to be able to attain a sufficient knowledge of the saving message of Scripture. By the phrase, “a due use of the ordinary means,” not only is the need of an infallible interpreting Church denied; but also all dependence on extraordinary revelations, the “inner light” of the mystical sectaries, and the like, is excluded. Within the “ordinary means” is included that “inward illumination of the Spirit of God,” which is declared to be necessary to the saving understanding of Scripture in section 6, and which is here declared to be an ordinary endowment of the children of God. Within them is included all the religious and gracious means which God has placed at the disposal of His people, in the establishment of His Church and its teaching functions. But in this phrase is also included the implication that Scripture is to be interpreted, as other books are interpreted, in the ordinary processes and by means of the ordinary implements of exegesis. There is included here, therefore, the charter of a sound and rational system and method of exposition; and we are accordingly not surprised to find the Westminster Divines dealing constantly in their extant writings with the question of “how to read the Scriptures,” and laying down well-considered and reasonable canons of interpretation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The third property of Scripture adduced, is its perspicuity (section 7): and here again the Confession is no less precise and guarded than clear and decided in its assertions. The perspicuity of Scripture is sharply affirmed, in the sense that the saving truth is declared to be placed in Scripture within the reach of all sincere seekers after it. But the limitations of its perspicuity are very fully and carefully stated. It is only “those things which are necessary to be known, believed, and observed, for salvation” that are said to lie perspicuously in Scripture. Even these things are not said to be plainly delivered on every occasion in which they fall to be mentioned or treated in Scripture; but only “in some place of Scripture or other.” Nor is it even stated that they all are anywhere so clearly propounded and opened as that they may easily be understood unto perfection; but only so as that “a sufficient understanding of them” may be attained. Nor yet are they affirmed to be equally understandable by all; but only that they are so clearly spread on the face of Scripture that every man, learned or unlearned, may attain a sufficient understanding of them to secure his salvation and peace. The variety of Scripture is here fully recognized—its frequent obscurities, its difficulties, its problems, and its profound depths darkening to all human gaze. The variety of mental acumen and teachableness of heart brought to the study of Scripture, is sufficiently recognized. But the fact that the Scriptures, despite all their obscurities, are a people’s book, is sharply and decisively asserted; and with it the right of the unlearned man to them, and his capacity to make full use of them for the main purpose for which they were given; and as well, the openness of the Scriptures to the “due use of the ordinary means.” In a word there is combined here an adequate recognition of the profundity of the Scriptures and their occa — Benjamin B. Warfield, The Works of Benjamin B. Warfield, vol. 6 (Bellingham, WA: Logos Bible Software, 2008), 232–34.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+third+property+of+Scripture+adduced%2C+is+its+perspicuity+%28section+7%29%3A+and+here+again+the+Confession+is+no+less+precise+and+guarded+than+clear+and+decided+in+its+assertions.+The+perspicuity+of+Scripture+is+sharply+affirmed%2C+in+the+sense+that+the+saving+truth+is+declared+to+be+placed+in+Scripture+within+the+reach+of+all+sincere+seekers+after+it.+But+the+limitations+of+its+perspicuity+are+very+fully+and+carefully+stated.+It+is+only+%E2%80%9Cthose+things+which+are+necessary+to+be+known%2C+believed%2C+and+observed%2C+for+salvation%E2%80%9D+that+are+said+to+lie+perspicuously+in+Scripture.+Even+these+things+are+not+said+to+be+plainly+delivered+on+every+occasion+in+which+they+fall+to+be+mentioned+or+treated+in+Scripture%3B+but+only+%E2%80%9Cin+some+place+of+Scripture+or+other.%E2%80%9D+Nor+is+it+even+stated+that+they+all+are+anywhere+so+clearly+propounded+and+opened+as+that+they+may+easily+be+understood+unto+perfection%3B+but+only+so+as+that+%E2%80%9Ca+sufficient+understanding+of+them%E2%80%9D+may+be+attained.+Nor+yet+are+they+affirmed+to+be+equally+understandable+by+all%3B+but+only+that+they+are+so+clearly+spread+on+the+face+of+Scripture+that+every+man%2C+learned+or+unlearned%2C+may+attain+a+sufficient+understanding+of+them+to+secure+his+salvation+and+peace.+The+variety+of+Scripture+is+here+fully+recognized%E2%80%94its+frequent+obscurities%2C+its+difficulties%2C+its+problems%2C+and+its+profound+depths+darkening+to+all+human+gaze.+The+variety+of+mental+acumen+and+teachableness+of+heart+brought+to+the+study+of+Scripture%2C+is+sufficiently+recognized.+But+the+fact+that+the+Scriptures%2C+despite+all+their+obscurities%2C+are+a+people%E2%80%99s+book%2C+is+sharply+and+decisively+asserted%3B+and+with+it+the+right+of+the+unlearned+man+to+them%2C+and+his+capacity+to+make+full+use+of+them+for+the+main+purpose+for+which+they+were+given%3B+and+as+well%2C+the+openness+of+the+Scriptures+to+the+%E2%80%9Cdue+use+of+the+ordinary+means.%E2%80%9D+In+a+word+there+is+combined+here+an+adequate+recognition+of+the+profundity+of+the+Scriptures+and+their+occasional+obscurity%2C+with+an+equally+clear+assertion+of+the+popular+character+of+the+Word+of+God+as+a+message+to+every+one+of+His+children.+We+must+not+overlook%2C+in+passing%2C+that+it+is+by+%E2%80%9Ca+due+use+of+the+ordinary+means%E2%80%9D+that+the+learned+and+unlearned+alike+are+said+to+be+able+to+attain+a+sufficient+knowledge+of+the+saving+message+of+Scripture.+By+the+phrase%2C+%E2%80%9Ca+due+use+of+the+ordinary+means%2C%E2%80%9D+not+only+is+the+need+of+an+infallible+interpreting+Church+denied%3B+but+also+all+dependence+on+extraordinary+revelations%2C+the+%E2%80%9Cinner+light%E2%80%9D+of+the+mystical+sectaries%2C+and+the+like%2C+is+excluded.+Within+the+%E2%80%9Cordinary+means%E2%80%9D+is+included+that+%E2%80%9Cinward+illumination+of+the+Spirit+of+God%2C%E2%80%9D+which+is+declared+to+be+necessary+to+the+saving+understanding+of+Scripture+in+section+6%2C+and+which+is+here+declared+to+be+an+ordinary+endowment+of+the+children+of+God.+Within+them+is+included+all+the+religious+and+gracious+means+which+God+has+placed+at+the+disposal+of+His+people%2C+in+the+establishment+of+His+Church+and+its+teaching+functions.+But+in+this+phrase+is+also+included+the+implication+that+Scripture+is+to+be+interpreted%2C+as+other+books+are+interpreted%2C+in+the+ordinary+processes+and+by+means+of+the+ordinary+implements+of+exegesis.+There+is+included+here%2C+therefore%2C+the+charter+of+a+sound+and+rational+system+and+method+of+exposition%3B+and+we+are+accordingly+not+surprised+to+find+the+Westminster+Divines+dealing+constantly+in+their+extant+writings+with+the+question+of+%E2%80%9Chow+to+read+the+Scriptures%2C%E2%80%9D+and+laying+down+well-considered+and+reasonable+canons+of+interpretation.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+

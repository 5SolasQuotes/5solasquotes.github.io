<main class="wrap"><figure class="quote" id="q-78696e7bc2" data-kw="">
<blockquote><p>That God ‘requires of sinners faith in Christ that they may be saved,’ admits of no dispute. The part assigned to faith, however, has been much controverted. Many excellent divines, in consequence of the distinction which they made between the covenant of redemption and the covenant of grace, were led to speak of faith as the condition of the latter covenant. But the term, as used by them, signifies not a meritorious or procuring cause, but simply something which goes before, and without which the other cannot be obtained. They consider faith merely as a condition of order or connection, as it has been styled, and as an instrument or means of obtaining an interest in the salvation offered in the gospel. This is very different from the meaning attached to the term by Arminians and Neonomians, who represent faith as a condition on the fulfilment of which the promise is suspended. The Westminster Assembly elsewhere affirm, that God requires of sinners faith in Christ, “as the condition to interest them in him.” But this is very different from affirming that faith is the condition of the covenant of grace. That faith is indispensably necessary as the instrument by which we are savingly interested in Christ, and personally instated in the covenant, is a most important truth, and this is all that is intended by the Westminster Divines. They seem to have used the term condition as synonymous with instrument; for, while in one place they speak of faith as the condition to interest sinners in the Mediator, in other places they affirm, that ‘faith is the alone instrument of justification,’ and teach, that ‘faith justifies a sinner in the sight of God, only as it is an instrument by which he receiveth and applieth Christ and his righteousness.’ As the word condition is ambiguous, apt to be misunderstood, and is frequently employed in an unsound and dangerous sense, it is now disused by evangelical divines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Confession of Faith of the Westminster Assembly of Divines</cite>, 8th ed. (Glasgow: Blackie &amp; Son, 1857), pp. 91–92</span></figcaption>

<blockquote><p>29. Furthermore, we do not say that the Gospel and the New Testament demand no condition at all, for the condition of faith and new obedience (which is everywhere impressed on us) is demanded. But God provides these conditions freely, and their imperfect quality forms no hinderance to salvation (which flows from another source), so long as they are genuine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, ed. te Velde, Dolf – Synopsis of a Purer Theology (1625; Brill, 2015), vol. 1, Disputation 23, §29, p. 597 “New obedience” is likely being referred to as a condition, not of justification, but of final salvation.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-e492c301ae" data-kw="">
<blockquote><p>[Papists:] The Lord says not [in Mt. 15:28; Mk. 7:29], ‘Thy daughter is saved by thy faith,’ as if it were by a means or instrument only of attaining that benefit, as you [Protestants] say, but [rather] for this saying as [it was] a meritorious cause. Answer:

1. Confession is taken for faith itself.

2. Faith is here taken in an objective sense, as it signifies Christ apprehended by faith, to whose only merit this benefit is to be ascribed: but by the means of faith; which God requires as an intermediate conditon on our part to this, that any benefit from his bountiful hand may be obtained, etc. [3] Unless that solution please better, which taking the name of ‘faith’ properly, says, that by that speech is not signified a cause, but a condition only, because all things are promised to him that believes; whence it is no wonder if when God gives any benefit to the faithful, He is said to give it for faith, which He necessarily requires in the receiver: Not that he deserves it by believing, but because God has promised it to none but to the believer; and that of mere grace in the Mediator Jesus Christ, in whom all the promises are yea and Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-boyd.html">Robert Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, ch. 2, verse 8, p. 273 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 409</span></figcaption>

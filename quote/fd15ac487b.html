<main class="wrap"><figure class="quote" id="q-fd15ac487b" data-kw="">
<blockquote><p>…the venerable councils of the fathers [referring to Laodicea (365) and Braga (563) above] decree that vulgar psalms should not at all be sung in the Church and that ‘nothing put together in poetic fashion’ should be employed in the divine praises. … …so that to avoid growths and errors of that kind they [‘God-fearing ones‘] cling more vigorously and more carefully to divine authority and statutes of the church. This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles; his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices. It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offense and hesitation. Let us apply ourselves wholly to divine words in which there is no error, no ambiguity.. … There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agobard-of-lyons.html">Agobard of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Divine Psalmody c. 836 10 paragraphs</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cc09eb96d" data-kw="">
<blockquote><p>6. The psalms of David, and other scriptural songs in the Old Testament, may, and ought to be sung in this part of gospel-worship: for saith he, ‘in psalms, hymns, and spiritual songs, singing,’ etc. or rather, ‘singing in psalms, hymns,’ etc. for so the words may be rendered: now all agree that hereby are designed the psalms of David, and other scriptural songs, though there be some difference about the kind of songs which are intended to be expressed by every one of those in particular.</p></blockquote>

<blockquote><p>Now these words (which are the known division of David’s psalms, and expressly answering to the Hebrew words Shurim, Tehillim, and Mizmorim, by which his psalms are distinguished and entitled), being so precisely used by the apostle in both places, do plainly point us to the Book of Psalms.</p></blockquote>

</figure><figure class="quote" id="q-10bee237fb" data-kw="">
<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath (1595/1606; Naphtali &amp; RHB, 2015) Emphasis in the original. See also pp. 402-3. | Book 2, ch. 11, ‘Private Worship: Singing of Psalms’</cite>, pp. 396-8</span></figcaption>

g+psalms%2C+as+well+as+in+the+church.+And+though+I+do+not+bind+men+unto+this%E2%80%93for+be+it+far+from+me+that+I+should+lay+any+heavier+burden+upon+any%2C+than+the+Word+of+God+itself+binds%E2%80%93bind+them+I+say+unto+this%2C+that+in+all+their+mirth+they+should+sing+psalms%2C+as+might+seem+the+places+alleged+do+import%E2%80%A6+For+as+that+is%E2%80%A6+a+blessed+heaviness+that+makes+us+seek+unto+the+Lord%3B+so+that+is+a+godly+mirth+that+ends+with+singing+of+psalms%2C+and+a+heavenly+joy%2C+that+at+leastwise+makes+us+more+fit+to+serve+God.+.+pp.+406-7+What+Makes+it+Comely+%E2%80%A6So+though+to+sing+be+never+so+comely+in+its+own+nature%2C+yet+it+become+not+us%2C+except+we+be+prepared+for+it%2C+and+do+sing+David%E2%80%99s+psalms+%5Bnot+so+much+with+David%E2%80%99s+harp%2C%5D+as+with+David%E2%80%99s+spirit.+Therefore+the+apostle%2C+writing+to+the+Ephesians%2C+wills+them+in+singing+to+make+melody+in+their+hearts+to+the+Lord+%28Eph.+5%3A19%29%2C+and+not+to+sing+with+the+tongue+only%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Nicholas+Bownd%2C+The+True+Doctrine+of+the+Sabbath+%281595%2F1606%3B+Naphtali+%26+RHB%2C+2015%29+Emphasis+in+the+original.+See+also+pp.+402-3.+%7C+Book+2%2C+ch.+11%2C+%E2%80%98Private+Worship%3A+Singing+of+Psalms%E2%80%99%2C+pp.+396-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F10bee237fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/10bee237fb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=And%20if%20we%20look%20into%20the,to%20sing%20with%20the%20tongue%20only%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

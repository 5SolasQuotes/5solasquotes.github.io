<main class="wrap"><figure class="quote" id="q-e7baccd699" data-kw="">
<blockquote><p>Although some think that they can claim a historical link with the Second Reformation Church of Scotland without acknowledging the covenants of the seventeenth-century, this supposition is a-historical. This is because in 1640 the General Assembly of the Scottish Kirk made it an ex-communicable offence not to adhere to the National Covenant (which, incidentally, proves that the early Covenanters believed in close communion/confessional membership):

The Assembly ordains, that such as have subscribed the Covenant and speaks against the same, if he be a Minister, shall be deprived: And if he continue so, being deprived, shall be excommunicate: And if he be any other man, shall be dealt with as perjured, and satisfy publikely [sic] for his perjury.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanting-and-the-general-assembly-of-the-church-of-scotland-1640.html">Covenanting and the General Assembly of the Church of Scotland (1640)</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Act for censuring speakers against the covenant’, Session 5, 1 Aug. 1640 in A true copy of the whole printed acts of the General Assemblies of the Church of Scotland, beginning at the Assembly holden in Glasgow the 27 day of November 1638; and ending at the 27 day of November 1638; and ending at th</cite>, (n.p., 1682).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad9c349332" data-kw="">
<blockquote><p>What cannot warrant a breach where there is union, that cannot warrantably be the ground to keep up a division; Now there are many miscarriages or defects, which are really gross, and yet will not warrant a schism, as all that write thereon do clear, and is obvious to all. The reason of the consequence is, because making up of a breach is no less a duty than preventing thereof; and further, if it began upon such a ground, then the continuing thereof upon the same ground is but the continuing in the same sin; and it cannot be thought that any party by dividing upon an unjust ground can afterward be justified upon the same ground; It remains therefore, that if the ground was not sufficient at first to warrant a separation or division, it cannot be sufficient afterward to continue the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (Edinburgh: Higgins, 1659), pt. 4, ch. 7, p. 320</span></figcaption>

</figure><figure class="quote" id="q-8f0b426baf" data-kw="">
<blockquote><p>Consider, that as it is our duty and interest, so we are bound by the oath of God to upbuild, maintain, and preserve the tabernacle of David against all injuries. Besides personal vows, there are public vows, oaths, and covenants, frequently repeated, lying upon us and our posterity to build up the tabernacle of David, to maintain the doctrine, discipline, worship, and government of the church of Scotland, as it is stated in our public standards.

And whatever failures, through human weakness and infirmity, there might be either in the composure of these covenants, or yet in their administration, this can never loose us from the oath of God to maintain and carry on a reformation of the church of Christ, antecedently binding by the authority of God in his word. The Rechabites thought themselves bound to abstain from wine, a thing indifferent in itself, because of their father’s oath; and are commended for it.

The rash oath made to the Gibeonites in the days of Joshua was found binding in the days of Saul and David, although it was only the princes of the congregation that sware. The oath of Zedekiah king of Judah to the king of Babylon, a heathen, though prohibited in the law of Moses, was found binding; “Shall he break the covenant, and escape?” The bond of any city or community, though made only by those who presently govern, is found binding in law upon their successors in office in the same society.

And yet, will any deny that the oath of God, so solemnly sworn by king, nobles, gentry, commons, and persons of all ranks, with uplifted hand to the great God, for maintaining and upholding his tabernacle in the land, is not obligatory upon us their posterity? And therefore, I say, if we do not concur in building the fallen tabernacle of David according to these oaths, we are guilty, not only of rebellion against the divine authority, but also of perjury.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tabernacle of David Ruined by Man, and reared up by the Mighty God. Being Three Discourses. The First and Second Preached at Edinburgh, November 1735; and the Third at Kinross, February 17th 1736, at the opening of the Presbytery of the Associate Ministers there in The Whole Works of Ebenezer Er</cite></span></figcaption>

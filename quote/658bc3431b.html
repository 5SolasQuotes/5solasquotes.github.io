<blockquote><p>Upon mature deliberation we did perceive that the wise and holy providence of God… has… disabled that [former] way of government and all that depends thereon, from affording any protection and preservation to any of the inhabitants of this land; and has enabled another form of government to afford it; Wherefore we did conclude from the light of nature, from the judgement of the learned, from the practice of Christians in former ages, from our own principles and from our former engagements that it was the will of God we should quietly and peaceably set ourselves in our places and callings to live under this government and to submit to it in such things as are imposed upon or required of us [such as the oath of Engagement] by the powers which are in actual possession, being things in themselves lawful and necessary, or expedient to the preservation of ourselves and others… Fourthly, because we clearly conceive that there is no difference at all between the submission which the authors of the Proposals themselves rightly acknowledge to be due to the powers which are in actual possession and that which is required by the subscription to this Engagement: for seeing the express words of the Engagement give no ground to interpret the act of subscription beyond that which is a clear and known duty: therefore we think it not (as to our consciences) warrantable to interpret it otherwise; but we rather think it contrary to a known duty to make of a thing in itself lawful and necessary at this time, any scrupulous interpretation beyond what the words import; or to suspend obedience from a duty upon the conjecture of something which may be thought undutiful, when that which is to our conscience a known duty is apparent: Upon which ground we declare that we trouble not ourselves, nor do we think it lawful to stagger others in their thoughts with the inferences which the proposers make upon the subscription of the Engagement with reference to these queries [of theirs]: As how far it does imply an approbation of the manner of the present establishment, whether as effected by a full and free authority yea or no? whether yea or no, it does imply an active concurrence and a ratifying consent of the people thereunto further than what has been already acknowledged to be due to the powers in actual possession by all that are in subjection under them and depend upon their protection? and whether yea or no, and how far it fastens an obligation to act to the strengthening and promoting of the government which is at present or may be hereafter established by the advantage of possible power? We say that to trouble our own or other men’s weaker consciences with these or such like doubtful conjectures to color the suspension of our own, or occasion the aversion of other men’s affections from yielding obedience to a clear and confessed duty, is not only preposterous and contrary to the aim of healing breaches, and of advancing a public good in this time of distraction, but inconsistent (as to our reason) with the obvious meaning of the words which are to be subscribed and disagreeing (as to our affections) with the charity due no less to superiors than to other men, which is not to think evil when good may be thought of them. And lastly, it is opposite (as to our spirits) unto that wisdom which is from above (the rule of our walking) teaching us to have pure and peaceable thoughts in all our actings, to perform duties in godly simplicity and without worldly wisdom, to be gentle and easily intreated, to do good works without partial scrupulosity and without hypocrisy. And upon these principles of true wisdom (which we humbly conceive are not laid to heart by our brethren in the third paragraph of their Proposals) we professedly wave all those scruples and the stumbling-blocks which they have laid to themselves and wherewith they have puzzled others, upon this clear account: that whenever the consideration of these things, which are said to be implied in the subscription (which we see not) shall come before us, to be circumstantially considered for the edification of others, or the clearing of our own way, we then shall be most ready to declare our sense therein, according to known principles and the circumstances, which God shall offer…</p></blockquote>

<blockquote><p>My arguments against the derivation of magistracy from Jesus Christ as Mediator, and against the magistrate’s holding of his office of and under Christ as Mediator, are these: First, this doctrine does evacuate and nullify the civil authority and government of all heathen or pagan magistrates; for which way was the authority of government derived from Christ, and from Him as Mediator, to a pagan magistrate or emperor? If he has not his power from Christ, as Mediator, then He is but a usurper, and has no just title to reign, according to their principles, who hold that all government, even civil, is given to Christ, and to Him as Mediator. Mr. Hussey, forsooth, does learnedly yield the argument, and answers, p. 20, that not only it is a sin to be a heathen, but the government of a heathen is sinful and unlawful; for which he gives this reason, ‘Whatsoever is not of faith is sin.’ He might as well conclude, in that sense, that the best virtues of the heathen were sin, because not of faith; that is, accidentally sin, in respect of the end, or manner of doing, not materially, or in their own nature. Upon the same reason he must conclude, that the government of a heathen magistrate per se [in of itself], simpliciter [essentially], et ex natura sua [out of its nature], unlawful and sinful? Whether has he any just right or title to government and magistracy? If his title to civil magistracy be just, and if his government be in itself materially and substantially lawful, then he must have a commission from Christ, and from him as Mediator. This I suppose cannot be Mr. Hussey’s sense, for he has not answered one syllable to the argument, tending that way. But if the government of a heathen magistrate be in itself materially, substantially, and in the nature of the tenure, sinful and unlawful, so that, as long as he remains a heathen, he has no real right or true title to government, but only a pretended and usurped title (which must needs be Mr. Hussey’s sense, if he has answered anything at all to my argument), then he goes cross not only to the holy men of God in the Old Testament, who honored heathen princes, and were subject to them as to lawful magistrates, but also to the doctrine of Jesus Christ, who taught his disciples to give unto Caesar what is Caesar’s; and of the apostles, who in their time, exhorted the churches to be subject even to the heathen magistrates (for they had no other at that time), to obey them, to pray for them, Rom. 13; Titus 3:1; 1 Tim. 2:1-2; 1 Pet. 2:13-17. It is justly condemned as one of the errors of the Anabaptists, that a heathen magistrate is not to be acknowledged as a lawful magistrate, or as being from God. See Gerhard, Loc. Com., tom. 6, p. 498-9; P. Hinkelmannus, de Anabaptismo, disp. 13, cap. 1 The Scriptures now cited are so clear, that when Mr. Hussey says of the heathen magistrate, ‘Let Baal plead for himself,’ he might as well have said, that Christ and his apostles pleaded for Baal. They that plead for the authority of a heathen magistrate do not plead for Baal, but for God, and for his ordinance; ‘For the powers that be are ordained of God,’ says Paul, speaking even of the heathen magistrates, Rom. 13:1. But what will Mr. Hussey say, if his great master Erastus be found a pleader for Baal as much as I am? Confirm. Thes., lib. 3, cap. 2, p. 184, speaking of the heathen and unbelieving magistrates, before whom the Corinthians went to law one against another, he says, [contains Latin], Is not the ungodly magistrate also preferred by God, that he may defend any of his subjects from injury and violence. Yea, the Scriptures afore touched are so clear in this point, that Gamachaeus, in Primam Secundae, quest. 4-5, cap. 33, though he hold that by human and ecclesiastical right, pagan princes lose their dominion and authority over their subjects when their subjects turn Christians, yet he acknowledges that they still retain their former jurisdiction over those subjects by the law of God and nature. Surely one might as well say, that heathen parents are unlawful, and heathen husbands are unlawful (all which were contrary to the Word of God), as to say that heathen magistrates are unlawful. Take the instance in parents; for all lawful magistrates are fathers by the fifth commandment: Does the paternity of a heathen father differre specie [differ in kind] from the paternity of a Christian father? are they not both lawful parents, being made such by God and nature? are not their children bound to honor them, and be subject to them, and obey them in things lawful? The paternity is the same in se [in principle], but different modaliter [in way], that I may borrow a distinction from Mr. Hussey. The Christian father is sanctified, and qualified to do service to Jesus Christ, as a father, in educating his children Christianly, which a heathen father cannot do. The heathen magistrate and the Christian magistrate are both lawful magistrates, being made such by God and nature, or by election of people. They are both of them to be honored, submitted unto, and obeyed; they are both of them the ministers of God for the good to their people; their power is the same in actu signato [the intent of power], though not in actu exercito [in how the power is actually exercised in specific acts]. The heathen magistrate may do, and ought to do, what the Christian magistrate does; but the Christian magistrate is fitted, qualified, enabled, and sanctified to glorify and serve Jesus Christ as a magistrate, which the heathen magistrate is not.</p></blockquote>

overnment+of+a+heathen+magistrate+be+in+itself+materially%2C+substantially%2C+and+in+the+nature+of+the+tenure%2C+sinful+and+unlawful%2C+so+that%2C+as+long+as+he+remains+a+heathen%2C+he+has+no+real+right+or+true+title+to+government%2C+but+only+a+pretended+and+usurped+title+%28which+must+needs+be+Mr.+Hussey%E2%80%99s+sense%2C+if+he+has+answered+anything+at+all+to+my+argument%29%2C+then+he+goes+cross+not+only+to+the+holy+men+of+God+in+the+Old+Testament%2C+who+honored+heathen+princes%2C+and+were+subject+to+them+as+to+lawful+magistrates%2C+but+also+to+the+doctrine+of+Jesus+Christ%2C+who+taught+his+disciples+to+give+unto+Caesar+what+is+Caesar%E2%80%99s%3B+and+of+the+apostles%2C+who+in+their+time%2C+exhorted+the+churches+to+be+subject+even+to+the+heathen+magistrates+%28for+they+had+no+other+at+that+time%29%2C+to+obey+them%2C+to+pray+for+them%2C+Rom.+13%3B+Titus+3%3A1%3B+1+Tim.+2%3A1-2%3B+1+Pet.+2%3A13-17.+It+is+justly+condemned+as+one+of+the+errors+of+the+Anabaptists%2C+that+a+heathen+magistrate+is+not+to+be+acknowledged+as+a+lawful+magistrate%2C+or+as+being+from+God.+See+Gerhard%2C+Loc.+Com.%2C+tom.+6%2C+p.+498-9%3B+P.+Hinkelmannus%2C+de+Anabaptismo%2C+disp.+13%2C+cap.+1+The+Scriptures+now+cited+are+so+clear%2C+that+when+Mr.+Hussey+says+of+the+heathen+magistrate%2C+%E2%80%98Let+Baal+plead+for+himself%2C%E2%80%99+he+might+as+well+have+said%2C+that+Christ+and+his+apostles+pleaded+for+Baal.+They+that+plead+for+the+authority+of+a+heathen+magistrate+do+not+plead+for+Baal%2C+but+for+God%2C+and+for+his+ordinance%3B+%E2%80%98For+the+powers+that+be+are+ordained+of+God%2C%E2%80%99+says+Paul%2C+speaking+even+of+the+heathen+magistrates%2C+Rom.+13%3A1.+But+what+will+Mr.+Hussey+say%2C+if+his+great+master+Erastus+be+found+a+pleader+for+Baal+as+much+as+I+am%3F+Confirm.+Thes.%2C+lib.+3%2C+cap.+2%2C+p.+184%2C+speaking+of+the+heathen+and+unbelieving+magistrates%2C+before+whom+the+Corinthians+went+to+law+one+against+another%2C+he+says%2C+%5Bcontains+Latin%5D%2C+Is+not+the+ungodly+magistrate+also+preferred+by+God%2C+that+he+may+defend+any+of+his+subjects+from+injury+and+violence.+Yea%2C+the+Scriptures+afore+touched+are+so+clear+in+this+point%2C+that+Gamachaeus%2C+in+Primam+Secundae%2C+quest.+4-5%2C+cap.+33%2C+though+he+hold+that+by+human+and+ecclesiastical+right%2C+pagan+princes+lose+their+dominion+and+authority+over+their+subjects+when+their+subjects+turn+Christians%2C+yet+he+acknowledges+that+they+still+retain+their+former+jurisdiction+over+those+subjects+by+the+law+of+God+and+nature.+Surely+one+might+as+well+say%2C+that+heathen+parents+are+unlawful%2C+and+heathen+husbands+are+unlawful+%28all+which+were+contrary+to+the+Word+of+God%29%2C+as+to+say+that+heathen+magistrates+are+unlawful.+Take+the+instance+in+parents%3B+for+all+lawful+magistrates+are+fathers+by+the+fifth+commandment%3A+Does+the+paternity+of+a+heathen+father+differre+specie+%5Bdiffer+in+kind%5D+from+the+paternity+of+a+Christian+father%3F+are+they+not+both+lawful+parents%2C+being+made+such+by+God+and+nature%3F+are+not+their+children+bound+to+honor+them%2C+and+be+subject+to+them%2C+and+obey+them+in+things+lawful%3F+The+paternity+is+the+same+in+se+%5Bin+principle%5D%2C+but+different+modaliter+%5Bin+way%5D%2C+that+I+may+borrow+a+distinction+from+Mr.+Hussey.+The+Christian+father+is+sanctified%2C+and+qualified+to+do+service+to+Jesus+Christ%2C+as+a+father%2C+in+educating+his+children+Christianly%2C+which+a+heathen+father+cannot+do.+The+heathen+magistrate+and+the+Christian+magistrate+are+both+lawful+magistrates%2C+being+made+such+by+God+and+nature%2C+or+by+election+of+people.+They+are+both+of+them+to+be+honored%2C+submitted+unto%2C+and+obeyed%3B+they+are+both+of+them+the+ministers+of+God+for+the+good+to+their+people%3B+their+power+is+the+same+in+actu+signato+%5Bthe+intent+of+power%5D%2C+though+not+in+actu+exercito+%5Bin+how+the+power+is+actually+exercised+in+specific+acts%5D.+The+heathen+magistrate+may+do%2C+and+ought+to+do%2C+what+the+Christian+magistrate+does%3B+but+the+Christian+magistrate+is+fitted%2C+qualified%2C+enabled%2C+and+sanctified+to+glorify+and+serve+Jesus+Christ+as+a+magistrate%2C+which+the+heathen+magistrate+is+not.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Aaron%E2%80%99s+Rod+Blossoming%2C+bk.+2%2C+ch.+7%2C+pp.+107-8+Gillespie+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbed99c3371.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bed99c3371.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=My%20arguments%20against%20the%20derivation%20of,which%20the%20heathen%20magistrate%20is%20not&amp;text=My%20arguments%20against%20the%20derivation%20of%20magistracy%20from&amp;text=a%20magistrate%2C%20which%20the%20heathen%20magistrate%20is%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>

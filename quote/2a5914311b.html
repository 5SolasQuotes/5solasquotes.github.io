<main class="wrap"><figure class="quote" id="q-2a5914311b" data-kw="">
<blockquote><p>Once more; Will God honour them that honour him? Oh be persuaded to imitate God, and do you so also. See you a man that makes it his business to honour God; Oh set a price on such an one, let such an one be the man whom the Parliament will honour. Good men will do so, it is the Character of the good man in the 15. Psal. 4. to honour such, God himself will honour such, and can you possibly write after a better copy?

Yea, and honour men, because God honours them. Surely God hath exceedingly honoured some men of late, hath blessed them wonderfully, hath given them admirable success, and the enemy hath come down mightily before them; God in all this hath eminently honoured them; now let no man think much to honour them also.

Let no man say, as that Bishop did of Luther’s Reformation, He did not much dislike the thing, but that none but a base, obscure Monk should be the chiefest promoter of it, this he could not think of with any patience. Beloved, God will take it well that those that are his favourites should be ours too, and when he sets himself to honour any, it will be our wisdom not to shew our selves backward to honour them also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-woodcock.html">Francis Woodcock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex talionis: or, God paying every man in his own coin. Held forth in a sermon preached at Margaret’s Westminster, before the Honourable House of Commons, on their solemn fast, July 30th, 1645</cite>, (London: Christopher Meredith, 1646), pp 21-22.</span></figcaption>

</figure><figure class="quote" id="q-26878d10ee" data-kw="">
<blockquote><p>There follows the other part of the disputation on merit, in which we must discuss “what and how many conditions are necessary for a work to be called truly and properly meritorious of eternal happiness.” … Seven conditions in all seem to be required, three of which are granted by all, while the other four are in controversy. The first condition is that it be a good work. For evil works do indeed merit, but punishment, not reward. … The second condition is that the good work be done in obedience to God. For merit implies a relation to a reward to be received from another; hence he who merits, merits with someone. The third, that he who merits be a wayfarer. For in this life is the race and the battle; in the next, the prize and the crown. … The fourth, that the work be not only good but also free. The fifth, that he who merits be a friend of God and pleasing to him. The sixth, that a promise intervene. The seventh, that the work proceed from the virtue of charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.10 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, p. 197</span></figcaption>

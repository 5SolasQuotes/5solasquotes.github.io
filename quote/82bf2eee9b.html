</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6201f5bc82" data-kw="">
<blockquote><p>It is an untruth which Raphael de la Torres [a Dominican Romanist], with other schoolmen say, that with the same religion by which we honor holy men, we honor God; upon this reason, because holiness in them is a participation of the divine nature, therefore God must be the intrinsical end, and formal reason for which we honor the saints. [1.] For holiness in saints is a participation of the divine nature; but it is a temporary and a created participation, it is not the same very holiness that is in God; but the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature; and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God, commanded in the First Table of the Law. 2. When I bow to the gray-haired, and to the king, I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man, that I am then bowing to the God of heaven and Worshipping God: No acts terminated upon saints living or dead are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Introduction, section 6, pp. 83-84</span></figcaption>

</figure><figure class="quote" id="q-722b31153c" data-kw="">
<blockquote><p>The sorts of this worship are twofold: 1. Solemn. 2. Common. The solemn worship is that whereto men do wholly give themselves, setting themselves apart from all other things to attend it wholly. The common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or any thing of his.</p></blockquote>

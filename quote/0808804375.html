</figure><figure class="quote" id="q-20a88fffc5" data-kw="">
<blockquote><p>Last of all, we are to distinguish between the condition of the primitive churches, before the division of parishes, and the state of our churches now after such division. At the first, when the multitude of Christians in those great cities of Rome, Corinth, Ephesus, etc. was not divided into several parishes, the common presbytery in the city did suffice for the government of the whole [as described in the N.T.], and there was no need of a particular consistory [session] of elders for every assembly and congregation of Christians within the city, except perhaps to admonish, rebuke or exhort, or to take notice of such things as were to be brought into the common presbytery. But after that parishes were divided, and Christian congregations planted in the rural villages, as well as in the cities, from henceforth it was necessary that every congregation should have at hand, within itself, a certain consistory, for some acts of church government, though still those of greater importance were reserved to the greater presbytery… If it be said that I seem to deny the divine right of the same, or that they have any warrant from the pattern of the apostolic Church, I answer: I acknowledge the conformity of the same with the pattern thus far:

1. It is to be suposed that in some small cities (especially the same not being wholly converted to the Christian faith) there was but one Christian congregation, the eldership whereof did manage matters of jurisdiction proper thereto.

2. Even in the great cities, at the first there was but one congregation of Christians, and so but one particular eldership.

3. After that the Gospel had spread, and Christians were multiplied in those great cities, it is true, they were all governed by a common presbytery, but that presbytery was not remote, but ready at hand among themselves. Now in this we keep ourselves as close to the pattern, as the alteration of the Church’s condition by the division of parishes will suffer us, that is to say, we have a common presbytery for governing the congregations within a convenient circuit, but withal our congregations have, ad manum, among themselves, an inferior eldership for lesser acts of government; though in respect of the distance of the seat of the common presbytery from sundry of our parishes, they cannot have that ease and benefit of neareness which the apostolic Churches had, yet by the particular elderships they have as great ease of this kind as conveniently can be.</p></blockquote>

</figure><figure class="quote" id="q-db1e04fa84" data-kw="">
<blockquote><p>1. Particular converts are first converted into the Church-catholic entitive, and secondarily conjoined into particular consociations, for the more opportune enjoyment of ordinances actually and constantly.

2. Every member of a particular congregation is a member of the Church-catholic entitive, and that relation does primarily belong unto him.

3. External profession of the true faith and subjection to God’s ordinances is enough to make a man capable of being a member of the Church-catholic visible, and so also of a particular congregation, quoad externam formam [as far as the external form].

4. By baptism members are visibly and ministerially admitted into the Church-catholic visible.

5. By excommunication rightly administered, an offender is cast out of the Church-catholic visible, as much as out of a particular congregation.

6. Federal holiness belongs to none primarily because [they are] born of members of a particular congregation, but [rather as they are] of the Church-catholic.

7. They that are only in the Church-catholic visible are not ‘without’ in the apostle’s sense [1 Cor. 5:12].

8. Children of believing parents have right to baptism, though their parents were not members of any particular congregation, and [they] are debarred from their due if [they are] denied it.

9. Every visible believer is or ought to be a member of the particular Church wherein and among whom he dwells. [This ought to be qualified by regular circumstances conducing to edification.]

10. The being in the general Covenant [of Grace] gives right to the ordinances, and not any particular covenant; neither do we find any mention in Scripture of any particular covenant either urged or used at admission of members into a particular congregation, or at the constitution thereof.

11. The invisible members of the Church which have internal communion with Christ are also visible members and have external communion in external ordinances.

12. The departure of a member from a particular congregation and removal to another for convenience or by necessity is no sin; but departing from the Church-catholic, and ceasing to be a member thereof, is a sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Essence &amp; Unity of the Church catholic, Visible, &amp; the Priority Thereof in Regard of Particular Churches, in Answer to the Objections made Against it</cite>, in Question 2, ‘Concerning Private Members’, pp. 257-8 of A Vindication of the Essence &amp; Unity of the Church catholic, Visible, &amp; the Priority Thereof in Regard of Particular Churches, in Answer to the Objections made Against it… (London, 1650)</span></figcaption>

whom+he+dwells.+%5BThis+ought+to+be+qualified+by+regular+circumstances+conducing+to+edification.%5D+10.+The+being+in+the+general+Covenant+%5Bof+Grace%5D+gives+right+to+the+ordinances%2C+and+not+any+particular+covenant%3B+neither+do+we+find+any+mention+in+Scripture+of+any+particular+covenant+either+urged+or+used+at+admission+of+members+into+a+particular+congregation%2C+or+at+the+constitution+thereof.+11.+The+invisible+members+of+the+Church+which+have+internal+communion+with+Christ+are+also+visible+members+and+have+external+communion+in+external+ordinances.+12.+The+departure+of+a+member+from+a+particular+congregation+and+removal+to+another+for+convenience+or+by+necessity+is+no+sin%3B+but+departing+from+the+Church-catholic%2C+and+ceasing+to+be+a+member+thereof%2C+is+a+sin.%E2%80%9D%0A%0A%E2%80%94+Samuel+Hudson%2C+A+Vindication+of+the+Essence+%26+Unity+of+the+Church+catholic%2C+Visible%2C+%26+the+Priority+Thereof+in+Regard+of+Particular+Churches%2C+in+Answer+to+the+Objections+made+Against+it%2C+in+Question+2%2C+%E2%80%98Concerning+Private+Members%E2%80%99%2C+pp.+257-8+of+A+Vindication+of+the+Essence+%26+Unity+of+the+Church+catholic%2C+Visible%2C+%26+the+Priority+Thereof+in+Regard+of+Particular+Churches%2C+in+Answer+to+the+Objections+made+Against+it%E2%80%A6+%28London%2C+1650%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb1e04fa84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db1e04fa84.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=1.%20Particular%20converts%20are%20first%20converted,a%20member%20thereof%2C%20is%20a%20sin&amp;text=1.%20Particular%20converts%20are%20first%20converted%20into%20the&amp;text=to%20be%20a%20member%20thereof%2C%20is%20a%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

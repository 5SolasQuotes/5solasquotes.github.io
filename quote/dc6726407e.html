<main class="wrap"><figure class="quote" id="q-dc6726407e" data-kw="">
<blockquote><p>4. [John] Robinson [a Separatist] and our [Independent] Brethren acknowledge that the Church of Rome hath true baptism, for ‘they retain the essential causes of baptism, even as the vessels of the Lord’s house profaned in Babylon may be carried back to the Temple, but if these vessels were broken and mingled with brass and iron, and cast in another mold, they could not obtain their former place in the Temple. Baptism is a vessel profaned in Babel, but not broken; but the ministry and priesthood of Rome is like the new melted and mingled vessel, and essentially degenerated from the office of pastorship.’ But I answer, [1.] if baptism be valid in Rome so are the ministers baptizers, for if the ministers and priests be essentially no ministers, the baptism administrated by the Romish priests is no ministry, and [that would be] all one as [if it were] administrated by midwives and private persons, who therefore cannot administrate the sacraments validly in the essential causes, because they are essentially no ministers. If therefore Robinson will have the Romish priesthood essentially no ministry, by that same reason he must say, baptism administrated by Romish priests is no baptism, the contrary whereof he confesses: otherwise he must say baptism administrated, a non habente potestatem [by one not having the power], even by women and private men, is valid, and cannot be but esteemed lawful in the substance of the act. 2. These have a ministry essentially entire who have power under Christ to preach the Gospel and administrate the sacraments, Mt. 28:19. The Romish priests have this, and are called to this by the Church. … I answer, [1.] England may well separate from Rome everting the fundamental parts of faith, and not separate from Rome’s baptism, or ministry, in so far, as they be essentially the ordinances of Christ… 2. A ministry true in the essence may make a Church true, insofar; but because of many other substantial corruptions in Rome, it is a Church which we ought to forsake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 235-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

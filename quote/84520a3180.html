<blockquote><p>…the word… ‘Christ died for all‘ does never signify all and every one of mankind, by neither Scripture, nor the doctrine of adversaries: but is, as all divines say, to be expounded according to the subject in hand, secundum materiam substratam. Hence our 1st Rule, ‘All’ often signifies the most part, Mk. 1:64, ‘they all condemned him to be guilty of death,’ ‘the whole counsel,’ Mt. 26:59, yet Joseph of Arimathea consented not to his death, Lk. 23:51, and the flood destroyed them ‘all,’ Lk. 17:27, yet eight persons were saved; so ‘all Judah,’ Jer. 13:19, was carried into captivity. ‘All’ is often the same with many, ‘all the sheep of Kedar shall be gathered to thee,’ that is many, and Gen. 41, ‘and all the land came to Egypt,’ when the matter bears a clear exception, and other Scriptures expound it; then sure Christ’s dying for all must be expounded for his giving Himself a ransome for many, Mt. 20:28, compared with 1 Tim. 2:6… [Rule] 2. All skilled in the mother languages, and all divines say that the particle ‘ali’ [in Greek] is taken pro singulis generum, vel pro generibus singulorum; ‘all and every one of kinds, and for the kinds of all,’ though not absolutely excluding any kind. 1. The word ‘all’ is in materia necessaria, ‘in a necessary matter,’ taken for all and every one. ‘God made all nations of one blood,’ Acts 17:26. He ‘knows the hearts of all men,’ Acts 1:24; Rom. 3:12, ‘All have sinned,’ Rom. 5:12; 2 Cor. 5:10; 1 Tim. 4:10; Jam. 1:5; Phil. 2:10-11. 2. All without exclusion of particular men in a contingent matter is sometimes so taken, Mt. 26:33, ‘Though all be offended,’ Lk. 6:26; Rev. 4:26. 3. When ‘all’ is spoken of God’s works for men, or in men, especially works of mere grace opposite to men’s works: ‘all men,’ then is not taken in the largest sense, as Mr. Moor imagines: So our text; ‘I when I am lifted up from the earth, will draw all men to Me,’ cannot be meant of all men without exception: 1. Because it’s a clear restriction of calling of multitudes under the Messiah’s Kingdom after his death, and cannot but speak against a universal drawing in the times of the Old Testament. 2. Christ draws not all to Himself by the Gospel, because thousands hear not of Him; not virtually, for we read of no calling or drawing of Christ lifted up on the cross and crucified by the works of Nature: So God blesses all nations, not all and every one; God saves all Israel and turns away iniquity from Jacob, and forgives the sins of Israel; and God only saves, and only pardons believers. But will Mr. Moor say, God saves and pardons all and every man in Israel? Rule 3. There is hence a third rule, that ‘many’ is placed for all the elect, as Mt. 10:28, He ‘gave Himself a ransom for many.’ Mk. 14:14, ‘This is my blood of the New Testament, that is shed for many,’ as Rom. 5:15, ‘Through the offence of one, many were dead,’ that is, all were dead: So the sheep of Christ, Jn. 10:11, the scattered sons of God, Jn. 11:52, his people, Mt. 1:21, his brethren, Heb. 2, that he died, ‘for,’ must be exclusive of those that are not his sheep, not his brethren, not his people, not the sons of God… Rule 4. In the matter of our redemption, especially in the New Testament and prophecies of the Old of the same subject, Christ died for all, pro generibus singulorum, for men of all nations, some of all kinds… Rule 5. [Greek] or [Greek] is undeniably expounded of all that are saved only and is restrictive; such a physician cured all the city; that is, no man is cured but by him. Ex. 28:•4, Jethro says to Moses, ‘What is this that thou doest? thou sittest alone and all the people stand by thee from morning till evening,’ (for judgement)… Num 11:13 and his words bear not that all the people without exception came for judgment, that had been unpossible; but because there was then no other judge but Moses, the sense is cleare; all that were to be judged, they were to be judged by no other but by Moses only. Rev. 13:8, ‘And all that dwell in the earth worshipped the beast,’ that is, all seduced to Popish idolatry were seduced by the beastly vicar of Christ and his limbes; Jn. 11:48, ‘If we let him alone, all will believe in him;’ that is, none will believe in us, nor follow us; and all seduced men, shall be seduced by him… That Christ in this sense should be the Savior of all men, that He should have a negative voice in the salvation of all, that all the ransomed ones should come through his hands, is no other thing than Peter says, Acts 4:11, ‘That there is no other name under heaven by which men may be saved,’ and none comes to the Father, but by him, Jn. 14:6…</p></blockquote>

t+the+sons+of+God%E2%80%A6+Rule+4.+In+the+matter+of+our+redemption%2C+especially+in+the+New+Testament+and+prophecies+of+the+Old+of+the+same+subject%2C+Christ+died+for+all%2C+pro+generibus+singulorum%2C+for+men+of+all+nations%2C+some+of+all+kinds%E2%80%A6+Rule+5.+%5BGreek%5D+or+%5BGreek%5D+is+undeniably+expounded+of+all+that+are+saved+only+and+is+restrictive%3B+such+a+physician+cured+all+the+city%3B+that+is%2C+no+man+is+cured+but+by+him.+Ex.+28%3A%E2%80%A24%2C+Jethro+says+to+Moses%2C+%E2%80%98What+is+this+that+thou+doest%3F+thou+sittest+alone+and+all+the+people+stand+by+thee+from+morning+till+evening%2C%E2%80%99+%28for+judgement%29%E2%80%A6+Num+11%3A13+and+his+words+bear+not+that+all+the+people+without+exception+came+for+judgment%2C+that+had+been+unpossible%3B+but+because+there+was+then+no+other+judge+but+Moses%2C+the+sense+is+cleare%3B+all+that+were+to+be+judged%2C+they+were+to+be+judged+by+no+other+but+by+Moses+only.+Rev.+13%3A8%2C+%E2%80%98And+all+that+dwell+in+the+earth+worshipped+the+beast%2C%E2%80%99+that+is%2C+all+seduced+to+Popish+idolatry+were+seduced+by+the+beastly+vicar+of+Christ+and+his+limbes%3B+Jn.+11%3A48%2C+%E2%80%98If+we+let+him+alone%2C+all+will+believe+in+him%3B%E2%80%99+that+is%2C+none+will+believe+in+us%2C+nor+follow+us%3B+and+all+seduced+men%2C+shall+be+seduced+by+him%E2%80%A6+That+Christ+in+this+sense+should+be+the+Savior+of+all+men%2C+that+He+should+have+a+negative+voice+in+the+salvation+of+all%2C+that+all+the+ransomed+ones+should+come+through+his+hands%2C+is+no+other+thing+than+Peter+says%2C+Acts+4%3A11%2C+%E2%80%98That+there+is+no+other+name+under+heaven+by+which+men+may+be+saved%2C%E2%80%99+and+none+comes+to+the+Father%2C+but+by+him%2C+Jn.+14%3A6%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+pp.+422-30+of+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84520a3180.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84 <blockquote><p>Hence in vain is alleged [by Socinians]: 1. The innocence of Christ, as if it impeded his right of bearing our punishments (Socinus, part 3, ch. 9). For Christ himself professes that he has the right of laying down his life and that he lays it down for his sheep (John 10:15,18). But it rests on this, that God made him, our sponsor (Heb 7:22), to be sin for us, imputatively, that he might be pressed by the exactions of our debts (as the word אָשָׁם indicates), that is, that he might pay our penalties (Isa 53:7), which same thing is most clearly suggested when Christ is said to have suffered ὑπὲρ ἡμῶν, that is, in our place and stead. When therefore he is said to have been made a curse for us in order to remove the curse from us (Gal 3:13), why should we doubt his most rigid and strict satisfaction in our place? I admit indeed that the word ὑπὲρ sometimes has a wider sense and is joined with such a verb by which some benefit is said to be procured for another, as Paul says that he suffered for (ὑπὲρ) the church of God (Eph 3:1,13, Col 1:24), which Volkelius objects to (ibid.). But I say that when Scripture speaks of the sufferings of Christ, it indicates by it such a substitution by which Christ took upon himself the punishments to be borne by us, concerning which Paul, discussing them, denies that he [Paul] was crucified for the Corinthians (1 Cor 1:13). And certainly Socinus himself (ibid.) says that God manifested true justice concerning the innocent Christ, and Scripture says that peace and salvation flow to us from his sufferings (Isa 53:5). Let the good man explain to us here punishment without respect to sin, and free God from cruelty according to his view, [God] who burdened his most beloved and innocent Son with such great and dire torments, and indeed with justice administering it, if to punish the innocent for the guilty is a sign of utmost cruelty, as the Socinian axiom has it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Hence in vain is alleged [by Socinians]: 1. The innocence of Christ, as if it impeded his right of bearing our punishments (Socinus, part 3, ch. 9). For Christ himself professes that he has the right of laying down his life and that he lays it down for his sheep (John 10:15,18). But it rests on this, that God made him, our sponsor (Heb 7:22), to be sin for us, imputatively, that he might be pressed by the exactions of our debts (as the word אָשָׁם indicates), that is, that he might pay our penalties (Isa 53:7), which same thing is most clearly suggested when Christ is said to have suffered ὑπὲρ ἡμῶν, that is, in our place and stead. When therefore he is said to have been made a curse for us in order to remove the curse from us (Gal 3:13), why should we doubt his most rigid and strict satisfaction in our place? I admit indeed that the word ὑπὲρ sometimes has a wider sense and is joined with such a verb by which some benefit is said to be procured for another, as Paul says that he suffered for (ὑπὲρ) the church of God (Eph 3:1,13, Col 1:24), which Volkelius objects to (ibid.). But I say that when Scripture speaks of the sufferings of Christ, it indicates by it such a substitution by which Christ took upon himself the punishments to be borne by us, concerning which Paul, discussing them, denies that he [Paul] was crucified for the Corinthians (1 Cor 1:13). And certainly Socinus himself (ibid.) says that God manifested true justice concerning the innocent Christ, and Scripture says that peace and salvation flow to us from his sufferings (Isa 53:5). Let the good man explain to us here punishment without respect to sin, and free God from cruelty according to his view, [God] who burdened his most beloved and innocent Son with such great and dire torments, and indeed with justice administering it, if to punish the innocent for the guilty is a sign of utmost cruelty, as the Socinian axiom has it.”

— Johannes Hoornbeeck, ‘Theological Disputation on the Satisfaction of Christ’ tr. by AI by Onku (Utrecht, 1650) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+in+vain+is+alleged+%5Bby+Socinians%5D%3A+1.+The+innocence+of+Christ%2C+as+if+it+impeded+his+right+of+bearing+our+punishments+%28Socinus%2C+part+3%2C+ch.+9%29.+For+Christ+himself+professes+that+he+has+the+right+of+laying+down+his+life+and+that+he+lays+it+down+for+his+sheep+%28John+10%3A15%2C18%29.+But+it+rests+on+this%2C+that+God+made+him%2C+our+sponsor+%28Heb+7%3A22%29%2C+to+be+sin+for+us%2C+imputatively%2C+that+he+might+be+pressed+by+the+exactions+of+our+debts+%28as+the+word+%D7%90%D6%B8%D7%A9%D6%B8%D7%81%D7%9D+indicates%29%2C+that+is%2C+that+he+might+pay+our+penalties+%28Isa+53%3A7%29%2C+which+same+thing+is+most+clearly+suggested+when+Christ+is+said+to+have+suffered+%E1%BD%91%CF%80%E1%BD%B2%CF%81+%E1%BC%A1%CE%BC%E1%BF%B6%CE%BD%2C+that+is%2C+in+our+place+and+stead.+When+therefore+he+is+said+to+have+been+made+a+curse+for+us+in+order+to+remove+the+curse+from+us+%28Gal+3%3A13%29%2C+why+should+we+doubt+his+most+rigid+and+strict+satisfaction+in+our+place%3F+I+admit+indeed+that+the+word+%E1%BD%91%CF%80%E1%BD%B2%CF%81+sometimes+has+a+wider+sense+and+is+joined+with+such+a+verb+by+which+some+benefit+is+said+to+be+procured+for+another%2C+as+Paul+says+that+he+suffered+for+%28%E1%BD%91%CF%80%E1%BD%B2%CF%81%29+the+church+of+God+%28Eph+3%3A1%2C13%2C+Col+1%3A24%29%2C+which+Volkelius+objects+to+%28ibid.%29.+But+I+say+that+when+Scripture+speaks+of+the+sufferings+of+Christ%2C+it+indicates+by+it+such+a+substitution+by+which+Christ+took+upon+himself+the+punishments+to+be+borne+by+us%2C+concerning+which+Paul%2C+discussing+them%2C+denies+that+he+%5BPaul%5D+was+crucified+for+the+Corinthians+%281+Cor+1%3A13%29.+And+certainly+Socinus+himself+%28ibid.%29+says+that+God+manifested+true+justice+concerning+the+innocent+Christ%2C+and+Scripture+says+that+peace+and+salvation+flow+to+us+from+his+sufferings+%28Isa+53%3A5%29.+Let+the+good+man+explain+to+us+here+punishment+without+respect+to+sin%2C+and+free+God+from+cruelty+according+to+his+view%2C+%5BGod%5D+who+burdened+his+most+beloved+and+innocent+Son+with+such+great+and+dire+torments%2C+and+indeed+with+justice+administering+it%2C+if+to+punish+the+innocent+for+the+guilty+is+a+sign+of+utmost+cruelty%2C+as+the+Socinian+axiom+has+it.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98Theological+Disputation+on+the+Satisfaction+of+Christ%E2%80%99+tr.+by+AI+by+Onku+%28Utrecht%2C+1650%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe320c2c7f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e320c2c7f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/atonement#:~:text=Hence%20in%20vain%20is%20alleged%20%5Bby,as%20the%20Socinian%20axiom%20has%20it&amp;text=Hence%20in%20vain%20is%20alleged%20%5Bby%20Socinians%5D%3A%201&amp;text=utmost%20cruelty%2C%20as%20the%20Socinian%20axiom%20has%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7d8442c03d" data-kw="intention elect only">
<blockquote><p>Did Christ die for each and every man universally or only for the elect? The former we deny; the latter we affirm. The question hinges upon this—not what is the nature and power of Christ’s death in itself, but what was the purpose of the Father in appointing him and the intention of Christ in undergoing it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.14.1,9</span></figcaption>

</figure><figure class="quote" id="q-2a4490c1ea" data-kw="">
<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism &amp; Evangelical Arminianism, pt. 1</cite>, Section 3, Objections [to Election and Reprobation] from the Moral Attributes of God Answered; 4. Objection from Divine Veracity, pp. 359-93</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8629105bcb" data-kw="">
<blockquote><p>THE Apostle Paul writing to Timothy, affirmeth that the holy Scripture is profitable both to teach, as also to reprove: thereby shewing that men are not only to be taught, but also often times to be reproved. For truly it is manifest, that men are so corrupt, that they do not only remain in ignorance of the truth, even as it were in a palpable and thick darkness, but also for the most part, they hate &amp; fly the light of the same. And although both are greatly to be lamented, yet it is better to have to do with those which are ignorant and willing to learn, then with them which are delighted with their blindness and ignorance: because it is a great deal more tolerable to be ignorant, then not to be willing to learn.

Whereby it cometh to pass, that because the ministers and the instructors of the congregations, must have to do with both these kind of men, they are therefore willed by the Apostle to be such, as should hold fast the word of truth: so that they should be able to instruct by wholesome doctrine, and also to confute the gain-sayers thereof. And as touching these two points in the true Preacher, when Augustine had disputed and compared the one with the other: It is an easy matter (saith he) to declare what we ought to believe, what we ought to hope for, and what we ought to love: but to defend the truth, and repel the wicked opinions of others which think to the contrary, is the greater and better part of learning.

These are Augustine’s words: The which [true] they are, experience it self long time since hath taught us: for what great troubles the godly fathers of the Church had in times past with the old heretics, and chiefly with those which did excel in the sophistical and litigious kind of disputation, we may easily see by the writings of the catholic Doctors, and those which on our part did enter into that sharp conflict of disputation, better furnished, to wit, armed with weapons of good learning, dispersed without any great ado, the thick mists of sophistical disputation, by the manifest light of the truth.</p></blockquote>

</figure><figure class="quote" id="q-d0d3f5904a" data-kw="">
<blockquote><p>Although it has been sadly forgotten in recent times, the Covenanter position is that those who dissent from the doctrine and order of the Reformed Presbyterian Church cannot be accepted into communicant membership or admitted to the Lord’s Table. Alexander McLeod explains the rationale for this below:

174. How many kinds of censurable offences are there?

The scandalous offences are of three kinds:- heresy, which consists in maintaining errors contrary to the subordinate standards of the Church, and to the holy scriptures [Rom. 16:17] – Immorality [1 Cor. 5:11] and contempt of Church-order, which consists in untenderness to brethren, neglect of ordinances, disrespect to the ministry, and resistance to the authority of the Church [2 Thess. 3:6].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-mcleod.html">Alexander McLeod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ecclesiastical catechism, being a series of questions relative to the Christian church stated and answered with the scripture proofs</cite>, (3rd edn, New York, 1831), p. 94.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<main class="wrap"><figure class="quote" id="q-14decec7e5" data-kw="">
<blockquote><p>Therefore, O Lord, thou art not only that than which a greater cannot be conceived, but thou art a being greater than can be conceived. For, since it can be conceived that there is such a being, if thou art not this very being, a greater than thou can be conceived. But this is impossible.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-334c77873e" data-kw="">
<blockquote><p>…there is more than one way in which a thing is said in the heart or conceived. For, in one sense, an object is conceived, when the word signifying it is conceived; and in another, when the very entity, which the object is, is understood. In the former sense, then, God can be conceived not to exist; but in the latter, not at all. For no one who understands what fire and water are can conceived fire to be water, in accordance with the nature of the facts themselves, although this is possible according to the words. So then, no one who understands what God is can conceive that God does not exist; although he says these words in his heart, either without any or with some foreign signification. For, God is that than which a greater cannot be conceived. And he who thoroughly understands this, assuredly understands that this being so truly exists, that not even in concept can it be non-existent. Therefore, he who understans that God so exists, cannot conceive that he does not exist. I thank thee, gracious Lord, I thank thee; because what I formerly believed by thy bounty, I now so understand by thine illumination, that if I were unwilling to believe that thou does exist, I should not be able not to understand this to be true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anselm.html">Anselm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proslogium, or ‘Discourse’ on the Existence of God ToC in St. Anselm: Proslogium; Monologium; an Appendix in behalf of the Fool by Gaunilon</cite>, … tr. Sidney N. Deane (Chicago: Open Court Publishing Co., 1903), ch. 4, p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-f604592be6" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The fifth way is taken from the governance of the world. We see that things which lack intelligence, such as natural bodies, act for an end, and this is evident from their acting always, or nearly always, in the same way, so as to obtain the best result. Hence it is plain that not fortuitously, but designedly, do they achieve their end. Now whatever lacks intelligence cannot move towards an end, unless it be directed by some being endowed with knowledge and intelligence; as the arrow is shot to its mark by the archer. Therefore some intelligent being exists by whom all natural things are directed to their end; and this being we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2ab7421dd5" data-kw="">
<blockquote><p>All natural and unregenerate men function entirely within the context of the covenant of works, and regardless of what their religious mindset may be, their singular objective is to be justified before God by their own merits and by the works of the law. Therefore, if they hear any mention made of a covenant that is purely and freely gracious in and through the crucified surety and mediator Christ Jesus, or if they are directed to anything other than this covenant of grace and to this mediator, being called upon to lay aside and fully to forsake all their own strength and righteousness, and admonished from the Holy Scriptures that they are to believe alone in Him who justifies the ungodly because they are unable to accomplish anything themselves—I say, the moment this occurs, these people are of the opinion that such a faith will render them careless, whereby sin will then necessarily have dominion over them. Natural men have always thus judged the doctrine of salvation by grace alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life &amp; Death</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (Grand Rapids: Reformation Heritage Books and Dutch Reformed Translation Society, 2016), Lord’s Day 32.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

d it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-874faebf03" data-kw="">
<blockquote><p>God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfill it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 93</span></figcaption>

</figure><figure class="quote" id="q-4df24fc1d8" data-kw="">
<blockquote><p>It therefore now appears, that as the law or dictates of pure nature, comprehended together with other fit additionals, became at first one entire constitution aptly suited to the government of man in his innocent state, unto which the title did well agree of the law or covenant of works: so the same natural dictates, transcribed and made express (because now sullied, and not so legible in the corrupted nature of man) do, with such allays [alleviation] and additions as the case required, compose and make up the constitution which bears the title of the law or covenant of grace, or the law of faith, or the gospel of Christ; and is only suitable to the state of man lapsed and fallen, as the measure of that righteousness which he is now to aim at, and aspire unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessedness Of The Righteous Opened</cite>, (London, 1668), 26–27.</span></figcaption>

</figure><figure class="quote" id="q-9d70bdab9d" data-kw="">
<blockquote><p>Let us take a watchword from holy and learned Rutherford: ‘We would beware (says he) of Mr. Baxter’s order of setting repentance and works of new obedience before justification; which is indeed a new covenant of works.’1 1. See Influences of the Life, etc. p. 346</p></blockquote>

</figure><figure class="quote" id="q-20ee32ad01" data-kw="">
<blockquote><p>XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, (4.4.48), trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 188.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<main class="wrap"><figure class="quote" id="q-84003b4470" data-kw="">
<blockquote><p>Besides, do not our divines require that the Church’s canons, even in matters of rite, be ‘profitable to the edification of the Church’ (Polanus, Syntagma, bk. 7, ch. 17); and that the observation of the same, must carry before it a manifest utility (Calvin, Institutes, bk. 4, ch. 10, §32); that in rites and ceremonies the Church has no power to destruction, but only to edification? (Chemnitz, Examination, part 2, p. 121)… Do they not teach that no idle ceremony, which serves not unto edifying, is to be suffered in the Church (Paraeus, on 1 Cor. 14:26; John Calvin, Epistolarum &amp; Responsorum, col. 478); and that godly bretheren are not holden to subject themselves unto such things as they perceive neither to be right nor profitable? (Calvin, on 1 Cor. 10:23; Taylor on Titus 1:15, p. 295) That whatsoever either would scandalize our brother, or not be profitable to him for his edification, Christians for no respect must dare to meddle with it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (Edinburgh, 1637) | pt. 2</cite>, ch. 1, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646), Appendix, Question 1</cite>, pp. 6-7</span></figcaption>

</figure><figure class="quote" id="q-90e3438abf" data-kw="">
<blockquote><p>Out of all which, I conclude that no law as a law does oblige the conscience, but that which has from the matter moral equity, and not from the intention of the lawgiver, as Cajetan, Silvester, Angelus and Corduba teach, which intention must take a rule from the matter of the law, and not give a rule. Gerson, no law (says he) is a law to be called as necessary to salvation (as all good laws should be) but that which de jure divino, is according to God’s law… And therefore his [Durandus’s] mind is that all obligation of conscience in human commandments comes from God’s will and law, that is, from the just and necessary matter of the law, not from the will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, Ch. 2, Question 2; p. 205</span></figcaption>

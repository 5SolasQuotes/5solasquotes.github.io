<main class="wrap"><figure class="quote" id="q-9af95198b7" data-kw="">
<blockquote><p>It is an undeniable historical fact that non-canonical songs were excluded from the Geneva services and that this sate of affairs was due to Calvin’s influence and desire… He took great pains to put together a psalter for use in Strasbourg, translating a number of the psalms himself. He included no hymns, and that in spite of the fact that the congregational singing of hymns was an established ordinance in Strasbourg. He borrowed some of the German tunes but none of the lyrics, and the choice must have been deliberate. There is also the fact that, throughout its long history of development, the Geneva Psalter never included a single hymn. The only possible exception to this would be the inclusion of a metrical version of the Apostle’s Creed in the first edition of Calvin’s Geneva Psalter (1542). The Creed, however, was in a different category from either hymns or biblical songs… In any event, the Creed was not present in the final and authoritative version of the psalter (1562). …it must be kept in mind that, ’till the middle of the seventeenth century it was the current belief of Roman Catholic and Protestant Christendom that the Apostle’s Creed was ‘Membratim articulatimque‘ composed by the Apostle’s in Jerusalem on the day of Pentecost…’ (Schaff, Creeds, vol. 1, p. 22) Calvin himself prefers to leave the question of authorship open… In his catechism Calvin says, ‘It is commonly called the Apostle’s Creed, because from the beginning of the church it came from the lips of the Apostles or was faithfully collected from their writings.’ (Theological Treatises, p. 92) The Apostles’ Creed was thus seen by Calvin as having Apostolic sanction, if not authority, and as deriving directly from the Apostolic age, if not from the hands of the Apostles themselves. It was in his view a creed that had the honor and respect attending its use in the Church for some 1,500 years. Should we then be surprised to find that Calvin included a metrical version of such a creed in his psalter? It is unfortunate that he did so, but we can certainly see reasons for his having done so, which ultimately have nothing to do with whether the Apostles’ Creed is inspired. Certainly there is a wide difference between the inclusion of such a creed in the psalter and the inclusion of contemporary hymns, which is something that Calvin never did…. the final and complete version of the Genevan Psalter (1562) did not contain a metrical version of the Apostles’ Creed. Whatever reasons Calvin had for including the creed in the first place, he evidently changed his mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvin &amp; the Origin of Reformed Psalmody’ in Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, pp. 179-81.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c555918365" data-kw="">
<blockquote><p>The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…</p></blockquote>

</figure><figure class="quote" id="q-4842eb8ff8" data-kw="">
<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>152 Lectures upon Psalm 51… (London, 1635), Lecture 1, p. 4-5 This section is occasioned upon the title of Ps. 51, that it is a psalm of David ‘to the chief musician’.</cite></span></figcaption>

<blockquote><p>Some promoters of singing hymns may differ with the [OPC] majority and minority reports, alleging that perhaps the phrase “singing of psalms” in the Westminster Confession of Faith may not mean that only psalms are to be employed in public worship. Some Presbyterians have argued that the term ‘psalms,’ being a lower case ‘p’ might refer to psalms and hymns. In the original 1648 edition of the Westminster Directory for the Publick Worship of God, the upper case ‘P’ in the term ‘Psalms’ was consistently used;¹ but regardless of which edition is used with consistent upper or lower case, it will make no difference to the true intent of the writers and signers of the Westminster Standards. The following Westminster documents consistently speak of singing psalms, with no mention of hymns: Westminster Confession of Faith (ch. XXI, sec. V), Westminster Form of Presbyterial Church Government (Of the Ordinances in a particular Congregation), and the Westminster Directory for the Publick Worship of God (Of the Sanctification of the Lord’s Day, Of Singing of Psalms). Acknowledging historic Presbyterian familiarity with the Synod of Dordrecht Church Order (1618-19) and the distinction made between psalms and hymns, in all fairness to legislative intent interpretation, the ‘psalms’ or ‘Psalms’ in the Westminster Standards must be biblical psalms of praise. ¹ The Westminster Standards, An Original Facsimile (Audubon, New Jersey: Old Paths Publications, 1997) In the later editions of the Westminster Standards, biblical psalms of praise, were commonly referred to as ‘psalms.’ In the reading of the Scriptures, in The Westminster Directory for the Publick Worship of God, it references exposition of the portion of Scripture read: “let it not be done until the whole chapter of psalm be ended” (Of Public Reading of the Holy Scriptures). Regarding public preaching, it speaks of some ‘text of scripture’; it further orders the use of “some chapter, a psalm, or book of the holy scripture” (Of the Preaching of the Word). In the Directory for the Publick Worship of God, there are parallel and coordinate directives to read or sing a ‘psalm,’ but no directive to sing a hymn. We find this same employment of the term ‘psalm’ or ‘psalms’ in the Authorised King James Version to refer to the Book of Psalms (see Luke 24:44). The London or Baptist Confession of Faith (1689) deliberately altered section V, of the chapter, Of Religious Worship and the Sabbath Day, to read “psalms, hymns, and spiritual songs.” The Baptists understood the legislative intent meaning of the Westminster Confession of Faith to be psalms only, as Ephesians 5:19 and Colossians 3:16 are used as proof-texts for the “singing of psalms with grace in the heart” (West. Con. ch. XXI, sec. V). The Baptists, therefore, decidedly rejected the historic Westminster Presbyterian interpretation of Ephesians 5:19 and Colossians 3:16. The 17th century Westminster Presbyterians interpreted, “psalms, hymns, and spiritual songs” (Eph. 5:19; Col. 3:16) to the Book of Psalms.</p></blockquote>

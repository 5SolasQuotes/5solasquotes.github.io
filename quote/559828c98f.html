<blockquote><p>Proceeding historically through ancient, modern, and postmodern thinkers, Owen Anderson studies beliefs about the good and how it is known, and how such beliefs shape claims about the moral law.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e1150b1a98" data-kw="">
<blockquote><p>These Judicial Laws were determinations of the Moral Law. A determination is either Iuris Divini [Divine law] or Humani [human]; these determinations in Moses’ Judicial Laws are Divini Juris; therefore they had greater force to bind the Jew, than any municpal law has to bind the subjects now, in respect they were given by God Himself, and these laws of men which draw nearest to them in equity, are most perfect; although particularly they cannot be fitted to every nation, no more than a shoe of one measure can serve for every foot. … Fourthly, the punishments inflicted by human laws are alterable: so were the punishments in Moses’ Judicial Law; therefore the Jews say of them, ascendunt et descendunt [ascending and desceding], which they understand, not of the greatest and highest transgressions, but of the middle sort of transgressions, which praecepta media, their middle precepts did forbid. Example, Ex. 21:29-36, If a man kept a pushing ox, knowing that he were wont [accustomed] to push, if he kill a man, then the Law ordains that the man shall die, or else to redeem himself with a sum of money; here the law ascended or descended: but if a man had willfully killed a man, that was praeceptum grave [a grave precept], the punishment neither ascended nor descended, but he was to die the death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explication of the Judicial Laws of Moses</cite>, pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-993670cede" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?… All civil power is immediately from God in its root; in that, 1st, God has made man a social creature, and one who inclines to be governed by man; then certainly He must have put this power in man’s nature: so are we, by good reason, taught by Aristotle. 2nd, God and nature intends the policy and peace of mankind, then must God and nature have given to mankind a power to compass this end; and this must be a power of government… As domestic society is by nature’s instinct…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 1</span></figcaption>

</figure><figure class="quote" id="q-85005d587a" data-kw="">
<blockquote><p>VIII. Human Law is that which, from principles known by nature and experience, prescribes, sanctions, and commands to be observed certain particular conclusions and determinations, useful, honest, and necessary for the public and private good both of Church and Commonwealth, according to the reason and convenience of persons, things, times, places, and other circumstances: which laws, if they conflict with divine or natural right, are unworthy of the name of law, and in no way obligate the conscience of those who are subject either to observance or to punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’ (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-74b996f70a" data-kw="">
<blockquote><p>Since we have need of civil laws and the power of punishing, it will be wisest not to contemn those given by Moses; but seriously rather to consider what the meaning of God was in them, what he chiefly required, and how much it might be to the good of every nation, if they would borrow thence their manner of governing the commonwealth; yet freely all things and with the Spirit of Christ. For what Solon or Plato, or Aristotle, what lawyers or Caesars could make better laws than God? And it is no light argument, that many magistrates at this day do not enough acknowledge the Kingdom of Christ, though they would seem most Christian, in that they govern their States by laws so diverse from those of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew 5:19, as quoted by John Milton, A Complete Collection of the Historical, Political &amp; Miscellaneous Works of John Milton, vol. 1</cite>, p. 394</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

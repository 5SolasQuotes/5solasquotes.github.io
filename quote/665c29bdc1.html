<main class="wrap"><figure class="quote" id="q-665c29bdc1" data-kw="">
<blockquote><p>The Dominicans and Franciscans, the Jansenists and the Jesuits, and many others, were as directly opposed to one another, as any Protestant sects can possibly be, not on matters of form and discipline merely, but upon the most fundamental points of doctrine; yet the holy and infallible “head of Catholic unity,” acknowledged them all as branches of his family, and bestowed upon them many extensive privileges.

The Franciscans stoutly maintained that the Virgin Mary was born immaculate, while the Dominicans asserted that she came into the world under original sin, though its effects were soon removed. Thus the two great parties were not agreed about the original character of one principal object of their worship; and by their quarrel, the peace of Europe was disturbed for many a day. In later times the Jesuits and the Dominicans had a furious contest, on the subjects of fate and free-will; the latter “contending as stoutly, and at as great length in favour of God’s eternal unconditional decrees, and the absence of all moral ability in the part of man, as the rankest predestinarian, at whose heresy” W. D. and other modern Papists “affect to sneer.” …

So much for the unity of the holy and infallible church. Different sects within its bosom teach the most opposite doctrines; and they hate one another with a perfect hatred. Nothing can exceed the abhorrence with which the Jesuits speak of Jansenists, to this very day, of which see an example in the Orthodox Journal for July, 1820. The editor takes the part of the Jesuits; the more moderate and respectable of his brethren in England he calls Jansenists, and as such he abuses them, as if they were no better than the most detestable heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcgavin.html">William McGavin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Protestant. Essays on the Principal Points of Controversy between the Church of Rome and the Reformed. Volume II</cite>, (2nd American edn, Hartford: Hutchinson and Dwier, 1833), p. 47.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ac4d4d3d72" data-kw="">
<blockquote><p>Secondly; a mournful sense of Afflictions sent from God is consistent with a dutiful resignation of our selves to his Will. ‘Twas the vain boast of the Philosophers, that their Instructions would fortify Men with such magnanimous Principles, and generous Spirits, as with an equal calm tranquillity of Mind to encounter all the fierce and sorrowful Accidents to which they might be exposed here: They speak high against Fortune and Fate, and resolve stubbornly, that no misery, whether Poverty or Disgrace, Torments or Death, should extort from them a confession that it was Misery. ‘Twas one of their Axioms, That a Wise Man is not subject to the vicissitudes and instability of things here below; That he suffers no conflict of contrary Passions in his Breast; that he is always above in the Serene, where no Tempests can disturb, no Eclipse can darken his Mind: But these proud pretensions were empty of reality.

Indeed such a perfect exemption from all afflicting Passions is neither possible nor regular in our present state: not possible, for the best Men are not all Spirit, but united to Flesh; and when the Body is under strong pains, the Soul suffers in its sufferings; and while we are thus compounded, the loss of those Comforts that support and sweeten the present Life, must cause Grief. ‘Tis easy to utter brave Expressions, and lay down severe Precepts in contempt of Evils when they are at a distance, but hard to sustain the Spirit under the actual feeling of them; ’tis one thing to discourse of a Battle, and another to be engaged in the heat of it. But supposing by a Philosophical Charm the Heart were so hardened as to be proof against the most piercing afflictions, such a forced insensibility is not regular, but proceeds from the extinction of Humanity and Piety, and that will appear by considering Afflictions in a natural or moral respect.

First, in a natural respect, for so they are destructive or oppressive Evils, and a pensive feeling of them is suitable to the Law of our Creation: for the Human Nature is framed with such Senses and Passions, as according to God’s intention should be affected suitably to the quality of their objects; and if the Soul acts rationally, ’tis moved accordingly. A Saint on Earth is not a Saint in Heaven, raised above all Disasters and Troubles, freed from all hurtful impressions from without, and sorrowful impressions within, but is liable to afflicting evils: And it is becoming his Duty to have his passions pliable to his condition, but without excess; the Eyes must not be drowned, nor dry, but tenderly affected.

Secondly; Considered in a moral respect, as they are sent from the high and just Providence of God, it is absolutely necessary there should be an humble resentment of his Displeasure. This is a consequent of the former; for if our affections are seared up, that we do not feel the stroke, how shall we regard the hand that smites us? If we are not sensible of Affliction, we are secure in our Sins. Natural Sorrow is introductive of Godly Sorrow. There are two extremes to be avoided by the afflicted, according to the direction of Solomon in the person of Wisdom, and repeated by the Apostle: My Son, despise not thou the chastening of the Lord, nor faint when thou art rebuked of him.

Some are discouraged and over-born by Afflictions as insupportable: others are stubborn and careless, and never lay them to heart: they never look upward to the original efficient Cause, an Offended God; nor inward to the impulsive deserving Cause, their Sins; but esteem them fortuitous Events that happen in this mutable state, without a design to correct and reform Sinners; or to proceed from a blind necessity, things of course; or merely regard the second Causes and Instruments of their Troubles: accordingly, when they meet with Calamities, all their care is by a perverse shift to seek for relief only in Temporal Comforts; without serious applying themselves to God, whose end in sending Troubles, is to reclaim us from Sin to Holiness, from Earth to Heavens, from the Creatures to himself.

This secret Atheism, like a benumbing Opium, stupefies the Conscience; and the insensibility of God’s hand inflicting Evils, is as different from Christian Patience and Constancy, as a mortal Lethargy is from the quiet, soft Sleep of Health: Nothing kindles his Anger more than neglecting it; ’tis equally provoking with the despising of his Love: It is a symptom of a wretched state of Soul; if there proceed no sighs and groans, no signs of grief from the sense of God’s displeasure, it is a sad evidence there is no Spiritual Life. Indolence under the effects of God’s Anger, is like the stillness of the Dead Sea, whose Calm is a Curse. The Jews, though intitled the People of God, are deeply charged for this prodigious Madness; O Lord, thou hast struck them, but they have not grieved; thou hast consumed them, but they refused to receive correction: they have made their faces harder than a Rock, they have refused to return. Jer. 5. 3.

We have whole Quarries of such obdurate Wretches amongst us; this impenitent disregard of God’s hand is a dreadful presage of future and more heavy Judgments. Who ever hardened himself against the Lord, and prospered? Do we provoke the Lord to Jealousy, are we stronger than he? The most refractory Sinner he can compel to acknowledge with bitter lamentations his Wickedness, and weakness, how unable he is to contend with his Judge. But supposing a respite from Punishment here, there is an Hell prepared for stubborn Sinners, where is Weeping and Wailing for ever. Whom the Rods do not awaken, the Scorpions shall.</p></blockquote>

<blockquote><p>It is observable in the Revolution, that the People of Scotland came all into the Principles of the suffering sincere Party, the suffering Party kept their own footing, and did not go over to them; those that had thro’ Fear, or from Time-serving Principles, or from what of Zeal, or from any other weak Reason consented, and, as I may call it, taken so low a Step, as to accept of Licenses from God’s Enemies to serve Christ; asking leave of Men to Worship God; a Duty and a Debt which they had a Natural and Divine Right to, without bowing the Knee to Baal for it; I say, THESE, for from justifying or recommending the Practice, openly recognized the Zeal, Courage and Sincerity of the Sufferers, honoured them for it, and rather desired to bury their own Compliances in Silence and Forgetfulness, than to have it mentioned or remembered.</p></blockquote>

</figure><figure class="quote" id="q-ec29dc9a77" data-kw="">
<blockquote><p>Under the humiliation of Christ are especially comprehended his sufferings, i. e. all those things which Christ endured for our sins, beyond the natural inclination of his will, although he voluntarily endured them; but especially those which he suffered at the end of his life, of which we must now speak. And in order that we may do it with precision, we observe that he not only suffered in body, but also in soul, as is evident, not only from the testimony of scripture, (Matt. xxvi. 38; John xii. 27,) but also because our salvation required that the surety of those sinners who had sinned in soul and body, and to whom the law threatened not only bodily, but also spiritual and internal sufferings, should also suffer both in soul and body. We observe, also, that these sufferings were very great and grievous, though not eternal; the sinner deserved eternal suffering, but the infinite dignity of Christ’s person was an equivalent to infinity of duration.</p></blockquote>

<blockquote><p>I believe that God never expects us to feel no suffering or pain when it pleases Him to visit us with affliction. There are great mistakes upon this point. Submission to God’s will is perfectly compatible with intense and keen suffering under the chastisements of that will. Troubles in fact not felt, are no troubles at all. To feel trouble deeply, and yet submit to it patiently is that which is required of a Christian.</p></blockquote>

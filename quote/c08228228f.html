<blockquote><p>This covenant [of grace] was established immediately after the Fall of man. From that time forward it has been repeated, albeit rather obscurely under the law and, in truth, more openly under grace. This covenant of grace is understood, indeed, in several words; that is, in the promise of justice and life held forth under the condition of faith.

But God, in consideration of our faith, willed this covenant of grace to be declared and explained more extensively in his Gospel, just as the covenant of works was explicated in the doctrine of the law. And so in the Gospel, and primarily in the new testament (as it is called), we learn about Jesus Christ the Mediator, about his humiliation and his glorification, and finally about the benefits promised in the covenant — remission of sins, justification, sanctification, eternal life.

And so the Gospel which we hold in our hands, and the whole preaching of that Gospel, is nothing other than the doctrine of God’s gratuitous covenant declared and explained more extensively and fully. And so Paul, in Rom. 10, summarizes that word of faith, that is, the Gospel, in these words: ‘If you confess with your mouth the Lord Jesus, and believe in your heart that God has raised him from the dead, you will be saved.’

From this it is apparent that the entire doctrine of the Gospel is reducible to this covenant and the promise which it contains; and thus the Gospel is nothing other than a fuller explication of the covenant. But if someone cuts himself off from this covenant of grace, no further sacrifice remains for that man; indeed, this would be to demand a new mediator (Heb. 6:6; 10:26).</p></blockquote>

<blockquote><p>By which righteousness of Christ we are justified XI. Since, moreover, a twofold righteousness is observed in Christ—an essential righteous, as much of the divine as of the human nature, with which he was born (Luke 1:35); and a righteousness procured or acquired during his life on earth—so that we may more easily understand by which righteousness of Christ we are justified, it must be maintained that: (1) certainly the whole Christ, and all his righteousness, is profitable to us for justification, because the whole Christ was given by God to the world, that whosoever believes in him should not perish, but have eternal life (John 3:16) and because he was not born for himself, and did not come into the world so that he might minister to himself, but to us, that he might give himself as the price of redemption for many (Matt. 20:28; Eph. 5:2, 25–26), although it does not all profit us in one and the same way. In particular, (2) his essential righteousness, as much the divine as the human, is by no means profitable for justification as our [Greek], dikaioma, righteousness, on account of which we are justified, because not only does he require it for himself, but because it would also make superfluous and void a justification through a procured righteousness. For if we were to be absolved on account of the righteousness of the divine person, which is of infinite value, or even on account of the righteousness of the human nature, as our dikaioma, why would the righteousness of his death or of his life be required? Still, this essential righteousness also is profitable as a prerequisite in the person of the Mediator, apart from which he could not provide the dikaioma for us (2 Cor. 5:21; Isa. 53:11). So (3) only the procured righteousness of Christ provides the dikaioma on account of which we are justified by God. But since again a twofold procured righteousness of Christ is observed, one active, whereby he kept the law exactly (Matt. 3:15; 5:17; Gal. 4:4), and the other passive, whereby he suffered for the law that we violated (Rom. 4:25; Phil. 2:8), it must be maintained that (4) the active righteousness alone is insufficient for procuring justification, because a dikaioma was demanded for sinners, who had earned death (Gen. 2:17; Rom. 5:12; 6:23), which from the divine decree, the threat of the law, and God’s natural hatred of sin, was necessary to be suffered (Rom. 1:32; 2 Thess. 1:6). And also (5) he did not expend on our behalf only his passive righteousness, because it is not only his passive righteousness that is referred to our salvation throughout Scripture (Jer. 23:6; 1 Cor. 1:30; Rom. 5:19; Phil. 3:9), but it also regards the fullness of grace that he was expended for us in the whole of what he is (Rom. 8:32). Hence, (6) both kinds of his righteousness join into our one dikaioma, whereby he satisfied for the sins of those to be justified (Rom. 8:3–4), such that accordingly, (7) this twofold righteousness is not separated, indeed not even distinguished in such a way that to the passive righteousness alone is attributed the efficacy of making satisfaction for our guilt, and thus of delivering us from evils, and to the active righteousness alone is attributed the power of meriting for us the right of eternal life. For not only do satisfying and meriting in this matter not differ really, but neither should the passive be stripped of the dignity of meriting, nor the active of the dignity of satisfying, as we have demonstrated elsewhere (1.5.18 §XIV; cf. §XVII, below).</p></blockquote>

<blockquote><p>There are five Arguments of consolation to the Justified, who bewail the imperfection of their own obedience.

Become dead] Argum. 1. You are freed from the Covenant of Works, which admits no obedience besides what is perfect, and every way complete: Therefore all you that are Justified have consolation, which bewail the imperfection of your new obedience.

Of another] Argum 2. You are now married to another Husband, viz. to Christ, who is raised from the dead, who when he could answer the imperfections of your obedience, and (according to the Covenant of Grace) render your begun obedience acceptable unto God, he took it upon himself: You have this consolation that mourn over the imperfections of your new obedience.

Fruit] Argum. 3. Ye are married unto Christ, which is raised from the dead, that you may not abide unfruitful, but may bring forth fruit to the glory of God: Therefore take ye comfort, who bewail your imperfect obedience.

Argum. 4. Confirming the former, from the change of our condition, while we were unregenerate (and by consequence under a Law-Covenant) evil affections by the holy Law of God were stirred up, and put forth themselves powerfully in our members, and all our faculties both of soul and body, to the production of the deadly fruit of actual sin:

Therefore it will follow, when we are now regenerated, and under the Covenant of Grace, holy desires stirred up by the New Covenant, powerfully shew forth themselves in our members, to the bringing forth the fruit of good works unto God, that we might not abide unfruitful. Which is no small consolation; for if we by Faith would lay hold upon the Covenant of Grace, and would stir up our souls by the promises thereof applied unto us, there is no doubt but we should more plentifully bring forth good works; That is it which Christ saith, Joh. 15.5. I am the vine, ye are the branches, he that abides in me, and I in him, he brings forth much fruit: for without me you can do nothing.

Argum. 5. Opening and confirming the former, from the end of our changed condition, Now, to wit, after Justification, through the Grace of Christ we are freed from the Law-Covenant (that Covenant being dead in which we were held, or we being dead in Christ, in whom we were contained judicially) to that very end, that we should serve God, by the power of the Holy Ghost, bestowing new strength upon us, by bringing forth new and spiritual fruit, not superficial and hypocritical, which the letter of the old legal Covenant (now abolished) at the most, brought forth:

Therefore God will not fail of his end, but will cause those that are justified, bewailing their imperfect obedience, to bring forth much fruit in the newness of the letter, for the fruits which are brought forth by virtue of the Covenant of Grace, are truly new, and arise from the regenerating Spirit, furnishing us with new strength forthwith to good works; But the fruits which are brought forth by virtue of the Covenant of Works, either are open rebellion of corrupt Nature against God’s Law, or counterfeit obedience only in the outward performance; such as the fruits of the Pharisees are, who in the letter, that is, the outward shew, and formality obeyed, without any renovation of the heart.</p></blockquote>

Argum. 5. Opening and confirming the former, from the end of our changed condition, Now, to wit, after Justification, through the Grace of Christ we are freed from the Law-Covenant (that Covenant being dead in which we were held, or we being dead in Christ, in whom we were contained judicially) to that very end, that we should serve God, by the power of the Holy Ghost, bestowing new strength upon us, by bringing forth new and spiritual fruit, not superficial and hypocritical, which the letter of the old legal Covenant (now abolished) at the most, brought forth:

Therefore God will not fail of his end, but will cause those that are justified, bewailing their imperfect obedience, to bring forth much fruit in the newness of the letter, for the fruits which are brought forth by virtue of the Covenant of Grace, are truly new, and arise from the regenerating Spirit, furnishing us with new strength forthwith to good works; But the fruits which are brought forth by virtue of the Covenant of Works, either are open rebellion of corrupt Nature against God’s Law, or counterfeit obedience only in the outward performance; such as the fruits of the Pharisees are, who in the letter, that is, the outward shew, and formality obeyed, without any renovation of the heart.”

C+that+we+might+not+abide+unfruitful.+Which+is+no+small+consolation%3B+for+if+we+by+Faith+would+lay+hold+upon+the+Covenant+of+Grace%2C+and+would+stir+up+our+souls+by+the+promises+thereof+applied+unto+us%2C+there+is+no+doubt+but+we+should+more+plentifully+bring+forth+good+works%3B+That+is+it+which+Christ+saith%2C+Joh.+15.5.+I+am+the+vine%2C+ye+are+the+branches%2C+he+that+abides+in+me%2C+and+I+in+him%2C+he+brings+forth+much+fruit%3A+for+without+me+you+can+do+nothing.%0A%0AArgum.+5.+Opening+and+confirming+the+former%2C+from+the+end+of+our+changed+condition%2C+Now%2C+to+wit%2C+after+Justification%2C+through+the+Grace+of+Christ+we+are+freed+from+the+Law-Covenant+%28that+Covenant+being+dead+in+which+we+were+held%2C+or+we+being+dead+in+Christ%2C+in+whom+we+were+contained+judicially%29+to+that+very+end%2C+that+we+should+serve+God%2C+by+the+power+of+the+Holy+Ghost%2C+bestowing+new+strength+upon+us%2C+by+bringing+forth+new+and+spiritual+fruit%2C+not+superficial+and+hypocritical%2C+which+the+letter+of+the+old+legal+Covenant+%28now+abolished%29+at+the+most%2C+brought+forth%3A%0A%0ATherefore+God+will+not+fail+of+his+end%2C+but+will+cause+those+that+are+justified%2C+bewailing+their+imperfect+obedience%2C+to+bring+forth+much+fruit+in+the+newness+of+the+letter%2C+for+the+fruits+which+are+brought+forth+by+virtue+of+the+Covenant+of+Grace%2C+are+truly+new%2C+and+arise+from+the+regenerating+Spirit%2C+furnishing+us+with+new+strength+forthwith+to+good+works%3B+But+the+fruits+which+are+brought+forth+by+virtue+of+the+Covenant+of+Works%2C+either+are+open+rebellion+of+corrupt+Nature+against+God%E2%80%99s+Law%2C+or+counterfeit+obedience+only+in+the+outward+performance%3B+such+as+the+fruits+of+the+Pharisees+are%2C+who+in+the+letter%2C+that+is%2C+the+outward+shew%2C+and+formality+obeyed%2C+without+any+renovation+of+the+heart.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Paul%E2%80%99s+epistles+together+with+an+explanation+of+those+other+epistles+of+the+apostles+St.+James%2C <blockquote><p>Belief was at first defined to be an assent to things known by revelation: but now ye are further to know that all assent is not of the same kind and degree, but differs according to the diversity of the objects assented unto. Therefore we must observe, that of the objects of belief:

1. Some are represented unto us only as true and good in themselves, without any special relation to our benefit and commodity. Unto such things, whether past, present or to come, the understanding and will of man do yield that common assent and approbation whereby they allow of the truth and goodness of everything that is apprehended by them as true and good in what kind soever it be. This is called a bare assent, or credulitas, belief in strict terms, when we only believe tis good and true, and go no further.

2. Some are revealed unto us not only as true and good in themselves, but more specially as containing some excellent truth and goodness that concerns us in regard of some benefit that we shall get thereby. In these things our assent is with adherence, affiance, trust and dependance upon the thing revealed. For as in general all truth and goodness draws the faculties of the soul to an approbation of them when they are known, so much more does the goodness and truth of those things, which are proportionable to our nature and necessities, wherein we may claim special interest and commodity, unite our wills and understanding in strong assent and adherence unto them. This kind of assent is in strict terms called faith or trust, fides, fiducia, which imply much more than credulitas, belief. Fidere in the property of the word is a degree beyond credere, importing an assent with reliance and confidence. Now the proper object of this assent is nothing but promises of some good hereafter to befall us. And promises are never believed, unless they be trusted upon: as a captive cannot be said to believe him that promises to ransom him upon a day, unless he trust and depend upon him. In which case we cannot distinguish between belief and trust, fidem and fiduciam, to make them two several acts, which are but one and the same; as is manifest thus, a promise is a revelation of some such truth as shall be beneficial to me in particular. The truth of such a promise consists in the certainty of performance. The goodness of the promise consists in the quality of the thing promised more or less excellent. But now to trust (fiduciam ponere, fidem habere) upon a promise is not to believe the goodness of the thing promised (for that often is known perfectly enough) but to be believe the certainty of performance of it unto me: as for instance, if a rich man promise to pay a poor man’s debts, the poor man needs not believe the goodness of the promise, for he well knows the benefit thereof. What then must he believe? The truth of it: where in stands that? in the performance that the rich man will certainly do for him what he has said. Now what is this else but to trust him? So that belief and trust or affiance are here essentially one and the same thing.</p></blockquote>

d%20the%20same%20thing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.</p></blockquote>

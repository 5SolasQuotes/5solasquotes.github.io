<main class="wrap"><figure class="quote" id="q-eae9c4d386" data-kw="">
<blockquote><p>Nor have the best of our duties any other respect unto the continuation of our justification, but only as in them we are preserved from those things which are contrary unto it, and destructive of it. But the sole question is, upon what the continuation of our justification does depend, not concerning what duties are required of us in the way of our obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/arminians-remonstrants/neonomianism.html">Arminians (Remonstrants): Neonomianism</a> › <a href="../topics/arminians-remonstrants/neonomianism/reply-christs-righteousness-alone.html">Reply: Christ’s righteousness alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5b5a788f8" data-kw="">
<blockquote><p>The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that he has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, he is the object of our faith in our absolute justification; and so he is as unto the continuation of it. So our whole progress in our justified estate, in all the degrees of it, is ascribed unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-780939a2cf" data-kw="">
<blockquote><p>God continues to forgive the sins of those that are justified, and although they can never fall from the state of justification, yet they may, by their sins, fall under God’s fatherly displeasure; and in that condition they usually do not have the light of his countenance restored to them, until they humble themselves, beg pardon, and renew their faith and repentance (Matt. 6:12; 1 John 1:7, 9; John 10:28; Ps. 89:31–33; Ps. 32:5; Ps. 51; Matt. 26:75).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.5</span></figcaption>

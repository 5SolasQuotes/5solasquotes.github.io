<main class="wrap"><figure class="quote" id="q-cac2629ee6" data-kw="">
<blockquote><p>…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again.

1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne.

2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off.

3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C].

4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lives of Philip &amp; Matthew Henry (ed. J.B. Williams)</cite>, On the Act of Uniformity and the Great Ejection, 1662, pp. 101-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>Assertion 2 – This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him, as Dr. Ferne [a royalist] confesses, (sec. vii, p. 30)… …2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>

</figure><figure class="quote" id="q-c81f8ffed3" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book you left with me, I find not myself in my understanding thereby convinced of the necessity or lawfulness of conforming unto, or complying with an unjust prevailing power further than I was before persuaded. It might be lawful or necessary so to do: viz. as I paying taxes and submitting to some other things (in themselves not unlawful) by 〈1 page missing〉 3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek] (to the force), but not acknowledge the [Greek] (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right, title; or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide [with good faith] presume the oppressed power (to whom my obedience is justly due), if he perfectly knew the present condition I am in together with the exigence and necessity of the present case and all of circumstances thereof, would give his willing consent to such my conformity and compliance. So that upon the whole matter and in short, I conceive I may so far submit unto the impositions or comply with the persons of a prevailing usurped power unjustly commanding things not in themselves unlawful, or make use of their power to protect one from other’s injuries, as I may submit unto, comply with or make use of a highway thief or robber when I am fallen into his hands and lie at his mercy. As for Mr. Ascham ‘s discourse, though it be handsomely framed, yet all the strength of it (to my seeming) lie’s upon two principles, which (if he would speak out) would be in plain English these:

1. That self-preservation is the first and chiefest obligation in the world, to which all other bonds and relations (at least between man and man) must give place.

2. That no oath, at least no imposed oath, at what terms soever expressed, binds the taker further than he intended to bind himself thereby; and, it is presumed, that no man intended to bind himself to the prejudice of his own safety. [These are] Two dangerous and desperate principles which evidently tend: 1. to the taking away of all Christian fortitude and suffering in a righteous cause; 2. to the encouraging of daring and ambitious spirits to attempt continual innovations, with this confidence, that if they can by any ways (how unjust soever) possess themselves of the supreme power, they ought to be submitted unto; 3. to the obstructing unto the oppressed party all possible ways and means, without a miracle, of ever recovering that just right of which he shall have been unjustly dispossessed; and (to omit further instancing) 4. to the bringing in of atheism with the contempt of God and all religion, whilst every man, by making his own preservation the measure of all his duties and actions, makes himself thereby his own idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Resolution of Conscience</cite>, (by a learned divine) in Answer to a letter sent with Mr. Ascham’s book, treating how far it may be lawful to submit to an usurped power. Out of which men may satisfy their scruples concerning the present Subscription and Engagement [to Cromwell’s regime] (London: 1649) 6 pp.</span></figcaption>

%80%99s+injuries%2C+as+I+may+submit+unto%2C+comply+with+or+make+use+of+a+highway+thief+or+robber+when+I+am+fallen+into+his+hands+and+lie+at+his+mercy.+As+for+Mr.+Ascham+%E2%80%98s+discourse%2C+though+it+be+handsomely+framed%2C+yet+all+the+strength+of+it+%28to+my+seeming%29+lie%E2%80%99s+upon+two+principles%2C+which+%28if+he+would+speak+out%29+would+be+in+plain+English+these%3A+1.+That+self-preservation+is+the+first+and+chiefest+obligation+in+the+world%2C+to+which+all+other+bonds+and+relations+%28at+least+between+man+and+man%29+must+give+place.+2.+That+no+oath%2C+at+least+no+imposed+oath%2C+at+what+terms+soever+expressed%2C+binds+the+taker+further+than+he+intended+to+bind+himself+thereby%3B+and%2C+it+is+presumed%2C+that+no+man+intended+to+bind+himself+to+the+prejudice+of+his+own+safety.+%5BThese+are%5D+Two+dangerous+and+desperate+principles+which+evidently+tend%3A+1.+to+the+taking+away+of+all+Christian+fortitude+and+suffering+in+a+righteous+cause%3B+2.+to+the+encouraging+of+daring+and+ambitious+spirits+to+attempt+continual+innovations%2C+with+this+confidence%2C+that+if+they+can+by+any+ways+%28how+unjust+soever%29+possess+themselves+of+the+supreme+power%2C+they+ought+to+be+submitted+unto%3B+3.+to+the+obstructing+unto+the+oppressed+party+all+possible+ways+and+means%2C+without+a+miracle%2C+of+ever+recovering+that+just+right+of+which+he+shall+have+been+unjustly+dispossessed%3B+and+%28to+omit+further+instancing%29+4.+to+the+bringing+in+of+atheism+with+the+contempt+of+God+and+all+religion%2C+whilst+every+man%2C+by+making+his+own+preservation+the+measure+of+all+his+duties+and+actions%2C+makes+himself+thereby+his+own+idol.%E2%80%9D%0A%0A%E2%80%94+Robert+Sanderson%2C+A+Resolution+of+Conscience%2C+%28by+a+learned+divine%29+in+Answer+to+a+letter+sent+with+Mr.+Ascham%E2%80%99s+book%2C+treating+how+far+it+may+be+lawful+to+submit+to+an+usurped+power.+Out+of+which+men+may+satisfy+their+scruples+concerning+the+present+Subscription+and+Engagement+%5Bto+Cromwell%E2%80%99s+regime%5D+%28London%3A+1649%29+6+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc81f8ffed3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c81f8ffed3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=Upon%20perusal%20of%20Mr.%20Ascham%E2%80%99s%20book,makes%20himself%20thereby%20his%20own%20idol&amp;text=Upon%20perusal%20of%20Mr.%20Ascham%E2%80%99s%20book%20you%20left&amp;text=and%20actions%2C%20makes%20himself%20thereby%20his%20own%20idol" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And yet we conceive another case… wherein this submission to a new power may be called legal. For the end of all law and government is to preserve our persons and estates; and they who are in supremacy of power have power to preserve or destroy both if they please; and therefore have as great a power over our laws, which are less then our lives. So soon as one supreme power is expelled by another, law, life and estate fall all into the hands of the succeeding power; and what it does not actually take away, stands in effect as deriving from it; and if that supreme power make a sanction for our obedience to it (as always is immediately done) then we may say our submission is legal, or else the supreme power cannot make a law.</p></blockquote>

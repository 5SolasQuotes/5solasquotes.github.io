<main class="wrap"><figure class="quote" id="q-030dbef600" data-kw="">
<blockquote><p>Wherefore do ye lay out your silver for that which is no bread, and your labour on that which is not to satisfy? As before he exhorted vs to come and buy freely, without money; because God is no money man, neither can any man deserve favour at his hands, but whatsoever we have of him, we have it of mercy: so now he sharply reproveth all such, as by money or merchandise; by desert, or merit seek after salvation. He dehorteth us from false teachers, crafty seducers, which offer to sell the grace and mercy of GOD for money.

Christ proposeth his heavenly treasures, remission of sins, justification, sanctification, mercy, grace and salvation freely. He that sitteth in the Temple of God, and termeth himself Christ’s Vicar, doeth in like sort offer unto the people bread, water, wine, milk, pardon of sins, grace, mercy and eternal life: but not freely, he is a merchant, he giveth nothing, and that is nothing which he selleth. For although he make large promises to the buyer, he selleth that which he hath not to deliver. Eternal life is the gift of God.

The Pope therefore selleth but wind and smoke for fire, shadows for truths: he deceiveth the buyers with false lights, false measures, false weights. Beware of this merchant; loose not your labour; cast not away your money: it is not meat but poison which he offereth you. His physique cannot heal your diseases; His holy water cannot wash away the spots of a sullied and defiled soul, as he untruly would bear you in hand; His blasphemous Masses do not appease, but provoke God’s wrath; they cannot benefit the quick, much less the dead, which either need no help, or are past al help; His rotten relics cannot comfort you; His blind, dumb, and worm-eaten Idols can do you no good; It is cast away which is spent upon his shameless pardons, they will not prevail, God will not admit them; By his Latin service ye cannot be edified, or made wiser.

Yet this trumpery they sell for money, and upon this trash they cause silly men to waste their substance, and to these to commit their souls. Thus you see a manifest difference between Christ and Antichrist, the doctrine of God and the learning of man, true teachers and false, sound and counterfeited religion. The one offereth true bread, freely; the other that which is no bread for bread, and that not freely neither, but for money.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 5.</span></figcaption>

<blockquote><p>Christ never said a word about Peter’s episcopacy at Rome nor about his successor. Neither according to Scripture nor according to tradition has Peter ever breathed a hint that the bishop at Rome would be his only true successor. … Conclusion: The primacy of the Roman bishop over the entire Christian church is totally unfounded. It cannot show the divine right on which it rests; it does not even have a reliable historical foundation.</p></blockquote>

</figure><figure class="quote" id="q-de8f816fdc" data-kw="">
<blockquote><p>This system also conflicts with Scripture, which recognizes no such primacy of Peter as that on which the system is built, and distinctly recognizes the voice of the people in ecclesiastical affairs. Moreover, the claim of the Roman Catholic Church, that there has been an unbroken line of succession from the time of Peter down to the present day, is contradicted by history. The papal system is, both exegetically and historically, untenable.</p></blockquote>

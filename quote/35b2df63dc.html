<blockquote><p>Obs. III. It is the duty of ministers of the gospel to endeavour their hearers’ increase in knowledge, until they also are able to instruct others, according to their calls and opportunities.

So did those who taught these Hebrews, whence they are reproved for failing their expectation. Some, it may be, are apt to fear lest their hearers should know too much. Many corrupt lusts and affections may prompt them hereunto; which are all resolved into self, with respect unto profit or reputation. And this hath proceeded so far in the degeneracy of the church of Rome, as to produce the commendation of blind obedience and ignorance, as the mother of devotion; than which nothing could be invented more contrary to the whole course and design of the gospel And it is well if no others are tainted with the same disease.

Even good men had need to watch against discomposures of mind, when they find on trial, it may be, some of their hearers to be like David, “wiser” in the things of God “than their teachers.” And Joshua himself was earnest with Moses to forbid Eldad and Medad from prophesying; out of no good frame, as appeareth by the reply of Moses, “Enviest thou for my sake?” Num. xi. 29. But this occasioned the prayer of that holy man, which is unto us a rule of duty, “Would God that all the LORD’S people were prophets, and that the Lord would put his Spirit upon them!”

And to a faithful minister, there is no greater crown nor cause of rejoicing, than when he can be instrumental so to carry on any of his hearers towards perfection, as that their gifts and abilities may outshine his own, especially if they are accompanied with humility and holiness. And for those who are either negligent in this work, or, taking upon them the place and duty of teachers, are unable for it, they betray the souls of men, and shall bear their own judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 4: 571-72.</span></figcaption>

<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>

</figure><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.”

— George Gillespie, A Treatise of Miscellany Questions, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+they+%5Bthe+Independents%5D+hold+that+although+a+congregation+increase+so+much+as+that+they+cannot%2C+or+be+so+persecuted+that+they+may+not%2C+meet+safely+in+one+place+for+the+Word+and+sacraments%2C+and+supposing+the+Church+of+Jerusalem+before+the+dispersion%2C+Acts+8%3A1%2C+to+have+been+so+numerous+and+to+have+accressed+to+so+many+thousands+as+could+not+receive+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+nor+ordinarily+assemble+into+one+place+for+the+worship+of+God+%28that+they+received+the+Lord%E2%80%99s+Supper+in+several+companies+and+several+houses+is+ordinarily+collected+from+Acts+2%3A46%2C+and+breaking+bread+from+house+to+house%2C+which+the+Syriac+expounds+expressely+of+the+Eucharist%29%2C+Yet+all+this+%28say+they%29+breaks+not+the+Church%2C+but+they+are+still+one+particular+church.+Now+if+several+companies+of+the+same+church+assembled+and+receaving+the+Lord%E2%80%99s+Supper+in+several+places+be+not+a+breaking+or+dividing+of+the+congregation%2C+nor+a+deviation+from+the+example+of+Christ%2C+much+less+can+they+with+any+reason%2C+charge+our+communicating+by+several+companies+at+successive+tables%2C+in+the+same+meeting+place+or+assembly+to+be+a+breaking+of+the+congregation+or+a+deviation+from+Christ%E2%80%99s+example.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Treatise+of+Miscellany+Questions%2C+pp.+221-22+of+ch.+18%2C+%E2%80%98Of+the+Use+of+a+Table+in+the+Lord%E2%80%99s+Supper.+And+of+the+Communicants+their+Coming+to+%26+Receiving+at+the+Table%E2%80%99+in+A+Treatise+of+Miscellany+Questions%E2%80%A6+%281649%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b42ef7128.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a cl <blockquote><p>Did the [Solemn League and] Covenant or our Profession [of Christianity] ever bind us to take the [Anglican] Liturgy, to be worse than it is, or the parish churches to be [considered] no churches, or their communion utterly unlawful? Or did it bind us to prefer a desertion of all public communion before it? No, it did not; but if it had, it had been sinful, and to be repented of. But, 1. We were bound by God’s word (and no covenant, or practices bind us to any more than Scripture binds us to) to avoid all that is sin. 2. And when we have our choice to prefer the best; he that does either turn to sin, or prefer a less good, when it is so, before a greater, goes back; but he that prefers no public worship before the parish worship goes back indeed and breaks the Covenant, by profaneness and schism. God’s Word is a clearer and surer test of our duty and controversies than any human covenants. When ministers were changed [in] 1647, many places got out [of the church] some tolerable weak ministers to get in abler men in [the churches in] great towns. When the bishops returned, their abler ministers being dead or ejected, they took the old ones again. Did these go back from Covenant Reformation or duty when they could have no better? Had not those been the revolters [to the Covenant] that would rather have had none?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, p. 232</span></figcaption>

<main class="wrap"><figure class="quote" id="q-6ab570d981" data-kw="">
<blockquote><p>In whatever aspect the matter is viewed it is clear that the Constitution is the proper place for embodying the Christian principles of civil government, and that they now find no expression in that document. What then is the political duty of Christian citizens? First of all, they should adjust their political relations so as to be free from the [guilt] of the nation’s sin.

Second, they should join their forces for the securing of such a constitutional amendment as will suitably embody the principles of Christian civil government, and give a sure basis for the Christian elements in our national life. There is no reason why this work may not be undertaken with good hope of success.

(The Constitution provides for its own amendment, and prescribes the method. Swearing to support the Constitution as it is does not therefore pledge those who take this oath to oppose any amendment. It implies that they consider that document as it is a suitable instrument of government, but they are free to support any amendment that may be proposed in the orderly way. We may therefore confidently appeal to every Christian citizen to join in an effort to secure the Christian amendment).

Moreover, we have in God’s word the assurance that all nations shall yet yield obedience to the sceptre of Christ. In no way can we honour Christ more or render a more valuable service to mankind than by striving to supply what the Constitution lacks.</p></blockquote>

</figure><figure class="quote" id="q-72c5a026dc" data-kw="">
<blockquote><p>Did the Lord by Moses give to the Jews as a body politic sundry judicial laws which expired with their state? Yes. Do they oblige any other now, further than the general equity thereof may require? No (Ex. 21; 22:1-29; Gen. 49:10; 1 Cor. 9:8-10; 1 Pet. 2:13-14; Mt. 5:17,38-39). Well then, do not some err, though otherwise orthodox, who maintain that the whole judicial law of the Jews is yet alive and binding all of us who are Christian gentiles? Yes. By what reasons are they confuted?

1. Because the judicial law was delivered by Moses to the Israelites to be observed, as to a body politic (Ex. 21).

2. Because this law, in many things which are of particular right, was accommodated to the commonwealth of the Jews, and not to other nations also (Ex. 22:3; 21:2; Lev. 25:2-3; Dt. 24:1-3; 25:5-7).

3. Because, in other things which are not of particular right, it is neither from the law of nature obliging by reason; neither is it pressed upon believers under the gospel to be observed.

4. Because believers are appointed under the gospel to obey the civil law and commands of those under whose government they live, providing they be just, and that for conscience’ sake (Rom. 13:1; 1 Pet. 2:13-14; Titus 3:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error</cite>, ch. 19, question 4 (the first commentary defending the Westminster Confession)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

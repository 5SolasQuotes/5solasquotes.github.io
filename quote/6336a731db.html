<main class="wrap"><figure class="quote" id="q-6336a731db" data-kw="">
<blockquote><p>5. That it is not to be doubted but the counsels of the [Westminster] Assembly of Divines and the care of the Parliament will be not only to reform and set up religion throughout the nation, but will concur to preserve whatever shall appear to be the rights of particular congregations, according to the Word, and to bear with such whose consciences cannot in all things conform to the public rule, so far as the Word of God would have them borne withal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Considerations to Dissuade Men from Further Gathering of Churches in this Present Juncture of Time. Subscribed by</cite>, [21] Diverse Divines of the [Westminster] Assembly (London, 1643), p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. That it is not to be doubted but the counsels of the [Westminster] Assembly of Divines and the care of the Parliament will be not only to reform and set up religion throughout the nation, but will concur to preserve whatever shall appear to be the rights of particular congregations, according to the Word, and to bear with such whose consciences cannot in all things conform to the public rule, so far as the Word of God would have them borne withal.”

<blockquote><p>4. They [civil magistrates] may and ought to employ and make use of some fit instruments for the preventing of seduction, and may provide such as may be set apart for studying such controversies, and confuting of such errours, that the truth may be the more clear.</p></blockquote>

</figure><figure class="quote" id="q-68a9e053ef" data-kw="">
<blockquote><p>The Magistrate hinders ignorance and losing ships by tempests not by professing and teaching sciences and arts in academies in his own person, nor by steering ships, and guiding them himself to their ports, for so [then] a magistrate as a magistrate should be a schoolmaster, a professor of arts and sciences in the universities, and a pilot or shipmaster, which were a confounding of all callings; but by procuring that there should be universities and professors of arts and sciences, and by providing honorable stipends and wages for them, and procuring that in the commonwealth there should be sailers who are skilled in shipping: and so does the magistrate by his office take care that the Word, sacraments and discipline, be dispensed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), p. 543</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-7b8baa4b2c" data-kw="">
<blockquote><p>Our gracious prince, who now by the blessing of God happily reigns over us, will not (we assure ourselves) be offended at us for having regard to our consciences [though it goes against his command], God’s own deputies placed in our souls, so far, that for all the world we dare not hazard their peace and quiet by doing anything with their repugnance and aversation;</p></blockquote>

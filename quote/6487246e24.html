<main class="wrap"><figure class="quote" id="q-6487246e24" data-kw="">
<blockquote><p>I. We are willing to teach all in our parish, the doctrine of life, that are willing to learn: and desire them all to hear the Word publicly preached and to come to us to be catechized or instructed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bdf86fef4e" data-kw="">
<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold: 1. Common; when men are brought but to outward profession and common gifts; and so the word is used often. 2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion… (London: R.W., 1657), ch. 1, sect. 3</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

</figure><figure class="quote" id="q-400e318093" data-kw="">
<blockquote><p>…a man may truly take upon him that which he cannot fully and in every part perform or fullfil, desiring and endeavoring so far as his knowledge &amp; ability extends. Otherwise, no high preist in Israel from the time of Solomon unto the time of Hezekiah did truly take upon them the charge of a high preist: because none did celebrate the Passover, which was a principal sacrament, in such sort as was written, 2. Chron. 30:5, 26, nor keep the feast of tabernacles in a far longer time, Neh. 8:17. Nor did any king all that time truly take upon him the charge or office of a king: because none did reform things as he ought. If any difference be, their sin was greater, that might have done their duty and would not, than theirs that would and cannot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr. [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615)</cite>, p. 10</span></figcaption>

</figure><figure class="quote" id="q-3a7d9dbe59" data-kw="">
<blockquote><p>2. Because when the Church is overgone with heresy and apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; And suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea (1642)</cite>, pp. 126-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-f8ef288f53" data-kw="">
<blockquote><p>Mr. Hooker [wrote]: ”An eminently gifted man in an island, where no pastors are, is no less (says Mr. Rutherford) tied in conscience in the extraordinary employment of his calling than if he were formally ordained and chosen their pastor. In some extraordinary cases a gift and Christian love ties even as much to onerousness [difficulty] in using means to save as the office itself.’ See what I add in that place,’ (Mr. Hooker says) ‘then this gifted man in an island, in using his general calling as a Christian, destroys his particular [calling] as a merchant, and turn[s] minister. 2. This is to confound the general and particular calling.’ [Rutherford’s] Answer: Not at all, for in this case, the extraordinary necessity of gaining souls, when other pastors cannot be had, and ordination and election by that means are invincibly wanting hic &amp; nunc [hear and now], turns his Christian calling in place and room of the particular calling of a pastor; and so Mr. Rutherford said well, that in some extraordinary case like this, ‘The naked relation of jurisdiction adds nothing to [the] care and onerousness in point of labor by preaching the Gospel.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum… (1658).</cite>, pp. 217-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

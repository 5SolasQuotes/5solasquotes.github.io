<main class="wrap"><figure class="quote" id="q-0e6c52307d" data-kw="">
<blockquote><p>Understand further that powers are from God, not as pestilence and famine, and wars, and other visitations for sin are said to be from Him, but because He has appointed them for the legitimate and just government of the world. For though tyrannies and unjust exercise of power, as they are full of disorder (ἀταξίας) are not an ordained government, yet the right of government is ordained by God for the well-being of mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Rom.</cite>, 13:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>5. ‘The persons are proposed (Rom. 13) to be the object of our obedience,’ says Dr. Ferne [an erastian royalist]. This is very true: but he is ignorant of our mind in expounding the word ‘person’. We never meant that fear, honor, royalty, tribute, must be due to the abstracted accident of kingly authority [a righteous rule that a bad king may not be exercising], and not to the man who is king; nor is it our meaning that royalty, in abstracto is crowned king [the office apart from the particular king], and is anointed, but that the person is crowned and anointed. But, again, by a ‘person’ we mean nothing less than the man Nero wasting Rome, burning, crucifying Paul and torturing Christians; and that we owe subjection to Nero and to his person in concreto [materially as a specific man], as [distinguished from and compared] to God’s ordinance, God’s minister, God’s sword-bearer, in that notion of a ‘person’, is that only that we deny. Nay, in that Nero, in concreto [as a man, and that sinful], to us is no power ordained of God, no minister of God, but a minister of the devil, and Satan’s armour-bearer, and therefore we owe not fear, honor, subjection, or tribute to the person of Nero. But the person thus far is the object of our obedience, that fear, honor, subjection and tribute must be due to the man in concreto [in particular], to his person who is prince, but not because he is a man, or a person simply, or a sword-bearer of papists, but for his office,- for that eminent place of royal dignity that God has conferred on his person… so here we honor and submit to the man who is king, not because he is a man, that were treason; not because he uses his sword against the church, that were impiety; but because of his royal dignity, and because he uses it for the Lord. …Subjection is due to Nero as an emperor, but not any subjection is due to him in the burning of Rome, and torturing of Christians… Because some believed Christians were free from the yoke of magistracy, and that the dignity itself was unlawful; and because (ch. 12) he had set down the lawful church rulers, and in this and the following chapter, the duties of brotherly love of one toward another; so here ([Rom.] ch. 13) he teaches that all magistrates, suppose [they be] heathen, are to be obeyed and submitted unto in all things, so far as they are ministers of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex, Question 29</cite>, p. 146; p. 148</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>A tyrant without title, who is an invader, every private man may and ought to destroy, for he is not a prince but a private person.</p></blockquote>

</figure><figure class="quote" id="q-dc45fd21f5" data-kw="">
<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2</cite>, pp. 11-16</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fb949bece1" data-kw="">
<blockquote><p>Reading the Word of God publicly to the congregation is the duty of those especially called as ministers of the Word.” …Reading the Scriptures ‘publicly to the congregation’ is a part of conducting the public worship of God, and therefore it is to be done only by those who have been properly called to that office in the church. Of course in the absence of an ordained minister or licentiate, the elders of the church may properly appoint some person to read the Scripture and conduct a prayer meeting or ‘fellowship meeting.’ What the catechism denies is that any private Christian may lawfully take it upon himself to conduct public worship, without being appointed to do so by those who office it is to rule the house of God</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, 438, 439.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72239b2dfd" data-kw="">
<blockquote><p>Superstition is an offering somewhat as pleasing to God, which is not pleasing to Him. All Christians have some degree of this in matter or manner; for we know but in part, and prophesy in part, etc. And so [it is the logical consequence of separatistic principles that] no Christians must join with others. But must they not give over all religious duty themselves, seeing their own defects more defile them than other men’s [defects]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-8d6d420903" data-kw="">
<blockquote><p>In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I: A Vision of unchangeable, free mercy, in sending the means of grace to undeserving sinners, in The Works of John Owen</cite>, (Carlisle: The Banner of Truth Trust, repr. 2009), 8:28.</span></figcaption>

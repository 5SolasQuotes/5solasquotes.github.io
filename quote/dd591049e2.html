</figure><figure class="quote" id="q-544f7ad273" data-kw="">
<blockquote><p>But as touching these ceremonies in question, we are upon evident grounds persuaded in our consciences that they are both unlawful and inexpedient for our Church: and though they were lawful in themselves, yet we may answer as the oppugners of the Interim [1548] replied to those who urged yielding to the ceremonies of the same (Friedrich Balduin [a Lutheran], On Cases of Conscience, bk. 4, ch. 11, case 3), surplice, holy days, tapers [candles], etc. because of the emperor’s commandment. That the question is not about things indifferent, but about a main article of faith, namely Christian Liberty, which admits not any yoke to be imposed upon the conscience, no not in things indifferent.</p></blockquote>

<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as: 1. Unwritten traditions—not necessary, not written. 2. Human mystical, symbolical signs and ceremonies—not necessary, not written. 3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written. 4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, p. 87</span></figcaption>

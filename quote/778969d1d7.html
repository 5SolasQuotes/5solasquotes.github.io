<main class="wrap"><figure class="quote" id="q-778969d1d7" data-kw="">
<blockquote><p>Behold then we here set down a school like treatise of divinity, taken out of the first Chapter of the Epistle to the Hebrews, to wit, touching the word of God written, against man’s traditions, about which matter there is great controversy between us and the Papists. And for this cause I omit the handling of this point at large, because it may be easily seen in the writings of late, set forth on both parts: of which writings I will make as it were a certain resolution or anatomy in this school like treatise. But before I come to this my purpose, I am willing somewhat to admonish the Reader, how that these disputations touching the Scriptures doth far differ from all others.

For in disputations of Philosophy, Physic, civil government, and such other, there eloquence sheweth it self, there desire to excel doeth rule, there oratory pleading bursteth out: yea, oftentimes in such matters, men desire nothing but to shew forth the braveness of their wits, or else seek after glory and praise. But in divine disputations, where (as Augustine saith) Bravery must not be sought, but good documents and lessons, and that with great reverence: yea, and very reverently we must dispute of holy things, not as upon the stage before men, but as in the midst of the Church before the living God and his Angels: not for the desire of victory, but for the maintenance of the truth, in as much as Paul forbiddeth the Pastors of the Church, once to speak of vain questions, or contentions of words, which can scarce be done without the detriment of the truth.

Wherefore praying aid at the hands of almighty God, that he will direct and establish this our labour by his holy Spirit, let us proceed into this most holy conflict, in the which the word of GOD is the place of combat, God himself the chief Judge, truth the victory, salvation the garland of triumph. And hereby with more valiant minds we take upon us this most noble conflict, because it otherwise happeneth in this, then in other battles, for there he alone is crowned which vanquisheth, but the end of this battle is such, that even he which is vanquished (so that he acknowledge himself overcome and embrace the truth) shall likewise be crowned, together with the victor. And Augustine saith, that it is better to be overcome of the truth, then to be willing to overcome the truth with falsehood. For whatsoever men practise against the truth, yet this must they know, to wit, that verity cannot be vanquished: the which Augustine also calleth perpetual victory.</p></blockquote>

<blockquote><p>The design of it is, to wean Christians from the overmuch love of their bodies. All men by nature are prone curare cutem magis quàm animam, to take more care and spend more time for their bodies, then for their souls: Hence it is that they think no cost too much that is laid out for the feeding and clothing of their bodies, no gift too great that is given to the Physician to heal them when diseased, but any thing too much which is given to a godly Minister for the good of their souls:

Hence it is, that the working days are too few, and too short for their bodily profits and pastimes, but the Lord’s day which is the Queen of days, because it is the Souls Market-day for Heaven, is burdensome to them, and very tedious. Hence it is also that they are willing to lay out Nine parts of their Estate for their bodies, but unwilling to part with the Tenth for soul-advantages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The saint’s transfiguration, or, The body of vileness changed into a body of glory a sermon preached at Martins Ludgate, October 19, 1654, at the funeral of that reverend and faithful minister of Jesus Christ, Dr. Samuel Bolton, late master of Christs College in Cambridge: with a short account of hi</cite>, (London: Joseph Crawford, 1655), epistle dedicatory.</span></figcaption>

<blockquote><p>[S]ome are strongly tempted to the sin of uncleanness. But being blind regarding their desires, they think it no offence to cross boundaries regarding lustful eyes, loose speech, or secret desires. They know they are snared in this sin. But through long-standing habits they nourish their hearts in these loathsome delights; and when they become aware of their offences, they do not dislike them enough. Thus, they have brought themselves in bondage to their lusts.

Their hearts should therefore be much engaged in fighting against this sin and in observing and weighing its depravity, shame, and danger. They must heartily acknowledge the sin to God and daily offer earnest prayers to God against it, with confidence in both pardon and power to mortify and weaken it. They must use strong reasons to disgrace and renounce the sin. And they must wisely and watchfully avoid the occasions of nourishing the sin. If they do not do this, then this one sin (even if they do not offend grossly) will hold their conscience in great distress, cause them to wander in deep sorrow, and make them unfit for Christian duties.

Indeed, if they do not bestow more labour here than in other parts of their lives, it will slow down their progress and cause disorder and confusion to grow. The longer they have nourished such vain dreams, the more difficult will it be to awake out of them, even if they gladly would.</p></blockquote>

<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. …

2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse.

3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity.

4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’

5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>

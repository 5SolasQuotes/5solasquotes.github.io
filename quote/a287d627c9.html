<main class="wrap"><figure class="quote" id="q-a287d627c9" data-kw="">
<blockquote><p>§41. 2. And for kneeling at the sacrament, I doubt not at all but the imposing it, and that on such rigorous terms, tying all to it and casting all out of the communion of the Church or from the participation of the sacrament that durst not use it, was a very grievous sin and tended to persecution, injustice and Church-dividing. It is certainly in a doubtful case the safest way to do as Christ and his apostles, and the universal Church did for many hundred years. That none should kneel in public worship on the Lord’s Day, no not in prayer, much less in receiving the eucharist, was a Custom so ancient and universal in the Church, that it was everywhere observed before general councils were made use of; and in the first general Council of Nicea it was made the last canon; and other general councils afterward renewed it; so that I know not how any ceremony can possibly pretend to greater ecclesiastical authority than this had. And to cast out all from Church communion in sacraments that dare not go against the examples of Christ and his apostles, and all the primitive Church (who long received the eucharist in another gesture) and against the canons of the first and most famous, and other succeeding general councils, this is a most inhumane part. Either the gesture is indifferent in itself or not: If it be, how dare they thus divide the Church by it and cast out Christians that scruple it when they have these and many other reasons of their scruples (which for brevity I omit). If they say that kneeling is of itself necessary, and not indifferent, because it is reverent etc. then: 1. They make Christ an imperfect Lawgiver: 2. They make Himself or his apostles, or both to have been sinners. 3. They condemn the catholic Church of sin. 4. They condemn the canons of the chief general councils. 5. And then if the bishops themselves in council should change the gesture, it were unlawful to obey them. All which are consequents that I suppose they will disown. What a perverse preposterous reverence is this? when they have leave to lie in the dust before and after the very act of receiving, through all their confessions and prayers, yet they will at other times stand, and many of them sit at prayer, and sit at singing Psalms of Prayer and Praise to God, and yet when Christ doth invite them to a feast, they dare not imitate his apostles and universal Church in their gesture, lest they should be sinfully unreverent. §42. But yet, as sinfully as this gesture was imposed, for my part I did obey the imposer and would do if it were to do again, rather than disturb the peace of the Church, or be deprived of its communion. For God having made some gesture necessary and confined me to none, but left it to humane determination, I shall submit to magistrates in their proper work, even when they miss it in the manner. I am not sure that Christ intended the example of Himself and his apostles as obligatory to us that shall succeed. I am sure it proves sitting lawful: but I am not sure that it proves it necessary: (though very convenient). But I am sure He has commanded me obedience and peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 410-11</span></figcaption>

<blockquote><p>Hence, adoration is worship, but every worship is not adoration. Uncovering the head seems to be little older than Paul’s epistles to the Corinthians. The learned [Claudius] Salmasius [d. 1653, a French reformed classical scholar], thinks it but a national sign of honor, no ways universally received: But certainly it is not adoration: Though therefore we [men] receive the Supper of the Lord uncovered, no man can conclude from thence adoration of the elements, as we do from kneeling [before the Supper] conclude the same, as we shall [conclude] here for all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly either of God, or of these means: It is lawful to tremble at the Word, and for Josiah to weep before the book of the Law read, and for the martyrs to kiss the stake, as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), pp. 89-90</span></figcaption>

<blockquote><p>VI. If any member of this Church do differ from us about the gesture in the Lord’s Supper (or any such circumstance) we desire them first to come to us and hear our reasons: and if we cannot satisfy them, we will not hinder them from receiving it in any decent gesture they desire.</p></blockquote>

<blockquote><p>They [the three friends of Daniel] expressly refuse knee-bowing [to the idol], and the reason is, because if ye bow your knee religiously to a stock, it is not in your power or free choice to stay the flux and motion of religious honor off, or from, the stock; but because religious bowing does not convey honor to the thing before which ye bow by your free will, but by God and nature’s institution, even as weeping naturally expresses sorrow, laughing, gladnesse, so does religious bowing signify religious honoring, without any act of the free choice of the worshipped intervening. It is impossible to adore God in and through an image, and give no religious reverence to the image at all; as it is impossible to hear the Word and tremble at it, and yet none of that religious trembling be bounded and terminated upon the Word, as it is impossible to kneel to the king’s ambassador conveying all and whole that civil honor to the king, but some honor must redound to the ambassador; a father cannot love the doctor for his son’s cause, but some love he must confer really upon the doctor, if not absolute, yet relative, for his son’s cause. Jacob could not kiss Joseph his son’s coat, and yet refer that whole expressed affection to Joseph and nothing at all to the coat, for then should there be no reason why he should kiss the coat rather than the skin of the beast supposed to be the devourer of his son; If therefore the communicant should kiss the sacramental bread as he bows religiously before it, as the object of his sacramental worship, which he receives, I hope it would be thought very like the kissing of the calves of Samaria, and a religious expression of love to the bread; and by the same case, religious bowing to God, by the intervening of bread, a representative object, must be an expression of religious honoring of bread, but no religious honoring by religious bowing can be expressed, but [it is] adoration of bread…</p></blockquote>

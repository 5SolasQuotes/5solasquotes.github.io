<blockquote><p>And in your meetings to make merry, let your mirth be showed forth in psalms, singing as well with instrument as with voice; also with hymns of thanksgiving for benefits received; and for further variety against irksomeness, which our nature easily falleth into, with songs of praising God for his noble acts; all spiritual unto the Lord…</p></blockquote>

</figure><figure class="quote" id="q-5477c0d736" data-kw="">
<blockquote><p>That as the Jews were wont to shut up the solemnity of the Passover by singing some of David’s Psalms; so our Saviour, after the celebration of the Sacrament of his body and blood, went out with his disciples to the mount of Olives, […] having sung the Hymn, which Hymn (say the best expositors) was the same that the Jews did ordinarily sing after the Passover, and is called by them the great Hallel, which, as Paulus Brugensis says, consisted of six Psalms, from Ps. 113 to Ps. 118, and he adds (verisimile est hos à Domino decantatos) it is most like that these were sung by our Saviour. And Drusius says, hunc hymnum hodieque canunt in nocte Paschatis; The Jews sing this Hymn in the evening of the Passover to this day. The learned Scaliger having largely described the forms and rites of celebrating the Passover, concludes thus; This was the true rite of celebrating the Passover in the times of the Messiah…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation Concerning the Frequent Use of our Lord’s Prayer</cite>, [John] Owen concerning that subject (London, 1658), pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-d2065f7484" data-kw="">
<blockquote><p>We must have songs not only honorable but also holy, which are to be like needles to arouse us to pray and praise God, to meditate on his works, in order to love him, fear, honor and glorify him. But what St. Augustine says is true, that no one can sing things worthy of God unless he has received them from Him. For when we have searched here and there, we will not find better songs nor ones more appropriate for this purpose than the Psalms of David, which the Holy Spirit has spoken to him and made. Therefore, when we sing them, we are certain that God has put the words in our mouth as if they themselves sang in us to exalt his glory. Consequently Chrysostom exhorts both men, women and little children to learn to sing them in order that they may be like a meditation to associate them with the company of angels (Chrysostom, In Ps. 41:1,2). Besides, we must remember what St. Paul says, that spiritual songs cannot be better sung than from the heart (Eph. 5:19; Col. 3:16). But the heart requires understanding. And in that (says St. Augustine) lies the difference between the singing of men and that of birds (Aug. Enarr. in Ps. 81, 2.1). For a Linnet, a Nightingale or a Popinjay will sing well, but it will be without understanding. But man’s proper gift is to sing, knowing what he says; after understanding must follow the heart and the affection, something that can only happen when we have the song imprinted on our memory never to cease singing it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to the Reader’ in The Form of Prayers and Songs of the Church</cite>, (1543)</span></figcaption>

</figure><figure class="quote" id="q-c555918365" data-kw="">
<blockquote><p>The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Daille</cite>, (1594-1670) was a French Huguenot. Commentary on Col., 3:16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…”

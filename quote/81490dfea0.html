<blockquote><p>6. The question concerning particular works, or permitted recreations, is wholly useless and trifling: for quod lege prohibitoriâ vetitum non est, permissum intelligitur, says the law: all that is permitted which in the negative precept is not forbidden: But as for some persons to give themselves great liberties of sport on that day is neither pious nor prudent; so to deny some to others is neither just nor charitable. The plowman sits still in the Church and the Priest labours; and the wearied man is permitted to his refreshment, and others not permitted because they need it not (Ordinary Gloss on Mt. 28); and there is no violation of any commandement of God, even when there is a profanation of the day indulged upon pious and worthy considerations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 366</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

olasquotes.github.io%2Fquote%2F81490dfea0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/81490dfea0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=6.%20The%20question%20concerning%20particular%20works,indulged%20upon%20pious%20and%20worthy%20considerations&amp;text=6.%20The%20question%20concerning%20particular%20works%2C%20or%20permitted&amp;text=the%20day%20indulged%20upon%20pious%20and%20worthy%20considerations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-129532c924" data-kw="">
<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 52</span></figcaption>

</figure><figure class="quote" id="q-da6a422848" data-kw="sabbath partly moral ceremonial">
<blockquote><p>Whether the first institution of the Sabbath was in the fourth commandment; and whether the commandment is partly moral, partly ceremonial. The former we deny; the latter we affirm. The true derivation of the word is from the verb shbhth (i.e., “to cease” or “to rest”), which relates either to the existence of a thing, when it ceases to be and fails, or to the operation of an agent.</p></blockquote>

<blockquote><p>6. Works of comliness, tending to honest or decent walking… By all which believers have allowance: 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord has not straightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will he have their consciences to be fettered with inextricable scruples: He leaveth it to men on other days how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but [that] men would look: 1. to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments</cite>, ... (Glasgow, 1676), 4th Commandment, p. 171</span></figcaption>

</figure><figure class="quote" id="q-9b5478b31f" data-kw="">
<blockquote><p>The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dennison.html">James Dennison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Market Day of the Soul: the Puritan Doctrine of the Sabbath in England</cite>, 1532-1700 (RHB, 2008), pp. 133-34</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Puritan doctrine generally opposed the extreme strictness which some accorded the Sabbath. Some [extreme persons] argued that: (1) Ex. 16:23 prohibited all baking and cooking on the Sabbath; (2) Ex. 16:29 forbade all walking on the Sabbath; (3) Ex. 20:10 prohibited all work of any kind on the Sabbath [even acts of necessity]; (4) Ex. 31:14-15; 35:3; Num. 15:35 forbade all work, even the gathering of sticks for a fire, on the Sabbath. (Cf. George Walker, The Doctrine of the Holy Weekly Sabbath (1641) pp. 117-19) The puritan answer to this excessive strictness was to direct attention to the context of each Biblical reference… Ex. 20:10 was never intended to forbid works of necessity and charity, as Christ Himself makes clear when He shows that it was lawful to pull a beast out of a pit on the Sabbath (Lk. 14:5), to lead a beast to water on the Sabbath (Lk. 13:15) and to circumcise a man on the Sabbath (Jn. 7:22-23). (Ibid., p. 121) Ex. 35:3 forbade the kindling of a fire on the Sabbath, but the context makes it clear that fires in general were not prohibited; rather fires for work on the Tabernacle were forbidden. (Ibid., p. 121) Ex. 31:14-15 and Num. 15:35 make work on the Sabbath punishable by death; however, Walker argues that it is work done presumptuously (cf. Num. 15:30-31), i.e. by contemptuously despising the commandment of God, which incurs the death penalty. (Ibid. p. 122)”

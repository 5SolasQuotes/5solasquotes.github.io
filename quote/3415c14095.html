<main class="wrap"><figure class="quote" id="q-3415c14095" data-kw="">
<blockquote><p>It is proper to observe the contrast between that dark and feeble kind of knowledge which the fathers enjoyed under the law, and the fullness which shines forth to us in the gospel. Though God deigned to bestow on his ancient people the light of heavenly doctrine, yet he made himself more familiarly known through Christ, as we are told; “No man hath seen God at any time; the only-begotten Son, who is in the bosom of the Father, hath declared him.” (John 1:18.) The Prophet now extols that certainty which the Son of God brought to us by his coming, when he “sheweth to us the Father.” (John 14:9.)

Yet, while we excel the ancient people in this respect, that the reconciliation obtained through Christ makes God, as it were, more gracious to us, there is no other way in which God can be known but through Christ, who is “the pattern and image of his substance.” (Hebrews 1:3.) “He who knoweth not the Son, knoweth not the Father.” (John 14:7.) Though Jews, Mahometans, and other infidels, boast that they worship God, the creator of heaven and earth, yet they worship an imaginary God. However obstinate they may be, they follow doubtful and uncertain opinions instead of the truth; they grope in the dark, and worship their own imagination instead of God. In short, apart from Christ, all religion is deceitful and transitory, and every kind of worship ought to be abhorred and boldly condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 201.</span></figcaption>

<blockquote><p>Question. After the ministry of the Word and the seals, how is the freewill-offering, or collection for the saints, to be administered? Answer:

1. For the time, it is to be made every Lord’s Day, which is the first day of the week.

2. For the measure, as God hath prospered every man. 3 For the manner; not of constraint, but freely, and to be presented, as an offering to the Lord, and laid down, as at first before the apostles, so afterward, by their appointment, before the deacons of church, as into a common treasury.</p></blockquote>

</figure><figure class="quote" id="q-4a3854f00b" data-kw="">
<blockquote><p>That which pertains to the seventh day is expedient for the human being, tied up with various occupations, that God should choose one day for him in which he should exercise himself more greatly in prayer, and take delight in God more than on other days. We know Sabbath observation is perpetual among Christians, in order that they should abstain from sins and wickedness that offend God. But the time for working is fixed. God blessed the seventh day and without doubt set it apart for us, and he admonished us that if we would sanctify it to the Lord, then we would not be deprived of its blessing. It is true rest from external works, so that we might rejoice and take delight in the Lord. For all things have been made on our account, and, lest anyone should think that we Judaize, even the Sabbath was established for humankind.

We know what liberty of conscience is, but at the same time we should pay attention to the weakness of the people. If only the whole multitude would keep the Sabbath perpetually and no one would refuse. But since of course this is never achieved, we at least request that those whose concern it is would grant a certain day to the weak people, which they might consecrate to God. Not that we would intend other days for foolishness and those things which are opposed to God, but we seek that one day that we might reserve specially for God, and faith requires this. And if we do not do this we show that there is little of faith in us. Do we think that God cannot feed us unless we work every day? Some sin greatly in this matter, for they allow no rest or time off for servants or beasts of burden, as if God were not able to support them unless they work all the time. Paul in Hebrews 3 and 4 sweetly alludes to the Sabbath day and why it ought to be observed with the greatest diligence, and he says that we will be able to enter into that rest, and so on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Genesis</cite>, trans. Mickey Mattox, Reformation Texts with Translation, no. 13 (1531; Milwaukee WI: Marquette University Press, 2013), pp 113, 115.</span></figcaption>

</figure><figure class="quote" id="q-f23d618857" data-kw="">
<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper</cite>, … (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.”

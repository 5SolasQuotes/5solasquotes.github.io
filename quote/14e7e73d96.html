<blockquote><p>To give a larger view, in short, of some of the differences between Feser and myself (and many others), the following comparisons respect specifically the voluntary exercise of one’s own faculty in regard to the necessity (or not) of the realization of an essential end of that faculty: 1. An essential natural end fixes moral possibility vs. An essential natural end entails ethical weight and a general orientation. 2. Acting against the given teleological end is morally, metaphysically impossible vs. Acting against the teleological end admits of proportional exceptions (i.e. the greater good). 3. Teleological, moral and metaphysical necessity in such a context are bound up together vs. these three things can function separately. 4. Properly functioning biology determines an action’s moral-kind vs. Rational, moral ordering and reasoning determines moral-kind and ought to (and does) weigh competing goods, proportionality, context and intention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to</cite>, [Edward] Feser’ (RBO, 2025) | Conclusions:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>§2. But first I will lay together some propositions for decision of the controversy: How far we are bound to obey men’s precepts about religion, especially in case we doubt of the lawfulness of obeying them, and so cannot obey them in faith? §3. Briefly: 1. We must obey both magistrates and pastors in all things lawful which belong to their offices to command. 2. It belongs not to their office to make God a new worship; but to command the mode and circumstances of worship belongs to their office. For guiding them wherein, God has given them general rules. 3. We must not take the lawful commands of our governors to be unlawful. 4. If we do through weakness or perverseness take lawful things to be unlawful, that will not excuse us in our disobedience. Our error is our sin, and one sin will not excuse another sin. Even as on the other side, if we judge things unlawful to be lawful, that will not excuse us for our disobedience to God in obeying men. 5. As I have before showed, many things that are miscommanded must be obeyed. 6. As an erroneous judgment will not excuse us from obedience to our governors, so much less will a doubtfulness excuse us. 7. As such a doubting, erring judgment cannot obey in (plenary) faith, so much less can he disobey in faith. For it is a known command of God, that we obey them that have the rule over us: but they have no Word of God against the act of obedience now in question. It is their own erring judgment that entangles them in a necessity of sinning (till it be changed). 7. In doubtful cases, it is our duty to use God’s means for our information: and one means is to consult with our teachers and hear their words with teachableness and meekness. 8. If upon advising with them we remain in doubt about the lawfulness of some circumstance of order, if it be such as may be dispensed with, they should dispense with us: if it may not be dispensed with without a greater injury to the Church or cause of God than our dispensation will countervail, then is it our duty to obey our teachers notwithstanding such doubts: For it being their office to teach us, it must be our duty to believe them with a human faith, in cases where we have no evidences to the contrary: And the duty of obeying them being certain, and the sinfulness of the thing commanded being uncertain and unknown, and only suspected, we must go on the surer side. 9. Yet must we in great and doubtful cases, not take up with the suspected judgment of a single pastor, but apply ourselves to the unanimous pastors of other Churches. 10. Christians should not be over-busy in prying into the work of their governors, not too forward to suspect their determinations: But when they know that it is their ruler’s work to guide them by determining of due circumstances of worship, they should without causeless scruples readily obey, till they see just reason to stop them in their obedience; They must not go out of their own places to search into the actions of another man’s office to trouble themselves without any cause.</p></blockquote>

</figure><figure class="quote" id="q-94a10c0bd4" data-kw="">
<blockquote><p>Objection 9 [of a congregationalist to presbyterianism]: ‘From the church here spoken of [in Mt. 18] there is no appeal because the sentence is ratified in heaven. It inflicts the highest punishment: the censure of excommunication; and a higher judicature can do no more. There is no reason to appeal to a higher judicature because the inferior may err, because all above a congregation are courts which may err also. For presbyteries, provincial councils, national, and the universal council of the catholic Church may err.’ So Mr. Mather (Richard Mather &amp; William Tompson, Answer to Mr. Herle, ch. 2, pp. 13-14). [Rutherford’s] Answer [1.]: Because the sentence is ratified in heaven is no reason why we may not appeal from a congregation. The sentence of an inferior judge proceeding rightly is ratified in heaven, yet we may appeal from him. To appeal is but upon fears of ill administration; to desert a lower court and go to a higher court. So when we fear that a counsel and advice given by a sister church is not according to the Word of God, which yet is according to the Word of God, upon the supposal of that fear we decline that council and take another. Neither are we to appeal de jure, ‘from a just sentence,’ in a presbytery. Illud possumus quod jure possumus [‘What we can do, is that which we can do by law’]. What the inferior Sanhedrin of Israel did justly was ratified in heaven. Yet by God’s Law there might be an appeal from it to the highest Sanhedrin. 2. Nor is this a good reason: that we may not appeal from a judicature which may inflict the highest censure. For inferior judicatures in Israel had power of life and death, yet might man appeal from them. 3. The cause of appeals is not because inferior judicatures may err: for so we might appeal from all judicatures, even from a general council, for it may err. But the true grounding [of appeals] is: 1. Because rarius errant, they [higher councils] ‘do not so frequently err’. 2. They are not so inclined and disposed to err, ‘for many eyes see more than one,’ and many eyes do more seldom miscarry in not taking up the right object than one. 3. Because we conceive more equality and less partiality in higher courts.</p></blockquote>

<blockquote><p>In this treatise Hemmingsen [a Lutheran] argues that all particular rules of ethical conduct can be derived from immutable axioms or first principles. Though moral philosophy works according to its own rules, Hemmingsen shows that its conclusions, far from being at odds with the divine revelation of the moral law, are identical with the ethical commandments of Scripture. Thus Hemmingsen includes a section on the Decalogue, along with a lengthy account of the traditional cardinal virtues, supported by a myriad of quotations from classical Greek and Roman sources. This important treatise looks both backward to classical and medieval philosophy and forward to developments in the seventeenth century and beyond.</p></blockquote>

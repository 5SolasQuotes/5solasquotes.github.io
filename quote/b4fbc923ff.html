<blockquote><p>All souls are rated and valued in God’s book, and account, at one and the same price; and therefore by nature are of equal worth and dignity. Under the law, the rich and the poor were to give the same ransom, Exod. 30: 15. “The rich shall not give more, and the poor shall not give less than half a shekel.” The redemption of souls, by the blood of Christ, costs one and the same price.

The poorest and the most despised soul that believes in Jesus, is as much indebted to him for the ransom of his soul, as the greatest and most illustrious person in the world. Moses, Abraham, Paul, &amp;c. did not cost Christ any thing more than poor Lazarus, or the meanest among all the saints did. “The righteousness of Christ is unto all, and upon all that believe, for there is no difference,” Rom. 3: 22.

But yet we must not understand this parity of human souls universally, or in all respects. Though being of one species or common nature, they are all equal, and those of them that are purchased by the blood of Christ are all purchased at one rate; yet there are divers other respects and considerations, wherein there are remarkable differences betwixt soul and soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pneumatologia. A Treatise of the Soul of Man</cite>, (1698) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 528.</span></figcaption>

<blockquote><p>LIkewise we refuse the opinion of Beda, that neither man nor beast did eat of any flesh, but only of the fruits of the earth before the Flood: neither do we allow the judgment of Thomas Aquinas, who thinks that the beasts which are now devourers of flesh, should have used that kind of food in the state of man’s innocency. [Summa] pt. 1, question 96, art.

1. The latter opinion we reject, because if man had not transgressed, there should have been no death in the world, Rom. 5:12, ‘Sin entred into the world by one man, and death by sin:’ if there should have beene no death in the world, because no sin, I see not how death should have entered upon other creatures, especially this violent death by slaughter: as the Apostle also says, Rom. 8:22, that every creature groans with us, and travails in pain together to this present: so that this bondage of pain and corruption, which makes man and beast groan together, was laid upon them together. Neither do I see how Basil’s opinion can stand, homily 11 on Genesis, that man in his innocency, though he should not have used the beasts for food, yet might have slain them, to take knowledge of their inward parts, and to help his experience that ways: or it should have been lawful unto him to kill them in hunting for his delight, as Pererius thinks, bk. 4 on Genesis, p. 663; for this slaughter and killing of beasts, upon what occasion soever, whether for food, for knowledge or pleasure, belongs unto the bondage of corruption, which by sin was brought into the world. The other opinion seems probable, especially because of these two places of Scripture: First, for that the beasts and fowls lived in the ark, not of flesh, but of other food than usual, as Noah is bidden to take of all meat that was eaten, Gen. 6:21, for there being only one couple of unclean beasts, and seven couple of clean preserved in the ark: out of these there could not be food of flesh sufficient for the rest: and after the cattle went out of the ark, there was no other food for them, all flesh being destroyed, but only by the fruits of the earth. Secondly, the first permission to eat flesh that we read of was after the flood, Gen. 9:3. Everything that moves and liveth shall be meat for you as the greene herb. But these objections may be easily answered. To the first we answer:

1. That the beasts which did devour flesh, did also feed of herbs: and so Noah might provide for them according to their eating: Though they did use altogether to live of flesh, yet I think that for that present time, and some while after, all beasts might return to the first food appointed in the creation, this being a second creation and renewing of the world; so that upon this extraordinary occasion and urgent necessity, it cannot be gathered what was the ordinary food of beasts before, no more than it can be inferred, that because beasts of contrary natures, as the lion and calf, bear and cow, wolf and lamb, leopard and kid, did lie together, Isa. 11:6, that there was no enmity between them before. To the second place: Our answer is that there that liberty is only renewed, as is the blessing to increase and multiply, verse 1, and the prohibition of shedding mans blood: verse 5, at the hands of a man’s brother will I require the life of man: for before the Flood, the blood of Abel was required at the hands of his brother Cain. Notwithstanding therefore these objections, I think it more probable that both man and beast after the transgression, before the Flood, did use indifferently both the fruits of the earth and the flesh of beasts for food: the grounds of this opinion are these:

1. That one beast did not raven upon another in the state of man’s innocency, two principal reasons may be given: one, because as yet no death was entered into the world; the other, for that man bearing perfect rule and dominion over the creatures, did keep them in order: but after man’s fall, both these causes were taken away; for not only death entred upon man, but the other creatures were brought into the same bondage, and were killed for sacrifice: as Abel offered of the fat of the sheep, Gen. 4:3; if it were lawfull then to slay beasts, why not to eat of their flesh? And againe, man having lost his soveraignty over the creatures, they then began one to rage upon another, as not standing now in the like awe and fear of man as before: this cause is touched by the prophet, Habakkuk 1:14, ‘Thou makest man as the fishes of the sea, and as the creeping things that have no rule over them:’ that is, which do one consume and devour another, because they have no governor: this rule the beasts, fishes and fowls had shaken off immediately upon man’s Fall, and not only after the Flood.

2. Seeing in the old world two great sins abounded, carnal lust, and concupiscence, Gen. 6:2, and tyranny and oppression: verse 4, there were giants or tyrants in the earth: and tyranny and oppression brought forth bloodshed; for which cause the prohibition of shedding of man’s blood is so straightly forbidden after the flood, that God will require it at the hands of every beast, and of a man’s brother, Gen. 9:5. How is it like, that they would abstain from killing of beasts, that spared not to spill the blood of men? or from eating of flesh, which is more apt to provoke unto lust than the simple fruits of the earth?

3. If the flesh of beasts was not eaten before the Flood, what then became of the increase of cattle? How was not the earth overrun with them? This reason was given, why the Lord would not at once but by little and little destroy the Canaanites before the Israelites, lest the beasts of the field should increase upon them, Dt. 7:22, because they both helped to destroy the cruel beasts, and did eat the unclean, as swine and such other, both which by their multitudes otherwise might have been an annoyance to the Israelites. But greater fear was there of overspreading the earth with increase of beasts before the Flood, if no such provision had been made to diminish their number.

4. But that place most of all confirms our opinion, Gen. 7:2, where mention is made of clean and unclean beasts: which difference was observed before the Flood, and continued by tradition; not in regard only of sacrifice, but also for their eating, as it may appear in the reviving of this law afterward, Lev. 11:47. That there may be difference between the unclean and clean, and between the beast that may be eaten, and the beast that may not be eaten: that then is said by the definition of the law to be a clean beast, that might be eaten, that unclean, that might not be eaten. So I conclude this question with the sentence of Ambrose, Quico•vivium adornat, etc. ‘He that prepares a feast, does kill his oxen and fat cattle before, and then bids his guests: so the Lord,’ ante homini caeterorum animalium praeparavit epulas, ‘before prepared the meats of other beasts, and then as his friend’ invitavit ad convivium, ‘bid him to the banquet,’ Epistle 37. His opinion is that the cattle were provided of God to be meat for man. Mercerus is of another judgement, that the eating of flesh was generally forborn before the Flood, which is also the opinion of the Hebrews: 1. both because it was necessary for the preservation of the kinds of cattle: 2. as also herbs being then of greater virtue and strength before the Flood and after, might suffice for man’s sustenance. Mercer, on Gen. 1:29. But these reasons conclude not.

1. Like as after the Flood, when liberty was granted to eat flesh, as the green herb, yet they did forbear for a time, till the breed of cattle was increased, upon the like reason before the Flood, immediately after the creation, they might abstain for a time from the eating of flesh, but not altogether.

2. The great virtue and strength of herbs concludes that the eating of flesh was not so general, or necessary, then as afterward, but the whole abstinence from all kind of eating of flesh, it concludes not. I rather prefer [Wolfgang] Musculus’s opinion, who upon the sacrificing of beasts and wearing of their skins, infers that beasts were killed before the Flood, and consequently their flesh eaten, in Gen. 1:29.</p></blockquote>

use+indifferently+both+the+fruits+of+the+earth+and+the+flesh+of+beasts+for+food%3A+the+grounds+of+this+opinion+are+these%3A%0A%0A1.+That+one+beast+did+not+raven+upon+another+in+the+state+of+man%E2%80%99s+innocency%2C+two+principal+reasons+may+be+given%3A+one%2C+because+as+yet+no+death+was+entered+into+the+world%3B+the+other%2C+for+that+man+bearing+perfect+rule+and+dominion+over+the+creatures%2C+did+keep+them+in+order%3A+but+after+man%E2%80%99s+fall%2C+both+these+causes+were+taken+away%3B+for+not+only+death+entred+upon+man%2C+but+the+other+creatures+were+brought+into+the+same+bondage%2C+and+were+killed+for+sacrifice%3A+as+Abel+offered+of+the+fat+of+the+sheep%2C+Gen.+4%3A3%3B+if+it+were+lawfull+then+to+slay+beasts%2C+why+not+to+eat+of+their+flesh%3F+And+againe%2C+man+having+lost+his+soveraignty+over+the+creatures%2C+they+then+began+one+to+rage+upon+another%2C+as+not+standing+now+in+the+like+awe+and+fear+of+man+as+before%3A+this+cause+is+touched+by+the+prophet%2C+Habakkuk+1%3A14%2C+%E2%80%98Thou+makest+man+as+the+fishes+of+the+sea%2C+and+as+the+creeping+things+that+have+no+rule+over+them%3A%E2%80%99+that+is%2C+which+do+one+consume+and+devour+another%2C+because+they+have+no+governor%3A+this+rule+the+beasts%2C+fishes+and+fowls+had+shaken+off+immediately+upon+man%E2%80%99s+Fall%2C+and+not+only+after+the+Flood.%0A%0A2.+Seeing+in+the+old+world+two+great+sins+abounded%2C+carnal+lust%2C+and+concupiscence%2C+Gen.+6%3A2%2C+and+tyranny+and+oppression%3A+verse+4%2C+there+were+giants+or+tyrants+in+the+earth%3A+and+tyranny+and+oppression+brought+forth+bloodshed%3B+for+which+cause+the+prohibition+of+shedding+of+man%E2%80%99s+blood+is+so+straightly+forbidden+after+the+flood%2C+that+God+will+require+it+at+the+hands+of+every+beast%2C+and+of+a+man%E2%80%99s+brother%2C+Gen.+9%3A5.+How+is+it+like%2C+that+they+would+abstain+from+killing+of+beasts%2C+that+spared+not+to+spill+the+blood+of+men%3F+or+from+eating+of+flesh%2C+which+is+more+apt+to+provoke+unto+lust+than+the+simple+fruits+of+the+earth%3F%0A%0A3.+If+the+flesh+of+beasts+was+not+eaten+before+the+Flood%2C+what+then+became+of+the+increase+of+cattle%3F+How+was+not+the+earth+overrun+with+them%3F+This+reason+was+given%2C+why+the+Lord+would+not+at+once+but+by+little+and+little+destroy+the+Canaanites+before+the+Israelites%2C+lest+the+beasts+of+the+field+should+increase+upon+them%2C+Dt.+7%3A22%2C+because+they+both+helped+to+destroy+the+cruel+beasts%2C+and+did+eat+the+unclean%2C+as+swine+and+such+other%2C+both+which+by+their+multitudes+otherwise+might+have+been+an+annoyance+to+the+Israelites.+But+greater+fear+was+there+of+overspreading+the+earth+with+increase+of+beasts+before+the+Flood%2C+if+no+such+provision+had+been+made+to+diminish+their+number.%0A%0A4.+But+that+place+most+of+all+confirms+our+opinion%2C+Gen.+7%3A2%2C+where+mention+is+made+of+clean+and+unclean+beasts%3A+which+difference+was+observed+before+the+Flood%2C+and+continued+by+tradition%3B+not+in+regard+only+of+sacrifice%2C+but+also+for+their+eating%2C+as+it+may+appear+in+the+reviving+of+this+law+afterward%2C+Lev.+11%3A47.+That+there+may+be+difference+between+the+unclean+and+clean%2C+and+between+the+beast+that+may+be+eaten%2C+and+the+beast+that+may+not+be+eaten%3A+that+then+is+said+by+the+definition+of+the+law+to+be+a+clean+beast%2C+that+might+be+eaten%2C+that+unclean%2C+that+might+not+be+eaten.+So+I+conclude+this+question+with+the+sentence+of+Ambrose%2C+Quico%E2%80%A2vivium+adornat%2C+etc.+%E2%80%98He+that+prepares+a+feast%2C+does+kill+his+oxen+and+fat+cattle+before%2C+and+then+bids+his+guests%3A+so+the+Lord%2C%E2%80%99+ante+homini+caeterorum+animalium+praeparavit+epulas%2C+%E2%80%98before+prepared+the+meats+of+other+beasts%2C+and+then+as+his+friend%E2%80%99+invitavit+ad+convivium%2C+%E2%80%98bid+him+to+the+banquet%2C%E2%80%99+Epistle+37.+His+opinion+is+that+the+cattle+were+provided+of+God+to+be+meat+for+man.+Mercerus+is+of+another+judgement%2C+that+the+eating+of+flesh+was+generally+forborn+before+the+Flood%2C+which+is+also+the+opinion+of+the+Hebrews%3A+1.+both+because+it+was+necessary+for+the+preservation+of+the+kinds+of+cattle%3A+2.+as+also+herbs+being+then+of+greater+virtue+and+strength+before+the+Flood+and+after%2C+might+suffice+for+man%E2%80%99s+sustenance.+Mercer%2C+on+Gen.+1%3A29.+But+these+reasons+conclude+not.%0A%0A1.+Like+as+after+the+Flood%2C+when+liberty+was+granted+to+eat+flesh%2C+as+the+green+herb%2C+yet+they+did+forbear+for+a+time%2C+till+the+breed+of+cattle+was+increased%2C+upon+the+like+reason+before+the+Flood%2C+immediately+after+the+creation%2C+they+might+abstain+for+a+time+from+the+eating+of+flesh%2C+but+not+altogether.%0A%0A2.+The+great+virtue+and+strength+of+herbs+concludes+that+the+eating+of+flesh+was+not+so+general%2C+or+necessary%2C+then+as+afterward%2C+but+the+whole+abstinence+from+all+kind+of+eating+of+flesh%2C+it+concludes+not.+I+rather+prefer+%5BWolfgang%5D+Musculus%E2%80%99s+opinion%2C+who+upon+the+sacrificing+of+beasts+and+wearing+of+their+skins%2C+infers+that+beasts+were+killed+before+the+Flood%2C+and+consequently+their+flesh+eaten%2C+in+Gen.+1%3A29.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+A+Sixfold+Commentary+upon+the+Two+first+Books+of+Moses%2C+%E2%80%A6+%28d.+1621%3B+1633%29%2C+ch.+1%2C+question+35%2C+%E2%80%98Whether+the+flesh+of+beasts+were+eaten+before+the+flood%E2%80%99%2C+pp.+14-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbdc5ffc7c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bdc5ffc7c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=LIkewise%20we%20refuse%20the%20opinion%20of,their%20flesh%20eaten%2C%20in%20Gen.%201%3A29&amp;text=LIkewise%20we%20refuse%20the%20opinion%20of%20Beda%2C%20that&amp;text=and%20consequently%20their%20flesh%20eaten%2C%20in%20Gen.%201%3A29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Aquinas and other Scholastic philosophers often employ the principle agere sequitur esse (Latin for “action follows being”). The basic idea is that what a thing does necessarily reflects what it is. Eyes and ears function differently because they are structured differently. Plants take in nutrients, grow, and reproduce while stones do none of these things, because the former are living things and the latter are inanimate… The PPC [Principle of Proportionate Causality] tells us, again, that whatever is in the thing that changes or comes to exist must in some way have been in the total set of factors that brought about this change or existent. In this sense, the effect cannot go beyond the cause. A formal cause is the nature of a thing, that which makes it the kind of thing it is… The principle agere sequitur esse basically says that these attributes and activities cannot go beyond that nature, any more than an effect can go beyond its efficient cause. Hence, a stone cannot exhibit attributes and activities like nutrition, growth, and reproduction, because these go beyond the nature of a stone. Anything that could do these things wouldn’t be a stone in the first place. The principle agere sequitur esse, like the PPC, follows from the PSR [Principle of Sufficient Reason, that everything has a sufficient reason for it]. If an effect could go beyond its total efficient cause, then the part of the effect that went beyond it would have no explanation and be unintelligible. Similarly, if a thing’s activities could go beyond its nature—if, for example, a stone could take in nutrients or use language—then this activity would lack an explanation and be unintelligible… …even a materialist could agree that if intellectual activity were immaterial, then the thing which carries out that activity would itself have to be immaterial. And indeed, the naturalist philosopher John Searle takes precisely that view in criticizing a theory known as property dualism. Property dualism holds that mental properties are immaterial but that they are nevertheless properties of a material thing —namely, the brain. The theory is essentially an attempt to acknowledge the problems with materialist theories of the mind without having to accept the dualist view that the mind is an immaterial thing. Searle’s criticism is that the theory is unstable. If the property dualist maintains that a mental property is something ‘over and above’ the brain, then the trouble in Searle’s view is that such a property cannot be a property of the brain, but must be ‘a separate thing, object, or non-property type of entity’. On the other hand, if a mental property really is a property of the brain, then it cannot be something ‘over and above’ the brain. Other critics of property dualism have complained that it is mysterious how an entirely material thing like the brain could give rise to immaterial properties.</p></blockquote>

<blockquote><p>The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… Traditionally, the act of entertaining a concept is known as simple apprehension; the act of affirming or denying the truth of a proposition is known as judgment; and the act of inferring a proposition from other propositions is known as reasoning. Simple apprehension, judgment, and reasoning are the intellect’s basic operations. Being rational or capable of thought is essentially a matter of having the capacity for these operations of the intellect.</p></blockquote>

<blockquote><p>II. God made Man in his own Image in respect of Intellect and Understanding, Knowledge and Wisdom.

God is the Only-wise perfect in Knowledge, and his Understanding is infinite. So his Word speaks of Him, and his Works declare it of Him. He that formeth the Eye, shall He not see? and He that teacheth Man Knowledge shall He not know? There is not a Soul so brutish as not to allow this.

Man, in his Soul and Body is the most eminent Display of the Knowledge and Wisdom of God here on Earth. The Mind and Eye of Man survey the Heavens, Earth, Seas and all the Creatures, and see how in Wisdom God hath made them all. Then we behold our Selves alone, among all the Creatures here on Earth, capable of this Understanding, and are led to say unto our Selves and unto God, Where is God my Maker! that teacheth me more than the Beasts of the Earth, and maketh me wiser than the Fowl of Heaven.

Man in his first State was happy and glorious in a Perfection of Knowledge and Wisdom, proper for an imbodied Spirit. He had not the Knowledge of Angels, for he was made lower than they; but he was wise as an Angel in Flesh should be. He was created with a due Knowledge of God his Maker, of Himself, and of the Creatures about him. God spake to our first Parents, and they to each other in an admirable manner, as is related by Moses. Their Minds were full of Light, the Law of God was in their Heart, and they were in the Possession of their own Souls and of Intellectual Happiness. They wanted no more Knowledge of Good at the Time, and to be sure needed no Knowledge of Evil.

This Understanding of Man was a Beam from the Light of the Knowledge and Glory of God upon him. God made him like Himself an Intellect, an Intelligence; the Inspiration of the Almighty gave him his Understanding. In his Light Man saw Light. And now Souls are renewed in Knowledge after the Image of God. They are renewed into the Likeness, in part, wherein they were first created. As they grow in holy Knowledge, they are changed more and more into the Divine Image from Glory to Glory.

The Devil tempted our Parents to aspire after more Knowledge, and so they fell. The Father of Light had given them as much of this perfect Gift as was good and fitting for them. This should have highly contented them, and filled ’em with Delight and Thankfulness. And so it did, until the false Fiend persuaded them to think, that GOD forbid ’em the Tree of Knowledge left it should make ’em wiser and better than they were.

Alas! they found nothing by it but the Knowledge of Sin and Misery, of which it was their Happiness to be ignorant; and they lost the Knowledge of all the Good which they before enjoyed. We remain miserable, and perish in our Ignorance of God, unless we are renewed after Him in Knowledge. True spiritual Wisdom is restored in the Regeneration of Souls. God gives the Light of the Knowledge of his Glory in the Face of JESUS CHRIST. They who were sometimes Darkness, are made Light in the Lord. They are full of Goodness, filled with all Knowledge.

That the Soul be without Knowledge, is not good. It is very evil to it to be so. What is a dark and blind Soul good for! the Light that is in it is Darkness. The Light of Life is from the Father of Glory, the Father of Christ, the Eyes of our Understanding being-enlightned, to know the Hope of his Calling. God gives the Spirit of Wisdom and Revelation in the Knowledge of his Son. This is the Image of the Father restored in his Elect. So they become again the Children of God; filled with the Knowledge of his Will, in all Wisdom and spiritual Understanding.

What a bright Account is this, given by the Holy Ghost, of the Image of God on the Soul of Man, in respect of Knowledge! Not only has Man an Understanding which reflects on its own Acquirements, and (as an excellent Divine of our own says) “reads its own Knowledge, and communicates it to others; but the true and high Glory of this created Intellect is,” that it is capable of knowing God unto Eternal Life; for this is Life Eternal to know Him the only true God and Jesus Christ whom be has sent. And if Souls regenerated by the Spirit of God receive from him a sanctified Mind, a spiritual Discerning of Things relating to their own Duty and Happiness; how much more must we suppose our first Parents in their state of Integrity and Perfection to be bless’d with a most holy Knowledge and spiritual Discerning?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47a3120ee1" data-kw="">
<blockquote><p>Shortly after that the people of Israel, I mean the tribes of Juda, Benjamin, and Levi, were, by the miraculous work of God, after the bondage of seventy years, set at liberty and brought again to Jerusalem; in which they did re-edify the temple, repair the walls, and begin to multiply, and so to grow to some strength within the city and land; they fall to their old nature, I mean to be ungrate and unthankful unto God. The people were slothful; and the priests, who should have provoked the people to the remembrance of those great benefits, were become even like to the rest. The Lord therefore did raise up his Prophet Malachi (who was the last before Christ) sharply to rebuke, and plainly to convict this horrible ingratitude of that unthankful nation, who so shamefully had forgotten those so great benefits recently bestowed upon them. And thus begins he his Prophecy: “I have loved you, sayeth the Lord,” in which words he speaks not of a common love, which in preserving and feeding all creatures is common to the reprobate, but of that love by the which he had sanctified and separated them from the rest of nations, to have his glory manifested. But because they (as all ungrate persons do) did not consider wherein this his love towards them more then towards others did stand, he brings them to the fountain, demanding this question: “Was not Esau brother to Jacob? saith the Lord, and nevertheless Jacob have I loved, and Esau I have hated.” And this he proves, not only by the diversity of the two countries which were given to their posterities, but also by that, that God continually showed himself loving to Jacob and to his posterity [which group of people included reprobates], reducing them again after long captivity; declaring himself, as it were, enemy to Edom, whose desolation he would never restore, but would destroy that which they should go about to build.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On Predestination” in The Works of John Knox</cite>, ed. David Laing (Edinburgh: J. Thin, 1895), 5:150-51</span></figcaption>

</figure><figure class="quote" id="q-60a16bbd50" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind, in supplying their necessities, with the light and warmth of the sun, and with the rain; as well as a special love and favor, which He exercises only toward those that are good, and members of Christ; so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>

ine</a></div>

<blockquote><p>[7.] Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mark 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Matt 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatening of divine vengeance], 1 John 5:23, Matt 11:21; witness those pathetical lamentations, Matt 23:37, Luke 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners; so in Ps. 40:7,8, ‘I delight to do thy will, O my God; thy law is in my heart;’ or, as the Hebrew has it b’tok m’ee, ‘It is in the midst of my bowels.’ Now mark, the will of the Father was the salvation of sinners. This was the will of the Father, ‘That Jesus Christ should seek and save them that are lost,’ Matt 18:11. Now says Christ, ‘I delight to do thy will, O my God;’ it is the joy and rejoicing of my heart to be a-seeking and a-saving lost sinners. When Christ was an hungry, He went not into a victualling house [a house of eating], but into the temple, and taught the people most part of the day, to show how much He delighted in the salvation of sinners, etc. [Footnote: Christ did so much delight, and his heart was so much set upon the conversion and salvation of the Samaritans, that He neglected his own body to save their souls, as you may clearly see in John 4.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ in Works</cite>, vol. 3, p. 206</span></figcaption>

<blockquote><p>Now the means God has appointed for a man’s recovery are diverse: First, There are means by way of love and goodness: There are also means by way of chastisements and afflictions By way of Love; How winning and overcoming should that be? Love does surround you; it’s love that you live, that you breath; its love, you are preserved from hell and damnation; its love, that you have any support at all; therefore the goodness of God in all the creatures you enjoy, should lead you to repentance, Rom. 2[:4]. The sun that shines to you, the earth that brings forth fruit for you, the health and perfection of the senses, should melt you always into good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, (1652; Ames, Iowa: 1990), Sermon 66, “Showing that the Damnation of Wicked Men is unpleasing to God, and that which He delights not in”, pp. 403-8</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now the means God has appointed for a man’s recovery are diverse: First, There are means by way of love and goodness: There are also means by way of chastisements and afflictions By way of Love; How winning and overcoming should that be? Love does surround you; it’s love that you live, that you breath; its love, you are preserved from hell and damnation; its love, that you have any support at all; therefore the goodness of God in all the creatures you enjoy, should lead you to repentance, Rom. 2[:4]. The sun that shines to you, the earth that brings forth fruit for you, the health and perfection of the senses, should melt you always into good.”

— Anthony Burgess, Spiritual Refining: or A Treatise of Grace &amp; Assurance, pt. 1 (1652; Ames, Iowa: 1990), Sermon 66, “Showing that the Damnation of Wicked Men is unpleasing to God, and that which He delights not in”, pp. 403-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+the+means+God+has+appointed+for+a+man%E2%80%99s+recovery+are+diverse%3A+First%2C+There+are+means+by+way+of+love+and+goodness%3A+There+are+also+means+by+way+of+chastisements+and+afflictions+By+way+of+Love%3B+How+winning+and+overcoming+should+that+be%3F+Love+does+surround+you%3B+it%E2%80%99s+love+that+you+live%2C+that+you+breath%3B+its+love%2C+you+are+preserved+from+hell+and+damnation%3B+its+love%2C+that+you+have+any+support+at+all%3B+therefore+the+goodness+of+God+in+all+the+creatures+you+enjoy%2C+should+lead+you+to+repentance%2C+Rom.+2%5B%3A4%5D.+The+sun+that+shines+to+you%2C+the+earth+that+brings+forth+fruit+for+you%2C+the+health+and+perfection+of+the+senses%2C+should+melt+you+always+into+good.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+Spiritual+Refining%3A+or+A+Treatise+of+Grace+%26+Assurance%2C+pt.+1+%281652%3B+Ames%2C+Iowa%3A+1990%29%2C+Sermon+66%2C+%E2%80%9CShowing+that+the+Damnation+of+Wicked+Men+is+unpleasing+to+God%2C+and+that+which+He+delights+not+in%E2%80%9D%2C+pp.+403-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F21fe84f65e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/21fe84f65e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/common-grace#:~:text=Now%20the%20means%20God%20has%20appointed,should%20melt%20you%20always%20into%20good&amp;text=Now%20the%20means%20God%20has%20appointed%20for%20a&amp;text=the%20senses%2C%20should%20melt%20you%20always%20into%20good" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

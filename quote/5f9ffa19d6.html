<blockquote><p>Q. 2. On the Way that we Know God Positively we can say, following the lead of Scotus (Oxon. 1 d. 3 part one q.1) that our knowledge of God is: 1) Positive and not merely negative, because a purely negative knowledge is no knowledge. 2) Quidditative or essential and not merely knowledge of his existence or attributes, for in understanding existence or property we must pre-understand some quasi-subject in which we understand that quasi-property to be present in; therefore we do not merely understand whether God is but to some extent and imperfectly what God is. 3) Not merely in a concept analogous to the concept of a creature which, concept is altogether other than the one said of a creature, but in some concept univocal to God and creatures. This is plain directly from experience and indirectly follows once innatism, illuminationism, and ontologism have been rejected (see below). 4) Proper, but through concepts composed of common concepts. We can attain to many concepts proper to God that do not belong to creatures, for example, supreme being, infinite good, pure act, supreme legislator, etc. But concepts of this sort are not proper notions from proper notions but from transcendental notions, as first, supreme, being, good, which are predicated in common of God and creatures. 5) Notions abstracted from creatures, for as Scotus says, “All metaphysical investigation of God proceeds as follows: a) by considering the formal idea of something, and b) by taking away from that formal idea the imperfection that it has in creatures, and c) by keeping that formal idea and attributing to it altogether supreme perfection, and by thus attributing it to God” (Oxon. ibid.). Note the triple way, namely of affirmation, of negation, and of eminence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotus scholar and writes from that perspective., p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>3. He [the Arminian Conrad Vorstius] first says that ‘Scripture does not call God infinite.’ This is false. For Scripture thus says in Psalm 144:3: “Great is the Lord, exceedingly praiseworthy, whose magnitude has no end.” And Baruch 3:25: “It is great and has no bounds, immeasurable and highly-exalted.” These witnesses are not able to be interpreted as about magnitude of mass or quantity, which is not in God. But [it must be interpreted] as respecting his magnitude of perfection or virtue. Therefore, this is the sense: God is so great in virtue and perfection that he does not have an end or terminus of his virtue and perfection. From this, I reason thus: just as the end in virtue and perfection is that which has an end or terminus of its virtue and perfection, so on the opposite side, an infinite in virtue and perfection is that which does not have an end or terminus of its virtue and perfection. But God does not have an end or terminus of his virtue and perfection. Therefore, he is infinite in virtue and perfection. What shall Vorstius say at this point? The major premise is per se known by implication. The minor premise is openly expressed in Scripture. The conclusion is legitimately inferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-becanus.html">Martin Becanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae Scolasticae</cite>, (d. 1624; Leiden, 1683), First Tract on God &amp; the Divine Attributes, ch. 5, ‘Infinity of God’, pt. 1 tr. Michael Lynch Becanus is a Romanist.</span></figcaption>

<blockquote><p>10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, On Theodore Beza</span></figcaption>

<div class="actions"><button class="copy" data-copy="“10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.”

— Agnostic, On Theodore Beza | William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 171-73">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C10.+What+all+the+more+rigid+Protestants+affirm+for+certain%2C+that+God%2C+though+not+in+time%2C+yet+in+the+order+of+nature%2C+first+justifies+the+sinner%2C+or+forgives+his+sins%2C+and+afterwards+makes+him+just%2C+or+sanctifies+him%2C+let+them+look+well+to+it%2C+I+pray%2C+lest+perchance+they+too+audaciously+and+rashly+define+the+order+of+the+divine+actions%2C+which+has+not+been+manifestly+revealed+in+the+Scriptures.+In+the+%5BRomanist%5D+schools+themselves+there+has+been+no+small+contention+on+this+subject%2C+nor+is+it+yet+decided%3A+%E2%80%98Whether+the+infusion+of+grace%2C%E2%80%99+says+%5BThomas%5D+Stapleton+%28Of+Justification%2C+bk.+5%2C+ch.+8%2C+sect.+Rursum%29%2C+%E2%80%98precedes+the+forgiveness+of+sins+in+the+order+of+nature%2C+as+St.+Thomas+lays+down%E2%80%A6+or+whether+the+contrary+be+true%2C+as+others+most+strenuously+maintain%2C+is+rather+a+scholastic+question+than+one+now-a-days+controverted%2C+and+is+one+on+which+neither+formerly+nor+now+has+the+Church+defined+anything+on+either+side.%E2%80%99+The+moderation+of+Theodore+Beza+in+this+matter%2C+in+other+respects+sufficiently+rigid%2C+is+much+to+be+approved+of.+He+thus+writes+%28Demonstrations+against+Flacius+Illyricus+and+his+Apology%2C+sect.+22%2C+Rursum+quaero%2C+tome+2%2C+p.+218+%28or+p.+171%29%29%3A+%E2%80%98If+you+take+justification+in+a+general+sense%2C+as+it+is+sometimes+used+by+the+apostle%2C+sanctification+will+not+be+an+effect%2C+but+a+part+or+species+of+it%3B+but+if+merely+for+the+gift+of+imputed+justice%2C+or+the+gratuitous+forgiveness+of+sins%2C+than+sanctification+will+be+another+gift%2C+which+always+follows+that+first+gift%2C+since+whoever+is+justified+gratis+in+Christ+is+also+sanctified+by+His+Spirit%E2%80%A6+Nor+need+we+here+contend+much+which+of+the+two+precedes+in+order%2C+since+in+one+and+the+same+moment+Christ%E2%80%A6+justifies+us%2C+and+by+his+Spirit+begins+to+sanctify+us.%E2%80%99+and+%28p.+237%2C+sect.+23%2C+Praeterea+quum+%28or+p.+185%29%29%3A+%E2%80%98When+I+had+said+what+is+quite+true%2C+that%2C+provided+it+is+allowed+that+we+must+first+of+all+be+made+partakers+of+Christ+Himself%2C+that+in+Him+we+may+be+justified+and+sanctified%2C+we+need+not+labor+much+to+find+which+of+these+two+precedes+in+order.+lIllyricus+brings+forward+against+me+Calvin%2C+who+says+%28Antidote+to+the+Council+of+Trent%2C+sess.+6%2C+sect.+Neque+tamen+interea%2C+tome+8%2C+p.+241%29+that%2C+%E2%80%98as+soon+as+any+one+is+justified%2C+renewal+also+necessarily+follows.%E2%80%99+But+Calvin+here+refuting+the+decisions+of+the+Council+of+Trent%2C+by+which+justification+is+confounded+with+the+gift+of+sanctification%2C+is+not+disputing+about+the+order+or+series+of+these+two%2C+but+of+their+connection%3B+and+therefore+says%2C+that+%E2%80%98if+anyone+is+justified+renewal+also+follows%2C+i.e.%2C+that+it+is+necessarily+concluded+that%2C+if+any+one+be+justified%2C+he+may+also+be+said+to+be+sanctified.+But%2C+I+pray+you%2C+if+I+say%2C+%E2%80%98If+anyone+lives%2C+it+follows+that+he+is+endowed+with+a+soul%2C%E2%80%99+will+it+be+rightly+concluded+from+thence+that+I+make+the+being+endowed+with+a+soul+something+posterior+to+life%3F%E2%80%99+and+%28p.+238+%28or+p.+186%29+around+the+end%2C+sect.+Ego+vero+inhabitationem%29+%E2%80%98I+say+that+we+are+simultaneously+justified+and+renewed+in+Christ%2C+united+and+applied+to+us+by+faith%3B+and+I+think+that+we+need+not+trouble+ourselves+in+anyway+to+determine+whether+this+one+or+that+precedes+in+order%2C+since+we+never+receive+the+one+without+the+other%2C+etc.%E2%80%99+Would+that+this+moderation+were+religiously+followed%2C+not+only+by+the+more+rigid+Protestants%2C+but+also+by+very+many+other+theologians+of+both+parties%2C+who+now-a-days+excite+so+many+and+so+great+disturbanees+in+the+Church+about+the+mode+and+order+of+the+divine+operations.%E2%80%9D%0A%0A%E2%80%94+Agnostic%2C+On+Theodore+Beza+%7C+William+Forbes%2C+Considerationes+Modestae+et+Pacificae+Controversiarum+de+Justificatione...+4th+ed.+%28d.+1634%3B+1658%3B+Oxford%3A+Parker%2C+1850%29%2C+vol.+1%2C+bk.+2%2C+ch.+4%2C+pp.+171-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe5387e69f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e5387e69f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=10.%20What%20all%20the%20more%20rigid,and%20order%20of%20the%20divine%20operations&amp;text=10.%20What%20all%20the%20more%20rigid%20Protestants%20affirm&amp;text=the%20mode%20and%20order%20of%20the%20divine%20operations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>8. Likewise, every Christian should learn that this grace and this regeneration have not been given to us so that we might remain idle in that stage of our renewal which we at first obtained, but so that we may grow in everything into him who is the head. Therefore, the people must be taught to devote effort to this growth which indeed happens through good works, both internal and external, which are commanded and commended by God. To these works God has, in many passages from the Gospels, clearly and manifestly promised on account of Christ a reward – good things in this life, as much for the body as for the soul (as much as seems right to divine providence) and after this life in heaven. Therefore, although the inheritance of eternal life is due to the regenerate on account of the promise, as soon as they are reborn in Christ, nevertheless God also renders a reward to good works, not according to the substance of the works, nor because they come from us, but to the extent that they are performed in faith and proceed from the Holy Spirit, who dwells in us, free choice concurring as a partial agent.</p></blockquote>

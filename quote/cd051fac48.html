<main class="wrap"><figure class="quote" id="q-cd051fac48" data-kw="">
<blockquote><p>As God is essentially holy, so God is unmixedly holy. The holiness of God is a pure holiness, it is an unmixed holiness: 1 John i. 5, ‘God is light, and in him is no darkness at all.’ There are no mixtures in God. God is a most clear, bright-shining light, yea, he is all light, and in him is no darkness at all. The moon, indeed, when it shines brightest, hath her dark spots and specks, but God is a light that shines gloriously without the least spot or speck. Now, look, as that darkness which hath not the least light attending it is the grossest, the thickest Egyptian darkness that can be, so that light that hath not the least cloud of darkness attending it must be the most clear, splendid light that possible can be; and such a light is the Holy One of Israel.

It is very observable, the apostle, to illustrate the perfect purity and sanctity of God, adds a negative to his affirmative, ‘In him is no darkness at all,’ that is, God is so pure, that not the least spot, the smallest speck, can cleave to him; he is so holy, that no iniquity can be found in him; there is no defect nor default in the nature of God. He is a God of truth, and without iniquity; just and right is he.

As Moses spake in that Deut. xxxii. 4, God is a pure, a most pure act, without the least potentiality, defectability, or mutability, and therefore in the highest sense he is light, and in him is no darkness at all. Surely there is no unrighteousness in God; no evil can dwell with him, or come near unto him. God stands at such a distance from iniquity, yea, he so abhors it, that he never did, nor never will, bestow a good look upon it: Hab. i. 13, ‘Thou art of purer eyes than to behold evil, and canst not look on iniquity.’

There are four things that God cannot do: 1. He cannot lie; 2. He cannot die; 3. He cannot deny himself; nor, 4. He cannot look with a favourable eye upon iniquity. God doth indeed look upon iniquity with a hateful eye, with an angry eye, with a revengeful eye, and with a vindictive eye, but he never did nor will look upon iniquity with an eye of delectation, or with an eye of approbation. Witness his hurling the fallen angels out of heaven, and his banishing of sinning Adam out of paradise. By all this you see that the holiness of God is a pure holiness, it is a holiness without mixture.

But now all the holiness that is in the best and choicest saints in the world is but a dreggy holiness, a mixed holiness, a weak and imperfect holiness; their unholiness is always more than their holiness. Ah, what a deal of pride is mixed with a little humility, and what a deal of unbelief is mixed with a little faith, and what a deal of passion is mixed with a little meekness, and what a deal of earthliness is mixed with a little heavenliness, and what a deal of carnalness is mixed with a little spiritualness, and what a deal of hardness is mixed with a little tenderness!

Oh, but now the holiness of God is a pure holiness, it is a holiness without mixture, there is not the least drop nor the least dreg of unholiness in God. It is true the gods of the heathen were such as had been impure, beastly, filthy men, and therefore several writers have taken a great deal of pains to convince heathens of their impiety and folly in worshipping such for gods, upon whom they fastened many horrid, ridiculous, lascivious, and impious actions, and therefore they conclude against them, that they are no gods.

It is most certain that the true God, that he that is the High and the Holy One, cannot be charged with any iniquity, no, nor with the least show or shadow of vanity. In God there is wisdom without folly, truth without falsehood, light without darkness, and holiness without sinfulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 393-94.</span></figcaption>

<blockquote><p>24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not.

25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

<blockquote><p>I answer that, Power is twofold—namely, passive, which exists not at all in God; and active, which we must assign to Him in the highest degree. For it is manifest that everything, according as it is in act and is perfect, is the active principle of something: whereas everything is passive according as it is deficient and imperfect. Now it was shown above (I:3:2; I:4:1 and I:4:2), that God is pure act, simply and in all ways perfect, nor in Him does any imperfection find place. Whence it most fittingly belongs to Him to be an active principle, and in no way whatsoever to be passive. On the other hand, the notion of active principle is consistent with active power. For active power is the principle of acting upon something else; whereas passive power is the principle of being acted upon by something else, as the Philosopher says (Metaph. v, 17). It remains, therefore, that in God there is active power in the highest degree. Reply to Objection 1. Active power is not contrary to act, but is founded upon it, for everything acts according as it is actual: but passive power is contrary to act; for a thing is passive according as it is potential. Whence this potentiality is not in God, but only active power.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I answer that, Power is twofold—namely, passive, which exists not at all in God; and active, which we must assign to Him in the highest degree. For it is manifest that everything, according as it is in act and is perfect, is the active principle of something: whereas everything is passive according as it is deficient and imperfect. Now it was shown above (I:3:2; I:4:1 and I:4:2), that God is pure act, simply and in all ways perfect, nor in Him does any imperfection find place. Whence it most fittingly belongs to Him to be an active principle, and in no way whatsoever to be passive. On the other hand, the notion of active principle is consistent with active power. For active power is the principle of acting upon something else; whereas passive power is the principle of being acted upon by something else, as the Philosopher says (Metaph. v, 17). It remains, therefore, that in God there is active power in the highest degree. Reply to Objection 1. Active power is not contrary to act, but is founded upon it, for everything acts according as it is actual: but passive power is contrary to act; for a thing is passive according as it is potential. Whence this potentiality is not in God, but only active power.”

— Thomas Aquinas, Summa, pt. 1, Question 25, ‘The Power of God’ | Article 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer+that%2C+Power+is+twofold%E2%80%94namely%2C+passive%2C+which+exists+not+at+all+in+God%3B+and+active%2C+which+we+must+assign+to+Him+in+the+highest+degree.+For+it+is+manifest+that+everything%2C+according+as+it+is+in+act+and+is+perfect%2C+is+the+active+principle+of+something%3A+whereas+everything+is+passive+according+as+it+is+deficient+and+imperfect.+Now+it+was+shown+above+%28I%3A3%3A2%3B+I%3A4%3A1+and+I%3A4%3A2%29%2C+that+God+is+pure+act%2C+simply+and+in+all+ways+perfect%2C+nor+in+Him+does+any+imperfection+find+place.+Whence+it+most+fittingly+belongs+to+Him+to+be+an+active+principle%2C+and+in+no+way+whatsoever+to+be+passive.+On+the+other+hand%2C+the+notion+of+active+principle+is+consistent+with+active+power.+For+active+power+is+the+principle+of+acting+upon+something+else%3B+whereas+passive+power+is+the+principle+of+being+acted+upon+by+something+else%2C+as+the+Philosopher+says+%28Metaph.+v%2C+17%29.+It+remains%2C+therefore%2C+that+in+God+there+is+active+power+in+the+highest+degree.+Reply+to+Objection+1.+Active+power+is+not+contrary+to+act%2C+but+is+founded+upon+it%2C+for+everything+acts+according+as+it+is+actual%3A+but+passive+power+is+contrary+to+act%3B+for+a+thing+is+passive+according+as+it+is+potential.+Whence+this+potentiality+is+not+in+God%2C+but+only+active+power.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa%2C+pt.+1%2C+Question+25%2C+%E2%80%98The+Power+of+God%E2%80%99+%7C+Article+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2218b9f05f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2218b9f05f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-god-as-pure-act/#:~:text=I%20answer%20that%2C%20Power%20is%20twofold%E2%80%94namely,in%20God%2C%20but%20only%20active%20power&amp;text=I%20answer%20that%2C%20Power%20is%20twofold%E2%80%94namely%2C%20passive%2C%20which&amp;text=is%20not%20in%20God%2C%20but%20only%20active%20power" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

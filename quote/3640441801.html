<blockquote><p>11. …for they [Quakers] will salute no man, nor uncover their head, not only to their equals, but neither will they do it unto their superiors, nor give the least sign of respect, of honour, or of reverence in their gesture and carriage unto any whatsoever. And he [Robert Barclay] says he cannot see what we can say in defence of our practice. But we have shown above what is our ground: and we have seen the same practised by other worthy persons mentioned in Scripture… As concerning, says he, the fashions and customs of the nations, it is an evil argument for the practice of Christians, who should follow a better rule. Answer: And so we do follow a better rule; and yet we may follow the Law of nations, which is mostly gathered from the practice of nations, in things not contrary to the Law of God; for even the Law of nations, in such things, is a part of the Law of God, being but some particular applications or explications of the Law of Nature: And though no particular gesture, as a sign of respect and reverence, due to our equals or superiours, be universally received by all nations, yet the Law of Nations and their practice may teach us that by some one outward gesture or other we ought to witness our respect and declare that reverence that we owe to others: Christianity is no enemy to humanity and civility, whatever our morose and unmannerly Quakers dream.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism: the Pathway to Paganism, or a View of the Quakers’ Religion, being an Examination of the Theses &amp; Apology of Robert Barclay, one of their Number</cite>, ... (Edinburgh, 1678), ch. 31, ‘Of Civil Honor’, pp. 540-41</span></figcaption>

<blockquote><p>…we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individuall proprieties of every man: forma, figura, locus, tempus, strips, patria, nomen. Under form and figure, the first two, I comprehend such a proportion of body, a man of a high stature or low, a man beautiful or not beautiful, to which I crave leave to reduce all external forms of habits, as clothes, the head covered or not covered, the situation of the body, as as they are in themselves, mere physical acts, kneeling, sitting, standing, the eyes cast down to the earth or lifted up, the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural… 1. All these are common concomitants of civil, natural and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people, or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit [garment], some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions because neither actions natural, civil, nor religious can be performed but by some persons in some habit and gesture, in some time, in some place: and lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak, in this place, rather than that place… the praying is neither the more or the less acceptable to God because of these common and unseparable adjuncts. … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say ‘in all morals’ because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not appoint such things, but supposes them]: The Scripture says not that the Worship of God must have a time, a place, when, and where it’s to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be, because nature teaches that without time, place, person, habit, gesture, it’s impossible that these or any human actions can be; and therefore Prelatical Formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Introduction, pp. 2-5</span></figcaption>

ral%2C+civil%2C+nor+religious+can+be+performed+but+by+some+persons+in+some+habit+and+gesture%2C+in+some+time%2C+in+some+place%3A+and+lastly%2C+they+are+mere+circumstantials%2C+and+contribute+no+moral+goodness+or+badness+to+the+actions%2C+as+they+are+but+common+and+inseparable+circumstances%3B+for+because+he+preaches+in+time%2C+or+in+place+simply%2C+the+preaching+is+neither+morally+good%2C+nor+ill%2C+better+or+worse%2C+because+Thomas+prays+in+gown+or+cloak%2C+in+this+place%2C+rather+than+that+place%E2%80%A6+the+praying+is+neither+the+more+or+the+less+acceptable+to+God+because+of+these+common+and+unseparable+adjuncts.+%E2%80%A6+I+did+say+that+Christ+Jesus+has+set+down+in+the+Word+a+perfect+platform+of+Church-government+in+all+morals%3B+I+say+%E2%80%98in+all+morals%E2%80%99+because+the+Word+does+not+teach+us+anything+of+circumstances%2C+physical+as+physical.+Scriptura+talia+non+ponit%2C+sed+supponit+%5BScripture+does+not+appoint+such+things%2C+but+supposes+them%5D%3A+The+Scripture+says+not+that+the+Worship+of+God+must+have+a+time%2C+a+place%2C+when%2C+and+where+it%E2%80%99s+to+be+performed%2C+a+person%2C+who+is+to+perform+it%2C+a+habit%2C+or+garments+on+the+person+that+worships%3B+the+Scripture+teaches+none+of+these%2C+but+supposes+that+they+are+and+must+be%2C+because+nature+teaches+that+without+time%2C+place%2C+person%2C+habit%2C+gesture%2C+it%E2%80%99s+impossible+that+these+or+any+human+actions+can+be%3B+and+therefore+Prelatical+Formalists+do+without+all+sense+or+reason+require+that+we+should+prove+by+Scripture%2C+the+lawfulness+of+time%2C+place%2C+person%2C+habit%2C+gesture+in+God%E2%80%99s+worship%3B+for+these+are+presupposed+in+all+actions%2C+natural%2C+civil%2C+religious%2C+private%2C+public%2C+lawful%2C+unlawful%2C+in+acts+of+arts%2C+sciences%2C+of+moral+conversing+and+all%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+Introduction%2C+pp.+2-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote% <blockquote><p>We observe comely circumstances in the celebration of the sacrament, but we justly condemn those who have added such things unto which they have fancied mysteries, and proper significations, and that of those effects which appertain unto the water of baptism: As though the work should be twice or thrice done, and that either nothing, or that was not sufficient which was done by divine appointment, unless human rashness should have added supply.</p></blockquote>

<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London, 1657) | on Jn., 17:1</span></figcaption>

<blockquote><p>This gesture (says the Rejoinder [of the opponent]) may before, or by occasion of any of God’s ordinances, be performed lawfully to God. By occasion, I grant: but ‘before’ importes more: Might the Jews kneel before the cherubims of the vail, as they might before the ark? Might they kneel before the brazen-serpent? Might they before every ephod? May we before every pastor? When the Rejoinder has resolved these questions, we shall further consider.</p></blockquote>

<blockquote><p>Thus a gracious heart sees a beauty and equity in the commands of heaven that draws forth consent, and this consent makes them that they are not grievous.​</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes</cite>, p. 299</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8f38e5524" data-kw="">
<blockquote><p>…the duels which have been fought between princes, which have determined their quarrels by the monomachy of man to man. The crown of England was sometimes in that sort disputed, between Edmund Iron-side, and Canute the Dane: Edward III offered as much to the king of France; the French king to the Emperor Charles V; and Henry the Great, father of our most illustrious queen, made offer to the Duke of Guise his competitor to put a period to their difference by point of spear, his person against his, six against six, or hundred against hundred. I will not say that it is lawful to a prince so to hazard the head of the commonwealth, and in his person, all the body of his estate, but when this way is permitted them, it is, because sovereign princes have not any judge above them who can do them right, so that to obtain reason from their hands who are elevated to as high a pitch of dignity as themselves, there is not any other way but by arms; and these their doings have an outward show of charity: for a prince will say, that he likes better to expose his own person to danger than to see a bloody war that should swallow up many thousands of men and give occasion of an infinite slaughter. And it may be that some people desirous to avoid a general conflict of nation against nation, have sometimes remitted their quarrel to a certain number of men, to be chosen by either side by them to be decided by combat. So three hundred Lacedemonians fought against a like number of the Argiens; three Romans against three Latins; and when David and Ishboseth stood competitors for the royalty, the two generals Joab and Abner caused a combat between twelve soldiers of the tribe of Judah against twelve of the tribe of Beniamin [2 Sam. 2:12-17]. This kind of duel is as it were an abridgement of the war, and yet not very justifiable. There is more appearance in this case than in any of the cases aforementioned: Two armies are ready to fight, he that has the right on his side finds himself inferior in forces, so that if they come to handy-strokes we must all die of necessity: The enemy makes an offer of a single fight, one to one, and offers to stand to the event of this duel; why should we all perish and not rather make legal of this way and expedient, which perchance may give us the victory, or at least will save six thousand men’s lives, and there can but one be slain? But this example has no correspondence with the [private] duel, whereof we now treat, and one may not draw into consequence particular actions which are exploited in war or in the consequence of war, especially in heat of battle…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-duello. The Anatomy of Duels… (London: Harper, 1632), pp. 11-14 D’Espagne (1591-1659) was a French protestant pastor and theologian who lived in London for a significant time.</cite></span></figcaption>

</figure><figure class="quote" id="q-32262f0348" data-kw="">
<blockquote><p>What we call beautiful in objects, to speak in the mathematical style, seems to be in a compound ratio of uniformity and variety; so that where the uniformity of bodies is equal, the beauty is as the variety; and where the variety is equal, the beauty is as the uniformity.</p></blockquote>

</figure><figure class="quote" id="q-51018e08f6" data-kw="">
<blockquote><p>There be two happy things (worthy Reader), as one says, ‘The one is not to err, the other is to escape from the power of error.’ (Cassian, De incarnatione, bk. 1, ch. 4) Time’s womb brings forth many truths, though truth be not a debtor to time, because time puts new robes on old Truth; but truth is God’s debtor and owes her being to Him only. It is a great evil under the sun and the sickness of man’s vanity that the name of holy men should be a web to make garments of for new opinions, but the errors of holy men have no whiteness, nor holiness from men. And it is a wrong that men’s praise should be truth’s prejudice, and men’s gain, truth’s loss. Yet I shall heartily desire that men herein observe the art of deep providence, for the Creator commands darkness to bring forth her birth of light, and God does so over-awe, with a wise super-dominion, men’s errors, that contrary to nature’s way, from collision of opinions, results truth; and disputes, as stricken flint, cast fire for light, God raising out of the dust and ashes of errors a new living truth. What mistakes, errors, or heresies have been anent Church government, that vigilant and never slumbering wisdom of providence has thence made to appear the sound doctrine of God’s Kingdom. So here Satan shapes and God sews and makes the garment. Error is but dregs, by the artifice of all compassing Providence, from whence are distilled strong and cordial waters. And what Antichrist has conceived for a hierarchy and human ceremonies, has put Christ in his two witnesses in Britain to advocate for the truth and native simplicity of his own Kingdom. But I heartily desire not to appear as an adversary to the holy, reverend and learned [congregationalist] Brethren who are sufferers for the truth, for there be wide marches betwixt striving and disputing. Why should we strive? for we be brethren, the sons of one father, the born citizens of one mother Jerusalem. To dispute is not to contend. We strive as we are carnal, we dispute as we are men, we war from our lusts, we dispute from diversity of starlight and daylight. Weakness is not wickedness, a roving of wit must not be deemed a rebellion of will, a broken engine may part with a dead child and yet be a mother of many healthy children. And while our reverend and dear Brethren, fleeing the coast of Egypt and Babylon’s wicked borders, aim to shore upon truth, wind may deceive good sailors; natural land-motions (as when heavy bodies move downward toward their own (clay country) are upon a straight line. But sea-motions of sailing are not by right lines, but rather by sea-circles. We often argue and dispute as we sail. Where grace and weight of Scripture make motion, we walk in a right line toward God. But where opinion, a messenger only sent to spy the Land of lies and truth, usurps to conduct us, what marvel then we go about truth rather than lodge with truth. And Christ his Kingdom, scepter, glory, Babylon’s fall, be the material object of opinions, on both sides; and yet the Word of God has a right lith [joint], that cannot suffer division. In God’s matters there be not as in grammar the positive and comparative degrees: there are not here truth, and more true, and most true. Truth is in an indivisible line, which has no latitude and cannot admit of splitting. And therefore we may make use of the Philosopher’s word, amicus Socrates, amicus Plato, sed magis amica veritas [Socrates a friend, Plato a friend, but most of all, truth is a friend]. Though Peter and Paul be our beloved friends, yet the truth is a dearer friend: The sons of Babylon make outcries of divisions and diversity of religions amongst us, but every opinion is not a new religion. … But I leave off, and beg from the Reader candor and ingenuous and fair dealing; from Formalists, men in the way to Babylon, I may wish this, I cannot hope it. Farewell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries... (London, 1644) | ‘To the Reader’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“There be two happy things (worthy Reader), as one says, ‘The one is not to err, the other is to escape from the power of error.’ (Cassian, De incarnatione, bk. 1, ch. 4) Time’s womb brings forth many truths, though truth be not a debtor to time, because time puts new robes on old Truth; but truth is God’s debtor and owes her being to Him only. It is a great evil under the sun and the sickness of man’s vanity that the name of holy men should be a web to make garments of for new opinions, but the errors of holy men have no whiteness, nor holiness from men. And it is a wrong that men’s praise should be truth’s prejudice, and men’s gain, truth’s loss. Yet I shall heartily desire that men herein observe the art of deep providence, for the Creator commands darkness to bring forth her birth of light, and God does so over-awe, with a wise super-dominion, men’s errors, that contrary to nature’s way, from collision of opinions, results truth; and disputes, as stricken flint, cast fire for light, God raising out of the dust and ashes of errors a new living truth. What mistakes, errors, or heresies have been anent Church government, that vigilant and never slumbering wisdom of providence has thence made to appear the sound doctrine of God’s Kingdom. So here Satan shapes and God sews and makes the garment. Error is but dregs, by the artifice of all compassing Providence, from whence are distilled strong and cordial waters. And what Antichrist has conceived for a hierarchy and human ceremonies, has put Christ in his two witnesses in Britain to advocate for the truth and native simplicity of his own Kingdom. But I heartily desire not to appear as an adversary to the holy, reverend and learned [congregationalist] Brethren who are sufferers for the truth, for there be wide marches betwixt striving and disputing. Why should we strive? for we be brethren, the sons of one father, the born citizens of one mother Jerusalem. To dispute — Samuel Rutherford, The Due Right of Presbyteries... (London, 1644) | ‘To the Reader’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+be+two+happy+things+%28worthy+Reader%29%2C+as+one+says%2C+%E2%80%98The+one+is+not+to+err%2C+the+other+is+to+escape+from+the+power+of+error.%E2%80%99+%28Cassian%2C+De+incarnatione%2C+bk.+1%2C+ch.+4%29+Time%E2%80%99s+womb+brings+forth+many+truths%2C+though+truth+be+not+a+debtor+to+time%2C+because+time+puts+new+robes+on+old+Truth%3B+but+truth+is+God%E2%80%99s+debtor+and+owes+her+being+to+Him+only.+It+is+a+great+evil+under+the+sun+and+the+sickness+of+man%E2%80%99s+vanity+that+the+name+of+holy+men+should+be+a+web+to+make+garments+of+for+new+opinions%2C+but+the+errors+of+holy+men+have+no+whiteness%2C+nor+holiness+from+men.+And+it+is+a+wrong+that+men%E2%80%99s+praise+should+be+truth%E2%80%99s+prejudice%2C+and+men%E2%80%99s+gain%2C+truth%E2%80%99s+loss.+Yet+I+shall+heartily+desire+that+men+herein+observe+the+art+of+deep+providence%2C+for+the+Creator+commands+darkness+to+bring+forth+her+birth+of+light%2C+and+God+does+so+over-awe%2C+with+a+wise+super-dominion%2C+men%E2%80%99s+errors%2C+that+contrary+to+nature%E2%80%99s+way%2C+from+collision+of+opinions%2C+results+truth%3B+and+disputes%2C+as+stricken+flint%2C+cast+fire+for+light%2C+God+raising+out+of+the+dust+and+ashes+of+errors+a+new+living+truth.+What+mistakes%2C+errors%2C+or+heresies+have+been+anent+Church+government%2C+that+vigilant+and+never+slumbering+wisdom+of+providence+has+thence+made+to+appear+the+sound+doctrine+of+God%E2%80%99s+Kingdom.+So+here+Satan+shapes+and+God+sews+and+makes+the+garment.+Error+is+but+dregs%2C+by+the+artifice+of+all+compassing+Providence%2C+from+whence+are+distilled+strong+and+cordial+waters.+And+what+Antichrist+has+conceived+for+a+hierarchy+and+human+ceremonies%2C+has+put+Christ+in+his+two+witnesses+in+Britain+to+advocate+for+the+truth+and+native+simplicity+of+his+own+Kingdom.+But+I+heartily+desire+not+to+appear+as+an+adversary+to+the+holy%2C+reverend+and+learned+%5Bcongregationalist%5D+Brethren+who+are+sufferers+for+the+truth%2C+for+there+be+wide+marches+betwixt+striving+and+disputing.+Why+should+we+strive%3F+for+we+be+brethren%2C+the+sons+of+one+father%2C+the+born+citizens+of+one+mother+Jerusalem.+To+dispute+is+not+to+contend.+We+strive+as+we+are+carnal%2C+we+dispute+as+we+are+men%2C+we+war+from+our+lusts%2C+we+dispute+from+diversity+of+starlight+and+daylight.+Weakness+is+not+wickedness%2C+a+roving+of+wit+must+not+be+deemed+a+rebellion+of+will%2C+a+broken+engine+may+part+with+a+dead+child+and+yet+be+a+mother+of+many+healthy+children.+And+while+our+reverend+and+dear+Brethren%2C+fleeing+the+coast+of+Egypt+and+Babylon%E2%80%99s+wicked+borders%2C+aim+to+shore+upon+truth%2C+wind+may+deceive+good+sailors%3B+natural+land-motions+%28as+when+heavy+bodies+move+downward+toward+their+own+%28clay+country%29+are+upon+a+straight+line.+But+sea-motions+of+sailing+are+not+by+right+lines%2C+but+rather+by+sea-circles.+We+often+argue+and+dispute+as+we+sail.+Where+grace+and+weight+of+Scripture+make+motion%2C+we+walk+in+a+right+line+toward+God.+But+where+opinion%2C+a+messenger+only+sent+to+spy+the+Land+of+lies+and+truth%2C+usurps+to+conduct+us%2C+what+marvel+then+we+go+about+truth+rather+than+lodge+with+truth.+And+Christ+his+Kingdom%2C+scepter%2C+glory%2C+Babylon%E2%80%99s+fall%2C+be+the+material+object+of+opinions%2C+on+both+sides%3B+and+yet+the+Word+of+God+has+a+right+lith+%5Bjoint%5D%2C+that+cannot+suffer+division.+In+God%E2%80%99s+matters+there+be+not+as+in+grammar+the+positive+and+comparative+degrees%3A+there+are+not+here+truth%2C+and+more+true%2C+and+most+true.+Truth+is+in+an+indivisible+line%2C+which+has+no+latitude+and+cannot+admit+of+splitting.+And+therefore+we+may+make+use+of+the+Philosopher%E2%80%99s+word%2C+amicus+Socrates%2C+amicus+Plato%2C+sed+magis+amica+veritas+%5BSocrates+a+friend%2C+Plato+a+friend%2C+but+most+of+all%2C+truth+is+a+friend%5D.+Though+Peter+and+Paul+be+our+beloved+friends%2C+yet+the+truth+is+a+dearer+friend%3A+The+sons+of+Babylon+make+outcries+of+divisions+and+diversity+of+religions+amongst+us%2C+but+every+opinion+is+not+a+new+religion.+%E2%80%A6+But+I+leave+off%2C+and+beg+from+the+Reader+candor+and+ingenuous+and+fair+dealing%3B+from+Formalists%2C+men+in+the+way+to+Babylon%2C+I+may+wish+this%2C+I+cannot+hope+it.+Farewell.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries...+%28London%2C+1644%29+%7C+%E2%80%98To+the+Reader%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F51018e08f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51018e08f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-truth/#:~:text=There%20be%20two%20happy%20things%20%28worthy,this%2C%20I%20cannot%20hope%20it.%20Farewell&amp;text=There%20be%20two%20happy%20things%20%28worthy%20Reader%29%2C%20as&amp;text=may%20wish%20this%2C%20I%20cannot%20hope%20it.%20Farewell" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: And his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Even so when Satan finds that he cannot directly destroy the unity of the Church and bring division into credit, he will be more zealous for unity than Christ Himself: He will then endure no disagreement among Christians, no not in an opinion, nor a form or ceremony; not in meats or drinks or keeping of days, or in judging of things lawful or unlawful, which are not of necessity to the Church’s concord. He is either for tolerating all propagation of heresy and practice of wickedness, or else he is so much for unity, that no difference almost is to be tolerated. For he well knows that while men are imperfect such differences will still be: And then if he can but persuade the world that for concord sake they must not be endured, what follows but that the dissenters must be fined, imprisoned or banished to bring them (or the rest) to unity. And so he will set all the world together by the ears in cruelties and bloodshed and in hating one another, and all under pretense of making them one. You may think that till mankind be all turned bedlams [mental patients], they can never be so cheated by such a gross deceit, nor ever guilty of so mad a work. But what will you say if this be the common case of the far greatest part of the Christian world? And what will you say further, if after above a thousand years’ universal experience of the unhappy success, they continue it still as the only way to unity and peace? Look but about you with opened eyes and see whether it be not so. Were not he a gracious promoter of unity in the world that would say, ‘Unity is so excellent a thing that it is meet we should be all of one complexion, or at least that the world should speak but one language; and therefore no other but one should be tolerated.’ And here how easy is it to dilate of the great inconveniences of many languages: I could write a volume in folio of it myself; and all true and evident. Methinks I see hereupon how these books are scattered and read, and how those called learned men and politicians applaud them, and shake their heads and gnash their teeth at those that would have so great a mischief tolerated: And hereupon they set about the business and desire a law that upon pain of imprisonment and banishment (I know not whither) no one in the world shall speak any other language but one. And now I hope unity will be promoted indeed, when all the world is thus engaged in a war to perfect nature and make men one. But methinks I hear one man that is awake thus bespeak the promoters of this concord: ‘Unity and concord in those points where God has made them necessary, cannot be over-valued’: But yet it is visible that there is a marvelous diversity which nature is delighted in: when of all faces and of all voices, and of all the sorts of animals and plants, there is so discernable a difference: yea of all the millions of stones in the field, no two is perfectly like each other. And where greater unity is most desirable, it must first be considered how much of it is possible or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world.’ The speech being ended, the hearers derided it and made a law for unity to destroy it, and set every man on hating and fighting against his neighbor, to make all one. It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>

<blockquote><p>1. Whether men should be compelled to communicate with any church by corporal penalties?… 1. It were happy if the sword could compel unbelievers to believe, but it cannot, nor is a way which nature or Scripture ever allowed man to use for such an end. 2. To force an unbeliever to lie, by saying he believes, is a sin. 3. An infidel must not be baptized till he profess with seeming seriousness and willingness that he believes in God, the Father, Son and Holy Ghost, and will vow and devote himself to Him: Therefore to force the unwilling to be baptized, is a sacrilegious profanation of baptism. 4. To be baptized is to be solemnly invested in a visible state of regeneration, pardon, adoption, and right to Christ and life eternal, by a ministerial delivery of such right as in the name of Christ. But no unwilling person has any right to these invaluable gifts: Therefore no unwilling person should be forced to receive the said investiture. 5. Christ’s trial and description of the willing, is, whether they resolve to accept of his grace, forsaking all worldly interest that stands against it: Lk. 14:26-27, to the end. Therefore to baptize all that are forced to it by the sword, and had rather be baptized, and say they believe, than lose all they have, and lie in gaol [prison], is to preach another Gospel in part 6. Persons baptized in infancy, have no right to communion in the Lord’s Supper, till they profess their personal faith and consent to the baptismal Covenant: And the unbaptized are not to be forced to communicate: The Lord’s Supper redelivering all the same great invaluable gifts to the receivers which were delivered in baptism; the unwilling are no more capable of one, than the other. And to force them to say they are willing, and to receive that which they have no right to, is sacrilegious profaning holy things. 7. The ancient Churches for many hundred years, were so far from forcing any to baptism or Church-communion, or thinking that they should be forced, that they admitted none that did not earnestly desire it: And if the baptized by impenitency, or apostasy, or a long withdrawing from communion, did show themselves again uncapable by unwillingness, they declaratively cast them out. 8. And that the excommunicate, as such, should be laid up in prison, and undone, to force them again to be willing to be Christians or to communicate, has the same reasons against it, as against doing it at the first; and to take them for willing and capable of absolution, and salvation, who had rather say, they repent and consent, than lie in gaol, is to pervert Christ’s gospel and sacraments, and confound the Church: And the ancient Churches would have abhorred the notion of such a thing. 9. But it is just and meet that princes make a difference between Christian and infidel subjects; and between those that live willingly in communion of the Church, and those that refuse it: And that a Christian kingdom should give those powers and immunities to willing Christians, which they give not to infidels and the justly excommunicate; especially in matters relating to government, legislative and judiciary, and especially about religion, and the Church. And if any to obtain such immunities or powers, do hypocritically profess Christianity and consent, themselves only are guilty of the profanation, no wrong means was used, and the Church is no searcher of the heart. 10. But Christianity being necessary to our salvation; and it being the Christian magistrate’s duty to do his best for the salvation of all his subjects, and knowledge being the means of consent, and teaching and learning the means of knowledge; it is the duty of such magistrates to provide sufficient teachers for number and quality for all the subjects; and to compel men to hear, consider, and learn, as catechumens: The ancient Churches had their previous instructions for such, who were yet dismissed before the communion exercises, proper to the faithful.</p></blockquote>

mmunion, or thinking that they should be forced, that they admitted none that did not earnestly desire it: And if the baptized by impenitency, or apostasy, or a long withdrawing from communion, did show themselves again uncapable by unwillingness, they declaratively cast them out. 8. And that the excommunicate, as such, should be laid up in prison, and undone, to force them again to be willing to be Christians or to communicate, has the same reasons against it, as against doing it at the first; and to take them for willing and capable of absolution, and salvation, who had rather say, they repent and consent, than lie in gaol, is to pervert Christ’s gospel and sacraments, and confound the Church: And the ancient Churches would have abhorred the notion of such a thing. 9. But it is just and meet that princes make a difference between Christian and infidel subjects; and between those that live willingly in communion of the Church, and those that refuse it: And that a Christian kingdom should give those powers and immunities to willing Christians, which they give not to infidels and the justly excommunicate; especially in matters relating to government, legislative and judiciary, and especially about religion, and the Church. And if any to obtain such immunities or powers, do hypocritically profess Christianity and consent, themselves only are guilty of the profanation, no wrong means was used, and the Church is no searcher of the heart. 10. But Christianity being necessary to our salvation; and it being the Christian magistrate’s duty to do his best for the salvation of all his subjects, and knowledge being the means of consent, and teaching and learning the means of knowledge; it is the duty of such magistrates to provide sufficient teachers for number and quality for all the subjects; and to compel men to hear, consider, and learn, as catechumens: The ancient Churches had their previous instructions for such, who were yet dismissed before the communion exercises, proper to the faithful.”

— Richard Baxter, Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts... (1684), Unnecessary Separating Disowned, p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Whether+men+should+be+compelled+to+communicate+with+any+church+by+corporal+penalties%3F%E2%80%A6+1.+It+were+happy+if+the+sword+could+compel+unbelievers+to+believe%2C+but+it+cannot%2C+nor+is+a+way+which+nature+or+Scripture+ever+allowed+man+to+use+for+such+an+end.+2.+To+force+an+unbeliever+to+lie%2C+by+saying+he+believes%2C+is+a+sin.+3.+An+infidel+must+not+be+baptized+till+he+profess+with+seeming+seriousness+and+willingness+that+he+believes+in+God%2C+the+Father%2C+Son+and+Holy+Ghost%2C+and+will+vow+and+devote+himself+to+Him%3A+Therefore+to+force+the+unwilling+to+be+baptized%2C+is+a+sacrilegious+profanation+of+baptism.+4.+To+be+baptized+is+to+be+solemnly+invested+in+a+visible+state+of+regeneration%2C+pardon%2C+adoption%2C+and+right+to+Christ+and+life+eternal%2C+by+a+ministerial+delivery+of+such+right+as+in+the+name+of+Christ.+But+no+unwilling+person+has+any+right+to+these+invaluable+gifts%3A+Therefore+no+unwilling+person+should+be+forced+to+receive+the+said+investiture.+5.+Christ%E2%80%99s+trial+and+description+of+the+willing%2C+is%2C+whether+they+resolve+to+accept+of+his+grace%2C+forsaking+all+worldly+interest+that+stands+against+it%3A+Lk.+14%3A26-27%2C+to+the+end.+Therefore+to+baptize+all+that+are+forced+to+it+by+the+sword%2C+and+had+rather+be+baptized%2C+and+say+they+believe%2C+than+lose+all+they+have%2C+and+lie+in+gaol+%5Bprison%5D%2C+is+to+preach+another+Gospel+in+part+6.+Persons+baptized+in+infancy%2C+have+no+right+to+communion+in+the+Lord%E2%80%99s+Supper%2C+till+they+profess+their+personal+faith+and+consent+to+the+baptismal+Covenant%3A+And+the+unbaptized+are+not+to+be+forced+to+communicate%3A+The+Lord%E2%80%99s+Supper+redelivering+all+the+same+great+invaluable+gifts+to+the+receivers+which+were+delivered+in+baptism%3B+the+unwilling+are+no+more+capable+of+one%2C+than+the+other.+And+to+force+them+to+say+they+are+willing%2C+and+to+receive+that+which+they+have+no+right+to%2C+is+sacrilegious+profaning+holy+things.+7.+The+ancient+Churches+for+many+hundred+years%2C+were+so+far+from+forcing+any+to+baptism+or+Church-communion%2C+or+thinking+that+they+should+be+forced%2C+that+they+admitted+none+that+did+not+earnestly+desire+it%3A+And+if+the+baptized+by+impenitency%2C+or+apostasy%2C+or+a+long+withdrawing+from+communion%2C+did+show+themselves+again+uncapable+by+unwillingness%2C+they+declaratively+cast+them+out.+8.+And+that+the+excommunicate%2C+as+such%2C+should+be+laid+up+in+prison%2C+and+undone%2C+to+force+them+again+to+be+willing+to+be+Christians+or+to+communicate%2C+has+the+same+reasons+against+it%2C+as+against+doing+it+at+the+first%3B+and+to+take+them+for+willing+and+capable+of+absolution%2C+and+salvation%2C+who+had+rather+say%2C+they+repent+and+consent%2C+than+lie+in+gaol%2C+is+to+pervert+Christ%E2%80%99s+gospel+and+sacraments%2C+and+confound+the+Church%3A+And+the+ancient+Churches+would+have+abhorred+the+notion+of+such+a+thing.+9.+But+it+is+just+and+meet+that+princes+make+a+difference+between+Christian+and+infidel+subjects%3B+and+between+those+that+live+willingly+in+communion+of+the+Church%2C+and+those+that+refuse+it%3A+And+that+a+Christian+kingdom+should+give+those+powers+and+immunities+to+willing+Christians%2C+which+they+give+not+to+infidels+and+the+justly+excommunicate%3B+especially+in+matters+relating+to+government%2C+legislative+and+judiciary%2C+and+especially+about+religion%2C+and+the+Church.+And+if+any+to+obtain+such+immunities+or+powers%2C+do+hypocritically+profess+Christianity+and+consent%2C+themselves+only+are+guilty+of+the+profanation%2C+no+wrong+means+was+used%2C+and+the+Church+is+no+searcher+of+the+heart.+10.+But+Christianity+being+necessary+to+our+salvation%3B+and+it+being+the+Christian+magistrate%E2%80%99s+duty+to+do+his+best+for+the+salvation+of+all+his+subjects%2C+and+knowledge+being+the+means+of+consent%2C+and+teaching+and+learning+the+means+of+knowledge%3B+it+is+the+duty+of+such+magistrates+to+provide+sufficient+teachers+for+number+and+quality+for+all+the+subjects%3B+and+to+compel+men+to+hear%2C+consider%2C+and+learn%2C+as+catechumens%3A+The+ancient+Churches+had+their+previous+instructions+for+such%2C+who+were+yet+dismissed+before+the+communion+exercises%2C+proper+to+the+faithful.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Communion+Defended+against+both+Extremes%2C+and+Unnecessary+Division+Confuted+in+Five+Parts...+%281684%29%2C+Unnecessary+Separating+Disowned%2C+p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa38b87c94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa38b87c94.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=1.%20Whether%20men%20should%20be%20compelled,communion%20exercises%2C%20proper%20to%20the%20faithful&amp;text=1.%20Whether%20men%20should%20be%20compelled%20to%20communicate&amp;text=before%20the%20communion%20exercises%2C%20proper%20to%20the%20faithful" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

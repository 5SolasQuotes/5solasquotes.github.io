<blockquote><p>35. The rule [ratio] of merit is to be sought in the entire obedience of Christ exhibiting full satisfaction both in order to the commandment of the law and in order to the penal sanction adjoined to it.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99a2a68393" data-kw="">
<blockquote><p>Inveni igitur in Epistolis tuis in lucem editis Epistolas duas 35 et 45 in quarum illa controversiam hanc paucis attingis. In ista vero copiosius et plenius edisseris. In 35 igitur epistola ‘Quid vanius est, inquis, quam justum arbitrari qui Legem non impleverit?’ At, inquam, justicia Evangelii a justicia Legis, prudenter discernenda est, Justicia qua nos justi censemur a Deo ac proinde ab eodem justificamur seu absolvimur, non est justicia Legis, neque enim Deus ideo nos justificat, quod Legem vel ipsi nos impleverimus, vel Christus pro nobis impleverit. Sed est justicia Evangelii, id est quam Deus nobis per Evangelium donat, nempe remissio peccatorum sanguine Christi parta. Vitam igitur petimus a Deo non jure impletae Legis seu obedientiae Legi praestitae sed jure adoptionis, quam Christus sua morte nobis peperit.</p></blockquote>

8393.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99a2a68393.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Inveni%20igitur%20in%20Epistolis%20tuis%20in,quam%20Christus%20sua%20morte%20nobis%20peperit&amp;text=Inveni%20igitur%20in%20Epistolis%20tuis%20in%20lucem%20editis&amp;text=jure%20adoptionis%2C%20quam%20Christus%20sua%20morte%20nobis%20peperit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f6cbf50387" data-kw="Justification">
<blockquote><p>Those whom God effectually calls, he also freely justifies, not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous; not for anything wrought in them, or done by them, but for Christ&#x27;s sake alone; not by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing Christ&#x27;s active obedience unto the whole law, and passive obedience in his death for their whole and sole righteousness by faith, which faith they have not of themselves; it is the gift of God.</p></blockquote>

</figure><figure class="quote" id="q-1487086a61" data-kw="">
<blockquote><p>If the righteousness of Christ were truly imputed to us, so that through Him we should be accounted and reckoned just, just as if it were properly our own intrinsic and formal righteousness–we ought to be reckoned equally just as Christ Himself; and we ought to be called redeemers and saviors of the world.</p></blockquote>

</figure><figure class="quote" id="q-f734a38c26" data-kw="">
<blockquote><p>[1.] Now the active obedience of Christ falls under a twofold consideration:

1. As the man-Christ’s perfect conformity to the Law of God, so as man he was obliged to do and suffer all that He did and suffered, even to lay down his life for man. But had He been only man his righteousness had neither been by condignity meritorious, nor yet satisfactory for us. But:

2. The whole course of Christ’s obedience from his birth to the grave, by doing and suffering, is to be considered as the doing and suffering of so excellent a Person, his being born, his praying, preaching, dying, coming from a Person, God-man. Now the Law required not praying, preaching of God-man, the blood of God, or the dying of Him who was God-Man. And so all these being both so excellent, and then so undue, have respect of satisfaction to God. 2. The active obedience of Christ and all that Christ did and suffered were performed by Him in his state of humiliation: in which he was poor, [Greek], 2 Cor. 8:9, for us, so also by the same ground a weeping man, hungry, thirsty, weary for us, made lower then the angels by the suffering of death, Heb. 2:9, humbled by partaking of flesh and blood, because of the children, Heb. 2:14, emptied Himself for us, Phil. 2. This was, as [David] Pareus well says: perpetua quaedam passio et paena peccatorum nostrorum, fuit tota vita Christi [‘The whole life of Christ was a certain perpetual suffering and punishment for our sins’]: All these have a respect of punishment and suffering. For since Christ was both a viator [pilgrim] and a comprehensor [one attaining glory], and such a holy sinless person, He ought to have had the actual possession of the crown of glory from the womb, and so should have been free of weeping, hunger, thirst, weariness, groaning, sighing, sadnesse, persecution, reproaches, etc., all which adhered to all his active holiness, and therefore, in that, his actions were satisfactory passions. For satisfaction is defined [as] a voluntary restoring of the equivalent, and as good in the place of what is taken away; and the good restored must be:

1. Undue.

2. The proper good of the restorer, which agrees to the active and passive obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; pp. 226-27</span></figcaption>

sion+of+the+crown+of+glory+from+the+womb%2C+and+so+should+have+been+free+of+weeping%2C+hunger%2C+thirst%2C+weariness%2C+groaning%2C+sighing%2C+sadnesse%2C+persecution%2C+reproaches%2C+etc.%2C+all+which+adhered+to+all+his+active+holiness%2C+and+therefore%2C+in+that%2C+his+actions+were+satisfactory+passions.+For+satisfaction+is+defined+%5Bas%5D+a+voluntary+restoring+of+the+equivalent%2C+and+as+good+in+the+place+of+what+is+taken+away%3B+and+the+good+restored+must+be%3A+1.+Undue.+2.+The+proper+good+of+the+restorer%2C+which+agrees+to+the+active+and+passive+obedience+of+Christ.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+or+A+Treatise+of+the+Covenant+of+Grace%2C+%281655%29%2C+pt.+2%2C+ch.+1%3B+pp.+226-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff734a38c26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f734a38c26.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=1.%5D%20Now%20the%20active%20obedience%20of,active%20and%20passive%20obedience%20of%20Christ&amp;text=1.%5D%20Now%20the%20active%20obedience%20of%20Christ%20falls&amp;text=to%20the%20active%20and%20passive%20obedience%20of%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

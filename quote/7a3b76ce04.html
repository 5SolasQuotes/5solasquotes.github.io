</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c87d81f26" data-kw="">
<blockquote><p>The catholic or universal visible Church is the assembly of all those which make profession of the Gospel of Jesus Christ throughout the whole world, distinguished (as we have said) into many particular Churches, all which do make but one body. Of all these particular, as members and parts of one and the self-same body, some are pure, other some are impure, some more, and some less sound, and some at this day are sick even unto death… Those that are of the purer and sounder Churches, we call them sound and true Churches, consenting to the true doctrine, which is the name, that for the most part, the ancient fathers have given them. The others we call the erring, heretical or schismatical Churches, according as they err, either in faith or in charity, against the square and right rule of Christ, or against the rule of his Church, either in the one or in the other, notwithstanding every one in his degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter [in controversy with Romanism] (London: Barker, 1579)</cite>, ch. 2, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>18. They separate themselves from the true Churches of Christ. The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another? This schism grows into a heresy, as a serpent grows to be a dragon. This tolerated, will ruin families, tearing them all to pieces, while the husband goes to one Church, the wife to another, the son to a third, the daughter to a fourth, and the servant to an ale-house instead of a Church. This opens a gap to abundance of profaneness, when there shall be no cohabitation, but the Church members shall be scattered up and down, some twenty, some thirty, some sixty, some one hundred miles off; who shall have the inspection, teaching and guidance of these? Master [Jeremiah] Burroughs’s argument (Irenicum, ch. 23) for gathering of churches (in my judgment) is very dilute and weak; ’tis this: Because our divines hold it lawful to gather churches out of the Church of Rome: therefore ’tis lawful to gather churches out of the Church of England, q.d. because ’tis lawful to separate from a whore, therefore, we ought to separate from an honest woman also. What more ungodly sacrilege, or manstealing can there be, than to purloin from godly ministers the firstborn of their fervent prayers, and faithful preaching, the leaven of their flocks, the encouragement of their souls, the crown of their labors, and their epistle to Heaven? If men will needs gather churches out of the world (as they phrase it) let them first plow the world, and sow it, and reap it with their own hands, and then the Lord give them a liberal harvest. He is a very hard man that will reap where he has not sown, and gather where he has not strewed, Mt. 24:25. We have no precedent in the whole Book of God to gather up one church out of the cream and quintessence of many churches, as a reverend divine of ours has well observed. (Mr. [Thomas] Blake, On the Covenant, ch. 42 [p. 288]. in ••ne. V. The [Westminster] Assembly’s Answer to the Dissenting Brethren, p. 61 at the end [p. 22 in the link])</p></blockquote>

</figure><figure class="quote" id="q-abd2d967b8" data-kw="">
<blockquote><p>If ye state yourselves into parties, as the Corinthians did, how will ye avoid being puffed up for one against another? and what one says be taken as an oracle and what another says cried down according to interest and affection? Cum res transit in affectum, perit judicium [When a thing turns to affection, judgment perishes]. Beware of a wrong bias upon your affection, for that will bias and bribe your judgment, and forbear rash judgings and spurning at ministers, 1 Cor. 4:5. Censure only what the Scripture censures and approve only what it approves; else ye may soon take light for darkness, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681)</cite>, p. 170</span></figcaption>

</figure><figure class="quote" id="q-18d4d3a7ca" data-kw="">
<blockquote><p>Both of you, take heed ye bring not your differences any more unto public, nor otherwise put them among the people: Keep them amongst yourselves, where they may abide with less hurt, Rom. 14:1 &amp; 22. Considering the mischiefs of evulgating them, it will evidently appear happy to bury them in silence or oblivion. If ye interest and engage the people therein, then are ye gone; and beside other inconvenients thereof, ye shall not get leave to unite again without their consent, which may be hard to gain. How long shall any affect popularity, and thereby subject their ministerial authority to the humors of men and women for drawing them to their side to strengthen their party? by which means people are taught to domineer over ministers and may fore-run you, and cast at yourselves next when ye begin to sit up and not go along with all their notions and inclinations. Ye may perhaps find no small difficulty to regulate and bridle their humors, being once aloft, Fortur equis auriga, non audit currus habenas. Moreover, what do ye by filling people’s heads with such entangling controversies but divert their minds and take them off the main thing? and turn religion into factions and debates? and wear them out of heart-tenderness, real exercise of conscience and the serious study of universal holiness? If any make it their work to kindle in religious hearers a factious, opinionative zeal, you may thereby trouble their heads, not better their hearts and may sooner make them firebrands to burn down the peace, purity and order of the Church than living polished stones for the New Jerusalem. Yea, likely you may unhinge them so as to tempt them to cast at all ministers, at all religion, and turn either atheists or Seekers and sectarians, as woeful experience has many times proved, even in our own days; so small a friend to the promoting of piety, is division. Avoid then carefully to discover your intestine jars and animosities before the people in public or private. Bear not your nakedness to their eyes. Teach them not to meddle with things above their sphere and beyond their line (Ps. 131:1-2) and turn them not aside unto vain janglings, Tit. 3:9; 2 Tim. 2:17-18; 1 Tim. 1:6-7; 4:7; 6:4-5. Make it rather your work to edify them in the substantials of religion and vitals of piety, such as faith and repentance, humility, sobriety, mortification, self-denial, love and new obedience, etc. How much better were it to fire their hearts with the love of God and man than to heat their heads with puzzling debates, which do but perplex, not edify, and are far out of the way of their salvation or duty, and does not at all concern their practice. What profit reap they by being inveighed into such quicksands? We have seen many unfleeced of their wool, yea torn in their flesh, by being involved in such thorns, but never any advantaged.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Both of you, take heed ye bring not your differences any more unto public, nor otherwise put them among the people: Keep them amongst yourselves, where they may abide with less hurt, Rom. 14:1 &amp; 22. Considering the mischiefs of evulgating them, it will evidently appear happy to bury them in silence or oblivion. If ye interest and engage the people therein, then are ye gone; and beside other inconvenients thereof, ye shall not get leave to unite again without their consent, which may be hard to gain. How long shall any affect popularity, and thereby subject their ministerial authority to the humors of men and women for drawing them to their side to strengthen their party? by which means people are taught to domineer over ministers and may fore-run you, and cast at yourselves next when ye begin to sit up and not go along with all their notions and inclinations. Ye may perhaps find no small difficulty to regulate and bridle their humors, being once aloft, Fortur equis auriga, non audit currus habenas. Moreover, what do ye by filling people’s heads with such entangling controversies but divert their minds and take them off the main thing? and turn religion into factions and debates? and wear them out of heart-tenderness, real exercise of conscience and the serious study of universal holiness? If any make it their work to kindle in religious hearers a factious, opinionative zeal, you may thereby trouble their heads, not better their hearts and may sooner make them firebrands to burn down the peace, purity and order of the Church than living polished stones for the New Jerusalem. Yea, likely you may unhinge them so as to tempt them to cast at all ministers, at all religion, and turn either atheists or Seekers and sectarians, as woeful experience has many times proved, even in our own days; so small a friend to the promoting of piety, is division. Avoid then carefully to discover your intestine jars and animosities before the people in public or private. Bear not your nakedness to their eyes. Teach them not to meddle with things above their sphere and beyond their line (Ps. 131:1-2) and turn them not aside unto vain janglings, Tit. 3:9; 2 Tim. 2:17-18; 1 Tim. 1:6-7; 4:7; 6:4-5. Make it rather your work to edify them in the substantials of religion and vitals of piety, such as faith and repentance, humility, sobriety, mortification, self-denial, love and new obedience, etc. How much better were it to fire their hearts with the love of God and man than to heat their heads with puzzling debates, which do but perplex, not edify, and are far out of the way of their salvation or duty, and does not at all concern their practice. What profit reap they by being inveighed into such quicksands? We have seen many unfleeced of their wool, yea torn in their flesh, by being involved in such thorns, but never any advantaged.”

— John Bairdie, Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681), pp. 152-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBoth+of+you%2C+take+heed+ye+bring+not+your+differences+any+more+unto+public%2C+nor+otherwise+put+them+among+the+people%3A+Keep+them+amongst+yourselves%2C+where+they+may+abide+with+less+hurt%2C+Rom.+14%3A1+%26+22.+Considering+the+mischiefs+of+evulgating+them%2C+it+will+evidently+appear+happy+to+bury+them+in+silence+or+oblivion.+If+ye+interest+and+engage+the+people+therein%2C+then+are+ye+gone%3B+and+beside+other+inconvenients+thereof%2C+ye+shall+not+get+leave+to+unite+again+without+their+consent%2C+which+may+be+hard+to+gain.+How+long+shall+any+affect+popularity%2C+and+thereby+subject+their+ministerial+authority+to+the+humors+of+men+and+women+for+drawing+them+to+their+side+to+strengthen+their+party%3F+by+which+means+people+are+taught+to+domineer+over+ministers+and+may+fore-run+you%2C+and+cast+at+yourselves+next+when+ye+begin+to+sit+up+and+not+go+along+with+all+their+notions+and+inclinations.+Ye+may+perhaps+find+no+small+difficulty+to+regulate+and+bridle+their+humors%2C+being+once+aloft%2C+Fortur+equis+auriga%2C+non+audit+currus+habenas.+Moreover%2C+what+do+ye+by+filling+people%E2%80%99s+heads+with+such+entangling+controversies+but+divert+their+minds+and+take+them+off+the+main+thing%3F+and+turn+religion+into+factions+and+debates%3F+and+wear+them+out+of+heart-tenderness%2C+real+exercise+of+conscience+and+the+serious+study+of+universal+holiness%3F+If+any+make+it+their+work+to+kindle+in+religious+hearers+a+factious%2C+opinionative+zeal%2C+you+may+thereby+trouble+their+heads%2C+not+better+their+hearts+and+may+sooner+make+them+firebrands+to+burn+down+the+peace%2C+purity+and+order+of+the+Church+than+living+polished+stones+for+the+New+Jerusalem.+Yea%2C+likely+you+may+unhinge+them+so+as+to+tempt+them+t

<main class="wrap"><figure class="quote" id="q-edfba563af" data-kw="">
<blockquote><p>I Presume your Lordship well knows, that Christ’s love is our soul (and therefore sole) life: Then (and indeed not till then) do we live, when we enjoy divine love: Our bosoms cannot breath forth the breath of life, before Christ breaths in the breath of love.

Indeed, it’s the misery of most, that they are strangers to this truth. To speak to many of the Lord Jesus, and to tell them of a life in love, above what sense feels, and of a comfort, a glory, a happiness flowing from thence, far surmounting what sight fees, is a mystery, which they cannot perceive (nor indeed believe) for tis foolishness unto them. Not only the News-mongers at Athens counted this News which they never heard of; But even the Philosophers there themselves accounted Paul’s preaching of these things a strange doctrine.

But I hope I may without either falseness or flattery say: your Honour is well acquainted with these things. As experimentally knowing, that all your honour, joy, felicity, lies in this, that you know the love of Christ passing knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-durant.html">John Durant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Right Honourable Robert, Early of Warwick in A discovery of glorious love, or, The love of Christ to believers opened, in the truth, transcendency, and sweetness thereof together with the necessity that lies upon every believer, to strive after the spiritual and experimental knowledge of it: </cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

<blockquote><p>Then Christianity, its chief residence, its royal-sent, is in the spirit of a man, and so He is one after the spirit. ‘Be ye renewed in the spirit of your minds,’ Eph. 4:23. As it is of a high descent, so it must have the highest and most honorable lodging in all the creation, that is, the spirit of a man, without this there is no room else fit for it, and suitable to it, in this lower world; ‘My son give me thine heart,’ says wisdom, Prov. 23:26. It cares for nothing besides, if it get not the heart, the inmost cabinet of the imperial city of this isle of man, for ‘out of it are the issues of life,’ that flow into all the members. Do not think that grace will lodge one night in your outward man, that you can put on Christianity upon your countenance or conversation without; except you admit it into your souls, it can have no suitable entertainment there alone, it’s of a spiritual nature, and it must have a spirit to abide in. Everything is best preserved and entertained by things suitable to its nature; such do incorporate together, and inbosom one with another, whereas things keep a greater distance with things different in nature; a flame will die out among cold stones, without oily matter. This heavenly fire that is descended into the world can have nothing earthly to feed upon; it must die out except it get into the immortal spirit, and then furnish (to speak so) perpetual nourishment to it, till at length all the spirit be set on flame and changed, as it were, into that heavenly substance, to mount up above from whence it came. Do not think, my beloved, to superinduce true religion upon your outside, and within to be as rotten sepulchers: You must either open your hearts to Christ or else He will not abide with you; such a noble guest will not stay in the suburbs of the city if you take Him not into the palace; and truly the palace of our hearts is too unworthy for such a worthy guest, it has been so defiled by sin; how vile is it? but if you would let him enter, He would wash it and cleanse it for Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary</cite>, … (d. 1653; Edinburgh: Swintown, 1670) | sermon 16, on Rom. 8:4-5, p. 124</span></figcaption>

</figure><figure class="quote" id="q-a09c5de83b" data-kw="">
<blockquote><p>9. There must be a satisfaction with the terms of the gospel, and the heart must actually close with Christ, as He is offered in the gospel. The heart must open to Him, and take Him in, Rev. 3:20. The soul must embrace and receive Him, John 1:12. The man must take Him, as his Lord and Master King, Priest and Prophet; must give up himself to Him as his Leader and Commander, and resolve to follow Him in all things, and thus close a bargain with Him. … 8. That, as to them, all Christ’s entreaties, motives, allurements, patience and long suffering, his standing at the door and knocking, till his locks be wet with the dew, etc., are in vain: yea, they are contemptuously rejected, despised, slighted, and undervalued.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Way the Truth &amp; the Life</cite>, (1677), ch. 6</span></figcaption>

<blockquote><p>Now let us fall down before the Majesty of our good God with acknowledgment of our faults, praying him to make us perceive them more and more, so as we may mislike of them, and not only confess them with our mouth, but also lay open our hearts before him, and submit ourselves wholly to his holy word, and that in such wise we may be comforted by his free goodness, as it is showed us in our Lord Jesus Christ, and he reform us also by his holy spirit, to the end that whereas we of ourselves be full of rebelliousness, we may by his governing become teachable and ready to follow his holy will, and to give ourselves over all wholly unto him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Galatians</cite>, (1574; Audubon NJ, 1995), p. 456.</span></figcaption>

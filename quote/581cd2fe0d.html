<main class="wrap"><figure class="quote" id="q-581cd2fe0d" data-kw="">
<blockquote><p>Lastly, let subjects pay tribute to their magistrates; yea, let them, if necessity so require, not to stick to bestow their bodies and lives for the preservation of their magistrate and country, as I have already taught you in the fifth commandment. The Lord in the gospel doth simply say, “Give to God that which belongeth to God, and to Caesar that which belongeth to Caesar.” They therefore are worthily blamed, that pinch, grudge at, or defraud the magistrate of any part of his tribute. Taxes and tributes are due to the magistrate, as the hire of his labour, and as it were the sinews of public tranquillity and commonweal. For “who goeth to warfare of his own proper cast?” [1 Cor. 9:7] Every man liveth by that labour wherein he is occupied. The prince taketh pains in governing the commonweal, and preserving it in peace; he neglecteth his own private and household business, whereby he should live, and provide things necessary for himself and his family, by looking and attending on his country’s affairs: it were against reason, therefore, but that he should be fed and maintained upon the public treasure and cost of his country.

It is requisite, also, that kingdoms and commonweals be sufficiently furnished with money and substance to help in distress, either of war, famine, fire, and other miseries; or else to the setting up again of men fallen into poverty, or putting away of greater calamities. I say nothing now touching the keeping in reparation of common buildings, as the city-walls, bulwarks, trenches, ditches, gates, bridges, highways, wells, conduits, judgment-halls, and market-places, with many more of the same sort. There are also certain common persons, as serjeants, watchmen, and such like, which are to be nourished and maintained of the common cost and treasury; and, unless that money be still at hand and in readiness, there can no kingdom nor any commonweal stand long in assurance. They, therefore, that grudge to pay tribute deny the hire of the magistrate’s labour, and go to the next way to work to subvert the commonweal, and to bring it to nought. The men that in the commonweal’s affairs (as some of custom be) are negligent and careless, sin not against any one lord, but against the whole commonweal: and, therefore thou mayest see that such slothful workmen are seldom times enriched with the good blessings of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 391-2.</span></figcaption>

</figure><figure class="quote" id="q-b9fc14b721" data-kw="">
<blockquote><p>From that line and order of subordination wherein both magistrates and people are placed. The magistrate is placed under God the great Superior: and the subjects are placed under God the great, and under the magistrate the less superior. When the magistrate commandeth contrary to God, and goeth out of his order and line, especially so far as to invade by arms if they obey not, the subjects keeping their own line and order, and defending themselves, is no disobedience to the magistrate, but obedience to God, who in this point, so long as the magistrate walketh in this course, becometh their immediate superior; and as under the magistrate they ought to defend themselves against all violence from without, so in this abuse of God’s ordinance, from all violence from within, otherwise they sin against God and their own souls.

An inferior officer ought to keep his own station in the army, even when his captain goes out of his line and order, and taketh part with his enemy: and in this case he is bound no less than when he was under his general, to fight for himself, and for the safety of the whole army against him. It were against sense and reason to say, that he must give his neck to the sword of his captain, without regard to his general, the whole army, and his own life; yea, every soldier ought to defend the whole army against the general himself, if he turn an enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instructions for Defensive Arms (1639) in Andrew Stevenson, The History of the Church and State of Scotland, from the Accession of King Charles I. to the year 1649. To which is prefixed, An Abstract of the State of Religion in Scotland, from the Earliest Ages of Christianity, to the year 1625</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>

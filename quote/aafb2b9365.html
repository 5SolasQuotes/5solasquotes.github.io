<main class="wrap"><figure class="quote" id="q-aafb2b9365" data-kw="">
<blockquote><p>Let the most bitter-spirited antagonist ingenuously say, ‘Is not the whole Book of Psalms (so often avowed, cited, and used by Christ) Sepher-Tehillim, a Book of Praises, composed for the Churches use unto the end of time [in contrast to adding instrumentation]?’ or think you that this so excellent a part of Scripture was written only to inform us what the saints of God did before us, but not what we also must do by their example [of playing instruments in worship]? As for the abuse of music, we abominate it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Delivered</cite>, (London, 1663), p. 15. This sermon was given shortly after the Restoration and Great Ejection of 1662, in order to defend in Reading’s church, the cathedral church in Canterbury, that instruments were lawful in public worship, contra the dissenting puritans. Cathedral churches usually had more ornate music than parish churches.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Let the most bitter-spirited antagonist ingenuously say, ‘Is not the whole Book of Psalms (so often avowed, cited, and used by Christ) Sepher-Tehillim, a Book of Praises, composed for the Churches use unto the end of time [in contrast to adding instrumentation]?’ or think you that this so excellent a part of Scripture was written only to inform us what the saints of God did before us, but not what we also must do by their example [of playing instruments in worship]? As for the abuse of music, we abominate it…”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-685145a5ee" data-kw="">
<blockquote><p>Thirdly, he expresseth the matter to be sung in three words, the very titles which are given to David’s Psalms and other scriptural songs: and though there be some difference among interpreters about the kind of songs, which are expressed by every one of those in particular, yet the most received and probable opinion is that by ‘psalms’ are meant all holy songs in general of whatsoever argument, whether they contain prayers, praises, complaints, deprecations, prophecy, history, or a purpose mixed of all those; and by ‘hymns’ are meant special songs of praise to God; and by ‘songs’, a certain kind of hymns, expressing the praises of God for some of his noble acts, great and wonderful beyond others. And those ‘songs’ he calleth ‘spiritual’ (which epithet is to be extended to the psalms and hymns also), as being framed by the Spirit of God, containing spiritual and heavenly purpose, and requiring the assistance of God’s Spirit and a spiritual frame of heart for singing them aright; and this in opposition to the obscene, filthy, and fleshly songs of carnal men and drunkards. … 2. That we may go about this worship of singing praises to God acceptably, it is necessary that we be filled with the Spirit and have a rich and copious measure of his presence and assistance, though not to compose new songs: for he pointeth at scriptural songs, as the most fitting purpose to be sung, under the titles of “psalms, hymns, and spiritual songs;” yet that we may be enabled to choose the fittest songs for the present occasion, and sing them with such a spiritual, elevated frame of heart, as such a divine and heavenly piece of worship requireth; for he saith, “be filled with the Spirit, speaking to yourselves in psalms and hymns and spiritual songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians</cite>, (1656-1674; London, 1841), p. 239 &amp; 365 | On Eph. 5:19, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-58bfd29c22" data-kw="">
<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which things are natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

— William Ames, A Fresh Suit Against Human Ceremonies in God’s Worship… (1633), pp. 495-96">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Rejoinder+%5Bof+an+apponent%5D+brings+abundance+of+instances+%5Bfor+human+ceremonies+idolatrously+abused%5D+out+of+his+old+store%3A+1.+Kneeling%2C+bowing%2C+prostrating%2C+lifting+up+of+the+eyes%2C+and+of+the+hands%2C+shouting%2C+and+dancing+for+joy+%5Bwhich+things+are+natural+worship%5D.+But+these+we+absolutely+deny+to+be+human+inventions.+The+Rejoinder+knew+this+and+therefore+by+prevention+replies%3A+to+say+these+are+not+human+inventions+because+they+partly+spring+out+of+natural+light+is+as+much+as+to+say+they+are+not+because+they+are+human+inventions%3A+for+what+are+human+inventions%2C+but+such+as+spring+out+of+natural+light%3F+What%3F+the+cross+and+surplice%3B+the+cornered-cap+and+tippet%3B+the+bishop%E2%80%99s+rochet+and+cope%2C+with+a+thousand+such+like%3B+which+whoesoever+will+equal%2C+or+%28in+regard+of+naturalness+and+willfull+invention%29+liken+unto+lifting+up+of+eyes+and+hands%2C+etc.+in+prayer%2C+must+for+that+time+lay+aside+right+natural+invention+and+judgment%E2%80%A6+I+think+it+would+trouble+all+the+graduates+in+England+to+find+out+that+natural+light+from+whence+bachelors+of+art%2C+maisters+of+art%2C+bachelors+and+doctors+of+divinity+received+their+several+kinds+of+hoods%2C+even+as+much+as+to+find+out+light+of+nature+for+all+the+several+habits+of+monks.+But+%28says+the+Rejoynder%29+all+came+from+natural+light%2C+better+or+worse%2C+more+or+less+agitated%2C+just+as+men%E2%80%99s+long+hair+and+women%E2%80%99s+short%2C+which+nature+itself+teaches+to+be+uncomely+%28according+to+the+apostle%E2%80%99s+light+%5B1+Cor.+11%3A14%5D%29+came+from+the+light+of+nature.+It+is+natural+to+a+child%2C+for+to+suck+the+dug+and+after+to+put+the+hand+to+the+mouth%3B+and+after+to+creep+or+go%3A+Is+it+like+natural+to+sound+a+certain+distinct+sound+upon+a+trumpet%3F+to+dance+a+certain+round%2C+or+galliard+after+every+fiddle%3F+It+is+natural+for+a+child+to+signify+his+discerning+of+those+that+it+is+used+to+by+some+such+sound+as+dad+and+mam%2C+but+not+to+make+verses+in+a+certain+number.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+A+Fresh+Suit+Against+Human+Ceremonies+in+God%E2%80%99s+Worship%E2%80%A6+%281633%29%2C+pp.+495-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F58bfd29c22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58bfd29c22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=the%20Rejoinder%20%5Bof%20an%20apponent%5D%20brings,make%20verses%20in%20a%20certain%20number&amp;text=the%20Rejoinder%20%5Bof%20an%20apponent%5D%20brings%20abundance%20of&amp;text=not%20to%20make%20verses%20in%20a%20certain%20number" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

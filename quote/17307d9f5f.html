<blockquote><p>3. We acknowledge different opinions between Lutherans and Calvinians; so no doubt there are different opinions among the Lutherans themselves, and the Calvinians themselves, but we utterly deny there are different religions. The Lutherans we hold to be true Churches, agreeing with us in the fundamental points of faith, and likewise in being free from idolatry; for albeit they have images in their churches, which we conceive to be a very dangerous thing, yet they do not worship them; and although they hold real presence in the sacrament, yet they do not adore it. So that albeit we think some of their opinions are contrary to the Scripture, and they think the like of some of ours, yet neither we say of their religion, nor they of ours I trow, that it is contrary to the Scripture, much less that it is condemned in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doubting Conscience Resolved, in answer to a (pretended) perplexing question, etc. Wherein is evidently proved that the holy Scriptures (not the Pope) is the foundation whereupon the Church is built (London: 1652)</cite>, pp. 27-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a14e2c7a2f" data-kw="">
<blockquote><p>…will I join a most godly ancient bishop, whose Greek epistle being sent to John, bishop of Jerusalem, Jerome did translate into Latin; his name is Epiphanius. The words of the epistle are these: ‘…Wherein we do learn all these godly lessons: First, that no place ought to be given in the church of Christ to those things that are against the authority of the holy Scriptures. Secondly, that to give place in the church of Christ unto images, it is against the authority of the holy Scriptures, that is, of that law, which says: Thou shalt not make to thyself any graven image. Thirdly that not only graven and molten images, and such as be set up on high, upon or over the altars, but also the painted images ought to be cast out of the churches. Fourthly that the image of Christ Himself ought in no wise to stand in the church, because that of all other it is most perilous and breeds the greatest idolatry. Fifthly that the images ought to be caste out of the church of Christ, not only by sedulity and diligence of doctrine, but also by very fact and deed. Sixthly, that they ought not coldly, but with a fervent and earnest zeal of the true religion be put done, defaced, and broken all to pieces, as we do see this holy man of God Epiphanius to have rent and torn in pieces the vail that had the image of Christ painted, which he did being moved with the zeal of God. Seventhly, that it is the part and duty of bishops, to see that images be not set up in the church of Christ. Last of all, that it is a mere scrupulosity and superstition, unseemly for the church and the faithful people of God to have images.’ Here may we see that this godly ancient bishop did much differ in judgment from those fond persons that think it to be a profitable thing for the people of God to have images standing in the churches. Let them weigh these things that have always the fathers in their mouths, and so let them learn that it is more honesty for us to be called iconoclastae, that is, image breakers, than to be called iconoplastae, that is, image makers, and that we do approach nearer to the example of the old ancient church than they do, although they brag and boast themselves to be catholic and apostolic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-veron.html">John Veron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Strong Battery against the Idolatrous Invocation of the Dead Saints, and Against the having or setting up of Images in the House of Prayer or in any other place where there is any peril of iIolatry… (London: Sutton, 1562)</cite>, pp. 92-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2</span></figcaption>

</figure><figure class="quote" id="q-942af74721" data-kw="">
<blockquote><p>Though making of images simply be not unlawful and discharged by this [2nd] Commandment, yet thereby every representation of God (who is the object to be worshipped) and every image religiously made use of in worship is condemned (though civil and political images and statues, which are used as ornaments, or badges of honor, or remembrancers of some fact, etc. be not condemned)… …images (otherwise lawful) when abused to idolatry become unlawful, and are not to be suffered but orderly to be removed, we call that more than a civil or a common use, when religious worship or reverence is purposely intended to them, or there is, by some one occasion or other, danger lest they may be so abused; and of this sort (viz. dangerous ones) are: 1. Images in places of worship, but it is not idolatry to have dead men’s images on their tombs or monuments in churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments… (London, 1675), 1st Commandment, pp. 55 &amp; 57-58</cite></span></figcaption>

</figure><figure class="quote" id="q-92dd6ed6d7" data-kw="Mary Queen of Heaven">
<blockquote><p>If God disapproved that men on earth constituted a King for themselves, without consulting him: what will he say of the worms of the earth, who without an oracle from God, constitute a Queen of heaven, and erect for her a throne of majesty, without asking at the mouth of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</span></figcaption>

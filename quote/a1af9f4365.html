<main class="wrap"><figure class="quote" id="q-a1af9f4365" data-kw="">
<blockquote><p>Wherein shall this great restauration and reformation of the Church consist?

In the fruition and enjoyment of certain privileges, such as the Church hath not at other times, at least not in the like degree.

The Privileges are of two sorts; Privative and Positive.

The Church shall be freed from the inundation of profaneness, with which it hath been miserably annoyed, leavened and infected before. Such shall be the piety and strictness of the government Ecclesiastical and Civil, that there shall not enter into the Church in any wise, any thing that defileth, Rev. 21.27.

She shall be purged from errors, superstition, idolatry, false and formal worship. It is sufficient to prove it, that we find no such thing mentioned in the Scriptures that speak of the state of the Church in the last times, besides what hath been said already, and shall be by and by. During Antichrist’s reign, men have been, and still are so zealous and tenacious of their old mumpsimuses, they can in no wise endure to hear of parting with them; like Micah of mount Ephraim, Judg. 18.23.24. that followed after the Danites, crying and complaining; they turned about, and asked him what he ailed. Ye have taken away my gods (saith he) which I made, and my priest (which he himself had consecrated for a priest) who should have blessed me, and doe you ask me what I ail? What have I more? I protest I had as live you had taken away all that I have. So it is with the men of our generation: from these things shall the Church then be freed.

She shall have exemption from oppression and persecution both Civil and Ecclesiastical; God shall wipe away all tears from the Saints eyes, and there shall be no more death, neither sorrow, nor crying, &amp;c. Rev. 21.4. That must needs be meant of the Church in this world, as appears by the context, Then shall the Lyon and the Lamb lie down and feed together, and the Tiger become tame the Childe shall play with the Asp and Cockatrice. Isa. 11.6.7. &amp; 65.25. Rev. 7.16.

There be two reasons of these privative privileges.

The earth-quake going before, shall shakedown these evils and all their supporters, as we have heard; the Beast his Hierarchy; his horns, the Kings of the earth that shall defend him to the last. And as the Lord did destroy not only the heathen Empire guilty of so much blood cruelty, and idolatry but would not let so much as that very form of government to stand; so it is probable, if not more, that all these dignities that have so desperately opposed the Sceptre of Christ, shall be taken away, Dan. 2.34, 5.44. Rev. 19. from ver. 17. to the end. God will purge out rebels. Ezek. 20.38. that at last none shall dare so much as to speak for false worship, formal worship, &amp;c. Then (and I doubt) not till then, will all these Sects and Divisions have an end.

Satan shall then be bound and chained up, that he shall not seduce the Nations to idolatry and persecution, as he hath always before done, Rev. 20.2. He hath been cast down before, as Rev. 12.9. but never bound, nor shall be till Antichrist’s fall. And so this prevents that which might be objected: though the wicked be taken away with the Earth-quake, yet sin will revive again. Answ. No: Satan shall be tied up from seducing that he cannot play such reaks in the world as before, man’s corruption wanting those bellows to blow it up which did formerly inflame it.</p></blockquote>

<blockquote><p>Listen to Christ Himself say that He is both in heaven and on earth: ‘No one has ascended into heaven except him who has descended from heaven: the Son of Man who is in heaven.’ Notice that the Lord Himself said He is both in heaven and on earth. We confess, dearly beloved, that Christ the Lord is head of the Church; if this is true, He is in heaven with regard to the head, but on earth as far as the body is concerned.

Moreover, when the blessed Apostle Paul was persecuting the Church, Christ exclaimed from heaven: ‘Saul, Saul, why dost thou persecute me?’ He did not say: Why do you persecute my servants? Nor did He say: Why do you persecute my members? But He said: ‘Why dost thou persecute me?’ Now the tongue cries out if the foot is stepped on: You stepped on me, even though the tongue cannot be stepped on at all; through the harmony of charity the head cries out for all the members.</p></blockquote>

<blockquote><p>God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God.</p></blockquote>

<blockquote><p>What may we safely hold concerning the traditions of the Church? First, that besides the written Word of God there are profitable and necessary constitutions and ecclesiastical traditions, to wit, of those things which respect the outward decency and comeliness of the Church and service of God. Secondly, the efficient cause of all true traditions is the Holy Spirit, which directs the bishops and ministers assembled together in council or convocation for the determining of such orders and constitutions, according to the word of God [Acts 15:28]: and does also direct the Churches in the approving and receiving of such traditions. Thirdly, no tradition of the Church can constitute or ratify a doctrine contrary to the written word of God, neither any rite or ceremony: for both constitutions and doctrines ought to be agreeable (at least not contrary) to the written Word. And as all civil laws ought to have their beginning from the Law of nature, so all ecclesiastical traditions from the Word of God, Rom. 14:23; 1 Cor. 14:26, 40. Fourthly, although ecclesiastical traditions may be derived from the Word, yet they are not of equal authority with the Word. How may the true traditions of the Church be known or discerned from human and superstitious ordinances? By these four notes and marks, to wit: First, true traditions are founded upon the word, and consentaneous unto the Word, and deduced, derived and taken from the Word. Secondly, true traditions are profitable for the conserving and promoting both of piety and external and internal worship. Thirdly, true traditions make for the order, decorum and edification of the Church. And Fourthly, are not grievous and intolerable, as the traditions of the Pharisees were, and the Papists are, Mt. 23:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-ward.html">Richard Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Questions, Dogmatical Observations &amp; Evangelical Essays, upon the Gospel of Jesus Christ, according to St. Matthew</cite>, … Matthew... (London: Cole, 1640), ch. 15, p. 156</span></figcaption>

<div class="actions"><button class="copy" data-copy="“What may we safely hold concerning the traditions of the Church? First, that besides the written Word of God there are profitable and necessary constitutions and ecclesiastical traditions, to wit, of those things which respect the outward decency and comeliness of the Church and service of God. Secondly, the efficient cause of all true traditions is the Holy Spirit, which directs the bishops and ministers assembled together in council or convocation for the determining of such orders and constitutions, according to the word of God [Acts 15:28]: and does also direct the Churches in the approving and receiving of such traditions. Thirdly, no tradition of the Church can constitute or ratify a doctrine contrary to the written word of God, neither any rite or ceremony: for both constitutions and doctrines ought to be agreeable (at least not contrary) to the written Word. And as all civil laws ought to have their beginning from the Law of nature, so all ecclesiastical traditions from the Word of God, Rom. 14:23; 1 Cor. 14:26, 40. Fourthly, although ecclesiastical traditions may be derived from the Word, yet they are not of equal authority with the Word. How may the true traditions of the Church be known or discerned from human and superstitious ordinances? By these four notes and marks, to wit: First, true traditions are founded upon the word, and consentaneous unto the Word, and deduced, derived and taken from the Word. Secondly, true traditions are profitable for the conserving and promoting both of piety and external and internal worship. Thirdly, true traditions make for the order, decorum and edification of the Church. And Fourthly, are not grievous and intolerable, as the traditions of the Pharisees were, and the Papists are, Mt. 23:4.”

— Richard Ward, Theological Questions, Dogmatical Observations &amp; Evangelical Essays, upon the Gospel of Jesus Christ, according to St. Matthew, … Matthew... (London: Cole, 1640), ch. 15, p. 156">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+may+we+safely+hold+concerning+the+traditions+of+the+Church%3F+First%2C+that+besides+the+written+Word+of+God+there+are+profitable+and+necessary+constitutions+and+ecclesiastical+traditions%2C+to+wit%2C+of+those+things+which+respect+the+outward+decency+and+comeliness+of+the+Church+and+service+of+God.+Secondly%2C+the+efficient+cause+of+all+true+traditions+is+the+Holy+Spirit%2C+which+directs+the+bishops+and+ministers+assembled+together+in+council+or+convocation+for+the+determining+of+such+orders+and+constitutions%2C+according+to+the+word+of+God+%5BActs+15%3A28%5D%3A+and+does+also+direct+the+Churches+in+the+approving+and+receiving+of+such+traditions.+Thirdly%2C+no+tradition+of+the+Church+can+constitute+or+ratify+a+doctrine+contrary+to+the+written+word+of+God%2C+neither+any+rite+or+ceremony%3A+for+both+constitutions+and+doctrines+ought+to+be+agreeable+%28at+least+not+contrary%29+to+the+written+Word.+And+as+all+civil+laws+ought+to+have+their+beginning+from+the+Law+of+nature%2C+so+all+ecclesiastical+traditions+from+the+Word+of+God%2C+Rom.+14%3A23%3B+1+Cor.+14%3A26%2C+40.+Fourthly%2C+although+ecclesiastical+traditions+may+be+derived+from+the+Word%2C+yet+they+are+not+of+equal+authority+with+the+Word.+How+may+the+true+traditions+of+the+Church+be+known+or+discerned+from+human+and+superstitious+ordinances%3F+By+these+four+notes+and+marks%2C+to+wit%3A+First%2C+true+traditions+are+founded+upon+the+word%2C+and+consentaneous+unto+the+Word%2C+and+deduced%2C+derived+and+taken+from+the+Word.+Secondly%2C+true+traditions+are+profitable+for+the+conserving+and+promoting+both+of+piety+and+external+and+internal+worship.+Thirdly%2C+true+traditions+make+for+the+order%2C+decorum+and+edification+of+the+Church.+And+Fourthly%2C+are+not+grievous+and+intolerable%2C+as+the+traditions+of+the+Pharisees+were%2C+and+the+Papists+are%2C+Mt.+23%3A4.%E2%80%9D%0A%0A%E2%80%94+Richard+Ward%2C+Theological+Questions%2C+Dogmatical+Observations+%26+Evangelical+Essays%2C+upon+the+Gospel+of+Jesus+Christ%2C+according+to+St.+Matthew%2C+%E2%80%A6+Matthew...+%28London%3A+Cole%2C+1640%29%2C+ch.+15%2C+p.+156&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5cac90fe7e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5cac90fe7e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=What%20may%20we%20safely%20hold%20concerning,and%20the%20Papists%20are%2C%20Mt.%2023%3A4&amp;text=What%20may%20we%20safely%20hold%20concerning%20the%20traditions&amp;text=Pharisees%20were%2C%20and%20the%20Papists%20are%2C%20Mt.%2023%3A4" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The unhappy Arminian schism has given occasion for the calling of this Synod, arising not so much from Arminius himself as from his followers after his death, within the churches of the Netherlands.

For Jacobus Arminius, when in the year 1603 he succeeded Dr. Franciscus Junius in the theological professorship at Leiden, secretly instilled his subtleties and opinions into certain disciples and sought to cover the disputes arising from them with smooth words. But he did not at all dare to act openly until the year 1607, when peace had been concluded with the Spaniard. Whether this came from himself, or from being puffed up by others, or whether he was bribed to disturb the state of the fatherland—as some suspect—I do not say; but he then began to accuse the doctrine of the Dutch churches concerning predestination before the States of Holland as erroneous, and to alter underhand certain other chief articles.

His followers, after his death in 1609, declared themselves somewhat more openly, spread their views, planted them among the common people, and pressed upon the other churches with such bitterness—indeed, with such frenzy—that the whole United Netherlands, which for so long had been most united both in religion and in civil government, was afterwards miserably torn by domestic discord, hatred, injustice, tumults, violence, banishments, and murders; so that it differed little from a ship cast into the sea by a tempest, and in danger of perishing by shipwreck.

Against such peril, which was now so near, the civil authorities—so far as the matter was political—at length applied a remedy with courageous foresight and manly firmness. Of this I will not now speak, for it does not belong to my present purpose.

But as for the ruin of the churches, the remedy long resolved upon, yet hindered by various delays, was finally applied: namely, a National Synod, to illuminate the controversies by lawful examination, convened by the authority of the High and Mighty Lords, the States‑General. For ecclesiastical assemblies have been the medicine used since the times of the Apostles to heal the wounds of the churches and to clarify doubtful matters of religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Oration of David Pareus, Professor of Sacred Theology at Heidelberg, Delegate to the National Synod of Dordrecht, Together with His Judgment Concerning the Five Remonstrant Articles, Given in Latin at Heidelberg, 1 February, Anno 1619,</cite>, trans. Petrus Jacobus Austro-Silvius (Amsterdam: Hendrick Laurentsz with the consent of the Burgomasters of the City of Amsterdam, 1619), pp 4-5. (Translation generated by Copilot.)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1928f1dd77" data-kw="">
<blockquote><p>A farther difficulty here offers itself: Objection: …If the covenant, or second covenant (as opposite to that of works) be in Christ, and grounded on the work of reconciliation, then it is commensurate with it and of no greater latitude; and only the elect and chosen in Christ, the called according to God’s purpose, being reconciled, only these are in Covenant. [Yet] When the Scripture (as shall be, God willing, made good) confines not this covenant within the limits of the invisible Church, known only to God, but it is as large as the Church-visible. To this I answer that the Prophetical office of Christ, as Shepherd and Bishop of our souls, and so much of his Kingly office as consists in a legislative power, hath its foundation (as well as the Covenant) in this work of reconciliation. Had not this been undertaken by Christ for mankind, man had never enjoyed that light, man had never had an oracle, or an ordinance as the fruit of his prophetic office, yet, these ordinances are not commensurate with reconciliation, nor of equal latitude with election; So neither is the covenant, but either of both in order towards it. As ordinances therefore are Christ’s gift from Heaven, as the fruit of his death and resurrection, when yet all that partake of these ordinances do not yet die or rise with Christ; So, is the covenant, when yet all in covenant are not steadfast in it, nor obtain the graces of it. Therefore I know not how to admit that which a divine, singularly eminent, hath laid down, that all the effects of Christ’s death are spiritual, distinguishing and saving, seeing [that] gifts of Christ from his Father’s right hand are fruits of his death, yet not spiritual, distinguishing and saving. That they are in some sort spiritual, I dare grant that is, in ordine ad spiritualia [in order unto those things which are spiritual], (if I may so speak) they have a tendency to a spiritual work. That they are distinguishing from the world (as it is taken in opposition to the Church-visible) I yield, for I do not enlarge the fruit of Christ’s death to all man-kind, assenting to Master [John] Owen and Master [John] Stalham (d. 1677) in the grounds that they lay, of God’s respite [delay] of the execution of the whole penalty on man, with the continuance of outward favors not to be upon the account of Christ, but for other reasons; yet I know not how to affirm, that ordinances which yet are fruits of his death, are all saving, spiritual and distinguishing, seeing they neither confer salvation, nor saving grace on all that partake of them, so that Christ is a Mediator of this covenant and yet those enter into it that have not reconciliation by Christ Jesus; The Ephesians that were afar off, are made nigh by the blood of Christ (Eph. 2:13), that is, brought into a visible Church-state in the fruition of ordinances, made free of that city whose name is, ‘The Lord is here’ (Eze. 48:35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Foederis, or, A Treatise of the Covenant of God</cite>, (London, 1658), ch. 17, pp. 98-99</span></figcaption>

<blockquote><p>‘You will not come unto Me that ye may have life,’ you will have none of my counsel, you will not return, you are a stiff-necked people, obstinate and rebellious, whence the common assistances of Gods Spirit proves ineffectual and if God did not glorify free-grace any further, none, not the elect would return unto God, for although common grace given unto all is sufficient to leave all men without excuse, their non-improvement being their sin, yet none are thereby effectually engaged to turn unto God in faith, no not the elect, who, while unregenerate, are as sinfully obstinate as any;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b9b814849e" data-kw="">
<blockquote><p>The latter half of the 19th century was a time of immense change in Presbyterianism worldwide in respect of the role of music in worship. Within this period the long tradition of unaccompanied congregational psalmody gave way to the introduction of hymnody, instrumental music (initially provided by harmoniums and later by pipe organs) and choral music in the form of anthems.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/laurence-moore.html">Laurence Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sing to the Lord a New Song: A Study of Changing Musical Practices in the Presbyterian Church of Victoria, 1861-1901 (2004) 196 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“The latter half of the 19th century was a time of immense change in Presbyterianism worldwide in respect of the role of music in worship. Within this period the long tradition of unaccompanied congregational psalmody gave way to the introduction of hymnody, instrumental music (initially provided by harmoniums and later by pipe organs) and choral music in the form of anthems.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use: wherein closeness to the text, and smoothness of the verse are preferred to rhyme… (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…”

31773%29+was+an+Independent+minister+in+London%2C+known+for+his+work+on+cases+of+conscience.+He+argues+for+inspired+Bible-song+singing+in+the+Preface.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ddeaf76d2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ddeaf76d2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=It%20is%20well%20known%2C%20that%20in,bringing%20strange%20fire%20to%20God%E2%80%99s%20altar&amp;text=It%20is%20well%20known%2C%20that%20in%20the%20last&amp;text=guilt%20of%20bringing%20strange%20fire%20to%20God%E2%80%99s%20altar" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b579acfb7d" data-kw="">
<blockquote><p>‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects according to the matter of each Psalm: whereunto is added Devotions for the help and assistance of all Christian people, in all occasions and necessities (London, 1647) ‘The Preface’, no page number. Taylor (1613–1667) was a conformed cleric in the Church of England who advocated for very liturgical worship. The Preface is very good, at length, with regard to the psalms. Some of the references to ‘hymns’ refer to the psalms themselves. Taylor held to predominant psalmody.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-c14dc0bdcb" data-kw="">
<blockquote><p>I have enterprised (Christian reader) this work, with regard of God’s honor, and comfort of his people; that his Word might dwell in us richly, in all wisdom; and that we might teach and admonish ourselves, in psalms and hymns and songs spiritual. This I have labored to effect, by setting over into our tongue the Psalms in meter… … Psalms of holy Scripture, are perpetually to be sung in the Church.</p></blockquote>

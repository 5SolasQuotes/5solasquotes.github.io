<main class="wrap"><figure class="quote" id="q-23cdf30f01" data-kw="">
<blockquote><p>Consequently, Church government, by the Word, which defines it, can never arise higher than bearing secondary weight or ever override more fundamental obligations, no matter what is enacted in Church or civil constitutions, oaths, covenants, etc., lest we go beyond the Word (1 Cor. 4:6) and become sectarian (all in the name of reforming). Ideal, external Church government is a goal to be worked towards, but it does not necessitate or warrant of itself separation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 108-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f643caffcc" data-kw="">
<blockquote><p>Q. 113. What are the sins forbidden in the third commandment? A. The sins forbidden in the third commandment are… all sinful cursings, oaths, vows, and lots;[r]… and misapplying of God’s decrees[x] and providences;[y] misinterpreting,[z] misapplying,[a] or any way perverting the word, or any part of it,[b] to profane jests,[c] curious or unprofitable questions, vain janglings, or the maintaining of false doctrines;[d] abusing it, the creatures… … [r] Esth. 3:7. Esth. 9:24. Ps. 22:18. [s] Ps. 24:4. Ezek 17:16,18,19. [t] Mark 6:26. 1 Sam. 25:22,32-34. [v] Rom. 9:14,19,20. [w] Deut. 29:29. [x] Rom. 3:5,7. Rom. 6:1,2. [y] Eccl. 8:11. Eccl. 9:3. Ps. 39. [z] Matt. 5:21-48. [a] Ezek. 13:22. [b] 2 Pet. 3:16. Matt. 22:24-31. [c] Isa. 22:13. Jer. 23:34,36,38. [d] 1 Tim. 1:4,6,7. 1 Tim. 6:4,5,20. 2 Tim. 2:14. Tit. 3:9…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-42caf17fa2" data-kw="">
<blockquote><p>But in these games, pastimes, sports and plays at cards and dice, there is a certain distinction to be used. For, some of them are after such a sort played and passed over, that to the winning and obtaining of the victory, honest industry of the mind helps more than any blind casualty or chanceable hazard: insomuch that the awkward luck which falls out contrary to desire is supplied, amended and reformed by art and cunning. These kinds of play may not properly be termed ‘alea’ [chance] or hazardry, neither are they absolutely to be forbidden: only let measurable mean therein be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 6, ‘What the meaning of this word ‘Alea’ [Chance] properly is: and what Games &amp; Plays are contained and comprehended under the name thereof’ in A Discourse of Gaming, and Specially of Dice-Play in True &amp; Christian Friendship… Together also with a right excellent Invective… against the wicked exercise of diceplay, and other profane gaming (London: Veale, 1586) no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-870399be41" data-kw="">
<blockquote><p>Question: Why, but do you think it simply unlawful to play for money? Answer: Surely no. For when either so litle is played as no way inables me to any duty of my calling, or the money (not much) is bestowed in some meeting, for the increase of love, or that which is won is a reward appointed to that exercise, then think I, with others, that it is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 398-409 of ‘The Eighth Commandment’ in A Very Fruitful Exposition of the Commandments by way of Questions &amp; Answers… (1583), pp. 408-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

<main class="wrap"><figure class="quote" id="q-2d1bff91c4" data-kw="">
<blockquote><p>When the world was to be made, the Lord did speak the word, and it was created. But when it was to be redeemed; he gave his Son to be a price of ransom for us. And who would ever have thought (but that the Lord hath revealed this his unspeakable mercy in his word) that God, being of infinite Majesty and glory, and enjoying all self-contented happiness, would give his only begotten Son to die for his enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c52deef51" data-kw="">
<blockquote><p>It deeply concerned us, that He who was to be our Mediator should be very God and very man. If the necessity be inquired into, it was not what is commonly called simple or absolute, but flowed from the divine decree, on which the salvation of man depended. What was best for us our merciful Father determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 2, ch. 12, section 1, as provided by Berkhof</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

— John Calvin, Institutes of the Christian Religion, bk. 2, ch. 12, section 1, as provided by Berkhof">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+deeply+concerned+us%2C+that+He+who+was+to+be+our+Mediator+should+be+very+God+and+very+man.+If+the+necessity+be+inquired+into%2C+it+was+not+what+is+commonly+called+simple+or+absolute%2C+but+flowed+from+the+divine+decree%2C+on+which+the+salvation+of+man+depended.+What+was+best+for+us+our+merciful+Father+determined.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+bk.+2%2C+ch.+12%2C+section+1%2C+as+provided+by+Berkhof&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c52deef51.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c52deef51.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-necessity-of-the-atonement/#:~:text=It%20deeply%20concerned%20us%2C%20that%20He,for%20us%20our%20merciful%20Father%20determined&amp;text=It%20deeply%20concerned%20us%2C%20that%20He%20who%20was&amp;text=was%20best%20for%20us%20our%20merciful%20Father%20determined" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ce86930daf" data-kw="">
<blockquote><p>If Christ has suffered as a Substitute for every man and thus has rendered for all a complete satisfaction to Divine justice, how comes it about that all are not saved? Surely if He died for all He died with the intention of saving all, else why die for those whom He did not design to save. If this then were His intention, how comes it that His intention was not realised? It is difficult to see how one is to escape the conclusion upon this theory that Christ must have failed somewhere — which for the Divine One is unthinkable.

Further, if He rendered a complete satisfaction to Divine justice on behalf of all, how can some be punished for sin over again? Those who are not saved must suffer the punishment of their sins, for that is what being lost means; but how can they justly be punished if their Substitute has already borne their punishment? This theory, therefore, directly reflects upon the integrity of the justice of God. Again, if Christ offered up Himself as a ransom for all, i.e., everyone, why did He not see to it that He would secure all?

What was worth dying for — although we measure it not in the worth of the creature — was surely worth saving. What conceivable answer can be given to the question — Why did He not go on to save all those for whom He had laid down His life? To suffer for them was the hard and difficult part. As compared with this, to save was easy. Why then did He stop short? The redeemed in glory praise the Lamb as those who were bought by His blood.

Can it possibly be and yet by the Arminian theory it must needs be that the lost in hell can cry: “But we were blood bought, too, and it has availed us nothing. The price was paid for our deliverance, but Christ never came to save us. He bought us, indeed, by His blood, but either He omitted to claim us or the Devil made it impossible for Him to save us?” One has only to dwell for a little upon the conclusions, which, of necessity, arise from the Arminian view of the extent of the atonement to be convinced that it is a conception which is most dishonouring and derogatory to Him who has wrought out an all sufficient salvation for His people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-a-macrae.html">Kenneth A. Macrae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Resurgence of Arminianism</cite>, (1955; eBook reprint), pp 2-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-96996242b4" data-kw="">
<blockquote><p>2. It is to be considered, how many ways Christ may be said to give Himself [Greek], a ransom for us, or in our place. … 2. Nor is it true that Christ’s dying for all and every one (which is a dream) makes salvation possible to all so that the Covenant is preachable to all upon condition of believing, Acts 10:43. ‘To Him’ (Jesus anointed, who went about doing good and so was man, v. 38) ‘to Him’ (who was slain in our nature, not for all and every man, v. 39, ‘to Him’) whom God raised up the third day, v. 40. To Him gave all the prophets witness (as it is, v. 43) that through his name, whoever believes in Him shall have remission of sins.</p></blockquote>

<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts. 4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ. 5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

<blockquote><p>Obedience to all God’s commandments is covenanted (Dt. 7:1• &amp; 10, 12; Jer. 7:23; Lev. 19:17-18; Lk. 10:27; Mk. 12:30), not as the cause of life, but as the qualification and effect of faith, and as the way to life. Faith that embraces life is obedient and fruitful in all good works; but in one sort faith is the cause of obedience and good works, and in another of justification and eternal life. These it seeks in the promises of the covenant; those it works and produces, as the cause does the effect. Faith was the efficient cause of that precious oblation in Abel (Heb. 11:4, 7, etc.), of reverence and preparing the ark in Noah, of obedience in Abraham; but it was the instrument only of their justification. For it does not justify as it produces good works, but as it receives Christ, though it cannot receive Christ unless it brings forth good works. A disposition to good works is necessary to justification, being the qualification of an active and lively faith. Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity; but they are not the cause of, but only a preceding qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the covenant of grace, by “condition” we understand whatsoever is required on our part, as precedent, concomitant, or subsequent to justification, repentance, faith, and obedience are all conditions; but if by “condition” we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition. Faith and works are opposed in the matter of justification and salvation in the covenant, not that they cannot stand together in the same subject—for they are inseparably united—but because they cannot concur or meet together in one and the same court to the justification or absolution of man. For in the court of justice, according to the first covenant, either being just he is acquitted, or unjust he is condemned; but in the court of mercy, if you receive the promise of pardon, which is done by a lively faith, you are acquitted and set free, and accepted as just and righteous; but if you do not believe, you are sent over to the court of justice. Obedience is twofold: [1] Perfect in measure and degree—this is so far required that, if it be not performed, we must acknowledge our sin in coming short. And this God is pleased to exact at our hands, that we might walk in humility before him, strive after perfection, and freely acknowledge his rich grace and mercy in accepting and rewarding the best service we can render to his Highness, when in the court of justice it deserves to be rejected. [2] Sincere, uniform, and constant, though imperfect in measure and degree; and this is so necessary that without it there is no salvation to be expected. The covenant of grace calls for perfection, yet accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection were rigidly exacted, no flesh could be saved; if it were not at all commanded, imperfection would not be sin, nor would perfection be something to be labored after. The faith that is lively to embrace mercy is ever joined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, ever attends that faith by which we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life than it does virtually or actually lead us forward in the way to heaven. For if we say we have fellowship with God and walk in darkness, we lie and do not the truth; but if we walk in the light, as he is in the light, we have fellowship one with another (1 John 1:6–7). This walking in the light, as He is in the light, is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins or actual approbation with God. The truth of this doctrine St. John likewise ratifies in terms equivalent in the words immediately following: “And the blood of Christ cleanses us (walking in the light as God is in the light) from all sin.” (1 Jn. 1:7) But of these things more fully in their several degrees, as this covenant has been revealed. In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience. In contracts among men, one may ask more and another bid less, and yet they may come to agreement; but it is altogether fruitless for men to think of entering into covenant with God if they are not resolved to obey in all things. The practice of all God’s people who have ever made covenant with Him expressly declares as much when they solemnly entered into or renewed their covenant. For thus they promise: “Whatever the Lord says, that we will do” (Exod. 24:3, 7). The people said to Joshua, “The Lord our God we will serve, and his voice we will obey” (Josh. 24:23). And they entered into a covenant to seek the Lord God of their fathers with all their heart and with all their soul, so that whoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman (2 Chron. 15:12–13). And the king stood by the pillar and made a covenant before the Lord to walk after the Lord, and to keep his commandments, his testimonies, and his statutes with all his heart and all his soul, to perform the words of this covenant that were written in this book; and all the people stood to the covenant (2 Chron. 34:31; 2 Kings 23:3). They entered into a curse and into an oath to walk in God’s law, which was given by Moses the servant of God, and to observe and do all the commandments of the Lord our God, and his judgments and his statutes (Neh. 10:29). And thus runs the exhortation of Joshua to the two tribes and a half when he sent them home: “Take diligent heed to do the commandments of the law, which Moses the servant of the Lord charged you, to love the Lord your God, and to walk in all his ways, and to keep his commandments, and to cleave to him, and to serve him with all your heart and with all your soul” (Josh. 22:5). This must not be understood as if one who, through frailty and infirmity, offends in any one jot or tittle should be counted a covenant-breaker; for then no man would be innocent. Rather, the promise must be interpreted according to the rule of obedience given, which calls for perfection but accepts sincerity. In the covenant of mercy we bind ourselves to believe and rest upon God with the whole heart, so that doubting or distrust arising from weakness and infirmity must indeed be acknowledged as sin, yet every such frailty does not prove the person to be a transgressor of the covenant. The same holds true of obedience. But of this more fully when treating the particular manner in which God has been pleased to administer this covenant.</p></blockquote>

ication or absolution of man. For in the court of justice, according to the first covenant, either being just he is acquitted, or unjust he is condemned; but in the court of mercy, if you receive the promise of pardon, which is done by a lively faith, you are acquitted and set free, and accepted as just and righteous; but if you do not believe, you are sent over to the court of justice. Obedience is twofold: [1] Perfect in measure and degree—this is so far required that, if it be not performed, we must acknowledge our sin in coming short. And this God is pleased to exact at our hands, that we might walk in humility before him, strive after perfection, and freely acknowledge his rich grace and mercy in accepting and rewarding the best service we can render to his Highness, when in the court of justice it deserves to be rejected. [2] Sincere, uniform, and constant, though imperfect in measure and degree; and this is so necessary that without it there is no salvation to be expected. The covenant of grace calls for perfection, yet accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection were rigidly exacted, no flesh could be saved; if it were not at all commanded, imperfection would not be sin, nor would perfection be something to be labored after. The faith that is lively to embrace mercy is ever joined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, ever attends that faith by which we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life than it does virtually or actually lead us forward in the way to heaven. For if we say we have fellowship with God and walk in darkness, we lie and do not the truth; but if we walk in the light, as he is in the light, we have fellowship one with another (1 John 1:6–7). This walking in the light, as He is in the light, is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins or actual approbation with God. The truth of this doctrine St. John likewise ratifies in terms equivalent in the words immediately following: “And the blood of Christ cleanses us (walking in the light as God is in the light) from all sin.” (1 Jn. 1:7) But of these things more fully in their several degrees, as this covenant has been revealed. In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience. In contracts among men, one may ask more and another bid less, and yet they may come to agreement; but it is altogether fruitless for men to think of entering into covenant with God if they are not resolved to obey in all things. The practice of all God’s people who have ever made covenant with Him expressly declares as much when they solemnly entered into or renewed their covenant. For thus they promise: “Whatever the Lord says, that we will do” (Exod. 24:3, 7). The people said to Joshua, “The Lord our God we will serve, and his voice we will obey” (Josh. 24:23). And they entered into a covenant to seek the Lord God of their fathers with all their heart and with all their soul, so that whoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman (2 Chron. 15:12–13). And the king stood by the pillar and made a covenant before the Lord to walk after the Lord, and to keep his commandments, his testimonies, and his statutes with all his heart and all his soul, to perform the words of this covenant that were written in this book; and all the people stood to the covenant (2 Chron. 34:31; 2 Kings 23:3). They entered into a curse and into an oath to walk in God’s law, which was given by Moses the servant of God, and to observe and do all the commandments of the Lord our God, and his judgments and his statutes (Neh. 10:29). And thus runs the exhortation of Joshua to the two tribes and a half when he sent them home: “Take diligent heed to do the commandments of the law, which Moses the servant of the Lord charged you, to love the Lord your God, and to walk in all his ways, and to keep his commandments, and to cleave to him, and to serve him with all your heart and with all your soul” (Josh. 22:5). This must not be understood as if one who, through frailty and infirmity, offends in any one jot or tittle should be counted a covenant-breaker; for then no man would be innocent. Rather, the promise must be interpreted according to the rule of obedience given, which calls for perfection but accepts sincerity. In the covenant of mercy we bind ourselves to believe and rest upon God with the whole heart, so that doubting or distrust arising from weakness and infirmity must indeed be acknowledged as sin, yet every such frailty does not prove the person to be a transgressor of the covenant. The same holds true of obedience. But of this more fully when treating the particular manner in which God has been pleased to administer this covenant.”

— John Ball, A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 19-">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObedience+to+all+God%E2%80%99s+commandments+is+covenanted+%28Dt.+7%3A1%E2%80%A2+%26+10%2C+12%3B+Jer.+7%3A23%3B+Lev.+19%3A17-18%3B+Lk.+10%3A27%3B+Mk.+12%3A30%29%2C+not+as+the+cause+of+life%2C+but+as+the+qualification+and+effect+of+faith%2C+and+as+the+way+to+life.+Faith+that+embraces+life+is+obedient+and+fruitful+in+all+good+works%3B+but+in+one+sort+faith+is+the+cause+of+obedience+and+good+works%2C+and+in+another+of+justification+and+eternal+life.+These+it+seeks+in+the+promises+of+the+covenant%3B+those+it+works+and+produces%2C+as+the+cause+does+the+effect.+Faith+was+the+efficient+cause+of+that+precious+oblation+in+Abel+%28Heb.+11%3A4%2C+7%2C+etc.%29%2C+of+reverence+and+preparing+the+ark+in+Noah%2C+of+obedience+in+Abraham%3B+but+it+was+the+instrument+only+of+their+justification.+For+it+does+not+justify+as+it+produces+good+works%2C+but+as+it+receives+Christ%2C+though+it+cannot+receive+Christ+unless+it+brings+forth+good+works.+A+disposition+to+good+works+is+necessary+to+justification%2C+being+the+qualification+of+an+active+and+lively+faith.+Good+works+of+all+sorts+are+necessary+to+our+continuance+in+the+state+of+justification%2C+and+so+to+our+final+absolution%2C+if+God+give+opportunity%3B+but+they+are+not+the+cause+of%2C+but+only+a+preceding+qualification+or+condition+to+final+forgiveness+and+eternal+bliss.+If+then%2C+when+we+speak+of+the+conditions+of+the+covenant+of+grace%2C+by+%E2%80%9Ccondition%E2%80%9D+we+understand+whatsoever+is+required+on+our+part%2C+as+precedent%2C+concomitant%2C+or+subsequent+to+justification%2C+repentance%2C+faith%2C+and+obedience+are+all+conditions%3B+but+if+by+%E2%80%9Ccondition%E2%80%9D+we+understand+what+is+required+on+our+part+as+the+cause+of+the+good+promised%2C+though+only+instrumental%2C+faith+or+belief+in+the+promises+of+free+mercy+is+the+only+condition.+Faith+and+works+are+opposed+in+the+matter+of+justification+and+salvation+in+the+covenant%2C+not+that+they+cannot+stand+together+in+the+same+subject%E2%80%94for+they+are+inseparably+united%E2%80%94but+because+they+cannot+concur+or+meet+together+in+one+and+the+same+court+to+the+justification+or+absolution+of+man.+For+in+the+court+of+justice%2C+according+to+the+first+covenant%2C+either+being+just+he+is+acquitted%2C+or+unjust+he+is+condemned%3B+but+in+the+court+of+mercy%2C+if+you+receive+the+promise+of+pardon%2C+which+is+done+by+a+lively+faith%2C+you+are+acquitted+and+set+free%2C+and+accepted+as+just+and+righteous%3B+but+if+you+do+not+believe%2C+you+are+sent+over+to+the+court+of+justice.+Obedience+is+twofold%3A+%5B1%5D+Perfect+in+measure+and+degree%E2%80%94this+is+so+far+required+that%2C+if+it+be+not+performed%2C+we+must+acknowledge+our+sin+in+coming+short.+And+this+God+is+pleased+to+exact+at+our+hands%2C+that+we+might+walk+in+humility+before+him%2C+strive+after+perfection%2C+and+freely+acknowledge+his+rich+grace+and+mercy+in+accepting+and+rewarding+the+best+service+we+can+render+to+his+Highness%2C+when+in+the+court+of+justice+it+deserves+to+be+rejected.+%5B2%5D+Sincere%2C+uniform%2C+and+constant%2C+though+imperfect+in+measure+and+degree%3B+and+this+is+so+necessary+that+without+it+there+is+no+salvation+to+be+expected.+The+covenant+of+grace+calls+for+perfection%2C+yet+accepts+sincerity%2C+God+in+mercy+pardoning+the+imperfections+of+our+best+performances.+If+perfection+were+rigidly+exacted%2C+no+flesh+could+be+saved%3B+if+it+were+not+at+all+commanded%2C+imperfection+would+not+be+sin%2C+nor+would+perfection+be+something+to+be+labored+after.+The+faith+that+is+lively+to+embrace+mercy+is+ever+joined+with+an+unfeigned+purpose+to+walk+in+all+well-pleasing%2C+and+the+sincere+performance+of+all+holy+obedience%2C+as+opportunity+is+offered%2C+ever+attends+that+faith+by+which+we+continually+lay+hold+upon+the+promises+once+embraced.+Actual+good+works+of+all+sorts+%28though+not+perfect+in+degree%29+are+necessary+to+the+continuance+of+actual+justification%2C+because+faith+can+no+longer+lay+faithful+claim+to+the+promises+of+life+than+it+does+virtually+or+actually+lead+us+forward+in+the+way+to+heaven.+For+if+we+say+we+have+fellowship+with+God+and+walk+in+darkness%2C+we+lie+and+do+not+the+truth%3B+but+if+we+walk+in+the+light%2C+as+he+is+in+the+light%2C+we+have+fellowship+one+with+another+%281+John+1%3A6%E2%80%937%29.+This+walking+in+the+light%2C+as+He+is+in+the+light%2C+is+that+qualification+whereby+we+become+immediately+capable+of+Christ%E2%80%99s+righteousness%2C+or+actual+participants+of+his+propitiation%2C+which+is+the+sole+immediate+cause+of+our+justification%2C+taken+for+remission+of+sins+or+actual+approbation+with+God.+The+truth+of+this+doctrine+St.+John+likewise+ratifies+in+terms+equivalent+in+the+words+immediately+following%3A+%E2%80%9CAnd+the+blood+of+Christ+cleanses+us+%28walking+in+the+light+as+God+is+in+the+light%29+from+all+sin.%E2%80%9D+%281+Jn.+1%3A7%29+But+of+these+things+more+fully+in+their+several+degrees%2C+as+this+covenant+has+been+revealed.+In+this+covenant+man+promises+to+repent+of+his+sins%2C+and%2C+repenting%2C+to+cleave+to+the+promise+of+mercy+made+in+Jesus+Christ%2C+and+in+faith+to+yield+willing%2C+cheerful%2C+and+continual+obedience.+In+contracts+among+men%2C+one+may+ask+more+and+another+bid+less%2C+and+yet+they+may+come+to+agreement%3B+but+it+is+altogether+fruitless+for+men+to+think+of+entering+into+covenant+with+God+if+they+are+not+resolved+to+obey+in+all+things.+The+practice+of+all+God%E2%80%99s+people+who+have+ever+made+covenant+with+Him+expressly+declares+as+much+when+they+solemnly+entered+into+or+renewed+their+covenant.+For+thus+they+promise%3A+%E2%80%9CWhatever+the+Lord+says%2C+that+we+will+do%E2%80%9D+%28Exod.+24%3A3%2C+7%29.+The+people+said+to+Joshua%2C+%E2%80%9CThe+Lord+our+God+we+will+serve%2C+and+his+voice+we+will+obey%E2%80%9D+%28Josh.+24%3A23%29.+And+they+entered+into+a+covenant+to+seek+the+Lord+God+of+their+fathers+with+all+their+heart+and+with+all+their+soul%2C+so+that+whoever+would+not+seek+the+Lord+God+of+Israel+should+be+put+to+death%2C+whether+small+or+great%2C+whether+man+or+woman+%282+Chron.+15%3A12%E2%80%9313%29.+And+the+king+stood+by+the+pillar+and+made+a+covenant+before+the+Lord+to+walk+after+the+Lord%2C+and+to+keep+his+commandments%2C+his+testimonies%2C+and+his+statutes+with+all+his+heart+and+all+his+soul%2C+to+perform+the+words+of+this+covenant+that+were+written+in+this+book%3B+and+all+the+people+stood+to+the+covenant+%282+Chron.+34%3A31%3B+2+Kings+23%3A3%29.+They+entered+into+a+curse+and+into+an+oath+to+walk+in+God%E2%80%99s+law%2C+which+was+given+by+Moses+the+servant+of+God%2C+and+to+observe+and+do+all+the+commandments+of+the+Lord+our+God%2C+and+his+judgments+and+his+statutes+%28Neh.+10%3A29%29.+And+thus+runs+the+exhortation+of+Joshua+to+the+two+tribes+and+a+half+when+he+sent+them+home%3A+%E2%80%9CTake+diligent+heed+to+do+the+commandments+of+the+law%2C+which+Moses+the+servant+of+the+Lord+charged+you%2C+to+love+the+Lord+your+God%2C+and+to+walk+in+all+his+ways%2C+and+to+keep+his+commandments%2C+and+to+cleave+to+him%2C+and+to+serve+him+with+all+your+heart+and+with+all+your+soul%E2%80%9D+%28Josh.+22%3A5%29.+This+must+not+be+understood+as+if+one+who%2C+through+frailty+and+infirmity%2C+offends+in+any+one+jot+or+tittle+should+be+counted+a+covenant-breaker%3B+for+then+no+man+would+be+innocent.+Rather%2C+the+promise+must+be+interpreted+according+to+the+rule+of+obedience+given%2C+which+calls+for+perfection+but+accepts+sincerity.+In+the+covenant+of+mercy+we+bind+ourselves+to+believe+and+rest+upon+God+with+the+whole+heart%2C+so+that+doubting+or+distrust+arising+from+weakness+and+infirmity+must+indeed+be+acknowledged+as+sin%2C+yet+every+such+frailty+does+not+prove+the+person+to+be+a+transgressor+of+the+covenant.+The+same+holds+true+of+obedience.+But+of+this+more+fully+when+treating+the+particular+manner+in+which+God+has+been+pleased+to+administer+this+covenant.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+19-&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf7229c6c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af7229c6c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=Obedience%20to%20all%20God%E2%80%99s%20commandments%20is,been%20pleased%20to%20administer%20this%20covenant&amp;text=Obedience%20to%20all%20God%E2%80%99s%20commandments%20is%20covenanted%20%28Dt&amp;text=God%20has%20been%20pleased%20to%20administer%20this%20covenant" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Consent I. They [Romanists] grant that in justification sin is pardoned by the merits of Christ, and that none can be justified without remission of sins: and that is well. II. They grant that the righteousness whereby a man is made righteous before God, comes from Christ, and from Christ alone. III. The most learned among them say that Christ’s satisfaction, and the merit of his death is imputed to every sinner that does believe, for his satisfaction before God: and hitherto we agree. The very point of difference is this: We hold that the satisfaction made by Christ in his death, and obedience to the Law, is imputed to us and becomes our righteousness. They say, it is our satisfaction and not our righteousness whereby we stand righteous before God: because it is inherent in the person of Christ as in a subject. Now the answer of the Papist to the former question is on this manner: The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification, is an excellent gift of God, and has his reward of God; and is the matter of our justification before man: because it serves to declare us to be reconciled to God, and to be justified; yet we deny it to be the thing, which makes us of sinners to become righteous or just before God. And this is the first point of our disagreement in the matter of justification: which must be marked; because if there were no more points of difference between us, this one alone were sufficient to keep us from uniting of our religions: for hereby the Church of Rome does raze the very foundation.</p></blockquote>

<blockquote><p>XXXVIII… Nor is he [Christopher Wittich] alone in considering sincere love of God and Christ among the essential acts of faith. [Marcus F.] Wendelin shares this sentiment. Although he reduces the parts of faith to three –knowledge, assent, and confidence – he nevertheless teaches that love also pertains to the acts of faith. For he proves that not only the intellect but also the will is the subject of faith, “Because faith is also love, and love is an act of the will,” which he supports with the testimony of Augustine saying, “To believe in Christ is to love Christ.” In Christian Theology, bk. 2, ch. 24, in the explanation of the eighth thesis. XXXIX. Similar views can be found in [Daniel] Chamier, who also uses the same argument to prove that faith is in the will, not just in the intellect. He says, ‘All love is an act of the will; but faith is love; therefore, it is an act of the will.’ He proves that faith is love because true faith is that which believes in God: But to believe in God is to love God, according to Augustine, ‘What is it to believe in God? To believe is to love.’ (Pancratia, vol. 3, bk. 12, ch. 4, no. 16). XL. And Wittich himself in the previously cited place brings forward the words of Cocceius, a professor at Leiden University while he was alive. ‘That faith,’ he says: ‘is a kind of love of God, by which I love God as the one who atones for sins and heals from the disease and penalty of sin, that I may be to His glory.’ (On the Last Words of Moses, p. 336). And in another place: ‘Therefore, faith is inherently connected with charity; since faith itself is nothing but the outpouring of Christ’s charity in our hearts, its sensation, and reciprocal recognition. One loves because they believe; and if they do not love, they do not believe.’ (in Examen Apologiae, p. 209). But many among the Reformed theologians think differently, like Samuel Maresius, Robert Baronius, Bucanus, and ultimately all who place faith solely in the intellect, like Peter du Moulin and the Professors of Saumur. For all of them indeed teach that the love of God arises from true faith and is an effect inseparable from it, yet they do not want it to be an act elicited by faith, as that would confuse faith with charity. … XCVI. Similarly, there is doubt about whether love is a formal and essential act of faith. Esteemed scholars such as Chamier, Wendelin, Wittich, and Cocceius assert it, while others deny it. For my part, I think some distinction is necessary here. Faith can be taken in two ways: First, precisely, according to what it has distinct from hope, charity, and other Christian virtues. In this sense, love is not a formal act of faith but pertains to another virtue, namely, charity. Secondly, faith is taken for a composite of several acts or habits, which are included under the term “faith working through love.” This is how many Reformed authors understand faith in this question, not as a single act or simple habit but as a complex of several acts or habits. From this, it follows that sincere love of God and Christ, without which faith cannot be conceived as living and working through love, undoubtedly belongs to faith as an essential act. . . In Lutheranism Article 1600’s Calov, Abraham – Thoughts on Objective Justification tr. Souksamay K. Phetsanghane 47 pp. in Biblia Illustrata (1672-1676; 2014), on 2 Cor. 5:18‐19; Rom. 3:23‐24; 4:25; 5:18‐19 with a bibliography Presented for the Southwestern Conference of the Western Wisconsin District of the Wisconsin Evangelical Lutheran Synod, Winter Conference, Feb. 25, 2014, St. John Lutheran, Baraboo, WI Calov (1612–1686) was a professor of theology at Konigsberg and Wittenberg and one of the champions of Lutheran orthodoxy in the 17th century. ‘Objective Justification’ refers to the erroneous notion of an objective, universal and conditional justification of all people through the work of Christ. While this doctrine is largely absent from the historic creeds of Lutheranism and Lutheran orthodoxy (which emphasized an actual, personal justification by faith), yet Phetsanghane seeks to show that this doctrine was taught to some minor extent, and incidentally, in some of the orthodox Lutheran theologians (principally Abraham Calov, 1612-1686) and it may be contained in some implicit form in some early historic Lutheran confessions. . Historical On the Post-Reformation Article Fesko, J.V. – ‘Reformed Orthodoxy on Imputation. Active &amp; Passive Justification’ in Perichoresis, vol. 14, issue 3 (2016), pp. 61-80 Abstract: “The doctrine of imputation is common to Early Modern Lutheran and Reformed theology, but Reformed orthodox theologians employed the distinction between the active and passive justification of the believer. Active justification is the objective imputation of Christ’s righteousness and passive justification is the subjective reception of the same. This distinction is a unique contribution in Reformed orthodox dogmatics and was used in polemics against Roman Catholic, Arminian, and Socinian theologians. This essay also compares Reformed orthodox formulations with Lutheran orthodox understandings of how they preserved the extra nos [outside of us] of Christ’s righteousness in justification. The Reformed orthodox employed the active-passive justification distinction in conjunction with the decree and the doctrine of the covenant of redemption, whereas the Lutheran orthodox logically placed justification first in the order of salvation. Both groups maintain the extra nos of Christ’s imputed righteousness but do so in different ways.</p></blockquote>

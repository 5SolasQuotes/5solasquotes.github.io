<main class="wrap"><figure class="quote" id="q-42ad36126d" data-kw="">
<blockquote><p>(6) Take heed of pretending to greater purity and strictness about Church-communion than the Word of God commends or the examples of Christ, of the apostles and the primitive Church commends. Nor be so extremely rigid as not to bear with things they have tolerated. Be not over-righteous, lest by over-straining ye both sin and do harm; yea, and plainly bewray it to be faction or humor, not conscience, which acts you. Calvin contra the Anabaptists, Act. 2, says, Cum sub specie studii perfectionis imperfectionem nullam tolerare possumus, tunc diabolum nos tume facere superbia, et hypocrisi se ducere, moneamur. Suppose your ministers were guilty (as they are not) of most of [the] things ye lay to their charge; Yet what an unparalleld, unheard of, unexamplified Separation is yours from them as to any warrantable precedent? (7) Make nothing necessary to the unity of the Church, or to the communion of pastors and people but what God has made necessary in his Word, or directed you to make. Put not every new opinion into your creed, nor every new course be added to the Decalogue, as if ye were to impose them upon or require them of others as such substantial articles of Faith or necessary duties that ye must renounce all religious fellowship with them who are not of that way, Acts 15:10. There is not a greater divider or separater than this tantizing or screwing up of debatable points wherein God has left us so much latitude, as not to make either the one or the other part of the controversy a necessary condition of Church-communion. O take no burden of strictness on you that is not of his imposing, Rev. 2:24-25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London: Cockerill, 1681), pp. 181-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>because they had not freedom to retract their Protestation, and profess their sorrow for it, two sinful terms of ministerial communion have been imposed:

1. That no minister of this Church should testify from the pulpit against acts of Assembly, and proceedings of Church judicatories, even though they were such as had a direct tendency to undermine our constitution.

</figure><figure class="quote" id="q-acd534d569" data-kw="">
<blockquote><p>For some went a great length in compliance with the defections of these times [1662-1688]; others durst not comply… ministers and people were obliged to withdraw from these courses which they were convinced in their conscience to be sinful… But this was without any design ever to own these things to be sufficient grounds of separation in a constitute Church, or when with personal safety application could be made to settled Church judicatories who were not under the tyrannical influence of enemies to the work of God… Also there are many alive to this day who know when the Informatory Vindication [1687] was to be printed, that it was sent to Holland to be showed to some of us who were then abroad; and that we declared we could never own the grounds of separation laid down therein to justify a separation from a settled Church in a peaceable state [such as after 1690]… and for this cause it is often added as a qualification to the grounds of withdrawing that they were to be understood ‘in the case of such differences and so circumstantiate[d].’ Informatory Vindication, page 67, ‘In this broken and declining sate of the Church,’ ibid., page 73, 76, 78, 80, 82, 84, 86, 87, 88. To which also the worthy martyr Mr. James Renwick, minister of the Gospel, assented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion</cite>, ed. (1706; Edinburgh: William Gray, 1747) 154 pp. no ToC, pp. v-vi</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>VIII. Did David, as the psalmist of Israel, write all the psalms?

No. He wrote probably more than one half of them. Yet they are called by his name (David, Heb. 4:7. Rom. 11:9) because he was employed more extensively than any other, in this part of the word of God, as the amanuensis of the Holy Ghost.

IX. What name was originally given to that part of the Holy Scriptures which is thus called David?

It was called “Tehillim,” that is, hymns or praises, because it was given as the matter of divine praise to the church of God in every future age. It is also called “Psalms,” because many of these “spiritual songs” were, at the temple worship, sung with the psaltery. Parts of the book have other names, as Mizmor, Shir (46, title), Tehillah (145, title), Tephilah (17,86,102, titles), Prayers, Shir-hammacholoth (120-134) – Odes of Ascension. They are also called, in the Septuagint, Psalmoi.

X. When were the Tehillim, or Psalms written and formed into a book?

They were written in a manner similar to the other parts of Scripture Heb. 1:1, during a period of nearly one thousand years, and were collected into one book, probably by “Ezra the priest, a scribe of the law of the God of heaven.” They stood in their present numerical order in the days of the apostles. Acts 13:33.

XI. Were other songs, beside those contained in the Book of Psalms, composed during that period?

Yes, many. Such as the Song of Deborah Judg. 5:12, the song of the well Num. 21:17, 18, the 1005 songs of Solomon, and others.

XII. Were not these then given as the matter of her praise, or are they not commanded to be sung by the church in all future ages?

No. As we read of different books in Scripture, such as the book of Gad, of Nathan, of Jehu, of Jasher, and the Epistle from Laodicea, which were not collected into the sacred canon, by the Holy Ghost, so we thus know, that by the same divine sovereignty, the songs thus noticed, or even recorded, were ephemeral as matter of praise; while the songs contained in the “Sepher Tehillim,” or Book of Psalms, and collected and placed in one book by the Spirit, are a part of “the word of God, which liveth and abideth forever,” selected by infinite wisdom, and given expressly as the matter of praise to the church until the end of time. The same principle applies to any isolated and occasional hymns or songs, which may be found in the New Testament.

XIII. Were any attempts made to add to the Book of Psalms, after it was completed?

Yes. The 151st psalm was fabricated, and attempted to be added to the then perfect book, nearly three hundred years before “the Christian era.” Septuagint, Psa. 151st.

XIV. Is such an attempt authorized by God?

No. It arises from the depravity of our nature, and the opposition of our wills to the divine will, and consequently forms a part of what the Holy Ghost calls “will worship,” which has a show of wisdom. Col. 2:23.

XV. Is, then, this book called the Book of Psalms, by the Holy Ghost?

It is so called, both by Jesus Christ and by the Spirit. Luke 20:42; Acts 1:20; Heb. 4:7.

XVI. Was it given to the Jewish church to be the matter of praise to God?

Yes. 1 Chron. 16:7; 25:1, 5; Psa. 81:1; . Neh. 12:8, 46; Psa. 137:3, 4; Ezra 3:10.

XVII. Was the Jewish church in reality different from the Christian?

No. They are the same church, under different dispensations. Acts 7:38; Heb. 4:2; Gal. 4:3, 4.

XVIII. When Christ came “to fulfil all righteousness,” and by his evangelists and apostles to complete the oracles of God, did he, or they, praise Jehovah by singing psalms?

Yes, both did. Matt. 26:30; Mark 14:26; Acts 16:25; Psa. 22:2; Heb. 2:13.

XIX. Did they deliver, by inspiration, any other “psalms, hymns, or spiritual songs,” than those contained “in David”? Heb. 4:7.

No. One such psalm or song would be a treasure for the edification of the saints, if “the Psalms” had been simply Jewish; and yet it would not afford a precedent or warrant for uninspired men to make human hymns, and sing them as praise to God. Isa. 1:12. Hos. 13:2.

XX. What is a human hymn, psalm, or spiritual song?

One, of which the arrangement and composition are made by uninspired men, and not by the authority and wisdom of God, even although the sentiment be taken from, and agree with, some portion of Scripture. It has “a show of wisdom;” yet it is only man’s opinion which will be opposed and contradicted by the opinion of some other man metrically expressed, in language, to his mind, equally scriptural. Consequently, “of making many ‘hymn’ books there is no end.” We have now more than one for each Sabbath in the year, all supplanting “the Lord’s song,” (songs), and in their turn supplanted by the poetical skill and caprice of other men. Such compositions, as matter of praise, are, moreover, purely “will worship.” Isa. 1:12.</p></blockquote>

<blockquote><p>I have arranged the book into fifty-two Meditations, adapted for each Lord’s Day, not merely because it is not intended to read them continuously through, but because the subject is, so to speak, specially identified with the risen Saviour. For the truth lying at the foundation of the Psalms, and which makes them the Hymnal of the Church, is the identification of Christ with the Church.

All the sorrows of the believer run up into the sorrow of Christ; and all the joys of the believer flow from the joy of Christ. And around these three truths — helpless misery, glorious salvation, and faith, with its exponent, prayer — move all the Psalms. Any seeming repetitions may therefore in part perhaps be due to the constant recurrence of these three elements throughout the Psalms.

Had the volume been suitable for it, I would fain have inscribed it, such as it is, to those loved friends to whom it is my privilege to minister in the gospel of His Son. Any mark of affection, however slender, to those who are themselves so earnest and loving, would have been peculiarly grateful.

And now I would send it forth with the earnest prayer that the Lord the Spirit who indited the Psalms, would give us all increasingly, the spiritual understanding and the spiritual joy of them in Christ; and so bless the effort to open this alabaster-box, that the savour of His name may be as ointment poured forth.</p></blockquote>

— Alfred Edersheim, The Golden Diary of Heart Converse with Jesus in the Book of Psalms. Arranged for every Sunday in the Year, (London: James Nisbet &amp; Co., 1866), vi-vii.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+have+arranged+the+book+into+fifty-two+Meditations%2C+adapted+for+each+Lord%E2%80%99s+Day%2C+not+merely+because+it+is+not+intended+to+read+them+continuously+through%2C+but+because+the+subject+is%2C+so+to+speak%2C+specially+identified+with+the+risen+Saviour.+For+the+truth+lying+at+the+foundation+of+the+Psalms%2C+and+which+makes+them+the+Hymnal+of+the+Church%2C+is+the+identification+of+Christ+with+the+Church.%0A%0AAll+the+sorrows+of+the+believer+run+up+into+the+sorrow+of+Christ%3B+and+all+the+joys+of+the+believer+flow+from+the+joy+of+Christ.+And+around+these+three+truths+%E2%80%94+helpless+misery%2C+glorious+salvation%2C+and+faith%2C+with+its+exponent%2C+prayer+%E2%80%94+move+all+the+Psalms.+Any+seeming+repetitions+may+therefore+in+part+perhaps+be+due+to+the+constant+recurrence+of+these+three+elements+throughout+the+Psalms.%0A%0AHad+the+volume+been+suitable+for+it%2C+I+would+fain+have+inscribed+it%2C+such+as+it+is%2C+to+those+loved+friends+to+whom+it+is+my+privilege+to+minister+in+the+gospel+of+His+Son.+Any+mark+of+affection%2C+however+slender%2C+to+those+who+are+themselves+so+earnest+and+loving%2C+would+have+been+peculiarly+grateful.%0A%0AAnd+now+I+would+send+it+forth+with+the+earnest+prayer+that+the+Lord+the+Spirit+who+indited+the+Psalms%2C+would+give+us+all+increasingly%2C+the+spiritual+understanding+and+the+spiritual+joy+of+them+in+Christ%3B+and+so+bless+the+effort+to+open+this+alabaster-box%2C+that+the+savour+of+His+name+may+be+as+ointment+poured+forth.%E2%80%9D%0A%0A%E2%80%94+Alfred+Edersheim%2C+The+Golden+Diary+of+Heart+Converse+with+Jesus+in+the+Book+of+Psalms.+Arranged+for+every+Sunday+in+the+Year%2C+%28London%3A+James+Nisbet+%26+Co.%2C+1866%29%2C+vi-vii.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffac1d9e67d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fac1d9e67d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/13/alfred-edersheim-on-christ-and-the-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>This Psalm was composed by David upon occasion, or at the time, of the bringing of the ark of God into the tabernacle which David had prepared for it in Zion, as may be gathered by comparing it with 1 Chron. xvi. 7, 23, 24, &amp;c., where almost the whole Psalm is to be found, But as the ark was an evident type of the Messiah, which David very well knew, as hath been oft-noted before; so David’s thoughts, or at least the design of God’s Spirit, which indited this Psalm, was extended beyond and above it, even to the times of the Messiah, and to his glorious and universal kingdom, in which not the Jews only, but the heathen nations also, should worship the true God, and kiss his Son the Messiah. …

O sing to the LORD a new song: sing to the LORD, all the earth.

A new song, upon this new and great occasion; not the removal of the ark, wherein there was nothing new but an inconsiderable circumstance of place, and that not yet fixed; but the coming of the Messiah, and the confirming of the new covenant by his blood, and the calling of the Gentiles. All the earth; all the nations of the earth, who shall then partake of those great blessings and privileges which are now peculiar to Israel.

2 Sing unto the LORD, bless his name; shew forth his salvation from day to day.

His salvation; that great work of the redemption and salvation of the world by the Messias.

3 Declare his glory among the heathen, his wonders among all people.

You who shall be called out of all the heathen nations to the knowledge of God and Christ, publish this glorious and wonderful work amongst all the heathen nations to whom you belong or may come. …

7 Give unto the LORD, O ye kindreds of the people, give unto the LORD glory and strength.

O ye kindreds of the people; or, O ye families of the people of the world. And the word families may be understood either, 1. Strictly and properly; and so it may be intimated that this great blessing of salvation by Christ should not be imparted to whole nations, but only to some persons taken out of every people and nation, as it is expressed, Revelation v. 9. Or, 2. More largely for nations, as it is taken, Gen. xii. 3 Jer. xxv. 9 Zechariah xiv. 18; and so it may be implied that not only some few of the heathen people should be brought to the acknowledgment and worship of the true God, as was usual in the times of the Old Testament, but that whole nations should come in to the church of God together.

8 Give unto the LORD the glory due unto his name: bring an offering, and come into his courts.

Into the courts of his house. But under this one part of worship he comprehends the whole worship of God; and he speaks of the worship of the New Testament under the expressions of legal worship, as the prophets elsewhere do, as Matt. i. 11, and elsewhere. …

10 Say among the heathen that the LORD reigneth: the world also shall be established that it shall not be moved: he shall judge the people righteously.

Say among the heathen: you converted Gentiles, declare this to those who yet remain in the darkness of heathenism. That the Lord reigneth; that God hath now set up his throne and kingdom in the world. And as that kingdom shall never be destroyed, but shall stand for ever, as is said, Dan. Ii. 44; so the nations of the world shall by the means of it enjoy an established and lasting peace; which is every where mentioned as one of the blessings which the Messiah shall give to the world, as Psa. Lxxii. 3,7; Isa. Ix. 6,7; lxvi. 12; Micah v. 5; Zech. ix. 10.

He shall judge the people righteously; he shall not abuse his invincible power and established dominion to the oppression of his people, as other princes frequently do, but shall govern them by the rules of justice and equity, which is the only foundation of a true and solid peace. See Isa. xxxii. 17.

13 Before the LORD: for he cometh, for he cometh to judge the earth: he shall judge the world with righteousness, and the people with his truth.

Before the Lord; at the presence and approach of their Lord and Maker. To judge the earth; to take to himself that power and authority which belongs to him, to set up his throne and dominion among all the nations of the earth. With his truth; or, in his faithfulness, i.e. so as he hath promised to do. He will certainly and abundantly fulfil all God’s promises made to his people.</p></blockquote>

<blockquote><p>David could not be accused of being ignorant of prayer and unaware of his own nature; if he knew that so much power resided in his nature he nevertheless called on God as his helper, his constant helper; and even this constant help does not satisfy him, but, lest God should at any time despise him, he calls upon Him in abject prayer, and through the whole collection of the Psalms he proclaims his need and cries it aloud. If, therefore, this is something so important to know that he kept saying it constantly, and if he confessed that it is so necessary to teach, how can Pelagius and Caelestius discard every refutation of it in the Psalms, and repudiate all similar teaching, and then believe they can convince some persons that we do not need the help of God, and ought not to ask it, while all the saints bear witness that they can do nothing without it?</p></blockquote>

</figure><figure class="quote" id="q-685145a5ee" data-kw="">
<blockquote><p>Thirdly, he expresseth the matter to be sung in three words, the very titles which are given to David’s Psalms and other scriptural songs: and though there be some difference among interpreters about the kind of songs, which are expressed by every one of those in particular, yet the most received and probable opinion is that by ‘psalms’ are meant all holy songs in general of whatsoever argument, whether they contain prayers, praises, complaints, deprecations, prophecy, history, or a purpose mixed of all those; and by ‘hymns’ are meant special songs of praise to God; and by ‘songs’, a certain kind of hymns, expressing the praises of God for some of his noble acts, great and wonderful beyond others. And those ‘songs’ he calleth ‘spiritual’ (which epithet is to be extended to the psalms and hymns also), as being framed by the Spirit of God, containing spiritual and heavenly purpose, and requiring the assistance of God’s Spirit and a spiritual frame of heart for singing them aright; and this in opposition to the obscene, filthy, and fleshly songs of carnal men and drunkards. … 2. That we may go about this worship of singing praises to God acceptably, it is necessary that we be filled with the Spirit and have a rich and copious measure of his presence and assistance, though not to compose new songs: for he pointeth at scriptural songs, as the most fitting purpose to be sung, under the titles of “psalms, hymns, and spiritual songs;” yet that we may be enabled to choose the fittest songs for the present occasion, and sing them with such a spiritual, elevated frame of heart, as such a divine and heavenly piece of worship requireth; for he saith, “be filled with the Spirit, speaking to yourselves in psalms and hymns and spiritual songs.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thirdly, he expresseth the matter to be sung in three words, the very titles which are given to David’s Psalms and other scriptural songs: and though there be some difference among interpreters about the kind of songs, which are expressed by every one of those in particular, yet the most received and probable opinion is that by ‘psalms’ are meant all holy songs in general of whatsoever argument, whether they contain prayers, praises, complaints, deprecations, prophecy, history, or a purpose mixed of all those; and by ‘hymns’ are meant special songs of praise to God; and by ‘songs’, a certain kind of hymns, expressing the praises of God for some of his noble acts, great and wonderful beyond others. And those ‘songs’ he calleth ‘spiritual’ (which epithet is to be extended to the psalms and hymns also), as being framed by the Spirit of God, containing spiritual and heavenly purpose, and requiring the assistance of God’s Spirit and a spiritual frame of heart for singing them aright; and this in opposition to the obscene, filthy, and fleshly songs of carnal men and drunkards. … 2. That we may go about this worship of singing praises to God acceptably, it is necessary that we be filled with the Spirit and have a rich and copious measure of his presence and assistance, though not to compose new songs: for he pointeth at scriptural songs, as the most fitting purpose to be sung, under the titles of “psalms, hymns, and spiritual songs;” yet that we may be enabled to choose the fittest songs for the present occasion, and sing them with such a spiritual, elevated frame of heart, as such a divine and heavenly piece of worship requireth; for he saith, “be filled with the Spirit, speaking to yourselves in psalms and hymns and spiritual songs.”

— James Fergusson, A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians, (1656-1674; London, 1841), p. 239 &amp; 365 | On Eph. 5:19, p. 239">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+he+expresseth+the+matter+to+be+sung+in+three+words%2C+the+very+titles+which+are+given+to+David%E2%80%99s+Psalms+and+other+scriptural+songs%3A+and+though+there+be+some+difference+among+interpreters+about+the+kind+of+songs%2C+which+are+expressed+by+every+one+of+those+in+particular%2C+yet+the+most+received+and+probable+opinion+is+that+by+%E2%80%98psalms%E2%80%99+are+meant+all+holy+songs+in+general+of+whatsoever+argument%2C+whether+they+contain+prayers%2C+praises%2C+complaints%2C+deprecations%2C+prophecy%2C+history%2C+or+a+purpose+mixed+of+all+those%3B+and+by+%E2%80%98hymns%E2%80%99+are+meant+special+songs+of+praise+to+God%3B+and+by+%E2%80%98songs%E2%80%99%2C+a+certain+kind+of+hymns%2C+expressing+the+praises+of+God+for+some+of+his+noble+acts%2C+great+and+wonderful+beyond+others.+And+those+%E2%80%98songs%E2%80%99+he+calleth+%E2%80%98spiritual%E2%80%99+%28which+epithet+is+to+be+extended+to+the+psalms+and+hymns+also%29%2C+as+being+framed+by+the+Spirit+of+God%2C+containing+spiritual+and+heavenly+purpose%2C+and+requiring+the+assistance+of+God%E2%80%99s+Spirit+and+a+spiritual+frame+of+heart+for+singing+them+aright%3B+and+this+in+opposition+to+the+obscene%2C+filthy%2C+and+fleshly+songs+of+carnal+men+and+drunkards.+%E2%80%A6+2.+That+we+may+go+about+this+worship+of+singing+praises+to+God+acceptably%2C+it+is+necessary+that+we+be+filled+with+the+Spirit+and+have+a+rich+and+copious+measure+of+his+presence+and+assistance%2C+though+not+to+compose+new+songs%3A+for+he+pointeth+at+scriptural+songs%2C+as+the+most+fitting+purpose+to+be+sung%2C+under+the+titles+of+%E2%80%9Cpsalms%2C+hymns%2C+and+spiritual+songs%3B%E2%80%9D+yet+that+we+may+be+enabled+to+choose+the+fittest+songs+for+the+present+occasion%2C+and+sing+them+with+such+a+spiritual%2C+elevated+frame+of+heart%2C+as+such+a+divine+and+heavenly+piece+of+worship+requireth%3B+for+he+saith%2C+%E2%80%9Cbe+filled+with+the+Spirit%2C+speaking+to+yourselves+in+psalms+and+hymns+and+spiritual+songs.%E2%80%9D%0A%0A%E2%80%94+James+Fergusson%2C+A+Brief+Exposition+of+the+Epistles+of+Paul+to+the+Galatians%2C+Ephesians%2C+Philippians%2C+Colossians%2C+and+Thessalonians%2C+%281656-1674%3B+London%2C+1841%29%2C+p.+239+%26+365+%7C+On+Eph.+5%3A19%2C+p.+239&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F685145a5ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/685145a5ee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Thirdly%2C%20he%20expresseth%20the%20matter%20to,psalms%20and%20hymns%20and%20spiritual%20songs&amp;text=Thirdly%2C%20he%20expresseth%20the%20matter%20to%20be%20sung&amp;text=yourselves%20in%20psalms%20and%20hymns%20and%20spiritual%20songs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-cf3a92e9a9" data-kw="">
<blockquote><p>Much has been made by historians of the Scots ‘forcing’ their austere brand of religion upon their English brethren. However, it is clear that Scottish commissioners were aware their role was limited to advising only and that the construction of the Church rested with English members of the Assembly. Indeed, the Westminster Assembly did invite the Scottish commissioners to become full members of the Assembly, an invitation which the Scots declined, thereby recognising and respecting England’s right to define its own church government… The Scots fully encouraged the English to set up a Classical Presbytery based on English tradition and encouraged compromise [or rather a principled accommodation to the Independents]. In response to [the Independent] Philip Nye’s sharp accusation that the Scots had ‘given’ the Assembly a whole system of church government, the Scottish members responded that ‘we were well content the Assembly should take their own order, and not tie themselves to ours.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kirsteen-m-mackenzie.html">Kirsteen M. MacKenzie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League &amp; Covenant of the Three Kingdoms &amp; the Cromwellian Union</cite>, 1643-1663 (Routledge, 2018), ch. 1, pp. 37-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-91a9b3e084" data-kw="">
<blockquote><p>To depart from the Church of England is a departing from the Church of God: let them consider, the Church of Corinth had many faults in it, as many as the Church of England has, and as great ones too; and yet [it] was God’s Church for their faults. St. Paul blames some there for their civil jars impetuously, they traffering them and their suits to the courts of infidels, 1 Cor. 6:7. Others for their wicked connivence and indulgence towards the incestuous, 1 Cor. 5; others for their vile profaneness in their sacred assemblies, 1 Cor. 11:32. Yea, others for heresy, 1 Cor. 15… But the example of Christ Himself writing to the seven Churches of Asia may be our best direction, charging five of them with several faults, and with crimes of a large size, yet he does call them Churches. Moreover, is not the forsaking the Church of God, a forsaking of God Himself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times</cite>, (London: Wilson, 1645), ‘Of the Brownists’ | 23. ‘Schism a great sin’, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3df12a43cc" data-kw="">
<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors</cite>, ... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>§34. II. So much for what is necessary to the being of the sacred office: Now what is necessary to the well-being. And indeed, though the essential unity of the Church lie not upon this, yet the peace and concord of it does, and that so much as that no other means without this will attain it: And the want of what is necessary ad bene esse in the ministry and bishops [or ministers], is it that has caused the common calamities. §35. And I. Nothing is more wanting hereto than better qualifications in the persons: 1. That there be a strong wit, and good acquired gifts of knowledge, and a strong and lively faith from divine illumination, and good acquaintance with the oracles of God: A pastor or teacher should not only know the essentials of Christianity, which every Christian knows, but also the integrals [things that complete the whole of Christianity] and many accidents. And both essentials and integrals should be known by him by a more clear, distinct and orderly understanding, not only above the vulgus fidelium, (common Christians) but above the better sort of the flock. And some store of natural and common knowledge called learning is needful hereunto: But especially more illumination, faith and holy wisdom and skilfulness in matter, sense and method of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 218-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

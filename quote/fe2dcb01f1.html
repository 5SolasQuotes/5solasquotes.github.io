<blockquote><p>Many toil their bodies for worldly gain, who will be loath to distress them for the benefit of their souls; by labour, unreasonably hard, they will quite disfit them for the service of God; and, when they have done, will reckon it a very good reason for shifting duty, that they are already tired out with other business: but the day cometh, when they will be made to abide a yet greater stress. They will go several miles for back and belly, who will not go half the way for the good of their immortal souls; they will be sickly and unable on the Lord’s day, who will be tolerably well all the rest of the week.</p></blockquote>

<blockquote><p>Meanwhile we remark, that this principle, instead of being a principle, either of oppression on the one hand, or slavish submission on the other, is the great charter of Christian liberty, and of the elevated dignity of Christ’s freemen; while the opposite principle is not only the badge, but the instrument of tyranny on the one hand, and of slavish submission to the impositions and inventions of men on the other. It is no slavery, and no degradation to submit to the commands, and walk according to the rules prescribed by the Majesty of heaven and earth. “I will walk at liberty, because I seek thy precepts,” said David. ” Ye shall know the truth, and the truth shall make you free,” says our Lord; …

This is verified by the whole facts alike of individual and of social history, civil and ecclesiastical. That is the history of individual and monkish fanaticism? Not a history, in the first instance, of bad men, but the history of good men following their own inventions, and putting in practice their own devices, and being “wise above what was written;” and the whole issuing in the excesses of folly, and the most enormous crimes of lust and murder. What is the history of the whole gorgeous and burdensome, and even puerile, ceremonial and ritual of Rome, now being copied and imitated in the Church of England at the present moment?

Not the history of things positively forbidden by the Bible in so many words, but the history of things which are “not prescribed in Holy Scripture.” If one man is at liberty to plead for his own invention, because it is not forbidden in the Bible, why may not another do the same for his, and forthwith set it up, on the principle that all is lawful in the worship of God which is not forbidden? What right have the anti-ritualists of England, unless they adopt our principle, to disturb the public peace by their present opposition] Nay, what right have such parties to oppose the ritual of Antichrist himself?

Very different is the case when the Christian man and the Christian church can demand, ” By what Bible authority do you these things? and who gave you this authority?”

Would that the professing church of Christ—would that Christian men might seriously ponder, in the first instance, the great principle to which we have given expression in the words of the Westminster Confession of Faith. It is one which seems to us just, reasonable, and scriptural, and of unspeakable importance to the liberty and highest interests of the Christian church, and their only security against the irruptions of the Papacy, and the introduction of its worst practices into the Church of England.

We tell them, and tell all men, that history, experience, and rational reflection, show that men waste their breath against all such inventions, and gratuitously disturb the peace both of Church and State, if they cannot plead the authority of the Word of God for what they are doing; and what is more, they disturb it in vain—for ”will-worship,” sanctioned, will have its own way, and human nature, “priest and people, love to have it so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 17-18.</span></figcaption>

r.wordpress.com/2020/04/16/james-gibson-on-the-regulative-principle-and-the-defence-of-christian-liberty-in-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b1cac3ba8c" data-kw="">
<blockquote><p>And they have built the high places of Tophet, which is in the Valley of the Son of Hinnom, to burn their sons and their daughters in the fire, which I did not command, nor did it come into My heart. (Jeremiah 7:31)

We hence perceive that there is no end of sinning, when men give themselves up to their own inventions; for God surrenders those to Satan, that they may be led by the spirit of giddiness and of madness and of stupidity. Let us therefore learn ever to regard what God approves: and let this be the very beginning of our inquiry, whenever we undertake anything, whether God commands it; and this course ought especially to be observed with regard to his worship; for, as it has been already stated, religion is especially founded on faith, and faith is based on the word of God: and hence it is here added —

Which I commanded them not, and which never came to my mind This reason ought to be carefully noticed, for God here cuts off from men every occasion for making evasions, since he condemns by this one phrase, “I have not commanded them,” whatever the Jews devised. There is then no other argument needed to condemn superstitions, than that they are not commanded by God: for when men allow themselves to worship God according to their own fancies, and attend not to his commands, they pervert true religion.

And if this principle was adopted by the Papists, all those fictitious modes of worship, in which they absurdly exercise themselves, would fall to the ground. It is indeed a horrible thing for the Papists to seek to discharge their duties towards God by performing their own superstitions. There is an immense number of them, as it is well known, and as it manifestly appears. Were they to admit this principle, that we cannot rightly worship God except by obeying his word, they would be delivered from their deep abyss of error. The Prophet’s words then are very important, when he says, that God had commanded no such thing, and that it never came to his mind; as though he had said, that men assume too much wisdom, when they devise what he never required, nay, what he never knew.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the book of the prophet Jeremiah and the Lamentations</cite>, trans. and ed. John Owen (Geneva, 1589) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), ix, 413-14.</span></figcaption>

<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>

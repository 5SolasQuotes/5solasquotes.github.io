<main class="wrap"><figure class="quote" id="q-5f865897be" data-kw="">
<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Logic, setting forth the Way one ought to Argue Singular Common Places in Most Holy Theology in General &amp; in Specific $5 Downloard</cite>, tr. Jonathan Tomes (Frankfurt, 1625)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea060bdf15" data-kw="">
<blockquote><p>Reason cannot and ought not to bring forth any mysteries, as it were, out of its own storehouse; for this is the prerogative of scripture only. Also, that reason is not to be heard when complaining of its incapacity to comprehend the mysteries of faith: for, being finite, it is no wonder that reason should not comprehend many things that relate to what is infinite; and to reject a mystery because it is incomprehensible to reason, is to offend against reason itself. Neither is reason to be listened to whenever, under cover of holding the mysteries of faith, it aims at setting up its own errors. On the very same grounds we can not call philosophy any rule of faith, although we again concede that it is of no little use, provided it assume not to itself the power of dictating in articles of faith. True philosophy indeed serves very much both to convince men and to prepare their minds; and there is a wonderful harmony between sound philosophy and divinity: for truth is not contrary to truth, nor light to light; only we must not imagine that the former is the rule by which the sense of scripture must be tried and examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 54</span></figcaption>

</figure><figure class="quote" id="q-3e300985bf" data-kw="">
<blockquote><p>A distinction after some work of the mind (distinction of reason, logical distinction, mental distinction) is a lack of identity that arises from an operation of the mind, whether with or without a foundation in the thing. Such a distinction flourishes between several concepts of one and the same reality and it is acquired insofar as the mind conceives the same thing according to diverse and distinct concepts each one of which represents the whole reality, but partially and not totally. The concepts are distinct and diverse but incomplete and inclusive. This distinction is either: A. with a foundation in the thing (a distinction of reasoned reason, intentional or virtual distinction), if from the real diversity of the effect that arises from one and the same formal cause the intellect has a reason or a foundation for distinguishing diverse respects in the cause itself. So in the light of the sun, for instance, there is a distinction between the powers of heating, illumining, and liquefying; in the human intellect there is a distinction between the faculties of conceiving, judging, and reasoning. B. without a foundation in the thing (distinction purely mental, distinction of reasoning reason) if the reason for distinguishing is not found in the thing but in some being of reason, for instance the distinction between man and humanity, or between ‘man’ and ‘man’s’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, ‘On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 31</span></figcaption>

<blockquote><p>Doth the plowman plow all day to sow? doth he open and break the clods of his ground? When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place? For his God doth instruct him to discretion, and doth teach him. For the fitches are not threshed with a threshing instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod. Bread corn is bruised; because he will not ever be threshing it, nor break it with the wheel of his cart, nor bruise it with his horsemen. This also cometh forth from the Lord of hosts, which is wonderful in counsel, and excellent in working.</p></blockquote>

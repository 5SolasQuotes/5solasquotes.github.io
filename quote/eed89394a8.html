<main class="wrap"><figure class="quote" id="q-eed89394a8" data-kw="">
<blockquote><p>The next debate of this nature and kind that fell in was, first, about accepting the [civil] indulgence, then about hearing indulged ministers. As to the first, this made no schism, so long as ministers held their debates among themselves. Some accepted, some not. Those who accepted preached in those parishes where they were indulged; others elsewhere, and sometimes there with them. The indulged ministers also preached elsewhere as they had occasion and access, but thought it not duty to offend the magistrate in breaking confinement to go unnecessarily elsewhere to preach, and thereby hazard the peaceable public exercise of their ministry, which was all they acknowledged they held of the magistrate… neither thought they the keeping of their confinement, though unjustly imposed, a sin, but rather suffering on their part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh] 1712) Hamilton was a Church of Scotland minister., pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>47. The matter may further be thus illustrated: There is almost the like respect and consideration of the Magistrate as he is occupied about the outward things of the Church, and of the ecclesiastic ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience. It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the Word of God, and out of it to show to the Magistrate his duty, to wit, how he ought to govern the commonwealth and in what manner he ought to use the sword. The former is proper and peculiar to the Magistrate (neither does the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers. … 63. The same sin therefore in the same man may be punished one way by the civil, another way by the ecclesiastical power; by the civil power under the formality of a crime, with corporal or pecuniary punishment; By the ecclesiastical power, under the notion and nature of scandal, with a spiritual censure, even as also the same civil question is one way deliberate upon and handled by the Magistrate in the Senate or place of Judgment; another way by the minister of the Church, in the presbytery or synod; by the magistrate so far as it pertains to the government of the commonwealth, by the minister, so far as it respects the conscience; for the ecclesiastical ministry also is exercised about civil things spiritually, in so far as it teaches and admonishes the magistrate out of the Word of God what is best and most acceptable unto God, or as it reproves freely unjust judgments, unjust wars, and the like, and out of the Scripture threatens the wrath of God to be revealed against all unrighteousness of men; So also is the magistrate said to be occupied civilly about spiritual things.</p></blockquote>

<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>

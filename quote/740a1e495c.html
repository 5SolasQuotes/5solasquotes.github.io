<main class="wrap"><figure class="quote" id="q-740a1e495c" data-kw="">
<blockquote><p>It is good to sing psalms, especially if they are sung to the Lord and with reverence, but it is not good if the psalms are used without any reverence either at dinner parties with drinking or in the churches for profit. Likewise, an oath made under the name of God is good if it is done in a trial and reverently with the fear of the Lord. It is not good if it is done rashly and lightly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Righteousness, Oaths, and Usury: A Commentary on Psalm 15</cite>, trans. Todd M. Rester (1573; Grand Rapids MI: Christian’s Library Press, 2013), p. 68.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-adc2d5bc08" data-kw="">
<blockquote><p>So, for that scriptural heavenly duty of singing: what more commonly alleged against it than the abuse and ill effects of that precious ordinance? How often is the nonsense and error of the common translation, the rudeness and dullness of the meter of some Psalms, as Ps. 7:13, as also the cold formality with which that ordinance is performed by many who do but parrotize? I say, how often are these things buzzed into the ears of the people to alienate their hearts from so sweet and beneficial a duty? And very often we find it urged [by Antinomians, who sometimes forsook singing public praise altogether] to the same end, how unwarrantable and dangerous a thing it is for carnal and unregenerated persons to appropriate to themselves in singing those praises and experiences which are peculiar to the saints; not understanding or considering that the singing of Psalms is an ordinance of Christ appointed for teaching and admonition, as well as praising, Col. 3:16, ‘Teaching and admonishing one another in psalms and hymns,’ etc… If Satan can prevail first with wicked men to corrupt and abuse God’s ordinances by superstitious mixtures and additions; and then with good men to renounce and slight them for the sake of those abuses; he fully obtains his design, and gives Christ a double wound at once; one by the hands of his avowed enemies, the other by the hands of his friends, no less grievous than the first. First, wicked men corrupt Christ’s ordinances, and then good men nauseate them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, ‘The Causes &amp; Cures of Mental Errors’, p. 476</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

e on X</a><a class="perma" href="../quote/adc2d5bc08.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=So%2C%20for%20that%20scriptural%20heavenly%20duty,and%20then%20good%20men%20nauseate%20them&amp;text=So%2C%20for%20that%20scriptural%20heavenly%20duty%20of%20singing&amp;text=Christ%E2%80%99s%20ordinances%2C%20and%20then%20good%20men%20nauseate%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1bdc43c173" data-kw="">
<blockquote><p>Why it is, that while two or three very small denominations of Christians use the Psalms of David exclusively, the remaining “ninety-nine hundredths” of the Christian Church exclude these divine songs from divine worship, and adopt in their stead mere human compositions.

The question then is, shall we use, in the instituted worship of God, the Psalms, and Hymns, and Spiritual songs of the Holy Ghost, usually called the Psalms of David, or shall we use human compositions? Or, in other words, shall we sing in the praise of God his songs, or ours? This is the main question or point; and what is the spontaneous response to this question from every Christian heart? Certainly it is, that we should sing the Lord’s songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter I. Psalmody – The Question in Evangelical Guardian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-257d05368e" data-kw="">
<blockquote><p>We do not know that God ever promised his Spirit to teach his people to compose hymns, but He has promised to teach us what to pray for.</p></blockquote>

</figure><figure class="quote" id="q-a446311bcc" data-kw="">
<blockquote><p>When therefore you meet with those that fear God, make improvement of the communion of saints, not only by communicating in natural, and temporal good things as you are able, and as there is need; but especially in the communion of things spiritual, edifying yourselves in your most holy faith, by holy speech and conference, and in due time and place) in reading the holy Scriptures &amp; good books, and by prayer, and singing of Psalms together (Col. 3:16, Rules of singing). That your singing may please God, and edify yourself and others, observe these: Sing as in Gods sight, and, in matter of prayer &amp; praise speak of God in singing. The matter of your song must be spiritual, either indited by the Spirit, or composed of matter agreeing thereunto (Col. 3:16). You must sing with understanding. You must sing with judgement, being able in private to make choice of Psalms befitting the present times and occasions; And both in private and public to apply the Psalm sung to your own particular, as when and how to pray and praise in the words of the Psalm, taking heed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, … (London, 1631), ch. 9, ‘Of keeping Company, as in the sight of God’, section 3, p. 236-7. While Scudder in the passage immediately below allows Col. 3:16 to speak of uninspired compositions in the context of private or social conference, yet the only reference in the book to the content of the Church’s public praise is to ‘psalms’ simply, as is documented below.</span></figcaption>

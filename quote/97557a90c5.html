<main class="wrap"><figure class="quote" id="q-97557a90c5" data-kw="">
<blockquote><p>…we would not only fall down upon our faces and give him thanks, but with loud voices would we praise Him, and in the midst of the congregation would we extol his name, as David and Asaph do almost in every psalm. For doubtless whoso believeth that God loveth him, and feeleth by his faith, that he hath forgiven him all his sins, and careth for him… shall be compelled by the Spirit of God to break out into praise and thanksgiving therefore… but shall cry and call upon them, as David doth, saying: “Praise the Lord with me, and let us magnify his name together. I sought the Lord, and He heard me, yea, He delivered me out of all my fear.”… Yea, would God that our minstrels had none other thing to play upon, neither our carters and ploughmen other thing to whistle upon, save psalms, hymns, and such godly songs as David is occupied withal! And if women, sitting at their rocks [instruments used in spinning], or spinning at the wheels, had none other songs to pass their time withal, than such as Moses’ sister, Glehana’s [Elkanah’s] wife, Debora, and Mary the mother of Christ, have sung before them, they should be better occupied than with ‘hey nony nony, hey troly loly,’ and such like fantasies. If young men also that have the gift of singing, took their pleasure in such wholesome ballads as the [apocryphal] three children sing in the fire, and as Jesus the Son of Sirac doth in his last chapter, it were a token, both that they felt some spark of God’s love in their hearts, and that they also had some love unto Him; for truly, as we love, so sing we… Seeing then that, as the prophet David saith, it is so good and pleasant a thing to praise the Lord, and so expedient for us to be thankful (Ps. 147); therefore, to give our youth of England some occasion to change their foul and corrupt ballads into sweet songs and spiritual hymns of God s honor, and for their own consolation in him, I have here, good reader, set out certain comfortable songs grounded on God’s Word, and taken some out of the holy scripture, specially out of the Psalms of David, all whom would God that our musicians would learn to make their songs! and if they which are disposed to be merry, would in their mirth follow the counsel of St. Paul and St. James (Col. 3; James 5), and not to pass their time in naughty songs of fleshly love and wantonness, but with singing of psalms, and such songs as edify, and corrupt not men’s conversation. … The children of Israel in the old time, when God had delivered them from their enemies, gave thanks unto Him, and made their song of Him, as thou seest by Moses, Barak, David, and other more. Why should not we then make our songs and mirth of God, as well as they? Hath He not done as much for us as for them? Hath He not delivered us from as great troubles as them? Yes, doubtless. Why should He not then be our pastime, as well as theirs? As for such psalms as the scripture describeth (beside the great consolation that they bring into the heart of the spiritual singer) they do not only cause him to spend his time well by exercising himself in the sweet Word of God; but through such ensamples they provoke other men also unto the praise of God and virtuous living. And this is the very right use wherefore psalms should be sung; namely, to comfort a man’s heart in God, to make him thankful, and to exercise him in his Word, to encourage him in the way of godliness, and to provoke other men unto the same. By this thou mayest perceive, what spiritual edifying cometh of godly psalms and songs of God s Word; and what inconvenience foloweth the corrupt ballads of this vain world. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/miles-coverdale.html">Miles Coverdale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ghostly</cite>, [Spiritual] Psalms and Spiritual Songs (1539), ‘Unto the Christian Reader’ in Remains of Myles Coverdale (Cambridge: Parker Society, 1846), pp. 536-540</span></figcaption>

<blockquote><p>But he is not satisfied that in the Christian Assemblies, in the apostles’ times there were no manner of forms. Who says there were not? There was a form of sound doctrine (which the apostle tells us of), there were Psalms, Hymns, and spiritual Songs in forms, they are the three titles of David’s Psalms; we have nothing to do with any thing but forms of prayer, made by some particular ministers, or Church officers, to be used by all other ministers.</p></blockquote>

t online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-afcb3af2fb" data-kw="">
<blockquote><p>Moreover, who can deny ye there is much &amp; great virtue in David’s Harp… Again must not David’s songs be of great excellency, seeing that ye Son of God came down from the glorious throne of his heavenly Father to accomplish and fulfill them? Doth not Paul also say, ‘Be ye filled with the Spirit, speaking among yourselves in Psalms, Hymns, &amp; spiritual songs, singing and making melody in your hearts to ye Lord, ever giving thanks for all things in the name of our Lord Jesus Christ?’ Certes [assuredly] the psalmody of David may well be called ye treasure house of the holy Scripture. For it contain the whatsoever is necessary for a christian to know: There is nothing in the law, no thing in the Prophets, nothing in ye preaching of Christ and of his apostles, yt this noble minstrel, King &amp; Prophet doth not decantate and sing with most goodly &amp; manifest words. He singeth all the works and wonderous miracles of God from the beginning of the world, until the redemption of mankind by Christ. He singeth Christ’s incarnation, preaching, working of miracles, passion, death, resurrection, ascension, glory, the blessing of all nations, the conversion of the Gentiles with all other mysteries that pertain to our health… To be short, he singeth whatsoever is expedient for a Christian’s knowledge. So that even this one book alone of David’s songs had been sufficient truly to instruct a man in the righteousness of God… O the wonderful and marvelous strength of David’s harp. O the great and exceeding virtue of David’s songs… Would God that all men of honor would nourish such minstrels in their houses, as David’s, and that might sing unto them both at dinner and supper, yea and at all other times these most sweet and delectable songs of David… Would God also that all fathers and mothers, all masters and mastresses, would bring up their children and servants in the singing of these most godly songs.</p></blockquote>

— Thomas Becon, David’s harp full of most delectable armony, newly stringed and set in tune by Theodore Basille (London, 1542), ‘To the right honorable Sir. George Broke, Lord Cobham’, no page numbers. Theodore Basille was a pseudonym for Thomas Becon (1512-1567), the English reformer.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoreover%2C+who+can+deny+ye+there+is+much+%26+great+virtue+in+David%E2%80%99s+Harp%E2%80%A6+Again+must+not+David%E2%80%99s+songs+be+of+great+excellency%2C+seeing+that+ye+Son+of+God+came+down+from+the+glorious+throne+of+his+heavenly+Father+to+accomplish+and+fulfill+them%3F+Doth+not+Paul+also+say%2C+%E2%80%98Be+ye+filled+with+the+Spirit%2C+speaking+among+yourselves+in+Psalms%2C+Hymns%2C+%26+spiritual+songs%2C+singing+and+making+melody+in+your+hearts+to+ye+Lord%2C+ever+giving+thanks+for+all+things+in+the+name+of+our+Lord+Jesus+Christ%3F%E2%80%99+Certes+%5Bassuredly%5D+the+psalmody+of+David+may+well+be+called+ye+treasure+house+of+the+holy+Scripture.+For+it+contain+the+whatsoever+is+necessary+for+a+christian+to+know%3A+There+is+nothing+in+the+law%2C+no+thing+in+the+Prophets%2C+nothing+in+ye+preaching+of+Christ+and+of+his+apostles%2C+yt+this+noble+minstrel%2C+King+%26+Prophet+doth+not+decantate+and+sing+with+most+goodly+%26+manifest+words.+He+singeth+all+the+works+and+wonderous+miracles+of+God+from+the+beginning+of+the+world%2C+until+the+redemption+of+mankind+by+Christ.+He+singeth+Christ%E2%80%99s+incarnation%2C+preaching%2C+working+of+miracles%2C+passion%2C+death%2C+resurrection%2C+ascension%2C+glory%2C+the+blessing+of+all+nations%2C+the+conversion+of+the+Gentiles+with+all+other+mysteries+that+pertain+to+our+health%E2%80%A6+To+be+short%2C+he+singeth+whatsoever+is+expedient+for+a+Christian%E2%80%99s+knowledge.+So+that+even+this+one+book+alone+of+David%E2%80%99s+songs+had+been+sufficient+truly+to+instruct+a+man+in+the+righteousness+of+God%E2%80%A6+O+the+wonderful+and+marvelous+strength+of+David%E2%80%99s+harp.+O+the+great+and+exceeding+virtue+of+David%E2%80%99s+songs%E2%80%A6+Would+God+that+all+men+of+honor+would+nourish+such+minstrels+in+their+houses%2C+as+David%E2%80%99s%2C+and+that+might+sing+unto+them+both+at+dinner+and+supper%2C+yea+and+at+all+other+times+these+most+sweet+and+delectable+songs+of+David%E2%80%A6+Would+God+also+that+all+fathers+and+mothers%2C+all+masters+and+mastresses%2C+would+bring+up+their+children+and+servants+in+the+singing+of+these+most+godly+songs.%E2%80%9D%0A%0A%E2%80%94+Thomas+Becon%2C+David%E2%80%99s+harp+full+of+most+delectable+armony%2C+newly+stringed+and+set+in+tune+by+Theodore+Basille+%28London%2C+1542%29%2C+%E2%80%98To+the+right+honorable+Sir.+George+Broke%2C+Lord+Cobham%E2%80%99%2C+no+page+numbers.+Theodore+Basille+was+a+pseudonym+for+Thomas+Becon+%281512-1567%29%2C+the+English+reformer.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fafcb3af2fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/afcb3af2fb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Moreover%2C%20who%20can%20deny%20ye%20there,singing%20of%20these%20most%20godly%20songs&amp;text=Moreover%2C%20who%20can%20deny%20ye%20there%20is%20much&amp;text=in%20the%20singing%20of%20these%20most%20godly%20songs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-90109a807c" data-kw="">
<blockquote><p>After his [Saul’s] death, the crown was set upon David‘s head. Whose constant pious life, and holy devotions (in Hymns, Psalms, and Spiritual Songs) are left, as the best patterns, directions, and encouragements to all posterity. And we are sure enough, that he himself, after his own use of them (to shew the difference betwixt His end, and Saul‘s) was happily assured to be one of the Heavenly Quire above, and there Crowned again with an immortal Crown of Glory. David is an ancient Pattern, a Royal Prophet, and Grand Guide to such, as are willing to fight the Battles of the Lord, in their Pilgrimage towards the true Land of Promise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-stokes.html">David Stokes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Verus Christianus</cite>, [The True Christian], or, Directions for Private Devotions and Retirements… (Oxford, 1668), ‘A Transition to What Follows in the Appendix’, no page number. Stokes (1591?-1669) was an educated Anglican.</span></figcaption>

</figure><figure class="quote" id="q-da8993a229" data-kw="">
<blockquote><p>One of the main reasons that the Dutch church in this country [of America] returned to its independent status [from the national Dutch Church] in 1857 was dissatisfaction with the status of that church’s psalmody. Consequently, when the Christian Reformed Church was formed in 1857, it reaffirmed its commitment to the Psalms. Until its revision in 1932, Article 69 of the Church Order of the Christian Reformed Church read: In the churches only the 150 Psalms of David, the Ten Commandments, the Lord’s Prayer, the Twelve Articles of Faith, the Songs of Mary, Zacharias, and Simoen, the Morning and Evening Hymns, and the hymn of Prayer before the Sermon, shall be sung.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, p. 219</span></figcaption>

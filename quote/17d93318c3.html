<main class="wrap"><figure class="quote" id="q-17d93318c3" data-kw="">
<blockquote><p>But tell me now your opinion of another matter, and that is concerning liberty of conscience, and toleration of heretics and sectaries, for which there are so many books written of late… This question about the toleration of those whose way is different from the common rule which shall be established, must be both stated and resolved, cum grano salis [with a grain of salt]. We must remember to distinguish persons from corporations or Churches, and both these from errors. Again, to distinguish persons, whether godly and gracious, or loose and libertine, whether moderate and peaceable, or factious and turbulent; whether such as have deserved well of the public, or such as have done either no service or a disservice. To distinguish corporation, whether the question be of such only as have a present existence, or of all who shall join to such a way afterward. To distinguish errors, whether practical or doctrinal only, whether fundamental, or circa-fundamental, or neither of the two. To distinguish toleration, whether absolute, or hypothetical and conditional, whether anywhere, or in some few certain places only, whether indefinite and general, or limited and bounded, and if bounded, how far and how much: Whether such toleration as may stand with the Solemn League and Covenant, or such as is inconsistent therewith; whether such as is profitable for the public peace, or such as is apparently destructive thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Late Dialogue Betwixt a Civilian &amp; a Divine Concerning the Present Condition of the Church of England… (London, 1644)</cite>, pp. 30-31</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6595eacc6b" data-kw="">
<blockquote><p>That in endeavoring union and healing men would not straiten it to an universal union in everything, in judgement and practice, but would resolve to have it with many things defective that need forbearance in persons that are united, which men may take up in these particulars: 1. There may be difference of judgement in many things, I mean in such things that are consistent with the foundation and edification; and such a forbearance would be resolved upon, and to do otherways were to think that either men had no reason at all, or that their understandings were perfect, or at least of equal reach. 2… certainly, if people ought to carry even to corrupt ministers who yet destroy not the foundation, as ministers, in the duties that becomes them to ministers in communion with them, while they continue such, then certainly ministers ought to keep that communion with ministers, that becomes their relations, seeing they are still ministers in that respect, as well as in the other. And if this corruption will not warrant separation in other ordinances, as was said in the close of the second part, then neither will it warrant division in the ordinance of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dying Man’s Testament… (Edinburgh: Higgins, 1659), pt. 4, ch. 7, ‘General Grounds leading to Unity’</cite>, pp. 316–18</span></figcaption>

ent." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9c97dd5e3d" data-kw="">
<blockquote><p>1. That the [term] division which is intended here [in this chapter] is not every contest and alienation of mind, and difference of practice incident to men, but that which is proper to the church concerning church affairs, and so is to be distinguished from civil debates and contentions. We would advert also that there may be church differences that fall not under the charge of scandal, as when in some things men of conscience are of different judgments, yet carry it without any offense or breach of charity, or when in some practices there is diversity with forbearance, as was in Polycarp’s days, and the time of Irenaeus (about Easter matters)…</p></blockquote>

</figure><figure class="quote" id="q-bee4d8906f" data-kw="">
<blockquote><p>Those, though otherwise never so godly, that separate from true Churches, like Novatus and Lucifer, for a stricter course of discipline; like Donatus for some bad ones in the Church, as they supposed; like Andius for some lesser corruptions and abuses, they be schismatics. This is the judgment of ancient Churches, for which see at large, Mornay, On the Church, p. 35. But our late Separatists do divide themselves from us upon like grounds: for a more strict discipline with Novatus and Lucifer; for that good and bad are mixed together, with Donatus; and from lesser corruptions among us with Andius. Therefore are these also schismatics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical... (London: 1610) | 2nd Likelihood</cite>, p. 48</span></figcaption>

</figure><figure class="quote" id="q-6c14a35922" data-kw="">
<blockquote><p>But there is one thing which is even worse than controversy, and that is false doctrine tolerated, allowed, and permitted without protest or molestation. It was controversy that won the battle of Protestant Reformation. If the views that some men hold were correct, it is plain we never ought to have had any Reformation at all! For the sake of peace we ought to have gone on worshiping the Virgin and bowing down to images and relics to this very day! Away with such trifling!</p></blockquote>

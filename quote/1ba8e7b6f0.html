<main class="wrap"><figure class="quote" id="q-1ba8e7b6f0" data-kw="">
<blockquote><p>(PP) Antapologia, p. 36. Master [Thomas] Goodwin did anoint a gentlewoman (whose name I conceal) when she was sick, and she recovered after it, say they. (QQ) Ibid. Anointing the sick with oi was held in that church of Arnhem [Netherlands] as a standing ordinance for church-members, as laying on of hands was a standing ordinance for church-officers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (London, 1645), p. 88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“(PP) Antapologia, p. 36. Master [Thomas] Goodwin did anoint a gentlewoman (whose name I conceal) when she was sick, and she recovered after it, say they. (QQ) Ibid. Anointing the sick with oi was held in that church of Arnhem [Netherlands] as a standing ordinance for church-members, as laying on of hands was a standing ordinance for church-officers.”

</figure><figure class="quote" id="q-9adb5fcbc0" data-kw="">
<blockquote><p>What politic laws are to be allowed? Those which are agreeable to the law of nature (whereof the Decalogue is an abridgment) and composed for the safety of the people: or those which do not swerve from the eternal rule of the honoring of God and loving our neighbor, and are made by a lawful magistrate. Those that are made after any other manner, they are no better then tyrannical bonds, Isa. 10:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Theology</cite>, p. 892</span></figcaption>

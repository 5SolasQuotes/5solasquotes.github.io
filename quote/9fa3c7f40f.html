<main class="wrap"><figure class="quote" id="q-9fa3c7f40f" data-kw="">
<blockquote><p>We have covenanted to endeavour a reformation of church government and discipline, “according to the word of God and the example of the best reformed churches.” Now both the word of God and the example of the best reformed churches, leadeth us to a church government distinct from civil government; and the example of the best reformed churches doth undeniably lead us to a church discipline, even where the magistrate is Christian; neither doth the word make any exception of Christian states, but contrariwise chargeth us to keep the commandment and ordinances till Christ come again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, the Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh, 1844), p. 150.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d37baf5e4f" data-kw="">
<blockquote><p>At length the revolution of 1688 (in which, however, the fastidious nature of his principles would not sanction his concurrence) allowed him to return from exile. His attainder was reversed, and, on his brother’s death, he succeeded to the honours of the family; but from religious scruples as to acknowledging the prince of Orange, he never applied for the succession to his brother’s estates. In 1692 he was imprisoned for 8 months on account of being the suspected author of the ‘Sanquhar Declaration, 10th Aug. 1692,’ and was at length liberated in May 1693, and allowed to spend the remainder of his days in undisturbed tranquillity. Sir Robert died unmarried on the 20th Oct. 1701, at Borrowstonness, where he had resided for some period before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-c7631053f4" data-kw="">
<blockquote><p>Why may not Lutherans and Calvinists of the same nation, town or village have their several churches under their several pastors, and live in peace? Nothing could hinder the said peace but want of Christian humility and charity. And consequently, why among us may not Christians that have invincible diversity of persuasions in matters of Church government live peaceably within the same precincts in their several churches?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-103dd6146c" data-kw="">
<blockquote><p>It were unbecoming to say nothing of a distinction which we observe that the Scriptures have pointed out. This distinction is, that to the Father is attributed the beginning of action, the fountain and source of all things; to the Son, wisdom, counsel, and arrangement in action, while the energy and efficacy of action is assigned to the Spirit. Moreover, though the eternity of the Father is also the eternity of the Son and Spirit, since God never could be without his own wisdom and energy; and though in eternity there can be no room for first or last, still the distinction of order is not unmeaning or superfluous, the Father being considered first, next the Son from him, and then the Spirit from both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.18</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">
<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>

</figure><figure class="quote" id="q-afb69e3e82" data-kw="Father begets Son eternal">
<blockquote><p>That the Father begets the Son, and the Son is begotten, can both be said in a sound sense: the former with respect to generation considered in itself because the works of the Trinity inwards (such as to beget and to be begotten) are eternal and unceasing. Otherwise, if personal acts had an end, they would also have a beginning, and all mutation in God could not be denied.</p></blockquote>

</figure><figure class="quote" id="q-5a863f7e1d" data-kw="eternal life know Father Son">

</figure><figure class="quote" id="q-c36511e0ac" data-kw="Father unbegotten">
<blockquote><p>However, the Holy Spirit speaking in the Scriptures does not merely propose one God to us but also teaches us the way to approach God. Therefore, God is revealed to us in three persons, namely the Father, the Son, and the Holy Spirit, so that we may know the path by which God is accessible. For if you consider God absolutely as Lord and Judge, that terrifying majesty presents itself to the mind, whose brilliance dazzles the eye, and the most righteous tribunal whose aspect strikes the conscience of men with sheer terror.</p></blockquote>

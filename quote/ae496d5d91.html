<main class="wrap"><figure class="quote" id="q-ae496d5d91" data-kw="">
<blockquote><p>Some that live in countries where none in twenty miles openly use the New [translation of Scripture, the KJV] one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that: 1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit. 2. That when they have no public church or worship to join with, but what uses the Old [faulty] one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit. 3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says: 1. That it is a cursed thing to offer God a worse [worship] while we have better. 2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.] 3. That it is false worship and obeying man before God. 4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them. 5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers: I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice. II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57e53dffa1" data-kw="">
<blockquote><p>…for though the people of God deserved devastation and captivity by the heathen in regard of their sins before the throne of divine justice, yet the heathen grievously sinned in conquering them, Zech. 1:15, ‘And I am very sore displeased with the heathen that are at ease; for I was but a little displeased, and they helped forward the affliction.’ So though Judah deserved to be made captives and a conquered people because of their idolatry and other sins, as Jeremiah had prophecied, yet God was highly displeased at Babylon for their unjust and bloody conquest, Jer. 1:17-18, 33-34; 51:35, ‘The violence done to me and to my flesh be upon Babylon, shall the inhabitants of Zion say; and my blood upon the inhabitants of Chaldea, shall Jerusalem say.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-7ed22f2a08" data-kw="">
<blockquote><p>For Jeremiah, from the Lord, expressly forbade to fight against Nebuchadnezzar; show us the like for not defending ourselves against bloody papists and Irish cut-throats; for that example may as well prove (if it be a binding law to us) that our king should not raise his subjects to fight against a Spanish armada and a foreign prince; for before ever Nebuchadnezzar subdued the kingdom of Judah (Jer. 27:1) in the beginning of the reign of Jehoiakim (Jer. 36-37) the king of Judah is from the Lord commanded not to draw a sword against the king of Babylon. I hope this will not tie us and our king not to fight against foreign princes or against the great Turk, if they shall unjustly invade us and our king; and this example is against the king’s resisting of a foreign prince unjustly invading him as much as against us, for Nebuchadnezzar was a tyrannous invader and the king of Judah, the Lord’s anointed.</p></blockquote>

</figure><figure class="quote" id="q-d27615bfc7" data-kw="">
<blockquote><p>And hereunto divines and casuists give their concurrence; among them one that is resolute both for monarchy and lineal succession [of royalty], thus expresses his judgment, both for seeking of right and justice from a usurper (whom he calls a tyrant, in regard of an unjust title, not in respect of tyranical oppression [only]) and for obeying his commands. First, that subjects may lawfully seek justice of him…¹ ¹ ‘Dicendum est, licite subditos ab eo (qui•y rannus jure et titulo est) jus petere, quia quamvis jus et titulum non habeat, respublica tamen tacite consemit in hoc ut civibus ipsi tyranno, facto, non jure subditis, jus dicat, ac si esset competens judex et legitimus superior’… Juan Azor, Moral Institutions [d. 1603; Hierat, 1608], pt. 2, bk. 11, ch. 5 [col. 1675]. ‘Non peceat subditus tyranni, qui dominium et jurisdictionem alicujus di•ionis usurpavit, petendo ab eo justitiae administrationem, etc. Si quidem dat operem ut qui pe••at jurisdictionem usurpando, non peccet etiam justitiae administrationem praetermittendo;’ Martin de Azpilcueta Navarro, Manual de Confessores [c. 1557], ch. 1•, n. 41.</p></blockquote>

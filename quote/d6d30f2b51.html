<main class="wrap"><figure class="quote" id="q-d6d30f2b51" data-kw="">
<blockquote><p>Very different is the conception of faith which prevails in the liberal Church. According to modern liberalism, faith is essentially the same as “making Christ Master” in one’s life; at least it is by making Christ Master in the life that the welfare of men is sought. But that simply means that salvation is thought to be obtained by our own obedience to the commands of Christ. Such teaching is just a sublimated form of legalism. Not the sacrifice of Christ, on this view, but our own obedience to God’s law, is the ground of hope. In this way the whole achievement of the Reformation has been given up, and there has been a return to the religion of the Middle Ages. At the beginning of the sixteenth century, God raised up a man who began to read the Epistle to the Galatians with his own eyes. The result was the rediscovery of the doctrine of justification by faith. Upon that rediscovery has been based the whole of our evangelical freedom. As expounded by Luther and Calvin the Epistle to the Galatians became the “Magna Charta of Christian liberty.” But modern liberalism has returned to the old interpretation of Galatians which was urged against the Reformers. Thus Professor Burton’s elaborate commentary on the Epistle, despite all its extremely valuable modern scholarship, is in one respect a mediaeval book; it has returned to an anti-Reformation exegesis, by which Paul is thought to be attacking in the Epistle only the piecemeal morality of the Pharisees. In reality, of course, the object of Paul’s attack is the thought that in any way man can earn his acceptance with God. What Paul is primarily interested in is not spiritual religion over against ceremonialism, but the free grace of God over against human merit</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (New York: MacMillan, 1923), 143–144.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-080a24a856" data-kw="">
<blockquote><p>The righteousness by which we are justified and stand righteous before God, is not our own righteousness, but the righteousness of Christ, Phil. 3:8-9; 2 Cor. 5:21, not the righteousness of Christ as God the Second Person in Trinity, but as Mediator, God-man. In which there are two things:

1. The perfect holiness of his humane nature, Heb. 7:26.

2. The perfect righteousness which He performed in doing and suffering according to the Law, this is imputed to us. Christ’s active obedience, his good works and holy life could never have been meritorious for us, nor brought us to Heaven, if he had not died for us, therefore our justification and obtaining of heaven is ascribed to his blood, as if that alone had done both, Rom. 5:9; Heb. 10:19; Rev. 5:6, 9, 11; his intercession and prayers had not been meritorious for us, if he had not died for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, ‘Of Justification’, pp. 513-14</span></figcaption>

<blockquote><p>Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity: but they are not the cause of, but only a precedent qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the Covenant of Grace, by condition we understand whatsoever is required on our part, as precedent, concomitant or subsequent to justification: repentance, faith and obedience are all conditions; but if by condition we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 20-21</span></figcaption>

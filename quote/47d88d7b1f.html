<blockquote><p>…an after-acceptance and liking of the minister whom they did at first so unwillingly admit is a manifest confirmation of their minister. For as Jacob, by accepting of Leah the second night, which was thrust upon him the first night, thereby made her his lawful wife that he could not after reject her. So likwise the lawful acceptance of a lawful and able minister makes his ministry lawful, as if his election full which was not so at the first.</p></blockquote>

<blockquote><p>From which testimonies [of Jerome], these things are clear: 1. That there was no difference betwixt the names and offices of bishops and presbyters in the days of the apostles; 2 That the difference was not begun by any apostolic constitution; but upon Church-custom, the decrees of Councils and such other grounds. 3. That although he acknowledges some difference for the time, as that bishops were to ordain, from which presbyters were restricted, yet that is clearly asserted by him not to flow from any divine constitution (for there can be none imagined after the apostles days) but from some human or Church constitution…</p></blockquote>

<blockquote><p>2. I grant the whole, and yet nothing is concluded against us. For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644) | pt. 1, p. 299</span></figcaption>

</figure><figure class="quote" id="q-ad950fb64d" data-kw="">
<blockquote><p>There are in England two sorts of episcopal divines. The one sort are Protestants, differing in nothing considerable from the rest of the Reformed Churches, save only in this matter of Church-government. These (if they be not ignorant, ungodly, negligent, insufficient) I shall heartily reverence and desire their union: And many of them the Church has had, and yet has, with whom I account myself unworthy to be once named: Such as were Jewel, Davenant, and many more formerly; and such as are Archbishop Ussher, Bishop Hall, Bishop Morton, Dr. Sanderson and many more at this day. I am very confident that we have not in our Propositions agreed on any exercise of discipline which is not agreeable to the Principles of Protestant bishops to grant us; nay which Papists do not very many of them allow, where no bishops are. If therefore any of you that are our hearers, being not able to maintain your own conceits, or objections against us, will fly to the authority of episcopal divines; we must entreat you to go to the writings of Protestants only; and if you will inquire of any now living, let them be such as our old godly Protestant bishops were: Or else I must tell you we neither expect their conjunction with us, nor shall much be moved by their judgments. For there is a second sort of episcopal divines of the last edition, and of the growth of about thirty years, who differ from us in greater matters than episcopacy, being indeed Cassandrian Papists, and levelling all their doctrines to the advancement of the Papal interest; If you will appeal to these episcopal divines, we should almost as soon consent to an appeal to Rome… 5. The late bishops [pre-1653], even in the judgment of all moderate men of their own party that ever I spoke with, did very many of them deserve to be put down, and more. Read the articles against Wren, Pierce, Goodman, Laud, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>

</figure><figure class="quote" id="q-50e7148f16" data-kw="">
<blockquote><p>Again I conceive that there be two sort of positives in the externals of [Church] government or worship:

1. Some divine, as that there be in the public worship, prayers, praising, preaching, sacraments, and these are substantials; that there be such officers, pastors, teachers, elders and deacons; that there be such censures, as rebuking, excommunication and the like, are morally divine, or divinely moral: and when the Church forms a directory for worship and government, the directory itself is in the form not simply divine….

2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal; in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture as was the [Anglican] Service-Book [which was sought to be imposed on Scotland in 1637]; and the pastor or people in these are not properly moral agents [working things in themselves moral or religious], nor do we press that Scripture should regulate men in these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro | Section 5, pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

1. Some divine, as that there be in the public worship, prayers, praising, preaching, sacraments, and these are substantials; that there be such officers, pastors, teachers, elders and deacons; that there be such censures, as rebuking, excommunication and the like, are morally divine, or divinely moral: and when the Church forms a directory for worship and government, the directory itself is in the form not simply divine….

2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal; in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture as was the [Anglican] Service-Book [which was sought to be imposed on Scotland in 1637]; and the pastor or people in these are not properly moral agents [working things in themselves moral or religious], nor do we press that Scripture should regulate men in these.”

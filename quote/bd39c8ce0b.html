<main class="wrap"><figure class="quote" id="q-bd39c8ce0b" data-kw="">
<blockquote><p>Again corruptions in doctrine must further be distinguished: some of them are errors indeed, but beside the foundation; and some errors directly against the foundation: and these overturn all religion, whereas the former do not. Now it cannot be showed that in our [English] Churches is taught any one error that razes the foundation, and consequently annihillates the truth of God’s Church. Indeed, there is controversy among us touching the point of ecclesiastical regiment: but mark in what manner: We all jointly agree in the substance of the regiment, confessing freely that there must be preaching of the Word, administration of the sacraments according to the institution, and the use of the power of the keys in admonitions, suspensions, excommunications: The difference between us is only touching the persons and the manner of putting this government in execution: and therfore men on both parts, though both hold not the truth in this point; yet because both hold Christ the foundation, they still remain brethren and true members of Christ. As for corruptions in manners, they make not a Church to be no church, but a bad Church. When as the wicked scribes and Pharisees sitting in Moses’s chair taught the things which he had written, the people are commanded to hear them, and to do the things which they say, not doing the things which they do. And whereas it is said that we hold Christ in Word, and deny Him in deed; that is answered thus: denial of Christ is double: either in judgement, or in fact: Denial in judgment joined with obstinacy, makes a Christian to be no Christian; denial in fact, the judgment still remaining sound, makes not a man to be no Christian, but a bad Christian. When the Jews had crucified the Lord of life, they still remained a Church, if any upon earth: and notwithstanding this their fact, the apostles acknowledged that the covenant and promises still belonged unto them: and they never made any separation from their synagogues till such time as they had been sufficiently convicted by the apostolical ministry that Jesus Christ was the true Messiah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Creed, on the Church in A Golden Chain</cite>, (Cambridge, 1600), p. 497</span></figcaption>

</figure><figure class="quote" id="q-ca4866a32c" data-kw="">
<blockquote><p>And what shall I say in the conclusion, now I am near to my departure from this contentious world? but sound a retreat to all these unhappy militants, that will not let holiness prosper by the necessary advantage of peace. Cease your proud contendings, O vain-glorious militant clergy! Learn of the Prince of peace and the holy angels that preached Him, to give glory to God in the highest, who gives peace on earth, and well-pleasedness in (or towards) men. Did Christ or his apostles make such work for Christians as you do? The great Shepherd of the flock will take your pretences of order, orthodoxness (or truth) and piety for no excuse for your corrupting order, faith and practice by your tyranny, self-conceitedness and blind zeal and superstition; and for using his name against Himself, to the destroying of that love, and concord and unity which He has bequeathed to his Church; and for serving his enemy, and dividing his people, and hardening infidels and ungodly ones by these scandals. Return to the primitive simplicity, that we may return to unity, love and peace. Dream not of them upon your own corrupting terms. And read and read over again and again James 3, which does describe you, condemn you, and instruct you. If you say, ‘Physicion heal thyself: Who has wrote more of controversies?’ I answer, peruse what I have written and you will see it is of controversies, but against controversies, tending to end and reconcile. If anything be otherwise (except necessary defence of certain necessary faith or duty), I retract it and condemn it: Let it be as not written. I have meddled much with controversies in this book: but it is to end them. The God of Peace give wisdom and peaceable principles, minds and hearts to his servants, that (though I shall not live to see it) true love and piety may revive in the Christian world, by the endeavors of a healing ministry, and the shaming, restraint and reformation of the contentious clergy, whether tyrannical, dogmatical or superstitious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

</figure><figure class="quote" id="q-61eea66ae6" data-kw="">
<blockquote><p>Therefore there is no binding men’s faith to that the Scripture avers not. The Papists do bind to things:

1. Citra fundamentum, besides the foundation; as traditions, untempered mortar daubed on the walls of truth to hide it.

2. Circa fundamentum, to things about the foundation, such as endanger it: as denial of Scripture to laymen. This is a wretched sin, to obtrude for matter of faith, that it is not lawful to read the Scriptures which are the rule of faith.

3. Contra fundamentum, to things against the foundation; as the sacrifice of the mass, distinction of mortal and venial sins, justification by works, etc. What is against that which is necessarily to be believed to salvation, is against the foundation. But it is necessary to trust in Christ’s blood and merits only, because there is no other name given under heaven whereby we may be saved. (Acts 4:12) Therefore to trust in others, to let angels or men share part of our faiths, is against the foundation. Indeed they boast that they only hold the foundation: but ‘I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing.’ (Gal. 5:2) If you join your own merits with Christ’s merits, he shall profit you nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition upon the divine Second Epistle General, written by the blessed Apostle St. Peter</cite>, (London: Badger, 1633), on ch. 1, verse 5, p. 110</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

2. Circa fundamentum, to things about the foundation, such as endanger it: as denial of Scripture to laymen. This is a wretched sin, to obtrude for matter of faith, that it is not lawful to read the Scriptures which are the rule of faith.

3. Contra fundamentum, to things against the foundation; as the sacrifice of the mass, distinction of mortal and venial sins, justification by works, etc. What is against that which is necessarily to be believed to salvation, is against the foundation. But it is necessary to trust in Christ’s blood and merits only, because there is no other name given under heaven whereby we may be saved. (Acts 4:12) Therefore to trust in others, to let angels or men share part of our faiths, is against the foundation. Indeed they boast that they only hold the foundation: but ‘I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing.’ (Gal. 5:2) If you join your own merits with Christ’s merits, he shall profit you nothing.”

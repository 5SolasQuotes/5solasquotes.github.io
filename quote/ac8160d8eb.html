<main class="wrap"><figure class="quote" id="q-ac8160d8eb" data-kw="">
<blockquote><p>Q. 3. How, then, are these ways and means of the worship of God made known unto us? A. In and by the written word only, which contains a full and perfect revelation of the will of God as to his whole worship and all the concernments of it.—John 5:39; Isa. 8:20; Luke 16:29; 2 Tim. 3:15–17; 2 Pet. 1:19; Deut. 4:2, 12:32; Josh. 1:7; Prov. 30:6; Rev. 22:18, 19; Isa. 29:13, 14. EXPLICATION—The end wherefore God granted his word unto the church was, that thereby it might be instructed in his mind and will as to what concerns the worship and obedience that he requireth of us, and which is accepted with him. This the whole Scripture itself everywhere declares and speaks out unto all that do receive it; as 2 Tim. 3:15–17, with the residue of the testimonies above recited, do declare. It supposeth, it declareth, that of ourselves we are ignorant how God is, how he ought to be, worshipped, Isa. 8:20. Moreover, it manifests him to be a “jealous God,” exercising that holy property of his nature in an especial manner about his worship, rejecting and despising every thing that is not according to his will, that is not of his institution, Exod. 20:4–6. That we may know what is so, he hath made a revelation of his mind and will in his written word,—that is, the Scripture. And to the end that we might expect instruction from thence alone in his worship, and act therein accordingly,— First, He sends us and directs us thereunto expressly for that purpose, Isa. 8:20; Luke 16:29; John 5:39; and not once intimates in the least any other way or means of instruction unto that end. Secondly, He frequently affirms that it is sufficient, able, and perfect to guide us therein, 2 Tim. 3:15–17; 2 Pet. 1:19; Ps. 19:7–9. And whereas he hath expressly given it unto us for that end, if there be any want or defect therein it must arise from hence, that either God would not or could not give unto us a perfect revelation of his will; neither of which can be imagined. Thirdly, He hath commanded us to observe all whatsoever he hath appointed therein, and not to make any addition thereunto, Josh. 1:7; Deut. 4:2, 12:32; Prov. 30:6; Rev. 22:18, 19. And,— Fourthly, Peculiarly interdicted us the use of any such things as are of the institution or appointment of men, Isa. 29:13, 14. So that from the Scriptures alone are we to learn what is accepted with God in his worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 15 (Edinburgh: T&amp;T Clark, n.d.), 449–50.</span></figcaption>

<blockquote><p>But the reformation was not complete; the high places were not all taken away, though many of them were, 2 Chron. 15:3, 5. Those in the cities were removed, but not those in the cities of Judah, but not those in the cities of Israel which were reduced to the house of David; or those that were used in the service of false gods, but not those that were used in the service of the God of Israel. These he connived at, and yet his heart was perfect. There may be defects in some particular duties where yet the heart, in the man, is upright with God. Sincerity is something less than sinless perfection.</p></blockquote>

<blockquote><p>We must understand that in these civil things that might be decent and fit in one country (and consequently commanded of God) which in another country is utterly undecent, and consequently forbidden. It was a great sin among the Corinthians for a woman to come into the congregation with her head uncovered, that is, without a vail to cover her whole head, 1 Cor. 11:5. In our congregations (because it is undecent) it were a sin for a woman to come so attired. In which respect, though we have oft in the New Testament mention of fasts both public and private, of sackcloth used in them, we have no mention at all.</p></blockquote>

<blockquote><p>1. Bowing of the knee, physically or civilly, is indifferent and is not adoration: for we bow to kings, and artificers may bow the knee to drive a nail in a bed, and yet are not adoring; but religious adoration, whether ye will or not, by nature’s impression, is a religious note of religious submission. 2. I consider four acts of the soul that may convey external adoration: 1. One of the mind, a consideration of the excellency of what we adore; 2. A will to submit to this excellency; 3. The judgments diting this to be honest to submit; 4. A purpose or intention habitual or actual of adoring; many of these may be where there is no adoring: and the religious external bowing of the body is essentially adoring, when that bowing is in a state of worship: kneeling before consecrated elements for reverence of either God or the elements, must be adoration, though we should wash it with foul water and say that there is no intention to tender God’s glory to these elements. 3. Let it be considered what is said by the Jesuit Joannes de Lugo, the Pope’s professor at Rome, which I propound with some change: 1. There is a purpose of external adoring, with an inward submission of the heart; whether this be an habitual or actual intention, it is sure it is an adoration when it comes forth in a gesture of adoring. 2. A will to bow the body in scorn and derision, as the soldiers bowed the knee before Jesus; and this being not in a state of worshipping, but in a state and case of disgracing, is not religious bowing or adoration: This is not a natural expression of inward submission, but rather of disgrace. 3. There is a willed or voluntary religious bowing for fear, for gain, or for glory; yet without any internal estimation of the excellency of the thing adored. This Suarez denies to be worshipping, it being only a feigning of worship, not a worshipping. 4. If religious kneeling require that we intend to worship everything before which, as an object, we do religiously kneel, then religious kneeling should not signify internal submission of the heart by nature’s impression or divine institution, but by the voluntary and the free institution of him that kneels: But this latter is absurd, for if kneeling should signify what it does signify by our free and voluntary appointment, then we might: 1. Put upon natural gestures what signification we pleased, and were not to stand to the signification which God and nature have put upon kneeling. 2. So it were in man’s power to impose upon religious kneeling to God civil courtesy, such as a subject expresses to his prince, or a son to his father; and it were free to us to kneel to a stock, and that religiously, and yet put upon kneeling the negative reverence that we give to the Bible; and it were in the three children’s will to kneel to Nebuchadnezzar’s image, and impose this signification on the gesture, that they were kneeling to God only, all which are manifestly false: so Field says kneeling has institution from the instinct of nature.</p></blockquote>

— Rutherford’s Considerations, The Divine Right of Church Government (London, 1646), ch. 1, question 5, section 1, pp. 145-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Bowing+of+the+knee%2C+physically+or+civilly%2C+is+indifferent+and+is+not+adoration%3A+for+we+bow+to+kings%2C+and+artificers+may+bow+the+knee+to+drive+a+nail+in+a+bed%2C+and+yet+are+not+adoring%3B+but+religious+adoration%2C+whether+ye+will+or+not%2C+by+nature%E2%80%99s+impression%2C+is+a+religious+note+of+religious+submission.+2.+I+consider+four+acts+of+the+soul+that+may+convey+external+adoration%3A+1.+One+of+the+mind%2C+a+consideration+of+the+excellency+of+what+we+adore%3B+2.+A+will+to+submit+to+this+excellency%3B+3.+The+judgments+diting+this+to+be+honest+to+submit%3B+4.+A+purpose+or+intention+habitual+or+actual+of+adoring%3B+many+of+these+may+be+where+there+is+no+adoring%3A+and+the+religious+external+bowing+of+the+body+is+essentially+adoring%2C+when+that+bowing+is+in+a+state+of+worship%3A+kneeling+before+consecrated+elements+for+reverence+of+either+God+or+the+elements%2C+must+be+adoration%2C+though+we+should+wash+it+with+foul+water+and+say+that+there+is+no+intention+to+tender+God%E2%80%99s+glory+to+these+elements.+3.+Let+it+be+considered+what+is+said+by+the+Jesuit+Joannes+de+Lugo%2C+the+Pope%E2%80%99s+professor+at+Rome%2C+which+I+propound+with+some+change%3A+1.+There+is+a+purpose+of+external+adoring%2C+with+an+inward+submission+of+the+heart%3B+whether+this+be+an+habitual+or+actual+intention%2C+it+is+sure+it+is+an+adoration+when+it+comes+forth+in+a+gesture+of+adoring.+2.+A+will+to+bow+the+body+in+scorn+and+derision%2C+as+the+soldiers+bowed+the+knee+before+Jesus%3B+and+this+being+not+in+a+state+of+worshipping%2C+but+in+a+state+and+case+of+disgracing%2C+is+not+religious+bowing+or+adoration%3A+This+is+not+a+natural+expression+of+inward+submission%2C+but+rather+of+disgrace.+3.+There+is+a+willed+or+voluntary+religious+bowing+for+fear%2C+for+gain%2C+or+for+glory%3B+yet+without+any+internal+estimation+of+the+excellency+of+the+thing+adored.+This+Suarez+denies+to+be+worshipping%2C+it+being+only+a+feigning+of+worship%2C+not+a+worshipping.+4.+If+religious+kneeling+require+that+we+intend+to+worship+everything+before+which%2C+as+an+object%2C+we+do+religiously+kneel%2C+then+religious+kneeling+should+not+signify+internal+submission+of+the+heart+by+nature%E2%80%99s+impression+or+divine+institution%2C+but+by+the+voluntary+and+the+free+institution+of+him+that+kneels%3A+But+this+latter+is+absurd%2C+for+if+kneeling+should+signify+what+it+does+signify+by+our+free+and+voluntary+appointment%2C+then+we+might%3A+1.+Put+upon+natural+gestures+what+signification+we+pleased%2C+and+were+not+to+stand+to+the+signification+which+God+and+nature+have+put+upon+kneeling.+2.+So+it+were+in+man%E2%80%99s+power+to+impose+upon+religious+kneeling+to+God+civil+courtesy%2C+such+as+a+subject+expresses+to+his+prince%2C+or+a+son+to+his+father%3B+and+it+were+free+to+us+to+kneel+to+a+stock%2C+and+that+religiously%2C+and+yet+put+upon+kneeling+the+negative+reverence+that+we+give+to+the+Bible%3B+and+it+were+in+the+three+children%E2%80%99s+will+to+kneel+to+Nebuchadnezzar%E2%80%99s+image%2C+and+impose+this+signification+on+the+gesture%2C+that+they+were+kneeling+to+God+only%2C+all+which+are+manifestly+false%3A+so+Field+says+kneeling+has+institution+from+the+instinct+of+nature.%E2%80%9D%0A%0A%E2%80%94+Rutherford%E2%80%99s+Considerations%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+ch.+1%2C+question+5%2C+section+1%2C+pp.+145-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F567618cbef.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/567618cbef.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=1.%20Bowing%20of%20the%20knee%2C%20physically,institution%20from%20the%20instinct%20of%20nature&amp;text=1.%20Bowing%20of%20the%20knee%2C%20physically%20or%20civilly&amp;text=kneeling%20has%20institution%20from%20the%20instinct%20of%20nature" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now if any pretense to liberty in mine own behalf or others does become an occasion of discontentedness, of strife, of murmurings and of sullenness of spirit, whereby I am discomposed so that I cannot serve all men freely in the duties of my calling, then I am a transgressor of the apostle’s rule, and walk not according to the law of liberty in the kingdom of Jesus Christ: because I suffer my conscience to be under the power of some other relations to liberty which I have not made subordinate unto the relations of Christianity, which nevertheless cannot be prejudged by any oaths of an inferior concernment, according to the rule, Quod in juramento semper jus superioris intelligitur exceptum [That in an oath the right of something superior is always excepted], and in our National [Solemn League &amp;] Covenant, the obligation towards the maintaining of the liberties of the kingdom is expressed to be only in order to our calling and place. Now if we do not reckon our spiritual calling as Christians, and our place in the ministry to be the rule according to which that Engagement and the endeavors which we owe to our civil freedoms are to be managed, I know not what it is in our sphere of the ministry that can be meant by the restriction of that performance to our calling and place. I say then, that by the express words of the Covenant, I am obliged not to make my plea for civil liberties (if infringed) such as may prejudge my Christian or ministerial liberties; as if it should be lawful for me to forgoe these for want [lack] of satisfaction in those, or think it unlawful for me to make use of these when I conceive my self deprived of those.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-df82c2191e" data-kw="">
<blockquote><p>This liberty of election is in part prejudged and hindered by patronages and presentations which are still in use there [in Scotland], not by the rules of their discipline, but by toleration of that which they cannot amend, in the mean time procuring, that in the case of presentations by patrons, the examination and trial by the Presbytery, is still the same. The congregation, where he who is presented is to serve, is called, if they have ought to object against his doctrine or life, after they have heard him, or that their consent may be had. And if he be found Reus ambitus, or to have gone about to procure a presentation, he is repelled and declared incapable of that place. No pastor may thrust himself upon a flock, nor after his entry, desert his charge, or remove himself to another congregation at his own pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government &amp; Order of the Church of Scotland</cite>, (Edinburgh: Bryson, 1641), II. Of their Calling</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eef86b3b42" data-kw="">
<blockquote><p>16. If the power of the keys be given to believers, as believers [as congregationalists say], because Christ is their King, Priest and Prophet, and all things are theirs, Paul, Apollo, Cephas, the world? 1. It is asked, if none have the power of the keys, but believers, and if all acts pastoral of preaching, binding and loosing, excommunicating performed by unbelieving ministers and professors be not hence made null, as performed à non habentibus potestatem, as if Turks and pagans had performed these? We think they must be null. 2. We think children baptized by unbelieving ministers not baptized. 3. An unbelieving pastor not essentially a pastor. 4. If, because Christ is given to the elect, and all things are theirs, and so all ministerial power of the keys, it is questioned, if amongst these all things given to the believers, we may not include the magistrate’s sword, the king’s power, the master’s power over the servant, the captain’s power over the soldier, so that by that same reason there be no kings, no judges, no masters, no captains, save only believers, we see not how this follows not, as well as that the power of the keys, and all things are given to believers, because Christ is given to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 18, p. 276</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-ed97c098ff" data-kw="">
<blockquote><p>Although Baillie was fundamentally disenchanted with episcopacy after years of religious upheaval for which he blamed the Laudian episcopate, he had not abandoned the argument that a temporary episcopate could effectively restore unity to a fragmented and church. It was Baillie’s overriding desire for a return to peace and normalcy that led him not to contest publicly Charles II’s reestablishment of episcopacy but this did not preclude Baillie from exhorting leading nobles and the new archbishop of Glasgow privately. Ironically, this suggests that one of the explanations for the widespread conformity to the Erastian settlement of the post-restoration kirk may be found through analysis of the writings of one of the most strident proponents of a jure divino presbyterian polity. Such a conclusion cases mid-century presbyterians in more moderate light than has hitherto been the case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

med Books Online</a></div>
</figure><figure class="quote" id="q-7071370bd4" data-kw="">
<blockquote><p>As regards eutaxia [good-order] in matters naturally outward and indifferent she [the Church] sets up those she thinks most likely to further edification, not in order that, as is the vicious way in the Papacy, they may become an essential part of divine worship, the norm of which is to be sought in God’s Word alone; but in order that they may be its supports and instruments suited to persons, times and places, as things concerned solely with the determination of outward circumstances, which may be altered in various ways to meet the exigencies of public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rissen.html">Leonard Rissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVI, 29, as trans. in Heppe, Reformed Dogmatics, ch. 16, sect. 49</cite>, p. 686</span></figcaption>

</figure><figure class="quote" id="q-58da2d3e5c" data-kw="">
<blockquote><p>Furthermore, our theologians believe that churches should be free to send and delegate to councils even private individuals, provided they are pious, learned, and knowledgeable in ecclesiastical matters, and these, in such a case, can give their vote on proposed matters in common with the pastors and elders. This is also taught and believed by Whitaker in Controversy 3, On Councils, question 3, the illustrious Moses Amyraut in his Theses on Councils, part 2, Wendelin in Christian Theology, book 1, chapter 28, thesis 31, Bucanus in place 43, number 23, and Tilenus in Disputations on Councils, 1, and many others. Hence, it is evident what the status of this controversy with the modern Pontiffs is, namely, whether only bishops have a decisive vote in councils, which the Pontiffs affirm, or whether the same right belongs to any delegates of the churches, whether they are pastors or from other governors of the Church, or even otherwise private individuals, which our theologians teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, 2. ‘Who are to be called to councils, and of what kind of persons they should consist’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), Posthumous Works, 4. Controversies on Councils, pp. 1029-31 Latin, p. 1,031</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

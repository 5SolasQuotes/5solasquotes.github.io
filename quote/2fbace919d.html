<main class="wrap"><figure class="quote" id="q-2fbace919d" data-kw="">
<blockquote><p>15. In times of extraordinary necessities of the Church, or State, or poor, there must be extraordinary bounty in our contributions; As if an enemy be ready to invade the land, or if some extraordinary work of God (as the conversion of some heathen nations) do require it, or some extraordinary persecution, and distress befall the pastors, or in a year of famine, plague, or war, when the necessities of the poor are extraordinary: The tenths in such cases will not suffice, from those that have more to give; Therefore in such a time, the primitive Christians sold their possessions, and laid down the price at the feet of the Apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673) | Pt. 4, pp. 196-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-139d516bd3" data-kw="">
<blockquote><p>Whereas some object that the care both of temporal good and spiritual good belongs to the magistrate, therefore he must have a power to make Church laws. See [David] Pareus. For his care cannot be supreme, if he must rule at the nod and beck of Church-men. I Answer, the connection is weak: he who has the care of both the temporal and spiritual good of the people, he has a nomothetic [law-making] power to procure both these two goods: it follows [in] no way, for then might he have a power in his own person to preach, and administrate the sacraments; this power [of the magistrate] procures the spiritual good, but such as is the care, such is the power: the care is politic and civil; Therefore the power to procure the spiritual good, must bee politic and civil [circa sacra, not in sacra].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Appendix, pp. 442-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-3b4d25d63d" data-kw="">
<blockquote><p>XV. (8) Next is the calumny [of Papists against the Reformed] concerning independency, in the church as well as in the state, which causes us to recognize no authority in the church and to be hostile to superior powers. But nothing could be said more unjustly and be more foreign to our religion… We leave independency to those who withdraw themselves from the jurisdiction of the magistrate [such as Romanists] and think they are raised so far above kings that their crowns depend upon them, which they can confer or take away at pleasure.</p></blockquote>

</figure><figure class="quote" id="q-4f2cfd9477" data-kw="">
<blockquote><p>…we are unworthy to lift up our eyes unto heaven and appear in thy presence, and that we ought not to presume to hope that thou wilt listen to our prayers if thou takest account of the things which we lay before thee; for we are accused by our own consciences, and our sins bear witness against us, while we know thee to be a just Judge, who justifiest not sinners and wicked men, but inflictest punishment on those who have broken thy commands. Hence it is, Lord, that when we reflect on the state of our whole life, we are ashamed of ourselves, and can do nothing but despond, just as if we were plunged into the abyss of death. And yet, Lord, since thou hast deigned, of thy boundless mercy, to command us to call upon thee, and that from the lowest hell, and the more devoid of strength we see ourselves to be to flee the more to thy supreme goodness ; since, moreover, thou hast promised that thou wilt listen to our prayers in the name of the Lord Jesus Christ, (whom thou hast appointed to be our advocate and intercessor,) and for his merit, without looking to what we have deserved, we here, renouncing all human confidence, and trusting solely to thy goodness, hesitate not to come into thy sight, and call upon thy holy name, in order to obtain mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, ‘Almighty God, heavenly Father, we acknowledge and humbly confess…’ in Forms of Prayer for the Church in ‘Forms of Prayer’ in Tracts, vol. 2</span></figcaption>

</figure><figure class="quote" id="q-0403f30cb2" data-kw="">
<blockquote><p>For we are as much obliged to believe non-fundamentals that are clear (as that there were eight persons saved in the ark, and the old world drowned with waters, Sodom burnt with fire), as to believe fundamentals, that there is no name whereby men may be saved, but by the name of Jesus, for the Authority of God speaking in his Word and his command does equally oblige to both; but there is no such necessity so absolute in believing non-fundamentals, as in believing these, without the knowledge whereof, we cannot be saved. But it never follows that errors in non-fundamentals published and taught to the ruin of the souls of many, they having such a strong connection and influence on the knowledge of fundamentals, are to be tolerated since our sinning here does as equally and strongly strike against the authority and express command of God (at least in most things of that kind) as in points fundamental; and therefore the magistrate, who is to look to the honor of God as a Christian, and peace of societies in all, is as much obliged to punish clearly opened, non-fundamental, as fundamental, false doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, ... (London, 1649), ch. 10, p. 124</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<main class="wrap"><figure class="quote" id="q-f8cccbc26c" data-kw="">
<blockquote><p>In this way we can admit not only that there is a partial righteousness in works (as our adversaries maintain), but that they are approved by God as if they were absolutely perfect. If we remember on what foundation this is rested, every difficulty will be solved. The first time when a work begins to be acceptable is when it is received with pardon. And whence pardon, but just because God looks upon us and all that belongs to us as in Christ? Therefore, as we ourselves when ingrafted into Christ appear righteous before God, because our iniquities are covered with his innocence; so our works are, and are deemed righteous, because every thing otherwise defective in them being buried by the purity of Christ is not imputed. Thus we may justly say, that not only ourselves, but our works also, are justified by faith alone. Now, if that righteousness of works, whatever it be, depends on faith and free justification, and is produced by it, it ought to be included under it and, so to speak, made subordinate to it, as the effect to its cause; so far is it from being entitled to be set up to impair or destroy the doctrine of justification. Thus Paul, to prove that our blessedness depends not on our works, but on the mercy of God, makes special use of the words of David, “Blessed is he whose transgression is forgiven, whose sin is covered;” “Blessed is the man unto whom the Lord imputeth not iniquity.” Should any one here obtrude the numberless passages in which blessedness seems to be attributed to works, as, “Blessed is the man that feareth the Lord;” “He that has mercy on the poor, happy is he;” “Blessed is the man that walketh not in the counsel of the ungodly,” and “that endureth temptation;” “Blessed are they that keep judgment,” that are “pure in heart,” “meek,” “merciful,”, they cannot make out that Paul’s doctrine is not true. For seeing that the qualities thus extolled never all so exist in man as to obtain for him the approbation of God, it follows, that man is always miserable until he is exempted from misery by the pardon of his sins. Since, then, all the kinds of blessedness extolled in the Scripture are vain so that man derives no benefit from them until he obtains blessedness by the forgiveness of sins, a forgiveness which makes way for them, it follows that this is not only the chief and highest, but the only blessedness, unless you are prepared to maintain that it is impaired by things which owe their entire existence to it. There is much less to trouble us in the name of righteous which is usually given to believers. I admit that they are so called from the holiness of their lives, but as they rather exert themselves in the study of righteousness than fulfill righteousness itself, any degree of it which they possess must yield to justification by faith, to which it is owing that it is what it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.10</span></figcaption>

</figure><figure class="quote" id="q-68f750ca2d" data-kw="">
<blockquote><p>If they object that place of James, ‘We are not justified by faith, but by works’: I answer that there is a double justification, there is a justification of the person: so was Abraham justified by faith, as Paul expresses it, Rom. 4. But then there is a second justification, a justification of the faith that Abraham had: he justified his faith by his works; he showed that he had not a dead faith, a liveless faith, a faith without works, but that he had a lively effectual faith: for he added works to his faith, his works wrought together with his faith. So that, if the question be, Whether Abraham was an hypocrite? his works justified him that he was none. If the question be, Whether Abraham was a sinner? his faith justifies him, and shows that he was made righteous through faith. So, there is a justification of the person, and a justification of the faith of the person: as when a man is said to justify such an action or such a cause, the meaning is not that he will make that just which was unjust before, but he will make it appear to be just; so Abraham was declared to have a justifying faith by that power and efficacy it wrought in him, in offering up his son.</p></blockquote>

</figure><figure class="quote" id="q-7ad8dce818" data-kw="">
<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law… And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. … Whereas therefore one essential part of justification consists in the pardon of our sins, and sins cannot be actually pardoned before they are actually committed… Justification is at once complete in the imputation of a perfect righteousness, the grant of a right and title unto the heavenly inheritance, the actual pardon of all past sins, and the virtual pardon of future sins…</p></blockquote>

<blockquote><p>Those whom God effectually calls, he also freely justifies, not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous; not for anything wrought in them, or done by them, but for Christ&#x27;s sake alone; not by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing Christ&#x27;s active obedience unto the whole law, and passive obedience in his death for their whole and sole righteousness by faith, which faith they have not of themselves; it is the gift of God.</p></blockquote>

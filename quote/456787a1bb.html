<blockquote><p>102. The distinction of God’s antecedent and consequent will, used by Damascene, is by many applied to this controversy, but by none that I have read sufficiently explained, which is the cause that so many good men reject it, because they misunderstand it. It’s truly said that by his antecedent will, God would have all men to believe, repent and be saved, but by his consequent will He will have all condemned whom He does condemn. But then it must be understood that this distinction is not applied to the will of God as He is merely an Absolute Proprietary or Benefactor, but as He is the King or Rector of the world; and so his legislation is his antecedent will, and his judgment is his consequent will. And no man of religion can deny either that God’s Law is the signification of his will, or his will signified, or that his judgment and execution is his will declared; or that God’s Law of Grace does conditionally give pardon and salvation to all antecedently to man’s performance or rejection of the condition, or that God condemns infidels consequently to their infidelity. The Law antecedently to man’s part acted says, ‘He that believes shall be saved;’ and the sentence consequently to his fact says, ‘Judas, an unbeliever or impenitent, shall perish.’ And thus the distinction has no doubt or difficulty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology</cite>, ... (London: White, 1675) | pt. 2, sect. 7, ‘The Antecedent &amp; Consequent Will of God, etc.’, p. 54</span></figcaption>

</figure><figure class="quote" id="q-c358548691" data-kw="">
<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>

<blockquote><p>1. Voluntas essentialis and voluntas personalis. This is an admittedly rare distinction, given the Reformed orthodox unwillingness to speculate into the doctrine of the Trinity in a manner like that of the medieval doctors. This distinction parallels, of course, the basic distinction of properties of the Godhead into proprietates essentiales and proprietates personales. Thus, the voluntas essentialis is simply the will of God, understood as an essential property or as a faculty of the divine life. The ‘essential’ will of God can also be termed the voluntas realis, namely, will by which God discerns all things existent or nonexistent. The voluntas personalis, then, can only relate to the inward begetting and proceeding of the persons of the Trinity, understood as somehow belonging to the divine willing–as such, this language relates also to the concept of a necessary divine will, the voluntas necessaria. Thus, God the Father necessarily wills to beget God the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 2nd</cite>, ed. (Baker Academic, 2003), vol. 3, p. 453</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>What we will antecedently, we do not will simply, but in a qualified sense; because the will is compared to things as they are in themselves: but in themselves they are in particular, hence we simply will something, according as we will it considering all particular circumstances, which is to will consequently.</p></blockquote>

<blockquote><p>VII. But the orthodox speak far differently. They affirm that there is a natural law, not arising from a voluntary contract or law of society, but from a divine obligation being impressed by God upon the conscience of man in his very creation, on which the difference between right and wrong is founded and which contains the practical principles of immovable truth (such as: “God should be worshipped,” “parents honoured,” “we should live virtuously,” “injure no one,” “do to others what we would wish them to do to us” and the like).

Also that so many remains and evidences of this law are still left in our nature (although it has been in different ways corrupted and obscured by sin) that there is no mortal who cannot feel its force either more or less. Now they wish this law to be called natural, not because it has its origin from bare nature (since it depends upon God the supreme lawgiver), but because it becomes known from the aspect of creatures and the relation of man to God, and the knowledge of it is impressed upon the mind by nature, not acquired by tradition or instruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf33b0c2d9" data-kw="">
<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’</cite>, (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-dd7252cd57" data-kw="">
<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>

<blockquote><p>I choose to make the obligation which we are under of obeying civil laws, and the commands of our governors, to depend on the will of God, because the other foundations on which it is wont to be built do not appear of sufficient strength and solidity.</p></blockquote>

</figure><figure class="quote" id="q-258c414b3b" data-kw="">
<blockquote><p>But this right [of the civil government], as far as [it] pertains to its exercise in respect of the infliction of punishment, either tends to the good of the whole republic, as in ordinary cases, or, as in some extraordinary cases, gives place to its hurt; for it is possible that even the exaction of punishment, in a certain condition of a state, may be hurtful. In such a situation of things, the ruler or magistrate has a power not to use his right of government in respect of particular crimes; or rather, he ought to use it in such a manner as is the most likely to attain the end; for he is bound to regard principally the good of the whole and the safety of the people ought to be his supreme law. But he who affirms that in ordinary cases, a magistrate may renounce his right, when that renunciation cannot but turn out to the hurt of the public good, is a stranger to all right.</p></blockquote>

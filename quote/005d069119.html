<main class="wrap"><figure class="quote" id="q-005d069119" data-kw="">
<blockquote><p>Things that fall under an affirmative precept [of God], and these cannot be totally omitted for eschewing scandal: for whatever God has commanded, is some way necessary. Therefore, it some ways, and in some cases may be done, though offence be taken at it; but branches, or parts of affirmative precepts may be omitted for eschewing of scandal, as such a particular kneeling in prayer, in such a place¹…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Appendix, ‘An Introduction to the Doctrine of Scandal’ | Question 5, p. 58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7db125d72f" data-kw="">
<blockquote><p>Not that our Lord by this intended to confirm all sentences of excommunication, or to patronize any cheat or hypocrisy in any, to gain an absolution, or restoration to the church. But only, as to the first, to assure stubborn and impenitent sinners that he would ratify what his church did, according to the rule He had given them to act by… If therefore any be cast out of any church for professing or standing to any truth of the gospel, or because he will not do what is sinful, we must not understand them bound in heaven, though they be bound on earth, nor have any such excommunications any terror in them. How forcible are right words! But these arguings, what do they reprove? The church is not by this text made infallible, nor is the holy God by it engaged to defend their errors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 18, verse 18</span></figcaption>

</figure><figure class="quote" id="q-38b795f294" data-kw="">
<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Question 5, p. 59</span></figcaption>

t="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>

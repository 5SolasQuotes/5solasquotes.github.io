<main class="wrap"><figure class="quote" id="q-bc42a56fe4" data-kw="">
<blockquote><p>John: Verse 16, If a man see his brother sin a sin that is not unto death (that is, which may be pardoned), let him ask (pardon in his behalf) and he shall give him life for them that sin not unto death: There is a sin unto death (after which, necessarily damnation follows, as the sin against the Holy Ghost): I say not that thou shouldest pray for it. Church: But is not every sin, a sin to death? John: 17. All unrighteousness is sin (and therefore deserves death), but there is a sin not unto death (namely that which is pardoned in Christ).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Epistle of John</cite>, ch. 5, pp. 26-27 in A Case of Conscience Resolved (Edinburgh, 1592)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53a09de88b" data-kw="">
<blockquote><p>‘he shall ask,’ i.e. with confidence, as 1 John 5:14. But ‘there is a sin unto death,’ i.e… of such as have apostatized from a former specious profession into heresy and debauchery, and continue obstinate therein, against all methods of recovery; that are, as Jude 1:12, even twice dead, etc. ‘I do not say that he shall pray for it;’ i.e. I do not give that encouragement to pray for such, with that hope and expectation of success, as for others; though he does not simply forbid praying for them neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole, Annotations, on 1 John</cite>, ch. 5, verse 16. Poole died previous to completing his Annotations; Howe was the continuator for 1 John.</span></figcaption>

</figure><figure class="quote" id="q-542411a48a" data-kw="degrees">
<blockquote><p>Hence it appears that the question does not concern the equality of sins or gradual inequality, but their essential demerit. The question is not whether all sins are equal to each other (the paradox of the ancient Stoics and falsely charged upon us by our opponents). If all sins agree in being mortal, it does not follow that they are equal in all things because they can differ from each other as to degree of demerit, so as to deserve a greater or lesser punishment. Rather the question is only whether they are equally mortal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a> › <a href="../topics/sin/degrees-of-sin/great-and-small.html">Great and small</a></span></div>

</figure><figure class="quote" id="q-41fc1f5fa4" data-kw="">
<blockquote><p>[After quoting Mt. 12:31-32] For in reality there is no difference between the sin from which one is never granted truly to repent— for which no sacrifice remains, but only certain and severe vengeance, and which will never be forgiven— and that which is, and is called, ‘unto death.’ In this view not only have the greatest of our theologians gone before, but many others also, both of the ancients and of the Papists, who, however, have expressed their opinion less fully by various phrases, indeed interpreting somewhat differently the blasphemy against the Holy Spirit, and trying to distinguish this sin just as much as the one Paul [in Hebrews] describes from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-marck.html">Johannes Marckius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblical Exercitations on 50 select places of the Old and New Testament</cite>, (Amserdam, 1707), Exercitation 50, ‘On 1 John 5:16-17’, pp. 1096-97, trans. ChatGPT-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><figure class="quote" id="q-3d3b7daf0e" data-kw="">
<blockquote><p>The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16</cite>, (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45, p. 1094</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

<blockquote><p>The will of God in the decree and the revealing of part thereof in the command do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>

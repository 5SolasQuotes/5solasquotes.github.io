<main class="wrap"><figure class="quote" id="q-d4f17aad69" data-kw="">
<blockquote><p>…these questions were proponed to him that was to be elected. … Question. ‘Believe ye not, that the doctrine of the prophets and apostles, contained in the books of the New and Old Testament, is the only true and most absolute foundation of the universal church of Christ Jesus, in so much, that in the same Scripture are contained all things necessary to be believed for the salvation of mankind?’ Answer. ‘I verily believe the same; and do abhor and utterly refuse all doctrine alleged necessary to salvation, that is not expressedly contained in the same.’ Question. ‘Is not Christ Jesus, man of man according to the flesh, to wit, the son of David, the seed of Abraham, conceived of the Holy Ghost, born of the Virgin Mary his mother, the only Head and Mediator of his church?’ Answer. ‘He is, and without him there is neither salvation to man, nor life to angel.’ Question. ‘Is not the same Lord Jesus the only true God, the eternal Son of the eternal Father, in whom all that shall be saved were elected before the foundation of the world was laid?’ Answer. ‘I acknowledge and confess Him in the unity of his Godhead to be God above all things, blessed forever.’ Question. ‘Shall not they whom God, in his eternal counsel, has elected, be called to the knowledge of his Son, our Lord Jesus; and shall not they who of purpose are called, in this life, be justified; and where justification and free remission of sins is obtained in this life by free grace, shall not the glory of the Son of God follow in the general resurrection, when the Son of God shall appear in his glorious majesty?’ Answer. ‘This I acknowledge to be the doctrine of the apostles, and the most singular comfort of God’s children.’ Question. ‘Will ye not then contain yourself in all doctrine within the bounds of this foundation? Will ye not study to promove the same, as welll by your life as by your doctrine? Will ye not, according to the graces and utterance that God shall grant unto you, profess, instruct, and maintain the purity of the doctrine contained in the sacred Word of God; and to the uttermost of your power will ye not gainstand, and convince the gainsayers, and the teachers of men’s inventions?’ Answer. ‘That do I promise in the presence of God, and of his congregation, here assembled.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-98f1528e12" data-kw="">
<blockquote><p>It has been claimed that confessions were originally a statement of faith but were modified by the Roman Catholic Church into statements of what is to be confessed. “We believe” (Nicea) became “we teach that this is to be confessed” (Chalcedon) and finally “whoever does not believe… is condemned” (Athanasian Creed). With the adoption of anti-heretical creeds, binding to such creeds by means of subscription was also introduced. According to Schaff, the signing of the Creed adopted by the Council of Nicea (AD 325) is “the first instance of such signing of a document in the Christian Church.” Also worth mentioning is the seventh canon of the council of Laodicea (AD 364) which states that heretics are “to have thoroughly learned the symbols of faith.” In 1273 or 1274 the deputies sent from the Eastern Church to the Council of Lyons II were obliged to subscribe the unchanged NiceneConstantinopolitan Creed. It would thus seem that the custom of subscribing credal formulas is as old as the oldest extant credal formula adopted by an ecumenical council. It would be wrong, however, to assume that subscription as a custom was identical in both the Western and Eastern Churches. In the Western Church it was commonly practised. However, though the Eastern or Orthodox Church considers the decisions of the seven ecumenical councils to have credal authority, it does not have a tradition of confessions and subscription like that found in the Catholic and Protestant traditions. An authority on Orthodoxy states it as follows: ‘At a true Ecumenical Council the bishops recognize what the truth is and proclaim it; this proclamation is then verified by the assent of the whole Christian people, an assent which is not, as a rule, expressed formally and explicitly, but lived.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roelf-christiaan-janssen.html">Roelf Christiaan Janssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Credal Period’ in By this our Subscription: Confessional Subscription in the Dutch Reformed Tradition since 1816 PhD diss</cite>, (Theologische Universiteit, Gereformeerde Kerken, 2009), pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>‘Substantial subscription’ is closer to the kind of ‘system subscription’ known as ‘Good Faith Subscription,’ which has been officially adopted by the PCA and which reflects the ‘Old School Presbyterian’ version of system subscription. This mode of subscription requires that the subscriber affirm the system of doctrine contained in the Confession, which ‘system’ is presumably ‘Reformed theology.’ Moreover, it requires the ordaining entity to query the candidate concerning any scruples and requires the candidate in ‘good faith’ to be open and honest about any and all scruples he may have with respect to the confessional standards. The ordaining authority must then determine whether any of the candidate’s reservations or exceptions are ‘out of accord with any fundamentals of the system of doctrine’ and ensure that his exception is ‘neither hostile to the system nor strikes at the vitals of religion.’ Though similar to system subscription, I prefer the modifier ‘substantial.’ The primary usage of ‘substantial’ is ‘of ample or considerable amount, quantity, size, etc.’ Thus, unlike ‘substance’ or ‘system’ forms of subscription, substantial conveys the message that the subscriber is in agreement with a significant proportion of the Confession… But substantial subscription goes farther than system subscription in that it formally conveys a high level of agreement not merely with the system in the Confession but with the Confession as a whole. Indeed, since substantial subscription takes the whole Confession as its starting point and since by its nature only allows for a limited amount of non-substantive exceptions, it may be viewed as a version of ‘full subscription’ that formally allows for a limited number of non-substantial caveats or exceptions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gonzales-jr-robert.html">Robert Gonzales Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Confessional Subscription: Strict vs. Substantial’</cite>, (2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘Substantial subscription’ is closer to the kind of ‘system subscription’ known as ‘Good Faith Subscription,’ which has been officially adopted by the PCA and which reflects the ‘Old School Presbyterian’ version of system subscription. This mode of subscription requires that the subscriber affirm the system of doctrine contained in the Confession, which ‘system’ is presumably ‘Reformed theology.’ Moreover, it requires the ordaining entity to query the candidate concerning any scruples and requires the candidate in ‘good faith’ to be open and honest about any and all scruples he may have with respect to the confessional standards. The ordaining authority must then determine whether any of the candidate’s reservations or exceptions are ‘out of accord with any fundamentals of the system of doctrine’ and ensure that his exception is ‘neither hostile to the system nor strikes at the vitals of religion.’ Though similar to system subscription, I prefer the modifier ‘substantial.’ The primary usage of ‘substantial’ is ‘of ample or considerable amount, quantity, size, etc.’ Thus, unlike ‘substance’ or ‘system’ forms of subscription, substantial conveys the message that the subscriber is in agreement with a significant proportion of the Confession… But substantial subscription goes farther than system subscription in that it formally conveys a high level of agreement not merely with the system in the Confession but with the Confession as a whole. Indeed, since substantial subscription takes the whole Confession as its starting point and since by its nature only allows for a limited amount of non-substantive exceptions, it may be viewed as a version of ‘full subscription’ that formally allows for a limited number of non-substantial caveats or exceptions.”

— Gonzales, Jr., Robert, ‘Confessional Subscription: Strict vs. Substantial’ (2016)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Substantial+subscription%E2%80%99+is+closer+to+the+kind+of+%E2%80%98system+subscription%E2%80%99+known+as+%E2%80%98Good+Faith+Subscription%2C%E2%80%99+which+has+been+officially+adopted+by+the+PCA+and+which+reflects+the+%E2%80%98Old+School+Presbyterian%E2%80%99+version+of+system+subscription.+This+mode+of+subscription+requires+that+the+subscriber+affirm+the+system+of+doctrine+contained+in+the+Confession%2C+which+%E2%80%98system%E2%80%99+is+presumably+%E2%80%98Reformed+theology.%E2%80%99+Moreover%2C+it+requires+the+ordaining+entity+to+query+the+candidate+concerning+any+scruples+and+requires+the+candidate+in+%E2%80%98good+faith%E2%80%99+to+be+open+and+honest+about+any+and+all+scruples+he+may+have+with+respect+to+the+confessional+standards.+The+ordaining+authority+must+then+determine+whether+any+of+the+candidate%E2%80%99s+reservations+or+exceptions+are+%E2%80%98out+of+accord+with+any+fundamentals+of+the+system+of+doctrine%E2%80%99+and+ensure+that+his+exception+is+%E2%80%98neither+hostile+to+the+system+nor+strikes+at+the+vitals+of+religion.%E2%80%99+Though+similar+to+system+subscription%2C+I+prefer+the+modifier+%E2%80%98substantial.%E2%80%99+The+primary+usage+of+%E2%80%98substantial%E2%80%99+is+%E2%80%98of+ample+or+considerable+amount%2C+quantity%2C+size%2C+etc.%E2%80%99+Thus%2C+unlike+%E2%80%98substance%E2%80%99+or+%E2%80%98system%E2%80%99+forms+of+subscription%2C+substantial+conveys+the+message+that+the+subscriber+is+in+agreement+with+a+significant+proportion+of+the+Confession%E2%80%A6+But+substantial+subscription+goes+farther+than+system+subscription+in+that+it+formally+conveys+a+high+level+of+agreement+not+merely+with+the+system+in+the+Confession+but+with+the+Confession+as+a+whole.+Indeed%2C+since+substantial+subscription+takes+the+whole+Confession+as+its+starting+point+and+since+by+its+nature+only+allows+for+a+limited+amount+of+non-substantive+exceptions%2C+it+may+be+viewed+as+a+version+of+%E2%80%98full+subscription%E2%80%99+that+formally+allows+for+a+limited+number+of+non-substantial+caveats+or+exceptions.%E2%80%9D%0A%0A%E2%80%94+Gonzales%2C+Jr.%2C+Robert%2C+%E2%80%98Confessional+Subscription%3A+Strict+vs.+Substantial%E2%80%99+%282016%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc489c4f375.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c489c4f375.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Substantial%20subscription%E2%80%99%20is%20closer%20to%20the,number%20of%20non%2Dsubstantial%20caveats%20or%20exceptions&amp;text=Substantial%20subscription%E2%80%99%20is%20closer%20to%20the%20kind%20of&amp;text=a%20limited%20number%20of%20non%2Dsubstantial%20caveats%20or%20exceptions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

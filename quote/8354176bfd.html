</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8872bfd394" data-kw="">
<blockquote><p>Although pardon of sin be compleated at that great day, yet this is not to be understood, as if Gods pardon of any sin were imperfect, and something of sinne did still remain to be done away. No, those expressions of forgivenes of sin in the Scripture, denote such a full and plenary pardon, that a sin cannot be more remitted then it is. But because we commit new sinnes daily, and so need pardon daily, Therefore it is that we are not compleatly pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publikely be declared to all the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification</cite>, London, 1651, Lecture 29, pp. 258–259</span></figcaption>

</figure><figure class="quote" id="q-a8c10b0015" data-kw="">
<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification through the Righteousness of Christ Alone</cite>, reply to the Anonymous Man’s Third Argument</span></figcaption>

</figure><figure class="quote" id="q-4e9b07758c" data-kw="">
<blockquote><p>Osiander&#x27;s objection as to its being inconsistent with the nature of God, falls back upon himself; for though he clothes the saints with a twofold righteousness as with a coat of skins, he is, however, forced to admit, that without forgiveness no man is pleasing to God. If this be so, let him at least admit, that with reference to what is called the proportion of imputation, those are regarded as righteous who are not so in reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.11</span></figcaption>

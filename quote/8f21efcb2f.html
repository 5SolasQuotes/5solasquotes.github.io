<blockquote><p>Heretics are they, who maintain stubbornly against the plain light of truth, any doctrine which overthrows directly, or by necessary consequence the fundamentals of Christian faith.

The Rules.

I. Not every Error makes an Heretic.

For either there is an error against the foundation; as that of the Arians and Marcionites, of whom, they denied the divinity of Christ, these his humanity: Or about the foundation; so the Papists err, while they teach Transubstantiation, on which overthrows the truth of Christ’s humanity: Or besides the foundation; such errors are by Paul compared to hay, wood, &amp;c. 1 Cor. 3. 12.

II. An Heretic is made, 1. by an error in, or about the foundation, 2. by conviction, 3 by contumacy.

III. Not ever Schismatic is an Heretic.

He is a Schismatic, who without hurting the foundation of Faith, departs from some Ceremony of the Church, proudly and out of ambition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), pp 232-33.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d8618aa4d" data-kw="">
<blockquote><p>19. Also we judge it our duty to preach those plain and necessary things which the salvation of men does most depend on, and the people generally have most need to hear; that is, the opening to them their Baptismal Covenant, and the Articles of the [Apostles’] Creed, the Lord’s Prayer, the Decalogue and the Gospel-precepts; or more briefly the doctrine of faith in Christ, and repentance towards God, and of the love of God and man; to live soberly, righteously, and godly in this world, as looking and hoping for a better, Tit. 2:12. And not to fill the people’s heads with needless controversies, or vain jangling, or contending about words which edify not, but subvert the hearers; much less to perplex them with talking of the unrevealed counsels of God; nor yet to corrupt their minds by talking against our superiors, or against dissenters behind their backs, or by aggravating the faults of other men’s manner of worshipping God, or breeding in them distaste of the public worship; or talking against bishops, or ceremonies, or liturgy; nor by representing any sort of Christians who differ from us in points not fundamental, as odious to the hearers; whether Lutherans, Calvinists, Arminians, Episcopal, Presbyterian, Independent, yea or Anabaptists; no, nor to injure the Papists themselves, by making our differences seem greater than indeed they are. Our office is to preach up love, and not to preach it down and mortify it, which all those do, whatever they pretend, that attempt to represent their brethren as odious, and to hide or deny, or extenuate that in them which is good and amiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry</cite>, … (1668-1669; 1675; London: 1681), pp. 18-19</span></figcaption>

<blockquote><p>Q. IV. What are the ends that I aim at in the great undertaking? … 3. I can appeal to God, that I have no design in the least to maintain a party, or to keep up any schismatical faction; my heart rises against the thoughts of it. I hate dividing principles and practices, and whatever others use, I am for peace and healing; and if my blood would be sufficient balsam, I would gladly part with the last drop of it, for the close up of the bleeding wounds of differences that are amongst true Christians. Peace is such a precious jewel, that I would give anything for it but truth. Those who are hot and bitter in their contendings for or against little things, and zealous in keeping up names of division and maintaining parties, are of a spirit which I understand not. Let not my soul come into their secret. My ends then are according to my principles, and I humbly appeal to God concerning the integrity of my heart in them.</p></blockquote>

<blockquote><p>XXVII. Although we believe that the presbyterian order and parity (isotimian) or equality of pastors received among us approaches nearer to the institution of Christ and the apostles and the practice of the apostolic church, still we are unwilling to disturb anyone on this subject or to condemn the usage of the evangelical and Reformed churches, who retain the episcopal government so far, as more suitable to the genius and morals and political form of government of their people and more useful for good order (eutaxian) and the exercise of discipline. Provided there be always absent Babylonian pride and papal tyranny and this order be acknowledged as of ecclesiastical, not of divine right. But in turn we expect that equity and moderation from our brethren who differ from us here, so that they do not presume to condemn by a decretory sentence as schismatics and destitute of a lawful calling other churches differing from them and (in accordance with the liberty granted to them by Christ) using the presbyterian form of government as better adapted to their state and to the wishes and customs of their people; but should not cease to embrace them with brotherly affection that the bond of unity and fraternity may always remain unbroken and so with heart and strength joined together the work of God may be carried on to the increase of the kingdom of Christ and the destruction of Antichrist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.21.27</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXVII. Although we believe that the presbyterian order and parity (isotimian) or equality of pastors received among us approaches nearer to the institution of Christ and the apostles and the practice of the apostolic church, still we are unwilling to disturb anyone on this subject or to condemn the usage of the evangelical and Reformed churches, who retain the episcopal government so far, as more suitable to the genius and morals and political form of government of their people and more useful for good order (eutaxian) and the exercise of discipline. Provided there be always absent Babylonian pride and papal tyranny and this order be acknowledged as of ecclesiastical, not of divine right. But in turn we expect that equity and moderation from our brethren who differ from us here, so that they do not presume to condemn by a decretory sentence as schismatics and destitute of a lawful calling other churches differing from them and (in accordance with the liberty granted to them by Christ) using the presbyterian form of government as better adapted to their state and to the wishes and customs of their people; but should not cease to embrace them with brotherly affection that the bond of unity and fraternity may always remain unbroken and so with heart and strength joined together the work of God may be carried on to the increase of the kingdom of Christ and the destruction of Antichrist.”

— Francis Turretin, Institutes of Elenctic Theology, 18.21.27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVII.+Although+we+believe+that+the+presbyterian+order+and+parity+%28isotimian%29+or+equality+of+pastors+received+among+us+approaches+nearer+to+the+institution+of+Christ+and+the+apostles+and+the+practice+of+the+apostolic+church%2C+still+we+are+unwilling+to+disturb+anyone+on+this+subject+or+to+condemn+the+usage+of+the+evangelical+and+Reformed+churches%2C+who+retain+the+episcopal+government+so+far%2C+as+more+suitable+to+the+genius+and+morals+and+political+form+of+government+of+their+people+and+more+useful+for+good+order+%28eutaxian%29+and+the+exercise+of+discipline.+Provided+there+be+always+absent+Babylonian+pride+and+papal+tyranny+and+this+order+be+acknowledged+as+of+ecclesiastical%2C+not+of+divine+right.+But+in+turn+we+expect+that+equity+and+moderation+from+our+brethren+who+differ+from+us+here%2C+so+that+they+do+not+presume+to+condemn+by+a+decretory+sentence+as+schismatics+and+destitute+of+a+lawful+calling+other+churches+differing+from+them+and+%28in+accordance+with+the+liberty+granted+to+them+by+Christ%29+using+the+presbyterian+form+of+government+as+better+adapted+to+their+state+and+to+the+wishes+and+customs+of+their+people%3B+but+should+not+cease+to+embrace+them+with+brotherly+affection+that+the+bond+of+unity+and+fraternity+may+always+remain+unbroken+and+so+with+heart+and+strength+joined+together+the+work+of+God+may+be+carried+on+to+the+increase+of+the+kingdom+of+Christ+and+the+destruction+of+Antichrist.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+18.21.27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5df86273c7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5df86273c7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=XXVII.%20Although%20we%20be

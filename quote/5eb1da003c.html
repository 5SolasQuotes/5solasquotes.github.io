<blockquote><p>III. …the church can be regarded either as to its external or its internal state. The external answers to the external call by the Word, upon which depends the external form of the church, placed in a profession of faith or an external and sensible communion of the same sacred things… The question [Turretin addresses] is not whether the reprobate belong to the external state (which we do not deny)…</p></blockquote>

<blockquote><p>XLII. As for the name ‘catholic,’ most of our [Reformed] theologians say that it is common to both the visible and invisible Church, but the invisible Church is absolutely and simply to be called catholic, that is, universal, because it encompasses all the elect from the beginning of the world. However, the visible Church is to be considered catholic in a certain respect, as it encompasses all those who together profess the true and saving religion on earth and includes all particular churches scattered in various parts of the world. In my opinion, the name Catholic is a title of that part of the Church which now militates on earth under Christ, and this name is given to it:

1. Because it is spread throughout the whole world, not restricted to one nation as the Jewish Church was in ancient times.

2. Because it embraces the entire doctrine of the apostles, not admitting part and rejecting part like heretical sects. Finally, because it has persevered the same in all times, namely, through succession and continuation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 430 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

<blockquote><p>XXI. Let us now lastly consider the threatenings, whether there be any such in this covenant. It cannot indeed be denied, but that, in the doctrine of Christ and the apostles, we frequently meet with very many comminations, which have their peculiar respect to the covenant of grace, and which could not have thus been set before us if there had been no such covenant. For instance,—whoever shall not believe in Christ—whoever shall despise the counsel of God against his own soul—whoever shall not obey the Gospel, shall be condemned. And these threatenings seem to be distinguished from those which are evidently legal; such as the following: “Cursed is he that continueth not in all things,” &amp;c. Yet, if we would weigh the matter narrowly, the covenant of grace has no threatenings so peculiar to itself, but what may well be referred to the law, from which every curse proceeds. XXII. Which I would explain thus: we no where hear of any threatenings which may and ought not to be deduced from that threatening, which doubtless is purely legal, “Cursed is every one that continueth not in all things,” &amp;c. In this most general threatening are included the other more particular ones. Moreover, when salvation by Christ alone is proposed, in the covenant of grace, as the principal truth, the law, which enjoins man to embrace with a firm faith every truth made known to him by God, obliges him to receive this truth in particular, and be delighted with the glory of God shining forth in it, and that his own salvation is connected with the glory of God. Should we deny that the law lays us under this obligation, we should then affirm that the law does not enjoin us to acknowledge God as true, and that there is a holy love of God and of ourselves which the law does not command; all which are most absurd. I go further: When man, as the law prescribes, receives the truth of the Gospel with a lively faith, then not the law, but the Gospel, promises salvation to him. For the law knows of no other promise, than what depends on the condition of perfect obedience. But should man slight and obstinately reject that truth proposed to him, he sins against the law, and so incurs its curse, according to the general rule so often inculcated. And since we have supposed the Gospel declaring that salvation flows from the faith of Christ alone, the law enjoins that all who desire salvation should seek it by the faith of Christ alone; and consequently it cannot but thunder the curse against those who, rejecting the Gospel, believe not on Christ. As, therefore, unbelief, or the rejecting the Gospel, is a sin against the law, which is the only perfect rule of all virtue (it can be called a sin against the Gospel, only objectively), so every threatening of the curse and of wrath against unbelievers and the despisers of the Gospel, must come from and be reduced to the law; but then it is to the law as now subservient to the covenant of grace. XXIII. In the discourses of the Prophets, Christ, and his apostles, there is a certain mixture of various doctrines, which, indeed, are closely connected, and mutually subservient; each of which ought to be reduced to their proper heads, so that the promises of grace be referred to the Gospel, all injunctions of duty and all threatenings against transgressors to the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, 2 vols. (London: Tegg &amp; Son, 1837), vol. 1, pp. 252–58; italics original. See also Herman Witsius, The Economy of the Covenants Between God &amp; Man, 2 vols. (1822; RHB, 2017), vol. 1, pp. 284–91</span></figcaption>

od+shining+forth+in+it%2C+and+that+his+own+salvation+is+connected+with+the+glory+of+God.+Should+we+deny+that+the+law+lays+us+under+this+obligation%2C+we+should+then+affirm+that+the+law+does+not+enjoin+us+to+acknowledge+God+as+true%2C+and+that+there+is+a+holy+love+of+God+and+of+ourselves+which+the+law+does+not+command%3B+all+which+are+most+absurd.+I+go+further%3A+When+man%2C+as+the+law+prescribes%2C+receives+the+truth+of+the+Gospel+with+a+lively+faith%2C+then+not+the+law%2C+but+the+Gospel%2C+promises+salvation+to+him.+For+the+law+knows+of+no+other+promise%2C+than+what+depends+on+the+condition+of+perfect+obedience.+But+should+man+slight+and+obstinately+reject+that+truth+proposed+to+him%2C+he+sins+against+the+law%2C+and+so+incurs+its+curse%2C+according+to+the+general+rule+so+often+inculcated.+And+since+we+have+supposed+the+Gospel+declaring+that+salvation+flows+from+the+faith+of+Christ+alone%2C+the+law+enjoins+that+all+who+desire+salvation+should+seek+it+by+the+faith+of+Christ+alone%3B+and+consequently+it+cannot+but+thunder+the+curse+against+those+who%2C+rejecting+the+Gospel%2C+believe+not+on+Christ.+As%2C+therefore%2C+unbelief%2C+or+the+rejecting+the+Gospel%2C+is+a+sin+against+the+law%2C+which+is+the+only+perfect+rule+of+all+virtue+%28it+can+be+called+a+sin+against+the+Gospel%2C+only+objectively%29%2C+so+every+threatening+of+the+curse+and+of+wrath+against+unbelievers+and+the+despisers+of+the+Gospel%2C+must+come+from+and+be+reduced+to+the+law%3B+but+then+it+is+to+the+law+as+now+subservient+to+the+covenant+of+grace.+XXIII.+In+the+discourses+of+the+Prophets%2C+Christ%2C+and+his+apostles%2C+there+is+a+certain+mixture+of+various+doctrines%2C+which%2C+indeed%2C+are+closely+connected%2C+and+mutually+subservient%3B+each+of+which+ought+to+be+reduced+to+their+proper+heads%2C+so+that+the+promises+of+grace+be+referred+to+the+Gospel%2C+all+injunctions+of+duty+and+all+threatenings+against+transgressors+to+the+law.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+%26+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+2+vols.+%28London%3A+Tegg+%26+Son%2C+1837%29%2C+vol.+1%2C+pp.+252%E2%80%9358%3B+italics+original.+See+also+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+%26+Man%2C+2+vols.+%281822%3B+RHB%2C+2017%29%2C+vol.+1%2C+pp.+284%E2%80%9391&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F589dc34cd3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/589dc34cd3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-covenant-of-grace-is-with-the-visible-church/#:~:text=XXI.%20Let%20us%20now%20lastly%20consider,threatenings%20against%20transgressors%20to%20the%20law&amp;text=XXI.%20Let%20us%20now%20lastly%20consider%20the%20threatenings&amp;text=and%20all%20threatenings%20against%20transgressors%20to%20the%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4th Conclusion: There be three sorts that have communion rightly with our Church:

1. Infants baptized, for baptism is a seal of their fellowship with Christ, and therefore of communion with the Church. Because Separatists will have none members of the Church while [except] they can give proofs thereof by signs of regeneration, infants must be without the Church, as infidels and Turks, for none are the Church to them but the royal generation, partakers of the holy faith, taught of God, called and separated from the world: the rest are without. Hence baptism shall either seal no entering of infants in the Church, contrary to God’s Word, or the baptizing of infants is not lawful, as Anabaptists teach.

2. The hearers of the Word have a communion with the Church, as is clear seeing these that eat of one bread are one body, these that profess in the hearing of the Word, that same faith, are also that same body in profession; yet excommunicated persons are admitted as hearers of the Word. Hence only the extreme and great excommunication, 1 Cor. 16:22, cuts off men from being simply no members of the Church, that excommunication that makes the party as a heathen and publican supposes him still to be a brother and hearer of the Word, 2 Thess. 3:14-15. And all these are members of the Church and yet not necessarily converted.

3. The regenerate and believers that communicate of one bread and one cup at the Lord’s Table, are most nearly and properly members of one visible body, and none of these are to separate from Christ’s body.</p></blockquote>

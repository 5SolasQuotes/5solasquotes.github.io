<main class="wrap"><figure class="quote" id="q-ce76bf1039" data-kw="">
<blockquote><p>First of all, the style of this epistle to the Galatians is excited and vibrant, which is what the state of the church, which at that time was bewitched by false apostles, demanded. But this epistle has always been a favourite of the great men of the church, and justifiably so.

Jerome was not slow to follow Origen, and after him came Augustine and a host of others. Luther wrote two commentaries on it … which he explained by saying that the greatest danger was that the devil would crush the pure doctrine of faith and bring back false teachings about the merits of works, which sound good and are satisfying to the flesh.

Even when the apostles were still living their churches were not free of such tares. It is impossible to overstate the degree to which human minds are subject to vanity and emptiness, how great is their desire for novelty and how easily people tire of the plain and simple doctrine of the truth. How great and unquenchable too is the hatred of the devil for the gospel and the doctrine of faith, by which he sees his kingdom being destroyed and the rule of Christ, who reigns in our hearts by faith, ushered in instead. …

The apostle himself shows us how necessary the article on true justification is, because if that is left out, Christ disappears, as does Christian freedom and all assurance in life and death, nor is it possible to receive the Holy Spirit of sanctification, who is the source of all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Opera Theologica II, quod Commentarios in Reliquos Divi Pauli Aliorumque Aposolorum Epistolas Continent</cite>, (Hanau, 1604). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 4-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fecb379f63" data-kw="">
<blockquote><p>For what is that saying: The merciful goodness of the Lord endureth from everlasting to everlasting upon them that fear Him (Ps. ciii. 17). From everlasting, because of predestination, to everlasting, because of glorification. The one process is without beginning, the other knows no ending. Indeed, those whom He predestines from everlasting, He glorifies to everlasting, with an interval, at least, in the case of adults, of calling and justification between. So at the rising of the Sun of Righteousness, the mystery, hidden from eternity, concerning souls that have been predestinated and are to be glorified, begins in some degree to emerge from the depths of eternity, as each soul, called by fear and justified by love, becomes assured that it, too, is of the number of the blessed, knowing well that whom He justified, them also He glorified (Rom. viii. 30).

What then? The soul hears that it is called when it is stricken with fear. It feels also that it is justified when it is surrounded with love. Can it do otherwise than be confident that it will be glorified? There is a beginning; there is continuation. Can it despair only of the consummation? Indeed, if the fear of the Lord, in which our calling is said to consist, is the beginning of wisdom, surely the love of God — that love, I mean, which springs from faith, and is the source of our justification — is progress in wisdom. And so what but the consummation of wisdom is that glorification which we hope for at the last from the vision of God that will make us like Him? And so one deep calleth another because of the noise of the water-pipes (Ps. xlii. 9), when, with terrible judgments, that unmeasured Eternity and Eternal Immensity, whose wisdom cannot be told, leads the corrupt and inscrutable heart of man by Its own power and goodness forth into Its own marvellous light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Thomas, Prior of Beverly in Some Letters of Saint Bernard Abbot of Clairvaux. From the Translation by the Late Dr. Eales Vicar of Stalefield, ed. Francis Aidan Gasquet (London: John Hodges, 1904), pp 152-53.</cite></span></figcaption>

</figure><figure class="quote" id="q-0d04a8f604" data-kw="">
<blockquote><p>My next work is to show you how it justifieth. There being mistakes in this matter, I shall endeavour to lay the truth before you.

1. Faith does not justify as a mutual cause together with works, as if they did cooperate together; but we must distinguish. There is a first and second justification, the one ascribed to faith, the other to works. This opinion maketh as if we were beholden to grace only for some courtesies, where we cannot engage God of ourselves. It is true James saith, ‘Not by faith, but by works;’ but that is only to justify faith. It is a false faith that doth not end in works; but works have nothing to do in justification. God abhorreth such a profane medley; he would have it wholly of grace. The papists exact an imaginary faith, and so are put upon a necessity of eking it out with works.

2. Not as an act and grace in us. Faith justifieth relativè, not effectivè et formaliter: not as if the act of believing were instead of perfect obedience to the law, and as if it were grace in us, and not an apprehending of Christ’s righteousness. But it is in reference to the object that it is said to justify, only because of its necessary concurrence as an instrument. Christ’s righteousness maketh us righteous, only because it cannot apprehend this righteousness but by faith, therefore it is said faith doth it. The hand may be said to feed and nourish the body, but the nutritive virtue is not in the hand, but the meat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 440.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-dc9dff461e" data-kw="">
<blockquote><p>The Discourse of Albertus Pighius… shall be once again repeated, both for its Worth and Truth…: ‘…God therefore does justify us by his free grace or goodness wherewith he embraces us in Christ Jesus, when he clothes us with his innocency and righteousness as we are ingrafted into Him; for as that alone is true and perfect which only can endure in the sight of God, so that alone ought to be presented and pleaded for us before the divine tribunal, as the advocate of, or plea in our cause; resting hereon, we here obtain the daily pardon of sin; with whose purity being covered, our filth and the uncleanness of our imperfections are not imputed unto us, but are covered as if they were buried, that they may not come into the Jugdment of God; until the old man being destroyed and slain in us, divine Goodness receives us into peace with the second Adam.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677)</span></figcaption>

<blockquote><p>Obedience to all God’s commandments is covenanted (Dt. 7:1• &amp; 10, 12; Jer. 7:23; Lev. 19:17-18; Lk. 10:27; Mk. 12:30), not as the cause of life, but as the qualification and effect of faith, and as the way to life. Faith that embraces life is obedient and fruitful in all good works; but in one sort faith is the cause of obedience and good works, and in another of justification and eternal life. These it seeks in the promises of the covenant; those it works and produces, as the cause does the effect. Faith was the efficient cause of that precious oblation in Abel (Heb. 11:4, 7, etc.), of reverence and preparing the ark in Noah, of obedience in Abraham; but it was the instrument only of their justification. For it does not justify as it produces good works, but as it receives Christ, though it cannot receive Christ unless it brings forth good works. A disposition to good works is necessary to justification, being the qualification of an active and lively faith. Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity; but they are not the cause of, but only a preceding qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the covenant of grace, by “condition” we understand whatsoever is required on our part, as precedent, concomitant, or subsequent to justification, repentance, faith, and obedience are all conditions; but if by “condition” we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition. Faith and works are opposed in the matter of justification and salvation in the covenant, not that they cannot stand together in the same subject—for they are inseparably united—but because they cannot concur or meet together in one and the same court to the justification or absolution of man. For in the court of justice, according to the first covenant, either being just he is acquitted, or unjust he is condemned; but in the court of mercy, if you receive the promise of pardon, which is done by a lively faith, you are acquitted and set free, and accepted as just and righteous; but if you do not believe, you are sent over to the court of justice. Obedience is twofold: [1] Perfect in measure and degree—this is so far required that, if it be not performed, we must acknowledge our sin in coming short. And this God is pleased to exact at our hands, that we might walk in humility before him, strive after perfection, and freely acknowledge his rich grace and mercy in accepting and rewarding the best service we can render to his Highness, when in the court of justice it deserves to be rejected. [2] Sincere, uniform, and constant, though imperfect in measure and degree; and this is so necessary that without it there is no salvation to be expected. The covenant of grace calls for perfection, yet accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection were rigidly exacted, no flesh could be saved; if it were not at all commanded, imperfection would not be sin, nor would perfection be something to be labored after. The faith that is lively to embrace mercy is ever joined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, ever attends that faith by which we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life than it does virtually or actually lead us forward in the way to heaven. For if we say we have fellowship with God and walk in darkness, we lie and do not the truth; but if we walk in the light, as he is in the light, we have fellowship one with another (1 John 1:6–7). This walking in the light, as He is in the light, is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins or actual approbation with God. The truth of this doctrine St. John likewise ratifies in terms equivalent in the words immediately following: “And the blood of Christ cleanses us (walking in the light as God is in the light) from all sin.” (1 Jn. 1:7) But of these things more fully in their several degrees, as this covenant has been revealed. In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience. In contracts among men, one may ask more and another bid less, and yet they may come to agreement; but it is altogether fruitless for men to think of entering into covenant with God if they are not resolved to obey in all things. The practice of all God’s people who have ever made covenant with Him expressly declares as much when they solemnly entered into or renewed their covenant. For thus they promise: “Whatever the Lord says, that we will do” (Exod. 24:3, 7). The people said to Joshua, “The Lord our God we will serve, and his voice we will obey” (Josh. 24:23). And they entered into a covenant to seek the Lord God of their fathers with all their heart and with all their soul, so that whoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman (2 Chron. 15:12–13). And the king stood by the pillar and made a covenant before the Lord to walk after the Lord, and to keep his commandments, his testimonies, and his statutes with all his heart and all his soul, to perform the words of this covenant that were written in this book; and all the people stood to the covenant (2 Chron. 34:31; 2 Kings 23:3). They entered into a curse and into an oath to walk in God’s law, which was given by Moses the servant of God, and to observe and do all the commandments of the Lord our God, and his judgments and his statutes (Neh. 10:29). And thus runs the exhortation of Joshua to the two tribes and a half when he sent them home: “Take diligent heed to do the commandments of the law, which Moses the servant of the Lord charged you, to love the Lord your God, and to walk in all his ways, and to keep his commandments, and to cleave to him, and to serve him with all your heart and with all your soul” (Josh. 22:5). This must not be understood as if one who, through frailty and infirmity, offends in any one jot or tittle should be counted a covenant-breaker; for then no man would be innocent. Rather, the promise must be interpreted according to the rule of obedience given, which calls for perfection but accepts sincerity. In the covenant of mercy we bind ourselves to believe and rest upon God with the whole heart, so that doubting or distrust arising from weakness and infirmity must indeed be acknowledged as sin, yet every such frailty does not prove the person to be a transgressor of the covenant. The same holds true of obedience. But of this more fully when treating the particular manner in which God has been pleased to administer this covenant.</p></blockquote>

only+condition.+Faith+and+works+are+opposed+in+the+matter+of+justification+and+salvation+in+the+covenant%2C+not+that+they+cannot+stand+together+in+the+same+subject%E2%80%94for+they+are+inseparably+united%E2%80%94but+because+they+cannot+concur+or+meet+together+in+one+and+the+same+court+to+the+justification+or+absolution+of+man.+For+in+the+court+of+justice%2C+according+to+the+first+covenant%2C+either+being+just+he+is+acquitted%2C+or+unjust+he+is+condemned%3B+but+in+the+court+of+mercy%2C+if+you+receive+the+promise+of+pardon%2C+which+is+done+by+a+lively+faith%2C+you+are+acquitted+and+set+free%2C+and+accepted+as+just+and+righteous%3B+but+if+you+do+not+believe%2C+you+are+sent+over+to+the+court+of+justice.+Obedience+is+twofold%3A+%5B1%5D+Perfect+in+measure+and+degree%E2%80%94this+is+so+far+required+that%2C+if+it+be+not+performed%2C+we+must+acknowledge+our+sin+in+coming+short.+And+this+God+is+pleased+to+exact+at+our+hands%2C+that+we+might+walk+in+humility+before+him%2C+strive+after+perfection%2C+and+freely+acknowledge+his+rich+grace+and+mercy+in+accepting+and+rewarding+the+best+service+we+can+render+to+his+Highness%2C+when+in+the+court+of+justice+it+deserves+to+be+rejected.+%5B2%5D+Sincere%2C+uniform%2C+and+constant%2C+though+imperfect+in+measure+and+degree%3B+and+this+is+so+necessary+that+without+it+there+is+no+salvation+to+be+expected.+The+covenant+of+grace+calls+for+perfection%2C+yet+accepts+sincerity%2C+God+in+mercy+pardoning+the+imperfections+of+our+best+performances.+If+perfection+were+rigidly+exacted%2C+no+flesh+could+be+saved%3B+if+it+were+not+at+all+commanded%2C+imperfection+would+not+be+sin%2C+nor+would+perfection+be+something+to+be+labored+after.+The+faith+that+is+lively+to+embrace+mercy+is+ever+joined+with+an+unfeigned+purpose+to+walk+in+all+well-pleasing%2C+and+the+sincere+performance+of+all+holy+obedience%2C+as+opportunity+is+offered%2C+ever+attends+that+faith+by+which+we+continually+lay+hold+upon+the+promises+once+embraced.+Actual+good+works+of+all+sorts+%28t ord+God+of+their+fathers+with+all+their+heart+and+with+all+their+soul%2C+so+that+whoever+would+not+seek+the+Lord+God+of+Israel+should+be+put+to+death%2C+whether+small+or+great%2C+whether+man+or+woman+%282+Chron.+15%3A12%E2%80%9313%29.+And+the+king+stood+by+the+pillar+and+made+a+covenant+before+the+Lord+to+walk+after+the+Lord%2C+and+to+keep+his+commandments%2C+his+testimonies%2C+and+his+statutes+with+all+his+heart+and+all+his+soul%2C+to+perform+the+words+of+this+covenant+that+were+written+in+this+book%3B+and+all+the+people+stood+to+the+covenant+%282+Chron.+34%3A31%3B+2+Kings+23%3A3%29.+They+entered+into+a+curse+and+into+an+oath+to+walk+in+God%E2%80%99s+law%2C+which+was+given+by+Moses+the+servant+of+God%2C+and+to+observe+and+do+all+the+commandments+of+the+Lord+our+God%2C+and+his+judgments+and+his+statutes+%28Neh.+10%3A29%29.+And+thus+runs+the+exhortation+of+Joshua+to+the+two+tribes+and+a+half+when+he+sent+them+home%3A+%E2%80%9CTake+diligent+heed+to+do+the+commandments+of+the+law%2C+which+Moses+the+servant+of+the+Lord+charged+you%2C+to+love+the+Lord+your+God%2C+and+to+walk+in+all+his+ways%2C+and+to+keep+his+commandments%2C+and+to+cleave+to+him%2C+and+to+serve+him+with+all+your+heart+and+with+all+your+soul%E2%80%9D+%28Josh.+22%3A5%29.+This+must+not+be+understood+as+if+one+who%2C+through+frailty+and+infirmity%2C+offends+in+any+one+jot+or+tittle+should+be+counted+a+covenant-breaker%3B+for+then+no+man+would+be+innocent.+Rather%2C+the+promise+must+be+interpreted+according+to+the+rule+of+obedience+given%2C+which+calls+for+perfection+but+accepts+sincerity.+In+the+covenant+of+mercy+we+bind+ourselves+to+believe+and+rest+upon+God+with+the+whole+heart%2C+so+that+doubting+or+distrust+arising+from+weakness+and+infirmity+must+indeed+be+acknowledged+as+sin%2C+yet+every+such+frailty+does+not+prove+the+person+to+be+a+transgressor+of+the+covenant.+The+same+holds+true+of+obedience.+But+of+this+more+fully+when+treating+the+particular+manner+in+which+God+has+been+pleased+to+administer+this+covenant.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%2C+%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+19-&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf7229c6c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af7229c6c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=Obedience%20to%20all%20God%E2%80%99s%20commandments%20is,been%20pleased%20to%20administer%20this%20covenant&amp;text=Obedience%20to%20all%20God%E2%80%99s%20commandments%20is%20covenanted%20%28Dt&amp;text=God%20has%20been%20pleased%20to%20administer%20this%20covenant" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

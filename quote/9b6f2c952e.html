<main class="wrap"><figure class="quote" id="q-9b6f2c952e" data-kw="">
<blockquote><p>With respect to the particular laws by which the Jews were governed, the common sentiment of sound divines, and the best writers on the laws of nations, is, that although the judicial law is not binding as such upon Christian nations, so that they should be bound to regulate all their laws according unto it, yet it demands distinguished attention, and is to be regarded, as a pattern, in those laws which proceeded upon moral grounds. In it there was nothing inconsistent with the principles of equity and religion. God give unto Israel ‘right judgments and true laws, good statutes and commandments.’ All just laws among men are deductions from the moral law, applied to human affairs. But in the judicial law, the conclusions were deduced and applied, not by the fallible and corrupt reason of man (as in ordinary laws) but by unerring wisdom. These respected either the first or second table of the moral law, duties which immediately related to God or man. It is a radical mistake, on this subject, to suppose that the peculiarity of the judicial law did lie solely and properly in its reference to matters of religion, or the first table. It is to be observed also in those laws which related to things civil, or the duties of the second table. There is no more propriety in representing all the judicial laws respecting the first table as peculiar, than there is in representing all those which related to the second table as peculiar. Peculiarities there were in both; but after allowances are made for these, there remain moral grounds for both; and whatever proceeded upon moral grounds in the judicial law, whether it respected things immediately connected with religion, or with justice and civil order, is exemplary, and must be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Difference</cite>, (Edinburgh: George Caw, 1807), pp. 125-26</span></figcaption>

<blockquote><p>Answer:

1. Show a law of nature that the father might enslave his children; by a divine positive law, presupposing sin, the father might do that; and yet I think that may be questioned, whether it was not a permission rather than a law, as was the bill of divorce; but a law of nature it was not;

2. The Popish Prelate [John Maxwell] can see no law but the law of nature here; but it is because he is blind or will not see. His reason is, It was not by mutual and voluntary contract of children and fathers, therefore it was by the law of nature; so he that cursed his father was to die by God’s law. This law was not made by mutual consent betwixt the father and the son, therefore it was a law of nature: the Prelate will see no better. Nature will teach a man to enslave himself to redeem himself from death, but that it is a dictate of nature that a man should enslave his son, I conceive not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-eded29dfcb" data-kw="">
<blockquote><p>The Judicial Law is entirely abrogated so far as it concerns the distinction of Jews from the Gentiles (Eph. 2:14-15) and the typical signification of the kingdom of Christ (Col. 2:17; Heb. 10:1). However, as far as it concerns a form of civil government, it is abrogated in some particular aspects. For whatever was a particular proper right, such as peculiarly concerned the Jews, of which sort was the law concerning the office of the Levites, as another concerning inheritances not being transferred from one tribe to another, all of this kind have ceased. But insofar as it concerned common right, enacted according to the law of nature for all men together, of which sort are the laws concerning the punishments of crimes, these same all remain. The reason is that it enters into the order of the Moral Law and is thus perpetual. It was prescribed to the Jews, not as Jews, as a peculiar people admitted into Covenant, but as men, by the Law of Nature, subject with the other nations. If the same conclusion is recognized by the rule of common law from other [countries’] legislators, or it is discovered to be framed in view of the precepts of the Decalogue: it is sanctioned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘7th Place: of the Law of God’ in Common Places in The Scriptural Theology of Heidelberg</cite>, vol. 1, p. 112, trans. Adam Brink &amp; Travis Fentiman</span></figcaption>

<blockquote><p>The binder of conscience is either proper or improper. Proper is that thing which has absolute and sovereign power in itself to bind the conscience. And that is the Word of God written in the books of the Old and New Testament. Reason 1. He which is the Lord of [???] by his Word and laws binds conscience: but God is the only Lord of conscience, because He once created it, and He alone governs none but He knows it. Therefore his Word and laws only bind conscience properly.</p></blockquote>

</figure><figure class="quote" id="q-74b996f70a" data-kw="">
<blockquote><p>Since we have need of civil laws and the power of punishing, it will be wisest not to contemn those given by Moses; but seriously rather to consider what the meaning of God was in them, what he chiefly required, and how much it might be to the good of every nation, if they would borrow thence their manner of governing the commonwealth; yet freely all things and with the Spirit of Christ. For what Solon or Plato, or Aristotle, what lawyers or Caesars could make better laws than God? And it is no light argument, that many magistrates at this day do not enough acknowledge the Kingdom of Christ, though they would seem most Christian, in that they govern their States by laws so diverse from those of Moses.</p></blockquote>

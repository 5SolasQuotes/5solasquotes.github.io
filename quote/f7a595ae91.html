<main class="wrap"><figure class="quote" id="q-f7a595ae91" data-kw="">
<blockquote><p>(2) To begin with the first work, we can consider the work of creation (a) either as it has become known to us from revelation that occurred by the Word of God, or (b) as it could become known from right reason’s use, if one has brought himself well and fittingly to contemplate this subject absent any help from revelation. If we consider the work of creation in the first way, we can easily discern the following.

First, the world was created by the Father, seeing that he, having been stirred forth out of his good will, undertook to donate existence to the world, existence it didn’t have before. Second, we note the world was framed by the Son, inasmuch as he’s the Father’s eternal Wisdom, whose council—like in leadership and administration—on the world to be framed was both wisely taken and fittingly ordered for execution. Finally, we discern the Holy Spirit was so skilled in his creation that the Spirit’s infinite force and power actually brought into effect the counsel arranged and administrated by Wisdom.

The Father’s work in that admirable, incomprehensible dispensation was such that it’s fitting we consider him as principium and first cause, the origin these things flow forth from. Solomon witnesses the Son’s work was what it was, when he called him “Wisdom” (Proverbs 8)—as it were, he who presided over the framing of all things. The apostle John witnessed likewise; obviously considering the beginning of Genesis so frequently reminds us God spoke so that this or that came to be, John termed the Son the λόγος, without whom absolutely nothing was made that’s said to be made.

Finally, it’s plainly the case the Holy Spirit’s work in creation was such because (a) he’s said to move about over the waters like birds who nest their eggs usually do and because (b) all the extraordinary, miraculous works and those in which some unusual, infinite power bares itself—all these the Scripture throughout attributes to the Spirit of God as their cause, by whose assistance God works all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mo-se-amyraut.html">Moїse Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation on the Economy of the Three Person in the Divine Works , trans. Ryan M. Hurd in Ad Fontes: A Journal of Protestant Resourcement</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c5edb9e5b" data-kw="">
<blockquote><p>Thesis XIV… For because divine essence is infinite, most simple, and eternal, therefore the three hypostases subsisting in it—although they are truly three in number—because these individual hypostases are distinguished by their own incommunicable properties, they are nevertheless not three gods nor are they said to be three gods in the same way that there are three men… But instead, in the divine this happens by an indescribable communication of the whole essence from eternity, in which no point of beginning, middle, or end can be stated.† † dari, i.e., cannot be stated or supplied because it does not exist.</p></blockquote>

</figure><figure class="quote" id="q-7b33af83f5" data-kw="Spirit deity Ananias">
<blockquote><p>The title of God and the attribute of eternal Spirit, given in sacred Scripture, prove that the Spirit in whose name we are baptized is not a quality, grace, or effect. When Peter reproached Ananias for lying to the Holy Spirit, he said that Ananias had lied not to men but to God (Acts 5:4). Paul infers that we are the temple of God because the Spirit dwells in us (1 Cor. 3:16 and 6:19). As Augustine eloquently teaches in Epistle 66, if we were commanded to build a temple for God out of wood and stone, because such worship is due to Him alone, it would clearly argue His divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXV</span></figcaption>

</figure><figure class="quote" id="q-3d64d40d2a" data-kw="">
<blockquote><p>As the Head of his Church, Christ is its source of spiritual influence. In him, for the use of his Church, the Spirit dwells in immeasurable degree. For the “Father giveth not the Spirit by measure unto his Son.” It has thus pleased the Father, that in him all fulness should dwell; and the conclusion is clear — Out of his fulness may we all receive, even grace upon grace. Oh, it was no scanty supply of the Spirit Christ ensured for his Church. There is no risk of soon draining this fountain dry. Believe it, it is inexhaustible. Hither may you repair, and drink of the water of life as largely as your finite capacities will admit of, and yet leave it undiminished.

Mark well, for it is important, the encouragement afforded us by the death of Christ to expect free and full communications of the Holy Spirit. Had Christ not died, the Spirit could in no degree — not even in the smallest —have been sent forth to enlighten, and sanctify, and save; for the justice of God, unpropitiated and unappeased, would have stood immoveably in the way of this. But now Christ having died, and justice being satisfied, and every obstacle on God’s part removed, what hinders that the Spirit be now shed forth through Christ, and that not grudgingly and sparingly, but cheerfully and abundantly?

It is now not merely consistent with the Divine character that the Spirit may be obtained. The glory of the Divine character requires that what Christ died for be accomplished — that what he purchased be bestowed. To imagine that Christ has obtained by his death only a small measure of spiritual influence for the Church, is virtually to detract from the merit and efficacy of his death. To go to God with doubting, confused, straitened desires for the Spirit, is virtually to deny that the Spirit is the purchase of Christ for his Church, and to insinuate that something yet remains to be done to entitle us to receive him, at least so fully as we need.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-l-r-foote.html">Alexander L. R. Foote</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of the Lord not Straitened in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-9b3732fb85" data-kw="">
<blockquote><p>Therefore the Scripture calleth him the only begotten son of God, that he may put a necessary difference between Christ and all the faithful. For Christ is called, and indeed is the only everlasting son of the everlasting father, begotten of the substance of the father before all world’s: and therefore is every God in who[m] we ought to believe. Pro. 8. Joh. 1.

Now we are called and are the sons of God, not by nature, but by adoption and grace, through which, God hath vouchsafed to adopt us to be his children, whilst he hath made us through faith engrafted into his son, his true and lively members, who otherwise were the members of Satan, and by nature the sons of wrath. Joh. 8. Ephes. 2. But in the mean time, that same adoption, and name of the sons of God, is not only an empty title; but when we are in truth members of the son of God, we have by his grace a true communion and fellowship with him, in respect of which he is called the first begotten amongst many brethren. Rom. 8.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Therefore the Scripture calleth him the only begotten son of God, that he may put a necessary difference between Christ and all the faithful. For Christ is called, and indeed is the only everlasting son of the everlasting father, begotten of the substance of the father before all world’s: and therefore is every God in who[m] we ought to believe. Pro. 8. Joh. 1.

Now we are called and are the sons of God, not by nature, but by adoption and grace, through which, God hath vouchsafed to adopt us to be his children, whilst he hath made us through faith engrafted into his son, his true and lively members, who otherwise were the members of Satan, and by nature the sons of wrath. Joh. 8. Ephes. 2. But in the mean time, that same adoption, and name of the sons of God, is not only an empty title; but when we are in truth members of the son of God, we have by his grace a true communion and fellowship with him, in respect of which he is called the first begotten amongst many brethren. Rom. 8.”

— Caspar Olevianus, An Exposition of the Symbol of the Apostles, trans. John Field (London: Thomas Man, 1581), pp 129-30.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore+the+Scripture+calleth+him+the+only+begotten+son+of+God%2C+that+he+may+put+a+necessary+difference+between+Christ+and+all+the+faithful.+For+Christ+is+called%2C+and+indeed+is+the+only+everlasting+son+of+the+everlasting+father%2C+begotten+of+the+substance+of+the+father+before+all+world%E2%80%99s%3A+and+therefore+is+every+God+in+who%5Bm%5D+we+ought+to+believe.+Pro.+8.+Joh.+1.%0A%0ANow+we+are+called+and+are+the+sons+of+God%2C+not+by+nature%2C+but+by+adoption+and+grace%2C+through+which%2C+God+hath+vouchsafed+to+adopt+us+to+be+his+children%2C+whilst+he+hath+made+us+through+faith+engrafted+into+his+son%2C+his+true+and+lively+members%2C+who+otherwise+were+the+members+of+Satan%2C+and+by+nature+the+sons+of+wrath.+Joh.+8.+Ephes.+2.+But+in+the+mean+time%2C+that+same+adoption%2C+and+name+of+the+sons+of+God%2C+is+not+only+an+empty+title%3B+but+when+we+are+in+truth+members+of+the+son+of+God%2C+we+have+by+his+grace+a+true+communion+and+fellowship+with+him%2C+in+respect+of+which+he+is+called+the+first+begotten+amongst+many+brethren.+Rom.+8.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+An+Exposition+of+the+Symbol+of+the+Apostles%2C+trans.+John+Field+%28London%3A+Thomas+Man%2C+1581%29%2C+pp+129-30.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b3732fb85.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9b3732fb85.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/11/27/casper-olevianus-on-the-son-of-god-and-the-sons-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

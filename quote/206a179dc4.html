<main class="wrap"><figure class="quote" id="q-206a179dc4" data-kw="">
<blockquote><p>The beauty and excellency of this world consists, not only in the perfection and comeliness of each part in it, but especially in the wise and wonderful proportion and union of these so several parts. It is not the lineaments and colours that make the image, or complete the beauty; but the proportion and harmony of these, though different severally. And truly, that is the wonder, that such repugnant natures, such different parts, and dissentient qualities, do conspire together in such an exact perfect unity and agreement; in which the wisdom of God doth most appear, by making all things in number, weight, and measure.

His power appears in the making of all the materials of nothing; but his wisdom is manifested in the ordering and disposing so dissonant natures into one well agreeing and comely frame: so that, this orderly disposition of all things into one fabric, is that harmonious melody of the creation, made up, as it were, of dissonant sounds; and that comely beauty of the world, resulting from such a proportion and wise combination of divers lines and colours. To go no farther than the body of a man, — how, what various elements are combined into a well-ordered being, so as they may join in friendship and society, and make up one sweet temperament?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Christian Love</cite>, (1743) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 3: 407.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

dcovenanter.wordpress.com/2020/10/29/hugh-binning-on-the-argument-from-design/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Even in Evangelical Churches at this moment men professing subjection to Christ are madly thrusting aside His authority, and subjecting the Church to human caprice. Doctrines and rites and practices for which no Divine warrant can be pleaded are multiplying in the Visible Church. Some so-called Protestant Churches are almost as Ritualistic and idolatrous and disobedient to Christ as Rome itself. And other Protestant Churches are following. There is a kind of procession – Rome leading the way, then Prelatic ritualism close behind, but rapidly shortening their distance, and then other Presbyterian Churches being drawn in because they admire the glitter and pomp of the precession without waiting to consider what is the beginning of it all and what is the end of it all. And while all this is going on Christ is standing by and saying, “Who hath believed our report? And to whom is the arm of the Lord revealed?” “All day long I stretched forth My hands unto a disobedient and gainsaying people.</p></blockquote>

</figure><figure class="quote" id="q-af0f8b82cb" data-kw="">
<blockquote><p>The Spouse of Christ Jesus, when she shines in Love, she is amiable in Beauty; precious in the eye of her Husband, powerful with God her Father, prosperous in her own spiritual health and vigour, and prepared for her consummate marriage in celestial glory. Her husband is God, and God is love, and God cannot but love that love which is like himself. And that they may love his Spouse for her love, when she becomes one Spirit with him, by this unity of Spirit he gives her an uniformity of love; the ointment of Christ Jesus, the Head, floweth down into all his members, and breatheth love into them; and as far as his life goes, so far goeth his love: therefore no love, no life in Christ Jesus. Agreeably, the beloved Disciple, and an especial Teacher of love, having shewed that the New-birth brings love with life, he fitly addeth, He that loveth not, abideth in death. No wonder then, if the great Master and lover of this Disciple, make love the mark of his true Disciples, seeing those are only Christ’s true Disciples, which so learn Christ, as they draw that spirit from him, which teacheth them love, and breatheth it into them.</p></blockquote>

<blockquote><p>1. The question concerning the parts of the church. Do reprobates also belong to it? II. First it is inquired whether besides those called elect, reprobates and infidels also (whether secret or open) are to be considered as true members of the church. Bellarmine with others pretends this is so (“De Ecclesia Militante,” 3.2, 7, 9 Opera [1857], 2:74–75, 81–83, 85–89 and the following) when he teaches that in the definition of the church, pagans, heretics, the excommunicated and schismatics are excepted: “All others are included, even if they are reprobates, wicked and impious” because, as he immediately adds, “that a person may be said to be absolutely a part of the true church, of which the Scriptures speak, we do not think there is required any internal virtue, but only an external, especially a communion of faith and of the sacraments, which is perceived by the sense itself.” The design is that no other church may be acknowledged except that of which the Roman bishop is head. And because they clearly saw (if they restrict it to the elect and believers) the pope might possibly not belong to it, therefore they wished to extend it even to the reprobate, provided they were embraced under the one visible head. Hence in the Council of Constance, this proposition of John Hus was condemned as heretical: “The holy universal church is the universality of the predestinated” (Mansi 27:754). The importance of the controversy is such that on its decision depend all the others which are agitated concerning the church between us and the Romanists. Hence we must treat it the more accurately.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 18.3.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. The question concerning the parts of the church. Do reprobates also belong to it? II. First it is inquired whether besides those called elect, reprobates and infidels also (whether secret or open) are to be considered as true members of the church. Bellarmine with others pretends this is so (“De Ecclesia Militante,” 3.2, 7, 9 Opera [1857], 2:74–75, 81–83, 85–89 and the following) when he teaches that in the definition of the church, pagans, heretics, the excommunicated and schismatics are excepted: “All others are included, even if they are reprobates, wicked and impious” because, as he immediately adds, “that a person may be said to be absolutely a part of the true church, of which the Scriptures speak, we do not think there is required any internal virtue, but only an external, especially a communion of faith and of the sacraments, which is perceived by the sense itself.” The design is that no other church may be acknowledged except that of which the Roman bishop is head. And because they clearly saw (if they restrict it to the elect and believers) the pope might possibly not belong to it, therefore they wished to extend it even to the reprobate, provided they were embraced under the one visible head. Hence in the Council of Constance, this proposition of John Hus was condemned as heretical: “The holy universal church is the universality of the predestinated” (Mansi 27:754). The importance of the controversy is such that on its decision depend all the others which are agitated concerning the church between us and the Romanists. Hence we must treat it the more accurately.”

+more+accurately.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+3+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%931997%29%2C+18.3.2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa18a02d690.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a18a02d690.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/turretin-hypocrites-and-reprobates-belong-to-the-church-only-outwardly/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

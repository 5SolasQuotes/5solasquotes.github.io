</figure><figure class="quote" id="q-ea82d63427" data-kw="">
<blockquote><p>You will say, ‘Yet it seems more happy to depart sooner out of this wretched life unto the heavenly rest than by long living to abide continual trouble and to lack that wished quiet the longer.’ I answer, If life of itself is the gift of God, then it is certainly good. If it be good, surely it is good of itself to enjoy it long. And for that, that sometimes in this life chances to come afflictions and many troubles, it is to be referred unto the accidents, and not to the substance itself of this goodness. Neither is the gift of God to be wished away, wherein He grants us to live and to tarry long in this life: and I speak not of the rest of the benefits wherewith God does both spiritually and corporally augment and garnish this our present life with all. Neither it follows that it is therefore evil to live because it is better to live in heaven than in earth. This present state, and the state of our life to come be not contraries, but of subordinate things one to another, as earth is also and heaven. The earth is good; heaven is better. It is in a sort good of itself to live; it is better if a man live honestly and uprightly; it is best of all, if it be given us to live in best sort and most happily, as we shall live in the country of Heaven. It takes not away that which is chiefly good, but does accomplish the goodness of those things which be of an inferior order [are] and conveniently set in order by God’s ordinance. The condition and nature of our soul is more noble than that of our body. And yet he must be worthy to have not body, nor soul whosoever will say the body is evil because the soul is better. Gold passes silver, yet silver is good, though gold be better. He is not worthy to have silver that in respect of gold sets nothing by silver. So likewise we must judge of our life. Let us acknowledge the gift of God, not only in the life to come, but also in this present life and in the long continuance thereof, if it come by the benefit of God. Let us not be wayward in God’s gifts, but kind. It is the part of a grateful mind so to commend the chief and best benefits, that withal he despise not the meaner and inferior. It is the voice of holy, not of carnal men that says, We have life, bless the Lord. And the Scripture rehearses among the benefits of God bestowed upon Abraham the father of the believers that he died in a good age, old and full of days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion</cite>, (1560; London, 1563) | 5th Commandment, fol. 75.a-b</span></figcaption>

</figure><figure class="quote" id="q-733d9c2930" data-kw="">

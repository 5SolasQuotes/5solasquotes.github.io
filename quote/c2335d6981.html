<blockquote><p>Jer. chap. 31:31 Behold, the days come, says the Lord, that I will make a new covenant with the house of Israel, with the house of Judah, 32 Not according to the covenant that I made with their fathers, when I took them by the hand to bring them out of the land of Egypt, the which my covenant they broke, although I was a husband unto them, says the Lord. 33 But this shall be the covenant that I will make with the house of Israel, After those days, says the Lord, I will put my Law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people. 34 And they shall teach no more every man his neighbor, and every man his brother, saying, ‘Know the Lord:’ for they shall all know me from the least of them to the greatest of them, says the Lord: for I will forgive their iniquity, and will remember their sins no more. What follows to be spoken of? The covenant of grace. Seeing by the covenant of works life everlasting is propounded, what need is there that the covenant of grace should be set before us? Because, as has been said, the covenant of works cannot through the infirmity of our flesh give life to any: And therefore if God should justify any by it, he should be unjust, as one that should give the kingdom of heaven to wicked men. Seeing the nature of a covenant is to reconcile and join those together which are at variance; as we see in the example of Abraham, and Abimelech, Laban and Jacob: why is this called the covenant that can make no reconciliation between God and us? Although it be not able to reconcile us, yet it does make way to reconciliation by another covenant: neither is it meet strictly to bind God’s covenant with men, to the laws or covenants of one man with another; for among men the weaker seeks reconciliation at the hand of the mightier: but God neither able to be hurt or benefited by us, seeks unto us for peace. What is the covenant of grace? That God will give us life everlasting through Christ, if we believe in him. How are they convinced by the giving of this covenant, which seek righteousness in the law or old covenant? Because thereby they make God unwise, that would enter into a new and second covenant, if the former had been sufficient. Of how many sorts is this? It is either the old or new Testament. What is the old Testament? It is the covenant of God, under shadows to give life everlasting by faith in Christ that was to come. What is the new Testament? It is the covenant of God, without shadows to give life everlasting by faith in Christ that is come. Are these Testaments divers? They be in substance the same, but in manner they differ. What are the parts of this covenant of God? Two: the one is the covenant that God makes with us; the other is the covenant that we make with God. What is the sum of that covenant God makes with us.? That he will be our God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Christian Religion</cite>, (London, 1611), 123–27 [Spelling and punctuation modernized].</span></figcaption>

<blockquote><p>OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7–9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that doeth” these things “shall live in them.” (Gal. 3:12.) So likewise to the Romans: “Moses describeth the righteousness which is of the law, That the man who doeth those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cooper.html">William Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon VI: The Covenant of Works” in James Nichols</cite>, ed. Puritan Sermons (Wheaton, IL: Richard Owen Roberts, Publishers, 1981), 5.97.</span></figcaption>

<blockquote><p>Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments:

1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21).

2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life.

3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare).

4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), Ch. 9, ‘The Law, the Fall &amp; Sin’, pp. 82-99</span></figcaption>

<blockquote><p>But, whether that covenant [of works] was also entered into with the second Adam is more difficult to determine. Certainly from one perspective, as a creature and as man, it seems that He cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs). Thus that this moral government was brought upon Him just as upon the rest of Adam’s posterity, according to the intention of God, we do not believe, because: (1) He had been designated by the eternal decree to be the second Adam (1 Peter 1:20; Rom. 5:12ff.), and it is unfitting that the second Adam should have been included with the first Adam in the same covenant, indeed included in him. I need not add that: (2) none were included except those that were to exist from the order of second causes; but the Savior, before sin, was not to exist from the order of second causes. Nor also: (3) can one for whom it is absolutely repugnant to sin be considered to have sinned in another, since it is entirely impossible for the God-man to become a sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But, whether that covenant [of works] was also entered into with the second Adam is more difficult to determine. Certainly from one perspective, as a creature and as man, it seems that He cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs). Thus that this moral government was brought upon Him just as upon the rest of Adam’s posterity, according to the intention of God, we do not believe, because: (1) He had been designated by the eternal decree to be the second Adam (1 Peter 1:20; Rom. 5:12ff.), and it is unfitting that the second Adam should have been included with the first Adam in the same covenant, indeed included in him. I need not add that: (2) none were included except those that were to exist from the order of second causes; but the Savior, before sin, was not to exist from the order of second causes. Nor also: (3) can one for whom it is absolutely repugnant to sin be considered to have sinned in another, since it is entirely impossible for the God-man to become a sinner.”

— Petrus van Mastricht, Theoretical Practical Theology (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%2C+whether+that+covenant+%5Bof+works%5D+was+also+entered+into+with+the+second+Adam+is+more+difficult+to+determine.+Certainly+from+one+perspective%2C+as+a+creature+and+as+man%2C+it+seems+that+He+cannot+be+exempted+from+the+moral+government+of+God%2C+nor+otherwise+could+He+as+a+man+have+merited+anything+for+Himself.+From+another+perspective%2C+if+He+were+in+Adam+under+the+covenant+of+nature%2C+then+it+would+seem+that+in+and+with+Adam+who+sinned%2C+He+violated+that+same+covenant%2C+which+is+beyond+absurd.+Therefore+it+seems+most+safe+to+state%3A+although+as+a+rational+creature+He+cannot+be+exempted+from+moral+government+with+respect+to+his+natural+duties%2C+yet+He+could+have+been+withdrawn+by+God+from+the+same+moral+governance+in+the+positive+duties%2C+such+as+the+commandment+not+to+eat+of+the+forbidden+fruit+%28upon+the+transgression+of+which+the+sin+of+the+human+race+hangs%29.+Thus+that+this+moral+government+was+brought+upon+Him+just+as+upon+the+rest+of+Adam%E2%80%99s+posterity%2C+according+to+the+intention+of+God%2C+we+do+not+believe%2C+because%3A+%281%29+He+had+been+designated+by+the+eternal+decree+to+be+the+second+Adam+%281+Peter+1%3A20%3B+Rom.+5%3A12ff.%29%2C+and+it+is+unfitting+that+the+second+Adam+should+have+been+included+with+the+first+Adam+in+the+same+covenant%2C+indeed+included+in+him.+I+need+not+add+that%3A+%282%29+none+were+included+except+those+that+were+to+exist+from+the+order+of+second+causes%3B+but+the+Savior%2C+before+sin%2C+was+not+to+exist+from+the+order+of+second+causes.+Nor+also%3A+%283%29+can+one+for+whom+it+is+absolutely+repugnant+to+sin+be+considered+to+have+sinned+in+another%2C+since+it+is+entirely+impossible+for+the+God-man+to+become+a+sinner.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%28RHB%29%2C+vol.+3%2C+bk.+3%2C+ch.+12%2C+section+9%2C+%E2%80%98Was+it+%5Bthe+CoW%5D+also+entered+into+with+the+second+Adam%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd25d2c5fd9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d25d2c5fd9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=But%2C%20whether%20that%20covenant%20%5Bof%20works,the%20God%2Dman%20to%20become%20a%20sinner&amp;text=But%2C%20whether%20that%20covenant%20%5Bof%20works%5D%20was%20also&amp;text=impossible%20for%20the%20God%2Dman%20to%20become%20a%20sinner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>ARGUMENT. V. Though the patrons of the doctrine of the necessity of repentance in order to the obtaining of the pardon of sin, do not aim at any encroachment on the doctrine of free pardon; yet, with all deference to those learned men, I conceive, that such doctrine is injurious to the grace of God, and doth much darken the free pardon offered in the gospel, in regard the pardon is promised immediately to those that believe, Acts 10:43. “Through his name, whosoever believeth in him, shall receive remission of sins.” But they require, that believers bring something with them, if they would obtain it, even that they bring repentance along with them. I think Dr. Preston says well, when he tells us, “It is a fault to think God’s pardons are not free, and that you must bring something in your hand. The very end (says he) of thy going to Christ, is to get thy hardness of heart and deadness of spirit removed, to be healed and enlivened.” And it is truly strange to think from what airth repentance should come to people, while as yet their sins are unpardoned, and God is their enemy. What need is their of those ways? Why go we not by faith to a reconciled God, to get repentance; but must seek repentance wherewith we may go to an unreconciled God, who is a consuming fire? If I mistake not, that is not the way of the gospel. It is a seasonable admonition that one gives us to this purpose, “When you go to mourn for sin, begin aloft with Christ; and do not always think to begin below with sin, and so to come up to Christ; but begin aloft with Christ, and fall down upon your sin.” “Papists (says Dr. Preston) tell of escaping damnation, and of getting into heaven. But Scripture gives other motives (to good works). Thou art in Christ, and Christ is thine; consider what he hath done for thee, what thou hast by him, what thou hadst been without him, and thus stir up thyself to do for him what he requireth.” Let them that will, repent that Christ may do for them; I shall desire always to believe what Christ hath done for me, that I may repent; not doubting but that the being instructed therein is the plain way to smiting on the thigh, and saying, What have I done? So says a godly writer, “First of all, God’s favour is apprehended, and remission of sin believed; then upon that cometh alteration of life and conversation.” Upon the whole’ we may see that the gospel teaches us to come empty-handed to the market of free grace, for remission of sin and God’s favour. But he comes not empty, who brings repentance along with him. If any shall say, that if we screw up matters so high in this point, we must cast faith as well as repentance, in the matter of attaining pardon; for that is still something we bring with us. I shall answer; For the safety of God’s grace, let the work faith, the inherent quality faith, go, and be made to stand aback, while the sinner stands before God’s tribunal to be justified; that the empty-handed, taking faith, may alone have place. Hath not the Lord made it to be only of faith, that it might be of grace, while faith comes with an empty hand, and receives all? There is a vast difference betwixt faith and repentance in this matter, even as much as betwixt giving and receiving: for there is no grace of the Spirit that hath more of the nature of giving than repentance, in so far as it is a turning of the whole man from sin unto God; and upon that head it ought to be banished far from the soul’s justification, and to have no part nor lot in the matter of attaining free pardon. And seeing this doctrine doth so well agree with the natural religion that is in all men, whereby they, when they come to God to obtain a favour, would always be sure of some qualification in themselves fitting them for the receipt of it; let us take heed, that it turn not the covenant of grace into a bastard covenant of works. The covenant of works says, Do this; the covenant of grace says so too. Where is the difference then? Why, the covenant of works says, Do this, and thou shalt live, viz. in God’s favour, wherein life lies. But the covenant of grace saith, Live thou, and do this. Now, this doctrine says, Repent, and thy sins shall be pardoned; which is indeed, Do this, and thou shalt live. It requires not perfect obedience indeed; but if we resolve it, we find it to be this, Turn from sin sincerely unto God, though thou caust not perfectly, and thou shalt live in God’s favour. Now, we know magis et minus non variant speciem. I have almost lost sight of faith its relation to the pardon of sin: and no great wonder; seeing another thing is set betwixt them, which seems to take the right hand of faith; for they will not say repentance goes before faith, and yet they will not allow it to come after remission of sin. So then it must go betwixt them, and therefore is the nearest mean: and whichsoever of two means be in themselves the more noble, yet, in relation to the common end, it is highly reasonable to prefer the immediate and nearest mean to the mediate and remote; whereby it comes to pass, that, in the matter of the pardon of sin, repentance most be the more noble mean. Again, I say, I believe and desire to go immediately to Christ for pardon: but dost thou repent of thy sins, thy faith cannot obtain pardon without repentance? Well then, still repentance is preferable to faith here: for without it faith can do nothing; but with it, it proves effectual; now, Propter quod unumquodque est tale, illud ipsum est magis tale. But this I am confident is not the doctrine of the gospel. Let us take a watchword from holy and learned Rutherford: “We would beware (says he) of Mr. Baxter’s* order of setting repentance and works of new obedience before justification; which is indeed a new covenant of works.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fa966ac0ce" data-kw="">
<blockquote><p>We have in our congregation a large Catechism which contains a fuller explanation of the main documents (hoofstucken) of nearly the whole of religion. Every Sunday afternoon this is required by memory of the older children in order, and this is then explained with Scripture evidence by the pastor from the pulpit in the presence of the whole congregation, after he has explain his text of Scripture for about a half hour. In this way not only the children but also the whole congregation are exercised, taught, and confirmed in the special main documents of the Christian religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marten-micron.html">Marten Micron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Chrstlicke Odinancie</cite>, 68. Quoted in Donald Sinnema, ‘The Second Sunday Service in the Early Dutch Reformed Tradition’, Calvin Theological Journal, 32 (1997), p. 303.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0574d4095" data-kw="">
<blockquote><p>…2 Chron. 29 [vv. 29-30], out of which no more can be drawn but that the people worshipped while the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72</span></figcaption>

</figure><figure class="quote" id="q-155d4a9430" data-kw="">
<blockquote><p>These Reconcilers are too far on in the way to Popery already; but if they will be fully reconciled with Papists, they must transport themselves altogether into their tents, because Papists will not come forth to meet them midway. […]

O strange and monstrous invention! that would reconcile Christ with antichrist, – agree the temple of God and idols, mix light and darkness together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), p. 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-f73b2fa7ea" data-kw="">
<blockquote><p>That [the moral law] alone being, in all the branches of it, conform and answerable to the Law of Nature written in Adam’s heart at his Creation. The Ceremonial Law being merely Positive, and instituted: Revealing only Gods instituted worship, and Typifying only supernatural Mysteries in Christ Jesus. And the Judicial Law being only of positive Institution for that Common-wealth of the Jews, and obliging formally as such no other Common-wealth in the world thereunto, though the Matter of some Judicials, so far as bottomed upon Moral principles and foundations, may also analogically oblige other godly and Christian Commonwealths. That alone being of perpetual force and power to all the Churches of God in all succeeding ages both under Old and New Testament. For, the Ceremonial Laws vanished at Christ’s Death, having received their accomplishment in him: And the Judicials expired at the dissolution of the Jewish Common-wealth. In these, and like respects, the Moral Law far excels the Ceremonial and Judicial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery and Marrow of the Bible: God’s Covenants with Man</cite>, (London: George Calvert, 1657), 3.4.1.2.3, p. 663.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-e6d28ea5c4" data-kw="">
<blockquote><p>Independents themselves, though they hold [that] the substantials of Church government and order ought to be the same in our times that they were in the apostles’, yet they do not in all circumstantials nor accidentals judge [that that] discipline now binds; and I suppose if Hagiomastix had thus reasoned against their Independent government and order, that if that tied us in these days, then we are bound to all circumstances and accessories, as to the number of seven deacons, etc. as to widows just of such an age, etc. or else the office of deacons and widows are ceased in the Church, they would have laughed at him for his folly, and yet this is the way of the man’s reasoning against the command of God, Deut. 13:17, the command itself must be wholly abrogated, or else all accessories and formalities accompanying it Christians are tied unto… Love, humility, hospitality, are graces and moral duties commanded under the Gospel, and yet all these with many others of the like kind that I could instance in, had in the apostles’ days, those primitive times, some accessories and appendixes, ways of manifestations of them which are now ceased, as the feasts of love, the kiss of love, washing the saints’ feet, etc. in which humility, brotherly love, kindness to strangers were expressed, as proper and peculiar to that condition the Church was then in, and the customs of those countries, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Hold of Satan</cite>, … (London, 1647), 17th thesis, p. 76</span></figcaption>

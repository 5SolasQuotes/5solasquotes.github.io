<blockquote><p>…he [Cameron] had been involved in bitter controversy, he had alienated himself irreversibly from the leading field-preachers and he was already seen as a dangerous fanatic by the more moderate Presbyterians… The most serious cause of concern for Cameron at the start of 1679 was clearly the threat of further disciplinary action against him by the older ministers… So far as can be known, this threat never materialized, but it is impossible to be certain.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8f28a02866" data-kw="">
<blockquote><p>It thus appears abundantly manifest, from multiplied Scripture evidence, that the chief end for which the Christian Church is constituted — the leading design for which she is made the repository of heavenly blessings — the great command under which she is laid — the supreme function which she is called on to discharge — is, in the name and stead of her glorified Head and Redeemer, unceasingly to act the part of an evangelist to all the world. The inspired prayer which she is taught to offer for spiritual gifts and graces, binds her, as the covenanted condition on which they are bestowed at all, to dispense them to all nations.

The divine charter which conveys to her the warrant to teach and preach the Gospel at all, binds her to teach and preach it to all nations. The divine charter which embodies a commission to administer Gospel ordinances at all, binds her to administer these to all nations. The divine charter which communicates power and authority to exercise rule or discipline at all, binds her to exercise these not alone or exclusively, to secure her own internal purity and peace, union and stability; but chiefly and supremely, in order that she may thereby be enabled the more speedily, effectually, and extensively, to execute her grand evangelistic commission in preaching the Gospel to all nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-duff.html">Alexander Duff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Missions. The Chief End of the Christian Church</cite>, (New edn, Edinburgh: Andrew Elliot, 1877), pp 27-28.</span></figcaption>

<blockquote><p>Let us bear in mind that every child of God is under high and holy discipline, and that true grace is certain to be tried and sifted. If Jesus learned obedience by the things he suffered, though he were a Son, good cause there is that we too should be sifted. Remember that the Lord tried Israel for forty years, to prove what was in their hearts; and if he cross our will, it is to try our faith and patience — if heresy come into deceive if it were possible the very elect, it is to make manifest them that are approved. Let us labour that, whether present or absent, we may be accepted of him, and count it all joy to meet the trials which strengthen faith.</p></blockquote>

<blockquote><p>§63. As for the Common Prayer itself, I never rejected it because it was a form, nor thought it simply unlawful because it was such a form, but have made use of it and would do again in the like case. But I must needs say:

1. That the shredding it into such abundance of small parcels seems to me very inconvenient. It seems too light and ludicrous to toss sentences so formally between the priest and clerk, and to make such a multitude of prayers consisting but of a sentence, or two at most: And it seems to be tautology and vain repetition to repeat over the same word so oft: and a taking of God’s name in vain, or too unreverently, to begin with his titles and attributes, and end with his name again, and the merits or sake of Christ, and this at almost every sentence: as if we had done with Him and were taking our leave, and had forgot somewhat that called us to begin again: and thus we begin and end, and begin and end again, it may be twenty times together.

2. But the enforcing imposition of these prayers is most to be condemned, of which I have spoken in the former disputation. But for my part, I censure none that use them, nor take them to be therefore men of another religion or worship: It is but a modal difference in the same worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 421-22</span></figcaption>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches, and Gregory de Valentia, as I show[ed] before (supra, Question 6 of this treatise), when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo, it [the Church’s judgment] cannot remove my doubting and beget faith; and also the conscience is so much the bolder to venture on a sin against God for fear of eschewing a sin against men, which is questionable, and [that] in a matter indifferent; this is also the stout conscience of Bonaventura (2 Sentences, dist. 39), plus est standum praecepto Praelati quam conscientiae.

7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

<blockquote><p>That this confounding both of the titles and offices of bishop and presbyter [as synonymous], will be found agreeable to the most pure primitive times. It is true, within some few ages, difference was made between bishops and presbyters in the Church; yet was never that distinction counted by them to be jure divino, or by the Law of God; but as a thing belonging to order in the Church, and brought in by custom: which was, that he who was of greatest age and respect, and did preside in the meetings, was particularly called bishop, which afterward was established by some Councils… not only Jerome was of that mind with Aerius (whose opinion was that the bishop and the presbyter were equal and the same) but also, that Ambrosius, Augustinus, Sedulius, Primasius, Chrysostomus, Theoderetus, Oecumenius and Theophilactus were of that same mind… If it be asked, How this distinction [between presbyter and bishop] did enter? He [Jerome] answers in that epistle [to Evagrius]… that when afterward one came to be elected and preferred to the rest, it was done for the remedy of schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation, (Edinburgh, 1658), pp. 223-33, p. 225</span></figcaption>

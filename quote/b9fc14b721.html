<main class="wrap"><figure class="quote" id="q-b9fc14b721" data-kw="">
<blockquote><p>From that line and order of subordination wherein both magistrates and people are placed. The magistrate is placed under God the great Superior: and the subjects are placed under God the great, and under the magistrate the less superior. When the magistrate commandeth contrary to God, and goeth out of his order and line, especially so far as to invade by arms if they obey not, the subjects keeping their own line and order, and defending themselves, is no disobedience to the magistrate, but obedience to God, who in this point, so long as the magistrate walketh in this course, becometh their immediate superior; and as under the magistrate they ought to defend themselves against all violence from without, so in this abuse of God’s ordinance, from all violence from within, otherwise they sin against God and their own souls.

An inferior officer ought to keep his own station in the army, even when his captain goes out of his line and order, and taketh part with his enemy: and in this case he is bound no less than when he was under his general, to fight for himself, and for the safety of the whole army against him. It were against sense and reason to say, that he must give his neck to the sword of his captain, without regard to his general, the whole army, and his own life; yea, every soldier ought to defend the whole army against the general himself, if he turn an enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instructions for Defensive Arms (1639) in Andrew Stevenson, The History of the Church and State of Scotland, from the Accession of King Charles I. to the year 1649. To which is prefixed, An Abstract of the State of Religion in Scotland, from the Earliest Ages of Christianity, to the year 1625</cite></span></figcaption>

<blockquote><p>Neither, however, do we think ourselves bound to teach that God could not forbid sin but under the penalty of eternal death; for we hold that not one or another kind of punishment is necessary, but that punishment itself is necessary, and the punishment, according to the rule of God’s wisdom and justice, is death. Moreover, a rational creature, conscious of its proper subjection and obediential dependence, being created and existing, God did not account it at all necessary to forbid it to sin by a free act of his will, under one penalty or another; for both these follow from the very situation of the creature, and the order of dependence,–namely, that it should not transgress by withdrawing itself from the right and dominion of the Creator, and if it should transgress, that it should be obnoxious and exposed to coercion and punishment. But it being supposed that God should forbid sin by an external legislation, the appointment of punishment, even though there should be no mention made of it, must be coequal with the prohibition. …The modification of punishment respects either its appointment or infliction. Punishment itself is considered either in respect of its general end, which is the punishment of transgression, and has a regard to the condition of the creatures with respect to God; or in respect of some special end, and has a respect to the condition of the creatures among themselves. But whatever modification punishment may undergo, provided it attain its proper end, by accomplishing the object in view, the nature of punishment is preserved no less than if numberless degrees were added to it. As to the establishment of punishment, then, in a human court, as it has not primarily and properly a respect to the punishment of transgression, nor a regard to the condition of the creatures with respect to God, but with respect to one another, that degree of punishment is just which is fit and proper for accomplishing the proposed end. The punishment, then, of theft by a quadruple restitution had in its appointment no such modification conjoined with it as could render it unfit and improper in respect of the end proposed, among that people to whom that law concerning retributions was given; but as the infliction of punishment, according to the sentence of the law, depended on the supreme Ruler of that people, it belonged to him to provide that no temporal dispensation with punishment exercised by him, in right of his dominion, should turn out to the injury of the commonwealth. …But not even in a human court can any such modification be admitted as would render the punishment useless in respect of its end; nor, in respect of God, do we think any degree or mode of punishment necessary, but such as may answer the end of the punishment, so far as respects the state of the creatures with respect to God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on Divine Justice</cite>, ch. 17, in Works, vol. 10, pp. 613-14, see also all of pp. 613-16 for the fuller discussion.</span></figcaption>

<blockquote><p>XV. …the orthodox maintain… the question here… (4) It is not whether any dissent of parents avaricious and through sheer obstinacy will not consent to the proper marriage of children and cannot give sufficient reasons for their dissent after the request has been made by their children that the latter are not absolutely bound to their will, but it is right for them to apply to a superior power to whom a judgment concerning the justice or injustice of the dissent belongs. Thus the matter being well considered, they may determine what the children ought to do and consult their interest by supplying in this point the defect of the consent of the parents.</p></blockquote>

<blockquote><p>The law in general, is that part of God’s Word, which commands things just, honest, and godly, and being thus conceived, it is threefold: ceremonial, judicial, and moral. The ceremonial law, is that part of God’s Word, which prescribed to the Jews, ceremonies, rites, and orders, to be performed in the worship of God. This law is laid down in the books of Moses, especially in Leviticus. The judicial law, is that part of God’s Word, which prescribed ordinances for the government of the Jews’ commonwealth, and the civil punishment offenders. The ceremonial law concerned the Jews only. The judicial law did indeed principally concern them, but yet so far forth as it tends to the establishing of the moral law, having in it common equity,* it concerns all people, in all times and places. What the moral law is, I will describe in three points: first, it is that part of God’s Word, concerning righteousness and godliness, which was written in Adam’s mind by the gift of creation; and the remnants of it be in every man by the light of nature, in regard whereof, it binds all men. Secondly, it commands perfect obedience, both inward in thought and affection, and outward in speech and action. Thirdly, it binds to the curse and punishment everyone that fails in the least duty thereof, though but once, and that in thought only: ‘Cursed is every one that continueth not in all things that are written in the law to do them’ (Gal. 3:10). The sum of the moral law is propound in the Decalogue or Ten Commandments, which many can repeat, but few do understand. That we may further conceive aright the moral law, we must make a difference between it and the gospel, for the gospel is that part of the Word which promises righteousness and life everlasting to all that believe in Christ.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“The law in general, is that part of God’s Word, which commands things just, honest, and godly, and being thus conceived, it is threefold: ceremonial, judicial, and moral. The ceremonial law, is that part of God’s Word, which prescribed to the Jews, ceremonies, rites, and orders, to be performed in the worship of God. This law is laid down in the books of Moses, especially in Leviticus. The judicial law, is that part of God’s Word, which prescribed ordinances for the government of the Jews’ commonwealth, and the civil punishment offenders. The ceremonial law concerned the Jews only. The judicial law did indeed principally concern them, but yet so far forth as it tends to the establishing of the moral law, having in it common equity,* it concerns all people, in all times and places. What the moral law is, I will describe in three points: first, it is that part of God’s Word, concerning righteousness and godliness, which was written in Adam’s mind by the gift of creation; and the remnants of it be in every man by the light of nature, in regard whereof, it binds all men. Secondly, it commands perfect obedience, both inward in thought and affection, and outward in speech and action. Thirdly, it binds to the curse and punishment everyone that fails in the least duty thereof, though but once, and that in thought only: ‘Cursed is every one that continueth not in all things that are written in the law to do them’ (Gal. 3:10). The sum of the moral law is propound in the Decalogue or Ten Commandments, which many can repeat, but few do understand. That we may further conceive aright the moral law, we must make a difference between it and the gospel, for the gospel is that part of the Word which promises righteousness and life everlasting to all that believe in Christ.”

— William Perkins, The Works of William Perkins: vol. 2: Commentary on Galatians, (1:243–44).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+law+in+general%2C+is+that+part+of+God%E2%80%99s+Word%2C+which+commands+things+just%2C+honest%2C+and+godly%2C+and+being+thus+conceived%2C+it+is+threefold%3A+ceremonial%2C+judicial%2C+and+moral.+The+ceremonial+law%2C+is+that+part+of+God%E2%80%99s+Word%2C+which+prescribed+to+the+Jews%2C+ceremonies%2C+rites%2C+and+orders%2C+to+be+performed+in+the+worship+of+God.+This+law+is+laid+down+in+the+books+of+Moses%2C+especially+in+Leviticus.+The+judicial+law%2C+is+that+part+of+God%E2%80%99s+Word%2C+which+prescribed+ordinances+for+the+government+of+the+Jews%E2%80%99+commonwealth%2C+and+the+civil+punishment+offenders.+The+ceremonial+law+concerned+the+Jews+only.+The+judicial+law+did+indeed+principally+concern+them%2C+but+yet+so+far+forth+as+it+tends+to+the+establishing+of+the+moral+law%2C+having+in+it+common+equity%2C%2A+it+concerns+all+people%2C+in+all+times+and+places.+What+the+moral+law+is%2C+I+will+describe+in+three+points%3A+first%2C+it+is+that+part+of+God%E2%80%99s+Word%2C+concerning+righteousness+and+godliness%2C+which+was+written+in+Adam%E2%80%99s+mind+by+the+gift+of+creation%3B+and+the+remnants+of+it+be+in+every+man+by+the+light+of+nature%2C+in+regard+whereof%2C+it+binds+all+men.+Secondly%2C+it+commands+perfect+obedience%2C+both+inward+in+thought+and+affection%2C+and+outward+in+speech+and+action.+Thirdly%2C+it+binds+to+the+curse+and+punishment+everyone+that+fails+in+the+least+duty+thereof%2C+though+but+once%2C+and+that+in+thought+only%3A+%E2%80%98Cursed+is+every+one+that+continueth+not+in+all+things+that+are+written+in+the+law+to+do+them%E2%80%99+%28Gal.+3%3A10%29.+The+sum+of+the+moral+law+is+propound+in+the+Decalogue+or+Ten+Commandments%2C+which+many+can+repeat%2C+but+few+do+understand.+That+we+may+further+conceive+aright+the+moral+law%2C+we+must+make+a+difference+between+it+and+the+gospel%2C+for+the+gospel+is+that+part+of+the+Word+which+promises+righteousness+and+life+everlasting+to+all+that+believe+in+Christ.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+The+Works+of+William+Perkins%3A+vol.+2%3A+Commentary+on+Galatians%2C+%281%3A243%E2%80%9344%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c8f9f5b3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c8f9f5b3c.html">Permalink</a><a class="src" href="https://heidelblog.net/2019/12/the-threefold-distinction-in-the-law-is-basic-reformed-theology/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

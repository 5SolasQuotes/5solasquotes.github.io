<main class="wrap"><figure class="quote" id="q-1b5846db12" data-kw="">
<blockquote><p>We prove the vanity of this fiction in this way. First, because scripture teaches that the faithful (for whom they want Purgatory to be constructed) pass from here through death into eternal life. John 5:24 — &quot;Whoever hears my word and believes him who sent me has eternal life and will not come under judgment but has passed from death to life.&quot; Therefore they do not come into the judgment of Purgatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis on Purgatory</cite>, p. 1</span></figcaption>

— Gisbertus Voetius, Thesis on Purgatory, p. 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+prove+the+vanity+of+this+fiction+in+this+way.+First%2C+because+scripture+teaches+that+the+faithful+%28for+whom+they+want+Purgatory+to+be+constructed%29+pass+from+here+through+death+into+eternal+life.+John+5%3A24+%E2%80%94+%22Whoever+hears+my+word+and+believes+him+who+sent+me+has+eternal+life+and+will+not+come+under+judgment+but+has+passed+from+death+to+life.%22+Therefore+they+do+not+come+into+the+judgment+of+Purgatory.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Thesis+on+Purgatory%2C+p.+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b5846db12.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b5846db12.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5089754c45" data-kw="">
<blockquote><p>We deny that such a Purgatory exists or truly exists with this argument: That neither wholly nor in part does Scripture teach it, but rather openly rejects and condemns it: Scripture denies its truth or existence itself. Pontifical Purgatory is neither wholly nor in part taught by Scripture, but rather openly rejects and condemns it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-alting.html">Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Purgatory</cite>, p. 2, Theses VIII–IX</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo.html">Purgatory and Limbo</a> › <a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo/purgatory-no-ground-in-scripture.html">Purgatory: no ground in Scripture</a></span><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/purgatory.html">Purgatory</a></span></div>
<div class="actions"><button class="copy" data-copy="“We deny that such a Purgatory exists or truly exists with this argument: That neither wholly nor in part does Scripture teach it, but rather openly rejects and condemns it: Scripture denies its truth or existence itself. Pontifical Purgatory is neither wholly nor in part taught by Scripture, but rather openly rejects and condemns it.”

— Heinrich Alting, On Purgatory, p. 2, Theses VIII–IX">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+deny+that+such+a+Purgatory+exists+or+truly+exists+with+this+argument%3A+That+neither+wholly+nor+in+part+does+Scripture+teach+it%2C+but+rather+openly+rejects+and+condemns+it%3A+Scripture+denies+its+truth+or+existence+itself.+Pontifical+Purgatory+is+neither+wholly+nor+in+part+taught+by+Scripture%2C+but+rather+openly+rejects+and+condemns+it.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Alting%2C+On+Purgatory%2C+p.+2%2C+Theses+VIII%E2%80%93IX&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5089754c45.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5089754c45.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-1deaacbc98" data-kw="">
<blockquote><p>But since purgatory has been reared on many, and is daily propped up by new blasphemies; since it produces many grievous offenses, assuredly it is not to be connived at, however it might have been disguised for a time, that without any authority from the word of God, it was devised by prying audacious rashness, that credit was procured for it by fictitious revelations, the wiles of Satan, and that certain passages of Scripture were ignorantly wrested to its support.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.5.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo.html">Purgatory and Limbo</a> › <a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo/purgatory-no-ground-in-scripture.html">Purgatory: no ground in Scripture</a></span><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/purgatory.html">Purgatory</a></span></div>
<div class="actions"><button class="copy" data-copy="“But since purgatory has been reared on many, and is daily propped up by new blasphemies; since it produces many grievous offenses, assuredly it is not to be connived at, however it might have been disguised for a time, that without any authority from the word of God, it was devised by prying audacious rashness, that credit was procured for it by fictitious revelations, the wiles of Satan, and that certain passages of Scripture were ignorantly wrested to its support.”

— John Calvin, Institutes of the Christian Religion, 3.5.10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+since+purgatory+has+been+reared+on+many%2C+and+is+daily+propped+up+by+new+blasphemies%3B+since+it+produces+many+grievous+offenses%2C+assuredly+it+is+not+to+be+connived+at%2C+however+it+might+have+been+disguised+for+a+time%2C+that+without+any+authority+from+the+word+of+God%2C+it+was+devised+by+prying+audacious+rashness%2C+that+credit+was+procured+for+it+by+fictitious+revelations%2C+the+wiles+of+Satan%2C+and+that+certain+passages+of+Scripture+were+ignorantly+wrested+to+its+support.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.5.10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1deaacbc98.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1deaacbc98.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-d6582df282" data-kw="">
<blockquote><p>But if it is perfectly clear, from what was lately said, that the blood of Christ is the only satisfaction, expiation, and cleansing for the sins of believers, what remains but to hold that purgatory is mere blasphemy, horrid blasphemy against Christ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.5.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo.html">Purgatory and Limbo</a> › <a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo/temporal-punishment-and-satisfaction.html">Temporal punishment and satisfaction</a></span><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/purgatory.html">Purgatory</a></span></div>
<div class="actions"><button class="copy" data-copy="“But if it is perfectly clear, from what was lately said, that the blood of Christ is the only satisfaction, expiation, and cleansing for the sins of believers, what remains but to hold that purgatory is mere blasphemy, horrid blasphemy against Christ?”

— John Calvin, Institutes of the Christian Religion, 3.5.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+if+it+is+perfectly+clear%2C+from+what+was+lately+said%2C+that+the+blood+of+Christ+is+the+only+satisfaction%2C+expiation%2C+and+cleansing+for+the+sins+of+believers%2C+what+remains+but+to+hold+that+purgatory+is+mere+blasphemy%2C+horrid+blasphemy+against+Christ%3F%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.5.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd6582df282.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d6582df282.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-b492e8c01d" data-kw="">
<blockquote><p>What then must our conclusion be, but that these men act presumptuously in daring, out of their own brains, to make a fabric of that which has no foundation in the word of God? unless, perhaps, they would have us to receive their device of Purgatory as a kind of vaticination vented by ventriloquism; for there is nothing which serves so well to fill their bellies!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to Session VI / Justification canons</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5757b1131c" data-kw="">
<blockquote><p>Wherefore good works are necessary to salvation, certainly not as an efficient or meritorious cause, by an efficient principle; yet they are necessary by a principle of being present, and so a testimony of our living faith, without which faith is dead; and they are required to salvation, not as a cause of ruling, but as a way to the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/festus-hommius.html">Festus Hommius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 67, ‘Of Good Works’, ‘Whether Good Works are Necessary to Salvation?’ in 70 Theological Disputations Against Papists</cite>, … in a Collection Against Bellarmine (Leiden, 1614), pp. 454-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-757e8a0bda" data-kw="">
<blockquote><p>The righteousness required by the Moral Law is of two sorts: 1. Habitual [an abiding inward disposition], in the inherent holiness of man’s whole person, when such gracious qualities are fixed and planted in every faculty of soul and body: as do dispose and incline the motions of both only unto that which is conformable to the righteousness of the Law. That such righteousness is required by the Law is a plain case and confessed; That which commands the good or forbids the evil action does command the virtuous and forbid the vicious habit too. He that looks for purity in the stream cannot but dislike poison in the fountain: and God that commands us to do good, bids us also to be holy; nor can we do the one, unless we do the other. And therefore the apostle joins both together. The end of the commandment is love, (but where?) out of a pure heart, 1 Tim. 1:5. 2. Actual, in the exercise of all good works enjoined by the Law, and forbearing the contrary evil works. Whether these good or evil works be inward in that spiritual obedience which the Law required; (viz.) in the right ordering of all the motions of our souls, that every one of our thoughts, imaginations, purposes of our mind, and all the secret workings and stirrings of our affections, be altogether employed upon piety and charity, not so much as touching upon any thing that is contrary to the love of God or our neighbor. Or, whether these good and evil works be outward in the bodily obedience unto the Law, in doing all and every external duty of religion towards God: of justice and mercy towards man; and in leaving undone the contrary. Further this actual righteousnesse of the Law is to be considered two ways: 1. As it respects all the commandments, and so that righteousness is only perfect, which fulfils all and every particular precept of the Law. 2. As it respects any one commandment, or any one duty therein contained. And so we may call that righteousness perfect, which exactly performs any one point of the Law, though it fail in others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A Treatise of Justification by Faith</cite>, … 1st ed. (Oxford, 1625), section 3, ch. 1, pp. 66-67</span></figcaption>

</figure><figure class="quote" id="q-5972dc39d0" data-kw="">
<blockquote><p>Assertion 5: Good works are understood to have a causative power for eternal life in three ways. 1. As strictly meritorious, which we reject against the papists as blasphemous, as we proved in another place. 2. That they may have an inferior and causal instrumental power conferred upon them by the grace of God, as Gisbertus Voetius says in Thersite Heautontemerumeno, section. 1, ch. 2, just as running is the cause of the attaining of a crown which is received, contending the cause of the victory, and diet is a cause of health [1 Cor. 9:24-25; Heb. 12:1]. Neither may one be said to distinguish accurately here between a means and a cause, or between a way and a cause: for while good works are means, they are not passive, but active: a means here is an inferior cause. Therefore it is said, “For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory”. Κατεργάζεται ἡμῖν, they work, they bring about a cause for us, as the Holy Spirit speaks, 2 Cor. 4:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, p. 532 of ’10. Whether good works are necessary as causes of justification, and therefore also of salvation? in Ch. 12, ‘On the Justification of Sinners’ in Examination of Arminianism (Utrecht, 1668)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

om/good-works/#:~:text=Assertion%205%3A%20Good%20works%20are%20understood,Holy%20Spirit%20speaks%2C%202%20Cor.%204%3A17&amp;text=Assertion%205%3A%20Good%20works%20are%20understood%20to%20have&amp;text=as%20the%20Holy%20Spirit%20speaks%2C%202%20Cor.%204%3A17" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fd25df2ef3" data-kw="">
<blockquote><p>For the Papists charge us, that we place Christian liberty in this, that we are subject to no law in our conscience, and before God; and that we are free from all necessity of doing good works… We profess that good works are necessary to salvation, though not necessitate efficientiae, as causing it as the Papists teach; yet necessitate praesentiae, as necessary fruits of our faith, whereby we are to glorify God, and to testify our thankfulness, to do good to our brethren, and to make sure our election, calling and justification unto ourselves; as necessary forerunners of salvation, being the undoubted badges of them that shall bee saved; being the way wherein we are to walk to everlasting life, being the evidence according to which God will judge us at the last day. And lastly, that as by justification God doth entitle us unto his kingdom; so by sanctification He doth sit and prepare us thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 80-83 of The Christian’s Freedom, Wherein is fully expressed the Doctrine of Christian Liberty (Oxford, 1635)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-53eb46797f" data-kw="">
<blockquote><p>I take for granted that every Reformed Presbyterian will cheerfully admit the obligation to receive the Bible as the universal rule of action in things civil as well as religious. “Be wise now, therefore, O ye kings, be instructed, ye judges of the earth; serve the Lord with fear.”

Kings and judges are here addressed in their official capacity; and in this capacity they are commanded to “serve the Lord.” The nation as a moral person acts by its rulers; the doings of the latter become the responsibilities of the former, and the obligations due by the nation are to be fulfilled by its rulers.

There is nothing in Scripture that warrants the limitation of the obligation to “serve God” to one part of the divine law, to the exclusion of another. Yet it has been assumed, that rulers in the administration of government have nothing to do with the first table of the moral law. And on this unwarranted limitation of the magistrate’s authority, is opposition made to a public provision for the religious instruction of the community.

On the other hand, we hold that the civil magistrate is “custos et vindex utriusque tabulae,” the [keeper] and avenger of both tables of the law.[1] This was adopted as a maxim on the subject, by the Protestant writers of the Reformation, and finds a place in the testimony of the Reformed Presbyterian Church, as it had also been recognized by the Covenanted Church of Scotland in her purest times!

David Scott, ‘The Public Support of Religion’, Reformed Presbyterian and Covenanter, 8, no. 9 (September 1870), pp 271-72.</p></blockquote>

<blockquote><p>Let us now look at the position which the original Covenanters occupied among the great parties that were in the land. From the representations frequently given of them, one would suppose that they were the most extreme among all the fanatics of the country. But, when we appeal, from the servile cant of modern liberality, and from the current slang of high church sycophancy, to the tribunal of sober history, it appears undeniable, that of all the parties in the country, the Covenanters alone maintained the principles of the British constitution.

Their opinions were equally opposed to those of the cavaliers, who urged Charles forward in the path of usurpation; and to those of the sectarians, who overthrew the monarchy, and brought the king to the scaffold. Thus opposed, and equally opposed, to arbitrary power, and to sectarian anarchy, the original Covenanters, of all parties then in the land, were most undeserving of the name of bigots. The cavaliers were bigots, though they wanted religion, for they urged on the king to his ruin, and plunged the nation into all the horrors of a civil war, without any wise, or even plausible pretence. The sectarians may, with much justice, be accused of bigotry, for they sacrificed the interests of their country for the miserable object of party aggrandisement.

But it can with no plausibility be brought as a charge against the original Covenanters, who were equally sworn to maintain authority, and to resist its encroachments. If the king had been of their principles, the civil war would have been prevented. If the sectaries had been of their principles, the civil war would have settled the contest for British freedom, while the latter, by their anarchy, postponed its settlement until the revolution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s Crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), pp 50-51.</span></figcaption>

</figure><figure class="quote" id="q-1181f8ced7" data-kw="">
<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.”

— David Scott, Distinctive principles of the Reformed Presbyterian Church, (Albany, 1841), pp 289-90.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+the+duly+of+government+to+provide+for+the+moral+training+and+culture+of+the+community%2C+especially+of+the+young%2C+by+encouraging+education%2C+endowing+schools+and+colleges%2C+watching+over+their+interests+with+parental+solicitude%2C+and+taking+care+that+the+young+shall+be+educated+so+as+to+make+them+good+men+and+useful+citizens.+To+attain+this+the+reading+of+the+scriptures+must+be+made+a+prominent+part+of+ordinary+school+education.+To+refuse+the+scriptures+a+place+in+common+schools+is+directly+to+encourage+and+strengthen+the+growth+of+infidelity.+Education+can+never+be+safely+separated+from+Christian+principle.+For+this+reason+a+national+provision+for+religion+should+embrace+a+provision+for+national+education.+The+latter+is+an+important+part+of+the+former.+There+is+an+inconsistency+on+the+part+of+some+who+while+they+are+friendly+to+a+public+provision+for+schools%2C+are+opposed+to+a+public+provision+for+the+support+of+religion.+The+objection+made+against+the+latter+may+with+equal+propriety+be+made+against+the+former%2C+unless+schools+are+so+conducted+as+to+have+no+reference+to+the+Christian+religion%3B+and+then+it+might+be+doubted+whether+they+would+he+ultimately+any+advantage+to+a+community.%0A%0AThe+immediate+end+of+civil+government+is+the+good+of+society%3B+but+this+is+most+perfectly+attained+where+the+glory+of+God+is+kept+in+view+as+the+ultimate+end.+The+welfare+of+society+can+never+be+secured+irrespective+of+this.+The+attainment+of+the+ends+of+civil+government+require+that+provision+should+be+made+for+Christian+instruction+and+education.+Immorality+and+crime+will+thus+be+most+surely+prevented%2C+and+to+prevent+is+incomparably+better+than+to+punish+crime.+The+prevalence+of+vice%2C+and+the+general+corruption+of+society+necessarily+and+universally+accompany+mental+debasement+and+re

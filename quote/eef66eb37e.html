<blockquote><p>V. IN WHAT DOES THE CHURCH DIFFER FROM THE STATE?

The chief differences between the church and the state are the following:

1. The state is a society which is bound by certain civil laws for the maintenance of external propriety and order, according to each table of the Decalogue. The church consists of those who embrace the gospel, and observe the sacraments according to divine appointment, and is governed by the Spirit and word of God, requiring both internal and external obedience.

2. In the church there are always some holy and godly persons, which is not always true of the state.

3. There are many different states which are distinguished from each other by locality, time and laws; neither can he who is a citizen of one state, be a citizen of another also, or of all others; nor is there any one universal state of which all others are parts. The church, however, has been, is, and ever will be, one throughout all periods, and among all nations. It is for this reason called Catholic, having many parts.

4. The head of the church is one, and in heaven, which head is Christ. The different states have many kings and rulers, and these upon earth.

5. The state has magisterial authority and power to make laws, to which it becomes us to yield obedience for conscience sake. The church is restricted and tied down to the word of God, and has no power to make new articles of faith. It may, indeed, establish rules of order and propriety, but without binding the conscience; and that not with magisterial authority, but with consent.

6. The state is armed with power to inflict punishment upon obstinate offenders, and to preserve its laws with the sword. The church has merely the sword of the word, which consists in the denunciation of the wrath of God against those who are disobedient. One and the same person, as the prophets and priests of old, may sometimes act both in a civil and ecclesiastical capacity. Hence they ought to be carefully distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr Zacharias Ursinus on the</cite>, Heidelberg Catechism, trans. G. W. Williard (Ohio, 1852), pp 291-92.</span></figcaption>

<blockquote><p>But love and fear press me to put you in mind, that it hath been in all ages the holy disposition &amp; happy practise of all God’s people waiting for the appearing of Jesus their Lord, tendering the weal of his spouse, and taking to heart the eternal salvation of their own souls; to set continually before their eyes. 1. His inestimable goodness towards his Kirk. 2. Her case and condition, while she is militant here on earth. And 3. in consideration of the one and the other, the duty required and expected at their hands, wherethrough in the goodness of God they have been safe from that dreadful ruin, that hath overtaken the wicked.

And which I wish you my beloved children to escape by calling to mind in like manner at this time of your danger and my distress. First how wonderful the Lord’s mercies have been towards me his Kirk in this nation. Secondly my present case crying with the complaints of a mother for help at your hands. And thirdly what is due from your affection, places, and callings to me, in whose womb ye were conceived, and by whose care ye are brought up to that which ye now are.</p></blockquote>

<blockquote><p>Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.</p></blockquote>

<blockquote><p>For in a Christian communion there are these different administrations or polities or states, ecclesiastical and civil. … For, 1. Though both agree in this, that there is order in their administrations, yet with this difference that the guides in the church have not a despotical, but Œconomical power only, being not lords over Christ’s heritage, but stewards and ministers of Christ and of the church; the dominion and law-giving power being reserved to Christ alone, as he only [is the] head of the church. But in the other state he has given lordly power, authority, and dominion unto men.

2. Though both agree in this, that man is the common subject of them both, yet with this difference, man by nature being a reasonable and sociable creature, capable of civil order, is or may be the subject of civil power and state. But man by grace called out of this world to fellowship with Jesus Christ, and with his people, is the only subject of church power; yet so, as the outward man of church members is subject to the civil power in common with other men, while their inward man is the subject of spiritual order and administrations.

3. Though they both agree in this, that God is the efficient [cause] and author of them both, and that by Christ, yet not eadem ratione [for the same reason]. For, God as the Creator and Governor of the world is the author of civil order and administrations. But God as in covenant with his people in Christ is the author of church administrations. So likewise Christ, as the essential word and wisdom of God creating and governing the world is the efficient [cause] and fountain of civil order and administrations. But as mediator of the New Covenant and head of the church, he establishes ecclesiastical order.

4. Though they both agree in this, that they have the same last end, viz., the glory of God, yet they differ in their next ends; for the next end of civil order and administrations is the preservation of humane societies in outward honour, justice, and peace. But the next ends of church order and administrations are the conservation, edification, and salvation of souls, pardon of sins, power against sin, peace with God, etc.

5. Hence arises another difference about the objects of these different states. For though both agree in this, that they have the common welfare for their aim and scope, yet the things about which the civil power is primary conversant are bodies, τα βιωτικά (1 Cor. 6:4) or τά πρός τόν βίον, “the things of this life” as goods, lands, honour, the liberties and peace of the outward man. The things whereabout the church power is exercised are τά πρός τόν θεόν, “the things of God” (Heb. 5:1) as the souls and consciences of men, the doctrine and worship of God, the communion of the saints. Hence also they have different laws, different officers, different power, whereby to reduce men to order, according to their different objects and ends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discourse about civil government in a new plantation whose design is religion. Written many years since, by that Reverend and worthy Minister of the Gospel, John Cotton, B.D.; And now published by some undertakers of a new plantation, for general direction and information</cite>, (Cambridge MA: Samuel Green, 1663), pp 6-7.</span></figcaption>

— John Cotton, A discourse about civil government in a new plantation whose design is religion. Written many years since, by that Reverend and worthy Minister of the Gospel, John Cotton, B.D.; And now published by some undertakers of a new plantation, for general direction and information, (Cambridge MA: Samuel Green, 1663), pp 6-7.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+in+a+Christian+communion+there+are+these+different+administrations+or+polities+or+states%2C+ecclesiastical+and+civil.+%E2%80%A6+For%2C+1.+Though+both+agree+in+this%2C+that+there+is+order+in+their+administrations%2C+yet+with+this+difference+that+the+guides+in+the+church+have+not+a+despotical%2C+but+%C5%92conomical+power+only%2C+being+not+lords+over+Christ%E2%80%99s+heritage%2C+but+stewards+and+ministers+of+Christ+and+of+the+church%3B+the+dominion+and+law-giving+power+being+reserved+to+Christ+alone%2C+as+he+only+%5Bis+the%5D+head+of+the+church.+But+in+the+other+state+he+has+given+lordly+power%2C+authority%2C+and+dominion+unto+men.%0A%0A2.+Though+both+agree+in+this%2C+that+man+is+the+common+subject+of+them+both%2C+yet+with+this+difference%2C+man+by+nature+being+a+reasonable+and+sociable+creature%2C+capable+of+civil+order%2C+is+or+may+be+the+subject+of+civil+power+and+state.+But+man+by+grace+called+out+of+this+world+to+fellowship+with+Jesus+Christ%2C+and+with+his+people%2C+is+the+only+subject+of+church+power%3B+yet+so%2C+as+the+outward+man+of+church+members+is+subject+to+the+civil+power+in+common+with+other+men%2C+while+their+inward+man+is+the+subject+of+spiritual+order+and+administrations.%0A%0A3.+Though+they+both+agree+in+this%2C+that+God+is+the+efficient+%5Bcause%5D+and+author+of+them+both%2C+and+that+by+Christ%2C+yet+not+eadem+ratione+%5Bfor+the+same+reason%5D.+For%2C+God+as+the+Creator+and+Governor+of+the+world+is+the+author+of+civil+order+and+administrations.+But+God+as+in+covenant+with+his+people+in+Christ+is+the+author+of+church+administrations.+So+likewise+Christ%2C+as+the+essential+word+and+wisdom+of+God+creating+and+governing+the+world+is+the+efficient+%5Bcause%5D+and+fountain+of+civil+order+and+administrations.+But+as+mediator+of+the+New+Covenant+and+head+of+the+church%2C+he+establishes+ecclesiastical+order.%0A%0A4.+Though+they+both+agree+in+this%2C+that+they+have+the+same+last+end%2C+viz.%2C+the+glory+of+God%2C+yet+they+differ+in+their+next+ends%3B+for+the+next+end+of+civil+order+and+administrations+is+the+preservation+of+humane+societies+in+outward+honour%2C+justice%2C+and+peace.+But+the+next+ends+of+church+order+and+administrations+are+the+conservation%2C+edification%2C+and+salvation+of+souls%2C+pardon+of+sins%2C+power+against+sin%2C+peace+with+God%2C+etc.%0A%0A5.+Hence+arises+another+difference+about+the+objects+of+these+different+states.+For+though+both+agree+in+this%2C+that+they+have+the+common+welfare+for+their+aim+and+scope%2C+yet+the+things+about+which+the+civil+power+is+primary+conversant+are+bodies%2C+%CF%84%CE%B1+%CE%B2%CE%B9%CF%89%CF%84%CE%B9%CE%BA%CE%AC+%281+Cor.+6%3A4%29+or+%CF%84%CE%AC+%CF%80%CF%81%CF%8C%CF%82+%CF%84%CF%8C%CE%BD+%CE%B2%CE%AF%CE%BF%CE%BD%2C+%E2%80%9Cthe+things+of+this+life%E2%80%9D+as+goods%2C+lands%2C+honour%2C+the+liberties+and+peace+of+the+outward+man.+The+things+whereabout+the+church+power+is+exercised+are+%CF%84%CE%AC+%CF%80%CF%81%CF%8C%CF%82+%CF%84%CF%8C%CE%BD+%CE%B8%CE%B5%CF%8C%CE%BD%2C+%E2%80%9Cthe+things+of+God%E2%80%9D+%28Heb.+5%3A1%29+as+the+souls+and+consciences+of+men%2C+the+doctrine+and+worship+of+God%2C+the+communion+of+the+saints.+Hence+also+they+have+different+laws%2C+different+officers%2C+different+power%2C+whereby+to+reduce+men+to+order%2C+according+to+their+different+objects+and+ends.%E2%80%9D%0A%0A%E2%80%94+John+Cotton%2C+A+discourse+about+civil+government+in+a+new+plantation+whose+design+is+religion.+Written+many+years+since%2C+by+that+Reverend+and+worthy+Minister+of+the+Gospel%2C+John+Cotton%2C+B.D.%3B+And+now+published+by+some+undertakers+of+a+new+plantation%2C+for+general+direction+and+information%2C+%28Cambridge+MA%3A+Samuel+Green%2C+1663%29%2C+pp+6-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64f61fc0cc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64f61fc0cc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/08/john-cotton-on-the-differences-between-the-two-kingdoms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-cf42d56e33" data-kw="">
<blockquote><p>It is ridiculous to profess to find in this a decision of Christ on the subject of war; far more so to find in it a decision against even defensive war as sinful, or against the profession of a soldier as in itself unlawful. It is equally absurd to plead this text in support of what used to be called the divine right of kings, in virtue of which it was held that they might be guilty of extortion and oppression towards their subjects to any extent, while their victims were forbidden by Scripture to rise and resent the tyranny, or rise and throw off the tyrant. The words of Jesus give no countenance to the notion that all war is sinful; and as little to the equally unfounded idea that all revolutions must be rebellions.

We live, as Britons, under a constitution guaranteed to us by a revolution settlement, which was righteous and good, and which banished from the throne a dynasty whom the nation declared, most justly, had forfeited its love and its submission, and whom the judgment of God upon their wickedness has since pursued into extinction. And as we live in internal tranquillity under God, in virtue of a settlement secured by a just revolution; we ought to be prepared in like manner to guard our external relations by readiness, when necessary, for defensive war.

The righteousness, in certain cases, of revolution within; and the righteousness, in certain cases also, of war without; are principles indeed absolutely necessary to the maintenance of peace within the nation itself, and of peace with those around us. And these are principles sanctioned in many passages of Scripture, and certainly not condemned by the words before us.

We venture also very strongly to assert that the admirable historian [J. H. Merle d’Aubigné] of the Reformation has done deep injustice to one of the finest portraits in his noble picture gallery, we mean Zwingle, whom, simply because he died in the field, sword in hand, he represents as having forgotten that the “weapons of our warfare are not carnal,” and as having violated the command which Jesus here gives to Peter. We are persuaded that the lawfulness of the battle in which the great Swiss reformer fell, is not to be settled by the off-hand quotation of this or any other text.

The fact that they were religious men in Switzerland was no reason why they should see, without a struggle, their fatherland overrun and devastated by the wild troops of their allied persecuting foes. Apart from their love to the gospel, it will be no easy matter for any historian to show that the Swiss did wrong in risking their liberties on the issue of battle; and most certainly the introduction into the question of their religious rights as Christians, which they loved and sought to guard even more than their liberties as men, will not make it any easier to prove that they sinned in fighting to defend and retain them. We feel interested in the question; for the memory of our covenanted forefathers in one period of their history stands in the same position, and must share the same fate, as the memory of Zwingle.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c60425a24e" data-kw="">
<blockquote><p>Also, in the Queries Touching the Ordination of Ministers [1647], written in opposition to the learned and much-approved book entitled Jus Divinum Regiminis Ecclesiastici [The Divine-Right of Church Government], the same controversy is touched upon frequently with more railing than reason by that furious Erastian [William Aspinwall, †1662] who composed the Grallae [Stilts] against [Willem] Apollnius [1602-1657]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions n.d</cite>, ch. 3, ‘Whether Ordination be Essential to the Calling of a Minister?’ 9, pp. pp. 14-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>6. As morality and piety, rightly grounded on evangelical principles, will give the best and greatest security to government, and will lay in the hearts of men the strongest obligations to due subjection: and as the knowledge of these, is most likely to be propagated through a society by the institution of the public worship of the Deity, and of public instruction in morality and religion: therefore, to promote those important purposes, the people of this state have a right to impower, and do hereby fully impower the legislature to authorize form time to time, the several towns, parishes, bodies-corporate, or religious societies within this state, to make adequate provision at their own expense, for the support and maintenance of public protestant teachers of piety, religion and morality:</p></blockquote>

<blockquote><p>16. All persons living in the Province who confess and acknowledge the one Almighty and Eternal God, and holds themselves obliged in conscience to live peaceably and quietly in a civil society, shall in no way be molested or prejudged for their religious persuasions and exercise in matters of faith and worship… Yet it is also hereby provided, that no man shall be admitted a member of the great or common Council, or any other place of public trust, who shall not [sic] profaith in in Christ Jesus, and solemnly declare that he does no ways hold himself obliged in conscience to endeavor alteration in the government… Nor by this article is it intended, that any under the notion of this liberty shall allow themselves to avow atheism, irreligiousness, or to practice cursing, swearing, drunkenness, prophaneness, whoring, adultery, murdering or any kind of violence… … 20. That all marriages nor forbidden in the law of God, shall be esteemed lawful…</p></blockquote>

s Online</a></div>

<blockquote><p>Drawing on principles of contract law developed by jurists and theologians from the School of Salamanca [Spain], the Jesuit controversialist Martinus Becanus (1563–1624) argues in favor of the duty to honor promises beyond confessional boundaries [contra the normal Roman position]… In particular circumstances the toleration of religious diversity may not only prevent greater evil, but also advance the greater good, especially by stimulating a kind of pious competition between confessional communities. This first English translation… [is] a major work of one of the most prominent advocates of a permission concept of tolerance in the early modern period.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-05b418c578" data-kw="">
<blockquote><p>Their inference then from that text, 1 Sam. 2:17, 24 (if they speak to the purpose) must be this, viz. We ought to separate from a true Church, and set up a distinct Church within it, if but two scandalous ministers be not brought under due censure, though somewhat be done against them, and their wickedness be truly represented; as old Eli the high priest had reproved his sons pertinently and gravely, though I confess he ought to have done more. I shall yet be more liberal: What though not only two, but a great number of scandalous ministers in a true Church do escape condign censure? This affords no ground for relinquishing of them, and setting up a distinct Church: In such a case the scandals are not espoused, nor do even errors and heresies become the sentiments of a Church that professes the truths opposite to them, though erroneous or scandalous persons may have so much countenance as to prove too strong for the sounder part, as the sons of Zeruiah were too strong for David.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e4e9351e1" data-kw="">
<blockquote><p>On the part of the people generally, of course, there was no intention of seeking an armed confrontation with the government. The only aim of the majority who attended the field-meetings was to worship God according to their consciences–and to resort to justified self-defence if pushed to extremity… By 1677–or at least by the end of that year–a movement had become established which sought to stiffen the pattern of resistance, and in various ways to carry the battle to the authorities. The acknowledged leader of this movement was Robert Hamilton [who was 27 years old]… Hamilton, who had earlier had a reputation as a profligate, had apparently undergone a radical spiritual experience, and had set himself up as a champion of orthodoxy and of opposition to compromise… …Hamilton and his associates… With their support, and primarily at their instigation, some of the younger preachers began to hold meetings on the boundaries of, and even within, the parishes of such [indulged] ministers, with the object of drawing away their people from attending their services. This unmistakably aggressive stance was fully in line with Hamilton’s view of how to proceed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 76-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

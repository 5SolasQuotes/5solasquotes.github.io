<main class="wrap"><figure class="quote" id="q-fe31d700a8" data-kw="">
<blockquote><p>First therefore they say, If so be we are not able to do any thing towards our salvation, this is to turn men into stocks and stones, or beasts, and so [there is] no difference between them and us. But we say, Although those similitudes the Scripture holds forth do prove our inability for that which is good, yet they must not be made alike in all things. It’s true, to convert men, is to make children unto Abraham out of stones; yet we must not think that is therefore an universal likeness between men and stones: For first, consider this vast dissimilitude; In stones and beasts there is no passive capacity of grace, but in man there is. We say, there is a power for grace in a man’s nature; and the Papists say, there is a power: only they say it’s an active power, though remote; we say, only a passive. There is a power to be converted to God, which is not in stones or beasts: they say, there is a power to convert or turn to God; here is a great difference. Besides, we may consider these degrees in the creatures: 1. There is an inclination to such an act, as in the fire to burn. 2. A spontaneous inclination to some acts accompanied with sense, and sensible apprehensions, as in beasts. 3. A willing inclination accompanied with reason or judgment, and this is in man: Now, because man is thus affected, therefore God in converting, though He does it by a potent work, yet by arguments, which we never use to horses, or brute beasts: and although man has lost that rectitude in his will and mind, yet he has not lost the faculties themselves; therefore though he be theologically dead, yet he is ethically alive, being to be wrought upon by arguments. Hence is that saying, ‘To will is of nature, to will well of grace; to will ill of corrupt nature.’ Hence we may grant those objections, that if a man had not this free-will (if you do not extend it to good things) there could be no conversion or obedience; for grace does not destroy, but perfect nature.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55623a345b" data-kw="">
<blockquote><p>For because He executes some things by general and common operation in Nature, other things by particular and proper action in the Church, hence works are accustomed to be distinguished into those of Nature and of Grace. They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. Now the works of Nature are the works of Creation, Conservation, and Governance. For these proceed from God’s common action, Gen. 1 throughout; Mt. 5:45; Acts 17:24ff., are occupied in common nature, and constitute the common principles of natural things. Which is the cause why in order of explication they are premised to the works of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>I had never read one Socinian, nor much of any Arminians… and I remembered two or three things in Dr. [William] Twisse (whom I most esteemed) which inclined me to moderation in the five Articles [disputed between Arminians and the Reformed]: … 2. That he reduces all the decrees to two, de fine et de mediis [of the end and of the means], as the healing way. 3. That he professes that Arminius and we and all the Schoolmen are agreed that there is no necessity consequentis laid on us by God in predestination, but only necessity consequentiae, or [a] logical [necessity] (but in election I shall here suspend)…</p></blockquote>

</figure><figure class="quote" id="q-81d80d519f" data-kw="spontaneity indifference">
<blockquote><p>Whether the formal reason of free will consists in indifference or in rational spontaneity. The former we deny; the latter we affirm against papists, Socinians and Remonstrants. We must oppose the error of the adversaries who place its formal reason in indifference, and establish the orthodox truth which asserts that it is placed in rational willingness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.3.2</span></figcaption>

</figure><figure class="quote" id="q-e052571c14" data-kw="">
<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences | distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that</cite>, bk. 2</span></figcaption>

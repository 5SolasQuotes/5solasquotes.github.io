<main class="wrap"><figure class="quote" id="q-840df9d4d5" data-kw="">
<blockquote><p>It’s much worthy of observation, how that sweet evangelic invitation is conceived, Isa. 55:1… For the interjection, ‘Ho’, is a mark of sorrowing, as ‘ah’, or ‘woe, everyone that thirsts’. It expresses two things: 1. A vehemency and a serious and unfeigned ardency of desire that we do what is our duty, and the concatenation of these two, extremely desired of God, our coming to Christ and our salvation. This moral connection between faith and salvation is desired of God with his will of approbation, complacency, and moral liking, without all dissimulation, most unfeignedly [margin: What the revealed will of God is]; … …we say with good reason of God’s good will, called voluntas signi, it might have its complete and entire end and effect though not any one of men or angel obey… We are hence taught to acknowledge no love to be in God which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good… yet does not the Lord’s general love fall short of what He wills to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God’s Serious &amp; Unfeigned Ardency of Desire that we do what is our Duty’ from Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London 1647), pp. 443-45 (irregular pagination: colophon lll2-lll3) &amp;, pp. 440-42 (colophon: Kkk4-Lll1)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c67f6c7c3c" data-kw="">
<blockquote><p>Having proved it [the Mosaic deliverance of the 10 Commandments] is a covenant, all the difficulty remains in declaring what covenant it is; for here is much difference of judgements, even with the learned and orthodox… Some explain it thus: God (say they) had a primary or antecedent will in giving of the Law, or a secondary and consequent: His primary will was to hold out perfect and exact righteousness, against which the apostle argues and proves no man can be justified thereby: but then God, knowing man’s impotency and inability, did secondarily command repentance and promises a gracious acceptance through Christ; and this [understanding] may be very well received, if it be not vexed with ill interpretations. But, lastly, this way I shall go: The Law (as to this purpose) may be considered more largely, as that whole doctrine delivered on Mount Sinai with the preface and promises adjoined and all things that may be reduced to it; or more strictly, as it is an abstracted rule of righteousness, holding forth life upon no terms but perfect obedience. Now take it in the former sense: it was a covenant of grace; take it in the later sense, as abstracted from Moses’s administration of it, and so it was not of grace, but works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London: Underhill, 1647), Lecture 24, on Dt. 4:13, pp. 231-33</span></figcaption>

</figure><figure class="quote" id="q-7818130c46" data-kw="">
<blockquote><p>In a wonderful and ineffable manner, that which is done even contrary to His will is not done apart from His will; for it would not happen if He did not permit it. Nor does He permit it unwillingly, but willingly. Nor would He, being good, permit evil to be done unless, being omnipotent, He were also able to bring good out of evil.” Augustine, Handbook on Faith, Hope &amp; Love, ch. 100] 2. Conditional, when He wills, some condition being put in us; so God would have all men saved on this condition, if they can believe. The first of these is by another name called Voluntas beneplaciti, the last Voluntas signi. God’s will is: 1. Secret, Voluntas propositi, that whereby He has absolutely and freely determined with Himself what He will do, permit or hinder. Ps. 115:3; Eph. 1:11; Rom. 9:18, called the will of God concerning us. 2. Revealed, Voluntas praecepti, that whereby God has manifested what He would have believed, done or left undone by his reasonable creatures, Mk. 3:35; 1 Thess. 4:3. That distinction of God’s will into beneplaciti et signi, differs little from this. Signi is the same with revealed. Beneplacitum is the decree properly so called, which may be either hidden or manifest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 2, ch. 7, ‘Of God’s Understanding that He is Omniscient, and of his Will’ | “The will of God is one and the same, but it is distinguished:¹ | 2. In respect of application to the creature, into: | 1. Absolute, when God wills and concludes anything concerning us without any condition in us.²</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-22d49744d1" data-kw="">
<blockquote><p>Question 9. Whether every will of God is fulfilled? Denied with a distinction. Answer: Concerning the will properly taken, or of good-pleasure [beneplaciti]: affirmed, Isa. 46:10. Concerning the will taken metonymically, or of command [mandati]: denied. And this opinion is insinuated by Thomas, in [Summa] pt. 1, question 19, article 6, where he disputes that every will of God is always fulfilled, together with article 11, where he distinguishes the will into [the will] of the sign and [the will] of good-pleasure. … Question 11. By what will can anyone justly will that which God does not will? Explained. Answer: We thus explain it: by a right will, which is conformable to the law and general command of God, one can will that which God does not will by the will of good-pleasure, or the hidden [will]. See Gen. 22, compared with Heb. 11:17 and 2 Sam. 7:2-3, 13. Question 12, Whether the precepts of God sometimes differ from his will? Affirmed with a distinction. Answer: In the proximate object they differ: for of the precept, or command, there can be another object—and indeed an opposite one—than [that] of the will or good-pleasure. As is manifest, Gen. 22, where the proximate object of the divine command given to Abraham was the slaying [mactatio] of Isaac; and the object of the good-pleasure, or of the divine will properly so called, was the non-slaying of the same. But although the objects of the will of command and of good-pleasure are opposed among themselves, yet the acts of command and of will are not opposed, but the former is subordinated to the latter. For God, by the will of good-pleasure, willed the command, or to command Abraham; but He did not will the thing commanded to Abraham, or the fulfillment of the commanded thing.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Question 9. Whether every will of God is fulfilled? Denied with a distinction. Answer: Concerning the will properly taken, or of good-pleasure [beneplaciti]: affirmed, Isa. 46:10. Concerning the will taken metonymically, or of command [mandati]: denied. And this opinion is insinuated by Thomas, in [Summa] pt. 1, question 19, article 6, where he disputes that every will of God is always fulfilled, together with article 11, where he distinguishes the will into [the will] of the sign and [the will] of good-pleasure. … Question 11. By what will can anyone justly will that which God does not will? Explained. Answer: We thus explain it: by a right will, which is conformable to the law and general command of God, one can will that which God does not will by the will of good-pleasure, or the hidden [will]. See Gen. 22, compared with Heb. 11:17 and 2 Sam. 7:2-3, 13. Question 12, Whether the precepts of God sometimes differ from his will? Affirmed with a distinction. Answer: In the proximate object they differ: for of the precept, or command, there can be another object—and indeed an opposite one—than [that] of the will or good-pleasure. As is manifest, Gen. 22, where the proximate object of the divine command given to Abraham was the slaying [mactatio] of Isaac; and the object of the good-pleasure, or of the divine will properly so called, was the non-slaying of the same. But although the objects of the will of command and of good-pleasure are opposed among themselves, yet the acts of command and of will are not opposed, but the former is subordinated to the latter. For God, by the will of good-pleasure, willed the command, or to command Abraham; but He did not will the thing commanded to Abraham, or the fulfillment of the commanded thing.”

— Gisbertus Voetius, Problems on God, pt. 5 in Select Theological Disputations, pt. 5 (Utrecht, 1669) tr. AI by Roman Prestarri Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion+9.+Whether+every+will+of+God+is+fulfilled%3F+Denied+with+a+distinction.+Answer%3A+Concerning+the+will+properly+taken%2C+or+of+good-pleasure+%5Bbeneplaciti%5D%3A+affirmed%2C+Isa.+46%3A10.+Concerning+the+will+taken+metonymically%2C+or+of+command+%5Bmandati%5D%3A+denied.+And+this+opinion+is+insinuated+by+Thomas%2C+in+%5BSumma%5D+pt.+1%2C+question+19%2C+article+6%2C+where+he+disputes+that+every+will+of+God+is+always+fulfilled%2C+together+with+article+11%2C+where+he+distinguishes+the+will+into+%5Bthe+will%5D+of+the+sign+and+%5Bthe+will%5D+of+good-pleasure.+%E2%80%A6+Question+11.+By+what+will+can+anyone+justly+will+that+which+God+does+not+will%3F+Explained.+Answer%3A+We+thus+explain+it%3A+by+a+right+will%2C+which+is+conformable+to+the+law+and+general+command+of+God%2C+one+can+will+that+which+God+does+not+will+by+the+will+of+good-pleasure%2C+or+the+hidden+%5Bwill%5D.+See+Gen.+22%2C+compared+with+Heb.+11%3A17+and+2+Sam.+7%3A2-3%2C+13.+Question+12%2C+Whether+the+precepts+of+God+sometimes+differ+from+his+will%3F+Affirmed+with+a+distinction.+Answer%3A+In+the+proximate+object+they+differ%3A+for+of+the+precept%2C+or+command%2C+there+can+be+another+object%E2%80%94and+indeed+an+opposite+one%E2%80%94than+%5Bthat%5D+of+the+will+or+good-pleasure.+As+is+manifest%2C+Gen.+22%2C+where+the+proximate+object+of+the+divine+command+given+to+Abraham+was+the+slaying+%5Bmactatio%5D+of+Isaac%3B+and+the+object+of+the+good-pleasure%2C+or+of+the+divine+will+properly+so+called%2C+was+the+non-slaying+of+the+same.+But+although+the+objects+of+the+will+of+command+and+of+good-pleasure+are+opposed+among+themselves%2C+yet+the+acts+of+command+and+of+will+are+not+opposed%2C+but+the+former+is+subordinated+to+the+latter.+For+God%2C+by+the+will+of+good-pleasure%2C+willed+the+command%2C+or+to+comm <blockquote><p>Another reason is taken according to another way of distinguishing: because some are signs of the absolute divine will, others of the conditional. I say, therefore, that because one cannot act against the absolute will, one cannot act against the signs of the absolute will, such as are fulfillment and permission. But because one can act against the antecedent or conditional will, because man can turn away from the order to which he was created by his institution: hence it is that one can act against the will of the sign which signifies that, namely against prohibition, precept, and counsel.</p></blockquote>

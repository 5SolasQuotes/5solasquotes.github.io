<blockquote><p>Q. What is the decree?

A. That whereby God hath from eternity set down with himself whatsoever shall come to pass.

Expos. 1. All things with their causes, effects, circumstances, and manner of being are decreed by God. Act. 2. 23. and 4. 27. 28. Eph. 1. 11. This decree is most wise, Rom. 11. 33. iust, Rom. 9. 13. 14. eternal, Eph. 1. 4. 5. 2. Thes. 2. 13. Act. 15. 18. 1. Cor. 2. 7. necessary, Psal. 33. 11. Pro. 19. 21. unchangeable, Heb. 6. 17. most free, Rom. 9. 18. and cause of all good, Jam. 1. 17. but not of any sin, 1. Jo. 1. 5. The special decree of God concerning Angels and men is called predestination. Rom. 8. 30. of the former little is spoken in holy Scripture, of the latter more is revealed, not unprofitable to be known.

It may be defined, the wise, free, just, eternal, and unchangeable sentence or decree of God. Eph. 1. 11. determining with himself, to create and govern man for his special glory, viz. the praise of his glorious mercy, or great justice, Rom. 9. 17. 18. Rom. 11. 36. Of this decree there be two parts: Election and Reprobation. 1. Thes. 5. 9. Jude. 4. v. Election is the decree of God, of his free love, grace, and mercy, choosing some men to faith, holiness, and eternal life, for the praise of his glorious mercy. 1. Thes. 1. 4. 2. Thes. 2. 13. Eph. 1. 4. 5. 6. Rom. 8. 29. 30. The cause which moved the Lord to elect them who are chosen, was none other but his mere good-will and pleasure. Luk. 12. 32. Rom. 11. 5. and 9. 11. 16. Eph. 1. 5. 2. Tim. 1. 9. The end, is the manifestation of the riches of his grace and mercy, Rom. 9. 23. Eph. 1. 2. The sending of Christ, faith, holiness, and eternal life are the effects of God’s love, by which he manifesteth the infinite riches of his grace. Jo. 3. 16. 1. Jo. 4. 10. Act. 13. 48. Tit. 1. 1. Col. 1. 12. Rom. 6. 23.

In the same order, God doth execute this decree in time, he did decree it in his eternal counsel. 1. Thes. 5. 9. 2. Thes. 2. 13. Reprobation is the wise, just, and absolute decree of God, ordaining to leave some men unto themselves, to suffer them to fall, and to inflict upon them eternal punishment, deserved by their sins, for the praise of his unspeakable and great justice. Rom. 9. 11. 13. 22. Jude. 4. v. Jer. 6. 30. The cause of this decree is the absolute will and good pleasure of God. Mat. 11. 26. Rom. 9. 13. man’s sin is the cause why God will punish, but no occasion why he did ordain to pass by, or to punish man, Rom. 9. 18. 20.

This decree is just, because God hath power over man, as the potter hath over his clay, to make one vessel to honour, and another unto dishonour. Rom. 9. 21. Jer. 18. 6. Matth. 20. 15. The end hereof is not the condemnation of the creature, but the manifestation of God’s justice. Rom. 9. 22. Sin is the effect of man’s free will, and condemnation is an effect of justice, inflicted upon man for sin and disobedience. Jo. 3. 18. and 12. 37. 38. 39. 40. 2. Thess. 2. 9. 10 but the decree of God which is good, is the cause of neither. Ps. 5. 4. A man in this life may be assured of this election. 2. Pet. 1. 10. 1. Thes. 1. 4. and eternal happiness. Matth. 24. 24. Jo. 10. 28. 29. Rom. 8. 33. 34. 2. Tim. 2. 19. but not of his reprobation, for he that is now profane, may be called hereafter. Matth. 20. 5. 6.</p></blockquote>

<blockquote><p>Sovereignty is a comprehensive term. It contains several elements. First it denotes supremacy. A sovereign ruler is supreme in his dominions. All other rulers are under him. Secondly, sovereignty denotes independence. Says Woolsey, ‘In the intercourse of nations certain states have a position of entire independence of others. They have the power of self-government, that is, of independence of all other states as far as their own territory and citizens are concerned. This power of independent action in external and internal relations constitutes complete sovereignty.’ (Political Science, i., 204) Thirdly, sovereignty denotes optional power; that is, the power to act or not in a given instance. It is more particularly with reference to this latter characteristic of free alternative decision, that ‘the sovereignty of God in election’ is spoken of. In his election of a sinner to salvation, God as supreme, independent, and sovereign, acts with entire liberty of decision, and not as obliged and shut up to one course of action. This is the common understanding and definition of sovereignty as applied to decisions and acts. Says Blackstone [one of the most influential writers on English law]: ‘By the sovereign power is meant the power of making laws; for wherever that power resides all other powers must conform to, and be directed by it, whatever appearance the outward form and administration of the government may put on. For it is at any time in the option of the legislature to alter that form and administration by a new edict or rule, and put the execution of the law into whatever hands it pleases, by constituting one, or a few, or many executive magistrates.’ (Introduction, 2) Blackstone gives the same definition of sovereignty, when it is vested in a king (Book II., ch. vii.). The king has no superior to oblige or compel him to one course of action. He has independent and optional power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (1893; Banner of Truth, 1993), pp. 70-71</span></figcaption>

<blockquote><p>Question 20. Did God leave all mankind to perish in the estate of sin and misery; A. God having out of his mere good pleasure, from all eternity, elected some to everlasting life… to deliver them out of an estate of sin and misery; and to bring them into an estate of salvation by a Redeemer. Q. 1. Are same persons chosen to salvation, and others left? A. Yes: God has chosen some to salvation, and passed by others; as the Scriptures speak; See Rom. 8:30… … Q. 7. What learn you from God’s election? What cause we have to admire free-grace in our choice, who were no better than others; Eph. 2:3. And were by nature children of wrath even as others.</p></blockquote>

<blockquote><p>4. Eternal life does not come to anyone by chance, for it is a lot that God, according to the good pleasure of His will, assigns only to those whom He has decreed and not to others. If the entire plan of the lot is from Jehovah in the distribution of earthly inheritances [Prov. 16:33], then much more does the heavenly inheritance depend on His good pleasure. Therefore, it should never be admitted that some were saved in the past or are being saved now by the chance mercy of God.</p></blockquote>

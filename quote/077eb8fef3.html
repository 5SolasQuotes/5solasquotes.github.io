<main class="wrap"><figure class="quote" id="q-077eb8fef3" data-kw="">
<blockquote><p>Let no one say, ‘You cannot forgive my sins.’ How can the almighty not? But you insist: ‘I have sinned much.’ I also insist: ‘But he is almighty.’ And you: ‘Such are the sins that I have committed that I cannot be freed or purified from them.’ I answer: ‘But he is almighty.’ See what you sing to him in the psalm: ‘Bless, my soul, my soul, and do not forget the benefits of those who are merciful with all your iniquities and heal all your ailments.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon</cite>, 213.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c47a84260" data-kw="">
<blockquote><p>Secondly, God put into the soul these faculties, understanding, will, sense and appetite, which are naturally carried to things that are obvious and known, and not to things that are unknown and far removed. … Fifthly, God has put into every man, for his own preservation, a love of himself, which love is naturally good; but does then begin to be morally good, when it does accord[ing] to and help forward the love of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, (London, 1620), ch. 10, pp. 71-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-a84fb7eb54" data-kw="">
<blockquote><p>We must here observe, that not only are corrupt and disordered inclinations sins, but the thinking of evil, in as far as it is connected with an inclination and propensity to pursue it, or with a desire to practice it, is sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a></span></div>

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 113">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+here+observe%2C+that+not+only+are+corrupt+and+disordered+inclinations+sins%2C+but+the+thinking+of+evil%2C+in+as+far+as+it+is+connected+with+an+inclination+and+propensity+to+pursue+it%2C+or+with+a+desire+to+practice+it%2C+is+sin.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Commentary+on+the+Heidelberg+Catechism%2C+Q.+113&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa84fb7eb54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a84fb7eb54.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-a706c93de0" data-kw="">
<blockquote><p>And this also lies in it as it is enmity, that every part and parcel of it, if we may so speak, the least degree of it that can possibly remain in any one, whilst and where there is any thing of its nature, is enmity still. It may not be so effectual and powerful in operation as where it has more life and vigor, but it is enmity still. As every drop of poison is poison, and will infect, and every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, — it is enmity, it will poison, it will burn. That which is any thing in the abstract is still so whilst it has any being at all. Our apostle, who may well be supposed to have made as great a progress in the subduing of it as any one on the earth, yet after all cries out for deliverance, as from an irreconcilable enemy, Rom. 7:24. The meanest acting, the meanest and most imperceptible working of it, is the acting and working of enmity. Mortification abates of its force, but does not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nature, Power, Deceit &amp; Prevelancy of the Remainders of Indwelling Sin in Believers</cite>, ch. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

<blockquote><p>He, then, who admits not that all the desires of the flesh are sins, and that that disease of concupiscence, which they call a stimulus, is a fountain of sin, must of necessity deny that the transgression of the law is sin.</p></blockquote>

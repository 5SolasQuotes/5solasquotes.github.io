<blockquote><p>Christ’s flesh, that is, his humanity, should not be worshipped, since it is not Deity, that is, God. Nothing should be worshipped which is not God. This honor is proper to God alone, as it is written: You will worship the Lord your God and serve Him only (Matthew 4[:10]). We do not deny that the man Christ is to be worshipped, but we do not concede that the humanity of Christ should be worshipped in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586</cite>, ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), p. 419</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

<blockquote><p>4. The communion of effects XIII. The communio ἀποτελεσμάτων, communion of effects (1 Tim. 2:5), which is nothing other than a concurrence of both natures for the mediatorial operations, such that those works proceed from the person of the God-man through the distinct efficacy of both natures; in which these four things must be noted: (1) the producing cause, the person of the God-man, the ἐνεργῶν, the one working; (2) the two principia ἐνεργητικά, operative principles, of the producing cause, which are the two natures in the Mediator; (3) the double efficacy, according to the number of the two principles, or the double ἐνέργεια, operation, that of the divine nature and that of the human nature; (4) finally, the one work, the ἐνεργούμενον, the thing worked, or the ἀποτέλεσμα θεανδρικόν, divine-human effect, which the one Mediator produces according to his two natures through an efficacy peculiar to each. Thus for example, the one Mediator, the λυτρώτης, Redeemer, with both natures concurring as principia λυτρωτικά, redemptive principles, through a double efficacy or λύτρωσις, work of redemption, the human nature by conferring the death, and the divine nature the value of the death, procured one λύτρον or λύτρωμα, redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 4, bk. 5, ch. 4, section 13, pp. 138-39</span></figcaption>

</figure><figure class="quote" id="q-dd95c87f66" data-kw="">
<blockquote><p>When he brings in the first-begotten into the world, which was at the time of the incarnation, he says, ‘Let all the angels of God worship Him,’ Heb. 1:6. And upon his resurrection from the dead, ‘God has given Him a name which is above every name; that at the name of Jesus every knee should bow,’ that is, in a way of religious adoration, Phil. 2:9-10; and though Christ, as man, is not the object of such adoration, yet what He has done in the human nature, is a motive and argument why blessing and honor should be given to his Person, having both natures united in Him; ‘Worthy is the Lamb that was slain, to receive power, etc.’ Rev. 5:12-13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Doctrinal &amp; Practical Divinity</cite>, (Baptist Standard Bearer), p. 387</span></figcaption>

<blockquote><p>V. Our sponsor (as stated) is Christ Jesus, the only-begotten Son of God and himself God blessed forever, according to both natures. The principle which [acts] is indeed his person; the principle by which [he acts] is his nature, both human and divine. Hence there was entirely a communion in the work, but a distinction of power and mode in the operating natures. The passion formally belonged to the human nature; its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. by AI by Onku (Utrecht, 1650) Latin</span></figcaption>

</figure><figure class="quote" id="q-24451dee93" data-kw="">
<blockquote><p>…Christ Himself is not by us worshipped under any other formal reason but as He is God… 1. Jesus Christ, the Mediator, being theanthropos, God and man… is to be worshipped with divine religious worship, even as the Father…. 2. That our religious, divine and spiritual worship, has a double or two-fold respect unto Jesus Christ: (1) As He is the ultimate formal object of our worship, being God, to be blessed for evermore… (2) As the way, means and cause of all the good we receive from God in our religious approach to Him…. 3. That Jesus Christ our Mediator, theanthropos, God and man, who is to be worshipped with divine or religious worship, is to be so worshipped because He is our Mediator. That is, his mediation is the ratio quia, an unconquerable reason and argument, why we ought to love Him, fear Him, believe in Him, call upon Him, and worship Him in general… 4. Though Jesus Christ, who is our Mediator, God and man, is to be worshipped with divine worship, even as we honor the Father, yet this is not as He is mediator, but as He is God, blessed for evermore… That is, his mediatory office is not the formal cause and reason of yielding divine worship to Him, nor under that consideration is that worship ultimately terminated in Him… Now the formal cause or reason of all divine worship is the deity or divine nature.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

<main class="wrap"><figure class="quote" id="q-3deccb32a6" data-kw="">
<blockquote><p>Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11), angels, by reason of the quickness and strength of their understanding, apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London, 1654), ch. 1, Of the Divine Essence</cite>, pp. 16-17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-089a20e32e" data-kw="">
<blockquote><p>Each creature is limited by place, though spirits do not fill up a place† by commensuration of parts, yet they have a certain compass (as I may call it) beyond which their essence extends not: they are so here that they are not there; so in heaven, that they are not the same time on earth. † The angels are in an ubi [where] though not in a place properly; in English we cannot so well distinguish these words: they are limited and confined to some space; an angel cannot be at the same time in heaven and earth. But God is altogether above place, he is omnipresent, not by any material extension, but after an incomprehensible and unexpressible manner. He is quite above all place, wholly without and within all and every place, and that without all local motion or mutation of place. He is every where totally and equally…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal</cite>, p. 145</span></figcaption>

<blockquote><p>5. Duration XVII. Fifth, the duration of their existing, and its measure, through which they are not under time, by which such things are measured which by their nature admit of a beginning and end; nor under eternity, which belongs only to him who by nature can experience neither beginning nor end; but under aevum, ‘forever,’20 by which those things are measured which include a beginning by nature, but exclude an end. This aevum is congruent with time, tempus, in this, that not only does it imply a beginning of duration, but also flux or succession; this aevum is congruent with eternity in that it excludes an end of its duration. It differs from time in that it excludes an end, and from eternity in that it includes a beginning and flux. 23 The three measures of duration are tempus, aeternitas, and aevum, also called “aeviternity” or “improper eternity.” Cf. 1.2.11 §VIII.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology, ed. Joel Beeke, tr. Todd Rester (RHB, 2021)</cite>, vol. 3, bk. 3, ch. 7, The Good Angels, p. 184</span></figcaption>

ank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ba4f7ef7f" data-kw="">
<blockquote><p>The creature is limited by the circumstance of time, by which it has its being measured out as it were by parcels, past, present and to come; it had beginning, has succession and may have an end. The most glorious angel, as well as a worm, is thus limited by time; once he was not, then he began to be; that which is past is gone, and that which is to come is not yet, and he has but a little time present. But God’s essence had no beginning, has no succession, can have no end. We cannot say of it properly: It was or shall be; but alone It is, Ex. 3:14; Jn. 8:58. He has his whole being at once; not some after, some by parcels, one following another, Gen. 21:13 and 23:33; Ps. 90:2, 24; Isa. 57:15. Eternity is the continual existence and duration of the divine essence. The creatures being is a flux or perpetual flowing from one moment to another. God is a being above time, has his being measured by time, but is wholly eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal</cite>, pp. 148-49</span></figcaption>

</figure><figure class="quote" id="q-df026d6c02" data-kw="">
<blockquote><p>There is no created holiness sure, stable, and perfect in itself: The glorious angels which are, and ever shall be saints in Heaven, and the saints in Heaven who are like angels, stand not in that holy and happy estate by their own sufficiency, but by the decree and grace of God. Those angels which fell at first were holy, and they who now stand, might have fallen notwithstanding their created holiness, if God had not superadded confirming grace which establishes them forever. Yet this is not all, that the angels are imperfect because they might fall if not supported, there is somewhat more in it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job… (London: 1650), sermon on Job 15:15</cite>, pp. 62-63</span></figcaption>

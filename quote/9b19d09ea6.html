<main class="wrap"><figure class="quote" id="q-9b19d09ea6" data-kw="">
<blockquote><p>Wherfore here after it shall be declared to you what is to be understood and meant by this words ‘to be delivered from the Law,’ purposing now in few words to show that they which be regenerated and new born by faith as I have said, do receive the Holy Ghost, that there may be begun in them a new obedience or better manner of living, a new light and life-eternal, which is a beginning and an entrance into the law of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Justification of Man by Faith Only</cite>, … (London: Powell, 1548), ‘Faith’, p. 46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“Wherfore here after it shall be declared to you what is to be understood and meant by this words ‘to be delivered from the Law,’ purposing now in few words to show that they which be regenerated and new born by faith as I have said, do receive the Holy Ghost, that there may be begun in them a new obedience or better manner of living, a new light and life-eternal, which is a beginning and an entrance into the law of God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5fd1f2691" data-kw="">
<blockquote><p>§IV. It [sanctification] is distinguished from regeneration. For regeneration, strictly taken, signifies the beginning of the spiritual life; but sanctification, the progress and continuation of the spiritual life, made through the habits of the spiritual virtues, by which the faithful are gradually led to perfection, although many take regeneration in a broader sense as a synonym for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI (Frankfurt: Zeitler, 1709), p. 2 Holtzfus (1659-1717) was a German, reformed professor of philosophy and theology at Frankfurt.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

<main class="wrap"><figure class="quote" id="q-25f516dcaa" data-kw="">
<blockquote><p>In order effectively to serve the needs of human life, modern biology reconstructed the nature of the organic body, representing it not as something animated, purposive and striving, but as dead matter-in-motion. This reductive science has given us enormous power, but it offers no standards to guide its use. Worse, it challenges our self-understanding as creatures of dignity, rendering us incapable of recognizing dangers to our humanity that arise from the very triumphs biology has made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-may.html">William May</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Leon Kass &amp; the Challenge of Bioethics’</cite>, (2003) | Kass:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>5. If there be nothing taken from the parents of which the soul is formed, then it is not traduced by natural generation: but there is nothing taken from the parents by which the soul is formed; for [otherwise] then in all abortions and miscarrying conceptions the seed of the soul would perish, and by consequence the soul itself would be corruptible, as having its original from corruptible seed. These and diverse other the like arguments are used to confirm the doctrine touching the creation of the reasonabl soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Passions &amp; Faculties of the Soul of Man</cite>, (London, 1640), ch. 32, p. 394</span></figcaption>

</figure><figure class="quote" id="q-a4e31ab855" data-kw="">
<blockquote><p>III. …the formation of the body, which was completed at once, and not over a period of time, like the bodies of other men; and in the breathing in of a rational soul. Whereas in ordinary generation the time required for formation of the body is forty days, the body of Christ was absolutely completed in a moment. Otherwise Christ would have been conceived not a man but as an embryo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, (1625), ch. 16, ‘The Person of Christ the God-Man’, section 2, propositions in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-96c7c9f9d1" data-kw="">
<blockquote><p>Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, … (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Mode of Assuming, as far as the Order</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.”

— Gisbertus Voetius, A Syllabus of Theological Problems… (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Mode of Assuming, as far as the Order">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+the+Son+of+God+assumed+flesh+by+the+soul+mediating%3F+It+is+affirmed+with+a+distinction.+Whether+the+Son+of+God+assumed+a+soul+by+the+spirit+or+mind+mediating%2C+that+is%2C+the+rational+part+of+the+soul%3F+It+is+affirmed.+Whether+the+soul+was+assumed+before+the+flesh.+It+is+denied.+Whether+the+flesh+of+Christ+was+assumed+by+the+Word+before+the+union+of+the+soul%3F+It+is+denied.+Whether+the+whole+nature+was+assumed+simultaneously+through+mediating+parts%3F+It+is+distinguished.+Whether+the+human+nature+was+assumed+by+grace+mediating%3F+It+is+distinguished.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+A+Syllabus+of+Theological+Problems%E2%80%A6+%28Utrecht%2C+1643%29%2C+Tract+2%2C+On+the+Person%2C+Offices+%26+States+of+Christ+the+Mediator%2C+Title+1%2C+on+the+Person+of+Christ+the+Mediator%2C+Subtitle%3A+On+the+Assumption+%26+Union+of+the+Human+Nature.+trans.+T.+Fentiman+%7C+On+the+Mode+of+Assuming%2C+as+far+as+the+Order&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96c7c9f9d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96c7c9f9d1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Whether%20the%20Son%20of%20God%20assumed,by%20grace%20mediating%3F%20It%20is%20distinguished&amp;text=Whether%20the%20Son%20of%20God%20assumed%20flesh%20by&amp;text=was%20assumed%20by%20grace%20mediating%3F%20It%20is%20distinguished" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4055135c21" data-kw="">
<blockquote><p>Paracelsus [d. 1541] teaches that men can be produced by the chemical art in his [Opus] Paramirum [A Work Beyond-Wonder, 1531], where he makes three parts of man: elemental, celestial and divine. He denies that the first two come into heaven. There he writes thus: ‘It was doubted by the philosophers whether it could happen that a man be born outside the womb of a woman; to which I respond that it is not repugnant to chemical art and nature, but is very easy. For sperm enclosed in a cucurbit [a flask] or sealed in the womb [venter equinus] of a [living] horse, by the highest putrefaction putrefies for fifty days, until it moves, which is easy to discern. After that time, it will appear somehow similar to a fetus, yet without a body, transparent. If you then daily prudently nourish or feed this with human blood, and keep and cherish it in the equal heat of the horse’s belly, after nine months it will appear adorned with all members like an infant born from a woman, yet smaller in quantity. This thing we call a homunculus, which must afterwards be educated with careful solicitude and diligence like a true boy or infant, until it grows up.’ He adds there that those who are thus born understand all arcana and hidden things which it is otherwise impossible for men to know, because they have acquired life, body, flesh and bones by art; therefore the arts and sciences are innate to them, nor do they need to learn from elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), ‘On Creation’, pt. 10 Latin, pp. 296-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

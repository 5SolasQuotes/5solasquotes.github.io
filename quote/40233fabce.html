<main class="wrap"><figure class="quote" id="q-40233fabce" data-kw="">
<blockquote><p>But when we refuse Christ’s comforts, we refuse Himself; she who refuses to accept of a bracelet, or of a gold-ring from him who suits her in marriage, she refuses both his love, and himself, in that she refuses his love-token.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trial and Triumph of Faith</cite>, (1652) | Sermon 16, p. 184</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f817ee7328" data-kw="">
<blockquote><p>But here appeareth a manifest reason why they gave particular commandment concerning things offered to idols, blood, and that which was strangled. They were, indeed, of themselves things indifferent; yet such as had some special thing in them more than other rites of the law. We know how straitly the Lord commandeth to eschew those things which are contrary to the external profession of faith, and wherein there is any appearance or suspicion of idolatry. Therefore, lest there should any blot of superstition remain in the Gentiles, and lest the Jews should see anything in them which did not agree with the pure worship of God, no marvel if, to avoid offense, they be commanded to abstain from things offered to idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-c8c44b1c87" data-kw="">
<blockquote><p>Secondly: neither is there any contradiction in these words, of themselves: for to know which are the canonical books may be held to be a substantial point and belonging to the faith, and yet not simply necessary to salvation: he knows little if he cannot distinguish between a simple and absolute necessity, and a necessity not absolute: as some things are absolutely necessary to salvation without the which a man cannot be saved: as Heb. 10:36… But in another sense the apostles write, Acts 15:28, “It seemed good, etc. to lay no more burden upon you than these necessary things”: yet was it not simply necessary to abstain from blood and things strangled, but convenient and profitable for that time because of offence: so to know which books are canonical, though it be not simply necessary to salvation, if a man hold the foundation: yet is it necessary, as a profitable mean for the increase of faith: and though it be not so substantial as the foundation of faith, yet is it substantial, as many necessary parts in an house are beside the foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retection, or Discovery of a False Detection Containing a True Defence of Two Books, entitled, Synopsis Papismi, and Tetrastylon Papisticum</cite>, (1603), pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

ly%3A%20neither%20is%20there%20any%20contradiction%20in%20these&amp;text=parts%20in%20an%20house%20are%20beside%20the%20foundation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-37f089a21d" data-kw="">
<blockquote><p>Question 19: May one [de]part from a husband or wife that has the leprosy or that has the French pox [syphilis] by their adulterous practices, when the innocent persons life is endangered by it. Answer: If it be an innocent person’s disease, the other must cohabit, and tenderly cherish and comfort the diseased; yea, so as somewhat to hazard their own lives, but not so as apparently to cast them away, upon a danger not like[ly] to be avoided, unless the other’s life, or some greater good be like[ly] to be purchased by it. But if it be the pox of an adulterer, the innocent party is at liberty [to divorce] by the other’s adultery, and the saving of their own lives does add thereto. But without adultery the disease alone will not excuse them from cohabitation, though it may from congress [coming together in sexual union].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’, p. 539</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

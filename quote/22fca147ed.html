<blockquote><p>There is no dispute about the doctrine of election, or any of the discriminating doctrines of grace. The question does not turn upon what are the causes of salvation, but rather upon what are the causes of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preface.html">T. E. Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Summary of Andrew Fuller’s The Gospel Worthy of All Acceptation</cite>, in Puritan Papers, vol. 1 (1959)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d590d39b0" data-kw="">
<blockquote><p>But God (says Simon Magus) would not that Adam should have eaten of the forbidden fruit, who nevertheless did eat of that fruit; it follows therefore that he remained not as his Creator would have had him to have remained; how then can God be omnipotent, or his will always fulfilled? It were necessary, if we should fully satisfy this argument, to entreat more largely of the will of God than were convenient for this place: wherefore, that we may briefly answer this objection, we must presuppose with the school-divines a threefold distinction of the will of God, according to the diversity of their proper objects:¹ the first they call his efficient, effectual, or working will, by which God does so effectually intend anything that He performs it actually by some external operation and work, either actually produced or to be produced. ¹ Aquinas, [Summa] pt. 1, quest. 19; the same: Molina, Vasquez, Suarez, Sumel, Bannez and many others. The other kind of will which the divines distinguish in God, in regard of some objects which He does not really produce, is called inefficax voluntas, a kind of propension or inclination of his divine will to the effectuating of any good effect, which might redound to the felicity of man: yet for the attaining of the end, which out of his unsearchable wisdom He has prefixed, He oftentimes permits the contrary to this his divine inclination and will; the which therefore is called God’s permissive will. As for example, God would that all men should be saved, according to that of the apostle [1 Tim. 2:4], Deus vult omnes homines saluos fieri; to wit, in his universal grace, calling and inspirations and other general means, offered to all, so that out of his infinite goodness He wishes and wills in this sort all to be saved; and that He might the more manifest his infinite mercy by the efficacy of his working will, He actually saves some; even so, to manifest his justice by his other permissive decree, He permits others to work their own ruin and eternal damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-salkeld.html">John Salkeld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Paradise</cite>, … (London: Griffin, 1617), ch. 64, pp. 319-21 Salkeld (1576–1660) was born in England, studied with Jesuits in the university of Coimbra and in Portugal, but had become a protestant again living in England by the time of this work.</span></figcaption>

<blockquote><p>amor Dei: the love of god; i.e., both the love of creatures for God and the divine attribute of love… Considered as a divine attribute, the amor Dei can be defined as the propensity of the divine essence or nature for the good, both in the sense of God’s inward intrinsic, benevolentia, or willing of the good, and in the sense of God’s external, extrinsic, beneficentia, or kindness, toward his creatures… the amor Dei communis is directed toward all human beings, both elect and reprobate, and is manifest in the blessings, or benefits (beneficia), of God… the amor Dei communis is understood to be benevolentia in the strict sense of goodwill toward human beings…</p></blockquote>

</figure><figure class="quote" id="q-0480249b8d" data-kw="">
<blockquote><p>I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-matheson.html">Duncan Matheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and Labors of Duncan Matheson</cite>, (Kilmarnock: Ritchie, n.d.), p. 26, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love, n.d., p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ooks Online</a></div>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.”

— Richard Muller, Dictionary of Latin &amp; Greek Theological Terms Drawn Principally from Protestant Scholastic Theology 2nd ed. (Baker Academic, 2017), pp. 41-42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cappetitus%3A+appetite%2C+desire%3B+specifically%2C+the+appetitive+faculty+or+capacity+of+a+being%2C+which+seeks+out+or+inclines+toward+a+good.+In+all+spiritual+beings%2C+including+God%2C+the+exercise+of+will+implies+appetite.+By+extension%2C+the+propensities+of+inanimate+objects%2C+and+even+of+matter%2C+can+be+described+as+appetite%E2%80%A6+Scholastic+theology+and+philosophy+focus+in+particular+upon+the+appetites+of+finite+spiritual+beings%2C+which+by+nature+seek+out+their+own+good.+Since+the+fall+has+caused+a+deprivation+and+distortion+of+desire%2C+a+distinction+must+be+made+between+appetitus+rectus%2C+right+desire%2C+and+appetitus+perversus+or+inordinatus%2C+perverse+or+inordinate+desire.+It+is+characteristic+of+the+desire+of+sinful+beings+that+it+misidentifies+the+good%2C+particularly+ultimate+good%2C+and+perversely%2C+or+inordinately%2C+desires+finite+things+as+ends+in+themselves+%28see+frui%29.+Thus+appetitus+perversus+and+appetitus+inordinatus+%28q.v.%29+are+synonyms+for+sin+%28peccatum%2C+q.v.%29.+Appetite+can+be+distinguished+further+into+natural+appetite+%28appetitus+naturalis%29%2C+rational+or+voluntary+appetite+%28appetitus+rationalis+sive+voluntarius%29%2C+and+animal+or+sensual+or+sensitive+appetite+%28appetitus+animalis+sive+sensualis%3B+appetitus+sensitivus%29.+Natural+appetite+is+simply+the+nature+of+any+existent+thing+to+be+what+it+is+and+to+perform+its+proper+acts+or+operations%3B+e.g.%2C+human+beings+have+a+natural+appetite+for+breathing%21+The+rational+or+voluntary+appetite%2C+also+called+appetitus+intellectualis%2C+intellectual+appetite%2C+is+the+will+%28voluntas%2C+q.v.%29.+Whereas+it+is+the+intellect+%28intellectus%2C+q.v.%29+that+perceives+and+knows+objects%2C+it+is+the+will+that+chooses.+Since+choice+belongs+to+the+will%2C+the+will+must+be+exercised+in+the+choice+of+even+purely+intellectual+objects%E2%80%94thus+appetitus+intellectualis.+In+addition%2C+since+the+will+and+the+intellect+are+not+really+distinct%2C+but+only+formally+or+rationally+distinct+%28see+distinctio%29%2C+the+appetitive+function+of+will+is+also+rational+%28rationalis%29.+Thus+the+will+desires+the+goodness%2C+truth%2C+and+justice+known+by+the+intellect%E2%80%A6+The+appetitus+animalis+sive+sensualis+or+appetitus+sensitivus+is+thus+emotion+or+passion+%28affectus%2C+passio%29%2C+and+it+may+be+described+in+terms+of+the+six+concupiscible+%28concupiscibilis%2C+q.v.%29+passions%3A+love+and+hate%2C+joy+and+sadness%2C+desire+and+aversion%3B+and+of+the+five+irascible+%28irascibilis%2C+q.v.%29+passions%3A+courage+and+fear%2C+hope%2C+despair%2C+and+anger.+This+appetite%2C+because+of+its+relation+to+the+body%2C+is+usually+described+as+being+situated+%E2%80%9Cbelow%E2%80%9D+the+will+in+the+hierarchy+of+human+faculties.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Dictionary+of+Latin+%26+Greek+Theological+Terms+Drawn+Principally+from+Protestant+Scholastic+Theology+2nd+ed.+%28Baker+Academic%2C+2017%29%2C+pp.+41-42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a6cb97172.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a6cb97172.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=appetitus%3A%20appetite%2C%20desire%3B%20specifically%2C%20the%20appetitive,in%20the%20hierarchy%20of%20human%20faculties&amp;text=appetitus%3A%20appetite%2C%20desire%3B%20specifically%2C%20the%20appetitive%20faculty%20or&amp;text=the%20will%20in%20the%20hierarchy%20of%20human%20faculties" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

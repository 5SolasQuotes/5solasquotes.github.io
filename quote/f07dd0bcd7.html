<main class="wrap"><figure class="quote" id="q-f07dd0bcd7" data-kw="">
<blockquote><p>Reply to Objection 4: Nothing prevents one and the same thing being loved under one aspect, while it is hated under another. God loves sinners insofar as they are existing natures; for they have existence and have it from Him. In so far as they are sinners, they have not existence at all, but fall short of it; and this in them is not from God. Hence under this aspect, they are hated by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1, Question 20, God’s Love, Article 2, ‘Whether God Loves All Things?’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

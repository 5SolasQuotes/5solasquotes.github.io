<main class="wrap"><figure class="quote" id="q-f7b5874a2c" data-kw="">
<blockquote><p>the entire history of the human race, from the apostasy to the final judgment, is a dispensation of forbearance in respect to the reprobate, in which many blessings, physical and moral, affecting their characters and destinies forever, accrue even to the heathen, and many more to the educated and refined citizens of Christian communities. These come to them through the mediation of Christ, and coming to them now, must have been designed for them from the beginning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement</cite>, pp. 358 ff., as quoted by Louis Berkhof below.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff35eaf9cf" data-kw="">
<blockquote><p>We must not view these ways of talking about the love of God as independent, compartmentalized, loves of God… as if each were hermetically sealed off from the other… If you absolutize any one of these ways in which the Bible speaks of the love of God, you will generate a false system that squeezes out other important things the Bible says, thus finally distorting your vision of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-a-carson.html">D.A. Carson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Difficult Doctrine of the Love of God</cite>, (Crossway, 2000), pp. 23, 75, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love (n.d.), p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-30acc8691f" data-kw="">
<blockquote><p>Nebuchadnezzar… was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven… And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation. And all the inhabitants of the earth are reputed as nothing: and He doeth according to his will in the army of heaven, and among the inhabitants of the earth… At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dan., 4:33-36</cite></span></figcaption>

</figure><figure class="quote" id="q-5363ba0ffb" data-kw="">
<blockquote><p>[1] If you interpret it of his divine love, the difficulty will not be great; for there is a general and common love, and a special love. With the first, God loves all his creatures, especially mankind, and amongst them those that have any strictures of his image in them more than others. But then there is a special love, and so all those are saved whom God thus loves…. Now this will easily solve the matter; there was a general love, or a liking and approbation of those moral virtues and good things which He saw in him [the rich young ruler], but not that special love which brings grace and salvation along with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 16, p. 457 on Mk. 10:21-23, “Then Jesus beholding him loved him, and said unto him… And he was sad at that saying, and went away grieved.”</span></figcaption>

</figure><figure class="quote" id="q-f272c40d97" data-kw="">
<blockquote><p>Common grace is great and undeserved mercy to a sinner, and would save him if he did not resist and frustrate it. In and by it, ‘God commandeth all men everywhere to repent,’ and whoever repents will find mercy… Scripture denies that God is under obligation to follow up his defeated common grace with his irresistible special grace. It asserts his just liberty to do as He pleases in regard to imparting that measure of grace which produces the new birth, and makes the sinner ‘willing in the day of God’s power.’… God sincerely desires that the sinner would hear his outward call, and that his common grace might succeed with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 5, pp. 48-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

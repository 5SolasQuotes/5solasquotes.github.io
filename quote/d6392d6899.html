<main class="wrap"><figure class="quote" id="q-d6392d6899" data-kw="">
<blockquote><p>The first great object of Christian love is God. And rightly to understand the nature, or estimate the value of this affection, it is necessary to bear in mind the natural condition of the human heart with respect to God. That is a condition of aversion and enmity. We cannot imagine more strong or energetic language than that which is employed in the Scriptures to describe it. “The carnal mind is enmity against God; for it is not subject to the law of God, neither indeed can be.” Rom. viii. 7. The mind, in its natural condition, not merely discovers its enmity, but is, in its very constitution, enmity itself, nor, until it is wholly renewed by the sanctifying operation of the Spirit, can it be otherwise than opposed to God and his law.

This sinful condition of man is proved by the whole of his history, if we only contemplate his conduct with relation to the character, or the commands, or the will of God. Instead of gratefully acknowledging God under the character in which he is revealed in the Scriptures, men are disposed to create an image after their own fancy, and bow down before it; instead of joyfully meeting his commandments, they are universally disobeyed; and instead of meekly bearing his will, it is blamed and resisted. Can there be plainer or fuller evidence of a state of alienation and enmity?

To overcome this enmity and to beget love for God, he is presented in the Scriptures under the most endearing character. One example may be cited from the 5th chapter in the second epistle to the Corinthians, where the apostle proclaims, “God was in Christ reconciling the world unto himself, not imputing their trespasses unto them;” and then, on the ground of that revelation, addresses the exhortation, “Be ye reconciled to God.” Jehovah is set forth calling upon sinners, offering to them pardon, entreating them to return, and providing for their eternal good.

It is the office of the Spirit to open the mind to an apprehension of him in this endearing revelation; and as soon as he is thus seen by the eye of faith, the soul becomes filled with sorrow and shame for having sinned against him—it is overcome by an affecting sense of his grace and mercy—estrangement gives place to fellowship, and enmity to love, and the result of this operation is reconciliation to God. So long as the mind is unenlightened by the Spirit, and apprehends not God, as he is revealed in Christ, there is enmity against him; but as soon as it is enabled thus to behold him, its enmity is overcome, and it is constrained to love him.

Nor will this love remain concealed in the heart. It will soon express itself in many outward manifestations. Gratitude will flow from the lips under a deep sense of undeserved favours; zeal will prompt to vigorous exertion for the honour of God; the heart will repose with confidence in him, conscious of security; and the delight of the whole man will be in God and his ways, saying with David, “Whom have I in heaven but thee? and there is none upon the earth that I desire besides thee.”

Christians should feel the imperative duty of cultivating this love to God. They should meditate much upon the character and love of God. Did they select such a passage as that in Rom. v. 6-8, and enter into its views, how deeply would it affect them? “When we were without strength, in due time Christ died for the ungodly. For scarcely for a righteous man will one die, yet peradventure for a good man some would even dare to die. But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.”

Think of him who loved us, of the manner in which he expressed his love, and of the character and condition of those whom he loved; and surely it must be felt that it is both our duty and privilege to love God, and not to rest without seeking to reach the holy and heavenly requirement, “Thou shalt love the Lord thy God with all thy heart, with all thy soul, and with all thy mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fruit of the Spirit – Love in Christian Miscellany</cite></span></figcaption>

<blockquote><p>Objection: These gracious effects and fruits of singing Psalms, do plead as much for singing and playing with instruments, as for singing with voices. Answer 1: This last effect of singing to the glory of God with our glory is peculiar only to singing with our tongues. Answer 2: Suppose it were true that these effects of singing Psalms did plead as much for singing and playing with instruments, as singing with voices; yet evident it is that singing with voices had the preeminence, as that which uttering the Word of God did chiefly utter the Spirit of God breathing in it. And withal evident likewise it is that it is no impeachment to an ordinance that the outward dispensing of it may be performed by Nature and Art; but notwithstanding that it may be accompanied of God with a spiritual blessing. Answer 3: Singing with instruments was typical, and so a ceremonial worship and therefore is ceased. But singing with heart and voice is a moral worship such as it written in the hearts of all men by Nature.</p></blockquote>

<blockquote><p>But there is another intention not religious: if a child read a chapter of the Bible that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’; And here the object, not being religious, the intrinsic operation cannot raise up any religious intention of the child. Upon this ground it is easy to determine whether or no[t] an intention of worship be essential to worship or not. The former intention, which is intrinsic, and intentio operis [the intention of the operation], may be essential, it resulting from the object; but the latter intention of the worker, is so far extraneous to worship, as whether it be or be not the nature of worship, [that it] is not impaired, nor violated.</p></blockquote>

<blockquote><p>I come now to say somewhat of the antiquity of musical instruments. But that these were not used in the Christian church in the primitive times, is attested by all the ancient writers with one consent. Hence they figuratively explain all the places of the Old Testament, which speak of musical Instruments; as I might easily show by a 1000 testimonies, out of Clement of Alexandria, Basil, Ambrose, Jerome, Augustine, Chrysostom, and many others. I can hardly forbear laughing, when I meet with some of their allegorical interpretations. An instrument with 10 strings, according to them signifies the 10 Commandments, as the unknown author of the commentary upon the Psalms among Jerome’s works, often explains it, in Psalm 32:2, 43:4, etc. But the pleasantest fancy is the explanation of these words: praise him with stringed instruments and organs. Psalm 150:4 “That the guts being twisted by reason of abstinence from food and so all carnal desires being subdued, men are found fit for the kingdom of god to sing his praises.” But Chrysostom talks more handsomely.” As the Jews praised God with all kind of instruments; so we are commanded to praise him with all the members of our bodies, our eyes etc.” In Psalm 150. And Clement of Alexandria talks much to the same purpose (Paedagog. lib. 2.c. 4). Besides the ancients thought it unlawful to use those instruments in God’s worship. Thus the unknown author of a treatise among Justin Martyr’s works. “Q: If songs were invented by unbelievers with a design of deceiving, and were appointed for those under the law, because of the childishness of their minds, why do they who have received the perfect instructions of grace, which are most contrary to the aforesaid customs, nevertheless sing in the churches just as they did who were children under the law? A: Plain singing is not childish, but only the singing with lifeless organs, with dancing and cymbals, etc. Whence the use of such instruments and other things fit for children is laid aside, and plain singing only retained.” Chrysostom seems to have been of the same mind, and to have thought the use of such instruments was rather allowed the Jews in consideration of their weakness, than prescribed and commanded. In Psalm 150. But that he was mistaken, and that musical instruments were not only allowed the Jews, as he thought, and Isidorius of Pelusium (whose testimony I shall mention presently) but were prescribed by God, may appear from the texts of scripture I have before referred to. Clement, as I have mentioned already, thought these things fitter for beasts, than for men. And though Basil commends, and stiffly defends the way of singing by turns; yet he thought musical instruments unprofitable and hurtful. He calls them, “the inventions of Jubal of the race of Cain.” And a little after he thus expresses himself: “Laban was a lover of the harp, and of music, with which he would have sent away Jacob: if thou hast told me, said he, I would have sent the away with murder, And musical instruments, and an harp. But the patriarch avoided that music, as being a thing that would hinder his regarding the works of the Lord, and his considering the works of his hands.” (Comment in Is. c.v. p. 956, 957). And a little before, he says thus: “In such mean arts, as playing upon the harp or pipe, or dancing, as soon as the action ceases, the work itself finishes. So that really, according to the Apostle’s expression, the end of these things is destruction.” (Page 955). Isidore of Pelusium, who lived since Basil, held, music was allowed the Jews by God, in a way of condescension to their childishness: “if God,” says he, “or with bloody sacrifices, because of men’s childishness at that time; why should you wonder, he bore with the music of an harp and a psaltery?” (Epist. lib. 2. ep. 176). Nay, there are some ecclesiastical officers in the Church of England, who, for their very profession and employment, would have been kept from the communion of the church, except they desisted from it. So we are informed by the Apostolical Constitutions: “if any come to the mystery of godliness, being a player upon a pipe, a lute, or an harp; Let him leave it off, or be rejected.” (Lib. 8. c. 32). From what has been said, it appears that no musical instruments were used in the pure times of the church. It became Antichristian, before they were received. Bellarmine himself does not deny, they were late brought into the church.”The second ceremony,” says he, “Are the musical instruments, which began to be used in the service of the church, in the time of Pope Vitallian, about the year 660, as Platina relates out of the Pontifical as Aimonius rather thinks (lib. iv. De gest. Francorum, c. 114). After the year 820, in the time of Lewis the Pius.” (De Missa, lib. ii. c. 15. Item, De bon. oper. lib. 1. c. 17). Dr. N. would hardly have denied, the church of Rome was become Antichristian when they were first brought in; even though we should allow Bellarmine’s first date of them to be the true one. But a Reformed divine may well be ashamed of that antiquity, that does not exceed the rise of Antichrist. But I am fully satisfied both Bellarmine’s dates are false, and that instrumental music in the worship of God, is much later than either of those accounts allow. For as to Platina, he seems to suspect that the truth of what he wrote: “Vitalian,” says he, “being careful about the worship of God, made an ecclesiastical rule, and ordered the singing, with the addition(as something) of organs.” (In Vital). Again, Bellarmine’s Aimonius is not the true Aimonius…. Farther, that these instruments were not used in God’s worship, in Thomas Aquinas’s time, that is about the year 1250, he himself his witness.”In the old law,” says he, “God was praised both with musical instruments and human voices, and according to that Psalm 33. ‘Praise the Lord with harp, Sing on to him with the psaltery, and an instrument of ten strings.’ But the church does not use musical instruments to praise God, lest she should seem to Judaize. Therefore by parody of reason, she should not use singing.” (2a2ae 91, art. 4 and conclus. 4). The like objection is used by our author. But Thomas answers: “as to this objection, we must say, as The philosopher (Lib. 8, Polit). ‘The pipes are not to be used for teaching, nor any artificial instruments, as the harp, or the like: But whatever will make the hearers good men. For these musical instruments rather delight the mind, then form it to any good disposition.’ But under the Old Testament such instruments were used, partly because the people were harder and more carnal; upon which account they were to be stirred up by these instruments, as likewise by earthly promises; and partly because bodily instruments were typical of something.” Upon which place Cardinal Cajetan gives us this comment: “It Is to be observed, the church did not use organs in Thomas’s time. When’s, even to this day, the church of Rome does not use them in the pope’s presence. And truly it will appear, that musical instruments are not to be suffered in the ecclesiastical offices we meet together to perform, for the sake of receiving internal instruction from God; and so much the rather are they to be excluded, because God’s internal discipline exceeds all human disciplines, which rejected these kinds of instruments.” (Cit. Hoffa. Lex. voce. Musica). If anyone objects the practice of some foreign churches, I answer with Mr. Hickman: “They are laid aside by most of the Reformed Churches; no would they they be retained among the Lutherans, unless they have forsaken their own Luther; Who, by the confession of Eckhard, reckoned organs among the “ensigns of Baal.” That they still continue in some of the Dutch churches, is against the minds of the pastors. For in the National Synod at Middleburg, in the year 1581, and in the Synod of Holland and Zeeland, in the year 1594, it was resolved, that they would endeavor to obtain of the magistrate laying inside of organs, and the singing with them in the churches, even out of the time of worship, either before or after sermons: so far are those synods from bearing with them in the worship itself.” (Apol. p. 139). The church of England herself had formerly no good opinion of these musical instruments; as may appear by her homilies: “lastly, God’s vengeance hath been, and is daily provoked, because much wicked people pass nothing to resort unto the church; either for that they are so sore blinded, that they understand nothing of God or godliness, and care not with devilish malice to offend their neighbors; or else for that they see the church altogether scoured of such gay gazing sights, as their gross fantasy was so greatly delighted with; because they see the false religion abandoned, and the true restored which seemed an unsavory thing to their savory taste, as may appear by this that a woman said to her neighbor: ‘Alas! gossip, what shall we do now at church, since all the saints are taken away; since all the goodly sites we were wont to have are gone; since we cannot hear the like piping, singing, chanting, and playing upon the organs that we could before?’ But dearly beloved, we are greatly to rejoice and give God thanks, that our churches are delivered out of all those things, which displeased God so sore, and filthily defiled his holy house, and his place of prayer.” (Hom. of the place and time of prayer part 2. p. 131). A great number also of the clergy in the first convocation of Queen Elizabeth in 1562, earnestly labored to have organs, and that pompous theatrical way of singing laid aside, and missed the carrying it but by one vote, as I observe elsewhere. And in this Archbishop Parker concurred with them, or at least did not oppose them.</p></blockquote>

or+as+to+Platina%2C+he+seems+to+suspect+that+the+truth+of+what+he+wrote%3A+%E2%80%9CVitalian%2C%E2%80%9D+says+he%2C+%E2%80%9Cbeing+careful+about+the+worship+of+God%2C+made+an+ecclesiastical+rule%2C+and+ordered+the+singing%2C+with+the+addition%28as+something%29+of+organs.%E2%80%9D+%28In+Vital%29.+Again%2C+Bellarmine%E2%80%99s+Aimonius+is+not+the+true+Aimonius%E2%80%A6.+Farther%2C+that+these+instruments+were+not+used+in+God%E2%80%99s+worship%2C+in+Thomas+Aquinas%E2%80%99s+time%2C+that+is+about+the+year+1250%2C+he+himself+his+witness.%E2%80%9DIn+the+old+law%2C%E2%80%9D+says+he%2C+%E2%80%9CGod+was+praised+both+with+musical+instruments+and+human+voices%2C+and+according+to+that+Psalm+33.+%E2%80%98Praise+the+Lord+with+harp%2C+Sing+on+to+him+with+the+psaltery%2C+and+an+instrument+of+ten+strings.%E2%80%99+But+the+church+does+not+use+musical+instruments+to+praise+God%2C+lest+she+should+seem+to+Judaize.+Therefore+by+parody+of+reason%2C+she+should+not+use+singing.%E2%80%9D+%282a2ae+91%2C+art.+4+and+conclus.+4%29.+The+like+objection+is+used+by+our+author.+But+Thomas+answers%3A+%E2%80%9Cas+to+this+objection%2C+we+must+say%2C+as+The+philosopher+%28Lib.+8%2C+Polit%29.+%E2%80%98The+pipes+are+not+to+be+used+for+teaching%2C+nor+any+artificial+instruments%2C+as+the+harp%2C+or+the+like%3A+But+whatever+will+make+the+hearers+good+men.+For+these+musical+instruments+rather+delight+the+mind%2C+then+form+it+to+any+good+disposition.%E2%80%99+But+under+the+Old+Testament+such+instruments+were+used%2C+partly+because+the+people+were+harder+and+more+carnal%3B+upon+which+account+they+were+to+be+stirred+up+by+these+instruments%2C+as+likewise+by+earthly+promises%3B+and+partly+because+bodily+instruments+were+typical+of+something.%E2%80%9D+Upon+which+place+Cardinal+Cajetan+gives+us+this+comment%3A+%E2%80%9CIt+Is+to+be+observed%2C+the+church+did+not+use+organs+in+Thomas%E2%80%99s+time.+When%E2%80%99s%2C+even+to+this+day%2C+the+church+of+Rome+does+not+use+them+in+the+pope%E2%80%99s+presence.+And+truly+it+will+appear%2C+that+musical+instruments+are+not+to+be+suffered+in+the+ecclesiastical+offices+we+meet+together+to+perform%2C+for+the+sake+of+receiving+internal+instruction+from+God%3B+and+so+much+the+rather+are+they+to+be+excluded%2C+because+God%E2%80%99s+internal+discipline+exceeds+all+human+disciplines%2C+which+rejected+these+kinds+of+instruments.%E2%80%9D+%28Cit.+Hoffa.+Lex.+voce.+Musica%29.+If+anyone+objects+the+practice+of+some+foreign+churches%2C+I+answer+with+Mr.+Hickman%3A+%E2%80%9CThey+are+laid+aside+by+most+of+the+Reformed+Churches%3B+no+would+they+they+be+retained+among+the+Lutherans%2C+unless+they+have+forsaken+their+own+Luther%3B+Who%2C+by+the+confession+of+Eckhard%2C+reckoned+organs+among+the+%E2%80%9Censigns+of+Baal.%E2%80%9D+That+they+still+continue+in+some+of+the+Dutch+churches%2C+is+against+the+minds+of+the+pastors.+For+in+the+National+Synod+at+Middleburg%2C+in+the+year+1581%2C+and+in+the+Synod+of+Holland+and+Zeeland%2C+in+the+year+1594%2C+it+was+resolved%2C+that+they+would+endeavor+to+obtain+of+the+magistrate+laying+inside+of+organs%2C+and+the+singing+with+them+in+the+churches%2C+even+out+of+the+time+of+worship%2C+either+before+or+after+sermons%3A+so+far+are+those+synods+from+bearing+with+them+in+the+worship+itself.%E2%80%9D+%28Apol.+p.+139%29.+The+church+of+England+herself+had+formerly+no+good+opinion+of+these+musical+instruments%3B+as+may+appear+by+her+homilies%3A+%E2%80%9Clastly%2C+God%E2%80%99s+vengeance+hath+been%2C+and+is+daily+provoked%2C+because+much+wicked+people+pass+nothing+to+resort+unto+the+church%3B+either+for+that+they+are+so+sore+blinded%2C+that+they+understand+nothing+of+God+or+godliness%2C+and+care+not+with+devilish+malice+to+offend+their+neighbors%3B+or+else+for+that+they+see+the+church+altogether+scoured+of+such+gay+gazing+sights%2C+as+their+gross+fantasy+was+so+greatly+delighted+with%3B+because+they+see+the+false+religion+abandoned%2C+and+the+true+restored+which+seemed+an+unsavory+thing+to+their+savory+taste%2C+as+may+appear+by+this+that+a+woman+said+to+her+neighbor%3A+%E2%80%98Alas%21+gossip%2C+what+shall+we+do+now+at+church%2C+since+all+the+saints+are+taken+away%3B+since+all+the+goodly+sites+we+were+wont+to+have+are+gone%3B+since+we+cannot+hear+the+like+piping%2C+singing%2C+chanting%2C+and+playing+upon+the+organs+that+we+could+before%3F%E2%80%99+But+dearly+beloved%2C+we+are+greatly+to+rejoice+and+give+God+thanks%2C+that+our+churches+are+delivered+out+of+all+those+things%2C+which+displeased+God+so+sore%2C+and+filthily+defiled+his+holy+house%2C+and+his+place+of+prayer.%E2%80%9D+%28Hom.+of+the+place+and+time+of+prayer+part+2.+p.+131%29.+A+great+number+also+of+the+clergy+in+the+first+convocation+of+Queen+Elizabeth+in+1562%2C+earnestly+labored+to+have+organs%2C+and+that+pompous+theatrical+way+of+singing+laid+aside%2C+and+missed+the+carrying+it+but+by+one+vote%2C+as+I+observe+elsewhere.+And+in+this+Archbishop+Parker+concurred+with+them%2C+or+at+least+did+not+oppose+them.%E2%80%9D%0A%0A%E2%80%94+James+P+Wilson%2C+Notes+on+Thomas+Ridgley%2C+A+Body+of+Divinity%2C+4+vol.+%28Philadelphia%2C+1815%29%2C+4.85%E2%80%9388.+Some+spelling+and+punctuation+modernized.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2defd5bb6a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2defd5bb6a.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/05/from-1815-a-brief-history-of-instruments-in-worship/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<main class="wrap"><figure class="quote" id="q-a534325fc2" data-kw="">
<blockquote><p>…why then did Christ here urge the testimony of John? Why, these things I say, that you may be saved. This He aimed at in all this discourse, to save not his own life, but the souls of others; He produced John’s testimony because, being one of themselves, it was to be hoped that they would hearken to it. Note, First, Christ desires and designs the salvation even of his enemies and persecutors. Secondly, the word of Christ is the ordinary means of salvation. Thirdly, Christ in his word considers our infirmities and condescends to our capacities, consulting not so much what it befits so great a prince to say as what we can bear, and what will be most likely to do us good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2a62bb899" data-kw="">
<blockquote><p>Mastricht offers as a brief definition the statement that the divine will is God’s ‘propensity toward the good,’ (Theoretico-practica theol., II.xvii.4) and the somewhat longer definition that ‘will in God is nothing other than his most wise propensity toward himself as the highest goal and toward creatures as means, for the sake of himself,’ inasmuch as creatures attain the fulfilment of the good not in themselves but in God.’ (Theoretico-practica theol., II.xv.7; cf. Cocceius, Summa theol. III.x.23-24 and Van Asselt, Federal Theology, p. 166.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 445</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-67e7455814" data-kw="">
<blockquote><p>The 14th Chapter of Ecclesiastical doctrine is of the Lord’s keys, of which he says to Peter, I will give thee the Keys of the Kingdom of Heaven, and these keys are the peculiar function or Ministry and administration of Christ his power, and his holy Spirit; which power is committed to the Church of Christ, and to the Ministers thereof, unto the end of the world: that they should not only by preaching publish the holy Gospel, although they should do this especially, that is, should shew forth that Word of true comfort, and the joyful message of peace, and new tidings of that favor which God offers, but also that to the believing and unbelieving, they should publicly or privately denounce and make known, to wit, to them His favor, to these his wrath, and that to all in general, or to everyone in particular, that they may wisely receive some into the house of God, to the communion of Saints, and drive some out from thence, and may so through the performance of their Ministry, hold in their hand the Scepter of Christ his Kingdom, and use the same to the government of Christ his Sheep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, The Confession of Bohemia, which Gillespie quotes approvingly on, p.154</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-d5e3d138cd" data-kw="">
<blockquote><p>Their heavenly adoption ought to excite them to the exercise of beneficence, that they may imitate their Father’s disposition, “who makes his sun to rise on the evil and on the good,” (Mt. 5:45) There is nothing in which men resemble God more truly than in doing good to others.</p></blockquote>

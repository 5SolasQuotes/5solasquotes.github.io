<blockquote><p>XX… For the Father is called God [in Col. 1:2] by way of distinction, not in an absolute sense, but in terms of order, because He is the first person of the Godhead who begot the Son from Himself, as the source and principle of the Deity. This is known as the simple essence of the divine unity, which cannot be conceived unless it begins from the Father. The mention of ‘our Lord Jesus Christ’ is expressly added to the Father, both for the purpose of distinction because He is the Mediator, and to refute the Arians, both the ancient and recent ones, who wrongly deduce from this passage of Paul that the name of God belongs exclusively and properly to the Father alone. It is certain that it is used relatively here because the mention of our Lord Jesus Christ is explicitly joined to the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1 (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>

<blockquote><p>71. Fourthly, they [Romanists] accuse us of blasphemy against the Son of God, for denying (as they say) that He is Deus ex Deo, God of God: against the doctrine of the Nicene Creed; and this they call the atheism of Calvin and Beza: a palpable slander: for neither Calvin nor Beza did ever imagine, much less utter the same in that sense which they lay to their charges: for let [Robert] Bellarmine their sworn adversary speak for them: ‘Calvin and Beza teach’ (says he) ‘that the Son is of Himself in respect of his essence, but not in respect of his Person, and they seem to say that the essence of the Deity in Christ is not begotten, but is of itself: which opinion’ (says he) ‘I see not why it may not be called Catholic.’ Here Bellarmine tells us truly what their opinion was, and does acknowledge it to be a true catholic doctrine: and yet in the same chapter he contemns Calvin for his manner of speaking of it and of intolerable sauciness for finding fault with the harshness of the phrase used by the Nicene Council, ‘God of God: Light of light’. Mark (I pray you) his absurdity, it is catholic, and yet it may not be spoken: it is true, and yet it is to be blamed. May not a catholic doctrine be spoken then? or must the truth be smothered? This is such an inconsequence as neither reason nor religion can any ways bear withal: and for his saucy dealing with the Nicene Council, all that ever he says is, that it is durum dictum, ‘a hard phrase’: yet so that he confesses it may receive a good and commodious interpretation if it be understood in the concrete, that Christ who is God, is of the Father that is God: the word being taken personally, and not in the abstract; as if the essence of the Deity of the Son should be from the Father, which is entirely subsisting, in, of, and by its own eternal, incomprehensible, and most glorious nature: and this without question was the true intendement of the Council; for else it had not confuted, but favored the blasphemous heresy of Arius, against whom it was assembled, which Calvin and Beza do not anyways cross, but onely bring unto it a fit and fauourable exposition. Thus we have Bellarmine, Calvin’s and Beza’s patron in this doctrine, though full ill against his will: and not only him, but Ribera and Gregory de Valentia, two other no mean Rabbies, both which do conclude that: ‘the Son as He is a Person, is of another; but as He is a simple ens [being], is not of another: and that the essence does not beget the essence, but the Father the Son;’ so that either they are slanderers of the truth, or their catholic doctrines may be atheism and blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beard.html">Thomas Beard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retractive from the Romish Religion… (London, 1616), Motive 12</cite>, pp. 469-70</span></figcaption>

<blockquote><p>Hence it is evident what must be understood by the word “person.” That which among the Greeks is called “hypostasis” is with the Latins called persona.… properly and strictly, it denotes an intellectual suppositum.</p></blockquote>

<blockquote><p>24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not. 25. IV. The essential immanent acts of God are three: 1. Sibi vivere [to live to Himself], or to be essential active life in Himself; 2. Se intelligere [to understand Himself], to know Himself; 3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

<blockquote><p>The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.”

— Andreas Beck, ch. 13, ‘God, Creation, and Providence in Post-Reformation Reformed Theology’, p. 205 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformed+orthodox+did+not+only+deal+with+the+internal+distinguishing+marks+of+the+Trinitarian+persons%2C+but+also+with+their+outward+marks%2C+the+%E2%80%98oecumenical+offices+of+the+three+persons%2C%E2%80%99+as+Mastricht+labeled+them+%28Mastricht+1699%2C+238-40%3B+Neele+2009%2C+245-78%29.+These+outward+marks+concern+works+that+are+appropriated+to+specific+persons%2C+like+creation+preeminently+to+the+Father%2C+redemption+to+the+incarnate+Son%2C+and+sanctification+to+the+Holy+Spirit+%28Te+Velde+et+al.+2014%2C+192-93%29.+This+was+not+meant+to+deny+that+ultimately+all+Trinitarian+persons+participate+in+these+works%2C+in+accordance+with+the+rule+that+the+externally+directed+works+of+the+Trinity+are+undivided+%28opera+trinitatis+ad+extra+indivisa+sunt%29+%28Mastricht+1699%2C+239%29.+To+be+sure%2C+this+rule+applies+to+immanent+acts+that+are+directed+ad+extra%2C+like+the+divine+decrees+or+decisions%2C+just+as+to+the+external+divine+works+ad+extra%2C+like+creation+and+providence.%E2%80%9D%0A%0A%E2%80%94+Andreas+Beck%2C+ch.+13%2C+%E2%80%98God%2C+Creation%2C+and+Providence+in+Post-Reformation+Reformed+Theology%E2%80%99%2C+p.+205+in+eds.+Lehner%2C+Muller%2C+Roeber%2C+The+Oxford+Handbook+of+Early+Modern+Theology%2C+1600-1800+%28Oxford%2C+2016%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F698d53b4a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/698d53b4a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-doctrine-of-appropriations/#:~:text=The%20Reformed%20orthodox%20did%20not%20only,ad%20extra%2C%20like%20creation%20and%20providence&amp;text=The%20Reformed%20orthodox%20did%20not%20only%20deal%20with&amp;tex

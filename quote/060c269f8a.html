<main class="wrap"><figure class="quote" id="q-060c269f8a" data-kw="">
<blockquote><p>For some in their lack of understanding do bring down the Only-Begotten Word of God from His Supreme Excellence and lower Him from Equality with God the Father, affirming that He is not Consubstantial, nor liking to crown Him with an Identity Exact and of Nature: others going as it were along the same road with these and falling into the snare of death and pitfall of Hades turn aside the mystery of the Economy with flesh of the Only-Begotten and pursue a folly fraternal (so to speak) with the former.

For the one will be caught dragging down as it were (so far as in them lies) from the heights of His Godhead the Word sprung of God the Father ere yet Incarnate; the others have elected to make war with Him Incarnate, well-nigh finding fault (daring ones!) with His Pitying grace, maintaining forsooth that it counselled not well for that He underwent flesh and the measures of our emptiness, i. e. was made man and was seen on earth and conversed with men though God by Nature and co-seated with the Father. …

God-inspired Scripture therefore will cry out against the unlearning of them both, setting forth to us the truth and shewing that feeble and of none account is their speech, and establishing on the path of the Godhead them who are used to view with subtil and accurate eye of understanding the Mystery thereof.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b3732fb85" data-kw="">
<blockquote><p>Therefore the Scripture calleth him the only begotten son of God, that he may put a necessary difference between Christ and all the faithful. For Christ is called, and indeed is the only everlasting son of the everlasting father, begotten of the substance of the father before all world’s: and therefore is every God in who[m] we ought to believe. Pro. 8. Joh. 1.

Now we are called and are the sons of God, not by nature, but by adoption and grace, through which, God hath vouchsafed to adopt us to be his children, whilst he hath made us through faith engrafted into his son, his true and lively members, who otherwise were the members of Satan, and by nature the sons of wrath. Joh. 8. Ephes. 2. But in the mean time, that same adoption, and name of the sons of God, is not only an empty title; but when we are in truth members of the son of God, we have by his grace a true communion and fellowship with him, in respect of which he is called the first begotten amongst many brethren. Rom. 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), pp 129-30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-acac1af563" data-kw="">
<blockquote><p>Who then, who can declare the Father by number, so as to discover the powers of His Word? For like as He is the Father’s Word and Wisdom, so too condescending to created things, He becomes, to impart the knowledge and apprehension of Him that begot Him, His very Brightness and very Life, and the Door, and the Shepherd, and the Way, and King and Governor, and Saviour over all, and Light, and Giver of Life, and Providence over all. Having then such a Son begotten of Himself, good, and Creator, the Father did not hide Him out of the sight of His creatures, but even day by day reveals Him to all by means of the organisation and life of all things, which is His work.

But in and through Him He reveals Himself also, as the Saviour says: “I in the Father and the Father in Me:” so that it follows that the Word is in Him that begat Him, and that He that is begotten lives eternally with the Father. But this being so, and nothing being outside Him, but both heaven and earth and all that in them is being dependent on Him, yet men in their folly have set aside the knowledge and service of Him, and honoured things that are not instead of things that are: and instead of the real and true God deified things that were not, “serving the creature rather than the Creator,” thus involving themselves in foolishness and impiety.

For it is just as if one were to admire the works more than the workman, and being awestruck at the public works in the city, were to make light of their builder, or as if one were to praise a musical instrument but to despise the man who made and tuned it. Foolish and sadly disabled in eyesight! For how else had they known the building, or ship, or lyre, had not the ship-builder made it, the architect built it, or the musician fashioned it?

As then he that reasons in such a way is mad, and beyond all madness, even so affected in mind, I think, are those who do not recognise God or worship His Word, our Lord Jesus Christ the Saviour of all, through Whom the Father orders, and holds together all things, and exercises providence over the Universe; having faith and piety towards Whom, my Christ-loving friend, be of good cheer and of good hope, because immortality and the kingdom of heaven is the fruit of faith and devotion towards Him, if only the soul be adorned according to His laws. For just as for them who walk after His example, the prize is life everlasting, so for those who walk the opposite way, and not that of virtue, there is great shame, and peril without pardon in the day of judgment, because although they knew the way of truth their acts were contrary to their knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Heathen</cite>, (c. 335), 28.1-4 in Nicene and Post-Nicene Fathers 2, 4: 29-30.</span></figcaption>

</figure><figure class="quote" id="q-670925aa26" data-kw="Old Testament Trinity degrees">
<blockquote><p>Although the mystery of the Trinity was more obscure under the Old than under the New Testament, it does not follow that it was then altogether unknown. For otherwise, they could neither have known the true God nor have been able to believe in the Messiah. Therefore we must distinguish knowledge from its degrees. The same knowledge was given as to substance, but it varied in degree.</p></blockquote>

<blockquote><p>c. The eternal generation of the Son. The personal property of the Son is that He is eternally begotten of the Father (briefly called “filiation”), and shares with the Father in the spiration of the Spirit. The doctrine of the generation of the Son is suggested by the Biblical representation of the first and second persons of the Trinity as standing in the relation of Father and Son to each other. Not only do the names “Father” and “Son” suggest the generation of the latter by the former, but the Son is also repeatedly called “the only-begotten,” John 1:14, 18; 3:16, 18; Heb. 11:17; 1 John 4:9. Several particulars deserve emphasis in connection with the generation of the Son: (1) It is a necessary act of God. Origen, one of the very first to speak of the generation of the Son, regarded it as an act dependent on the Father’s will and therefore free. Others at various times expressed the same opinion. But it was clearly seen by Athanasius and others that a generation dependent on the optional will of the Father would make the existence of the Son contingent and thus rob Him of His deity. Then the Son would not be equal to and homoousios with the Father, for the Father exists necessarily, and cannot be conceived of as non-existent. The generation of the Son must be regarded as a necessary and perfectly natural act of God. This does not mean that it is not related to the Father’s will in any sense of the word. It is an act of the Father’s necessary will, which merely means that His concomitant will takes perfect delight in it. (2) It is an eternal act of the Father. This naturally follows from the preceding. If the generation of the Son is a necessary act of the Father, so that it is impossible to conceive of Him as not generating, it naturally shares in the eternity of the Father. This does not mean, however, that it is an act that was completed in the far distant past, but rather that it is a timeless act, the act of an eternal present, an act always continuing and yet ever completed. Its eternity follows not only from the eternity of God, but also from the divine immutability and from the true deity of the Son. In addition to this it can be inferred from all those passages of Scripture which teach either the pre-existence of the Son or His equality with the Father, Mic. 5:2; John 1:14, 18; 3:16; 5:17, 18, 30, 36; Acts 13:33; John 17:5; Col. 1:16; Heb. 1:3. The statement of Ps. 2:7, “Thou art my Son; this day have I begotten thee,” is generally quoted to prove the generation of the Son, but, according to some, with rather doubtful propriety, cf. Acts 13:33; Heb. 1:5. They surmise that these words refer to the raising up of Jesus as Messianic King, and to the recognition of Him as Son of God in an official sense, and should probably be linked up with the promise found in 2 Sam. 7:14, just as they are in Heb. 1:5. (3) It is a generation of the personal subsistence rather than of the divine essence of the Son. Some have spoken as if the Father generated the essence of the Son, but this is equivalent to saying that He generated His own essence, for the essence of both the Father and the Son is exactly the same. It is better to say that the Father generates the personal subsistence of the Son, but thereby also communicates to Him the divine essence in its entirety. But in doing this we should guard against the idea that the Father first generated a second person, and then communicated the divine essence to this person, for that would lead to the conclusion that the Son was not generated out of the divine essence, but created out of nothing. In the work of generation there was a communication of essence; it was one indivisible act. And in virtue of this communication the Son also has life in Himself. This is in agreement with the statement of Jesus, “For as the Father hath life in Himself, even so gave He to the Son also to have life in Himself,” John 5:26. (4) It is a generation that must be conceived of as spiritual and divine. In opposition to the Arians, who insisted that the generation of the Son necessarily implied separation or division in the divine Being, the Church Fathers stressed the fact that this generation must not be conceived in a physical and creaturely way, but should be regarded as spiritual and divine, excluding all idea of division or change. It brings distinctio and distributio, but no diversitas and divisio in the divine Being. (Bavinck) The most striking analogy of it is found in man’s thinking and speaking, and the Bible itself seems to point to this, when it speaks of the Son as the Logos. (5) The following definition may be given of the generation of the Son: It is that eternal and necessary act of the first person in the Trinity, whereby He, within the divine Being, is the ground of a second personal subsistence like His own, and puts this second person in possession of the whole divine essence, without any division, alienation, or change</p></blockquote>

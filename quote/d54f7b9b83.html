<main class="wrap"><figure class="quote" id="q-d54f7b9b83" data-kw="">
<blockquote><p>As to the eternal generation of the Son, it is generally explained in this manner. The Father is called by some, ‘the fountain of the Godhead,’ an expression taken from some of the fathers who defended the Nicene faith. But others, of late, have rather chosen to call the Father the fountain of the Trinity; and he is said to be of himself, or unbegotten. This they state as his personal character, distinct from that of the Son. On the other hand, the Son, as to his personality, is generally described as being from the Father. Many choose to express themselves about this mystery in these terms,—‘the Father communicated the divine essence to the Son.’ This is the most common mode of speaking; though others think it safer to say, that he communicated the divine personality to him. I cannot tell, however, which is least exceptionable. But when I find others using the phrase, ‘the Father gave the divine essence to the Son,’ their mode of speaking being founded, as they apprehend, on that scripture, ‘As the Father hath life in himself, so hath he given to the Son to have life in himself,’ I cannot but think it is an unguarded expression, and foreign to the design of the Holy Ghost in that scripture, as will be hereafter considered. The Arians are ready to insult us upon such modes of speaking, and suppose us to conclude that the Son receives his divine perfections, and therefore cannot be God equal with the Father. None of those, however, who use such expressions, suppose that the Son’s deity is founded on the arbitrary will of the Father; for they all assert that the divine nature is communicated necessarily, and from all eternity, as the sun communicates its rays necessarily, which are of equal duration with it. Hence, while they make use of a word which, according to its most known acceptation, seems subversive of the truth, they happily, for truth’s sake, explain away the proper sense of it; so that all they can be blamed for by the adversary, is an impropriety of expression. Again, others speak a little more exceptionably, when, explaining the eternal generation of the Son, they say that the Father produced him. But this idea they also happily explain away; saying that the production of which they speak, is not such as in the case of the cause producing the effect. Some of the fathers, indeed, who have been in the Trinitarian scheme, have unwarily called the Father the cause of the Son. Yet our modern divines seldom or never use that expression; or, if they speak of an eternal production, they suppose it to differ vastly from the production of creatures, or from production in that sense in which the Arians suppose the Son to be produced. The expression, however, had certainly better be laid aside, lest it should be thought that we conclude the Son not equally necessary, and, from all eternity, co-existent with the Father; which our divines, how unwarily soever in other respects they may express themselves, are very far from denying,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (New York: Robert Carter &amp; Brothers, 1855), 1.157.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17e6751446" data-kw="">
<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>

</figure><figure class="quote" id="q-899d6c24a5" data-kw="">
<blockquote><p>Works of Nature they call those which God produces in Nature by a certain common operation. And they are either of Creation, or of Conservation and Governance. … By this, however, no Persons of the Deity are excluded from creation, but only creatures and fictitious divinities. For the individual Persons are that one, true, living, and everlasting God, and in respect to them this work no less than the other external works is counted indivisible or common. Which the very history of creation openly testifies, when it introduces several Persons consulting and creating, Gen. 1:26. Scripture testifies elsewhere, where concerning the one God the creator it speaks by the name of makers, Isa. 54:5, in the plural number, Job 35:10. Moreover, the work of creation is attributed no less to the Son, John 1:3; Col. 1:16; Heb. 1:2; and to the Holy Spirit, Gen. 1:2; Job 26:13; 33:4; Ps. 104:30, than the Father claims it διὰ ῥητῶν [dia rhētōn, explicitly]. That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not. 25. IV. The essential immanent acts of God are three: 1. Sibi vivere [to live to Himself], or to be essential active life in Himself; 2. Se intelligere [to understand Himself], to know Himself; 3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

<blockquote><p>Andrew Willet criticised Richard Hooker for what he perceived as the latter’s undermining of the seriousness of the error of transubstantiation:

The Church of England pronounceth, that The Transubstantiation of the bread and wine in the Eucharist, can not be proved by the sacred Scripture, but is against plain words of Scripture, overturneth the nature of the sacrament, &amp; hath give occasion of many superstitions.

And for this cause our Reverend Fathers call it: A monstrous &amp; blasphemous doctrine: bringing in doubt the truth of Christ’s body. Contrary to Christ’s words, saying: It is expedient that I go away, Joh. 16. 7. and to that of Peter: Whom the heavens must contain until the time that all things be restored, Act. 3. 21. disagreeing from the articles of faith, He ascended into heaven, sitteth at the right hand of God the Father, &amp;c. making void the institution of Christ, which is to continue till he come, &amp;c. casting holy things to profane, as whoremongers, murderers, &amp;c. mise and dogs to receive the true real body of Christ. causing most cruel eating of man’s flesh, and many monstrous miracles: accidents without subjects: the body of Christ without his qualities and true manner of a body: nourishing the Marcionist to believe the phantastical body of Christ, and Eutychians confounding the two natures of Christ, and therefore they which affirm transubstantiation are indeed right Sacramentaries and Capernaites.

In regard whereof we intreat you Mai. Hoo[ker]. to make a fit construction of your words, were you say: Sith we all agree that by the sacrament, Christ doth really and truly in us perform his promise: why do we vainly trouble our selves with so fierce contentions. whether by consubstantiation or else by transubstantiation the sacrament it self be first possessed with Christ or no: a thing which no way can either further or hinder us howsoever it stand, because our participation of Christ in the Sacrament, dependeth on the cooperation of his omnipotent power, which maketh it his body and blood unto us, whether with change or without alteration of the element, such as they imagine, we need not greatly to care nor inquire after. In all which words you seem to make light of the doctrine of transubstantiation, as a matter not to be stood upon or to be contended for, cared for or enquired into:

Which maketh us to marvel how our Church and Reverend Fathers have all this time passed, been deceived. What should cause them to affirm it to be a thing contrary to the plain words of scripture, overturning the nature of the Sacrament, to call it monstrous doctrine: why so many reverend Fathers, as Crammer, Ridley, Hooper, Latimer, Rogers, Bradford, &amp;c. have given their lives in witness against it, if it bee a thing that neither furthereth nor hindreth, a thing not to be cared for, nor enquired after? And here we pray you ingeniously to shew whether your meaning be to bring that side into credit by softening the odiousness of their heresy, and our side into suspicion of peevishness, for standing upon trifles; which the rather we desire to be resolved in, because else where you call the enemies to Transubstantiation Sacramentaries, and labour to shew a certain ubiquity of Christ’s manhood and of his body, and of his soul, which seemeth to us that you would give a gentle construction of Popish opinions, and privily rob the truth of our English creed of her due estimation.

If you call our Reverend Fathers Sacramentaries for oppugning transubst. and they again call the maintainers of it right Sacramentaries and Capernaites (if you have given as good testimony of faithfulness as they) whom shall wee believe? are you not contradictory: and may we think you can favour that side; your words do beat down; shew us then we pray you how such great favours do not prejudice the doctrine of the church of England, or not condemn those millions of learned divines and blessed Martyrs of extreme folly, who have died for the same; and that God should reveal to you only that it was for that which neither furthered nor hurteth?

Lastly instruct us whether the institution of the Sacrament by Christ, saying: this is my body: do this in remembrance of me, be not the true and right making of it Christ’s body and blood unto us: and upon what ground of Scripture it may be proved, that the cooperation of his omnipotent power doeth make it his body and blood unto us, and in what sense: And whether such phrases do not help the Popish argument of God’s power which they commonly use to approve their transubstantiation.</p></blockquote>

<blockquote><p>For the Presence of Christ in the Supper, it is needful that it be distinguished, and considered two ways; First, according to the verity thereof, Then, according to the manner of the verity thereof.

The Verity of Christ’s presence in the Supper, in that the Supper of the Lord is considered not as an earthly action only, but as a heavenly, is that, whereby in his Body, and blood, he is believed to be truly, and really present in the Supper, and that both in respect of the signs, and in respect of the Communicants.

Of the Signs: because the body, and blood of Christ are truly present together with the bread and wine, the sacramental signs; not in respect of co-existence, and place, but in a Sacramental manner, in respect whereof, this presence in the Schools, is commonly termed Relative.

Of the Communicants: because Christ is in very deed present, in the hearts of them that believe, even altogether with the same, and such a presence, as the communion of his body, is exhibited unto them in the Supper: and this presence is Real: yet neither presence is corporal: for by faith (as Ambrose sayth,) Christ is touched, not by body.

Of this Verity there are two grounds; The Divine Promise, and the Sacramental Union.

The Promise; for sith Christ, in the instituting of his Supper, hath promised the eating of his body, and blood; and therefore also his Presence, we must verily believe, that Christ accomplisheth, and performeth what he hath promised.

The Sacramental Union: for the Essential Form of the Sacraments, &amp; that, which maketh Consistence, requireth, that in the Supper, the thing signified be no less certainly conferred, then the very present signs are offered.

The manner of this Verity is not corporal, natural, or Local, either by a conversion of the whole Substance of the bread and Wine into the Lord’s body, and blood, or by a passing into the bread, or by local inclusion; or lastly, by a being in, or closeness; but it is Sacramental, and Spiritual, which God’s will, and authority declared by the word of Institution, effecteth: Sacramental, because, according to the nature of Sacraments, it consisteth in a disposition, and relation, by which Christ, together with the sign, exhibiteth the thing signified to the Communicants, and sanctifieth the bread and wine, that they may be the signs of the thing signified, being conjoined together by a Sacramental union.

Spiritual; because the body, and blood of Christ, being not simply, and as they are in themselves, things subsisting, but Intellectually, and understandingly to be considered, are proposed in these mysteries, and are offered to the mind, not to the body, to Faith, not to the senses; being also with the mind, and with faith alone to be taken and received.

Of this manner, there are three grounds; The Institution, the Verity, and Manner of Christ’s body, and the Nature of the Sacraments.

The Institution: for Christ instituted the Sacrament of our communion with his body and blood, whereof we are spiritually partakers by Faith: for after no other manner can it be believed, that the present body of Christ is exhibited in the Supper; but as it is truly received, as the spiritual meat of the soul unto life.

The manner and verity of his body: for seeing the body of Christ being coessential with ours, is circumscriptively in Heaven, wheresoever he will, and cannot be in earth by a manner invisible, incircumscribed, infinite indefinite; al and every of which manners, overthrow the verity of a body; we must altogether confess, that Christ, being bodily in heaven, is nevertheless, after a Sacramental manner in body present in the Supper.

The Nature of the Sacraments: for Faith should cease in the Sacraments, if the very thing, which is believed, were otherwise present, then after a sacramental manner; neither, indeed doth the omnipotency of God, or a miracle invert, or evert this sacramental manner of presence. Not Gods Omnipotency: because, when there is speech made of that effectual, and actual power of God, the will of God revealed in the word, must needs go before. To which (will), if any thing be contrary, it is from it necessarily excluded, as that also, which is by nature contradictory: not a Miracle; because neither miracles which are indeed above nature, should be said to be against nature, taking away, and withal leaving a substance, or natural quality: nor is it probable, that a thing which is extraordinary, is done in an ordinary Sacrament of the Church.</p></blockquote>

— Lucas Trelcatius Jr., A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved, trans. John Gawen (London: Francis Burton, 1610), 2.13, pp 386-91.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+Presence+of+Christ+in+the+Supper%2C+it+is+needful+that+it+be+distinguished%2C+and+considered+two+ways%3B+First%2C+according+to+the+verity+thereof%2C+Then%2C+according+to+the+manner+of+the+verity+thereof.%0A%0AThe+Verity+of+Christ%E2%80%99s+presence+in+the+Supper%2C+in+that+the+Supper+of+the+Lord+is+considered+not+as+an+earthly+action+only%2C+but+as+a+heavenly%2C+is+that%2C+whereby+in+his+Body%2C+and+blood%2C+he+is+believed+to+be+truly%2C+and+really+present+in+the+Supper%2C+and+that+both+in+respect+of+the+signs%2C+and+in+respect+of+the+Communicants.%0A%0AOf+the+Signs%3A+because+the+body%2C+and+blood+of+Christ+are+truly+present+together+with+the+bread+and+wine%2C+the+sacramental+signs%3B+not+in+respect+of+co-existence%2C+and+place%2C+but+in+a+Sacramental+manner%2C+in+respect+whereof%2C+this+presence+in+the+Schools%2C+is+commonly+termed+Relative.%0A%0AOf+the+Communicants%3A+because+Christ+is+in+very+deed+present%2C+in+the+hearts+of+them+that+believe%2C+even+altogether+with+the+same%2C+and+such+a+presence%2C+as+the+communion+of+his+body%2C+is+exhibited+unto+them+in+the+Supper%3A+and+this+presence+is+Real%3A+yet+neither+presence+is+corporal%3A+for+by+faith+%28as+Ambrose+sayth%2C%29+Christ+is+touched%2C+not+by+body.%0A%0AOf+this+Verity+there+are+two+grounds%3B+The+Divine+Promise%2C+and+the+Sacramental+Union.%0A%0AThe+Promise%3B+for+sith+Christ%2C+in+the+instituting+of+his+Supper%2C+hath+promised+the+eating+of+his+body%2C+and+blood%3B+and+therefore+also+his+Presence%2C+we+must+verily+believe%2C+that+Christ+accomplisheth%2C+and+performeth+what+he+hath+promised.%0A%0AThe+Sacramental+Union%3A+for+the+Essential+Form+of+the+Sacraments%2C+%26+that%2C+which+maketh+Consistence%2C+requireth%2C+that+in+the+Supper%2C+the+thing+signified+be+no+less+certainly+conferred%2C+then+the+very+present+signs+are+offered.%0A%0AThe+manner+of+this+Verity+is+not+corporal%2C+natural%2C+or+Local%2C+either+by+a+conversion+of+the+whole+Substance+of+the+bread+and+Wine+into+the+Lord%E2%80%99s+body%2C+and+blood%2C+or+by+a+passing+into+the+bread%2C+or+by+local+inclusion%3B+or+lastly%2C+by+a+being+in%2C+or+closeness%3B+but+it+is+Sacramental%2C+and+Spiritual%2C+which+God%E2%80%99s+will%2C+and+authority+declared+by+the+word+of+Institution%2C+effecteth%3A+Sacramental%2C+because%2C+according+to+the+nature+of+Sacraments%2C+it+consisteth+in+a+disposition%2C+and+relation%2C+by+which+Christ%2C+together+with+the+sign%2C+exhibiteth+the+thing+signified+to+the+Communicants%2C+and+sanctifieth+the+bread+and+wine%2C+that+they+may+be+the+signs+of+the+thing+signified%2C+being+conjoined+together+by+a+Sacramental+union.%0A%0ASpiritual%3B+because+the+body%2C+and+blood+of+Christ%2C+being+not+simply%2C+and+as+they+are+in+themselves%2C+things+subsisting%2C+but+Intellectually%2C+and+understandingly+to+be+considered%2C+are+proposed+in+these+mysteries%2C+and+are+offered+to+the+mind%2C+not+to+the+body%2C+to+Faith%2C+not+to+the+senses%3B+being+also+with+the+mind%2C+and+with+faith+alone+to+be+taken+and+received.%0A%0AOf+this+manner%2C+there+are+three+grounds%3B+The+Institution%2C+the+Verity%2C+and+Manner+of+Christ%E2%80%99s+body%2C+and+the+Nature+of+the+Sacraments.%0A%0AThe+Institution%3A+for+Christ+instituted+the+Sacrament+of+our+communion+with+his+body+and+blood%2C+whereof+we+are+spiritually+partakers+by+Faith%3A+for+after+no+other+manner+can+it+be+believed%2C+that+the+present+body+of+Christ+is+exhibited+in+the+Supper%3B+but+as+it+is+truly+received%2C+as+the+spiritual+meat+of+the+soul+unto+life.%0A%0AThe+manner+and+verity+of+his+body%3A+for+seeing+the+body+of+Christ+being+coessential+with+ours%2C+is+circumscriptively+in+Heaven%2C+wheresoever+he+will%2C+and+cannot+be+in+earth+by+a+manner+invisible%2C+incircumscribed%2C+infinite+indefinite%3B+al+and+every+of+which+manners%2C+overthrow+the+verity+of+a+body%3B+we+must+altogether+confess%2C+that+Christ%2C+being+bodily+in+heaven%2C+is+nevertheless%2C+after+a+Sacramental+manner+in+body+present+in+the+Supper.%0A%0AThe+Nature+of+the+Sacraments%3A+for+Faith+should+cease+in+the+Sacraments%2C+if+the+very+thing%2C+which+is+believed%2C+were+otherwise+present%2C+then+after+a+sacramental+manner%3B+neither%2C+indeed+doth+the+omnipotency+of+God%2C+or+a+miracle+invert%2C+or+evert+this+sacramental+manner+of+presence.+Not+Gods+Omnipotency%3A+because%2C+when+there+is+speech+made+of+that+effectual%2C+and+actual+power+of+God%2C+the+will+of+God+revealed+in+the+word%2C+must+needs+go+before.+To+which+%28will%29%2C+if+any+thing+be+contrary%2C+it+is+from+it+necessarily+excluded%2C+as+that+also%2C+which+is+by+nature+contradictory%3A+not+a+Miracle%3B+because+neither+miracles+which+are+indeed+above+nature%2C+should+be+said+to+be+against+nature%2C+taking+away%2C+and+withal+leaving+a+substance%2C+or+natural+quality%3A+nor+is+it+probable%2C+that+a+thing+which+is+extraordinary%2C+is+done+in+an+ordinary+Sacrament+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+Lucas+Trelcatius+Jr.%2C+A+brief+institution+of+the+common+places+of+sacred+divinity.+Wherein%2C+the+truth+of+every+place+is+proved%2C+and+the+sophisms+of+Bellarmine+are+reproved%2C+trans.+John+Gawen+%28London%3A+Francis+Burton%2C+1610%29%2C+2.13%2C+pp+386-91.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbe6fc49c2c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/be6fc49c2c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/05/19/lucas-trelcatius-on-christs-presence-in-the-lords-supper/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-829674cc1a" data-kw="">
<blockquote><p>James Fergusson, an early Covenanter minister, explains that the Sectaries adopted a latitudinarian view of admission to communion, thinking that church censure only applied to deniers of fundamental doctrines. Conversely, the Presbyterian Covenanter position was that those who persist in unconfessional error are to be subjected to ecclesiastical discipline:

A Church Toleration is, That whereby it is pleaded that Error and Heresy should have liberty to be vented and go free even from Church Censure; such as suspension from the Sacraments or Excommunication. There are but few Sectaries of any note that plead for Toleration in this Latitude, and that because the Scripture is so plain against it, Paul says, An Heretic after the first and second Admonition reject. Therefore they are content that Church-censures such as Excommunication be inflicted on Heretics, providing, First, that they be free from Civil censure. Secondly, That Excommunication be inflicted for no Error, but for these that are contrary to fundamental points of Truth, or as some say contrary to the very light of Nature: Upon these and no other will they have excommunication to strike.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors of toleration, Erastianism, Independency and separation. Delivered in some sermons from I John 4.1. Preached in the year 1652. To which are added four sermons preached on several occasions</cite>, (1652; Edinburgh, 1692), p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

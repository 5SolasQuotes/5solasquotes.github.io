<main class="wrap"><figure class="quote" id="q-812e9ea8b2" data-kw="">
<blockquote><p>…that we remember especially to put all things in practice which we have learned out of the Word, and that we begin upon that very day to do all duties of love unto men, and that we show mercy vnto them then especially. Whereunto that we might be made the more fit, the whole worship of God, and the Sabbath itself is ordained, in so much that the Lord would have every whit of it to cease even upon the Sabbath, rather than mercy should not be showed to the full, or any duty of it neglected to our brethren, when both of them cannot be done together, as we have seen it before more at large.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), pt. 2, p. 246</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80c55310f7" data-kw="">
<blockquote><p>Privately the Sabbath is sanctified by our preparation to God’s public service, which chiefly consists in meditation and prayer, and after the public service, by meditating on the Word heard, and applying it to our own use, and by holy conferences with others. Unto which duties respecting the public worship we are to add and use these other means of sanctifying the remainder of the Lord’s Day: Reading of the Scriptures or other religious and holy writings, meditation on God’s Word and works, especially of creation, preservation and redemption, invocation by prayer, thanksgiving and singing of psalms, and finally godly conferences upon some fit subiect, which best sorts to the present occasion and tends to the use of edification: Unto which means we must add the private works of sanctification, which are the works of mercy, and appertain chiefly either to the body, as the giving of alms, visiting the sick and prisoners, curing diseases, etc. or else to the soul, as, teaching the ignorant, reclaiming those who are seduced by error, admonishing those who fail of their duty by frailty and infirmity, rebuking the scandalous and wilfull offender, exhorting the backward and sluggish, comforting the distressed, counseling them for the good of their souls that need counsel, and reconciling those whom we know to be at variance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life</cite>, … (London: Kingstone, 1622), bk. 2, ch. 8, section 5, ‘Of the Spiritual Sanctification, &amp; the Outward Rest’, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

quote%2F80c55310f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/80c55310f7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/what-does-keeping-the-lords-day-entail/#:~:text=Privately%20the%20Sabbath%20is%20sanctified%20by,we%20know%20to%20be%20at%20variance&amp;text=Privately%20the%20Sabbath%20is%20sanctified%20by%20our%20preparation&amp;text=those%20whom%20we%20know%20to%20be%20at%20variance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-51ba2af284" data-kw="">
<blockquote><p>Surely that which is most sweet to the soul of God should be most sweet to our souls: You would wonder to hear a man say that he takes as much delight and he can recreate himself as much in reading, in praying, in hearing sermons, in holy conference as you can do in all your good cheer, in playing and drinking of wine in bowls: You think that men are made to say that they have as much pleasure in those things, as playing at cards, and merriment, and music, and good cheer: you call upon them to play at cards with you, or be merry, you say to them, why should you be dumpish and never be merry? They tell you again that they can be as merry and as cheerful in hearing the Word, and praying, and reading, as you in all your playing, and all that you account delightful. You say to them that they have no recreation. They tell you that those things that are your burdens, are their recreation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea</cite>, ... (London: Cole, 1650), pp. 164-65. The context of this does not regard the Sabbath specifically. Burroughs was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

y%20that%20which%20is%20most%20sweet%20to%20the&amp;text=things%20that%20are%20your%20burdens%2C%20are%20their%20recreation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c841efac0c" data-kw="">
<blockquote><p>Therefore we shall learn out of this Scripture what things may lawfully be done of us without the breach of the commandment of rest. First of all such bodily labors are permitted, as do immediately and directly concern the worship of God, and without the which He cannot be served of us according to his Word: For this cause it was permitted unto the priests, nay they were commanded to slay beasts, and to prepare them for sacrifices, and offer them up according to the law, about the which they took so much the more pains upon that day than upon any other [day] of the week by how much the sacrifices were increased: for besides the daily sacrifices, morning and evening, there was a special sacrifice for the Sabbath, and all this being commanded in the law, our Savior Christ says [that] they in doing of it were blameless; therefore, whereas He says that the priests in the Temple break the Sabbath, He does not mean that they did so indeed: (For He affirms that they are blameless), but speaking according to the meaning of the Pharisees, who would condemn the fact of his disciples in gathering the ears of corn to satisfy their hunger, says, if every bodily labor be a breach of the Sabbath, then the priests in the temple brake it, but they are blameless in so doing; therefore they brake it not. Thus we do grant that men may travail [put forth work] to the places of Gods worship, where the public assemblies and meetings of the Church be, because otherwise they cannot join with them in the communion of the Word, sacraments and prayer, and though they be far distant in situation of dwelling from the common place of meeting, yet it is permitted unto them to travail by land, or by water, on horseback, or on foot thereunto; nay they are commanded to do it, and they may not under the color of a long journey tarry at home idly taking their ease. For even as the slaying of beasts is merely in its own nature a worldly and bodily labor, yet the temple which was sanctified did change the nature of it, and made it holy: so to travail and to ride, or go to and fro upon the Sabbath is altogether painful, and laborsome to the body, but to take this pains, to preach or to hear the word, makes it an holy work, and is warranted by the Scripture: as in this very place [Mt. 12:1-9], we see how our Savior Christ and his disciples travail from town to town to preach the Gospel, and take such pains that they are hungry and faint in the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), pt. 1, pp. 104-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b76cd05d2" data-kw="">
<blockquote><p>The subject matter of these debates [surrounding the public Resolutions] is not so far removed out of the way as our [Resolutioner] Brethren do talk, but do still continue in many respects: 1. In regard of the sin and guilt thereof, which has not been taken-with, nor repented-of till this day. And as the resolution Brethren judge it hard for the protesting Brethren to be satisfied with nothing, unless they do repent of that, as a sin which in their consciences they judge to be a duty; So they must give leave to the protesting Brethren to judge it hard, that the Church, of which they are members and ministers, should lie under the guilt of a public transgression, and under great and sore wrath, because thereof, and they in the meanwhile not be permitted to discover her iniquity therein, that her captivity may be turned away, especially when they are engaged by Covenant so to do.</p></blockquote>

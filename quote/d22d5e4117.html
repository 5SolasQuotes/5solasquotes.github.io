<blockquote><p>…let our rest and confidence be only in Christ, and to such as take Him for their rest, his work is but recreation, and so indeed we should esteem it in a spiritual sense; not looking upon it as a sour task, or a rigid exaction, but calling the Sabbath a delight, we should keep it accordingly, even the whole day, with the whole man, as a day of delights to the Lord, being transported beyond flesh and the world, and having our conversation in heaven, as much as is possible for creatures clothed with flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-warren.html">Edmund Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Jews’ Sabbath Antiquated, &amp; the Lord’s Day Instituted by Divine Authority (London: Maxwel, 1659), Position 7, ‘The Lord’s Day must be kept holy to the Lord,’</cite>, p. 257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>Works of piety, as to travel to the places of public worship; or charity, as to visit the sick, and of necessity, as to preserve the life of man and beast in danger, are lawful.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Works of piety, as to travel to the places of public worship; or charity, as to visit the sick, and of necessity, as to preserve the life of man and beast in danger, are lawful.”

— David Calderwood, A Re-Examination of the Five Articles enacted at Perth anno 1618... (1636), ‘Of the Sabbath’, pp. 186">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWorks+of+piety%2C+as+to+travel+to+the+places+of+public+worship%3B+or+charity%2C+as+to+visit+the+sick%2C+and+of+necessity%2C+as+to+preserve+the+life+of+man+and+beast+in+danger%2C+are+lawful.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+A+Re-Examination+of+the+Five+Articles+enacted+at+Perth+anno+1618...+%281636%29%2C+%E2%80%98Of+the+Sabbath%E2%80%99%2C+pp.+186&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F561574f419.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/561574f419.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=Works%20of%20piety%2C%20as%20to%20travel,and%20beast%20in%20danger%2C%20are%20lawful&amp;text=Works%20of%20piety%2C%20as%20to%20travel%20to%20the&amp;text=of%20man%20and%20beast%20in%20danger%2C%20are%20lawful" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-71341c3740" data-kw="">
<blockquote><p>Lastly, if it were granted that Ambrose did entreat Count Arbogastes at a feast, whether will any believe it, who considers the austere life of Ambrose, chastising his body with that discipline (as Paulinus, ibidem) that he observed a daily fast, that he would distain himself with feasts on the Lord’s day which hindred the exercises of religion, either public or private? Nay, truly, He might perhaps dine on the Lord’s day, as the custom of the Church required: but we must not believe that the grave father did fare so daintily on that day as that he could not attend the duties of piety: concerning which nature of feasts we are here speaking: in which number that is to [be] reckoned, which Baronius mentions out of Gregor. Turonens, who tells us of a certain presbyter, invading the Bishopric of Avergue, after the death of Sidonius Apollinaris, who, when the Lord’s day came, having prepared a banquet, commanded that all the citizens should be invited into the Church: a wickedness indeed beseeming the author, that he who had ambitiously invaded the Bishops’ See, against the Canons of the Church, should violate the Lord’s solemnity by his feast, that hindered the duties of divine worship: which unlawful example, I hope nobody that relishes anything of Christ will follow. And now I will conclude with St. Austin [Augustine] (Epistle 86), that none can rightly deny that a Christian may on the Lord’s day be refreshed with a moderate and sober dinner, and also will affirm with that grave father, that those who fear God must not riot on the Lord’s Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-young.html">Thomas Young</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s-Day, or a Succinct Narration compiled out of the Testimonies of Holy Scripture &amp; the Reverend Ancient Fathers… (London: Leach, 1672), bk. 1, ch. 13, pp. 227-28 Young was a Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath… (Amsterdam, 1638), ch. 21 Westminster divine</cite>, p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

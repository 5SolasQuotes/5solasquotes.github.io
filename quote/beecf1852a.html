<blockquote><p>WAS the sabbath simply a Jewish institution? Was it only temporary in its design? Was it abrogated with other special laws of the Old Testament? Did it leave no divinely appointed substitute? The answer turns largely on this – is the fourth commandment binding upon the Church today?

The text of the commandment itself has some bearing on this issue. The commandment, given at Sinai, was based, not on something done to Israel alone, but on something done in the creation of the world: ‘For in· six days the Lord made heaven and earth: …’ (Ex. xx. 11). The implication is that ‘the sabbath was made for man’, and not for the Jew only.

There are traces of the observance of the sabbath before the giving of the law at Sinai (see Ex . xvi. 23). The reckoning of time by weeks long before Moses (Gen. xxix. 27) may have had for ‘its forgotten background’ the original institution of the sabbath at the creation. A few Old Testament references (Ne. ix. 14; Ez. xx. 12) might indeed seem to imply that the sabbath had its beginning at Sinai, but they mean no more than that in its specific Old Testament form it had its beginning with the legislation under Moses. The very word ‘remember’ in the commandment (‘Remember the sabbath day’) presupposes, as Franz Delitzsch points out, an acquaintance with the sabbath. It would seem as if the sabbath were intended to be a great river of blessing following man throughout his career on earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-j-grier.html">W. J. Grier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Development of the Lord s Day from the Jewish Sabbath’, The Christian Graduate</cite></span></figcaption>

<blockquote><p>Northampton, May 18, 1742.

My dear Friend,

I am fully satisfied by the account your father has given me, that you have lately gone out of the way of your duty, and done that which did not belong to you, in exhorting a public congregation. I know you to be a person of good judgment and discretion, and therefore can with the greater confidence put it to you to consider with yourself what you can reasonably judge would be the consequence, if I and all other ministers should approve and publicly justify such things as laymen’s taking it upon them to exhort after this manner? If one may, why may not another? And if there be no certain limits or bounds, but every one that pleases may have liberty, alas! what should we soon come to? If God had not seen it necessary that such things should have certain limits and bounds, he never would have appointed a certain particular order of men to that work and office, to be set apart to it in so solemn a manner, in the name of God: the Head of the church is wiser than we, and knew how to regulate things in his church.

’Tis no argument that such things are right, that they do a great deal of good for the present, and within a narrow sphere; when, at the same time, if we look on them in the utmost extent of their consequences, and on the long run of events, they do ten times as much hurt as good. Appearing events are not our rule, but the law and the testimony. We ought to be vigilant and circumspect, and look on every side, and, as far as we can, to the further end of things. God may if he pleases, in his sovereign providence, turn that which is most wrong to do a great deal of good for the present; for he does what he pleases. I hope you will consider the matter, and for the future avoid doing thus.

You ought to do what good you can, by private, brotherly, humble admonitions and counsels; but ’tis too much for you to exhort public congregations, or solemnly to set yourself, by a set speech, to counsel a room full of people, unless it be children, or those that are much your inferiors, or to speak to any in an authoritative way. Such things have done a vast deal of mischief in the country, and have hindered the work of God exceedingly. Mr. [Gilbert] Tennent has lately wrote a letter to one of the ministers of New- England, earnestly to dissuade from such things.

Your temptations are exceeding great: you had need to have the prudence and humility of ten men. If you are kept humble and prudent, you may be a great blessing in this part of the land, otherwise you may do as much hurt in a few weeks as you can do good in four years. You might be under great advantage by your prudence to prevent those irregularities and disorders in your parts, that prevail and greatly hinder the work of God in other parts of the country; but by such things as these you will weaken your own hands, and fill the country with nothing but vain and fruitless and pernicious disputes. Persons when very full of a great sense of things are greatly exposed; for then they long to do something, and to do something extraordinary; and then is the devil’s time to keep them upon their heads, if they be not uncommonly circumspect and self-diffident.

I hope these lines will be taken in good part, from your assured friend,

Jonathan Edwards.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Anon., 18 May 1742 in Edwards A. Park, ‘What can be done for augmenting the number of Christian ministers?’, Bibliotheca Sacra, 28, no. 109 (January 1871), pp 95-96.</cite></span></figcaption>

<blockquote><p>In close connexion with the Headship of Christ, and flowing from it, is another fundamental principle of the Church of Scotland, commonly denominated her spiritual independence. This is that privilege conferred upon her by her Lord when he said, “I will give unto thee the key of the kingdom of heaven, and whatsoever thou shalt bind on earth shall be bound in heaven, and whatsoever thou shalt loose on earth shall be loosed in heaven;” and it is the principle thus embodied in her standards, “the Lord Jesus, as King and Head of his Church, hath therein appointed a government, in the hand of Church officers, distinct from the civil magistrate.”

This government is divine in its origin, spiritual in its nature, and independent in its exercise. It is not inconsistent with it for the State to acknowledge and patronise it, but it must not meddle with it so as to control or influence it. The judicatories of the Church and the State are co-ordinate, but entirely independent of each other. They have their distinct and separate provinces, and the one must not tamper with the other.</p></blockquote>

<blockquote><p>…but to… sacrifice… at eight of clock in the morning, rather than at ten, in this place physical, rather than this, is no worshipping… but a mere physical circumstance, neither up, nor down to the worship; and time and place-physical are neither worship, nor religious means of worship. 2. Time, and place, name, country, form, figure, habit [dress] or garments, to hold off injuries of sun and heaven as such are never commanded, never forbidden of God, and therefore the change of these circumstances can be no change of a Commandment of God: We never advanced circumstances, as such to the orb and sphere of morals;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 63</span></figcaption>

<blockquote><p>Saying AMEN, audibly to all. Neh. 8. 6. […]

As for an audible pronouncing of Amen, if the mind of them that pronounce it, have been upon that which the Minister uttered, and their heart have given consent thereto, it compriseth altogether as much as the Minister hath uttered. This is the only warranteable means for people to utter their mind in a Congregation. It must therefore be uttered by every one, altogether, so loud, as well as they hear what he hath uttered in their name. For the one is as requisite as the other.</p></blockquote>

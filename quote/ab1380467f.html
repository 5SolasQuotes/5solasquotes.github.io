<blockquote><p>The English Divines in the Synod of Dort held, that God had a serious will of saving all men, but not an efficacious will of saving all: Thus differing from the Arminians on one side, and from some Protestant Authors on the other side; and their great instance of the possibility of a serious will and not efficacious, is this of God’s to Adam, seriously willing him to stand, and withal giving him ability to stand: yet it was not such an efficacious will, as de facto did make him stand …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 107.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>Question 10: Whether the will is rightly distinguished into antecedent and consequent? Distinguished. Answer: If by “antecedent” be understood the declaration of the divine will, and of the order posited by it between the condition and the conditioned thing: Affirmed. E.g., “if anyone believes,” or “if anyone perseveres, he shall be saved”: which is equivalent to that categorical enunciation, “every believer or persevering one shall be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>There is a twofold Word, or rather a double declaration of the same Word:

1. There is God’s external or outward Word, containing letters and syllables, and this is his external voice.

2. There is God’s internal Word and voice, which secretly speaks to the heart, even by the external Word, when that only speaks to the ear. … 2. This inward Word is double: 1. ineffectual (though inward); 2. effectual. 1. Ineffectual, is that which has some inward operation upon the heart, but it attains not God’s end to bring a man into a state of life; and thus, Heb. 6:2, 5. Many tasted of the good Word of God, yet fell away. And such a heart is compared to a field which a man plows and sows, and rain falls on it, and yet the end is not attained: it brings forth thistles; and this many Jews did hear, and hence had some kind of faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subjection to Christ in all his Ordinances &amp; Appointments the best means to preserve our Liberty</cite>, ... (d. 1649; London: S.G., 1657), ‘Of Ineffectual Hearing’, pp. 89-90</span></figcaption>

<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>

<blockquote><p>XIX. Although God may be said to will the salvation of all by the will of sign [the revealed will] and to nill it by the beneplacit will [of decree], yet there is no contradiction here. Besides the fact that the universal proposition is to be understood not so much of the singulars of the genera as of the genera of the singulars, the former will relates to the mere approbation of God and the command of duty, while the latter is concerned with its futurition and fulfillment. The former denotes what is pleasing to God and what He has determined to enjoin upon man for the obtainment of salvation, but the latter what God Himself has decreed to do. But these two are not at variance: to will (i.e., to command man to believe) and to nill (i.e., to decree not to give him faith in order that he may believe)… XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-ab6f29151c" data-kw="">
<blockquote><p>But I hope the parliament will observe this great principle you were first acted by, and still are in all your Church-way, and will see how dangerous the tolerating of your way will be; for though you should for present hold nothing much different from the established rule, yet being allowed what may you not come to; according to this principle, how shall any State be sure of you long what you will hold: What if you should bring in community of goods, baptizing in rivers, the holy kiss into your assemblies at the beginning and ending of your ordinances, anointing sick persons with oil? It is but according to your principle: And we see you make so much of this principle and are so in love with it, that you wish it next to your first principle, enacted as the most sacred Law of all other[s], to live and walk by it in Christian States and Churches throughout the world;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f23d618857" data-kw="">
<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper</cite>, … (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-a1576e2223" data-kw="">
<blockquote><p>Wheras the Rejoinder makes sitting at a table in the Lord’s Supper and kneeling at prayer to be such things as the Lord could not command, but as snares, because sometime a table may be wanting [lacking], or something to sit on, or ability to sit, and so of kneeling: this is as poor a snare to catch any man of understanding in, as one shall lightly see made. For 1. many affirmative commandments of God there are, which in extraordinary cases cannot be fullfilled and cease to bind: as praying unto and praising of God with our voice: which is no snare, to him that cannot speak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (Amsterdam: Thorp, 1633), ch. 1, section 16, ‘Concerning an Argument Against our Ceremonies, out of 1 Cor. 14’, pp. 68-69</span></figcaption>

</figure><figure class="quote" id="q-120724e25c" data-kw="">
<blockquote><p>Question 6. Whether absolute and unlimited power of royalty be a ray and beam of divine majesty immediately derived from God? Answer. Not at all. Such a creature is not in the world of God’s creation. Royalists and flatterers of kings are parents to this prodigious birth. There is no shadow of power to do ill in God. An absolute power is essentially a power to do without or above law, and a power to do ill, to destroy; and so it cannot come from God as a moral power by institution, though it come from God by a flux of permissive providence; but so things unlawful and sinful come from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644), p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

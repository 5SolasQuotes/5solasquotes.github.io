<main class="wrap"><figure class="quote" id="q-91e0ad208d" data-kw="">
<blockquote><p>When the public magistrate proves faithless, and when he is determined to betray the interests of the commonwealth, then the citizens may take measures for their own safety, and may assume that power which he so ruinously prostitutes. When this classic city [Londonderry] was invested, and when the chief magistrate had resolved upon a base surrender, was he not forced to flee when his projects were discovered, and were not the citizens warranted to occupy his place with braver and more trusty governors?

And when the monarch himself [King James II] evinced a disposition to sacrifice the good cause, was not he too obliged to give way to the righteous indignation of an injured people, and to abdicate the sovereignty? And had not they a right to appoint as his successor that illustrious Presbyterian [King William III], who was raised up by Providence to vindicate their principles, and to serve as the bulwark of Protestantism?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-d-killen.html">William D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse I in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

And when the monarch himself [King James II] evinced a disposition to sacrifice the good cause, was not he too obliged to give way to the righteous indignation of an injured people, and to abdicate the sovereignty? And had not they a right to appoint as his successor that illustrious Presbyterian [King William III], who was raised up by Providence to vindicate their principles, and to serve as the bulwark of Protestantism?”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c6ec62e8f" data-kw="">
<blockquote><p>8. They [civil magistrates] may and ought to make such [spiritual seducers] incapable of public places of trust, and remove them from such: Because, 1. They cannot be supposed to employ their power singly. 2. Because such trust agreeth not to men and subjects as such, but are voluntarily conferred as tokens of respect put upon men eminently qualified, and as may be for the good of the commonwealth: And therefore it cannot be justly accounted a marring of their liberty as men or subjects. Upon this ground was Maachah the mother of Asa removed from being Queen, or having any government, 1 Kings 15:13; 2 Chron. 15:16, yet it cannot be said she was wronged when she was so dealt with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (1659), pt. 3, ch. 14, p. 256</span></figcaption>

<blockquote><p>3… Yet I intend not to handle the case of invasion, to show in what cases only an invasion of another nation in a hostile manner is lawful: I am from all my books, that I cannot consult with casuists in that point… Had God given me life, I intended a large Treatise concerning the Usurpation of the Government of England, and the unlawfulness of the invasion of Scotland [by Cromwell]; but my collections being lost and taken away, they must die with me; I hope more able hands will write against the invasion, though they cannot fight against the invaders.</p></blockquote>

<blockquote><p>To go as pirates and catch up poor negroes or people of another land, that never forfeited life or liberty, and to make them slaves, and sell them, is one of the worst kinds of thievery in the world; and such persons are to be taken for the common enemies of mankind; and they that buy them and use them as beasts, for their mere commodity, and betray, or destroy, or neglect their souls, are fitter to be called incarnate devils than Christians, though they be no Christians whom they so abuse.</p></blockquote>

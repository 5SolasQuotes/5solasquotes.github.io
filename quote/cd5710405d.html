<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession [i.e. Lutherans] might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren, p. 297</span></figcaption>

<blockquote><p>§23. 15. In civil actions that are religious only finally, and by participation, and not any acts of special worship, it is lawful to use symbolical rites that are in their kind near of kin to sacraments in their kind, and may be called ‘civil sacraments’, such as: the sealing and delivery of indentures, or other covenant writings: and the delivery of possession of a house by a key, and of the temple by a book and bell-rope, and of land by a twig and turf; and of civil government by a crown, or scepter, or sword, etc. And such is the use of a ring in marriage. … §43. 3. And for the ring in marriage, I see no reason to scruple the lawfulness of it: For though the Papists make a sacrament of marriage, yet we have no reason to take it for any ordinance of divine worship anymore than the solemnizing of a contract between a prince and people. All things are sanctified and pure to the pure: but that does not confound the two Tables [of the Ten Commandments], nor makes all things to be parts of worship that are sanctified. The coronation of a king is sanctified as well as marriage, and is as much a sacrament as marriage, and the ceremonies of it might as well be scrupled: especially when God does seem to go before them by the example of anointing, as if He would confine them to that ceremony, which yet was none of his intent, nor is it much scrupled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 406 &amp; 411</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>Thirdly, we may use any such fellowship with them as is, or shall be occasioned by virtue of our particular calling. Thus Christ, being the Savior of the world, conversed with publicans and sinners. Thus Paul being the Apostle of the Gentiles, enters into Athens, and there beholds their devotions. It is God’s commandement that the believing wife, shall nor forsake her unbelieving husband, if he be willing or desirous to dwell with her. (1 Cor. 7:13) If it be alleged that Ezra constrained the Israelites to put away their Ammonitish and Moabitish, and the rest of their heathen, wives (Ezra 10:3): I answer that their marriages were indeed void and no marriages: First, because the nations with whom they married were people, according to God’s Law, civilly dead: in that God had commanded their destruction, unless when peace was offered, they accepted of it. (Dt. 20:10) Secondly, in that they were not only idolators, but also enticers to idolatry; God by express commandment did simply forbid the Jews to marry with them unless they did repent and changed their religion. And in regard of this commandment, the foresaid marriages were nullities, as incestuous marriages are no marriages by reason of the absolute prohibition of God. Touching the society forbidden us with idolators, it is the society of amity, that is, of familiarity and special love. Two examples, whereof we find in the Word of God. One is of contracts of marriage with idolators, which the Scripture precisely condemns as an abomination in lsrael and a profanation of the name of God, when Judah marries the daughter of a strange god, Mal. 2:11. Boaz indeed married Ruth, a Moabitess, but she was entered and received into the body of the Israelites by a former marriage: and she was one that believed in the God of Israel. ‘Thy people’ (says he to Naomi and Ruth) ‘shall be my people, and thy God, my God.’ Sampson likewise married a woman of the Philistines (Judg. 14:4), but that was by divine instinct and consequently by a special appointment of God. Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused. … Here one exception must not be omitted. Put the case that the husband is an idolator and is content to dwell with his believing wife: she then is to live with him, not only in the society of peace, but also in the society of amity by doing all duties of Iove that concern a wife, so far as may stand with good conscience. For the precept of Paul’s, that marriage and marriage duties are to be preserved of the believing party with an infidel (1 Cor. 7:13-14), so be it the said infidel be content. It may be al!eged that thus the believer exposes himself to danger of idolatry. I answer: Not because God defends them that call upon Him who thrust not themselves into danger, but bear the danger and calamity into which they are fallen, attending upon their callings. Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>

uth%2C+a+Moabitess%2C+but+she+was+entered+and+received+into+the+body+of+the+Israelites+by+a+former+marriage%3A+and+she+was+one+that+believed+in+the+God+of+Israel.+%E2%80%98Thy+people%E2%80%99+%28says+he+to+Naomi+and+Ruth%29+%E2%80%98shall+be+my+people%2C+and+thy+God%2C+my+God.%E2%80%99+Sampson+likewise+married+a+woman+of+the+Philistines+%28Judg.+14%3A4%29%2C+but+that+was+by+divine+instinct+and+consequently+by+a+special+appointment+of+God.+Again+it+is+alleged+that+God+by+express+law+gave+leave+to+the+Israelites+to+marry+heathenish+women+taken+captives+in+war.+%28Dt.+21%3A10-11%29+Answer%3A+That+is+a+law+only+of+toleration%2C+without+approbation%2C+in+which+God%2C+for+the+hardness+of+their+hearts%2C+permits+the+evil%2C+which+cannot+by+policy+be+quite+taken+away.+And+this+appears+by+two+things%3A+First%2C+before+the+marriage%2C+the+woman+by+God%E2%80%99s+appointment+must+be+deformed%2C+by+cutting+off+her+hair%2C+by+the+growing+of+her+nails%2C+by+putting+off+the+garments+of+her+captivity%2C+and+by+mourning+for+her+father+and+mother+for+the+space+of+a+month%3A+and+the+end+of+this+was+to+cause+a+dislike+in+the+Israelites+of+their+intended+marriages%2C+or+to+signify+a+change+of+religion%2C+at+the+least+in+pretense%2C+in+the+parties+espoused.+%E2%80%A6+Here+one+exception+must+not+be+omitted.+Put+the+case+that+the+husband+is+an+idolator+and+is+content+to+dwell+with+his+believing+wife%3A+she+then+is+to+live+with+him%2C+not+only+in+the+society+of+peace%2C+but+also+in+the+society+of+amity+by+doing+all+duties+of+Iove+that+concern+a+wife%2C+so+far+as+may+stand+with+good+conscience.+For+the+precept+of+Paul%E2%80%99s%2C+that+marriage+and+marriage+duties+are+to+be+preserved+of+the+believing+party+with+an+infidel+%281+Cor.+7%3A13-14%29%2C+so+be+it+the+said+infidel+be+content.+It+may+be+al%21eged+that+thus+the+believer+exposes+himself+to+danger+of+idolatry.+I+answer%3A+Not+because+God+defends+them+that+call+upon+Him+who+thrust+not+themselves+into+danger%2C+but+bear+the+danger+and+calamity+into+which+they+are+fallen%2C+attending+upon+their+callings.+Again%2C+if+the+unbelieving+party+shall+solicit+the+other+and+use+all+means%2C+both+fair+and+foul%2C+to+draw+him+or+her+to+idolatry%2C+the+believing+party+in+this+case%2C+may+go+aside+for+a+time+and+omit+the+duty+of+marriage.+For+this+is+all+one+as+if+the+idolatrous+and+unbelieving+party+should+depart.+For+indeed%2C+that+party+is+said+to+depart+in+whom+the+cause+of+departing+is%2C+as+in+the+Church+he+is+a+schismatic+in+whom+the+cause+of+the+schism+is%2C+and+not+always+he+that+separates.+Secondly%2C+it+may+be+objected+that+a+Christian+may+not+become+the+member+of+a+harlot%2C+much+less+of+an+idolator%3B+considering+idolatry+is+a+great+sin.+I+answer%3A+The+reason+is+not+like.+For+the+fornicator+consents+to+the+fornication%3A+and+so+does+not+the+believing+party%2C+by+doing+duties+that+pertain+to+marriage%2C+consent+to+the+idolatry+of+the+unbelieving+party.+And+the+fornicator+willingly+joins+himself+with+an+harlot%3B+whereas+the+believing+party+desires+he+might+be+yoked+with+a+believer+and+not+with+an+infidel.+Lastly%2C+it+may+be+objected%3A+if+for+adultery%2C+divorce+may+be+made%2C+why+not+for+idolatry+which+is+spiritual+adultery%3F+I+answer%3A+That+not+any+sin+by+itself%2C+as+it+is+a+sin%2C+not+breaking+the+troth+and+bond+of+marriage%2C+is+the+proper+cause+of+a+divorce%3B+and+not+any+kind+of+idolatry%2C+but+the+sin+of+adultery+breakest+his+troth.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98A+Warning+Against+the+Idolatry+of+the+Last+Times%2C+%26+an+Instruction+touching+Religious+or+Divine+Worship%E2%80%99+in+The+Works+%28London%3A+Legatt%2C+1626%29%2C+vol.+1%2C+p.+692&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe7179c861a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e7179c861a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divorce-remarriage/#:~:text=Thirdly%2C%20we%20may%20use%20any%20such,sin%20of%20adultery%20breakest%20his%20troth&amp;text=Thirdly%2C%20we%20may%20use%20any%20such%20fellowship%20with&amp;text=but%20the%20sin%20of%20adultery%20breakest%20his%20troth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Monogamy is a distinctive aspect of the Christian tradition. Polygamy existed in most ancient societies, but Christian authorities opposed the practice, in part to distinguish monogamous Christianity from other faiths. By the early modern period, polygamy was rare in Christian Europe, and it had gained a negative reputation because of its association with sexual excess and lust. During the Reformation, however, certain individuals, including Luther himself, condoned polygamy, and Lutheran doctrine was compatible with plural marriage in some ways. After an ill-fated attempt [by Anabaptists] to establish a polygamous community at Munster, however, it became much more difficult to support polygamy, as the practice was further tainted by association with religious radicalism and lustful, degenerate behavior. During the English Revolution, the downfall of censorship and the tumultuous political climate allowed some English authors to write in support of plural marriage, using both practical and religious arguments. Yet, the majority of authors condemned the practice. Plural marriage continued to be associated with pagan and barbaric culture, and accusations of polygamy were used to undermine and discredit one’s enemies. In the literature of travel and colonisation, accusations of polygamy were used to demean and vilify peoples such as Jews and Turks. The existence of polygamy in Europe’s colonies helped Christian Europeans to maintain a sense of superiority over the pagan, barbaric indigenous inhabitants and helped to establish a shared European and Christian identity. In the writings of the Reformation and the Revolution, along with the literature of travel and colonisation, polygamy became a boundary marker between Christians and non-Christians, Catholics and Protestants, radicals and non-radicals, civilised countries and barbaric countries, and England and its colonies. Polygamy’s function as a boundary marker, more than any theological reasons, was the reason why plural marriage did not gain significant support in early modern England.</p></blockquote>

<blockquote><p>That children ought not to dispose of themselves in marriage without the consent of parents, is the constant doctrine of the Protestant churches. And the reasons are these: (1) The scripture gives the power of making marriages for children to the parents, Deut. 7:3; Jer. 29:6; 1 Cor. 7:37, 38. Yea, even after parties have consented, it is left to the parent, whether to give his abused daughter to him that has been guilty with her, Ex. 22:16, 17. (2) The most approved examples of marriage in scripture go this way, Gen. 24:3, 4; 28:1, 2; and 29:19; Judg. 14:2. (3) Lastly, The reason is plain; for the child cannot give away any thing that is his parents’ against their will. Now, the child himself is the parents’, a part of their self-moving substance, in which they have a most undoubted property. So, when the devil was permitted to fall upon what was Job’s, he fell upon his children, and killed them in the first place. Yet, upon the other hand, no parent can force a child to marry such and such a person; for consent makes marriage, and that which is forced is no consent. The child must be satisfied as well as the parent, Gen. 24:57. So the short of it is, that the consent of both is necessary, and that the parent must neither force the child, nor the child rob the parent.</p></blockquote>

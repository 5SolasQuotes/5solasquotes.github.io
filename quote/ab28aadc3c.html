<main class="wrap"><figure class="quote" id="q-ab28aadc3c" data-kw="">
<blockquote><p>Consider the Opportunities of Public Worship, and solemn Occasions of approaching the Divine Presence: Are they as much the desire of your Souls, and the rejoicing of your Hearts as once they were? Are you not more easily diverted from them, less satisfied and refresht by them? Are not all Gospel Ordinances less powerful and quickening, and your profit and advantage thereby unspeakably less then formerly?

Do you hunger and thirst, and pant as the Hart after the Water-brooks, to draw nigh to God, and come into his Courts? Do you make Conscience of preparing before hand? Do you come with a real desire, and design, and expectation of profiting, and bettering your Spirits? Do you join in every part of Divine worship, with that attention, seriousness, and composure of mind, and taste the sweetness and benefit of such solemnities, as formerly?

Are such services performed with that Awe of God, with that Humility, Fervency, and Intenseness of Spirit, as sometimes they were? Are you not more negligent and unconcerned before and after, whether you find any thing of this or no? Though your Desires are weak, your Hearts flat, your Thoughts wandering, your Spirits trifling, so the work be done, and the duty be over, (in how formal, customary, and careless a manner, soever it be) you consider it not, you lay it not to Heart, you reflect not upon it, you bewail it not, or at least are better contented and sooner quieted, and take less notice of the frame of your Heart in such Duties, than formerly?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shower.html">John Shower</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Serious reflections on time and eternity with some other subjects, moral and divine. To which is prefixed an introduction concerning the first day of the year, how observed by the Jews, and may best be employed by a serious Christian</cite>, (London: Joseph Watts, 1689), pp 186-87.</span></figcaption>

<blockquote><p>and keep the ordinances: …The word signifies anything that is doctrinally delivered, or taught men, whether it concerns faith or manners. It is thought, that in this text it doth not signify what the apostle had delivered to them with respect to faith, or their moral conversation, but with respect to matters of order, because such is the next instance which the apostle mentions, about praying or prophesying with the head covered, or uncovered; and undoubtedly any precepts of that nature from one guided by an infallible Spirit ought to be observed. The apostle doth not command them to keep any traditions, which others should to the end of the world deliver to them, he only praises them for keeping those which he had delivered.</p></blockquote>

</figure><figure class="quote" id="q-58aa8968f2" data-kw="">
<blockquote><p>The act of Perth [1618] about kneeling would draw some commendation to this ceremony [of kneeling before the sacrament], from those words of the Psalm, ‘O come let us worship and bow down. let us kneel before the Lord our maker.’ [Ps. 95:6] Which is as if one should argue thus: We may worship before the lord. Therefore, before a creature. We may kneel in an immediate worship of God, Therefore in a mediate. For who sees not, that the kneeling there spoken of is a kneeling in the action of solemn praise and joyful noise of singing unto the Lord?</p></blockquote>

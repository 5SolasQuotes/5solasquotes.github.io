<main class="wrap"><figure class="quote" id="q-eaaa519a7b" data-kw="">
<blockquote><p>All decays in Religion begin in individual persons, though it extend it self unto families, and so the infection spreads unto greater societies, Ecclesiastical and National. For such also is the order in the genuine progress of the power of Religion whereunto it is opposed. The testimony that God gave unto Abraham was, that keeping the way of the Lord himself, he taught and commanded his Children and household after him so to do.

And if the living power of Godliness expressed in the History of Christ, and the Gospel in an holy Conversation, be not preserved in Individual Persons; the Profession of the purest Religion in Churches, or the highest Pretence unto it in Publick, National Acts are neither useful to the Souls of men, nor do any way tend unto the Glory of God. And the sole use of all outward Religious Order and Profession is lost, where they are not applied unto the Ingenerating and promoting of Holiness, or Evangelical Obedience in particular Persons.

Wherefore if any Revival of the Power of Religion in the World may be yet hoped for; if any stop may be put unto the Fatal Declension, which it suffers under, the forming and restoring of the Principles of it in the Hearts and Consciences of such Persons is the way whereby it must be attempted; from and by them must it be diffused into Families, and greater Societies: Here must all Reformation begin, or in the use of means suited thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or, A Practical Exposition of the Ten Commandments With a Resolution of Several Momentous Questions and Cases of Conscience</cite>, (Glasgow: Robert Sanders, 1676), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-044af23c27" data-kw="">
<blockquote><p>First, the vow must be possible of fulfilment and within our power to perform. For who will vow an impossible thing? Or who will demand it? All vows are therefore described in the Scriptures in terms that are within our power, such as to give God cattle, sheep, houses, land, and so on. Now, chastity is not in our power, as little as are God’s other wonders and graces. But we are all made for marriage, as our bodies show and as the Scriptures state in Gen., ch. 2: “It is not good that man should be alone; I will make him a help meet for him.”

Whoever, therefore, considers himself a man and believes himself to be included in this general term should hear what God, his Creator, here says and decrees for him: he does not wish man to be alone but desires that he should multiply, and so he makes him a helpmeet to be with him and help him so that he may not be alone. This is the Word of God, through whose power procreative seed is planted in man’s body and a natural, ardent desire for woman is kindled and kept alive. This cannot be restrained either by vows or by laws. For it is God’s law and doing. Let him who will be alone abandon the name of man and prove or make himself an angel or spirit, for God does not grant or allow such a condition to a man.

Accordingly we do well when we sing of holy virgins in such a way as to indicate that they lived lives that were angelic rather than human and that they were enabled to live in the flesh and yet without the flesh by a special grace of God. Our bodies are in great part the flesh of women, for by them we were conceived, developed, borne, suckled, and nourished, and so it is quite impossible to keep entirely apart from them. This is in accord with the Word of God. He has caused it to be so and wishes it so. Even the impotent, as we know, are full of natural desire. Indeed, the more impotent they are, the more they desire to be with women, which is altogether natural, for we always desire most what we can least have.

Therefore, whoever will live alone undertakes an impossible task and takes it upon himself to run counter to God’s Word and the nature that God has given and preserves in him. The outcome is in keeping with the attempt; such persons revel in whoredom and all sorts of uncleanness of the flesh until they are drowned in their own vices and driven to despair. For this reason such a vow against God’s Word and against nature, being impossible, is null and void. And God also condemns it just as if somebody should vow to be God’s mother or to make a heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Wolfgang Reissenbusch, 27 March 1525 in Luther: Letters of Spiritual Counsel, ed. and trans. Theodore G. Tappert, Library of Christian Classics, vol. 18 (London: SCM Press, 1955), pp 273-74.</cite></span></figcaption>

</figure><figure class="quote" id="q-e410b1ea02" data-kw="">
<blockquote><p>To conclude, we are to observe of this law of nature, that at least its principal and most universal precepts are founded not in the mere arbitrary good will and pleasure of God, but in his unspotted nature. For if it is necessary that God should therefore prescribe a law for man, because himself is the original holiness; no less necessary is it, he should prescribe a law, which shall be the copy of that original. So that the difference between good and evil, ought to be derived not from any positive law, or arbitrary constitution of the divine will, but from the most holy nature of God himself …</p></blockquote>

</figure><figure class="quote" id="q-cac2629ee6" data-kw="">
<blockquote><p>…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again.

1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne.

2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off.

3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C].

4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again.

1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne.

2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off.

3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C].

4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.”

<blockquote><p>The second consequence attributed to the imputation of Christ’s righteousness, is a title to eternal life. This in the older writers is often expressed by the words “adoption and heirship.” Being made the children of God by faith in Christ Jesus (Gal. 3:26), they are heirs of God and joint heirs with Jesus Christ of a heavenly inheritance. (Romans 8:17.) The mere expiation of guilt confers no title to eternal life. The condition of the covenant under which man was placed was perfect obedience. This, from all that appears in Scripture, the perfection of God requires. As He never pardons sins unless the demands of justice be satisfied, so He never grants eternal life unless perfect obedience be rendered. Heaven is always represented as a purchased possession. In the covenant between the Father and the Son the salvation of his people was promised as the reward of his humiliation, obedience, and death. Having performed the stipulated conditions, He has a claim to the promised recompense. And this claim inures to the benefit of his people. But besides this, as the work of Christ consisted in his doing all that the law of God, or covenant of works requires for the salvation of men, and as that righteousness is freely offered to every one that believes. every such believer has as valid a claim to eternal life as he would have had, had he personally done all that the law demands. Thus broad and firm is the foundation which God has laid for the hopes of his people. It is the rock of ages; Jehovah our righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, 3 vols. (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 3.164–65.</span></figcaption>

9d03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99809b9d03.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/hodge-christ-fulfilled-the-conditions-of-the-covenant-of-works-for-believers/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, (4.4.48), trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 188.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<blockquote><p>7. Lastly, In his person. Being a sinful man under the covenant of works, he is a cursed man; For it is written, “Cursed is every one that continueth not in all things which are written in the book of the law to do them.” The curse fixeth not only on what is his, but on himself; and it is for his sake that it is laid on other things. The curse, as you have heard, is on his soul, and on his body; for wherever sin is found under this covenant, there the curse also is And, (1.) The man is under the power of Satan, Acts 26:18. Into the hand of this enemy man fell, when he broke the covenant of works. Satan having waged war against heaven, set on man, heaven’s confederate, and gained the unhappy victory, gained him by temptation to renounce his allegiance to his rightful Lord by breaking the covenant, and so he fell under his power, as his captive taken in war, Isa. 49:24, was brought under bondage to this worst of masters, 2 Pet. 2:19, and is ruled by him at his pleasure, 2 Tim. 2 ult. The curse of the covenant falling on the covenant-breaker, he is thereby laid under condemnation, and adjudged to death according to the threatening; and so he falls under the power of him that has the power of death, that is the devil, Heb. 2:14. Every natural man is shut up as in a prison, in his natural state; and there he lies in bonds, Isa. 61:1. There are God’s bands on him, the bands of the curse binding him over to death; and the devil’s bands are on him, viz, the bands of strong lusts and corruptions, with which they are laden, as a malefactor in prison is laden with irons. And Satan has the power of gaoler over them. He keeps the keys of the prison, and narrowly watches the prisoners that none of them escape. They are not all kept alike close; but none of them can move beyond the bounds of his jurisdiction, more than the prisoner can get out of the dungeon. Even when the king’s word comes to deliver the elect, he will not yield them up; but the prison doors must be broke open, and they forcibly taken out of his hand by a stronger than he. (3.) The natural man being under the curse is continually in hazard of utter destruction, of having the copestone put on his misery, and being set beyond all possibility of help. If his eyes were opened he would see himself every moment in danger of dropping down into the pit of hell; Psalm 7:12, “If he turn not, he will whet his sword; he hath bent his bow, and made it ready.” The man is constantly standing before God’s bent bow, and has nothing to secure him one moment from the drawing of it. The sentence of death is passed against him, John 3:18, but there is no day intimated for the execution, but every day the dead warrant may be signed against him, and he led forth to death. His name may be “Magor-missabib,” a terror round about, Jer. 20:3. Whither can he look where he will not see his enemies ready to ruin him, on a word of command from that God under whose curse he lies? And what can he do for himself amidst his armed enemies? He is quite naked, Rev. 3:17, and cannot fight them; he is without strength, Rom. 5:6, and cannot wield armour, though he had it; he is bound hand and foot, Isa. 61:1, and cannot flee; and if he could, whither could he flee for safety? Heaven’s gates are shut upon him; in the utmost parts of the earth, or the most remote rock in the sea, God’s hand would find him out. Justice is pursuing the criminals under the curse, crying for vengeance on the traitors, and their foot shall certainly slide in due time; the law is continually throwing the fire-balls of its curses on them, and will at length set them on fire round about; death is on the pursuit after them, and has gained much ground of them already, and the cloud of wrath hangs over their heads continually in the curse, and the small rain of God’s wrath is still falling on them; how soon death may overtake them, they know not; and then the cloud breaks, and the great rain of his strength falls down upon them, and sweeps them away without hope for ever and ever.</p></blockquote>

r+foot+shall+certainly+slide+in+due+time%3B+the+law+is+continually+throwing+the+fire-balls+of+its+curses+on+them%2C+and+will+at+length+set+them+on+fire+round+about%3B+death+is+on+the+pursuit+after+them%2C+and+has+gained+much+ground+of+them+already%2C+and+the+cloud+of+wrath+hangs+over+their+heads+continually+in+the+curse%2C+and+the+small+rain+of+God%E2%80%99s+wrath+is+still+falling+on+them%3B+how+soon+death+may+overtake+them%2C+they+know+not%3B+and+then+the+cloud+breaks%2C+and+the+great+rain+of+his+strength+falls+down+upon+them%2C+and+sweeps+them+away+without+hope+for+ever+and+ever.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+11+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+303%E2%80%9304.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa93b5fd0b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a93b5fd0b1.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/07/boston-man-under-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-4aad268a02" data-kw="">
<blockquote><p>Quest. Now, whence comes this rootedness and firm stability of God’s children? Ans. Especially from this, that they are now in the covenant of grace, rooted in Christ, who is God-man, in whom they are firmly rooted. In Adam we had a root of our own, but now our root is in Christ. All grace is first poured into Christ’s blessed nature, John 1:16, and then at a second hand, ‘out of his fulness we all receive grace for grace.’ Being rooted in Christ we become firm, for there is in him an everlasting marriage and union. ‘The root beareth us, we bear not the root,’ Rom. 11:18. Christ beareth us, we bear not him. So now, in the covenant of grace, all the firmness is out of us. Even as salvation itself was wrought out of us by a mediator, so it is kept by a mediator out of us. All goodness, grace, and favour of God to us is not in us, but in Christ; but it is so out of us, as Christ and we are one. But now we only speak of the cause of our firmness and stability, that because we are in the state of grace we have an everlasting firmness, as we are in Christ Jesus, God now making a second covenant, he will not have it disannulled as the first was, for his second works are better than his first. His first covenant was, ‘Do this and live,’ Lev. 18:5; but his second is, ‘Believe this and live,’ Rom. 10:9. So as howsoever our state in grace be but little, yet it is of a blessed, growing, spreading, firm nature, so sure as what is begun in grace will end in glory. Where God gives the first fruits he will give tenths, yea, the full harvest and all, because by the covenant of grace we are one with Christ, who is an everlasting head that never dies. Subservient to this now we have promised in the covenant of grace that we shall never depart from him, and that he will never depart from us to do us good. He puts an awe-band into our hearts, that we shall never depart from him. But this point being often touched, leaving it, we will come to answer some objections.</p></blockquote>

<blockquote><p>The law, then, as a covenant of works, does, in the most authoritative manner, demand from every descendant of Adam who is under it perfect holiness of nature, perfect righteousness of life, and complete satisfaction for sin. And none of the race of fallen Adam can ever enter heaven unless he either answers these three demands perfectly in his own person or accepts by faith the consummate righteousness of the second Adam, who “is the end of the law for righteousness to every one that believeth” (Rom. 10:4).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-23e2bc2dd2" data-kw="">
<blockquote><p>No Men are under more absolute Command then Soldiers, that must not dispute, but obey the Orders of their General. In like manner do you observe all the Orders of the Lord Jesus, obey all his Words of Command, adventure upon the hottest and hardest pieces of Service, when he requires it; hold no Intelligence, or Treacherous, close Correspondence with his Enemies; In every Motion or Action consider with your selves whether this or that course, and carriage and Posture will please Christ.

And in particular please him by a ready and cheerful Obedience to Inferior, Commissioned Officers for his sake. Obey them that have the Rule over you, is one great word of Command which our Lord &amp; Saviour gives, Heb. 13. 7, 17. Though I am as truly &amp; heartily opposite to the Presbyterian Persuasion (with due respect to the Piety and Learning, and Orthodoxy and Excellent Abilities and Accomplishments of those our Fellow-Brethren, and Soldiers that march on that side of the way, be it spoken) wherein it lies in direct Opposition to the Substantials of the Congregational-way, as any of you: and though I am remote enough from the intention of improving the Text but now mentioned, to the establishing of such an Absolute and Arbitrary Rule in the Presbytery, as is really inconsistent, and incomportable with the due privilege and liberty of the People:

[Y]et I am sure that all are not Guides, Overseers, and Rulers, but that there are Rulers and Ruled, the Governors and the Governed in all particular Churches according the Sovereign Institution of Jesus Christ; there are Officers and Private Soldiers according to the appointment of our Lord General: And I must say freely, that that way of Church-Government that allows not the Rule, and Government truly and properly so called, to Church Officers, is not the way of Christ’s Institution. Obey therefore such as the Lord Jesus hath set over you in the Lord, if you mean to please him. Otherwise you may be sure that your General will severely punish the undue contempt of the meanest Officer in the Christian Army.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/urian-oakes.html">Urian Oakes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The unconquerable, all-conquering, &amp; more-then-conquering soldier, or, The successful war which a believer wageth with the enemies of his soul as also, the absolute and unparalleled victory that he obtains finally over them through the love of God in Jesus Christ: as it was discussed in a sermon pre</cite>, (Cambridge MA: Samuel Green, 1674), p. 29.</span></figcaption>

</figure><figure class="quote" id="q-dc182cff5f" data-kw="Keys Peter">
<blockquote><p>Secondly, That authority of the keys was not committed to Peter alone, but to the rest of the apostles also. For in this place he did not give the keys, but only promised that he would give them: but afterwards, when he actually gives them (Matthew 28:18, 19; John 20:21, 22, 23), he addresses all the apostles equally. Therefore, if the pope have the authority of interpreting the scriptures, because the keys were given to Peter, then also other bishops and ministers, who were successors of the rest of the apostles, received the same authority, because the keys were given to the rest of the apostles as well as to Peter. Thirdly, Augustine says in his 124th Tractate upon John, as in many other places, that “Peter signified the universal church,” when the keys were given to him: therefore this power of the keys was given not to the pope alone, but to the whole church.</p></blockquote>

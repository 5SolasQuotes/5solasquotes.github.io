<blockquote><p>Though her failings are not to be instanced as precedents for imitation, nor mentioned as the least excuse for our faults in latter times; yet, may they not be told that we may confess, grieve for and avoid them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f016b59e9" data-kw="">
<blockquote><p>But yet it’s an error to hold that if any unjustly condemn other churches, it is a renunciation of that condemned church-state to have communion with them that condemn. Who would have thought the two separating extremes had so agreed in their principles? This is just the very core of the evil of the book of the contrary party which I here answer. Alas! how few Churches on earth have not peevishly condemned one another: it may be for Easter-day, for the choice of a bishop, as the Donatists (striving whose bishop was the right one): The case of the [early Church groups, the] Novatians, Audians, Luciferians and even of most in East and West are sad instances: And will such censoriousness unChurch them and forbid us communion with them? This is plain revenge and to curse them that curse us and abuse them that abuse us. I like Calvin ‘s spirit better than this, who said, “Though Luther should call me a devil, I would call him the excellent servant of God.”* Too many Lutherans now renounce communion with the Calvinists, who yet renounce not communion with them. * John Calvin, Letters of John Calvin, ed. Jules Bonnet (Philadelphia: Presbyterian Board of Publication, 1900), letter 122, to Bullinger (1544), p. 433.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-db9d3f8626" data-kw="">
<blockquote><p>It is a thing most ordinary with our Brethren to obtrude ministers upon congregations, sometimes contrary to the mind of the whole congregation, sometimes of the greater part thereof, upon the call only of some very few and inconsiderable part of that congregation, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is a thing most ordinary with our Brethren to obtrude ministers upon congregations, sometimes contrary to the mind of the whole congregation, sometimes of the greater part thereof, upon the call only of some very few and inconsiderable part of that congregation, etc.”

— John Currie, An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+a+thing+most+ordinary+with+our+Brethren+to+obtrude+ministers+upon+congregations%2C+sometimes+contrary+to+the+mind+of+the+whole+congregation%2C+sometimes+of+the+greater+part+thereof%2C+upon+the+call+only+of+some+very+few+and+inconsiderable+part+of+that+congregation%2C+etc.%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland+contra+the+Seceders&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb9d3f8626.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db9d3f8626.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=It%20is%20a%20thing%20most%20ordinary,inconsiderable%20part%20of%20that%20congregation%2C%20etc&amp;text=It%20is%20a%20thing%20most%20ordinary%20with%20our&amp;text=few%20and%20inconsiderable%20part%20of%20that%20congregation%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e87dc728a5" data-kw="">
<blockquote><p>A minister who is called of God must not lay aside his office, or the exercise of his office and power, upon every man’s desire; but if he be exauctorated at all, it must be by such as have lawful authority for that effect, unto whom he is bound in conscience to subject himself: And so he shall have peace, though the sentence be passed clave errante unjustly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-83bee89ed8" data-kw="">
<blockquote><p>And when the diet of the General Assembly came, having first done what they could for incapacitating all Brethren of differing judgment from these Resolutions, to sit in the Assembly, by citing them to the Assembly as guilty persons… did also make acts appointing and ordaining censures against all persons in this Church, whether Ministers or professors [professing Christians], that did not acknowledge the authority, and submit to the acts and constitutions of that Assembly concerning those Resolutions, and barring all such expectants [those training for the ministry] from entrance to the Ministry as should not acknowledge that authority, and submit to those constitutions; And in their Assembly of the next year at Edinburgh, do provide and ordain presbyteries to take special care, that upon the calling of any expectant to a particular charge of the ministry, before they admit him to his trials, they require him under his hand to pass from the Protestations and Declinators against this and the preceding General Assembly, if he has been accessory to the same; and to promise and give assurance that he shall abstain from holding up debates and controversies about matters of differences in this Kirk since the Assembly, 1650, in preaching, writing, or otherwise; upon the performance whereof, the presbytery shall proceed to his trials; If not, in that case the presbytery shall forbear to proceed, until the next General Assembly; leaving liberty to the presbytery or congregation for planting of the place otherwise: …By these proceedings and practices, the most unjust and irregular that we have known in this Church since we did begin to look at reformation in the year 1638, and which were indeed the great cause of the distempers and distractions that have since followed, malignant and disaffected men in congregations and presbyteries have got up the head, and having the advantage of the acts already mentioned, they do make a bar thereof to shut the door against the calling of able and godly men to the work of the Ministry, who cannot bring their consciences in bondage to these things;… …though yet the protesting Brethren have been tender even of these things [of order in due process], and have made conscience as to do nothing evil and sinful in itself, so to do nothing from contempt or disrespect to the least point of order; yea, they have been careful to keep within the bounds, warranted and allowed unto them of God; And, if it be fit to compare, we may truly say, that for all the noise our Brethren make against them, for the violation of order, and taking irregular courses, they have been more careful than themselves have been, and that they have more just and weighty grievance against them, even upon this accompt [account], than they have against the protesting Brethren:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), pp. 20-23</span></figcaption>

<main class="wrap"><figure class="quote" id="q-91141ffec4" data-kw="">
<blockquote><p>§X. The Son assumed the human nature from the blood of the Virgin Mary by the power of the Holy Spirit. §XI. And although the Holy Spirit can be said to have formed Christ’s body, created His soul, and joined them together, the Holy Spirit is not, however, the father of Christ, since nothing is generated from Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, p. 117</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-641785839b" data-kw="">
<blockquote><p>Christ, as God, sanctified Himself in His humanity: (1) By appointing His humanity as a sacrifice for sins. (2) By conferring merit and efficacy to His sacrifice, in order to acquire the remission of sins. Some of the Lutherans say that the person, according to both natures, was the subject of the passion. Whence that horrible assertion: the Deity also suffered: which most moderns disapprove, and that rightly. At the same time, being impatient of our animadversion, they strike at us with something else, itself erroneous, concerning the subject of the passion: namely, that, according to the opinion of the Calvinists, only the human nature of Christ suffered: which they then refute with many arguments, but in vain. They invent for themselves an enemy: they do not have us in this role, who orthodoxly and according to Scripture teach, that Christ, according to the flesh, suffered, 1 Pet. 4:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), Species of the Office of Christ, pt. 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-c9cd8a1652" data-kw="">
<blockquote><p>The union personalis in Christ was made adiairetos, indivisibly, in respect of place, so that the human nature is nowhere unsupported by the Logos, the Logos nowhere fails to support the human nature, nor is it outside the Logos or the Logos apart from it: akoristos, inseparably in respect of time, because this union is never dissolved but is perpetual, which was also seen in the death and burial…</p></blockquote>

</figure><figure class="quote" id="q-f91ea98f10" data-kw="">
<blockquote><p>Nor was this perfect exemption from violence or injury at the hand of men a mere isolated fact. It was part of the general scheme or of the understood relation to human life occupied by Christ. He was not to dash His foot against a stone (Ps. xci.). Disease in the ordinary course, or as it is commonly contracted, could not touch Him, because He did not come within the power of sin in the world; and hence we never read of His contracting any distemper or disease like other men. Nor could death in any of the thousand forms in which it comes to other men, come to Him, till He consented…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Atonement taught by Christ Himself (Edinburgh: T&amp;T Clark, 1868)</cite>, pp. 130-31</span></figcaption>

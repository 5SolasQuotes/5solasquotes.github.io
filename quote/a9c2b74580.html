<blockquote><p>yet perhaps there are many instances in which it [the lex talionis] would be very proper. The equity of the punishment would be quite manifest, and probably it would be as effectual a restraint from the commission of injury as any that could be chosen.</p></blockquote>

<blockquote><p>Neither, however, do we think ourselves bound to teach that God could not forbid sin but under the penalty of eternal death; for we hold that not one or another kind of punishment is necessary, but that punishment itself is necessary, and the punishment, according to the rule of God’s wisdom and justice, is death. Moreover, a rational creature, conscious of its proper subjection and obediential dependence, being created and existing, God did not account it at all necessary to forbid it to sin by a free act of his will, under one penalty or another; for both these follow from the very situation of the creature, and the order of dependence,–namely, that it should not transgress by withdrawing itself from the right and dominion of the Creator, and if it should transgress, that it should be obnoxious and exposed to coercion and punishment. But it being supposed that God should forbid sin by an external legislation, the appointment of punishment, even though there should be no mention made of it, must be coequal with the prohibition. …The modification of punishment respects either its appointment or infliction. Punishment itself is considered either in respect of its general end, which is the punishment of transgression, and has a regard to the condition of the creatures with respect to God; or in respect of some special end, and has a respect to the condition of the creatures among themselves. But whatever modification punishment may undergo, provided it attain its proper end, by accomplishing the object in view, the nature of punishment is preserved no less than if numberless degrees were added to it. As to the establishment of punishment, then, in a human court, as it has not primarily and properly a respect to the punishment of transgression, nor a regard to the condition of the creatures with respect to God, but with respect to one another, that degree of punishment is just which is fit and proper for accomplishing the proposed end. The punishment, then, of theft by a quadruple restitution had in its appointment no such modification conjoined with it as could render it unfit and improper in respect of the end proposed, among that people to whom that law concerning retributions was given; but as the infliction of punishment, according to the sentence of the law, depended on the supreme Ruler of that people, it belonged to him to provide that no temporal dispensation with punishment exercised by him, in right of his dominion, should turn out to the injury of the commonwealth. …But not even in a human court can any such modification be admitted as would render the punishment useless in respect of its end; nor, in respect of God, do we think any degree or mode of punishment necessary, but such as may answer the end of the punishment, so far as respects the state of the creatures with respect to God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on Divine Justice, ch. 17, in Works, vol. 10, pp. 613-14, see also all of pp. 613-16 for the fuller discussion.</cite></span></figcaption>

<blockquote><p>I confess that we being free in Christ, are not bound to the Civil Laws of Moses in every circumstance; yet seeing no laws can be more honest, just and wholesome, than those which God Himself gave, who is eternal Wisdom and Goodness, I see not why Christians, in things which no less appertain to them, ought not to follow the Law of God, rather than of any men…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>10th Question: Is the profession of faith and promise—that is, this sacred covenant—required to be confirmed by solemn oath and subscription? Response: Conclusion: This is not simply, nor everywhere or always, necessary; nor does apostolic practice teach this. For it could ordinarily suffice if that solemn promise is made in the presence of the whole Church, or before a synod with many witnesses. Especially when it pertains to matters of God, before his eyes and in his house, namely the Church. An oath is the end of all contradiction, introduced because of human wickedness. Because we must greatly distance ourselves from the evil practice of Papal clerics, who too rashly confirm their causes with dire oaths, curses, and the pledging of souls. Because it is proper for the faithful to be earnest, sincere, and simple, like sheep and doves. Therefore, care must be taken that this abundant caution does not, in some way, seem to cast doubt on their proper fourth way. Conclusion: Nevertheless, it is not illicit to take extra caution, whether for adversaries, or for extraordinary wickedness, frauds and deceptions of men, or for any other just cause. Because, in the renewal and restatement of the sacred covenant, such was done (see 2 Chron. 15:12-15; Neh. 9:38 and 10:1). Therefore, why could this not be done in some case at the first institution of the covenant? Because an oath may be declaratory and promissory in the matter of confession, profession of faith, and embracing the Church and its cause, as Paul’s example teaches (see 2 Cor. 1:23; Rom. 9:1). This, combined with the example of God’s people (see 2 Chron. 15; Neh. 9-10), was imitated by the king and nobility in Scotland in 1581, and by the French Church in the National Synod of Alès in 1619, where they received and confirmed the doctrine of the National Synod of Dordrecht against today’s Pelagians. Furthermore, in Scotland in 1638 and recently in 1643, the nobility, ministers, and people in Scotland and England were united in a solemn confederation. Here, compare what has been said elsewhere about the pledging of souls for their doctrine and cause, and about oaths in public form or church confessions. Part 3, Selected Dissertation on the Oath of Religion. Because not only are oral declarations before the whole Church required, but also subscriptions by the ordinary ministers, elders, and deacons among us are not without reason expected… …it would not be absurd or illicit if, in some case, and for the reasons previously mentioned, a subscription from the members of the Church were required. 4. Because oaths and subscriptions hold a significant place in any confederations and assemblies, and why not in sacred and ecclesiastical matters, if necessity demands it. Conclusion: We reject here oaths of obedience to the Pope, those concerning the Council of Trent; also, the abjurations of reformed doctrine and Church; furthermore, inquisitorial oaths and those arising ex officio [“from duty” unto self-incrimination]. In brief, all oaths and all sacred subscriptions that are not made in injustice, but in truth and judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’</cite>, pp. 52-53 (PDF pp. 49-50)</span></figcaption>

Chron.+15%3B+Neh.+9-10%29%2C+was+imitated+by+the+king+and+nobility+in+Scotland+in+1581%2C+and+by+the+French+Church+in+the+National+Synod+of+Al%C3%A8s+in+1619%2C+where+they+received+and+confirmed+the+doctrine+of+the+National+Synod+of+Dordrecht+against+today%E2%80%99s+Pelagians.+Furthermore%2C+in+Scotland+in+1638+and+recently+in+1643%2C+the+nobility%2C+ministers%2C+and+people+in+Scotland+and+England+were+united+in+a+solemn+confederation.+Here%2C+compare+what+has+been+said+elsewhere+about+the+pledging+of+souls+for+their+doctrine+and+cause%2C+and+about+oaths+in+public+form+or+church+confessions.+Part+3%2C+Selected+Dissertation+on+the+Oath+of+Religion.+Because+not+only+are+oral+declarations+before+the+whole+Church+required%2C+but+also+subscriptions+by+the+ordinary+ministers%2C+elders%2C+and+deacons+among+us+are+not+without+reason+expected%E2%80%A6+%E2%80%A6it+would+not+be+absurd+or+illicit+if%2C+in+some+case%2C+and+for+the+reasons+previously+mentioned%2C+a+subscription+from+the+members+of+the+Church+were+required.+4.+Because+oaths+and+subscriptions+hold+a+significant+place+in+any+confederations+and+assemblies%2C+and+why+not+in+sacred+and+ecclesiastical+matters%2C+if+necessity+demands+it.+Conclusion%3A+We+reject+here+oaths+of+obedience+to+the+Pope%2C+those+concerning+the+Council+of+Trent%3B+also%2C+the+abjurations+of+reformed+doctrine+and+Church%3B+furthermore%2C+inquisitorial+oaths+and+those+arising+ex+officio+%5B%E2%80%9Cfrom+duty%E2%80%9D+unto+self-incrimination%5D.+In+brief%2C+all+oaths+and+all+sacred+subscriptions+that+are+not+made+in+injustice%2C+but+in+truth+and+judgment.%E2%80%9D%0A%0A%E2%80%94+Gisbert+Voetius%2C+Ecclesiastical+Politics+tr.+by+AI+%28Amsterdam%3A+Joannes+%C3%A0+Waesberge%2C+1663%E2%80%931676%29%2C+vol.+1%2C+%E2%80%98The+Nature+of+the+Instituted+Church%E2%80%99%2C+pp.+52-53+%28PDF+pp.+49-50%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4441258a37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef42a8d959" data-kw="">
<blockquote><p>Is this rational, that where two commands of the magistrate are joined, the one undoubtedly lawful to be obeyed, the other doubted of, that subjects should disobey the magistrate in that which is clearly lawful, because they have a doubt or unclearness anent obeying him in the other command? Does it not become subjects to go as far on in obedience to lawful authority as they see they may without sin against God? Then it is time to stop when anything is put to them by virtue of the king’s command which they clearly see they cannot do without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-honyman.html">Andrew Honyman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom</cite>, (Edinburgh: Tyler, 1662), p. 9</span></figcaption>

<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine., pp. 204-7</span></figcaption>

<blockquote><p>§17. 11. He that has commanded us to express our minds in several cases about his worship (as in confession of our sins, in profession of our faith, in choosing of our pastors, in consenting to the casting out or taking in, or restoring of members, in renewing promises of obedience, and the like) has hereby made a profession necessary in general, and so has made it our duty to signify our consent in all these cases by some convenient sign: For man’s mind is not known to others but by signs. But He has not tied us absolutely to any particular sign. If a confession of faith be read, and we are called to signify our consent, or if we are called to signify our consent to be Church-members, or to be guided by our pastors, or submit to discipline; God has not tied us in such cases, whether we shall signify this consent by speaking, or by subscribing our names (Isa. 44:3-5) or by lifting up the hand, or by laying it on a Book (as in swearing) or by standing up, or such like. A sufficient signification or profession of our minds is necessary; but the special sign is left to our own, or our governor’s determination. Of which I shall speak more anon. §18. To this end, and on these terms was the sign of the cross used heretofore by Christians, and to this end they used standing in public worship every Lord’s Day (forbidding kneeling) and afterward standing up at the [saying of the Apostles’] Creed: as also adoring with their faces towards the east, etc. They used these only as significations of their own minds, instead of words; As the prophets of old were wont by other signs, as well as words to prophesy to the people… And I dare not condemn the cautelous [prudent, cautious] use of such professing signs as these: Though the tongue be the chief instrument, yet not the only instrument to express the mind; and though words be the ordinary sign, yet not the only sign. Dumb men must speak by other signs: And usually more silent signs are fitter for assemblies, to avoid disturbance: And sometimes more permanent signs (as subscription, or a stone or pillar of remembrance, as Josh. 24, etc.) are more desirable. And this is left to human prudence. §19. And therefore I durst not have reproved any of the ancient Christians that used the sign of the cross merely as a professing signal action, to show to the heathen and Jews about them that they believed in a crucified Christ, and were not ashamed of his cross. The occasional, indifferent use of this, when it is merely to this end, I durst not have condemned. Nor will I now condemn a man that, living among the enemies of a crucified Christ, shall wear a cross in his hat, or on his breast, or set it on his doors, or other convenient place, merely as a professing sign of his mind, to be but instead of so many words, q. d. [as to say] ‘I thus profess myself the servant of a crucified Christ, of whom I am not ashamed.’ Whether these things be fit or unfit, the time, place, occasion and other circumstances must show: but the lawfulness I dare not deny. … §40… I think neither magistrate nor synod should do any more than hinder undecency: But yet if they do more, and tie all to one habit [garment] (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; He does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment if I could not be dispensed with [it]. Yea though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily, we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul, and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful. … §57. That it [the minister making the sign of the cross in baptism] is ordained for this use, appears from the words (anon to be recited) in the use of it, and by those words prefixed before the Common Prayer Book, ‘of ceremonies; why some are abolished and some retained,’ where they say that they ‘be not dark and dumb ceremonies, but are so set forth that every man may understand what they do mean, and to what use they do serve,’ and ‘that they are such as are apt to stir up the dull mind of man, to the remembrance of his duty to God, by some notable and special signification, whereby he might be edified.’ So that this and such other (if there be more such) are appointed by their signification to teach the understanding, and stir up the dull mind of man to the remembrance of his duty to God: Which are good works, but to be done only by good means. [Baxter goes on to take exceptions to the use of the cross in baptism]</p></blockquote>

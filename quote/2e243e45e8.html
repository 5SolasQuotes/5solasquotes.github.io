</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6a670da33" data-kw="Affliction Comfort Love">
<blockquote><p>And what a comfort it is to believe this doctrine. If we are poor, or sick, or bereaved, or defamed, how delightful it is to know that it is the Lord, and not man; the Lord and not Satan; a friend and not an enemy; a most tender father and not a capricious master—who thus ordains. David was wise when he said, &quot;Let me fall into the hand of the Lord, and not into the hand of man.&quot; Luther said, &quot;Smite, Lord, for you love me.&quot; Every child of God may say as much.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “Practical Remarks on the Nature of God’s Providence”</span></figcaption>

</figure><figure class="quote" id="q-4917dab7b7" data-kw="">
<blockquote><p>It is one thing to say that the wrathful God is made loving. That would be entirely false. It is another thing to say the wrathful God is loving. That is profoundly true.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is one thing to say that the wrathful God is made loving. That would be entirely false. It is another thing to say the wrathful God is loving. That is profoundly true.”

— John Murray, Redemption Accomplished and Applied, pt. 1, ch. 2, “The Nature of the Atonement”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+one+thing+to+say+that+the+wrathful+God+is+made+loving.+That+would+be+entirely+false.+It+is+another+thing+to+say+the+wrathful+God+is+loving.+That+is+profoundly+true.%E2%80%9D%0A%0A%E2%80%94+John+Murray%2C+Redemption+Accomplished+and+Applied%2C+pt.+1%2C+ch.+2%2C+%E2%80%9CThe+Nature+of+the+Atonement%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4917dab7b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4917dab7b7.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

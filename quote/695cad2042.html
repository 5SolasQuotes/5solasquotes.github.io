<main class="wrap"><figure class="quote" id="q-695cad2042" data-kw="">
<blockquote><p>Remedy (1). First, Keep at the greatest distance from sin, and from playing with the golden bait which Satan holds forth to catch you; for this you have (Romans xii. 9), “Abhor that which is evil, cleave to that which is good.” When we meet with anything extremely evil and contrary to us, nature abhors it, and retires as far as it can from it. The Greek word that is there rendered “abhor,” is very significant; it signifies to hate it as hell itself, to hate it with horror.

Anselm used to say, “That if he should see the shame of sin on the one hand, and the pains of hell on the other, and must of necessity choose one; he would rather be thrust into hell without sin; than to go into heaven with sin,” so great was his hatred and detestation of sin. It is our wisest and our safest course to stand at the farthest distance from sin; not to go near the house of the harlot—but to fly from all appearance of evil, (Proverbs v. 8, 1 Thess. v. 22).

The best course to prevent falling into the pit is to keep at the greatest distance from it; he who will be so bold as to attempt to dance upon the brink of the pit, may find by woeful experience that it is a righteous thing with God that he should fall into the pit. Joseph keeps at a distance from sin, and from playing with Satan’s golden baits, and stands. David draws near, and plays with the bait, and falls, and swallows bait and hook! David comes near the snare, and is taken in it, to the breaking of his bones, the wounding of his conscience, and the loss of fellowship with his God.

Sin is a plague, yes, the worst and most infectious plague in the world; and yet, ah! how few are there who tremble at it–who keep at a distance from it! (1 Cor. v. 6) — “Know ye not that a little leaven leaveneth the whole lump?” As soon as one sin had seized upon Adam’s heart, all sin entered into his soul and infested it. How has Adam’s one sin spread over all mankind! (Romans v. 12) — “Wherefore by one man sin entered into the world, and death by sin, and so death passed upon all men, for that all have sinned.” Ah, how doth the father’s sin infect the child, the husband’s infect the wife, the master’s the servant! The sin that is in one man’s heart is able to infect a whole world, it is of such a spreading and infectious nature.

The story of the Italian, who first made his enemy deny God, and then stabbed him, and so at once murdered both body and soul, declares the unmixed malignity of sin; and oh! that what has been spoken upon this head may prevail with you, to stand at a distance from sin!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices</cite>, (1676) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 1: 13-14.</span></figcaption>

<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>

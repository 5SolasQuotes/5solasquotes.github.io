<main class="wrap"><figure class="quote" id="q-f7866d59a5" data-kw="believe and be saved offer">
<blockquote><p>In the same sense, I properly infer that all sinners would be saved if they would believe—not from any conditional decree, but from this most certain general truth which God has sanctioned by his absolute decree (viz., that faith is the infallible means of salvation). For as he has appointed faith as the only way of bringing men to salvation, hence arises the truth of this hypothetical proposition—if a sinner believes he will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/election-and-the-gospel-offer.html">Election and the Gospel Offer</a> › <a href="../topics/election/election-and-the-gospel-offer/preaching-to-all.html">Preaching to all</a></span><span class="t"><a href="../topics/reprobation/reprobation-and-the-free-offer.html">Reprobation and the Free Offer</a> › <a href="../topics/reprobation/reprobation-and-the-free-offer/the-gospel-call-to-all-who-hear.html">The gospel call to all who hear</a></span></div>

</figure><figure class="quote" id="q-643aef881b" data-kw="preceptive will gospel offer">
<blockquote><p>Conditional promises and threatenings do not favor conditional decrees because they do not pertain to the decreeing will, but to the preceptive will and are appendages to the divine commands, added to stimulate and excite men. … Hence such promises and threats show only the necessary connection of the condition with the thing conditioned, but involve no futurition of the thing.</p></blockquote>

</figure><figure class="quote" id="q-506762ccac" data-kw="">
<blockquote><p>As the godly consideration of predestination and our election in Christ, is full of sweet, pleasant, and unspeakable comfort to godly persons, and such as feel in themselves the working of the Spirit of Christ, mortifying the works of the flesh, and their earthly members, and drawing up their mind to high and heavenly things, as well because it doth greatly establish and confirm their faith of eternal salvation to be enjoyed through Christ, as because it doth fervently kindle their love towards God: so, for curious and carnal persons, lacking the Spirit of Christ, to have continually before their eyes the sentence of God’s predestination is a most dangerous downfall, whereby the devil doth thrust them either into desperation, or into wretchlessness [recklessness] of most unclean living, no less perilous than desperation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 17</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e9beb1bcea" data-kw="">
<blockquote><p>Discussions by Robert L. Dabney, D.D. , LL.D., Professor of Moral Philosophy in the University of Texas and for many years Professor of Theology in Union Theological Seminary in Virginia. Edited by C. R. Vaughan, D.D., Pastor of the Presbyterian Church of New Providence, Va. Vol. ii: Evangelical. 8vo, pp. iv, 684. (Richmond, Va.: Presbyterian Committee of Publication, 1891.) The editing of the second volume of Dr. Dabney’s occasional papers, presents many of the same faults which were pointed out in our notice of the first volume (PRESBYTERIAN AND REFORMED REVIEW, Vol. ii, p. 714.)

The principle of arrangement of the papers is generally, but not invariably, chronological; the indication of the time and occasion which produced each paper is common but not constant. Above all we are at a loss to understand on what ground the papers of this volume are classed under the general head of “Evangelical.” Most of them are on matters of ecclesiastical arrangement and action, and some of them are (although of ecclesiastical origin) distinctly secular in spirit and tone.

The intellect is constantly stimulated by Dr. Dabney’s writing, and the mind instructed. There is a literary grace attending much of his writing which is truly delightful. We always rejoice to have such a champion “on our side”—as we have in many of the papers of this volume, as, e.g., those on the “Public Preaching of Women,” “Theories of the Eldership,” and the like. But it must be admitted that sometimes a strength of language invades his writing which offends against good taste, and that sometimes a depth of prejudice veils his vision which leads him into views and expressions scarcely “evangelical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reviews of Recent Theological Literature in Presbyterian and Reformed Review</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09dabf929a" data-kw="">
<blockquote><p>Yet it ought to be observed, that we cannot become acceptable to God without being united in one and the same faith, that is, without being members of the Church; for it is not necessary for us to run to Jerusalem, or to Mount Zion, because in the present day Zion is as wide and extensive as the whole world, which is entirely devoted to God. All that is necessary therefore is, that the same faith dwell in us, and that we be joined together by the bond of love. If this be wanting, every thing about us is heathen, and we have nothing that is sacred or holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 45-46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-62ee3c0aac" data-kw="">
<blockquote><p>Yea a conditional covenant agreed unto and accepted, is a covenant, if we shall (as in reason we ought) distinguish between a covenant, in its essence and nature, and a covenant broken or fulfilled. A covenant or threatening is a covenant and threatening obliging Adam, if it shall be agreed unto by silence, as Adam accepted the threatening, Gen. 2:17, by silence; and professors within the visible church, by their professing of the doctrine of the Gospel or covenant of grace, their receiving of the seals and professed hearing of the word, are under the covenant of grace, and engage themselves to obey commands, promises, threatenings; and therefore promises are as properly made to them, Acts 2:39, as commands, and threatenings, exhortations, invitations, and Gospel requests are made to them. But though the Anabaptists ignorantly confound the promise and the thing promised, the covenant and benefits covenanted: the promise is to you, and so are the commands and threatenings, whether ye believe or not; the command is to you, and lays an obligation on you, whether ye obey or obey not, and the threatenings are to you, whether ye transgress or transgress not. It is true indeed, the promise, that is, the blessing promised, righteousness and eternal life, is not given to you until ye first believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh: Anderson, 1655), pt. 1, ch. 13; p. 90</span></figcaption>

<blockquote><p>…so that, even in our quarrels we were sustained by that greatest of all blessings, our unanimity in matters of doctrine, as well as by the awareness that, where the truth was concerned, we were neither mismated or opposed to one another, but molded by the same impress of faith and our primal hope. 12. Indeed, for those whose faith in God is pure there is no greater stimulus to unanimity than using the same words when we speak of Him…</p></blockquote>

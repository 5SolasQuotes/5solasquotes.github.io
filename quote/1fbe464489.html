<main class="wrap"><figure class="quote" id="q-1fbe464489" data-kw="">
<blockquote><p>It seems to the present writer that to demand acceptance of every proposition in so extensive a series of documents [as the Westminster Confession and Catechisms] would be incompatible with the avowal made in answer to the first question to the formula of subscription and comes dangerously close to the error of placing human documents on a par with holy Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subscription to the Westminster Standards</cite>, As quoted in Morton H. Smith, p. 80[?]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-3caee1b681" data-kw="">
<blockquote><p>And do further statute and ordain, that no person be admitted, or continued for hereafter, to be a minister or preacher within this Church, unless that he… do also subscribe the Confession of faith, ratified in the foresaid 5th Act of the second Session of this Parliament, declaring the same to be the confession of his faith, and that he owns the doctrine therein contained to be the true doctrine which he will constantly adhere to: As likewise, that he owns and acknowledges Presbyterian Church government, as settled by the foresaid fifth act of the second session of this parliament, to be the only government of this Church, and that he will submit thereto, and concur therewith, and never endeavour, directly or indirectly, the prejudice or subversion thereof…</p></blockquote>

</figure><figure class="quote" id="q-60822eb805" data-kw="Councils">
<blockquote><p>Wherefore, though our opponents should name councils of thousands of bishops it will little avail them; nor will they induce us to believe that they are, as they maintain, guided by the Holy Spirit, until they make it credible that they assemble in the name of Christ: since it is as possible for wicked and dishonest to conspire against Christ, as for good and honest bishops to meet together in his name.</p></blockquote>

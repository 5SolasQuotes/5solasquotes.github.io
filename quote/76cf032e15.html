<main class="wrap"><figure class="quote" id="q-76cf032e15" data-kw="">
<blockquote><p>We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind... (Oxford: L.L., 1653), pt. 1, Intro</cite>, p. 5</span></figcaption>

</figure><figure class="quote" id="q-8b8488e95a" data-kw="">
<blockquote><p>Their own system was generally styled Universalismus Hypotheticus, an hypothetic or conditional universalism. They taught that there were two wills or purposes in God in respect to man’s salvation. The one will is a purpose to provide, at the cost of the sacrifice of his own Son, salvation for each and every human being without exception if they believe—a condition foreknown to be universally and certainly impossible. The other will is an absolute purpose, depending only upon his own sovereign good pleasure, to secure the certain salvation of a definite number… This view represents God as loving the non-elect sufficiently to give them his Son to die for them, but not loving them enough to give them faith and repentance… It represents God as willing at the same time that all men be saved and that only the elect be saved. It denies, in opposition to the Arminian, that any of God’s decrees are conditioned upon the self-determined will of the creature, and yet puts into the mouths of confessed Calvinists the very catch-words of the Arminian system, such as universal grace, the conditional will of God, universal redemption, etc. The language of Amyraldus, the ‘Marrow Men,’ Baxter, Wardlaw, Richards, and Brown is now used to cover much more serious departures from the truth. All really consistent Calvinists ought to have learned by now that the original position of the great writers and confessions of the Reformed Churches have only been confused, and neither improved, strengthened nor illustrated, by all the talk with which the Church has… been distracted as to the ‘double will’ of God, or the ‘double reference’ of the Atonement. If men will be consistent in their adherence to these ‘Novelties,’ they must become Arminians. If they would hold consistently to the essential principles of Calvinism, they must discard the ‘Novelties’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement (Grand Rapids, MI: Eerdmans,1953)</cite>, pp. 374-375</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-39e6c20b73" data-kw="">
<blockquote><p>If the idea of a real succession in time between the parts of the divine decree be relinquished, as it must be; then this scheme is perfectly illusory, in representing God as decreeing to send Christ to provide a redemption to be offered to all, on condition of faith, and this out of His general compassion. For if He foresees the certain rejection of all at the time, and at the same time purposes sovereignly to withhold the grace which would work faith in the soul, from some, this scheme of election really makes Christ to be related, in God’s purpose, to the non-elect, no more closely nor beneficially than the stricter Calvinistic scheme. But second and chiefly, it represents Christ as not purchasing for His people the grace of effectual calling, by which they are persuaded and enabled to embrace redemption. But God’s purpose to confer this is represented as disconnected with Christ and His purchase, and subsequent, in order, to His work, and the foresight of its rejection by sinners. Whereas Scripture represents that this gift, along with all other graces of redemption, is given us in Christ, having been purchased for His people by Him (Eph. 1:3; Phil. 1:29; Heb. 12:2)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology (Great Britain: Banner, rep. 1985)</cite>, pp. 235-236</span></figcaption>

<blockquote><p>Objection 4. The fathers which believed aright do affirm that Christ redeemed all and the whole world. Answer: Whereas they write that Christ redeemed all men and the world, their meaning is that He did it according unto sufficiency and the common cause and common nature of all, which Christ did take upon Him: and not effectually on God’s part. This very thing does Prosper (Resp. ad object. vin. 1, obj.) make plain: ‘All men’ (says he): ‘are rightly said to be redeemed in respect of the one nature of all and the one cause of all, which our Lord did truly take upon Him: and yet all are not delivered from captivity: The propriety of redemption without doubt belongs unto them for whom the prince of the world is sent abroad:—whose death was not so bestowed for mankind as that it should also pertain unto the redemption of them who were not to be regenerated.’ And again he says (Ad Capit. Gall., ch. 9): ‘Our Savior may fitly be said to be crucified for the redemption of all the world, both in respect that He truly took upon Him the nature of man, and also in respect of the common or general perdition in the first man: and yet He may be said to be crucified only for those unto whom his death was available.’ Moreover the fathers speak of the universality and of the world of believers. So says he that is the author of The Calling of the Gentiles: ‘The people of God’ (says he, bk. 1) ‘have their fulness?&#x27;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Objection 4. The fathers which believed aright do affirm that Christ redeemed all and the whole world. Answer: Whereas they write that Christ redeemed all men and the world, their meaning is that He did it according unto sufficiency and the common cause and common nature of all, which Christ did take upon Him: and not effectually on God’s part. This very thing does Prosper (Resp. ad object. vin. 1, obj.) make plain: ‘All men’ (says he): ‘are rightly said to be redeemed in respect of the one nature of all and the one cause of all, which our Lord did truly take upon Him: and yet all are not delivered from captivity: The propriety of redemption without doubt belongs unto them for whom the prince of the world is sent abroad:—whose death was not so bestowed for mankind as that it should also pertain unto the redemption of them who were not to be regenerated.’ And again he says (Ad Capit. Gall., ch. 9): ‘Our Savior may fitly be said to be crucified for the redemption of all the world, both in respect that He truly took upon Him the nature of man, and also in respect of the common or general perdition in the first man: and yet He may be said to be crucified only for those unto whom his death was available.’ Moreover the fathers speak of the universality and of the world of believers. So says he that is the author of The Calling of the Gentiles: ‘The people of God’ (says he, bk. 1) ‘have their fulness?&#x27;”

— William Perkins, A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace (d. 1602: London: Welby &amp; Clarke, 1606) | 4th Crimination, pp. 105-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+4.+The+fathers+which+believed+aright+do+affirm+that+Christ+redeemed+all+and+the+whole+world.+Answer%3A+Whereas+they+write+that+Christ+redeemed+all+men+and+the+world%2C+their+meaning+is+that+He+did+it+according+unto+sufficiency+and+the+common+cause+and+common+nature+of+all%2C+which+Christ+did+take+upon+Him%3A+and+not+effectually+on+God%E2%80%99s+part.+This+very+thing+does+Prosper+%28Resp.+ad+object.+vin.+1%2C+obj.%29+make+plain%3A+%E2%80%98All+men%E2%80%99+%28says+he%29%3A+%E2%80%98are+rightly+said+to+be+redeemed+in+respect+of+the+one+nature+of+all+and+the+one+cause+of+all%2C+which+our+Lord+did+truly+take+upon+Him%3A+and+yet+all+are+not+delivered+from+captivity%3A+The+propriety+of+redemption+without+doubt+belongs+unto+them+for+whom+the+prince+of+the+world+is+sent+abroad%3A%E2%80%94whose+death+was+not+so+bestowed+for+mankind+as+that+it+should+also+pertain+unto+the+redemption+of+them+who+were+not+to+be+regenerated.%E2%80%99+And+again+he+says+%28Ad+Capit.+Gall.%2C+ch.+9%29%3A+%E2%80%98Our+Savior+may+fitly+be+said+to+be+crucified+for+the+redemption+of+all+the+world%2C+both+in+respect+that+He+truly+took+upon+Him+the+nature+of+man%2C+and+also+in+respect+of+the+common+or+general+perdition+in+the+first+man%3A+and+yet+He+may+be+said+to+be+crucified+only+for+those+unto+whom+his+death+was+available.%E2%80%99+Moreover+the+fathers+speak+of+the+universality+and+of+the+world+of+believers.+So+says+he+that+is+the+author+of+The+Calling+of+the+Gentiles%3A+%E2%80%98The+people+of+God%E2%80%99+%28says+he%2C+bk.+1%29+%E2%80%98have+their+fulness%3F%27%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Christian+%26+Plain+Treatise+of+the+Manner+%26+Order+of+Predestination+%26+of+the+Largeness+of+God%E2%80%99s+Grace+%28d.+1602%3A+London%3A+Welby+%26+Clarke%2C+1606%29+%7C+4th+Crimination%2C+pp.+105-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdbe4dc9a76.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dbe4dc9a76.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Objection%204.%20The%20fathers%20which%20believed,he%2C%20bk.%201%29%20%E2%80%98have%20their%20fulness&amp;text=Objection%204.%20The%20fathers%20which%20believed%20aright%20do&amp;text=God%E2%80%99%20%28says%20he%2C%20bk.%201%29%20%E2%80%98have%20their%20fulness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-1d66026f83" data-kw="">
<blockquote><p>He contains the holiness of all creatures put together and infinitely more. As all the wisdom, excellency and power of the creatures, if compared with the wisdom, excellency and power of God, is but folly, vileness and weakness; so the highest created purity, if set in parallel with God, is but impurity and uncleaness. Rev. 15:4, ‘Thou only art Holy:’ ‘Tis like the light of a glow-worm to that of the Sun; ‘The heavens are not pure in his sight, and his angels He charged with folly,’ Job 4:18; 15:15. Though God has crowned the angels with an unspotted sanctity and placed them in a habitation of glory, yet as illustrious as they are, they have an unworthiness in their own nature to appear before the throne of so holy a God; Their holiness grows dim and pale in his presence. ‘Tis but a weak shadow of that divine purity, whose light is so glorious that it makes them cover their faces out of weakness to behold it, and cover their feet out of shame in themselves [Isa. 6]. They are not ‘pure in his sight’ because though they love God (which is a principle of holiness) as much as they can, yet not so much as He deserves: They love Him with the intensest degree, according to their power, but not with the intensest degree, according to his own amiableness: For they cannot infinitely love God, unless they were as infinite as God, and had an understanding of his perfections equal with Himself, and as immense as his own knowledge. God having an infinite knowledge of Himself, can only have an infinite love to Himself, and consequently an infinite holiness without any defect; because He loves Himself according to the vastness of his own amiableness, which no finite being can. Therefore, though the angels be exempt from corruption and soil, they cannot enter into comparison with the purity of God, without acknowledgment of a dimness in themselves. Besides, ‘He charges them with folly,’ and ‘puts no trust in them,’ because they have the power of sinning, though not the act of sinning: They have a possible folly in their own nature to be charged with. Holiness is a quality separable from them, but it is inseparable from God. Had they not at first a mutability in their nature, none of them could have sinned, there had been no devils; but because some of them sinned, the rest might have sinned: And though the standing angels shall never be changed, yet they are still changeable in their own nature, and their standing is due to grace, not to nature; and though they shall be forever preserved, yet they are not, nor ever can be immutable by nature, for then they should stand upon the same bottom with God Himself; but they are supported by grace against that changeableness of nature which is essential to a creature: The Creator ‘only hath immortality,’ that is, immutability (1 Tim. 3:16).</p></blockquote>

 target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Because, whereas the ministers are willing to reform abuses, and the magistrate is peremptory and resolute not to reform for some reasons of policy, the minister in that case is not to leave his ministry, or to trouble the Church, intempestiuis clamoribus, or to contest or contend with the magistrate: The reason is, because this course tends to the overthrow of the Church, and is opposite to that charity which he owes unto Christ and to his church, out of which ground and rule he ought to preach, and to hold on in the course of his ministry. He ought indeed to teach publicly and privately (as the matter requires) what is to be done, but this he must perform without sedition and troubling of the Church, but peaceably and discreetly. Charity will inform the pastor, if he love the Church indeed, how he ought in these cases to behave himself; Zanchi, On Philippians 1, fol. 45. Look also: Musculus, loc. pt. 2, Of Traditions, §6, fol. 31. …Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it; Zanchi, ibid. … Because if pastors cannot reform all things which need amendment, according to their desire, they must not therefore cast away their ministry, or trouble the whole Church with an unusual asperity. The reason: Because all godly ground and form of ecclesiastical discipline ought ever to have respect and have reference to the unity of the Spirit in the bond of peace, which the apostle commanded to be kept by serving one another; and which rule not being kept, the medicine of discipline grows to be superfluous and pernicious. It is confessed that pastors ought with their uttermost endeavors to labor that there remain no corruption in the Church: but they must use that wisdom which our Savior prescribes, lest by plucking up the tares, they hurt the good corn. Wherefore the precept of the apostle of separating the evil (or of mending corruption) must by no means be neglected, cum sine periculo violandae pacis fieri potest, when it may be done without the danger of violation of the Churches’ peace: for else He would not have it done. Calvin, Institutes, bk. 4, ch. 12, §11, 13.</p></blockquote>

<blockquote><p>…if so be that thou makest conscience of sanctifying God’s name in duties, then He will sanctify his name in a way of mercy; that is, He will manifest how He does accept of the least degree of holiness though there be much mixture: God has a way to take away the mixture by the blood of his Son, and then to accept of any holiness He sees in thee, He will sanctify his name by meeting with thee and revealing his glory to thee when thou art worshiping of Him: There is an excellent scripture for this, Ex. 29:43, ‘There I will meet with the children of Israel and the Tabernacle shall be sanctified by my glory.’ Thou that hast a gracious heart and art worshiping of God in sincerity, thou art as a tabernacle of God, and God has his service and worship from thee; thou art as the temple of God, and ‘There will I meet with thee’ (says God) ‘and I will sanctify my Tabernacle by my glory.’ God will sanctify thy heart by his glory if thou doest sanctify his name.</p></blockquote>

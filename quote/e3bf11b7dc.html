<main class="wrap"><figure class="quote" id="q-e3bf11b7dc" data-kw="">
<blockquote><p>Certainly, that succession is a goodly ornament—if, with the succession of persons, there be also a succession of doctrine and conformity of virtue. But there are many chairs in which those who sit hold a contrary doctrine to their predecessors. Thus, the scribes and Pharisees were sitting in the chair of Moses and had the personal succession; nevertheless, Jesus Christ commanded His disciples to beware of the leaven of their doctrine and reproached them for transgressing the law of God by their tradition (Matt. 15). Thus, the bishops of the churches of Antioch, Rome, and Alexandria boast themselves to be successors of Saint Peter, yet are dissenting and separate in communion. The bishops of Constantinople trace their succession from the Apostle Saint Andrew, as Nicephorus attempts to prove in the eighth book of his Chronology, chapter 6. Yet these bishops, by the judgment of the Roman Church, are schismatics and heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, bk. 1, ch. 32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>

</figure><figure class="quote" id="q-cd1dc35099" data-kw="Equality of apostles">
<blockquote><p>If Peter was constituted an ecumenical pontiff, he was greater and superior to the others. But we read of no such superiority having been bestowed upon Peter above the others by Christ or usurped by Peter himself or acknowledged by the apostles. Christ sends them equally: “As the Father sent me, so send I you” (Jn. 20:21). He equally breathes his Spirit into them (v. 22) and gives them the power to remit and to retain sins: “Whose soever sins ye remit, they are remitted unto them; and whose soever sins ye retain, they are retained” (v. 23). He equally gives to all the command to preach and to baptize: “Go ye therefore, and teach all nations” (Mt. 28:19). Hence, he promises them an equality of thrones: “In the regeneration” (i.e., in the renovation of the church caused by the gospel) “ye shall sit upon twelve thrones, judging the twelve tribes of Israel” (Mt. 19:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.5</span></figcaption>

</figure><figure class="quote" id="q-c70c9db27d" data-kw="">
<blockquote><p>Whereas they say that there is a double head of the church, one imperial, which is Christ alone, the other ministerial, which is the pope governing the whole church under Christ; I answer, this distinction robs Christ of His honor because in setting up their ministerial head, they are fain to borrow of Christ things proper unto Him, as the privilege to forgive sins properly and the power to govern the whole earth by making of laws that shall as truly bind conscience as the laws of God, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, “Of the Supremacy in Causes Ecclesiastical”</span></figcaption>

</figure><figure class="quote" id="q-3c6b47b5b7" data-kw="">
<blockquote><p>Christ never said a word about Peter’s episcopacy at Rome nor about his successor. Neither according to Scripture nor according to tradition has Peter ever breathed a hint that the bishop at Rome would be his only true successor. … Conclusion: The primacy of the Roman bishop over the entire Christian church is totally unfounded. It cannot show the divine right on which it rests; it does not even have a reliable historical foundation.</p></blockquote>

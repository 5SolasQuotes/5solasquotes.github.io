<main class="wrap"><figure class="quote" id="q-ac3dd86b2f" data-kw="">
<blockquote><p>Remember that this day Jesus Christ recommends, by my mouth, to your continued affectionate regard, your aged and venerable pastor, that now you should tenderly cherish him in the bleak season of infirmity. He hath long been among you as a spiritual father, dispensing that bread of life which hath been, I trust, the medicine and strength of your souls.

It will be your glory, it will be a token for good to you, that he should, by the help of your fervent prayers, retire from the earthly sanctuary in the spiritual dignity and splendour, I will not say of a setting sun, but of a sun ready to arise in a more glorious sky than that which is now visible to the eyes of mortals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Bishop: A Sermon, Preached, February 3. 1790, at the Ordination of the Rev. David Todd, co-Pastor with the Rev. John Patrick, in the Presbyterian Church, Peter Street, Soho in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, and A Serious Call Res</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3211f65e7e" data-kw="">
<blockquote><p>Let us not abuse our selves, for it may seem to us that the things which we do to keep us in league with the children of this world, are not of great importance. Let us beware that Satan draw us not from obeying the commandment of GOD by the deceivableness of our flesh, as he withdrew Adam by the means of Eve, after that by his lie she was seduced, he thought with himself it was no great fault, to eat of the fruit of a Tree, but it was very great, sith GOD had forbidden it, as experience taught it afterward: for by this transgression all the lineage of man was destroyed and all creatures were made subject to Curse.

Let us never suffer therefore the word of God to be snatched out of our hands whatsoever reason, or whatsoever colour or cloak flesh can allege unto us: let us be as wary as we would be to fall into the fire, to draw back from this word, and to abandon it, one only step. For we need not go far aside to miss the way, to set us altogether out of the way, and when one is once fallen out of the way, the further he goeth on, the further he wandreth and multiplyeth error upon error: so that after it is very hard for him to find his right way, and to come thither, whether he purposed.

Wherefore to avoid the falling into the bottom of the depth of sin, let us get us away out of hand from the banks, least we plunge ourselves in deeper then we think for, and that there come not some wave which suddenly will set upon us, and in wray and plunge us in such sort among the waves, that we can never get out, but remain there all together drowned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-viret.html">Pierre Viret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An epistle to the faithful necessary for all the children of God: especially in the so dangerous days</cite>, trans. F. H. (London: Tobie Smith, 1582), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-5ea0da68c7" data-kw="">
<blockquote><p>Secondly, let me instance in the Lord’s Day; a day which is a sign betwixt God and his people, that He is their God that sanctifieth them. That as Idol-worshippers are known by keeping holidays to their Gods: So God’s people are known to be his people, by observing of his Holy day.

It is most true, that our ancient Doctrine established is purer in this point than can be found in most of the Churches, and excellent Laws we have for the backing of it: but I believe there hath not been in all the Christian World such high affronts offered to the Lord’s day, as of late hath been in England, and (I am confident) they all lie in the Deck charged, as the sin of the Nation, till by some public Act, the fourth Commandment be restored to its due place and honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached before the Honourable House of Commons, now assembled in Parliament, at their public fast, November 17. 1640</cite>, (London: Samuel Man, 1641), pp 32-33.</span></figcaption>

<blockquote><p>Part III will find the exact ‘covering’ prohibited to men while ‘praying or prophesying’ (11:4) is less certain [compared to the woman’s covering], though it seems Paul proscribed Corinthian men from wearing any dishonoring covering in the assemblies, namely which hung down from their heads, whether material, a hair–bun or long hair, yet not wreaths, helmets, hats or turbans.</p></blockquote>

</figure><figure class="quote" id="q-b579acfb7d" data-kw="">
<blockquote><p>‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects according to the matter of each Psalm</cite>, (London, 1647) ‘The Preface’, no page number. Taylor (1613–1667) was a conformed cleric in the Church of England who advocated for very liturgical worship. The Preface is very good, at length, with regard to the psalms. Some of the references to ‘hymns’ refer to the psalms themselves. Taylor held to predominant psalmody.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

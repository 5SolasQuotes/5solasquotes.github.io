<main class="wrap"><figure class="quote" id="q-17c8f5d1fa" data-kw="">
<blockquote><p>If truly the consequence is made good only by the will of governors, then this consequence will be valid: All such things are orderly and decent; therefore, let the calf of Aaron be made and openly worshiped, for worship in such a visible way is by [the will of] the governors. A good consequence is one which stands indivisible: then it is a good consequence or not a good consequence. This consequence, however, where the truth has been mixed, depending partly on reason and partly on the will of men, is nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter</cite>, tr. Charles Johnson &amp; Travis Fentiman (1638-1642; 1668; RBO, 2019), ch. 1, section 17, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-748db3f4cb" data-kw="">
<blockquote><p>And thus have we made good our argument that the lawfulnss of the ceremonies cannot be warranted by any ecclesiastical law. If we had no more against them, this were enough, that they are but human additions and want the warrant of the Word. When Nadab and Abihu offered strange fire before the Lord (Lev. 10:1), and when the Jews burnt their sons and their daughters in the valley of the son of Hinnon, howsoever manifold wickedness might have been challenged in that which they did, yet if any would dispute with God upon the matter, He stops their mouths with this one answer, ‘I commanded it not, neither came it into my heart.’ (Jer. 7:31)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), bk. 3, ch. 7, section 14, p. 122</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

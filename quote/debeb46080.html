<main class="wrap"><figure class="quote" id="q-debeb46080" data-kw="">
<blockquote><p>Now the second thing whereunto we shall speak for clearing of the words [Hebrews 2:3], is this, viz. How it is said that Christ was the first preacher of this eternal salvation. We do not think that the words are thus to be understood, that the Gospel and this great salvation was never preached before Christ came in the flesh; but we think the meaning of the words may be one of these three: if not all of them.

First, That all the preaching of this great salvation under the Law, did come very far short in the point of fulness, in comparison of Christ’s preaching of it; therefore is Christ said to be the first preacher of this great salvation; as if he had said, I know Adam he preached of this great salvation; and Enoch he preached of this great salvation; and the twelve Patriarchs they preached of this great salvation; and all the Prophets who went before Christ, and are now in heaven, they preached of this great salvation; but all their preaching deserved not the name of preaching in comparison of Christ’s; for never man spake as he spake. Thus Christ was the first great preacher of this great salvation.

Secondly, This may be the meaning of it, that Christ was the first preacher of this great salvation in respect of his clear way of preaching of it; for he was the first preacher of it without types and shadows; he was the first preacher of it clearly and fully, with so much demonstration and power of the Spirit.

Thirdly, The meaning of this (that Christ was the first preacher of this great salvation) may relate to his appearing to Adam in Paradise when he became the first and great preacher of this salvation, when he did speak that word unto him, The seed of the woman shall tread down the head of the Serpent. The first glorious preaching of this great salvation was when Christ preached to Adam in Paradise. And that was the first and glorious morning of this blessed Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great salvation offered and tendered first, by Christ himself, and then by his holy apostles, with the inevitable destruction of all that neglect it: in the sermons, reprinted by that eminent servant of Christ, Mr. Andrew Gray, formerly Minister of the Gospel in Glasgow</cite>, (London: H. Barnard, 1694), pp 8-9.</span></figcaption>

<blockquote><p>…the bishop’s own words. For he says that we kneel before the elements [of the Supper], ‘having them in our sight, or object to our senses, as ordinary signs, means, and memorials, to stir us up, to worship, etc.’ Now if we have them in our sight and before our senses for this purpose, that they may be means, signs, and memorials to stir us up to worship, then (sure) their being really before our senses is not accidental to us when we kneel. Since Dr. Burgess has been so dull and sottish as to write that ‘the signs are but accidentally before the communicants when they receive,’ he is to be ignominiously exsibilat; for making the sacred sacramental signs to be no otherwise present than the walls of the Church, the nails and timber of the material table whereupon the elements are set, or anything else accidentally before the communicants.</p></blockquote>

<blockquote><p>THE Rev. John Brown was born in the year 1722, in a little village called Carpou, in the county of Perth, Scotland. The narrative of his experience which he left behind him is as follows:

The more I consider the dealings between God and my soul, I am the more amazed at his marvellous kindness to me, and at my ingratitude and rebellion against him.

I reflect on it as a great mercy, that I was born in a family which took care of my Christian instruction, and in which I had the privilege of God’s worship both morning and evening. This was the case in few families in that corner; and it was the more remarkable considering that my father had not got any regular instruction in reading.</p></blockquote>

</figure><figure class="quote" id="q-d702871534" data-kw="">
<blockquote><p>1. What it is that is the formal reason of it, — that which renders him a meet object of the church’s worship, and the church’s worship to be truly divine or religious. 2. What is the principal motive prevailing with us to give him this glory and honour. For the first, it is no other but the divine nature. The natural and essential excellencies of the Deity are the formal reason and proper object of all divine worship.

We worship the Lord Christ, who is God and man. He is so in one person; and his person who is God and man is the object of that worship. But the formal reason and object of it is the divine nature in that person. Give me leave to say, God himself could not command the Lord Christ to be worshipped with divine religious adoration were he not God by nature, for the thing itself implieth a contradiction. Religious worship is nothing but an assignation of that honour which is due to divine excellencies; namely, to trust, believe, fear, obey, love, and submit unto infinite holiness, goodness, righteousness, power, in the first cause, last end, and sovereign Lord of all.

Now, to assign glory proper to divine excellencies, and which receiveth its nature from its object, where divine excellencies are not, is openly contradictory. Besides, God hath said, “I am the LORD: that is my name: and my glory will I not give to another,” Isa. xlii. 8. He that hath not the name of God, (that is, his nature,) shall not, nor can have this glory, which is to be the object of the worship mentioned. And there are scarcely more gross idolaters in the world than those who profess to worship Christ and to believe in him, in a word, to give him all the glory that is due to God, and yet deny him so to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 549-50.</span></figcaption>

We worship the Lord Christ, who is God and man. He is so in one person; and his person who is God and man is the object of that worship. But the formal reason and object of it is the divine nature in that person. Give me leave to say, God himself could not command the Lord Christ to be worshipped with divine religious adoration were he not God by nature, for the thing itself implieth a contradiction. Religious worship is nothing but an assignation of that honour which is due to divine excellencies; namely, to trust, believe, fear, obey, love, and submit unto infinite holiness, goodness, righteousness, power, in the first cause, last end, and sovereign Lord of all.

Now, to assign glory proper to divine excellencies, and which receiveth its nature from its object, where divine excellencies are not, is openly contradictory. Besides, God hath said, “I am the LORD: that is my name: and my glory will I not give to another,” Isa. xlii. 8. He that hath not the name of God, (that is, his nature,) shall not, nor can have this glory, which is to be the object of the worship mentioned. And there are scarcely more gross idolaters in the world than those who profess to worship Christ and to believe in him, in a word, to give him all the glory that is due to God, and yet deny him so to be.”

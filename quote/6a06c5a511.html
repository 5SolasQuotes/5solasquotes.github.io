<main class="wrap"><figure class="quote" id="q-6a06c5a511" data-kw="">
<blockquote><p>9. In Christ, the person must be distinguished from the enhypostatic adjunct. Person is only the divine nature. For one should not think that the person of Christ is a kind of conflation of human and divine nature – as if the person was composed out of parts. But because the divine nature, which assumed the human nature into the divine personality, is alone person, human nature is an enhypostatic adjunct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse</cite>, (1644), ch. 11, ‘On the Person &amp; Office of Christ’, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-9f4b7ef13b" data-kw="">
<blockquote><p>We therefore reject the deifications of the Enthusiasts, the spirit and eternal uncreated Word, etc. For by these they subvert the nature of God and of man, and the operations of both. Which abominations, arising from the confusion of God with His work, of substance with accident, of the Holy Spirit with the Word, of man sanctified by God with the Sanctifier Himself and His divine holiness, we detect elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-7aa831ea6c" data-kw="">
<blockquote><p>The person of Christ, is one, because Christ is one… There are two natures in the person of Christ, the divine, and the humane nature. Therefore Jesus Christ is true God, and true man in one person. Rom. 1:3-4; and 9:5; 1 John 4:2; 1 Tim. 3:16; Col. 2:9; Heb. 2:14,16; John 1:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, … (London, 1595), ‘…Now Concerning the Gospel’, p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-88ac8bbca2" data-kw="">
<blockquote><p>The orthodox therefore define the unio mystica as the spiritual conjunction (conjunctio spiritualis) of the Triune God with the believer in and following justification. It is a substantial and graciously effective indwelling. In relation to the ordo salutis (q.v.), or order of salvation, the Protestant scholastics distinguish the initial unitio (q.v.), or uniting, of the unio mystica, which is the basis for the imputation of Christ’s righteousness to the believer and which corresponds with the adoption (adoptio) of the believer, and the ongoing unio, or union, of the unio mystica, which continues concurrent with sanctification throughout the life of the believer…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘unio mystica sive praesentia gratiae tantum’ in Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), pp. 314-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

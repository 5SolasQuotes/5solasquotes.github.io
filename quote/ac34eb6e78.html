<main class="wrap"><figure class="quote" id="q-ac34eb6e78" data-kw="">
<blockquote><p>Let it be then considered that such high provocations had been in those days committed against the majesty of the Son of God, as that it became a righteous thing with him to remove the house of Stuart from the British throne.

I am now to speak of things chiefly relative to the kingdom of Scotland, the native country of a good part of my present hearers. There, as is too well known to admit of being denied, in consequence of royal ingratitude and perjury, a bloody persecution was fomented, and carried on for almost the third part of a century. Of this persecution the chief avowed ground was a claim of power and authority made by the then reigning kings as wearing one of the pope’s titles, that of the head or supreme governor of the church of Jesus Christ.

A sinful creature having dared to intrude into the title, dignity, and power, which belong to Jesus Christ, the Second Person of the glorious Trinity, the alone Head and Supreme Governor of his own church, those who were not stupid and impious enough to approve of that sacrilegious usurpation were persecuted to death. On this point, the sufferings of many were expressly stated.

The big and fallacious words of prejudiced bigots, or of infidel scoffers at the majesty of the Son of God, may have influence enough on many in the present dissipated age. Many may be taught to look upon those children of God, who then suffered for the tenderness and zeal of an enlightened conscience, as a race of rebels who made a sacrifice of their fives to their own blind and perverse humours. Stand still thou proud censurer of the upright, thou child of Satan, the accuser of the brethren! Thy calumnious misrepresentations may sound sweetly enough in the ears of an effeminate race of professors, who would soon be scared away from the Redeemer’s standard by the first whisper of the trump of persecution.

But there is a Judge in heaven whom the opinion of worlds cannot bias, and whom the strength or solicitations of the universe cannot move aside from the path of righteous judgment. In his ears, “under his altar, the souls of many who were slain” in Scotland “for his testimony, are yet crying aloud.” Rev. vi. 9, 10. and the answer of their cries is likely to alight in part on the heads of those in the present age, who serve themselves heirs to the deeds of their predecessors by justifying their sacrilegious cruelties, and by defaming the memory of those whom in their life and at their death God did glorify with his manifest presence, power, and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Majesty of the King of Kings: A Sermon, Preached on the Subject of the Revolution, Nov. 9. 1788 in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, and A Serious Call Respecting a Mission to the River Indus</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0238b6d385" data-kw="">
<blockquote><p>If the question, ‘What is the meaning of the words, ‘the system of doctrines taught in the Holy Scriptures,’ as they occur in the formula which makes a part of the ordination service?’ were submitted to any intelligent and impartial jury in the country–to twelve men of plain common sense, who had never head of the subterfuges and refinements of modern subscribers to creeds–I cannot doubt that they would be unanimous in their verdict without quitting their seats. They would naturally decide thus: ‘Since the primary object of subscribing an ecclesiastical creed is to express agreement in doctrinal belief; since the manifest design of the Confession of Faith of the Presbyterian Church is to maintain what is commonly called the Calvinistic system, in opposition to the Socinian, the Arian, the Pelagian, and the Arminian systems; since almost every point which distinguishes these several forms of error are specifically exposed, disproved and rejected, under one or another of its several articles; and since this has notoriously been the universal understanding, ever since that Confession was formed, we judge that no man who is not a sincere Calvinist, that is, who does not ex animo [from the heart; sincerely] receive all the distinguishing articles of the Calvinistic system, can honestly subscribe it. We do not suppose, indeed, that among those who subscribe that formulary, it is necessary, in order to a candid subscription, that there should be entire agreement as to ‘every jot and tittle’ in the mode of explaining every doctrine which the Confession contains. But we cannot resist the conclusion, as fair and honorable men, that unless a candidate for admission… sincerely believes all these [previously listed doctrines], and the essentially allied doctrines which have ever been considered as the distinguishing features of the Calvinistic system, and believes them in substance, as they are laid down in the Confession, our verdict is that he cannot honestly subscribe it.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f0f38d607e" data-kw="">
<blockquote><p>You see that a person is justified by works and not by faith alone.”— James 2:24 It’s not uncommon to hear some people appeal to James 2:24 in order to argue that God saves people by faith plus works. In particular, some argue against the doctrine of justification by faith alone by appealing to this verse. They tend to pit Paul, who writes that we are justified by faith and not works, against James, who apparently writes that we are justified by faith plus works. This raises the question, who is right? What are we to believe? Are Paul and James actually at odds with each other? No, they are not. What Are Paul and James Saying about Justification? Simply put, although they are using the same verb, justification (in Greek it is also the same verb, dikaioō), they are using it differently. Paul is using it in its legal declarative sense, but James is using it in an evidential sense. They are complementing each other, not opposing each other. Questions concerning Paul and James begin with Paul writing in Romans 3–5 about justification as a declarative act of God grounded in the work of Christ and received by faith. James, on the other hand, is writing about sanctification—the gracious work of God that necessarily follows from justification. James’ primary concern is that a person who has been justified will have good works that demonstrate their faith. True saving faith—the instrument of justification (e.g., Rom. 5:1; Eph. 2:8)—necessarily leads to sanctification, and sanctification is evidence of saving faith versus merely a faith that believes in mere knowledge (see James 2:19). Justification and Sanctification—Two Benefits of Salvation in Christ In order to help understand how Paul and James complement one another, there are two important terms to define: justification and sanctification. The Westminster Shorter Catechism provides good and concise definitions of each one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>January 11</cite>, 2022</span></figcaption>

<blockquote><p>A very few words will also free our inquiry from any concernment in that which is called sentential justification, at the day of judgement; for of what nature soever it be, the person concerning whom that sentence is pronounced was, — (1.) Actually and completely justified before God in this world; (2.) Made partaker of all the benefits of that justification, even unto a blessed resurrection in glory: “It is raised in glory,” 1 Cor. xv. 43. (3.) The souls of the most will long before have enjoyed a blessed rest with God, absolutely discharged and acquitted from all their labours and all their sins; there remains nothing but an actual admission of the whole person into eternal glory. Wherefore this judgement can be no more but declaratory, unto the glory of God, and the everlasting refreshment of them that have believed.</p></blockquote>

<blockquote><p>5. Are we justified on account of the essential righteousness of Christ’s divine nature? XXIII. Fifth, it is asked whether the dikaioma [righteousness] on account of which we are justified is the essential righteousness of Christ’s divine nature. Andreas Osiander [a Lutheran], as we have often said, affirms it, because he rejected the procured righteousness of Christ, which nonetheless his son Lucas Osiander, a professor at Tübingen, does not acknowledge; at least it is certain that he has to reject it, from his hypotheses, because: (1) this essential righteousness of the divine nature, through its infinite value, would be so sufficient that it would make the other undoubtedly void. This is not even to mention that (2) the essential union of believers with Christ (which he presupposes) is blasphemous in not just one way, as we taught elsewhere (1.6.5 §XX). And (3) it is false that he is the Messiah only according to the divine nature. Moreover, (4) that the fellowship of that essential righteousness is understood (2 Peter 1:4), we have already shown to be absurd (cf. bk. 5, ch. 2 §XXII; ch. 18, §§XIV, XXXVI; ch. 5 of this book, §XX; likewise §XI of this chapter.) Nor does there remain anything that they may say for themselves, except that the righteousness on account of which we are justified is called the righteousness of God (Rom. 1:17; 3:21–22; 10:3; 2 Cor. 5:21; 2 Peter 1:1). To which we respond that: (1) the [Greek; dikaiosune theou], ‘the righteousness of God’, sometimes designates procured righteousness (James 1:20). (2) Christ’s procured righteousness is the righteousness of God, insofar as the one who procured it is the God man, and thus is God (Acts 20:28). (3) The procured righteousness of Christ is called the righteousness of God because it was constituted by God, and is admitted for us by God (Rom. 3:25; 2 Cor. 5:21). … XXV… Protestants, although they leave essential righteousness to Christ alone, as a prerequisite for his mediatorial function, yet affirm that the righteousness that was procured by his satisfaction and merit (insofar as they teach that on account of it we are delivered from our guilt and obtain the right to life) is altogether imputed to us, or transferred to our account.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 131</span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. Are we justified on account of the essential righteousness of Christ’s divine nature? XXIII. Fifth, it is asked whether the dikaioma [righteousness] on account of which we are justified is the essential righteousness of Christ’s divine nature. Andreas Osiander [a Lutheran], as we have often said, affirms it, because he rejected the procured righteousness of Christ, which nonetheless his son Lucas Osiander, a professor at Tübingen, does not acknowledge; at least it is certain that he has to reject it, from his hypotheses, because: (1) this essential righteousness of the divine nature, through its infinite value, would be so sufficient that it would make the other undoubtedly void. This is not even to mention that (2) the essential union of believers with Christ (which he presupposes) is blasphemous in not just one way, as we taught elsewhere (1.6.5 §XX). And (3) it is false that he is the Messiah only according to the divine nature. Moreover, (4) that the fellowship of that essential righteousness is understood (2 Peter 1:4), we have already shown to be absurd (cf. bk. 5, ch. 2 §XXII; ch. 18, §§XIV, XXXVI; ch. 5 of this book, §XX; likewise §XI of this chapter.) Nor does there remain anything that they may say for themselves, except that the righteousness on account of which we are justified is called the righteousness of God (Rom. 1:17; 3:21–22; 10:3; 2 Cor. 5:21; 2 Peter 1:1). To which we respond that: (1) the [Greek; dikaiosune theou], ‘the righteousness of God’, sometimes designates procured righteousness (James 1:20). (2) Christ’s procured righteousness is the righteousness of God, insofar as the one who procured it is the God man, and thus is God (Acts 20:28). (3) The procured righteousness of Christ is called the righteousness of God because it was constituted by God, and is admitted for us by God (Rom. 3:25; 2 Cor. 5:21). … XXV… Protestants, although they leave essential righteousness to Christ alone, as — Petrus van Mastricht, Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 131">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+Are+we+justified+on+account+of+the+essential+righteousness+of+Christ%E2%80%99s+divine+nature%3F+XXIII.+Fifth%2C+it+is+asked+whether+the+dikaioma+%5Brighteousness%5D+on+account+of+which+we+are+justified+is+the+essential+righteousness+of+Christ%E2%80%99s+divine+nature.+Andreas+Osiander+%5Ba+Lutheran%5D%2C+as+we+have+often+said%2C+affirms+it%2C+because+he+rejected+the+procured+righteousness+of+Christ%2C+which+nonetheless+his+son+Lucas+Osiander%2C+a+professor+at+T%C3%BCbingen%2C+does+not+acknowledge%3B+at+least+it+is+certain+that+he+has+to+reject+it%2C+from+his+hypotheses%2C+because%3A+%281%29+this+essential+righteousness+of+the+divine+nature%2C+through+its+infinite+value%2C+would+be+so+sufficient+that+it+would+make+the+other+undoubtedly+void.+This+is+not+even+to+mention+that+%282%29+the+essential+union+of+believers+with+Christ+%28which+he+presupposes%29+is+blasphemous+in+not+just+one+way%2C+as+we+taught+elsewhere+%281.6.5+%C2%A7XX%29.+And+%283%29+it+is+false+that+he+is+the+Messiah+only+according+to+the+divine+nature.+Moreover%2C+%284%29+that+the+fellowship+of+that+essential+righteousness+is+understood+%282+Peter+1%3A4%29%2C+we+have+already+shown+to+be+absurd+%28cf.+bk.+5%2C+ch.+2+%C2%A7XXII%3B+ch.+18%2C+%C2%A7%C2%A7XIV%2C+XXXVI%3B+ch.+5+of+this+book%2C+%C2%A7XX%3B+likewise+%C2%A7XI+of+this+chapter.%29+Nor+does+there+remain+anything+that+they+may+say+for+themselves%2C+except+that+the+righteousness+on+account+of+which+we+are+justified+is+called+the+righteousness+of+God+%28Rom.+1%3A17%3B+3%3A21%E2%80%9322%3B+10%3A3%3B+2+Cor.+5%3A21%3B+2+Peter+1%3A1%29.+To+which+we+respond+that%3A+%281%29+the+%5BGreek%3B+dikaiosune+theou%5D%2C+%E2%80%98the+righteousness+of+God%E2%80%99%2C+sometimes+designates+procured+righteousness+%28James+1%3A20%29.+%282%29+Christ%E2%80%99s+procured+righteousness+is+the+righteousness+of+God%2C+insofar+as+the+one+who+procured+it+is+the+God+man%2C+and+thus+is+God+%28Acts+20%3A28%29.+%283%29+The+procured+righteousness+of+Christ+is+called+the+righteousness+of+God+because+it+was+constituted+by+God%2C+and+is+admitted+for+us+by+God+%28Rom.+3%3A25%3B+2+Cor.+5%3A21%29.+%E2%80%A6+XXV%E2%80%A6+Protestants%2C+although+they+leave+essential+righteousness+to+Christ+alone%2C+as+a+prerequisite+for+his+mediatorial+function%2C+yet+affirm+that+the+righteousness+that+was+procured+by+his+satisfaction+and+merit+%28insofar+as+they+teach+that+on+account+of+it+we+are+delivered+from+our+guilt+and+obtain+the+right+to+life%29+is+altogether+imputed+to+us%2C+or+transferred+to+our+account.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%282nd+ed.+1698%3B+RHB%29%2C+vol.+5%2C+pt.+1%2C+bk.+6%2C+ch.+6%2C+%E2%80%98The+Justification+of+those+to+be+Redeemed%E2%80%99%2C+p.+131&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa3d5d90e7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a3d5d90e7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=5.%20Are%20we%20justified%20on%20account,us%2C%20or%20transferred%20to%20our%20account&amp;text=5.%20Are%20we%20justified%20on%20account%20of%20the&amp;text=imputed%20to%20us%2C%20or%20transferred%20to%20our%20account" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

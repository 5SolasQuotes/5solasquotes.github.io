<main class="wrap"><figure class="quote" id="q-956d6b5e84" data-kw="">
<blockquote><p>First, there is no greater freedom under heaven. It is as great as the suffering and most powerful resurrection of Christ, by which we have been called into freedom. It is the greatest freedom in heaven and earth because the sacrifice of the Son surpasses heaven and earth and remains valid in eternity, so that the devil cannot attack us any more. Similarly, the slavery of a Christian is greater than any other slavery, except that it is a slavery not to the bad but to the good and is motivated by a free conscience. After all, who was a greater slave than Christ, who became the servant of his enemies and even washed the feet of Judas? Thus a Christian must do good even to his enemies and opponents, as Christ said: “You too must wash one another’s feet.”

If Christ suffered the vilest things for you and took your shame on himself, for he took your sins and crimes on him as if he were the one who had committed them and he suffered the pains of eternal damnation for you. As it is said, “He tasted death for us all,” and now Christ has placed our brothers and neighbours in his place, so I ask you, what is so awful about serving Christ and your brothers, at his command? Philippians 2 exhorts us to serve our neighbours by following the example of Christ. In fact, we are not just slaves; we are the garbage and filth of the world, just as Christ was rejected for our sake and considered to be the filth of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolam Divi Pauli Apostoli ad Galatas Notae ex Concionibus Gasparis Oleviani Excerptae, et a Theodoro Beza Editae</cite>, (Geneva: Eustache Vignon, 1578). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 187.</span></figcaption>

</figure><figure class="quote" id="q-95d4f7e253" data-kw="">
<blockquote><p>At a soiree to the Revd Dr Samuel B. Wylie held at Belfast in October 1845, the Revd Isaac Nelson of Donegall Street Presbyterian Church spoke of his admiration for Dr Wylie. Dr Wylie then addressed the gathering, which was chaired by Counsellor James Gibson, on the steps that Covenanters in America had taken against the abomination of chattel slavery:

The CHAIRMAN then called upon the Rev. Isaac Nelson, to address the meeting on union among christians of all denominations, for the suppression of slavery as a system repugnant to liberty, and the spirit of the Gospel. Mr. Nelson responded to the sentiment in an eloquent and energetic speech, in which he denounced slavery as hateful in the sight of God, and disgraceful to humanity. – He hoped the mantle of Dr. Wylie, and men like him, who had contended for the liberty of their fellow-man, would fall upon others, who would never cease their efforts until the foul stain of slavery would be not only banished from churches, but from every nation under heaven. (Hear, hear, and cheers.) All sections of the church would unite to free the slave, indeed, on that subject of slavery, and the conclusion to which he had come was, that no slaveholder should be allowed to sit down at the Lord’s table, or be recognised as a member of the Christian Church. He did not take his opinions from any man, and, were he to stand alone in the Church to which he had the honour to belong, he would maintain his opinion that slave-holding was a sin, and that the slave-holder should be excluded from the church. (Cheers.)

THE CHAIRMAN then introduced Dr. Wylie to the meeting, and he gave a detailed account of what he had done himself and of what had been done in his day for the abolition of slavery in America, as regarded the Reformed Presbyterian Church, the end of which was that all slaveholders were banished from her communion. For many years that church had maintained the high and holy stand she had taken, though in some places her members had suffered much on account of their opposition to slavery. The Covenanting Church in America would as soon allow a sheep-stealer to sit down at the table of the Lord, as they would a slave-holder. (This statement was received with the most enthusiastic applause.) Dr. Wylie then congratulated the various churches in this country on the stand which they had taken in opposition to slavery […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belfast-commerical-chronicle.html">Belfast Commerical Chronicle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commerical Chronicle</cite>, 27 Oct. 1845</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><figure class="quote" id="q-6e211f90cb" data-kw="">
<blockquote><p>It is a great grief to parents, to see their own Children taken by strangers &amp; made slaves in their own sight: but it is a greater grief for fathers to be so cruelly dealt with in their own country, at their friends’ hands and country-men, that they shall be compelled willingly, though against their wills, to sell their children for slaves, or else die for hunger.

At strangers’ hands, and specially if they be of another Religion, no man looketh for any favour, and if any do come, it is more then looked for, and so much the more welcome, when it cometh: but at a friend and countryman’s hand, where all courtesy is to be looked for, and to find none but all extremity, it is a grief above all griefs, and man’s heart can never digest it.

It is against God, against nature, and common reason which teacheth all gentleness to such: nay it is worse then beastliness: for one beast will not deal so cruelly with another of his own kind: and on theif will not rob another: therefore to be spoiled and robbed by them of whom they should be defended &amp; relieved, it is a grief that passeth all sorrow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-pilkington.html">James Pilkington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two godly and fruitful treatises of the foul and gross sin of oppression. The one taken out of the exposition upon the fifth chapter of Nehemiah</cite>, (Cambridge: Thomas Thomas Printer, 1585), pp 13-14.</span></figcaption>

At strangers’ hands, and specially if they be of another Religion, no man looketh for any favour, and if any do come, it is more then looked for, and so much the more welcome, when it cometh: but at a friend and countryman’s hand, where all courtesy is to be looked for, and to find none but all extremity, it is a grief above all griefs, and man’s heart can never digest it.

It is against God, against nature, and common reason which teacheth all gentleness to such: nay it is worse then beastliness: for one beast will not deal so cruelly with another of his own kind: and on theif will not rob another: therefore to be spoiled and robbed by them of whom they should be defended &amp; relieved, it is a grief that passeth all sorrow.”

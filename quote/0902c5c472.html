</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-056c671a70" data-kw="">
<blockquote><p>Answer… nor were all these things [including the angelic “world”] created in the space of six days, as you untruly affirm. … Secondly, nor were the angels and their heavens created within the space of those six days, wherein all things of this world were made, Gen. 1.1—but long before.</p></blockquote>

</figure><figure class="quote" id="q-788a1ac44c" data-kw="">
<blockquote><p>As if the several motions and phaenomena of the heavens may be with equal probability explained according to the Ptolemaic or Copernican Hypothesis, viz. about the rest or motion of the earth; then it necessarily follows, that from those phaenomena no argument can be drawn evincing the necessity of the one hypothesis and overturning the probability of the other. If that great wonder of nature, the flux and reflux of the sea, might with equal congruity be solved according to the different opinions, of its being caused by subterraneous fires, or from the motion of the moon, or the depression of the lunar vortex, or (which to me is far the most probable) by a motion of consent of the sea with all the other great bodies of the world; we should find no necessity at all of entertaining one opinion above another, but to look upon all as probable, and none as certain. So likewise for the composition and motion of all natural bodies, the several hypotheses of the old and new philosophy, implying no apparent incongruity to nature, do make it appear that all or any of them may be embraced as ingenious romances in philosophy (as they are no more), but that none of them are the certain truth, or can be made appear so to be to the minds of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, a Weapon-Salve for the Churches’ Wounds, or the Divine Right of Particular Forms of Church-Government: Discussed &amp; Examined</cite>, … (London, 1662), pt. 2, ch. 6, p. 293</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“As if the several motions and phaenomena of the heavens may be with equal probability explained according to the Ptolemaic or Copernican Hypothesis, viz. about the rest or motion of the earth; then it necessarily follows, that from those phaenomena no argument can be drawn evincing the necessity of the one hypothesis and overturning the probability of the other. If that great wonder of nature, the flux and reflux of the sea, might with equal congruity be solved according to the different opinions, of its being caused by subterraneous fires, or from the motion of the moon, or the depression of the lunar vortex, or (which to me is far the most probable) by a motion of consent of the sea with all the other great bodies of the world; we should find no necessity at all of entertaining one opinion above another, but to look upon all as probable, and none as certain. So likewise for the composition and motion of all natural bodies, the several hypotheses of the old and new philosophy, implying no apparent incongruity to nature, do make it appear that all or any of them may be embraced as ingenious romances in philosophy (as they are no more), but that none of them are the certain truth, or can be made appear so to be to the minds of men.”

.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-geocentricism-heliocentrism/#:~:text=As%20if%20the%20several%20motions%20and,be%20to%20the%20minds%20of%20men&amp;text=As%20if%20the%20several%20motions%20and%20phaenomena%20of&amp;text=so%20to%20be%20to%20the%20minds%20of%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a68262c412" data-kw="">
<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-a1e2a858d1" data-kw="">
<blockquote><p>…in taking up the language of ‘the space of six days,’ the Westminster Assembly declared that it stood with previous theologians in affirming a literal six-day creation. The expression of has its roots in at least four previous theologians whom the Westminster divines knew. As we have seen, the words ‘in the space of six days’ appear in the writings of Bonaventure, Calvin, Zanchi, and Ussher.² ² Bonaventure, Commentaries on the Four Books of Sentences, book 2, distinction 12, art. 1, question 2; Calvin, Commentaries on Genesis, 1:78; Zanchius, Confession of Christian Religion, 21 [5.1]; De Operibus Dei intra Spacium Sex Dierum Creatis; Ussher, Works, 11:183.</p></blockquote>

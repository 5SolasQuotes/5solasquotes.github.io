<blockquote><p>Whether there is a natural law, and how it differs from the moral law. The former we affirm; the latter we distinguish. The moral law remains perpetual; the ceremonial is abrogated in Christ as to obligation, having served as types; the judicial binds as to general equity. From the law comes knowledge of sin, and justification by the law is impossible to fallen man.</p></blockquote>

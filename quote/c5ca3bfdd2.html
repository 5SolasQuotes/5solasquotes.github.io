<main class="wrap"><figure class="quote" id="q-c5ca3bfdd2" data-kw="">
<blockquote><p>The question does not concern the perspicuity which does not exclude the means necessary for interpretation (i.e., the internal light of the Spirit, attention of mind, the voice and ministry of the church, sermons and commentaries, prayer and watchfulness). For we hold these means not only to be useful, but also necessary ordinarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-623aa7b562" data-kw="">
<blockquote><p>The Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith</cite>, on ch. 1, §§ 9–10</span></figcaption>

</figure><figure class="quote" id="q-a9307165a8" data-kw="">
<blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, Book I, ch. 2, p. 51</span></figcaption>

</figure><figure class="quote" id="q-012b73bcb1" data-kw="">
<blockquote><p>As for types, allegories, mystical stories, and obscure predictions, he made use of them under the Old Testament on purpose to exercise the faith of the church in the discovery of the mystery of grace which was contained in them. And whatever of that nature is contained in the Scripture, being interpreted by the light of the gospel, is clear and plain unto them who are taught of God.</p></blockquote>

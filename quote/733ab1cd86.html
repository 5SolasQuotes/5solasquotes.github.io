<main class="wrap"><figure class="quote" id="q-733ab1cd86" data-kw="">
<blockquote><p>Question 6: Beza gives the keys to both pastors and elders. Cartwright denies the keys to any except only to pastors. But Daniel Nilius, the keys (says he) were given to Peter, ratione officii, by his office, and not to the apostles only, but also to all who were to be sent to preach and govern. Answer: The keys by the preaching of the gospel, potestas concionalis clavium [the preaching power of the keys], were given to Peter as representing all pastors and doctors, tanquam subiecto adaequato [as an adequate subject]: The keys by way of disciplinary binding and loosing were given to Peter, tanquam, subiecto virtuali [as a virtual subject], representing not only pastors, but also doctors and ruling elders, who were to be called and sent of God. Question 7. How can any voice in matters of religion, but only pastors, for ruling elders are not pastors. So [Richard] Field [an Anglican]. Answer: It is Jesuit-like to reason thus with Bellarmine, who says it is a pastoral act to define in councils; and therefore none should teach in council (says Panormitan in the Council of Basil) but prelates who are the pillars and keys of Heaven. So said Eccius. But the Council of Basil thought not so, nor the Greek Church, for whom Nilus speaks, alleging others whom it concerns should voice also.

2. Matters of discipline concern all, Ergo [therefore], elders representing the people should voice.

3. Suppose that the suffrage and voice of a pastor, and of an elder be voices different only in diverse relations to diverse officers, to wit, the pastor and the elder; yet in the matter of bearing weight in the conscience from force of truth, and not from the authority of men, they are equal; and therefore ruling elders having knowledge and light, and withal authority of office may well have voices: But it follows not hence that these who have knowledge are formal canon-makers, because the decrees and constitutions of synods lay two obligations upon the people: One for the matter, and so in respect that in the moral part thereof they must be agreeable to the Word, they bind the consciences to an obedience of conscience. 2. They impose an ecclesiastical tie from the authority of the council and canon-makers, and so they require subjection or obedience of reverence for the authority-official that is in the canon-makers: The second command lays on the first bond or tie, and the first command lays on the other bond and tie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 19; pp. 290-1</span></figcaption>

</figure><figure class="quote" id="q-37c15bd479" data-kw="">
<blockquote><p>Having showed what ruling elders are, it follows to show Scripture and divine right for them. Our first argument is taken from the governement and policy of the Jewish Church thus: Whatsoever kind of office-bearers the Jewish Church had, not as it was Jewish, but as it was a Church, such ought the Christian Church to have also. But the Jewish Church, not as it was Jewish, but as it was a Church, had elders of the people who assisted in their ecclesiastical government and were members of their ecclesiastical consistories. Therefore such ought the Christian Church to have also. The proposition will no man call in question, for quod competit alicui qua tali competit omni tali. That which agrees to any Church as it is a Church, agrees to every Church. I speak of the Church as it is a political body and setled ecclesiastical republic. Let us see then to the assumption. The Jewish Church, not as it was a Church, but as it was Jewish, had an high priest, typifying our great high Priest Jesus Christ… But as it was a Church, and not as Jewish, it had four sorts of ordinary office-bearers, priests, Levites, doctors, and elders, and we conformably have pastors, deacons, doctors and elders. To their priests and Levites, Cyprian does rightly liken our pastors and deacons, for howsoever sundry things were done by the priests and Levites, which were typical and Jewish only, yet may we well parallel our pastors with their priests, in respect of a perpetual ecclesiastical office common to both, viz. the teaching and governing of the people of God, Mal. 2:7; 2 Chron. 19:8, and our deacons with their Levites, in respect of the care of ecclesiastical goods and of the work of the service of the house of God in the materials and appurtenances thereof, a function likewise common to both, 1 Chron. 26:20 &amp; 23:24-28. The Jewish Church had also doctors and schools, or colleges for the preservation of true divinity among them, and of tongues, arts and sciences, necessary thereto, 1 Chron. 15:22-27; 2 Kings 22:14; 1 Sam. 19:20; 2 Kings 2:3-5; Acts 19:9. These office-bearers they had for no typical use, but we have them for the same use and end for which they had them. And all these sorts of office-bearers among us we do as rightly warrant from the like sorts among them as other whiles we warrant our baptizing of infants from their circumcising of them, our churches by their synagogues, etc. Now that the Jewish Church had also such elders as we plead for, it is manifest: for besides the elders of the priests, there were also elders of the people joined with them in the hearing and handling of ecclesiastical matters, Jer. 19:1, ‘Take of the ancients of the people and of the ancients of the priests.’ The Lord sending a message by the prophet would have a representative body of all Judah to be gathered together for receiving it, as Tremellius notes. So 2 Kings 6:32. Elisha sat in his house and the elders sat with him. We read, 2 Chron. 19:8, that with the priests were joined some of the chief of the fathers of Israel to judge ecclesiastical causes and controversies. And howsoever many things among the Jews in the latter times, after the captivity, did wear to confusion and misorder, yet we find even in the days of Christ and the apostles, that the elders of the people still sat and voiced in council with the priests, according to the ancient form, as is clear from sundry places of the New Testament, Mt. 16:21 and 21:23 and 26:57-59 and 27:1-12; Mk. 14:43; Lk. 22:66; Acts 4:5.</p></blockquote>

vernment+of+the+Church+of+Scotland+in+the+Points+of+Ruling-Elders...+%28Edinburgh%3A+Bryson%2C+1641%29%2C+ch.+3%2C+pp.+17-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F37c15bd479.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/37c15bd479.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/offices-of-church#:~:text=Having%20showed%20what%20ruling%20elders%20are,Mk.%2014%3A43%3B%20Lk.%2022%3A66%3B%20Acts%204%3A5&amp;text=Having%20showed%20what%20ruling%20elders%20are%2C%20it%20follows&amp;text=and%2027%3A1%2D12%3B%20Mk.%2014%3A43%3B%20Lk.%2022%3A66%3B%20Acts%204%3A5" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 1.39.28–29</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.”

— William Ames, The Marrow of Theology, 1.39.28–29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COrdinary%20Ministers%20follow%20the%20form%20of%20the%20Church%20that%20is%20instituted%3B%20they%20are%20not%20Ecumenical%2C%20National%2C%20Provincial%2C%20or%20Diocesan%20Bishops%2C%20but%20Elders%20of%20one%20Congregation%2C%20who%20in%20the%20same%20sense%20are%20also%20called%20Bishops%20in%20the%20Scriptures.%2029.%20Those%20transcendent%20members%20of%20the%20Hierarchy%20were%20merely%20human%20creations%2C%20brought%20into%20the%20Church%20without%20any%20Divine%20precept%20or%20example.%E2%80%9D%0A%0A%E2%80%94%20William%20Ames%2C%20The%20Marrow%20of%20Theology%2C%201.39.28%E2%80%9329&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F947e6d6c05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/947e6d6c05.html">Permalink</a><a class="src" href="https://archive.org/details/marrowsacdi00ames" rel="noopener" target="_blank">Read it online · Internet Archive (1639 ed.)</a></div>
</figure><figure class="quote" id="q-23bfc6ed0e" data-kw="">
<blockquote><p>There remains to speak of the widows which were godly, poor, women in the church above the age of 60 years for the avoiding of all suspicion of evil which might rise by slanderous tongues if they had been younger (1 Tim. 5:9). These, as they were nourished at the charges of the church, being poor, so did they serve the church in attending upon poor strangers and the poor which were sick in the church, whereof they were widows. Now although there is not so great use of these widows with us as there was in those places where the churches were first founded and in that time wherein this order of widows was instituted, part of the which necessity grew both by the multitude of strangers through the persecution and by the great heat of those East countries, whereupon the washing and supplyng of their feet was required: yet for so much as there are poor which are sick in every church, I do not see how a better and more convenient order can be devised for the attendance of them in their sickness and other infirmities than this which St. Paul appoints that there should be (if there can be any gotten) godly, poor widows, of the age which St. Paul appoints, which should attend upon such. For if there be any such poor widows of that age destitute of all friends, it is manifest that they must needs live of the charge of the church, and seing they must needs do so, it is better they should do some duty for it unto the church again than the church should be at a new charge to find others to attend upon those which are sick and destitute of keepers, seeing that there can be none so fit for that purpose as those women which St. Paul does there describe: so that I conclude that (if such may be gotten) we ought also to keep that order of widows in the church still. I know that there be learned men which think otherwise, but I stand upon the authority of God’s Word and not upon the opinions of men be they never so well learned. And if the matter also should be tried by the judgement of men I am able to show the judgment of as learned as this age has brought forth which think that the institution of widows is perpetual and ought to be where it may be had and where such widows are found. Indeed they are more rare now than in the apostles’ times: For then by reason of the persecution those which had the gift of continency did abstain from marriage after the death of their husbands for that the sole life was an easier estate and less dangerous and chargeable when they were driven to fly than the estate of those which were married.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, [Presbyterian] Admonition to the Parliament (1573) | ‘To the sections beginning in the 118th page and holding on until the 123rd page’, pp. 191-2</span></figcaption>

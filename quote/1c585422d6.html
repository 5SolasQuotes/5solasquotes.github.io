<main class="wrap"><figure class="quote" id="q-1c585422d6" data-kw="">
<blockquote><p>Some are so proceeded against for not observing of holy days, some for not kneeling at the sacrament of the Lord’s Supper, some for not using the sign of the cross in baptism; and what would become of ministers that should neglect or omit to wear the surplice in sacred administrations is easy to conjecture. But these things are all of them unwritten and unscriptural. Great and many indeed have been the disputes of learned men to prove that although they have no divine institution, nor yet example of apostolical or primitive practise, yet that they may be lawfully used for decency and order in the worship of God. Whether they have evinced what they aimed at is as yet undetermined… they are all granted to be arbitrary inventions of men… For what men think meet to do themselves in the matters of the house of God and his worship, it may be measured and accepted with Him according to their light and design. But for what they impose on others… they ought to have his warrant and authority for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672)</cite>, ch. 5, pp. 212-13</span></figcaption>

<blockquote><p>It amazes me to hear wise and godly men say, ‘It is Popery that is coming in upon us;¹ therefore, let us all forsake the parish-churches, quasi die [as by the day]. The enemy will take the city within these few years; therefore, let us all go out of it today. Like him that killed himself for fear of dying some years hence. Dementation goes before perdition. Who knows not that the religion of the parish churches is likely to be the national religion? And shall we persuade protestants to leave them all?</p></blockquote>

</figure><figure class="quote" id="q-a817a3fce0" data-kw="">
<blockquote><p>Fourthly, it may inform us, if our God be so holy and pure, then his worship also must be pure. What should a pure God do with an impure and mixed worship? He will have no plowing with an ox and an ass… Dt. 22:10-11. There is no serving Him and idols too, Josh. 24:19. He tells these idolaters, ‘Ye cannot serve the Lord, for He is an holy and a jealous God’ that can endure no co-rival in his worship. He will have all done there according to the pattern; we must set up nothing in his worship without the warrant of his Word, Mt. 28:20. Whatsoever He commands, not whatsoever men command, must we observe to do. God’s courts are courts of holiness and therefore no uncleanness must be set up there, Isa. 62:9… Fifthly, it informs us that the persons must be pure: As the worship must be pure, so must the worshippers; The God of purity must have pure servants: the fountain of holiness will have none but holy followers. It is a disgrace to an eminent holy man to have a bastard lay claim to him. Ps. 50:16, To the wicked says God, ‘What hast thou to do to declare my statutes?’ Whenever we come to worship this glorious God, we must wash our hands in innocency, Ps. 26:6, and purge our families from sin, as Jacob did his from idols before he went to Bethel, Gen. 35:1-3. The people must be sanctified and prepared before the Lord will deliver his holy Law unto them; then and not tell then does God speak, Ex. 19:14-15 compared with 20:1. He will not take a wicked man by the hand. What communion has light with darkness, purity with impurity, virtue with vice, beauty with deformity, life with death, or the chiefest good with the foulest evil? There must be always a purging of our hearts from sin before we draw nigh to God in praying, hearing, sacraments, etc. else the Lord will abhor both us and our duties, and will answer us according to our idols, Eze. 14:3-4. Under the Law, if any man came to offer a sacrifice with his uncleanness on him, he must be cut off; there must be washing and cleansing before he came; so in all our approaches to God in duty there must be not only a habitual, but also an actual fitting and preparing of ourselves for the work. Therefore when James (4:8) had commanded us to draw nigh to God, he presently adds, ‘Cleanse your hands ye sinners, and purify your hearts.’ Our hearts are not fit to serve the living God till they be purged from dead works, Heb. 9:14; God will not vouchsafe to reason with us, nor to have any communion with us, till we have first washed ourselves and made us clean; Isa. 1:16-18, ‘Then come let us reason together.’ The Lord will be worshipped in the beauty of holiness or not at all, Ps. 96:9, there is no pleasing Him without it, and none that ever had it in truth but pleased him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Holiness… (London: 1655), ch. 2</cite>, pp. 44-47</span></figcaption>

<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. … 2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse. 3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity. 4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’ 5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b0ab03280e" data-kw="">
<blockquote><p>…the Canon law prohibiting to depart or swerve from the rules and discipline of the Roman Church, yet excepts discretionem justitiae [the discretion of righteousness], and so permits to do otherwise than the Church prescribes, if it be done cum discretione justitiae [with the discretion of righteousness]. The [Romaninst] Schoolmen also give liberty to a private man of proving the statutes of the Church, and neglecting the same, if he see cause for doing so, Si causa fit evidens, per se ipsum licite potest homo, statuti observantiam praeterire. If any be not able to examine and try all such things, debebant omnes posse, Dei jussu: deficiunt ergo sua culpa [all being able to keep the command of God, therefore they default by their own fault], says Pareus. Si recte probandi facultate destitui nos sentimus, ab eodem spiritu qui per prophetas suos loquitur petenda est, says Calvin. We will not then call any man Rabbi, nor jurare in verba magistri [swear on the words of a magistrate], nor yet be Pythagorean disciples to the Church herself, but we will believe her and obey her insofar only as she is the pillar and ground of truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, … (Edinburgh, 1637) | pt. 1, ch. 6, p. 20</span></figcaption>

0pillar%20and%20ground%20of%20truth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5bb02d34fe" data-kw="">
<blockquote><p>Calvin, Beza, yea, all our writers condemn blind obedience as brutish… …concerns his conscience, knowing that he must do it in faith as he does all his moral actions; Ergo [Therefore], the magistrate must examine what he practices in his office, according to the Word, and must not take it upon the mere authority of the Church, else his faith in these moral acts of his office should be resolved ultimately on the authority of the Church, not on the Word of God, which no doubt is Popery; for so the warrant of the magistrate’s conscience should not be, ‘Thus saith the Lord,’ but ‘Thus saith the Church in their decrees.’ … 2. It’s against Scripture and reason that… all others, should obey the decrees of the Church with a blind faith, without inquiring in the warrants and grounds of their decrees, which is as good Popery as magistrates and all men are to believe as the Church believes with an implicit faith; so ignorance shall be the mother of devotion; Whoever impute[s] this to us, who have suffered for non-conformity, and upon this ground, that synods can err… … Thus they are servants and slaves who are obliged to follow the judgment of councils absolutely, without limitation; and because they say it, whether they warrant their decrees by the Word of God or not, that is a true major proposition: But now the assumption is most false, for neither magistrates nor any other are to follow the judgment of the Church absolutely, without limitation, and because they say it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 595-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-d0cd79814c" data-kw="">
<blockquote><p>[4.] Calvin treating of Church-power, says well, ‘Non est igitur ecclesiae potestas in•…inita, sed subjecta verbo Domini, &amp; in eo quasi inclusa.’ (Institutes, bk. 4, ch. 8, sect. 4) That all Church-judicatories, whether congregational-elderships, or presbyteries or synods, whether provincial or national, or ecumenic, being constituted of men that are weak, frail and ignorant in part, are in their determinations fallible and subject to error, Isa. 40:6-8; Rom. 3:4; 1 Cor. 13:9,12.

5. That insofar as any of these do actually err and decline from the truth, they do insofar act without power and authority from Jesus Christ: They can do nothing (of themselves, they may do, but not by His commission and warrant) against the truth, but for the truth, 2 Cor. 13:8. The power which He has given them being to edification, and not to destruction, 2 Cor. 13:12.

6. Sad experience, almost in every generation, does teach us that Church-guides and Church-judicatories do oftentimes decline from the straight-ways of the Lord, and decree unrighteous decrees, and write grievous things which they have prescribed, Isa. 9:15-16; Jer. 8:8-9; Mal. 2:8-9; Jer. 2:8. And that whilst they are boasting of the authority given to them of God, and of their skill in the Law, and professing to walk according thereto, they are perverting the precious truths of God, and persecuting these who cleave thereunto, Jer. 18:18; Isa. 66:5; Jn. 7:48-49.

7. That the same Lord, who has commanded us not to despise prophesying, 1 Thess. 5:19, has also commanded us to prove all things, and to hold fast that which is good, ver. 20. And no[t] to believe every spirit, but to try the spirits, whether they be of God, because many false prophets are gone forth into the world, 1 Jn. 4:1. And that whatsoever is not of faith is sin, Rom. 14:15. And that we ought not to be the servants of men, 1 Cor. 7:23. That is to do things (especially in the matters of God) for which we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2. And that it is therefore both the duty and privilege of every Church-member, and of every inferior Church-judicatory, to examine by the judgement of discretion every thing which the Church-authority joins, whether it be agreeable or repugnant to the rules of the Word; and if after a diligent and impartial search, it be found repugnant, they are not to bring their consciences in bondage thereto; neither is the allowing and exercising of the judgement of discretion by inferiors, the setting them as judges over their superiors, or making them transgress the line, or limits of that due subordination and submission appointed unto them of God. Protestant divines in their writings, de judice controverstarum [on the judge of controversies] have fully answered this, and showed us that it does not make a private man or an inferior, judge of the sentences and decrees of his superiors, but only of his own actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (Edinburgh, 1658), pp. 96-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

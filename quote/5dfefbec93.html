<main class="wrap"><figure class="quote" id="q-5dfefbec93" data-kw="">
<blockquote><p>In the second half of the seventeenth century, the Viennese nobility introduced French fashion as a consumption pattern for Austrian elites. Beaver and vicuña hats, made of raw materials from Canada, Peru, West Africa, the Sudan and the Levant, were part and parcel of the new French fashion. French hats were globalized commodities appreciated throughout Europe, although the globalized nature and composition of the product remained completely invisible. This article considers Vienna as a remote area, far from the booming and, in historiography, well-explored European Atlantic ports and capitals, and investigates how Vienna participated in particular global fashion trends. Specifically, it focuses on the social and economic impact of hats as a globalized consumer good on the local Viennese market. Based on an extensive analysis of archival sources, the article sheds light on consumption patterns of elites, practices of the trade in hats, and the consequences of the globalized hat market for local craft production. The globalization of the hat market entailed the immigration of fully trained hatters. Skilled craftsmen from France and Italy introduced new processing methods in Vienna, but this did not result in the dissemination of knowledge. The continuing demand for hats in Vienna stoked a large increase in imports of finished or semi-finished hats, which in turn fostered the emergence of new branches of activity for the accoutrement and selling of these products.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/veronika-hyden-hanscho.html">Veronika Hyden-Hanscho</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Invisible Globalization: French Hats in Habsburg Vienna</cite>, 1650-1750′ Journal of European Economic History (3 / 2016), pp. 11-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>34. In all Reformed Churches men use[d] to enter into the places of public worship with their hats off [is the claim, in accordance with the Anglican practice that the puritans rejected]. In France the women that are persons of quality unmask themselves. And the devoutest sort both of men and women use[d] to kneel, and make a short prayer for God’s blessing on the service they come to perform, before they sit down; Yet the [Westminster] Directory (though it pretends conformity with them) prohibits these very things, which are likewise used upon the same occasions.

35. In some places all the people stand bare as long as they are in the Church, as in Hungary and Transylvania, where the Prince himself uses to be uncovered. In others they stand bare only during the service, as at Geneva, where they are covered only at sermon. In Poland and Lithuania they sing, and both read and hear the Scripture standing, and they beat their breast at the end of their prayers. Everywhere they use to kneel at prayer [especially in the 1500’s]; and if all do not kneel when they may conveniently, it is scandalous. It was ordered by the last National Assembly of the Reformed Churches of France held at Loudun, that all should be bare-headed whilst the office of baptism is read. Which was not so much a new constitution as the renewing of an old one as may be seen in their Discipline, which will have those censured that shall not uncover themselves when sacraments are celebrated. And although there is too much irreverence in the said Churches both at the administration of sacraments and at all other holy duties performed in the congregation, it is well known that it is against the mind of the ministers, who very often use to reprehend the people for this abuse, and exhort them to behave themselves more reverently in the house of God. By which we may guess what judgement they would make of those of the presbyterian congregations, who never kneel [they rather generally stood at prayer in the 1600’s], and never uncover their heads, or only a little the top or one side of them at prayer… And because this outward reverence is so slighted and almost laughed at by some, though great pretenders to reformation, I think it not amiss to transcribe here at length the very words of the Discipline established in the French Reformed Churches, by which may be seen how much they value it (ch. 10, article 1): ‘That irreverence shall be mended which is seen in many when they are present at Common Prayer in the Church, or at their private prayer in the family, not to uncover their head and not to bend their knees; a thing which is contrary to piety, gives suspicion of pride, and may offend the godly. Wherefore the ministers shall be warned, as likewise the elders and heads of families, to watch carefully, that during the said prayers every one, without exception or acception of persons, do by these outward signs stifie the humility of their hearts, and of that inward homage which they yield unto God.’

36. In the Churches of Lithuania and Polonia, where they have their hats on at sermon, they always put them off at the name of Jesus; and the women, if they be sitting, bow down their head; if they they stand, they make a curtsy. The Reformed Church of Bremen [Germany] do the like. And the same reverence was used at the naming of that holy name by a great many, though not by all, nor always, before the wars in the Palatinate [Germany], and no doubt but they do so still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-durel.html">John Durel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Government &amp; Public Worship of God in the Reformed Churches Beyond the Seas, wherein is showed their Conformity &amp; Agreement with the Church of England, as it is Established by the Act of Uniformity</cite>, … (London, 1662), Introduction, pp. 32-34 Durel (1625–1683) was an Anglican, Erastian, clergyman and academic, here seeking to support the Anglican practices.</span></figcaption>

ts+are+celebrated.+And+although+there+is+too+much+irreverence+in+the+said+Churches+both+at+the+administration+of+sacraments+and+at+all+other+holy+duties+performed+in+the+congregation%2C+it+is+well+known+that+it+is+against+the+mind+of+the+ministers%2C+who+very+often+use+to+reprehend+the+people+for+this+abuse%2C+and+exhort+them+to+behave+themselves+more+reverently+in+the+house+of+God.+By+which+we+may+guess+what+judgement+they+would+make+of+those+of+the+presbyterian+congregations%2C+who+never+kneel+%5Bthey+rather+generally+stood+at+prayer+in+the+1600%E2%80%99s%5D%2C+and+never+uncover+their+heads%2C+or+only+a+little+the+top+or+one+side+of+them+at+prayer%E2%80%A6+And+because+this+outward+reverence+is+so+slighted+and+almost+laughed+at+by+some%2C+though+great+pretenders+to+reformation%2C+I+think+it+not+amiss+to+transcribe+here+at+length+the+very+words+of+the+Discipline+established+in+the+French+Reformed+Churches%2C+by+which+may+be+seen+how+much+they+value+it+%28ch.+10%2C+article+1%29%3A+%E2%80%98That+irreverence+shall+be+mended+which+is+seen+in+many+when+they+are+present+at+Common+Prayer+in+the+Church%2C+or+at+their+private+prayer+in+the+family%2C+not+to+uncover+their+head+and+not+to+bend+their+knees%3B+a+thing+which+is+contrary+to+piety%2C+gives+suspicion+of+pride%2C+and+may+offend+the+godly.+Wherefore+the+ministers+shall+be+warned%2C+as+likewise+the+elders+and+heads+of+families%2C+to+watch+carefully%2C+that+during+the+said+prayers+every+one%2C+without+exception+or+acception+of+persons%2C+do+by+these+outward+signs+stifie+the+humility+of+their+hearts%2C+and+of+that+inward+homage+which+they+yield+unto+God.%E2%80%99+36.+In+the+Churches+of+Lithuania+and+Polonia%2C+where+they+have+their+hats+on+at+sermon%2C+they+always+put+them+off+at+the+name+of+Jesus%3B+and+the+women%2C+if+they+be+sitting%2C+bow+down+their+head%3B+if+they+they+stand%2C+they+make+a+curtsy.+The+Reformed+Church+of+Bremen+%5BGermany%5D+do+the+like.+And+the+same+reverence+was+used+at+the+naming+of+that+holy+name+

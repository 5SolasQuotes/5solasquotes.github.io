<main class="wrap"><figure class="quote" id="q-181d628e85" data-kw="">
<blockquote><p>This reformation, so happily begun in Scotland, soon extended to England. The friends of civil and religious liberty in both countries, now convinced that they could vindicate their just rights, in opposition to the arbitrary measures of the Court, only by a closer union among themselves, in the year 1643, framed the Solemn League and Covenant. This bond, after having received the approbation of the public authorities in both kingdoms, was joyfully sworn and subscribed by persons of all ranks in Scotland, England, and Ireland. From this time, the Reformation was carried on upon a larger scale.

The Solemn League had for its declared objects, not only the preservation of the reformed religion in Scotland, and the reformation of religion in England and Ireland, but the assimilation of the Churches in the three kingdoms to the nearest uniformity with one another, and with the Reformed Churches abroad, in doctrine, worship, discipline, and government.

The scheme projected by it was most glorious. It was a scheme of union upon a most extended scale; and of union, in the way not of burying truth, or abandoning any former attainment in religion, but of carrying forward reformation by bringing the Church, in principle and practice, to a greater nearness to the pattern laid down in the word of God,—a scheme which, no doubt, partially failed at the time when it was projected, and has not to this day been fully executed; but which shall be carried into full effect when the Lord shall be one, and his name one over all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-stevenson.html">George Stevenson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea for the Covenanted Reformation in Britain and Ireland</cite>, (3rd edn, Edinburgh: W. P. Kennedy, 1844), pp 6-7.</span></figcaption>

</figure><figure class="quote" id="q-88f2410939" data-kw="">
<blockquote><p>But if in a froward tergiversation [change of position], the fornicator begin to reply that he also is scandalized and provoked to go on in his fornication obstinately, by the pastor’s rebuking him for so light a matter, and that the pastor’s reproof to him has appearance of evil, as much as his fornication has to the pastor: Albeit here it may be answered that the pastor’s reproof is not done inordinate [inordinately], neither has any appearance of evil, except in the fornicator’s perverse interpretation, yet for stopping the fornicator’s mouth as well more forcibly as more quickly, the pastor rejoinds that if any scandal follow upon his reproof, it is not to be regarded, because the thing is necessary and that because fornication being a great sin, he may not but reprove it. So, albeit our argument of scandal [against the ceremonies] holds out against the ceremonies considered by themselves, without making mention of the unlawfulness of them in themselves: albeit also when the scandal of non-conformity (if there be any such) is compared with the scandal of conformity, we say truly, that this has appearance of evil in its own condition, and that has none, except in the false interpretation of those who glory in gainsaying.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e0135a7233" data-kw="">
<blockquote><p>LVII. 2. To this must be subjoined another distinction, according to which God wills something as an end, and other things as the means to that end. His Will tends towards the end by a natural [appetitu] affection or desire; and towards the means by a free [electionem] choice. (Prov. 16:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-arminius.html">James Arminius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of James Arminius</cite>, tr. James Nichols (Auburn: Derby, Miller, Orton, 1853), vol. 1, Public Disputations, Disputation 4, ‘On the Nature of God’, p. 453 Arminius was a theological professor at Leiden. He tended not to go into controversial things in his Public Disputations.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>
<div class="actions"><button class="copy" data-copy="“LVII. 2. To this must be subjoined another distinction, according to which God wills something as an end, and other things as the means to that end. His Will tends towards the end by a natural [appetitu] affection or desire; and towards the means by a free [electionem] choice. (Prov. 16:4).”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7a35ec843" data-kw="">
<blockquote><p>Inasmuch, moreover, as the divine affections are understood as descriptive of God’s movement or egress toward the finite order, they are not only to be understood as communicable attributes par excellence, they are also attributes defined primarily in their relationship to finite objects. It is by these affectiones or virtues that God sustains his relations with creatures–they are the preeminent example of the so-called communicabilia or relative attributes. (Mastricht, Theoretic-practica theologia, II.xv.19) In attempting to define the issue still more precisely, Owen distinguished between ‘attributes of Deity which, in order to their exercise, require no determined object antecedent to their agress’ and ‘attributes which can in no wise have an egress or be exercised without an object predetermined, and, as it were, by some circumstances prepared for them.’ (Owen, Dissertation of the Divine Justice, in Works, X, p. 508) The affections fall, clearly, into the latter category, the virtues into the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (Baker, 2003), pt. 2, ch. 6.3, 3. ‘Doctrinal Conclusions’, pp. 559-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

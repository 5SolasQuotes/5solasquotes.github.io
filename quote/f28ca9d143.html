<main class="wrap"><figure class="quote" id="q-f28ca9d143" data-kw="">
<blockquote><p>1. Men enter and initiate themselves in a vicious practice by smaller sins. Heinous sins are too alarming for the conscience of a young sinner; and therefore he only ventures upon such as are smaller, at first. Every particular kind of vice creeps in this gradual manner.

2. Having once begun in the ways of sin, he ventures upon something greater and more daring. His courage grows with his experience. Now, sins of a deeper die do not look so frightful as before. Custom makes everything familiar. No person who once breaks over the limits of a clear conscience knows where he shall stop.

3. Open sins soon throw a man into the hands of ungodly companions. Open sins determine his character, and give him a place with the ungodly. He shuns the society of good men, because their presence is a restraint, and their example a reproof to him. There are none with whom he can associate but the ungodly.

4. In the next stage, the sinner begins to feel the force of habit and inveterate custom; he becomes rooted and settled in an evil way.—Those who have been long habituated to any sin, how hopeless is their reform! One single act of sin seems nothing; but one after another imperceptibly strengthens the disposition, and enslaves the unhappy criminal beyond the hope of recovery.

5. The next stage in a sinner’s course is to lose the sense of shame, and sin boldly and openly. So long as shame remains, it is a great drawback. But it is an evidence of an uncommon height of impiety, when natural shame is gone.

6. Another stage in the sinner’s progress is to harden himself so far as to sin without remorse of conscience. The frequent repetition of sins stupefies the conscience. They, as it were, weary it out, and drive it to despair. It ceases all its reproofs, and, like a frequently discouraged friend, suffers the infatuated sinner to take his course. And hence, 7. Hardened sinners often come to boast and glory in their wickedness. It is something to be beyond shame; but it is still more to glory in wickedness, and esteem it honorable. Glorious ambition indeed! 8. Not content with being wicked themselves, they use all their arts and influence to make others wicked also. They are zealous in sinning, and industrious in the promotion of the infernal cause.—They extinguish the fear of God in others, and laugh down their own conscientious scruples. And now, 9. To close the scene, those who have thus far hardened themselves, are given up by God to judicial blindness of mind and hardness of heart. They are marked out as vessels of wrath fitted to destruction. This is the consequence of their obstinacy. They are devoted the judgment they deserve. Reader! view it with terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evangelical Guardian</cite>, 4.10 (February 1847), pp. 461-62</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9843bb9a1a" data-kw="">
<blockquote><p>VII. It [sin] is a deviation of human action (Mic. 6:8), whereas although their own law of nature is prescribed for brute beasts and inanimate objects (Jer. 8:7; Deut. 32:11; Isa. 1:3; Prov. 6:6), from which they can in some sense fall short, yet whenever this happens, there is not committed by them sin in the proper sense, as in the case when the earth does not produce its fruits, or when the digestion of the stomach or liver fails; yet because they do not have the moral law, and do not acknowledge their own natural law, nor can they order themselves to it, but rather are ordered and determined by another, properly speaking they neither deviate nor sin. Nor is it any hindrance to this that now and then they are said to be punished (Gen. 3:15; 9:5; Lev. 20:15–16; Ex. 21:28). For that penalty, pronounced thus catechrestically, in detestation of the material fact itself, through the body of that beast assails its owner. Nor also does their demise argue for sin, but for a fragile nature, enlarged by the occasion of human sin (Gen. 3:17; Rom. 8:20).</p></blockquote>

<blockquote><p>The Reformed on the contrary state that all concupiscence, which certainly inclines toward evil, is sin, insofar as (1) all such concupiscence is against the law (Rom. 7:7) and thus is lawlessness, in which sin fully consists (1 John 3:4).</p></blockquote>

</figure><figure class="quote" id="q-cedf944e34" data-kw="privation">
<blockquote><p>Hence it follows that the formal reason of sin consists in anomia and privation, denoting the want of the rectitude or goodness which ought to be in the rational creature according to the prescription of the law (whether it belongs to the nature or qualities or actions themselves, for it deprives all these of conformity with the law and so constitutes them guilty of sin). But this privation is not pure or simple, but corrupting; not idle, but energetic; not of pure negation, but of depraved disposition, by which not only is the due rectitude taken away, but also an undue unrectitude and a depraved quality laid down, infecting all the faculties. Just as a physical disease is not only a removal of the temper of the humors, but also a corrupt disposition and disorder (dyskrasia) of them, so sin (which holds the relation of a moral disease of the soul) is not only the negation of a good, but the position of a corrupt disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.1</span></figcaption>

</figure><figure class="quote" id="q-41d66bc500" data-kw="">
<blockquote><p>There is also a received distribution of theology into doctrine concerning God and the works of God. Indeed, whatever things are treated in theology are able to be referred to this double doctrine, even sin itself: which, although it is not a work of God, yet it is an accidental property of a divine work, namely, of angels and men; not concreated, but derived from elsewhere, namely, from the fall of angels and men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), ‘The Distribution of Theology’</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5d8ec6b86b" data-kw="">
<blockquote><p>David, after having celebrated this benefit of the law – that it offers an abundant reward to those who serve God — immediately changes his discourse, and cries out, Who can understand his errors? by which he pronounces all men liable to eternal death, and thus utterly overthrows all the confidence which men may be disposed to place in the merit of their works. It may be objected, that this commendation, In the keeping of thy commandments there is great reward, is in vain ascribed to the law, seeing it is without effect.

The answer is easy, namely, that as in the covenant of adoption there is included the free pardon of sins, upon which depends the imputation of righteousness, God bestows a recompense upon the works of his people, although, in point of justice, it is not due to them. What God promises in the law to those who perfectly obey it, true believers obtain by his gracious liberality and fatherly goodness, inasmuch as he accepts for perfect righteousness their holy desires and earnest endeavours to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 326.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c875024dd5" data-kw="">
<blockquote><p>There was an interesting range of opinion among our Reformed divines as to whether or not the covenant of works was republished under Moses and, if so, what form this republication took. The Scots-born Huguenot theologian, John Cameron, whose arguments were reprinted by the Westminster divine Samuel Bolton, argued that what scripture calls the old covenant was actually a distinct covenant, which was subservient to the one covenant of grace:

7 Thesis.

We say therefore there is a Covenant of Nature, another Covenant of Grace, and another Subservient to the Covenant of Grace; (which is called in Scripture, the Old Covenant) and therefore we will deal with that in the last place; giving the first place to the Covenant of Nature, and of Grace; because they are the chief, and because they have no respect to any other Covenant, although we do not deny the Covenant of Nature, in this corruption of our nature, to be subservient to the Covenant of Grace, as it doth inflame the minds of men with the desire of it: which thing yet it doth by accident …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedomor a Treatise Wherein the Rights of the Law are Vindicated, the Liberties of Grace Maintained, and the Several late opinions against the Law are Examined and Confuted. Whereunto is Annexed a Discourse of the Learned John Cameron’s, Touching the Threefold Covenant of God with Man (London: Philemon Stephens, 1656), p. 356.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>[The Gospel] serves, likewise, the highly important purpose of discovering to sinners their warrant to trust in Christ Jesus for complete salvation. In the blessed gospel, Christ, and God in Christ, are freely offered to sinful men, and men are graciously invited as sinners to receive the offer and to entrust the whole affair of their salvation to Christ and to God in Him (Isa. 55:1–4; John 6:32). By the gospel, they are informed that the Lord Jesus offers Himself with all the inestimable blessings of the everlasting covenant to them and that He graciously invites and urges them as sinners to accept Him as their all-sufficient Savior “and to place the confidence of their hearts in Him for salvation from sin and wrath. Were they to not know that a divine warrant is thereby afforded them to receive and trust in the Savior for their salvation, it would be as great presumption in any of them as it would be in a fallen angel to attempt trusting that He would save him. But by the declarations, offers, calls, and promises of the word of grace, an ample warrant is afforded them as sinners of mankind to trust in the divine Savior and so to take possession of His great salvation. And it is by the gospel, accompanied by the illuminating grace of the Holy Spirit, that their warrant is revealed, that their full right of access to the compassionate Savior is disclosed to them, and that He manifests Himself to be so near them as to be within their reach (Rom. 10:6–8). Oh, how great is the importance and utility of the gracious offers and invitations of the blessed gospel to convinced and despondent sinners! By these, under the illuminating influences of the adorable Spirit, they see that it is lawful and warrantable for them to come as sinners and to entrust, with humble and strong confidence, the eternal salvation of their souls to the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 108–9.</span></figcaption>

</figure><figure class="quote" id="q-2b13774c16" data-kw="">
<blockquote><p>1. The first ground is the Lord’s disposition and nature of mercy and placableness towards a poor sinner, which gives him footing for his hope abundantly in any particular case, as: (1.) From his Name and attributes, whereby He has made Himself known to his people. God proclaims his Name to Moses to be ‘the Lord, the Lord God, the powerful, the mighty Jehovah’ (Ex. 34 [vv. 6-7]), which ministers comfort when annexed to his manifestation of Himself in this way of mercy. ‘Merciful,’ inclined to pity the sin and misery of his people, ready to relieve them in their distress and not only just to require the due service and punish the defaults; ‘Gracious,’ of an affable condescending descending nature, not standing upon the distance that He is in as a great King above all his creatures; He may be petitioned, sought unto and prevailed with by his poor suitors. ‘Long-suffering,’ that is, not hasty to use severity with the worst of sinners, usually taking all other ways first with them, willing that all men should repent and come to the knowledge of the truth (1 Tim. 2:4): Trying many that repent not with much goodness to draw them to it. Enduring with much patience the very vessels of wrath before He brings destruction on them (Rom. 9:22). In all cases He forgives iniquity, transgression and sin.</p></blockquote>

<blockquote><p>The necessity for His death is brought out with an unusual illustration in Hebrews 9, that of a man’s last will and testament. When a man makes a will, it is necessary for his death to occur before the terms of the will become operative. As long as he lives, nothing happens. Now the Greek word διαθήκη, which the writer employs for ‘will’, is used in the Greek Old Testament to translate the Hebrew word בְּרִית, meaning ‘covenant’. It is unmistakably the usual Greek word for a ‘will’. But there is an air of finality about a will. You cannot dicker with a testator. You accept what he leaves you on the conditions he lays down, or you reject it. You have no other line of action.

The one-sidedness of this process seems to have appealed to those who translated the Old Testament into Greek as a better way of characterizing the covenants God makes with men than συνθήκη, the usual word for ‘agreement’. This word might be taken as suggesting a relative equality, an ability on man’s side to make conditions. This is totally false. Man accepts the covenant on God’s terms or he rejects it. He has no other option. Thus the word in Greek at large means a will, and in the Old Testament it means a covenant.

In Hebrews 9:16f. it seems that the writer is playing on the double meaning of the word. Jesus establishes the new διαθήκη, or ‘covenant’, and His death is necessary to establish it, just as necessary as is the death of any testator to establish his διαθήκη, his ‘will’. No διαθήκη is of force without a death. The line of reasoning is perhaps one that we would not have employed. But we are dealing with a first-century writing, not one from the twentieth century. And the point the writer is making is that the death of Christ is an absolute necessity. A ‘will’ is completely inoperative until the testator dies. And Christ’s new ‘covenant’ is likewise inoperative until the death of Christ. Without that the whole Christian system would be impossible.</p></blockquote>

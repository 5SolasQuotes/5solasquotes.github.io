<main class="wrap"><figure class="quote" id="q-157f170654" data-kw="">
<blockquote><p>1st Distinction. The Word of God being given to man as a moral agent, is a rule of all his moral actions, but not of actions of art, sciences, disciplines, yea, or of mere nature. …

6. What is warranted by natural reason, is warranted by Scripture, for the Law of nature is but a part of Scripture.

7. Actions are either purely moral, or purely not-moral, or mixed of both: The first has warrant in Scripture, the second none at all, the third requires not a warrant of Scripture every way concludent, but only in so far as they be moral.

8. Matters of mere fact, known by sense and human testimony, are to be considered according to their physical existence, if they be done or not done; if Titus did such a thing or not, such are not in that notion to be proved by Scripture:

2. They may be considered according to their essence and moral quality of good and lawful, bad or unlawful, and so they are to be warranted by Scripture. … * * * 5. Matters of fact are not, and need not be proved by Scripture:

1. Because sense makes them known to us.

2. Their morality is sufficiently known from God’s Word.

3. In matters of fact there may be invincible ignorance: Christ’s resurrection is not a matter of fact, as Hugo Grotius says, but also a matter of Law, as all the miracles and histories in the Word, and to be believed, because God has so spoken in the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 1, question 2, pp. 101-2</span></figcaption>

</figure><figure class="quote" id="q-56392f2102" data-kw="">
<blockquote><p>The question therefore comes to this: does Scripture contain perfectly, not absolutely everything, but whatever is necessary for salvation, not explicitly and in exact words, but with equal force [to explicit statement] or by valid conclusion (aequipollenter vel per legitimam consequentiam), so that there is no need to resort to any unwritten word; or, is Scripture a full and sufficient rule of faith and conduct, not merely a partial and inadequate one? We uphold the first.</p></blockquote>

</figure><figure class="quote" id="q-1cb88c976c" data-kw="">
<blockquote><p>Sundry other branches there are of the abominations of these men … which may be reduced to these three corrupt and bloody fountains: — 1. That the Scripture at best, as given out from God, and as it is to us continued, was and is but a partial revelation of the will of God, the other part of it … being reserved in their magazine of traditions. 2. That the Scripture is not able to evince or manifest itself to be the Word of God … without an accession of testimony from that combination of politic, worldly-minded men that call themselves the Church of Rome.</p></blockquote>

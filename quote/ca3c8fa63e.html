<main class="wrap"><figure class="quote" id="q-ca3c8fa63e" data-kw="">
<blockquote><p>The doctrines of the Lord, then, are three: the hope of life, the beginning and the completion of it. For the Lord has made known to us by the prophets both the things which are past and present, giving us also the firstfruits of the knowledge of things to come…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ce5619f376" data-kw="">
<blockquote><p>Thirdly, true matter [of the Church] are all such [persons] as are baptized, and openly profess that Jesus the son of Mary is the Son of God, made Christ the Lord, by whom only and alone is salvation… … Thirdly, because it is the sum of the whole Gospel, and Covenant in the New Testament, in respect whereof, there is no other point of religion necessary, but as it tends either to bring men unto, or to confirm them in this main truth. Hence it is, that St. John concludes his Gospel with this scope… And therefore since such as do profess this truth do summarily and in general profess all the evangelical doctrines in God’s book, such must needs be fit matter of the Church.</p></blockquote>

</figure><figure class="quote" id="q-3de7504448" data-kw="">
<blockquote><p>Christian doctrine in General, and the Judgment of the Universal, Orthodox Church I… Therefore with mouth and heart we profess this agreed and true doctrine respecting the whole substance and content of the Christian religion given in the writings of the prophets and apostles, acknowledging it, as received in the proper and true sense from the context of Scripture (which is its own best interpreter), to be the sole standard by which all teachings are at all times to be judged, and to which all human writing and confession must be subject and remain subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bremen-consensus.html">Bremen Consensus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. James Dennison Jr., Reformed Confessions of the 16th &amp; 17th Centuries… (RHB, 2012), vol. 3</cite>, p. 646</span></figcaption>

</figure><figure class="quote" id="q-e61972510c" data-kw="">
<blockquote><p>Now that it is not sufficient that they be put to subscribe a confession of faith in only scripture words is clear: 1. Because the Jews will swear and seal the Old Testament in their own sense, but their sense makes the Old Testament to be the word of man, not the Word of God. The Sadducees acknowledged the five books of Moses to be the Word of God, yet because they denied the resurrection of the dead, Christ argues them, Mt. 22:45, ignorant both of the power of God asserted in the books of Moses and of the scriptures, especially of that scripture which God spake out of the bush to Moses: ‘I am the God of Abraham, the God of Isaac, etc.’ Ex. 3:6. Yet would the Sadducees have sworn and subscribed all the book of Exodus as the undoubted word of God, but when they denied the resurrection, sure these words ‘I am the God of Abraham etc.’ making the Covenant of grace to die when Abraham died, and Abraham to have perished in soul and body as they expounded it, was not the Word of God; And Papists will subscribe the Old and New Testament and the three Creeds, the Nicene Creed, the Creed of Athanasius and that which commonly is called the Apostles’ Creed. Yet as they expound the Word and these Creeds, we say they transform the Word of God into the doctrine of devils and most abominable idolatry. The greatest heretics that were, Arius, Nestorius, Appolliuaris, Macedonius, the Tritheists, acknowledge the Scripture to be the Word of God and will swear and subscribe the Word of God and contain themselves intra sacra scripturae locutiones, ‘within the words of scripure’. But their faith is not the faith of the Scripture, and this makes ten thousand and millions of faiths whereas the word ‘faith’ there is but one faith. For Arius has one faith, Apollinaris another, Nestorius another, and every heretic a faith according to the sense that he falsely puts on the Scripture, and all may swear one confession of faith in Scripture-words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Free Disputation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

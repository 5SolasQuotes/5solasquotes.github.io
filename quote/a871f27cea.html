<main class="wrap"><figure class="quote" id="q-a871f27cea" data-kw="">
<blockquote><p>‘I stand.’ Christ expresses his mind by borrowed speeches: for in this verse [Rev. 3:20] He compares every man to a house or householder, and our hearts to doors by which an entrance is made: and Himself to a guest or stranger which comes to the house, and desires to be let in and entertained: yet not so much to look for kindness to be shown [to] Him, as to show favor to us. By this similitude Christ purposes to show this Church, what his mind is toward it: and He expresses it by two signs here set down: first, a desire of their conversion, which He heartily seeks and looks for, ‘I stand and knock.’ Secondly, his promise after their conversion, ‘If any, etc.’ He will have fellowship, even mutual fellowship with them. Now of the words in order as they lie. The scope and substance of them being thus first thus generally propounded, I here note two things. First, that this Church (if we regard the greater part of it) had no true fellowship with Christ as yet, nor Christ with them: because He was not yet received into their houses, but stood at their doors which were shut. This may seem strange: but the cause is evident; the truth is, there were many good things in them: for they knew the Gospel and liked it, and professed it, and were partakers of the seals of the covenant: and yet they were tainted with one great sin of lukewarmness, which closed up the door of their hearts, so that though they had many good things, yet this one sin kept out Christ. By which we see, that one sin, in a man endued with many good graces, keeps out Christ, and bars Him from all fellowship and society with Him… … Seeing then Christ standing at the door of men’s hearts knocks so earnestly to save men’s souls, we again ought to be earnest to receive and embrace the Gospel. He knocks in good earnest, and we must accordingly by God’s grace be as earnest. So much for the first token of Christs love, his desire of their conversion, which He shows by two signs; first his waiting, secondly his knocking, and that joined with crying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures Upon the Three First Chapters of the Revelation… (1595; London: Field, 1604)</cite>, pp. 331–34</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cbb697c9ed" data-kw="">
<blockquote><p>I answer briefly that God does always begin to us, and is beforehand with us in all dealings with ourselves. He gives us many motions, and never withdraws Himself from us but when He is despised and slighted first: therefore let us take heed that we labor to answer Christ’s call when He does call. If we slight it, then in a judicious course, He ceases to speak further to us, if we slight his beginnings of revelations… We would not yield to all the passages of salvation; but when He was beforehand with us, and offered many sweet motions, yet we loved our sins better then our souls, and so repelled all. Therefore I beseech you do not refuse the sweet messages from Heaven, the gracious and sweet motions of the spirit of Christ, make much of them. God has begun to you, be sure to answer. Learn it of Mary, when Christ began [after his resurrection], she set not her heart and infidelity against it, but she opened her heart, and said, ‘Rabboni’ [Jn. 20:16]; learn therefore the duty of spiritual obedience, when God speaks, ‘Speak Lord, for thy servant hears.’ Do not shut your ears to the motions of God’s blessed Spirit, do not harden your hearts against his voice, but open your hearts as she did, ‘Rabboni’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Heavenly Conference between Christ &amp; Mary after his Resurrection… (d. 1635; London: 1654)</cite>, pp. 21-22</span></figcaption>

<blockquote><p>…Under which two excuses [in the text] are comprehended all others of like sort, which flesh and blood does minister, for hindering to rise and open to Christ, and obey his calling, such as we see, Mt. 22, and are usually suggested by our corruption, as the quitting of our pleasure, or profit, our ease, credit, or companions, if we do so; and that we shall fall in disgust, hatred, and obloquy, and other like inconveniences: Neither is it a fit time as yet (but as Felix said to Paul, Acts 24:25) we may take a more convenient season for that, or the like purposes, etc. Such excuses do absenters of themselves from public exercises of divine worship, make, and profaners of the Lord’s Sabbath; such also do covetous extortioners, revengeful oppressors: unclean whoremongers, riotous, drunkards and the like, frame to themselves, and obtrude, and all for this end, to keep Christ out, though He frequently call and knock at their door to enter in. Observations: 1. We see hereby, that it is not an easy matter, but a very hard and difficult one to bring the soul and Christ together, into a near and constant fellowship… but take heed to his voice who calls and knocks, and, as the Father spake at Christ’s baptism from heaven, hear Him and obey. 2. We see, how strong is carnal corruption, and remnants of sin in the regenerate, to hold Christ at the door, and to sleight his voice, calling on the•… to open; and therefore, how much more stronger is the same in the unregenerate, and it is no marvel that they open not unto Him and disobey his voice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Love’s intercourse between the Lamb &amp; his Bride, Christ and his Church, or a clear explication and application of the Song of Solomon (London: Wilson, 1657), on Song 5:3</cite>, p. 210</span></figcaption>

</figure><figure class="quote" id="q-daba0d7595" data-kw="">
<blockquote><p>He knocks, to awaken us to come and let Him in, knocks by his Word and Spirit, knocks by afflictions and by our own consciences; though this is not expressly quoted, yet probably it is referred to (Rev. 3:20), ‘Behold, I stand at the door, and knock.’ He calls sinners into covenant with Him and saints into communion with Him… … III. The excuse she made to put off her compliance with this call (Song 5:3): ‘I have put off my coat; how shall I put it on again?’ She is half asleep; she knows the voice of her beloved; she knows his knock, but cannot find in her heart to open to Him… Making excuses (Lk. 14:18) is interpreted making light of Christ (Mt. 22:5), and so it is. Those put a great contempt upon Christ that cannot find in their hearts to bear a cold blast for him, or get out of a warm bed. IV. The powerful influences of divine grace, by which she was made willing to rise and open to her beloved. When He could not prevail with her by persuasion He put in his hand by the hole in the door, to unbolt it, as one weary of waiting, Song 5:4. This intimates a work of the Spirit upon her soul, by which she was unwilling made willing, Ps. 110:3. The conversion of Lydia is represented by the opening of her heart (Acts 16:14) and Christ is said to open his disciples’ understandings, Lk. 24:45. He that formed the spirit of man within him knows all the avenues to it, and which way to enter into it; he can find the hole of the door at which to put in his hand for the conquering of prejudices and the introducing of his own doctrine and law. He has the key of David (Rev. 3:7), with which He opens the door of the heart in such a way as is suited to it, as the key is fitted to the wards of the lock, in such a way as not to put a force upon its nature, but only upon its ill nature. V. Her compliance with these methods of divine grace at last: ‘My bowels were moved for Him.’ The will was gained by a good work wrought upon the affections: My bowels were moved for Him, as those of the two disciples were when Christ made their hearts to burn within them. She was moved with compassion to her beloved, because his head was wet with dew. Note, Tenderness of spirit, and a heart of flesh, prepare the soul for the reception of Christ into it… Note, When we apply ourselves to our duty, in the lively exercises of faith, under the influence of divine grace, we shall find it will go on much more readily and sweetly than we expected. If we will but rise up, to open to Christ, we shall find the difficulty we apprehended in it strangely overcome, and shall say with Daniel, ‘Now let my Lord speak, for thou hast strengthened me,’ Dan. 10:19… Those that open the doors of their hearts to Christ, those everlasting doors, must meet Him with the lively exercises of faith and other graces, and with these must anoint Him. … 1. She did not open to Him at his first knock, and now she came too late, when afterwards she would have inherited this blessing. Christ will be sought while He may be found; if we slip our time, we may lose our passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible | On Song 5, verses 2-8</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“He knocks, to awaken us to come and let Him in, knocks by his Word and Spirit, knocks by afflictions and by our own consciences; though this is not expressly quoted, yet probably it is referred to (Rev. 3:20), ‘Behold, I stand at the door, and knock.’ He calls sinners into covenant with Him and saints into communion with Him… … III. The excuse she made to put off her compliance with this call (Song 5:3): ‘I have put off my coat; how shall I put it on again?’ She is half asleep; she knows the voice of her beloved; she knows his knock, but cannot find in her heart to open to Him… Making excuses (Lk. 14:18) is interpreted making light of Christ (Mt. 22:5), and so it is. Those put a great contempt upon Christ that cannot find in their hearts to bear a cold blast for him, or get out of a warm bed. IV. The powerful influences of divine grace, by which she was made willing to rise and open to her beloved. When He could not prevail with her by persuasion He put in his hand by the hole in the door, to unbolt it, as one weary of waiting, Song 5:4. This intimates a work of the Spirit upon her soul, by which she was unwilling made willing, Ps. 110:3. The conversion of Lydia is represented by the opening of her heart (Acts 16:14) and Christ is said to open his disciples’ understandings, Lk. 24:45. He that formed the spirit of man within him knows all the avenues to it, and which way to enter into it; he can find the hole of the door at which to put in his hand for the conquering of prejudices and the introducing of his own doctrine and law. He has the key of David (Rev. 3:7), with which He opens the door of the heart in such a way as is suited to it, as the key is fitted to the wards of the lock, in such a way as not to put a force upon its nature, but only upon its ill nature. V. Her compliance with these methods of divine grace at last: ‘My bowels were moved for Him.’ The will was gained by a good work wrought upon the affections: My bowels were moved for Him, as those of the two disciples were when Christ made their hearts to burn within them. She was moved with compassion to her beloved, because his head was wet with dew. Note, Tenderness of spirit, and a heart of flesh, prepare the soul for the reception of Christ into it… Note, When we apply ourselves to our duty, in the lively exercises of faith, under the influence of divine grace, we shall find it will go on much more readily and sweetly than we expected. If we will but rise up, to open to Christ, we shall find the difficulty we apprehended in it strangely overcome, and shall say with Daniel, ‘Now let my Lord speak, for thou hast strengthened me,’ Dan. 10:19… Those that open the doors of their hearts to Christ, those everlasting doors, must meet Him with the lively exercises of faith and other graces, and with these must anoint Him. … 1. She did not open to Him at his first knock, and now she came too late, when afterwards she would have inherited this blessing. Christ will be sought while He may be found; if we slip our time, we may lose our passage.”

— Matthew Henry, Commentary on the Whole Bible | On Song 5, verses 2-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+knocks%2C+to+awaken+us+to+come+and+let+Him+in%2C+knocks+by+his+Word+and+Spirit%2C+knocks+by+afflictions+and+by+our+own+consciences%3B+though+this+is+not+expressly+quoted%2C+yet+probably+it+is+referred+to+%28Rev.+3%3A20%29%2C+%E2%80%98Behold%2C+I+stand+at+the+door%2C+and+knock.%E2%80%99+He+calls+sinners+into+covenant+with+Him+and+saints+into+communion+with+Him%E2%80%A6+%E2%80%A6+III.+The+excuse+she+made+to+put+off+her+compliance+with+this+call+%28Song+5%3A3%29%3A+%E2%80%98I+have+put+off+my+coat%3B+how+shall+I+put+it+on+again%3F%E2%80%99+She+is+half+asleep%3B+she+knows+the+voice+of+her+beloved%3B+she+knows+his+knock%2C+but+cannot+find+in+her+heart+to+open+to+Him%E2%80%A6+Making+excuses+%28Lk.+14%3A18%29+is+interpreted+making+light+of+Christ+%28Mt.+22%3A5%29%2C+and+so+it+is.+Those+put+a+great+contempt+upon+Christ+that+cannot+find+in+their+hearts+to+bear+a+cold+blast+for+him%2C+or+get+out+of+a+warm+bed.+IV.+The+powerful+influences+of+divine+grace%2C+by+which+she+was+made+willing+to+rise+and+open+to+her+beloved.+When+He+could+not+prevail+with+her+by+persuasion+He+put+in+his+hand+by+the+hole+in+the+door%2C+to+unbolt+it%2C+as+one+weary+of+waiting%2C+Song+5%3A4.+This+intimates+a+work+of+the+Spirit+upon+her+soul%2C+by+which+she+was+unwilling+made+willing%2C+Ps.+110%3A3.+The+conversion+of+Lydia+is+represented+by+the+opening+of+her+heart+%28Acts+16%3A14%29+and+Christ+is+said+to+open+his+disciples%E2%80%99+understandings%2C+Lk.+24%3A45.+He+that+formed+the+spirit+of+man+within+him+knows+all+the+avenues+to+it%2C+and+which+way+to+enter+into+it%3B+he+can+find+the+hole+of+the+door+at+which+to+put+in+his+hand+for+the+conquering+of+prejudices+and+the+introducing+of+his+own+doctrine+and+law.+He+has+the+key+of+David+%28Rev.+3%3A7%29%2C+with+which+He+opens+the+door+of+the+heart+in+such+a+way+as+is+suited+to+it%2C+as+the+key+is+fitted+to+the+wards+of+the+lock%2C+in+such+a+way+as+not+to+put+a+force+upon+its+nature%2C+but+only+upon+its+ill+nature.+V.+Her+compliance+with+these+methods+of+divine+grace+at+last%3A+%E2%80%98My+bowels+were+moved+for+Him.%E2%80%99+The+will+was+gained+by+a+good+work+wrought+upon+the+affections%3A+My+bowels+were+moved+for+Him%2C+as+those+of+the+two+disciples+were+when+Christ+made+their+hearts+to+burn+within+them.+She+was+moved+with+compassion+to+her+beloved%2C+because+his+head+was+wet+with+dew.+Note%2C+Tenderness+of+spirit%2C+and+a+heart+of+flesh%2C+prepare+the+soul+for+the+reception+of+Christ+into+it%E2%80%A6+Note%2C+When+we+apply+ourselves+to+our+duty%2C+in+the+lively+exercises+of+faith%2C+under+the+influence+of+divine+grace%2C+we+shall+find+it+will+go+on+much+more+readily+and+sweetly+than+we+expected.+If+we+will+but+rise+up%2C+to+open+to+Christ%2C+we+shall+find+the+difficulty+we+apprehended+in+it+strangely+overcome%2C+and+shall+say+with+Daniel%2C+%E2%80%98Now+let+my+Lord+speak%2C+for+thou+hast+strengthened+me%2C%E2%80%99+Dan.+10%3A19%E2%80%A6+Those+that+open+the+doors+of+their+hearts+to+Christ%2C+those+everlasting+doors%2C+must+meet+Him+with+the+lively+exercises+of+faith+and+other+graces%2C+and+with+these+must+anoint+Him.+%E2%80%A6+1.+She+did+not+open+to+Him+at+his+first+knock%2C+and+now+she+came+too+late%2C+when+afterwards+she+would+have+inherited+this+blessing.+Christ+will+be+sought+while+He+may+be+found%3B+if+we+slip+our+time%2C+we+may+lose+our+passage.%E2%80%9D%0A%0A%E2%80%94+Matthew+Henry%2C+Commentary+on+the+Whole+Bible+%7C+On+Song+5%2C+verses+2-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdaba0d7595.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/daba0d7595.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=He%20knocks%2C%20to%20awaken%20us%20to,time%2C%20we%20may%20lose%20our%20passage&amp;text=He%20knocks%2C%20to%20awaken%20us%20to%20come%20and&amp;text=slip%20our%20time%2C%20we%20may%20lose%20our%20passage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. When the Lord Jesus comes and stands knocking at the door of your heart with the hammer of his Word, and with the hand of his Spirit, then bow yourself with all your might (as Sampson did, Judg. 16:30) to pull back every bolt and to draw in every bar that would keep the door shut against this blessed and bleeding Redeemer. The duty indeed is yours, but the ability is his: as much as in you lies, cause every lust of your heart to make room for your dear Jesus. 2. Welcome Christ into your heart with joy. Say to Him as Laban did to Abraham’s servant, ‘Come in thou blessed of the Lord, thou art welcome; wherefore standest thou without?’ Gen. 24:31. Christ will come to you with a blessing in his hand to bestow on you, as he did to Jacob, Gen. 32:26, etc. David-literal says to his son (that invited him to his house), ‘Why should we be chargeable to thee, my son?’ 2 Sam. 13:25. But this David-spiritual will not be chargeable: wheresoever He comes, where He comes to sup with any soul, He brings his supper with Him, Rev. 3:20, and eats but of his own honeycomb, and of his own honey, Cant. 5:1. This blessed guest brings his blessing with Him, as the ark did to the house of Obed-Edom. 3. When Christ is come into your house to dwell in your heart by faith, Eph. 3:17, be careful to keep his habitation quiet and comfortable; to this end you must adjure your corruptions by the roes and by the hinds of the field that they stir not up nor awake your beloved until He please, Cant. 2:7. ‘Tis pity such a blessed guest should meet with any disturbance; lay God’s charge upon your lusts…</p></blockquote>

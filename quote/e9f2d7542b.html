<main class="wrap"><figure class="quote" id="q-e9f2d7542b" data-kw="">
<blockquote><p>Alas! the clouds are not now a gathering! but our horizon is covered over with blackness, and great drops are a falling, that presage a terrible overflowing deluge of error, and Apostasy from the Truth and Profession of the Gospel of Jesus Christ, to be at hand, if the Lord wonderfully prevent it not. And behold (O wonderful!) the generality of Professors are sleeping in security, apprehending no danger. Satan is more cunning now, than to drive men to Popery by rage and cruelty; (and yet what he may be permitted to do after this manner, who can tell?) or by openly pleading, in his emissaries, for this abomination, (and yet even thus is he already prevailing with not a few) or to send forth his agents for Arminianism and Socinianism (though even this way too, he is too much prevailing.)

But his main work now seemeth to be, to bring in another Gospel, (and yet there is not another) or rather an Antievangelic and Antichristian delusory dream, overturning at, once the whole Gospel of our Lord and Saviour Jesus Christ; and for this end he employeth the Quakers, one the one hand, Men of desperate and antievangelic principles, the very sink of all abominations, old and late (as I shall show, if the Lord will continue health and strength, in an examination of their doctrine and principles, lately emitted by one Robert Barclay) and on the other hand, Men (or Moralists if you will call them so) pleading for and crying up an antievangelic holiness, a mere shadow without substance or reality; and that in place of Christ himself[.]

And in order to the carrying on of this desperate design, The old dragon is employing men of seeming different principles and ways, whom, though their faces seem to look to contrary airths, yet he holdeth notwithstanding fast tied by their tails (as Samson’s foxes were) that thereby, if the Lord permit it, he may, by the fire of enmity to the pure Gospel of the grace of God, burning in their tails, cause a conflagration of that Truth, wherein lieth all our hope: for this new model of Religion, that many are so busied about, is such as Pelagians, Arminians, Papists, Socinians, Quakers, yea Turks [Muslims], and moral Heathens; Yea and all, who are enemies to, and not reconcilable with the true grace of God held forth in the Gospel, will willingly admit of, and harmoniously agree in: A way, which complieth so well with proud self, and with the Corrupt Nature of Man, that it is little wonder, if it have many abettors and admirers.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-edb152a677" data-kw="">
<blockquote><p>All the difference of religion, which is at this day between the Church of Rome and the Protestants, lies in some certain points which the Church of Rome maintains as important, and necessary articles of the Christian faith: whereas the Protestants, on the contrary, neither believe nor will receive them as such. For as for those matters which the Protestants believe, which they conceive to be the fundamentals of religion, they are evidently and undeniably such, that even their enemies admit and receive them as well as they: inasmuch as they are both clearly delivered in the Scriptures, and expressly admitted by the ancient councils and Fathers ; and are indeed unanimously received by the greatest part of Christians in all ages, and in different parts of the world. But now their adversaries add to these many other points, which they press and command men to believe as necessary; and such as, without believing in, there is no possible hope of salvation. As for example: that the Pope of Rome is the head and supreme monarch of the whole Christian Church throughout the world, that he, or at least the Church which he acknowledges a true one, cannot possibly err in matters of faith… which their adversaries plainly protest that they cannot with a safe conscience believe. These points are the ground of the whole difference between them; the one party pretending that they have been believed and received by the Church of Christ in all ages as revealed by him; and the other maintaining the contrary.</p></blockquote>

<blockquote><p>For what true-born Dutchman does not glow with the warmest affection for a prince, whom God, by conferring all manner of accomplishments, has rendered the delight of mankind? Who, like an auspicious star has shined on the world, deeply plunged and sunk in darkness. Who, in a word, from the ashes of his father, is providentially come forth to light, as the genuine phoenix of our days, and appears to be born only for the welfare of his country. When the Netherlands were trodden underfoot, distressed, and just on the brink of ruin, then heaven appointed you to relieve, to deliver them, and repel their calamities. The distressed republic flies for refuge to your bosom, being only sure to find an asylum there.

Your British subjects also, being almost ruined by the wicked designs of their kings, had long ago been chained, enslaved, and become the prey of lawless tyranny, had not your Majesty hastened to relieve them, while spreading out their suppliant hands towards you, nay, and to relieve them with that resolution, prudence and constancy, and with that success which their annals shall declare, to the amazement of posterity, who will hardly believe it. That expedition shall stand transmitted through ages, which was laid with incredible secrecy, notwithstanding so many piercing and watchful eyes, and undertaken with that resolution, in the winter and end of the year, amidst so many fearful dangers of a tempestuous ocean, did preserve and maintain to the queen of Islands, her liberty, her laws, her religion, and whatever is valuable and dear to generous breasts.

And is it to be wondered, that Britain, thus rescued under God, by your Majesty’s aid, now destitute of a ruler, her ill-advised king James being expelled, not by your Majesty, nor by the people of England, but by the stings of his own conscience; neither forced away, but voluntarily flying, should gratefully submit to her preserver and deliverer? Indeed to your Majesty, together with your most religious consort, Mary Augusta, by right of succession, the sceptre of the vacant kingdom devolved. And even in those circumstances, your Majesty had declined accepting it, though offered by both houses of parliament, had any besides yourself, and faithful consort, been found worthy to govern Britain, and capable to settle her distracted state, to maintain her liberty, and quash the efforts of envy. the pleasure and happiness of that station, but the thorns and difficulties thereof; neither your ambition, but the public necessity, constrained you to take the reins of government.</p></blockquote>

tain%2C+thus+rescued+under+God%2C+by+your+Majesty%E2%80%99s+aid%2C+now+destitute+of+a+ruler%2C+her+ill-advised+king+James+being+expelled%2C+not+by+your+Majesty%2C+nor+by+the+people+of+England%2C+but+by+the+stings+of+his+own+conscience%3B+neither+forced+away%2C+but+voluntarily+flying%2C+should+gratefully+submit+to+her+preserver+and+deliverer%3F+Indeed+to+your+Majesty%2C+together+with+your+most+religious+consort%2C+Mary+Augusta%2C+by+right+of+succession%2C+the+sceptre+of+the+vacant+kingdom+devolved.+And+even+in+those+circumstances%2C+your+Majesty+had+declined+accepting+it%2C+though+offered+by+both+houses+of+parliament%2C+had+any+besides+yourself%2C+and+faithful+consort%2C+been+found+worthy+to+govern+Britain%2C+and+capable+to+settle+her+distracted+state%2C+to+maintain+her+liberty%2C+and+quash+the+efforts+of+envy.+the+pleasure+and+happiness+of+that+station%2C+but+the+thorns+and+difficulties+thereof%3B+neither+your+ambition%2C+but+the+public+necessity%2C+constrained+you+to+take+the+reins+of+government.%E2%80%9D%0A%0A%E2%80%94+Dedication%2C+Letter+to+William+III+in+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank+%281677%3B+2+vols%2C+London%2C+1822%29%2C+i%2C+pp+12-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F311b6056a9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/311b6056a9.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/01/12/herman-witsius-on-king-william-iii-as-a-great-deliverer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>GLUTTONY in eating too much, – in eating without proper appetite, – in eating with too much greed or delight, – or in indulging improper inclinations towards delicacies, – is a most beastly vice, in which men live as if they were destitute of souls, – gradually murder their body, – stupefy their mind, – abuse their food, to the dishonour of God the bestower of it, – and rob the poor and their relations, of that which was laid out to gratify their lust.</p></blockquote>

</figure><figure class="quote" id="q-0adcdeda30" data-kw="">
<blockquote><p>God has appointed no lawful calling, such as trafficking by seas and frequent travelling ordinary to transient members of the visible Church, to be inconsistent with the lawful partaking of the ordinances of grace and seals of the Covenant; for only those who do not try and examine themselves and are profanely scandalous are excluded as swine from the holy things of God and from the Lord’s Supper, not men, because they are necessarily busied in a lawful calling and must ordinarily travel to far countries and so cannot be members of a single parish:

1. This is a physical impediment and not a sin, nor a moral impediment, excluding any from the seals of grace, yea and [such a prohibition is] an unwritten tradition.

2. I speak against that difference which the author makes betwixt the seals of grace in the Old Testament and the seals of grace in the New Testament, for there were physical and civil defects in the Old Testament which by a divine law made some incapable of the Passover, as if any were lepers, bastards, born Moabites and Ammonites or typically unclean, or had touched the dead, they could not eat the Passover though otherwise they did believe in Christ to come and were morally clean; but by the contrary under the New Testament there be no physical or ceremonial defects, no callings, no civil relations, but only moral defects and sinful scandals which do exclude men from the seals of grace, except you bring in ceremonies in the New Testament of your own devising for all nations, so they believe in Christ, Jew, or Gentile, Barbarian, or Scythian, bond or free, male or female, are to be baptized, Mt. 28:19; ‘God is no accepter of persons,’ or nations, or callings, Acts 10:34-35; compare this with verses 46-47 and Gal. 3:27, ‘For as many of you as have been baptized unto Christ, have put on Christ,’ v. 28, ‘There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female, for you are all one in Christ Jesus;’ so Gal. 6:15, ‘For in Christ Jesus neither circumcision avails any thing, nor uncircumcision, but a new creature.’ I must then say, it is boldness in men to say that there is a lawful calling in the New Testament which our Brethren are pleased to call ‘the strong hand of God’, which makes persons who are new creatures and baptized unto Christ uncapable of the seals of grace. Dear [congregationalist] Brethren, yield to the clear and evident truth of God.</p></blockquote>

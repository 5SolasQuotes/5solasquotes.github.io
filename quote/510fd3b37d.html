<blockquote><p>IV. The Nonconformists are not of one mind about receiving the Lord’s Supper kneeling. Many judge it lawful, though neither necessary nor most eligible were they free; some judge it also most eligible: and some judge it, as things stand, unlawful. Their reasons are: [Those who think it unlawful:]

      1. In doubtful cases duty lies on the surest side. But this to them is a doubtful case on one side, and to imitate Christ’s institution by such sitting as men use to do at meat is certainly lawful.

      2. Because they think this kneeling violates the reasons of the Second Commandment, being used where, by whole countries of Papists round about us and many among us, it signifies bread-worship or idolatry by the same action at the same season used. For they suppose that the Second Commandment forbids images as being external, corporal, idolatry and symbolizing scandalously with idolators, though the mind intend the worshiping of the true God alone. And such they think this kneeling is, and that it encourages the Papists (as is instanced in a story in the Life of Bishop Hall).

      3. Because they think that the tradition and custom of the catholic Church and the canons of the greatest general councils, not repealed by any other (as Nicea 1, can. 20 &amp; Can. Trull. etc.) are of stronger obligation than the canons of our convocation. And those canons, customs and tradition prohibit all adoration by genuflection on any Lord’s Day in the year and on any weekday else between Easter and Whitsuntide; and this custom continued 1,000 years as the tradition of the universal Church and was never repealed, but charged by degrees by contrary practice. They that think not that they are bound by these canons or customs at all, yet think that they are enough to nullify a contrary canon of a lower power; or, ad hominem, may excuse them. Yea the Constitutions called the Apostles seem to command all the people to receive the sacrament standing and to go for it, bk. 2, ch. 57. Having prescribed the order of worship (that after the old Scriptures read, they sing a psalm and then read the Acts and Epistles and the Gospels, and then that the presbyters one by one exhort the people first and the bishop last (for in those time every Church that had an altar had a bishop) he concludes: ‘Postea vero fiat sacrificium, cuncto populo Stante et silent•o precant•, et oblatione facta, quisque ordo sco• sim corpus Domini et preciosum sanguinem sumat, accedentes ordine cum pudore et reverentia ut ad corpus Regis. I•em mulieres operto capite, ut ordiaem earum decet, acc dant.’ That is: ‘After let the sacrifice be made, all the people standing and praying in silence: And the oblation being made, let every order apart take the body of Christ and his precious blood: Coming to it in order with modesty and reverence as to the body of the King. And let the women approach with covered heads as becomes their order.’ For such reasons as these set together, some nonconformists (lay and clergy) take this kneeling (while Papists about us by the same gesture adore the bread) to be unlawful, who yet profess as great reverence to Christ and the eucharist as any others. But other nonconformists say that they can answer all these arguments, but that they truly render the scruples of the dissenters tolerable, and the persons unmeet to be therefore excommunicated. 2. By the [Anglican] canon and rubric, no one of these dissenters must be admitted to the holy communion, Canon 27 says: ‘No minister when he celebrates the communion shall wittingly administer the same to any but to such as kneel, under pain of suspension.’ And the ministers covenant to use no form of administering the sacraments but according to the Liturgy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), section 8, pp. 150-52 Baxter’s actual opinion, it appears, was that doing such was lawful; see a section below.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08672052eb" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration. Uncovering the head seems to be little older than Paul’s epistles to the Corinthians. The learned [Claudius] Salmasius [d. 1653, a French reformed classical scholar], thinks it but a national sign of honor, no ways universally received: But certainly it is not adoration: Though therefore we [men] receive the Supper of the Lord uncovered, no man can conclude from thence adoration of the elements, as we do from kneeling [before the Supper] conclude the same, as we shall [conclude] here for all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly either of God, or of these means: It is lawful to tremble at the Word, and for Josiah to weep before the book of the Law read, and for the martyrs to kiss the stake, as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), pp. 89-90</span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-60e895d05e" data-kw="">
<blockquote><p>Paybody [a Formalist] thinks kneeling in the act of receiving the communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it; But I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with fear and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>

</figure><figure class="quote" id="q-da8e06a952" data-kw="">
<blockquote><p>As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished, they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first, being almost, if not quite forgotten by those that use them, and are become but as civil customs that have no state in religious worship, experience shows, that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it; but to exasperate rulers and make opposites more violent in their way.</p></blockquote>

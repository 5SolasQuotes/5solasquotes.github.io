<blockquote><p>First, a succession in the Church is necessary ordinarily; extraordinarily, and in cases of necessity it may be wanting… Occam [a Medieval Romanist] says laymen and teachers extraordinarily raised up may succeed to heretical pastors.</p></blockquote>

<blockquote><p>5. That it is not an office to be taken up on trial, and for a limited time (as servants are bound to their masters by the year); but as marriage, it is for life (unless God shall disable us), and as we say for better and for worse; and not to be laid by at pleasure. And therefore those Schoolmen that interpret the indelible character of the relation seem not to differ from us at all.</p></blockquote>

</figure><figure class="quote" id="q-df862fb2e2" data-kw="">
<blockquote><p>There are but three senses of the word “prophesying,” which I can find anywhere else in the New Testament: 1. For such prophesying as is competent to all converted and gifted persons, when they are filled with a spirit of illumination and speak with other tongues as the Spirit gives them utterance: In which sense Joel foretold that daughters as well as sons, handmaids as well as men-servants, young and old should prophesy, Acts 2:17-18, which was accordingly fulfilled upon the day of Pentecost, for Acts 1:14 and 2:1, 4, this Spirit of prophesy was poured out upon all the disciples, men and women. 2. For such prophesying as is [materially] the preaching of ordinary ministers, although I know no text where without any controversy the word is used for the ordinary ministerial preaching; Yet I understand the word to be used in this sense (though by allusion only, whereof before), Rev. 11:3, ‘And I will give power unto my two witnesses and they shall prophesy a thousand two hundred and threescore days clothed in sackcloth.’ 3. For extraordinary prophesying from immediate and miraculous inspiration, in which sense it is often used in the New Testament, as I shall show anone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 5, “Whether these prophets and prophesyings in the primitive Church, 1 Cor. 14 and 1 Cor. 12:28; Eph. 4:11, were extraordinary, and so not to continue: Or whether they are precedents for the preaching or prophesying of such as are neither ordained ministers nor probationers for the ministry” in A Treatise of Miscellany Questions (Edinburgh, 1649), pp. 64-85, pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

+for+the+preaching+or+prophesying+of+such+as+are+neither+ordained+ministers+nor+probationers+for+the+ministry%E2%80%9D+in+A+Treatise+of+Miscellany+Questions+%28Edinburgh%2C+1649%29%2C+pp.+64-85%2C+pp.+70-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf862fb2e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df862fb2e2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-biblical-prophecy-as-including-expositing-the-scriptures/#:~:text=There%20are%20but%20three%20senses%20of,Testament%2C%20as%20I%20shall%20show%20anone&amp;text=There%20are%20but%20three%20senses%20of%20the%20word&amp;text=the%20New%20Testament%2C%20as%20I%20shall%20show%20anone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-686d4d1762" data-kw="">
<blockquote><p>…in the form of ordination, when the words and many circumstances are undetermined. Imposition of hands is a Iawful sign: and so is doing it by a writing, or by mere words, without that imposition; some receive it kneeling, some standing; some by one form of words, some by another, etc. some from one ordainer some from many, etc. And none of these determined by institution.</p></blockquote>

</figure><figure class="quote" id="q-a860c4a2df" data-kw="">
<blockquote><p>We are all naturally inclined to lean upon man whom we can see, rather than upon God whom we cannot see. We naturally love to lean upon the ministers of the visible Church, rather than upon the Lord Jesus Christ, the great Shepherd and High Priest, who is invisible. We need to be continually warned and set on our guard. I see this tendency to lean on man everywhere. I know no branch of the Protestant Church of Christ which does not require to be cautioned upon the point…. We all naturally love to have a pope of our own. We are far too ready to think, that because some great minister or some learned man says a thing, or because our own minister, whom we love, says a thing—that it must be right, without examining whether it is in Scripture or not. Most men dislike the trouble of thinking for themselves. They like following a leader. They are like sheep, when one goes over the hill all the rest follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning to the Churches, ‘The Fallibility of Ministers’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

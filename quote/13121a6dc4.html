<main class="wrap"><figure class="quote" id="q-13121a6dc4" data-kw="">
<blockquote><p>The special engagements which are upon us all, to lay all these things with sorrow to our hearts. Beloved! we are Christians (let others think of us as they please) we are covenanting Christians, (let others deride this as they list) and we are, or should be penitent Christians (let others be what they please) now.

Consider us as Christians, we take our selves to be the children of the true and living God, and professor our selves to be the members of Jesus Christ; The faith of Christ is delivered unto us: we are intrusted with it, we are responsible for it: we are to be zealous for it. How then can we suffer our God, our Christ, our faith, to be thus dishonourably injured and abused, and not be troubled at all!

Consider us as covenanting Christians: so we have every one of us bound our souls to God, (can any mortal creature here release us?) we have lifted up our hands to the most high God (in our several places) to extirpate heresies and false doctrines.

Yea, consider us as penitent Christians: fasting Christians should be so, they should be mourning Christians: And Christians who penitentially mourn, will mourn for the sins of others, as well as for their own sins. And they will mourn most, when God is dishonoured most: and can God be more dishonoured, then by blasphemies and damnable heresies? Put all these together, and then consider whether these sins of heresies and blasphemies should not wound our souls with grief, which have wounded our God with so much dishonour?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The nature and danger of heresies: opened in a sermon before the Honourable House of Commons, January 27. 1646. at Margaret’s Westminster, being the day of their solemn monthly fast</cite>, (London: Samuel Gellibrand, 1647), pp 34-35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e600bb499b" data-kw="">
<blockquote><p>Concerning Musical Organs It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolized the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed, he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical Masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal chronicles attribute its introduction to Pope Vitalian [†672]. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore, they do wrong that mumble foolishly before God the canonical hours as if superstitiously chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-confessio-catholica.html">Hungarian Confessio Catholica</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hungarian Confessio Catholica</cite>, 1562 | ed. Dennison, Jr., Reformed Confessions of the 16th and 17th Centuries in English Translation (RHB), vol. 2, pp. 565-66</span></figcaption>

</figure><figure class="quote" id="q-d6b1585704" data-kw="">
<blockquote><p>But you tell us, why we do so much avoid the Fathers.” I had rather you would tell us why you do so carefully avoid the Scriptures. “For” (say you) “they that cannot away with set times of Fasting, must needs be offended with Basil, Nazianzen, Leo, and Chrysostom, which have published excellent Sermons of Lent.” Christ ordained no set and ordinary fasts in the Gospel, Lent was appointed long after, and the manner of observing it in those times, was not one and the same in all Churches. We both allow and use public and Christian fasts which are fitted to the time and the Churches’ occasions: as for your appointed, and yearly solemn fasts, we do with good reason reject them, because they are full of superstition, and injurious unto Christian liberty. Our judgement of fasting is the same which Augustine hath taught: I find it not set down in any Commandment of the Lord, or his Apostles, what days we ought to fast, what not. Augustine then knew not these your set yearly ceremonies of fasting, nor your Lenten fast, which hath a certain time and number of days prescribed.</p></blockquote>

<blockquote><p>(2) There is dignitas convenientiae [worthiness of fitness], which consists, though not in a perfect and exact proportion, yet in some fitness and meetness unto that which is required. Thus, in scripture, are we commanded ‘to walk worthy of the Lord,’ worthy of our profession, worthy of the gospel… And thus must we come worthily: that is, so fitted and prepared as may bear some resemblance and agreement to the solemnity of the work that we go about. And in this sense, this worthiness follows that worthiness which is called by divines dignitas dignationis — ‘a worth of acceptance’, or a desiring of God to take our actions in good part for Christ’s sake, and to pardon the many failings that accompany them.</p></blockquote>

<blockquote><p>Q. Is it unlawful to make an image of the Trinity, or of any Person in the Godhead? It is utterly unlawful, and a great dishonor to figure the incorruptible God by the shape of a base and corruptible man or bird, or other creature. Dt. 4:15-18; Rom. 1:23; Acts 17:24, 29; Isa. 40:15, 18-19; Hab. 2:8. It abuses our understandings: the party thinks there is some good in an image, else he would not make it; and that’s a lie: He lies that shows me a toad and says it is the picture of an angel; so, etc. All the pictures of Christ in the flesh, as that on Christ on the cross and resurrection are lies, false in their representations and false in the conceit of any good by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Principle[s] of Faith &amp; Good Conscience Digested into a Catechetical Form</cite>, … (Oxford: Hall, 1665), ch. 30, pp. 132-33</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5b465ec368" data-kw="">
<blockquote><p>Thesis 1… For, as Augustine himself testifies [about original sin] in On the Morals of the Church, “nothing is more known for preaching, nothing more secret for understanding, than original sin.” And how difficult this doctrine of original sin is, the most learned of English theologians warns in bk. 1, On Original Sin, when he says: ‘how it was propagated from Adam to posterity should be believed rather than inquired into; and it can be inquired into more easily than it can be understood; and it is better understood than it is explained.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christoph-luthard.html">Christoph Luthard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Original Sin</cite>, (Bern: Fabricius, 1637), p. 2 Lüthardt (1590-1663) was a Swiss reformed professor of philosophy and theology at Bern.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-429a546bdb" data-kw="Original Sin Mortification Forgiveness">
<blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 6.5</span></figcaption>

</figure><figure class="quote" id="q-3ce8507d36" data-kw="">
<blockquote><p>Adam while he lived committed many sins, yet I think that only that first sin of Adam was imputed to his posterity, because only by this sin he violated that covenant which was made with him, as with the author of mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1620), pp. 57-73 | 9. ‘How the sin of Adam may belong to his posterity, and how many ways it may pass to his offspring. First of the imputation, and whether the sins of the grandfather, and great-grandfathers are imputed to their posterity’, p. 61</span></figcaption>

</figure><figure class="quote" id="q-21e37df4ec" data-kw="">
<blockquote><p>…by reason of original sin it is, that a natural man cannot perform anything in a gracious manner, to wit, for want [lack] of the love of God: Original sin being an habitual aversion from God and conversion unto the creature, or more briefly an inordinate conversing with the creature, either in enjoying it, whereas he should only use it, God alone being to be enjoyed; or in using it, but not in a gracious manner, that is, not for God;s sake; to wit, through want of the love of God, which is brought upon us by the sin of Adam, as whereby our natures were bereaved of the Spirit of God. Thus in prosecuting mine answer unto a devised argument, I have made bold to open my mind concerning original sin: A point that has seemed unto me of such difficulty that I have been wont to range it amongst those three [things] whereabouts I could not expect to be satisfied whilst I lived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646), 3rd Doubt, p. 148</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><figure class="quote" id="q-7c2b4a999d" data-kw="Original Sin Depravity Author of sin">
<blockquote><p>In order to account for a sinful corruption of nature, yea, a total native depravity of the heart of man, there is not the least need of supposing any evil quality, infused, implanted, or wrought into the nature of man, by any positive cause, or influence whatsoever, either from God, or the creature; or of supposing, that man is conceived and born with a fountain of evil in his heart, such as is any thing properly positive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 4, ch. 2</span></figcaption>

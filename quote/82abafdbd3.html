<main class="wrap"><figure class="quote" id="q-82abafdbd3" data-kw="">
<blockquote><p>The Sacraments they are the crucifixes of Christ, in which Christ is represented as crucified afresh before our eyes: the bread broken doth preach unto us the breaking of Christ: The wine powered forth doth preach unto us the Blood of Christ poured forth for our sins. And who is it that can with the eye of faith, look upon a broken Christ, but with a broken heart? a wounded Christ, but with a wounded spirit? a bleeding Christ but with a bleeding soul? God hath made in nature the same organ for seeing and weeping: And in grace he who sees clearly, weeps thoroughly, Lam. 3.5. The eye will affect the heart. The Passover under the Law was to be eaten with bitter herbs: So Christ, the true Passover, is here to be eaten with bitterness of soul: as it was prophesied; They shall look on him whom they have pierced, and shall lament, and mourn; first seeing, and then weeping, &amp;c. Zach. 12.10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 78-79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-0f2836f600" data-kw="">
<blockquote><p>For since false teachers and heretics in regard of the spiritualness of their sin are the worst of evil doers, and such as work abomination in the Israel of God, and there is no particular laws in the New Testament for bodily coercing of Sorcerers, Adulterers, Thieves, Traitors, false witnesses, who but speak lies against the good name of their neighbour, not against the name of God, nor against Sodomites, defilers of their bodies with beasts, perjured persons, Covenant breakers, liars &amp;.c. What reason in nature can there be to punish the one, and not the other? for it may with as good colour of reason be said, that all the Laws in the old Testament, for drawing of the sword against Sodomites, Adulterers and such like, were typical and temporary, and are done away now in Christ, for Christ will have these converted in as spiritual a way by the only power of the word of God as the other and no where in any express law in the New Testament doth God command to use the bloody sword against them, more than against blasphemers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A free disputation against pretended liberty of conscience</cite>, (London, 1649), pp 57-8.</span></figcaption>

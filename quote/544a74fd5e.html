<main class="wrap"><figure class="quote" id="q-544a74fd5e" data-kw="">
<blockquote><p>Fourth, when I say that we cannot get from the world to God except via premises derived from philosophy of nature, I have a quite specific conception of God in mind. I do not deny that conclusions of a sort that might in some sense of the term be called “theological” might be derived from natural science. But I do deny that arguments grounded in natural science alone can get you to classical theism—the conception of God defended by Athanasius and Augustine, Avicenna and Maimonides, Anselm and Aquinas… If anything, they have a tendency to lead you away from the God of classical theism. You might get to a demiurge, to a being of superhuman intelligence and power, with arguments grounded in physics, chemistry, or biology. What you cannot get to is that which is ipsum esse subsistens [subsisting existence itself] rather than merely a being among other beings; to a sustaining cause on whom the very being of the world depends at every instant; or to that which is absolutely simple or in no way composed of parts, whether physical or metaphysical. One implication of this is that “design arguments” of the sort associated with William Paley [early-1700’s] and contemporary “Intelligent Design” theory are at best irrelevant to natural theology (as that discipline is understood in the classical theist tradition), and at worst threaten seriously to distort our understanding of God and His relationship to the world (again, at least from the point of view of classical theism).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015) | 4. Natural Theology Must Be Grounded in the Philosophy of Nature, Not in Natural Science 61, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>What are the outward things which God has given to call us by? They are either common to the whole world, or proper to the Church. What are the things common to the whole world? God’s works not unprofitably given, although not sufficient to salvation. Is not the knowledge of the wisdom, power and goodness of God in the creation and government of the heaven and earth, with the things that are in them, sufficient to make us wise to salvation? No: First, it serves rather for further condemnation without the Word, Rom. 1:19-21. Secondly, as by and with the Word, the due meditation and consideration of God’s works is a good help to further us in religion and in the graces of God’s Spirit, 1 Cor. 1:21-22.</p></blockquote>

<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>

</figure><figure class="quote" id="q-8394b46f2c" data-kw="insufficient">
<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation.</p></blockquote>

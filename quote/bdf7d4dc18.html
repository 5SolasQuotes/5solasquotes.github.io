<main class="wrap"><figure class="quote" id="q-bdf7d4dc18" data-kw="">
<blockquote><p>For as concerning binding and constraint, the strangers which dwelled among the Jews were not constrained either unto all ceremonies, or religion, but unto the outward discipline, the which was necessary for the avoiding of offences of the Church, in which they lived: for the magistrate ought to be the keeper of discipline, according unto both tables of the Decalogue, or ten commandments, amongst his subjects, both to forbid manifest idolatry and blasphemies: and also concerning foreigners &amp; strangers, so far as he may, to take heed that open offences be not given unto his subjects.

Furthermore, as touching binding there was an especial consideration of the Sabbath, the which was not at length by Moses, but even from the beginning of the world, commanded unto all men by God, and therefore bound all men unto the coming of the Messias, albeit that this commandment was so far grown out of use among them, that it was reckoned among the chief reproaches, wherewithal they mocked and taunted the Jews.

But this ceremony was no Sacrament unto the Infidels, because that neither this promise appertained unto them, that the Lord would be the sanctifier of them, neither were they constrained to cease from their ordinary works for the testifying or professing of this promise, but only to avoid offence and occasion of sinning, which by them might be given unto the people of GOD: for so Nehem. 10. The people promise by oath, that on the Sabbath and holy days, they would not receive any thing of the people of the land, the which brought merchandise or victual to sell on the Sabbath day. And Chap. 13. Nehemias by shutting the gates and garrison of soldiers, keepeth the Tyrians dwelling at Jerusalem, and bringing in wares to be sold on the Sabbath, from coming that day into the City, least occasion might be given unto the Jews to break the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A very profitable and necessary discourse concerning the observation and keeping of the Sabbath day serving as well to confute the superstition of the Jews, which obstinately urge the strict keeping of the seventh day, as also to overthrow the vain and godless reasons of others, that stiffly at this</cite>, trans. John Stockwood (London: John Harrison, 1584), unpaginated.</span></figcaption>

<blockquote><p>Q. 37. Why is mention here made of all within our gates?

A. To show that this commandment is not only directed to private persons, but to magistrates, and masters of families as such, who, though they cannot compel men to believe, they may restrain them from violating the rest of the sabbath, and compel them to such external worship of God as all men are immediately obliged to; even all within the gates of their cities or houses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 131.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-38f6b9ca32" data-kw="">
<blockquote><p>Divine revelation takes the dictates of sound reason for granted, and refers to them in such terms of approbation as impose it upon us as a duty to be guided by them in those cases as to which the scriptures are silent, or have merely laid down general rules.

The rites of Christian worship are of divine institution, but there are various external circumstances connected with their observance which are left to the regulation of human prudence exercised with a proper regard to decency and edification; such as the times of assembling, the order in which the several parts of worship shall be celebrated, and the length of the services.

The range of this class of objects is still more extensive in relation to the government and discipline of the church, as to which Divine wisdom saw it fit to be less minute and precise in its prescriptions. Every society, and consequently the church of Christ, the most perfect of societies, must have external bonds of union, rules of management, and, in short, all those means which are necessary to her preservation, or conducive to the ends of her erection.

The essential principles of jurisprudence, which are founded on natural laws, are common to civil and ecclesiastical society; and they dictate the observance of certain forms of process as safeguards to justice, and means of eliciting truth in dubious or controverted cases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Judgment. Delivered at the opening of the Synod of Original Seceders, Edinburgh, September, 1829 in Sermons</cite></span></figcaption>

9ca32.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/31/thomas-mccrie-on-sound-reason-the-circumstances-of-worship-church-government-and-jurisprudence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0c167cbccd" data-kw="">
<blockquote><p>Truth is opposed to a ceremony and shadow. The ceremonies of old were shadows, or the external body of religion, in which the soul and spirit of godliness should have been enclosed, but the Lord did always urge more earnestly the substance and truth than the ceremony, the weightier matters of the Law, piety, equity, and sobriety, than these lighter external ceremonies: He sets an higher account upon mercy than sacrifice, and upon obedience than ceremonies; But this people turned just contrary; they summed up all their religion in some ceremonial performance, and separated those things God had so nearly conjoined; they would be devout men in offering sacrifices in their washings in their rites, and yet made no conscience of heart and soul-piety toward God, and upright just dealing with men: Therefore the Lord so often quarrels them and rejects all their service as being a device and invention of their own which never entered in his heart, Isa. 1, from 10 to 16; Jer. 7 throughout; Isa. 66 to 6; Isa. 28. Now if you will examine it impartially it is even just so with us, there are some external things in religion which in comparison with the weightier things of faith, and obedience are but ceremonial; in these you place the most part, if not all your religion, and think yourselves good Christians if you be baptized and hear the Word, and partake of the Lord’s table and such like, though in the mean time you be not given to secret prayer and reading, and do not inwardly judge and examine yourselves, that you may flee unto a Mediator, though your conversation be unjust and scandalous among men; I say unto such souls, as the Lord to the Jews, Who hath required this at your hands? who commanded you to hear the Word, to be baptized, to wait on publick ordinances? Away with all this, it is abomination to his Majesty; though it please you never so well, the more it displeases Him; If you say, why commands He us to hear? etc. I say the Lord never commanded these external ordinances for the sum of true religion; that was not the great thing which was in his heart that He had most pleasure unto, but the weightier matters of the Law, piety, equity and sobriety, a holy and godly conversation adorning the Gospel: ‘What hath the Lord required of thee, but this, O man, To do justly, and walk humbly with thy God?’ So then thou dost not worship him in truth, but in shadow; the truth is holiness and righteousness; that external profession is but a ceremony; while you separate these external ordinances from these weighty duties of piety and justice, that they are but as dead body without a soul. If the Lord required truth of old, much more now, when He has abolished the multitude of ceremonies that the great things of his Law may be more seen and loved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of Christian Religion</cite>, … ([Glasgow] 1666 / 1667), 2nd Sermon on Jn. 4:24, pp. 134-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Here it may be considered whether every adjunct of worship instituted of God does by that institution become a matter or part of worship, which otherwise it would not be. Some say that in the old Law the least ceremony prescribed of God was a part of worship, which assertion I do not now so far examine as to declare my assent or dissent. But if it were so, I think it was not merely as prescribed of God, but upon some further reason. For I do not see that God cannot prescribe a mere adjunct of worship, but it must thereby lose its formal state, or become formally another thing, viz. a matter of worship, but think it may remain in its own state, a mere adjunct still. Nevertheless, the observation of that divinely prescribed adjunct may be an act of worship so far as every act of obedience to God as such may be so called. But here we speak of worship, not in so large, but in the stricter sense.</p></blockquote>

<blockquote><p>The Spirit. Esa. 11.2. The Spirit with all the gifts thereof are upon him; is sent and given by God the Father, and abide in Christ. Yet it is said upon him because the Spirit came down from heaven and did visibly rest on him. On me, I, that is on my Humanity. Math. 3.16. So that these words signify thus much. The gifts of the Holy Ghost, proceeding from God my Father, doth reside and dwell in this my Humanity, which ye see; by which gifts, I am sanctified to this Office of Reconciliation.

[Object.] But it may be said, what Excellency hath Christ by this, above others; for the Prophet Esay affirms the like of him, and so may other Holy men, that they have the Spirit.

[Answ.] To this, answer is, That that of Esay is chiefly to be understood of Christ, and not of himself; and with great difference the Spirit doth reside in Christ and in others. And this difference appears in two things.

First, in the Universality of the gifts in Christ. Second, in the Perfection of gifts. As touching the first God did not bestow one or two, or more gifts on the Humanity of Christ, but he powered them out most plentifully on him. John 3.34, 35. Col. 2.3.9. It pleased the Father, that all fullness should dwell in him: all gifts are not given to one, but to every member, as much as seems good to the Spirit of God. 1 Cor. 12.11. For as the head is the common receptacle of all the senses, and doth exercise their faculties, when as yet, every Sense hath it distinct Office; In the execution whereof, they are employed. [Simile.] So our head Christ, is most fully furnished with all necessary gifts, to the animating of his body, when as yet the members of his body have their several functions and parts, in which all their faculty or ability is circumscribed.

For the second, all the gifts of Christ were most perfect in him, perfect Wisdom, Knowledge, Justice, Holiness; not inchoate, but in their perfect maturity. There was no defect of any gift, or in any; but all were ministered unto, absolute in all parts and degrees, to the full perfection of his Humanity; and this not only from some time of his Age, but from his first Conception. Luke 1.35. To his Resurrection and Ascension. 2 Cor. 5.21.

Now the gifts, given to the Saints, are only the first fruits, a handful and as earnest-pence. 1 Cor. 13.12. We know but in part, we Love but in part. So that we may easily see, how far the dwelling of the Spirit in holy men, differs from the manner of the same in Christ. In the one without measure, in the other in measure. In Christ full, in us in part; in him Primarily, In us, Secondarily. So that as great difference as there is twixt the spring, and the stream flowing thence. Twixt the light of the Moon and stars, and the Sun. [Simile.] The one being borrowed and imperfect, the other being original, and always equal. So great difference is there twixt Christ and his Saints in regard of gifts. And indeed, this plenitude of gifts, is one of the peculiar Prerogatives, which the Humanity of Christ hath received by the Hypostatical union; neither can they be found in any other person, who is not God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brightman.html">Thomas Brightman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security</cite>, (London: John Rothwell, 1647), pp 46-47.</span></figcaption>

<blockquote><p>For the letter (i.e. the law) killeth, but the spirit (i.e. the gospel) giveth life. This is the reason why God hath made Paul the minister of the spirit. ‘God had made us able ministers not of the law but of the gospel, for the law kills, but the gospel gives life.’ This passage and the following context present two important questions. First, in what sense does the law kill? And second, How is it that the apostle attributes to the Mosaic system this purely legal character, when he elsewhere so plainly teaches that the gospel was witnessed or taught both in the law and the prophets? As to the former of these questions, the answer furnished by the Scriptures is plain. The law demands perfect obedience. It says, “Do this and live,” Rom. 10:5; Gal. 3:12, and “Cursed is every one who continueth not in all things written in the book of the law to do them,” Gal. 3:10. As no man renders this perfect obedience, the law condemns him. It pronounces on him the sentence of death. This is one way in which it kills. In the second place, it produces the knowledge or consciousness of sin, and of course of guilt, that is, of just exposure to the wrath of God. Thus again it slays. And thirdly, by presenting the perfect standard of duty, which cannot be seen without awakening the sense of obligation to be conformed to it, while it imparts no disposition or power to obey, it exasperates the soul and thus again it brings forth fruit unto death. All these effects of the law are systematically presented by the apostle in the 6th and 7th chapters of his epistle to the Romans, and in the 3d chapter of the epistle to the Galatians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, (New York: A. C. Armstrong &amp; Son, 1891), 56.</span></figcaption>

</figure><figure class="quote" id="q-c9ff42a636" data-kw="">
<blockquote><p>At the same time, as he works not effectually in all, but only where the Spirit, the inward teacher, illuminates the heart, he subjoins, to every one who believes. The gospel is indeed offered to all for their salvation but the power of it appears not everywhere: and that it is the savor of death to the ungodly, does not proceed from what it is, but from their own wickedness. By setting forth but one salvation he cuts off every other trust. When men withdraw themselves from this one salvation, they find in the gospel a sure proof their own ruin. Since then the gospel invites all to partake of salvation without any difference, it is rightly called the doctrine of salvation: for Christ is there offered, whose peculiar office is to save that which was lost; and those who refuse to be saved by him, shall find him a judge. But everywhere in Scripture the word salvation is simply set in opposition to the word destruction: and hence we must observe, when it is mentioned, what the subject of the discourse is. Since then the gospel delivers from ruin and the curse of endless death, its salvation is eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, 1.16.</span></figcaption>

<blockquote><p>As generation (gennēsis) is ascribed to the Son, so procession (ekporeusis) is ascribed to the Holy Spirit—taking the word not only widely (as denoting “to have origin from some one”; for thus it can also be applied to the Son, to whom exodos and exeleusis is attributed, since he is said to have come forth from the Father [Jn. 16:28] and to have eternal goings-forth [Mic.</p></blockquote>

<blockquote><p>Assertion 3. The Person of the Holy Ghost is not united to the soul of a believer, nor are there two persons here united or made one Spirit by union of person with person; but the person is said to come to the saints, and to dwell with them, and to be in them, Jn. 14:16-17, and God has sent the Spirit of his Son in our hearts, crying ‘Abba Father,’ not that the Holy Ghost, in propper Person, does in us formally and immediately believe, pray, love, repent, etc. we being mere patients in understanding, will, affections, memory, as Libertines teach. But the Holy Ghost comes to the saints and dwelles in them, in the spiritual gifts and saving graces, and supernatural qualities created in us by the Holy Spirit and acted, excited and moved as supernatural and heavenly habits to act with the vital influence of our understanding, will, and affections. I prove the former part:

1. Because such a union of the Person of the Holy Ghost in us, believing, loving, joying, praying and immediately in us, were that blasphemous deifying and Goding of the saints, so as believing, loving, praying were not our works, but the immediate acts of the Holy Ghost, and either the faint manner of believing, or the cold slacked loving, and praying of saints, or their not believing, and sinfull omission of the acts of faith, love, praying rejoicing, could not be more imputed to saints, as their sinful defects and transgressions (but must be laid on the Holy Ghost’s score) than we can impute the splitting of a ship to the ship itself and not to the negligent and willfull pilot who of purpose dashed the vessell on a rock; but we must not in reason blame the ship, but the pilot; for the loss of the ship is the only and proper fault of the man that stirred the ship, and the ship is innocent and harmless timber: Now what sin can be in the saints in these supernaturall acts, if the Holy Ghost immediately in his own Person stir the helm, and only, without us, act these in us? We might with as good reason say the shop that a man works in does make the portrait, which is a great untruth, since the artificer in the shop does it▪ as say that the saints do pray, believe, rejoice, if the Holy Ghost immediately do all these in them, as in a shop.

2. Upon the same ground the Lord’s coming down and filling John Baptist from his mother’s womb, and the apostles and Steven full of the Holy Ghost, should be the Holy Ghost’s personal filling of them, and his immediate acting in them, without any action of them in preaching, praying, and their heavenly bold confessing of Christ before men; and there should be no difference between the ark and temple of Jerusalem, filled with the immediate presence of God, in the Lord’s manifestation of his glory there, and these saints filled with God, in these works of free grace. I shall not believe that the person of God can be said to be united to either ark, temple, apostle or martyr; all the union is in the effects and manifestations of graces, or tokens of divine presence, which are creatures rising and falling with time.

3. That excellent and living ark, the most glorious and admirable thing that heaven has, the Lord Jesus, is God and man, two naturee united in one person. But both the Word of God making that He▪ that same Holy thing, born of the virgin Mary, the Son of God, Lk. 1:5, and that same He, and Person who came of the Jews, according to the flesh, to be God blessed forever, Rom. 9:5; Heb. 7:3; Mt. 16:13, 16, and the third general council, called that of Ephesus, and after the council of Chalcedon, ver. 4 and 5, do evidence to us that Christ cannot be two persons as Nestorius dreamed, and one person. Paul spread the Gospel from Jerusalem to Iliricum, about ten hundred miles. I know not he, but the grace of God that was with him, 1 Cor. 15:9-10, not he, but the Lord: True, but the question now is whether Paul and the Holy Ghost in all these works of grace, were two persons become one Spirit by union, as some dreamers affirm; because both did the work; I believe not: God and cloud rained down manna to Israel; O but Christ’s Father, Jn. 6, gave the manna, but the question is if the person of God were united with the clouds or any second causes producing manna; so the Lord ‘makes rich and poor, kills and makes alive, makes snow, frost, fair weather,’ drought and rain, the sun to rise, and go down, and that in his own person, Father, Son, and Spirit; He, He only made heaven, earth, sea, and all creatures, and the world; [Greek] Acts 17:25 and [Hebrew] Ps. 33:9, do prove Him to be a person who does all these. But we cannot say that the person of God must be united with clouds, ship, sea, sun, heavens, men fighting and men saving and killing; and that God personally fills all creatures, only God in the immensity of his nature, is all these and everywhere, and is in them by his operation; so the Holy Ghost is with the saints and dwells in 〈◊〉, not by union of his Person to them or the immensity of his essence, which is, as David says, everywhere, Ps. 139:7… But He dwells in the saints, in regard of the works, operations, gifts and graces of the Holy Ghost.

1. Because the Holy Spirit is in them, in that they have in them the fruits of the Spirit, Gal. 5.22, such as love, joy, peace, long-suffering, gentleness, goodness, faith; now these are not the Holy Ghost, who is eternal and God uncreated, but are created in time, out of mere nothing, not out of the potency of the subject, but ere God produce grace, so knotty and so rocky are we, and so contrary to grace, that he must fall upon a new and second creation, Eph. 2:10; Col. 2:10; Ps. 51:10, the same word that is used for creating heaven and earth, Gen. 1.•. is here used; it is not like the repairing of a fallen house, where the same timber and stones may do the work, or the repairing of decayed nature, when a healthy body recovers out of a fever; Grace is a rare and curious workmanship.

2. We are said to grow in grace, 2 Pet. 3.18, and by grace to increase to the edifying of the body in love, Eph. 4:16, and to the measure of the stature of the fullnesse of Christ, 13, and to add grace to grace, 2 Pet. 1:5-7, and to go on to perfection, Heb. 6:1; Phil. 3:12. But the person of the Holy Ghost, is not capable of growing, or addition, nor like the morning light, or the new moone, that can grow and advance in perfection, being God blessed forever.

3. If there be a union of the Person of the Holy Ghost with the soul, and not an indwelling by graces, the believer as a believer must live by the uncreated and eternall life of the Holy Ghost, or a created life. Creatum vel increatum dividunt omne ens immediate, sicut finitum et infinitum: Not the former, neither any man, nor the man-Christ can in any capacity be elevated so above itself as to partake of the infinite life of God; how the manhood of Christ partakes of the personal subsistence of the Godhead is incomprehensible to me, except that it is not by such a union as my singular nature stands under personality created, and [it] is by assumption rather than union; however, if there be a union of the Person of the Holy Ghost to our souls, it cannot be conceived, nor does Scripture speak of it; if the saints live the life of God, it must be by created graces, and this is that [which] we conceive.

4. The person of the Holy Ghost immediately acting in the saints, without them or any active and vital influence of the natural faculties, cannot be guilty of sin, because David and Christ are absolved of sin in this: ‘They laid to my charge things that I knew not,’ that is, things I never acted, crimes in which I had no action or hand: but we are blamed in the Word for all the omissions of holy duties; and the Holy Ghost cannot be blamed, for He blows when and where He lists, and is under no Law in his motions of free grace; then he who cannot be blamed in not acting, cannot be united as one spirit, person with person, with him who is justly to be blamed in not acting. Assertion 4: It must evidently follow that there is in the saints a grace created that is neither Christ, nor the Holy Ghost in person; for what reason any has to fancy an union of the person of Christ or the Holy Ghost in the saints [as one person], the same reason have they to say that all the three are united to the person of the believer in all supernatural actions, for the Father is said to draw men to the Son, John 6:44, and Christ to reveal the Father, and to draw men, John 1:18; John 12:32 and the Holy Ghost to reveal the deep things of God, 1 Cor. 2:10-11, now all the three in person do these, but all the three persons are not united to believers in person; this were a mystery greater then God manifested in the flesh, and unknown to Scripture.

2. If Christ be all the grace of believers, faith in Christ and the love of Christ should be Christ.

3. Then should a believer having a new heart, and a new Spirit, be Christed, or Godded; and God should be incarnate in every believer, and how many Christ’s should there be? and the new heart in one saint, and the grace given to Paul, should be the new heart given to Peter, whereas God has given grace to every man according to his measure, and there are diversity of gifts, but one Spirit, 2 Pet. 3:15; Phil. 1:9; Eph. 3:3-5; 1 Cor..12.3-6; Eph. 4:16.</p></blockquote>

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself, … (London, 1647), pp. 464-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAssertion+3.+The+Person+of+the+Holy+Ghost+is+not+united+to+the+soul+of+a+believer%2C+nor+are+there+two+persons+here+united+or+made+one+Spirit+by+union+of+person+with+person%3B+but+the+person+is+said+to+come+to+the+saints%2C+and+to+dwell+with+them%2C+and+to+be+in+them%2C+Jn.+14%3A16-17%2C+and+God+has+sent+the+Spirit+of+his+Son+in+our+hearts%2C+crying+%E2%80%98Abba+Father%2C%E2%80%99+not+that+the+Holy+Ghost%2C+in+propper+Person%2C+does+in+us+formally+and+immediately+believe%2C+pray%2C+love%2C+repent%2C+etc.+we+being+mere+patients+in+understanding%2C+will%2C+affections%2C+memory%2C+as+Libertines+teach.+But+the+Holy+Ghost+comes+to+the+saints+and+dwelles+in+them%2C+in+the+spiritual+gifts+and+saving+graces%2C+and+supernatural+qualities+created+in+us+by+the+Holy+Spirit+and+acted%2C+excited+and+moved+as+supernatural+and+heavenly+habits+to+act+with+the+vital+influence+of+our+understanding%2C+will%2C+and+affections.+I+prove+the+former+part%3A+1.+Because+such+a+union+of+the+Person+of+the+Holy+Ghost+in+us%2C+believing%2C+loving%2C+joying%2C+praying+and+immediately+in+us%2C+were+that+blasphemous+deifying+and+Goding+of+the+saints%2C+so+as+believing%2C+loving%2C+praying+were+not+our+works%2C+but+the+immediate+acts+of+the+Holy+Ghost%2C+and+either+the+faint+manner+of+believing%2C+or+the+cold+slacked+loving%2C+and+praying+of+saints%2C+or+their+not+believing%2C+and+sinfull+omission+of+the+acts+of+faith%2C+love%2C+praying+rejoicing%2C+could+not+be+more+imputed+to+saints%2C+as+their+sinful+defects+and+transgressions+%28but+must+be+laid+on+the+Holy+Ghost%E2%80%99s+score%29+than+we+can+impute+the+splitting+of+a+ship+to+the+ship+itself+and+not+to+the+negligent+and+willfull+pilot+who+of+purpose+dashed+the+vessell+on+a+rock%3B+but+we+must+not+in+reason+blame+the+ship%2C+but+the+pilot%3B+for+the+loss+of+the+ship+is+the+only+and+proper+fault+of+the+man+that+stirred+the+ship%2C+and+the+ship+is+innocent+and+harmless+timber%3A+Now+what+sin+can+be+in+the+saints+in+these+supernaturall+acts%2C+if+the+Holy+Ghost+immediately+in+his+own+Person+stir+the+helm%2C+and+only%2C+without+us%2C+act+these+in+us%3F+We+might+with+as+good+reason+say+the+shop+that+a+man+works+in+does+make+the+portrait%2C+which+is+a+great+untruth%2C+since+the+artificer+in+the+shop+does+it%E2%96%AA+as+say+that+the+saints+do+pray%2C+believe%2C+rejoice%2C+if+the+Holy+Ghost+immediately+do+all+these+in+them%2C+as+in+a+shop.+2.+Upon+the+same+ground+the+Lord%E2%80%99s+coming+down+and+filling+John+Baptist+from+his+mother%E2%80%99s+womb%2C+and+the+apostles+and+Steven+full+of+the+Holy+Ghost%2C+should+be+the+Holy+Ghost%E2%80%99s+personal+filling+of+them%2C+and+his+immediate+acting+in+them%2C+without+any+action+of+them+in+preaching%2C+praying%2C+and+their+heavenly+bold+confessing+of+Christ+before+men%3B+and+there+should+be+no+difference+between+the+ark+and+temple+of+Jerusalem%2C+filled+with+the+immediate+presence+of+God%2C+in+the+Lord%E2%80%99s+manifestation+of+his+glory+there%2C+and+these+saints+filled+with+God%2C+in+these+works+of+free+grace.+I+shall+not+believe+that+the+person+of+God+can+be+said+to+be+united+to+either+ark%2C+temple%2C+apostle+or+martyr%3B+all+the+union+is+in+the+effects+and+manifestations+of+graces%2C+or+tokens+of+divine+presence%2C+which+are+creatures+rising+and+falling+with+time.+3.+That+excellent+and+living+ark%2C+the+most+glorious+and+admirable+thing+that+heaven+has%2C+the+Lord+Jesus%2C+is+God+and+man%2C+two+naturee+united+in+one+person.+But+both+the+Word+of+God+making+that+He%E2%96%AA+that+same+Holy+thing%2C+born+of+the+virgin+Mary%2C+the+Son+of+God%2C+Lk.+1%3A5%2C+and+that+same+He%2C+and+Person+who+came+of+the+Jews%2C+according+to+the+flesh%2C+to+be+God+blessed+forever%2C+Rom.+9%3A5%3B+Heb.+7%3A3%3B+Mt.+16%3A13%2C+16%2C+and+the+third+general+council%2C+called+that+of+Ephesus%2C+and+after+the+council+of+Chalcedon%2C+ver.+4+and+5%2C+do+evidence+to+us+that+Christ+cannot+be+two+persons+as+Nestorius+dreamed%2C+and+one+person.+Paul+spread+the+Gospel+from+Jerusalem+to+Iliricum%2C+about+ten+hundred+miles.+I+know+not+he%2C+but+the+grace+of+God+that+was+with+him%2C+1+Cor.+15%3A9-10%2C+not+he%2C+but+the+Lord%3A+True%2C+but+the+question+now+is+whether+Paul+and+the+Holy+Ghost+in+all+these+works+of+grace%2C+were+two+persons+become+one+Spirit+by+union%2C+as+some+dreamers+affirm%3B+because+both+did+the+work%3B+I+believe+not%3A+God+and+cloud+rained+down+manna+to+Israel%3B+O+but+Christ%E2%80%99s+Father%2C+Jn.+6%2C+gave+the+manna%2C+but+the+question+is+if+the+person+of+God+were+united+with+the+clouds+or+any+second+causes+producing+manna%3B+so+the+Lord+%E2%80%98makes+rich+and+poor%2C+kills+and+makes+alive%2C+makes+snow%2C+frost%2C+fair+weather%2C%E2%80%99+drought+and+rain%2C+the+sun+to+rise%2C+and+go+down%2C+and+that+in+his+own+person%2C+Father%2C+Son%2C+and+Spirit%3B+He%2C+He+only+made+heaven%2C+earth%2C+sea%2C+and+all+creatures%2C+and+the+world%3B+%5BGreek%5D+Acts+17%3A25+and+%5BHebrew%5D+Ps.+33%3A9%2C+do+prove+Him+to+be+a+person+who+does+all+these.+But+we+cannot+say+that+the+person+of+God+must+be+united+with+clouds%2C+ship%2C+sea%2C+sun%2C+heavens%2C+men+fighting+and+men+saving+and+killing%3B+and+that+God+personally+fills+all+creatures%2C+only+God+in+the+immensity+of+his+nature%2C+is+all+these+and+everywhere%2C+and+is+in+them+by+his+operation%3B+so+the+Holy+Ghost+is+with+the+saints+and+dwells+in+%E3%80%88%E2%97%8A%E3%80%89%2C+not+by+union+of+his+Person+to+them+or+the+immensity+of+his+essence%2C+which+is%2C+as+David+says%2C+everywhere%2C+Ps.+139%3A7%E2%80%A6+But+He+dwells+in+the+saints%2C+in+regard+of+the+works%2C+operations%2C+gifts+and+graces+of+the+Holy+Ghost.+1.+Because+the+Holy+Spirit+is+in+them%2C+in+that+they+have+in+them+the+fruits+of+the+Spirit%2C+Gal.+5.22%2C+such+as+love%2C+joy%2C+peace%2C+long-suffering%2C+gentleness%2C+goodness%2C+faith%3B+now+these+are+not+the+Holy+Ghost%2C+who+is+eternal+and+God+uncreated%2C+but+are+created+in+time%2C+out+of+mere+nothing%2C+not+out+of+the+potency+of+the+subject%2C+but+ere+God+produce+grace%2C+so+knotty+and+so+rocky+are+we%2C+and+so+contrary+to+grace%2C+that+he+must+fall+upon+a+new+and+second+creation%2C+Eph.+2%3A10%3B+Col.+2%3A10%3B+Ps.+51%3A10%2C+the+same+word+that+is+used+for+creating+heaven+and+earth%2C+Gen.+1.%E2%80%A2.+is+here+used%3B+it+is+not+like+the+repairing+of+a+fallen+house%2C+where+the+same+timber+and+stones+may+do+the+work%2C+or+the+repairing+of+decayed+nature%2C+when+a+healthy+body+recovers+out+of+a+fever%3B+Grace+is+a+rare+and+curious+workmanship.+2.+We+are+said+to+grow+in+grace%2C+2+Pet.+3.18%2C+and+by+grace+to+increase+to+the+edifying+of+the+body+in+love%2C+Eph.+4%3A16%2C+and+to+the+measure+of+the+stature+of+the+fullnesse+of+Christ%2C+13%2C+and+to+add+grace+to+grace%2C+2+Pet.+1%3A5-7%2C+and+to+go+on+to+perfection%2C+Heb.+6%3A1%3B+Phil.+3%3A12.+But+the+person+of+the+Holy+Ghost%2C+is+not+capable+of+growing%2C+or+addition%2C+nor+like+the+morning+light%2C+or+the+new+moone%2C+that+can+grow+and+advance+in+perfection%2C+being+God+blessed+forever.+3.+If+there+be+a+union+of+the+Person+of+the+Holy+Ghost+with+the+soul%2C+and+not+an+indwelling+by+graces%2C+the+believer+as+a+believer+must+live+by+the+uncreated+and+eternall+life+of+the+Holy+Ghost%2C+or+a+created+life.+Creatum+vel+increatum+dividunt+omne+ens+immediate%2C+sicut+finitum+et+infinitum%3A+Not+the+former%2C+neither+any+man%2C+nor+the+man-Christ+can+in+any+capacity+be+elevated+so+above+itself+as+to+partake+of+the+infinite+life+of+God%3B+how+the+manhood+of+Christ+partakes+of+the+personal+subsistence+of+the+Godhead+is+incomprehensible+to+me%2C+except+that+it+is+not+by+such+a+union+as+my+singular+nature+stands+under+personality+created%2C+and+%5Bit%5D+is+by+assumption+rather+than+union%3B+however%2C+if+there+be+a+union+of+the+Person+of+the+Holy+Ghost+to+our+souls%2C+it+cannot+be+conceived%2C+nor+does+Scripture+speak+of+it%3B+if+the+saints+live+the+life+of+God%2C+it+must+be+by+created+graces%2C+and+this+is+that+%5Bwhich%5D+we+conceive.+4.+The+person+of+the+Holy+Ghost+immediately+acting+in+the+saints%2C+without+them+or+any+active+and+vital+influence+of+the+natural+faculties%2C+cannot+be+guilty+of+sin%2C+because+David+and+Christ+are+absolved+of+sin+in+this%3A+%E2%80%98They+laid+to+my+charge+things+that+I+knew+not%2C%E2%80%99+that+is%2C+things+I+never+acted%2C+crimes+in+which+I+had+no+action+or+hand%3A+but+we+are+blamed+in+the+Word+for+all+the+omissions+of+holy+duties%3B+and+the+Holy+Ghost+cannot+be+blamed%2C+for+He+blows+when+and+where+He+lists%2C+and+is+under+no+Law+in+his+motions+of+free+grace%3B+then+he+who+cannot+be+blamed+in+not+acting%2C+cannot+be+united+as+one+spirit%2C+person+with+person%2C+with+him+who+is+justly+to+be+blamed+in+not+acting.+Assertion+4%3A+It+must+evidently+follow+that+there+is+in+the+saints+a+grace+created+that+is+neither+Christ%2C+nor+the+Holy+Ghost+in+person%3B+for+what+reason+any+has+to+fancy+an+union+of+the+person+of+Christ+or+the+Holy+Ghost+in+the+saints+%5Bas+one+person%5D%2C+the+same+reason+have+they+to+say+that+all+the+three+are+united+to+the+person+of+the+believer+in+all+supernatural+actions%2C+for+the+Father+is+said+to+draw+men+to+the+Son%2C+John+6%3A44%2C+and+Christ+to+reveal+the+Father%2C+and+to+draw+men%2C+John+1%3A18%3B+John+12%3A32+and+the+Holy+Ghost+to+reveal+the+deep+things+of+God%2C+1+Cor.+2%3A10-11%2C+now+all+the+three+in+person+do+these%2C+but+all+the+three+persons+are+not+united+to+believers+in+person%3B+this+were+a+mystery+greater+then+God+manifested+in+the+flesh%2C+and+unknown+to+Scripture.+2.+If+Christ+be+all+the+grace+of+believers%2C+faith+in+Christ+and+the+love+of+Christ+should+be+Christ.+3.+Then+should+a+believer+having+a+new+heart%2C+and+a+new+Spirit%2C+be+Christed%2C+or+Godded%3B+and+God+should+be+incarnate+in+every+believer%2C+and+how+many+Christ%E2%80%99s+should+there+be%3F+and+the+new+heart+in+one+saint%2C+and+the+grace+given+to+Paul%2C+should+be+the+new+heart+given+to+Peter%2C+whereas+God+has+given+grace+to+every+man+according+to+his+measure%2C+and+there+are+diversity+of+gifts%2C+but+one+Spirit%2C+2+Pet.+3%3A15%3B+Phil.+1%3A9%3B+Eph.+3%3A3-5%3B+1+Cor..12.3-6%3B+Eph.+4%3A16.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%E2%80%A6+%28London%2C+1647%29%2C+pp.+464-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb95c62817.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db95c62817.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/holy-spirit#:~:text=Assertion%203.%20The%20Person%20of%20the,Eph.%203%3A3%2D5%3B%201%20Cor..12.3%2D6%3B%20Eph.%204%3A16&amp;text=Assertion%203.%20The%20Person%20of%20the%20Holy%20Ghost&amp;text=Phil.%201%3A9%3B%20Eph.%203%3A3%2D5%3B%201%20Cor..12.3%2D6%3B%20Eph.%204%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-c1b9f9054e" data-kw="">
<blockquote><p>It is granted by all sober Protestants that the Church has power of making canons and constitutions for decency and order in the public worship of God; and not only to prescribe the necessary circumstances of time and place, but also to continue and establish those ancient rites of the Christian Church which were practiced in the primitive times and are in themselves of an indifferent nature; which authority of the Church was asserted in the Augustan [Augsburg] Confession [art. 7, 15, 21, 24, Conclusion], and particularly by Mr. Calvin (Institutes, bk. 4, ch. 10, sect. 27. See Thomas Cartwright, [A Reply to an Answer,] bk. 1, [Answer to pp. 20-22,] p. 27), and other worthy persons in the Reformation. Which our [Anglican] reformers also did assume to themselves, as is declared in the 20th Article [of the 39 Articles]; and has been practised and defended against all Dissenters, as well by Scripture (Acts 15:28; 1 Cor. 11:16), as by antiquity and right reason… And the Royal Martyr [King Charles I] was so tender of their reputation that in his answer to the Parliament’s remonstrance, he promises to reform the ceremonies with these cautions:

1. That the reformation were pursued with such modesty and submission that the quiet of the kingdom were not disturbed;

2. Nor the decency and comeliness of God’s service discountenanced;

3. Nor the pious, sober and devout actions of those reverend persons who were the first laborers in the blessed Reformation be scandalized and defamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Preface concerning the Ceremonies of the Church’ in Misericordiam Volo: or the Pharisees’ Lesson, showing the Impiety &amp; Unreasonableness of contending for Outward Forms &amp; Ceremonies to the Violation of Obedience, Charity &amp; the Public Peace in The Character of a Separatist, or Sensuality the Ground of Separation</cite>, ‘The Preface concerning the Ceremonies of the Church’ in Misericordiam Volo: or the Pharisees’ Lesson, showing the Impiety &amp; Unreasonableness of contending for Outward Forms &amp; Ceremonies to the Violation of Obedience, Charity &amp; the Public Peace in The Character of a Separatist, or Sensuality the Ground of Separation... (London: Kettilby, 1677)</span></figcaption>

</figure><figure class="quote" id="q-364bdb303f" data-kw="">
<blockquote><p>Dr. [John] Rainolds objected the example of the brazen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways: First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Rainolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>

</figure><figure class="quote" id="q-99bff9c65a" data-kw="">
<blockquote><p>First, whereas you say, It suffices that it is bread and wine before consecration, by which substances we be nourished, it proves not but that in the sacrament itself the conveniency is by you taken away. For we speak not of the sacrament when it is now a sacrament, where also we affirm that the analogy must be kept. You appoint the same to be before the sacrament; and when ye come to the sacrament, you take it away, and so ye sin against the sacrament.</p></blockquote>

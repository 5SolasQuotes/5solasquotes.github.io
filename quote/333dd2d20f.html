<blockquote><p>A principle that calculation errors made by the court do not invalidate the judgement on a technicality. Also taken to mean that the judge does not tally up the arguments of both sides and decide in favor of the more numerous, but rather weighs all of the evidence without regard to the number of arguments made.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b07c8bef17" data-kw="">
<blockquote><p>This dispute [with Hamilton] caused McWard a good deal of distress, and may well have hastened his death in May 1681. For these and other reasons Hamilton became decidedly unpopular among the Scottish exiles. Eventually realising that he was looked on generally as a ‘pest’–the term is his own–he decided, later in 1681, to leave Holland for good and move further into the Continent. His original intention was to go to Hungary, where he planned to align himself with the then persecuted supporters of the Protestant interest. He was dissuaded however from this by Herman Witsius, the great theologian of the Covenants, whom he had gone to see at Utrecht and with whom he was on friendly terms… …but rather go to the northern province of Friesland, where there was a particular work for him to do… and Witsius, when he consulted him again, nto only approved it but gave him a letter of introduction to a Friesland minister, William Brakel, of Leeuwarden… in Hamilton’s words, Brakel showed ‘unspeakable kindness’ to him, entertained him in his own house for several weeks, and gave him a most sympathetic hearing when he spoke of the plight of the persecuted church in Scotland. Brakel, indeed, was so impressed by what Hamilton told him that he wrote directly to the Societies expressing his strong support and concern at their plight and pledging himself to do all in his power to help them… Hamilton felt emboldened to broach… the possibility of having young men from the Societies trained for the ministry in Holland… Brakel and his friends offered not only to arrange for the students’ training, but to help with the costs themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preacher to the Remnant: The Story of James Renwick (Blue Banner Productions, 2009)</cite>, p. 45</span></figcaption>

<blockquote><p>…this penetrating essay examines the claims of the Plymouth Brethren and similar movements that sought to establish a “pure church” composed only of demonstrably regenerate believers. With historical learning, theological precision, and pastoral concern, Croskery argues that Scripture itself distinguishes between the visible and invisible church, and that attempts to create a perfectly pure communion on earth inevitably lead not to greater holiness, but to fragmentation, sectarianism, and spiritual pride.” – Blurb . 1900’s MacPherson, John – ‘Unity of the Church: The Sin of Schism’ (1901) 43 paragraphs from The Doctrine of the Church in Scottish Theology MacPherson was a minister in the Free Church of Scotland in the late 1800’s who here masterfully surveys the thought on the broadest unity of the church during the second reformation in Scotland (mid-1600’s). . 2000’s Winzer, Matthew – ‘A Review of Greg Barrow’s The Covenanted Reformation Defended‘ (2006) 18 paragraphs The jist of the Still Waters Revival’s claims, according to Dr. Richard Bacon, is that “they maintain that we can treat churches that lack the full well-being of the church just as we would treat a false church. Then they define full well-being as including the Solemn League and Covenant (1643) and several other documents that they refer to as ‘terms of communion.’ . . Books 1500’s Gifford, George A Short Treatise Against the Donatists of England, whom we call Brownists, wherein, by the Answers unto Certain Writings of theirs, Diverse of their Heresies are Noted, with Sundry Fantastical Opinions… (London, 1590) 110 pp. ToC Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher at Maldon in Essex, England. John Greenwood replied to this work in, An Answer to George Gifford’s Pretended Defence. A Plain Declaration that our Brownists be Full Donatists by Comparing them Together from Point to Point out of the Writings of Augustine. Also a Reply to Master Greenwood touching Read Prayer, wherein his Gross Ignorance is Detected… (London, 1590) 126 pp. ToC This work is in reply to John Greenwood’s, An Answer to George Gifford’s Pretended Defence…, which was a reply to Gifford’s, A Short Treatise… A Short Reply unto the Last Printed Books of Henry Barrow &amp; John Greenwood, the Chief Ringleaders of our Donatists in England. Wherein is laid Open their Gross Ignorance &amp; Foul Errors: upon which their Whole Building is Founded (London, 1591) 98 pp. ToC . 1600’s English Puritans – A Refutation of the Errors of Separatists (1604; RBO, 2025) 300 pp. with an Extended Intro by Travis Fentiman: “Defending the Lawfulness of Partial-Conformity in Worship &amp; Church Government (including under Civil Impositions) from Scripture, Westminster &amp; the Scottish Indulgence Controversy, contra George Gillespie, while Driving against Denominationalism, for the Unifying of Christ’s Church</p></blockquote>

<blockquote><p>Whatever have been the effects and fruit of meetings of persons of diverse families in times of corruption or trouble (in which cases many things are commendable which otherwise are not tolerable) yet, when God has blessed us with peace and purity of the Gospel, such meetings of persons of diverse families (except in cases mentioned in these Directions)¹ are to be disapproved, as tending to the hindrance of the religious exercise of each family by itself, to the prejudice of the public ministry, to the renting of the families of particular congregations, and (in process of time) of the whole Kirk, besides many offenses which might come thereby, to the hardening ofthe hearts of carnal men, and grief of the godly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-d9df8860b7" data-kw="">
<blockquote><p>Divisions and contendings have been the undoing of this Church first and last, but I think more of late, and more shamefully than ever, the matter being so small (if wisely considered) about which all this noise has been made. I take not upon me to justify the indulged ministers, neither will I rigidly condemn them: But, if the separating from their ministry and pressing the matter with such heat and violence shall be found to be good service done to Christ, I have read the Scriptures wrong; and the sad consequences of it are convincing enough, if people were humble and convincible. It was this contention which expelled that profitable and most edifying exercise of mutual prayer and Christian conference (that I may say nothing how it drove from the shepherds’ tents) upon which followed a sensible decay in the exercise of godliness.</p></blockquote>

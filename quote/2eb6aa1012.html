<blockquote><p>To bring forward greater things, the common reason, the law, the prophets, the very sufferings of Christ, by whose works we have all been restored without any exception, we who were participants of the same Adam, circumvented by the speech of the crafty and deceitful serpent, and killed and extinguished by sin, and restored to salvation by the heavenly Adam, and recalled to the tree of life from which we had fallen by the tree of ignominy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/diego-ruiz.html">Diego Ruiz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries &amp; Disputations on the First Part of St. Thomas, on the Will of God &amp; his Proper Acts</cite>, (Lugduni: Prost, 1630), Disp. 20, sect. 6 tr. AI by The Faith Received | 8. I prove the minor premise of the primary reason, and I explain more and confirm the whole preceding discourse. For at least the most excellent and most universal [will] of human salvation is established to be willed by God formally, as means in order to salvation not only of the predestined, but also of all other men, for: | And after other examples of natural benefits of this kind, he adds regarding heavenly things:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

a1012.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-will-of-god/#:~:text=To%20bring%20forward%20greater%20things%2C%20the,fallen%20by%20the%20tree%20of%20ignominy&amp;text=To%20bring%20forward%20greater%20things%2C%20the%20common%20reason&amp;text=we%20had%20fallen%20by%20the%20tree%20of%20ignominy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-07ae059f1c" data-kw="">
<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, in Works</cite>, vol. 2, pp. 358-61</span></figcaption>

</figure><figure class="quote" id="q-3a779fe462" data-kw="">
<blockquote><p>Do you contemplate, O man, the most immaculate Lord, hanging on the cross: and do you dare, O impudent and unhappy man, to spend your whole time of your life on earth in delights and laughter? Do you not know, O miserable and impudent one, that He who was crucified for you as Lord will demand an account from you for all these negligences and contempts? Now indeed, while you hear this, you neglect it, you laugh in delights; and free from all care, you see yourself as free: but that terrible day will surely come, the day of vengeance, and you will mourn without end and cry out because of your pains in the eternal fire: and there will be absolutely no one there to answer and to have mercy on your soul.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>It seems, I confess, by its more obvious aspect [in the term ‘will of sign’, which is often misunderstood], too much to countenance the ignominious slander which profane and atheistical dispositions would fasten on God, and the course of his procedure towards men; and which it is the design of these papers to evince of as much absurdity and folly, as it is guilty of impiety and wickedness: as though He only intended to seem willing of what He really was not; that there was an appearance to which nothing did subesse [exist under]. And then why is the latter called voluntas [will]? unless the meaning be, He did only will the sign; which is false and impious;</p></blockquote>

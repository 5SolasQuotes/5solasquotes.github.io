<main class="wrap"><figure class="quote" id="q-ebc535f853" data-kw="">
<blockquote><p>If this is the nature of the promises, let us now see whether there be any inconsistency between the two things--viz. that God, by an eternal decree, fixed the number of those whom he is pleased to embrace in love, and on whom he is pleased to display his wrath, and that he offers salvation indiscriminately to all. I hold that they are perfectly consistent, for all that is meant by the promise is, just that his mercy is offered to all who desire and implore it, and this none do, save those whom he has enlightened. Moreover, he enlightens those whom he has predestinated to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.24.17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7866d59a5" data-kw="believe and be saved offer">
<blockquote><p>In the same sense, I properly infer that all sinners would be saved if they would believe—not from any conditional decree, but from this most certain general truth which God has sanctioned by his absolute decree (viz., that faith is the infallible means of salvation). For as he has appointed faith as the only way of bringing men to salvation, hence arises the truth of this hypothetical proposition—if a sinner believes he will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.11</span></figcaption>

</figure><figure class="quote" id="q-7bc25146b3" data-kw="revealed will rejected counsel">
<blockquote><p>The counsel which the Pharisees are said to have rejected against themselves (Lk. 7:30) does not denote any conditional decree concerning saving the Pharisees under the condition of faith and repentance, but the will of command (viz., the testimony of John concerning Christ by which God gave counsel to them about the mode of obtaining eternal salvation).</p></blockquote>

</figure><figure class="quote" id="q-f91a5a36b0" data-kw="">
<blockquote><p>The expression of our Savior, &quot;Many are called, but few are chosen,&quot; (Mt. 22:14), is also very improperly interpreted (see Book 3, chap. 2, sec. 11, 12). There will be no ambiguity in it, if we attend to what our former remarks ought to have made clear--viz. that there are two species of calling: for there is an universal call, by which God, through the external preaching of the word, invites all men alike, even those for whom he designs the call to be a savor of death, and the ground of a severer condemnation. Besides this there is a special call which, for the most part, God bestows on believers only, when by the internal illumination of the Spirit he causes the word preached to take deep root in their hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.24.8</span></figcaption>

</figure><figure class="quote" id="q-b550c528f6" data-kw="God not depend on man">

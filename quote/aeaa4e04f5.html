<blockquote><p>Constitutes and ordains that from henceforth no sort of person, of whatsoever quality or degree, be permitted to speak or write against the said Confession, this Assembly, or any act of this Assembly, and that under the pain of incurring the censures of this Kirk.</p></blockquote>

</figure><figure class="quote" id="q-2f016b59e9" data-kw="">
<blockquote><p>But yet it’s an error to hold that if any unjustly condemn other churches, it is a renunciation of that condemned church-state to have communion with them that condemn. Who would have thought the two separating extremes had so agreed in their principles? This is just the very core of the evil of the book of the contrary party which I here answer. Alas! how few Churches on earth have not peevishly condemned one another: it may be for Easter-day, for the choice of a bishop, as the Donatists (striving whose bishop was the right one): The case of the [early Church groups, the] Novatians, Audians, Luciferians and even of most in East and West are sad instances: And will such censoriousness unChurch them and forbid us communion with them? This is plain revenge and to curse them that curse us and abuse them that abuse us. I like Calvin ‘s spirit better than this, who said, “Though Luther should call me a devil, I would call him the excellent servant of God.”* Too many Lutherans now renounce communion with the Calvinists, who yet renounce not communion with them. * John Calvin, Letters of John Calvin, ed. Jules Bonnet (Philadelphia: Presbyterian Board of Publication, 1900), letter 122, to Bullinger (1544), p. 433.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 83-84</span></figcaption>

<blockquote><p>3. And if communicants will be at the charge of maintaining a pastor whom they can better trust their souls with, than him whom the patron chooses for them, the orthodox or tolerating magistrate must see that he be not an heretic, that does more hurt than good; and must keep them under the laws of loyalty and peace, and see that they sow not sedition, and revile not others under pretense of worshipping God. 4. And no men should, without necessity, lose the advantages of a public ministry which the most consent to, and which has the magistrates countenance and maintenance; because gathering singular churches within parish-bounds, seems some accusation of the parish-minister or Church; and such Churches are oft tempted to envy and censoriousness, and are usually envied and censured by others: And unity is much of our strength and beauty. But in case of necessity it may be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts</cite>, ... (1684), Unnecessary Separating Disowned, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-593ffe42d4" data-kw="">
<blockquote><p>It has been the sad observation of diverse, that every new trial has been the occasion of a new difference, if not division. The Lord partly, in his holy displeasure, withdrawing light and chastising his people for their sins, and partly trying and exercising of them in that great duty of mutual forbearance, so little made conscience of; and partly discovering infirmities, much dross in his own, by the contests so carnally managed.</p></blockquote>

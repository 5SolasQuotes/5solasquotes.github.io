<blockquote><p>They [occasional non-conformists] agree in all the Articles of the Church of England [the 39 Articles], which the dissenting ministers have subscribed, except part of the Twentieth, which gives the Church power to decree rites and ceremonies, and 35th and 36th, about the second Book of Homilies, and consecration of bishops, etc. which are private articles and not articles of the catholic Church; as Mr. [Thomas] Rogers [d. 1616] confesses, whose Exposition was allowed by public authority. (Rogers, English Creed, London, 1585)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-984762b173" data-kw="">
<blockquote><p>Neither has this variety [of catechisms] been looked upon as hurtful, for if so, then holy men would have kept to what they found, and have made conscience of increasing this evil by adding to the number; ‘I find’ (says Dr. Gouge, Epistle to his Catechism): ‘in all ages of the Church, God has stirred up many of his servants to publish several forms, all agreeable in the substance, and I observe among many other, these two good uses to arise from thence, etc.’ which there he specifies; nay, since this of the [Westminster] Assembly, composed by a synod of holy and learned men, approved of, and commended to the nation by the parliament then sitting, and received and settled in Scotland, yet men’s consciences have not been satisfied in this, as the only catechism fit to be used, as appears in the great number and variety of catechisms composed and printed since this was published, a greater number then in so short a time were ever published before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing</cite>, Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662., pp. 86-87</span></figcaption>

b173.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Neither%20has%20this%20variety%20%5Bof%20catechisms,a%20time%20were%20ever%20published%20before&amp;text=Neither%20has%20this%20variety%20%5Bof%20catechisms%5D%20been%20looked&amp;text=so%20short%20a%20time%20were%20ever%20published%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-34987f8b75" data-kw="">
<blockquote><p>6. It is also false and absurd which they [Separatists] say touching the authority of the classis [presbytery], that it is such ‘as does not become any except the apostles, that could not err, to have.’ But it is the less marvel that these men do speak on this manner when as they see Mr. [John] Davenport himself going before them and using a much-like-speech in his letter to the classis touching his consent required to the writing of the five ministers, namely that: ‘such a subjection is greater than may be yielded unto any council, whether of classis or synods, etc. that thereby the writings and decrees of men are made infallible, and equal with the Word of God, which is intolerable.’ But what wise man is there that sees not the strange folly and vanity of such assertions as these? Is no truth uttered or described by men in our times, whereunto the consent of men may be required, because there be now no apostles? Do not all Reformed Churches at this day require a subscription unto their confessions of faith in the several articles thereof? Do they hereby make their writings of equal authority with the Word of God, and themselves equal to the apostles that could not err? It is far from them. Neither Mr. Davenport, nor these complainants, shall ever be able to justify these slanderous complaints. Nay, if this were true, how could Mr. Davenport subscribe his name unto his own writing sent unto the classis, to show his consent unto it? Did he thereby make himself an apostle or his writing equal with the Word of God? Why may we not show our consent and subscribe to other writings of men upon persuasion of the truth so appearing unto us, as well as he subscribed to his own? They are so far from proving these assertions that they offer not to go about it; we acknowledge there is no judicatory on earth, either civil or ecclesiastical, either of consistory, classis or synod, but they are subject to error: when that error is showed by the Word of God, it ought to be corrected. This also is their practice, one synod often reforming that which has been decreed by another. Yet does not this take away their authority for the judgment and deciding of controversies. For by such reasoning they might take away all government and bring in confusion. By these and such-like injurious speeches they do exceedingly gratify many sorts of Libertines, Arians, Socinians and other heretics which do therefore so much abhor the subscriptions required in the Churches of God because they serve for detection and discovery of their errors. But as the preaching of the Word is not therefore to be condemned, because some preach error, so are not subscriptions and that consent which is required to many truths therefore to be rejected, though some do unjustly urge subscription unto errors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paget.html">John Paget</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Unjust Complaints of William Best &amp; of such Other as have Subscribed Thereunto. Also an Answer to Mr. John Davenport</cite>, … (Amsterdam, 1635), pp. 88-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>Therefore I exhorted all men equally in my doctrine, that they should leave the unsure way, and follow that way, which was taught us by our master Christ. He is our only Mediator and makes intercession for us to God his Father. He is the dore by the which we must enter in. He that enters not in by this door, but climbs another way is a thief and murder. He is the verity and life. He that goes out of this way, there is no doubt but he shal fall into the mire: yea verily he is fallen into it already. This is the fashion of my doctrine, the which I have ever followed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-wishart.html">George Wishart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tragical Death of David Beaton, Bishop of St. Andrews in Scotland, whereunto is joined the martyrdom of master George Wishart</cite>, … (London, 1548) John Knox was a bodyguard to Wishart for a time.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-feda7ad161" data-kw="">
<blockquote><p>…hence we seek a warrant, why these who were once members of the visible Church and baptized, as the Answer to the 32 [Questions, a previously published congregationalist work] says, and so [are] clean and holy, 1 Cor. 7:14; Rom. 11:16, (2) in covenant with God, Acts 2:38-39; Acts 15:14-15; Gen. 17:7; 2 Cor. 6:16-18, etc. (3) and so redeemed by the blood of Christ and baptized into his body, 1 Cor. 12:13, even unto Christ, Gal. 3:17; Acts 2:38-39, when they come to age, are for no scandal unchurched, and because they cannot give evidence of real conversion, yet for 60 or 80 years, and to their dying day, are no more Church-members than pagans? ([Margin note:] Our [congregationalist] Brethren cast out of the Church these who were baptized in their infancy, and members thereof, because visibly non-regenerated. What warrant for this censure?)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the Churches of New England is now Re-examined (London, 1658), bk. 1, ch. 14</cite>, p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

0for%20this%20censure" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f55322314" data-kw="">
<blockquote><p>But that all doubt may be better cleared away, this principle should ever be kept in mind, that baptism is not conferred on children in order that they may become sons and heirs of God, but, because they are already considered by God as occupying that place and rank, the grace of adoption is sealed in their flesh by the rite of baptism. Otherwise the Anabaptists are in the right in excluding them from baptism. For unless the thing signified by the external sign can be predicated of them, it will be a mere profanation to call them to a participation of the sign itself. But if any one were inclined to refuse them baptism, we have a ready answer; they are already of the flock of Christ, of the family of God, since the covenant of salvation which God enters into with believers is common also to their children. As the words import ‘I will be thy God and the God of thy seed after thee.’ Unless this promise had preceded, certainly it would have been wrong to confer on them baptism. Now I ask whether the Word of God is sufficient by its intrinsic value for our salvation, or whether some aid must be borrowed elsewhere to supply its defect, or help its infirmity? If this promise is not believed to be efficacious in itself, not only the virtue of God, but also his grace and truth will be attached to the external sign. Thus those men, while they strive to honor baptism, cast serious ignominy on God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 438–To John Clauburger in Letters of John Calvin, ed. Bonnet (Philadelphia: Presbyterian Board of Publication, 1858), vol. 3</cite>, pp. 282-283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-9372f182a4" data-kw="">
<blockquote><p>By what reasons are they [Anabaptists] confuted? (1) Because, to covenanted ones (of which number the infants of believers are no less than their parents; Acts 2:38-39; Acts 3:25; Rom. 11:16; Gen. 17:7,22) that seal of the covenant, of which they are capable, is not to be denied; Gen. 17:7,10-11. … (8) Because, the Apostle says that the infants but of one believing parent are holy, 1 Cor. 7:14, that is, are comprehended in the outward Covenant of God, and have access to the signs, and seals of God’s grace as well as they are that are born of both believing parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error (Edinburgh, 1684), ch. 28, ‘Of Baptism’, Question 3</cite>, pp. 179-180</span></figcaption>

</figure><figure class="quote" id="q-708e459e56" data-kw="">
<blockquote><p>XXXI. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God would purge from every stain of original sin as many infants as he admits into his heavenly kingdom, which nothing defiled and contaminated enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, he undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. XXXII. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the Apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on Faith’ in Theological Theses put forth at Various Times at the Academy of Sedan 3rd ed. tr. Onku with AI (1645; London: Moses Pitt, 1683), p. 6 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-7cdee6be1e" data-kw="">
<blockquote><p>30. But those in whom true faith is found are all and only those who are predestined to eternal life. For that faith falls to them from the decree of divine election; and therefore it is called by Paul, “the faith of God’s elect,” Tit. 1:1. Whence it happens that without it no one can be saved, nor does anyone have it who does not obtain salvation. For that assent which imitates true faith in some of the reprobate is temporary faith, about which we spoke above: and it must be distinguished from justifying and saving faith. 31. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God does not cleanse from every stain of original sin all the infants whom he admits into his heavenly kingdom, into which nothing polluted or defiled enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, He undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. 32. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“30. But those in whom true faith is found are all and only those who are predestined to eternal life. For that faith falls to them from the decree of divine election; and therefore it is called by Paul, “the faith of God’s elect,” Tit. 1:1. Whence it happens that without it no one can be saved, nor does anyone have it who does not obtain salvation. For that assent which imitates true faith in some of the reprobate is temporary faith, about which we spoke above: and it must be distinguished from justifying and saving faith. 31. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God does not cleanse from every stain of original sin all the infants whom he admits into his heavenly kingdom, into which nothing polluted or defiled enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, He undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. 32. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the apostle says that it was freely given to them to believe in Christ, Phil. 1:29.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), vol. 2, ‘On Faith’, pp. 131-32 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C30.+But+those+in+whom+true+faith+is+found+are+all+and+only+those+who+are+predestined+to+eternal+life.+For+that+faith+falls+to+them+from+the+decree+of+divine+election%3B+and+therefore+it+is+called+by+Paul%2C+%E2%80%9Cthe+faith+of+God%E2%80%99s+elect%2C%E2%80%9D+Tit.+1%3A1.+Whence+it+happens+that+without+it+no+one+can+be+saved%2C+nor+does+anyone+have+it+who+does+not+obtain+salvation.+For+that+assent+which+imitates+true+faith+in+some+of+the+reprobate+is+temporary+faith%2C+about+which+we+spoke+above%3A+and+it+must+be+distinguished+from+justifying+and+saving+faith.+31.+But+as+to+what+is+often+asked+here%2C+whether+elect+and+saved+infants+also+have+faith%2C+it+is+plain+indeed+that+they+cannot+have+actual+faith%3B+but+nothing+prohibits+a+certain+habitual+faith%2C+or+rather+the+seed+and+root+of+faith%2C+from+being+infused+in+them.+And+certainly+it+cannot+happen+that+God+does+not+cleanse+from+every+stain+of+original+sin+all+the+infants+whom+he+admits+into+his+heavenly+kingdom%2C+into+which+nothing+polluted+or+defiled+enters.+Since+therefore+original+sin+in+infants+includes+a+certain+seed+of+unbelief%2C+just+as+of+all+vices%2C+while+God+cleanses+them%2C+He+undoubtedly+takes+away+that+innate+unbelief%2C+and+so+infuses+the+principle+and+a+certain+seed+of+faith.+For+God+does+not+purge+his+own+from+vices+except+by+infusing+the+contrary+habits+of+virtues.+32.+Moreover%2C+whatever+that+may+be%2C+whether+faith+or+the+root+of+faith+and+disposition+to+faith+which+can+be+found+in+infants%2C+it+is+beyond+controversy+that+it+must+be+attributed+to+God+alone%2C+and+that+the+offices+of+man+do+not+concur+with+it%3A+nor+can+it+be+called+into+doubt+by+anyone%3A+but+Scripture+also+manifestly+teaches+that+the+same+must+be+thought+about+the+faith+of+adults%2C+for+it+calls+faith+the+gift+of+God%2C+Eph.+2%3A8%2C+%E2%80%9CBy+grace+you+have+been+saved+through+faith%2C+and+that+not+of+yourselves%2C+it+is+the+gift+of+God.%E2%80%9D+And+to+the+Philippians+the+apostle+says+that+it+was+freely+given+to+them+to+believe+in+Christ%2C+Phil.+1%3A29.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+vol.+2%2C+%E2%80%98On+Faith%E2%80%99%2C+pp.+131-32+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7cdee6be1e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7cdee6be1e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=30.%20But%20those%20in%20whom%20true,to%20believe%20in%20Christ%2C%20Phil.%201%3A29&amp;text=30.%20But%20those%20in%20whom%20true%20faith%20is&amp;text=to%20them%20to%20believe%20in%20Christ%2C%20Phil.%201%3A29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

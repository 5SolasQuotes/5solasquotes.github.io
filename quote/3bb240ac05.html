<main class="wrap"><figure class="quote" id="q-3bb240ac05" data-kw="">
<blockquote><p>This, also, is a passage worthy of observation, as shewing that a gratuitous righteousness is not conferred upon us in Christ, without our being at the same time regenerated by the Spirit to the obedience of righteousness, as he teaches us elsewhere, that Christ is made to us righteousness and sanctification. (1Co 1:30.) The former we obtain by a gratuitous acceptance; and the latter by the gift of the Holy Spirit, when we are made new creatures. There is however an inseparable connection between these two blessings of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Philippians, Colossians, and Thessalonians</cite>, Colossians 1:22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/distinguished-but-inseparable.html">Distinguished but inseparable</a></span><span class="t"><a href="../topics/sanctification/sanctification-and-justification.html">Sanctification and Justification</a> › <a href="../topics/sanctification/sanctification-and-justification/distinct-but-inseparable.html">Distinct but inseparable</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41a65a8c0f" data-kw="">
<blockquote><p>For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)</span></figcaption>

</figure><figure class="quote" id="q-2292c0d676" data-kw="">
<blockquote><p>In the confusion of a twofold grace, which Osiander obtrudes upon us, there is a similar absurdity. Because those whom God freely regards as righteous, he in fact renews to the cultivation of righteousness, Osiander confounds that free acceptance with this gift of regeneration, and contends that they are one and the same. But Scriptures while combining both, classes them separately, that it may the better display the manifold grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In the confusion of a twofold grace, which Osiander obtrudes upon us, there is a similar absurdity. Because those whom God freely regards as righteous, he in fact renews to the cultivation of righteousness, Osiander confounds that free acceptance with this gift of regeneration, and contends that they are one and the same. But Scriptures while combining both, classes them separately, that it may the better display the manifold grace of God.”

— John Calvin, Institutes of the Christian Religion, 3.11.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+confusion+of+a+twofold+grace%2C+which+Osiander+obtrudes+upon+us%2C+there+is+a+similar+absurdity.+Because+those+whom+God+freely+regards+as+righteous%2C+he+in+fact+renews+to+the+cultivation+of+righteousness%2C+Osiander+confounds+that+free+acceptance+with+this+gift+of+regeneration%2C+and+contends+that+they+are+one+and+the+same.+But+Scriptures+while+combining+both%2C+classes+them+separately%2C+that+it+may+the+better+display+the+manifold+grace+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2292c0d676.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2292c0d676.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-052ea44d12" data-kw="">
<blockquote><p>Now, since Christ confers upon us, and we obtain by faith, both free reconciliation and newness of life, reason and order require that I should here begin to treat of both. The shortest transition, however, will be from faith to repentance; for repentance being properly understood it will better appear how a man is justified freely by faith alone, and yet that holiness of life, real holiness, as it is called, is inseparable from the free imputation of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.1</span></figcaption>

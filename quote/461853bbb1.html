<main class="wrap"><figure class="quote" id="q-461853bbb1" data-kw="">
<blockquote><p>Thanks, be to God, we have a clean other opinion of the Eucharist. We hold it (as it is indeed) a very holy Sacrament of the body and blood of our Lord, to be one of the most precious instruments of his grace, which being lawfully and rightly celebrated, communicateth to us all the treasures of heaven, the flesh and blood of Christ, the pardon of our sins, the peace of our consciences, the sanctification of our souls, and the right to a blessed immortality.

Far be it from us to give it the profane and infamous name of an idol. We will not say, that it is simply and only bread: and if any of us do chance to speak so, in saying that ’tis bread, he means in regard of the substance of the thing, not in regard of its virtue or dignity; in regard of which we believe that it is quite another thing from bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), p. 38.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8eb3be1fc7" data-kw="">

</figure><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 2, pp. 566-67</span></figcaption>

the%20external%20manner%20of%20administration&amp;text=to%20be%20passed%20on%20from%20hand%20to%20hand" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d01ed4a283" data-kw="">
<blockquote><p>It is inquired whether the judicial laws of Moses should still endure or thrive, and therefore whether the Christian magistrate should be bound to such laws today no less than before, and may render judgment according to them with certainty, or, in other words, whether he should enforce their precepts as much as the Israelite magistrate was formerly obliged to do.

I respond to this inquiry with a distinction: the magistrate is obliged to those judicial laws which teach concerning matters which are immutable and universally applicable to all nations, but not to those which teach concerning matters which are mutable and peculiar to the Jewish or Israelite nations for the times when those governments remained in existence.

Things common to all nations (that is, which befall all) and are immutable with respect to their own nature and merits are moral offences, that is, against the Decalogue, such as murder, adultery, theft, seduction from the true God, blasphemy, and smiting of parents.

Those laws which are mutable and which were peculiar to the Jews for that time are things such as the emancipation of Hebrew slaves in the seventh year, Levirate marriage, releasing of debts in the appointed year, marriage with a woman from one’s own tribe, and if there were any other of the same sort. Likewise, these include ceremonial offences such as touching a dead body, touching a woman suffering her menstrual cycle, and others of the same sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Judicial Laws of Moses</cite>, trans. Adam J. Brink, ed. Joel McDurmon (1646; Powder Springs GA: American Vision Press, 2015), pp 4-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-6225698499" data-kw="">
<blockquote><p>Regarding ministers, if one today comes to believe it is most proper, apart from necessity, to sit at a table for the Supper, or to do it with a common cup, and that’s not going to happen in the next few weeks or several months, must a minister abstain from dispensing an impure Supper (with the attendant consequences) or resign his charge to his congregation and go elsewhere? Do you have a framework in which to deal with this, while maintaining a clear and undoubting conscience? If Church officers cannot ever comply with things not fully right, regarding worship or otherwise, then officers can never remain in the Church while seeking her reform. Most all the reformers were against Gillespie’s principle as they continued in the Church (maintaining her unity) while performing practices they did not believe were fully right, while seeking to reform them to the Word, which largely occurred. That was a great good, only able to be attained through that means and our principle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 51</span></figcaption>

<blockquote><p>What is added in the last place, concerning the general intention of God, by which He wills that all men individually should be saved through the death of his Son, needs explanation. It must be observed, therefore, that according to the custom of the Scriptures, the Divine will or intention sometimes denotes merely the appointment of means to an end, although there is no determinate will in God of producing that end by those means. And the Schoolmen refer this intention or will of God to the common order of providence. In this sense He willed and intended the obedience and salvation of the angels who apostatized, inasmuch as He furnished them with gifts, fit in themselves and suitable, to perform obedience and obtain salvation. And in this sense God, with a general intention, wills life to all men, inasmuch as he willed the death of Christ to be the fountain and cause of life to all men individually, according to the tenor of the evangelical covenant.¹ ¹ [Davenant calls the gospel offer, that whosoever believes in Christ will be saved (Jn. 3:16), established with all men as men, a “covenant,” and the “evangelical covenant”. While this call and offer does not reach all persons, yet, according to some, it potentially could save all persons if it were not for the sin of persons after Adam and Eve not continuing in their responsibility and for persons not obeying the command to preach the gospel to every creature. This potential power of providential means, designed unto the end of salvation, however varied or inaccessible through human history, yet reflects, for some theologians, God’s gracious will of providence in some way for the life and salvation of every human individual, especially in contrast to the demons which receive no such favors.] But we must observe, that the Scriptures mention another will or intention of God, and that properly so called, which never fails in producing the good intended, and which the Schoolmen refer to the order of special predestination… But if by this general intention they mean nothing more than a general aptitude and sufficiency in the death of Christ to effect the salvation of all men individually in the mode of an universal cause, or a general appointment of God concerning the salvation of all men individually, who, through the grace of God, duly apply to themselves this universal cause, then there is no need to reject this form of speaking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract on the Gallican Controversy, pt. 1</cite>, pp. 564-65 appended to Davenant, An Exposition of Colossians, vol. 2 ed. Josiah Allport (London, 1832)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c1877f79d0" data-kw="">
<blockquote><p>2. They resisted the Holy Ghost striving with them by their own consciences, and would not comply with the convictions and dictates of them. God’s Spirit strove with them as with the old world, but in vain; they resisted Him, took part with their corruptions against their convictions, and rebelled against the light. There is that in our sinful hearts that always resists the Holy Ghost, a flesh that lusts against the Spirit, and wars against his motions; but in the hearts of God’s elect, when the fullness of time comes, this resistance is overcome and overpowered, and after a struggle the throne of Christ is set up in the soul, and every thought that had exalted itself against it is brought into captivity to it, 2 Co. 10:4, 2 Co. 10:5. That grace therefore which effects this change might more fitly be called victorious grace than irresistible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 7:51, “…ye do always resist the Holy Ghost…”</span></figcaption>

<blockquote><p>53. For just as a physician who abolishes and removes disease and restores health; a master who abolishes and takes away servitude and grants freedom to a slave; a lord who breaks and destroys a prison and releases a captive and exalts him to the highest dignity – these are not said to use force upon the sick man, the slave, or the captive. So neither does God use force upon one to whom He provides that renewing grace. And just as it is foreign to debate whether a sick man is restored to health irresistibly, a slave to liberty, a captive to dignity, so it is foreign to this matter to dispute whether God’s renewing grace operates irresistibly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-c-waser.html">Johann C. Waser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Consideration of a Theological Question: Whether the grace of God is a Force, &amp; Whether it is either Resistible or Irresistible</cite>, (fl. 1628-1667) 22 pp. tr. AI by Confetti, pp. 21-22</span></figcaption>

</figure><figure class="quote" id="q-4ba942f4d2" data-kw="">
<blockquote><p>For the part that most constantly teaches the forceableness of conversion, holds such a kind of actuating the will as does no whit hurt or infringe the liberty thereof; yea rather, which profits it; and while they speak of an irresistible act in turning us, they mean not such an act as cannot be at all resisted, if we would, but such a one as the will, through God’s gracious inclination, would not wish to resist, for that their will to resist is so overcome by the sweet motions of God’s Spirit, that now yieldance is made powerfully voluntary;</p></blockquote>

</figure><figure class="quote" id="q-c4cf30b6ad" data-kw="">
<blockquote><p>God’s stretching out his hands” is all one with his call, (Prov. 1:24); but all men are not called after the same rate as the called according to purpose: wherefore, this place proves not, that the workings of grace as to the elect are resistible; but that the offers of grace as to the non-elect are serious, God in the means really spreading out his arms of grace unto them. Again: they [the Remonstrants] urge that of our Savior, “These things I say, that you might be saved,” (John 5:34); which words were spoken to them, which “would not come to Christ,” (ver. 40); but that the Holy Spirit spoke as inwardly and powerfully to them, as to the elect who” hear and learn of the Father;” what chemistry can extract it out of this text? or from what other scripture can it be demonstrated? God” commands the light to shine out of darkness in some hearts,” (2 Cor. 4:6); but does He so in all? Whence then are those blinded ones? (ver. 4). If there be any such, where is the Remonstrants’ equality of grace? Where, when they say, that illumination is wrought irresistibly? These things cannot consist together. Wherefore our Savior’s words show not forth the weakness or separableness of grace as to the elect, but the true end and scope of Christ’s preaching as to the non-elect; what he spoke to them was in order to their salvation… wherefore this place proves not I that the working of grace in the elect is resistible, but it signally shows forth the nature, of divine ordinances. Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Mt. 3:11). Gospel-preaching is not a mere sound or voice of words, but it imports God’s ordinative counsel to turn men unto himself. Hence every true minister is said to stand. in God’s counsel, and for this very end, to turn them from the evil of their doings, (Jer. 22:22). Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“God’s stretching out his hands” is all one with his call, (Prov. 1:24); but all men are not called after the same rate as the called according to purpose: wherefore, this place proves not, that the workings of grace as to the elect are resistible; but that the offers of grace as to the non-elect are serious, God in the means really spreading out his arms of grace unto them. Again: they [the Remonstrants] urge that of our Savior, “These things I say, that you might be saved,” (John 5:34); which words were spoken to them, which “would not come to Christ,” (ver. 40); but that the Holy Spirit spoke as inwardly and powerfully to them, as to the elect who” hear and learn of the Father;” what chemistry can extract it out of this text? or from what other scripture can it be demonstrated? God” commands the light to shine out of darkness in some hearts,” (2 Cor. 4:6); but does He so in all? Whence then are those blinded ones? (ver. 4). If there be any such, where is the Remonstrants’ equality of grace? Where, when they say, that illumination is wrought irresistibly? These things cannot consist together. Wherefore our Savior’s words show not forth the weakness or separableness of grace as to the elect, but the true end and scope of Christ’s preaching as to the non-elect; what he spoke to them was in order to their salvation… wherefore this place proves not I that the working of grace in the elect is resistible, but it signally shows forth the nature, of divine ordinances. Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Mt. 3:11). Gospel-preaching is not a mere sound or voice of words, but it imports God’s ordinative counsel to turn men unto himself. Hence every true minister is said to stand. in God’s counsel, and for this very end, to turn them from the evil of their doings, (Jer. 22:22). Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls.”

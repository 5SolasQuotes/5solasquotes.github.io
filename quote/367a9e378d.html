<main class="wrap"><figure class="quote" id="q-367a9e378d" data-kw="">
<blockquote><p>We must not confound inspiration and providence – either by reducing the inspiration by which the Scriptures were given to the level of providential guidance of the writers, or by raising the providence by which they have been preserved to the level of inspiration. The Confession intends the distinction to be taken at its full value: one was an immediate and the other a mediate activity of God. And the product correspond to the difference: one produced the plenarily inspired Bible, every word of which is the Word of God; the other produced the safe transmission of that Word, but not without signs of human fallibility here and there in the several copies.

We thus have brought before us by the Confession, in turn, the original autograph of Scripture, produced by the immediate inspiration of God; the preservation of this autographic text in a multitude of copies whose production is presided over by God’s singular care and providence; and the ordinary Bibles in the hands of the people, each of which conveys divine truth to the reader with competent adequacy for all the needs of the Christian life.

And the Presbyterian doctrine of the Bible, therefore, embraces these three points: (1) the plenary inspiration of the Bible as God gave it, by which it is made the Word of God, trustworthy in every one of its affirmations; (2) the safe preservation of the Bible as God gave it, so as to be accessible to men, in the use of the ordinary means of securing a trustworthy text; and (3) the adequate transmission of the saving truth in every and any honest translation, so that the Word of God is accessible to all at all times for all ordinary purposes. The hearty acceptance of all three of these propositions is necessary, if we would range ourselves alongside of the Westminster Confession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession and the original autographs in Selected shorter writings of Benjamin B. Warfield</cite></span></figcaption>

<blockquote><p>Wherefore we suffer not ourselves, in controversies about religion, or matters of faith, to be pressed with the bare testimonies of Fathers, or Decrees of Councils; much less with received customs, or with the multitude of men being of one judgment, or with prescription of long time. Therefore, in controversies of religion, or matters of faith, we cannot admit any other judge than God himself, pronouncing by the holy Scriptures, what is true, what is false, what is to be followed, or what to be avoided.</p></blockquote>

</figure><figure class="quote" id="q-f327f9ab65" data-kw="">
<blockquote><p>The clearness of the Scripture is twofold; even as the obscurity is twofold also. The one is external, placed in the ministry of the word; the other internal, placed in the understanding of the heart. If you speak of the internal clearness, no man sees one iota in the Scriptures, but he that hath the Spirit of God. … If you speak of the external clearness, nothing whatever is left obscure or ambiguous; but all things that are in the Scriptures, are by the Word brought forth into the clearest light, and proclaimed to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 4</span></figcaption>

<blockquote><p>It is one thing to speak of punishments properly so called and satisfactory, inflicted by a judge for the satisfaction of justice; another to speak of punishments improper and castigatory or medicinal. We do not deny that the latter are often appointed to believers, not by God, the Judge, but by God, the Father; not from hatred, but from love; not for vengeance, but for healing; not for destruction, but for correction. Hence Cyprian says: “The Lord chastises the saints that he may advance their holiness, and he advances their holiness that he may save them.” Thomas Aquinas says: “Before remission they are the punishments of sin, after remission they are the struggles and exercises of the saints.” And Augustine happily explains the difference between the punishments of the wicked and the chastisements of the pious: “All, both good and evil, are equally afflicted, nor by their afflictions can they be distinguished because what both suffer is not a distinction. For a distinction of sufferers remains even in a similarity of sufferings and even though, under the same pains, there is not the same virtue and vice; for as in the same fire gold shines and stubble smokes and by the same fan the chaff is blown away and the wheat purged; nor are dregs to be confounded with oil, because both are pressed in the same press. Thus one and the same inrushing power proves, purifies and refines the good; oppresses, ruins and destroys the bad. Hence under the same affliction, the wicked detest and blaspheme God, while the righteous pray to and praise him. So much difference does it make, not as to the kind of punishments, but as to the character of those who suffer them</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (P&amp;R Publishing, 1992–97), 14.12.20. (HT: Steve Meister)</cite></span></figcaption>

<blockquote><p>I answer that, Power is twofold—namely, passive, which exists not at all in God; and active, which we must assign to Him in the highest degree. For it is manifest that everything, according as it is in act and is perfect, is the active principle of something: whereas everything is passive according as it is deficient and imperfect. Now it was shown above (I:3:2; I:4:1 and I:4:2), that God is pure act, simply and in all ways perfect, nor in Him does any imperfection find place. Whence it most fittingly belongs to Him to be an active principle, and in no way whatsoever to be passive. On the other hand, the notion of active principle is consistent with active power. For active power is the principle of acting upon something else; whereas passive power is the principle of being acted upon by something else, as the Philosopher says (Metaph. v, 17). It remains, therefore, that in God there is active power in the highest degree. Reply to Objection 1. Active power is not contrary to act, but is founded upon it, for everything acts according as it is actual: but passive power is contrary to act; for a thing is passive according as it is potential. Whence this potentiality is not in God, but only active power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, Question 25, ‘The Power of God’ | Article 1</cite></span></figcaption>

<blockquote><p>The metaphysical essence of God is constituted by His aseity Proof: The concept of self-existent being, or omnimodal aseity can be understood in the following manner: 1. It is that which is conceived as the first and foremost in God. 2. It is the primary distinguishing characteristic of God from all other things. 3. It serves as the fundamental root of God’s attributes. Therefore, aseity constitutes the metaphysical essence of God; this is the proper understanding of the metaphysical essence. Regarding the first part, this is evident because any other perfection or attributes attributed to God, such as being wise, eternal, infinite, cannot be conceived as truly divine without aseity, which means complete independence from anything else. Additionally, no other attribute can be assigned from which aseity itself could be derived. As for the second part, this is because by His aseity, God is first and immediately distinguished from creatures, which exist from another as a cause. God is conceived as having the power to emanate from Himself or, rather, to contain within Himself all other divine perfections or attributes. As St. Thomas puts it, “God is existence itself, of itself subsistent. Consequently, He must contain within Himself the whole perfection of being.” (Summa Theologiæ, Prima Pars, q. 4, a. 2) Concerning the third part, it follows from the fact that God is being from Himself and by Himself, and that He has no cause for limitation, and therefore necessarily possesses all possible perfections, which are the divine attributes themselves. Therefore, all these attributes are conceived to flow forth from His aseity as their primary source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zeferino-gonzalez.html">Zeferino González</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Metaphysicam generalem atque specialem (1894), vol. 2, p. 331 in Fanatic Thomas, ‘Divine Aseity as the Formal Constituent of God’s Metaphysical Essence’ (2023) Cardinal Gonzalez (1831–1894) was a Spanish Dominican theologian and philosopher, Archbishop of Seville and cardinal.</cite></span></figcaption>

</figure><figure class="quote" id="q-5fb269979f" data-kw="">
<blockquote><p>Beings of reason strictly speaking, they [Scholastics] say, are divided into founded and non-founded, insofar as some foundation of understanding for forming them is found in things or insofar as they are fashioned without such foundation by the mind. Time and space, they say, are beings of reason with a foundation in reality; but a chimaera lacks such a foundation in reality.</p></blockquote>

<blockquote><p>In light of such problems, Leigh, Maccovius, and Twisse (very much following the tradition) indicate that the voluntas propositi or beneplaciti [proposed will or of good pleasure, i.e. the will of decree] alone is properly called the will of God, ‘which none can resist, Rom. 9:19,’ whereas the voluntas signi or commandment is only ‘improperly’ called God’s will… Baxter does agree with Twisse, however, that the commandments or signs of God are only improperly designated as the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 3.459</cite></span></figcaption>

<blockquote><p>This foolish imitation of the apostles in all things in matters of external order, has been and is the great foundation of evils on all hands, both in many practices and points of Popery, and amongst the Anabaptists (as I could demonstrate in particulars). Learned Danaeus in his Commentaries upon 1 Tim. ch. 5 [v. 13] speakes of it. Apostolici inter Anabaptist as Schlusselburgius writes also (On the Sect of the Anabaptists), that there is a sort of Anabaptists called Apostolici [Apostles], so named because they professed to imitate the apostles in all things: they washed one another’s feet, they held all things ought to be common, they travailed up and down without staff, shoes, cloak, money, because of Christ’s words, they went up to the tops of houses to preach, because Christ had said, what you have heard in the ear, preach upon the house-top.</p></blockquote>

<blockquote><p>2. They [indifferent things] are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands… so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion, yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil.

3. Of the same account is that εὐσχημονία, or decency of religious actions, required by God before Himself… of which the apostle discourses: ‘Every man praying with his head uncovered, dishonoureth his head’ [1 Cor. 11:4]… such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beverley.html">Thomas Beverley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Protestant Truth &amp; Peace in Four Treatises</cite>, (London, 1683), ‘The Woe of Scandal’, pp. 39-40</span></figcaption>

<blockquote><p>Answer… It is blasphemy to seek this distinction of person and office in the King of kings, because by person in a mortal king, we understand a man that can sin.

1. I am not obliged to obey his [the king’s] personal commandment, except I were his domestic [servant], nor his unlawful personal commandments, because they are sinful.

2. It is false that you obey the king’s law because you obey the king; for then you say but this: ‘I obey the king because I obey the king.’ The truth is, obedience is not formally terminated on the person of the king. Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it. And reverence, love, fear, being acts of the affection, are not terminated on a law, but properly on the person of the judge; and they are modifications, or laudable qualifications of acts of obedience, not motives, not the formal reason why I obey, but the manner how I obey. And the apostle makes expressly fear of punishment a motive of obedience (Rom. 13:4), while he says, “He beareth not the sword in vain,” therefore be subject to the king; and this hinders not personal resistance to unjust commandments. … Answer.

1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God.

2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.</span></figcaption>

<blockquote><p>§11. Of the Cross in Baptism Some nonconformists say that they deny not the civil use of the cross in coins and banners. Others of them say they dare not reprove the ancient Christians that used the sign of the cross merely as a professing, signal action to show to the heathen that they did believe in Christ crucified. Indeed that usage thereof was not an act of worship, but an informing of men touching their faith. It seems lawful to signify, as by words so by other signs, that we are Christ’s and his devoted servants, for words are but a kind of signs. The grounds of scrupling the sign of the cross in baptism are these:

1. That it is not a mere circumstance, but an ordinance of worship, as important as an external rite can be.

2. That being a solemn and stated, symbolic sign of a divine mystery and devised of men, it is of that classis or rank of things which are not necessary in genere, and so not allowed to be determined and imposed by men as things necessary in genere are allowed.

3. That either the whole nature of a sacrament, or at least a part thereof, is in it. That it is a sacrament is thus proved: It is an outward and visible sign of inward and spiritual grace. The outward sign is the representation of the cross, the instrument of Christ’s sufferings, and the inward spiritual grace is fortitude in the Christian warfare, according to the words of the Liturgy. Here is a signification of grace to be given us of God and of our duty according to that grace. Likewise this sign has assigned unto it the moral efficacy of a sacrament for working grace, by teaching and exciting us to the spiritual warfare and minding us of Christ crucified. Also it signifies and seals our relation to Christ, or the grace of being a Christian. And the Liturgy so speaks, “We receive this child into the Congregation of Christ’s Flock, and sign him, etc. in token, etc.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c54d9e9900" data-kw="">
<blockquote><p>As the Divine will cannot but be perfect, so it cannot be wanting to render the highest love to itself, to its goodness, to the Divine nature, which is due to Him. Indeed, the acts of those, ad extra are not necessary, but upon a condition. To love righteousness without Himself, or to detect sin, or inflict punishment for the committing of it, could not have been, had there been no righteous creature for Him to love, no sinning creature for Him to loathe and to exercise his justice upon as the object of punishment. Some attributes require a condition to make the acts of them necessary, as it is at God’s liberty whether He will create a rational creature or no… It is at his liberty whether He will permit a creature to sin; but if He sees good to suffer it, it is impossible but that He should detest that creature that goes cross to his righteous nature. His holiness is not solely an act of his will, for then he might be unholy as well as holy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God, vol. 2 (Robert Carter, 1853), Discourse 11, ‘On the Holiness of God’</cite>, pp. 115-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

ne</a></div>

</figure><figure class="quote" id="q-39eaecf6b8" data-kw="">
<blockquote><p>1. If you turn not [in conversion], you cannot answer the end [design] of your creation. You must not think God gave you a being and sent you into the world to please yourselves, to satisfy your inordinate and corrupt desires, and to live carelessly and rebelliously against Him. But this you do until you are converted. Did the Lord give you an understanding faculty, and not design that He should be understood and known by you? Did He give you a heart to love and to desire, and not design Himself as the Chief Object of both? Did He give you affections that you should give them away to sin and vanity? Oh, do not cross the end [design] for which you were made any longer lest you cause the Lord to ‘repent and grieve’ at the heart He made you, Gen. 6:6, and so resolve to destroy the workmanship of His own hands…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conversion of a Sinner, Explained and Applied, a sermon on Eze. 33:11, 1669, in The Puritans on Conversion, reprinted Soli Deo Gloria, 1990</cite>, pp. 146</span></figcaption>

rmed Books Online</a></div>
</figure><figure class="quote" id="q-b8f4313300" data-kw="">
<blockquote><p>The general notion of the divine holiness is, that it is that attribute whereby God loves, and is pleased with, and delighted in his own native purity and goodness, and loves all holiness and purity in his rational creatures, and perfectly hates and abhors all sin… The very first apprehension we have of God’s being holy, is that… there is no impurity, stain or fault in Him…</p></blockquote>

</figure><figure class="quote" id="q-759465c850" data-kw="">
<blockquote><p>Other affections which are given to God metaphorically, and by an anthropopathy are 1. Anger, and its contrary, complacency or gentleness, which are improperly in God, for He is neither pleased nor displeased; neither can a sudden either pertubation or tranquillity agree to God; but by these the actions of God are declared, which are such as those of offended and pleased men are wont to be; viz. God by an eternal and constant act of his will approves obedience, and the purity of the creature, and witnessses that by some sign of his favor, but abhors the iniquity and sin of the same creature and shows the same, by inflicting a punishment, not less severe, but far more just than men are wont to do when they are hot with anger, Ex. 32:10, ‘Now therefore, let Me alone, that my wrath may wax hot against them, and that I may consume them…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, 1654), 2nd Book, ‘Of God’ | ch. 9, ‘Of the Affections of Anger &amp; Clemency, Given to God Metaphorically’</cite></span></figcaption>

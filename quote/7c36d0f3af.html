<main class="wrap"><figure class="quote" id="q-7c36d0f3af" data-kw="">
<blockquote><p>These we may look upon either, 1. as single persons; or, 2. as associated and combined in Societies, Kingdoms, Commonwealths, &amp;c. As single persons they are either vessels of mercy and honour, or vessels of wrath and dishonour. The former He subdueth by the Sceptre of His Gospel, and power of His grace, secretly, but effectually and infallibly, bowing and subjecting their souls and whole man to the government of His Spirit, constraining them by His love shed abroad in their hearts, and bringing them under a regiment of love, sweetening His commands with discoveries of His love, and (as it were) oiling His yoke with love, so making it easy to them, and teaching them to obey in love, and to walk in love as He hath loved them, and given Himself for them: giving His own Spirit possession of their hearts, and making them one with Himself, and so subjecting them to Himself as members to their Head.

And this He doth by degrees, leaving something in them unsubdued, while they are absent from Him in the body (which as it is displeasing to Him, so it is grievous to them) but in the end He will not leave anything in them either of soul or body unsuitable to Himself, but will bring them into a full subjection and conformity, transforming their bodies into the likeness of His own glorious body, and their souls into the likeness of His own perfect holiness, fullness of joy, and blessedness.

But although He useth this sweet way of working with them for this blessed end, as that which is most direct and proper, yet sometimes He prepareth them by terrors, putting on the countenance of an enemy, and handling them roughly, as Joseph did his Brethren, dealing with them in his approaches toward them as with the Prophet Elijah, sending before him a great and strong wind, renting the mountains, and breaking in pieces the rocks; and after the wind an earthquake, and after the earthquake, a fire; dreadful representations of His wrath, and convictions of their guilt: but after cometh the still, soft voice, the Word of promise and reconciliation, a word of peace and pardon. Yea when they are in some degree subdued to Him, He doth sometime suffer them to be exercised with renewed terrors on their spirits, and outward afflictions, to be troubled on every side, with fightings without, and fears within, to prepare them for farther subjection and conformity to Himself.

The workings of Christ in this kind have been more glorious and conspicuous in some ages than in others: as in the times of the Apostles and the ages next after, when thousands were subdued at once, Cities and Nations were brought in subjection to Christ: the devil raged, and stirred up his instruments to oppose the growth of Christ His kingdom with fire and sword: Nec eò minùs ad Apostolorum vocem gentes commoventur: principum aulae legiones{que} adeo ipsae in Christi partes propendent &amp; nutant, as one saith, the world is stirred notwithstanding at the summons of Christ His Ambassadors, and the Courts of Princes, and the legions of military men are ready to yield and bow their ensigns to the Majesty of the Lord Jesus. What a cordial was that which the Apostle sent to these believers at Philippi, All the Saints salute you, chiefly those of Caesar’s household.

A glorious spectacle to see the banner of Christ advanced upon the turrets of Nero his palace. So when Luther was raised up to restore the light, there was another age wherein Christ was pleased in a more than ordinary manner to shew himself victorious. The States of the Empire meeting at Nuremberg, thought to moderate things according to principles of policy: But what saith Luther to this? Longè aliter conclusum est in coelo quam Norembergae: The conclusion made in Heaven differed much from that at Nuremberg: as the event demonstrated. Certatim enim Principes &amp; Civitates Imperii doctrinam repurgatam introduxerunt: For the Princes and Imperial Cities did (as it were) out-vie each other in a speedy entertainment of the reformed Religion. Christ would not wait the leisure of the State.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maynard.html">John Maynard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A shadow of the victory of Christ, represented to the Honourable House of Commons, in a sermon preached at Margaret’s Westminster on the day of the publick fast, Octob. 28. 1646</cite>, (London: Samuel Gellibrand, 1646), pp 5-6.</span></figcaption>

<blockquote><p>When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.</p></blockquote>

<blockquote><p>In regard of Admission, God is a consuming fire, and we are but dried stubble, there is no approaching of him but in Christ, in whom we may have access with boldness to the throne of grace; God will not look pleasingly on you, if you come without Christ, here is no throne of grace without him; without Christ it is rather a Bar or Tribunal of justice, then a Throne of Grace.

It is Christ who makes that which was a Bar of justice, a Bench of mercy. In him we have admission. You go upon this Ordinance [of communion] now, but go not in the strength of your preparations, but in the strength of Christ. Say, Lord I come alone in the Merits of Christ, to partake of the Merits of the Lord Jesus. I come in the blood of Christ, to partake of the blood of the Lord Jesus. I have endeavoured to prepare and fit myself through thy grace, but I look not for admission through my preparations, but through the blood and mediation of Christ.</p></blockquote>

ovenanter</a></div>
</figure><figure class="quote" id="q-859bc63988" data-kw="">
<blockquote><p>With what different emotions of heart may we suppose Zaccheus received this invitation? Think you not that he was surprised to hear Jesus Christ call him by name, and not only so, but invite Himself to his house? Surely, thinks Zaccheus, I dream: it cannot be; how should He know me? I never saw Him before: besides, I shall undergo much contempt, if I receive Him under my roof. Thus, I say, we may suppose Zaccheus thought within himself. But what says the Scripture? “I will make a willing people in the day of my power.” [Ps. 110:3] With this outward call, there went an efficacious power from God, which sweetly over-ruled his natural will: and therefore, verse 6, “He made haste, and came down, and received him joyfully;” not only into his house, but also into his heart. … And thus it is with all, that, like Zaccheus, receive Jesus Christ by faith into their hearts: the very moment they find rest in Him, they are freely justified from all things from which they could not be justified by the law of Moses; “for by grace are we saved, through faith, and that not of ourselves, it is the gift of God. … You say you have faith; but how do you prove it? Did you ever hear the Lord Jesus call you by name? Were you ever made to obey the call? Did you ever, like Zaccheus, receive Jesus Christ joyfully into your hearts? Are you influenced by the faith you say you have, to stand up and confess the Lord Jesus before men? Were you ever made willing to own, and humble yourselves for, your past offenses? … He came not only to save, but to seek and to save that which was lost. He came to Jericho to seek and save Zaccheus; for otherwise Zaccheus would never have been saved by Him. But from whence came He? Even from Heaven, his dwelling-place, to this lower earth, this vale of tears, to seek and save that which was lost; or all that feel themselves lost, and are willing, like Zaccheus, to receive Him into their hearts to save them; with how great a salvation? … The power of his death and resurrection is as great now as formerly. Make haste therefore, make haste, O ye publicans and sinners, and give the dear Lord Jesus your hearts, your whole hearts. If you refuse to hearken to this call of the Lord, remember your damnation will be just: I am free from the blood of you all… Let all that love the Lord Jesus Christ in sincerity say, Amen.</p></blockquote>

</figure><figure class="quote" id="q-4f3926db77" data-kw="">
<blockquote><p>Saint Augustine makes it plain again, Non ideo non habet homo Deus non dat, sed quia homo non acipit [A man does not lack it because God does not give, but because the man does not receive]: men become hardened, and want the spirit of grace, why? Not because God does not offer it unto them, but because they receive it not, when it is offered. For example: One of us being sick and like[ly] to die, the physician knowing our case, he takes with him some preservative to comfort us, and comes to the door and knocks; if we will not or be not able to let him in, we perish and die, and the cause is not in the physician, but in ourselves that let him not in. Amartema nosema, ‘Sin is a disease’, whereof we are all sick, for we have all sinned: Rom. 6:12. Christ is the Physician of our souls: Venit de cœlo magnus medicus, quia per totum ubique iacebit agrotus [A great physician came from heaven, because everywhere the sick man lay throughout the whole world]. Christ the great Physician came down from heaven, because all mankind was generally infected. He comes to the door of our hearts and knocks, Rev. 3:20, “Behold, I stand at the door and knock.” He brings with Him arton tes zoes, ‘the bread of life’ [Jn. 6:35], his eternal Word to comfort us, if we let Him in, if we open the door of our hearts, He will come in and sup with us, as He did with Mary [Lk. 10], and forgive us all our sins; but if we will not, or through long contagion of our sin be not able to let Christ in, we die in our sins and the case is evident, not because Christ does not offer grace, and comfort unto us, but because we receive it not when it is offered, Merito perit agrotus qui non medicum vocat, sed ultre venientem respuit, ‘worthily does that sick patient perish, who will neither send for the physician himself, nor accept of his help when it is offered.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-maxey.html">Anthony Maxey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Golden Chain of Man’s Salvation</cite>, (London: T.E., 1607), 2nd Sermon, ‘God hardens not’, pp. 72-75 Maxey (d. 1618) was the dean of Windsor.</span></figcaption>

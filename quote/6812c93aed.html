<main class="wrap"><figure class="quote" id="q-6812c93aed" data-kw="">
<blockquote><p>Notwithstanding the delusions of the majority of “Ulster Prods”, the Covenanters have long recognised that Britain was a satanic and antichristian empire:

Britain has always been distinguished by a remarkable passion for war:- in fact, her vast empire has been built up almost entirely by the sword, and by the sword it must now be defended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Britain</cite>, still a horn of the beast (Banbridge, 1878), p. 48.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ee9865af2" data-kw="">
<blockquote><p>With that in mind, I contend that the best commonwealth is the one that has as its chief end, the common or public good, especially in relation to spiritual matters, the glorifying and enjoying of God forever. If this is the chief end of man, it ought to be the chief end of every institution in the world, whether government, school, family, or religious assembly… If the chief end of government is the public good, as the [Westminster] Confession says and the American founders said, especially the spiritual welfare of its subjects, then he [the magistrate] must both decide what is true religion for himself and promote it. The most obvious means is the enforcement of God’s moral law, classically understood as both tables of the Decalogue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-lynch.html">Michael Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Almost Christian Nationalist”</cite>, (2025) at American Reformer</span></figcaption>

</figure><figure class="quote" id="q-e81afad5ea" data-kw="">
<blockquote><p>It is an agreed principle of theological and sociological teaching that Catholic citizens should not vote for leaders who are inimical to Christianity… It is, however, held to be lawful to vote for an unworthy candidate in certain circumstances—for instance, if this is necessary to exclude an even more unsuitable one, or if failure to vote for a particular candidate would involve disproportionate personal loss, or if there is good hope, all things considered, that the election of this candidate may ultimately conduce to the common good… To sum up then: we agree that normally Catholics should not vote for non-Christian candidates. But if it is clear, when account is taken of the circumstances of person and place, that a particular non-Christian candidate is willing to act in accordance with Christian principles, we think that it is not unlawful to vote for him…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-canon-mccarthy.html">John Canon McCarthy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems in Theology II: the Commandments</cite>, (Dublin, 1959), sect. 2, 1st &amp; 2nd Commandments, ‘The Morality of Voting for Non-Christians’, pp. 86-88 McCarthy was a Romanist professor of moral theology.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

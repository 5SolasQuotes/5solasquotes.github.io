<main class="wrap"><figure class="quote" id="q-051552193e" data-kw="">
<blockquote><p>That disease is curable for which a sovereign medicine may be found, but cured it is not till the medicine be applied to the patient; and if it so fall out, that the medicine being not applied, the party miscarries, we say he was lost, not because his sickness was incurable, but because there wanted a care to apply that to him that might have helped him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, p. 570</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-9268f81703" data-kw="">
<blockquote><p>In fact it seems much more accurate to say that Amyraut was the real Reformed “scholastic,” and “Reformed Thomas Aquinas,” the balancer, the synthesizer, the creator of new categories, and structures. And Reformed orthodoxy, with its insistence on limited redemption, was actually a primitive throwback to the rigorous and markedly non-rationalistic particularism of Augustine and Gottschalk. Under whatever label, John Calvin, as a limited redemptionist, belongs historically with Augustine, Gottschalk, Bucer, Beza and Reformed orthodoxy–not with Amyraut.</p></blockquote>

</figure><figure class="quote" id="q-755e0e1434" data-kw="">
<blockquote><p>The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, p. 559</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…”

quote/755e0e1434.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=The%20first%20contains%20the%20preparation%20of,was%20of%20the%20depraving%20of%20it&amp;text=The%20first%20contains%20the%20preparation%20of%20the%20remedy&amp;text=as%20Adam%20was%20of%20the%20depraving%20of%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-87bc282954" data-kw="">
<blockquote><p>But if to believe that Christ died for oneself is the same thing as to believe that the death of Christ is sufficient of itself to expiate one’s sins, we do not deny that reprobates are also bound to believe this: which is perfectly true, whether they believe it, or not. For, the value of Christ’s death is such, that it is of itself sufficient for the altogether complete expiation of the sins of all men, even if they should be ten thousand times more: even if God did not determine it for the expiation of the sins of all. So indeed in this controversy it is customary among many to make a distinction, that they say, that Christ died sufficiently for all, even reprobates; but efficiently only for the elect: which words, suitably explained, and applied to amplify the value of the merit of Christ, we readily admit: even if we have not made use of this distinction from the beginning: because the impropriety in the words appears to be overly harsh. For to [have] died for someone, if we speak properly, is to die for the favor of someone, or in the place of someone, so that he might be delivered from death: and if a voluntary death is met for another, it presupposes the greatest possible love, as Christ testifies, Jn. 15:13. Now, if you should add, ‘sufficiently only, not efficiently’, this not very suitable sense will emerge: Christ, impelled by the greatest possible charity, died in the place of reprobates, so that they might be delivered from death, sufficiently indeed, but not efficiently, that is, they are never actually delivered. Those that say, that Christ dies also for reprobates, not indeed so that they might actually be delivered, but so that they might be able to be delivered, tacitly suppose (or they really do not say anything relevant), that it is in the power and ability of reprobates to apprehend Christ’s offered merit by faith: since without faith they are not even able to be delivered. Likewise (which I wish properly to be observed), that God decreed from eternity to save all men and each through Christ, under this condition, that they believe upon Christ, the Redeemer of all men and each. Which no Orthodox theologian would admit, as Pelagian or Semi-pelagian dogma. I leave unmentioned, that God foreknew from eternity, that a great many were not going to believe, and that He decreed that He was not going to give faith to them, which is not able to be had, except with Him freely giving. Why then would He have decree salvation, and have determined means of salvation, that is, the death of His Son, under a condition, which He foreknew that He was not going to fulfill, and the ability of the fulfilling of which He denied in His eternal decree. Not even man plans so imprudently. But let us dismiss these things. Nevertheless, we think that it is more rightly and plainly said, that the death of Christ is sufficient in itself for the expiation of all the sins of men, than, Christ died sufficiently for all, even reprobates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 3 Wendelin admits that Christ died for the world to make a sufficient atonement for all, yet Christ dying for someone properly means to deliver them; hence he does not like the language of Christ dying for all sufficiently. He then argues against hypothetical universalism.</span></figcaption>

ivered+from+death%2C+sufficiently+indeed%2C+but+not+efficiently%2C+that+is%2C+they+are+never+actually+delivered.+Those+that+say%2C+that+Christ+dies+also+for+reprobates%2C+not+indeed+so+that+they+might+actually+be+delivered%2C+but+so+that+they+might+be+able+to+be+delivered%2C+tacitly+suppose+%28or+they+really+do+not+say+anything+relevant%29%2C+that+it+is+in+the+power+and+ability+of+reprobates+to+apprehend+Christ%E2%80%99s+offered+merit+by+faith%3A+since+without+faith+they+are+not+even+able+to+be+delivered.+Likewise+%28which+I+wish+properly+to+be+observed%29%2C+that+God+decreed+from+eternity+to+save+all+men+and+each+through+Christ%2C+under+this+condition%2C+that+they+believe+upon+Christ%2C+the+Redeemer+of+all+men+and+each.+Which+no+Orthodox+theologian+would+admit%2C+as+Pelagian+or+Semi-pelagian+dogma.+I+leave+unmentioned%2C+that+God+foreknew+from+eternity%2C+that+a+great+many+were+not+going+to+believe%2C+and+that+He+decreed+that+He+was+not+going+to+give+faith+to+them%2C+which+is+not+able+to+be+had%2C+except+with+Him+freely+giving.+Why+then+would+He+have+decree+salvation%2C+and+have+determined+means+of+salvation%2C+that+is%2C+the+death+of+His+Son%2C+under+a+condition%2C+which+He+foreknew+that+He+was+not+going+to+fulfill%2C+and+the+ability+of+the+fulfilling+of+which+He+denied+in+His+eternal+decree.+Not+even+man+plans+so+imprudently.+But+let+us+dismiss+these+things.+Nevertheless%2C+we+think+that+it+is+more+rightly+and+plainly+said%2C+that+the+death+of+Christ+is+sufficient+in+itself+for+the+expiation+of+all+the+sins+of+men%2C+than%2C+Christ+died+sufficiently+for+all%2C+even+reprobates.%E2%80%9D%0A%0A%E2%80%94+Marcus+F.+Wendelin%2C+Christian+Theology+3rd+ed.+%281634%29%2C+Species+of+the+Office+of+Christ%2C+pt.+3+Wendelin+admits+that+Christ+died+for+the+world+to+make+a+sufficient+atonement+for+all%2C+yet+Christ+dying+for+someone+properly+means+to+deliver+them%3B+hence+he+does+not+like+the+language+of+Christ+dying+for+all+sufficiently.+He+then+argues+against+hypothetical+uni

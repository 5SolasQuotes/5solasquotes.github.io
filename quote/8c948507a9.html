<main class="wrap"><figure class="quote" id="q-8c948507a9" data-kw="">
<blockquote><p>29. The church goods should not be wasted, but be bestowed on the maintenance of ministers, and other godly uses. And whereas many goods have in times past, and yet in some places are given to churches, by the liberality of princes and other godly persons: we judge that if any church have such goods, great care is to be had that the same be not wasted nor converted into profane uses, and much less into sacriligious uses, nor feigned to be so converted: but to be only bestowed upon that purpose whereto they were given, even to a godly intent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Body of Christian Religion</cite>, (d. 1590; London, 1659) | ch. 25, ‘Of the Government of the Church-Militant’, doctrine 29, ‘That the goods of the Churches are not to be embezzled, but distributed to the support of Ministers &amp; other godly uses’, pp. 339-340</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“29. The church goods should not be wasted, but be bestowed on the maintenance of ministers, and other godly uses. And whereas many goods have in times past, and yet in some places are given to churches, by the liberality of princes and other godly persons: we judge that if any church have such goods, great care is to be had that the same be not wasted nor converted into profane uses, and much less into sacriligious uses, nor feigned to be so converted: but to be only bestowed upon that purpose whereto they were given, even to a godly intent.”

</figure><figure class="quote" id="q-810bf8d936" data-kw="">
<blockquote><p>But we read not” (says Erastus) “where Christ has changed those laws in the New Testament.” It is true, Christ has not said in particular: “I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated till the evening;” nor has He said particularly of every carnal ordinance and judicial law: “it is abolished.” But we conceive the whole bulk of the Judicial Law, as judicial, and as it concerned the republic of the Jews only, is abolished, though the moral equity of all those be not abolished… … But sure Erastus errs who will have all such to be killed by the magistrate under the New Testament because they were killed by him in the Old: Why, but then the whole judicial law of God shall oblige us Christians as Carolostadius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them [the malefactors], so was it a mysterious teaching of us how God hated such and such sins; and mysteries of that kind are gone with other shadows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. Travis Fentiman, ‘Samuel Rutherford on the Judicial Laws of Moses: Excerpts Arranged Topically’, pp. 4-6, 23 | Divine Right of Church Government (1646), pp. 383, 493-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

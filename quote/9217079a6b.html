<main class="wrap"><figure class="quote" id="q-9217079a6b" data-kw="">
<blockquote><p>By ‘nature’ he means the ‘natural inclination’ in women to take care of their hair, which is a natural covering, but not in men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, v. 16:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“By ‘nature’ he means the ‘natural inclination’ in women to take care of their hair, which is a natural covering, but not in men.”

— Thomas Aquinas, 1 Cor. 11 in Commentary on 1 Corinthians | on v. 16:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+%E2%80%98nature%E2%80%99+he+means+the+%E2%80%98natural+inclination%E2%80%99+in+women+to+take+care+of+their+hair%2C+which+is+a+natural+covering%2C+but+not+in+men.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+1+Cor.+11+in+Commentary+on+1+Corinthians+%7C+on+v.+16%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9217079a6b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9217079a6b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/#:~:text=By%20%E2%80%98nature%E2%80%99%20he%20means%20the%20%E2%80%98natural,natural%20covering%2C%20but%20not%20in%20men&amp;text=By%20%E2%80%98nature%E2%80%99%20he%20means%20the%20%E2%80%98natural%20inclination%E2%80%99%20in&amp;text=is%20a%20natural%20covering%2C%20but%20not%20in%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-91a53fdb92" data-kw="">
<blockquote><p>…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms: a Gospel Ordinance</cite>, … (London, 1650), ch. 10, ‘Of the Manner of Singing’, pp. 58-59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.”

</figure><figure class="quote" id="q-222c5d810c" data-kw="">
<blockquote><p>given her hair for a covering. There have been books written about the lawfulness or unlawfulness of men’s wearing long hair, and the due or undue lengths of men’s hair, the substance of which were too much to transcribe here. That which in these verses seems to be commended to us, as the will of God in this matter, is: 1. That men and women should so order their hair, as by it to preserve the distinction of sexes. 2. That men should not wear their hair after the manner of women, either disheveled, or curled, and tricked up about their heads, which speaks too much of an unmanly and effeminate temper, much more was what became not Christians. And if this be forbidden men, as to the use of their own hair, they stand concerned to consider whether it be lawful for them thus to wear and adorn themselves with the hair of other men and women.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 15</span></figcaption>

<main class="wrap"><figure class="quote" id="q-590967fef6" data-kw="">
<blockquote><p>…it seems the angels were made before the stars; for the sons of God, by which are meant the angels, are said to shout for joy at the first appearing of the morning stars, Job 38:7. In this diversity of opinions for the time of the creation, we conceive that in the six days’ space and before the last day there is no error of danger which way soever we take it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ley.html">John Ley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the books of the Old &amp; New Testament</cite>, (London: Legatt, 1645), On Genesis | on Gen., 1:31</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac26449f03" data-kw="six days creation">
<blockquote><p>Creation may be viewed either in general with regard to the production of the whole universe, or in particular with regard to the production of its various parts in the six days of creation. In the latter, their creation is first set forth, then their distinction and lastly their adornment. In all these, God demonstrates his power splendidly in the production of all things (great as well as small) ex nihilo by his word alone; his wisdom, in their variety, order and use; his goodness, in the communication of himself (by which he made all things very good).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1</span></figcaption>

</figure><figure class="quote" id="q-6a3cda8d11" data-kw="">
<blockquote><p>But even according to what was said above (A. 2), that these names signify the divine substance, although in an imperfect manner, it is also clear from what has been said (AA. 1, 2) that they have diverse meanings. For the idea signified by the name is the conception in the intellect of the thing signified by the name. But our intellect, since it knows God from creatures, in order to understand God, forms conceptions proportional to the perfections flowing from God to creatures, which perfections pre-exist in God unitedly and simply, whereas in creatures they are received and divided and multiplied. As therefore, to the different perfections of creatures, there corresponds one simple principle represented by different perfections of creatures in a various and manifold manner, so also to the various and multiplied conceptions of our intellect, there corresponds one altogether simple principle, according to these conceptions, imperfectly understood. Therefore although the names applied to God signify one thing, still because they signify that under many and different aspects, they are not synonymous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 13 | art. 4, I answer that</span></figcaption>

</figure><figure class="quote" id="q-551d5463ad" data-kw="">
<blockquote><p>If all mixed perfections are reducible to a plurality of pure perfections existing in limited degree, and if an infinite being possesses all pure perfections, the consequent is that God in some way possesses every positive perfection that is found or can be found in creatures, and indeed possesses it in unlimited degree. Accordingly God seems to differ from creatures by something positive not possessed by creatures. Creatures, by contrast, do not seem, in the ultimate analysis, to differ from God by any positive perfection precisely but rather because they lack some perfection that God has. This notion is also expressed in the theory of participation, according to which creatures are finite or imperfect likenesses of God insofar as any perfection possessed by them is found in God either formally or virtually or eminently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

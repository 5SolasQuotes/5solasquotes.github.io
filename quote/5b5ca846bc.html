<main class="wrap"><figure class="quote" id="q-5b5ca846bc" data-kw="">
<blockquote><p>Yes, you say, but many of the fathers were saved and even became teachers without the languages. That is true. But how do you account for the fact that they so often erred in the Scriptures? How often does not St Augustine err in the Psalms and in his other expositions, and Hilary too – in fact, all those who have undertaken to expound Scripture without knowledge of the languages? Even though what they said about a subject at times was perfectly true, they were never quite sure whether it really was present there in the passage where by their interpretation they thought to find it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Councilmen of all cities in Germany that they Establish and Maintain Christian Schools</cite>, (1524), trans. A. T. W. Steinhaeuser, rev. W. I. Brandt in Luther’s Works: The Christian in Society II, ed. W. I. Brandt (55 vols, Philadelphia: Fortress Press, 1962), 45: 361.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-122c26acb8" data-kw="Perspicuity">
<blockquote><p>For we never said that every thing in scripture is easy, perspicuous, and plain; that there is nothing obscure, nothing difficult to be understood; but we confess openly that there are many obscure and difficult passages of scripture … We hold the contrary, that the scriptures are not so difficult but that they may be read with advantage, and ought to be read, by the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 4, ch. 1</span></figcaption>

</figure><figure class="quote" id="q-a178804e77" data-kw="">
<blockquote><p>The Psalter is of all books of the Bible that book which gives expression to the experimental side of religion. In the law and the prophetic writings, it is God who speaks to his people; but in the Psalter we listen to the saints speaking to God. Hence the Psalter has been at all times that part of Scripture to which believers have most readily turned and upon which they have chiefly depended for the nourishment of the inner religious life of the heart.

I say that part of Scripture and not merely that part of the Old Testament, for even taking the Old and New Testament together the common experience of the people of God affirms that there is nothing in Holy Writ which in our most spiritual moments – when we feel ourselves nearest to God – so faithfully and naturally express what we think and feel in our hearts as these songs of the pious Israelites.

Our Lord himself, who had a perfect religious experience and lived and walked with God in absolute adjustment of his thoughts and desires to the Father’s mind and will, our Lord himself found his inner life portrayed in the Psalter and in some of the highest moments of his ministry borrowed from it the language in which his soul spoke to God, thus recognizing that a more perfect language for communion with God cannot be framed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Glory: Sermons Preached in the Chapel of Princeton Theological Seminary</cite>, (1922; Edinburgh: Banner of Truth, 1994), pp 169-70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

nanter.wordpress.com/2018/10/16/geerhardus-vos-on-the-psalter-and-christian-experience/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-b1c502ae28" data-kw="">
<blockquote><p>The question then comes to this—whether the Scriptures are so plain in things essential to salvation (not as to the things delivered, but as to the mode of delivery; not as to the subject, but the object) that without the external aid of tradition or the infallible judgment of the church, they may be read and understood profitably by believers. The papists deny this; we affirm it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>
<div class="actions"><button class="copy" data-copy="“The question then comes to this—whether the Scriptures are so plain in things essential to salvation (not as to the things delivered, but as to the mode of delivery; not as to the subject, but the object) that without the external aid of tradition or the infallible judgment of the church, they may be read and understood profitably by believers. The papists deny this; we affirm it.”

— Francis Turretin, Institutes of Elenctic Theology, 2.17.7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20question%20then%20comes%20to%20this%E2%80%94whether%20the%20Scriptures%20are%20so%20plain%20in%20things%20essential%20to%20salvation%20%28not%20as%20to%20the%20things%20delivered%2C%20but%20as%20to%20the%20mode%20of%20delivery%3B%20not%20as%20to%20the%20subject%2C%20but%20the%20object%29%20that%20without%20the%20external%20aid%20of%20tradition%20or%20the%20infallible%20judgment%20of%20the%20church%2C%20they%20may%20be%20read%20and%20understood%20profitably%20by%20believers.%20The%20papists%20deny%20this%3B%20we%20affirm%20it.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%202.17.7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb1c502ae28.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b1c502ae28.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-494e09445d" data-kw="">
<blockquote><p>Liberty is the privilege to do what is right to be done — to teach what is known to be true. Liberty has its controlling laws. Great as is the human mind, and free as it undoubtedly is, it is not great enough, nor can it claim a freedom so irresponsible, to think or pronounce imperfect what God has declared to be “true and righteous altogether.” Belief in a defective Bible is no part of intellectual freedom. And in the oft-uttered and strongly-emphasized declaration that the Bible, freed from the errors of transcribers and translators, and as it came from God, is without error, no restraint is put on reverent scholarship.

It is not necessary to talk boastfully of “the faith that cannot be put into creeds,” or of “the word of God behind the Bible,” in order to assert one’s independence of mind. Scholarship, the profoundest, the loftiest, the widest, the ripest, causing all languages and literatures, all precepts and principles, all faiths and philosophies, to pay tribute to the Lord God of truth and righteousness, is welcome in the Theological Schools of our Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-a-brownson.html">Marcus A. Brownson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Charge in Robert Dick Wilson, The Lower Criticism of the Old Testament as a Preparation for the Higher Criticism. Inaugural Address of the Rev. Robert Dick Wilson, Ph.D., D.D., as Professor of Semitic Philology and Old Testament Criticism in the Theological Seminary of the Presbyterian Church Pr</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

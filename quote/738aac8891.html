<main class="wrap"><figure class="quote" id="q-738aac8891" data-kw="" data-pol="">
<blockquote><p>As we believe and confess the Scriptures of God sufficient to instruct and make the man of God perfect; 2 Tim. iii. 16, 17. so do we affirm and avow the authority of the same to be of God, and neither to depend on men nor angels. We affirm, therefore, that such as allege the Scripture to have no other authority but that which it hath received from the Church, are blasphemous against God, and injurious to the true church; which always heareth and obeyeth the voice of her own Spouse and Pastor</p></blockquote>
<figcaption>— <a href="../authors/scottish-reformers.html">Scottish Reformers</a>, <cite>The Scots Confession (1560)</cite>, Art. 19</figcaption>
<div class="meta"><a class="tag" href="../topics/scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../topics/scripture/authority.html">Authority</a><a class="tag" href="../topics/church/confessions.html">Confessions &amp; Creeds</a></div>

<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>
<figcaption>— <a href="../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption>

</figure><figure class="quote" id="q-0a2dfef12d" data-kw="" data-pol="">
<blockquote><p>It has been assumed that Theology has to do with the facts or truths of the Bible; in other words, that the Scriptures of the Old and New Testaments are the only infallible rule of faith and practice. This, however, is not a conceded point. Some claim for Reason a paramount, or, at least a coördinate authority in matters of religion. Others assume an internal supernatural light to which they attribute paramount, or coördinate authority. Others rely on the authority of an infallible church. With Protestants, the Bible is the only infallible source of knowledge of divine things.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. II</figcaption>
<div class="meta"><a class="tag" href="../topics/scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../topics/scripture/authority.html">Authority</a></div>

</figure><figure class="quote" id="q-6165730314" data-kw="" data-pol="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</figcaption>
<div class="meta"><a class="tag" href="../topics/scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../topics/scripture/authority.html">Authority</a></div>

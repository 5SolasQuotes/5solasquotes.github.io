<main class="wrap"><figure class="quote" id="q-bd504990fc" data-kw="">
<blockquote><p>The root of all good works is the hope of the Resurrection; for the expectation of the recompense nerves the soul to good works. For every labourer is ready to endure the toils, if he sees their reward in prospect; but when men weary themselves for nought, their heart soon sinks as well as their body. A soldier who expects a prize is ready for war, but no one is forward to die for a king who is indifferent about those who serve under him, and bestows no honours on their toils. In like manner every soul believing in a Resurrection is naturally careful of itself; but, disbelieving it, abandons itself to perdition.

He who believes that his body shall remain to rise again, is careful of his robe, and defiles it not with fornication; but he who disbelieves the Resurrection, gives himself to fornication, and misuses his own body, as though it were not his own. Faith therefore in the Resurrection of the dead, is a great commandment and doctrine of the Holy Catholic Church; great and most necessary, though gainsaid by many, yet surely warranted by the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyril-of-jerusalem.html">Cyril of Jerusalem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechetical Lectures</cite>, (c. 350), XVIII.1 in Nicene and Post-Nicene Fathers 2, 7: 134.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af53ab3b82" data-kw="">
<blockquote><p>Obj. The resurrection of Christ is declared by the Apostle to be the cause of our resurrection, and our resurrection is the effect, or benefit of Christ&#x27;s resurrection. But this cause does not extend to the wicked. Therefore they will not rise. Ans. Although the wicked will not rise because of the resurrection of Christ, yet they shall, nevertheless, be raised on account of the just judgment of God. by which they shall be consigned to everlasting punishment. For there may be many and different causes, (if not in number, at least in kind,) especially in different subjects, of one and the same effect. The cause of the resurrection of the godly is, therefore, the resurrection of Christ as of the head. But the resurrection of Christ is not the cause of the resurrection of the wicked, because they are not members of Christ, but the justice of God, and the truth of his threatening Briefly; the wicked shall rise from the dead, not because Christ rose, but on account of the justice of God, that they may be punished.</p></blockquote>

</figure><figure class="quote" id="q-1d18119d92" data-kw="">
<blockquote><p>First, by His resurrection He has overcome death, that He might make us partakers of the righteousness which He has obtained for us by His death. Secondly, by His power we are also now raised up to a new life. Thirdly, the resurrection of Christ is to us a sure pledge of our blessed resurrection.</p></blockquote>

</figure><figure class="quote" id="q-38afa42374" data-kw="">
<blockquote><p>…Aquinas’s conception of the resurrection… holds that the soul of a person persists between death and resurrection, so that there is continuity between the person who died and the later person whose body is indistinguishable from that of the person who died. If Socrates is ressurected, he will be Socrates and not a mere replica because the same one soul, which had informed the matter of Socrates’ body before he died, comes to inform that matter again… Another thing philoophy can tell us is that if a resurrection were to occur, only God could bring it about. That, in any event, was Aquinas’s view (Cf. Summa Theologiae, Supplement, 75.3). Natural material causes can no more reunite soul and body than they could generate a soul in the first place. Nor could even an angelic intellect reunite a soul and its body, since angels can only manipulate natural causes, even if they can do so more powerfully than we can (Cf. Summa Theologiae I.65.3-4 and I.105.1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, pp. 519-21 of Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 11</span></figcaption>

%20I.65.3%2D4%20and%20I.105.1" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-24fdbe45f0" data-kw="">
<blockquote><p>WHAT Luther said of Justification by Faith, that may we concerning the Resurrection of the dead, Articulus est Ecclesiae stantis, aut cadentis; it is an Article with which the Church standeth or falleth; Yet so foul an error had taken the head of some Members in the Church of Corinth, as to deny this grand Truth, which St Paul calls in another place, one of the principles of the Doctrine of Christ: how say some among you, there is no Resurrection of the dead? v. 12.

And, is it not strange, that such who professed to believe the Resurrection of Christ should deny their own! but much more, that any in the Church of Corinth (especially in those early days) should have such a darkness found upon their minds, who stood so near the rising Sun? and that while St Paul himself was yet alive, who had planted this Church; by this we see, though Truth is errors elder, yet error is not much Truths younger. Though the Gospel-Church was purest in the Primitive times, yet it soon began to corrupt in its Members. Not unapt therefore was his saying, who compared (in this respect) the gathering of Churches to the gathering of Apples, which when first gathered, may appear all fair and sound, but then within a while, some amongst them begin to speak, and others to discover their rottenness.

No doubt this Church of Corinth, and so others gathered by the rest of the Apostles, appeared in their Members very sound in the faith, and fair in their lives at their first embracing of the Gospel; yet some we see did thus soon discover corruption in both. Now to recover the tainted, and especially to preserve the sound from this dangerous infection, the Apostle sets himself to defend this Article of our Faith, well knowing, that this was a blow made at the root of Christianity; which must needs fall to the ground, if this cannot be maintained; and he doth it with such invincible arguments, that if any Heretic shall now deny it, the reason cannot be deficiency in the proof here given, but rather a criminous conscience in himself, which makes him on his own defence, deny a Resurrection, for fear of the Judgment which attends it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Labour and Reward, or, A Sermon, part of which was Preached at the Funeral of the Right Honourable the Lady Mary Vere, relict of Sir Horace Vere, Baron of Tilbury, on the 10th of January, 1671, at Castle Heviningham in Essex</cite>, (London: Ralph Smith, 1672), pp 1-3.</span></figcaption>

+both.+Now+to+recover+the+tainted%2C+and+especially+to+preserve+the+sound+from+this+dangerous+infection%2C+the+Apostle+sets+himself+to+defend+this+Article+of+our+Faith%2C+well+knowing%2C+that+this+was+a+blow+made+at+the+root+of+Christianity%3B+which+must+needs+fall+to+the+ground%2C+if+this+cannot+be+maintained%3B+and+he+doth+it+with+such+invincible+arguments%2C+that+if+any+Heretic+shall+now+deny+it%2C+the+reason+cannot+be+deficiency+in+the+proof+here+given%2C+but+rather+a+criminous+conscience+in+himself%2C+which+makes+him+on+his+own+defence%2C+deny+a+Resurrection%2C+for+fear+of+the+Judgment+which+attends+it.%E2%80%9D%0A%0A%E2%80%94+William+Gurnall%2C+The+Christian%E2%80%99s+Labour+and+Reward%2C+or%2C+A+Sermon%2C+part+of+which+was+Preached+at+the+Funeral+of+the+Right+Honourable+the+Lady+Mary+Vere%2C+relict+of+Sir+Horace+Vere%2C+Baron+of+Tilbury%2C+on+the+10th+of+January%2C+1671%2C+at+Castle+Heviningham+in+Essex%2C+%28London%3A+Ralph+Smith%2C+1672%29%2C+pp+1-3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F24fdbe45f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/24fdbe45f0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/21/william-gurnall-the-fundamental-doctrine-of-the-resurrection-from-the-dead/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>(c) Nor is a thing necessary properly speaking unless it is produced from a necessary proximate cause, that is, such a cause that is determined by its own nature to such an effect; however, the decree of reprobation does not imply such a cause, although it does imply a certain and indeclinable futurity, which is as different from necessity as heaven from earth. [It is objected] (2) That this reprobation makes God the author of all sin, inasmuch as it predestined and necessitates the sinner to sinning. I respond: (a) It does not make it that the sinner sins necessarily, or that he does so determined by his own nature to sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3; ch. 4, section 11, Objections, p. 88</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d5dd1809c" data-kw="">
<blockquote><p>…the Reformers and older Calvinistic divines ascribed to man before his fall a freedom or liberty of will which they denied to man as he is, and that the only necessity or bondage which they ascribed to man as he is, was an inability to will what is spiritually good and acceptable to God, as a result or consequence simply of the entire depravity of his moral nature–i.e., of his actual dispositions and tendencies. This was the only necessity they advocated as having anything like direct and explicit sanction from scripture, or as indispensably necessary to the exposition and defence of their system of theology–not a necessity deduced from anything in God’s purposes and providence, or from anything in men’s mental constitution applicable to men, as men, or simply as creatures, but from a special feature in men’s character as fallen and depraved. This necessity or bondage under which they held man fallen, as distinguished from man unfallen, to lie, resolved itself into the entire absence in fallen man of holy and good dispositions or tendencies, and the prevalence in his moral nature of what is ungodly and depraved; and thus stood entirely distinct from, and independent of, those wider and more general considerations, whether philosophical or theological, applicable to man as man, having a certain mental constitution, or as a dependent creature and subject of God, on the ground of which the controversy about liberty and necessity has been of late commonly conducted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, ‘The Doctrine of the Will’, p. 585</span></figcaption>

</figure><figure class="quote" id="q-fe31d700a8" data-kw="">
<blockquote><p>First therefore they say, If so be we are not able to do any thing towards our salvation, this is to turn men into stocks and stones, or beasts, and so [there is] no difference between them and us. But we say, Although those similitudes the Scripture holds forth do prove our inability for that which is good, yet they must not be made alike in all things. It’s true, to convert men, is to make children unto Abraham out of stones; yet we must not think that is therefore an universal likeness between men and stones: For first, consider this vast dissimilitude; In stones and beasts there is no passive capacity of grace, but in man there is. We say, there is a power for grace in a man’s nature; and the Papists say, there is a power: only they say it’s an active power, though remote; we say, only a passive. There is a power to be converted to God, which is not in stones or beasts: they say, there is a power to convert or turn to God; here is a great difference. Besides, we may consider these degrees in the creatures:

1. There is an inclination to such an act, as in the fire to burn.

2. A spontaneous inclination to some acts accompanied with sense, and sensible apprehensions, as in beasts.

3. A willing inclination accompanied with reason or judgment, and this is in man: Now, because man is thus affected, therefore God in converting, though He does it by a potent work, yet by arguments, which we never use to horses, or brute beasts: and although man has lost that rectitude in his will and mind, yet he has not lost the faculties themselves; therefore though he be theologically dead, yet he is ethically alive, being to be wrought upon by arguments. Hence is that saying, ‘To will is of nature, to will well of grace; to will ill of corrupt nature.’ Hence we may grant those objections, that if a man had not this free-will (if you do not extend it to good things) there could be no conversion or obedience; for grace does not destroy, but perfect nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London: Young, 1647), Lecture 10, pp. 94-95</span></figcaption>

</figure><figure class="quote" id="q-a1a48e9131" data-kw="">
<blockquote><p>Holding the distinction of natural and moral ability and inability, decides nothing in this behalf, because these terms are used by different men in different senses. Some mean by natural ability, plenary [complete] ability, in the full Pelagian sense; others mean, a partial, or gracious; an Arminian, or Semi-Pelagian ability. The orthodox, however, use it, if at all, simply to denote the natural faculties of understanding, desire, and will, which are essential to moral agency and responsibility, and belong to man, as such, whether unfallen, fallen, or renewed by grace. So, by moral inability, the former class [of Pelagians and Arminians] mean merely an aversion or unwillingness which the sinner can remove by his own will. The old Calvinists mean by moral inability, that indeed which characterizes fallen man; but still that which is real, which the subject of it cannot, while the Almighty power of God can, remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lyman-atwater.html">Lyman Atwater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Witherspoon’s Theology’, The Biblical Repertory &amp; Princeton Review</cite>, (1863), pp. 598-99</span></figcaption>

<blockquote><p>Thesis XX. Whence it appears not only that all and every heir of Adam is universally corrupt, but also totally corrupt, namely both with respect to the soul, and with respect to the body, and finally with respect to the whole composite being. For it should not be thought as if only the body were corrupt, or even only the soul, but the whole man, as great as he is, is corrupt. For just as the image of God was not in the soul alone, nor even in the body alone, but in man and therefore in the whole composite, so also this original sin should be attributed not only to the soul and body, but to the whole composite consisting of soul and body; which can be best gathered from the opposite, regeneration, which pertains not to one or the other part of man, but to the whole man. … Thesis XXII. That the soul is corrupt is, alas, sufficiently clear from the depravation both of the intellect, which, although it may discern something in matters contributing to the convenience of civil life, yet in spiritual matters pertaining to the true worship of God and the salvation of our soul, it is not so much dim-sighted as blind, unless the Lord gives a mind to understand, eyes to see, etc. For its wisdom is enmity against God, holding those things which are of the Spirit of God for foolishness. And although worldly men sometimes understand something, yet they have it not from flesh and blood, but from the revelation of God the heavenly Father. Then of the will, which is placed in the same plight as the intellect. For original sin has so depraved the will that it in no way wills the spiritual good, namely, neither with respect to substance, nor with respect to manner, that is, from faith and for the glory of God. Whence the heart of man is not undeservedly called fraudulent, hardened, whose imagination is evil from his youth. Thesis XXIII. The body is so corrupt that, first in general, our members present themselves as weapons of unrighteousness for sin; then in particular, the mouth is full of curses and bitterness; the tongue is deceitful and the lips are filled with the venom of asps; the throat is an open sepulcher; the eyes are either lustful and evil; the hands are ready for theft; the belly is a god; the knees are bent to idolatry; the feet are swift to shed innocent blood.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 88</span></figcaption>

</figure><figure class="quote" id="q-153252dd43" data-kw="">
<blockquote><p>These [formerly mentioned] separations are duty, and unto duty, but for a Corinthian to separate from God’s Church and God’s ordinance because some come unworthily to the Lord’s Table is no duty; because there is no command, it is no duty; and therefore we read not this word, ‘Come forth,’ in any of those epistles written to the seven Churches, Rev. 2-3, against which Christ says He ‘hath such and such things;’ they that lived in the impurer [church] are not called forth into the purer [church], but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part, for we may not make these churches and Babylon all one, nor make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s presence because Satan came also amongst them? Job 1:6. Must Shem and Japhet leap out of Noah’s Ark, because there is a Ham there? Would not our Savior rather have sent for John Baptist to have baptized Him rather than Himself have come from Nazareth to Bethabara, which some compute fourteen Dutch miles, that’s of ours fifty six? If that generation of vipers that came also to John’s baptism had either polluted the water, or the ordinance unto Christ? Mt. 3:7, 14. The abuses reproved were such as depraved the ordinance, and the corruptions [were] such as put themselves forth in the communicants at the very time of their participation. The Lord’s Supper was so intermeddled with their festival cheer as the difference between the Lord’s body and their own repast [meal] was not truly made. They discerned not the Lord’s body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper</cite>, (London: 1657), ch. 2, pp. 31-32</span></figcaption>

<blockquote><p>‘Ye shall not do’ (says Moses) ‘after all things, which we do here this day, every man, all that is right in his own eyes.’ [Dt. 12:8]… And the speech of Moses seems to mean the true service of God, which was not yet perfected, neither could be in their travels, as it was after in Canaan, vv. 10-11. Not that they sacrificed after their fancy (says the Geneva notes) but that God would be served more purely in the land of Canaan. Junius upon this place notes: ‘Etsi oblationum lex una semper fuit ab initi• praescripta a Deo, non potuit tamen usque adeo in ambulatoriis Israelitarum castris observari, ant summo jure ab illis exigi, prout ostendit; Antithesis, verse 11; vide Num, 28:6.’ The [Romanist] Douay divines, on the place, give this observation, ‘In the desert they could not observe the ceremonies of the Law, but coming to rest, they were bound to keep all one set form of holy rites.’ The conclusion from this text is that God is pleased to dispense with his people in his own prescribed worship, until, if He has appointed, determined, or appropriated a certain form, time and place, they have opportunity to serve Him at that time, in that place, and after that form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 51</span></figcaption>

edbooksonline.com/on-church-ordinances/#:~:text=Ye%20shall%20not%20do%E2%80%99%20%28says%20Moses,that%20place%2C%20and%20after%20that%20form&amp;text=Ye%20shall%20not%20do%E2%80%99%20%28says%20Moses%29%20%E2%80%98after%20all&amp;text=time%2C%20in%20that%20place%2C%20and%20after%20that%20form" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b8f5296de" data-kw="">
<blockquote><p>There was a certain man in Caesarea called Cornelius… A devout man, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway… And he said unto him, ‘Thy prayers and thine alms are come up for a memorial before God… And as Peter was coming in, Cornelius met him, and fell down at his feet, and worshipped him. But Peter took him up, saying, ‘Stand up; I myself also am a man.’… ‘…Now therefore are we all here present before God, to hear all things that are commanded thee of God.’ Then Peter opened his mouth, and said, ‘Of a truth I perceive that God is no respecter of persons: But in every nation he that feareth Him, and worketh righteousness, is accepted with Him….’ While Peter yet spake these words, the Holy Ghost fell on all them which heard the word.</p></blockquote>

<blockquote><p>We never judged needless affected singularity a duty, but judge it best in lawful things for concord sake to conform to the custom of the churches where we live or come.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e7dc48603" data-kw="">
<blockquote><p>That which is lawful for them to do… that is lawful for others to join with them in: for that which is no sin in the principal is none in the accessory, ceteris paribus [other things being equal]. And it cannot be simply unlawful to join in any action that is lawful, quatenus talis [so far as it is such].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to John Robinson’</cite>, (1611) in The Works of John Robinson (London: Snow, 1851), 3.86</span></figcaption>

</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress.

2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do.

3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England, pp. 6-7, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

rship,and%20less%20convenient%20for%20the%20mode&amp;text=My%20partaking%20in%20any%20divine%20worship%20which%20is&amp;text=material%20points%20and%20less%20convenient%20for%20the%20mode" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not.</p></blockquote>

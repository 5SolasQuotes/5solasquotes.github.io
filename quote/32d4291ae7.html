<main class="wrap"><figure class="quote" id="q-32d4291ae7" data-kw="">
<blockquote><p>[Thomas, Summa, pt. 1, quest. 25, art. 2:] Reply to second objection. ‘Even if it were to produce no effect, the power of God would not be ineffectual: because a thing is ineffectual which is ordained to an end to which it does not attain. But the power of God is not ordered toward its effect as toward an end; rather it is the end of the effect produced but it.’ St. Thomas in this reply observes that ‘the power of a univocal agent is wholly manifested in its effect. The generative power of man is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect,’ just as the power of the sun is not wholly manifested, for instance, in the ripening of the fruits of the earth. But God evidently is not a univocal agent. ‘Hence his effect is always less than his power.’ Nevertheless His infinite power is manifested in the mode of producing things, inasmuch as He produces something out of nothing, or from no presupposed subject. Analogically we say that men of great genius are superior to the works they produce; but it is, nevertheless, in the way they produce these works that their superiority is seen. On the contrary, men of ordinary ability are, so to speak, univocal agents, and the whole of their power is manifested in the effect produced. They could not do more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The One God: a Commentary on the First Part of St. Thomas’ Theological Summa</cite>, (Herder Book Co., 1943), ch. 25, p. 721</span></figcaption>

<blockquote><p>3rd Problem. Whether God is universally perfect, as it were having in Himself the perfection of all things? Answer: Affirmed—provided you distinguish the “having,” or the “containing,” into the virtual or eminent and the formal. For certain perfections are in God formally, as life, goodness, intellect, will, etc. But certain others only virtually or causally, as in a producing and conserving cause, but not formally—as, e.g., sensitive life, corporeal perfections, and all the other specific perfections of the stars, elements, minerals, plants, animals, etc. According to this distinction, the Enthusiastic frenzies are to be refuted; and rightly are to be explained the texts which say that all things are, or subsist, in God. By this same distinction is determined another Problem, which occurs a little later in my syllabus: Whether created perfections can be in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin, vol. 5 (1669)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-462d67949a" data-kw="">
<blockquote><p>IX… VII. The [medieval] Scholastics rightly state indeed that God created the world. Some of them, however, following Avicenna, bk. 9, Metaphysics, ch. 4, who thought that in the creation of things there is a golden chain, and that the first intelligence created the second, the second produced the third, and so on down to the last, admitted that the power of creating could be communicated to a creature as a principal cause, such as Durandus, Gabriel Biel, also d’Ailly, de Raconis, Arriaga, Franciscus Bonae Spei. X. Others rightly deny indeed that the power of creating can be communicated to a creature as a principal cause; yet they affirm that the power of creating can be communicated to the same as a physical instrumental cause; which they assert in favor of the sacraments: such as Suarez, Metaphysical Disputations 20, sect. 5-7; Hurtado de Mendoza, Disputation 12, Physics, sect. 2, n. 62; into which opinion they allege Thomas himself, in pt.1 of 2, quest. 2, art. 3; With whom, from the Lutherans, Ebelius, Disp. 5, Metaph., Part. Spec. §4, art. 5, and Slevogt, Disp. Acad. 20, which is the third on Creation, are partly in favor. But more rightly do Scotus and the Scotists teach that a creature can create neither as a principal cause nor as an instrumental one. For: 1. Creation is an action of God alone, as Scripture testifies: Job 9:8, “Which alone spreads out the heavens.” Isa. 44:24, “I am the Lord that makes all things; that stretches forth the heavens alone; that spreads abroad the earth by myself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

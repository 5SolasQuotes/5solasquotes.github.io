<main class="wrap"><figure class="quote" id="q-21265053be" data-kw="">
<blockquote><p>The observance of the day rests upon the divine command and the divine example (Ex. xx. 11; Gn. ii. 2, 3). The principle underlying it is that man must copy God in his course of life. In the creation there was the sequence of six days of creative activity and a day of rest. Rest, of course, with God does not mean mere cessation from labour. It has a deeper and richer significance – it speaks of satisfaction and delight in the works of His hands. It is interesting to note that the seventh day was man’s first upon earth – he began his career by keeping sabbath with his God.

Christians often look on the Lord’s day as primarily for the sake of advancing religion. There is a danger in placing the emphasis too much in this direction. Its main significance is in the things of which it speaks. It witnesses to creation by God’s power at the beginning of history; and it reminds us of redemption accomplished through the crucified and risen Saviour. But these great truths do not exhaust its significance. It speaks also of eternity – of the sabbath rest that remains for the people of God. Its witness to these great truths as it recurs every week is every whit as necessary under the New Testament as under the Old.

Dr. Geerhardus Vos points out the danger of the modern Church becoming so ·busy with religious propaganda on this holy day as to leave too little place for the quiet ‘ God-ward occupation with piety’. The day is ‘set apart’ from mere secular employments and worldly pursuits and enjoyments, and ‘set apart’ to God and His worship. It is no doubt possible for Christian workers to be so much taken up with religious propaganda on this holy day as to empty it too much of the opportunities for the ‘rest’ and reflection which lie at the heart of its significance. As we ponder upon the great truths of which the Christian sabbath speaks, it becomes like a Pisgah-height from which we view the promised land. We cannot afford to be without what Dr. Vos has called its ‘eternity-typifying values’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-j-grier.html">W. J. Grier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Development of the Lord s Day from the Jewish Sabbath’, The Christian Graduate</cite></span></figcaption>

<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>

</figure><figure class="quote" id="q-237da2d55b" data-kw="">
<blockquote><p>That God cannot but prove efficient when those means are used for the salvation of men which he himself hath ordained for that purpose. Although, therefore, the preaching of the Gospel by men weak, despised, defiled by sin, may seem an insignificant means to the attainment of human salvation; yet, since it is the ordinance and will of God, it will prove most effectual: for the foolishness of God is wiser than men, and the weakness of God is stronger than man, 1 Cor. i. 25. There will be no need therefore to expect either an angel from heaven, or extraordinary visions and divine revelations; we have only to hearken to apostolic doctrine, and it will be the power of God to salvation to all that believe.</p></blockquote>

</figure><figure class="quote" id="q-926b5fe04f" data-kw="">
<blockquote><p>First, that God offers to the men of this world, helps and means, either of the knowledge of God in Nature, or of grace in Christ: and that to this end, to lead them to repentance and salvation… Thus God offered to the carnal Israelites means of grace to purge them, to turn them, Prov. 1:13, to gather them, Mt. 23:37, to convince them, Jn. 16:8-9, to draw them with cords of man and bands of love, Hos. 11:4, to dress them to bring forth good fruit, Isa. 5:4. Secondly, that the means God uses for these good ends are in some measure sufficient (if they be not hindered by men) to bring them to the attainment of these ends: for when God says Himself, He uses these means for these ends; for us to say, these means are not sufficient for these ends, seems to me to derogate from the wisdom and sufficiency of God, whose works are all of them perfect, Deut. 32:4, and so sufficient for the ends for which He wrought them. Yet God forbid I should doubt of that which our Savior tells the Jews, ‘No man can come to Christ, except the Father draw him,’ Jn. 6:44, by the same almighty power and authority whereby He sent Christ into the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, ... (London, 1646), 5th Doubt, Question 5, pp. 207-8</span></figcaption>

<blockquote><p>Delight not to be in bad places and company; to delight in such argues you are bad yourself. We are to hate the garment spotted with the flesh. Some expound this, “to avoid the occasions of sin,” but Mr [William] Perkins gives this sense: “to hate bad company.” He alludes to the ceremonial law that said that if a man had a leprous garment, or a garment otherwise made unclean, his company was to be avoided. God therefore gave that command not to plough with an ox and an ass together; the ass was an unclean creature, and the ox was one of the clean beasts, and they must not be in the same yoke. This notes (say divines) that God’s people and profane persons must not be yoked together. Though they may occasionally meet together, yet they must not be yoked together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: the truth, growth, and different degrees in fifteen sermons</cite>, ed. Don Kistler (Morgan, 1997), pp 12-13.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Delight not to be in bad places and company; to delight in such argues you are bad yourself. We are to hate the garment spotted with the flesh. Some expound this, “to avoid the occasions of sin,” but Mr [William] Perkins gives this sense: “to hate bad company.” He alludes to the ceremonial law that said that if a man had a leprous garment, or a garment otherwise made unclean, his company was to be avoided. God therefore gave that command not to plough with an ox and an ass together; the ass was an unclean creature, and the ox was one of the clean beasts, and they must not be in the same yoke. This notes (say divines) that God’s people and profane persons must not be yoked together. Though they may occasionally meet together, yet they must not be yoked together.”

— Christopher Love, Grace: the truth, growth, and different degrees in fifteen sermons, ed. Don Kistler (Morgan, 1997), pp 12-13.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDelight+not+to+be+in+bad+places+and+company%3B+to+delight+in+such+argues+you+are+bad+yourself.+We+are+to+hate+the+garment+spotted+with+the+flesh.+Some+expound+this%2C+%E2%80%9Cto+avoid+the+occasions+of+sin%2C%E2%80%9D+but+Mr+%5BWilliam%5D+Perkins+gives+this+sense%3A+%E2%80%9Cto+hate+bad+company.%E2%80%9D+He+alludes+to+the+ceremonial+law+that+said+that+if+a+man+had+a+leprous+garment%2C+or+a+garment+otherwise+made+unclean%2C+his+company+was+to+be+avoided.+God+therefore+gave+that+command+not+to+plough+with+an+ox+and+an+ass+together%3B+the+ass+was+an+unclean+creature%2C+and+the+ox+was+one+of+the+clean+beasts%2C+and+they+must+not+be+in+the+same+yoke.+This+notes+%28say+divines%29+that+God%E2%80%99s+people+and+profane+persons+must+not+be+yoked+together.+Though+they+may+occasionally+meet+together%2C+yet+they+must+not+be+yoked+together.%E2%80%9D%0A%0A%E2%80%94+Christopher+Love%2C+Grace%3A+the+truth%2C+growth%2C+and+different+degrees+in+fifteen+sermons%2C+ed.+Don+Kistler+%28Morgan%2C+1997%29%2C+pp+12-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F549edd2a96.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/549edd2a96.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/09/03/christopher-love-on-unequal-yokes/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

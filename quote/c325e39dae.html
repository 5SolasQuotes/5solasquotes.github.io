<blockquote><p>117. How is systematic theology distinguished, as to its arrangement, or method of conducting it? Ans. Into Positive and Scholastic.

118. What is the Positive? Ans. Such as commentaries on the Scriptures, following the order of the Scriptures, and not the connexion of doctrines — and insulated discourses.

119. What is the Scholastic method? Ans. A method conducted according to the rules of logic, setting forth the doctrines of divine truth in their connexion of matter, and dependencies of one part on another.

120. Is the Scholastic method to be approved? Ans. Yes; it is properly the systematic method, the method of schools, and is commended to us by the schools of the prophets, the creeds and collections of the Fathers, and by the example of the apostle Paul, to the Romans, Galatians, Hebrews, &amp;c.

§ XXVI. 121. What is commonly meant by scholastic theology? Ans. A Popish theology, which was begun about the twelfth century, by Peter Lombard. They divided into sects, called Thomists, Scotists, Realists, Nominalists, &amp;c. They had some good philosophical speculations and expressions, and some clear testimonies to divine truth; but they are justly blamed for the use they make of the authority of the Fathers and Philosophers, leading to neglect the Scriptures, and for their errors, curious and useless questions, barbarous terms, and darkening of the Scriptures by their explanations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), p. 28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Accordingly, the best form of government is in a state or kingdom, where one is given the power to preside over all; while under him are others having governing powers: and yet a government of this kind is shared by all, both because all are eligible to govern, and because the rules are chosen by all. For this is the best form of polity, being partly kingdom, since there is one at the head of all; partly aristocracy, in so far as a number of persons are set in authority; partly democracy, i.e. government by the people, in so far as the rulers can be chosen from the people, and the people have the right to choose their rulers.

Such was the form of government established by the divine law. For Moses and his successors governed the people in such a way that each of them was ruler over all; so that there was a kind of kingdom. Moreover, seventy-two men were chosen, who were elders in virtue: for it is written (Dt. 1:15): “I took out of your tribes wise and honorable, and appointed them rulers”: so that there was an element of aristocracy. But it was a democratical government in so far as the rulers were chosen from all the people; for it is written (Ex. 18:21): “Provide out of all the people wise men,” etc.; and, again, in so far as they were chosen by the people; wherefore it is written (Dt. 1:13): “Let me have from among you wise men,” etc. Consequently it is evident that the ordering of the rulers which the Law provided was the best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica</cite>, I-II, Q.105, Art. 1, co.</span></figcaption>

</figure><figure class="quote" id="q-5d4f703ef3" data-kw="">
<blockquote><p>Why have any religion at all? Is it not enough to have a good, sensible philosophy?” No. If this had been enough, clericalism would have been driven to the wall long ago. The experiment has been thoroughly tried in France for eighty years, and has failed. The power of the priesthood tends to increase, and the superstitions of the Roman church grow worse and worse.

No doubt atheism in its various forms — materialism, pantheism, positivism has advanced and spread; but the bourgeoisie — the bulk of the well-to-do citizens — have a horror and dread of atheism, and by this very fact are impelled to support the only church they know of; and so superstition is made fashionable. “Man cannot live by bread alone.” All his higher cravings are famished when he attempts to subsist only on what he can find in atheism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-woolsey-bacon.html">Leonard Woolsey Bacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Wonderful Work in France: An Introduction of the Deputation from the Protestants of France to the American Churches</cite>, (New York: American Tract Society, 1880), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-e326985a4c" data-kw="">
<blockquote><p>In his twelfth chapter he saith, [That many revolted from the Church of Rome, because the Schoolmen brought in Philosophy, and Aristotle’s doctrine into Religion; whence arose contradictions and absurdities, as brought the Clergy into a reputation of ignorance.] It is strange that Philosophy should make the Clergy reputed ignorant, whereas it contains the knowledge both of divine and human things: and it is one of the chief blessings of Almighty God, bestowed upon mankind, by which his image lost in Adam is repaired; for the understanding is enlightened by the speculative, and the will is regulated by the practical parts thereof: and Philosophy is so far from causing peoples revolt from that Church; that on the contrary, it is one of the main supporters and pillars thereof: I am afraid that it was not Philosophy which brought a reputation of ignorance upon that Church, but rather their want of it, which also will occasion much ignorance, stupidity, and darkness in our Church: And I pray you good Mr. Hobbs, what hurt hath Divinity received from Philosophy, or Aristotle’s doctrine.

Hath it caused contradictions, and absurdities; (as you say) sure, you are widely mistaken: for by Philosophy contradictions and absurdities are avoided, into which those ignorant souls do fall, who want it, as we find at this time by woeful experience, there being more absurd and contradictory opinions among the people of this Nation, now, in a few years since Aristotle’s doctrine hath been discouraged, then were all the time hitherto since Christianity was embraced. And what wonder is it if they that walk in darkness stumble: How should we come to know the heavens, the earth, the seas, the fire, the air, the beasts, fishes, and fowls, the herbs, trees, plants, precious stones, all which physical bodies, with divers others are mentioned in Scripture: besides, Spirits, Angels, and other Metaphysical entities: without Philosophy, how should we define, divide, dispute, speak or write methodically or syllogistically without this.

I will say nothing of the benefit we receive by moral, political, and economical Philosophy: How shall we dispute against Heretics, and refel their subtle arguments without it. Justin Martyr, and many other Greek and Latin Fathers, fought against the Gentles, Jews, and Heretics, with this sword, and beat them with their own weapons; therefore to condemn Philosophy, is to condemn the minister and handmaid of divinity; between which there can be no more repugnancy, then there is between the principal and subordinate cause, between two lights, two truths, or between the body and the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), pp 17-18.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0ed5b45341" data-kw="">
<blockquote><p>It’s no duty [to separate from an impure church], as he elsewhere says, because there is no command; it’s no duty, and therefore we read not this word, ‘come forth’, in any of the epistles written to the seven Churches [in Rev. 2-3], against which Christ says He has such and such things. They that lived in the impurer are not called forth into the purer, but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part. For we may not make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s Presence because Satan came also amongst them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Sacrament, p. 246 &amp; p. 31 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“It’s no duty [to separate from an impure church], as he elsewhere says, because there is no command; it’s no duty, and therefore we read not this word, ‘come forth’, in any of the epistles written to the seven Churches [in Rev. 2-3], against which Christ says He has such and such things. They that lived in the impurer are not called forth into the purer, but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part. For we may not make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s Presence because Satan came also amongst them?”

em" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9984774744" data-kw="">
<blockquote><p>…even by 1679 there were some twenty or thirty ministers still preaching in the fields, and no significant decline in the number of their hearers. But the year 1679 was to bring a very radical change and to usher in an era of persecution on a scale hitherto unknown. To some extent this situation resulted from the annoyance caused to the government by the activities of Robert Hamilton and his followers, who were by now acting as a kind of sel-appointed armed bodyguard to Cameron in his preaching tours about the country. Hamilton had already been involved, as early as November 1677, in a violent incident at the home of his friend John Balfour of Kinloch, in Fife [a principal actor in the assassination of Archbishop James Sharp in 1679], when a party of soldiers who approached the house were fired upon and one of them was seriously wounded. How far Hamilton himself may have been responsible for incidents of this kind is not altogether clear…</p></blockquote>

<blockquote><p>The late, great and general defection of this Church and kingdom;” and say, “It is also matter of lamentation that uder this great defection there has been too general a fainting, not only amongst professors of the Gospel, but also among ministers, yea, even amongst such who in the main thing did endeavor to maintain their integrity, in not giving seasonable and necessary testimony against the defections and evils of the time, and keeping a due distance from them.</p></blockquote>

</figure><figure class="quote" id="q-593ffe42d4" data-kw="">
<blockquote><p>It has been the sad observation of diverse, that every new trial has been the occasion of a new difference, if not division. The Lord partly, in his holy displeasure, withdrawing light and chastising his people for their sins, and partly trying and exercising of them in that great duty of mutual forbearance, so little made conscience of; and partly discovering infirmities, much dross in his own, by the contests so carnally managed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, … (London: Cockerill, 1681), Preface, p. 4</span></figcaption>

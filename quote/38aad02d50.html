<main class="wrap"><figure class="quote" id="q-38aad02d50" data-kw="">
<blockquote><p>Neither, in this same point of elections, do we homologate [agree] with them [Independents, Anabaptists and Separatists] who give to the collective body of the church (women and children under age only excepted) the power of decisive vote and suffrage in elections, we give the vote only to the eldership or church representative, so that they carry along with them the consent of the major or better part of the congregation… out of Thomas [Aquinas] this difference betwixt consent and election, that though every choosing be a consenting, yet every consenting is not a choosing. [1] The liberty of consent is one thing; [2] counsel or deliberation another thing; [3] the power of a decisive voice in court or judicatory a third thing. I speak of a constituted church (for where there is not yet an eldership there can be no such distinction; yet, however, be there an eldership, or be there none, the church’s consent must be had). The first of these [consent] we ascribe to the whole church, without whose knowledge and consent ministers may not be intruded; the second [counsel &amp; deliberation] to the ablest and wisest men of the congregation, especially to magistrates, with whose special advice, privity and deliberation, the matter ought to be managed; the third [a decisive voice in court], which is the formal and consistorial determination of the case of election, consists in the votes of the eldership. Their way [Independents, etc.] is much different than this, who would have the matter prepared by the conference and deliberation of the eldership (as we used to do in committees),¹ but determined and decided by the votes of the whole congregation. [¹There was a change in the Church of Scotland’s practice on this, probably due to a response to the Independents. See Thomas M’Crie (the younger), p. 232 of The Story of the Scottish Church. See especially the 2nd paragraph of the footnote. The context, from p. 228, is the discussion of patronage.] … I conclude with a passage out of the Ecclesiastical Discipline of the Reformed Churches in France, ch. 1, ‘The silence of the people, none contradicting, shall be taken for an express consent…</p></blockquote>

<blockquote><p>…but the truth is, neither the king’s judgement, as a certain rule to the representative Church, nor [is] the representative Church’s judgment a rule to the King, but the Word of God [is] the infallible rule to both. Judgment may crook, truth cannot bow; it stands still unmoveable like God, the father of truth; but in this case if both err, excellently says Junius (contra Bellarmine, on Councils, bk.1, ch. 12), the magistrate erring, the Church may do something extraordinarily; and the Church erring the magistrate may do something also in an extraordinary way, as common equity and mutual law requires, that friends with mutual tongues bick [quarrel?] the wounds of friends.</p></blockquote>

</figure><figure class="quote" id="q-09a8066301" data-kw="">
<blockquote><p>…we will distinguish with the School-men a two-fold power, the power of Order, and the power of Jurisdiction; which are different in sundry respects. 1. The power of order comprehends such things as a minister by virtue of his ordination, may do without a commission from any presbytery, or assembly of the Church, as to preach the Word, to minister the sacraments, to celebrate marriage, to visit the sick, to catechize, to admonish, etc. The power of jurisdiction comprehends such things as a minister cannot do by himself, nor by virtue of his ordination; but they are done by a session, presbytery, or synod; and sometimes by a minister, or ministers, having commission, and authority from the same, such as ordination and admission, suspension, deprivation and excommunication, and receiving again into the Church, and making of laws and constitutions ecclesiastical and such like; whereof we boldly maintain, that there is no part of ecclesiastical jurisdiction, in the power of one man, but of many met together in the name of Christ. 2. The power of order is the radical and fundamental power, and makes a minister susceptive, and capable of the power of jurisdiction. 3. The power of order goes no further than the court of conscience; the power of jurisdiction is exercised in external and ecclesiastical courts. Fourthly, the power of order is sometime unlawful in the use, yet not void in itself. The power of Jurisdiction when it is unlawful in the use, it is also void in itself. If a minister do any act of jurisdiction, as to excommunicate, or absolve without his own parish, wanting also the consent of the ministry and elders of the bounds where he does the same, such acts are void in themselves, and of no effect. But if without his own charge, and without the consent aforesaid, he baptize an infant, or do any such thing belonging to the power of order, though his act be unlawful, yet is the thing itself of force, and the sacrament remains a true sacrament.</p></blockquote>

<blockquote><p>7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].</p></blockquote>

<blockquote><p>It is one of the greatest objections against the suppressing… of… errors and schisms, ‘O,’ say they, ‘this is a persecuting of those that are godly; this is a wound to piety, and the power of godliness.’ I do not deny but there may be, and is, true piety in many who are somewhat infected with the leaven of false doctrine, and live in some erroneous opinion… Those that are truly godly may in diverse things differ in opinion. Every error is not inconsistent with holiness, yet every error doth pro tanto [by so much], and proportionably retard, hinder, and prejudge holiness; and although the devil sow his tares among Christ’s wheat (I mean in the same persons as well as in the same church), yet who will say that a field of wheat is nothing the worse for the tares?… And this I hold as a good rule in practical divinity… so error of judgment, if continued in, doth not only hinder growing, but makes a dangerous decreasing and falling short in true piety… It is to be observed that sometimes the Scripture speaks of an error of the judgment concerning the faith as a fountain and cause of ungodliness, profaneness… 2 Tim. 2:16-19; Gal. 5:4; 2 Jn. 9; as contrariwise, there is a light and knowledge which preserves from sin and ungodliness, and leads the soul in ways of holiness and obedience, Ps. 9:10; 119:33-34; Jn. 17:17. If the knowledge of God, of his Christ, and of his Word, and will, and name and statutes, preserve us from sin, and lead us in the ways of obedience, then, by the rule of contraries, error of judgment in these things will ensnare us in sin and wickedness.</p></blockquote>

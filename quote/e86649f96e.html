<blockquote><p>Christ therefore as God willed and approved the gathering of the Jerusalemites to Himself and their obedience as a thing so intensely dear to Him and morally pleasing, as is the care of a hen for her chicks, which she cherishes and nourishes by the expansion of her wings, although the Jerusalemites held that blandishing invitation of the Savior as cheap; meanwhile He denied to the same the grace which would have most sweetly procured their most free obedience, with liberty unimpaired, which is an invincible argument that God decreed that their obedience should never exist.</p></blockquote>

<blockquote><p>4. The prosperity of sinners usually renders the means of grace ineffectual, that should reclaim and reform them, and consequently their destruction is remediless. The means of grace are internal or external: Internal, the motions of the Holy Spirit and the convictions and excitations of conscience: External, the ministry of the Word and the counsels of faithful friends; all which are usually made frustrated and inefficacious by the vices and lusts of the prosperous.</p></blockquote>

<blockquote><p>2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion, the faith of Judas the traitor, which nevertheless He by no means willed or decreed by the will of good pleasure since such things never happen in the nature of things… the object of the will of sign or approving of God, is that which is morally good and honest, but of the disapproving, what is unjust and evil: whether it happen in the nature of things, or not… Thus God willed and commanded the repentance of Cain, but it by no means follows therefore Cain repents, because the event of the thing or non-event of the thing is badly, and by no art of logic concluded from the will of sign or approving… the commandment of God does not signify to us the will of God about such an event; but only the will of God about such moral equity of the thing. … as far as pertains to the essence of the will of sign, God equally approves with moral complacency the final obedience of Judas the traitor, as the obedience of Peter the apostle:</p></blockquote>

</figure><figure class="quote" id="q-3b72859a83" data-kw="">
<blockquote><p>The second conclusion pretended to be drawn from this [Rev. 2:21] is that the Lord has a universal will to have all men saved, seeing He gives her time to repent. This we say does not follow hence: For: … 4. It will not follow Christ wills persons to repent; therefore He wills their salvation: because He may be said to will them to repent when He requires it of them as their duty: and thus their duty of repenting is the immediate object of his revealed and preceptive will: but a person’s salvation is the proper object of his will of good-pleasure, or of his decreeing and purposing will. And no otherways can He be said to will such persons’ salvation (because He commands them to repent) than this, to wit, that in His Word He has signified repentance to be such a person’s duty, and that He has appointed a connection between repentance and salvation; which still relates to his revealed will: even as when God made the first Covenant with Adam, it might be said that He willed Adam to be holy, and that by that Covenant He had made a connection between holiness and life; yet it is not proper to say that the Lord willed life to Adam upon that condition, because that looks to the event and respects the Lord’s will of purpose: which cannot but be effectual. And if the Lord’s willing of men (at least such as are under his ordinances) to be saved be thus understood as including only the duty which God lays upon men and the connection that He has made between it and salvation in his Word, it may be admitted: but if it be extended to any antecedent will in God Himself, distinct from that which is called His revealed will, this place and such like will give no ground for such an assertion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Book of the Revelation... (Edinburgh: Higgins, 1658), ch. 2, Lecture 6, on vv. 18-29</cite>, pp. 169-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-b414c636c8" data-kw="">
<blockquote><p>Shall it be said that sin does not displease God; that He has no will against sin; it is not repugnant to his will? Yes; it is to his revealed will, to his law. But is that an untrue revelation? His law is not his will itself, but the signum [sign], the discovery of his will. Now, is it an insignificant sign? A sign that signifies nothing? Or to which there belongs no correspondent significatum [signification]? –nothing that is signified by it? Is that which is signified (for sure no one will say it signifies nothing) his real will, yea or no? Who can deny it? That will, then (and a most calm, sedate, impassionate will it must be understood to be), sin and consequently the consequent miseries of his creatures, are repugnant unto. … Therefore, it seems out of question, that the holy God does constantly and perpetually, in a true sense, will universal obedience, and the consequent felicity of all his creatures capable thereof; i.e. He does will it with simple complacency, as what were highly grateful to Him, simply considered by itself. Who can doubt, but that purity, holiness, blessedness, wheresoever they were to be beheld among his creatures, would be a pleasing and delightful spectacle to Him, being most agreeable to the perfect excellency, purity, and benignity of his own nature, and that their deformity and misery must be consequently unpleasing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, Appendix, “How God is said to Will the Salvation of them that Perish”</cite>, pp. 386-8</span></figcaption>

— John Howe, The Redeemer’s Tears Wept Over Lost Souls, Appendix, “How God is said to Will the Salvation of them that Perish”, pp. 386-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CShall+it+be+said+that+sin+does+not+displease+God%3B+that+He+has+no+will+against+sin%3B+it+is+not+repugnant+to+his+will%3F+Yes%3B+it+is+to+his+revealed+will%2C+to+his+law.+But+is+that+an+untrue+revelation%3F+His+law+is+not+his+will+itself%2C+but+the+signum+%5Bsign%5D%2C+the+discovery+of+his+will.+Now%2C+is+it+an+insignificant+sign%3F+A+sign+that+signifies+nothing%3F+Or+to+which+there+belongs+no+correspondent+significatum+%5Bsignification%5D%3F+%E2%80%93nothing+that+is+signified+by+it%3F+Is+that+which+is+signified+%28for+sure+no+one+will+say+it+signifies+nothing%29+his+real+will%2C+yea+or+no%3F+Who+can+deny+it%3F+That+will%2C+then+%28and+a+most+calm%2C+sedate%2C+impassionate+will+it+must+be+understood+to+be%29%2C+sin+and+consequently+the+consequent+miseries+of+his+creatures%2C+are+repugnant+unto.+%E2%80%A6+Therefore%2C+it+seems+out+of+question%2C+that+the+holy+God+does+constantly+and+perpetually%2C+in+a+true+sense%2C+will+universal+obedience%2C+and+the+consequent+felicity+of+all+his+creatures+capable+thereof%3B+i.e.+He+does+will+it+with+simple+complacency%2C+as+what+were+highly+grateful+to+Him%2C+simply+considered+by+itself.+Who+can+doubt%2C+but+that+purity%2C+holiness%2C+blessedness%2C+wheresoever+they+were+to+be+beheld+among+his+creatures%2C+would+be+a+pleasing+and+delightful+spectacle+to+Him%2C+being+most+agreeable+to+the+perfect+excellency%2C+purity%2C+and+benignity+of+his+own+nature%2C+and+that+their+deformity+and+misery+must+be+consequently+unpleasing%3F%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+The+Redeemer%E2%80%99s+Tears+Wept+Over+Lost+Souls%2C+Appendix%2C+%E2%80%9CHow+God+is+said+to+Will+the+Salvation+of+them+that+Perish%E2%80%9D%2C+pp.+386-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb414c636c8.html&amp;via=5Solas" target="_blank" rel="noop

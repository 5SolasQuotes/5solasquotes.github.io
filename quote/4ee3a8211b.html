<main class="wrap"><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, p. 462</span></figcaption>

</figure><figure class="quote" id="q-6797257d1e" data-kw="">
<blockquote><p>Now if we ask the Papists, that if the people must be put in mind [by images], of what it must be?… …

2. Not of Christ, as he is God, for his attributes are 〈◊〉, but as he is man only and in so doing, in representing him by picture as man and not God, seeing that person in the deity cannot be delineated, they imitate Nestorius, who did divide the natures of Christ, and so consequently may seem to run into the anathema of the council of Ephesus: because in some sort they divide in their picture the manhood from the Godhead, which they cannot express therewith. (1st Council of Ephesus, canon 3)

2. Not of Christ, as man, and now glorified, for against this, the saying of Eusebius may serve well, that the glory of Christ in heaven is now far greater, than it was when he was 〈◊〉 in the mount, where the disciples could not look upon him, and therefore cannot be portrayed by any pencil.

3. Nor of Christ, as he was in the flesh, for that were (as the prophet speaks) to teach us lies: and rather to forget than to remember what he suffered for us; for in his picture (as in that upon the cross for example) we can be put in mind and we see no more than the piercing of his hands and feet, a wound in his side by a spear, and the thorns on his head: this we may remember by these things: but the especial pains and torments which inwardly he suffered; his being sorrowful unto death, his anguish of heart for the Jews obstinacy and rejection, the bitternesse of the cup, which his not only most perfect body was most sensible of, and his holy soul apprehended and suffered, these are forgotten these cannot be depicted; so the greatest part of his passion is inexpressible. … These reasons show that there are other means better and more effectual than pictures to instruct men in the knowledge of Christ, viz. The scripture and the preaching of the gospel, but they are not meant to prove it unlawful to paint or make any portraiture of Christ in his human nature, as at his passion, etc., provided no religious worship be given to it: that which is of 〈◊〉 use, is not therefore unlawful or of no use at all. So the author in his answer to Perron, c. 18, p. 17. To have a story painted for memory’s sake we hold not unlawful, but that it might be well enough done, if the church found it not inconvenient for her children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large</cite>, … (London: Norton, 1650), Second Commandment, ch. 6, pp. 213-14 Andrewes (1555–1626) was an English bishop and scholar, who held high positions in the Church of England during the reigns of Elizabeth I and James I.</span></figcaption>

3. Nor of Christ, as he was in the flesh, for that were (as the prophet speaks) to teach us lies: and rather to forget than to remember what he suffered for us; for in his picture (as in that upon the cross for example) we can be put in mind and we see no more than the piercing of his hands and feet, a wound in his side by a spear, and the thorns on his head: this we may remember by these things: but the especial pains and torments which inwardly he suffered; his being sorrowful unto death, his anguish of heart for the Jews obstinacy and rejection, the bitternesse of the cup, which his not only most perfect body was most sensible of, and his holy soul apprehended and suffered, these are forgotten these cannot be depicted; so the greatest part of his passion is inexpressible. … These reasons show that there are other means better and more effectual than pictures to instruct men in the knowledge of Christ, viz. The scripture and the preaching of the gospel, but they are not meant to prove it unlawful to paint or make any portraiture of Christ in his human nature, as at his passion, etc., provided no religious worship be given to it: that which is of 〈◊〉 use, is not therefore unlawful or of no use at all. So the author in his answer to Perron, c. 18, p. 17. To have a story painted for memory’s sake we hold not unlawful, but that it might be well enough done, if the church found it not inconvenient for her children.”

<main class="wrap"><figure class="quote" id="q-9e4a40ea83" data-kw="">
<blockquote><p>One of the most encouraging signs of the times is the growth of National Reform sentiment. Objections to it are not nearly so frequent as they formerly were. The secular theory is losing ground, especially among Christian thinkers. In many months of work over a wide area the writer did not meet more than two or three ministers who expressed opposition to the work of National Reform.

This growth in sentiment is the work of God; but one of the most forceful agencies that He has been pleased to employ in its formation is the National Reform organization. May God bless most abundantly its work during the next twenty-five years, and the work of all other organizations, institutions and people who wish the Lord Jesus Christ to be enthroned in the civil affairs of our land!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston-acheson.html">Thomas Houston Acheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Five Years of National Reform in America in Christian Nation</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-faa69f19c5" data-kw="">
<blockquote><p>That whatsoever Law of GOD, or command of His, we find recorded in the Lawbook, in either of the volumes of God’s statute, the N. T. or the Old, remains obligatory to us, unless we can prove it to be expired, or repealed. So it is with the statute-law of this nation [England], or of any nation; What I can prove to be once enacted, I may urge as still in force, unless any one can answer me with a just proof that it is now out of date, or repealed by a latter Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glass of God’s Providence</cite>, (1644) p. 52 In the context of a rule in Scripture for Church Government.</span></figcaption>

</figure><figure class="quote" id="q-16dc4bd6a2" data-kw="">
<blockquote><p>But among other things which were prudently and happily done by you, the convocation of the Synod of Dort hath obtained the chief place. Then which Synod for many ages past there hath been none more famous, more holy, nor more profitable to the Church.

Whereunto that ye might call most choice men from divers parts, ye spared neither cost, nor labour; wherein all things were done so orderly and gravely, that it hath drawn the people into admiration, and hath stayed those that were staggering, and hath so troubled headstrong and obstinate persons only with the sight thereof, that they which before did seem to be desirous of the conflict, and greedily to call for the encounter, have by contrary practices, (whether fear stroke them, or their conscience affrighted them) begun to shun the hearing of the cause, to hate the light, and to work delays.

To so excellent a thing, both other Princes did exhort you, and especially the most renowned Prince JAMES, King of great Britain, who hath always been most earnest and forward to drive away the errors of all innovators; who as he is rightly styled the Defender of the Faith, so he hath his eyes vigilant on all sides, carefully watching lest Christian faith should any where receive any damage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), xiv-xv.</span></figcaption>

</figure><figure class="quote" id="q-3424d4181f" data-kw="">
<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach… nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 63</span></figcaption>

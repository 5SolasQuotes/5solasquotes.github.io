<main class="wrap"><figure class="quote" id="q-036da46477" data-kw="">
<blockquote><p>Q. What is the 2d. Commandment?

A. Thou shalt not make to thy self any graven image, &amp;c.

Q. What is the meaning of this Commandment?

Ans. That we should worship the true God with true worship: such as God hath ordained, not such as man hath invented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Milk for babes. Drawn from the breasts of both testaments. Chiefly for the spiritual nourishment of</cite>, Boston babes in either England: but may be of like use for any children (London, 1646), pp 2-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-793a8872b7" data-kw="">
<blockquote><p>For strangers are risen up against Me and violent men have sought after My soul; they have not set God before their eyes. The Only-begotten Son of God, the Word of God and God the Word—although assuredly He could Himself do all things that the Father could, as He says: What things soever the Father doeth, the Son also doeth in like manner, while the name describing the divine nature which was His inseparably involved the inseparable possession of divine power,—yet in order that He might present to us a perfect example of human humility, both prayed for and underwent all things that are the lot of man.

Sharing in our common weakness He prayed the Father to save Him, so that He might teach us that He was born man under all the conditions of man’s infirmity. This is why He was hungry and thirsty, slept and was weary, shunned the assemblies of the ungodly, was sad and wept, suffered and died. And it was in order to make it clear that He was subject to all these conditions, not by His nature, but by assumption, that when He had undergone them all He rose again. Thus all His complaints in the Psalms spring from a mental state belonging to our nature. Nor must it cause surprise if we take the words of the Psalms in this sense, seeing that the Lord Himself testified, if we believe the Gospel, that the Psalms spiritually foretold His Passion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily on Psalm LIII</cite>, 7 in Nicene and Post-Nicene Fathers 2, 9: 245.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-d9cb792a33" data-kw="">

</figure><figure class="quote" id="q-9bc7b9831b" data-kw="">
<blockquote><p>Should there be a gathering destitute of bread and wine, as perchance among the Indians, who for bread use the baked marrow of a certain tree, or a fixed root, or rice, or such other things, the gathering may–if, I say, there is no bread of corn–safely use what it is accustomed to use in place of bread. It is not so much the outward form and kind of corn that ought to be regarded, as the nourishment and what chiefly nourishes. The same must be said if wine is lacking. Something else might be applied, in place of wine, as scarcely any nation is discoverable, which has not some beverage which it uses to restore the spirits in place of wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrine of the Covenants</cite>, (Amsterdam, 1688), p. 593 as trans. in Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer tr. G.T. Thomson (Wipf &amp; Stock, 2007), p. 631</span></figcaption>

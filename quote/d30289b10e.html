<main class="wrap"><figure class="quote" id="q-d30289b10e" data-kw="">
<blockquote><p>The Covenant of Works, wherein God covenanted with man to give him eternal life upon condition of perfect obedience in his own person. The Covenant of Grace, which God made with man promising eternal life upon condition of believing…This Covenant [of works] God made with man without a Mediator for there needed no no middle person to bring man into favor and friendship with God, because man did bear the image of God, and had not offended: nor to procure acceptance to man’s service because it was pure and spotless. God did love man being made after his Image and promised to accept of his obedience performed freely, willingly, entirely, according to his Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (London, 1645), 8, 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5dd4f05610" data-kw="">
<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sacred Doctrine of Divinitie</cite>, (London, 1599, repr. 1613), 9. [Spelling modernized]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-7d30a5a5b6" data-kw="">
<blockquote><p>XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), vol. 1. 162 (2.3.33).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.”

— Herman Witsius, The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), vol. 1. 162 (2.3.33).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXXIII.+And+the+thing+speaks+for+itself%2C+For%2C+as+there+is+a+covenant+between+the+Father+and+the+Son%3B+%E2%80%9Cwhen+thou+shalt+make+his+soul+%28if+the+soul+of+the+Son+shall+devote+himself%29+an+offering+for+sin%2C%E2%80%9D+Is.+53%3A10%2C+upon+performing+the+condition%2C+the+Son+acquired+a+right+to+the+reward%2C+and+so+has+a+merit+according+to+the+covenant.+Nay%2C+as+it+is+not+the+obedience+of+a+mere+man%2C+but+of+Christ%2C+God-man%2C+an+infinite+person%2C+it+is+also+of+an+infinite+value%2C+consequently+bears+the+justest+proportion+to+the+greatest+corresponding+glory%3B+and+thus+far+it+is+a+merit+of+condignity%2C+as+it+is+called%3B+such+as+no+mere+creature+is+capable+to+acquiring.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+vol.+1+%28London%3A+T.+Tegg+%26+Son%2C+1837%29%2C+vol.+1.+162+%282.3.33%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7d30a5a5b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7d30a5a5b6.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/witsius-christ-condignly-merited-a-reward-by-fulfilling-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-944fc81d80" data-kw="">
<blockquote><p>Besides this evangelical character which unquestionably belongs to the Mosaic covenant, it is presented in two other aspects in the Word of God. First, it was a national covenant with the Hebrew people. In this view the parties were God and the people of Israel; the promise was national security and prosperity; the condition was the obedience of the people as a nation to the Mosaic law; and the mediator was Moses. In this aspect it was a legal covenant. It said, “Do this and live.” Secondly, it contained, as does also the New Testament, a renewed proclamation of the original covenant of works. It is as true now as in the days of Adam, it always has been and always must be true, that rational creatures who perfectly obey the law of God are blessed in the enjoyment of his favour; and that those who sin are subject to his wrath and curse. Our Lord assured the young man who came to Him for instruction that if he kept the commandments he should live (emphasis added).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1872), 2.374–376.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-61efd706e1" data-kw="">
<blockquote><p>…the problem of the promises given under the covenant of works and the meaning of the “life” promised to Adam in return for obedience – perpetual, yes, but would it be heavenly or earthly? The[re was a] fairly radical disagreement on the issue between such eminent thinkers as Thomas Goodwin, John Cameron, Moise Amyraut, John Ball, and Johannes Marckius on the side of an earthly reward, and Francis Turretin, J.H. Heidegger, the Formula Consensus Helvetica, Thomas Boston and Thomas Ridgley on the side of a heavenly reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011), p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

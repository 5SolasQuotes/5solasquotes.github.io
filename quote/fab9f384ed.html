<main class="wrap"><figure class="quote" id="q-fab9f384ed" data-kw="">
<blockquote><p>Traditionally the sacrament had been open to all not actually excommunicated or under other kirk censures. Increasingly during the 1640s it appears (though the process has not been traced in detail) that some ministers put more and more emphasis on stringent qualifications necessary for admission. Tests of religious knowledge, repentance for sins and political loyalties were introduced. Thus adherence to the national covenant and the solemn league and covenant became necessary for admission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-stevenson.html">David Stevenson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Revolution and counter-revolution 1644-1651</cite>, (1979; rev. edn, Edinburgh, 2003), p. 192.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>And have this in your eye in all religious exercises, that by them you may be made more serious; and that the impressions of other holy exercises may be the deeper, and take the faster hold, let me advise young people that are sober-minded, to come betimes to the ordinance of the Lord’s supper. Let me press it upon them, not only as a duty they owe to Christ, but as that which will be of great advantage to themselves to strengthen their resolutions, with purpose of heart to cleave to the Lord.

Those who keep off from it, it is either because they know they are not sober-minded, or because they are not determined to continue so; but none of you will own either of those reasons. Delay not therefore by that most sacred solemn bond, to join your selves to the Lord in a perpetual covenant, never to be forgotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6</cite>, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 82.</span></figcaption>

med Covenanter</a></div>

<blockquote><p>4. As regards the outward administration of the Supper it can only be dispensed by an orderly occupant of the preaching office, in company with whom, chiefly for distributing the cup, there may also be other servants of the Church, elders and deacons, at his side to help him. Polan (VI, 56): ‘Ministers of the Church, and these include pastors, and presbyters or elders (seniores) added to the pastors for the government of the Church and deacons lawfully called, ought to preside at the administration of the Eucharist, no others. If the pastors alone can carry through the administration, as in small gatherings, then the help of others is not required, as Tertullian writes (De corona 3): ‘We do not take the sacrament of the Eucharist from the hands of others than those presiding.’ But if the gatherings are large and the pastors are not sufficient to perform the administration of the Supper alone, they may co-opt elders and deacons to help them, especially in the distribution of the cup.’ Heidegger (XXV, 73): ‘The first to administer was the same as he who instituted it; those who followed them, the pastors and the rulers of the Church (rectores) did and do administer it. No more than baptism or the preaching of God’s Word can it be administered by private persons or by any private person at a banquet.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Bizer &amp; trans. Thomson (1950; Wipf &amp; Stock, 2007), ch. 26, p. 629</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

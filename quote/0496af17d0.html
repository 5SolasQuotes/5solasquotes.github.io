<main class="wrap"><figure class="quote" id="q-0496af17d0" data-kw="Mary|Queen of Heaven|Mediator|King|Invocation of saints">
<blockquote><p>As Christ alone is our mediator and redeemer, none of the saints nor even the most blessed virgin Mary (even though we recognize her as the most blessed among women and praiseworthy above all others as the mother of God) may be called mediators between God and men. Nor is it to be assigned to Mary to be the queen of heaven with lordship over all creatures, which is the province of Christ alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-delegates-at-the-colloquy-of-thorn.html">Reformed delegates at the Colloquy of Thorn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Declaration of Thorn</cite>, 1645, Our Declaration in Its Particulars, 2. Of the Most Holy Trinity, and of the Person and the Office of Christ, §3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-922ada4b89" data-kw="Mary Mediator Invocation of saints">
<blockquote><p>He is nevertheless our sole mediator, redeemer, defender that sits at the right hand of God the Father (1 Peter 2; Rom. 8). The saints are not mediators, intercessors, nor is the virgin Mary a mediatrix.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-debrecen.html">Synod of Debrecen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hungarian Confessio Catholica</cite>, 1562, Concerning the Mediator</span></figcaption>

</figure><figure class="quote" id="q-fecc17f84e" data-kw="Mary|Mediator|Invocation of saints|Idolatry">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/albert-barnes.html">Albert Barnes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on the Bible</cite>, 1 Timothy 2:5</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.”

— Albert Barnes, Notes on the Bible, 1 Timothy 2:5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+may+be+added+also+that+the+doctrine+of+the+Papists+that+the+saints+or+the+Virgin+Mary+may+act+as+mediators+to+procure+blessings+for+us%2C+is+false.+There+is+but+%22one+Mediator%3B%22+and+but+one+is+necessary.+Prayer+offered+to+the+%22saints%2C%22+or+to+the+%22Virgin%2C%22+is+idolatry%2C+and+at+the+same+time+removes+the+one+great+Mediator+from+the+office+which+he+alone+holds%2C+of+making+intercession+with+God.%E2%80%9D%0A%0A%E2%80%94+Albert+Barnes%2C+Notes+on+the+Bible%2C+1+Timothy+2%3A5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffecc17f84e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fecc17f84e.html">Permalink</a><a class="src" href="https://ccel.org/ccel/barnes/ntnotes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary|Mediator|Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</span></figcaption>

</figure><figure class="quote" id="q-4b4b91c99a" data-kw="Mary Invocation of saints Mediator">
<blockquote><p>Can she not furthermore be venerated as a mediator and intercessor between God and us with the honour of invocation? Answer: No, since no one should be invoked except God alone in Christ, our only Mediator, Saviour, and Intercessor.</p></blockquote>

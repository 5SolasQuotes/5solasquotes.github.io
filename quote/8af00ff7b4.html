<blockquote><p>47. The matter may further be thus illustrated: there is almost the like respect and consideration of the magistrate as he is occupied about the outward things of the church, and of the ecclesiastical ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience.

It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the word of God, and out of it to show the magistrate his duty, to wit, how he ought to govern the commonwealth, and in what manner he ought to use the sword. The former is proper and peculiar to the magistrate (neither doth the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred and Eleven Propositions Concerning the Ministry and Government of the Church</cite>, (1647; Edinburgh, 1844), p. 13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a1d55b285" data-kw="">
<blockquote><p>Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum</cite>, Jus Divinum, the Divine Right of Church Government, … (1646, 1647, 1654; NY: Robert Martin &amp; Co., 1844), pt. 2, ch. 9, section 1, ‘Of the Proper Receptacle &amp; Distinct Subject of All this Power &amp; Authority of Church Government… That the Political Magistrate is Not the Proper Subject of this Power’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-e3236da1c4" data-kw="">
<blockquote><p>A class of subjects same to be discussed in the latter part of the sixteenth century which had not engaged so much of the attention of the earlier Reformers–especially the Erastian and the Prelatic controversies–and in the discussion of these matters Beza bore his part nobly as an able and faithful champion of the truth. The Erastian controversy, indeed, as conducted between Erastus and Beza, turned mainly upon the particular subject of the excommunication of church members; and it was not till the following century, that the whole of the principles usually regarded by Presbyterian divines as comprehended in the Erastian controversy, were subjected to a full and thorough discussion. Still, even at that early stage, the quested was mooted, on which the entire progress of the subsequent discussion, down even to our own day, has made it more and more manifest that the whole controversy hinges–viz. whether or not Christ has appointed in His church a government, distinct from, independent of, and in its own province not subordinate to, civil magistracy. And on this great question, as well as on the particular topic of excommunication comprehended under it, Erastus took the side which has always been supported by politicians, sycophants [obedient flatterers], and worldlings, while Beza ably defended that which has been adhered to by all intelligent and conscientious Presbyterians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation</cite>, ch. 7, ‘Calvin &amp; Beza’, pp. 350-51</span></figcaption>

</figure><figure class="quote" id="q-eed89394a8" data-kw="">
<blockquote><p>The next debate of this nature and kind that fell in was, first, about accepting the [civil] indulgence, then about hearing indulged ministers. As to the first, this made no schism, so long as ministers held their debates among themselves. Some accepted, some not. Those who accepted preached in those parishes where they were indulged; others elsewhere, and sometimes there with them. The indulged ministers also preached elsewhere as they had occasion and access, but thought it not duty to offend the magistrate in breaking confinement to go unnecessarily elsewhere to preach, and thereby hazard the peaceable public exercise of their ministry, which was all they acknowledged they held of the magistrate… neither thought they the keeping of their confinement, though unjustly imposed, a sin, but rather suffering on their part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh] 1712) Hamilton was a Church of Scotland minister., pp. 17-18</span></figcaption>

<blockquote><p>[John] Maxwell had written his [1644] book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-877648de6e" data-kw="">
<blockquote><p>Thesis: A preacher not only must declare the heads of doctrine, but also the heads of practice. For Scripture is useful not only for doctrine, but also for rebuke and correction, and so forth (2 Tim. 3:16), and the Christian religion is doctrine according to godliness (1 Tim. 6:3). And this is especially true since the Saviour likewise and even more hangs the salvation of hearers upon their practice than upon their knowledge (John 13:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Method of Preaching in Theoretical-Practical Theology Volume 1: Prolegomena</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-a4bac88a81" data-kw="">
<blockquote><p>Article 13, Private Worship None may preach the Word with us but pastors and the sons of the prophets, and such of their sort who aim at the holy ministry, and that authority Ecclesiastical must warrant them is clear by our Law and practice, as it was in the Jewish Church, 1 Sam. 10:5; 2 Kings 2:7; 2 Kings 4:1; 1 Kings 20:35. … Our Assembly also commands godly conference at all occasional meetings, or as God’s providence shall dispose, as the Word of God commands, Heb. 3:13; 1 Thess. 5:11,12; Lev. 19:17; Zech. 8:21; Mal. 3:16; Col. 3:16, providing none invade the pastor’s office to preach the word who are not called thereunto by God and his Church, Heb. 5:4,5; Rom. 10:14-15; 1 Cor. 12:28,29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful?</span></figcaption>

</figure><figure class="quote" id="q-52542a4692" data-kw="">

<blockquote><p>A man preaches that sermon only well unto others which preaches itself in his own soul. And he that does not feed on and thrive in the digestion of the food which he provides for others will scarce make it savoury unto them; yea, he knows not but the food he has provided may be poison, unless he have really tasted of it Himself. If the Word do not dwell with power in us, it will not pass with power from us.</p></blockquote>

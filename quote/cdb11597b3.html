<main class="wrap"><figure class="quote" id="q-cdb11597b3" data-kw="">
<blockquote><p>Nay, brethren, ye are ordained of God to rule and govern your own houses in God’s true fear, and according to his holy Word – within your own houses, I say, in some cases ye are bishops and kings; your wives, children, and family are your bishopric and charge; of you it shall be required how carefully and diligently ye have instructed them in God’s true knowledge; how ye have studied, in them to plant virtue, and to repress vice. And therefore I say, ye must make them partakers in reading, exhortation, and in making common prayers; which I would, in every house were used once a day at least. But above all things, dear brethren, study to practise in life that which the Lord commands, and then ye assured, that ye shall never hear nor read the same without fruit. And this much for the exercises within your houses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most wholesome counsel how to behave ourselves in the midst of this wicked generation, touching the daily exercise of God s most holy and sacred word (1556)’ in R. S. Candlish (ed.), Select practical writings of John Knox</cite></span></figcaption>

<blockquote><p>Whether, according to our manner of conceiving, we distinguish that decree into several [acts], or whether we say that it is one [act], it is not much to be concerned about. For it is certain among all, that God willed all things and each individual thing by one most simple act of His will. For His will, and the operation of His will, is the same as his simple and undivided essence. If someone were to contend that even according to our manner of understanding, there is one single most simple act of the will, I would not be concerned.</p></blockquote>

<blockquote><p>16. God’s providence extensively is occupied concerning all both entities and acts of entities, and intensively is partly effective, partly permissive, partly directive.

17. Works of grace are either preparatory of it [i.e. decrees] or applicatory.

18. Secondary preparatory works of grace [such as infra decrees] can be given; primary ones [such as supra decrees] cannot be given.

19. Secondary preparatory works of grace are the eternal destination of the Mediator, and his temporal mission, and the obedience of the one sent, consisting both in his appearance and in the execution of the threefold office undertaken by him. …

24. Applicatory works of grace are either external or internal.

25. External ones are both calling through the Word partly of law, partly of gospel, and the sealing of those called through sacraments.</p></blockquote>

</figure><figure class="quote" id="q-9d7bd937c1" data-kw="">
<blockquote><p>Predestination &amp; Reprobation Contrasted 1. The [Westminster] Confession does not teach or imply a double predestination. In an attempt to distinguish between election and reprobation we should use predestination for the elect and foreordination for the reprobate [as the Confession does].

2. Election and reprobation rest on different grounds: election on the redeeming love of God that undertakes the salvation of the lost; reprobation on the moral necessity to manifest to the universe the nature and consequences of sin in moral personality.

3. Means are used of God to fulfil the purpose of election, but God uses no means to fulfil His purpose of reprobation. It is left to sin to run its course and receive its wages.

4. The fruits of election are attributable to divine grace, the fruits of reprobation to personal sin. This means that while there is grace to some, there is injustice to none.

5. While God finds pleasure in the salvation of the elect, He has sworn by Himself that He has no pleasure in the death of the wicked. God does not need sin or its retribution for His self-manifestation, but its reality in the universe can serve that end.

6. That the elect will constitute a recreation of the race under a new Head is evident, while the reprobate are but the branches cut off from the tree of humanity. Christ will be revealed as the Savior of the world, though many are lost in the process.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-a-finlayson.html">R.A. Finlayson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Theological Writings of R.A. Finlayson</cite>, p. 265. Finlayson was a Free Church of Scotland professor during the mid-1900’s.</span></figcaption>

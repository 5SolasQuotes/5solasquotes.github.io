</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31b9668161" data-kw="">
<blockquote><p>Customs laudable are grounded upon decency and reason, and so moral, or grounded upon no reason at all. But Christ did nothing in God’s worship, nor did He any human moral actions for the mere fact and will of others going before, for these were not reasonable human actions; and if it [sitting at the First Lord’s Supper] be customable only, it is not lawful to put away a customable action out of worship, and to put a moral action of kneeling and divine signification in the place thereof, for so we might change places, times, persons and all physical circumstances, and make them supernatural.</p></blockquote>

</figure><figure class="quote" id="q-d353662d30" data-kw="">
<blockquote><p>…whereat Paybody [a Formalist] starts and replies that the gestures which the people of God used in circumcision and baptism, the renting of the garment used in humiliation and prayer, Ezra 9:5; 2 Kings 22:19; Jer. 36:24, lifting up the hands, kneeling with the knees, uncovering the head in the sacrament, standing and sitting at the sacrament, were and are significant in worshipping, yet are not forbidden by the 2nd Commandment. Answer: There are three sorts of signs here to be distinguished:

1. Natural signs: so smoke is a sign of fire, and the dawning of the day a sign of the rising of the sun.

2. Customable signs, and so the uncovering of the head, which of old [in the OT, exampled by the priests] was a sign of preeminence, has through custom become a sign of subjection [such as in 1 Cor. 11].

3. Voluntary signs, which are called signa instituta; these are either sacred or civil. To appoint sacred signs of heavenly mysteries or spiritual graces, is God’s own peculiar, and of this kind are the holy sacraments. Civil signes for civil and moral uses, may be and are commendably appointed by men, both in Church and commonwealth, and thus the tolling of a bell is a sign given for assembling, and has the same signification both in ecclesiastical and secular assemblings. Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For which of you, says our Master [Lk. 17:7], having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat. All these signs have their significations from nature. … Secondly, customable signs have likewise place in divine service, for so a man coming into one of our churches, in time of public worship, if he see the hearers covered, he knows by this customable sign that [the] sermon is begun. Thirdly, civil or moral signs instituted by men, for that common order and decency, which is respect both in civil and sacred actions, have also place in the acts of God’s worship. Thus a basen and a laver set before a pulpit are signs of baptism to be ministered: but common decency teaches us to make the same use of basin and a laver in civility which a minister makes of them in the action of baptizing. All our question [with the Formalists, on the other hand] is about sacred mystical signs. Every sign of this kind, which is not ordained of God, we refer to the imagery forbidden in the 2nd Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’ | ch. 5, ‘5th Argument… taken from the mystical &amp; significant nature of them’, pp. 85-86</span></figcaption>

</figure><figure class="quote" id="q-da8e06a952" data-kw="">
<blockquote><p>As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished, they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first, being almost, if not quite forgotten by those that use them, and are become but as civil customs that have no state in religious worship, experience shows, that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it; but to exasperate rulers and make opposites more violent in their way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667), ch. 7, sect. 16, pp. 263-64</span></figcaption>

</figure><figure class="quote" id="q-37f7de4951" data-kw="">
<blockquote><p>Fourthly a confusion of gestures lawful, and unlawful is brought into the Lord’s table, some sitting like guests at a feast, as Christ, and his apostles sat, others like supplicants kneeling, and adoring upon their knees. This confusion is not like that variety of gesture in time of prayer, when some sit, some stand, some kneel. For all the three gestures are there indifferent. But not so here; this confusion of gestures at the Lord’s table now is permitted only for a snare to bring thy feet within the grin. For when all are brought in, then will the formalists cry out, ‘Confusion of gestures is intolerable, uniformity and conformity is necessary,’ as Doctor Sparke does in his persuasion to uniformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute upon Communicating at our Confused Communions</cite>, (Amsterdam, 1624), ch. 5, ‘Of Kneeling in the Act of Receiving the Sacramental Elements’, pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“Fourthly a confusion of gestures lawful, and unlawful is brought into the Lord’s table, some sitting like guests at a feast, as Christ, and his apostles sat, others like supplicants kneeling, and adoring upon their knees. This confusion is not like that variety of gesture in time of prayer, when some sit, some stand, some kneel. For all the three gestures are there indifferent. But not so here; this confusion of gestures at the Lord’s table now is permitted only for a snare to bring thy feet within the grin. For when all are brought in, then will the formalists cry out, ‘Confusion of gestures is intolerable, uniformity and conformity is necessary,’ as Doctor Sparke does in his persuasion to uniformity.”

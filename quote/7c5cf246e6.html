</figure><figure class="quote" id="q-38b795f294" data-kw="">
<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646) | Question 5</cite>, p. 59</span></figcaption>

</figure><figure class="quote" id="q-7f4649e9c9" data-kw="">
<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-amos-comenius.html">John Amos Comenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Labyrinth of the World &amp; the Paradise of the Heart ed. and tr. Count Lutzow (1623; Dent, 1905) 306 pp.</cite>, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

tion (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.”

2C+pp.+23%2C+91-92%2C+104.+For+the+creedal+Profession+and+20+Propositions+of+the+discipline+of+the+Association%2C+typed+out%2C+see+below.+See+also+%E2%80%98A+Brief+Explication+of+Some+Passages+in+the+Profession%E2%80%99.+%E2%80%98An+Explication+of+Some+Passages+in+the+Propositions%E2%80%99+gives+a+lot+more+of+the+philosophy+of+the+whole.+Cooper%3A+%E2%80%9CEngland+had+a+divided+church.+Even+among+puritans%2C+fault+lines+had+visibly+widened+under+the+pressure+of+the+civil+war+and+its+aftermath.+After+his+own+traumatic+experience+of+the+war%2C+Baxter+longed+for+order+and+peace%2C+and+he+developed+a+lifelong+yearning+to+bring+Christians+together+in+unity.+He+identified+four+main+parties+within+the+English+church+%28Congregationalists%2C+Episcopalians%2C+Erastians%2C+and+Presbyterians%29%2C+but+he+felt+that+the+moderates+within+each+party+held+similar+views+and%2C+more+importantly%2C+could+work+together+in+practice+even+if+their+principles+varied.+He+believed+that+if+England%E2%80%99s+ministers+simply+got+on+with+the+work+of+ministry%2C+they+would+be+too+busy+to+notice+how+their+differing+doctrines+of+church+government+might+otherwise+keep+them+apart.+So+he+formed+the+Worcestershire+Association%2C+a+network+open+to+local+parish+ministers+of+all+stripes+who+met+monthly+for+the+purpose+of+mutual+edification+and+encouragement.+In+1653+they+published+their+agreement+to+work+together%2C+and+similar+ministerial+associations+sprang+up+in+other+counties.%E2%80%9D%0A%0A%E2%80%94+John+Amos+Comenius%2C+The+Labyrinth+of+the+World+%26+the+Paradise+of+the+Heart+ed.+and+tr.+Count+Lutzow+%281623%3B+Dent%2C+1905%29+306+pp.%2C+p.+23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f4649e9c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f4649e9c9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=During%20his%20formative%20years%2C%20while

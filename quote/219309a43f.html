<blockquote><p>The excellency of the work is argued jointly from the relations betwixt God and his Church, and the office which Reformers do. The Church is God’s Garden, which being planted with all variety of flowers is apt to be overgrown with weeds, that not only mar the beauty of it, but eat out the good herbs: Reformers, their work is to weed the Lord his garden, throw out all those noisome herbs which would have spoiled all the good ones.

The Church is the Lord’s Orchard, wherein trees of all kinds, both for fruit and medicine, grow upon the banks thereof: The Master of that Orchard is impatient of any such trees that cumber the ground, and after many years bear no fruit; Reformers, their work is to root out the plants that God never planted.

The Church is God’s house, where he delights to dwell; Reformers are to cast out all the dirt, dross, and garbage that was odious and irksome to the Master of the house; they sweep down all the cobwebs wherein the Spiders did build.

The Church is God’s Spouse, in whose beauty his soul delights; that she should be deformed with strange attire, ornaments borrowed from notorious strumpets, the Lord cannot endure; Reformers they strip her of all her harlotry attire, take off all her Jezabel-like paintings, and render her to Christ in her native simplicity. The Church is the Lord’s Vineyard, which he keeps and waters every moment; Reformers their work is to take the Foxes that destroy the Vines. How welcome should the feet of such be? and how should the precious nature of the work in relation to God, draw out all our strength?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-bowles.html">Oliver Bowles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zeal for God’s house quickened: or, A sermon preached before the assembly of Lords, Commons, and Divines, at their solemn fast July 7. 1643. In the Abbey Church at Westminster. Expressing the eminency of zeal requisite in church reformers</cite>, (London: Samuel Gellibrand, 1643), pp 9-10.</span></figcaption>

<blockquote><p>XIX…

I. The moral precepts are known by nature, and therefore eternal, and obligate all men: The rest are not so.

II. The moral precepts are the principal worship of God; the ceremonial and forensic are subordinate, but serve the moral precepts, and therefore yield to them.

III. The moral precepts obligate all rational creatures; the others obligate the Jews only.

IV. The ceremonial and forensic are typical; the moral are antitypical.

V. The moral are general; the ceremonial and forensic are special and determinate.</p></blockquote>

</figure><figure class="quote" id="q-68154e201b" data-kw="">
<blockquote><p>We would beware of forming Ideas, representations, or shapes of that One God and Three Persons in the heart, or in the head: these cannot but be derogatory to Him, being a likeness to Him of our own up-setting in our hearts: and cannot but diminish that Authority, which the true God should have in our hearts. We would remember therefore that He is purely Spiritual, whom no eye hath seen, nor can see: and therefore all such imaginations, are to be abandoned and abhorred. …

We would beware of dividing the Object of Worship, or separating the Three blessed Persons in our worshipping of them, even in our imagination; as if when One is named, we were not praying unto, and worshipping both the other; and as if the Son were an other God than the Father or Spirit, &amp;c. But still this would be remembered, that what ever Person be named, He is God, and that same One God with the other Two: and therefore the Object of Worship, is ever the same One God, Father, Son, and Spirit, that are but One God.

We Worship the Father, the Son, and the Spirit; but we do not Worship the Father, or the Son, or the Spirit, as if He who is not named, were less worshipped than He who is named: and seeing the Son and holy Ghost, are the same God with the Father (the former ground being laid) it’s all one thing what ever Person be named, though in Scripture sometimes respect is had to their order of subsisting and operating; and so the Father is only named sometimes to be the ground upon, and by which, we have access to God; and so, the Son, only is named.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), p. 9.</span></figcaption>

<blockquote><p>As every law whatsoever is either Divine or human, and every Divine law either published in scripture or implanted in nature; so every law that is published in scripture is either ceremonial, judicial, or moral: which distinction seems to be intimated in these words; Now these are the commandments, statutes, and the Judgments, which the Lord commanded to teach you, Deut. vi. 1: where by commandments we may understand the moral, by statutes the ceremonial, and by judgments the judicial law of God. Now what we ought to believe concerning these three laws is here set down in this part of the article [7 of the 39 Articles].

First, concerning the ceremonial law, it is here said, Although the law given from God by Moses, as touching ceremonies and rites, do not bind Christian men, implying, that that law is now of no force and virtue in obliging us to obedience, as it did the Jews: where we may briefly consider, first, what this law was; secondly, how it appears to be now disannulled. As for the first, what this law was, it is plain that it was that law whereby God was pleased to determine the outward circumstances of his own worship, and the outward performances of his people’s lives, containing several precepts:

1st, concerning their sacraments, viz. circumcision, and the eating of the paschal lamb; to which may be added also the eating of the shewbread, and their purification from several uncleannesses, as when any one was a leper, had touched a dead body, or the like.

2dly, Concerning their sacrifices; whether sin-offerings, or heave-offerings, or burnt-offerings; whether offered by the high priest only, by the ordinary priest, by all the people, or private persons; as also whether they were of living creatures, as goats or kids, rams or lambs, heifers or calves, doves or turtles; or inanimate, as bread or wine or oil.

3dly, Concerning their holy things: as, first, their holy places; as the tabernacle and temple, the one carried up and down, the other fixed, divided into three parts; the holy of holies, where the high priest only came, and that but once a year; the sanctuary, where the ordinary priests went continually; and the outward court, where the people stood: secondly, holy times; as their sabbaths, new moons, passover, pentecost, feast of tabernacles, the feast of in-gathering, the feast of trumpets, the day of atonement, Lev. xxiii.; the sabbatical year also, and the year of jubilee.

4thly, Concerning outward observances in priests or people; as, not to eat such and such flesh, not to wear such and such clothes, not to plough with an ox and an ass together, and such like.

Thus we see what these ceremonies and rites were. Now, secondly, that they are not obligatory unto us, as they were to the Jews, appears from the determination of that canonical synod holden by the apostles themselves at Hierusalem. Acts xv. where this question being debated, whether circumcision, and so the other ceremonies of the law should be enjoined the Gentiles, they determined it in the negative, that the Gentiles which were turned to God should not be troubled with these things. Hence it is that we read St. Paul, writing to the Colossians, Let no man therefore judge you either in meat or drink, or in respect of a holy day, new moon, or sabbath days, Col. ii. 16; and to the Galatians, If you be circumcised, Christ profiteth you nothing, Gal. v. 2. And he acquaints the Hebrews with the reason of it; For the priesthood being changed, there is made of necessity a change also of the law, Heb. vii. 19, viz. the ceremonial law, which being at the first instituted and imposed only until the time of reformation, Heb. ix. 10, even until the coming of Christ, who was the substance of those shadows and the truth of those types, there was no need of them when once himself was come, nor indeed any law for them.

For seeing the law enjoined them for no longer a time than till Christ was come, and the time in his coming being expired, the law enforcing them must needs be disannulled. So that now we are no ways bound to use any of the aforesaid ceremonies, they being no furtherances now, as they were under the law, but rather hindrances of our faith in Christ the substance: but they are to us Christians as if they had never been imposed at all upon the Jews, even without any binding or obligatory force at all in them, as the Fathers taught of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 230-32.</span></figcaption>

3dly, Concerning their holy things: as, first, their holy places; as the tabernacle and temple, the one carried up and down, the other fixed, divided into three parts; the holy of holies, where the high priest only came, and that but once a year; the sanctuary, where the ordinary priests went continually; and the outward court, where the people stood: secondly, holy times; as their sabbaths, new moons, passover, pentecost, feast of tabernacles, the feast of in-gathering, the feast of trumpets, the day of atonement, Lev. xxiii.; the sabbatical year also, and the year of jubilee.

4thly, Concerning outward observances in priests or people; as, not to eat such and such flesh, not to wear such and such clothes, not to plough with an ox and an ass together, and such like.

Thus we see what these ceremonies and rites were. Now, secondly, that they are not obligatory unto us, as they were to the Jews, appears from the determination of that canonical synod holden by the apostles themselves at Hierusalem. Acts xv. where this question being debated, whether circumcision, and so the other ceremonies of the law should be enjoined the Gentiles, they determined it in the negative, that the Gentiles which were turned to God should not be troubled with these things. Hence it is that we read St. Paul, writing to the Colossians, Let no man therefore judge you either in meat or drink, or in respect of a holy day, new moon, or sabbath days, Col. ii. 16; and to the Galatians, If you be circumcised, Christ profiteth you nothing, Gal. v. 2. And he acquaints the Hebrews with the reason of it; For the priesthood being changed, there is made of necessity a change also of the law, Heb. vii. 19, viz. the ceremonial law, which being at the first instituted and imposed only until the time of reformation, Heb. ix. 10, even until the coming of Christ, who was the substance of those shadows and the truth of those types, there was no need of them when once himself was come, nor indeed any law for them.

For seeing the law enjoined them for no longer a time than till Christ was come, and the time in his coming being expired, the law enforcing them must needs be disannulled. So that now we are no ways bound to use any of the aforesaid ceremonies, they being no furtherances now, as they were under the law, but rather hindrances of our faith in Christ the substance: but they are to us Christians as if they had never been imposed at all upon the Jews, even without any binding or obligatory force at all in them, as the Fathers taught of old.”

— William Beveridge, Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 230-32.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+every+law+whatsoever+is+either+Divine+or+human%2C+and+every+Divine+law+either+published+in+scripture+or+implanted+in+nature%3B+so+every+law+that+is+published+in+scripture+is+either+ceremonial%2C+judicial%2C+or+moral%3A+which+distinction+seems+to+be+intimated+in+these+words%3B+Now+these+are+the+commandments%2C+statutes%2C+and+the+Judgments%2C+which+the+Lord+commanded+to+teach+you%2C+Deut.+vi.+1%3A+where+by+commandments+we+may+understand+the+moral%2C+by+statutes+the+ceremonial%2C+and+by+judgments+the+judicial+law+of+God.+Now+what+we+ought+to+believe+concerning+these+three+laws+is+here+set+down+in+this+part+of+the+article+%5B7+of+the+39+Articles%5D.%0A%0AFirst%2C+concerning+the+ceremonial+law%2C+it+is+here+said%2C+Although+the+law+given+from+God+by+Moses%2C+as+touching+ceremonies+and+rites%2C+do+not+bind+Christian+men%2C+implying%2C+that+that+law+is+now+of+no+force+and+virtue+in+obliging+us+to+obedience%2C+as+it+did+the+Jews%3A+where+we+may+briefly+consider%2C+first%2C+what+this+law+was%3B+secondly%2C+how+it+appears+to+be+now+disannulled.+As+for+the+first%2C+what+this+law+was%2C+it+is+plain+that+it+was+that+law+whereby+God+was+pleased+to+determine+the+outward+circumstances+of+his+own+worship%2C+and+the+outward+performances+of+his+people%E2%80%99s+lives%2C+containing+several+precepts%3A%0A%0A1st%2C+concerning+their+sacraments%2C+viz.+circumcision%2C+and+the+eating+of+the+paschal+lamb%3B+to+which+may+be+added+also+the+eating+of+the+shewbread%2C+and+their+purification+from+several+uncleannesses%2C+as+when+any+one+was+a+leper%2C+had+touched+a+dead+body%2C+or+the+like.%0A%0A2dly%2C+Concerning+their+sacrifices%3B+whether+sin-offerings%2C+or+heave-offerings%2C+or+burnt-offerings%3B+whether+offered+by+the+high+priest+only%2C+by+the+ordinary+priest%2C+by+all+the+people%2C+or+private+persons%3B+as+also+whether+they+were+of+living+creatures%2C+as+goats+or+kids%2C+rams+or+lambs%2C+heifers+or+calves%2C+doves+or+turtles%3B+or+inanimate%2C+as+bread+or+wine+or+oil.%0A%0A3dly%2C+Concerning+their+holy+things%3A+as%2C+first%2C+their+holy+places%3B+as+the+tabernacle+and+temple%2C+the+one+carried+up+and+down%2C+the+other+fixed%2C+divided+into+three+parts%3B+the+holy+of+holies%2C+where+the+high+priest+only+came%2C+and+that+but+once+a+year%3B+the+sanctuary%2C+where+the+ordinary+priests+went+continually%3B+and+the+outward+court%2C+where+the+people+stood%3A+secondly%2C+holy+times%3B+as+their+sabbaths%2C+new+moons%2C+passover%2C+pentecost%2C+feast+of+tabernacles%2C+the+feast+of+in-gathering%2C+the+feast+of+trumpets%2C+the+day+of+atonement%2C+Lev.+xxiii.%3B+the+sabbatical+year+also%2C+and+the+year+of+jubilee.%0A%0A4thly%2C+Concerning+outward+observances+in+priests+or+people%3B+as%2C+not+to+eat+such+and+such+flesh%2C+not+to+wear+such+and+such+clothes%2C+not+to+plough+with+an+ox+and+an+ass+together%2C+and+such+like.%0A%0AThus+we+see+what+these+ceremonies+and+rites+were.+Now%2C+secondly%2C+that+they+are+not+obligatory+unto+us%2C+as+they+were+to+the+Jews%2C+appears+from+the+determination+of+that+canonical+synod+holden+by+the+apostles+themselves+at+Hierusalem.+Acts+xv.+where+this+question+being+debated%2C+whether+circumcision%2C+and+so+the+other+ceremonies+of+the+law+should+be+enjoined+the+Gentiles%2C+they+determined+it+in+the+negative%2C+that+the+Gentiles+which+were+turned+to+God+should+not+be+troubled+with+these+things.+Hence+it+is+that+we+read+St.+Paul%2C+writing+to+the+Colossians%2C+Let+no+man+therefore+judge+you+either+in+meat+or+drink%2C+or+in+respect+of+a+holy+day%2C+new+moon%2C+or+sabbath+days%2C+Col.+ii.+16%3B+and+to+the+Galatians%2C+If+you+be+circumcised%2C+Christ+profiteth+you+nothing%2C+Gal.+v.+2.+And+he+acquaints+the+Hebrews+with+the+reason+of+it%3B+For+the+priesthood+being+changed%2C+there+is+made+of+necessity+a+change+also+of+the+law%2C+Heb.+vii.+19%2C+viz.+the+ceremonial+law%2C+which+being+at+the+first+instituted+and+imposed+only+until+the+time+of+reformation%2C+Heb.+ix.+10%2C+even+until+the+coming+of+Christ%2C+who+was+the+substance+of+those+shadows+and+the+truth+of+those+types%2C+there+was+no+need+of+them+when+once+himself+was+come%2C+nor+indeed+any+law+for+them.%0A%0AFor+seeing+the+law+enjoined+them+for+no+longer+a+time+than+till+Christ+was+come%2C+and+the+time+in+his+coming+being+expired%2C+the+law+enforcing+them+must+needs+be+disannulled.+So+that+now+we+are+no+ways+bound+to+use+any+of+the+aforesaid+ceremonies%2C+they+being+no+furtherances+now%2C+as+they+were+under+the+law%2C+but+rather+hindrances+of+our+faith+in+Christ+the+substance%3A+but+they+are+to+us+Christians+as+if+they+had+never+been+imposed+at+all+upon+the+Jews%2C+even+without+any+binding+or+obligatory+force+at+all+in+them%2C+as+the+Fathers+taught+of+old.%E2%80%9D%0A%0A%E2%80%94+William+Beveridge%2C+Ecclesia+Anglicana+Ecclesia+Catholica%3B+or%2C+The+Doctrine+of+the+Church+of+England+Consonant+to+Scripture%2C+Reason%2C+and+Fathers%3A+In+a+Discourse+upon+the+Thirty-Nine+Articles+Agreed+upon+in+the+Convocation+held+at+London+MDLXII%2C+in+The+Theological+Works+of+William+Beveridge%2C+D.D.+%2812+vols%2C+Oxford%3A+John+Henry+Parker%2C+1842-48%29%2C+7%3A+230-32.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F15b399ad89.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/15b399ad89.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/14/william-beveridge-on-the-ceremonial-laws/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

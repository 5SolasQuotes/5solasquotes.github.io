<main class="wrap"><figure class="quote" id="q-8994f6114d" data-kw="">
<blockquote><p>As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, (Edinburgh, 1894), pp. 193-94 Also reprinted by Banner of Truth. Rutherford is here quoting from some other public document, possibly from the Latin of David Calderwood’s Altar of Damascus, p. 595. | Letter 91, to Robert Gordon of Knockbrex</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83366dc9c8" data-kw="">
<blockquote><p>The reasons the man adds of this his assertion contain the grand plea of all idolaters, heathenish and antichristian: &quot;Whatever is given to them,&quot; saith he, &quot;who are in that subordination is given to God.&quot; So said the Pagans of old, so say the Papists at this day; all redounds to the glory of God, when they worship stocks and stones, because he appoints them so to do. And so said the Israelites when they worshipped the golden calf: &quot;It is a feast to Jehovah.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, ch. 19</span></figcaption>

<blockquote><p>From all this it appears that the Romanists worship images in the same way that the heathen of old did, and pagans of our own day still do. They &quot;bow down to them and serve them.&quot; They pay them all the external homage which they render to the persons they are intended to represent.</p></blockquote>

</figure><figure class="quote" id="q-8757ce69f8" data-kw="">
<blockquote><p>…the office-power, no, not though it were from idolaters, for idolatrous purposes, does not make persons actually idolaters, till they do actually exhibit divine worship to a creature. Suppose a person be ordained a priest to offer sacrifice-propitiatory for the quick and dead in the mass; yet if he repent thereof, and never do adore the breaden-god, he is not an idolater: Yea, suppose he act in baptizing, preaching, marrying, burying according to the rituals of the Romanists, by virtue of his ordination as a priest, or, as this author speaks, his office-power, without exhibiting any divine worship to a creature (which in some of these may be), yet is he not thereby an idolater. The reason whereof is manifest, because he is not an idolater to whom the definition of idolatry agrees not. And this is the reason why, if Jeroboam’s priests, though consecrated for the worship of idols, did not worship them, they were not to be accounted idolaters: Nor are those that act by virtue of authority committed to them in matters civil, from rebels [such as Oliver Cromwell], equally guilty of rebellion as those from whom they derive that their authority, unless they act rebelliously; if they act for the restitution of their prince, the public peace, they are accounted good subjects [as many did under Cromwell], and not rebels, though at first they derived their authority from rebels. Nor does the worshipping of God by a form merely of humane composition make idolaters, though it have been abused to idolatry with the rites and modes of idolaters, unless there be idolatry in the form, and the rites and modes be idolatrous in their use: because, notwithstanding this, no divine worship may be given to a creature. So, though the form of baptism in the Roman Church were merely of human composition, used with crossings, cream, oil, spittle, if these rites were used, though by them abused to idolatry, not as they do, so as to give divine worship to a creature, the users in this manner, however guilty of will-worship or superstition, yet would not be justly chargeable with idolatry; no, not though they should in some sort symbolize with idolaters, that is, be assimilated to them or in some sort comply with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) | Sect. 11. Acting in the holy things of God, by an Office-power and modes of Idolaters, may be without Idolatry, Ch. 7; pp. 245-46</span></figcaption>

<main class="wrap"><figure class="quote" id="q-53e153ff97" data-kw="">
<blockquote><p>1. It is certain that it is the parents great duty to bring up their children in the nurture and admonition of the Lord.

2. It is certain that God has appointed this to be the means of their actual knowledge, faith and holiness. (Eph. 6:4-5; Col. 3:21; Gen. 18:19; Dt. 6:6-8 &amp; 11:18-20)

3. And God does not appoint such means unnecessarily or in vain: nor may we ordinarily expect his grace but in the use of the means of grace, which He has appointed us to use.

4. It is certain that God’s receiving the children of the faithful is an act of God’s love to the parents as well as the children, and promised as a part of his blessing on themselves. …

6. Even before children are capable of instruction, there are certain duties imposed by God on the parents for their sanctification, viz.:

1. That the parents pray earnestly and believingly for them.

2. That they themselves so live towards God as may invite Him still to bless their children for their sakes, as he did Abraham’s, and usually did to the faithful’s seed. (2nd Commandment; Prov. 20:7)

7. It is certain that the Church ever required parents not only to enter their children into the Covenant, and so to leave them, but to do their after duty for their good, and to pray for them, and educate them according to their Covenant.

8. It is plain that if there were none to promise so to educate them, the Church would not baptize them. And God Himself, who allowed the Israelites, and still allows us, to bring our children into his Covenant, does it on this supposition, that we promise also to go on to do our duty for them, and that we actually do it.

9. All this set together maketh it plain:

1. That God never promises the adult in baptism, though true believers, that He will work in them all graces further by his sanctifying Spirit, let them never so much neglect or resist Him: or that He will absolutely see that they never shall resist Him: nor that the Spirit shall still help them, though they neglect all his means; or that He will keep them from neglecting the means (election may secure this to the elect as such; but the Baptismal Covenant as such secures it not to the baptized, nor to believers as such).

2. And consequently… that the Holy Ghost as your Sanctifier will afford you all necessary help in the use of those means which He has appointed you to receive his help in. …

11. And how dangerously parents may make partial forfeitures of the Spirit’s assistance to their children, and operations on them, by their own sinful lives, and neglect of prayer, and of prudent and holy education, even in particular acts, I fear many believing parents never well considered.

12. Yet is not this forfeiture such as obliges God to deny his Spirit: For He may do with his own, as a free benefactor, as He list; and may have mercy freely, beyond his promise (though not against his Word) on whom He will have mercy. But I say that He that considers the woeful unfaithfulness and neglect of most parents, even the religious, in the great work of holy educating their children, may take the blame of their ungodliness on themselves, and not lay it on Christ or the Spirit who was in Covenant with them as their Sanctifier, seeing He promised but conditionally to give them the sanctifying heavenly influences of his life, light, and love, in their just use of his appointed means, according to their abilities.

13. Also as soon as children come to a little use of reason, they stand conjunctly on their parents’ wills and on their own. As their parents are bound to teach and rule them, so they are bound to learn of them and be ruled by them for their good. And though every sin of a parent or a child be not a total forfeiture of grace, yet both their notable actual sins may justly be punished with a denial of some further help of the Spirit which they grieve and quench.</p></blockquote>

<blockquote><p>Neither is that after-consent by acceptance and submission which Mr. [John] Robinson speaks of [with reference to a pastor and his hearers] so slight a matter for this purpose as he would make it. For as in wedlock, the after-consent of parents or parties does often make that a lawful state of marriage which before and without that was none: and in government, acceptance and submission does make him a king which before was a tyrant, though in their nature these actions be rather consequences than causes of that calling; so is it [sometimes] betwixt minister and people.</p></blockquote>

<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>

— John Horn, …A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNor+yet+do+%5Bthey%2C+the+apostles%5D+make+their+being+of+a+household+simply+the+ground+of+their+being+baptized%3B+for+I+confess+there+may+be+diverse+in+and+of+a+houshold%2C+that+in+some+case%2C+that+is%2C+of+positive+refusing+to+stoop+to+the+Gospel%2C+may+not+be+baptized%3B+as+an+unbelieving+wife%2C+servant%2C+or+child+grown%2C+they+are+by+persuasion+to+be+won+in%2C+or+else+let+alone%2C+this+springing+from+the+foresaid+ground+of+not+forcing+ordinances+upon+men%3A+But+I+make+the+grounds+of+their+baptism%3A+the+tenor+of+the+commission+that+bids+them+%5Bministers+to%5D+disciple+all+the+gentiles%2C+and+of+the+gospel+holding+forth+grace+to+all%2C+one+and+other%2C+no+man+being+common+or+unclean+in+that+respect+in+God%E2%80%99s+account%2C+but+as+they+render+themselves+so+by+their+willing+rejections+of+the+grace+tendered+to+them%2C+with+their+being+under+the+tuition+of+those+that+profess+faith%2C+and+subjection+to+the+doctrine+of+Christ%2C+and+the+non-resistance+found+in+them%2C+and+the+duty+lying+upon+parents+to+bring+them+up+in+the+nurture+and+admonition+of+the+Lord.+Whence+it+is+to+be+noted%2C+that+it%E2%80%99s+said+of+the+jailor%2C+he+and+all+his%2C+not+all+his+%E2%80%98houshold%E2%80%99%2C+but+all+%E2%80%98his%E2%80%99+were+baptized%3B+possibly+some+in+the+house+might+not+be+in+his+%5Bto%5D+dispose%2C+but+so+many+as+were+his+were+baptized.+If+any+man+say%2C+its+an+act+of+force+to+disciple+an+infant%3B+I+say+no%2C+of+no+more+force+to+baptize+them+to+Christ%2C+than+to+lay+them+in+their+cradles+or+carry+them+in+their+arms%3B+they+have+no+will+nor+reluctancy+against+it%2C+ye+may+do+with+them+what+ye+will%3A+whence+they+are+a+pattern+of+right+entring+the+Kingdom%3A+%E2%80%98He+that+receives+not+the+Kingdom+of+God+as+a+little+child%2C%E2%80%99+etc.+They+receive+it+as+God+and+his+people+order+them+into+it%2C+and+in+it.+And+for+their+discipling+by+instruction%2C+they+usually%2C+if+well+educated%2C+drink+it+in%2C+and+submit+to+it+better+than+others%2C+as+to+the+outward+profession+at+least%2C+as+was+before+said.+And+I+find+not+that+baptism+was+ever+denied+to+any+that+would+submit+themselves+to+learn+the+Christian+profession%E2%80%A6+%E2%80%A6who+yet+when+they+%5Binfants%5D+came+to+years+of+understanding%2C+owning+what+was+in+infancy+done+to+them%2C+were+never+therefore+reputed+members+of+the+Church+or+proselytes+by+compulsion.%E2%80%9D%0A%0A%E2%80%94+John+Horn%2C+%E2%80%A6A+Consideration+of+Infant+Baptism%2C+wherein+the+grounds+of+it+are+laid+down%E2%80%A6+and+many+things+of+Mr+Tombes+%5Ba+Baptist%5D+about+it%E2%80%A6+Answered%E2%80%A6+%28London%2C+1654%29%2C+pp.+38-9+Horn+%281614-1676%29+was+an+English+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd546e837e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d546e837e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Nor%20yet%20do%20%5Bthey%2C%20the%20apostles,the%20Church%20or%20proselytes%20by%20compulsion&amp;text=Nor%20yet%20do%20%5Bthey%2C%20the%20apostles%5D%20make%20their&amp;text=members%20of%20the%20Church%20or%20proselytes%20by%20compulsion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-99709e246d" data-kw="">
<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are:

1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause.

2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism.

3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>

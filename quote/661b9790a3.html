<blockquote><p>4. We may add this consideration, that hitherto toleration of errors and diversity of corrupt opinions have ever been looked upon, and made use of, as a most subtle means for undermining and destroying of the Church. It is marked of that skillful enemy of the Kingdom of Jesus Christ, Julian [A.D. 331-363], that having improven his subtilty to the utmost to find out means to destroy the Church by craft, which his predecessors by violence could not obtain, amongst other means he concluded this: Not to raise open persecution but to give liberty to all the differing bishops and teachers (which then, after the Council of Nicea and Constantine’s death, were very many and bitter in their differences) to follow their own way, and to vent their own opinions without all fear of any restraint: and therefore did call them that he might make intimation thereof to them for their further encouragement therein; The words which he used to them, as they are marked by Ammianus and cited by Lodovicus Molineus (p. 560) are: Ut consopitis civilibus discordiis, suae quisque Religioni serviret intrepidus, that is, in sum, That everyone forbearing civil discords, should worship in his own religion without control or fear: And is it like, that this shall prove a mean useful for the good of the Church, which that expert child of the devil did make use of to destroy the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (1659), pt. 3, ch. 13, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

1b9790a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=4.%20We%20may%20add%20this%20consideration,use%20of%20to%20destroy%20the%20same&amp;text=4.%20We%20may%20add%20this%20consideration%2C%20that%20hitherto&amp;text=did%20make%20use%20of%20to%20destroy%20the%20same" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e6ae97590" data-kw="">
<blockquote><p>Of the promises it is evident, that to lawful powers is given the sword for punishment of malefactors, for maintenance of innocents, and for the profit and utility of their subjects. Now let us consider, whether the reformation of religion fallen in decay, and punishment of false teachers, do pertain to the Civil Magistrate and Nobility of any realm. I am not ignorant that Satan of old time, for maintenance of his darkness, has obtained of the blind world two chief points: Former, he has persuaded to Princes, Rulers, and Magistrates, that the feeding of Christ’s flock appertains nothing to their charge, but that it is rejected [i.e., devolved] upon the bishops and estate ecclesiastical: and secondarily, that the reformation of religion, be it never so corrupt, and the punishment of such as be sworn soldiers in their kingdom, are exempted from all civil power [per Romanism, for the clergy], and are reserved to themselves and to their own cognition. But that no offender can justly be exempted from punishment, and that the ordering and reformation of religion, with the instruction of subjects, does especially pertain to the Civil Magistrate, shall God’s perfect ordinance, his plain Word, and the facts and examples of those that of God are highly praised, most evidently declare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Appellation, to the Nobility and Estates of Scotland</cite>, …’ (1558)</span></figcaption>

<blockquote><p>48. For to that end also is the holy Scripture profitable, to show which is the best manner of governing a commonwealth, and that the Magistrate as being God’s Minister may by this guiding star be so directed, as that he may execute the parts of his office, according to the will of God, and may perfectly be instructed to every good work; yet the Minister is not said properly to treat of civil businesses, but of the scandals which arise about them, or of the cases of conscience which occur in the administration of the commonwealth: So also the Magistrate is not properly said to be exercised about the spiritual things of the Church, but rather about those external things which adhere unto and accompany the spiritual things. … 53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul… … 56. Surely the faithful and godly ministers, although they could do it unchallenged and uncontrolled, and were therein allowed by the Magistrate (as in the prelatical times it was), yet would not usurp the power of life and death, or judge and determine concerning men’s honors, goods, inheritance, division of families, or other civil businesses; seeing they well know these things to be heterogeneous to their office: But as they ought not to entangle themselves with the judging of civil causes… 86. What then? Shall it be lawful ordinarily for ministers and elders to do what they list, or shall the governors in the Churches, glorying in the Law, by their transgression dishonor God? God forbid. For first, if they shall trespass in anything against the Magistrate or municipal Laws, whether by intermeddling in judging of civil causes, or otherwise disturbing the peace and order of the commonwealth, they are liable to civil trial and judgments, and it is in the power of the Magistrate to restrain and punish them.</p></blockquote>

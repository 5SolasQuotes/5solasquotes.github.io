</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f02898842e" data-kw="">
<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>

</figure><figure class="quote" id="q-6e8bda2314" data-kw="">
<blockquote><p>Evangelicals responded similarly to the Scottish cholera epidemic of 1832, organizing weekly, and even nightly, prayer meetings in the hope of arresting the advance of the disease. These meetings supplemented the fast days called by the government at the request of the Church of Scotland… As a result, Evangelicals also saw these public prayer meetings as a suitable context in which to ask God to send religious revival. This latter purpose prevailed after the threat of the epidemic passed away, at least among groups in the parish of Kilsyth, which continued to meet during the remainder of the 1830’s, asking God ‘to awaken a spirit of earnest and vital religion among them, and throughout the Christian Church generally’ .</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-alan-currie.html">David Alan Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Growth of Evangelicalism in the Church of Scotland</cite>, 1793-1843 PhD diss. (Univ. of St. Andrews, 1991)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-e67c526b51" data-kw="">
<blockquote><p>A number of proclamations issued in the relation of the visitation [of the plague in 1665] pertained to the concourse of the people. Under most circumstances the concourse of people was vehemently prohibited in political plague texts, upholding an understanding of material protection against the threat of contagion. However, the persistent belief in the moral dimension of illness manifested in proclamations that gestured to instances when gatherings could be justified, in the interest of providential salvation. On 6 July [1665], measures for designated fast days and the severity of the growing outbreak were proclaimed in a text entitled ‘By the King. A Proclamation for a Generall Fast Throughout the Realm of England’. Fast days during plague had been enacted first during an outbreak in 1563 under Elizabeth I, who, alongside her council and the church, scheduled prayer and fasting, with fasting on Wednesdays… The proclamation [in 1665] requested that citizens not only maintain the request, ‘And that the solemnization of these days may be with such Order and Decency as is requisite’… Meetings in churches continued through the outbreak, though the circumstances changed once many pulpits were left abandoned by their Anglican ministers. The flight of ministers meant nonconformist ministers took up the task of preaching at some of the vacant pulpits. Writing of the height of the epidemic, nonconformist Thomas Vincent described the scene at a church in God’s Terrible Voice in the City: ‘Now there is such a vast concourse of people in the Churches, where these ministers are to be found, that they cannot many times come near the Pulpit doors [in order to enter the pulpit to preach] for the press [of the people]’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-examples.html">Kathleen Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Literary Culture of Plague in Early Modern England Pre</cite>, (Palgrave, 2016), p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>Q. What is the main scope of the First Commandment, ‘Thou shalt have no other Gods before Me?’ A. Here is required all that natural worship of God, whether the same be inward or outward, which is such as if there were no Law prescribed, yet if we well know his nature, we would undoubtedly perform it to Him. Q. Name some principal duties that are here required, with the contrary vices forbidden? A. Here is required faith in God, love to his Majesty, and hope in Him, hearing his voice, calling upon Him by prayer, and such like. … Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline. … Q. What is the sum of the Third Commandement? A. The things here required are the due manner of observing and using all things that pertain to the natural or instituted worship of God, and all that name of God whereby He makes Himself known unto his people?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-mather.html">Richard Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechisme, or the Grounds &amp; Principles of Christian Religion</cite>, … (1650), ch. 32, ‘Of the life that beievers ought to live in the world, and of the Law of God’, pp. 114-16</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f64932c74e" data-kw="">
<blockquote><p>Thus there are certain devout Jews, so called, yet they stirred up persecution against Paul, Acts 13:50; 17:17. They were exceedingly affectionate and devout in their traditional worship they had of God; and so none [were] greater enemies to spiritual worship than they: So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Austin observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>

<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wikipedia.html">Wikipedia</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Purity Spiral” 12-2025</cite></span></figcaption>

</figure><figure class="quote" id="q-39a49d7ec1" data-kw="">
<blockquote><p>But No Collection Is To Be Made In The Time of Divine Service Therefore though I cannot like of the disordered gathering for the poor that is in many places, where in the time of divine service you shall see men go up and down asking, receiving, changing, and bestowing of money – wherein many times you shall have them so disagree, that they are louder than the minister – and the rest stand looking, and listening unto them, leaving the worship of God (as though it did not concern them), and thus all is confused; so yet I am persuaded that this is the fittest time to make this provision. And I presume that it is not the meaning of our godly wise rulers in the church and commonwealth (who are abused therein), that any such thing should be done; but that the gathering being made at some other time of day, before or after the divine service, they might have it in a readiness beforehand, to bestow at the end of service upon the needy, according to their discretion; or generally to take some good order that God might be best served, our brethren relieved, and no man justly offended. {And it seems that Justin Martyr would insinuate thus much unto us, that in his time at their public assemblies not only there was collection for the poor, but in this manner. For speaking of all things that were done publicly, he speaks of this last, as though it were last done, when he says: ‘first the books of the prophets and apostles were read; then some exhortation was made to the people; after this there was prayer and thanksgiving.’ [157] Not that there was none before, but then were there solemn prayers for the whole Church, and for them that are in authority. ‘Fourthly, the creatures of bread and wine were blessed and distributed unto the people; and last of all the richer sort did contribute something to the poor, as God did make them able, and willing.’ By which as we may presume that it was his meaning to show that this was their order, that the reading and preaching of the Word of God and prayer went before the sacrament, so all of them before their collection for the poor; so that it did neither prevent any of them, nor was mingled with them; whose example should be our imitation.} 157. Justin Martyr, Apolog. 2 [Cf. First Apology, ch. 67, ANF 1, 186. Cf. Migne, PG 6, 430.] But we may say of this thing [offering during the worship service], as the papists do of private mass (which they cannot defend), that the iniquity of the people brought it in. For when men through covetousness would not follow the rule of the apostle, to put something apart for the poor, as they should find God had blessed them (1 Cor. 16:2), and so bring that with them and have it in readiness, as he says here, being persuaded that it is a duty which God requires of them, and so do it cheerfully (2 Cor. 9:7), as unto Him who has promised to reward it; but being left to their discretion, they have shifted it off as they might; and when divine service was ended, and now nothing more was to be done in the church but that, they would not tarry [for] it. Then, the collectors for the poor were compelled to take them in the midst of God’s service, when for very shame by starting {aside} they could not refuse. But from the beginning it was not so; and seeing God is not the author of confusion, all things in the Church must be done honestly and in good order (1 Cor. 14:33-40). {But what order can there be in this, that then, when the minister is reading or praying, unto the which all should attend without interruption, others should be chopping and changing of money, and squaring about it? Or to speak the best of it, quietly taking out their purse, seeking in it, and distributing out of it? We would think it strange, if while the pastor were thus occupied, some other men should read aloud a chapter in another end of the church, or three or four should begin to sing a psalm. Why then should it not seem as strange unto us, when the minister is occupied in the public service, that others should interpose themselves with gathering of money? Especially seeing that others may better agree together than these two, seeing they are more suitable, as being all of them parts of God’s divine immediate worship, and so is not the gathering and giving of alms, though it be a work of the Sabbath day. Besides, seeing the apostle does justly blame the Corinthians for not using their spiritual gifts so in the public assemblies, as the whole church might be best edified by them – saying, What is to be done then brethren? when ye come together, according as every one of you hath a psalm, or hath a doctrine, or hath a tongue, or hath revelation, or hath interpretation: let all things be done unto edifying (1 Cor. 14:26) – then how much more would he blame them, for so using their temporal gifts in the church, that they should tend to the destruction of themselves, and others? Now for a man, when he is devoutly occupied in any part of God’s public worship, to have another man come and pull him by the sleeve, and to whisper in his ear, and for him then to draw out his purse, and to change money; whether this be likely to edify, or destroy them both, that is, to further, or to hinder them in that about the which then they should be occupied, let other men judge. I am sure it is contrary to an injunction made in the days of our late sovereign Queen Elizabeth, of most blessed and famous memory, which as far as I conceive is not reversed by any of the last canons and ecclesiastical constitutions made in the first year of his Highness’ reign (whom God preserve and bless), in which it was decreed, ‘that no man, woman, or child, should otherwise be occupied in the time of service, than in quiet attendance to hear, mark, and understand that that is read, preached and ministered.’ [158] 158. Elizabeth, Injunct. Article 38 (Q. Iniunct. Articl. 38). [Cf. Injunctions given by the Queens Majesty concerning both the clergy and laity (1559; repr. c.1840), 9]. And so I conclude, that as alms giving is a necessary and perpetual duty to be performed upon the Sabbath day, so that it ought to be performed after that manner that no part of God’s public worship may be hindered, interrupted, or made unprofitable by it.</p></blockquote>

g%2C+unto+the+which+all+should+attend+without+interruption%2C+others+should+be+chopping+and+changing+of+money%2C+and+squaring+about+it%3F+Or+to+speak+the+best+of+it%2C+quietly+taking+out+their+purse%2C+seeking+in+it%2C+and+distributing+out+of+it%3F+We+would+think+it+strange%2C+if+while+the+pastor+were+thus+occupied%2C+some+other+men+should+read+aloud+a+chapter+in+another+end+of+the+church%2C+or+three+or+four+should+begin+to+sing+a+psalm.+Why+then+should+it+not+seem+as+strange+unto+us%2C+when+the+minister+is+occupied+in+the+public+service%2C+that+others+should+interpose+themselves+with+gathering+of+money%3F+Especially+seeing+that+others+may+better+agree+together+than+these+two%2C+seeing+they+are+more+suitable%2C+as+being+all+of+them+parts+of+God%E2%80%99s+divine+immediate+worship%2C+and+so+is+not+the+gathering+and+giving+of+alms%2C+though+it+be+a+work+of+the+Sabbath+day.+Besides%2C+seeing+the+apostle+does+justly+blame+the+Corinthians+for+not+using+their+spiritual+gifts+so+in+the+public+assemblies%2C+as+the+whole+church+might+be+best+edified+by+them+%E2%80%93+saying%2C+What+is+to+be+done+then+brethren%3F+when+ye+come+together%2C+according+as+every+one+of+you+hath+a+psalm%2C+or+hath+a+doctrine%2C+or+hath+a+tongue%2C+or+hath+revelation%2C+or+hath+interpretation%3A+let+all+things+be+done+unto+edifying+%281+Cor.+14%3A26%29+%E2%80%93+then+how+much+more+would+he+blame+them%2C+for+so+using+their+temporal+gifts+in+the+church%2C+that+they+should+tend+to+the+destruction+of+themselves%2C+and+others%3F+Now+for+a+man%2C+when+he+is+devoutly+occupied+in+any+part+of+God%E2%80%99s+public+worship%2C+to+have+another+man+come+and+pull+him+by+the+sleeve%2C+and+to+whisper+in+his+ear%2C+and+for+him+then+to+draw+out+his+purse%2C+and+to+change+money%3B+whether+this+be+likely+to+edify%2C+or+destroy+them+both%2C+that+is%2C+to+further%2C+or+to+hinder+them+in+that+about+the+which+then+they+should+be+occupied%2C+let+other+men+judge.+I+am+sure+it+is+contrary+to+an+injunction+made+in+the+days+of+our+late+sovereign+Queen+Elizabeth%2C+of+most+blessed+and+famous+memory%2C+which+as+far+as+I+conceive+is+not+reversed+by+any+of+the+last+canons+and+ecclesiastical+constitutions+made+in+the+first+year+of+his+Highness%E2%80%99+reign+%28whom+God+preserve+and+bless%29%2C+in+which+it+was+decreed%2C+%E2%80%98that+no+man%2C+woman%2C+or+child%2C+should+otherwise+be+occupied+in+the+time+of+service%2C+than+in+quiet+attendance+to+hear%2C+mark%2C+and+understand+that+that+is+read%2C+preached+and+ministered.%E2%80%99+%5B158%5D+158.+Elizabeth%2C+Injunct.+Article+38+%28Q.+Iniunct.+Articl.+38%29.+%5BCf.+Injunctions+given+by+the+Queens+Majesty+concerning+both+the+clergy+and+laity+%281559%3B+repr.+c.1840%29%2C+9%5D.+And+so+I+conclude%2C+that+as+alms+giving+is+a+necessary+and+perpetual+duty+to+be+performed+upon+the+Sabbath+day%2C+so+that+it+ought+to+be+performed+after+that+manner+that+no+part+of+God%E2%80%99s+public+worship+may+be+hindered%2C+interrupted%2C+or+made+unprofitable+by+it.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Bownd%2C+Sabbathum+Veteris+Et+Novi+Testamenti%3A+or+The+True+Doctrine+of+the+Sabbath%2C+1635%2C+ed.+Christopher+Coldwell+%28Dallas%2C+TX+and+Grand+Rapids%2C+MI%3A+Naphtali+Press+and+Reformation+Heritage+Books%2C+2015%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39a49d7ec1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39a49d7ec1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings/offering-is-not-an-element-of-public-worship/#:~:text=But%20No%20Collection%20Is%20To%20Be,interrupted%2C%20or%20made%20unprofitable%20by%20it&amp;text=But%20No%20Collection%20Is%20To%20Be%20Made%20In&amp;text=be%20hindered%2C%20interrupted%2C%20or%20made%20unprofitable%20by%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The worship of God is either natural or instituted. Natural worship is that which in specie, and immediately, is founded in the nature of God and the nature of man, and God’s relation to man, and man’s relation to God. And it is twofold, either that which is naturally necessary, or that which is naturally laudable. That which is naturally necessary, is indispensable and unchangeable. That which is naturally laudable must be used whensoever conveniently it may. There is natural worship due to God, both as the Creator of man and as the Redeemer of fallen man. As God is our Creator, He is our absolute Owner and Ruler, and Benefactor; and as such, He is to be acknowledged by us with all due observance. And whatsoever acts of observance towards God we are upon this ground immediately obliged unto, they are natural worship due to God as our Creator. All natural worship due to God as Creator is discernable by natural revelation, or the Book of Nature. In Nature entire it was clearly and completely thereby discernible; but in Nature fallen, more dimly and defectively; yet not for want of objective evidence, but for the indisposition of our faculty. Likewise to God our Redeemer, there is a worship due from us, naturally and immediately arising from our redemption, and our relation to God therein founded. And it is (our redemption being supposed) no more of God’s arbitrary institution than that worship which is founded in the Law of our Creation and primitive State. To the knowledge of this sort of natural worship, we come by means of that divine revelation by which we come to the knowledge of our redeemed state. But the knowledge of our redeemed state being supposed, natural reason will show that such and such acts of observance in specie are naturally and indispensably due to God our Redeemer.</p></blockquote>

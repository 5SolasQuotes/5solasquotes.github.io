<main class="wrap"><figure class="quote" id="q-33602b5782" data-kw="">
<blockquote><p>If they be converted from heathens, they are not first converted into this or that particular church, but converted first into the Church catholic, and then secondarily admitted members of this or that particular congregation… They are made members of the whole, by conversion to the faith, and initiated by the sacrament of baptism externally, but are secondarily made members of a particular congregation, by cohabitation, or consociation. Suppose a man had abundance of sheep as Abraham, Isaac, Jacob, and Job, who had 14,000, and these sheep had all one brand of the owners upon them, and these sheep were divided into several flocks, under several shepherds, in several sheep-walks, of the same owners, according to his appointment: the primary consideration of any of these sheep or flocks is not that they are under such a keeper, in such a sheep walk, but the first consideration of them is that they are such a man’s sheep, either bought or bred etc. bearing his brand and fed by his servants, on his ground; and then the more particular and secondary consideration and notion is that they are under such a particular shepherd in such a particular walk. And so the first consideration of any part of Gods flock, whether person or congregation is that they are God’s people, born or converted to Him, fed and nourished by his ordinances and ministers, and then the particular secondary notion is that they are fed by such a pastor in such a place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, pp. 30-31</span></figcaption>

<blockquote><p>The communion of saints signifies both that same outward fellowship, whereby the people as members of the visible Church through the ministry of the doctrine both of the prophets and apostles, and also of the sacraments, are called into one body… Concerning that same outward union we must know that the truth of the prophetical, and apostolical doctrine is an undoubted token of the visible Church, 1 Tim. 3. Besides all that profess that same truth, wheresoever they shall come in the world to any visible company of the Church, they have right to communicate in hearing the word, in prayers, and receiving of the sacraments, Isa. 2:2-3…</p></blockquote>

<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into, by all the members of the visible Church of one nation or kingdom: when the Church in that kingdome or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not acrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn covenant in the presence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/apollonius.html">Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God (1645), ch. 2, ‘Of a Church-Covenant’ Apollonius was a Dutch presbyterian.</cite>, pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

></div>
</figure><figure class="quote" id="q-d81995a250" data-kw="">
<blockquote><p>First Argument [of Rutherford]: In the first receiving of members by the apostles, there was but a professed willingness to receive the Gospel, howbeit some received it not from the heart. Mr. Hooker answereth: ‘There was not only a professed willingness, but a practical reformation, that in the judgement of charity giveth grounds of hope that there is something real, before the contrary appear; Therefore, Peter who received Magus upon his approbation of the truth and outward conformity thereunto in the course of his life, rejected him as one in the gall of bitterness, who had no share in Christ, and therefore certainly would not suffer him in the privileges of communion, so persisting without repentance.’ [Rutherford’s] Answer 1: [Hooker says:] ‘Not professed willingness, but also practical reformation is required.’ But is not professed willingness in murderers of Christ, who said, ‘What shall we doe to be saved?’ some practical reformation? There is nothing but conjectures that the apostles did not admit all and every one of the three thousand until they had experience of their state of grace and judicially determined so of them all. ([Margin note:] Mr. Hooker neither proves, nor can prove that the apostles had habitual experience in so few hours, all and every one of the 3,000 (Acts 2) gave evidence of real conversion to the apostles.) (2). This practical reformation was not an experience of their practice of savory walking, required by Mr. Hooker (p. 1. ch. 2, pp. 14-15) in visible saints before admission, except some four or five hours time may create an habitual experience, for the same very day they were baptized (Acts 2:41). (3) Mr. Hooker should prove that the apostles found this practical reformation in all, Ananias, Saphira, and the whole 3000; and that the apostles tried and smelled the savouriness of saving grace in all; in Saphira; the text giveth not the least jot of this, we must take it upon the naked assertion of Mr. Hooker (4) That this practical reformation gave to the apostles’ judgement of charity ground of hope that there was something real, that is, the whole number, about three thousand (none excepted, for all were made Church-saints visible) gave grounds of hope that they were all really (otherwise their speaking and hearing the word was real, that is, not imaginary) internally and effectually called, and born over again of the spirit, and so chosen to life eternal from eternity, before the apostles durst, without the offending of God, admit them to Church-fellowship and visible communion; those [things] (I say) must be proven. If I durst [dare], I am not far from judging the godly and judicious in cold-blood, free of heat of dispute, dare not so judge of the text, Acts 2 or Acts 8. (5) There is no shadow, Acts 8, that Peter (Mr. Hooker should say Philip) admitted not Magus while he saw such grounds of the sorcerer’s real conversion and real predestination to glory. (6) Peter said that Magus had no share in Christ. True, but said he that he was an unbaptized man who had no share in the visible Church? No. (7) But he would not suffer Magus to share in the privileges of communion, he persisting without repentance. True, but it is no answer to the argument from the manner of receiving in, this is something to the casting out, (8) that Peter reproveth him in the gall of bitterness [and] 2. Exhorts him to repent, to pray for pardon, [these last two things] were great privileges of Church-communion bestowed upon Magus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14</cite>, pp. 56-57</span></figcaption>

ime+may+create+an+habitual+experience%2C+for+the+same+very+day+they+were+baptized+%28Acts+2%3A41%29.+%283%29+Mr.+Hooker+should+prove+that+the+apostles+found+this+practical+reformation+in+all%2C+Ananias%2C+Saphira%2C+and+the+whole+3000%3B+and+that+the+apostles+tried+and+smelled+the+savouriness+of+saving+grace+in+all%3B+in+Saphira%3B+the+text+giveth+not+the+least+jot+of+this%2C+we+must+take+it+upon+the+naked+assertion+of+Mr.+Hooker+%284%29+That+this+practical+reformation+gave+to+the+apostles%E2%80%99+judgement+of+charity+ground+of+hope+that+there+was+something+real%2C+that+is%2C+the+whole+number%2C+about+three+thousand+%28none+excepted%2C+for+all+were+made+Church-saints+visible%29+gave+grounds+of+hope+that+they+were+all+really+%28otherwise+their+speaking+and+hearing+the+word+was+real%2C+that+is%2C+not+imaginary%29+internally+and+effectually+called%2C+and+born+over+again+of+the+spirit%2C+and+so+chosen+to+life+eternal+from+eternity%2C+before+the+apostles+durst%2C+without+the+offending+of+God%2C+admit+them+to+Church-fellowship+and+visible+communion%3B+those+%5Bthings%5D+%28I+say%29+must+be+proven.+If+I+durst+%5Bdare%5D%2C+I+am+not+far+from+judging+the+godly+and+judicious+in+cold-blood%2C+free+of+heat+of+dispute%2C+dare+not+so+judge+of+the+text%2C+Acts+2+or+Acts+8.+%285%29+There+is+no+shadow%2C+Acts+8%2C+that+Peter+%28Mr.+Hooker+should+say+Philip%29+admitted+not+Magus+while+he+saw+such+grounds+of+the+sorcerer%E2%80%99s+real+conversion+and+real+predestination+to+glory.+%286%29+Peter+said+that+Magus+had+no+share+in+Christ.+True%2C+but+said+he+that+he+was+an+unbaptized+man+who+had+no+share+in+the+visible+Church%3F+No.+%287%29+But+he+would+not+suffer+Magus+to+share+in+the+privileges+of+communion%2C+he+persisting+without+repentance.+True%2C+but+it+is+no+answer+to+the+argument+from+the+manner+of+receiving+in%2C+this+is+something+to+the+casting+out%2C+%288%29+that+Peter+reproveth+him+in+the+gall+of+bitterness+%5Band%5D+2.+Exhorts+him+to+repent%2C+to+pray+for+pardon%2C+%5Bthese+last+two+things%5D+were+great+privileges+of+Church-communion+bestowed+upon+Magus.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+penned+by+Mr.+Thomas+Hooker%E2%80%A6+wherein+the+way+of+the+churches+of+N.+England+is+now+re-examined+%28London%2C+1658%29%2C+Book+1%2C+ch.+14%2C+pp.+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd81995a250.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d81995a250.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=First%20Argument%20%5Bof%20Rutherford%5D%3A%20In%20the,privileges%20of%20Church%2Dcommunion%20bestowed%20upon%20Magus." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

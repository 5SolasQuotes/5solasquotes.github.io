</figure><figure class="quote" id="q-355b1f3f17" data-kw="">
<blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

xt=The%20earliest%20discussions%20upon%20this%20subject%2C%20in%20the&amp;text=controversies%2C%20and%20in%20the%20regulation%20of%20ecclesiastical%20affairs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>47. The matter may further be thus illustrated: There is almost the like respect and consideration of the Magistrate as he is occupied about the outward things of the Church, and of the ecclesiastic ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience. It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the Word of God, and out of it to show to the Magistrate his duty, to wit, how he ought to govern the commonwealth and in what manner he ought to use the sword. The former is proper and peculiar to the Magistrate (neither does the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers. … 63. The same sin therefore in the same man may be punished one way by the civil, another way by the ecclesiastical power; by the civil power under the formality of a crime, with corporal or pecuniary punishment; By the ecclesiastical power, under the notion and nature of scandal, with a spiritual censure, even as also the same civil question is one way deliberate upon and handled by the Magistrate in the Senate or place of Judgment; another way by the minister of the Church, in the presbytery or synod; by the magistrate so far as it pertains to the government of the commonwealth, by the minister, so far as it respects the conscience; for the ecclesiastical ministry also is exercised about civil things spiritually, in so far as it teaches and admonishes the magistrate out of the Word of God what is best and most acceptable unto God, or as it reproves freely unjust judgments, unjust wars, and the like, and out of the Scripture threatens the wrath of God to be revealed against all unrighteousness of men; So also is the magistrate said to be occupied civilly about spiritual things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions… (1647), #47 &amp; 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-dfcdf3c447" data-kw="">
<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Magistracy in an Exposition of the 82nd Psalm</cite>, pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

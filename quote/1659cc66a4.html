<main class="wrap"><figure class="quote" id="q-1659cc66a4" data-kw="">
<blockquote><p>Another leading characteristic of our Saviour’s preaching was its directness. It is possible that pulpit discourse should fail in this point, even when in some good degree spiritual and simple. We mean by directness, such a manner of exhibiting truth, as makes the audience feel that they themselves are concerned in it.

It is quite possible so to present human depravity, that even the attentive hearer shall hardly be reminded that he is depraved; so to insist on penitence, that he shall hardly once think of it as a duty which he should perform. You may so speak of “the sinner,” or of “sinners,” that you shall scarcely be suspected of the slightest reference to the persons present.

And though your teaching be orthodox, and your announcements of coming wrath distinct and emphatic, every heart before you may be as quiet as if your discourse had related to the dwellers in some other planet. It was eminently otherwise with Christ. He always made his hearers feel, not only that his speech was to them, but that they were interested in the truths he uttered. He not only declared to Nicodemus the general doctrine of the new birth, but he said also, “Ye must be born again.” “Art thou a master of Israel, and knowest not these things?”

To one who was curious to learn whether few or many would be saved, he said, “Strive to enter in at the strait gate;” thus reminding him that it should be his main object to secure his own salvation. In addressing the Scribes and Pharisees, his application of truth was often most pungent and terrible. “Wo unto you, Scribes and Pharisees, hypocrites! for ye shut up the kingdom of heaven against men; for ye neither go in yourselves, neither suffer ye them that are entering to go in.” “Wo unto you, Scribes and Pharisees, hypocrites! for ye are like unto whited sepulchres, which indeed appear beautiful outward, but are within full of dead men’s bones, and of all uncleanness.” As on a certain occasion he was uttering reproofs like these, one of the lawyers said to him, “Master, thus saying thou reproachest us also.”

But so far from retracting or qualifying what he had uttered, our Lord promptly replied, “Wo unto you, also, ye lawyers?” It is said, in a certain place, that “when the chief priests and Pharisees heard his parables, they perceived that he spake of them.” He so shaped his discourse on a particular occasion, that “they which heard it, being convicted by their own conscience, went out one by one, beginning at the eldest, even unto the last.” And the testimony of the wo man of Samaria was, “Come, see a man which told me all the things that ever I did.”

In all this he exhibited great fearlessness. For he knew full well it would give offence to many, and provoke, at times, the most violent opposition. And such, doubtless, to some extent, will be the result of a similar strain of preaching at the present day. It will be unhesitatingly adopted, however, by the wise and faithful minister. He can hope, otherwise, for but little success. A general statement of truth—a statement of it as relating to the world at large—the deceitful and self-flattering heart will be likely to disregard. It is only as “thou art the man,” rings in the perishing sinner’s ear, that preaching does its perfect work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asa-dodge-smith.html">Asa Dodge Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Preacher s Model’, American Biblical Repository</cite></span></figcaption>

<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4.

3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29.

4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether.

5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-2be9b15777" data-kw="">
<blockquote><p>It is most probable that no gift, no pains a man takes to fit himself for preaching, shall ever do good to the people or himself, except a man labor to have and keep his heart in a spiritual condition before God, depending on Him always for furniture and the blessing. Earnest faith and prayer, a single aim at the glory of God, and good of people, a sanctified heart and carriage, shall avail much for right preaching. There is sometime somewhat in preaching that cannot be ascribed either to the matter or expression, and cannot be described what it is, or from whence it comes, but with a sweet violence, it pierces into the heart and affections, and comes immediately from the Lord. But if there be any way to attain to any such thing, it is by a heavenly disposition of the speaker.</p></blockquote>

</figure><figure class="quote" id="q-54985cb2a3" data-kw="">
<blockquote><p>It is pity that any wise and judicious minister should want [lack] that fervor and seriousness of speech which the weight of so great a business does require. And it is greater pity that any serious, affectionate minister should be ignorant and injudicious: And it is yet greater pity that in any good men, too much of their fervor should be merely affected and seem to be what it is not; or at least be raised by a selfish desire to advance ourselves in the hearers’ thoughts and to exercise our parts upon their affections. But it is most pitiful that the Church has any hypocrites who have no other but such affected dissembled fervency. And it is not the least pity that so many good people, especially youths and women, should be so weak, as to value an affectionate tone of speech above a judicious opening of the Gospel. I confess there is something in an affectionate expression, which will move the wisest: And as light and judgment tend to generate judgment, so heat of affection tends to beget affection. And I never loved a senseless delivery of matters of eternal consequence, as if we were asleep ourselves, or would make the hearers to be so: or would have them think by our cold expressions that we believe not ourselves, when we set forth the great inestimable things of the life to come. But yet it grieves my very soul to think what pitiful, raw and ignorant kind of preaching is crowded most after in many places for the mere affectionate manner of expression and loudness of the preacher’s voice! How oft have I known the ablest preachers undervalued and an ignorant man by crowds applauded, when I that have been acquainted with the preacher ab incunabulis [from infancy], have known him to be unable well to answer most questions in the common catechism. And I durst not tell them of his great insufficiency and ignorance for fear of hindering the success of his labors and being thought envious at other men’s acceptance.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is pity that any wise and judicious minister should want [lack] that fervor and seriousness of speech which the weight of so great a business does require. And it is greater pity that any serious, affectionate minister should be ignorant and injudicious: And it is yet greater pity that in any good men, too much of their fervor should be merely affected and seem to be what it is not; or at least be raised by a selfish desire to advance ourselves in the hearers’ thoughts and to exercise our parts upon their affections. But it is most pitiful that the Church has any hypocrites who have no other but such affected dissembled fervency. And it is not the least pity that so many good people, especially youths and women, should be so weak, as to value an affectionate tone of speech above a judicious opening of the Gospel. I confess there is something in an affectionate expression, which will move the wisest: And as light and judgment tend to generate judgment, so heat of affection tends to beget affection. And I never loved a senseless delivery of matters of eternal consequence, as if we were asleep ourselves, or would make the hearers to be so: or would have them think by our cold expressions that we believe not ourselves, when we set forth the great inestimable things of the life to come. But yet it grieves my very soul to think what pitiful, raw and ignorant kind of preaching is crowded most after in many places for the mere affectionate manner of expression and loudness of the preacher’s voice! How oft have I known the ablest preachers undervalued and an ignorant man by crowds applauded, when I that have been acquainted with the preacher ab incunabulis [from infancy], have known him to be unable well to answer most questions in the common catechism. And I durst not tell them of his great insufficiency and ignorance for fear of hindering the success of his labors and being thought envious at other men’s acceptance.”

— Richard Baxter, The Cure of Church Divisions, … (London, 1670), pt. 1, Direction 41, pp. 214-15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+pity+that+any+wise+and+judicious+minister+should+want+%5Black%5D+that+fervor+and+seriousness+of+speech+which+the+weight+of+so+great+a+business+does+require.+And+it+is+greater+pity+that+any+serious%2C+affectionate+minister+should+be+ignorant+and+injudicious%3A+And+it+is+yet+greater+pity+that+in+any+good+men%2C+too+much+of+their+fervor+should+be+merely+affected+and+seem+to+be+what+it+is+not%3B+or+at+least+be+raised+by+a+selfish+desire+to+advance+ourselves+in+the+hearers%E2%80%99+thoughts+and+to+exercise+our+parts+upon+their+affections.+But+it+is+most+pitiful+that+the+Church+has+any+hypocrites+who+have+no+other+but+such+affected+dissembled+fervency.+And+it+is+not+the+least+pity+that+so+many+good+people%2C+especially+youths+and+women%2C+should+be+so+weak%2C+as+to+value+an+affectionate+tone+of+speech+above+a+judicious+opening+of+the+Gospel.+I+confess+there+is+something+in+an+affectionate+expression%2C+which+will+move+the+wisest%3A+And+as+light+and+judgment+tend+to+generate+judgment%2C+so+heat+of+affection+tends+to+beget+affection.+And+I+never+loved+a+senseless+delivery+of+matters+of+eternal+consequence%2C+as+if+we+were+asleep+ourselves%2C+or+would+make+the+hearers+to+be+so%3A+or+would+have+them+think+by+our+cold+expressions+that+we+believe+not+ourselves%2C+when+we+set+forth+the+great+inestimable+things+of+the+life+to+come.+But+yet+it+grieves+my+very+soul+to+think+what+pitiful%2C+raw+and+ignorant+kind+of+preaching+is+crowded+most+after+in+many+places+for+the+mere+affectionate+manner+of+expression+and+loudness+of+the+preacher%E2%80%99s+voice%21+How+oft+have+I+known+the+ablest+preachers+undervalued+and+an+ignorant+man+by+crowds+applauded%2C+when+I+that+have+been+acquainted+with+the+preacher+ab+incunabulis+%5Bfrom+infancy%5D%2C+have+known+him+to+be+unable+well+to+answer+most+questions+in+the+common+catechism.+And+I+durst+not+tell+them+of+his+great+insufficiency+and+ignorance+for+fear+of+hindering+the+success+of+his+labors+and+being+thought+envious+at+other+men%E2%80%99s+acceptance.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%2C+%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+41%2C+pp.+214-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F54985cb2a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/54985cb2a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/preaching#:~:text=It%20is%20pity%20that%20any%20wise,thought%20envious%20at%20other%20men%E2%80%99s%20acceptance&amp;text=It%20is%20pity%20that%20any%20wise%20and%20judicious&amp;text=and%20being%20thought%20envious%20at%20other%20men%E2%80%99s%20acceptance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I saw the evil of legal preaching, which lies in one of two things, or in both. 1. In laying too much stress upon the works of the law, our duties and strength: Or, 2. In pressing evangelical doctrines without an eye to that which is the spring of the church’s edification, the Spirit of the Lord… O Lord, thou knowest how much of it is in this poor church.</p></blockquote>

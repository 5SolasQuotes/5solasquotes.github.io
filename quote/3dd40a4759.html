<main class="wrap"><figure class="quote" id="q-3dd40a4759" data-kw="">
<blockquote><p>I propound it to you, whether a little before your [the Independents] coming over into England, some members of the church of Arnhem [Netherlands], did not propone the holy kiss, or the kiss of love to be practiced by church-members? Nay, whether by some persons in that church was it not begun to be practiced?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>…the question is, Why the bread is called Christ’s body and the cup Christ’s blood: that is, why the things signified are attributed to the signs, and the signs called by their name. There are two causes alleged hereof: 1. For the natural analogy or likeness, which Christs body and the bread have between themselves. 2. For the certainty or confirmation of the joint-exhibition of the sign, and the thing signified in the true use.</p></blockquote>

</figure><figure class="quote" id="q-225a1af2b5" data-kw="">
<blockquote><p>By the Diataktic [Teaching] power [of the Church,] a synod may institute, restore or change, according to the condition and exigence of the Church, the external circumstances in the worship of God and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion [such as Scotland], it is fit that national synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratoric power, but being always tied to follow the rules foresaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, … (Edinburgh, 1641), pp. 150-1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-8ab3012bbb" data-kw="">
<blockquote><p>§51. 7. And for the next ceremony, the name and form of an ‘altar’: no doubt it is a thing indifferent whether the table stand this way or that way: and the primitive Churches used commonly the names of ‘sacrifice’, and ‘altar’, and ‘priest’, and I think, lawfully. For my part, I will not be he that shall condemn them. But they used them but metaphorically, as Scripture itself does, Heb. 13:10, 15-16; Rom. 12:1; Eph. 5:2; Phil. 2:17 &amp; 4:18. All believers are called ‘priests’, and their service, ‘sacrifices’, 1 Pet. 2:5, 9; Rev. 1:6 &amp; 5:10 &amp; 20:6. I conceive that the dislike of these things in England (the form and name of an ‘altar’, and the rails about it) was not as if they were simply evil, but: 1. because they were illegal innovations, forced on the churches without law or any just authority; and 2. because the way of those times did cause men to suspect that somewhat worse was intended to be brought in by such preparatives, especially when the ministers were cast out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 417</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<main class="wrap"><figure class="quote" id="q-94eec786d8" data-kw="">
<blockquote><p>v. 26. ‘Jesus says unto him, then are the children free’ As if He should say, ‘If I would stand on my privilege, as I am the Son of God, I am exempted,’ as a king’s son is not to perform that ordinary service which other men perform; it cannot be meant that the Jews were free, for Christ’s father and mother were taxed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, (1650), on Mt. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25d2b3aa0b" data-kw="">
<blockquote><p>…restraints on liberty were advocated by the biggest names of the early Particular Baptist community (Spilsbury, Kiffin, Jessey, Knollys, Tombes, etc.) as well as some of the biggest names to follow (Keach and Gill). The centuries of Baptists that followed tended to have few, if any, qualms about the remaining restrictions that existed after they had achieved the right to worship God as they pleased. Hence, the Particular Baptist community can be characterized as one that advocated for moderation: religious freedom but with common-sense restrictions against blatant immorality. The role of church and state are distinct, but both of them must acknowledge God according to their sphere and jurisdiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-warrick.html">Andrew Warrick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Particular Baptists Were Against Secular Liberty</cite>, (2024) at The Particular Baptist: Confessing Orthodox Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-0c328527eb" data-kw="">
<blockquote><p>They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>

— William Cunningham, Historical Theology, vol. 2 (Edinburgh, 1870), p. 580">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey%2C+in+their+Apologetical+Narration%2C+had+asserted+that+they+gave+as+much%2C+or%2C+as+they+thought%2C+more%2C+power+to+the+civil+magistrate+in+religious+matters+than+the+principles+of+Presbyterians+would+allow+them+to+do%2C+a+declaration+which%2C+whether+it+be+regarded+as+made+honestly+or+hypocritically%2C+has+been+very+galling+to+those+who+have+succeeded+them+in+the+maintenance+of+Congregational+principles.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Historical+Theology%2C+vol.+2+%28Edinburgh%2C+1870%29%2C+p.+580&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c328527eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c328527eb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=They%2C%20in%20their%20Apologetical%20Narration%2C%20had,in%20the%20maintenance%20of%20Congregational%20principles&amp;text=They%2C%20in%20their%20Apologetical%20Narration%2C%20had%20asserted%20that&amp;text=succeeded%20them%20in%20the%20maintenance%20of%20Congregational%20principles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-29730e0286" data-kw="">
<blockquote><p>Love to God, and love to man, is the substance of religion; when these prevail, civil laws will have little to do… 1. The magistrate (or ruling part of any society) ought to encourage piety by his own example, and by endeavoring to make it an object of public esteem. Whenever the general opinion is in favor of anything, it will have many followers. Magistrates may promote and encourage men of piety and virtue, and they may discountenance those whom it would be improper to punish. 2. …It is commonly said, however, that in case any sect hold tenets subversive of society, and inconsistent with the rights of others, that they ought not to be tolerated. On this footing Popery is not tolerated in Great Britain; because they profess entire subjection to a foreign power, the See of Rome: and therefore must be in opposition to the proper interest of their own state; and because violence or persecution for religion is a part of their religion, which makes their prosperity threaten ruin to others, as well as the principle imputed to them, which they deny, That faith [upholding agreements] is not to be kept with heretics… 3. The magistrate may enact laws for the punishment of acts of profanity and impiety. The different sentiments of men in religion ought not by any means to encourage or give a sanction to such acts as any of them count profane. Many are of the opinion, that, besides all this, the magistrate ought to make public provision for the worship of God, in such manner as is agreeable to the great body of the society; though, at the same time, all who dissent from it are fully tolerated. And, indeed, there seems to be a good deal of reason for it, that so instruction may be provided for the bulk of common people, who would, many of them, neither support nor employ teachers, unless they were obliged. The magistrate’s right in this case seems to be something like that of the parent; they have a right to instruct, but not to constrain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Moral Philosophy, Lecture 14, ‘Jurisprudence’ in Works</cite>, (Edinburgh, 1815), vol. 7, pp. 119-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

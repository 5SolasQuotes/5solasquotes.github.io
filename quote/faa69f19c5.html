<main class="wrap"><figure class="quote" id="q-faa69f19c5" data-kw="">
<blockquote><p>That whatsoever Law of GOD, or command of His, we find recorded in the Lawbook, in either of the volumes of God’s statute, the N. T. or the Old, remains obligatory to us, unless we can prove it to be expired, or repealed. So it is with the statute-law of this nation [England], or of any nation; What I can prove to be once enacted, I may urge as still in force, unless any one can answer me with a just proof that it is now out of date, or repealed by a latter Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glass of God’s Providence</cite>, (1644) p. 52 In the context of a rule in Scripture for Church Government.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43d9e0e19c" data-kw="">
<blockquote><p>From this it follows, that subjects are no farther bound to obey the magistrate because of conscience, than in as far as he himself presides and enjoins with a good conscience, and on the authority of the Word of God: and besides, it is worthy of observation, that the wrath of the magistrate, unless directed against the disobedient, refusing to do their duty according to the injunction of Jehovah, is neither just, nor lawful, nor to be feared by his subjects, but Christians, in the Christian warfare, must pass through the midst of it to victory in Christ, by the power of the Spirit of God; as we see in the case of Daniel, who rose to victory through the lions’ den, with his three friends, who esteemed the wrath of the king as nothing in comparison with their duty to God, although the disobedient were threatened with a fiery furnace, the heat of which had been increased seven times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-ferme.html">Charles Ferme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Logical Analysis of Romans</cite>, (†1617) on Rom. 13:5, p. 293. Ferme (1565-1617) was a reformed Scottish divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-7a86f4e84c" data-kw="">
<blockquote><p>But their [the Brownists’] great tenet about the magistrate is this, that no prince nor State on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either Church or State; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the laws of God set down in Scripture; (Bar. Dis., p. 84. “I am persuaded, that the magistrate ought not to make permanent law of that the Lord has left in our liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (London: 1645), pp. 31 &amp; 49-50</span></figcaption>

</figure><figure class="quote" id="q-20d2ebcab3" data-kw="">
<blockquote><p>For 1. The very ground and reason wherefore we ought to obey the magistrate, is, for that he is the minister of God, or a deputy set in God’s stead to us. Now, he is the minister of God only for our good, Rom. 13:4. Neither were he God’s minister, but his owne master, if he should rule at his pleasure and command things which serve not for the good of the subjects. Since therefore the commandments of princes bind only so far as they are the ministers of God for our good: and God’s ministers they are not, in commanding such things as are either in their nature unlawful, or in their use inconvenient: it follows that such commandments of theirs cannot bind. (Pareus, on Rom. 13:4)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (Edinburgh, 1637) | 3rd Part, pp. 134-138, 142 &amp; 155-57 of ch. 8, ‘That the Lawfulness of the Ceremonies cannot be Warranted by any Ordinance of the Civil Magistrate…’ This is the best., p. 134</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

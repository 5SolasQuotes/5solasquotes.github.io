<main class="wrap"><figure class="quote" id="q-a02d2c5bf4" data-kw="">
<blockquote><p>The word in both covenants was for a long time in the world, even from Adam’s time till Moses, unwritten; delivered as from hand to hand, and continued by a lively voice: for I pass over such matters as Joseph records to be ingraven in columns before the flood, as also the Apocryphals of Henoch.

And when as in continuance of time corruptions grew, by these traditions, and the purity of the doctrine of the covenant could not thus be preserved, and that God would no longer follow the former course only, he began in Moses time to ordain and to publish another form, to wit this, to preserve and to continue the purity of the celestial doctrine in written books, approved and sealed by divine authority and testimony; &amp; the more to commend his written word unto men, in all succeeding ages, God himself with his own hand did first write in tables of stone the words of the Decalogue:

Next after this, he gave it in charge unto Moses, that he should afterwards write and record all things which he received at God’s own mouth: and that the people of God might be assured that the books of Moses came not by man’s will, but were given by divine inspiration, the Lord sealed and testified these writings to be his heavenly oracles, by many great wonders, before they were written, when they were written, and after they were written.

And Moses wrote the Word of both covenants; of both I say, Legal and Evangelical: but whereas he gave, but as it were, the first lineaments of the Evangelical covenant, he set forth the Legal covenant clearly and in full measure. For the legal covenant in the books of Moses is clearly recommended and urged, but the Evangelical more darkly set before us. For which cause all the doctrine of Moses is said to be legal: The Law came by Moses, Joh. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of God’s effectual calling</cite>, trans. Henry Holland (London: Felix Kingston, 1603), pp 38-39.</span></figcaption>

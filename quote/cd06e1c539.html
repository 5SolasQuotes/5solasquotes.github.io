<main class="wrap"><figure class="quote" id="q-cd06e1c539" data-kw="">
<blockquote><p>Had we been only adopted in Adam, we should have had no inheritance but that terrestrial paradise which was granted to him, that he might lead an agreeable and delicious life on earth. Had we been adopted in Moses, we could have aspired to no better inheritance than the land of Canaan, which he promised to those who kept his law, but being adopted in Christ, to be his joint heirs and his brethren, we must have an inheritance the very same as that which this well beloved Son himself possesses; the high heaven to which he has gone to live and reign in immortal glory, in the midst of angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), pp 315-16.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5caa5bb914" data-kw="">
<blockquote><p>There are some general obscure threatenings annexed to the prohibitions in the Law of Nature; that is, Nature may discern that God will punish the breakers of his Law, but how, or with what degree of punishment it cannot discern: Also it may collect that God will be favorable and gracious to the obedient: but it neither knows truly the conditions, nor the nature or greatness of the reward, nor God’s engagement thereto. Therefore as it is in Nature, it is a mere Law; and not properly a Covenant. Yea to Adam in his perfection, the form of the Covenant [of Works] was known by superadded revelation, and not written naturally in his heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 3, pp. 9-10</span></figcaption>

</figure><figure class="quote" id="q-242b7b10a2" data-kw="natural symbolic law">
<blockquote><p>The duty was partly general, partly special (according to the twofold law given to him: the moral or natural and the symbolic). The general was the knowledge and worship of God, justice towards his neighbor and every kind of holiness; the special was abstinence from the forbidden fruit (in which obedience to the whole law was contained as in a compendium and specimen). The former was founded on the law of nature not written in a book, but engraven and stamped upon the heart of man; the latter upon a symbolic and positive law, added to the natural for the trial of his obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.12</span></figcaption>

</figure><figure class="quote" id="q-16e5724eaa" data-kw="">
<blockquote><p>God’s covenant, is his contract with man, concerning the obtaining of life eternal, upon a certain condition. This covenant consists of two parts: God’s promise to man, Man’s promise to God. God’s promise to man, is that, whereby he binds himself to man to be his God, if he perform the condition. Man’s promise to God, is that, whereby he vows his allegiance unto his Lord, and to perform the condition between them. Again, there are two kinds of this covenant. The covenant of works, and the covenant of grace. Jer. 31:31, 32, 33. “Behold the days come, says the Lord, that I will make a new covenant with the house of Israel, and with the house of Judah, not according to the covenant, I made with their fathers, when I took them by the hand to bring them out of the land of Egypt; the which my covenant they brake, although I was an husband to them, saith the Lord. But this shall be the covenant, that I will make with the house of Israel: after those days, says the Lord, I will put my law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people.” The covenant of works, is Gods covenant, made with condition of perfect obedience, and is expressed in the moral law. The Moral Law, is that part of God’s word, which commands perfect obedience unto man, as well in his nature, as in his actions, and forbids the contrary. Romans 10. 5. “Moses thus describes the righteousness which is of the law, that the man which doth these things, shall live thereby.” 1. Timothy 1. 5. “The end of the commandment, is love out of a pure heart, and of a good conscience, and faith unfeigned.” Luke 16. 27. “You shalt love the Lord your God, with all your heart, with all your soul, and with all your strength.” Rom. 7. 14. “We know that the law is spiritual.” The Law has two parts. The Edict, commanding obedience, and the condition binding to obedience. The condition is eternal life to such as fulfill the law, but to transgressors, everlasting death. The Decalogue, or ten commandments, is an abridgement of the whole law, and the covenant of works. Exod. 34:27. And the Lord said unto Moses, Write these words, for after the tenor of these words, I have made a covenant with thee, and with Israel. And be was there with the Lord forty days and forty nights, and did neither eat bread, nor drink water, and he wrote in the tables the words of the covenant, even the ten commandments. 1. King. 8. 9. Nothing was in the Ark, save the two tables of stone, which Moses had put there at Horeb, where the Lord made a covenant with the children of Israel, when he brought them out of the land of Egypt. Mat. 22:40. “On these two commandments hangs the whole law and the prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine</cite>, (Cambridge, 1616), 32. [spelling and punctuation updated</span></figcaption>

</figure><figure class="quote" id="q-4b7c17ab77" data-kw="merit">
<blockquote><p>The natural covenant is not so called because it conferred nothing above nature and condition (which man had from creation), but because it depended on the powers of nature and the obedience which according to them he ought to render. Nor, if a proportion is not granted between the prescribed duty and the blessing of heavenly life, does it follow that such a promise cannot have a place. It is gratuitously and falsely supposed that the promises of God are regulated according to the proportion of our merit. On the contrary, they depend upon God’s will and goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.6.10</span></figcaption>

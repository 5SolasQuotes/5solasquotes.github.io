<main class="wrap"><figure class="quote" id="q-057d1e8d8a" data-kw="">
<blockquote><p>True courage, it is unnecessary to say, does not consist in denouncing sin in the abstract, or evils which exist in other communities and other ecclesiastical organizations, but in meeting it face to face, and in carrying on the conflict with it as it exists in all forms of individual and organic wickedness around us.

We have enough who are the champions of battles long ago fought and won, who are bold and defiant, so long as the opposition is an “airy nothing without a local habitation or a name,” but who have no relish for a hand to hand encounter with those great organized systems of oppression and iniquity that are opposed to the kingdom of the Redeemer in the present — in these cases prefer the mild and the persuasive, and consider it altogether better that Christianity should not come in contact with existing institutions.

Had the Church of past ages been of this mind, no martyr’s blood would ever have been shed, the sacrifice of so many noble lives of apostles and their successors would have been avoided, and untold sufferings escaped—pity that the Church has learned this wisdom so lately! If we are to accept such views now, we must reverse our former opinions, the past and present admiration which the world entertains for the martyr spirit, is a pernicious sympathy for bigoted and misguided zeal, and those heroic deaths from which even unbelief does not withhold the tribute of its praise, but little better than suicide!

Men may plume themselves upon their superior wisdom in shunning all the great moral conflicts of the age, but whether they will have equal cause to congratulate themselves when they appear to receive the crown of a faithful and valiant soldier of the truth and cause of Christ, is a point upon which we may be permitted to entertain at least a doubt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-r-w-sloane.html">J. R. W. Sloane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Word: A Discourse, Delivered at the Opening of the Reformed Presbyterian Synod, in Allegheny, Pa., on Tuesday Evening, May 24, 1859</cite>, (New York: Thomas Holman, 1859), pp 35-36.</span></figcaption>

<blockquote><p>Consider that a separation, when not upon clear and just grounds, is a greater sin before God, and more piercing to the heart of Christ, than either murder or adultery, etc. because this is to dissolve the union of his Church and to divide Christian societies. Whosoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood. My dear friends, weigh seriously, as before the Lord, how Jesus Christ will take it at any man or woman’s hand to tear the commission of any of his ambassadors, whom he will still own as an ambassador, and as negotiating a peace between God and sinners: Sure I need neither tell you that withdrawing from hearing such is a tearing their commission; nor need I tell you that this will be found a sin more hateful and heinous in the sight of Jesus Christ than many others that appear more black.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-3f9311840d" data-kw="">
<blockquote><p>The Reverend Fathers of our Church [of England] call Mr [John] Calvin one of the best writers: A reverend Father, &amp; a worthy ornament of the church of God, not only defending the same doctrine, but also discharging him of slanderous reports wrongfully laid against him, knowing that by defaming the persons of christians, and especially of Ministers, the Devil of old time laboured to overthrow the Gospel of Christ. How greatly all Christian churches are to praise God for that man’s faithful labours, and how instantly therefore all sorts of papists have and do endeavour and strive to diminish his credit, all the Christian world most aboundly both by word and by writing, do testify.

Wherefore we wonder not a little. What moved you [Richard Hooker] to make choice of that worthy pillar of the church above all other, to traduce him and to make him a spectacle before all Christians. Wherefore we crave your favour that with truth and patience you would answer our doubts &amp; scruples which by the preface of your first book you have made in us concerning him. And first, what Master Calvin hath done against our Church, that you should single him out as an adversary: Which of our Reverend Fathers of this land hath wished you thereunto; or else tell us plainly whether our adversaries (in whose mouths you are a most invincible champion) have not provoked you against him?

And open unto us without deceit ingenuously, whether all the learned men of our country, who have written and disputed for discipline, be not too base and mean persons, that on them only so mighty a man should spend his sharp arrows and coals of Juniper? but you will pass over the Seas, and search the sepulchres of the strangers, and finding no man alive worthy your combat, you call Master Calvin out of his sweet bed of rest, and him that is entered into peace, you challenge again into the field. Will no man fit you but he that was (as you bravely affirm) incomparably the wisest man that ever the French church did enjoy, since the hour it did enjoy him, to whom thousands were debtors: and who for his exceeding pains in composing the institutions of Christian Religion, &amp; exposition of holy scripture, gained the advantage of prejudice against all gainsayers following him, and of glory above all that consented to him.

How unlike are you unto that great &amp; mighty Goliath, who defied the whole Host of God, and made challenge of a man out of them all: he was so proud that he demanded but chose not: he sought for one that was alive and vaunted not himself over one that was dead? And here we most instantly beseech you, whether your weapons be the words of righteousness and the faithful pen of truth. Where learned you, and how prove you that Mai. Calvin was the founder of discipline? And herein declare unto us, what moved that Reverend and learned man Mai. D. [John] Whitgift to spend so many leaves to shew that the parts of Discipline might be altered by the civil Magistrate, as serving more fitly for the Apostles time, and the time of persecution, then for us, having the Magistrate to friend, and living in peace and quietness.

If Master Calvin (as the true story reporteth) obtained the consent of the towns men of Geneva, not only by demonstration out of the holy scriptures, but also by shewing the mind of very learned men of his age, out of their writings, as of Oecolampadius, Swinglius, Suychius, Philip, Bucer, Capito and Miconius, who was the founder of the discipline? Where had these notable men their judgement? Did he teach them? or write before them? Was it not one founder even the Lord Christ, the author and builder of his Church, who raised up divers men in divers places, and taught them by the same spirit out of the same holy scripture, the same doctrine and commandment of truth and righteousness?

Shew us also we pray you before our God which searcheth the heart, whether we have not just cause to judge, that in penning this story, you make of Calvin, your purpose were not to deceive your reader by an artificial entwining of some part of the truth with the hollow &amp; glittering thread of your own witty conjectures and peremptory censures; as namely when you begin to tell of the repentance of the people of Geneva, irefully champing upon the bit: you suddenly fall into a discourse of the rising up of those reformed churches; you besprinkle them with likelihood of desire of glory of their own enterprises; you blame then that in that troublesome time they wanted common conference, and that afterwards least they should derogate from their credit, they became ever after resolute to maintained that which they had done, and so leaving the churches all bespotted with levity and self pride, and eased of all conscience and honesty; you closely thrust in Calvin with this word, therefore: that he and his associates (as partners of the same self weening) stiffly refusing to administer the holy Communion, were banished the town.

After speaking of his restoring and re-establishing of Discipline, you have in one place, Many things might lead them &amp;c. And in other place, He rightly considered, &amp;c. This devise I see not how the wisest, &amp;c. And again: This sort it may be, &amp;c. Therefore we pray you to teach us how such might lead &amp; may bees, such entering into his thought and cross commending that for his devise which he simply propounded as out of the Scriptures of God; may not drop into your readers heart such unheeded impressions, as may make him highly admire R. H. great gravity and judicious wisdom and J. Calvin’s carnal policy, fine hypocrisy and peremptory folly. …

We desire you therefore in the name of our Lord Jesus Christ, who shall judge all men at his coming and make manifest the intents &amp; thoughts of the heart, to shew unto us without all artificial glozing whether all this your treatise of Calvin, be not polished armour, and a sharper razor, prepared for the use and help of the enemies of the Gospel, and that it may not rather be called a prejudicial commentary; and a Popish paraphrase; then a story true plain and without partiality, and that men have not just cause to think the better of Maister Calvin and the cause of discipline, when they see so little plain and faithful dealing in your writing. Read therefore his preface before his comment on the Psalmes, and Beza his story of his life, and the French or any other stories or monuments of faithful honest Christians and then answer faithfully the truth and show your honest meaning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 37-39, 42.</span></figcaption>

itten+and+disputed+for+discipline%2C+be+not+too+base+and+mean+persons%2C+that+on+them+only+so+mighty+a+man+should+spend+his+sharp+arrows+and+coals+of+Juniper%3F+but+you+will+pass+over+the+Seas%2C+and+search+the+sepulchres+of+the+strangers%2C+and+finding+no+man+alive+worthy+your+combat%2C+you+call+Master+Calvin+out+of+his+sweet+bed+of+rest%2C+and+him+that+is+entered+into+peace%2C+you+challenge+again+into+the+field.+Will+no+man+fit+you+but+he+that+was+%28as+you+bravely+affirm%29+incomparably+the+wisest+man+that+ever+the+French+church+did+enjoy%2C+since+the+hour+it+did+enjoy+him%2C+to+whom+thousands+were+debtors%3A+and+who+for+his+exceeding+pains+in+composing+the+institutions+of+Christian+Religion%2C+%26+exposition+of+holy+scripture%2C+gained+the+advantage+of+prejudice+against+all+gainsayers+following+him%2C+and+of+glory+above+all+that+consented+to+him.%0A%0AHow+unlike+are+you+unto+that+great+%26+mighty+Goliath%2C+who+defied+the+whole+Host+of+God%2C+and+made+challenge+of+a+man+out+of+them+all%3A+he+was+so+proud+that+he+demanded+but+chose+not%3A+he+sought+for+one+that+was+alive+and+vaunted+not+himself+over+one+that+was+dead%3F+And+here+we+most+instantly+beseech+you%2C+whether+your+weapons+be+the+words+of+righteousness+and+the+faithful+pen+of+truth.+Where+learned+you%2C+and+how+prove+you+that+Mai.+Calvin+was+the+founder+of+discipline%3F+And+herein+declare+unto+us%2C+what+moved+that+Reverend+and+learned+man+Mai.+D.+%5BJohn%5D+Whitgift+to+spend+so+many+leaves+to+shew+that+the+parts+of+Discipline+might+be+altered+by+the+civil+Magistrate%2C+as+serving+more+fitly+for+the+Apostles+time%2C+and+the+time+of+persecution%2C+then+for+us%2C+having+the+Magistrate+to+friend%2C+and+living+in+peace+and+quietness.%0A%0AIf+Master+Calvin+%28as+the+true+story+reporteth%29+obtained+the+consent+of+the+towns+men+of+Geneva%2C+not+only+by+demonstration+out+of+the+holy+scriptures%2C+but+also+by+shewing+the+mind+of+very+learned+men+of+his+age%2C+out+of+their+writings%2C+as+of+Oecolampadius%2C+Swing nto+his+thought+and+cross+commending+that+for+his+devise+which+he+simply+propounded+as+out+of+the+Scriptures+of+God%3B+may+not+drop+into+your+readers+heart+such+unheeded+impressions%2C+as+may+make+him+highly+admire+R.+H.+great+gravity+and+judicious+wisdom+and+J.+Calvin%E2%80%99s+carnal+policy%2C+fine+hypocrisy+and+peremptory+folly.+%E2%80%A6%0A%0AWe+desire+you+therefore+in+the+name+of+our+Lord+Jesus+Christ%2C+who+shall+judge+all+men+at+his+coming+and+make+manifest+the+intents+%26+thoughts+of+the+heart%2C+to+shew+unto+us+without+all+artificial+glozing+whether+all+this+your+treatise+of+Calvin%2C+be+not+polished+armour%2C+and+a+sharper+razor%2C+prepared+for+the+use+and+help+of+the+enemies+of+the+Gospel%2C+and+that+it+may+not+rather+be+called+a+prejudicial+commentary%3B+and+a+Popish+paraphrase%3B+then+a+story+true+plain+and+without+partiality%2C+and+that+men+have+not+just+cause+to+think+the+better+of+Maister+Calvin+and+the+cause+of+discipline%2C+when+they+see+so+little+plain+and+faithful+dealing+in+your+writing.+Read+therefore+his+preface+before+his+comment+on+the+Psalmes%2C+and+Beza+his+story+of+his+life%2C+and+the+French+or+any+other+stories+or+monuments+of+faithful+honest+Christians+and+then+answer+faithfully+the+truth+and+show+your+honest+meaning.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+A+Christian+letter+of+certain+English+protestants%2C+unfained+favourers+of+the+present+state+of+religion%2C+authorised+and+professed+in+England%3A+unto+that+reverend+and+learned+man%2C+Mr+R.+Hoo%5Bker%5D+requiring+resolution+in+certain+matters+of+doctrine+%28which+seem+to+overthrow+the+foundation+of+Christian+rel%2C+%28Middelburg%3A+Richard+Schilders%2C+1599%29%2C+pp+37-39%2C+42.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f9311840d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f9311840d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/03/12/andrew-willet-in-defence-of-john-calvin/"

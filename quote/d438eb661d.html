<main class="wrap"><figure class="quote" id="q-d438eb661d" data-kw="">
<blockquote><p>…for as the woman is independent in regard of intrinsic power of consenting or dissenting in point of marriage, the parents’ directive power of extrinsic commanding, as the judicious [congregationalist] Prefacers say… How are [ecclesiastical] leaders and overseers [according to congregationalism,] in the same managing of censures, equal in power, and not above those whom they lead and oversee, yea, to whom they are to yield obedience, as Mr. Hooker cites to that purpose the place Heb. 13:17? Are parents equal in power who do command the virgin, whose it is to consent to the marriage?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 3, pp. 309-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60cd93e374" data-kw="">
<blockquote><p>O Cyaraxe, tò te genos Epainô, kai tén paida, kai dôra; boulomai de, ephê sun tê toû patros gnómê, kai tes metros tanta sunainesai,” (Xenoph., Cyrop., book 8) which is englished in this manner: “Uncle Cyaraxis, I commend the stock and the maid, and the portion; howbeit” (saith he) “by the counsel of my father and mother I will assent unto you:” as if he had said, without their advice I can do nothing. All histories, philosophers and poets in a manner, are full of the practice of this duty (Terent in phormion). And no marvel, for this is agreeable to the common principle in nature, “Whatsoeuer ye would that other men should do unto you, do ye even so to them,” Mt. 7:12. Sampson saw a maid in Timnah that liked him well, notwithstanding he spake not one word to her, but came back to his parents, and desired them to make the marriage for him. They were the first whom he acquainted with his purpose: not as in our days, wherein commonly the parents are the last. Judg. 14:2, “Get her to me, for she pleaseth me well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618) | This was observed of those that otherwise led no sanctified life, Gen. 21:21, yea of the very heathen themselves. I will produce one testimony among many others, and that is of king Cyrus after he had conquered Babylon, and come home in triumph, his uncle Cyaraxis offered him his daughter unto wife: he thanked his uncle, and praised the maid, and liked the dowry, but for giving consent to marriage, he made him this answer, which I would it were observed and followed of all Christians:, pp. 1,167-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-fecf99c6a7" data-kw="">
<blockquote><p>The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-3e90e17e47" data-kw="">
<blockquote><p>Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates.</p></blockquote>

</figure><figure class="quote" id="q-27ea4671ad" data-kw="">
<blockquote><p>Fifthly, such as are wicked and ungodly vows… And thus two evils meet together, the one whereof is to vow, the other to perform such a vow; and therefore such vows are not to be kept. This serveth to set before the eyes of many their folly, who never consider what the vow is which they have taken upon them to observe, but if they can say, I have a vow to do this or that, they grow obstinate and settled in evil, and will by no means be removed, yea and think they are bound by virtue of their vow to do it, and are discharged of all fault and offence when they have done it: whereas that which is evil to vow, is much worse to perform; and therefore they must repent of their rash vow, and not proceed to the accomplishment of it, for that were to add one transgression to another, as it were drunkenness unto thirst, and to plunge themselves into endless destruction both of soul and body. This is the case of many young men and women who have entangled themselves in such vows, by promising marriage either to other without the consent of parents; they often pretend great scruple of conscience, which cannot be tied by such evil vows, the vow was evil, and therefore the way is not to go forward, but to crave pardon of God for that evil, as here it is prescribed in this Chapter [Num. 30].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), p. 1,159</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

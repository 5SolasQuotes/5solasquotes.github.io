<main class="wrap"><figure class="quote" id="q-2bef3fc579" data-kw="">
<blockquote><p>As the authority of the Law and the priesthood is the same, Christ became not only a priest, but also a Lawgiver; so that the right of Aaron, as well as of Moses, was transferred to him. The sum of the whole is, that the ministry of Moses was no less temporary than that of Aaron; and hence both were annulled by the coming of Christ, for the one could not stand without the other. By the word Law, we understand what peculiarly belonged to Moses; for the Law contains the rule of life, and the gratuitous covenant of life; and in it we find everywhere many remarkable sentences by which we are instructed as to faith, and as to the fear of God. None of these were abolished by Christ, but only that part which regarded the ancient priesthood.

For Christ is here compared with Moses; whatever then they had in common, is not to be taken to the account, but only the things in which they differ. They in common offer God’s mercy to us, prescribe the rule of a holy and godly life, teach us the true worship of God, and exhort us to exercise faith and patience, and all the duties of godliness. But Moses was different from Christ in this respect, that while the love of the Gospel was not as yet made known, he kept the people under veils, set forth the knowledge of Christ by types and shadows, and, in short, accommodated himself to the capacity of ignorant people, and did not rise higher than to puerile elements. We must then remember, that the Law is that part of the ministration which Moses had as peculiarly his own, and different from that of Christ. That law, as it was subordinate to the ancient priesthood, was abolished when the priesthood was abolished. And Christ, being made a priest, was invested also with the authority of a legislator, that he might be the teacher and interpreter of the new covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p. 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, p. 167.</span></figcaption>

<blockquote><p>Another thing God did towards this work at that time was His inspiring David to show forth Christ and His redemption in Divine songs, which should be for the use of the Church in public worship throughout all ages. … This was also a glorious advancement of the office of redemption, as God hereby gave His Church a book of divine songs for their use in that part of their public worship–viz., singing His praises throughout all ages to the end of the world. It is manifest the Book of Psalms was given of God for this end. … David is called the “sweet Psalmist of Israel” (II Sam. 23:1), because he penned Psalms for the use of the Church of Israel;… and we find the same are appointed in the New Testament to be made use of in their worship: ‘Speaking to yourselves in psalms and hymns and spiritual songs’ (Eph. 5:19).</p></blockquote>

</figure><figure class="quote" id="q-84d167cf84" data-kw="">
<blockquote><p>From Boulogne we travelled to Paris, by day and by night, and spent a Sabbath there. Alas! poor Paris knows no Sabbath; all the shops are open, and all the inhabitants are on the wing in search of pleasures,—pleasures that perish in the using. I thought of Babylon and of Sodom as I passed through the crowd. I cannot tell how I longed for the peace of a Scottish Sabbath.

There is a place in Paris called the Champs Elysées, or Plains of Heaven,—a beautiful public walk, with trees and gardens; we had to cross it on passing to the Protestant church. It is the chief scene of their Sabbath desecration, and an awful scene it is. Oh, thought I, if this is the heaven a Parisian loves, he will never enjoy the pure heaven that is above! Try yourselves by that text, Isa. Iviii. 13, 14. I remember of once preaching to you from it. Do you really delight in the Sabbath day? If not, you are no child of God.

I remember with grief that there are many among you that despise the Sabbath,—some who buy and sell on that holy day,—some who spend its blessed hours in worldly pleasures, in folly and sin. Oh, you would make Dundee another Paris if you could! Dear believers, oppose these ungodly practices with all your might. The more others dishonour God’s holy day, the more do you honour it, and show that you love it of all the seven the best. Even in Paris, as in Sardis, we found a little flock of believers. We heard a sweet sermon in English, and another in French. There are only 2000 Protestant hearers out of the half million that inhabit Paris, and there are fourteen faithful sermons preached every Sabbath.</p></blockquote>

</figure><figure class="quote" id="q-224cff15f4" data-kw="">
<blockquote><p>That the excellency of the work may be yet further evidenced: consider it in the objects whereabout it is conversant; that is, either Things, or Persons. Things are Doctrine, Worship, and Government; Doctrine is a ray or beam of supernatural truth issued out from God as a special favour to his people, tending to inform them in right notions and apprehensions concerning God, Christ, our souls, and the whole way of salvation. This is called the word of life, the wholesome word, the word of salvation; how useful is this word, since men do as surely perish by damnable heresies, as by moral vices.

Doctrine is as the waters of the Sanctuary, how great a sin to puddle or poison these! was it not capital among the Romans to poison the common springs? How noisome was that plague to the Egyptians to have all their waters whereof they should drink, turned into blood? was it not much more (as the soul is more excellent then the body) pestilential to have all the main Articles of our Religion (not that of Justification excepted) to be all, or the most, desperately corrupted, as may be seen in the Ministers Remonstrance exhibited, together with their Petition for Reformation.

The second particular, whereabout Reformation is conversant, is worship; whereby God and we have communion one with another, wee doe in a holy manner trade with God and he with us. This is as Jacob’s ladder, The Angels of God ascend and descend by it; our prayers ascend, God’s blessings descend. The ordinances are those golden pipes by which the golden oil empties it self into the hearts of God’s people; They are the Churches breasts from whence her children suck nourishment; They are the Churches barn and her Wine-press: They are on Christ’s part the kisses of his mouth, the mutual embraces betwixt God and the Christian Soul; Dry up all the breasts in such a City as this, how great will the cry of the Infants be? This mischief by the putting down of Preaching, and strange Innovations brought and urged upon us in our most solemn worship, had in a great part seized upon us, and will yet certainly prevail if the Reformers do not seasonably and strongly oppose.

The third particular is Church Discipline or Government; all Societies, and so the Church, is upheld by ruling and being ruled. This amongst other benefits it will yield, That it will preserve the honour of God’s censures and ordinances, that great censure of Excommunication, which is no less then the delivery up of a man to Satan, and (next the day of judgement) it is judicium maxime tremendum, it shall no longer Lackey up and down for Duties and Fees as it hath done amongst us, and as it did in the darkest times of Popery as Gerson complains, Lib. de Eccles. defect. Quid est, quod Gladius Ecclesiae, scilicet Excommunicatio, extrahitur pro re nihili, ut pro re nummariâ?

This once established, will direct us to put a difference betwixt the holy and the prophane, the clean and the unclean, for want whereof the Lord challenges the Priests. Hath not this been, and is it not yet in a great part, remaining upon us, as one of our land destroying sins; the promiscuous thrusting in of scandalous and ignorant persons upon the Sacrament of the Lord’s Supper, to the horrible prophaning of the same, and no power that would hitherto be allowed as legal, no not for making stay of such? Misunderstand me not, I mean not, that men should be cut short of that latitude which the Laws of Christ allow; only let that hedge and mound of Discipline be erected, whereby holy things may not be indifferently administered, as well to men egregiously prophane, and that after conviction, as to the Lord his holy ones.</p></blockquote>

Doctrine is as the waters of the Sanctuary, how great a sin to puddle or poison these! was it not capital among the Romans to poison the common springs? How noisome was that plague to the Egyptians to have all their waters whereof they should drink, turned into blood? was it not much more (as the soul is more excellent then the body) pestilential to have all the main Articles of our Religion (not that of Justification excepted) to be all, or the most, desperately corrupted, as may be seen in the Ministers Remonstrance exhibited, together with their Petition for Reformation.

The second particular, whereabout Reformation is conversant, is worship; whereby God and we have communion one with another, wee doe in a holy manner trade with God and he with us. This is as Jacob’s ladder, The Angels of God ascend and descend by it; our prayers ascend, God’s blessings descend. The ordinances are those golden pipes by which the golden oil empties it self into the hearts of God’s people; They are the Churches breasts from whence her children suck nourishment; They are the Churches barn and her Wine-press: They are on Christ’s part the kisses of his mouth, the mutual embraces betwixt God and the Christian Soul; Dry up all the breasts in such a City as this, how great will the cry of the Infants be? This mischief by the putting down of Preaching, and strange Innovations brought and urged upon us in our most solemn worship, had in a great part seized upon us, and will yet certainly prevail if the Reformers do not seasonably and strongly oppose.

The third particular is Church Discipline or Government; all Societies, and so the Church, is upheld by ruling and being ruled. This amongst other benefits it will yield, That it will preserve the honour of God’s censures and ordinances, that great censure of Excommunication, which is no less then the delivery up of a man to Satan, and (next the day of judgement) it is judicium maxime tremendum, it shall no longer Lackey up and down for Duties and Fees as it hath done amongst us, and as it did in the darkest times of Popery as Gerson complains, Lib. de Eccles. defect. Quid est, quod Gladius Ecclesiae, scilicet Excommunicatio, extrahitur pro re nihili, ut pro re nummariâ?

This once established, will direct us to put a difference betwixt the holy and the prophane, the clean and the unclean, for want whereof the Lord challenges the Priests. Hath not this been, and is it not yet in a great part, remaining upon us, as one of our land destroying sins; the promiscuous thrusting in of scandalous and ignorant persons upon the Sacrament of the Lord’s Supper, to the horrible prophaning of the same, and no power that would hitherto be allowed as legal, no not for making stay of such? Misunderstand me not, I mean not, that men should be cut short of that latitude which the Laws of Christ allow; only let that hedge and mound of Discipline be erected, whereby holy things may not be indifferently administered, as well to men egregiously prophane, and that after conviction, as to the Lord his holy ones.”

— Oliver Bowles, Zeal for God’s house quickened: or, A sermon preached before the assembly of Lords, Commons, and Divines, at their solemn fast July 7. 1643. In the Abbey Church at Westminster. Expressing the eminency of zeal requisite in church reformers, (London: Samuel Gellibrand, 1643), pp 10-13.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+the+excellency+of+the+work+may+be+yet+further+evidenced%3A+consider+it+in+the+objects+whereabout+it+is+conversant%3B+that+is%2C+either+Things%2C+or+Persons.+Things+are+Doctrine%2C+Worship%2C+and+Government%3B+Doctrine+is+a+ray+or+beam+of+supernatural+truth+issued+out+from+God+as+a+special+favour+to+his+people%2C+tending+to+inform+them+in+right+notions+and+apprehensions+concerning+God%2C+Christ%2C+our+souls%2C+and+the+whole+way+of+salvation.+This+is+called+the+word+of+life%2C+the+wholesome+word%2C+the+word+of+salvation%3B+how+useful+is+this+word%2C+since+men+do+as+surely+perish+by+damnable+heresies%2C+as+by+moral+vices.%0A%0ADoctrine+is+as+the+waters+of+the+Sanctuary%2C+how+great+a+sin+to+puddle+or+poison+these%21+was+it+not+capital+among+the+Romans+to+poison+the+common+springs%3F+How+noisome+was+that+plague+to+the+Egyptians+to+have+all+their+waters+whereof+they+should+drink%2C+turned+into+blood%3F+was+it+not+much+more+%28as+the+soul+is+more+excellent+then+the+body%29+pestilential+to+have+all+the+main+Articles+of+our+Religion+%28not+that+of+Justification+excepted%29+to+be+all%2C+or+the+most%2C+desperately+corrupted%2C+as+may+be+seen+in+the+Ministers+Remonstrance+exhibited%2C+together+with+their+Petition+for+Reformation.%0A%0AThe+second+particular%2C+whereabout+Reformation+is+conversant%2C+is+worship%3B+whereby+God+and+we+have+communion+one+with+another%2C+wee+doe+in+a+holy+manner+trade+with+God+and+he+with+us.+This+is+as+Jacob%E2%80%99s+ladder%2C+The+Angels+of+God+ascend+and+descend+by+it%3B+our+prayers+ascend%2C+God%E2%80%99s+blessings+descend.+The+ordinances+are+those+golden+pipes+by+which+the+golden+oil+empties+it+self+into+the+hearts+of+God%E2%80%99s+people%3B+They+are+the+Churches+breasts+from+whence+her+children+suck+nourishment%3B+They+are+the+Churches+barn+and+her+Wine-press%3A+They+are+on+Christ%E2%80%99s+part+the+kisses+of+his+mouth%2C+the+mutual+embraces+betwixt+God+and+the+Christian+Soul%3B+Dry+up+all+the+breasts+in+such+a+City+as+this%2C+how+great+will+the+cry+of+the+Infants+be%3F+This+mischief+by+the+putting+down+of+Preaching%2C+and+strange+Innovations+brought+and+urged+upon+us+in+our+most+solemn+worship%2C+had+in+a+great+part+seized+upon+us%2C+and+will+yet+certainly+prevail+if+the+Reformers+do+not+seasonably+and+strongly+oppose.%0A%0AThe+third+particular+is+Church+Discipline+or+Government%3B+all+Societies%2C+and+so+the+Church%2C+is+upheld+by+ruling+and+being+ruled.+This+amongst+other+benefits+it+will+yield%2C+That+it+will+preserve+the+honour+of+God%E2%80%99s+censures+and+ordinances%2C+that+great+censure+of+Excommunication%2C+which+is+no+less+then+the+delivery+up+of+a+man+to+Satan%2C+and+%28next+the+day+of+judgement%29+it+is+judicium+maxime+tremendum%2C+it+shall+no+longer+Lackey+up+and+down+for+Duties+and+Fees+as+it+hath+done+amongst+us%2C+and+as+it+did+in+the+darkest+times+of+Popery+as+Gerson+complains%2C+Lib.+de+Eccles.+defect.+Quid+est%2C+quod+Gladius+Ecclesiae%2C+scilicet+Excommunicatio%2C+extrahitur+pro+re+nihili%2C+ut+pro+re+nummari%C3%A2%3F%0A%0AThis+once+established%2C+will+direct+us+to+put+a+difference+betwixt+the+holy+and+the+prophane%2C+the+clean+and+the+unclean%2C+for+want+whereof+the+Lord+challenges+the+Priests.+Hath+not+this+been%2C+and+is+it+not+yet+in+a+great+part%2C+remaining+upon+us%2C+as+one+of+our+land+destroying+sins%3B+the+promiscuous+thrusting+in+of+scandalous+and+ignorant+persons+upon+the+Sacrament+of+the+Lord%E2%80%99s+Supper%2C+to+the+horrible+prophaning+of+the+same%2C+and+no+power+that+would+hitherto+be+allowed+as+legal%2C+no+not+for+making+stay+of+such%3F+Misunderstand+me+not%2C+I+mean+not%2C+that+men+should+be+cut+short+of+that+latitude+which+the+Laws+of+Christ+allow%3B+only+let+that+hedge+and+mound+of+Discipline+be+erected%2C+whereby+holy+things+may+not+be+indifferently+administered%2C+as+well+to+men+egregiously+prophane%2C+and+that+after+conviction%2C+as+to+the+Lord+his+holy+ones.%E2%80%9D%0A%0A%E2%80%94+Oliver+Bowles%2C+Zeal+for+God%E2%80%99s+house+quickened%3A+or%2C+A+sermon+preached+before+the+assembly+of+Lords%2C+Commons%2C+and+Divines%2C+at+their+solemn+fast+July+7.+1643.+In+the+Abbey+Church+at+Westminster.+Expressing+the+eminency+of+zeal+requisite+in+church+reformers%2C+%28London%3A+Samuel+Gellibrand%2C+1643%29%2C+pp+10-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F224cff15f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/224cff15f4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/16/oliver-bowles-on-the-reformation-of-doctrine-worship-and-government/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Objection 2. Ordination and conformity, and common-prayers and ceremonies are connected with preaching, as one entire service; by partaking therefore of the one we contract the pollution of the other. Answer 1: What God Himself in a moral way joins together, no man may separate, only God Himself: But what God in nature has joined together, He gives us leave to separate, as chaff from wheat, etc. And so likewise for what man joins together, especially in the service of God and such matters thereof as God has not required; A set liturgy or stinted form of prayer for matter and words to be used (much less to be inseparably joined with preaching) is not required by the Lord, nor indeed is there any such necessary dependance by our laws… Answer 2… Nor are they so inseparably joined by our laws: But if they were, it is sufficient to my conscience that God has not so joined them. Our actings, and the reasons or grounds of them, are not to be interpreted in Church-matters by human laws; If they were, it would be difficult to inhabit in some commonwealths with a good conscience. Our living within the precincts of such a parish, our laws interpret as being of the same particular church with them for all Church-ordinances: but this being man’s law only, we judge ourselves not so necessarily involved by our habitation. A Church according to Scripture is a spiritual body: The limits are part of the essence and constitution of such a body, and therefore ought to be spiritual and of the same nature, and not merely human, as is the division of parishes.</p></blockquote>

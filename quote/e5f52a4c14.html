<blockquote><p>Jesus, which is taken up into heaven There are two members in this one sentence. The first is, that Christ was taken up into heaven, that they may not henceforth foolishly desire to have him any longer conversant with them upon earth. The other is straightway added as a consolation concerning his second coming. Out of these two jointly, and also severally, is gathered a firm, stable, and strong argument, to refute the Papists, and all other which imagine that Christ is really present in the signs of bread and wine. For when it is said that Christ is taken up into heaven; here is plainly noted the distance of place.

I grant that this word heaven is interpreted divers ways, sometimes for the air, sometimes for the whole connection of the spheres, sometimes for the glorious kingdom of God, where the majesty of God hath his [its] proper scat, howsoever it doth fill the whole world. After which sort Paul doth place Christ above all heavens, (Ephesians 1:22,) because he is above all the world, and hath the chiefest room in that place of blessed immortality, because he is more excellent than all the angels, (Ephesians 4:15.) But this is no let why he may not be absent from us bodily, and that by this word heavens, there may not be signified a separation from the world. Let them cavil as much as they will, it is evident that the heaven whereinto Christ was received is opposite to the frame of the world; therefore it doth necessarily follow, that if he be in heaven, he is without [beyond] the world.

But, first, we must mark what the purpose of the angels was, for thereby we shall more perfectly know what the words mean. The angels’ intent was to call back the apostles from desiring the carnal presence of Christ. For this purpose was it that they said that he should not come again until he came to judge the world. And to this end serveth the assigning of the time, that they might not look for him in vain before that same time. Who seeth not that in these words is manifestly showed that he was bodily absent out of the world? Who seeth not that we are forbidden to desire to have him upon the earth?

But, they think they escape safe with that crafty answer, when as they say that then he shall come visibly; but he cometh now invisibly daily. But we are not here to dispute of his form; only the apostles are taught that Christ must abide in heaven until such time as he appear at the latter day. For the desiring of his corporeal presence is here condemned as absurd and perverse. The Papists deny that he is present in the sacrament carnally, while that his glorious body is present with us after a supernatural sort, and by a miracle; but we may well enough reject their inventions concerning his glorious body, as childish and frivolous toys. They feign unto themselves a miracle not confirmed with any testimony of Scripture.

The body of Christ was then glorious, when as he was conversant with his disciples after his resurrection. This was done by the extraordinary and secret power of God; yet, notwithstanding, the angels do forbid to desire him afterward after that sort, and they say that he shall not come unto men in that sort (before the latter day.) Therefore, according to their commandment, let us not go about to pull him out of the heavens with our own inventions; neither let us think that we call handle him with our hands, or perceive him with our other senses, more than we can see him with our eyes. I speak always of his body. For in that they say it is infinite, as it is all absurd dream, so is it safely to be rejected.

Nevertheless, I willingly confess that Christ is ascended that he may fulfill [fill] all things; but I say that he is spread abroad everywhere by the power of his Spirit, not by the substance of his flesh. I grant, furthermore, that he is present With us both in his word and in the sacraments. Neither is it to be doubted, but that all those which do with faith receive the signs of his flesh and blood, are made truly partakers of his flesh and blood.

But this partaking doth nothing agree with the dotings of the Papists; for they feign that Christ is present in such sort upon the altar as Numa Pompilius did call down his Jupiter Elicitus, or as those witches did fetch down the moon from heaven with their enchantments. But Christ, by reaching us the bread in his Supper, doth will us to lift up our hearts into heaven, that we may have life by his flesh and blood. So that we do not eat his flesh grossly, that we may live thereby, but he poureth into us, by the secret power of his Spirit, his force and strength.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids MI: Baker, 1993), 18a: 51-53.</span></figcaption>

<blockquote><p>It is therefore evident that according to the Romish Church the mass is presented as a continual and oft repeated sacrifice of Christ, offered up by the priests, and that this repeated sacrifice is indeed necessary for the forgiveness of sins, both of those that are living on the earth and of the departed souls that are still in purgatory. According to the Roman Catholics the mass has all the essential elements of a true sacrifice. It is offered by a priest, Jesus Christ through the ministry of His earthly representative, the Roman Catholic priest. It has its victim, again Jesus Christ, as He is really present under the appearance of bread and wine. And it is offered up as a real sacrifice through the mystic rite of consecration.

In the mass there is, therefore, a continuation of the bloody sacrifice of Christ on the cross in an unbloody manner. The Romish Church does indeed maintain that this sacrifice of the mass is necessary, and they deny that it is quite sufficient that Christ once for all and forever shed His blood for the blotting out of all the sins of His people. This element of the mass, together with the element that the transubstantiated signs are to be worshipped by the church, the Heidelberg Catechism in Question 80 rightly calls an accursed idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-hoeksema.html">Herman Hoeksema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, ed. Homer C. Hoeksema (Grand Rapids MI: Reformed Free Publishing Association, 1966), p. 724.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is therefore evident that according to the Romish Church the mass is presented as a continual and oft repeated sacrifice of Christ, offered up by the priests, and that this repeated sacrifice is indeed necessary for the forgiveness of sins, both of those that are living on the earth and of the departed souls that are still in purgatory. According to the Roman Catholics the mass has all the essential elements of a true sacrifice. It is offered by a priest, Jesus Christ through the ministry of His earthly representative, the Roman Catholic priest. It has its victim, again Jesus Christ, as He is really present under the appearance of bread and wine. And it is offered up as a real sacrifice through the mystic rite of consecration.

In the mass there is, therefore, a continuation of the bloody sacrifice of Christ on the cross in an unbloody manner. The Romish Church does indeed maintain that this sacrifice of the mass is necessary, and they deny that it is quite sufficient that Christ once for all and forever shed His blood for the blotting out of all the sins of His people. This element of the mass, together with the element that the transubstantiated signs are to be worshipped by the church, the Heidelberg Catechism in Question 80 rightly calls an accursed idolatry.”

— Herman Hoeksema, Reformed Dogmatics, ed. Homer C. Hoeksema (Grand Rapids MI: Reformed Free Publishing Association, 1966), p. 724.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+therefore+evident+that+according+to+the+Romish+Church+the+mass+is+presented+as+a+continual+and+oft+repeated+sacrifice+of+Christ%2C+offered+up+by+the+priests%2C+and+that+this+repeated+sacrifice+is+indeed+necessary+for+the+forgiveness+of+sins%2C+both+of+those+that+are+living+on+the+earth+and+of+the+departed+souls+that+are+still+in+purgatory.+According+to+the+Roman+Catholics+the+mass+has+all+the+essential+elements+of+a+true+sacrifice.+It+is+offered+by+a+priest%2C+Jesus+Christ+through+the+ministry+of+His+earthly+representative%2C+the+Roman+Catholic+priest.+It+has+its+victim%2C+again+Jesus+Christ%2C+as+He+is+really+present+under+the+appearance+of+bread+and+wine.+And+it+is+offered+up+as+a+real+sacrifice+through+the+mystic+rite+of+consecration.%0A%0AIn+the+mass+there+is%2C+therefore%2C+a+continuation+of+the+bloody+sacrifice+of+Christ+on+the+cross+in+an+unbloody+manner.+The+Romish+Church+does+indeed+maintain+that+this+sacrifice+of+the+mass+is+necessary%2C+and+they+deny+that+it+is+quite+sufficient+that+Christ+once+for+all+and+forever+shed+His+blood+for+the+blotting+out+of+all+the+sins+of+His+people.+This+element+of+the+mass%2C+together+with+the+element+that+the+transubstantiated+signs+are+to+be+worshipped+by+the+church%2C+the+Heidelberg+Catechism+in+Question+80+rightly+calls+an+accursed+idolatry.%E2%80%9D%0A%0A%E2%80%94+Herman+Hoeksema%2C+Reformed+Dogmatics%2C+ed.+Homer+C.+Hoeksema+%28Grand+Rapids+MI%3A+Reformed+Free+Publishing+Association%2C+1966%29%2C+p.+724.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F340d76efdc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/340d76efdc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/28/herman-hoeksema-on-the-romish-mass/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>

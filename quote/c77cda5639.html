<main class="wrap"><figure class="quote" id="q-c77cda5639" data-kw="">
<blockquote><p>AGAIN THE CHARIOT-RACES ARE ON, and again our congregation has shrunk. However, as long as you are present, our assembly could not shrink. If a farmer should see his crop in full bloom and ready for harvest, he makes little account of the fact that the leaves are falling. Since you are here as my harvest, neither do I now feel such great distress because I see that the fallen leaves are being swept away.

I do grieve for the laxity of those who are not here, but still the earnestness of the loving assembly of you who are present consoles me in the pain I feel for those who are absent. Sometimes those absentees do attend our services. But, even then, they are not really present. Their bodies are here, but their minds are wandering far and wide. In your case, however, even when you are taken away from our assembly, even then you are among us. Your bodies may be elsewhere, but your minds are here in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incomprehensible Nature of God</cite>, (c. 386-98), trans. Paul W. Harkins, The Fathers of the Church: A New Translation, vol. 72 (Washington D.C.: Catholic University Press, 1982), 7.1, p. 184.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>§.23. Of the restraint of the benefit of Christ’s headship to them only that are of his body. That none but those who are of Christ’s body shall partake of the benefit of his office is clear by other like titles of restraint, as ‘his people’, and ‘his sheep’: but especially by denying to the world the benefit of his intercession, ‘I pray not for the world,’ says He. In this respect this position (out of the Church no salvation) is without exception true: for the body is the true, catholic, invisible Church: he that is not a member of this Church, but is out of it, has not Christ to be his head and Savior, whence then can he have salvation? The former point is not more comfortable to those that have assurance that they are members of this body, then this is terrible to those that give too great evidence they are no members thereof; as all they do that have not the spirit of Christ ruling in them, but rather rebel against Him: and bear no love to the saints, but rather hate them, and do them all the spight they can.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London: Haviland, 1622), 1st Treatise, §23</span></figcaption>

ht%20they%20can" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e76b9d6b8a" data-kw="">
<blockquote><p>Here it is particularly to be observed that this [Church] discipline exercises such a degree of severity as is always connected with a spirit of kindness… it can easily be judged thence how far to proceed and where severity ought to cease… otherwise rigor exceeds the proper bound. Hence the immoderate austerity of the ancients cannot be approved, which was both contrary to the prescription of God and was exposed to great dangers… Therefore that spiritual sword is not to be unsheathed for a trivial cause (as is the case everywhere among the Anabaptists), but all things are to be first tried and only by degrees ought we to resort to extreme measures…</p></blockquote>

<blockquote><p>49 Q. What reasons may be given of the Lord’s days beginning in the morning?

A. Other days then begin.

That they do so with us, is evident by the account of our hours. For midnight ended, we begin with one a clock: then the first hour of the day beginneth. And it appears to be so among the Jews: for when Aaron proclaimed (Exod. 32. 5, 6.) To morrow shall be a feast to the Lord, They rose up early on the morrow. I deny not but that sundry of the Jewish feasts began in the evening: as the Passover (Exod. 12.6.) But it cannot be proved that their weekly Sabbaths so began. There were special reasons for the beginning of those feasts in the evening, which did then begin. As for the supposed beginnings of the first days gathered out of this phrase, (the evening and the morning were the first day) they cannot be necessarily concluded to be at evening. For the evening and the morning there importeth the moment of the evening and morning parting one from another, and the return to the same period: which moment is rather at the beginning of the morning then of evening. The evening useth to be referred to the end of the day, and the morning to the beginning, as Exod. 29. 38, 39. I. Sam. 17. 16. and 30.12. Joh. 20.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), p. 25.</span></figcaption>

<blockquote><p>‘with her head uncovered’. It may seem strange from whom the Corinthian women should take up this custom, since the Jewish women were not allowed to go into the streets, or into any open and public place, unveiled (Maimonides, Hilch. Ishot, ch. 24, sect. 12). It was a Jewish law, that they should go out nowhere bare-headed (Babylonian Talmud, Cethubot, fol. 72. 1): yea, it was reckoned scandalous and ignominious to do so. Hence it is said, שגלוי הראש גנאי להם, “that uncovering of the head is a reproach” to the daughters of Israel (Rabbi Solomon Jarchi on Numb. 5:19)… So that there it should seem that these Corinthians followed the examples of the heathens: but then, though it might be the custom of some nations for women to go abroad bare headed; yet at their solemnities, where and when they were admitted, for they were not everywhere and always, they used to attend with their heads veiled and covered (Alex., ab Alex. Genial. Dier., bk. 4, ch. 17)… ‘for that is even all one as if she were shaven’; to be without a veil, or some sort of covering on her head, according to the custom of the country, is the same thing as if her head was shaved;…</p></blockquote>

<blockquote><p>Delight not to be in bad places and company; to delight in such argues you are bad yourself. We are to hate the garment spotted with the flesh. Some expound this, “to avoid the occasions of sin,” but Mr [William] Perkins gives this sense: “to hate bad company.” He alludes to the ceremonial law that said that if a man had a leprous garment, or a garment otherwise made unclean, his company was to be avoided. God therefore gave that command not to plough with an ox and an ass together; the ass was an unclean creature, and the ox was one of the clean beasts, and they must not be in the same yoke. This notes (say divines) that God’s people and profane persons must not be yoked together. Though they may occasionally meet together, yet they must not be yoked together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: the truth, growth, and different degrees in fifteen sermons</cite>, ed. Don Kistler (Morgan, 1997), pp 12-13.</span></figcaption>

<blockquote><p>The Sanctity of this blessed House [of the saints in Heaven]… Sanctity of place is relative and is founded either upon the manifestation of God’s special Presence, or consecration of it to his service. ‘Tis consistent with the Divine Immensity to be differently present in several places: as the soul is in another manner present in the head, where it performs its noblest operations, than in other parts of the body; and upon any special appearance of God, a place is sacred. Thus when Moses approached to see the flaming bush, he was enjoined, ‘Do not come near hither; pluck off thy shoes from off thy feet, the place where thou standest is holy ground.’ The visible testimony of the divine Presence sanctified the place, and the most humble outward reverence was due, a sign and effect of the internal respect that is owing to his most adorable Majesty. The sanctity of that place was an extraordinary relation and ceased upon the vanishing of the flame, the sign of God’s Presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Description of the Blessed Place &amp; State of the Saints Above</cite>, … (London: J.D., 1687), pp. 16-18</span></figcaption>

k">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-898fab83d8" data-kw="">
<blockquote><p>All creatures for their continuance, have a kind of dependence upon one another. As the grass and plants upon the earth, the bruites upon the fruits of the earth, and our nutriment is from inferior creatures. But our Jehovah dependeth upon none, he is of, and from himself, he needeth no servant, no service. In him we all live, move and have our being, but his Majesty is beholding to none, either men or Angels, either for being or well-being.

Thus much God intended to teach by his speech to Moses, and God said unto Moses, I am that I am. We think verily that we shall be utterly undone if the Parliament break up, or if our King divide himself from this his body representative. Beloved, my soul maketh out to God for the prevention of this sad fraction. Yet I beseech you remember this, whatsoever falls out, that whereas all men, and all ordinances, Kings and Parliaments depend on God, yet our God Jehovah is an independent Majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simeon-ashe.html">Simeon Ashe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A support for the sinking heart in times of distress, or, A sermon preached in London to uphold hope and allay fear January 4th which was a day of great trouble and deep danger in the city</cite>, (London: Thomas Underhill, 1642), p. 31.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“All creatures for their continuance, have a kind of dependence upon one another. As the grass and plants upon the earth, the bruites upon the fruits of the earth, and our nutriment is from inferior creatures. But our Jehovah dependeth upon none, he is of, and from himself, he needeth no servant, no service. In him we all live, move and have our being, but his Majesty is beholding to none, either men or Angels, either for being or well-being.

Thus much God intended to teach by his speech to Moses, and God said unto Moses, I am that I am. We think verily that we shall be utterly undone if the Parliament break up, or if our King divide himself from this his body representative. Beloved, my soul maketh out to God for the prevention of this sad fraction. Yet I beseech you remember this, whatsoever falls out, that whereas all men, and all ordinances, Kings and Parliaments depend on God, yet our God Jehovah is an independent Majesty.”

— Simeon Ashe, A support for the sinking heart in times of distress, or, A sermon preached in London to uphold hope and allay fear January 4th which was a day of great trouble and deep danger in the city, (London: Thomas Underhill, 1642), p. 31.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+creatures+for+their+continuance%2C+have+a+kind+of+dependence+upon+one+another.+As+the+grass+and+plants+upon+the+earth%2C+the+bruites+upon+the+fruits+of+the+earth%2C+and+our+nutriment+is+from+inferior+creatures.+But+our+Jehovah+dependeth+upon+none%2C+he+is+of%2C+and+from+himself%2C+he+needeth+no+servant%2C+no+service.+In+him+we+all+live%2C+move+and+have+our+being%2C+but+his+Majesty+is+beholding+to+none%2C+either+men+or+Angels%2C+either+for+being+or+well-being.%0A%0AThus+much+God+intended+to+teach+by+his+speech+to+Moses%2C+and+God+said+unto+Moses%2C+I+am+that+I+am.+We+think+verily+that+we+shall+be+utterly+undone+if+the+Parliament+break+up%2C+or+if+our+King+divide+himself+from+this+his+body+representative.+Beloved%2C+my+soul+maketh+out+to+God+for+the+prevention+of+this+sad+fraction.+Yet+I+beseech+you+remember+this%2C+whatsoever+falls+out%2C+that+whereas+all+men%2C+and+all+ordinances%2C+Kings+and+Parliaments+depend+on+God%2C+yet+our+God+Jehovah+is+an+independent+Majesty.%E2%80%9D%0A%0A%E2%80%94+Simeon+Ashe%2C+A+support+for+the+sinking+heart+in+times+of+distress%2C+or%2C+A+sermon+preached+in+London+to+uphold+hope+and+allay+fear+January+4th+which+was+a+day+of+great+trouble+and+deep+danger+in+the+city%2C+%28London%3A+Thomas+Underhill%2C+1642%29%2C+p.+31.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F898fab83d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/898fab83d8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/20/simeon-ashe-on-divine-independence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

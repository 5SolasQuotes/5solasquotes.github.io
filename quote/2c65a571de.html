<main class="wrap"><figure class="quote" id="q-2c65a571de" data-kw="">
<blockquote><p>Writing from the Netherlands, James Renwick et al reminded the suffering Covenanters in Scotland that one way to endure persecution and affliction is to remember the greatness of our sin:

We think there is nothing will help us so well to bear patiently, as a full sight of the wrongs that we have done to the work of a holy God. We would then be made to say, we are “afflicted less than our iniquities deserve.” We would be then put to desire no deliverance from the yoke of our oppression, without a deliverance from the yoke of our transgressions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to their friends in Scotland, 24 Feb. 1683 in Thomas Houston (ed.), Spiritual support and consolation in difficult times: the letters of the Rev. James Renwick, the last of Scotland’s covenanted martyrs, with and introduction, containing a historical sketch of Renwick’s life, labours, and mar</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51443fb203" data-kw="">
<blockquote><p>2. SCRIPTURE prophecies evidently referring to New Testament times, mention its [social covenanting’s] approbation, Isaiah xix. 18. “In that day,” (viz the gospel day or New Testament times) “shall five cities in the land of Egypt speak the language of Canaan, and swear to the LORD of hosts.” And in the 21 verse, we are told, “The LORD shall be known to Egypt, and the Egyptians shall know the LORD – and shall do sacrifice and oblation.” A collateral or, at least, a consequential part of their character is, that, “they shall vow a vow unto the LORD, and perform it.” This is predicated as a national deed, done in a collective, social or corporate capacity.

Its general practice among the Christianized Gentiles, their mutual co-operation in the cause of God, and the smile of divine approbation which they shall enjoy in so doing, are beautifully painted out in the 23, 24, &amp; 25 verses, “In that day shall there be a high-way out of Egypt to Assyria; and the Egyptian into Assyria: and the Egyptians shall serve with the Assyrians. In that day shall Israel be the third with Egypt and with Assyria, even a blessing in the midst of the land. Whom the LORD of hosts shall bless, saying, Blessed be Egypt my people, and Assyria the work of my hands, and Israel mine inheritance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-b-wylie.html">Samuel B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Obligation of Covenants. A Discourse</cite>, (Glasgow, 1803), pp 22-23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-bef0e1ad07" data-kw="">
<blockquote><p>To displace and throw down this Exactor, this Phalaris, this Nero, is a work well pleasing to God; Namely, for being such a one: which is a moral reason. Shall then so slight a consideration as his hap to be not elective simply, but by birth, which was a mere accident, overthrow that which is moral, and make unpleasing to God that which otherwise had so well pleased Him? certainly not: for if the matter be rightly argued, Election much rather than chance, binds a man to content himself with what he suffers by his own bad Election. Though indeed neither the one nor other binds any man, much less any people to a necessary sufferance of those wrongs and evils, which they have ability and strength enough given them to remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted of Luther by Cochlæus</cite></span></figcaption>

</figure><figure class="quote" id="q-8d95f51221" data-kw="">
<blockquote><p>…for the power is either a power to rule according to God’s law, as he is commanded (Dt. 17) and this is the very office or official power which the King of kings has given to all kings under him, and this is a power of the royal office of a king, to govern for the Lord his Maker; or this is a power to do ill and tyrannize over God’s people; but this is accidental to a king and the character of a tyrant, and is not from God… If then the judge and the king be both lawful ordinances, and if they differ essentially, as Barclay [a Romanist] says, then that specific form which distinguishes the one from the other [according to Barclay], to wit, domination and a power to destroy the subject, must be from God; which is blasphemous: for God can give no moral power to do wickedly; for that is licence, and a power to sin against a law of God, which is absolutely inconsistent with the holiness of God; for so the Lord might deny Himself, and dispense with sin. God avert such blasphemies!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 72 rt col top</span></figcaption>

<blockquote><p>[A]s your princes and rulers are criminal, with your bishops, of all idolatry committed, and of all the innocent blood that is shed for the testimony of Christ’s truth, and that because they maintain them in their tyranny, so are you (I mean so many of you as give no plain confession to the contrary) criminal and guilty with your princes and rulers, of the same crimes, because ye assist and maintain your princes in their blind rage, and give no declaration that their tyranny displeaseth you.</p></blockquote>

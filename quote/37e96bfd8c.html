<main class="wrap"><figure class="quote" id="q-37e96bfd8c" data-kw="">
<blockquote><p>Man as a sinner, as all true Christians will admit, has no right to approach into God’s presence at all. The amity which previously existed in Eden was broken up by the Fall. God “drove out the man,” and He alone is entitled to say whether, and on what conditions, he shall never again be permitted to approach His throne. It is manifest presumption on the part of fallen creatures to dictate to God either that there shall be worship at all or what form it shall assume.

In entering the courts of earthly monarchs, even where a right to enter is conceded, every rule and form of the court must be carefully observed; and far more is this important in entering, by gracious permission, into the immediate presence of the King of kings and Lord of lords. “See thou do all things according to the pattern showed thee in the mount,” was the command of God to Moses. “God is greatly to be feared in the assembly of the saints.”

It is in connection with worship that the solemn question is asked, “Who hath required this at your hands?” It is in connection with the second commandment, which concerns the mode of Divine worship, that the Lord says, “I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children, even unto the third and fourth generation of them that hate me.” Korah and his company were swallowed up for disregarding the ordinance of God in regard to worship. It was in connection with this that Christ drove the buyers and sellers out of the temple, and that He said on another occasion, “In vain do they worship me, teaching for doctrines the commandments of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 4-5.</span></figcaption>

<blockquote><p>…but he [Paul] says that the church has no such custom as that any man should be contentious, but rather that all should preserve the common peace. But if any one be contentious, he is a stranger to the church of God… he says, that the churches of God have no custom of allowing any man to be contentious. Thus he represses contentious spirits by the authority of the church, and does not confirm the dogma by mere custom. Now that custom of avoiding contention in the church is abundantly sanctioned by testimonies of scripture.</p></blockquote>

</figure><figure class="quote" id="q-03ef5595b5" data-kw="">
<blockquote><p>Many assume that the Continental Reformed had a loose view of the Sabbath, which allowed for people to engage in recreation, whereas the stuffy Puritans and Covenanters were legalists. We have previously pointed out that Henry Bullinger and Martin Bucer did not share this perspective. Johannes Wollebius gives us further reason to believe that the notion of a Continental Sabbath is probably a myth:

The Sabbath is profaned, 1. When we do the works of our outward calling needlessly, as when we make journeys or exact debts then, &amp; c. 2. When we spend the Sabbath in carnal works, as in gaming, dancing, revelling, idle talking, Stage-plays, and such like sins. 3. In idolatrous works.

Such a profanation is a most grievous sin, Exod. 31. 13, 14. Num. 15. 35. Neh. 13. 16. Jer. 17. 27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), p. 371.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>I hold myself bound by this [Solmen League &amp;] Covenant [1643] to nothing which I had not been bound to if I had never taken it. For I never thought that by vows we may make new religions or laws to ourselves, but only bind ourselves to that which God does make our duty.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-f9282d5ef8" data-kw="">
<blockquote><p>We hold it as unlawful (as themselves) outwardly and but in appearance to join with idolaters in their idolatry; and yet we see not warrant why every particular act, that in a large sense is idolatrous, adjoined to God’s true worship, we should forbear our presence, as the true worship itself: Or that our presence for the true worship’s sake alone should in respect of some point of false worship thereunto annexed be… the submitting our bodies to a strange worship, especially when we are not particular actors in it, but only present, beholding it with grief and suffering it in others for the true worship’s sake, unto which it is adjoind. If this should be held unlawful then can no man present himself with a good conscience at any public worship of God wheresoever, because… he can have no assurance but that some errors in matter or form will be committed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of the Separation made Apparent</cite>, ... (1614; Amsterdam, 1640), pt. 1, 6th Reason, p. 103</span></figcaption>

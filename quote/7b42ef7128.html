<main class="wrap"><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58d2a5691c" data-kw="">
<blockquote><p>A contemporary chronicler informs us that in August 1545 a fatal pestilence visited all the burghs of Scotland… He [Wishart] was urged to resume his public ministrations, but as those who attended the sick or exhibited symptoms of ailment were carefully avoided, there was difficulty in arranging matters. Wishart proposed to preach from the East Port, the sick and suspected being accommodated without, and those in health within the walls. The proposal was accepted, and the preacher discoursed from the 20th verse of the 107th Psalm: ” He sent His Word and healed them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-wishart.html">George Wishart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles Rogers, Life of George Wishart, the Scottish Martyr</cite>, ... (Edinburgh, 1876), pp. 24-25</span></figcaption>

</figure><figure class="quote" id="q-e6f79cad8b" data-kw="">
<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-melville.html">Andrew Melville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘To Pastors of the Kirk of Geneva &amp; Zurich’</cite>, pp. 165-66 in David Calderwood, History of the Kirk of Scotland, vol. 4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-42d60afd46" data-kw="">
<blockquote><p>[T]he Lord have given no power to any ruler to waste and destroy the mountain of the Lord.

For (1), all royal power given of God (Deut. 17:18-20), in the first moulding of royal highness, was a power to rule according to that which is written in the Book of the Law, and so there can be no royal power to the contrary, truly royal.

(2) That power cannot be from God as a lawful power, the exercise and acts whereof are sinful. I speak of a lawful moral power.

(3) If such an incontrollable power as cannot be resisted, is of God, then princes given to the churches and people of God, as judgments of God, then are all Christian states actu primo, made slaves by God, in the very intention of God the giver, and of the gift, at what time he gives them as a nurse-father to feed and govern them; and so shall God’s gifts be snares, plagues, and no gifts.

If God gives a fatherly power to a father to kill all his children, and if a state gives to their general a military power to sell and destroy all his soldiers, so as neither sons, nor soldiers may defend themselves, then the fatherly power should be of its own nature a plague to the sons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached to the honourable House of Commons at their late Solemn Fast, Wednesday, January 31, 1643/44 in Chris Coldwell (ed.), Sermons Preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of Divines</cite></span></figcaption>

<blockquote><p>II. What are the Parts of the law, and what their Differences? Laws are divine and human. Human laws are such as are instituted by men, and which bind certain persons to certain external duties concerning which there is no express divine precept or prohibition with a promise of reward and threatening of punishment, corporal and temporal. Human laws are either civil or ecclesiastical. Civil are such positive laws as are instituted by magistrates, or by some corporation, or state, in reference to a certain order or class of actions to be observed in the state in contracts, trials, punishments, &amp;c. Ecclesiastical, or ceremonial laws, are those which the church institutes in reference to the order which is to be observed in the ministry of the church, and which lay down certain prescriptions in reference to those things which contribute to the divine law…. Divine laws are those which God has instituted, which belong partly to angels, partly to men, and partly to certain classes of men. These do not only require external actions or obedience, but they also require internal qualities, actions and motives: nor do they merely propose temporal rewards and punishments; but also such as are spiritual and eternal. They are also the ends for which human laws are instituted. Of divine laws there are some that are eternal and unchangeable; whilst there are others that are changeable; yet only by God himself, who has instituted them. The divine law is ordinarily divided, or considered as consisting of three parts; the moral, the ceremonial and the judicial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, 34th Lord’s Day, ‘Of the 10 Commandments’, pp. 490-491</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Our fathers were exposed to great peril, when they entered into covenant with God, 1643, London, in that immortal bond, known as the Solemn League and Covenant. The Pope, Urban VIII, had engaged all the Roman Catholic powers of Continental Europe in an impious confederacy against the Protestant church, and the cause of liberty in Britain. God blessed the Solemn League and Covenant to defeat their plans.

Our own times are fraught with danger to the church. The complexion, animating spirit, and administration of every civil government in the world is adverse to the government of Messiah, the Prince of the kings of the earth. “The Devil has come down, having great wrath, for he knoweth he hath but a short time.” All the organized systems of worship, as systems which are confederated with these bad thrones, give their power to the beast, in the war which the dragon wages with’ the Lamb. Messiah calls on all his followers to unite in solemn covenanting for the city of our God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick-willson.html">James Renwick Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seasons of Covenanting , 6, no. 5, Covenanter</cite></span></figcaption>

<blockquote><p>They are not only such as shall be happy, but they are very useful and beneficial in the world, they are those for whose sake the world was made, they are the great common blessings of the world, like fire and water, they are those for whose sake God spares the world.

<blockquote><p>32. They [presbyterians] hold (I believe with warrant of God’s Word) if the king refuse to reform religion, the inferior judges, and assembly of godly pastors and other church-officers may reform; if the king will not kiss the Son, and do his duty in purging the House of the Lord, may not Elijah and the people do their duty and cast out Baal’s priests [1 Kings 18:19-24, 30, 37-40]. Reformation of religion is a personal act that belongs to all, even to any one private person according to his place.

33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17).

34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.</p></blockquote>

33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17).

34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.”

<main class="wrap"><figure class="quote" id="q-819cd372c2" data-kw="">
<blockquote><p>According to the judgment of the Nicene Council, we say, that the Bishop of Rome hath no more jurisdiction over the Church of God than the rest of the patriarchs, either of Alexandria, or of Antiochia have. And as for the Bishop of Rome, who now calleth all matters before himself alone, except he do his duty as he ought to do, except he minister the Sacraments, except he instruct the people, except he warn them and teach them, we say that he ought not of right once to be called a bishop, or so much as an elder. For a bishop, as saith Augustine, is a name of labour, and not of honour: because he will have that man understand himself to be no bishop, which will seek to have pre-eminence, and not to profit others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e515d7fb38" data-kw="">

</figure><figure class="quote" id="q-44327ec6c7" data-kw="">
<blockquote><p>Has it never occurred to you that the pope, cardinals, bishops, monks, and that the whole synagogue of Satan are trouble-makers? The truth is, they are worse than false apostles. The files [sic] apostles taught that in addition to faith in Christ the works of the Law of God were necessary unto salvation. But the papists omit faith altogether and teach self-devised traditions and works that are not commanded of God, indeed are contrary to the Word of God, and for these traditions they demand preferred attention and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 22</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3c7ee5eca1" data-kw="">
<blockquote><p>Jesus didn’t seem to think that he could disciple more than twelve [disciples] in depth, and this might have a bearing on how many a given parent can adequately raise in the fear and nurture of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcb367c1ba" data-kw="">
<blockquote><p>Verse 16. ‘Thine eyes did see my substance yet being unperfect,’ etc.] That is, so soon as ever I was conceived, whilst I was yet an imperfect embryo: and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them; that is, all those members of my body, which in continuance of time grew to have their perfect shape, were as clearly seen by thee, even when as yet there was none of them that had their shape and proportion, as those things are seen by men…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“Verse 16. ‘Thine eyes did see my substance yet being unperfect,’ etc.] That is, so soon as ever I was conceived, whilst I was yet an imperfect embryo: and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them; that is, all those members of my body, which in continuance of time grew to have their perfect shape, were as clearly seen by thee, even when as yet there was none of them that had their shape and proportion, as those things are seen by men…”

— Arthur Jackson, Commentary on Ps. 139">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVerse+16.+%E2%80%98Thine+eyes+did+see+my+substance+yet+being+unperfect%2C%E2%80%99+etc.%5D+That+is%2C+so+soon+as+ever+I+was+conceived%2C+whilst+I+was+yet+an+imperfect+embryo%3A+and+in+thy+book+all+my+members+were+written%2C+which+in+continuance+were+fashioned%2C+when+as+yet+there+was+none+of+them%3B+that+is%2C+all+those+members+of+my+body%2C+which+in+continuance+of+time+grew+to+have+their+perfect+shape%2C+were+as+clearly+seen+by+thee%2C+even+when+as+yet+there+was+none+of+them+that+had+their+shape+and+proportion%2C+as+those+things+are+seen+by+men%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Arthur+Jackson%2C+Commentary+on+Ps.+139&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbcb367c1ba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bcb367c1ba.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Verse%2016.%20%E2%80%98Thine%20eyes%20did%20see,those%20things%20are%20seen%20by%20men&amp;text=Verse%2016.%20%E2%80%98Thine%20eyes%20did%20see%20my%20substance&amp;text=proportion%2C%20as%20those%20things%20are%20seen%20by%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4069efb0be" data-kw="">
<blockquote><p>I might trace a little the time of faith’s first infusion and first operation in the heart, which is undoubtedly at the new birth, when ever it is. But how to prescribe, and when precisely to determine that, in the soul of a believer is more difficult than to state the quickening or animation of an embryo in the womb of her that is with child, or for any naturallist so set the moment of the first separation of night from day at the initiating crepusculum or ascent of the first atom of the morning rays of the sun’s body, or the primogenial fermentation of the vegetative soul in the seed-corn in the earth… It’s much more difficult to set down the first punctual workings of the Spirit in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-lee.html">Samuel Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Joy of Faith</cite>, … (Boston, 1687), pt. 2, ch. 1, section 6, p. 93 Lee, M. A. (d. 1691) was “sometime Fellow of Wadham, Colledge, Oxford”.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“I might trace a little the time of faith’s first infusion and first operation in the heart, which is undoubtedly at the new birth, when ever it is. But how to prescribe, and when precisely to determine that, in the soul of a believer is more difficult than to state the quickening or animation of an embryo in the womb of her that is with child, or for any naturallist so set the moment of the first separation of night from day at the initiating crepusculum or ascent of the first atom of the morning rays of the sun’s body, or the primogenial fermentation of the vegetative soul in the seed-corn in the earth… It’s much more difficult to set down the first punctual workings of the Spirit in our hearts.”

</figure><figure class="quote" id="q-7f7ce76c33" data-kw="">
<blockquote><p>In terms of justifying the word ‘control,’ I want to explain the importance of avoiding passivity. Dominion involves stewardship, study, exploration, managing, planning, rationing, apportioning, starting work, resting from work, categorizing, improving, and using this creation to God’s glory. Man was not to be passive in relationship to his environment, his family, his time, future, or any other aspect of creation. Indeed, to passively allow creation to order itself is the opposite of the dominion mandate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-85123d9e17" data-kw="">
<blockquote><p>…like Voetius–he interprets Zecahriah 12 as implying that the soul is given to a ‘body that is already formed organically.’ Van Mastricht denies a development throughout three kinds of souls [as Aquinas held], ‘first the vegetative, then the sensitive and finally the rational’ soul… It seems that Van Mastricht–like his predecessor in Utrecht [Voet]–thought that the body needs to have reached a certain stage in its development, before it receives a soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Orthodoxy &amp; Philosophy</cite>, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“…like Voetius–he interprets Zecahriah 12 as implying that the soul is given to a ‘body that is already formed organically.’ Van Mastricht denies a development throughout three kinds of souls [as Aquinas held], ‘first the vegetative, then the sensitive and finally the rational’ soul… It seems that Van Mastricht–like his predecessor in Utrecht [Voet]–thought that the body needs to have reached a certain stage in its development, before it receives a soul.”

<blockquote><p>It is the advice of the Psalmist, that we should converse much with ourselves: an advice, indeed, which is regarded by few; for the greatest part of mankind are no where greater strangers than at home. But it is my earnest request to you, that you would be intimately acquainted with yourselves, and, as becomes persons devoted to a studious life, be much at home, much in your own company, and very often engaged in serious conversation with yourselves.

Think gravely, to what purpose do I live? Whither am I going? Ask thyself, hast thou any fixed and determined purpose? any end thou pursuest with steadfastness? The principles I have embraced under the name of the Christian religion, the things I have so often heard about a future state, and life, and death eternal, are they true or false? If they are true, as we all absolutely profess to believe they are, then, to be sure, the greatest and most important matters of this world are vain, and even less than vanity itself: all our knowledge is but ignorance, our riches poverty, our pleasures bitterness, and our honours vile and dishonourable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. I, pp 8-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>

<blockquote><p>M.—Though we should admit the justness of your reasonings upon that ancient example, we are still more closely pressed by a more modern instance in Paul, who commands us to pray for the life of sovereigns, and is far from allowing us to renounce their authority, much less to dethrone, and, when dethroned, to murder them. And what princes does he thus recommend to our prayers? Of all that ever existed the most cruel, Tiberius, Caligula, Claudius, and Nero; for these were co-eval with the epistles of Paul.

B.—In comparing the writings of all the philosophers and lawyers with Paul’s, you seem to me to act rightly, in allowing to his authority so much preponderance in the balance. But you should consider whether you have sufficiently weighed his opinions; for you ought to examine, not only his words, but also at what times, to what persons, and for what purposes, he wrote. First, then, let us see what Paul wrote. In the third chapter of his letter to Titus, he writes, “Put subjects in mind to be obedient to principalities and powers, and to be ready for every good work.” Here you see, I presume, what end he assigns to obedience. In the second chapter of his epistle to Timothy, the same apostle writes, “That we should pray for all men, even for kings and other magistrates, that we may lead a peaceable life, in all godliness and purity.” Here, also, you see that he proposes, as the end of prayer, not the security of kings, but the tranquillity of the church; and, hence, it will be no difficult matter to comprehend his form of prayer.

In his epistle to the Romans, his definition of a king is accurate, even to logical subtlety; for he says that “a king is God’s minister, wielding the sword of the law for the punishment of the bad, and for the support and aid of the good.” “For these passages of Paul’s,” says Chrysostom, “relate not to a tyrant, but to a real and legitimate sovereign, who personates a genuine god upon earth, and to whom resistance is certainly resistance to the ordinance of God.” Yet, though we should pray for bad princes, we ought not, therefore, to infer directly that their vices should not be punished like the crimes of robbers, for whom also we are ordered to pray; nor, if we are bound to obey a good, does it follow that we should not resist a bad prince?

Besides, if you attend to the cause which induced Paul to commit these ideas to writing, you will find, I fear, that this passage is greatly against you; since he wrote them to chastise the temerity of certain persons, who maintained that Christians ought not to be under the control of magistrates. For, since the magistrates were invested with authority on purpose to restrain wicked men, to enable us all to live under equal laws, and to exhibit a living example of divine justice, they contended that he was of no use among persons so uncontaminated by the contagion of vice as to be a law to themselves. Paul, therefore, does not here treat of the magistrate, but of the magistracy—that is, of the function and duty of the person who presides over others, nor of this nor of that species of magistracy, but of every possible form of government.

Nor does he contend against those who maintained that bad magistrates ought not to be punished, but against persons who renounced every kind of authority; who, by an absurd interpretation of Christian liberty, affirmed that it was an indignity to men emancipated by the Son of God, and directed by God’s Spirit, to be controlled by any human power. To refute this erroneous opinion, Paul shows that magistracy is not only a good, but a sacred and divine ordinance, and instituted expressly for connecting assemblages and communities of men, and to enable them, conjointly, to acknowledge God’s blessings, and to abstain from mutual injuries.

Persons raised to the rank of magistrates God has ordered to be the conservators of his laws; and, therefore, if we acknowledge laws to be, as they certainly are, good things, we must also acknowledge that their conservators are entitled to honour, and that their office is a good and useful institution. But the magistrate is terrible. To whom, I beseech you? To the good, or to the bad? To the good he cannot be a terror, as he secures them from injury; but, if he is a terror to the bad, it is nothing to you, who are directed by the Spirit of God. What occasion, then, is there, you will say, for subjecting me to the magistrate, since I am God’s freeman? Much. To prove yourself God’s freeman, obey his laws; for the Spirit of God, of whose direction you boast, framed the laws, approves of magistracy and authorises obedience to the magistrate.

On this head, therefore, we shall easily come to an agreement, that a magistrate is necessary in the best-constituted societies, and that he ought to be treated with every kind of respect. Hence, if any person entertains contrary sentiments, we deem him insane, intestable, and worthy of the severest punishment; since he openly resists God’s will communicated to us in the Scriptures. For, supposing that no punishment for the violation of all laws, human and divine, should be inflicted on a Caligula, a Nero, a Domitian, and other tyrants of that sort, you have here no countenance from Paul, who is discoursing of the power of magistrates and of bad men by whom it is badly exercised. Indeed, if you examine that kind of tyrants by Paul’s rule, they will not at all be magistrates.

Again, if you should contend that even bad princes are ordained by God, take care lest your language should be charged with captiousness. For God, to counteract poison by poison, as an antidote, sometimes sets a bad man over bad men for their punishment; and yet, that God is the author of human wickedness, no man in his senses will dare to affirm, as none can be ignorant that the same God is the author of the punishments inflicted on the wicked. Even a good magistrate generally chooses a bad man to be the executioner in punishing the guilty. This executioner, though thus appointed by the magistrate to that office, is not, in consequence, indulged with impunity for every crime, nor raised so high as not to be amenable to the laws.

On this comparison I shall dwell no longer, lest the sycophants of the court should cry out that I speak with too little reverence of the supreme magistrate. But, let their outcries be ever so loud, certainly they will never be able to deny that the function of the executioner is a part of public, and perhaps also of kingly duty, even by the confession of kings themselves; since, when violence is offered to any public minister, they complain that their own person and majesty are violated. Now, if any thing can, certainly the punishment of the wicked must constitute a part of the king’s executive duty.

In what predicament stand the governors of cities, the commandants of camps, the mayors of corporations, and other superior officers? Does Paul order us to be obedient also to them? or does he hold them private persons? But not only all inferior magistrates, but even those who are upon an equality with kings, it is customary to call to an account for mal-administration. I could wish, therefore, that those who dream of this mighty power conferred on kings by Paul’s words would either show, from the same Paul, that kings alone are to be understood in the name powers, and, therefore, to be alone exempted from legal animadversion; or, if the word powers mean also other magistrates appointed by the authority of the same God for the same purpose, that they would also show where all magistrates are pronounced to be independent of law, and released from the fear of punishment; or, where that immunity has been granted only to kings, and denied to others invested with public authority.

M.—But to the higher powers he commands all to be obedient.

B.—He does so; but under the name of powers he must necessarily comprehend other magistrates also, unless you should, perhaps, imagine that he thought states not under a regal government to be without powers, and therefore mere anarchies. … Paul does not, in the least, refer to tyrants; as they accommodate the whole plan of their government, not to the utility of the people, but to the gratification of their own lusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-buchanan.html">George Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland</cite>, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 55-57, 58-59.</span></figcaption>

Nor does he contend against those who maintained that bad magistrates ought not to be punished, but against persons who renounced every kind of authority; who, by an absurd interpretation of Christian liberty, affirmed that it was an indignity to men emancipated by the Son of God, and directed by God’s Spirit, to be controlled by any human power. To refute this erroneous opinion, Paul shows that magistracy is not only a good, but a sacred and divine ordinance, and instituted expressly for connecting assemblages and communities of men, and to enable them, conjointly, to acknowledge God’s blessings, and to abstain from mutual injuries.

Persons raised to the rank of magistrates God has ordered to be the conservators of his laws; and, therefore, if we acknowledge laws to be, as they certainly are, good things, we must also acknowledge that their conservators are entitled to honour, and that their office is a good and useful institution. But the magistrate is terrible. To whom, I beseech you? To the good, or to the bad? To the good he cannot be a terror, as he secures them from injury; but, if he is a terror to the bad, it is nothing to you, who are directed by the Spirit of God. What occasion, then, is there, you will say, for subjecting me to the magistrate, since I am God’s freeman? Much. To prove yourself God’s freeman, obey his laws; for the Spirit of God, of whose direction you boast, framed the laws, approves of magistracy and authorises obedience to the magistrate.

On this head, therefore, we shall easily come to an agreement, that a magistrate is necessary in the best-constituted societies, and that he ought to be treated with every kind of respect. Hence, if any person entertains contrary sentiments, we deem him insane, intestable, and worthy of the severest punishment; since he openly resists God’s will communicated to us in the Scriptures. For, supposing that no punishment for the violation of all laws, human and divine, should be inflicted on a Caligula, a Nero, a Domitian, and other tyrants of that sort, you have here no countenance from Paul, who is discoursing of the power of magistrates and of bad men by whom it is badly exercised. Indeed, if you examine that kind of tyrants by Paul’s rule, they will not at all be magistrates.

Again, if you should contend that even bad princes are ordained by God, take care lest your language should be charged with captiousness. For God, to counteract poison by poison, as an antidote, sometimes sets a bad man over bad men for their punishment; and yet, that God is the author of human wickedness, no man in his senses will dare to affirm, as none can be ignorant that the same God is the author of the punishments inflicted on the wicked. Even a good magistrate generally chooses a bad man to be the executioner in punishing the guilty. This executioner, though thus appointed by the magistrate to that office, is not, in consequence, indulged with impunity for every crime, nor raised so high as not to be amenable to the laws.

On this comparison I shall dwell no longer, lest the sycophants of the court should cry out that I speak with too little reverence of the supreme magistrate. But, let their outcries be ever so loud, certainly they will never be able to deny that the function of the executioner is a part of public, and perhaps also of kingly duty, even by the confession of kings themselves; since, when violence is offered to any public minister, they complain that their own person and majesty are violated. Now, if any thing can, certainly the punishment of the wicked must constitute a part of the king’s executive duty.

In what predicament stand the governors of cities, the commandants of camps, the mayors of corporations, and other superior officers? Does Paul order us to be obedient also to them? or does he hold them private persons? But not only all inferior magistrates, but even those who are upon an equality with kings, it is customary to call to an account for mal-administration. I could wish, therefore, that those who dream of this mighty power conferred on kings by Paul’s words would either show, from the same Paul, that kings alone are to be understood in the name powers, and, therefore, to be alone exempted from legal animadversion; or, if the word powers mean also other magistrates appointed by the authority of the same God for the same purpose, that they would also show where all magistrates are pronounced to be independent of law, and released from the fear of punishment; or, where that immunity has been granted only to kings, and denied to others invested with public authority.

M.—But to the higher powers he commands all to be obedient.

B.—He does so; but under the name of powers he must necessarily comprehend other magistrates also, unless you should, perhaps, imagine that he thought states not under a regal government to be without powers, and therefore mere anarchies. … Paul does not, in the least, refer to tyrants; as they accommodate the whole plan of their government, not to the utility of the people, but to the gratification of their own lusts.”

— George Buchanan, De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 55-57, 58-59.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CM.%E2%80%94Though+we+should+admit+the+justness+of+your+reasonings+upon+that+ancient+example%2C+we+are+still+more+closely+pressed+by+a+more+modern+instance+in+Paul%2C+who+commands+us+to+pray+for+the+life+of+sovereigns%2C+and+is+far+from+allowing+us+to+renounce+their+authority%2C+much+less+to+dethrone%2C+and%2C+when+dethroned%2C+to+murder+them.+And+what+princes+does+he+thus+recommend+to+our+prayers%3F+Of+all+that+ever+existed+the+most+cruel%2C+Tiberius%2C+Caligula%2C+Claudius%2C+and+Nero%3B+for+these+were+co-eval+with+the+epistles+of+Paul.%0A%0AB.%E2%80%94In+comparing+the+writings+of+all+the+philosophers+and+lawyers+with+Paul%E2%80%99s%2C+you+seem+to+me+to+act+rightly%2C+in+allowing+to+his+authority+so+much+preponderance+in+the+balance.+But+you+should+consider+whether+you+have+sufficiently+weighed+his+opinions%3B+for+you+ought+to+examine%2C+not+only+his+words%2C+but+also+at+what+times%2C+to+what+persons%2C+and+for+what+purposes%2C+he+wrote.+First%2C+then%2C+let+us+see+what+Paul+wrote.+In+the+third+chapter+of+his+letter+to+Titus%2C+he+writes%2C+%E2%80%9CPut+subjects+in+mind+to+be+obedient+to+principalities+and+powers%2C+and+to+be+ready+for+every+good+work.%E2%80%9D+Here+you+see%2C+I+presume%2C+what+end+he+assigns+to+obedience.+In+the+second+chapter+of+his+epistle+to+Timothy%2C+the+same+apostle+writes%2C+%E2%80%9CThat+we+should+pray+for+all+men%2C+even+for+kings+and+other+magistrates%2C+that+we+may+lead+a+peaceable+life%2C+in+all+godliness+and+purity.%E2%80%9D+Here%2C+also%2C+you+see+that+he+proposes%2C+as+the+end+of+prayer%2C+not+the+security+of+kings%2C+but+the+tranquillity+of+the+church%3B+and%2C+hence%2C+it+will+be+no+difficult+matter+to+comprehend+his+form+of+prayer.%0A%0AIn+his+epistle+to+the+Romans%2C+his+definition+of+a+king+is+accurate%2C+even+to+logical+subtlety%3B+for+he+says+that+%E2%80%9Ca+king+is+God%E2%80%99s+minister%2C+wielding+the+sword+of+the+law+for+the+punishment+of+the+bad%2C+and+for+the+support+and+aid+of+the+good.%E2%80%9D+%E2%80%9CFor+these+passages+of+Paul%E2%80%99s%2C%E2%80%9D+says+Chrysostom%2C+%E2%80%9Crelate+not+to+a+tyrant%2C+but+to+a+real+and+legitimate+sovereign%2C+who+personates+a+genuine+god+upon+earth%2C+and+to+whom+resistance+is+certainly+resistance+to+the+ordinance+of+God.%E2%80%9D+Yet%2C+though+we+should+pray+for+bad+princes%2C+we+ought+not%2C+therefore%2C+to+infer+directly+that+their+vices+should+not+be+punished+like+the+crimes+of+robbers%2C+for+whom+also+we+are+ordered+to+pray%3B+nor%2C+if+we+are+bound+to+obey+a+good%2C+does+it+follow+that+we+should+not+resist+a+bad+prince%3F%0A%0ABesides%2C+if+you+attend+to+the+cause+which+induced+Paul+to+commit+these+ideas+to+writing%2C+you+will+find%2C+I+fear%2C+that+this+passage+is+greatly+against+you%3B+since+he+wrote+them+to+chastise+the+temerity+of+certain+persons%2C+who+maintained+that+Christians+ought+not+to+be+under+the+control+of+magistrates.+For%2C+since+the+magistrates+were+invested+with+authority+on+purpose+to+restrain+wicked+men%2C+to+enable+us+all+to+live+under+equal+laws%2C+and+to+exhibit+a+living+example+of+divine+justice%2C+they+contended+that+he+was+of+no+use+among+persons+so+uncontaminated+by+the+contagion+of+vice+as+to+be+a+law+to+themselves.+Paul%2C+therefore%2C+does+not+here+treat+of+the+magistrate%2C+but+of+the+magistracy%E2%80%94that+is%2C+of+the+function+and+duty+of+the+person+who+presides+over+others%2C+nor+of+this+nor+of+that+species+of+magistracy%2C+but+of+every+possible+form+of+government.%0A%0ANor+does+he+contend+against+those+who+maintained+that+bad+magistrates+ought+not+to+be+punished%2C+but+against+persons+who+renounced+every+kind+of+authority%3B+who%2C+by+an+absurd+interpretation+of+Christian+liberty%2C+affirmed+that+it+was+an+indignity+to+men+emancipated+by+the+Son+of+God%2C+and+directed+by+God%E2%80%99s+Spirit%2C+to+be+controlled+by+any+human+power.+To+refute+this+erroneous+opinion%2C+Paul+shows+that+magistracy+is+not+only+a+good%2C+but+a+sacred+and+divine+ordinance%2C+and+instituted+expressly+for+connecting+assemblages+and+communities+of+men%2C+and+to+enable+them%2C+conjointly%2C+to+acknowledge+God%E2%80%99s+blessings%2C+and+to+abstain+from+mutual+injuries.%0A%0APersons+raised+to+the+rank+of+magistrates+God+has+ordered+to+be+the+conservators+of+his+laws%3B+and%2C+therefore%2C+if+we+acknowledge+laws+to+be%2C+as+they+certainly+are%2C+good+things%2C+we+must+also+acknowledge+that+their+conservators+are+entitled+to+honour%2C+and+that+their+office+is+a+good+and+useful+institution.+But+the+magistrate+is+terrible.+To+whom%2C+I+beseech+you%3F+To+the+good%2C+or+to+the+bad%3F+To+the+good+he+cannot+be+a+terror%2C+as+he+secures+them+from+injury%3B+but%2C+if+he+is+a+terror+to+the+bad%2C+it+is+nothing+to+you%2C+who+are+directed+by+the+Spirit+of+God.+What+occasion%2C+then%2C+is+there%2C+you+will+say%2C+for+subjecting+me+to+the+magistrate%2C+since+I+am+God%E2%80%99s+freeman%3F+Much.+To+prove+yourself+God%E2%80%99s+freeman%2C+obey+his+laws%3B+for+the+Spirit+of+God%2C+of+whose+direction+you+boast%2C+framed+the+laws%2C+approves+of+magistracy+and+authorises+obedience+to+the+magistrate.%0A%0AOn+this+head%2C+therefore%2C+we+shall+easily+come+to+an+agreement%2C+that+a+magistrate+is+necessary+in+the+best-constituted+societies%2C+and+that+he+ought+to+be+treated+with+every+kind+of+respect.+Hence%2C+if+any+person+entertains+contrary+sentiments%2C+we+deem+him+insane%2C+intestable%2C+and+worthy+of+the+severest+punishment%3B+since+he+openly+resists+God%E2%80%99s+will+communicated+to+us+in+the+Scriptures.+For%2C+supposing+that+no+punishment+for+the+violation+of+all+laws%2C+human+and+divine%2C+should+be+inflicted+on+a+Caligula%2C+a+Nero%2C+a+Domitian%2C+and+other+tyrants+of+that+sort%2C+you+have+here+no+countenance+from+Paul%2C+who+is+discoursing+of+the+power+of+magistrates+and+of+bad+men+by+whom+it+is+badly+exercised.+Indeed%2C+if+you+examine+that+kind+of+tyrants+by+Paul%E2%80%99s+rule%2C+they+will+not+at+all+be+magistrates.%0A%0AAgain%2C+if+you+should+contend+that+even+bad+princes+are+ordained+by+God%2C+take+care+lest+your+language+should+be+charged+with+captiousness.+For+God%2C+to+counteract+poison+by+poison%2C+as+an+antidote%2C+sometimes+sets+a+bad+man+over+bad+men+for+their+punishment%3B+and+yet%2C+that+God+is+the+author+of+human+wickedness%2C+no+man+in+his+senses+will+dare+to+affirm%2C+as+none+can+be+ignorant+that+the+same+God+is+the+author+of+the+punishments+inflicted+on+the+wicked.+Even+a+good+magistrate+generally+chooses+a+bad+man+to+be+the+executioner+in+punishing+the+guilty.+This+executioner%2C+though+thus+appointed+by+the+magistrate+to+that+office%2C+is+not%2C+in+consequence%2C+indulged+with+impunity+for+every+crime%2C+nor+raised+so+high+as+not+to+be+amenable+to+the+laws.%0A%0AOn+this+comparison+I+shall+dwell+no+longer%2C+lest+the+sycophants+of+the+court+should+cry+out+that+I+speak+with+too+little+reverence+of+the+supreme+magistrate.+But%2C+let+their+outcries+be+ever+so+loud%2C+certainly+they+will+never+be+able+to+deny+that+the+function+of+the+executioner+is+a+part+of+public%2C+and+perhaps+also+of+kingly+duty%2C+even+by+the+confession+of+kings+themselves%3B+since%2C+when+violence+is+offered+to+any+public+minister%2C+they+complain+that+their+own+person+and+majesty+are+violated.+Now%2C+if+any+thing+can%2C+certainly+the+punishment+of+the+wicked+must+constitute+a+part+of+the+king%E2%80%99s+executive+duty.%0A%0AIn+what+predicament+stand+the+governors+of+cities%2C+the+commandants+of+camps%2C+the+mayors+of+corporations%2C+and+other+superior+officers%3F+Does+Paul+order+us+to+be+obedient+also+to+them%3F+or+does+he+hold+them+private+persons%3F+But+not+only+all+inferior+magistrates%2C+but+even+those+who+are+upon+an+equality+with+kings%2C+it+is+customary+to+call+to+an+account+for+mal-administration.+I+could+wish%2C+therefore%2C+that+those+who+dream+of+this+mighty+power+conferred+on+kings+by+Paul%E2%80%99s+words+would+either+show%2C+from+the+same+Paul%2C+that+kings+alone+are+to+be+understood+in+the+name+powers%2C+and%2C+therefore%2C+to+be+alone+exempted+from+legal+animadversion%3B+or%2C+if+the+word+powers+mean+also+other+magistrates+appointed+by+the+authority+of+the+same+God+for+the+same+purpose%2C+that+they+would+also+show+where+all+magistrates+are+pronounced+to+be+independent+of+law%2C+and+released+from+the+fear+of+punishment%3B+or%2C+where+that+immunity+has+been+granted+only+to+kings%2C+and+denied+to+others+invested+with+public+authority.%0A%0AM.%E2%80%94But+to+the+higher+powers+he+commands+all+to+be+obedient.%0A%0AB.%E2%80%94He+does+so%3B+but+under+the+name+of+powers+he+must+necessarily+comprehend+other+magistrates+also%2C+unless+you+should%2C+perhaps%2C+imagine+that+he+thought+states+not+under+a+regal+government+to+be+without+powers%2C+and+therefore+mere+anarchies.+%E2%80%A6+Paul+does+not%2C+in+the+least%2C+refer+to+tyrants%3B+as+they+accommodate+the+whole+plan+of+their+government%2C+not+to+the+utility+of+the+people%2C+but+to+the+gratification+of+their+own+lusts.%E2%80%9D%0A%0A%E2%80%94+George+Buchanan%2C+De+Jure+Regni+Apud+Scotos%3B+A+Dialogue+Concerning+the+Rights+of+the+Crown+in+Scotland%2C+trans.+Robert+MacFarlan+%281579%3B+Colorado+Springs%3A+Portage+Publications%2C+2016%29%2C+pp+55-57%2C+58-59.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fffafdcbf39.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ffafdcbf39.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/28/george-buchanan-does-paul-endorse-tyranny/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-94a10c0bd4" data-kw="">
<blockquote><p>Objection 9 [of a congregationalist to presbyterianism]: ‘From the church here spoken of [in Mt. 18] there is no appeal because the sentence is ratified in heaven. It inflicts the highest punishment: the censure of excommunication; and a higher judicature can do no more. There is no reason to appeal to a higher judicature because the inferior may err, because all above a congregation are courts which may err also. For presbyteries, provincial councils, national, and the universal council of the catholic Church may err.’ So Mr. Mather (Richard Mather &amp; William Tompson, Answer to Mr. Herle, ch. 2, pp. 13-14). [Rutherford’s] Answer [1.]: Because the sentence is ratified in heaven is no reason why we may not appeal from a congregation. The sentence of an inferior judge proceeding rightly is ratified in heaven, yet we may appeal from him. To appeal is but upon fears of ill administration; to desert a lower court and go to a higher court. So when we fear that a counsel and advice given by a sister church is not according to the Word of God, which yet is according to the Word of God, upon the supposal of that fear we decline that council and take another. Neither are we to appeal de jure, ‘from a just sentence,’ in a presbytery. Illud possumus quod jure possumus [‘What we can do, is that which we can do by law’]. What the inferior Sanhedrin of Israel did justly was ratified in heaven. Yet by God’s Law there might be an appeal from it to the highest Sanhedrin. 2. Nor is this a good reason: that we may not appeal from a judicature which may inflict the highest censure. For inferior judicatures in Israel had power of life and death, yet might man appeal from them. 3. The cause of appeals is not because inferior judicatures may err: for so we might appeal from all judicatures, even from a general council, for it may err. But the true grounding [of appeals] is: 1. Because rarius errant, they [higher councils] ‘do not so frequently err’. 2. They are not so inclined and disposed to err, ‘for many eyes see more than one,’ and many eyes do more seldom miscarry in not taking up the right object than one. 3. Because we conceive more equality and less partiality in higher courts.</p></blockquote>

<blockquote><p>…Pilate uses all means to get Jesus loose; he uses the present occasion to that purpose; knowing the use [custom] of the Jews, he would have been glad to have had Jesus set at liberty, above all the prisoners. To speak somewhat of this custom: They had this custom, to get a prisoner set at liberty at festival times, to the honor of their feasts… but therewith they dishonored God. Is that to honor God, to break his commandment?… We know this, there is nothing wherein a prince resembles God more than in clemency; but it is a sin to let a wicked man escape, or that the emperor should let him go; for God’s law says, Dt. 19:11-13, “Thine eye shall not spare the murderer, neither look upon him with a pitiful eye.”… Some will say, has not a free prince license to give him his life, albeit the law of God says, “The murderer shall die the death?”… It is true, indeed, a prince should be loath to put out that life that God has put in, and should beware to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince has no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate [lesson] the punishment, but to say he may let the man go free, he has no power. But they will insist further, and say, Is not this on the the judicial laws that was given to the Jews–then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them–they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know that natural men, ethnics, who had never the law of the Jews, they executed the murderer. But yet they insist, and they will bring in the example of good kings, who forgave capital crimes committed against the very universal and natural law; and namely of David. Forgave he not Joab for slaying of Abner and Amasah? and Amnon, for committing incest? and again, forgave he not Absalom for slaying of Amnon, his brother? But I answer: We are bound to live by God’s laws, and not by examples… Indeed, there is a difference between these crimes that are capital, and the crimes that in their own nature are not capital, but by the laws of princes are made capital; for upon just considerations, the prince has power to dispense with them: as, for example, it was not deadly of the own nature to Shimei to go out of the ports of Jerusalem, but because Solomon forbade it, it became deadly. Like as it is in the hands of princes to make and to change such special laws; so it lies in his hands to forgive such a man transgressing them, upon weighty and great considerations. So, to return, these crimes that are capital by natural law, a prince has no power to remit them, albeith he were ruler of all the world; he derogates to God’s glory. And secondly, if there were no more to let us see that God has not given that power to forgive capital crimes against God’s law and nature, the judgments of God which ceased on such men and their posterity were sufficient to show it…</p></blockquote>

<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.”

</figure><figure class="quote" id="q-527bdcec69" data-kw="">
<blockquote><p>Lastly, as ’tis the greatest sin, so it makes men obnoxious to the saddest judgements of God, and severest punishments of the magistrate, when a man shall directly and purposely speak reproachfully of God, denying him in his attributes, or attributing that to Him which is inconsistent with his nature; this is called direct and immediate blasphemy, and if it be acted not out of infirmity of nature, the person not being distempered with sickness, melancholy, or madness; but out of malice, deliberation, and obstinacy; then the party is to die without mercy (Lev. 24:13-16). This was no judicial Law, peculiar only to the Jews, but it being of the Law of Nature, is an Universal Law for all Nations. He, whoever he be that shall directly and obstinately blaspheme the Name of the Lord; shall surely die. Hence wicked Jesabel, that she might stone Naboth to death, proclaims him a blasphemer (1 Kings 21:11, 14). This stoning endured till Christ’s time, as appears by their stoning of Steven (Acts 7). Now if every direct and obstinate blasphemers should be stoned to death in England, what showers of stones would there be in all parts of the land? And if Nebuchadnezzar, a heathen, by the light of Nature could make a decree, that who ever blasphemed the God of Heaven, or spake any thing amiss concerning Him, should be cut in pieces, and his house be made a Dung-hill (Dan. 3:29), how much more ought Christian Magistrates to make severe laws for the punishing of such high offenders; lest as their light and charge is greater, so they suffer double punishment. We see how careful magistrates are to punish thieves and murderers of men; and shall spiritual thieves, who rob God of his honor, deny his being, and since they cannot kill Him yet will smite Him with their tongue, be suffered to go unpunished? We see how tender great men are of their own names, honors, privileges, and lives; if any oppose them, he must die for it, and shall he that abuses and blasphemes the King of Kings, not die the death? Surely, as this is the greatest sin, so it should be punished with some eminent and remarkable punishment. This hellish sin defiles the land, and cannot be purged away, but by the death of the blasphemers. Impunity breeds blasphemy, and all manner of sin (Eccl. 8:11).</p></blockquote>

<blockquote><p>V. The creation of the world adds nothing to the perfection of God, nor did he make it that some good might result for his benefit, but rather so that he might communicate his goodness to creatures.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e9f4985e54" data-kw="">
<blockquote><p>(1) Before the Westminster Assembly there were a variety of interpretations of Genesis 1 and its days. If the text of Genesis is so clear-cut why did the church down the centuries not see it that way? Does that not say something not only about the interpreters but also the text? Claims that a literal reading of the days of Genesis 1 is obvious fall down when the history of interpretation is taken into consideration. (2) We will be wise to heed the warnings Augustine and Calvin give on the difficulty of interpreting this chapter, and so beware of dogmatic claims they themselves did not advance. Jerome pointed to the Jewish rabbis’ refusal to let anyone under thirty interpret it. Creation transcends our knowledge and experience. A heavy dose of medicine from Job 38:1ff is in order. As with any other passage, Genesis 1 must not be interpreted in isolation but in the context of the whole of Scripture. (3) Until the mid-sixteenth century the interpreters we cited were all abreast of the philosophy and science of their day, and often made use of it in biblical interpretation. That we reject many of their scientific beliefs is because of our own scientific knowledge. That we place implicit faith in the laws of gravity is due to what we know scientifically, rather than from the Bible. So far I, for one, have found this reliable! Calvin allows and supports scientific work. He indicates Genesis is of a different literary genre than a science text book. (4) The Reformed tradition of the sixteenth century interpreted creation theologically. The classic Reformed creeds consider it in the context of the doctrine of God, as an ex nihilo work of the Trinity. In so doing, they affirm their continuity with the historic teaching of the church. The question of the days of creation was not even a matter of discussion… Its absence is striking. It was never a matter of confessional significance…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“‘In the Space of Six Days’: the Days Of Creation From Origen to the Westminster Assembly’ in Westminster Theological Journal 61:2 (Fall, 1999), pp. 149-74 | Summary Conclusions:</cite>, p. 174</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-f522974a21" data-kw="">
<blockquote><p>Creatures considered through individual species are usually divided among physicists either according to the species of natural body, which is simple and mixed, etc. or according to the parts of the world, which are containers and contents, celestial and elemental, etc. We, presently omitting those things, will follow the division by the works of the six days’ creation frequented by all theologians and chronologers; and we will explain some things about the system of the world from Mosaic physics in the manner and method of theologians. For to want to call that into doubt, and to reduce it to absurdity belongs to those who, being unwise, refuse to submit their wisdom to the most Holy Spirit, and pave the way for themselves and others to Libertinism or atheism: while the system of the world described by Moses to them does not seem dissimilar to the fables and absurdities of Muhammad about the earth being founded on the horn of an ox (in the book Sunna), about the sun when it sets, immersing itself in a bubbling spring of water (Quran, chapter on the Cave). Objections and exceptions against the sacred Mosaic physics which are usually brought forward are not so subtle that they cannot be resolved. As among others Francis Junius shows against the 22 arguments of Simplicius, and of today’s antinomians, at the end of the explanation of the first three chapters of Genesis: with whom Scipio Claromontius, On the Universe, should be compared, and other philosophers to be cited below, who do not allow anti-Mosaic systems of the moderns to be foisted upon them…. …Heaven and the angels were created on the First Day. The reasons are: … 2. Because nowhere in the Hexaemeron is mention made of the creation of that heaven and the angels: but God completed in six days all things that were created, Gen. 2:1, and that heaven is among things created, Heb. 11:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2 Latin | On Creation, pt. 3</cite>, p. 137</span></figcaption>

</figure><figure class="quote" id="q-1fa55170b9" data-kw="">
<blockquote><p>Conservation, as it is here understood, is defined as the action by which a being from-another remains in the existence it has received. It is double, namely: a) Negative, or the action by which what can destroy the existence of the thing is removed or impeded. Penicillin, for example, which destroys bacteria, conserves the health of the body; b) Positive is the act that consists in the positive inflow by which a thing is continually given existence. Hence it is a sort of continued creation. Conclusion 24: All created things are positively conserved in existence by God. Whatever does not have in itself a reason for its existence positively requires, if it remains in existence, a cause of its remaining in existence. But there cannot be an infinite regress in conserving causes, because such causes need to exist simultaneously; therefore the thing is conserved positively by God as first cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>‘United to God’ is an ambiguous word: no creature is united to Him perfectly so as to be thereby what He is, God, in the created nature. Only Christ is united to Him hypostatically in his created nature. All are so far united to Him in natural being as that in Him they live and move and have their being: and the Nature of man is one sort of his image: All things are united to Him as effects to their constant efficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation... (London: 1684), pt. 1, ch. 1</cite>, p. 1</span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘United to God’ is an ambiguous word: no creature is united to Him perfectly so as to be thereby what He is, God, in the created nature. Only Christ is united to Him hypostatically in his created nature. All are so far united to Him in natural being as that in Him they live and move and have their being: and the Nature of man is one sort of his image: All things are united to Him as effects to their constant efficient.”

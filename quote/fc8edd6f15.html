<main class="wrap"><figure class="quote" id="q-fc8edd6f15" data-kw="">
<blockquote><p>The Ale-house must be your Chappell, Kitchen, Workhouse: the first draught is your prayer, the next your breakfast, and the last your work. Yet if ye had but a Priest that would prophecy of Wine and strong drink, and say, Come let us fill our selves with Wine and strong drink, tomorrow shall be as this day, and much more abundant, he were the only man, and you the only people of the world I know you think yourselves very familiar with Christ, as if he would pass by these slips of youth, and embrace you in the arms of his mercy upon the least call.

But you forget that Christ hath now taken state upon him. He was an Infant crying in the Cratch, and then he was circumcised by wicked Priests, carried by an Ass into Jerusalem, He was a Preacher in Israel, and then he was pressed upon by all, and sought to be entangled by his enemies. He was a worker of miracles here, and then sick souls and bodies troubled him He was under arrests and executions and then Judas did kiss, Soldiers buffeted and spit upon him, and Jews and Gentiles killed him. But now the case is altered, his present state admits no such near approach.

Will you say he is my sweet Saviour still? Go then and tell him so: say; Lord, I am idle, unprofitable, and luxurious, but thou art my sweet Saviour still. Say ye to your fathers and mothers, I am drunken, idle, wanton, rebellious, but ye are my father and mother still, and I expect your blessing, and your purse. Surely such proud and dissolute carriage shall a thousand times sooner please men on earth, than it shall please Christ in heaven.

He hath redeemed you that ye might serve him in righteousness and holiness all the days of your life. He hath bought you with a price, that ye might glorify God in body and soul, and (by the grace of God) save your selves from the midst of this wicked generation wherein ye live. Perhaps you may think your sins not to be so great, but that you may keep your fellowship in the salvation of Christ too. But they are not worthy of pity who wilfully deceive their own souls …</p></blockquote>

</figure><figure class="quote" id="q-f6cc9078bc" data-kw="">
<blockquote><p>That Prohibition of Resistance cannot be meant here, which is wholly contrary to the Apostle’s reasons following, which persuade to Subjection and not Resistance. Or that Assertion, or Interpretation, is not according to the Apostle’s scope, which is formally opposite to his Arguments afterward.

But such is the Doctor’s Interpretation and Assertion, Ergo, His Assertion and Interpretation is, that Subjects may not resist a Prince, who is bent to subvert Religion, Laws and Liberties.

The Apostles Reasons against Resisters are.

1. For Rulers are not a terror to good works, but to evil.

Now is this a reason why I may not resist such a Tyrant?

Who can be more a terror to good works, and not to evil then he that is bent to subvert Religion, Laws and Liberties? Ergo of such a Resistance of a tyrant the Apostle speaks not. But of Resistance of that Ruler, who goes altogether according to Laws and Liberties, which is justly punishable with Damnation without Gainsaying.

2. A second Reason or enforcement of the Apostles argument against Resistance is, Wilt thou then not be afraid of the power. Do that which is good and thou shalt have praise of the same. Now doth this argue a Tyrant is not to be resisted? Is there no cause of fear of him (while a man does that which is good) that is bent to subvert Religion, Laws and Liberties? Or shall a man have praise in doing good, of such a Tyrant.

Therefore is not a Tyrant that power which may not be resisted. But he that stands to the Lawes, and Rules according to them, Damnation is just against those that resist him without question.

3. Thirdly, The Apostle proceeds, vers. 4. For he is the Minister of God to thee for good (and so not to be resisted without resisting the Ordinance of God, and so incurring damnation) But is this true of a Tyrant bent to subvert Religion, Laws, and Liberties? Is he the Minister of God to thee for good? Or the Minister of his own lusts rather, for evil? Resistance of such an one then, is not the Resistance the Apostle forbids, but of one who is the conservator of Religion, for he, and he only is the Minister of God to thee for good, and worthy is he of Damnation that resists such an one.

4. The Apostle adds, If thou do that which is evil fear, for he beareth not the Sword in vain: For he is the Minister of God, a Revenger to execute wrath upon him that doth evil.

Is this man a Tyrant, bent to subvert Religion, Laws and Liberties, or most directly opposite to Tyranny.

A Tyrant secures those that do evil (so they will join with him and serve him in his Tyranny) from fear. And he bears the Sword, not only in vain, in reference to any good end intended by Gods ordinance, but altogether contrary to it; and is so far from being the Minister of God, that he is (as before) a Minister of his own lusts, to shelter those that doe evil, and to pursue with all wrath, and revenge him that doth good, and will not be a slave to his laws designs and desires. Still then of such a Tyrant S. Paul argues, not that he may not be resisted: but him that he describes, which is a just Governor, and so upon no terms to be resisted.

5. Upon all this the Apostle resumes: Wherefore you must of necessity be subject, not only for wrath, but also for Conscience sake.

What rules of conscience (before laid, inferred now by the word, wherefore) urge such an Asinine or stupid subject, as to be subject even passively, and not to resist one that is bent to subvert Religion, Laws and Liberties, when all that went before speak expressly of another power and Rulers of another temper?

A man then for fear of wrath, not being able to make good his Resistance, may yield such passive subjection, but sure conscience (at least not in this place) urges him not to it.

6. Yet the Apostle goes-on: For this cause also pay you Tribute, for they are God’s Ministers continually attending on this very thing.

For what cause? Because they may attempt to subvert Religion, Laws and Liberties? Do we pay Tribute for this cause, that they plunder and change Laws, &amp;c. Or that they may defend them? Also upon what thing are they thus God’s Ministers to attend continually? Is it to subvert Laws, &amp;c. Or to preserve them? The Apostle then speaks not of a Tyrant, but a just ruling Prince, and pity but he should be damned that resists him.

7. Finally, he concludes this matter with saying, Render to all their due. By what Law of God or man may a Tyrant subvert Religion, Laws and Liberties, or even be let alone in so doing.

I am sure the Apostle hath not expressed any such thing hitherto. It is Ergo, but the Doctor’s mistake, though I confess it hath been many wise and good men’s before him, that the Apostle forbids resisting such a Tyrant, which as I said above, all his Reasons go rather quite contrary unto, as describing the Power and Ruler that is to be subjected to, and not resisted, altogether cross to Tyranny, and his Interpretation and Assertion is altogether cross to the Apostle’s.</p></blockquote>

4. The Apostle adds, If thou do that which is evil fear, for he beareth not the Sword in vain: For he is the Minister of God, a Revenger to execute wrath upon him that doth evil.

Is this man a Tyrant, bent to subvert Religion, Laws and Liberties, or most directly opposite to Tyranny.

A Tyrant secures those that do evil (so they will join with him and serve him in his Tyranny) from fear. And he bears the Sword, not only in vain, in reference to any good end intended by Gods ordinance, but altogether contrary to it; and is so far from being the Minister of God, that he is (as before) a Minister of his own lusts, to shelter those that doe evil, and to pursue with all wrath, and revenge him that doth good, and will not be a slave to his laws designs and desires. Still then of such a Tyrant S. Paul argues, not that he may not be resisted: but him that he describes, which is a just Governor, and so upon no terms to be resisted.

5. Upon all this the Apostle resumes: Wherefore you must of necessity be subject, not only for wrath, but also for Conscience sake.

What rules of conscience (before laid, inferred now by the word, wherefore) urge such an Asinine or stupid subject, as to be subject even passively, and not to resist one that is bent to subvert Religion, Laws and Liberties, when all that went before speak expressly of another power and Rulers of another temper?

A man then for fear of wrath, not being able to make good his Resistance, may yield such passive subjection, but sure conscience (at least not in this place) urges him not to it.

6. Yet the Apostle goes-on: For this cause also pay you Tribute, for they are God’s Ministers continually attending on this very thing.

For what cause? Because they may attempt to subvert Religion, Laws and Liberties? Do we pay Tribute for this cause, that they plunder and change Laws, &amp;c. Or that they may defend them? Also upon what thing are they thus God’s Ministers to attend continually? Is it to subvert Laws, &amp;c. Or to preserve them? The Apostle then speaks not of a Tyrant, but a just ruling Prince, and pity but he should be damned that resists him.

7. Finally, he concludes this matter with saying, Render to all their due. By what Law of God or man may a Tyrant subvert Religion, Laws and Liberties, or even be let alone in so doing.

I am sure the Apostle hath not expressed any such thing hitherto. It is Ergo, but the Doctor’s mistake, though I confess it hath been many wise and good men’s before him, that the Apostle forbids resisting such a Tyrant, which as I said above, all his Reasons go rather quite contrary unto, as describing the Power and Ruler that is to be subjected to, and not resisted, altogether cross to Tyranny, and his Interpretation and Assertion is altogether cross to the Apostle’s.”

— Herbert Palmer, Scripture and reason pleaded for defensive arms: or The whole controversy about subjects taking up arms Wherein besides other pamphlets, an answer is punctually directed to Dr. Ferne’s book, entitled, Resolving of conscience, &amp;c. The scriptures alleged are fully satisfied. The rational discourses ar, (London: John White, 1643), pp 9-10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+Prohibition+of+Resistance+cannot+be+meant+here%2C+which+is+wholly+contrary+to+the+Apostle%E2%80%99s+reasons+following%2C+which+persuade+to+Subjection+and+not+Resistance.+Or+that+Assertion%2C+or+Interpretation%2C+is+not+according+to+the+Apostle%E2%80%99s+scope%2C+which+is+formally+opposite+to+his+Arguments+afterward.%0A%0ABut+such+is+the+Doctor%E2%80%99s+Interpretation+and+Assertion%2C+Ergo%2C+His+Assertion+and+Interpretation+is%2C+that+Subjects+may+not+resist+a+Prince%2C+who+is+bent+to+subvert+Religion%2C+Laws+and+Liberties.%0A%0AThe+Apostles+Reasons+against+Resisters+are.%0A%0A1.+For+Rulers+are+not+a+terror+to+good+works%2C+but+to+evil.%0A%0ANow+is+this+a+reason+why+I+may+not+resist+such+a+Tyrant%3F%0A%0AWho+can+be+more+a+terror+to+good+works%2C+and+not+to+evil+then+he+that+is+bent+to+subvert+Religion%2C+Laws+and+Liberties%3F+Ergo+of+such+a+Resistance+of+a+tyrant+the+Apostle+speaks+not.+But+of+Resistance+of+that+Ruler%2C+who+goes+altogether+according+to+Laws+and+Liberties%2C+which+is+justly+punishable+with+Damnation+without+Gainsaying.%0A%0A2.+A+second+Reason+or+enforcement+of+the+Apostles+argument+against+Resistance+is%2C+Wilt+thou+then+not+be+afraid+of+the+power.+Do+that+which+is+good+and+thou+shalt+have+praise+of+the+same.+Now+doth+this+argue+a+Tyrant+is+not+to+be+resisted%3F+Is+there+no+cause+of+fear+of+him+%28while+a+man+does+that+which+is+good%29+that+is+bent+to+subvert+Religion%2C+Laws+and+Liberties%3F+Or+shall+a+man+have+praise+in+doing+good%2C+of+such+a+Tyrant.%0A%0ATherefore+is+not+a+Tyrant+that+power+which+may+not+be+resisted.+But+he+that+stands+to+the+Lawes%2C+and+Rules+according+to+them%2C+Damnation+is+just+against+those+that+resist+him+without+question.%0A%0A3.+Thirdly%2C+The+Apostle+proceeds%2C+vers.+4.+For+he+is+the+Minister+of+God+to+thee+for+good+%28and+so+not+to+be+resisted+without+resisting+the+Ordinance+of+God%2C+and+so+incurring+damnation%29+But+is+this+true+of+a+Tyrant+bent+to+subvert+Religion%2C+Laws%2C+and+Liberties%3F+Is+he+the+Minister+of+God+to+thee+for+good%3F+Or+the+Minister+of+his+own+lusts+rather%2C+for+evil%3F+Resistance+of+such+an+one+then%2C+is+not+the+Resistance+the+Apostle+forbids%2C+but+of+one+who+is+the+conservator+of+Religion%2C+for+he%2C+and+he+only+is+the+Minister+of+God+to+thee+for+good%2C+and+worthy+is+he+of+Damnation+that+resists+such+an+one.%0A%0A4.+The+Apostle+adds%2C+If+thou+do+that+which+is+evil+fear%2C+for+he+beareth+not+the+Sword+in+vain%3A+For+he+is+the+Minister+of+God%2C+a+Revenger+to+execute+wrath+upon+him+that+doth+evil.%0A%0AIs+this+man+a+Tyrant%2C+bent+to+subvert+Religion%2C+Laws+and+Liberties%2C+or+most+directly+opposite+to+Tyranny.%0A%0AA+Tyrant+secures+those+that+do+evil+%28so+they+will+join+with+him+and+serve+him+in+his+Tyranny%29+from+fear.+And+he+bears+the+Sword%2C+not+only+in+vain%2C+in+reference+to+any+good+end+intended+by+Gods+ordinance%2C+but+altogether+contrary+to+it%3B+and+is+so+far+from+being+the+Minister+of+God%2C+that+he+is+%28as+before%29+a+Minister+of+his+own+lusts%2C+to+shelter+those+that+doe+evil%2C+and+to+pursue+with+all+wrath%2C+and+revenge+him+that+doth+good%2C+and+will+not+be+a+slave+to+his+laws+designs+and+desires.+Still+then+of+such+a+Tyrant+S.+Paul+argues%2C+not+that+he+may+not+be+resisted%3A+but+him+that+he+describes%2C+which+is+a+just+Governor%2C+and+so+upon+no+terms+to+be+resisted.%0A%0A5.+Upon+all+this+the+Apostle+resumes%3A+Wherefore+you+must+of+necessity+be+subject%2C+not+only+for+wrath%2C+but+also+for+Conscience+sake.%0A%0AWhat+rules+of+conscience+%28before+laid%2C+inferred+now+by+the+word%2C+wherefore%29+urge+such+an+Asinine+or+stupid+subject%2C+as+to+be+subject+even+passively%2C+and+not+to+resist+one+that+is+bent+to+subvert+Religion%2C+Laws+and+Liberties%2C+when+all+that+went+before+speak+expressly+of+another+power+and+Rulers+of+another+temper%3F%0A%0AA+man+then+for+fear+of+wrath%2C+not+being+able+to+make+good+his+Resistance%2C+may+yield+such+passive+subjection%2C+but+sure+conscience+%28at+least+not+in+this+place%29+urges+him+not+to+it.%0A%0A6.+Yet+the+Apostle+goes-on%3A+For+this+cause+also+pay+you+Tribute%2C+for+they+are+God%E2%80%99s+Ministers+continually+attending+on+this+very+thing.%0A%0AFor+what+cause%3F+Because+they+may+attempt+to+subvert+Religion%2C+Laws+and+Liberties%3F+Do+we+pay+Tribute+for+this+cause%2C+that+they+plunder+and+change+Laws%2C+%26c.+Or+that+they+may+defend+them%3F+Also+upon+what+thing+are+they+thus+God%E2%80%99s+Ministers+to+attend+continually%3F+Is+it+to+subvert+Laws%2C+%26c.+Or+to+preserve+them%3F+The+Apostle+then+speaks+not+of+a+Tyrant%2C+but+a+just+ruling+Prince%2C+and+pity+but+he+should+be+damned+that+resists+him.%0A%0A7.+Finally%2C+he+concludes+this+matter+with+saying%2C+Render+to+all+their+due.+By+what+Law+of+God+or+man+may+a+Tyrant+subvert+Religion%2C+Laws+and+Liberties%2C+or+even+be+let+alone+in+so+doing.%0A%0AI+am+sure+the+Apostle+hath+not+expressed+any+such+thing+hitherto.+It+is+Ergo%2C+but+the+Doctor%E2%80%99s+mistake%2C+though+I+confess+it+hath+been+many+wise+and+good+men%E2%80%99s+before+him%2C+that+the+Apostle+forbids+resisting+such+a+Tyrant%2C+which+as+I+said+above%2C+all+his+Reasons+go+rather+quite+contrary+unto%2C+as+describing+the+Power+and+Ruler+that+is+to+be+subjected+to%2C+and+not+resisted%2C+altogether+cross+to+Tyranny%2C+and+his+Interpretation+and+Assertion+is+altogether+cross+to+the+Apostle%E2%80%99s.%E2%80%9D%0A%0A%E2%80%94+Herbert+Palmer%2C+Scripture+and+reason+pleaded+for+defensive+arms%3A+or+The+whole+controversy+about+subjects+taking+up+arms+Wherein+besides+other+pamphlets%2C+an+answer+is+punctually+directed+to+Dr.+Ferne%E2%80%99s+book%2C+entitled%2C+Resolving+of+conscience%2C+%26c.+The+scriptures+alleged+are+fully+satisfied.+The+rational+discourses+ar%2C+%28London%3A+John+White%2C+1643%29%2C+pp+9-10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6cc9078bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6cc9078bc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/10/herbert-palmer-romans-13-does-not-forbid-resisting-a-tyrant/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

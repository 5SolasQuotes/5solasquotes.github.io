<blockquote><p>In the third place he comes on to the chief Organ, that is, the in­strument wherewith they should sing. It is not with the Or­gans of the Papists, no not with thy tongue; but it is with the heart, and with the affection of a well ruled heart. Therefore as a fiddler, or any that plays on an Instrument tempers his Simile. Instrument, that a sweet harmony may be heard of it: Even so before thou sing, temper thou thy heart; and let thy song rise, not from thy throat, but from the depth of thine heart, that is, from thine affections set upon God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the Epistle of Paul to the Colossians</cite>, (Edinburgh, 1603), p. 338.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06a51df51a" data-kw="">
<blockquote><p>Her existence is independent of her civil establishment. Even her increase and prosperity may be attained in the midst of persecution. Yet her Establishment is a blessing, and every lawful means is to be employed for its maintenance. No principle must be sacrificed for it – but it is to be prized if it can be had consistently with principle.

We [the Irish Presbyterians] are to seek to procure for her what we enjoy ourselves, the patronage and support of the State, with uncontrolled freedom and independence. Let us ask our rulers to consider what they have done, and still do for us, and enquire why they should not do the same for them.

Do not our rulers know that our principles and practices are maintained without detriment to the State, and why should the same be refused to them? – Have not the rulers acknowledged, time after time, that to the Presbyterianism of Ireland they are mainly indebted for the security and peace of the country, and why should our privileges be denied to our parent Church of Scotland? We ask nothing for her which we have not ourselves enjoyed, and which we have not shown it is good for the State we should enjoy.

The voice of Irish Presbyterians should be heard in this question, and I trust that, for the sake of our rulers, as well as for our own, and for the Church of our Fathers, it shall be heard. Presbyterians are the friends of the Government, and they expect friendship in return. It would be a blunder in legislation to injure the Church of Scotland, which many years of regret and retraction might fail to correct. …

Presbyterians have their politics, but they value their religion more. And be the ruling powers who or what they may, the support of Presbyterian Ulster will be given to none who oppress the Church of their Fathers, and seek to suppress the fundamental principles of their ecclesiastical polity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast News-Letter</cite>, 18 March 1842.</span></figcaption>

<blockquote><p>We do not mean, however, properly speaking, that it is faith itself that justifies us — for faith is only the instrument by which we embrace Christ, our righteousness. But Jesus Christ is our righteousness in making available to us all his merits and all the holy works he has done for us and in our place. And faith is the instrument that keeps us in communion with him and with all his benefits. When those benefits are made ours they are more than enough to absolve us of our sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belgic-confession.html">Belgic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-50dc14226a" data-kw="">
<blockquote><p>Objection 8. In respect of God, who is truth itself, we are to believe the promise in particular: yet if we respect our own unworthiness and indisposition, we are to fear and in some part to doubt. For the promise of remission of sins is not absolute, but depends upon the condition of our works. Therefore our certainty is only conjectural. Answer. I answer first that in respect of our own unworthiness, we are not to doubt of our salvation, but to be out of all doubt, yea to despair before the judgment seat of God. For they which are of the works of the law, are under the curse, (Gal. 3:10), and Paul saith of his own works of grace, “in this am I not justified” (1 Cor. 4:4). And David being out of all doubt of his own deserved damnation in regard of his own unworthiness saith freely, “Enter not into judgment with thy servant, O Lord, for no flesh shall be justified in thy sight” (Ps. 143:2). Again the consideration of any unworthiness in ourselves, doth not hinder a resolution considering God’s mercy in Christ. For true faith makes an entrance unto God with boldness, (I say with boldness) even for those persons that are unworthy in themselves, (Eph. 4:12). And Abraham (whose faith is to be followed of us) did not upon the consideration of his old decayed body, rest himself with bare hope upon a likelihood of the accomplishment of God’s promise, but he “believed under hope even against hope” (Rom. 4:18). Lastly I answer that the ground of the former objection is erroneous, namely that the promise of salvation depends on the condition of our works: because the Scripture saith, it is made and accomplished on man’s part freely. I grant indeed that to the promise there is annexed a condition of faith: yet faith here must not be considered as a work, but as an instrument apprehending Christ with His benefits: and withal repentance with the fruits thereof are on our part required, yet no otherwise but as they are necessary consequents of faith, and the signs and documents thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, 8.73. (emphasis added)</span></figcaption>

</figure><figure class="quote" id="q-e1e520d100" data-kw="">
<blockquote><p>The Jewish way under the law of praising the Lord was upon the timbrel, the harp, psaltery, and ten-stringed instruments, and other instruments of music that belonged to the ceremonial worship that is now abolished. Christ, who is the end of the law, has torn or taken away the ceremonies of the law, and there is no warrant now to make use of the organs, as they do in the Popish Church, and the Prelatic Church of England, and even among them that are more reformed, those over in Holland. Oh, but we have a great advantage in being free of these!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Psalm 92 (undated) in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ</cite></span></figcaption>

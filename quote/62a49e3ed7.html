<main class="wrap"><figure class="quote" id="q-62a49e3ed7" data-kw="">
<blockquote><p>Many facile thinkers believe that because the establishment principle has been abused, the doctrine must be discarded. As the Seceder William MacKray points out, this is vain reasoning. Virtually anything can be abused by sinners for corrupt ends – even Christianity itself. Yet we do not reject Christianity just because some evil men have abused it to satisfy their selfish desires. Unlike many today, the Covenanters understood the distinction between the abuse and the proper use of a biblical principle:

They were persecuted by the State; but they did not therefore adopt the notion that the State has nothing to do with religion. They were persecuted by a church established by law; but they did not, therefore, adopt the opinion, that establishments must necessarily persecute, and that, of course, all establishments are unjust. They exercised a spirit of sound discrimination. They distinguished a good and scriptural institution from its perversion and abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-891bf5584e" data-kw="">
<blockquote><p>Many of us are familiar with the old saying, “If men were angels, government would not be necessary”. This is something of a half-truth, however. In his exposition of Romans 13, James McLeod Willson points out that civil government also has positive functions – such as promoting true religion:

It is not affirmed that the execution of law consists entirely in acts of a punitive character. It would be so, provided government had been established with no other view than to protect the peaceable citizen. Such a notion is most derogatory to the magistrate and the government. The civil ruler would then be no more than a policeman, and government a system of police. Government has higher functions. It is a “praise” them that do well. And, hence, it takes an interest in all that promotes a quiet, industrious and moral behaviour – it provides for the education of the people—it ought to interest itself in the maintenance of pure religious observances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Civil government: an exposition of Rom. XIII. 1-7</cite>, (Philadelphia, 1853), pp 85-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-4de427af5f" data-kw="">
<blockquote><p>…I do hereby grant and declare, that no person or persons, inhabiting in this province or territories, who shall confess and acknowledge One almighty God, the Creator, Upholder and Ruler of the World; and profess him or themselves obliged to live quietly under the civil government, shall be in any case molested or prejudiced, in his person or estate, because of his or their conscientious persuasion or practice… And all persons who also profess to believe in Jesus Christ, the Savior of the World, shall be capable (notwithstanding their other persuasions and practices in point of conscience and religion) to serve this government in any capacity, both legislatively and executively…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pennsylvania.html">William Penn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charter of Privileges Granted by William Penn to the Inhabitants of Pennsylvania and Territories</cite>, 1701 (Thorpe, 5.3077)</span></figcaption>

</figure><figure class="quote" id="q-47926c9091" data-kw="">
<blockquote><p>And what further authority, or proceedings purely ecclesiastical, of one, or many sister Churches towards another whole Church, or Churches offending, either the Scriptures do hold forth, or can rationally be put in execution (without the magistrates interposing a power of another nature, unto which we upon his particular cognizance, and examination of such causes, profess ever to submit, and also to be most willing to have recourse unto) for our parts we saw not then, nor do yet see… And if the magistrate’s power (to which we give as much, and (as we think) more, than the principles of the presbyterial government will suffer them to yield) do but assist and back the sentence of other Churches denouncing this non-communion [of Independent churches] against Churches miscarrying, according to the nature of the crime, as they judge meet…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/goodwin-nye-simpson-burroughs-bridge.html">Goodwin, Nye, Simpson, Burroughs, Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apologetical Narration, Humbly Submitted to the Honourable Houses of Parliament</cite>, (London [1643]), pp. 17, 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</a></div>
</figure><figure class="quote" id="q-4a1d55b285" data-kw="">
<blockquote><p>Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum</cite>, Jus Divinum, the Divine Right of Church Government, … (1646, 1647, 1654; NY: Robert Martin &amp; Co., 1844), pt. 2, ch. 9, section 1, ‘Of the Proper Receptacle &amp; Distinct Subject of All this Power &amp; Authority of Church Government… That the Political Magistrate is Not the Proper Subject of this Power’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<main class="wrap"><figure class="quote" id="q-a98026d521" data-kw="">
<blockquote><p>§1. We have laid out the concept of the natural knowledge of God based on the mainstream orthodox view. What is left is to demonstrate the wider agreement on this by quoting different authors… These authors do not just generally affirm this natural knowledge of God, but also distinctly break it down into parts or species which they explain: the innate or implanted or subjective type; and the acquired or added or objective or discursive or demonstrative type, derived a posteriori from observing effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation On the Ways of Knowing God’, pt. 2 tr. Michael Lynch (1665; 2024) at Translationes Lyncei</cite></span></figcaption>

<blockquote><p>13. Reason is employed on both sides, as an instrument, not a judge or norm. So that neither are they to be listened to who defer to it more than is fair in theological matters, and demand the things of faith from its scales, who are the Socinians; nor those who pointlessly begrudge its use in theological argumentation and forming consequences, which the Verronian Papists do, and some Lutherans.</p></blockquote>

</figure><figure class="quote" id="q-b05816f5f6" data-kw="">
<blockquote><p>Questions of how the brain can a priori create its own goals and then find the appropriate search images in its memory banks are not well handled. The loss of the Cartesian pilot has left a large gap in the theory, because no one wants a homunculus, but no one has a replacement… Recognition of ‘dissipative structures’… of ‘macroscopic order parameters’… and of ‘positive entropic information flows’ by various authors writing on self-organization in chaotic systems has opened new avenues to pursue the age-old question of how goals and their derivative expectancies arise in brains. Proposed new answers are expressed in terms of “circular causality”… My aim in this essay is to compare the language used in the theory of dynamical systems to describe active perception in experimental animals with the language used by an eminent philosopher [Aquinas] to describe the process in humans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-j-freeman-iii.html">Walter J. Freeman III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Nonlinear Brain Dynamics &amp; Intention According to Aquinas’ in Mind &amp; Matter, 6(2) (2009), pp. 207-34</cite>, pp. 209-10</span></figcaption>

</figure><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation On the Ways of Knowing God’, pt. 2 tr. Michael Lynch (1665; 2024) at Translationes Lyncei</cite></span></figcaption>

<blockquote><p>[see p. 75 of Wolter’s Summary] 68. When being is divided through contradictory attributes opposite to each other with respect to being, one of the dividing attributes belongs to a perfection in being and the other to imperfection. The reason is that one extreme of the disjunction formally involves the negation of the other. But both perfections cannot formally be perfections simply or pure perfections, because, from conclusion 62, pure perfections cannot formally exclude each other. Likewise, both extremes cannot formally be imperfections or mixed perfections, otherwise no being could be infinite (against conclusion 65). But a true disjunctive should include under one or other extreme every actual or potential being. Therefore one extreme is a perfection (a pure perfection) and the other an imperfection (a mixed perfection). 69. From this follows a general law of disjunction, namely that in disjunct properties of being, when the extreme that is less noble is posited of any being, the other more noble extreme can be deduced about some other being (see Scotus, Oxon. 1, d. 39, q. un, n. 13). The reason is that the one extreme involves imperfection and is therefore finite, while the other involves perfection simply, or pure perfection. But from conclusion 65, if something is finite, something else is infinite and has all pure perfections in the highest degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’, ‘Conclusions respecting Reality’</cite></span></figcaption>

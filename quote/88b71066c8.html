<blockquote><p>Haddington 26th Octr.

Revd &amp; Dear Sir

I take the opportunity of Dr. [William] Cunningham’s going to America, to send to your care, and for your distribution, a few copies of a pamphlet I published last-year on a particular branch of the Sabbath controversy. I meant to have requested your acceptance of them, when you were here, but I did not see you again, as I expected, at the Assembly of the Free Church.

If you think the argument maintained in it sound (as I of course do) and conceive it would be of importance to have the whole or any party of it re-published in any of your periodicals, or publications connected with the Sabbath, or religion generally, you will only promote the object I had in view, by your sending a copy of it, with my respects, to the Editor of the Biblical Repository [John Holmes Agnew], which I have for some years been in the habit of reading.

It would give me a great pleasure to hear from you personally at any time, or from any member of your Society, regarding the state and progress of the Sabbath cause in the States.

Believe me

With much respect

Yours faithfully

Pat. Fairbairn</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b80133b8f3" data-kw="">
<blockquote><p>We say that it is a superstition to esteem one day more holy than another. or to think that to abstain from labor is something which, in itself, pleases God (Rom 14:5, 6; Col 2:16, 17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us not Judaistic ceremony or stupid superstition. This is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early church (1 Cor 16:2; Acts 20:7; Rev 1:10). As for other festival days, we have removed them as much as possible from us, especially those which have been introduced through manifest idolatry. We have done this so as to correct the innumerable abuses which flowed from such, and to relieve the poverty of many. Nevertheless, because there are certain festivals devoted, since ancient times, to the celebration of certain mysteries concerning our redemption, we use Christian liberty, and submit all to edification, according to the different circumstances of pleas, times, and persons.</p></blockquote>

<blockquote><p>[N]ow lest any should mistake, there was three sorts of Laws published in writing at Mount Sinai which were not written before, first, that eternal Moral Law in the 20. chap. of Exodus, now this was not only written for them but for us also, Rom. 15:4. I Cor. 10:11. yea for Saints and Angels eternally, Psal. 119:89; 103:20. not one title of this Law shall fail, and the Apostles do not seek to make void this Law, but do establish it, Rom. 3:31. but then at Mount Sinai there was the Judicial Law given in the 21, 22, 23. chapters of Exodus, and that Law belongs no more to us then our Laws of the Land belong to them any farther then they are grounded on the moral Law.

3. There was the Ceremonial Law given in the 24, 25, 26, 27, 28, 29, 30, 31. now this ceremonial Law being in types and shadows of Christ to come were all ended when Christ was once offered to bear the sins of many, although the Priests stood daily ministering and offering oftentimes the same sacrifices, but when Christ had offered one sacrifice for sins, for ever sat down at the right hand of God, Heb. 9:28. 10, 11, 12.</p></blockquote>

<blockquote><p>…when I consider the proper end for which churches are erected, it appears to me more unbecoming their sacredness than I well can tell, to admit any other images than those living symbols which the Lord has consecrated by His own word: I mean Baptism and the Lord’s Supper, with the other ceremonies. By these our eyes ought to be more steadily fixed, and more vividly impressed, than to require the aid of any images which the wit of man may devise. Such, then, is the incomparable blessing of images—a blessing, the want [lack] of which, if we believe the Papists, cannot possibly be compensated!</p></blockquote>

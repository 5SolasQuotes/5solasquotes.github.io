<main class="wrap"><figure class="quote" id="q-274c7c7af5" data-kw="">
<blockquote><p>III. Second, “in affirmative precepts, negative, and in negative, affirmative are contained.” As in Scripture there are more things than words, so in the precepts and interdicts there is always more than is expressed in words. Not that the law is to be considered as a Lesbian rule (to be made to mean anything), but that we may search more deeply into the meaning of the lawgiver and embrace those things which are mutually connected or depend upon each other.

Hence since a good precept cannot be performed by the law without its opposite evil being avoided (nor a prohibited evil be shunned without its opposite good being performed), it follows that in the affirmative precepts negative are contained, and in the negative affirmative; so that those which are expressly negative and impliedly affirmative and vice versa. And so virtues are commanded when vices are forbidden. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.6.3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>The perpetuity and the universal obligation of the Sabbath, and consequently its appointment in the beginning of time, are distinctly indicated by the place assigned it in the Decalogue. It is acknowledged that the other nine precepts are of universal and perpetual obligation; and for this reason they were written on tables of stone by the finger of God. But why should a ceremonial institution, designed for only one nation, and destined to pass away, be incorporated in a law which is obligatory on all men, and is to continue in force to the end of time?

True, there is something of the nature of a positive command in it; but it is also clearly moral. All our time belongs to God. Six parts of it he allows to be devoted to ordinary pursuits and pleasures; but the seventh he retains, and requires it to be specially and exclusively devoted to spiritual duties. The obligation to employ our time, or any part of it, according to divine direction, is clearly moral. And no reason can be assigned for the placing of the command to hallow the Sabbath in the Decalogue, save that, like the other nine, it is of universal and perpetual obligation. And since the other commandments were in substance given in the beginning of time, so was the fourth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathan-l-rice.html">Nathan L. Rice</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Origin and History of the Sabbath in The Christian Sabbath: Its History, Authority, Duties, Benefits, and Civil Relations. A Series of Discourses</cite></span></figcaption>

</figure><figure class="quote" id="q-d15b540a75" data-kw="">
<blockquote><p>Hieronymus Zanchius (Operum, Tom. iv. lib. i. c. 11), Maintains at large, and by several arguments, that we Christians have nothing to do with the moral precepts, as they were given to the Israelites by Moses; but only in so far as they agree with the law of nature, common to all nations, and confirmed by Christ, whom we acknowledge to be our king.</p></blockquote>

</figure><figure class="quote" id="q-de7acf28c8" data-kw="">
<blockquote><p>Q. How shall we come to the right sight of our sins and a sound persuasion of the greatness of them? A: By the Spirit of God leading us into the true understanding of the law and a due examination of ourselves thereby. Q: Where is the law set down? A: it is written in many places of the Scriptures but the sum thereof is contained in the Ten Commandments. Q: Rehearse them A: I am the Lord your God, you shall have no other Gods but me… Q: How are they divided? A: Into two principal heads or tables as they are called. Q: What does the first table teach us? A: It teaches us our duties toward God and is contained in the first four commandments. Q: What does the second teach? A: Our duty toward our neighbor and is contained in the last six commandments. Q: Why are the duties towards God set down before the duties toward our neighbor? A: Because the love of God is the ground of our love of neighbor. Q: What follows hereof? A: That no one can rightly love his neighbor except he first love God. Q: Why are the duties towards our neighbor joined to our duty towards God? A: Because of the love of our neighbor is the proof our love towards God. Q: What ensues hereof? A: That no one can love God aright except he also love his neighbor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Form Of Catechizing</cite>, (1599).</span></figcaption>

<blockquote><p>Q. What does the LORD require in the first commandment? A. That for the sake of my very salvation I avoid and flee all idolatry, witchcraft, superstition, and prayer to saints or to other creatures. Further, that I rightly come to know the only true God, trust in him alone, submit to him with all humility and patience, expect all good from him only, and love, fear, and honour him with all my heart. In short, that I forsake all creatures rather than do the least thing against his will.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8cb99ccff1" data-kw="">
<blockquote><p>14. Still there was nothing with the Fathers less intended than to establish that kind of perfection which was afterwards fabricated by cowled monks, in order to rear up a species of double Christianity. For as yet the sacreligious dogma was not broached which compares the profession of monasticism to baptism, nay, plainly asserts that it is the form of a second baptism. Who can doubt that the Fathers with their whole hearts abhorred such blasphemy? Then what need is there to demonstrate, by words, that the last quality which Augustine mentions as belonging to the ancient monks—viz. that they in all things accommodated themselves to charity—is most alien from this new profession? The thing itself declares that all who retire into monasteries withdraw from the Church. For how? Do they not separate themselves from the legitimate society of the faithful, by acquiring for themselves a special ministry and private administration of the sacraments? What is meant by destroying the communion of the Church if this is not? And to follow out the comparison with which I began, and at once close the point, what resemblance have they in this respect to the ancient monks? These, though they dwelt separately from others, had not a separate Church; they partook of the sacraments with others, they attended public meetings, and were then a part of the people. But what have those men done in erecting a private altar for themselves but broken the bond of unity? For they have excommunicated themselves from the whole body of the Church, and contemned the ordinary ministry by which the Lord has been pleased that peace and charity should be preserved among his followers. Wherefore I hold that as many monasteries as there are in the present day, so many conventicles are there of schismatics, who have disturbed ecclesiastical order, and been cut off from the legitimate society of the faithful. And that there might be no doubt as to their separation, they have given themselves the various names of factions. They have not been ashamed to glory in that which Paul so execrates, that he is unable to express his detestation too strongly. Unless, indeed, we suppose that Christ was not divided by the Corinthians, when one teacher set himself above another (1 Corinthians 1:12, 13; 3:4); and that now no injury is done to Christ when, instead of Christians, we hear some called Benedictines, others Franciscans, others Dominicans, and so called, that while they affect to be distinguished from the common body of Christians, they proudly substitute these names for a religious profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.13.14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><figure class="quote" id="q-3e7b99112f" data-kw="">
<blockquote><p>Scholars have often depicted English Protestant Marriage Doctrine as nearly monolithic in its praise of marriage over celibacy as well as the liberty of all Christians to marry, but the literature actually reveals considerable tension. There was a heightened emphasis on celibacy as an inherently superior state among the spiritual sects and even among conforming churchmen who advocated the vita angelica [angelic life]. However, even though most English Protestants quickly rejected such claims, they still had to square their vigorous support of marriage with the expediency that celibacy afforded for serving God and promoting one’s spiritual welfare. The pragmatic advantages of celibacy could not simply be dismissed since they had clear scriptural support. Furthermore, despite rejecting the bifurcation of Scripture into universal commands and evangelical counsels, English Protestants struggled to develop a new moral system that answered whether Christians were obligated to forsake their liberty to marry if celibacy was more expedient. Both Jesus and Paul had counseled Christians to remain single if they were able. English Protestants navigated around Scripture’s commendation of celibacy by limiting its application to those with the gift of chastity and periods of persecution. They also asserted that Scripture merely counseled or advised celibacy, rather than commanding it. Yet both solutions depended on tenuous assumptions. The first assumption was hermeneutical and depended on the conviction that Scripture’s teaching on marriage in Genesis 1-2 was normative while Paul’s was an exception for certain occasions. The second assumption was that Christians were not obligated to choose the state of life in which they could best devote themselves to God. If either of the two assumptions were challenged, as they already had been with Whately, and especially Ames, then the decision to marry or remain single would be approached much differently; it would no longer concern the Christian’s liberty to choose what was “good” but the Christian’s obligation to choose what was “best.” As it so happened, Baxter explicitly claimed to have been influenced by both Whately and Ames.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed &amp; Celibate Pastor Richard Baxter’s Argument for Clerical Celibacy PhD diss</cite>, (Southern Baptist Theological Seminary, 2018) 445 pp., p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

oose+the+state+of+life+in+which+they+could+best+devote+themselves+to+God.+If+either+of+the+two+assumptions+were+challenged%2C+as+they+already+had+been+with+Whately%2C+and+especially+Ames%2C+then+the+decision+to+marry+or+remain+single+would+be+approached+much+differently%3B+it+would+no+longer+concern+the+Christian%E2%80%99s+liberty+to+choose+what+was+%E2%80%9Cgood%E2%80%9D+but+the+Christian%E2%80%99s+obligation+to+choose+what+was+%E2%80%9Cbest.%E2%80%9D+As+it+so+happened%2C+Baxter+explicitly+claimed+to+have+been+influenced+by+both+Whately+and+Ames.%E2%80%9D%0A%0A%E2%80%94+Seth+D.+Osborne%2C+The+Reformed+%26+Celibate+Pastor+Richard+Baxter%E2%80%99s+Argument+for+Clerical+Celibacy+PhD+diss.+%28Southern+Baptist+Theological+Seminary%2C+2018%29+445+pp.%2C+p.+108&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e7b99112f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e7b99112f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perpetual-celibacy/#:~:text=Scholars%20have%20often%20depicted%20English%20Protestant,influenced%20by%20both%20Whately%20and%20Ames&amp;text=Scholars%20have%20often%20depicted%20English%20Protestant%20Marriage%20Doctrine&amp;text=have%20been%20influenced%20by%20both%20Whately%20and%20Ames" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

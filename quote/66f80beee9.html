<main class="wrap"><figure class="quote" id="q-66f80beee9" data-kw="">
<blockquote><p>1. Vos is very insightful and helpful for developing a Reformed natural theology. 2. Vos’s natural-theological method and underlying cognitive theory differ substantively from both that of Thomas Aquinas and even most Reformed scholastics (Voetius, Turretin, Maastricht, Charnock…). Associating Vos with Thomism (as Fesko seems to do in his Introduction) is inaccurate and amateurish. 3. Vos’s and Van Til’s accounts are fundamentally aligned. A main difference between Vos and Van Til is that Van Til makes the implanted knowledge of God a condition for the possibility of not only (i) the acquired knowledge of God but also (ii) knowledge of creatures—which Vos may not even disagree with. Non-Thomist elements in Vos’s natural theology—which also distinguish him from many Reformed scholastics: 1. Innate knowledge of God. The innate knowledge of God (i) involves a “thick” concept of God as absolute being (not a general concept of a highest being), (ii) is produced in all people by the Holy Spirit’s illumination, and (iii) is the principle of knowledge of God acquired through experience and inference. 2. Ontological argument. An adjusted form of the ontological argument is sound. It consists merely in drawing attention to the innate knowledge of God—not in deducing God’s existence from a concept of God’s essence (p. 52, n. 113; p. 56, n. 127). 3. Cosmological arguments. Arguments which simply prove that an uncaused cause exists are weak: They don’t prove that the cause must be an absolute being (p. 55, n. 124). The innate knowledge of God (as an absolute being) grounds our knowledge that every (non-absolute) effect requires a cause (p. 55, n. 127). Vos thinks that innate knowledge of God is a condition for the possibility of acquired knowledge of God, and he takes himself to be following Calvin here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Natural Theology</cite>, ed. J.V. Fesko, trans. Albert Gootjes</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f59812f657" data-kw="">
<blockquote><p>In the book The Open Secret: A New Vision for Natural Theology, Alister McGrath sets out to lay the foundations for an entirely new natural theology… ‘…if nature is to disclose the transcendent, it must be ‘seen’ or ‘read’ in certain specific ways – ways that are not themselves necessarily mandated by nature itself.’ He does not wish to embark on a neutral natural theology, but to advance a Christian natural theology – one which, rather than proving the doctrinal claims of Christianity, begins by accepting the doctrinal claims of Christianity, and then goes on to show how the Christian worldview gives the best interpretation of our perceptions of this universe. The claim that he will seek to validate in his book is summarized briefly as follows: ‘…A Christian understanding of nature is the intellectual prerequisite for a natural theology which discloses the Christian God.’ In order to understand his revised natural theology we must first understand the need for this revision. What does McGrath perceive as the old natural theology, and what is so wrong with it that we need a new vision? Once we have understood these contentions we will be able to better understand McGrath’s revised version, which will allow us to give it a critical analysis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Alister McGrath &amp; Natural Theology’</cite></span></figcaption>

</figure><figure class="quote" id="q-b4f52f4f03" data-kw="">
<blockquote><p>The extrinsic arguments or testimonies are: 1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions; 2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian.</p></blockquote>

<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology</cite>, (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Heinrich Bullinger on Natural Reason, Theology &amp; Law’</span></figcaption>

<blockquote><p>But man is capable of knowing God from such creatures in three ways, as Denis says in The Divine Names. He knows him, first of all, through causality. For since these creatures are subject to change and decay, it is necessary to trace them back to some unchangeable and unfailing principle. In this way, it can be known that God exists. Second, he can be known by the way of excellence. For all things are not traced back to the first principle as to a proper and univocal cause, as when man produces man, but to a common and exceeding cause. From this it is known that God is above all things. Third, he can be known by the way of negation. For if God is a cause exceeding his effects, nothing in creatures can belong to him, just as a heavenly body is not properly called heavy or light or hot or cold. And in this way, we say that God is unchangeable and infinite; and we use other negative expressions to describe him. Men had such knowledge through the light of reason bestowed on them: ‘many say: O, that we might see some good! Lift up the light of your countenance upon us, O Lord’ (Ps 4:6).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ea669cbd29" data-kw="">
<blockquote><p>3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led. 4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving. 5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel, and doctrine concerning Christ the Savior and faith in him, who, without knowledge of Him who alone is the way, can come to life? 6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and Him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Sr. Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-3194fd8ecb" data-kw="">
<blockquote><p>14. Nor do we take ourselves bound by Christ to one place or one time, or manner of teaching, or to speak always to a great assembly. But all these are circumstances which we must fit to the end and success of our work, and must take that course, and with that variation which tends to the Church’s good. Christ, that bid his apostles when they were persecuted in one city, fly to another, allows us to be where we may serve Him best. If forbearing all preaching for some days or weeks would tend to the Church’s good (as by procuring us liberty afterward, etc.) it is lawful to forbear. If preaching often to a few be more for the Church’s good than to preach but once or twice to many, we may then lawfully choose the smaller number. So that in such circumstances, that may be one man’s duty which is anothers sin.</p></blockquote>

</figure><figure class="quote" id="q-3a7d9dbe59" data-kw="">
<blockquote><p>2. Because when the Church is overgone with heresy and apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; And suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea (1642)</cite>, pp. 126-7</span></figcaption>

</figure><figure class="quote" id="q-322c200def" data-kw="">
<blockquote><p>Controversy 3 – Did the first reformers, Luther, Calvin and others, have a legitimate calling? We affirm against the Papists. Arguments 1. They were qualified, called by the Church, approved by the magistrate, and, originally, appointed by the Roman Church itself to teach. Objections 1. Then the Roman Church is a true Church. Reply: Originally, it was, and later it became impure, however, it did perform this according to the Word of God, that it called ministers. 2. They were not confirmed by bishops following the ordinary rituals. Reply: It was not necessary. But their calling can be called extraordinary: a. Insofar as God gave them extraordinary gifts. b. From an extraordinary impulse of the Holy Spirit. c. Insofar as God used them for an extraordinary work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 16, ‘The Church’</cite>, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<main class="wrap"><figure class="quote" id="q-93d85c43a7" data-kw="">
<blockquote><p>Baptism is a sign of regeneration into Christ, into his death, (I mean) and resurrection: which succeeded in the place of Circumcision, consisting of the fountain of water, in the word: wherein in the name of the Father, the Son, and of the holy Ghost, remission of sins and shedding out the holy Ghost is offered, and by a visible Sacrament, we are grafted into Christ &amp; into the Church: and the right unto the kingdom of heaven is sealed unto us, and we on the other side profess that we will die unto sin, and from thence forward live unto Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The common places</cite>, trans. Anthony Marten (2nd edn, London, 1583), 4.8.1, p. 112.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a35366c560" data-kw="">
<blockquote><p>A question here ariseth about infants; Whether they are to be baptized, or not, seeing they cannot be taught or instructed about faith? I answer that the children, or infants of believers ought to be baptized, because while they are yet infants, as to the external privileges of the Covenant with God, they are accounted both persons and parties of, or belonging to their parents; and therefore they are of the family of Christ, or of the number of his disciples. For if the Covenant made with Abraham be the same for substance, by which we are saved, and belongeth as much to us and to our children as it did to Abraham and his posterity, then not only we, but our children also ought to be partakers of the seal of this Covenant. But the first is true, as appeareth by Rom. 4 and other places; and therefore the latter also is true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion</cite>, … (London, 1659), The 26-27th Lord’s Days, p. 180</span></figcaption>

<blockquote><p>SIMO.

What canst thou make of a faithful but a faithful? I can not understand how infants and young babes can be faithful, sith that they do want the use of reason.

IO.

But in this business, we do so speak of the faithful that we do in no wise exclude the children from the number of them, saith that the children and infants are of God whom God doth always admit and receive into his church among the faithful.

SIM.

It behoveth thee to have proved the same, as I have already proved the contrary,

IOI.

I will prove it. Genesis xvii. chap. Where God doth make a covenant with Abraham. The Lord doth peculiarly comprehend the children in the covenant, for he saith. I shall be thy God, and the God of thy seed after the. And afterwards he commandeth the infants to be circumcised upon the eight day, &amp; to receive the sign of the Testament. Whereby it followeth that God is not only the God of them that be of age, and can believe in God, but also of the infant, which for lack of age can not yet believe, for they through grace and the promise, are received in to the covenant and number of the faithful.

SIM.

I care not for the old Testament of the Jews, these old things are abolished by the gospel.

IO.

By Jesus Christ the ceremonies are abolished and the figures fulfilled, but the covenant made with Abraham, standeth still. Else God were not our God, and the God of our seed, and should be made by Christ more unmerciful and more strange, then he was to the ancient fathers before Christ. Which to think, were a foolish thing, that I should not say an ungodly, specially saith that in the new Testament, also the faithful are called the children of Abraham. Rom. iiii. Gal. iiii Mat. viii. Luk. xiii. &amp; xix. Chap. Besides these, Christ which express words, doth say: Suffer young children to come unto me, for to such doth belong the kingdom of heaven. Paul speaking of the children of the Christians, saith: Your children are clean: How should that be, unless it were through grace, mercy, &amp; the promise of God? It followeth then, that the children of the Christians, are of God, &amp; ought to be numbered among the children of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists</cite>, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-29e4908f08" data-kw="">
<blockquote><p>…we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise, why is a confession of faith required of adults before thy are baptized? We believe, however, that the children of the saints have already been adopted right in the womb according to the covenantal formula. And so we baptize them. …We count as nonsense his assertion that children are holy–that is, in the outward company of the church–before their baptism. For the opposite is true: those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism.</p></blockquote>

<blockquote><p>6. [The Independents hold] ‘That none but confederates by the explicit Church-Covenant have right to Ordinances’: which is to keep out many precious souls from communion with their fellow-members, and their children from baptism, and to make them no better than infidels.</p></blockquote>

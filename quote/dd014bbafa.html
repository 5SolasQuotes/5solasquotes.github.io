<main class="wrap"><figure class="quote" id="q-dd014bbafa" data-kw="">
<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>

<blockquote><p>Modest women were supposed to keep their heads covered when out of doors, but this generally took the form of draping their mantle over their head rather than wearing a hat, since the elaborate hairstyles frequently made hats impossible. In the first centuries BC and AD, there are some references to the turban (mitra) being worn by rich women, and it is possible this is the cloth wrapped round the head like a headscarf seen on women in Hellenistic paintings. Catacomb paintings of Christian women praying sometimes show them with a veil covering their head and hanging down their back or over their shoulders, but rarely crossed over like a shawl round the neck… The freedman’s cap could also be worn by women on occasion;</p></blockquote>

<blockquote><p>Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints Happiness… (London: M.S., 1660)</cite>, pp. 15-16</span></figcaption>

<blockquote><p>This study addresses the issue of v. 15 in 1 Cor 11:2-16 from the perspective of a veiling custom. If veiling is in view (the position adopted here), then how does one confront the difficulty of reconciling the overall context with the exceptional statement in v. 15 that long hair for a woman is a glory. If, as the text argues, long hair is to be taken as a ‘glory,’ by what logic could a woman understand that she should place a veil upon her head? This article provides a way out of the dilemma by showing how a veil can serve the double function of reflecting the hair’s beauty while at the same time preserving a symbol of female modesty.” – Abstract ‘Veiling among Men in Roman Corinth: 1 Corinthians 11:4 &amp; the Potential Problem of East Meeting West’ Pre Journal of Biblical Literature, vol. 137, no. 2 (Summer, 2018), pp. 501-17 Brown (below) had previously argued against Massey and another scholar on whether the key greek syntax in 1 Cor. 11:4 could mean, or primarily does mean, that it was a shame for men to have long hair while praying (Brown), or that it was a shame for a man to pray with a material head-covering on (Massey). This article of Massey follows that of Brown but never appears to address Brown’s article directly. This work of Massey “is based on the foundational work of Oster, Gill, and Finney.</p></blockquote>

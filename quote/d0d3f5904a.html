<blockquote><p>Although it has been sadly forgotten in recent times, the Covenanter position is that those who dissent from the doctrine and order of the Reformed Presbyterian Church cannot be accepted into communicant membership or admitted to the Lord’s Table. Alexander McLeod explains the rationale for this below:

174. How many kinds of censurable offences are there?

The scandalous offences are of three kinds:- heresy, which consists in maintaining errors contrary to the subordinate standards of the Church, and to the holy scriptures [Rom. 16:17] – Immorality [1 Cor. 5:11] and contempt of Church-order, which consists in untenderness to brethren, neglect of ordinances, disrespect to the ministry, and resistance to the authority of the Church [2 Thess. 3:6].</p></blockquote>

<blockquote><p>Because there is in this respect an extreme difference between faults in doctrine and in life; the first drawing after them a consequence far differing from that of the latter, because that the Church propounds unto us not Her life but Her doctrine, to be the rule of our faith and manners. Yet (which we Protestants confess) all errors in doctrine do not give a man a just and sufficient cause to make a division from those that hold them. For the Apostle commands us, to receive him that is weak in the faith, Rom. xiv. 1. and not to trouble him with disputes, and to afford him our selves for an example, in bearing gently with those who are not of our mind in every thing. Let us all who are perfect, saith he, be of the same mind; and if any of you think otherwise, God shall reveal even this unto him. Phil. iii. 15.

‘Tis evident, that this weakness in faith and this diversity in opinion, whereof S[aint] Paul speaketh, are errors; but such as he would have us bear with. Yet since he elsewhere pronounceth anathema against those, that preach any other Gospel then that which he preached, we must of necessity conclude, that there are two sorts of errors in religion: the one such, as a man may bear with without dividing from them who hold them; and the other such, for which he is bound to avoid their communion: and this difference dependeth upon the nature of errors themselves.

For as the truths which we are to believe are not all of equal importance, some being esteemed fundamental and so absolutely requisite, that a man cannot come to the kingdom of heaven if he be ignorant of them; others being profitable, yet not so necessary but that a man may without the knowledge of them serve God and enjoy salvation: so it is with errors, Some are pernicious and no way consistent with a true piety; others are less hurtful and do not necessarily draw in men to perdition.

S[aint] Paul doth clearly enough discover to us this distinction, 1 Cor. iii. 13, 15. where, after he had said, That none could lay any other foundation but that which he had laid, to wit, Jesus Christ, he addeth, That they who builded upon this foundation wood, hay, stubble, should have loss in their work, when it comes to be tried; nevertheless they should be saved, yet so as by fire; that is to say, with difficulty, their person only, or that wherein their chief good consisted, escaping a burning. An evident sign that there be errors, which do not deprive the Authors thereof of salvation, much less exclude such from happiness as believe them after Them, and take them up (when they are dead or gone) merely upon their trust and credit. And to conclude, who doth not see plainly, That there be errors which utterly overthrow the foundations of Christianity, engaging us unavoidably in such things as are inconsistent with salvation? and that there be others which do not so?

As for example, if one should think that he were bound to worship the Sun. (For seeing the Sun is a creature, and those who worship creatures have no portion in the kingdom of heaven.) ‘Tis evident that he who hath such an opinion cannot attain eternal happiness. And ’tis so with all other errours which overthrow any of the first, necessary, and fundamental articles of Christian religion. But the error of those, who believed of old, That the Church shall continue a thousand years (or some long time) with J[esus] Christ upon earth after the resurrection, is no way repugnant to piety towards God, or charity towards our Neighbour, nor doth it directly overthrow any of the foundations of the Gospel; Though it be in my opinion contrary to divers passages of S[aint] Paul and scarce consonant to the nature of Christ’s Kingdom.

A man would scarce believe how necessary it is, to mark this difference among the errors of men in matters of religion, for preventing that vain scrupulosity and importunate pensiveness, which many melancholy spirits are troubled with, who condemn all errors alike, and thunder out one and the same anathema against what ever differs (though never so little) from their apprehensions: yet for keeping them from falling on the other side, into the indifferency of profane persons, who conform to any thing, and swallow a camel as well as a gnat. Indeed the true pious person will endeavour to keep himself from all error; and will purge his neighbour too, as well as himself, so far as he is able.

For any deviation from truth though it may be a light and small error, yet ’tis an errour (that is to say an ignorance, and contradiction to the truth) and by consequence an evil. But a man must be very diligent and circumspect in observing this distinction among errors, and acknowledge that one is much more dangerous then another, and he should more or less abhor them all, according as he shall judge them to be more or less dangerous. If they be of the first rank, viz. those which overthrow the foundations of Christianity, he will bestir himself with all possible prudence and dexterity, according to his vocation and gifts, to free his neighbour from them; and if he cannot gain upon him, he will yet be sure to save and deliver his own soul from the communion of such as hold them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 19-21.</span></figcaption>

y+towards+God%2C+or+charity+towards+our+Neighbour%2C+nor+doth+it+directly+overthrow+any+of+the+foundations+of+the+Gospel%3B+Though+it+be+in+my+opinion+contrary+to+divers+passages+of+S%5Baint%5D+Paul+and+scarce+consonant+to+the+nature+of+Christ%E2%80%99s+Kingdom.%0A%0AA+man+would+scarce+believe+how+necessary+it+is%2C+to+mark+this+difference+among+the+errors+of+men+in+matters+of+religion%2C+for+preventing+that+vain+scrupulosity+and+importunate+pensiveness%2C+which+many+melancholy+spirits+are+troubled+with%2C+who+condemn+all+errors+alike%2C+and+thunder+out+one+and+the+same+anathema+against+what+ever+differs+%28though+never+so+little%29+from+their+apprehensions%3A+yet+for+keeping+them+from+falling+on+the+other+side%2C+into+the+indifferency+of+profane+persons%2C+who+conform+to+any+thing%2C+and+swallow+a+camel+as+well+as+a+gnat.+Indeed+the+true+pious+person+will+endeavour+to+keep+himself+from+all+error%3B+and+will+purge+his+neighbour+too%2C+as+well+as+himself%2C+so+far+as+he+is+able.%0A%0AFor+any+deviation+from+truth+though+it+may+be+a+light+and+small+error%2C+yet+%E2%80%99tis+an+errour+%28that+is+to+say+an+ignorance%2C+and+contradiction+to+the+truth%29+and+by+consequence+an+evil.+But+a+man+must+be+very+diligent+and+circumspect+in+observing+this+distinction+among+errors%2C+and+acknowledge+that+one+is+much+more+dangerous+then+another%2C+and+he+should+more+or+less+abhor+them+all%2C+according+as+he+shall+judge+them+to+be+more+or+less+dangerous.+If+they+be+of+the+first+rank%2C+viz.+those+which+overthrow+the+foundations+of+Christianity%2C+he+will+bestir+himself+with+all+possible+prudence+and+dexterity%2C+according+to+his+vocation+and+gifts%2C+to+free+his+neighbour+from+them%3B+and+if+he+cannot+gain+upon+him%2C+he+will+yet+be+sure+to+save+and+deliver+his+own+soul+from+the+communion+of+such+as+hold+them.%E2%80%9D%0A%0A%E2%80%94+Jean+Daill%C3%A9%2C+An+apology+for+the+Reformed+churches+wherein+is+shewed+the+necessity+of+their+separation+from+the+Church+of+Rome%3A+against+those+who+accuse+them+of+making+a+schism+in+Christendom%2C+trans.+Thomas+Smith+%28Cambridge%3A+University+of+Cambridge%2C+1653%29%2C+pp+19-21.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef6a2601b3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ef6a2601b3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/09/18/jean-daille-on-errors-in-fundamental-and-lesser-matters/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

7. So to bind the church to certain places and persons, as to say there only with them is the church.

<blockquote><p>The principal design of preaching the Gospel is, that men may be reconciled to God, and this is accomplished by the unconditional pardon of sins; as Paul also informs us, when he calls the Gospel, on this account, the ministry of reconciliation, (2 Cor. 5:18.) Many other things, undoubtedly, are contained in the Gospel, but the principal object which God intends to accomplish by it is, to receive men into favour by not imputing their sins. If, therefore, we wish to show that we are faithful ministers of the Gospel, we must give our most earnest attention to this subject; for the chief point of difference between the Gospel and heathen philosophy lies in this, that the Gospel makes the salvation of men to consist in the forgiveness of sins through free grace. This is the source of the other blessings which God bestows, such as, that God enlightens and regenerates us by his Spirit, that he forms us anew to his image, that he arms us with unshaken firmness against the world and Satan. Thus the whole doctrine of godliness, and the spiritual building of the Church, rests on this foundation, that God, having acquitted us from all sins, adopts us to be his children by free grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospel according to John, trans. William Pringle (Bellingham, WA: Logos Bible Software, 2010), 2.271. (HT: Chris Gordon)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03bbd0999e" data-kw="">
<blockquote><p>They [laypersons] are to edify, exhort, rebuke and comfort one another (Heb. 3:13; Lev. 19:17; 1 Thess. 5:11-12; Col. 3:16; Heb. 10:23; Mal. 3:16; Zech. 8:21), and this they may do, not one to one only, as some say, but one to many: 1. So the Scripture says, Prov. 10:21, ‘The lips of the righteous feed many;’ Eph. 4:29, they are to speak words ministering grace to the hearers. So says Calvin (Commentary, Hos. 2:2), Bullinger (in Col. 4:6), Beza (Ibid.), Davenant (in Col. 3:16), Whittaker (of the Authority of Scripture, vol. 2, bk. 3, ch. 14), Pareus (in Hos. 2:2), Zanchius, Musculus (in Isa. 2:2), Gualther (hom.[ily?] 17).</p></blockquote>

<blockquote><p>Who can then blame us to shun a danger, and fearing the worst, to resist evil beginnings? to give no place to the Devil, to crush the viper while it is in the shell, to abstain from all appearance of evil, 1 Thess. 5:22, and to take the little ones of Babylon, whiles they are young, and dash their heads against the stones? It skils not, that many will judge us too precise for doing so. What? do they think this preciseness any other than that which the Law of God requires, even observing of the commandement of God without adding to it or diminishing from it, and keeping the straight path, without declining to the right hand or the left? or do they think us more precise than Mordecai, who would do no reverence to Haman, because he was an Amalekite, and so not to be countenanced nor honoured by an Israelite? Are we more precise than Daniel, who would not close his window when he was praying, no not for the king’s edict, knowing, that because he had used to do so aforetime, his doing otherwise had been both a denying of his former profession and an ensnaring of himself by yielding in small things to yield in greater, and after an inch to take an elle? Are we more precise than the apostle Paul who gave no place to the adversaries of Christian liberty, no not for an hour? Are we more precise than David, who would not do so much as take up the names of idols into his lips, lest from speaking of them he should be led to a liking of them: or may not the sad and doleful examples of so many and so great abuses and corruptions which have crept into the Church from so small and scarcely observable originals, make us loathe at our hearts to admit a change in the policy and discipline of a well constitute[d] Church, and rightly ordered before the change, and especially in such things as are not at all necessary? O! from how small beginnings did the mystery of iniquity advance it’s progression? How little motes have accresced to mountains? Wherefore simplicitatem Christi nos oportet coler•…, à qua ubi primum •…xtulit pedem vanitas, vanitatem sequitur superstitio, superstitionem error, errorem presumptio, presumptionem impietas Idololatrica. We have cause to fear that if, with Israel, we come to the sacrifices of idols, and eat of idolothyts, and bow down or use any of superstitious and idolotrous rites, thereafter we be made to join ourselves to these idols, and so the fierce anger of the Lord be kindled against us, as it was against them.</p></blockquote>

<blockquote><p>…The ministers and elders (who are commissioners), together with the expectants [students for the ministry] and others who are pleased to be present, meeting in the place and at the day and hour appointed (which is accustomed to be one half hour after nine o’clock in the forenoon, whereof warning is given by the sound of a bell, so that all the affairs of that day, unless there be somewhat extraordinary to hold them longer, may be exped [expedited?] against mid-day), do begin with prayer and proceed to the textual interpretation of Scripture (which is done by the ministers, each one in his own place by course, or by the expectants, whose names are set forth in a table or written in the register of the presbytery for that end). After the first speaker, some other who follows in order and is also appointed by the presbytery the day before, speaks in the second place, collects some doctrines (one or more upon the text expounded) and shows the use thereof. The second speaker, having ended about eleven o’clock, the exercise is closed with thanksgiving by him who spoke first. The matter of each day’s exercise is some portion of that particular book of the Old or New Testament agreed upon in the presbytery. Once every month some common place or controversy is handled unto which the exercise gives place for that day. The ground is read in Scripture, the state of the question propounded, the arguments for the truth pressed and vindicated from the sophistication of the adversaries. But the arguments contra [the adversaries] are left to be proposed in the presbyterial meeting by such ministers as are called by the moderator to dispute upon the propositions or theses exhibited by the contraversar and propugned [assailed] by him, before the day of the next meeting, the moderator being praeses [president] of the disputation. That the presbytery may go through all the controversies, they have also a table wherein they are all digested in order, so that each minister or expectant knows a month before what is next to be treated. The exercise (or common head of controversy) being ended in public, the people depart and the ministers and elders (with others who are permitted to be present) go to the private place of their meeting, where (all being set in order and the moderator having begun with prayer) the doctrine that was delivered in public is examined and each one of the presbytery and expectants either approves, or (in charity and soberness of spirit) propounds his doubt against any point spoken of. Which being done, the speakers for that day are called upon (they being apart at this time) and their interpretation and doctrine is approved and they are encouraged. Or (if there be cause), they are in a brotherly manner admonished and the doctrine censured (for this they call the censure of the doctrine). The matters before mentioned are the subject of the presbyterial jurisdiction, are propounded, modestly debated, and either concluded or taken to further deliberation, or remitted to the synod. And so the meeting is concluded with prayer.</p></blockquote>

igested in order, so that each minister or expectant knows a month before what is next to be treated. The exercise (or common head of controversy) being ended in public, the people depart and the ministers and elders (with others who are permitted to be present) go to the private place of their meeting, where (all being set in order and the moderator having begun with prayer) the doctrine that was delivered in public is examined and each one of the presbytery and expectants either approves, or (in charity and soberness of spirit) propounds his doubt against any point spoken of. Which being done, the speakers for that day are called upon (they being apart at this time) and their interpretation and doctrine is approved and they are encouraged. Or (if there be cause), they are in a brotherly manner admonished and the doctrine censured (for this they call the censure of the doctrine). The matters before mentioned are the subject of the presbyterial jurisdiction, are propounded, modestly debated, and either concluded or taken to further deliberation, or remitted to the synod. And so the meeting is concluded with prayer.”

— Alexander Henderson Describing the Elders’ Conferences, The Government &amp; Order of the Church of Scotland (1641), Part II, Chapter IV, ‘Of Greater Presbyteries or Classes’, p. 49 ff.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6The+ministers+and+elders+%28who+are+commissioners%29%2C+together+with+the+expectants+%5Bstudents+for+the+ministry%5D+and+others+who+are+pleased+to+be+present%2C+meeting+in+the+place+and+at+the+day+and+hour+appointed+%28which+is+accustomed+to+be+one+half+hour+after+nine+o%E2%80%99clock+in+the+forenoon%2C+whereof+warning+is+given+by+the+sound+of+a+bell%2C+so+that+all+the+affairs+of+that+day%2C+unless+there+be+somewhat+extraordinary+to+hold+them+longer%2C+may+be+exped+%5Bexpedited%3F%5D+against+mid-day%29%2C+do+begin+with+prayer+and+proceed+to+the+textual+interpretation+of+Scripture+%28which+is+done+by+the+ministers%2C+each+one+in+his+own+place+by+course%2C+or+by+the+expectants%2C+whose+names+are+set+forth+in+a+table+or+written+in+the+register+of+the+presbytery+for+that+end%29.+After+the+first+speaker%2C+some+other+who+follows+in+order+and+is+also+appointed+by+the+presbytery+the+day+before%2C+speaks+in+the+second+place%2C+collects+some+doctrines+%28one+or+more+upon+the+text+expounded%29+and+shows+the+use+thereof.+The+second+speaker%2C+having+ended+about+eleven+o%E2%80%99clock%2C+the+exercise+is+closed+with+thanksgiving+by+him+who+spoke+first.+The+matter+of+each+day%E2%80%99s+exercise+is+some+portion+of+that+particular+book+of+the+Old+or+New+Testament+agreed+upon+in+the+presbytery.+Once+every+month+some+common+place+or+controversy+is+handled+unto+which+the+exercise+gives+place+for+that+day.+The+ground+is+read+in+Scripture%2C+the+state+of+the+question+propounded%2C+the+arguments+for+the+truth+pressed+and+vindicated+from+the+sophistication+of+the+adversaries.+But+the+arguments+contra+%5Bthe+adversaries%5D+are+left+to+be+proposed+in+the+presbyterial+meeting+by+such+ministers+as+are+called+by+the+moderator+to+dispute+upon+the+propositions+or+theses+exhibited+by+the+contraversar+and+propugned+%5Bassailed%5D+by+him%2C+before+the+day+of+the+next+meeting%2C+the+moderator+being+praeses+%5Bpresident%5D+of+the+disputation.+That+the+presbytery+may+go+through+all+the+controversies%2C+they+have+also+a+table+wherein+they+are+all+digested+in+order%2C+so+that+each+minister+or+expectant+knows+a+month+before+what+is+next+to+be+treated.+The+exercise+%28or+common+head+of+controversy%29+being+ended+in+public%2C+the+people+depart+and+the+ministers+and+elders+%28with+others+who+are+permitted+to+be+present%29+go+to+the+private+place+of+their+meeting%2C+where+%28all+being+set+in+order+and+the+moderator+having+begun+with+prayer%29+the+doctrine+that+was+delivered+in+public+is+examined+and+each+one+of+the+presbytery+and+expectants+either+approves%2C+or+%28in+charity+and+soberness+of+spirit%29+propounds+his+doubt+against+any+point+spoken+of.+Which+being+done%2C+the+speakers+for+that+day+are+called+upon+%28they+being+apart+at+this+time%29+and+their+interpretation+and+doctrine+is+approved+and+they+are+encouraged.+Or+%28if+there+be+cause%29%2C+they+are+in+a+brotherly+manner+admonished+and+the+doctrine+censured+%28for+this+they+call+the+censure+of+the+doctrine%29.+The+matters+before+mentioned+are+the+subject+of+the+presbyterial+jurisdiction%2C+are+propounded%2C+modestly+debated%2C+and+either+concluded+or+taken+to+further+deliberation%2C+or+remitted+to+the+synod.+And+so+the+meeting+is+concluded+with+prayer.%E2%80%9D%0A%0A%E2%80%94+Alexander+Henderson+Describing+the+Elders%E2%80%99+Conferences%2C+The+Government+%26+Order+of+the+Church+of+Scotland+%281641%29%2C+Part+II%2C+Chapter+IV%2C+%E2%80%98Of+Greater+Presbyteries+or+Classes%E2%80%99%2C+p.+49+ff.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F54ccc1651c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/54ccc1651c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topic

<main class="wrap"><figure class="quote" id="q-8ed0f09344" data-kw="">
<blockquote><p>Until the Civil War the various Presbyterian bodies used psalms predominantly, singing hymns only now and then, especially in informal gatherings. Their songbook, Psalms and Hymns, had a clearly defined psalter section. After the Civil War the use of hymns increased greatly. In the Presbyterian Hymnal published in 1874 by the northern branch of the church, psalms were mixed in with hymns. The 1901 Psalms and Hymns of the southern church followed suit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/various.html">Various</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘We Used to Sing Only Psalms — What Happened?’</cite>, (1987)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afcb3af2fb" data-kw="">
<blockquote><p>Moreover, who can deny ye there is much &amp; great virtue in David’s Harp… Again must not David’s songs be of great excellency, seeing that ye Son of God came down from the glorious throne of his heavenly Father to accomplish and fulfill them? Doth not Paul also say, ‘Be ye filled with the Spirit, speaking among yourselves in Psalms, Hymns, &amp; spiritual songs, singing and making melody in your hearts to ye Lord, ever giving thanks for all things in the name of our Lord Jesus Christ?’ Certes [assuredly] the psalmody of David may well be called ye treasure house of the holy Scripture. For it contain the whatsoever is necessary for a christian to know: There is nothing in the law, no thing in the Prophets, nothing in ye preaching of Christ and of his apostles, yt this noble minstrel, King &amp; Prophet doth not decantate and sing with most goodly &amp; manifest words. He singeth all the works and wonderous miracles of God from the beginning of the world, until the redemption of mankind by Christ. He singeth Christ’s incarnation, preaching, working of miracles, passion, death, resurrection, ascension, glory, the blessing of all nations, the conversion of the Gentiles with all other mysteries that pertain to our health… To be short, he singeth whatsoever is expedient for a Christian’s knowledge. So that even this one book alone of David’s songs had been sufficient truly to instruct a man in the righteousness of God… O the wonderful and marvelous strength of David’s harp. O the great and exceeding virtue of David’s songs… Would God that all men of honor would nourish such minstrels in their houses, as David’s, and that might sing unto them both at dinner and supper, yea and at all other times these most sweet and delectable songs of David… Would God also that all fathers and mothers, all masters and mastresses, would bring up their children and servants in the singing of these most godly songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s harp full of most delectable armony, newly stringed and set in tune by Theodore Basille</cite>, (London, 1542), ‘To the right honorable Sir. George Broke, Lord Cobham’, no page numbers. Theodore Basille was a pseudonym for Thomas Becon (1512-1567), the English reformer.</span></figcaption>

</figure><figure class="quote" id="q-9951d0f71a" data-kw="">
<blockquote><p>Christ and his disciples sang psalms: the Church in her purest ages used it, yea when persecution hindered the more public service of God, they sung Psalms before day… [likely referring to Pliny’s letter]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover</cite>, (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ., p. 21</span></figcaption>

</figure><figure class="quote" id="q-4f75f98945" data-kw="">
<blockquote><p>He would have us cheerful, he commandeth us to rejoice evermore; and, is any merry, ‘let him sing’ (James 5:13), but one of the songs of ‘Sion’ [Ps. 137:3]: only let no corrupt communication proceed out of your mouths; but that which is good to the use of edifying, that it may minister grace to the hearers. Sing Psalms, Hymns, &amp; spiritual Songs, singing with a grace in your hearts to the Lord (Col. 3:16). To such songs the spirit of grace commeth flying: the bees come to aromatical and sweet things, the swine will to the mire: to obscene and meritricious songs and discourses, the devil’s swarm, let them only use and love them, who love their company.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover</cite>, (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ., p. 38-9</span></figcaption>

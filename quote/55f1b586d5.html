<main class="wrap"><figure class="quote" id="q-55f1b586d5" data-kw="">
<blockquote><p>Christianity will indeed accomplish many useful things in this world, but if it is accepted in order to accomplish those useful things it is not Christianity. Christianity will combat Bolshevism; but if it is accepted in order to combat Bolshevism, it is not Christianity: Christianity will produce a unified nation, in a slow but satisfactory way; but if it is accepted in order to produce a unified nation, it is not Christianity: Christianity will produce a healthy community; but if it is accepted in order to produce a healthy community, it is not Christianity: Christianity will promote international peace; but if it is accepted in order to promote international peace, it is not Christianity. Our Lord said: “Seek ye first the Kingdom of God and His righteousness, and all these things shall be added unto you.” But if you seek first the Kingdom of God and His righteousness in order that all those other things may be added unto you, you will miss both those other things and the Kingdom of God as well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (New York: MacMillan, 1923), 152.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-586625ff3c" data-kw="">
<blockquote><p>4. It being the custom then to cover the faces of those that were put to any great shame, a man that shall vail his head and face does thereby take reproach unto himself. … 5. …As custom makes it a shame to her to be shaven, so also to be unvailed. (Note, that this was a changeable custom, and is contrary now with us). …

13. The signification of being uncovered, being by custom a note [of] superiority, judge in yourselves whether such be decent for a woman at the church’s prayers. …

14. And when common custom has made the wearing of hair at length the note of the female sex, does not nature itself tell you, that it is a shame for a man to be so like a woman? (when God forbids us so much as to be clothed as women, to confound the sexes, which must needs be visibly distinguished). …

15. But use tells us that for women to let their hair grow out at length is a signification of modesty, as a kind of covering, and so is decent to them. …

16. But if any will contentiously dispute against what I say, though I would make no greater a matter of such things than the nature of them requires, let this answer suffice to resolve sober minds: The custom of all the Churches is against women’s being uncovered, as an unseemly thing; and you should not easily be different from all the Churches in a matter which depends on the signification of an action, which use and common opinion must interpret. We that must be as concordant as we can, must not affect dissimilitude.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical</cite>, ... (1685), on 1 Cor. 11, n.p.</span></figcaption>

586625ff3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/586625ff3c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=4.%20It%20being%20the%20custom%20then,we%20can%2C%20must%20not%20affect%20dissimilitude&amp;text=4.%20It%20being%20the%20custom%20then%20to%20cover&amp;text=concordant%20as%20we%20can%2C%20must%20not%20affect%20dissimilitude" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-183d7cc39f" data-kw="">
<blockquote><p>I do not know all the things that will happen when the great revival sweeps over the Church, the great revival for which we long. Certainly I do not know when that revival will come; its coming stands in the Spirit’s power. But about one thing that will happen when that blessing comes I think we can be fairly sure. When a great and true revival comes in the Church, the present miserable, feeble talk about avoidance of controversy on the part of the servants of Jesus Christ will all be swept away as with a mighty flood. A man who is really on fire with his message never talks in that feeble and compromising way, but proclaims the gospel plainly and boldly in the presence of every high thing that is lifted up against the gospel of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Facing the Facts Before God”</cite>, (1931).</span></figcaption>

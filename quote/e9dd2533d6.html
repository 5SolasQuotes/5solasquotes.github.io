<main class="wrap"><figure class="quote" id="q-e9dd2533d6" data-kw="">
<blockquote><p>2. In that place, Mt. 25, it is showed to whom, not for what the reward shall be given: good works are required as a condition in those which are to be saved, not as a meritorious cause of their salvation: [David] Pareus: for in the same place our Savior shows the original and fountain of their salvation, ‘Come ye blessed of my Father, inherit the kingdom prepared for you, from the foundations of the world’: their salvation then depends upon the free and gracious election of God, not upon their works. [Anthony] Faius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Six-fold Commentary upon Romans (Cambridge: Legge, 1611), on Rom. 2, 5. Controversies, 3rd Controversy</cite>, p. 134</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5de6d2b83" data-kw="">
<blockquote><p>Moreover, when Scripture intimates that the good works of believers are causes why the Lord does them good, we must still understand the meaning so as to hold unshaken what has previously been said—viz. that the efficient cause of our salvation is placed in the love of God the Father; the material cause in the obedience of the Son; the instrumental cause in the illumination of the Spirit, that is, in faith; and the final cause in the praise of the divine goodness. In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works. What precedes in the order of administration is called the cause of what follows. For this reason, he sometimes makes eternal life a consequent of works; not because it is to be ascribed to them, but because those whom he has elected he justifies, that he may at length glorify (Rom. 8:30); he makes the prior grace to be a kind of cause, because it is a kind of step to that which follows. But whenever the true cause is to be assigned, he enjoins us not to take refuge in works, but to keep our thoughts entirely fixed on the mercy of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/calvin.html">Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, Book 3, ch. 14, section 21 tr. Beveridge</cite></span></figcaption>

<blockquote><p>3. The stream of the Sinai-Covenant runs much upon doing, and perfection of doing… partly to instruct them, that though God intended not their works and obedience as an antecedent condition requisite to their justification; yet He intended them as a consequent condition and qualification in justified persons, as fruits of true faith, and the way towards the attainment of the promises.</p></blockquote>

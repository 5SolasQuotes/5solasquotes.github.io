<main class="wrap"><figure class="quote" id="q-f665082f5d" data-kw="">
<blockquote><p>Man is endowed with reason, and the human reason cannot rest satisfied with a mere collection of separate truths, but wants to see them in their mutual relationship, in order that it may have a clearer understanding of them… There seems to be a lurking fear that the more we systematize the truth, the farther we wander from the presentation of it that is found in the Word of God. But there is no danger of this, if the system is not based on the fundamental principles of some erring philosophy, but on the abiding principles of Scripture itself. God certainly sees the truth as a whole, and it is the duty of theologian to think the truths of God after Him. There should be a constant endeavor to see the truth as God sees it, even though it is perfectly evident that the ideal is beyond the grasp of man in his present condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to Systematic Theology</cite>, (Grand Rapids: Baker, 1979), 15.</span></figcaption>

<blockquote><p>Reformed moral philosophers in the period of early orthodoxy (ca. 1550–ca. 1650) continue a medieval tradition of engaging moral questions in conversation with Aristotle’s Nicomachean Ethics, and they often address the moral status of self-love in connection with the virtue of friendship. There is broad agreement among these authors that self-love is not only not necessarily sinful, but that some kinds of self-love are morally good and that self-love is the source and rule for love of one’s neighbor. Lambert Daneau’s Ethices Christianae, however, stands in a more complex relationship to this consensus.</p></blockquote>

</figure><figure class="quote" id="q-39f5b803b8" data-kw="">
<blockquote><p>But in none of its normal uses is ‘beautiful’ a metaphor, even if, like many a metaphor, it ranges over indefinitely many categories of object. So why do we call things beautiful? What point are we making, and what state of mind does our judgement express? There is an appealing idea about beauty which goes back to Plato and Plotinus, and which became incorporated by various routes into Christian theological thinking. According to this idea beauty is an ultimate value—something that we pursue for its own sake, and for the pursuit of which no further reason need be given. Beauty should therefore be compared to truth and goodness, one member of a trio of ultimate values which justify our rational inclinations. Why believe p? Because it is true. Why want x? Because it is good. Why look at y? Because it is beautiful. In some way, philosophers have argued, those answers are on a par: each brings a state of mind into the ambit of reason, by connecting it to something that it is in our nature, as rational beings, to pursue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre</cite>, (Oxford University Press, 2011) 180 pp. ToC, p. 2</span></figcaption>

<blockquote><p>First in general; It is demanded how a man should and ought to forgive an injury? Answer: In forgiveness there be four things: The first is forgiveness of revenge, that is of requiting evil for evil, either by thought word or deed. This must always be practiced. For vengeance is not ours, but the Lord’s, and great reason then that we should ever-more forgive in regard of revenge and hatred. This the apostle teaches, when he says, 1 Cor. 13:5, Love is not provoked, it never thinks, much less speaks or does, evil. The second is forgiveness of private punishment; which is, when men return punishment for injuries done in way of requital; and this must always take place with us, because as vengeance itself, so also punishment in way of revenge is God’s alone. The third is, forgiveness of judgment, when we judge an injury done to be an injury. This judgment we are not bound to forgive unto men. For we may with good conscience judge a sin and a wrong to be as they are. And yet notwithstanding, if a man make satisfaction for the wrong done, then there ought to be forgiveness, even in regard of judgement. The fourth is forgiveness of satisfaction. This we are not alway[s] bound to remit, but we may with good conscience, alway[s] require satisfaction where hurt is done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Legat: Univ. of Cambridge, 1606), bk. 3, ch. 3, question 1, ‘How may a man carry himself in respect of injuries and offences done unto him?’, pp. 492-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

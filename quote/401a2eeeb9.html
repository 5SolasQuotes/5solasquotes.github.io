<blockquote><p>Now be pleased to observe how I further express it.

1. If Transubstantiation has place, the natural Faculty which God has given us, whereby to distinguish one Substance from another, this Faculty deceives us in the notice it gives us of the Eucharist.

2. If the natural Faculty whereby we distinguish one Substance from another, be mistaken on the Subject of the Eucharist, nothing hinders but that it may be the fame on other Substances.

3. If the natural Faculty, whereby we discern the Substances, has no certainty, the Proofs for Christian Religion be of no weight.

You see, Sir, that forming my Argument in this manner, your Distinctions are beside the purpose, and altogether fruitless. Wherefore you cannot defend yourself but in denying some of the Propositions of which it consists; but which of the three can you deny? Not the first, I suppose; For, in fine, if Transubstantiation has place, The Sacrament of the Eucharist is not Bread nor Wine, but our Saviour’s proper Body and Blood. Yet the natural Faculty whereby we discern the Substances from one another, whatever that is, and whatever name we give it, this Faculty tells us, that ’tis not the Body and Blood of Christ, but Bread and Wine.

If you doubt of this; shew this Sacrament to a Man indued only with those Faculties which Nature has given us, and who has never received any supernatural assistance, to a Jew, or to a Mahometan or Pagan: Ask him what it is, and you’ll see how little he will hesitate to answer you, it’s Bread and Wine.

If you still doubt of this, desire a Priest to mix a consecrated Host amongst others unconsecrated; Employ then all your natural Faculties to distinguish that which is the Body of Christ from the rest, which is mere Bread; You’ll find all your care here to no purpose.

It’s then certain, that the natural Faculty, whereby we discern Substances, affirms plainly the Eucharist to be Bread and Wine, and therefore deceives us, if your Belief be true. Thus my first Proposition labours under no difficulty. And the second is no less certain than the first. For, in fine, if the natural Faculty, whereby we distinguish one Substance from another, may take the Body of Christ for Bread and Wine, there will be no deceit, of which ’twill not be capable, there being nothing in the World more discernible, and subject to less mistakes, than an human Body on one hand, and a morsel of Bread, and some drops of Wine on the other.

I have only then to prove my third Proposition, which is in effect the only one, which appears to have need. Yet is it certain, I shall have little trouble to make you agree with me in it. It saith, That the certainty with accompanies the Acts of the natural Faculty, and makes us distinguish the Substances; That this Certitude, I say, is the Foundation of the Proofs of Christianity, and that we cannot solidly establish the truth of this Holy Religion, if the Senses may deceive us in the reports they make of these kind of Objects.

I conceive nothing more certain than this Proposition. In effect, we agreed in our first Conference, That the Proofs of Christian Religion depends on the Truth of certain Facts, which we never saw, but which are attested to us by Persons whose Testimony ought not to be suspected by us. Yet it will reasonably be so, if we be not in a capacity to discern certainly particular Substances. And this will clearly appear, if we run through the most important of these Facts.

The most considerable, and the most decisive, is without difficulty, being our Saviour’s Resurrection; for the whole depends hereon. If this Fact be false, the Gospel is but a mere Romance; and if it be true, it cannot be denied but God has declared himself hereby in the most authentic manner in the World, in favour of our Holy Religion. And the Apostles were chiefly sent to attest the Truth of this Fact; and hence it is, That they so often seem to affect (as it were) the title of Witnesses of their Master’s Resurrection.

But ’tis very considerable, That the Apostles were not present at our Lord’s Resurrection. He was not in the Sepulchre when these holy Men arrived there; and they found only the Funeral Linen wherewith his Body was wrapped. They knew not then our Saviour was risen, by seeing him come out of the Tomb, and as they beheld Lazarus; but they gathered it from two other Facts, of which they were certain, having already seen the first, and seeing then actually the second. The one was his Death, and the other his Life. They were sure our Lord had expired on the Cross; That his Side was pierced with a Spear, that they might be certain of his Death. They knew that he was buried, and consequently could not have the least suspicion that he was not really dead. They saw him afterwards alive, and walking, acting, and speaking, whence they concluded in the clearest manner in the World, and the least liable to mistake, that he was effectually risen.

It’s then plain, that the Truth of Christ’s Resurrection depends on one hand, in knowing whether he died; and on the other, whether he lived after his Death. But what certainty can there be of either of these two Facts, if there be none in the judgment we make of Substances? These two Facts are equally contested. The Basilidians denied heretofore the first, and the Mahometans deny it to this day, both affirming, ’twas not our Saviour Christ, but Simon the Cyrenian that was crucified by the Jews. The Jews have ever denied the second. They say, it’s very true, our Saviour died on the Cross, but that he never rose again, and that what the Apostles related of it, was a mere Fable.

If we may be deceived in these kind of Objects, what can we oppose to either of these Enemies of the Truth? How shall we convince either the Basilidians, or Mahometans, That it was Jesus, and not Simon who expired on the Cross? How shall we persuade the Jews the Apostles were not deceived in imagining they saw him alive and risen? Will not both one and the other have grounds to tell us we have no certainty for what we affirm? The Turks will tell us, That seeing we may be so easily deceived in the discerning of Substances, it’s very likely the Jews took Simon for Jesus Christ. The Jews will answer, the Error was not theirs, but that the Apostles took some Spirit, or living Man, for their Master. And as to us, we have nothing convincing to oppose against one or the other.</p></blockquote>

<blockquote><p>And let not that move you which is pretended; that such ceremonies as kneeling in the holy Supper, conduceth much to stir up piety, and to avoid contempt: that forewarning of the Apostle hath taken deep impression in our hearts, That such things have a shew of wisdom in will-worship and humility: but in effect are of no worth. Such things have the appearance of wisdom, but not the reality thereof. What? came not such a thought into our Saviour’s mind? Why then sat he after the ordinary custom of the country?

Why enjoined he not kneeling? Next, what if some other should appoint for greater humility and submission of mind, that we should come with sack-cloth and ashes to the holy Supper? Yea, if another should appoint, that we ought to come with ropes about our necks, that by this sign they might openly declare their extreme unworthiness, and that they had deserved death, as the servants of Benhaded came unto the King of Israel? And in end, what shall be the end, if this door shall once be opened? therefore we must not pass from the Primitive worship.

But wherefore then, may some say, doe your selves passe from the Primitive way? Why stand they in the French Kirks at the Lord’s Supper? Why sit ye in the Netherlands? And why do ye not lean every where? The reformed Kirks have their answer ready: When we come to eat and drink at Table, it is all one, whether according to the custom of our country, we lean, sit, or stand; in none of these gestures is Religious worship placed: but to receive meat kneeling, is no where usual.

But that juggling enemy, who can transform himself into a thousand shapes, after he hath brought in kneeling, can remove a Table: for what hath kneeling to do with a Table? And having once removed a Table, can easily bring in an Altar: and then at last persuade to offer there a sacrifice for the living, and for the dead.</p></blockquote>

But wherefore then, may some say, doe your selves passe from the Primitive way? Why stand they in the French Kirks at the Lord’s Supper? Why sit ye in the Netherlands? And why do ye not lean every where? The reformed Kirks have their answer ready: When we come to eat and drink at Table, it is all one, whether according to the custom of our country, we lean, sit, or stand; in none of these gestures is Religious worship placed: but to receive meat kneeling, is no where usual.

But that juggling enemy, who can transform himself into a thousand shapes, after he hath brought in kneeling, can remove a Table: for what hath kneeling to do with a Table? And having once removed a Table, can easily bring in an Altar: and then at last persuade to offer there a sacrifice for the living, and for the dead.”

<blockquote><p>It is very certain that kneeling at the Lord’s table was unknown in the Christian Church for a number of centuries after the apostolic age. Indeed, in the second, third, and following centuries, it was accounted unlawful even to kneel on the Lord’s day; this posture being reserved for days of fasting and humiliation. This is asserted by Tertullian; and the Council of Nice passed a solemn decree to the same amount, because on that day is celebrated the joyful remembrance of our Lord’s resurrection. This posture, both of public prayer on the Lord’s day, and of receiving the communion, was invariably standing. The proof of this is so complete as to preclude the possibility of doubt.

The most ardent friends of kneeling do not pretend, so far as is now recollected, to find any example of this posture, in the whole history of the Church, prior to the thirteenth century. That is, not until the Papacy had reached the summit of its system of corruption. And, accordingly, in the Greek Church, which separated from the Latin, before the doctrine of Transubstantiation arose, kneeling at the communion is unknown. In short, kneeling at the Lord’s table was not introduced until Transubstantiation arose; and with Transubstantiation it ought, by Protestants, to have been laid aside. When men began to believe that the sacramental elements were really transmuted into the body and blood of the Redeemer, there was some colour of apology for kneeling and adoring them. But when this error was abandoned, that which had grown out of it ought to have been abandoned also.</p></blockquote>

<blockquote><p>Vers. 23. For I have received of the Lord that which also I delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread,

24. And when he had given thanks, he brake it, and said, Take, eat, this is my body which is broken for you: this do in remembrance of me.

That he may correct these errors; First he sets down the institution of the Sacrament, to vers. 27. and then he exhorts them to, and teaches them the lawful use of this Sacrament, to the end. As for the institution of the Supper, he shews that the Lord Jesus being about to suffer, by way of Testament, set his seal to the Covenant of Grace, which by his mediation he entered into between God and the Church: Whereby the glorious memory of his death might be celebrated in the world, till his second coming, and might be delivered to the faithful, and being delivered, it might judicially confirm a right to his person, and the benefits of his sufferings, and a living virtue flowing from his death, resurrection, and exaltation, to the sanctification and salvation of Believers, and that by the symbols of this holy Banquet, and holy Communion with God, and amongst themselves.

To which end Christ sitting at Table with his Disciples, after the eating of the Paschal Lamb; First, Took Bread, and sanctified it by giving of thanks, brake, and gave it to his Disciples, commanding them to take and eat; further, he declared the Bread received and eaten, to be his body represented after a Sacramental manner, that it being given for our Redemption, and after a judicial manner, applied to us; and lastly, he commanded that his Disciples, or all the faithful should imitate this his action in the Church, in remembrance of him, who had paid the price of Redemption by the sufferings of his body.

Vers. 25. After the same manner also he took the Cup, when he had supped, saying, This Cup is the New Testament in my blood: this do you, as oft as ye drink it, in remembrance of me.

That which concerns the other part of the Supper follows: In the same Supper, (viz. after the Paschal Supper) when the Bread was distributed, Christ took the Cup with Wine, sanctified by the giving of thanks, gave it to the Disciples to drink; further concerning the Cup he declared, That it being taken and drunk, was that new Covenant of Grace, between God and the Church, established Sacramentally by his blood, i. e. As it is ratified on God’s part that gives, so it is confirmed on the believers part that receives, and judicially applied and sealed: Lastly, He commanded that his Disciples should frequently imitate him in this action, in remembrance of him, who had paid the price of Redemption for the Church by the shedding of his blood.

Vers. 26. For as often as ye eat this Bread, and drink this Cup, ye do shew the Lord’s death till he come.

And that we might acknowledge, that of two Elements, Bread and Wine, one Supper (frequently to be celebrated in the Church) ought to be made; the Apostle would have perpetuated in the Church, a public commemoration of our Lord’s death, by the often reiteration of this Sacrament, and that because Christ would not be present in his body with the Church, before the last judgement, by this Sacrament he would that the memorial of the Churches redemption, by his death, might be preserved and celebrated, until he come out of Heaven in the last day.</p></blockquote>

<blockquote><p>Amongst all the attempts of distinguishing the Acts of God’s Will in reference unto Christ, and Sinners, whatever I considered, I never found any more slight Atheological, and discrepant from the Truth, then this of Grotius.

To measure the Almighty by the Standard of a man, and to frame in the mind a mutable Idol, instead of the Eternal, Unchangeable God, is a Thing that the fleshly Reasonings of dark understandings are prone unto. Feigns the Lord in one Instant Angry, afterwards promising to cease to be so, then in another instant laying down his Anger, and taking up a contrary affection, and you seem to me, to do no less.

What it may be esteemed in Law, which was that Author’s faculty, I know not: but suppose in Divinity, that (notwithstanding the manifold Attempts of some …) the ascribing unto the most holy, things alien, and opposite unto his glorious nature, is by common consent, accounted no less then blasphemy: whither this be here don, or no, may easily appear. I hope then without the offence of any, I may be allowed to call those Dictates of Grotius to the Rule, and Measure of Truth.

1 Before the fore-sight of the Death of Christ (saith he) God is angry with Sinners, but not wholly averse from all ways of laying aside that Anger.

Answ. 1 That God should be conceived angry after the manner of men, or with any such kind of Passion, is gross Anthropomorphism; as bad, if not worse, then the assigning of him a bodily shape. The Anger of God is a pure Act of his Will, whereby he will effects and inflict the Effects of Anger. Now what is before the fore-sight of the Death of Christ, is certainly from Eternity. God’s Anger must respect either the purpose of God, or the Effects of it. The latter it cannot be, for they are undoubtedly all temporal. It must be then his purpose from Eternity to inflict punishment, that is the Effect of Anger.

This then is the First thing in the business of Redemption assigned by Grotius, unto the Lord. viz. He purposed from Eternity, to inflict punishment on Sinners: and on what sinners? even those, for whom he gives Christ to die, and afterwards receives into favour, as he expresseth himself. Behold here a Mystery of Vorstian Theology: God changing his eternal purposes. This Arminius at first could not down withal, inferring from hence, That the Will of God differed not from his Essence, that every act thereof, is, 1 Most Simple: 2 Infinite: 3 Eternal: 4 Immutable: 5 Holy. Reason itself would fain speak in this Cause, but that the Scriptures do so abound, many places are noted in the Margin. Ja. 1. 17. 2 Tim. 2. 19. Ps. 33. 9, 10, 11. Acts. 15. 18. &amp;c. may be added. A mutable god, is of the dunghill.</p></blockquote>

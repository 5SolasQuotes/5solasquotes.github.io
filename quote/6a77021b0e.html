<main class="wrap"><figure class="quote" id="q-6a77021b0e" data-kw="">
<blockquote><p>I despise the idea of receiving any doctrine merely because our fathers believed it; but I would require very strong evidence indeed to convince me, that the whole number of those judicious, and learned, and holy men, who lived during the space of a hundred and fifty years from the time of the Reformation, had all agreed in believing, teaching, publishing, and embodying in the confessions of their respective Churches, a doctrine [the establishment principle] utterly and obviously opposite to the Word of God, and subversive of the whole character, and prosperity of the Church. I would require stronger evidence by far than I will ever obtain, to convince me that there is any ecclesiastical body in our country — how much soever it may arrogate to itself the merit of new discoveries in religious truth — whose judgment will bear even for a moment to be compared with that of the venerable Assembly of Westminster.

The truth is, we live in an age distinguished for its boasting respecting its own illumination. The profound humility that graced the master minds of former days has departed with them; and now it is no unusual thing for the youth whose studies in theology have scarcely passed beyond the surface of its doctrines, to declare most promptly that, even on such subjects as the one before us, he has more knowledge than all his fathers, or the most learned divines of former days. For my own part, such veneration do I feel for the immense theological erudition displayed in the writings of many of those men who adorned the sixteenth and seventeenth centuries, that, although I would not adopt any of their sentiments simply because they were theirs, I am compelled to regard them as worthy of the profoundest deference and the most serious consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of Civil Establishments of Religion in Reformed Presbyterian</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51218dfecc" data-kw="">
<blockquote><p>They [false professors] do not esteem all of Christ. If Christ be truly precious to the soul, then all of Christ must be precious; not only his name, and offices, and sufferings, but also his ordinances, ministers, members, and government. You must esteem everyone of these.

Many esteem Christ in one thing, but not in another; they may delight in his mercy, but not in his holiness; they may love him as a priest to die for them, but not as a king to rule over them; they will not submit to the laws of his kingdom; they find no sweetness in his ordinances; they despise his servants, they do not love a whole Christ. It is a fancy of their own making; they think they esteem Christ, but they esteem him not as he hath set forth himself in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 257-58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-20c40102e8" data-kw="Creeds and confessions">
<blockquote><p>To this power belongs the making of public creeds and confessions, which are usually and by synods and presbyteries to preserve the unity and agreement of faith and reject errors. They do not have the same authority as the Scriptures, since they must be compared with and corrected by them. Yet they have even their own memorable weight and ought to be valued very highly by the pious. Both because they contain the sum and foundation of the Christian doctrine and are like barriers against the errors and corruptions which can injure religion. And because they are the bonds of ecclesiastical communion and formulas of consent which testify of the unity of faith and the agreement of churches with each other and are distinguished from unbelievers, as soldiers by marks or watchwords from their enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.5</span></figcaption>

</figure><figure class="quote" id="q-820cf352cf" data-kw="">
<blockquote><p>What now will you say to these things, that your Church is not the catholic Church, but a part of it only; and is only catholic, because of the catholic doctrine that she professes? But if this be true, wherefore then did your general council condemn it in John Hus, and burn him for that doctrine, which both yourself must confess to be true, and is agreeable to Scripture, Fathers, and your own Popes? …yet for all this, not only call ye [Romanists] your Church Catholic, because of the soundness of doctrine which ye suppose she professes, but also and specially to make the simple believe that there is no salvation out of her… Therefore ye call it the only true Church, and the Catholic Church: for out of the particular Church there is salvation, but out of the catholic Church there is no salvation.</p></blockquote>

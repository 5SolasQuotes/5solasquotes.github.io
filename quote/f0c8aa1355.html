<blockquote><p>Whereby He signifies that He has long ago looked that they should repent from the bottom of their heart and receive his grace into their heart. Moreover this place does plainly teach us that we cannot rightly receive Christ before He first offer Himself to be received of us. ‘I will enter in unto him and will sup with him, etc.’ The gentleness and mercy of the Lord is marvelous, which so willingly pardons so great injuries done unto Him by his servant, that forgetting all injuries, He does of his own accord offer pardon, and in sign of perfect reconciliation, He will gently come and sup with him. For men are wont by such tokens to renew friendship that is broken between them. But those whom Christ vouchsafes to be partakers of his table (as He vouchsafes all the faithful) He feeds their minds with spiritual dainties, whereby they shall be nourished unto eternal life, namely with righteousness freely given, quietness of conscience, and unspeakable joy, where with the godly are fed by the Holy Ghost, whereof also He has given a most excellent pledge, the holy comunion of his body and blood, which when we receive by faith, we have Him everlastingly dwelling with us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prælections upon the Sacred &amp; Holy Revelation of St. John</cite>, (1573), ch. 3, on verse 20, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d11313ad37" data-kw="">
<blockquote><p>1. That this offer is real. Christ does not deceive, or dissemble with sinners, but really He does desire they should have liberty. Men sometimes make offers of good things to one another, but they are not sincere in them. But it is not so with Christ; He is a real well-wisher to sinners’ souls. He has expressed it all the ways that can be desired. Would you believe his reality, if He does woo sinners? Why, so He does, Lk. 14:23, compel them to come in, viz. by importunate entreaty. Would you believe his reality, if He does wait for sinners? Why, so He does, Rev. 3:20, ‘Behold I stand at the door, and knock, etc.’ Would you believe his reality if He does weep for sinners? Why, so He does, He wept over Jerusalem, Lk. 19:41-42. Would you believe his reality if He does die for sinners? Why, so He did, Rom. 5:8. While we were yet sinners, Christ died for us. Nay, would you believe his reality if he should be damned for sinners? Why, so He was, though not in respect of the place, yet in respect of the pains of Hell: He was ;’made a curse for us,’ Gal. 3:13. What would you have Christ to say or do more than He has said and done, to convince you, that He would have sinners to be partakers of this freedom. Has He not said so in his Word? Has He not sealed it with his blood? Has He not accepted and embraced from time to time, whoever came unto Him? Does He not engage Himself by his faithful promise, to do so still to the end of the world, that He will in no wise cast out such as come to Him, Jn. 6:37. And yet what a wonder is it, that the world is so unbelieving still? and so hard to be persuaded, that Christ has any loving thoughts or purposes towards them? Oh this cursed unbelief, and hardness of heart, that is in men and women that makes them that they will not come to Christ that they might have life!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-ball.html">Nathanael Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Bondage &amp; Freedom, or a Treatise containing the Substance of Several Sermons</cite>, … from John 8:36 (London: Robinson, 1683), pp. 36–38 Ball (1623–1681) was an English, partial conformist presbyterian minister.</span></figcaption>

<blockquote><p>(5) This lamentation of Christ over impenitent Jerusalem teaches us also that man’s ruin is from himself? If after all Christ’s gracious invitations, all his unwearied forbearances, all his bitter and salt tears, Jerusalem will stil persist in her rebellious contempt of his gracious offers, how inexcusable is her sin, and inevitable her ruin? What will prevail upon her, if Christ’s tears and entreaties will not prevail? What can save her, if her Redemer’s grace and mercy save her not? What is it that keeps evangelic sinners from being saved? is it any defect in the object, or its revelation? is it mere simple ignorance, or impotence in the subject? No; but it is wilfull blindness and impotence: they shut their eyes and will not see; they bolt their hearts and will not open to Christ, who knocks at the door of the soul by many gracious invitations of his Gospel and Spirit. And do not such deservedly perish, who electively embrace their own ruin, and wilfully reject the things that belong to their peace, Mt. 23:37?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger</cite>, (London: Widdowes, 1679), bk. 1, ch. 9, pp. 68-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-65a5b050d8" data-kw="">
<blockquote><p>The second thing I shall say to persuade your heart to take Christ, freely promised and offered onto you, shall be this— will ye consider that there is willingness in the heart of Christ to take you. I shall give you these six things that speak out Christ’s willingness to receive you: 1st, Does He not command you to come and receive Him?… 2dly, He does regret and deeply resent it that they will not come. I think Christ never wept so bitterly as on that day when He wept over Jerusalem, that they would not embrace Him. Luke 19:42— If thou hadst known, even thou, at least, in this thy day, the things that belong unto thy peace; and John 5:40, Ye will not come unto Me that ye may have life. O what think ye can be the rise of this, that Christ should sorrow, because ye will not give up your hearts unto Him? Does He increase his gain when ye give Him your hearts? No, certainly; but He cannot endure the madness in you that ye should forsake your only gain. 3dly, Would you do Christ a joyful turn and make his heart glad?—embrace Him: this is clear, Luke 15:5, that when He finds the sheep that is going astray, He returns rejoicing. 4thly, I shall say more unto you—would ye make all the persons of the blessed Trinity to rejoice? Would ye make all the angels of heaven to sing? Would ye make all the saints that are round about the throne to exult for joy? Then give your hearts up to Christ and close with Him in the covenant of promise, according to that word, Cant. 6, last verse, ‘Return, return, O Shunamite. Return, return, that we may look upon thee.’ Four times that command is repeated, ‘return:’ and the great argument with which He backs it is, that all the persons of the Trinity may rejoice, ‘that we may look upon thee.’ 5thly, Consider how He has condescended to give Himself at a very low rate… Yea, 6thly, does not this speak an admirable willingness to have you? He is to give you that look… Lastly, That speaks Christ’s willingness to receive and take you, that He does not take the first refusal. O Christians that are now in Christ! if Christ had taken a hundred refusals from you, ye should never have been in heaven; but He waits for an answer, and does not take us at our first word; according to that word, Song 5:2, ‘I am wet (says He) with the drops of the morning, and my locks with the dew of the night.’ He was long knocking at her heart, and staid a long time there patiently, suffering all the injuries He could meet with. And I would only pose you:—Think ye that if one of the richest of you were suiting a very poor woman, and she refused you so many times, would your proud heart submit to take her? And yet how oftentimes has the precious heart of Christ submitted to so many affronts and refusals that we have given Him? I think, if it were possible, Christians would wink when first they behold Christ upon the day of their espousals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … (d. 1656; Aberdeen: King, 1839), pp. 142-43</span></figcaption>

— Andrew Gray, The Works… (d. 1656; Aberdeen: King, 1839), pp. 142-43">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+thing+I+shall+say+to+persuade+your+heart+to+take+Christ%2C+freely+promised+and+offered+onto+you%2C+shall+be+this%E2%80%94+will+ye+consider+that+there+is+willingness+in+the+heart+of+Christ+to+take+you.+I+shall+give+you+these+six+things+that+speak+out+Christ%E2%80%99s+willingness+to+receive+you%3A+1st%2C+Does+He+not+command+you+to+come+and+receive+Him%3F%E2%80%A6+2dly%2C+He+does+regret+and+deeply+resent+it+that+they+will+not+come.+I+think+Christ+never+wept+so+bitterly+as+on+that+day+when+He+wept+over+Jerusalem%2C+that+they+would+not+embrace+Him.+Luke+19%3A42%E2%80%94+If+thou+hadst+known%2C+even+thou%2C+at+least%2C+in+this+thy+day%2C+the+things+that+belong+unto+thy+peace%3B+and+John+5%3A40%2C+Ye+will+not+come+unto+Me+that+ye+may+have+life.+O+what+think+ye+can+be+the+rise+of+this%2C+that+Christ+should+sorrow%2C+because+ye+will+not+give+up+your+hearts+unto+Him%3F+Does+He+increase+his+gain+when+ye+give+Him+your+hearts%3F+No%2C+certainly%3B+but+He+cannot+endure+the+madness+in+you+that+ye+should+forsake+your+only+gain.+3dly%2C+Would+you+do+Christ+a+joyful+turn+and+make+his+heart+glad%3F%E2%80%94embrace+Him%3A+this+is+clear%2C+Luke+15%3A5%2C+that+when+He+finds+the+sheep+that+is+going+astray%2C+He+returns+rejoicing.+4thly%2C+I+shall+say+more+unto+you%E2%80%94would+ye+make+all+the+persons+of+the+blessed+Trinity+to+rejoice%3F+Would+ye+make+all+the+angels+of+heaven+to+sing%3F+Would+ye+make+all+the+saints+that+are+round+about+the+throne+to+exult+for+joy%3F+Then+give+your+hearts+up+to+Christ+and+close+with+Him+in+the+covenant+of+promise%2C+according+to+that+word%2C+Cant.+6%2C+last+verse%2C+%E2%80%98Return%2C+return%2C+O+Shunamite.+Return%2C+return%2C+that+we+may+look+upon+thee.%E2%80%99+Four+times+that+command+is+repeated%2C+%E2%80%98return%3A%E2%80%99+and+the+great+argument+with+which+He+backs+it+is%2C+that+all+the+persons+of+the+Trinity+may+rejoice%2C+%E2%80%98that+we+may+look+upon+thee.%E2%80%99+5thly%2C+Consider+how+He+has+condescended+to+give+Himself+at+a+very+low+rate%E2%80%A6+Yea%2C+6thly%2C+does+not+this+speak+an+admirable+willingness+to+have+you%3F+He+is+to+give+you+that+look%E2%80%A6+Lastly%2C+That+speaks+Christ%E2%80%99s+willingness+to+receive+and+take+you%2C+that+He+does+not+take+the+first+refusal.+O+Christians+that+are+now+in+Christ%21+if+Christ+had+taken+a+hundred+refusals+from+you%2C+ye+should+never+have+been+in+heaven%3B+but+He+waits+for+an+answer%2C+and+does+not+take+us+at+our+first+word%3B+according+to+that+word%2C+Song+5%3A2%2C+%E2%80%98I+am+wet+%28says+He%29+with+the+drops+of+the+morning%2C+and+my+locks+with+the+dew+of+the+night.%E2%80%99+He+was+long+knocking+at+her+heart%2C+and+staid+a+long+time+there+patiently%2C+suffering+all+the+injuries+He+could+meet+with.+And+I+would+only+pose+you%3A%E2%80%94Think+ye+that+if+one+of+the+richest+of+you+were+suiting+a+very+poor+woman%2C+and+she+refused+you+so+many+times%2C+would+your+proud+heart+submit+to+take+her%3F+And+yet+how+oftentimes+has+the+precious+heart+of+Christ+submitted+to+so+many+affronts+and+refusals+that+we+have+given+Him%3F+I+think%2C+if+it+were+possible%2C+Christians+would+wink+when+first+they+behold+Christ+upon+the+day+of+their+espousals.%E2%80%9D%0A%0A%E2%80%94+Andrew+Gray%2C+The+Works%E2%80%A6+%28d.+1656%3B+Aberdeen%3A+King%2C+1839%29%2C+pp.+142-43&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F65a5b050d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/65a5b050d8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=The%20second%20thing%20I%20shall%20say,upon%20the%20day%20of%20their%20espousals&amp;text=The%20second%20thing%20I%20shall%20say%20to%20persuade&amp;text=behold%20Christ%20upon%20the%20day%20of%20their%20espousals" rel="noopener" target="_blank">Read it online · Reformed Books Online</ <blockquote><p>‘Alas, this business is beyond my strength, I cannot change mine own heart; though there are encouragements and helps, I know not which way to go, nor how to plead them.’ Well, but is the Spirit of God able to quicken thee, and to teach thee, and to enable thee? He stands especially engaged, ’tis his immediate work to prevail upon the heart. Go to the Spirit, and beg of Him, that He would lead thee to the Father, and to Christ, that thou mayst have fellowship with the Father and the Son. ‘Alas, I cannot go unto the Spirit, I have so long resisted Him, so often grieved Him, with what face can I go? I am unworthy of his guidance.’ Well, but Jesus Christ stands engaged; and never speak of merit that day thou speakest of Christ. Go to Christ, and beg that He would send his Spirit into thy heart. Jesus Christ is thy Kinsman, he knows how to pity thee; and the Spirit of Grace is at his dispose. Oh then go to Christ. ‘Alas, I cannot go to Christ, I have no ability to go, nor so much as a will to move towards Him. I cannot go to Christ.’ Well, but the Father is engaged to draw thee, though thou canst not go; a man may be drawn, which has no natural willingness of his own. The Father stands engaged to change the will, and absolute promises are theirs that lay claim to them (provided they do not overthrow their own claim). Go therefore and tell the Father thy case.</p></blockquote>

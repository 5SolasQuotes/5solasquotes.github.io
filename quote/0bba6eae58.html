<main class="wrap"><figure class="quote" id="q-0bba6eae58" data-kw="">
<blockquote><p>Moreover, when a magistrate is not able to do some part of his office, as for example, being able to do the duties which are to be performed in peace, is insufficient for martial affair, yet no man refuses that which he is able to give because he is not able to do all that is required: Even so, endeavoring to our uttermost a sufficient ministry, I would think in the mean season that the good things they are able to give us may be taken at their hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’ (1584), pp. 12-13 in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bde6155957" data-kw="">
<blockquote><p>And to the angel of the church in Pergamos write… I know thy works, and where thou dwellest, even where Satan’s seat is: and thou holdest fast my name, and hast not denied my faith, even in those days wherein Antipas was my faithful martyr, who was slain among you, where Satan dwelleth. But I have a few things against thee, because thou hast there them that hold the doctrine of Balaam, who taught Balac to cast a stumblingblock before the children of Israel, to eat things sacrificed unto idols, and to commit fornication. So hast thou also them that hold the doctrine of the Nicolaitanes, which thing I hate. Repent; or else I will come unto thee quickly, and will fight against them with the sword of my mouth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-testament.html">New Testament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev.</cite>, 2:12-16</span></figcaption>

</figure><figure class="quote" id="q-9659be1e80" data-kw="">
<blockquote><p>But if you will indeed continue as I see that you have begun, I now declare to you beforehand that it will come to pass that what has happened to other disturbers of the Churches may happen also to you and to all your followers (if there should be any)… namely, that you may learn too late that you have harmed no one more than yourself.</p></blockquote>

</figure><figure class="quote" id="q-8d69d116db" data-kw="">
<blockquote><p>But if their sermons, liturgy or lives have any faults, being not idolatry, heresy, blasphemy or such as renders their whole worship and assembling unacceptable to God, I disown communion in any of those [lesser] faults, though I be present.</p></blockquote>

</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress. 2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do. 3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 6-7, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress. 2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do. 3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.”

<main class="wrap"><figure class="quote" id="q-237e92f553" data-kw="">
<blockquote><p>Original Sin standeth not in the following of Adam, (as the Pelagians do vainly talk;) but it is the fault and corruption of the Nature of every man, that naturally is ingendered of the offspring of Adam; whereby man is very far gone from original righteousness, and is of his own nature inclined to evil, so that the flesh lusteth always contrary to the spirit; and therefore in every person born into this world, it deserveth God&#x27;s wrath and damnation. And this infection of nature doth remain, yea in them that are regenerated; whereby the lust of the flesh, called in the Greek, &quot;Phronema Sarkos&quot;, which some do expound the wisdom, some sensuality, some the affection, some the desire, of the flesh, is not subject to the Law of God. And although there is no condemnation for them that believe and are baptized, yet the Apostle doth confess, that concupiscence and lust hath of itself the nature of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/original-sin.html">Original sin</a></span><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5bc9204dd7" data-kw="">
<blockquote><p>Bellarmine says that this inordinate concupiscence is not properly sin. What then? Shall we say it is improperly called sin, even though in the very principles of nature it chains and restrains man like a ferocious beast? Is this credible? Let Bellarmine believe such absurdities—we do not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Determinationes</cite>, Q. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/concupiscence.html">Concupiscence</a></span><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span></div>

</figure><figure class="quote" id="q-af97d5840f" data-kw="venial mortal">
<blockquote><p>It is well known that among the various divisions of sin, the papists press this beyond others, distributing sin into mortal and venial. Their design in this is not obscure (viz., to curry favor for the perfection of righteousness, supererogatory works, the merit of works and purgatory). The question therefore comes back to this—whether all sins per se and in their own nature are mortal (worthy of death and able justly to be so punished); whether some are mortal and some venial (not from the event and through grace, but in their own nature and according to the law). The latter our opponents hold; we maintain the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.1,6</span></figcaption>

</figure><figure class="quote" id="q-6c7ba3e091" data-kw="">
<blockquote><p>He, then, who admits not that all the desires of the flesh are sins, and that that disease of concupiscence, which they call a stimulus, is a fountain of sin, must of necessity deny that the transgression of the law is sin.</p></blockquote>

</figure><figure class="quote" id="q-e98e0aef43" data-kw="">
<blockquote><p>Scripture teaches that the Holy Spirit, in those whom He wishes to convert, first begins to mortify and to take away that corruption which He finds, so far as spiritual impulses and actions are concerned, in the unregenerate mind and will; then He begins to work and to bestow a new strength, ability, and efficacy in mind, will, and heart for beginning and performing spiritual actions.</p></blockquote>

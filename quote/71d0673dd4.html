<blockquote><p>…this sacrament requiring a self-examination going before (1 Cor. 11:28). Therefore a sermon of preparation is preached the day before, even as Christ prepared and dieted his guests with heavenly sermons preceding the action (as is clear, Luke 22:14,15; Mark 14:18-20; Matt 26:21-23; John 13:13-16). … The nature of the sacrament requires thanksgiving, and therefore in the afternoon [on the Lord’s Day] a sermon of thanksgiving is preached, which is also warranted from Matt 26:30.</p></blockquote>

<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VI &amp; VIII</cite>, pp. 35-37</span></figcaption>

</figure><figure class="quote" id="q-5825e88ff5" data-kw="">
<blockquote><p>Promulgation of a truth and Christian reproof are duties commanded by God; and yet are sometimes to be abstained from for scandals taken, by not only the weak, but also malicious. ‘Reprove not a scorner, least he hate thee,’ Prov. 9:8; ‘speak not in the ears of a fool; for he will despise the wisdom of thy words,’ Prov. 23:9. ‘Give not that which is holy unto dogs, neither cast ye your pearls before swine, lest they trample them under their feet and turn again and rent you,’ Mt. 7:6. Pro vitando scandalo cessat rigor disciplinae. ‘To avoid scandal the rigor of discipline ceases.’ To explain this, farther recourse must be had unto that old and golden rule, Affirmativa praecepta semper obligant, non ad semper. Affirmative precepts do always bind, but not to always; so that we are not bound to perform always what they enjoin but only Loco &amp; tempore debitis, when we have due time and place. Now as by the intercurrency of other circumstances, so especially by intercurrence of scandal, there may not be opportunity and seasonableness of doing what we are urged unto by some affirmative precepts; so these precepts may pro hic &amp; nunc, cease to be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper. Or a Brief &amp; Scholastical Debate of that Question which has so Wonderfully Perplexed Many, Both Ministers &amp; People: Whether or No the Sacrament of the Lord’s Supper may (according to Presbyterial Principles) be Lawfully Administered [by a Minister] in an un-presbyterated church, that is, a church destitute of ruling elders. Wherein the affirmative is confirmed… (London, 1650) Jeanes was an English presbyterian.</cite>, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

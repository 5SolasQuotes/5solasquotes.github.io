<blockquote><p>A careful cessationist case with exposition of relevant Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rowland-ward.html">Rowland Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Blessed by the Presence of the Spirit: The Authentic Charismatic Church Ref (New Melbourne Press, 1997) 96 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

— Rowland Ward, Blessed by the Presence of the Spirit: The Authentic Charismatic Church Ref (New Melbourne Press, 1997) 96 pp.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+careful+cessationist+case+with+exposition+of+relevant+Scripture.%E2%80%9D%0A%0A%E2%80%94+Rowland+Ward%2C+Blessed+by+the+Presence+of+the+Spirit%3A+The+Authentic+Charismatic+Church+Ref+%28New+Melbourne+Press%2C+1997%29+96+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe0461cc8a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e0461cc8a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/cessationism/#:~:text=A%20careful%20cessationist%20case%20with%20exposition%20of%20relevant%20Scripture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-008711bfe9" data-kw="">
<blockquote><p>Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 5, ‘Whether these prophets and prophesyings in the primitive church, 1 Cor. 14; 12:28; eph. 4:11; were extraordinary and not so to continue; or whether they are precedents for the preaching or prophesying of such as are neither ordained ministers nor probationers for the ministry’ in A Treatise of Miscellany Questions | Garnet Milne</cite>, p. 247:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.”

%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F008711bfe9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/008711bfe9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/cessationism/#:~:text=Thus%20a%20careful%20analysis%20of%20Gillespie%E2%80%99s,that%20conclusion%20concerning%20any%20of%20them&amp;text=Thus%20a%20careful%20analysis%20of%20Gillespie%E2%80%99s%20wider%20thought&amp;text=to%20allow%20that%20conclusion%20concerning%20any%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0f063b57d5" data-kw="">
<blockquote><p>9. Heaven and Hell and the Last Judgement are nowhere, but within a man, in a spiritual manner; Heaven is in this life. Antinomians, as Town and Saltmarsh hold that in this life we have as much of Heaven in full and complete possession as the glorified in Heaven. … 11. Under David George is the time of perfection, when all ordinances shall be useless, so Antinomians, ut supra. … 14. The Resurrection of the Dead, the blowing of the last trumpet, the shout of the archangel, the coming of Christ to judge all are to be taken in a spiritual sense of the doctrine and discipline of David George, as Hymenaeus and Phyletus said; see hereafter the parallel between Antinomians and Libertines; so said Libertines (Calvin Against the Libertines, ch. 22, p. 458). … 18. The body or flesh sinneth, but not the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist... (London, 1648) | pt. 1</cite>, ch. 4, ‘Of David George’ (a founder of Familism)</span></figcaption>

</figure><figure class="quote" id="q-5b319948f7" data-kw="">
<blockquote><p>But that gift of healing, like the rest of the miracles, which the Lord willed to be brought forth for a time, has vanished away in order to make the new preaching of the gospel marvelous forever. Therefore, even if we grant to the full that anointing was a sacrament of those powers which were then administered by the hands of the apostles, it now has nothing to do with us, to whom the administering of such powers has not been committed. … Therefore, they make themselves ridiculous when they boast that they are endowed with the gift of healing. The Lord is indeed present with his people in every age; and He heals their weaknesses as often as necessary, no less than of old; still He does not put forth these manifest powers, nor dispense miracles through the apostles’ hands. For that was a temporary gift, and also quickly perished partly on account of men’s ungratefulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles in The Library of Christian Classics, vol. 21 (Philadelphia: Westminster Press, 1960), vol. 2, bk. 4</cite>, ch. 19, sections 18-19, p. 1467</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

ike%20the%20rest&amp;text=quickly%20perished%20partly%20on%20account%20of%20men%E2%80%99s%20ungratefulness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b57b819614" data-kw="">
<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: … 144. That there are revelations and visions in these times, yea to some they are more ordinary, and shall be to the people of God, generally within a while. 145. That the gift of miracles is not ceased in these times, but that some of the sectaries have wrought miracles, and miracles have accompanied them in their baptism, etc. and the people of God shall have power of miracles shortly. 146. That anointing the sick with oil by the Elders praying over them, with laying on of hands [James 5], is a Church-ordinance for Church-members that are sick, for their recovery. 147. ‘Tis ordinary for Christians now in these days, with Paul to be rapt up to the third Heavens, and to hear words unutterable, and they cannot well have assurance of being Christians, that have not found and had experience of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or, A Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time… (London, 1646)</cite>, pp. 15, 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Catalogue of the Errors, Heresies, Blasphemies, is as follows: … 144. That there are revelations and visions in these times, yea to some they are more ordinary, and shall be to the people of God, generally within a while. 145. That the gift of miracles is not ceased in these times, but that some of the sectaries have wrought miracles, and miracles have accompanied them in their baptism, etc. and the people of God shall have power of miracles shortly. 146. That anointing the sick with oil by the Elders praying over them, with laying on of hands [James 5], is a Church-ordinance for Church-members that are sick, for their recovery. 147. ‘Tis ordinary for Christians now in these days, with Paul to be rapt up to the third Heavens, and to hear words unutterable, and they cannot well have assurance of being Christians, that have not found and had experience of this.”

— Thomas Edwards, The First &amp; Second Part of Gangræna, or, A Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time… (London, 1646), pp. 15, 28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Catalogue+of+the+Errors%2C+Heresies%2C+Blasphemies%2C+is+as+follows%3A+%E2%80%A6+144.+That+there+are+revelations+and+visions+in+these+times%2C+yea+to+some+they+are+more+ordinary%2C+and+shall+be+to+the+people+of+God%2C+generally+within+a+while.+145.+That+the+gift+of+miracles+is+not+ceased+in+these+times%2C+but+that+some+of+the+sectaries+have+wrought+miracles%2C+and+miracles+have+accompanied+them+in+their+baptism%2C+etc.+and+the+people+of+God+shall+have+power+of+miracles+shortly.+146.+That+anointing+the+sick+with+oil+by+the+Elders+praying+over+them%2C+with+laying+on+of+hands+%5BJames+5%5D%2C+is+a+Church-ordinance+for+Church-members+that+are+sick%2C+for+their+recovery.+147.+%E2%80%98Tis+ordinary+for+Christians+now+in+these+days%2C+with+Paul+to+be+rapt+up+to+the+third+Heavens%2C+and+to+hear+words+unutterable%2C+and+they+cannot+well+have+assurance+of+being+Christians%2C+that+have+not+found+and+had+experience+of+this.%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+The+First+%26+Second+Part+of+Gangr%C3%A6na%2C+or%2C+A+Catalogue+%26+Discovery+of+Many+of+the+Errors%2C+Heresies%2C+Blasphemies+%26+Pernicious+Practices+of+the+Sectaries+of+this+Time%E2%80%A6+%28London%2C+1646%29%2C+pp.+15%2C+28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb57b819614.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b57b819614.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/cessationism/#:~:text=The%20Catalogue%20of%20the%20Errors%2C%20Heresies,found%20and%20had%20experience%20of%20this&amp;text=The%20Catalogue%20of%20the%20Errors%2C%20Heresies%2C%20Blasphemies%2C%20is&amp;text=have%20not%20found%20and%20had%20experience%20o

<main class="wrap"><figure class="quote" id="q-0ef156bd79" data-kw="">
<blockquote><p>Every Christian man and woman are by faith mystically united unto Christ and made all members of one body, whereof Christ is the head. Now therefore as Christ by the power of his Godhead, when He was dead and buried, did overcome the grave and the power of death in his own Person, so by the very same power by means of this spiritual conjunction does He work in all his members a spiritual death and burial of sin and natural corruption… So let a man that is dead in sin be cast into the grave of Christ, that is, let him by faith but touch Christ dead and buried, it will come to pass by the virtue of Christ’s death and burial, that he shall be raised from the death and bondage of sin to become a new man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles… (Cambridge: Legatt, 1595)</cite>, pp. 295-96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-edb24c840e" data-kw="">
<blockquote><p>1. In respect of its first moment regeneration comes about in another way than in respect of its progression. Regarding the first moment of regeneration man is purely passive; regarding its progression man cooperates with God. … 13. In this life regeneration is by degrees: these degrees do not only concern regeneration by itself but also the subjects. Some people are more regenerate than others; hence older people are more regenerated than the young ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy (1644), ch. 14, ‘On Regeneration’</cite>, pp. 239, 243</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-7ea1d869d0" data-kw="">
<blockquote><p>3… Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this [faith] man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/colloquy-of-regensburg.html">Colloquy of Regensburg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anthony Lane, Justification by Faith in Catholic-Protestant Dialogue. An Evangelical Assessment, tr. Anthony Lane (London: 2002), Appendix 1, pp. 233-34 This statement was affirmed by both the Reformed and Romanist sides.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

tion%20of%20righteousness%20and%20countless%20other%20gifts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-974b7f2675" data-kw="">
<blockquote><p>Regeneration is God’s action in elect sinners, redeemed, actively justified and called through Christ, by which He substantially (realiter) turns them from corruption to new life (or holiness), that they may henceforth live unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics ed. Bizer, trans. Thomson (1950; Wipf &amp; Stock, 2007), ch. 20, ‘Calling’, section 17, pp. 518-9, citing Voet, II, 436 &amp; 449</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

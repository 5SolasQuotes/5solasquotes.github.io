<main class="wrap"><figure class="quote" id="q-9a8abecf28" data-kw="">
<blockquote><p>[The 2nd Commandment is practically broken] In respect of bodily posture, as if there were more religion in one posture than in another; as in receiving the Lord’s supper kneeling, or praying in such and such a posture, except in so far as it is decent, and otherwise rightly regulate[d] by rules of prudence and nature’s light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments (d. 1658; Napthali, 2002), 2nd Commandment</cite>, p. 109</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40215b5bd6" data-kw="">
<blockquote><p>And as for his [Jesus’] gesture in teaching, that He sat down, it was their custom in these times, and a testimony of the respect that is due to them that carry the mind of God; and we find Christ sometime[s] preach[ing] sitting, Lk. 4:20-21, sometime standing, Jn. 7:37, and at this time his weariness with night watching might call for it. Nor is it much to be stood upon which of these gestures men use in preaching, but preachers ought in these things [to] accommodate themselves to seek the benefit of hearers and that they be heard and seen by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, According to John (London, 1657) | on John</cite>, 8:1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-559c8504b3" data-kw="">
<blockquote><p>It is not an unfair generalization from the facts to say that kneeling [in prayer] was the prevalent attitude of the sixteenth century, that sitting became that of the seventeenth, and standing of the eighteenth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-leishman.html">Thomas Leishman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes, pp. 88-89 in The Westminster Directory (Edinburgh: William Blackwood, 1901)</cite>, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is not an unfair generalization from the facts to say that kneeling [in prayer] was the prevalent attitude of the sixteenth century, that sitting became that of the seventeenth, and standing of the eighteenth.”

— Thomas Leishman, Notes, pp. 88-89 in The Westminster Directory (Edinburgh: William Blackwood, 1901), p. 89">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+not+an+unfair+generalization+from+the+facts+to+say+that+kneeling+%5Bin+prayer%5D+was+the+prevalent+attitude+of+the+sixteenth+century%2C+that+sitting+became+that+of+the+seventeenth%2C+and+standing+of+the+eighteenth.%E2%80%9D%0A%0A%E2%80%94+Thomas+Leishman%2C+Notes%2C+pp.+88-89+in+The+Westminster+Directory+%28Edinburgh%3A+William+Blackwood%2C+1901%29%2C+p.+89&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F559c8504b3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/559c8504b3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/posture-in-prayer/#:~:text=It%20is%20not%20an%20unfair%20generalization,seventeenth%2C%20and%20standing%20of%20the%20eighteenth&amp;text=It%20is%20not%20an%20unfair%20generalization%20from%20the&amp;text=of%20the%20seventeenth%2C%20and%20standing%20of%20the%20eighteenth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-087cf1b950" data-kw="">
<blockquote><p>Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words… With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship, in Three Parts in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Parkhurst, 1684), pt. 3, section 6</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d08307c6d3" data-kw="">
<blockquote><p>…that which Dr. Jackson answers the Papists about this fashion (Origin of Unbelief, sect. 4, ch. 35): ‘We use the book only as a complement of the civil act, whereby we give satisfaction unto men, or as a visible resemblancer, partly to bystanders or spectators, whose eyes by this means may become as true witnesses as their ears that such protestations have been made, partly unto him that makes them, who will be more wary and circumspect what he avouches and protests, when he perceives his speeches must be sealed with such remarkeable circumstances as they cannot be often recalled to his own and other’s memory. To the same end men of honourable place and calling use to lay their hands upon their hearts when they take a solemn oath.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit against Human Ceremonies in God’s Worship… (1633), ch. 3 | section 31, ‘Concerning Swearing upon a Book’</cite>, pp. 357-58</span></figcaption>

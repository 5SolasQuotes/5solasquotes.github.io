<main class="wrap"><figure class="quote" id="q-77acffe85c" data-kw="">
<blockquote><p>For they are monsters and no men, that are unnatural toward their parents; and especially they which do not only neglect and despise them, but also beat and uncourteously handle them. Such fellows doth the Lord command to be slain, as people unworthy to see the light, because they forget and will not acknowledge, that by means of their parents the came into the world. “He that curseth father or mother,” saith the Lord, “let him die the death.” And again: “He that striketh his father or mother, let him die the death.” [Exodus 21:15, 17]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 287-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1106e0da0a" data-kw="">
<blockquote><p>[1.] We do not speak of parents that are so far deprived of judgment, that they are not fit to determine this matter; nor, [2.] Such as have divested themselves of the natural affection of parents, and entertaining an ungrounded prejudice against some of their children, are endeavoring to expose them to ruin, that they may show more kindness to others. These forfeit that right, which is otherwise founded in nature. [3.] If parents, by refusing to comply with the desire of their children, plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them. [4.] The case is vastly different, when applied to children who are so far from being dependent on their parents, that they depend on them. Nevertheless, in this case, some deference and respect ought to be paid to them; and as it is the children’s duty, it may be their interest so to do; since we can hardly suppose, that parents, who depend on their children, would oppose their happiness, in an affair that is apparently contrary to their own interest, if they did not think that they had sufficient reason for it; which ought to be duly weighed, that it may be known, whether their advice is expedient to be complied with, or no. And if in this, or any other instance, children are obliged to act contrary to the will of their parents; they ought to satisfy them, that it is not out of contempt to their authority, but a conscientious regard to the glory of God; and that it is conducive to their happiness, in the opinion of the wisest and best of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-80d066d2da" data-kw="">
<blockquote><p>The British Baptists held to a high view of the magistrate and followed largely in the Magisterial Protestant tradition in terms of constitutional monarchy, the two kingdoms, and, to varying degree, the magistrate’s care of religion… the English Baptist theologian John Gill exemplifes this political perspective. Judging from his statements about the duties of a magistrate, that include securing right religious worship in the commonwealth and enforcing virtue using the two tables of the Decalogue, it is apparent that Gill would not have agreed with Jeferson’s wall of separation, nor with the Baptists who followed him. The “frst care of government” is of divine things. Though the Second London Confession does not stipulate the magistrate’s responsibility for care of religion, it does not argue against it, and so Gill is not in violation of this doctrinal standard for maintaining this view held by the Magisterial Reformers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ian-clary.html">Ian Clary</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The First Care of Government’</cite>, (2024), pp. 4-23, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-e6f3e4d566" data-kw="">
<blockquote><p>Observe first that he says, “he will cling to his wife” and not “wives.” Next, he says, “the two will be one flesh.” Here polygamy is manifestly condemned, which so effects one flesh that it also pulls man apart into many fleshes. Indeed, it is also true that, after the first institution, that custom prevailed among the fathers. But now I do not dispute how this was done rightly. I say with Christ that it was not this way from the beginning, but neither is anything corrected better than when it is led back to the first institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 4210-4214.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

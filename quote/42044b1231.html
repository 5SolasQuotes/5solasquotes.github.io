<main class="wrap"><figure class="quote" id="q-42044b1231" data-kw="">
<blockquote><p>Not only the works that we do in our own strength, or that we do before regeneration, or that we do without the merits of Christ, but all works, of whatever sort, are excluded from justification. This is so repetitively certain Scripture that proof is almost superfluous. Galatians 2:16 reads, “… nevertheless, knowing that a man is not justified by law-works [ἐξ ἔργων νόμου].” In no way is the reference here to works prescribed by one or another specific law, because the article is missing. All law-work as such is excluded from justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, ed. &amp; trans. by Richard B. Gaffin Jr. (Bellingham, WA: Lexham Press, 2012–16), 4.142</cite></span></figcaption>

</figure><figure class="quote" id="q-a906397c9a" data-kw="">
<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin. 2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29</cite>, p. 254</span></figcaption>

<blockquote><p>Question: But David grounds this redemption and blessing in the release of sins. Why then add you also the imputation of the sanctification that sticks in Christ, and his fulfilling of the law? Answer: What if I shold encounter thee with these texts: ‘Blessed are the clean in heart,’ ‘blessed are the blameless in the way,’ and such other like? wouldst thou gather here upon that the releasing of sins is excluded? I think not. So now and then sanctification is meant by the term of ‘justification’, because these two go never asunder. And why may I not make answer thus also? that sometimes there is mention made but only of the releasing of sins, not to the end to exclude all other pates that make men blessed, but because the rest are coverfly comprehended under it? And if thou wilt urge me yet further: I may also fitly answer that as the other are meant by the releasing of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Book of Christian Questions &amp; Answers… (London: How, 1574)</cite>, p. 57</span></figcaption>

</figure><figure class="quote" id="q-1ba5ff7aab" data-kw="">
<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>

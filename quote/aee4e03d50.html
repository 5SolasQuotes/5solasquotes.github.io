<main class="wrap"><figure class="quote" id="q-aee4e03d50" data-kw="">
<blockquote><p>Vers. 19. Now we know that what things soever the Law saith, it saith to them that are under the Law; that every mouth may be stopped, and all the world may become guilty before God.

He prevents an Objection, lest any man should elude the force of the testimonies before recited, as if they belonged but to some few, and those certain impious men, who lived in the times of David or Isaias. Here he shews that the common disposition of mankind is taxed, which live under the Law, or the Covenant of Works, and not under grace; and hereupon these fore-cited sentences of the Law, are directed against all men, under the state of corrupt nature, chiefly the Jews; whereupon a threefold conclusion is inferred. First, from hence every mouth is stopped, lest any man should glory in himself, or excuse himself in the judgement of God. Another conclusion, Hence the whole world is made liable to condemnation, and obnoxious to punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-20ee32ad01" data-kw="">
<blockquote><p>XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, (4.4.48), trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 188.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

ine · Heidelblog</a></div>
</figure><figure class="quote" id="q-aafc608860" data-kw="">
<blockquote><p>As to his legal relations, the Scriptures clearly teach that, at his creation, he was put under the equitable Covenant of Works for a certain probationary period. This just constitution provided (a) everlasting well-being on condition of perfect obedience, and (b) everlasting ill-being on condition of disobedience. Now, although under that covenant man failed, it is evident that, nevertheless, both of these conditions must be maintained in their integrity. To relax them would be to violate the word of God, to dishonour his law, and to render his promises and his threatenings alike unworthy of respect. The penalty, when once incurred, can be preserved inviolate only by being executed. The promise of everlasting well-being can be truthfully granted only when the condition of perfect obedience has been fulfilled. Suffering a righteous penalty entitles no criminal to a reward; and to offer eternal blessedness to such, on terms denied to unfallen Adam and to all angels, would be placing a premium on sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement</cite>, (Philadelphia, PA: Presbyterian Board of Publication, 1867), 26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-5dd4f05610" data-kw="">
<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sacred Doctrine of Divinitie</cite>, (London, 1599, repr. 1613), 9. [Spelling modernized]</span></figcaption>

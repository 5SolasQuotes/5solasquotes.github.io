</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5636806dec" data-kw="Sovereignty Author of sin Satan">
<blockquote><p>We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.</p></blockquote>

</figure><figure class="quote" id="q-47c06a0653" data-kw="">
<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 139</span></figcaption>

</figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>

</figure><figure class="quote" id="q-f36de3147a" data-kw="Author of sin Satan">
<blockquote><p>Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.</p></blockquote>

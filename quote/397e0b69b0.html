<main class="wrap"><figure class="quote" id="q-397e0b69b0" data-kw="">
<blockquote><p>XXXIII. As for the Reformed theologians known as Remonstrants or Arminians in Belgium, they recognize no other divine concurrence with secondary causes than that general and indifferent one [such as described under Molinism above], which is determined by the concurrence of the secondary cause. This can be seen in Jacob Arminius, from whom all others derive their name. In his dispute against Perkins, he not only affirms that this divine concurrence is indifferent in itself but also that it contributes nothing to the will of the creature by which it might be inclined, helped, or strengthened to act. He asserts that the created will has God’s concurrence in its power, ready and available, before it acts (in Anti-Perkins, p. 733). Similar teachings are found in Grevinchovius against Amesius (sect. 32, p. 368) and Corvinus against Tilenus (ch. 9, p. 354).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, p. 344 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bfe47d0801" data-kw="">
<blockquote><p>We reject likewise the fictions of the Pelagianizers: Concerning the conditioned will, concerning the decree of velleity or desire. Concerning Middle or conditioned Knowledge, by which that desired determination is said to be foreseen. Concerning the intention of conditioned concourse concomitantly into the effect—and consequently concerning the simultaneous concourse and egress of grace and free will, which is really independence and primacy, pre-running and predetermination of the second cause. Concerning universal sufficient grace, and according to it a salvific calling, whose presupposition is the grace of universal redemption, reconciliation, and confederation. Which fictions have been sufficiently sifted by the authors just cited, partly also by the Dominican theologians and other genuine followers of Thomas, whom you will see alleged in those authors passim [throughout], and especially in Sylvius the Douai theologian, in his treatise On the Motion of the First Mover. Of our men, Ferri in his Orthodox Scholastic and its Defense against the Jesuit Perrin has rendered most useful service here. The Various Dissertations on the [End] Term of Life edited by Beverovicio can also be compared.</p></blockquote>

</figure><figure class="quote" id="q-b6acb3a8f5" data-kw="">
<blockquote><p>…consider the three main approaches in the history of theology to understanding God’s causal relationship to the world, as Alfred Freddoso has usefully classified them. Occasionalism holds that God alone is the cause of everything that happens, so that there are no true secondary causes in nature. For example, on this view, one billiard ball which makes contact with another during a game of pool does not in any way cause the other to move. Rather, God causes the second ball to move on the occasion when the first makes contact with it. Mere conservationism holds that while God maintains natural objects and their causal powers in existence at every moment, they alone are the immediate causes of their effects. On this view, the one billiard ball really does cause the other one to move, and God has nothing to do with it other than keeping the ball and its causal powers in being. He is not in any direct way the cause of the second ball’s motion. Finally, concurrentism is a middle ground position which holds on the one hand (and contrary to occasionalism) that natural objects are true causes, but on the other hand (and contrary to mere conservationism) that God not only maintains natural objects and their causal powers in being, but also cooperates with them in immediately causing their effects. On this view, the one billiard ball really does cause the other ball to move, but only together with God, Who acts as a concurrent cause. Concurrentism became the standard view within the Scholastic tradition, because the other views are philosophically and theologically problematic. For example, occasionalism veers in the direction of pantheism, while mere conservationism veers in the direction of deism. We can understand how if we recall the Scholastic dictum that “a thing operates according as it is” If, as occasionalism holds, only God alone ever operates or brings about effects, and natural objects operate not at all, then it is difficult to see how they exist at all, at least in any robust way. God alone would seem to be real; natural objects would be like mere fictional characters in the mind of a divine Author. By contrast, if, as mere conservationism holds, natural objects can at least operate or bring about effects apart from God’s immediate causal action, then it seems that they could also exist apart from his immediate causal action. The world would in that case not depend for its continued existence on God’s conserving action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 4, ‘Natural Theology Must Be Grounded in the Philosophy of Nature, Not in Natural Science’, pp. 76-77</span></figcaption>

</figure><figure class="quote" id="q-bc0effdd91" data-kw="">
<blockquote><p>And so that immediate and per se motion of the first cause upon the secondary cause is, so to speak, the secondary cause’s own and natural motion, absorbed into its very being and operation — so that in the common and accepted view, both causes operate through one single and individual action, and nothing is done by one that is not done by the other. Therefore it is not to be thought that the contingent and free mode of acting of the secondary cause is overturned or destroyed by the pure concurrence of the first cause antecedent in nature to the concurrence and determination of the secondary cause — since this is intimately absorbed into the very nature of the secondary cause itself. I speak plainly. To be determined by God is as much as to be determined by itself, since that determination pertains to the natural mode of operating of the secondary cause. This is urged and explained: because that antecedence of nature, since it is not a real priority, nor one of time, nor of a temporal instant, posits and imprints nothing antecedently in the secondary cause before it operates. Rather, it is a priority altogether conjoined with the action of the secondary cause, such that they exist simultaneously and operate in the same instant of time. The priority of nature is only on the side of the first cause, by reason of the subordination and dependence of the secondary cause upon the first — which all call consequential subsistence — so that just as the secondary cause depends upon the first in being, so also it depends upon it in operating. Thus it is true to say: the secondary cause operates because God operates, and not the converse…</p></blockquote>

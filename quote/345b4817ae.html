<blockquote><p>2. In accepting us as righteous in Christ, who died for our sins to reconcile us unto God; and therefore sometimes he is said to be made righteousness to us, 1 Cor. 1:30, and we are said to be made the righteousness of God in Him, 2 Cor. 5:21, that is, we have the effect of his sufferings, as if we had suffered in person; for they were undergone in our stead and for our sakes, and the fruit of it given to us by God Himself.</p></blockquote>

</figure><figure class="quote" id="q-488385444a" data-kw="">
<blockquote><p>Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-96a67ed428" data-kw="">
<blockquote><p>Christ was subject to the law in two different senses. The first was the active sense, in that he perfectly fulfilled everything that was prescribed in the ceremonial or moral law. He was circumcised on the eighth day according to the law, being presented in the temple in order to fulfill the law of purification, to which, however, he was not himself subject. Likewise, he kept the feasts and rituals commanded in the law and fulfilled the moral law to such a degree that … he did not commit any sin, nor was any falsehood found in his mouth. He performed this perfect obedience to the law so that he could pass it on to us. The result is that his fulfilling of the law is imputed to us, who have not kept it perfectly, as if we had done so. He was also subject to the law in a passive sense, when he took on himself the punishment and offence of the law in order to deflect the wrath of the eternal Father from us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/georg-major.html">Georg Major</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentarius in Divi Pauli Epistolam ad Ephesios</cite>, (Wittenberg, 1552), as quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (IVP Academic, 2011), p. 135</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-35afe7c913" data-kw="">
<blockquote><p>Which [Scriptural phrases] all signify one thing: that is, his suffering in the flesh. For nowhere in the Scriptures of God is our righteousness particularly attributed to any other action of Christ. Neither can it be collected to consist in any other action, except out of the general word of ‘obedience’. Neither is there any necessity (if the matter be well weighed) to add anything to the sufferings of Christ in the matter of our righteousness. Yea moreover, it would appear by diverse grounds of the truth of God that nothing can or may be added thereunto in the matter of our righteousness.</p></blockquote>

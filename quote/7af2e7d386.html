<blockquote><p>Bucer believed that in a face-to-face dialogue it would be easierto persuade one’s opponents of the truth… Bucer knew well that written documents were subjected to differing interpretations. His preference for public dialogue also influenced many of his written works, which adopted the literary genre of a fictional dialogue. In these works, he would exemplify how men of differing opinions could peaceably and gradually arrive at agreement on the truth. This gradual approach was illustrative of his pedagogy for persuading and teaching others the truth of God’s word… As Stupperich has asserted, for Bucer unity would result not from compromise but from the clarification of misunderstandings that enable a unity in the truth.</p></blockquote>

</figure><figure class="quote" id="q-b92e6d2c2d" data-kw="">
<blockquote><p>Fundamental opinions are those which by a usual and proper name are called ‘Articles of Faith’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London: A.M., 1654), bk. 1, ch. 8, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Fundamental opinions are those which by a usual and proper name are called ‘Articles of Faith’.”

— Edward Leigh, A System or Body of Divinity... (London: A.M., 1654), bk. 1, ch. 8, p. 92">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFundamental+opinions+are+those+which+by+a+usual+and+proper+name+are+called+%E2%80%98Articles+of+Faith%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+System+or+Body+of+Divinity...+%28London%3A+A.M.%2C+1654%29%2C+bk.+1%2C+ch.+8%2C+p.+92&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb92e6d2c2d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b92e6d2c2d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=Fundamental%20opinions%20are%20those%20which%20by,name%20are%20called%20%E2%80%98Articles%20of%20Faith&amp;text=Fundamental%20opinions%20are%20those%20which%20by%20a%20usual&amp;text=and%20proper%20name%20are%20called%20%E2%80%98Articles%20of%20Faith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b8961fb64f" data-kw="">
<blockquote><p>Before the rise of Luther, the Albigenses and others acted rightly in making a negative separation (for they did not communicate with the idolatry of the Papists), although before condemnation, persecution, and expulsion, they did not make a positive separation by forming another new visible Church. Where there are some fundamental errors in the Church, it is not immediately permissible to make a positive separation. Christ commanded to hear those who sit in Moses’ seat [Mt. 23:1-3], although they taught some things that overturned the foundation and rejected Christ. Nor does separation from an Orthodox Church due to some errors within it separate from Christ; for only separation from Orthodox faith separates from Christ, which opposes internal communion with Christ and the Church. But external separation alone is not internal separation; indeed, he who is thus separated retains internal communion with the Church in Orthodox faith, and therefore with Christ. We deem weak and feeble the argument of the Remonstrants [Arminians], who refuse to separate from Arians, Socinians, Anti-Trinitarians, Anabaptists, for they do not dare to consign all such to hell or ban them from heaven; as though it were not the Word of God, but our judgment concerning the salvation and damnation of men, that is the rule of our communion with the Church! If, however, we are compelled, in external communion, to communicate with errors,¹ even non-fundamental ones, in a Church not erring in fundamentals, then it is permissible to make a partial separation, not a total one; a negative, not a positive one.² The reason is that it is never lawful to communicate with the unfruitful works of darkness: Eph. 5:11. ¹ [Note this phrase is ambiguous. It may mean being present amidst secondary errors, or being compelled to personally sin.] ² [Yet denominationalism, “by forming another new visible Church,” is a positive separation.] … the Papists do not possess true faith; they err in the fundamental truths. They do not have the Holy Scripture with us as the sufficient canon of faith and morals… They nullify the mediatorial office of Christ by adding other mediators and saviors to Him. They deny the satisfaction of Christ, provided by His bloody death and the obedience rendered on our behalf, as they attempt to satisfy God for sins by themselves and others… Thus, there can be no union in faith with them, for they subvert that faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI (1639-1642; 1668; Monergism, 2024), ch. 1, ‘Of the Holy Scripture’, pp. 83-85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

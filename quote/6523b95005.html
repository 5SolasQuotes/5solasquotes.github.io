<main class="wrap"><figure class="quote" id="q-6523b95005" data-kw="">
<blockquote><p>Neither is that after-consent by acceptance and submission which Mr. [John] Robinson speaks of [with reference to a pastor and his hearers] so slight a matter for this purpose as he would make it. For as in wedlock, the after-consent of parents or parties does often make that a lawful state of marriage which before and without that was none: and in government, acceptance and submission does make him a king which before was a tyrant, though in their nature these actions be rather consequences than causes of that calling; so is it [sometimes] betwixt minister and people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0299065bfb" data-kw="">
<blockquote><p>4. Those who, in baptism, according to the common condition of infants, were truly justified, regenerated, and adopted, when arrived at years of discretion, do not continue justified, regenerated, or adopted as adults unless by repentance, faith, and the renunciation promised they fulfil their vow taken upon them at baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Regeneration &amp; the Final Perseverance of the Saints. A letter of</cite>, … Davenant… to Dr. Samuel Ward… tr. J. Allport (d. 1641; London: Macintosh, 1864) 30 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

— John Davenant, Baptismal Regeneration &amp; the Final Perseverance of the Saints. A letter of… Davenant… to Dr. Samuel Ward… tr. J. Allport (d. 1641; London: Macintosh, 1864) 30 pp.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+Those+who%2C+in+baptism%2C+according+to+the+common+condition+of+infants%2C+were+truly+justified%2C+regenerated%2C+and+adopted%2C+when+arrived+at+years+of+discretion%2C+do+not+continue+justified%2C+regenerated%2C+or+adopted+as+adults+unless+by+repentance%2C+faith%2C+and+the+renunciation+promised+they+fulfil+their+vow+taken+upon+them+at+baptism.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Baptismal+Regeneration+%26+the+Final+Perseverance+of+the+Saints.+A+letter+of%E2%80%A6+Davenant%E2%80%A6+to+Dr.+Samuel+Ward%E2%80%A6+tr.+J.+Allport+%28d.+1641%3B+London%3A+Macintosh%2C+1864%29+30+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0299065bfb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0299065bfb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=4.%20Those%20who%2C%20in%20baptism%2C%20according,vow%20taken%20upon%20them%20at%20baptism&amp;text=4.%20Those%20who%2C%20in%20baptism%2C%20according%20to%20the&amp;text=fulfil%20their%20vow%20taken%20upon%20them%20at%20baptism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0a974cba97" data-kw="">
<blockquote><p>…yet we find [in the N.T.] whole families baptized, and several saints greeted with the Church of God in such an house, which may as reasonably infer the children and servants of such families to have been baptized, and to have been reckoned Church-members; and we may as reasonably believe there were children in some of their houses and families who were baptized, as they [baptists] can confidently deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathaniel-taylor.html">Nathaniel Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Paidobaptismos Orthobaptismos</cite>, ... (London, 1683), Argument 6, p. 51 Taylor was reformed.</span></figcaption>

</figure><figure class="quote" id="q-529d8f82c6" data-kw="">
<blockquote><p>Unless” (says Dr. [Jacob] Andreas [a Lutheran]) “regeneration be always united to baptism, and remains in such as are baptized, how should the troubled consciences of those be eased and comforted, who because they feel not in themselves any good motions of God’s Holy Spirit, find none other refuge but the Word and sacraments, especially the sacrament of baptism? Now this remedy would be of small force except it be opposed against those imaginations which the Devil casts into a troubled heart; yea, except it taught such that God is greater than our heart, who in baptism has not only offered us the adoption of sons, but hath indeed bestowed the same upon us: as it is said by Christ, ‘He that believeth and is baptized, shall be saved.’ And by Paul, ‘Ye which are baptized, have put on Christ.’ David being armed with the like comfort from his circumcision, feared not to join battle with that great giant Goliath: and if this were not so, it must needs follow that baptism were nothing else but an idle ceremony, and also the persons of the Trinity would be thought liars. Wherefore those afflicted men, when Satan assaults them, must resist him with these words: ‘Depart from me Satan, thou hast neither part nor portion in the inheritance of my soul, because I am baptized in the name of the holy Trinity, and so am truly made the son of God by adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Order which Mr. Theodore Beza used in Comforting Afflicted Consciences’ appended to William Perkins, A Golden Chain</cite>, … (Cambridge, 1600)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/529d8f82c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Unless%E2%80%9D%20%28says%20Dr.%20%5BJacob%5D%20Andreas%20%5Ba,the%20son%20of%20God%20by%20adoption&amp;text=Unless%E2%80%9D%20%28says%20Dr.%20%5BJacob%5D%20Andreas%20%5Ba%20Lutheran%5D%29%20%E2%80%9Cregeneration&amp;text=truly%20made%20the%20son%20of%20God%20by%20adoption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a8d35535aa" data-kw="">
<blockquote><p>The Word of God, Gen. 17:23, acknowledges that one may have a right to the first seal of the covenant, and that coram Deo, that has no saving grace. Ishmael was thirteen years old, verse 25, when he was circumcised, and therefore of age to answer for himself; yet Ishmael had no saving grace, neither was he within the covenant of Isaac–the covenant of absolute and certain salvation, from which he was excluded, verse 19. Yet Ishmael has a right to the first seal of the covenant coram Deo, as is most most evident from the immediate command of God, that he that was born in Abraham’s house, must needs be circumcised, verse 12, and accordingly Abraham understood it. He proceeds upon the command of God to circumcise Ishmael first of all. Now what is it that giveth one right to any ordinance but the command, or at least more evidently than the command of God Himself? And that right which we have from God’s command, is doubtless a right coram Deo, and in his sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-fullwood.html">Francis Fullwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Visible Church</cite>, … (1658) as quoted by Thomas Boston, Works, 6:130</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<main class="wrap"><figure class="quote" id="q-8a0b6b92ac" data-kw="">
<blockquote><p>That former grace may be called the grace of our vocation; this grace is common to all that are called, elect and reprobate. But the latter grace in our effectual calling may be called the grace of faith, appertaining only to the elect; for it is given only to those that are predestinated to life everlasting to believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 38, ‘Concerning the Free Grace of God’, p. 269</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“That former grace may be called the grace of our vocation; this grace is common to all that are called, elect and reprobate. But the latter grace in our effectual calling may be called the grace of faith, appertaining only to the elect; for it is given only to those that are predestinated to life everlasting to believe.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-498d9d8ee6" data-kw="">
<blockquote><p>If you look into 1 Peter 3:19-20, you there find that Christ “went and preached unto the spirits in prison; which sometime were disobedient, when once the long-suffering of God waited in the days of Noah.” The meaning of which is, that in the days before the flood, Christ by his Spirit strove [Gen. 6:3] with the disobedient and rebellious sinners in the ministry of Noah, who then were living men and women as we are, but now are “spirits in prison,” that is, damned souls in hell, for their disobedience…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Knocking at the Door of Sinners’ Hearts; or, A Solemn Entreaty to Receive the Savior and His Gospel in This the Day of Mercy</cite>, (New York: American Tract Society, 1850), p. 97. This quote was compiled by Tony Byrne.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-e9f097d1e8" data-kw="">

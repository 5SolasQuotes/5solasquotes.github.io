<main class="wrap"><figure class="quote" id="q-eb630e1512" data-kw="">
<blockquote><p>That the Sabbath has existed from the beginning; that it was given to man in Paradise — an institution not for the Jews only, but for man and for all time — never since abolished or superseded; that it was re-published from Sinai, not as a mere ceremonial appointment, but as part of that moral law which is of immutable obligation; and that at the time of the resurrection of Christ, while for a very sufficient reason, the day of observance was changed, the commandment continued still in force, linked through all succeeding ages with new associations, as the memorial of finished redemption as well as of creation.

Such is substantially the doctrine of all our Presbyterian Churches, as set forth in those [Westminster] standards which we all acknowledge, and notwithstanding what has recently occurred, may be looked upon as the common belief of Presbyterian Scotland still, regarding the grounds of the obligation of the Sabbath. In England, as well as in Scotland, it was the commonly received opinion, not only among the Puritans, but among the most distinguished divines of the Church of England, that from the beginning of the world to the present time, the Sabbatic law has continued to be the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath; The Grounds of its Obligation, and its Proper Place in Relation to Christian Life and Duty in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

630e1512.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb630e1512.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/01/william-symington-ii-on-the-institution-of-the-sabbath-at-creation-and-the-sabbatarianism-of-the-church-of-england/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4e00f766c2" data-kw="">
<blockquote><p>Calvin: In the English Liturgy as you [the English exiles at Frankfurt] do describe unto me, I spy out many tolerabiles ineptias, ‘tolerable unfit things:’ By which two words I express thus much, that there was not that purity which were to be wished, which errors could not immediately the first day be corrected (Cum nulla subesset manifesta impietas ferenda ad tempus fuisse). Seeing there was therein contained no manifest impiety, these things† should have been born withal for a time; Epistle 200, fol. 336.</p></blockquote>

</figure><figure class="quote" id="q-eaad6f599b" data-kw="">
<blockquote><p>…the Protestant Reformation marked a sharp break in the pattern of ecclesiastical finance wherever it took root… by the end of 1525, however, he [Martin Luther] was assuring the elector of Saxony that the revenues of the church belonged to the state, and that after proper payments to clergy, schools and charity, the surplus could be employed by the prince. Huldrych Zwingli and Martin Bucer, on the other hand, held that church property belonged to the religious community and that the secular ruler merely administered it. … The Calvinist church was more fully separated from past modes of finance than its Lutheran and Anglican counterparts… Elsewhere [other than Geneva], Calvinism was often a minority faith and had to depend on the voluntary support of its members… The Dutch Reformed Church was funded by the magistracy after several false starts in the 1570’s, but not at a particularly generous level.</p></blockquote>

</figure><figure class="quote" id="q-a2fcaf6134" data-kw="">
<blockquote><p>It would be tedious, dearly beloved, were I to recount every episode from the history of the Psalms, especially since it is necessary now to offer something from the New Testament and confirmation of the Old, lest one think the ministry of psalmody to be forbidden inasmuch as many of the usages of the Old Law have been abolished. For those things that are carnal have been rejected, circumcision for example, and the observance of the [Jewish] Sabbath, sacrifices, discrimination among foods, as well as trumpets, citharas, cymbals, and timpana (all of which are now understood to reside in the bodily members of man, and there better to sound).</p></blockquote>

</figure><figure class="quote" id="q-f0574d4095" data-kw="">
<blockquote><p>…2 Chron. 29 [vv. 29-30], out of which no more can be drawn but that the people worshipped while the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72</span></figcaption>

<blockquote><p>XXVIII… Gathering new churches by way of separation from others, or gathering assemblies without the consent of the lawful pastors who had the charge of the people of those assemblies, is a sin and schism in all these cases following:

1. In general, when the laws, practices or persons of the church which they separate from give them no sufficient cause of a departure.

2. In general, when in the judgment of true reason, according to the notable evidence of the case, the said assemblies are likely to do more hurt than good.

3. When such assemblies are gathered in opposition to some truth which the separaters would thereby disown (e.g. infant-baptism, the lawfulness of [some] set-forms of praise or prayer, or any sound doctrine) or [they are gathered] for the profession and propagation of some heresy or error (as Antinomianism, Popery, etc.).

4. When such churches are gathered by men that have no true fitness and calling for the sacred ministry or the work which they undertake.

5. When they are gathered by the pride of the ministers that would thereby unduly set up themselves and draw away disciples after them, or by their covetousness, seeking not the good of the flock, but the fleece, not them, but theirs, not serving the Lord Jesus, but their own bellies: or when gathered, by the pride of the people that unjustly think those that they separate from [are] men unworthy of their communion, and say to them, ‘Come not near to us; we are holier than you,’ Isa. 65:5.

6. When they are gathered by a quarrelsome passion, falling out with the pastors and people whom they separate from. The parting of Paul and Barnabas [Acts 15:36-40] had some evil in it.

7. When they are gathered to encourage and strengthen a sinful faction or party, or when men separate from others for fear of being censured by such a party, as Peter did withdraw from the gentile Christians lest he should displease the erroneous Jews, Gal. 2.

8. When it is done out of a proud overvaluing of men’s own opinions, or some odd singularity whereby men cannot bear those that are not of their mind, or whereby they would fain be more conspicuous as more orthodox and wise than others.

9. When it is done mistakingly to set up some wrong course of Church government or worship (as that the people may have the power of the keys or of examining and judging all admitted members, or that Papal government or the mass may be introduced, [or for] enthusiastical disorderly talking by pretended inspiration, by ignorant uncalled men, or to introduce such traditions and superstitions as the Papists use, etc.).

10. When it is done upon a false conceit that a man’s presence with any Church that has known error or faults in doctrines or worship is guilty [of] approving them; and therefore that they must separate from all such.

11. When they separate out of an unruliness of spirit, because they will not be governed by their lawful pastors in lawful things, as time, place, order, etc. or because a minor part in elections is over-voted by the major part and cannot have their wills.

12. When they separate out of a profaneness of mind, not enduring the power of the preacher’s doctrine or the holiness and discipline of the Church, but would be licentious, while they would be called religious. All these are unlawful separations and assemblings.

13. Yet that which is unlawful as to the principle, end and manner secundum quid [‘according to that’], is not always unlawful simply and in the thing itself, for a proud, covetous, turbulent person may sinfully do a lawful thing. XXIX… When pastors by concord or magistrates by laws have settled lawful circumstances or accidents of Church order or worship, or discipline, though they be in particular but human institutions, it is sinful disobedience to violate them without necessary reason, e.g. parochial order, associations, times, places, ministers, maintenance, Scripture-translations, etc. XXX… When able, faithful pastors are lawfully set over the assemblies by just election and ordination, if any will causelesly and without right silence them, and command the people to desert them, and to take others for their pastors in their stead, of whom they have no such knowledge as may encourage them to such a change, we cannot defend this from the charge of schism, which puts a congregation on so hard a means of concord as to judge whether they are bound to that pastor that was set over them as Christ appointed, or must renounce him and take the other when they are commanded. So Cyprian in the case of Novatian says that he could be no bishop because another was rightful bishop before.</p></blockquote>

<blockquote><p>Other churches there are in the world which are not evidently guilty of the enormities in doctrine, worship and discipline before discoursed of. These all we judge to be true churches of Christ; and do hope that his promised presence is with them in their assemblies. Answerable hereunto is our judgment concerning their officers or rulers, and all their sacred administrations. It becomes us to think and believe that the one [their offices] have authority from Christ and that the other [their sacred administrations] are accepted with Him: For it is most unwarrantable rashness and presumption, yea an evident fruit of ignorance, or want of love, or secular private interest, when, upon lesser differences men judge churches to be no true churches and their ministers to be no true ministers, and consequently all their administrations to be invalid… But the validity or invalidity of the ordinances of Christ, which are the means of union and communion with Him unto all his disciples, depend not on the determination of things highly disputable in their notion, and not inconsistent with true Gospel-obedience in their practice… We stand to the judgment of Christ and his Word. We cannot but judge indeed that many Churches have missed, and do miss in some things the precise rules of their due constitution and walking; that many of them have added useless, superfluous rites to the worship of God among them; that there is in many of them a sinful neglect of evangelical discipline, or a carnal rule erected in the stead of it; that errors in doctrines of importance and danger, are prevalent in sundry of them; that their rulers are much influenced by a spirit of bitterness and envy against such as plead for reformation beyond their measure or interest; yet that hereupon they should all or any of them immediately forfeit their church-state, so as to have no lawful ministers, nor acceptable sacred administrations, is in itself a false imagination, and such as was never by us entertained.</p></blockquote>

— John Owen, A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672), ch. 3, pp. 84-86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COther+churches+there+are+in+the+world+which+are+not+evidently+guilty+of+the+enormities+in+doctrine%2C+worship+and+discipline+before+discoursed+of.+These+all+we+judge+to+be+true+churches+of+Christ%3B+and+do+hope+that+his+promised+presence+is+with+them+in+their+assemblies.+Answerable+hereunto+is+our+judgment+concerning+their+officers+or+rulers%2C+and+all+their+sacred+administrations.+It+becomes+us+to+think+and+believe+that+the+one+%5Btheir+offices%5D+have+authority+from+Christ+and+that+the+other+%5Btheir+sacred+administrations%5D+are+accepted+with+Him%3A+For+it+is+most+unwarrantable+rashness+and+presumption%2C+yea+an+evident+fruit+of+ignorance%2C+or+want+of+love%2C+or+secular+private+interest%2C+when%2C+upon+lesser+differences+men+judge+churches+to+be+no+true+churches+and+their+ministers+to+be+no+true+ministers%2C+and+consequently+all+their+administrations+to+be+invalid%E2%80%A6+But+the+validity+or+invalidity+of+the+ordinances+of+Christ%2C+which+are+the+means+of+union+and+communion+with+Him+unto+all+his+disciples%2C+depend+not+on+the+determination+of+things+highly+disputable+in+their+notion%2C+and+not+inconsistent+with+true+Gospel-obedience+in+their+practice%E2%80%A6+We+stand+to+the+judgment+of+Christ+and+his+Word.+We+cannot+but+judge+indeed+that+many+Churches+have+missed%2C+and+do+miss+in+some+things+the+precise+rules+of+their+due+constitution+and+walking%3B+that+many+of+them+have+added+useless%2C+superfluous+rites+to+the+worship+of+God+among+them%3B+that+there+is+in+many+of+them+a+sinful+neglect+of+evangelical+discipline%2C+or+a+carnal+rule+erected+in+the+stead+of+it%3B+that+errors+in+doctrines+of+importance+and+danger%2C+are+prevalent+in+sundry+of+them%3B+that+their+rulers+are+much+i </figure><figure class="quote" id="q-95eab27e0c" data-kw="">
<blockquote><p>Verse 5… But David was not the man he had appointed for this work, and therefore though the Lord commended David for this holy intention, as is evident, 1 Kings 8:18, ‘And the Lord said unto David my father, ‘Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart,” and made many gracious promises unto him at this time, vv. 10-12, etc. to testify how well He took it that he had such a purpose in his mind: yet withal He made known to him that He meant not that it should be done by him, but by his son… Verse 6… Though David’s intent was generally in itself good, insomuch that the Lord Himself commended him for it, as is manifest in that place before cited, 1 Kings 8:18, yet it was not without some mixture of error: for herein he failed, because he undertook to do it without any particular direction or warrant from God, led hereto only by the judgment of his own reason, that it was not fit God should dwell within curtains, when He dwelt in an house of cedar; and therefore though the Lord told him that his purpose was in the general commendable, yet withall He rejected his purpose and discovered thereby that he should have waited his leasure and direction, and disproved his reason…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Remaining Historical Part of the Old Testament</cite>, ... (Cambridge, 1646) Jackson (1593?-1666) was an English clergyman of strong presbyterian and royalist views; he was ejected in the Great Ejection of 1662. | on 2 Sam. 7, p. 361</span></figcaption>

<blockquote><p>3. Although it be true that He is in the Church, yet He is not confined unto any particular Church in the world since the days of Israel. He engaged Himself unto His people of Israel until the Messiah came; and He hath engaged Himself to return again unto them when the fullness of the Gentiles is brought in.

4. Although it be so, that He is not engaged unto any particular Church, yet there are some Churches have more ground to expect His abode with them than what other Churches have. And I take Britain and Ireland to be of that number, for the following reasons:—

(1.) I take Great Britain and Ireland to be a part of the ends of the earth that are given to Christ. “Ask of me, and I will give thee the heathen for thine inheritance, and the utmost parts of the earth for thy possession.” Besides it is the very parcel or plot of ground that He intended for that end or use; for the Lord did take possession of these lands beyond any other land since the apostolic age.

(2.) These lands have sworn away themselves unto the Lord most solemnly, singularly, and frequently. Seven times hath Scotland been sworn away unto the Lord, in little more than the space of an hundred years. I grant indeed, that these covenants have been broken, for which breach the Lord hath been plaguing these lands; and as there hath been no breach of covenant formerly like unto this, so I think there hath no plague come like that which we may now expect. And yet seeing there is still a party in the land who adhere to these covenants, and have given a testimony for them, and that party is and will be accounted to the Lord for a generation, or the holy seed and substance of the land; since this is the case, God and these witnesses will not part yet if they shall abide by and adhere to these covenants.

3. A ground of hope that God will not quit His interest in Scotland, England, and Ireland is, that there was no land or nation wherein the Lord’s work was carried to such a pitch, such a high pitch, as it hath been in them, since the days of the apostles. And do ye think that the Lord will eradicate and utterly overthrow that work? I think He will not.

The last ground I observe is this, that according to the text the Lord is in His Church in Britain and Ireland. And it is good token that He is yet amongst us and that “God will help her, and that right early.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guthrie.html">William Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon XVII in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

<blockquote><p>§34. II. So much for what is necessary to the being of the sacred office: Now what is necessary to the well-being. And indeed, though the essential unity of the Church lie not upon this, yet the peace and concord of it does, and that so much as that no other means without this will attain it: And the want of what is necessary ad bene esse in the ministry and bishops [or ministers], is it that has caused the common calamities. §35. And I. Nothing is more wanting hereto than better qualifications in the persons: 1. That there be a strong wit, and good acquired gifts of knowledge, and a strong and lively faith from divine illumination, and good acquaintance with the oracles of God: A pastor or teacher should not only know the essentials of Christianity, which every Christian knows, but also the integrals [things that complete the whole of Christianity] and many accidents. And both essentials and integrals should be known by him by a more clear, distinct and orderly understanding, not only above the vulgus fidelium, (common Christians) but above the better sort of the flock. And some store of natural and common knowledge called learning is needful hereunto: But especially more illumination, faith and holy wisdom and skilfulness in matter, sense and method of the Word of God.</p></blockquote>

<blockquote><p>The first step towards what might be called the re-organisation of the [United] Societies appears to have been taken by Robert Hamilton, who had been on the Continent from 1679 to 1688, and who had constituted himself the leader in opposition to the movements proposed by the ‘ministers and majority of the people’ during the two years after the [Glorious] Revolution [of 1689]. All who did not approve his views were guilty of ‘gross defections.’ …when the first General Meeting was held after the issue of this paper [in 1691], it was found that there were tares among the wheat. “When gathered and searching into one another’s judgement as to the state of the testimony,” says the writer of the Informatory Vindication [of 1691(?)], ‘We found ourselves to be but a mix’d company,” and consequently, before anything was done, they had to ‘purge their meetings from all such as had sinfully joined with the courses of the times and were defending the same.’… How many were removed at the ‘purging’ is also unknown, but they must have formed a considerable proportion of the body… The Societies seem to have done very little without causing controversy in their own ranks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcmillan.html">William McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covenanters after the Revolution of 1688’</cite>, (Scottish Church History Society, 1950), pp. 144-45</span></figcaption>

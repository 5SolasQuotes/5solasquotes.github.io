<blockquote><p>‘And bound him;’ From the open slaughtering of the saints, as he had done by the heathen emperors; or, from molesting and mischiefing of God’s people, otherwise he is not bound one hour, Job 1:6-12 1 Peter 5:8. And how his vicegerent the beast has bestirred him during the thousand years, who knows not? ‘A thousand years;’ Hos explicate fateor trepide me aggredi, says [David] Pareus. He begins the thousand at the destruction of the temple, A.D. 73, and so it ends in Pope Hildebrand, who stepped into that chair of pestilence, A. D. 1073. Others begin it at the birth of Christ, and end in Sylvester II. Others at Christ’s passion, and end in Benedict IX. But they do best, in my opinion, that begin at Constantine and end in Boniface VIII, who is of his own said to have entered like a fox, reigned as a lion, and died as a dog. He excommunicated the French king, and published this decree, that the Bishop of Rome ought to be judged of none, although he should carry innumerable souls with him to hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, 2, verse 2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8c3cdf1933" data-kw="">
<blockquote><p>When as the Devil had walked at liberty through all nations almost from the beginning of the world, and had filled the whole world with all kind of wickedness and heinous sins, at length in the coming of Christ, which had chosen to Himself a Church and much people among the gentiles, his licenciousness is bridled… he was caught I say and bound with that great chain of sincere doctrine, that he cannot range abroad at liberty as he was wont… But the time which here is compassed in the space of a thousand years, in which the Devil should be kept bound in prison, does signify a long time, and uncertan to men. In which space of time the pure doctrine of the Gospel should flourish in the world, and many men out of all nations should be taken into the eternal inheritaunce of Christ and we see that almost by the space of a thousand years after Christ some light of sincere doctrine remained in the world, at the least many did consent upon the points of Christian religion which were chief and most necessary to salvation: until at length the doctrine of Antichrist being brought in, of merits, of satisfactions, of the sacrifice of the mass and other monsters, the only foundation of faith and free justification of faith was taken away. In that whole space of time therefore, the power of Satan was bound, so long as by faith in the merits of Christ alone, the way was open for men to heaven. And we must note that Satan is said to be bound, and shut in prison, so long as he does not seduce the greatest multitude to eternal destruction…. For after that he must be loosed for a litle season, etc. When as now the pestilence of the Mahumet, and the Pope waxed strong and increased. He must be loosed for a litle time, that he may seduce the nations into idolatry, as he seduced the whole world before the birth of Christ. For after a thousand yeares whiles the Turks in the East, and the papists in the west possessed all with there dotages, we may rightly conjecture that Satan was loosed out of prison. But this evil shall not endure long, for the end of the world is at hand, and the truth of the gospel being restored again to the world, has disclosed the falsehoods of both the enemies.</p></blockquote>

</figure><figure class="quote" id="q-62580bf632" data-kw="">
<blockquote><p>The issue of millennial debate among the Reformed is both highly complicated and rather uniquely related to the confessional issue. The new eschatologies of a future millennium ran counter to the eschatologies of the sixteenth-century Reformed which, from Bullinger’s commentary on the Apocalypse to Franciscus Junius’ annotations, as ensconced in the margins of later editions the Geneva Bible, understood the millennium as past. Although, moreover, the major Reformed confessions had tended to tread lightly concerning the last things, two of them, the Forty-two Articles of Edward VI and the Second Helvetic Confession, had strongly argued against “the fable of the millennium” and notions of a “golden age” on earth prior to the final judgment. What is rather remarkable, then, is the vast revision of Reformed eschatology that took place in the seventeenth century both in England and on the continent without yielding a major confessional confrontation – in fact, both witnessing an increased diversity in the tradition, a significant break with the views of the Reformers on the part of many orthodox Reformed writers evidenced by their acceptance of a doctrine of a future millennium. The spectrum of opinion among the continental Reformed, similar to what Gribben has identified among the English, is evidenced by the millennialism of Wilhelmus à Brakel on the one hand and the anti-millennial views of Francis Turretin on the other. Turretin, significantly, distinguished between the “crass” chiliasm of various heretics and the highly objectionable but not heretical “subtle” chiliasm of Piscator, Alsted, Mede, and Launaeus – an approach parallel to his objection to Amyraldianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011), pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

<blockquote><p>The Fifth Age is of the Church reverting, and Antichrist raging, until this present age when Reformation was aimed at and begun in the West, Antichristian pride was detected and the number of true believers did increase. Then Satan was let loose again, the thousand years of his binding, from the days of Constantine, being expired: then persecutions were frequent; Antichrist foamed and opened his mouth wide to devour the sheep of Jesus. But he who preserved the Woman in the wilderness is the stronger, so that the gates of Hell were not able nor shall be able to prevail against her; yea by the breath of his mouth and preaching of the Word her enemies are scattered, Antichrist is revealed and true Christians are multiplied.</p></blockquote>

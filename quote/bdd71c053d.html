<main class="wrap"><figure class="quote" id="q-bdd71c053d" data-kw="">
<blockquote><p>In short, the American Revolution did have a ‘holy war’ dynamic to it that pitted Anglicans against dissenters (who were generally referred to as Presbyterians), and in the minds of the loyalists, the war was fundamentally, at bottom, a Presbyterian rebellion. It is, without question, an accurate assessment of how King George III and his advocates perceived the American war. Whether that perception was entirely accurate may be another question, but the very fact that it was how they viewed it is an important dynamic…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-gardiner.html">Richard Gardiner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Presbyterian Rebellion?’ in Journal of the American Revolution, Sept. 5, 2013</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-661b9790a3" data-kw="">
<blockquote><p>4. We may add this consideration, that hitherto toleration of errors and diversity of corrupt opinions have ever been looked upon, and made use of, as a most subtle means for undermining and destroying of the Church. It is marked of that skillful enemy of the Kingdom of Jesus Christ, Julian [A.D. 331-363], that having improven his subtilty to the utmost to find out means to destroy the Church by craft, which his predecessors by violence could not obtain, amongst other means he concluded this: Not to raise open persecution but to give liberty to all the differing bishops and teachers (which then, after the Council of Nicea and Constantine’s death, were very many and bitter in their differences) to follow their own way, and to vent their own opinions without all fear of any restraint: and therefore did call them that he might make intimation thereof to them for their further encouragement therein; The words which he used to them, as they are marked by Ammianus and cited by Lodovicus Molineus (p. 560) are: Ut consopitis civilibus discordiis, suae quisque Religioni serviret intrepidus, that is, in sum, That everyone forbearing civil discords, should worship in his own religion without control or fear: And is it like, that this shall prove a mean useful for the good of the Church, which that expert child of the devil did make use of to destroy the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal... (1659), pt. 3, ch. 13</cite>, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

1b9790a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=4.%20We%20may%20add%20this%20consideration,use%20of%20to%20destroy%20the%20same&amp;text=4.%20We%20may%20add%20this%20consideration%2C%20that%20hitherto&amp;text=did%20make%20use%20of%20to%20destroy%20the%20same" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26ffe900ba" data-kw="">
<blockquote><p>Following the Revolutionary war, religious diversity in Connecticut continued to increase. In 1784, Connecticut finally passed an “Act for Securing the Rights of Conscience,” that secured religious freedom for those “professing the Christian religion,” of whatever denomination, and decreed they no longer be taxed to support the Congregational church. But non-Christians could be taxed to support the established church, and Congregationalism remained the established state religion until 1818, when Connecticut passed a new state constitution, replacing the laws of the old colonial charter obtained in 1662. This was not the end of the power and influence of the descendants of the Puritans, however…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nancy-finlay.html">Nancy Finlay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Importance of Being Puritan: Church and State in Colonial Connecticut’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<main class="wrap"><figure class="quote" id="q-6eb3a4874c" data-kw="">
<blockquote><p>The first sort of persons who are slighters of this great salvation, are those persons who go about to establish their own righteousness, and will not submit to the righteousness of Christ; (in a word) it is that sort of persons who think they may win to heaven by a Covenant of Works, and will not take the Gospels way of travelling to heaven in the Covenant of Grace. And surely there is not a person here who hath not that cursed inclination to be as little obliged to Christ (for his salvation) as he can; we would go to heaven without the way, which is Christ. And (believe me) there are many in this Congregation who go thus about to establish their own righteousness. And I shall propose six sorts of persons who fall under this first rank.

The first sort are those who trust on their own civility, and think that will carry them to heaven; those are the persons who go about to establish their own righteousness. Say they, I defy the world to say any thing to me, I was overmore an honest man and I trust therefore that I shall go to heaven; but I say to thee, (O Atheist that thou art) thou shalt never win to heaven by those means, till thou come to Christ with this, All my righteousness is like filthy rags.

The second sort are those who build their confidence upon their denial of their good Works, but yet come never this length to make use of Jesus Christ.

The third sort are those who build their confidence upon their duties; they think they will come to heaven by their good prayers, by their reading, and by their fasting, (like unto that Pharisee, Luke 18. 11.) I thank God I am not like other men; for I fast twice in the week, I pay tithes of all that I possess: But I say unto thee, thy duties will never bring thee to heaven if Christ he not the end of all thy duties, nor can you perform a duty without him.

The fourth sort of Persons who fall under this first rank of slighters of the great salvation, are those who trust on their convictions; if they have once been convinced of their sin and miserable estate, they think there is no more to do, Christ will never reject them, so they sit down and build their hope upon those convictions.

The fifth sort of persons are those who build their confidence upon their resolutions; say they, oftentimes I have resolved to be a better man than I am, therefore I think (which is the fearful delusion of many) that God will accept the will for the deed; but it had been good for many such a word had not been in the Bible; or that their cursed eyes had never read it. But know this that though thou hadst as strong resolutions as Peter, or as good wishes as Balaam’s had, if thou never labour to bring them to practice, God shall say to thee, Depart from me, I know you not: Any of you who build upon your resolutions, you will build upon a sandy foundation, these being many times a goodness but like the morning dew,

And the sixth sort of persons who fall under this first rank of slighters of the great salvation (and wherein the evil is most subtle) are those who build their salvation upon their graces; these also go about to establish their own righteousness; but I say to such, Their graces cannot be the foundation of their hope, though they may be as evidences to strengthen their hope. Now are there none here who fall under this first rank of slighters of the great salvation? or are there none here who will confess that they have gone about to establish their own righteousness?

I say to thee who wilt confess, put a rope about thy neck, and come to Christ; for he is a merciful King: I say to thee, Come to Christ with this, All my righteousness is like filthy rags; and if thou wilt come with this in sincerity, he shall say, Bring forth the white robe and put upon him. If thou canst be brought to speak that in sincerity to Christ, there shall be no more betwixt Christ and thee, but Come and clothe him with the whole robe.</p></blockquote>

<blockquote><p>Though the patrons of the doctrine of the necessity of repentance in order to the obtaining of the pardon of sin, do not aim at any encroachment on the doctrine of free pardon; yet, with all deference to those learned men, I conceive, that such doctrine is injurious to the grace of God, and doth much darken the free pardon offered in the gospel, in regard the pardon is promised immediately to those that believe, Acts x. 43. “Through his name, whosoever believeth in him, shall receive remission of sins.” But they require, that believers bring something with them, if they would obtain it, even that they bring repentance along with them. …

Upon the whole we may see; that the gospel teaches us to come empty-handed to the market of free grace, for remission of sin and God’s favour. But he comes not empty, who brings repentance along with him. If any shall say, that if we screw up matters so high in this point, we most cast faith as well as repentance, in the matter of attaining pardon; for that is still something we bring with us. I shall answer; For the safety of God’s grace, let the work faith, the inherent quality faith, go, and be made to stand aback, while the sinner stands before God’s tribunal to be justified; that the empty-handed, taking faith, may alone have place. Hath not the Lord made it to be only of faith, that it might be of grace, while faith comes with an empty hand, and receives all?

There is a vast difference betwixt faith and repentance in this matter, even as much as betwixt giving and receiving: for there is no grace of the Spirit that hath more of the nature of giving than repentance, in so far as it is a turning of the whole man from sin unto God; and upon that head it ought to be banished far from the soul’s justification, and to have no part nor lot in the matter of attaining free pardon.

And seeing this doctrine doth so well agree with the natural religion that is in all men, whereby they, when they come to God to obtain a favour, would always be sure of some qualification in themselves fitting them for the receipt of it; let us take heed, that it turn not the covenant of grace into a bastard covenant of works. The covenant of works says, Do this; the covenant of grace says so too. Where is the difference then? Why, the covenant of works says, Do this, and thou shalt live, viz. in God’s favour, wherein life lies. But the covenant of grace saith, Live thou, and do this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Questions</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 87-88.</span></figcaption>

<blockquote><p>Before Adam’s fall it was not necessary for him to have Christ, because he was righteous and without sin, just as the angels have no need of Christ. If Adam had not fallen, it would not have been necessary for Christ to become our Redeemer. …The argument is true that eternal life is in the given to him who keeps the law without Christ, because whoever keeps the law is righteous. Adam would have entered into the kingdom of heaven without Christ, if he had not fallen. …The conclusion is that Adam alone kept the commandments of God before the Fall, but after the Fall and no one has truly been found who has fulfilled the law</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputatio de iustificatione</cite>, (1536) in Luther’s Works, 26.185, 187</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Before Adam’s fall it was not necessary for him to have Christ, because he was righteous and without sin, just as the angels have no need of Christ. If Adam had not fallen, it would not have been necessary for Christ to become our Redeemer. …The argument is true that eternal life is in the given to him who keeps the law without Christ, because whoever keeps the law is righteous. Adam would have entered into the kingdom of heaven without Christ, if he had not fallen. …The conclusion is that Adam alone kept the commandments of God before the Fall, but after the Fall and no one has truly been found who has fulfilled the law”

— Martin Luther, Disputatio de iustificatione, (1536) in Luther’s Works, 26.185, 187">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBefore+Adam%E2%80%99s+fall+it+was+not+necessary+for+him+to+have+Christ%2C+because+he+was+righteous+and+without+sin%2C+just+as+the+angels+have+no+need+of+Christ.+If+Adam+had+not+fallen%2C+it+would+not+have+been+necessary+for+Christ+to+become+our+Redeemer.+%E2%80%A6The+argument+is+true+that+eternal+life+is+in+the+given+to+him+who+keeps+the+law+without+Christ%2C+because+whoever+keeps+the+law+is+righteous.+Adam+would+have+entered+into+the+kingdom+of+heaven+without+Christ%2C+if+he+had+not+fallen.+%E2%80%A6The+conclusion+is+that+Adam+alone+kept+the+commandments+of+God+before+the+Fall%2C+but+after+the+Fall+and+no+one+has+truly+been+found+who+has+fulfilled+the+law%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Disputatio+de+iustificatione%2C+%281536%29+in+Luther%E2%80%99s+Works%2C+26.185%2C+187&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a9fc46282.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a9fc46282.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/luther-on-the-covenant-of-works-2/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-cba784bf7e" data-kw="">
<blockquote><p>According to the Westminster Confession of Faith, Scripture thinks of man as a covenant being. It tells us that man was originally placed on earth under the terms of the covenant of works. It informs us further that man broke this covenant of works and that God was pleased to carry through his aims with the covenant of works by means of the covenant of grace. Thus Scripture may be said to be the written expression of the provisions of God’s covenantal relationship with man. The Confession further sets forth the Protestant doctrine of Scripture under the four heads of its necessity, its authority, its sufficiency and its perspicuity. The necessity of Scripture lies in the fact that man has broken the covenant of works. He therefore needs the grace of God. There is no speech or manifestation of grace in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Apologetics</cite>, 2nd ed. (Philiipsburg, NJ: The Presbyterian and Reformed Publishing Company, 2003).</span></figcaption>

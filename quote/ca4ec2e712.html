<main class="wrap"><figure class="quote" id="q-ca4ec2e712" data-kw="">
<blockquote><p>Adam alone committed it with an actual will; but to us it is communicated through generation, in the way that which has passed can be communicated, namely, by imputation” (tome 3, bk. 5, On the Loss of Grace, ch. 17). Original sin is an inherent and native iniquity; but yet that actual and free transgression of Adam is imputed to us. For we would be held neither by any guilt nor by any iniquity contracted from it, unless that act by which Adam violated the precept of God were ascribed to us by imputation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … (d. 1595; Legat, 1600), bk. 1, ch. 7, p. 22 trans. AI | Bellarmine similarly:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin The Fall Depravity">
<blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote>

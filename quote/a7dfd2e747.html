<main class="wrap"><figure class="quote" id="q-a7dfd2e747" data-kw="">
<blockquote><p>From all this its clear that it is false which Mr. [Thomas] Hooker says, ‘that all particular churches are all the members that the Church-visible has.’ For apostles, godly sojourners, dissolved members, are not members of congregations, nor are they congregations themselves, and yet they are members of the visible, integral, catholic Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, ... (1658), bk. 1, ch. 25; p. 161</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5265bb184b" data-kw="">
<blockquote><p>3rd Conclusion. A visible profession of the truth and doctrine of godliness is that which essentially constitutes a visible church, and every member of the visible church; Only our [Independent] Brethren and we differ much about the nature of this profession which is required in members added to the Church. Our Brethren will have none members of the visible Church, but such as are satisfactory to the consciences of all the visible church, and give evidences so clear, as the judgement of discerning men can attain unto, that they are truly regenerated. We again do teach that the scandalously wicked are to be cast out of the Church by excommunication, and these of approved piety are undoubtedly members of the visible Church, so these of the middle sort are to be acknowledged members of the Church, though the Church have not a positive certainty of the judgement of charity that they are regenerated, so they be known: 1. to be baptized, 2. that they be free of gross scandals, 3. and profess that they be willing hearers of the doctrine of the Gospel. Such a profession as gives evidences to the positive certainty of the judgment of charity, of sound conversion, is not required to make and constitute a true, visible-Church.</p></blockquote>

<blockquote><p>For we see very few people at daily religious gatherings, as those first Christians were accustomed to gather in the Temple. For some are impeded by the necessity of seeking their daily bread, others by religious indifference.</p></blockquote>

</figure><figure class="quote" id="q-5a56375e0e" data-kw="">
<blockquote><p>11. As he that swears and keeps his allegiance to the king is a subject and member of the kingdom, though he be no member of any corporation; so, though he disown a thousand fellow subjects; yea, though he deny the authority of constable, justice, judge; so he that is devoted to Christ truly in the baptismal covenant, is a Christian, and a member of the universal Church, though he were of no particular church, or did disown a thousand members, or any particular officer of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), ch. 4, p. 23</span></figcaption>

</figure><figure class="quote" id="q-b515383e4b" data-kw="">
<blockquote><p>We reject the opinion of those [English Independants and congregationalists] who think that in the Church none are to be admitted as members into the external fellowship of the Church, but such as have been by a strict examination first tried by other believers, or the elders of the Church, in the exercises of piety… and have manifested to them evident signs of regeneration: and have afterwards, before the whole body of the Church, publicly professed a sincere confession of faith; and have either by a continued speech, or by questions and answers, made manifest by evident signs the saving grace of God in them… and [are of] such a spirit that in a church covenant sincerely, faithfully, and godlily in the presence of God and the whole church, they both can and will walk in the ways of God. For we read not that in the apostolical Church this manner of admitting church members was in use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: 1645), ch. 1, ‘Of the Qualification of Church-members’, pp. 10-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

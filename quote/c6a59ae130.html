<main class="wrap"><figure class="quote" id="q-c6a59ae130" data-kw="">
<blockquote><p>Q. How do you prove that Infants are to be baptized?

A. There is the same use of Baptism under the Gospel, that was of Circumcision under the Law; and the Infants of Christians are under the Covenant as well as theirs; and Baptism is a sign of the Covenant, as well as Circumcision: if therefore Infants were circumcised, and Baptism possess the room of Circumcision, except there can be shewed a special prohibition or restraint in God’s word, it will follow that Infants also may be baptized.

Further, the Apostles are said to baptize whole families, amongst which it is ordinary, that there be some children, and there is no reason to limit the words to them that are at years. And this use hath continued in the Church since the Apostles times, and was never gainsaid by any but those, that by the universal Church, have been judged heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), p. 223.</span></figcaption>

</figure><figure class="quote" id="q-d575ae87c3" data-kw="">
<blockquote><p>Regarding the baptism of infants, we have stated our case sufficiently and more: we consider it nothing else than the holy washing of regeneration. Yet at the same time, we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the covenantal formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise why is a confession of faith required of adults before they are baptized?… …those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism. Thus we leave the hidden judgments to God, just as we should.</p></blockquote>

idden%20judgments%20to%20God%2C%20just%20as%20we%20should" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Dutch Reformed theologian, Gisbertus Voetius made some critical remarks on Cornelius Burgess’ book On the Baptismal Regeneration of Elect Infants, while, at the same time, arguing that baptism sealed a regeneration already produced in elect infants:

There is a seventh opinion prevalent among the Reformed doctors, which attributes regeneration to all and sundry of infants within the pale of the covenant, provided they are elect—whether they are baptized in infancy or otherwise, whether they die in infancy, whether they are educated in the faith from their birth and always lead a godly life, or whether before their death they are brought to faith and repentance by actual conversion. And I acquiesce in this opinion to a great extent. …

The opinion of this author [Burgess] pleases me insofar as he thinks that an initial regeneration of the Holy Spirit takes place in elect infants, by which is implanted the root and seed of actual conversion or renewal, to follow in its own season. But insofar as he makes this regeneration posterior to baptism, and connects it with that ordinance as a sine qua non, or a kind of moral charter to which it is attached, his opinion is not admitted by the Reformed theologians whom he himself quotes. The well-known opinion of these theologians is that the efficacy of baptism consists not in producing regeneration but in sealing a regeneration already produced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectae disputations theologicae</cite>, (Utrecht, 1648-69), vol. 2, pp 410, 412. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 150.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

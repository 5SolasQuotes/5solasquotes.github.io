<main class="wrap"><figure class="quote" id="q-86ff31f490" data-kw="">
<blockquote><p>Christ, by his glorious outstretched arm, did emancipate and redeem his inheritance from the bondage of Antichrist, unto such a pitch of reformation in doctrine, worship, discipline and government, that it became a pattern to other Churches, and had this prerogative above them all, that at once, and from the beginning, nothing was left unremoved or unreformed that ever flowed from the Man of Sin.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-aee8a818d9" data-kw="">
<blockquote><p>The blessed God hath evermore delighted to reveal and communicate himself by way of Covenant; he might have done good to man before his fall; as also since his fall, without binding himself in the bond of Covenant. Noah, Abraham, and David, Jews, Gentiles might have had the blessings intended, without any promise or Covenant, but the Lord’s heart is so full of love (especially to his own) that it cannot be contained so long within the bounds of secrecy, viz. from God’s eternal purpose to the actual accomplishment of good things intended, but it must aforehand overflow and break out into the many streams of a blessed Covenant, the Lord can never get near enough to his people, and thinks he can never get them near enough unto himself, and therefore unites and binds and fastens them close to himself, and himself unto them by the bonds of a Covenant.

And therefore when we break our Covenant, and that will not hold us, he takes a faster bond, and makes a sure and everlasting Covenant; according to grace, not according to works, and that shall hold his people firm unto himself, and hold himself close and fast unto them, that he may never depart from us. Oh the depth of God’s grace herein, that when sinful man deserves never to have the least good word from him, that he should open his whole heart and purpose to him, in a Covenant; that when he deserves nothing else but separation from God, and to be driven up and down the world, as a vagabond, or as dried leaves, fallen from our God, that yet the Almighty God cannot be content with it, but must make himself to us, and us to himself more sure and near then ever before!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepherd.html">Thomas Shepherd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the reader in Peter Bulkeley, The gospel-covenant; or The covenant of grace opened</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e9e1029b5b" data-kw="">
<blockquote><p>All that the Father gives me will come to me, and whoever comes to me I will never cast out.” (John 6:37)

The English language fails to give the full sense of the Greek in this sentence. The literal meaning of the Greek is, not “all persons whom the Father giveth shall come,” but “everything, – the whole thing.” It is not a masculine plural, but a neuter singular. The idea is either “that the whole mystical body, the company of my believing people, shall come to Me,” or else “every single part or jot or member of my mystical body shall come to Me, and not one be found missing at last.”

We learn from these words the great and deep truth of God’s election and appointment to eternal life of a people out of this world. The Father from all eternity has given to the Son a people to be His own peculiar people. The saints are given to Christ by the Father as a flock, which Christ undertakes to save completely, and to present complete at the last day. (See John xvii. 2, 6, 9, 11, 12: and xviii. 9.) However wicked men may abuse this doctrine, it is full of comfort to a humble believer. He did not begin the work of His salvation. He was given to Christ by the Father, by an everlasting covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 376.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-77c6f64958" data-kw="">
<blockquote><p>At first Ishmael had obtained the same rank with his brother Isaac, because the spiritual covenant was equally sealed in him by the symbol of circumcision. He is first cut off, then Esau, at last an innumerable multitude, almost the whole of Israel. In Isaac was the seed called. The same calling held good in the case of Jacob. God gave a similar example in the rejection of Saul. This is also celebrated in the psalm, “Moreover, he refused the tabernacle of Joseph, and chose not the tribe of Ephraim: but chose the tribe of Judah,” (Ps. 78:67-68) This the sacred history sometimes repeats, that the secret grace of God may be more admirably displayed in that change. I admit that it was by their own fault Ishmael, Esau, and others, fell from their adoption; for the condition annexed was that they should faithfully keep the covenant of God, whereas they perfidiously violated it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, ch. 21, sect. 6, p. 537</span></figcaption>

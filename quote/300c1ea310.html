<main class="wrap"><figure class="quote" id="q-300c1ea310" data-kw="">
<blockquote><p>…when I consider the proper end for which churches are erected, it appears to me more unbecoming their sacredness than I well can tell, to admit any other images than those living symbols which the Lord has consecrated by His own word: I mean Baptism and the Lord’s Supper, with the other ceremonies. By these our eyes ought to be more steadily fixed, and more vividly impressed, than to require the aid of any images which the wit of man may devise. Such, then, is the incomparable blessing of images—a blessing, the want [lack] of which, if we believe the Papists, cannot possibly be compensated!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-508dcc22dd" data-kw="">
<blockquote><p>…as I will show in more detail, the Anglican formularies do indeed prohibit all icon veneration… His [Dr. Hoskin’s] most important point is the “distinction between worship and veneration.”… The Reformation position cannot be easily sidestepped by the use of distinctions which the Reformers themselves understood and rejected… The rest of this essay will highlight confessional statements from various Reformation churches, including the Anglicans and the Lutherans, to show that there is no place for the veneration of images… Indeed, the rejection of image veneration is a truly pan-Protestant position… Still, the historical record is clear. The Protestant confessions give no allowance for the veneration of icons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-wedgeworth.html">Steven Wedgeworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Place of Images in the Venerable Protestant Tradition’</cite>, (2023) at Ad Fontes</span></figcaption>

</figure><figure class="quote" id="q-a88169a2f4" data-kw="">
<blockquote><p>…external adoration is due two ways: 1. When we approach God in immediate acts of worship, as prayer, and praises. 2. When it pleases God in an extraordinary manner to appear in his glory; the due season then for external signs of inward homage and reverence is when we perform these immediate acts of worship in our assemblies, or if God shall please, to give glorious signs of his extraordinary presence, as he did to Moses when the Bush was burning but not consumed, or as the Lord appeared, after Solomon had made an end of praying, when the fire came down from Heaven and the glory of the Lord filled the house; then all the Children of Israel, beholding the fire and glory of the Lord, bowed themselves and worshipped; whensoever the Lord does thus appear, external adoration is due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craghead.html">Robert Craghead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to a Late Book entitled, A Discourse concerning the Inventions of Men in the Worship of God, by William, Lord Bishop of Derry</cite>, ... (Edinburgh: Anderson, 1694), ch. 4, ‘Of Bodily Worship’, section 2, p. 96 Craghead (1633–1711) was a presbyterian minister, born in Scotland, who ministered in Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<main class="wrap"><figure class="quote" id="q-6509acec35" data-kw="">
<blockquote><p>Lastly, If ye have gotten Christ ye will be much employed about the work of mortification and self-denial. When Jesus comes unto a soul, He works in that soul much self-loathing and self-abhorrence. The soul that hath gotten Christ will say with the apostle, “Those things that I counted gain, I now count loss for Christ.”

This leads me to another point of doctrine, which is this: That the soul that is beloved of God, and for whom Christ hath given Himself, is much engaged in the exercise of self-denial. The apostle says not, “That the Lord loved me, and gave Himself for me, on account of anything that was in me;” but, “Christ loved me, and gave Himself for me, even me, who was a persecutor; for me, who was a blasphemer; for me, who was such and such.” How much, then, was this minister, Paul, engaged in the exercise of self-denial?

Again, you may observe that the soul that is loved of God, and for whom Christ hath given Himself, will be much in the exercise of mortification; or it is a duty lying on all those who are loved of God, and for whom Christ hath given Himself, to be much engaged in this work of mortification and self-denial. Ye must not think that this is only the work of ministers and men in eminent stations, to deny themselves; no, you have Jesus Christ Himself saying, “If any man will come after me, let him deny himself, and take up his cross, and follow me.” But that we may come to speak more particularly to the words, there is a threefold self that must be denied.

First, Natural self. Secondly, Sinful self. And, Thirdly, Regenerated and renewed self.

1. Natural self is the man consisting of the soul and body united. This a man must deny comparatively, or when it comes in competition with the glory of God and your own soul’s edification.

2. There is a sinful self, which is the old man, and unrenewed heart, with the affections and lusts. This sinful self we are to deny wholly and absolutely. We must not rest till we get all crucified and nailed to the cross of Christ. And,

3. There is a regenerate and renewed self—that is, the new man. This believers are to deny as to any merit in it. Indeed, believers should be seeking after more of the new man as their treasure; and they should make use of all means whereby they may be enabled so to hold it, that Satan and lust prevail not against it. There are some folk that deny the grace of the Spirit of God in this; but that which we press upon you hath these few things in it. And,

(1.) A knowledge of themselves. The man that would deny himself, must know himself. But,

(2.) As he must know himself, so he must loathe himself. And,

(3.) He sees vanity and emptiness in self. He sees that he is altogether insufficient of himself to do anything that is really good. The person that denies himself, as he is one who knows himself, and one who loathes himself, is a person that sees nothing in himself but emptiness, and has nothing in himself to trust unto in the matter of salvation. Therefore he must be denied to himself, and must lay the weight of his salvation upon another, even upon Christ. And there is this in self-denial, that as the man sees his own emptiness, so he is still emptying himself of all the old stuff. Old things must pass away, that all things may become new. So that if ye would know what self-denial is, it is even to throw all Satan’s household stuff out at the door, and have no more to do with it.

(4.) As ye must labour to cast out Satan’s stuff; so ye must labour to have these things of God’s providing brought in. Ye must have furniture brought from a far country; and ye must have it from home. Think not, Sirs, that these souls are denying themselves aright, that are crying down all that they have; unless they be also seeking the graces of God’s Spirit to replenish their souls.

In a word, to deny yourselves is to forsake all things in yourselves, when they come in competition with the glory of God; and to be still seeking furniture from above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guthrie.html">William Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon XII in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>

<blockquote><p>But touching an erring conscience, the question is not whether an erroneous conscience does so tie that we must do nothing on the contrary, nor is the question whether the nearest, actually obliging rule, be conscience; the Arminians tell us [that] though the Word of God, of itself, and by itself, have power to oblige, yet it actually obliges no man except it be understood, and so is believed to be understood, after we use all possible diligence and prudence, for no man is obliged to follow the true sense of the Word against his conscience, though it be erroneous; But we think the Word of God is both the farest and nearest, and the only obliging rule, and that the ditement [judgment] of the conscience does neither bind potentially nor actually, but is a mere [in Greek], a messenger and an official relater of the will and mind to God to us, and all the obliging power is from the Word; [???] the messenger of a king and judge is not the obliging [???] that ties the subject, or the herald’s promulgation of the Law, is no obliging rule; for [the] promulgation of heralds is common both to just and to unjust laws, and certainly unjust laws from a just prince lay no band on the conscience or on the man, far less can the promulgation, as the promulgation, lay any bands on the conscience; the word of a messenger and herald is at the best but a condition, or the approximation of the obliging power to us, but all the obliging power is from the king and the judge. It is most false then, that these Libertines say that the Word does not actually oblige except it be understood, for the understanding, information and indictment of conscience does not add any actual obligation to the Word that it had not before, it only is a reporter, to carry both the Word and the actual obligation to the man; the herald promulgating the law adds no obligation, actual or potential, to the law that it had not before, only it makes an union in distance, and near application and conjunction between the actually obliging law and the understanding knowledge of the person or subject, who is obliged to keep the law; though it be true the fire cannot actually burn but as timber is cast to it, yet the fire has from its own nature both potential and actual burning, not from the act of casting the timber in the fire; Nor is this a concludent reason, ‘no man is obliged [to] follow how the true sense of the Word against his conscience, though erroneous, ergo [therefore] the erroneous conscience does oblige, or ergo, actual obligation to obedience is not from the Word, but from the conscience;’ no more than this is a good consequence: no man is obliged to obey the Law in itself, just contrary to the promulgation of an erring and mistaking herald, ergo, the mistaking herald’s promulgation gives to the Law actual obligation over the subject; for it only follows [that] we are not to do contrary to the actual indictment of an erroneous conscience, but not obliged to follow the erroneous conscience; Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience. … …an erroneous conscience must be a transgressing conscience, and it is a contradiction that a faculty sinning should oblige to obedience to the Law of God, in the same consideration, because it sins.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But touching an erring conscience, the question is not whether an erroneous conscience does so tie that we must do nothing on the contrary, nor is the question whether the nearest, actually obliging rule, be conscience; the Arminians tell us [that] though the Word of God, of itself, and by itself, have power to oblige, yet it actually obliges no man except it be understood, and so is believed to be understood, after we use all possible diligence and prudence, for no man is obliged to follow the true sense of the Word against his conscience, though it be erroneous; But we think the Word of God is both the farest and nearest, and the only obliging rule, and that the ditement [judgment] of the conscience does neither bind potentially nor actually, but is a mere [in Greek], a messenger and an official relater of the will and mind to God to us, and all the obliging power is from the Word; [???] the messenger of a king and judge is not the obliging [???] that ties the subject, or the herald’s promulgation of the Law, is no obliging rule; for [the] promulgation of heralds is common both to just and to unjust laws, and certainly unjust laws from a just prince lay no band on the conscience or on the man, far less can the promulgation, as the promulgation, lay any bands on the conscience; the word of a messenger and herald is at the best but a condition, or the approximation of the obliging power to us, but all the obliging power is from the king and the judge. It is most false then, that these Libertines say that the Word does not actually oblige except it be understood, for the understanding, information and indictment of conscience does not add any actual obligation to the Word that it had not before, it only is a reporter, to carry both the Word and the actual obligation to the man; the herald promulgating the law adds no obligation, actual or potential, to the law that it had not before, only it makes an union in distance, and near application and conjunction between the actually obliging law and the understanding knowledge of the person or subject, who is obliged to keep the law; though it be true the fire cannot actually burn but as timber is cast to it, yet the fire has from its own nature both potential and actual burning, not from the act of casting the timber in the fire; Nor is this a concludent reason, ‘no man is obliged [to] follow how the true sense of the Word against his conscience, though erroneous, ergo [therefore] the erroneous conscience does oblige, or ergo, actual obligation to obedience is not from the Word, but from the conscience;’ no more than this is a good consequence: no man is obliged to obey the Law in itself, just contrary to the promulgation of an erring and mistaking herald, ergo, the mistaking herald’s promulgation gives to the Law actual obligation over the subject; for it only follows [that] we are not to do contrary to the actual indictment of an erroneous conscience, but not obliged to follow the erroneous conscience; Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience. … …an erroneous conscience must be a transgressing conscience, and it is a contradiction that a faculty sinning should oblige to obedience to the Law of God, in the same consideration, because it sins.”

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience, … (1649), ch. 11, ‘Of the Obliging Power of Conscience’, pp. 133-136. See the whole chapter for more.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+touching+an+erring+conscience%2C+the+question+is+not+whether+an+erroneous+conscience+does+so+tie+that+we+must+do+nothing+on+the+contrary%2C+nor+is+the+question+whether+the+nearest%2C+actually+obliging+rule%2C+be+conscience%3B+the+Arminians+tell+us+%5Bthat%5D+though+the+Word+of+God%2C+of+itself%2C+and+by+itself%2C+have+power+to+oblige%2C+yet+it+actually+obliges+no+man+except+it+be+understood%2C+and+so+is+believed+to+be+understood%2C+after+we+use+all+possible+diligence+and+prudence%2C+for+no+man+is+obliged+to+follow+the+true+sense+of+the+Word+against+his+conscience%2C+though+it+be+erroneous%3B+But+we+think+the+Word+of+God+is+both+the+farest+and+nearest%2C+and+the+only+obliging+rule%2C+and+that+the+ditement+%5Bjudgment%5D+of+the+conscience+does+neither+bind+potentially+nor+actually%2C+but+is+a+mere+%5Bin+Greek%5D%2C+a+messenger+and+an+official+relater+of+the+will+and+mind+to+God+to+us%2C+and+all+the+obliging+power+is+from+the+Word%3B+%5B%3F%3F%3F%5D+the+messenger+of+a+king+and+judge+is+not+the+obliging+%5B%3F%3F%3F%5D+that+ties+the+subject%2C+or+the+herald%E2%80%99s+promulgation+of+the+Law%2C+is+no+obliging+rule%3B+for+%5Bthe%5D+promulgation+of+heralds+is+common+both+to+just+and+to+unjust+laws%2C+and+certainly+unjust+laws+from+a+just+prince+lay+no+band+on+the+conscience+or+on+the+man%2C+far+less+can+the+promulgation%2C+as+the+promulgation%2C+lay+any+bands+on+the+conscience%3B+the+word+of+a+messenger+and+herald+is+at+the+best+but+a+condition%2C+or+the+approximation+of+the+obliging+power+to+us%2C+but+all+the+obliging+power+is+from+the+king+and+the+judge.+It+is+most+false+then%2C+that+these+Libertines+say+that+the+Word+does+not+actually+oblige+except+it+be+understood%2C+for+the+understanding%2C+information+and+indictment+of+conscience+does+not+add+any+actual+obligation+to+the+Word+that+it+had+not+before%2C+it+only+is+a+reporter%2C+to+carry+both+the+Word+and+the+actual+obligation+to+the+man%3B+the+herald+promulgating+the+law+adds+no+obligation%2C+actual+or+potential%2C+to+the+law+that+it+had+not+before%2C+only+it+makes+an+union+in+distance%2C+and+near+application+and+conjunction+between+the+actually+obliging+law+and+the+understanding+knowledge+of+the+person+or+subject%2C+who+is+obliged+to+keep+the+law%3B+though+it+be+true+the+fire+cannot+actually+burn+but+as+timber+is+cast+to+it%2C+yet+the+fire+has+from+its+own+nature+both+potential+and+actual+burning%2C+not+from+the+act+of+casting+the+timber+in+the+fire%3B+Nor+is+this+a+concludent+reason%2C+%E2%80%98no+man+is+obliged+%5Bto%5D+follow+how+the+true+sense+of+the+Word+against+his+conscience%2C+though+erroneous%2C+ergo+%5Btherefore%5D+the+erroneous+conscience+does+oblige%2C+or+ergo%2C+actual+obligation+to+obedience+is+not+from+the+Word%2C+but+from+the+conscience%3B%E2%80%99+no+more+than+this+is+a+good+consequence%3A+no+man+is+obliged+to+obey+the+Law+in+itself%2C+just+contrary+to+the+promulgation+of+an+erring+and+mistaking+herald%2C+ergo%2C+the+mistaking+herald%E2%80%99s+promulgation+gives+to+the+Law+actual+obligation+over+the+subject%3B+for+it+only+follows+%5Bthat%5D+we+are+not+to+do+contrary+to+the+actual+indictment+of+an+erroneous+conscience%2C+but+not+obliged+to+follow+the+erroneous+conscience%3B+Nor+are+we+obliged+to+follow+what+our+conscience+says+is+true+and+good%2C+because%2C+or+upon+this+formal+reason+and+ground%2C+that+the+conscience+says+so%2C+more+than+we+are+to+believe+and+practice+what+the+Church+or+the+conscience+of+others%2C+%5Bwho+are%5D+the+Church%2C+the+learned+and+godly%2C+say%3B+for+we+make+not+the+word+of+the+Church+the+formal+object+of+our+faith%2C+but+%E2%80%98thus+saith+the+Lord%E2%80%99+only%2C+because+the+Church+is+but+a+company+of+men+and+so+our+faith+should+depend+upon+men%2C+even+though+holy+and+speak

<main class="wrap"><figure class="quote" id="q-dff4cde231" data-kw="">
<blockquote><p>But for the better opening and confirming of this we must call to mind how the most high God, the supreme Governor of all churches and states in the world, hath been pleased, for the more orderly government of both, to settle a distinct power in each, the power of the keys in the church, and the power of the sword in the state, answerable to the two essential parts of man, his soul and his body; for the power of the keys committed to the church, that reacheth to the soul only, not to the body; and the power of the sword committed to the civil magistrate, that reacheth to the body only, not to the soul; but both together they have influence both upon the soul and body, or outward man.

And though both these powers be united in God, the fountain of all power, yet when derived from Him they are still separated from one another, so that they are not seated together in one and the same person; but the civil magistrate, to whom the power of the sword is granted, to him is the power of the keys denied; and the church, to which the power of the keys is granted, to it is the power of the sword denied. And therefore was Peter, who had the power of keys, commanded to put up his sword, Matt. xxvi. 52, and Uzziah, who had the power of the sword, punished for using the keys, 2 Chron. xxvi.; so that the priest hath no power to execute any part of the king’s office, neither hath the king any power to execute any part of the priest’s office; but these being two distinct offices and ordinances appointed by God, he that hath the keys must use them, not the sword, and he that hath the sword must use it, and not the keys.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 557.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>The Admonition annexed to the Queen’s Injunctions. The Queen’s Majesty being informed that in certain places of this realm, sundry of her native subjects, being called to ecclesiastical ministry in the Church, be by sinister persuasion and perverse construction induced to find some scruple in the form of an oath which by an act of the last parliament is prescribed to be required of diverse persons, for the recognition of their allegiance to her Majesty, which certainly neither was ever meant, ne by any equity of words or good sense, can be thereof gathered: Would that all her loving subjects should understand that nothing was, is, or shall be meant or intended by the same oath, to have any other duty, allegiance, or bond required by the same oath than was acknowledged to be due to the most noble kings of famous memory, king Henry VIII, her Majesty’s father, or king Edward VI, her Majesty’s brother. And further her Majesty forbids all manner her subjects to give ear or credit to such perverse and malicious persons which most sinisterly and maliciously labor to notify to her loving subjects how by the words of the said oath, it may be collected the kings or queens of this realm, possessors of the crown, may challenge authority and power of ministry of divine offices in the Church, wherein her said subjects be much abused by such evil disposed persons. For certainly her Majesty neither does, ne ever will challenge any other authority than that was challenged and lately used by the said noble kings of famous memory, king Henry VIII, and king Edward VI, which is and was of ancient time due to the imperial crown of this realm.</p></blockquote>

<blockquote><p>…restraints on liberty were advocated by the biggest names of the early Particular Baptist community (Spilsbury, Kiffin, Jessey, Knollys, Tombes, etc.) as well as some of the biggest names to follow (Keach and Gill). The centuries of Baptists that followed tended to have few, if any, qualms about the remaining restrictions that existed after they had achieved the right to worship God as they pleased. Hence, the Particular Baptist community can be characterized as one that advocated for moderation: religious freedom but with common-sense restrictions against blatant immorality. The role of church and state are distinct, but both of them must acknowledge God according to their sphere and jurisdiction.</p></blockquote>

<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>

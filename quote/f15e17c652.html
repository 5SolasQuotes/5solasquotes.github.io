<main class="wrap"><figure class="quote" id="q-f15e17c652" data-kw="">
<blockquote><p>Now Will-worship is nothing else but the inventing and ascribing any other Worship unto God, besides what he hath been pleased to command and institute; God will not be worshipped according to our fancies, but his own appointment: For as we must have no other God besides the true, so that God must have no other Service performed unto him, besides what himself hath required and prescribed: for this were to impute folly and weakness unto him, as if indeed he would have Servants, but knew not what service to injoyn [sic] them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 142.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The magistrate as such has nothing to do with the spirit, nor can he command the sincerity of the worship; his care is that there be a divine worship, that is, materially and externally right and consonant, externally to the rules of the word; and for this cause learned divines make the external man the object of the magistrates office;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), ch. 24</span></figcaption>

</figure><figure class="quote" id="q-b5d3fe3556" data-kw="">
<blockquote><p>A corrupt and wicked life argues a man to be a stranger to God, and God him; for otherwise a man might draw nigh to God, and have unclean hands too, which the Text [James 4:8] supposes that it cannot be. That power which draws a man into acquaintance with God, doth proportionably kill sin.

That power which flows from God in acquaintance with a man, kills sin too: whether I go out to the sun, or the sun come in to me, the darkness is expelled: sin hath not dominion over them that are under grace, Rom. 6. 14. the knowledge of God sets a man loose from his bondage to the enslaving lusts he before served, ye shall know the truth, and the truth shall make you free, John 8. 32. draw nigh to God, and be unclean if you can. That faith which is uniting to Christ, is a purifying faith; rebellion against the Commandments of God, is inconsistent with communion with God; you may fast, and pray, and ask, that you may consume upon your lusts, ver. 4. like a cutpurse in a Church, who comes not thither to seek God, but his prey.

They that draw nigh to God, must cleanse their hands; I will wash mine hands in innocency, so will I compass thine Altar, O Lord, Psal. 26. 6. Where you may observe, that thanksgivings and praises, which the Psalmist calls sacrifices of shouting, or loud music, Psal. 27. 6. and wherein they used (as one saith) … are to be performed with washen hands: so in your prayers, the Lord requires that you should lift up pure hands, 1 Tim. 2. 8. and what a sweet reflection may you make upon your deliverances which are wonderful, when you can say, I was upright with God, and I kept my self from mine iniquity? Therefore hath the Lord recompensed me according to my righteousness, according to the cleanness of my hands in his eye-sight, Psal. 18. 23, 24.

If ye fall into straits, and be plunged into depths of misery; If your face be foul with weeping, and on your eye lids be the shadow of death; what a lifting up of the head will it be unto you, to be able to say, Not for any injustice in my hands? Job. 16. 17. If the Lord shall deliver this Island from the oppression and injustice under which it hath groaned; what a crown and comfort will it be to you, that it is delivered by the pureness of your hands? Job. 22. 30.

To conclude. If there be a frustration of our counsels, and our endeavours bring forth nothing but wind; You shall find the reason why God makes all void and ineffectual, Isa. 59. 6. Their webs shall not become garments, neither shall they cover themselves with their works; Their works are works of iniquity, and the act of violence is in their hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The purifying of unclean hearts and hands: opened in a sermon preached before the Honourable House of Commons, at their solemn fast, January 28. 1645 in Margaret’s Westminster</cite>, (London: Abel Roper, 1646), pp 9-10.</span></figcaption>

</figure><figure class="quote" id="q-72239b2dfd" data-kw="">
<blockquote><p>Superstition is an offering somewhat as pleasing to God, which is not pleasing to Him. All Christians have some degree of this in matter or manner; for we know but in part, and prophesy in part, etc. And so [it is the logical consequence of separatistic principles that] no Christians must join with others. But must they not give over all religious duty themselves, seeing their own defects more defile them than other men’s [defects]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), pt. 2, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-4843d0e5f4" data-kw="">
<blockquote><p>A second characteristic of Puritan worship was its utter simplicity and sincerity. This unostentatious and modest form of worship found its appropriate domestic setting in meeting-houses… The Puritans refused to let the pealing organ blow To the full-voiced quire below In service high and anthems clear… in favour of the pedestrian metres of the Psalms so that all could memorize them and sing them in unison… their sense of holiness in approaching God was so strong that they could do without any theatrical or adventitious aids which would make tawdry the splendour of the Creator’s covenant mercies to his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship &amp; Theology in England, from Cranmer to Baxter and Fox</cite>, 1534-1690, pp. 530-31</span></figcaption>

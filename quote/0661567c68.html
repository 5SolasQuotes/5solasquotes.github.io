<main class="wrap"><figure class="quote" id="q-0661567c68" data-kw="">
<blockquote><p>Now as to this sort of dependence which ministers have upon the magistrate, in the actual discharge of their office, for clearing thereof, distinguish next between the exercise of the ministry simply and in itself considered, and the circumstances of that exercise: Or distinguish subordination into that which is absolute and that which is only secundum quid, or in some certain respects. Now, as by this indulgence your ministers do not depend upon the prince essentially and derivatively as to their office and authority, and matter of their embassage; so neither simply and absolutely for the exercise of it (both these they have and hold immediately of Christ alone), but only and merely in regard of the circumstance and adjunct of the peaceableness and legal immunity of the public exercise of it in such and such places of his realm: Even as the exercise of the protestant religion, being authorized by law, depends upon him; and as the exercise of your ministry within any family depends upon the master of the family. And yourselves in your papers upon this subject acknowledge this kind of subordination and dependence (viz. in respect of the public, free, peaceable exercise of the ministry) to be not unlawful. To this [William] Apollonius also accords, [Jus majestatis circa sacra, 1642] part last [pp. 249–51], §2, ch. 3. Neither is it to be thought that this does subject the ministry, but the man; not the function, but the person, to the civil power, except it be (as some of yourselves say) in obliquo, indirectly and objectively, even as the other matters of God are, being objects about which his imperative and coercive power is conversant… [The indulged] consequently are Christ’s ambassadors and sent-servants still, even as you are; only they have the peaceableness and civil freedom of the public exercise of their function from the ruler: a thing they were and are bound to pray for, 1 Tim. 2:1–2, that under him they ‘may lead a quiet and peaceable life in all godliness and honesty;’ and consequently, or by parity of reason, in the exercise of their ministry. And if this may and should be prayed for, as it is his duty to grant it, so it cannot be their crime to accept it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead (London, 1681)</cite>, pp. 89–91</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d7699be7b" data-kw="">
<blockquote><p>1st Assertion: The magistrate as the magistrate is to procure that there be preachers and Church-officers to dispense Word, sacraments and discipline, for: 1. His end is, that people under him may lead a quiet and a peaceable life in godliness and honesty, 1 Tim. 2:2. And the Magistrate attains his end as a Magistrate, if there be simple exercise of religion in the quiet and peaceable way, that may consist with the subjects indemnity, and immunity, from rapine, injuries, and violence. … 4th Assertion. The magistrate de jure is obliged not only to permit, but also to procure the free exercise of the ministry in dispensing Word, sacraments and discipline, and owe his accumulative power, to convene synods, to add his sanction to the lawful and necessary constitutions and ordination of worthy, and to the deposition of unworthy officers in the Church, because: 1. He is a nurse-father in the Church, Isa. 49:23. 2. And by office, as a public father, to procure the good of the souls of the subjects in his coactive [coercive] way, that we may lead a quiet and peaceable life in all godliness and honesty, 1 Tim. 2:2. 3. He is not only to permit, but also positively to procure all peace, in the exercise of all lawful and profitable trades and arts; therefore, far more that glory may dwell in the land, and that the peace thereof may be as a river, Isa. 48:18, by the presence of Christ walking in the midst of the golden candlesticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646)</cite>, ch. 24, pp. 543 &amp; 552</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-7752b5457d" data-kw="">
<blockquote><p>9th Assertion…. 1. As the object of that high [civil] office is merely and purely civil and positive, relating only to a civil end, of peace: as in importing or exporting of goods, of wool, wax, moneys for the good of the commonwealth, the crying up or crying down of the value of coined gold or silver, the making of laws merely civil; as not to carry armor in the night [which is threatening] in such a city: so in war, commanders, captains and colonels are magistrates to order the battle, lay stratagems… the parliaments’ power in disposing of fowling, fishing, hunting, eating of flesh, or not eating at such a time: all these, as the Word of God does not particularly warrant the one side more than the other, are merely civil and positive. It is sure the magistrate has a supremacy, and an independency above the Church or ministers of the Gospel in all these; and as these prescind [are detached] from all morality of the First and Second Table [in that they are not inherently moral or immoral of themselves]… In this consideration that learned and grave divine Dr. Andrew Rivet says well (in Decalog., ch. 5, p. 204) that as we believe a man well skilled in his own art, so that his judgement is a supreme rule; so the supreme authority of the magistrate to us in things positive is a rule; for indeed it cannot be denied but there be arcana imperis, secrets of State that are not to be communicated to pastors or to any, in which the [civil] rulers have a supremacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646)</cite>, pp. 558-59</span></figcaption>

<blockquote><p>The Socinians, and the Erastian crutch-maker before-mentioned, so plead against the necessity of ordination, that they hold it lawful and free to gifted persons not ordained, not only to preach, but to administer the sacraments.</p></blockquote>

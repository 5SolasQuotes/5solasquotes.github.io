<main class="wrap"><figure class="quote" id="q-34f3e44f14" data-kw="">
<blockquote><p>The absolute goodness of God, as it is the excellency of his nature, is the object of praise: the relative goodness of God, as He is our benefactor, is the object of thankfulness.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9997402f31" data-kw="">
<blockquote><p>The properties of God are either absolute or relative. The absolute properties of God are such as may be considered without the supposition of any thing else whatever, towards which their energy and efficacy should be exerted. His relative are such as, in their egress and exercise, respect some things in the creatures, though they naturally and eternally reside in God. Of the first sort is God’s immensity ; it is an absolute property of his nature and being. For God to be immense, infinite, unbounded, unlimited, is as necessary to him as to be God ; that is, it is of his essential perfection so to be. The ubiquity of God, or his presence to all things and persons, is a relative property of God ; for to say that God is present in and to all things supposes those things to be. Indeed, the ubiquity of God is the habitude of his immensity to the creation. Supposing the creatures, the world that is, God is by reason of his immensity indistant to them all;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined, ch. 2, ‘Of the Nature of God’</cite>, p. 93 in Works, vol. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-067bfa5580" data-kw="">
<blockquote><p>‘And it repented the Lord that He had made man on the earth, and it grieved Him at his heart’ ([Genesis] 6:6). This, of course, is anthropomorphic language; it speaks of God as if He were a man. Actually, God does not repent (1 Sam. 15:29); God does not change His mind; He has a single, consistent purpose that He follows from eternity to eternity. When the Bible speaks of God as ‘repenting’ or changing His mind, this means that He changed His attitude toward some of His creatures. The change of attitude itself was part of the original purpose of God and was planned from eternity. So, in the present passage, the truth is expressed that God changed His attitude toward the human race. Human sin had developed to such an extreme degree that the purpose for which man had been created could no longer be accomplished. A new beginning had to be made with the godly remnant of the race, while the mass of the wicked had to be destroyed. This, of course, was known and planned by God from eternity; the change was in God’s attitude toward man, not in God’s own intentions and purposes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Genesis (Pittsburgh, PA: Crown &amp; Covenant, 2006)</cite>, p. 124</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>Besides, creation is the only first discovery of his dominion. Before the world was framed there was nothing but God Himself, and, properly, nothing is said to have dominion over itself; this is a relative attribute, reflecting on the works of God; He had a right of dominion in his nature from eternity, but before creation He was actually Lord only of a nullity; where there is nothing it can have no relation; nothing is not the subject of possession nor of dominion. There could be no exercise of this dominion without creation: what exercise can a sovereign have without subjects? Sovereignty speaks a relation to subjects, and none is properly a sovereign without subjects. To conclude: from hence does result God’s universal dominion; for being Maker of all, He is the ruler of all, and his perpetual dominion; for as long as God continues in the relation of Creator, the right of his sovereignty as Creator cannot be abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God 2 vols. (NY: 1853), vol. 2 | Discourse 13, ‘On God’s Dominion’</cite>, p. 370</span></figcaption>

s Online</a></div>
</figure><figure class="quote" id="q-c7a35ec843" data-kw="">
<blockquote><p>Inasmuch, moreover, as the divine affections are understood as descriptive of God’s movement or egress toward the finite order, they are not only to be understood as communicable attributes par excellence, they are also attributes defined primarily in their relationship to finite objects. It is by these affectiones or virtues that God sustains his relations with creatures–they are the preeminent example of the so-called communicabilia or relative attributes. (Mastricht, Theoretic-practica theologia, II.xv.19) In attempting to define the issue still more precisely, Owen distinguished between ‘attributes of Deity which, in order to their exercise, require no determined object antecedent to their agress’ and ‘attributes which can in no wise have an egress or be exercised without an object predetermined, and, as it were, by some circumstances prepared for them.’ (Owen, Dissertation of the Divine Justice, in Works, X, p. 508) The affections fall, clearly, into the latter category, the virtues into the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD (Baker, 2003), pt. 2, ch. 6.3, 3. ‘Doctrinal Conclusions’</cite>, pp. 559-60</span></figcaption>

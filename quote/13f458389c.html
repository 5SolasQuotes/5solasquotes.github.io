<main class="wrap"><figure class="quote" id="q-13f458389c" data-kw="">
<blockquote><p>The early Reformed Presbyterians and Seceders opposed evangelical latitudinarianism, the idea that important doctrines could be laid aside so that we can all stand “together for the gospel”. This mindset is similar to that of Liberalism, in that it thinks that some biblical truths are “essentials”, while others are “non-essentials”. Although it is true that some dogmas are more important than others, once something has been confessed by the church as biblical teaching it cannot be dismissed as a non-essential; if it was a non-essential God would not have put it in the Bible. Such was the extent of their opposition to such pernicious ideas, that the Anti-Burgher Seceders in Ireland declared it to be a disciplinarian offence for their people to join with latitudinarian evangelical groups:

[…] Evangelical Society of Ulster, question of discipline of such of our Communion as have connection with the same. […] Synod decided unanimously that such as join the Evangelical Society were following a divisive course &amp; that such should be tenderly dealt with, and that while all encouragement should be given to praying societies in our own congregations persons belonging to our communion should be admonished to withdraw from private religious societies not under our inspection […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/associate-synod-of-ireland.html">Associate Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts &amp; proceedings of the Associate Synod of Ireland (Anti-Burgher) 1788-1818, 29 July 1800 (P.R.O.N.I., Belfast, D/3815/D/4), pp 62-3.</cite></span></figcaption>

</figure><figure class="quote" id="q-b2ae994528" data-kw="">
<blockquote><p>And shall we now set up a Church-tyranny, the mere will and abitriment, yea, the unjust sentences of Church-judicatories for laws, and require absolute submission thereunto, not only of private and single persons, but of all inferior judicatories, not allowing the congregational-eldership once to whisper against what is resolved by the presbytery, or the presbytery against what is resolved by the synod, or the synod against what is resolved by the General Assembly. If then the superior judicatories will tyrannize, what remedy is there? or if they become corrupt, how shall the ruin of religion, or the persecution and oppression of these who desire to keep faith and a good conscience, be avoided? Have the Ministers and saints and courts of Jesus Christ received religion and His ordinances upon these terms, that if a superior Court will have it so, they shall all crouch down as asses under the burden, and let them, without gainsaying (they being now cudgeled into silence by a sentence of suspension from the sacrament, or deposition or excommunication) ruin Church, and Ministers, and ordinances, and professors, and all the precious interests of Jesus Christ; And shall we say that such a submission is required in this case, as though they ought to do nothing but weep and pray in secret? How great tyranny is this, and how remedy-less a way to ruin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (1658), pp. 113-14</span></figcaption>

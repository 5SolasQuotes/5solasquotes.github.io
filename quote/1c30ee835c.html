<main class="wrap"><figure class="quote" id="q-1c30ee835c" data-kw="">
<blockquote><p>Question 10: Whether the will is rightly distinguished into antecedent and consequent? Distinguished. Answer: If by “antecedent” be understood the declaration of the divine will, and of the order posited by it between the condition and the conditioned thing: Affirmed. E.g., “if anyone believes,” or “if anyone perseveres, he shall be saved”: which is equivalent to that categorical enunciation, “every believer or persevering one shall be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef4dac9cd" data-kw="">
<blockquote><p>To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 40, art. 3, On Divine Election, quest. 1, ‘Whether election is in God from eternity, or in time.’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.”

</figure><figure class="quote" id="q-fa4d387437" data-kw="">
<blockquote><p>XVIII. God by his antecedent will decreed to bestow faith and grace on us, which by his consequent will He resolved to deny us; his former will was moved by his own goodness, but his latter will was provoked by our wickedness: if we have unjustly rejected the grace which by his former will He resolved to give us, may not He justly by his latter will deny that grace, which was rejected so perversely by us. Lord, if thou art resolved by thy first will to bestow grace on me, let me not by my disobedience provoke thy second will to deny that grace unto me. XIX. Our wickedness is the cause that moves God to exercise his acts of justice; but his own bounty is the cause, and our misery the occasion, why He exercises his acts of mercy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination</cite>, … (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e449def23e" data-kw="">
<blockquote><p>He who is just could not have commanded anything impossible, nor is a man condemned for that which he could not avoid, for He is pious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-baptiste-gonet.html">Jean Baptiste Gonet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shield of Thomistic Theology</cite>, 5 vols. 10th ed. (1667; Antwerp: Pitteri, 1744), vol. 1, tract 4, On the Will of God &amp; his Providence, disp. 4, Antecedent &amp; Consequent Will of God tr. AI by The Faith Received | 110. The conclusion is therefore proven lastly by another fundamental reason. By the very fact that God, through an antecedent will, ordains men to salvation and a supernatural end, He obliges them to observe the supernatural precepts, which are the necessary means for its attainment: according to that saying of Christ, “If you wish to enter into life, keep the commandments.” But man cannot be obliged to the observance of supernatural precepts without sufficient aids: Therefore, God, through an antecedent will, prepares sufficient aids for men. The major premise is evident; the minor is proven: | Man cannot be obliged to the impossible: But the observance of supernatural precepts, without supernatural aid, at least sufficient, is impossible: Therefore, such aid being excluded, he cannot be obliged to it: The major premise is established from the Council of Trent (sess. 6, chap. 11), where it is said that God does not command impossibilities; and from Augustine (de natura &amp; gratia, chap. 69), saying: “It is most firmly believed that God, being just and good, could not have commanded impossibilities.” And in Sermon 16 de tempore: “We execrate the blasphemy of those who say that anything impossible has been commanded by God.” And in Sermon 6:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>48. In whatever God wills He is universally effectual; He is not hindered or frustrated in obtaining what He wills. For if He should properly will anything and not attain it He would not be wholly perfect and blessed. … 53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (d. 1633; 1997), bk. 1, ch. 7, pp. 99-100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

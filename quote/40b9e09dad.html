<main class="wrap"><figure class="quote" id="q-40b9e09dad" data-kw="">
<blockquote><p>14. I would willingly inquire of the Independents, to what church were added so many thousands that were baptized by the apostles and added unto the Church in one day? Whether to a particular congregation, or to a greater ecclesiastical consociation? It could not be to a particular congregation:

1. For the reasons I have already produced.

2. Because the apostles were not particular, but universal ministers, set over the universal militant Church; and therefore, in virtue of their charge, admitted them to be members of all the Churches, whereof they were ministers.

3. Because they were of diverse and sundry countries: neither is it credible that to be a member of the Church, they were bound to quit their countries and to stay at Jerusalem, howsoever so long as they did stay there, they might participate as well of all the rest of God’s ordinances, as of baptism: Ergo, they were added to some greater consociation, viz. to that, and to all those, whereof the apostles were ministers; for out of all doubt, the apostles who baptized them could not refuse to admit them unto the Lord’s Table wherever they celebrated the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations</cite>, The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations… (London, 1644), p. 92 Steuart (1591–1654) was a Scottish presbyterian, philosopher, controversialist and professor in both France and the Netherlands.</span></figcaption>

<blockquote><p>…when the Gospel is come to a people, if the question be, what gives to this man, not to this man true real right to membership, and ordinances, and seals, so as he may claim them before God and not sin: the meritorious right is Christ’s death, the condition upon his part is faith; hence visible profession as such cannot give right… Profession is in order to the rulers and members of the Church, which have hand according to their place, either formal or tacit consent, to receive in members… the question is, what profession is required in such as the rulers may without sin admit to membership and ordinances; we say a profession morally true, not real conversion judged to be real by men. Now this confession or profession doth not make a Church-member, but declare a Church-member, and it only declares him to the conscience of the rulers, that they sin not in admitting such: but declares him neither to have right before God nor to his own conscience. Yea, for all this profession [Simon] Magus sinned in being baptized, Magus usurped, and hath no true and real right, no not ecclesiastic, except in a most unproper sense; [yet] the Church hath right and command to receive him to member membership and seals…</p></blockquote>

<blockquote><p>V. A confederation or stipulation is required [of laymen coming to a congregation], whereby they promise God and the Church to continue and progress in that communion of Saints… But more explicitly, those being admitted to the communion of the Church enter into that holy confederation when they respond not only to particular questions about repentance, faith, and gratitude, specifically applied to themselves, but also to those general questions which conclude the series: Do they acknowledge the doctrine of our churches to be the orthodox faith and the way of salvation? Do they promise by God’s grace to persevere in that doctrine until death? Do they promise to live holily and worthily according to that doctrine? Do they submit to ecclesiastical discipline? And this is the method of stipulation and confederation in our churches. As for the manner of confederation by oath or the subscription of a formula or instrument, it does not seem necessary. It suffices that this is done before many witnesses, but we do not consider it illicit; as we shall soon discuss in the Problems.</p></blockquote>

<blockquote><p>And Trypho again inquired, ‘But if some one, knowing that this is so, after he recognises that this man is Christ, and has believed in and obeys Him, wishes, however, to observe these [Mosaic institutions], will he be saved?’ I said, ‘In my opinion, Trypho, such an one will be saved, if he does not strive in every way to persuade other men— I mean those gentiles who have been circumcised from error by Christ, to observe the same things as himself, telling them that they will not be saved unless they do so. This you did yourself at the commencement of the discourse, when you declared that I would not be saved unless I observe these institutions.’ Then he replied, ‘Why then have you said, ‘In my opinion, such an one will be saved,’ unless there are some who affirm that such will not be saved?’ ‘There are such people, Trypho,’ I answered, ‘and these do not venture to have any intercourse with or to extend hospitality to such persons; but I do not agree with them. But if some, through weak-mindedness, wish to observe such institutions as were given by Moses, from which they expect some virtue, but which we believe were appointed by reason of the hardness of the people’s hearts, along with their hope in this Christ, and [wish to perform] the eternal and natural acts of righteousness and piety, yet choose to live with the Christians and the faithful, as I said before, not inducing them either to be circumcised like themselves, or to keep the Sabbath, or to observe any other such ceremonies, then I hold that we ought to join ourselves to such, and associate with them in all things as kinsmen and brethren. But if, Trypho,’ I continued, ‘some of your race, who say they believe in this Christ, compel those gentiles who believe in this Christ to live in all respects according to the law given by Moses, or choose not to associate so intimately with them, I in like manner do not approve of them. But I believe that even those, who have been persuaded by them to observe the legal dispensation along with their confession of God in Christ, shall probably be saved. And I hold, further, that such as have confessed and known this man to be Christ, yet who have gone back from some cause to the legal dispensation, and have denied that this man is Christ, and have repented not before death, shall by no means be saved.&#x27;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And Trypho again inquired, ‘But if some one, knowing that this is so, after he recognises that this man is Christ, and has believed in and obeys Him, wishes, however, to observe these [Mosaic institutions], will he be saved?’ I said, ‘In my opinion, Trypho, such an one will be saved, if he does not strive in every way to persuade other men— I mean those gentiles who have been circumcised from error by Christ, to observe the same things as himself, telling them that they will not be saved unless they do so. This you did yourself at the commencement of the discourse, when you declared that I would not be saved unless I observe these institutions.’ Then he replied, ‘Why then have you said, ‘In my opinion, such an one will be saved,’ unless there are some who affirm that such will not be saved?’ ‘There are such people, Trypho,’ I answered, ‘and these do not venture to have any intercourse with or to extend hospitality to such persons; but I do not agree with them. But if some, through weak-mindedness, wish to observe such institutions as were given by Moses, from which they expect some virtue, but which we believe were appointed by reason of the hardness of the people’s hearts, along with their hope in this Christ, and [wish to perform] the eternal and natural acts of righteousness and piety, yet choose to live with the Christians and the faithful, as I said before, not inducing them either to be circumcised like themselves, or to keep the Sabbath, or to observe any other such ceremonies, then I hold that we ought to join ourselves to such, and associate with them in all things as kinsmen and brethren. But if, Trypho,’ I continued, ‘some of your race, who say they believe in this Christ, compel those gentiles who believe in this Christ to live in all respects according to the law given by Moses, or choose not to associate so intimately with them, I in like manner do not approve of them. But I believe that even those, who have been persuaded by them to observe the legal dispensation along with their confession of God in Christ, shall probably be saved. And I hold, further, that such as have confessed and known this man to be Christ, yet who have gone back from some cause to the legal dispensation, and have denied that this man is Christ, and have repented not before death, shall by no means be saved.&#x27;”

— Justin Martyr, Dialogue with Trypho, ch. 47 in ANF 1.218 Justin Martyr (c. 100 – c. 165) was an early Church father.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+Trypho+again+inquired%2C+%E2%80%98But+if+some+one%2C+knowing+that+this+is+so%2C+after+he+recognises+that+this+man+is+Christ%2C+and+has+believed+in+and+obeys+Him%2C+wishes%2C+however%2C+to+observe+these+%5BMosaic+institutions%5D%2C+will+he+be+saved%3F%E2%80%99+I+said%2C+%E2%80%98In+my+opinion%2C+Trypho%2C+such+an+one+will+be+saved%2C+if+he+does+not+strive+in+every+way+to+persuade+other+men%E2%80%94+I+mean+those+gentiles+who+have+been+circumcised+from+error+by+Christ%2C+to+observe+the+same+things+as+himself%2C+telling+them+that+they+will+not+be+saved+unless+they+do+so.+This+you+did+yourself+at+the+commencement+of+the+discourse%2C+when+you+declared+that+I+would+not+be+saved+unless+I+observe+these+institutions.%E2%80%99+Then+he+replied%2C+%E2%80%98Why+then+have+you+said%2C+%E2%80%98In+my+opinion%2C+such+an+one+will+be+saved%2C%E2%80%99+unless+there+are+some+who+affirm+that+such+will+not+be+saved%3F%E2%80%99+%E2%80%98There+are+such+people%2C+Trypho%2C%E2%80%99+I+answered%2C+%E2%80%98and+these+do+not+venture+to+have+any+intercourse+with+or+to+extend+hospitality+to+such+persons%3B+but+I+do+not+agree+with+them.+But+if+some%2C+through+weak-mindedness%2C+wish+to+observe+such+institutions+as+were+given+by+Moses%2C+from+which+they+expect+some+virtue%2C+but+which+we+believe+were+appointed+by+reason+of+the+hardness+of+the+people%E2%80%99s+hearts%2C+along+with+their+hope+in+this+Christ%2C+and+%5Bwish+to+perform%5D+the+eternal+and+natural+acts+of+righteousness+and+piety%2C+yet+choose+to+live+with+the+Christians+and+the+faithful%2C+as+I+said+before%2C+not+inducing+them+either+to+be+circumcised+like+themselves%2C+or+to+keep+the+Sabbath%2C+or+to+observe+any+other+such+ceremonies%2C+then+I+hold+that+we+ought+to+join+ourselves+to+such%2C+and+associate+with+them+in+all+things+as+kinsmen+and+

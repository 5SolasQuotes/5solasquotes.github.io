<main class="wrap"><figure class="quote" id="q-8511263fc1" data-kw="">
<blockquote><p>Objection [from a baptist]: The sanctification of the wife is but a civil sanctification in that place, i.e. she is sanctified to his use, that he ought not to put her away. Again, the holiness there spoken of is a fruit of that sanctification of the wife, whereof it will follow, that seeing [as] the effect cannot be greater then the cause, the cause cannot produce a greater effect than itself, the cause being only a civil sanctification, the holiness of the children must be the same; thus argues Thomas Collier. Answer 1: The question [in the text] was, Whether the believer were polluted by his unbelieving wife? The apostle says, ‘No’, quia pluris est pietas unius ad sanctificandum conjugium,quàm alterius impietas ad inquinandum, i.e. the faith of the believer is of greater force to sanctify their present cohabitation, than the unbelief of the other to pollute it. This he proves from a greater effect and fruit of the husband’s faith, viz. the holiness of the children born of such a husband by such a woman. The children are holy, not only civilly, as being born of lawful wedlock, but federally as being severed from all children of unbelievers by special prerogative, holy to the Lord, consecrated unto Him, whereas by nature they were aliens and unclean; according to that of Paul, Rom. 11:16, ‘if the root be holy, so are the branches.’ The faith of the believing party sanctifies the unbelieving wife to bear not only a lawful, but a holy seed; yea, it sanctifies the children and severs them from the common condition of other children, which are profane and unclean without the Church, without God in the world. 2. Note that the holiness of the child received from one of the parents believing is more than the sanctification of the wife by her believing husband, because such a wife is not taken into Covenant with her husband, but the child is; and therefore the apostle says not that such as is the sanctification of the wife, such is the holiness of the child: But thus, Such as is the holiness of the believing party, such is the child’s holiness in respect of Church-membership; and so the faith of the believing husband is the cause of both these effects, viz. That his coupling with his wife is not impure, and also that his children are holy: And this latter [is] an evidence of the former. And thus the holiness of the child is a sign of the mother’s sanctification to holy cohabitation, and an effect of the father’s faith by virtue of God’s Covenant. To have said, ‘That their children were lawful’, was no more than to have said, ‘That their marriage was lawful’, which was not the question; But to say, that the children of their lawful marriage were holy, this did infer not only the lawfulness of their marriage but the sanctified use: As Mr Baily has well observed, Of Anabaptism, p. 138. 3. Lastly, If by holy, be only meant a civil holiness, then on the contray, by ‘unclean’, must be meant a civil uncleanness. But when Paul says (else were your children unclean) his intent is not to make them all as an unclean birth and impure offspring, which were born at Corinth of unbelieving parents, but to show that they are not comprehended within God’s Covenant: And so when he says ‘but now are they holy’, he notes some preeminence of the children of Christians above the heathens’ children: Though in civil respects, in respect of a lawful birth, both sorts of children were equal, yet that civil holiness being common to both, there is a preeminence of the Christian’s child above the heathen’s. The child of an infidel at Corinth is today unclean and the next day holy in case his parents turn Christians; And what’s the reason of this so sudden alteration? It must needs be in regard of the Covenant into which the party now believing is taken with his children, his unbelieving neighbor with his children still remaining unclean: Hence I conclude with Calvin, in location, Seeing our children are exempted from the common condition of lost mankind, and admitted into God’s Church and family, Cur eos a signo arceamus? upon what reason can we drive them from the sign of their admittance?</p></blockquote>

<blockquote><p>From this it follows that the children of believers are baptized not in order that they who were previously strangers to the church may then for the first time become children of God, but rather that, because by the blessing of the promise they already belonged to the body of Christ, they are received into the church with this solemn sign.</p></blockquote>

<blockquote><p>24. Thus the Lord, when he chose Abraham for himself, did not commence with circumcision, in the meanwhile concealing what he meant by that sign, but first announced that He intended to make a covenant with him, and, after his faith in the promise, made him partaker of the sacrament. Why does the sacrament come after faith in Abraham, and precede all intelligence in his son Isaac? It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly. If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations. This undoubtedly is the reason why the Lord sometimes declares that the children born to the Israelites are begotten and born to Him (Eze. 16:20; 23:37) For He undoubtedly gives the place of sons to the children of those to whose seed He has promised that He will be a Father. But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and fallacious. In that view, Paul says that the gentiles, so long as they were plunged in idolatry, were strangers to the covenant (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellowship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism. To this we must refer the narrative of the evangelist, that those who were baptized by John confessed their sins (Mt. 3:6). This example, we hold, ought to be observed in the present day. Were a Turk to offer himself for baptism, we would not at once perform the rite without receiving a confession which was satisfactory to the Church.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“24. Thus the Lord, when he chose Abraham for himself, did not commence with circumcision, in the meanwhile concealing what he meant by that sign, but first announced that He intended to make a covenant with him, and, after his faith in the promise, made him partaker of the sacrament. Why does the sacrament come after faith in Abraham, and precede all intelligence in his son Isaac? It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly. If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations. This undoubtedly is the reason why the Lord sometimes declares that the children born to the Israelites are begotten and born to Him (Eze. 16:20; 23:37) For He undoubtedly gives the place of sons to the children of those to whose seed He has promised that He will be a Father. But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and fallacious. In that view, Paul says that the gentiles, so long as they were plunged in idolatry, were strangers to the covenant (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellowship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism. To this we must refer the narrative of the evangelist, that those who were baptized by John confessed their sins (Mt. 3:6). This example, we hold, ought to be observed in the present day. Were a Turk to offer himself for baptism, we would not at once perform the rite without receiving a confession which was satisfactory to the Church.”

— John Calvin, Institutes of the Christian Religion trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 16, pp. 373-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C24.+Thus+the+Lord%2C+when+he+chose+Abraham+for+himself%2C+did+not+commence+with+circumcision%2C+in+the+meanwhile+concealing+what+he+meant+by+that+sign%2C+but+first+announced+that+He+intended+to+make+a+covenant+with+him%2C+and%2C+after+his+faith+in+the+promise%2C+made+him+partaker+of+the+sacrament.+Why+does+the+sacrament+come+after+faith+in+Abraham%2C+and+precede+all+intelligence+in+his+son+Isaac%3F+It+is+right+that+he+who%2C+in+adult+age%2C+is+admitted+to+the+fellowship+of+a+covenant+by+one+from+whom+he+had+hitherto+been+alienated%2C+should+previously+learn+its+conditions%3B+but+it+is+not+so+with+the+infant+born+to+him.+He%2C+according+to+the+terms+of+the+promise%2C+is+included+in+the+promise+by+hereditary+right+from+his+mother%E2%80%99s+womb.+Or%2C+to+state+the+matter+more+briefly+and+more+clearly.+If+the+children+of+believers%2C+without+the+help+of+understanding%2C+are+partakers+of+the+covenant%2C+there+is+no+reason+why+they+should+be+denied+the+sign%2C+because+they+are+unable+to+swear+to+its+stipulations.+This+undoubtedly+is+the+reason+why+the+Lord+sometimes+declares+that+the+children+born+to+the+Israelites+are+begotten+and+born+to+Him+%28Eze.+16%3A20%3B+23%3A37%29+For+He+undoubtedly+gives+the+place+of+sons+to+the+children+of+those+to+whose+seed+He+has+promised+that+He+will+be+a+Father.+But+the+child+descended+from+unbelieving+parents+is+deemed+an+alien+to+the+covenant+until+he+is+united+to+God+by+faith.+Hence%2C+it+is+not+strange+that+the+sign+is+withheld+when+the+thing+signified+would+be+vain+and+fallacious.+In+that+view%2C+Paul+says+that+the+gentiles%2C+so+long+as+they+were+plunged+in+idolatry%2C+were+strangers+to+the+covenant+%28Eph.+2%3A11%29.+The+whole+matter+may%2C+if+I+mistake+not%2C+be+thus+briefly+and+clearly+expounded%3A+Those+who%2C+in+adult+age%2C+embrace+the+faith+of+Christ%2C+having+hitherto+been+aliens+from+the+covenant%2C+are+not+to+receive+the+sign+of+baptism+without+previous+faith+and+repentance.+These+alone+can+give+them+access+to+the+fellowship+of+the+covenant%2C+whereas+children%2C+deriving+their+origin+from+Christians%2C+as+they+are+immediately+on+their+birth+received+by+God+as+heirs+of+the+covenant%2C+are+also+to+be+admitted+to+baptism.+To+this+we+must+refer+the+narrative+of+the+evangelist%2C+that+those+who+were+baptized+by+John+confessed+their+sins+%28Mt.+3%3A6%29.+This+example%2C+we+hold%2C+ought+to+be+observed+in+the+present+day.+Were+a+Turk+to+offer+himself+for+baptism%2C+we+would+not+at+once+perform+the+rite+without+receiving+a+confession+which+was+satisfactory+to+the+Church.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion+trans.+Henry+Beveridge+%281559%3B+Edinburgh%3A+Calvin+Translation+Society%2C+1845%29%2C+vol.+3%2C+bk.+4%2C+ch.+16%2C+pp.+373-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d30300f87.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d30300f87.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=24.%20Thus%20the%20Lord%2C%20when%20he,which%20was%20satisfactory%20to%20the%20Church&amp;text=24.%20Thus%20the%20Lord%2C%20when%20he%20chose%20Abraham&amp;text=a%20confession%20which%20was%20satisfactory%20to%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

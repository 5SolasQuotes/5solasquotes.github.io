<main class="wrap"><figure class="quote" id="q-a298cb1788" data-kw="">
<blockquote><p>Master Perkins says nothing of the necessity of believing. That point of the virgin Mary’s perpetual virginity, we hold to be true, but we dare not lay a burden upon any man’s conscience where the Scripture is silent. St. Austin’s judgment, though he were a singular light of the Church, is not of weight enough to determine, without all warrant of scripture, what is heresy and what is not… Besides, Austin thus delivers the matter concerning the Helvidians’ heresy. The Helvidians (says he) so gainsaid the virginity of Mary that they confidently affirm [that] she had other children after Christ by her husband Joseph. So that it may well be Austin counted them heretics especially for avouching that peremptorily which they could no way make good by Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of Mr. [William] Perkins’ book, called A Reformed Catholic, against the Cavils of a Popish Writer... (London, 1606), The 7th Point, ‘Of Traditions’. Wotton (c. 1561 – 1626) was an English clergyman and controversialist, of puritan views.</cite>, pp. 401-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f06e35066" data-kw="">

</figure><figure class="quote" id="q-cfbccf335c" data-kw="">

</figure><figure class="quote" id="q-39d0e4e023" data-kw="">
<blockquote><p>I have never thought, still less taught, or declared publicly, anything concerning the subject of the ever Virgin Mary, Mother of our salvation, which could be considered dishonourable, impious, unworthy or evil… I believe with all my heart according to the word of holy gospel that this pure virgin bore for us the Son of God and that she remained, in the birth and after it, a pure and unsullied virgin, for eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ulrich-zwingli.html">Ulrich Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon on ‘Mary, ever virgin, mother of God’, as quoted in Max Thurian [a Protestant], Mary: Mother of All Christians, trans. Nevill B. Cryer (New York: Herder &amp; Herder, 1963)</cite>, p. 76</span></figcaption>

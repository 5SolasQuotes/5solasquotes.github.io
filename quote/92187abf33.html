<main class="wrap"><figure class="quote" id="q-92187abf33" data-kw="">
<blockquote><p>This standard [of national righteousness] can be none other than the Moral Law, the rule of universal rectitude, propounded with greater or less degrees of clearness, but demanding of all cordial and unlimited obedience. National righteousness implies freedom from national crimes, – recognition of the obligation of the Divine law, – and the practice of equity, truth and mercy, in acts of positive obedience to the will of Jehovah, the universal Sovereign. To have the character of righteousness in a proper and full sense, nations must receive the law from the hands of the Mediator, and rulers and subjects to a large extent embrace and exemplify the Gospel. They must assume the revelation of mercy as the basis of their public measures, and carry into application those principles of universal justice which receive the fullest development, and the most powerful confirmation from the Mediatorial system.

The law of nations, or the law of nature, is the same as the Moral Law, originally written on man’s moral constitution, and still found in scattered and imperfect lineaments in the hearts and consciences of men, and in the laws and customs of all nations under heaven. The only full and clear republication of this law is contained in the Scriptures of truth, in connexion with the remedial scheme that effectually provides for man’s recovery from ruin, through the wondrous obedience and death of the Lawgiver. This is the grand rule of moral rectitude to nations as well as to individuals.

Wherever the revealed law of heaven comes, it advances paramount claims to homage and subjection. None are truly righteous, save those who are conformed to it in heart and life. So in nations, the righteousness which exalt them, consists not in the number and excellence of their public institutions, nor in their commerce, literature, wealth, or military prowess, nor even in a lengthened course of outward prosperity. Many of these advantages have been enjoyed by States that have been the scourges of mankind, and that have sunk under the vengeance of the Almighty. But a righteous national character, – the fountain of countless capacity, its rulers and people, frame their nation in its collective capacity, its rulers and people, frame their constitution and regulate their proceedings in accordance with the supreme standard of rectitude, the revealed law of heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of nations favoured with divine revelation to promote scriptural education: in two discourses</cite>, (Belfast: George Druitt, 1840), pp 10-11.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8063f6df32" data-kw="">
<blockquote><p>Ignorance of the difference between the law and the gospel promotes also, in a great degree, the strength and influence of a self-righteous temper. When a man is driven to acts of obedience by the dread of God’s wrath revealed in the law and not drawn to them by the belief of His love revealed in the gospel; when he fears God because of His power and justice and not because of His goodness; when he regards God more as an avenging judge than as a compassionate friend and father; and when he contemplates God rather as terrible in majesty than as infinite in grace and mercy, he shows that he is under the dominion, or at least under the prevalence, of a legal spirit. If he builds his faith of the pardon of sin, of the favor of God, and of eternal life on any graces that he supposes are implanted in him or on any duties that are performed by him, he is evidently under the power of a self-righteous temper. He shows that he is under the influence of this hateful temper by grounding his hope and his comfort on conditions performed by himself and not on the gracious and absolute promises of the gospel. In a word, when his hope of divine mercy is raised by the liveliness of his frame in duties and not by discoveries of the freeness and riches of redeeming grace offered to him in the gospel; or when he expects eternal life not as the gift of God through Jesus Christ but as a recompense from God for his own obedience and suffering, he plainly shows that he is under the power of a legal spirit. Now, if he is ignorant of the leading distinctions between the law and the gospel, this ignorance will strengthen his legal propensity and confirm him in his resolution to seek justification partly, if not wholly, by the works of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 129–30.</span></figcaption>

</figure><figure class="quote" id="q-f93211a861" data-kw="">
<blockquote><p>If life and justice come not by the law, the law then is in vain. And this objection is expressed by way of interrogation, ‘Wherefore then serves the law?’ The answer is in the next words, ‘It is added for transgressions,’ that is, for the revealing of sin and the punishment thereof, and for the convincing of men touching their sins (Rom 3:19–20; HT: Inwoo Lee).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:194 (On Galatians 3:19).</span></figcaption>

</figure><figure class="quote" id="q-99dfff926c" data-kw="">
<blockquote><p>Therefore, in forbidding us to have strange gods, he means that we are not to transfer to another what belongs to him. Even though there are innumerable things that we owe to God, yet they may be conveniently grouped in four headings: (1) adoration (to which is added as an appendix, spiritual obedience of the conscience), (2) trust, (3) invocation, (4) thanksgiving.… As the Lord suffers nothing of these to be transferred to another, so he commands that all be rendered wholly to himself.… And it will not be enough to abstain from a strange god.… If we are content, therefore, with one God, let us remember what was said before: that we are to drive away all invented gods and are not to rend asunder the worship that the one God claims for himself. For it is unlawful to take away even a particle from his glory; rather, all things proper to him must remain with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>

</figure><figure class="quote" id="q-170e2c1298" data-kw="">
<blockquote><p>What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Large Catechism</cite>, First Commandment</span></figcaption>

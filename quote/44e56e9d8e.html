<main class="wrap"><figure class="quote" id="q-44e56e9d8e" data-kw="">
<blockquote><p>Under a pretense of catholic love, a scheme is laid for uniting parties of all denominations in Church-communion, in a way destructive of any testimony for the declarative glory of Immanuel as Head and King of Zion, and for the covenanted reformation of this Church and land; for which a righteous God has justly chosen their delusions and sent forth a spirit of delusion among them, in the present awful work upon the bodies and spirits of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-207b19e3c6" data-kw="">

</figure><figure class="quote" id="q-f6e533dfc7" data-kw="">
<blockquote><p>I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon anything amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things accoding to the Word of God. This my protesting, and refusing to join with them, enraged them exceedingly against me; and as their scourge of tongues was grievously bent against others, so now was it against myself, in a most grievous, unjust and unreasonable manner, and very hypocritically gave it out far and near… Thus I left that party of the dissenters who now commonly go under the name of Mr. M’Millan’s people; for the Quakers, Gibb’s faction, the Harlaw’s faction, and episcopacy by bishops, I had never any thing to do with them in matters of religion, neither directly nor indirectly; yea, my soul abhors all their evil ways: but I lieved retired by myself; all which time the Lord pitied me, and restored me to some measure of communion with Himself. Praise, praise. Amen…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters (Edinburgh: Oliphant, 1827)</cite>, pp. 237-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

nism/#:~:text=I%20alleging%2C%20what%20was%20wrong%20in,communion%20with%20Himself.%20Praise%2C%20praise.%20Amen%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c01b0d097a" data-kw="">
<blockquote><p>Tis said [for conforming in church to what is less good:] ‘What we may do sometimes, we may and ought to do always.’ But we have hundreds of instances that we would be loth to do that always which we might do and have done sometimes. We have often eat bad and unwholesome meat, dwelt in inconvenient and bad houses, etc. but are we bound to do so always? So some have been forced and been glad to use such helps for their souls as they could get, but are they bound to use them always? If we have better means and helps, should we not use them rather? Reason speaks it, and Scripture also, and gives us some examples which look that way. St. Paul circumcised Timothy, but opposed it in others, and would not let Titus be circumcised. He also, to satisfy the believing Jews that were too zealous for the Law, and misinformed of him, took men, shaved his head, purified himself with them, entered into the Temple, etc. This he did once, but would he have done so always?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism: for the Promoting of Christian Moderation &amp; the Communion of Saints (London: Parkhurst, 1705), p. 110 Tallents (1619–1708) was a non-conforming English presbyterian minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Polemics looks to irenics — the aim of war is peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-schaff.html">Philip Schaff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Preface’ to The Creeds of Christendom, vol. 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Polemics looks to irenics — the aim of war is peace.”

— Philip Schaff, ‘Preface’ to The Creeds of Christendom, vol. 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPolemics+looks+to+irenics+%E2%80%94+the+aim+of+war+is+peace.%E2%80%9D%0A%0A%E2%80%94+Philip+Schaff%2C+%E2%80%98Preface%E2%80%99+to+The+Creeds+of+Christendom%2C+vol.+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8259f44b7e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8259f44b7e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-peace-purity-of-the-church/#:~:text=Polemics%20looks%20to%20irenics%20%E2%80%94%20the%20aim%20of%20war%20is%20peace." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16892bad42" data-kw="">
<blockquote><p>There is also a great difference between toleration and accommodation. By accommodation I understand an agreement of dissenters with the rest of the Church in practical conclusions, so that if any difference be, it is in their principles, not in their practices, and so not obvious, apparent and scandalous to people. I had rather go two miles in an accommodation (yea as many as the word of God will suffer me) than one mile in toleration. For in that way there is no schism, no rent in Israel, but ‘the Lord one, and his name one.’ In this way [of toleration] there is temple against temple, and altar against altar, Manasseh against Ephraim, and Ephraim against Manasseh, and they both against Judah: a misery from which the Lord deliver us. I do not deny, but if a safe and happy accommodation is impossible, such a toleration as I have formerly spoken of, is not to be disallowed. But the accommodation is a more excellent way, and that which is to be rather embraced, yea endeavored for and followed after, according to the apostle’s rule (which Isidorua Pelusiota did long since observe to be the best and happiest way of putting an end to divisions and dissensions in the Church). Let us therefore as many as be perfect be thus minded: and if in anything ye be otherwise minded, God shall reveal even this unto you. Nevertheless whereto we have already attained, let us walk by the same rule, let us mind the same thing (Phil 3:15-16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty (London, 1645) This was printed anonymously.</cite></span></figcaption>

<blockquote><p>(1.) It is clear that the specific and essential form of a fundamental article is not taken from the authority of God speaking in the Word (seeing God’s authority is one and the same in all that He speaks), but from the influence that the knowledge of an article has to unite us to God in Christ, and bring us to salvation. (2.) And secondly, it will follow that this, Thou shalt not by the use of things indifferent kill him for whom Christ died, and the like is no less fundamental, by evident consequence, in respect it is spoken by God’s own authority, than articles of our faith. (3.) It follows that formalists ignorantly divide matters of God’s worship, into matters of faith, or points fundamental, and things indifferent, as if many scriptural truths were not to be found in God’s Word, such as the miracles of Moses, and Elias, the journeys of Paul, which are neither matters fundamental, nor yet things indifferent. (4.) Many things may be fundamental, by consequence, to one who can read the Word, and hear it read, which is not by consequence fundamental to a rude and ignorant man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-distinctions.html">Rutherford’s Distinctions</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 4 Distinctions about Fundamentals</cite></span></figcaption>

</figure><figure class="quote" id="q-1f53706f30" data-kw="">
<blockquote><p>5th Consideration. The essential ingredients and reasons of a lawful divorce [from Romanism] are here: 1. We could not lie in one bed with that sometime sister Church of Rome, but our skin behoved to rub upon her botch-boil, and therfore we did separate from nothing but corruption. 2. There was there persecutions, and in that we are patients and ejected rather then departers on foot and horse. 3. A professed dominion over our consciences. 4. Necessity of receiving the mark of the beast, and so the plagues of the beast, to worship images, and the work of men’s hands, a necessity of professing fundamental errors that subvert the foundation of faith, did all necessitate our seperation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbyterie in Scotland… (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’</cite>, p. 123</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-ac4752d8cf" data-kw="">
<blockquote><p>We will call then the true and pure Churches all those wherein we find the Word of God and sacraments purely and lawfully administered, that is to say (as Cyprian says) according to the institution of the Lord. And we nothing doubt to communicate with them, and that God is there president, howsoever in some certain points of doctrine there have been some error, and in the outward policy some abuse and corruption, and impurity in manners: for it behooves that always we resort thither, when the chief points of the foundation of our salvation be there truly taught, seeing we are men, and the Churches are compounded of men…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter [in controversy with Romanism] (London: Barker, 1579)</cite>, ch. 2, n.p.</span></figcaption>

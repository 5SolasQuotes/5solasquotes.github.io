<main class="wrap"><figure class="quote" id="q-f74d58b946" data-kw="">
<blockquote><p>We consider the context which is as strange as readily we read again in Scripture: Josiah works a great reformation in Judah, like unto him there was no King before him, neither after him arose there any like him, who turned to GOD with all his heart, and yet notwithstanding the Lord turned not from the fierceness of his wrath. Hence observe, that the persons and honest endeavours of the Lord’s worthies, that do their uttermost for turning away the Lord’s wrath from his people, may be graciously accepted with him, when their labours and endeavours come to little purpose, and are ineffectual for the turning away of his wrath and anger. There is here a testimony given to Josiah, that like unto him there was no King before him, neither after him, and yet his work came to nothing, in respect of his main design, the turning away of GOD’s wrath from Judah. Take the proposition by parts, and it will be the more clear.

1. The honest endeavours of worthy instruments in the Lord’s Work, which they use for turning away his anger from his people, may come to little purpose and prove ineffectual for that end; and this comes to pass two ways. (1.) When that very thing they do for this end doth miscarry among their hands. How many of the Lord’s servants have followed honest and great endeavours in their generation, that have come to nothing in respect of the end they aimed at, that is, the turning away of wrath from people, by turning them to God?

Jeremiah, an eminent instrument, and tender of God’s glory, and the good of his people, as any we read of, yet look through all his prophecies, when he hath done this, he can prevail nothing with neither King, Princes, Priests, nor people, and often he is tempted to quit the work, and yet falls to it again. So Chap. 20:7-9; “I am in derision daily, every one mocketh me, for since I spake, I cried out, I cried violence and spoil, because the word of the Lord was made a reproach;” then said, “I will not make mention of him, nor speak any more in his name, but his word was in my heart, as a burning fire,” &amp;c. Elijah, another of the most eminent instruments that ever was heard tell of, he labours much to prevent wrath, (1 Kings 18:37, 38) by turning the people to God, he gathers all the Kingdom together, and convinces them of their evil way, and of the difference betwixt God and Baal, and causes slay the priests of Baal, yet the next day as Chap. 19:2, 3, he is said to fly and hide himself from the persecution of Jezebel.

(2.) Not only may their endeavours come to nought by miscarrying, but even when they have done the work they intended, they may miss their design. And this is that which is here spoken of. What was Josiah his great aim and design? We may read it, 2 Kings 22:11, 13, &amp;c., That he and the people being humbled, the great wrath of the Lord might be turned away. He goes about an outward reformation, and he gets it wrought, and his own heart is humbled before the Lord; but he gets not the Lord turned from his fierce anger and wrath; which was kindled against Judah for all that.

2. The second part of the proposition is, that even when it is so, that the honest endeavours of the Lord’s worthy servants for turning away of God’s wrath comes to nought, yet even then they in their persons and endeavours are graciously accepted and highly commended of him, so verse 25. Josiah gets the highest testimony and commendation that hath been given to men on earth. Moses, Joshua, David, Solomon, and all those worthies that prevailed often with God, to turn away his anger from his people, are no more commended, and some of them not so much as Josiah here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-gillespie.html">Patrick Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rulers’ Sins. The Causes of National Judgments. Or a Sermon Preached at the Fast, upon the 26 Day of December 1650</cite>, (n.p., 1711), pp 2-4.</span></figcaption>

<blockquote><p>Mat. x. 37, ‘He that loveth father or mother more than me, is not worthy of me.’ And to love anything more than Christ, is to hate him. A less degree of love is called hatred in Scripture, Gen. xxix. 30, 31. Because he loved Leah less than Rachel, he is said to hate her. Even as you may be said to hate your relations, enjoyments, lives, when you love them less than Christ, so much less as you will be content to part with them for his sake, whenever he requires it. And in this sense you must be able to hate them, or else you cannot be the disciples of Christ, or else you are not Christians; for upon these terms, and no other, will he own you for such.</p></blockquote>

<blockquote><p>Objection V: God will not the death of a sinner, but rather that he repent and live, Eze. 18:23. Answer. Augustine in his 1st book to Simplicius, 2nd question, answers this question. You must, says he, distinguish betwixt man, as he is born man, and man as he is a sinner. For God is not delighted with the destruction of man, as he is man, but as he is a sinner: neither will He simply the death of any as he is a sinner, or as it is the ruin and destruction of his creature: but in that, by the detestation and revenge of sin with eternal death, his glory is exceedingly advanced. God therefore will the death of a sinner, but as it is a punishment, that is, as it is a means to declare and set out his divine justice: and therefore it is an untruth for a man to say that God would have none condemned. For whereas men are once condemned, it must be either with God’s will, or without it: if without it, then the will of God must needs suffer violence, the which to affirm is great impiety: if with his will, God must needs change his sentence before set down, but we must not presume to say so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chain</cite>, (Cambridge, 1600), ch. 54, ‘Concerning a New Devised Doctrine of Predestination, taught by some New and Late [Arminian] Divines’, the 1st Error, the Confutation</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Objection V: God will not the death of a sinner, but rather that he repent and live, Eze. 18:23. Answer. Augustine in his 1st book to Simplicius, 2nd question, answers this question. You must, says he, distinguish betwixt man, as he is born man, and man as he is a sinner. For God is not delighted with the destruction of man, as he is man, but as he is a sinner: neither will He simply the death of any as he is a sinner, or as it is the ruin and destruction of his creature: but in that, by the detestation and revenge of sin with eternal death, his glory is exceedingly advanced. God therefore will the death of a sinner, but as it is a punishment, that is, as it is a means to declare and set out his divine justice: and therefore it is an untruth for a man to say that God would have none condemned. For whereas men are once condemned, it must be either with God’s will, or without it: if without it, then the will of God must needs suffer violence, the which to affirm is great impiety: if with his will, God must needs change his sentence before set down, but we must not presume to say so.”

— William Perkins, A Golden Chain, (Cambridge, 1600), ch. 54, ‘Concerning a New Devised Doctrine of Predestination, taught by some New and Late [Arminian] Divines’, the 1st Error, the Confutation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+V%3A+God+will+not+the+death+of+a+sinner%2C+but+rather+that+he+repent+and+live%2C+Eze.+18%3A23.+Answer.+Augustine+in+his+1st+book+to+Simplicius%2C+2nd+question%2C+answers+this+question.+You+must%2C+says+he%2C+distinguish+betwixt+man%2C+as+he+is+born+man%2C+and+man+as+he+is+a+sinner.+For+God+is+not+delighted+with+the+destruction+of+man%2C+as+he+is+man%2C+but+as+he+is+a+sinner%3A+neither+will+He+simply+the+death+of+any+as+he+is+a+sinner%2C+or+as+it+is+the+ruin+and+destruction+of+his+creature%3A+but+in+that%2C+by+the+detestation+and+revenge+of+sin+with+eternal+death%2C+his+glory+is+exceedingly+advanced.+God+therefore+will+the+death+of+a+sinner%2C+but+as+it+is+a+punishment%2C+that+is%2C+as+it+is+a+means+to+declare+and+set+out+his+divine+justice%3A+and+therefore+it+is+an+untruth+for+a+man+to+say+that+God+would+have+none+condemned.+For+whereas+men+are+once+condemned%2C+it+must+be+either+with+God%E2%80%99s+will%2C+or+without+it%3A+if+without+it%2C+then+the+will+of+God+must+needs+suffer+violence%2C+the+which+to+affirm+is+great+impiety%3A+if+with+his+will%2C+God+must+needs+change+his+sentence+before+set+down%2C+but+we+must+not+presume+to+say+so.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Golden+Chain%2C+%28Cambridge%2C+1600%29%2C+ch.+54%2C+%E2%80%98Concerning+a+New+Devised+Doctrine+of+Predestination%2C+taught+by+some+New+and+Late+%5BArminian%5D+Divines%E2%80%99%2C+the+1st+Error%2C+the+Confutation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F755fbb9826.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/755fbb9826.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=Objection%20V%3A%20God%20will%20not%20the,must%20not%20presume%20to%20say%20so&amp;text=Objection%20V%3A%20God%20will%20not%20the%20death%20of&amp;text=but%20we%20must%20not%20presume%20to%20say%20so" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

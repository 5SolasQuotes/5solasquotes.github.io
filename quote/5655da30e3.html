<blockquote><p>We all reject their error who make every circumstance of religion unlawful which has not a particular command in Scripture; as if reason might not regulate such by the general command; As if reason might not without express particular precept choose a text, method, words and notes for remembrance in preaching, or might not translate the Scriptures or turn the Psalms into meter and put tunes on each, and many such things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tunes-are-circumstantial.html">Tunes Are Circumstantial</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Manton, Bates, Case, Baxter, Fairclough, et al. | The Judgment of Non-Conformists of the Interest of Reason in Matters of Religion in which it is Proved against Make-Baits that both Conformists &amp; Non-Conformists, &amp; All Parties of true Protestants are herein really agreed, though unskilful speakers differ in words (London: 1676), p. 17 This was signed by 15 non-conformist English puritans.</cite></span></figcaption>

<blockquote><p>…lest the evil one, making use of our natures, should pervert with lascivious and wanton songs; God Himself made us songs, wherein we might both profit and delight. Psalms are the angels’ exercise, the daily practice of blessed saints, the spiritual incense of the host of heaven: the sweet harbor in solitude: the ornament of celebrities, the medicine of sick minds, the mode ratour[?] of affections: an exercise becoming all degrees, all ages, all conditions, since none are either too grave, or too good to praise the Lord. I have not made so large a digression upon this point only to praise these spiritual hymns [God-given psalms], which beyond all commendations, praise themselves to every religious heart and care…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ.</cite>, pp. 30-31</span></figcaption>

</figure><figure class="quote" id="q-3e8fffde8a" data-kw="">
<blockquote><p>1. Because the apostles require us to sing ‘Psalms, Hymns and Spiritual Songs’ (Jm. 5:13; Eph. 5:19; Col. 3:16). Which three are known to be the usual titles of the Scripture Psalms ([Greek &amp; Hebrew] See Ainsworth on the title of Psalm 3). 2. Because these, doubtless, best deserve the title of Spiritual Songs, which were endited by the immediate inspiration of the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-allen.html">Richard Allen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay to Prove the Singing of Psalms with Conjoined Voices, a Christian Duty: and to resolve the doubts concerning it (London, 1696), p. 59. Allen was likely a baptist as at least two of the ministers recommending his book in the preface were baptists and as he is mainly arguing against the position that held that the psalms in meter ought not to be sung at all. He argues for majority psalm singing in the work.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

d it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-685145a5ee" data-kw="">
<blockquote><p>Thirdly, he expresseth the matter to be sung in three words, the very titles which are given to David’s Psalms and other scriptural songs: and though there be some difference among interpreters about the kind of songs, which are expressed by every one of those in particular, yet the most received and probable opinion is that by ‘psalms’ are meant all holy songs in general of whatsoever argument, whether they contain prayers, praises, complaints, deprecations, prophecy, history, or a purpose mixed of all those; and by ‘hymns’ are meant special songs of praise to God; and by ‘songs’, a certain kind of hymns, expressing the praises of God for some of his noble acts, great and wonderful beyond others. And those ‘songs’ he calleth ‘spiritual’ (which epithet is to be extended to the psalms and hymns also), as being framed by the Spirit of God, containing spiritual and heavenly purpose, and requiring the assistance of God’s Spirit and a spiritual frame of heart for singing them aright; and this in opposition to the obscene, filthy, and fleshly songs of carnal men and drunkards. … 2. That we may go about this worship of singing praises to God acceptably, it is necessary that we be filled with the Spirit and have a rich and copious measure of his presence and assistance, though not to compose new songs: for he pointeth at scriptural songs, as the most fitting purpose to be sung, under the titles of “psalms, hymns, and spiritual songs;” yet that we may be enabled to choose the fittest songs for the present occasion, and sing them with such a spiritual, elevated frame of heart, as such a divine and heavenly piece of worship requireth; for he saith, “be filled with the Spirit, speaking to yourselves in psalms and hymns and spiritual songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians (1656-1674; London, 1841), p. 239 &amp; 365 | On Eph. 5:19</cite>, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-418dcaee1c" data-kw="">
<blockquote><p>Songs of holy Scripture are to be sung in the Church; first, because God hath given his Word partly in prose to be read, partly in meter to be sung, Col. 3:16; 2 Sam. 23:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Foundation of Religion long since collected by that Judicious and Elegant man, Mr. Henry Ainsworth… (London, 1641), p. 71. See all of pp. 71-72 for more, along with the footnotes, which have more pertinent Scripture references.</cite></span></figcaption>

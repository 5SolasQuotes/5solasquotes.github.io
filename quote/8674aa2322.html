<main class="wrap"><figure class="quote" id="q-8674aa2322" data-kw="">
<blockquote><p>The sweet and admirable consent which is found in all and every part of Scripture, cannot be ascribed to any but the Spirit of God; each part so exactly agreeing with it self and with the whole. Jo. 5. 46. This may sufficiently appear, by comparing the prophesies of the Old Testament touching Christ, the calling of the Gentiles, and rejection of the Jews, with the accomplishment of them, declared in the New. Gen. 3. 15. and 12. 4. and 49. 10. Numb. 14. 17. Dan. 9. 25. Matth. 1. 18. Luk. 1. 55. and 24. 27. 44. Act. 26. 22. Deut. 32. 21. Mal. 1. 10. 11. Psal 2. 8. and 110. 2. Act. 11. 18. Psal. 118. 22. 23. Matth. 21. 42. Such exact consent as here is to be found, is impossible to be fained of men, or Angels, as the things foretold were removed from their knowledge and finding out, until they were revealed.

These considerations give strength to this argument. 1. The length of time in which this writing continued, viz. from Moses until John, which prevented all conceits of forgery, since they were not written in one, nor yet in many ages. 2. The multitude of books that were written, and of writers who were employed in that service. 3. The distance of place, in which they were written, which did hinder that the writers could not confer together. Jer. 2. 1. 2. and 36. 5. Ezeck. 1. 1. 4. The silence of the adversaries, who in all that long space mentioned, whiles the Scripture was in writing; could never detect any thing in those books, as false, or erroneous; whose silence is of great weight in this case, because they were eye witnesses of those things which our Saviour taught, did and suffered, according as it was prophesied of him, so that they know the prophesies, save the accomplishment of them, and were acquainted with that which the Apostles had written.

If the Prophets or Apostles, who wrote the same histories, do seem to dissent in any circumstances, this doth nothing derogate from their authority; for in themselves they differ not, the fault is our ignorance, and apprehension: by a right and just interpretation, they may easily be reconciled; and the dissonancy which seems to be amongst them in small things, doth free them from all suspicion of fraud; and their sweet consent in all matters of importance, doth convince that they wrote by the guidance of the same Spirit.

If they had all written one thing, they might seem superfluous; if each a new history, there could appear no steps of consent; when they relate the same story with the same circumstances, they have their use, one sometimes speaking more plainly then the other; and when they agree in matter, but seem to dissent in circumstance, the truth is the more confirmed, an argument of fuller credit may be drawn out of that dissent; for as the Heathen man observeth, too exact diligence is neither approved of al, neither doth it want suspicion. To this sweet agreement of holy Scripture with it self, it might be further added, that it agreeth with all other truth whatsoever; there is nothing true in divinity, which is false in Philosophy; nothing in Philosophy is repugnant to the truth in divinity, but it may be overthrown by the principles of right and true Philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short treatise: containing all the principal grounds of Christian religion. By way of questions and answers: very profitable for all sorts of men, but especially for householders</cite>, (London: William Welby, 1617), pp 22-25.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a4fe0d6dca" data-kw="">
<blockquote><p>Never make those things to he sins, which God never made to be sins. To make those things to be sins which God hath made to be no sins, is to make gods of yourselves; yea, it is to lift up yourselves above God himself, as if you were more holy, more wise, more just, and more righteous than the Holy One of Israel is.

Indeed the Papists, that are will-worshippers, and commonly highly conceited of their own wisdom and worth, they frequently transgress this rule with their ‘Touch not, taste not, handle not,’ Col. ii. 21, 23; which things have indeed a show of wisdom in will-worship, &amp;c. But why should you, why should you, who have a higher profession upon you, and a more clear gospel-light shining every day more strongly upon you?

But, … Never make those things to be absolute and necessary duties, that God hath nowhere declared to be such, Isa. xxxiii. 22; James iv. 12. Such things that do neither fall under a general nor a particular command of God, may not be imposed upon the consciences of men as absolute and necessary duties to be performed by them. A faithful observing of these two rules would prevent a multitude of sins, a sea of sorrows, and a world of troubles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 21.</span></figcaption>

<blockquote><p>V. 1, ‘And Nadab and Abihu’ — These jolly young priests, overjoyed haply of their new employment and overwarmed with wine, as some gather out of Lev. 10:9, over did themselves the very day of their service, Lev. 10:19 and are suddenly surprised by a doleful death. … V. 16, ‘And Moses diligently sought the goat of the sin offering, and, behold, it was burnt: and he was angry with Eleazar and Ithamar, the sons of Aaron’ Passion for their dead friends had so transported the priests that they knew not well what they did… but then it must not be excessive as here, and as 2 Sam. 18:33. … V. 18, ‘Behold, the blood of it was not brought in within the holy (place): ye should indeed have eaten it in the holy (place), as I commanded.’ Thus, by misreckoning a point, ye have missed the haven and hazarded yourselves to the rocks of the divine displeasure, against which your brethren so lately split.</p></blockquote>

<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’, pp. 64-65</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.”

/a><a class="perma" href="../quote/3750c533ad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=The%20Papists%20say%20indeed%20that%20all,with%20the%20most%20weighty%20things%20whatsoever&amp;text=The%20Papists%20say%20indeed%20that%20all%20additions%20corrupting&amp;text=of%20adding%20with%20the%20most%20weighty%20things%20whatsoever" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Be exhorted to keep holy this day. You can’t justly say that there is not sufficient evidence that ’tis the mind and will of God that you should sanctify this day. Seeing, therefore, God has sufficiently declared his mind in this, take heed that you do according to it.

God has given such evidences of this being his mind, that he will surely require it of you if you do not strictly and conscientiously observe it. And if you do so, you may have this comfort in the reflection upon [it], that you have not been superstitious in it, but have done as God has revealed it to be his mind and will in his Word that you should do, and that in so doing you are in the way of God’s acceptance and reward.

Motives

1. A strict keeping of the sabbath is a thing whereby the name of God is honoured. God looks upon himself as honoured hereby, and it is in such a way as is very acceptable to him; Isaiah 58:13, “if thou call the sabbath a delight, the holy of the Lord, honourable, and shalt honour him.”

God is honoured by it, as it is a visible showing of respect to God’s holy law and a reverencing that which has a peculiar relation to himself, and that, more in some respects than the observation of many other commandments. A man may be just, and may be generous, and yet not so plainly show respect to the revealed mind and will of God, as many of heathens have been so. But if a person with evident strictness and care observes the sabbath, it is a visible manifestation of a conscientious regard to God’s declaration of his mind and so is a visible honour done to his authority.

A strictly keeping the sabbath is that by which the face of religion is kept up in the world. If it were not for the sabbath, there would be but little public and visible appearance of serving, worshipping, and reverencing the supreme and invisible Being. The sabbath seems to have been appointed much for this end, viz. the upholding the visibility of religion in the public or amongst professing societies of men. And the greater strictness the sabbath is observed with, and the more solemnity the duties of it are attended with amongst a people, the more is there of the appearance and manifestation of respect to the divine Being amongst them.

This should be a powerful motive with us to the keeping the sabbath. It should be our study above all things to honour and glorify God. It should be the great thing with all that bear the name of Christians, how they shall do what shall be [to] the honour of their great God and king, and, I hope, is a great thing with many that hear me at this time. And if this be your inquiry, if this be your desire, hereby you are directed to one way whereby you may do much that way, viz. by honouring the sabbath, and by showing a careful and strict observance of that.

2. That which is the business of the sabbath is the greatest business of our lives, viz. the business of religion. A serving and worshipping God is that for which we were principally made, for which we had our beings given us. Other business that is of a secular nature, that we are wont to attend on weekdays, is but subordinate, to be subservient to the higher purposes and ends of religion. Therefore we surely should not think it much to devote one seventh part of our time to be wholly spent in this business, and set it apart to exercise ourselves in the immediate duties of religion.

3. Let it be considered that all our time is God’s; and therefore, when he challenges of us one day in seven, he challenges his own. He don’t exceed his right; he would not have exceeded his right if he had challenged a far greater proportion of our time to be spent in his immediate service. But he hath mercifully considered our state and our necessities here. And as he hath consulted the good of our souls in appointing a seventh day for immediate duties of religion, so he hath considered our outward necessities and hath allowed us six days for attendance on our temporal affairs. What unworthy treatment therefore will it be of God, if we refuse to allow him even the seventh day.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4591854bf6" data-kw="">
<blockquote><p>If I have observed the sun when it shines, or the moon moving in brightness, so that my heart has been secretly enticed, and my mouth has kissed my hand; this also would be an iniquity deserving of judgment, for I would have denied God who is above. (Job 31:26-8)

26, and 27 Let me be accursed, if beholding the glittering face of the Sun, or looking upon the Moon shining in her brightness, I have, being deceived, so much as privily in my heart, much less openly, consented unto idolaters, and after the manner of their superstitious custom, by moving, and putting my hand to my mouth, yielded any worship unto those bodies. 28 For this is a most heinous sin, as by which I had flatly denied that God, who is above the sun and the very stars them selves, and therefore deserved most horrible and fearful punishments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Job Expounded: Partly in Manner of a Commentary, Partly in Manner of a Paraphrase. Faithfully Translated out of Latin into English</cite>, (Cambridge, 1589), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>

</figure><figure class="quote" id="q-0181e0f60e" data-kw="invocation of saints refuted memory not worship">
<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2b</span></figcaption>

<blockquote><p>XI. But whatever may be said about this diversity of opinions in the Roman school, all its doctors agree on this, as has often been stated:

      2. That this worship can rightly be signified by the term “adoration.</p></blockquote>

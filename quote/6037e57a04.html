<main class="wrap"><figure class="quote" id="q-6037e57a04" data-kw="">
<blockquote><p>If we compare the two Tables together as to the matter contained in them and the immediate object of each duty commanded, the duties of the First Table are greater and the duties of the Second Table lesser, the one relating more immediately, the other more mediately to religion, in which respect they express peculiarly our love to God, which is called the first and great command; For the first four commands require that which in its own nature is worship, and is in an immediate way to be given to God; but the duites required in the other six, are not properly, formally and immediately called for as parts of worship to God, though, as they are acknowledgments of Him, they may be consequentially thereto referred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments</cite>, … (Glasgow: Sanders, 1676), 5th Commandment, pp. 188-89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d31cde9dc" data-kw="">
<blockquote><p>For although the light of nature teach that God is to be worshipped, yet in substantial things reason teaches not how this worship of God is to be administred, nor the house of God to be governed, but in all this we must depend upon the mind and pleasure of Christ, the King of his Church, and Saviour of his body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Friendly Trial of the Grounds tending to Separation in a Plain &amp; Modest Dispute</cite>, … (Cambridge: Daniel, 1640), ch. 12, p. 233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“For although the light of nature teach that God is to be worshipped, yet in substantial things reason teaches not how this worship of God is to be administred, nor the house of God to be governed, but in all this we must depend upon the mind and pleasure of Christ, the King of his Church, and Saviour of his body.”

— John Ball, A Friendly Trial of the Grounds tending to Separation in a Plain &amp; Modest Dispute… (Cambridge: Daniel, 1640), ch. 12, p. 233">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+although+the+light+of+nature+teach+that+God+is+to+be+worshipped%2C+yet+in+substantial+things+reason+teaches+not+how+this+worship+of+God+is+to+be+administred%2C+nor+the+house+of+God+to+be+governed%2C+but+in+all+this+we+must+depend+upon+the+mind+and+pleasure+of+Christ%2C+the+King+of+his+Church%2C+and+Saviour+of+his+body.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Friendly+Trial+of+the+Grounds+tending+to+Separation+in+a+Plain+%26+Modest+Dispute%E2%80%A6+%28Cambridge%3A+Daniel%2C+1640%29%2C+ch.+12%2C+p.+233&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5d31cde9dc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5d31cde9dc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=For%20although%20the%20light%20of%20nature,Church%2C%20and%20Saviour%20of%20his%20body&amp;text=For%20although%20the%20light%20of%20nature%20teach%20that&amp;text=of%20his%20Church%2C%20and%20Saviour%20of%20his%20body" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-12bc9a21f6" data-kw="">
<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), ‘The Distribution of Theology’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-76b56e04c0" data-kw="">
<blockquote><p>There are three fundamental principles held by non-conformists (and those especially of them which are called presbyterians) wherein they differ from others: 1. That the Scriptures of the Old and New Testament are a perfect Rule for Christians, directing them not only what to believe in the things of God, but also what to do in all matters relating to the Worship of God, and the government of the Church; so as in these things they may not either believe or do what is not there expressly, or by immediate consequence revealed. In civil matters they believe the Scripture to be only a general rule, or rather as to them, to contain some general rules only, by which all men’s actions are to be directed; but in sacred things, they believe the Scriptures to be a particular rule… Thus they differ from Papists, who will not allow the Scriptures to be a perfect rule as to matters of faith; and from those, who although they allow them in matters of faith a perfect rule, yet deny them to be so in the matters of worship, or government of the Church; and as to the first, say that the Scriptures are only a perfect rule as to acts of worship, not as to means, and modes, or religious rites used in, and about the worship of God; but that these may be directed by superiours for spiritual edification; or who say, that the Scripture has only directed that the Church should be governed, but has left to superiours to determine by what officers, acts and rules that government should be exercised: So as the first and main question is, Whether the Scriptures be a perfect and sufficient rule for Christians in matters of worship, and Church government, as well as matters of faith? which those called presbyterians believe it is; because they find sufficient directions in it for the decent and orderly performance of all acts of worship, without any human supplements; and such Church-officers directed by it, such acts of jurisdiction and censures prescribed in it, as are sufficient to preserve the unity, peace and purity of the Church; which are the great ends of that government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-presbyterians.html">English Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anonymous, English Presbytery, or an Account of the Main Opinions of those ministers and people in England who go under the name of Presbyterians</cite>, … (London, 1680), pp. 1-2</span></figcaption>

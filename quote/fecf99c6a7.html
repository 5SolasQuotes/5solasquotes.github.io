<main class="wrap"><figure class="quote" id="q-fecf99c6a7" data-kw="">
<blockquote><p>The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-46f0d722fe" data-kw="">
<blockquote><p>Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 4th Decade, Case 1, ‘Whether the Marriage of a Son or Daughter without or against the Parents’ Consent may be Accounted Lawful?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 293-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.”

>Share on X</a><a class="perma" href="../quote/46f0d722fe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/quotes-on-the-authority-of-fathers-in-giving-away-their-daughters-in-marriage/#:~:text=Doubtless%20then%2C%20we%20may%20in%20a,consent%20to%20his%20choice%20in%20marriage&amp;text=Doubtless%20then%2C%20we%20may%20in%20a%20generality%20safely&amp;text=the%20parents%E2%80%99%20consent%20to%20his%20choice%20in%20marriage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood: Or a Comparison between the Truth now taught in England &amp; the Doctrine of the Romish Church</cite>, … (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<main class="wrap"><figure class="quote" id="q-b52da0bba0" data-kw="">
<blockquote><p>Wherefore, when the Lord invites the Jewish people to repentance, He gives no injunction concerning another circumcision, though (as we have said) they were circumcised by a wicked and sacrilegious hand, and had long lived in the same impiety. All He urges is conversion of heart. For how much soever the covenant might have been violated by them, the symbol of the covenant always remained, according to the appointment of the Lord, firm and inviolable. Solely, therefore, on the condition of repentance, were they restored to the covenant which God had once made with them in circumcision, though this which they had received at the hand of a covenant-breaking priest, they had themselves as much as in them lay polluted and extinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4; ch. 15, sect. 17, p. 341</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12db482fb9" data-kw="">
<blockquote><p>…but after showing us that we have degenerated from our true origin, viz., the law of our Creator, adds, that Christ, through whom we have returned to favor with God, is set before us as a model, the image of which our lives should express. What do you require more effectual than this? Nay, what do you require beyond this? If the Lord adopts us for his sons on the condition that our life be a representation of Christ, the bond of our adoption—then, unless we dedicate and devote ourselves to righteousness, we not only, with the utmost perfidy, revolt from our Creator, but also abjure the Savior Himself.</p></blockquote>

</figure><figure class="quote" id="q-d29ae1160a" data-kw="">
<blockquote><p>The second thing to be gathered is that the fathers before Christ, ever since the Fall of Adam, and Christians in the times of the Gospel, did live under the same Covenant for substance, but not for manner of administration, which is most clear by evident testimonies of holy Scripture, and by the very form of the Covenant, which was one before and after the coming of Christ. The same God that calls us, called them to the hope of eternal life: they were endued with the same Spirit, and lived by the same faith. Their sacraments, for substance and signification, agree with ours; and they expected an inheritance everlasting and undefiled. Religion for substance was ever one and unchangeable, and such as were truly religious walked in the same way, and waited for the same heavenly inheritance and everlasting crown of glory. The Church before Christ may be considered as an heir, or as an infant, according to the substance of the covenant, or according to the manner of administration. In the first respect the Church is under the Covenant or promise, and her people are called a free and willing people, an heir of heavenly and spiritual blessings. In the latter respect she is under the Covenant, in respect of the different administration, and her people are called a servile people in comparison, an heir under tutors and governors, not differing from a servant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’; p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

rc" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace#:~:text=The%20second%20thing%20to%20be%20gathered,governors%2C%20not%20differing%20from%20a%20servant&amp;text=The%20second%20thing%20to%20be%20gathered%20is%20that&amp;text=tutors%20and%20governors%2C%20not%20differing%20from%20a%20servant" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-300543fdb6" data-kw="">
<blockquote><p>From all this it follows: First, that all the faithful are of the same faith with Abraham. The father and the sons-spiritual are of the same belief: as they do partake of the same spiritual privileges. It is one God that justifies the circumcision and the uncircumcision, and it is the same faith whereby the promises of mercy are embraced. Zaccheus is called the son of Abraham, and he believed in Christ as did Abraham.

2. Not only promises of temporal good things, but of spiritual and eternal were made to the patriarchs in the Covenant of Grace, and sought and obtained by them. They looked for a city whose builder and maker the Lord is. (Heb. 11:11-12) Remission of sins and life everlasting was preached in the Covenant, sealed in the sacrament, and typified by the land of Canaan. To conceive the fathers to be an assembly of brute beasts, which looked to be fed with earthly blessings alone, is highly to dishonor them, and lessen the grace and mercy of God towards them.

3. Sacramental phrases, wherein the name of the thing signified is given to the sign, are ancient and familiar; as circumcision is called the Covenant, and the rock Christ. Why then should our adversaries stumble at this, that in the sacrament of the Supper the bread is called the body of Christ?

4. In this expression of the Covenant, the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645) | ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, pp. 91-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><figure class="quote" id="q-77c6f64958" data-kw="">
<blockquote><p>At first Ishmael had obtained the same rank with his brother Isaac, because the spiritual covenant was equally sealed in him by the symbol of circumcision. He is first cut off, then Esau, at last an innumerable multitude, almost the whole of Israel. In Isaac was the seed called. The same calling held good in the case of Jacob. God gave a similar example in the rejection of Saul. This is also celebrated in the psalm, “Moreover, he refused the tabernacle of Joseph, and chose not the tribe of Ephraim: but chose the tribe of Judah,” (Ps. 78:67-68) This the sacred history sometimes repeats, that the secret grace of God may be more admirably displayed in that change. I admit that it was by their own fault Ishmael, Esau, and others, fell from their adoption; for the condition annexed was that they should faithfully keep the covenant of God, whereas they perfidiously violated it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, ch. 21, sect. 6, p. 537</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“At first Ishmael had obtained the same rank with his brother Isaac, because the spiritual covenant was equally sealed in him by the symbol of circumcision. He is first cut off, then Esau, at last an innumerable multitude, almost the whole of Israel. In Isaac was the seed called. The same calling held good in the case of Jacob. God gave a similar example in the rejection of Saul. This is also celebrated in the psalm, “Moreover, he refused the tabernacle of Joseph, and chose not the tribe of Ephraim: but chose the tribe of Judah,” (Ps. 78:67-68) This the sacred history sometimes repeats, that the secret grace of God may be more admirably displayed in that change. I admit that it was by their own fault Ishmael, Esau, and others, fell from their adoption; for the condition annexed was that they should faithfully keep the covenant of God, whereas they perfidiously violated it.”

<main class="wrap"><figure class="quote" id="q-d454a43305" data-kw="">
<blockquote><p>Therefore the evangelist John makes this the first work of the Spirit, that it shall convince the world of sin (Jn. 16:8): which is so needful, that without it Christ Jesus can never enter into the heart: for He promises to dwell only with them that are humble in spirit and contrite in heart (Isa. 57:15), through the sight of their iniquities, and of God’s displeasure justly deserved for the same: and calls those alone unto Him that are weary and heavy laden (Mt. 11), groaning and sighing under the burden of their sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seven Godly &amp; Fruitful Sermons</cite>, … (London: Kyngston, 1614), ‘Of extinguishing the graces of the Spirit’, pp. 189-90</span></figcaption>

<blockquote><p>(2) God has been importunate in entreaties of us. God offers not only truce, but a peace, and has been most active in urging a reconciliation. Can He manifest his willingness in clearer methods, than that of sending his Son to reconcile the world to Himself? Can He evidence more sincerity than by his repeated and reiterated pressing of our souls to the acceptance of Him? God knocks at our hearts, and we are deaf to Him; He thunders in our ears, and we regard Him not; He waits upon us for our acceptance of his love, and we grow more mad against Him; He beseeches us, and we ungratefully and proudly reject Him; He opens his bosom, and we turn our backs; He offers us his pearls, and we tread them under our feet; He would give us angels’ bread, and we feed on husks with swine. The wisdom of God shines upon us, and we account it foolishness. The infinite kindness of God courts us, and we refuse it, as if it were the greatest cruelty. Christ calls and begs, and we will not hear Him either commanding or entreating…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Stephen Charnock</cite>, 5 vols. (d. 1680; Edinburgh: Banner of Truth, 1997), vol. 5, “Man’s Enmity to God,”, p. 521</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-3327517afd" data-kw="">

</figure><figure class="quote" id="q-d11313ad37" data-kw="">
<blockquote><p>1. That this offer is real. Christ does not deceive, or dissemble with sinners, but really He does desire they should have liberty. Men sometimes make offers of good things to one another, but they are not sincere in them. But it is not so with Christ; He is a real well-wisher to sinners’ souls. He has expressed it all the ways that can be desired. Would you believe his reality, if He does woo sinners? Why, so He does, Lk. 14:23, compel them to come in, viz. by importunate entreaty. Would you believe his reality, if He does wait for sinners? Why, so He does, Rev. 3:20, ‘Behold I stand at the door, and knock, etc.’ Would you believe his reality if He does weep for sinners? Why, so He does, He wept over Jerusalem, Lk. 19:41-42. Would you believe his reality if He does die for sinners? Why, so He did, Rom. 5:8. While we were yet sinners, Christ died for us. Nay, would you believe his reality if he should be damned for sinners? Why, so He was, though not in respect of the place, yet in respect of the pains of Hell: He was ;’made a curse for us,’ Gal. 3:13. What would you have Christ to say or do more than He has said and done, to convince you, that He would have sinners to be partakers of this freedom. Has He not said so in his Word? Has He not sealed it with his blood? Has He not accepted and embraced from time to time, whoever came unto Him? Does He not engage Himself by his faithful promise, to do so still to the end of the world, that He will in no wise cast out such as come to Him, Jn. 6:37. And yet what a wonder is it, that the world is so unbelieving still? and so hard to be persuaded, that Christ has any loving thoughts or purposes towards them? Oh this cursed unbelief, and hardness of heart, that is in men and women that makes them that they will not come to Christ that they might have life!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-ball.html">Nathanael Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Bondage &amp; Freedom, or a Treatise containing the Substance of Several Sermons</cite>, … from John 8:36 (London: Robinson, 1683), pp. 36–38 Ball (1623–1681) was an English, partial conformist presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

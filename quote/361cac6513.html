<blockquote><p>Also the Lord, who is wonderful in counsel and whose ways and judgments are past finding out, may have many other wonderful and inconceivable ways in the carrying on of this judgement; for, if all His judgments be a great depth, much more are his spiritual judgments.</p></blockquote>

</figure><figure class="quote" id="q-cc61a43d00" data-kw="">
<blockquote><p>October 31, 1798… I have just passed through the most awful scene of epidemic sickness and mortality that I ever witnessed. The Yellow Fever has been raging in the city for more than two months past. From the middle to the 25th of this month was the most mortal time. Though the city was deserted by, perhaps, two-thirds of its regular inhabitants, more than two thousand persons fell victim to the disease. I remained with a brother — a beloved brother — a practitioner of medicine — a bachelor as well as myself. We were both mercifully borne through the raging epidemic without any serious attack. Our housekeeper died of it, and I attended her funeral between midnight and day. To attempt to describe the scenes of mourning and horror which this epidemic presented — I dare it. The task transcends my power of expression. I preached every Sabbath; but only a few attended public worship; and I know not that any sensible — certainly no conspicuous — good was done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Samuel Miller, Jr., The Life of Samuel Miller, D.D. LL.D., Vol. 1</cite>, p. 118</span></figcaption>

<blockquote><p>…[Magistrates, during a time of plague] must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9)…</p></blockquote>

</figure><figure class="quote" id="q-f074ea804b" data-kw="">
<blockquote><p>45. The second difference [between civil and church power] is in the object, or matter about which: The power politic or civil is occupied about the outward man and civil or earthly things, about war, peace, conservation of justice and good order in the commonwealth; also about the outward business or external things of the Church, which are indeed necessary to the Church, or profitable, as touching the outward man, yet not properly and purely spiritual, for they do not reach unto the soul, but only to the external state and condition of the ministers and members of the Church. 46. For the better understanding whereof, tis to be observed that so far as the ministers and members of the Church are citizens, subjects or members of the commonwealth, it is in the power of the Magistrate to judge, determine and give sentence concerning the disposing of their bodies or goods; As also concerning the maintenance of the poor, sick, the banished and of others in the Church which are afflicted; To regulate (so far as concerns the civil order) marriages, burials, and other circumstances which are common both to holy and also to honest civil societies; to afford places fit for holy assemblies and other external helps by which the sacred matters of the Lord may be more safely, commodiously and more easily in the Church performed: To remove the external impediments of divine worship or of ecclesiastical peace, and to repress those which exalt themselves against the true Church and her Ministers, and do raise up trouble against them. … 66. Fourthly, they [the Church and magistrate] differ in the[ir] end [design]: The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and counsel of judges; or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured, and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>

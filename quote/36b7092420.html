<main class="wrap"><figure class="quote" id="q-36b7092420" data-kw="">
<blockquote><p>The gospel does not promise salvation on condition of good works as causes effecting it, but on condition of faith and repentance: the one as an instrument of accepting remission of sins the other as a causa sine qua non [casue without which: nothing]: nor on condition of such repentance or new obedience as is perfect, but such as is by grace begun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-alting.html">Henry Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, pt. 2</cite>, p. 688 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, p. 408</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3df19304a" data-kw="">
<blockquote><p>It still continues equally true, upon the Protestant as upon the Romish doctrine of justification, that God requires of us faith and repentance, and requires them of us as indispensably necessary to our escaping His wrath and curse due to us for our sins, though not as exerting any causality or efficiency in procuring or obtaining for us pardon and acceptance, except instrumentally in the case of faith;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, (Edinburgh: T&amp;T Clark, 1863), vol. 2, ch. 21, ‘Justification’, section 1, ‘Popish &amp; Protestant Views’, p. 88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-81aaec752a" data-kw="">
<blockquote><p>If here it be demanded which of these we do first receive, I answere that the spirit, the virtues of the Spirit, the habitual justice which is engrafted, the external justice of Jesus Christ, which is imputed: these we receice all at one and the same time; whensoever we have any of these, we haue all; they goe together. Yet since no man is justified except he believe, and no man believes except he have faith, and no man except he have received the spirit of adoption, has faith, for asmuch as they do necessarily infer justification, and justification does of necessity presuppose them: we must needs hold that imputed righteousness, in dignity being the chiefest, is notwithstanding in order the last of all these: but actual righteousness, which is the righteousness of good works, succeeds all, follows after all, both in order and time. Which being attentively marked, shows plainly how the faith of true believers cannot be divorced from hope and love; how faith is a part of sanctification, and yet unto justification necessary; how faith is perfected by good works, and no work of ours without faith;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works &amp; how the Foundation of Faith is Overthrown</cite>, (d. 1600; Oxford: Barnes, 1612), pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-cf04129731" data-kw="">
<blockquote><p>4… More rightly, therefore, do other Protestants, who are more sound and moderate, willingly concede that various disposing and preparing acts, produced in us through the Holy Ghost assisting, and not by the sole powers of our free-will, are required before justification, though most of them deny to these acts any power of justifying. (Pareus contra Bellarmine on Justification, bk. 1, ch. 3, p. 35, sect. secundo tenendum ff.; with many others) 5. Although not everything which has been said and written, and is commonly cited by Romanists and others for each of these disposing acts (e.g. ‘We are saved by hope,’ [Rom. 8:24] ‘Her sins, which are many, are forgiven, for she loved much,’ [Lk. 7:47] and some others), fully proves the point in question, yet they greatly err who, on that account, deny the thing itself, which is most certain from innumerable other passages of Scripture. 6. All Protestants rightly deny that these disposing acts done by faith and preventing grace, merit justification in any way, even in that of congruity; but very many Romanists also deny this, in opposition to the opinion of Bellarmine…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 27</span></figcaption>

</figure><figure class="quote" id="q-9aa4368dc7" data-kw="">
<blockquote><p>And therefore, lastly, in answer to diverse places of the ancients which are produced to confirm the modern sense of justification by faith alone, I answer in a word: That it is true, their words seem to attest so much, but their meaning was plainly no more than this: That faith many times does justify without works, that is, any outward manifestation of their faith, by such fruits: but never without inward acts of repentance and charity distinct from this special faith: nor without such a devotion to good works, which wants nothing but opportunity to exert them; which is by an extraordinary clemency and grace of God, accepted for the thing itself. This appears by the example by them given, to manifest their meaning, of the thief on the cross; who was so justified and saved by faith alone, without good works answerable thereunto, because his sudden faith was prevented by sudden death. Nevertheless, that his faith was so much alone as to exclude repentance, and such graces as were compatible to one in his condition, from a proportionable concurrence to that effect, is nowhere said, nor intended by any of the fathers whose judgment is of account in the Church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 20, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

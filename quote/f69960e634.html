<main class="wrap"><figure class="quote" id="q-f69960e634" data-kw="">
<blockquote><p>Francis Turretin held to the standard Reformed distinction between the secret and revealed will of God (it being a distinction in the one, simple will of God; cf. Institutes, third topic, fifteenth question). He rejected the distinction between the antecedent and consequent, or conditional and absolute will of God to which the Arminians and others subscribed. This view held that God had by an antecedent or conditional will purposed to save all men, but by consequent or absolute will decreed the salvation of believers and the damnation of unbelievers (see Institutes, 3.16.4).

Turretin responds to this heterodox position by arguing that it is dishonouring to God:

VI. This distinction is in many ways injurious to God: (1) because it attributes to him contrary wills (viz., that God wills the salvation of all and wills the salvation only of some); that from eternity he seriously willed the salvation of Judas and yet, at the same time in the same moment, knew that Judas never would believe; and that he did not will to give faith to Judas by which he might infallibly have been converted; yea, would permit him to remain in his unbelief and to perish. Who would dare to attribute such wills to a man of sound mind, as to say that he willed seriously and ardently what he knew never would happen, and indeed would not happen because he nilled to effect it, on whom alone the effect depends? …

VII. Second, this distinction cannot have place in God without ascribing to him not only folly and impotence (by making him intend seriously and desire with natural affection that which is not performed and cannot be performed through man because he himself does not will it); but also mutability because there can be no place for the consequent will until the antecedent is first rescinded. For how could God at the same time, by the same act of will, will to save all men and to damn the greater part of them? …

X. Fifth, it is repugnant to the gospel which constantly teaches that God wills to save not all simply, but only the elect and believers in Christ and that the means of salvation are not offered or conferred upon all, but only upon some. In fine, it overthrows the eternal election of God because it leaves it uncertain, founded not upon the good pleasure of God, but upon human will (than which nothing is more uncertain and changeable). It makes it such as that no execution can answer to it (i.e., makes it void and inefficacious).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Phillipsburg, 1992), 3.16.6-7, 10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f529867863" data-kw="">
<blockquote><p>X. We may sometimes interchange the eudokian [good-purpose of decree] for the euarestia [good-pleasure or complacency of the revealed will], when it is spoken of those things with which God is pleased because there is in them some quality or condition which agrees with the nature of God and therefore conciliates his favor…

XI. Eurestia contradistinguished from eudokian in this connection means nothing else than the mere complacency by which God approves anything as just and holy and delights in it (and besides wills to prescribe it to the creature as his most just duty). Hence it does not properly include any decree or volition in God, but implies only the agreement of the thing with the nature of God (according to which He cannot but love what is agreeable to his holiness)… … XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>

<blockquote><p>48. In whatever God wills He is universally effectual; He is not hindered or frustrated in obtaining what He wills. For if He should properly will anything and not attain it He would not be wholly perfect and blessed. … 53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.</p></blockquote>

<blockquote><p>Effective permission or willing permission; especially, the providential concursus (q.v.) underlying evil acts of human beings; a concept typical of Reformed theology, which will not allow a bare or ineffectual permission on the part of God and which will acknowledge no realm of activity outside of the will of God. God therefore is viewed as positively willing to permit the free agency of human beings and as supporting their acts with his providential concursus even when those acts go against his revealed will.</p></blockquote>

</figure><figure class="quote" id="q-65583f6f88" data-kw="">
<blockquote><p>Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (Herder Book Co., 1950), ch. 10, God’s Will &amp; God’s Love, pp. 104-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.”

— Reginald Garrigou-Lagrange, Reality: a Synthesis of Thomistic Thought, (Herder Book Co., 1950), ch. 10, God’s Will &amp; God’s Love, pp. 104-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+we+understand+that+God%E2%80%99s+efficacious+will+is+always+infallibly+fulfilled%E2%80%A6+In+what+sense%2C+then%2C+do+we+speak+of+God%E2%80%99s+inefficacious+will%3F+This+will%2C+says+Thomas+%28Ia%2C+q.+19%2C+a.+6+%5BWhether+the+Will+of+God+is+always+fulfilled%3F%5D%2C+ad+1%29%2C+is+a+conditioned+will%2C+an+antecedent+will%2C+which+wills+all+that+is+good+in+itself%2C+independently+of+circumstances.+Now+this+conditional%2C+antecedent+will+remain%5Bs%5D+inefficacious+because%2C+in+view+of+a+higher+good+of+which+He+alone+is+judge%2C+God+permits+that+this+or+that+good+thing+does+not+come+to+pass.+Thus%2C+in+view+of+that+higher+good+%2C+God+permits+to+illustrate%2C+that+harvests+do+not+reach+maturity%2C+that+the+gazelle+becomes+the+prey+of+the+lion%2C+that+the+just+suffer+persecution%2C+that+this+or+that+sinner+dies+in+final+impenitence.+Sometimes+we+see+the+higher+good+in+question%2C+sometimes+we+cannot.+In+permitting+final+impenitence%2C+for+example%2C+God+may+be+manifesting+infinite+justice+against+obstinacy+in+evil.+Such+is+the+Thomistic+distinction+of+antecedent+%28inefficacious%29+will+from+consequent+%28efficacious%29+will%E2%80%A6+To+illustrate.+God+willed%2C+by+consequent+will%2C+the+conversion+of+St.+Paul.+This+conversion+comes+to+be%2C+infallibly+but+freely%2C+because+God%E2%80%99s+will%2C+strong+and+sweet%2C+causes+Paul%E2%80%99s+will+to+consent+freely%2C+spontaneously%2C+without+violence%2C+to+his+own+conversion.+God+did+not+on+the+other+hand+will%2C+efficaciously%2C+the+conversion+of+Judas%2C+though+He%2C+conditionally%2C+inefficaciously%2C+antecedently%2C+certainly+willed+it%2C+and+He+permitted+Judas+to+remain%2C+freely%2C+in+final+impenitence.+What+higher+good+had+God+in+mind%3F+This%2C+at+least%3A+the+manifestation+of+infinite+justi

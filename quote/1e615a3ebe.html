<main class="wrap"><figure class="quote" id="q-1e615a3ebe" data-kw="">
<blockquote><p>And all students in divinity are most expressly enjoined, upon pain of being declared unworthy of ever serving in the sacred ministry, to raise any stirs or debates about unnecessary questions, as concerning the order of God’s decrees, of universal grace by the preaching of nature, which may lead and bring men unto salvation, points only propounded and advanced by pure curiosity, and for the exercise of men’s wits. And all examiners of our proposans in order to the ministry, shall proceed in that business with very much charity, exacting from them nothing but what is demanded by the canons of our discipline; and provided they give that satisfaction which is requisite, by signing the Confession of Faith, the Liturgy of our Churches, and the Canons of Alez, Charenton, and Alenson, and this present act, they shall be approved and admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/regarding-ordinands.html">Regarding Ordinands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3rd National Synod of Charenton 1644 / 1645</cite>, ch. 10, p. 455</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<main class="wrap"><figure class="quote" id="q-d1249d1fe4" data-kw="">
<blockquote><p>Fully adequate [exhaustive] knowledge is something of which we possess very little. Everywhere and in every area of life we finally run into mystery. The inner being of things, the thing as such, escapes our perception. We observe phenomena and from them infer the essence of things; we learn to know stable properties and from them we deduce the substance, but this substance itself lies behind the phenomenon and as such is unknown to us. Physics assumes the existence of atoms or electrons or energies as the final components of the material world, but does not have even a smidgen of empirical knowledge of them. Only the most simple things can be defined. As soon as things are of a somewhat higher order, they can no longer be completely captured in a concept. This is already true of the visible world, but it is even more applicable in the world of invisible things. Human beings are corporeal, sense-oriented beings. All their knowledge originates in, and arises from, sense perception. Our thinking is bound up with our senses, just as our soul is with our body. We never perceive spiritual realities directly but only by the medium of material things. We see all things ‘dimly.’ Not only God but also the soul and the entire spiritual world only become known to us through the medium of the world of the senses. This is why we refer to all spiritual matters with names that have their primary reference in the visible world… The same is true in religion and theology. There is no fully adequate knowledge of God. We cannot name him as he is within himself. All his names are derived from the world of creatures. But this does not make them untrue, a product of human imagination. Just as there is resemblance between various parts of the world, making comparison between them a possibility, so also there is kinship between God and his creatures, a kinship that warrants the use of creaturely language in speaking of him. Furthermore, though temporally the natural is prior to the spiritual, logically and ideally the spiritual precedes the natural. The natural could never guide us to the spiritual if it had not itself proceeded from the spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, Volume 2: God and Creation</cite>, trans. John Vriend, ed. John Bolt (Grand Rapids: Baker Academic, 2004), 144–45.</span></figcaption>

<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>

</figure><figure class="quote" id="q-2744cc85f0" data-kw="">
<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>

<blockquote><p>Similarly, the soul of a man isn’t a complete substance; only the soul and body (i.e. the form and matter) together constitute a thing or substance, that is, a man. It isn’t the soul that thinks when a man uses his intellect; it is the man himself who thinks, just as it is the man himself, and not the soul, who grows taller, digests his food, and walks around. For this reason, it is not at all surprising that human thought should be very closely correlated with certain brain events even if it is not identical to any of them. Since the soul is the form of the body, including the brain, the connection between them is in many ways like the connection between the form of the some particular table–its round shape, its having four legs, its being brown, etc.–and the matter that make up the table; that is, it i bound to be very close indeed. When the intellect determines that a certain course of action is the best one to take and the will follows it, the body proceeds to move in a way that constitutes the action. The operation of intellect and will constitute in this case is the formal-cum-final caue of the action, of which the firing of the neurons, flexing of the muscles, etc. are the material cause. Then there is the fact that even though the intellect itself operates without any bodily organ, it does depend indirectly on the senses for the raw material from which it abstracts universals or essences (e.g. it abstracts the universal ‘triangularity’ from particular triangles it has perceived). And the sense organs, along with the brain events associated with perceptual experiences, are material. But precisely because the operation of the intellect are not directly dependent on the matter of the brain, the parallel with the form of a table is not exact. If the soul can, unlike the form of a table, function apart from the matter it informs (as it does in thought), then it can also, and again unlike the form of a table, exist apart from the matter it informs, as a kind of incomplete substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (South Bend, Indiana: St. Augustine’s Press, 2008), ch. 4, ‘The Soul’, p. 127</span></figcaption>

xist apart from the matter it informs, as a kind of incomplete substance.”

<blockquote><p>Add, that Possevinus [d. 1611] in his Sacred Apparatus under the entry “Gilbert Genebrard” judges that the no less harsh phrases of Augustine, Jerome and all the other phrases of the fathers, by which they call God the cause of Himself, must be so expounded with Suarez, that He is ‘from Himself’ and ‘Autotheos’, negatively, that is, having being without emanation from another: so that through that negation the positive and simple perfection of that being is declared, which so in itself and in its essence includes existence itself, that it receives it from no one: which perfection that being does not have, which does not have being, unless it receives it from another.</p></blockquote>

<blockquote><p>But Theology properly so called, is either Original or derived. Original, is that knowledge whereby God knows himself, which really differs not from God’s essence. Derived, is a certain image or representation of that Original primarily in Christ our mediator, secondarily in Christ’s members. Now whereas a part of Christ’s members is triumphant in heaven, another part militant here on earth; that Theologie of the triumphant part is called the Theologie of the blessed saints; that of the militant is styled the Theology of Travellers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-872872fa2e" data-kw="">
<blockquote><p>Furthermore, it seems that to proceed against the cruelty of tyrants is an action to be undertaken not through the private presumption of a few, but rather by public authority. If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power. It must not be thought that such a multitude is acting unfaithfully in deposing the tyrant, even though it had previously subjected itself to him in perpetuity, because he himself has deserved that the covenant with his subjects should not be kept, since, in ruling the multitude, he did not act faithfully as the office of a king demands.

Thus did the Romans, who had accepted Tarquin the Proud as their king, cast him out from the kingship on account of his tyranny and the tyranny of his sons; and they set up in their place a lesser power: namely, the consular power. Similarly Domitian, who had succeeded those most moderate emperors, Vespasian, his father, and Titus, his brother, was slain by the Roman senate when he exercised tyranny, and all his wicked deeds were justly, and profitably, declared null and void by a decree of the senate. Thus it came about that Blessed John the Evangelist, the beloved disciple of God, who had been exiled to the island of Patmos by that very Domitian, was sent back to Ephesus by a decree of the senate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-2845c96678" data-kw="">
<blockquote><p>The Starting point of theory of knowledge ought to be ordinary daily experience, the universal and natural certainty of human beings concerning the objectivity and truth of their knowledge. After all, it is not philosophy that creates the cognitive faculty and cognition. Philosophy only finds it and then attempts to explain it. Any solution that does not explain the cognitive faculty but instead destroys it and, failing to understand cognition, turns it into an illusion, is judged by that fact. Only a theory of knowledge that penetrates the very depths of the problem has a chance to succeed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, ed. John Bolt trans. John Vriend (Grand Rapids: Baker, 2003), 223.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

</figure><figure class="quote" id="q-3f47cc2a9a" data-kw="">
<blockquote><p>There were others who, although they believed that the Word was not changed into flesh but assumed it, nevertheless said that he assumed flesh without a soul; for if he had assumed flesh with a soul, the Evangelist would have said, the Word was made flesh with a soul. This was the error of Arius, who said that there was no soul in Christ, but that the Word of God was there in place of a soul.

The falsity of this opinion is obvious, both because it is in conflict with Sacred Scripture, which often mentions the soul of Christ, as: my soul is sad, even to the point of death (Matt 26:38), and because certain affections of the soul are observed in Christ which can not possibly exist in the Word of God or in flesh alone: he began to be sorrowful and troubled (Matt 26:37). Also, God cannot be the form of a body. Nor can an angel be united to a body as its form, since an angel, according to its very nature, is separated from body, whereas a soul is united to a body as its form. Consequently, the Word of God cannot be the form of a body.

Furthermore, it is plain that flesh does not acquire the specific nature of flesh except through its soul. This is shown by the fact that when the soul has withdrawn from the body of a man or a cow, the flesh of the man or the cow is called flesh only in an equivocal sense. So if the Word did not assume flesh with a soul, it is obvious that he did not assume flesh. But the Word was made flesh; therefore, he assumed flesh with a soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Evangelium S. Ioannis Lectura</cite>, (1270-72), C.1.L7.n167, 167.2-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

quote/3f47cc2a9a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/12/10/thomas-aquinas-on-christ-assuming-a-human-soul/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-577c12eebf" data-kw="">
<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of God</cite>, bk. 11, ch. 26 in NPNF1 2.220</span></figcaption>

— Augustine of Hippo, City of God, bk. 11, ch. 26 in NPNF1 2.220">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+we+both+are%2C+and+know+that+we+are%2C+and+delight+in+our+being%2C+and+our+knowledge+of+it.+Moreover%2C+in+these+three+things+no+true-seeming+illusion+disturbs+us%3B+for+we+do+not+come+into+contact+with+these+by+some+bodily+sense%2C+as+we+perceive+the+things+outside+of+us%E2%80%94colors%2C+e.g.%2C+by+seeing%2C+sounds+by+hearing%2C+smells+by+smelling%2C+tastes+by+tasting%2C+hard+and+soft+objects+by+touching%E2%80%94of+all+which+sensible+objects+it+is+the+images+resembling+them%2C+but+not+themselves+which+we+perceive+in+the+mind+and+hold+in+the+memory%2C+and+which+excite+us+to+desire+the+objects.+But%2C+without+any+delusive+representation+of+images+or+phantasms%2C+I+am+most+certain+that+I+am%2C+and+that+I+know+and+delight+in+this.+In+respect+of+these+truths%2C+I+am+not+at+all+afraid+of+the+arguments+of+the+Academicians%2C+who+say%2C+%E2%80%98What+if+you+are+deceived%3F%E2%80%99+For+if+I+am+deceived%2C+I+am.+For+he+who+is+not%2C+cannot+be+deceived%3B+and+if+l+am+deceived%2C+by+this+same+token+I+am.+And+since+I+am+if+I+am+deceived%2C+how+am+I+deceived+in+believing+that+I+am%3F+for+it+is+certain+that+I+am+if+I+am+deceived.+Since%2C+therefore%2C+I%2C+the+person+deceived%2C+should+be%2C+even+if+I+were+deceived%2C+certainly+I+am+not+deceived+in+this+knowledge+that+I+am.+And%2C+consequently%2C+neither+am+I+deceived+in+knowing+that+I+know.+For%2C+as+I+know+that+I+am%2C+so+I+know+this+also%2C+that+I+know.+And+when+I+love+these+two+things%2C+I+add+to+them+a+certain+third+thing%2C+namely%2C+my+love%2C+which+is+of+equal+moment.+For+neither+am+I+deceived+in+this%2C+that+I+love%2C+since+in+those+things+which+I+love+I+am+not+deceived%3B+though+even+if+these+were+false%2C+it+would+still+be+true+that+I+loved+false+things.+For+how+could+I+justly+be+blamed+and+prohibited+from+loving+false+things%2C+if+it+were+false+that+I+loved+them%3F+But%2C+

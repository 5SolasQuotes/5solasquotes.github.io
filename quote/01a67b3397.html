<main class="wrap"><figure class="quote" id="q-01a67b3397" data-kw="">
<blockquote><p>It is no wonder, therefore, that such a number of musical instruments should be so heaped together; but although they were a part of the Pedagogia Legalis [the instruction of the law], yet they were not for that reason to be brought into Christian assemblies. For God willeth that, after the coming of Christ, his people should cultivate the hope of eternal life and the practice of true piety by very different and more simple means than these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, Instrumental Music in the Public Worship of the Church</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f422f876d4" data-kw="">
<blockquote><p>In close connexion with the Headship of Christ, and flowing from it, is another fundamental principle of the Church of Scotland, commonly denominated her spiritual independence. This is that privilege conferred upon her by her Lord when he said, “I will give unto thee the key of the kingdom of heaven, and whatsoever thou shalt bind on earth shall be bound in heaven, and whatsoever thou shalt loose on earth shall be loosed in heaven;” and it is the principle thus embodied in her standards, “the Lord Jesus, as King and Head of his Church, hath therein appointed a government, in the hand of Church officers, distinct from the civil magistrate.”

This government is divine in its origin, spiritual in its nature, and independent in its exercise. It is not inconsistent with it for the State to acknowledge and patronise it, but it must not meddle with it so as to control or influence it. The judicatories of the Church and the State are co-ordinate, but entirely independent of each other. They have their distinct and separate provinces, and the one must not tamper with the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast News-Letter</cite>, 18 March 1842.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-490092e261" data-kw="">
<blockquote><p>3. Faith is the instrumental cause of our sanctification; so that where it is not, no holiness can be wrought in us. “God purifieth our hearts by faith,” Acts 15:9, and not otherwise; and where the heart is not purified, there is no holiness. All the duties in the world will not denominate him holy whose heart is not purified; nor will any such duties be holy themselves, seeing unto the unclean all things are unclean. All the obedience that is accepted with God is the “obedience of faith,” Rom. 1:5; thence it springs, and therewith is it animated. So is it expressed, 1 Pet. 1:20–22, “You who by Christ do believe in God, and have purified your souls in obeying the truth through the Spirit.” It is from faith in God through Jesus Christ, acting itself in obedience unto the gospel, that we purify or cleanse our souls; which is our sanctification. See Col. 2:12–14, 3:7–11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 3 (Edinburgh: T&amp;T Clark, n.d.), 414.</span></figcaption>

</figure><figure class="quote" id="q-9ddbd7b749" data-kw="">
<blockquote><p>Fifthly, some consider instruments to be a mere circumstance rather than a real element of worship, so the Church can use them or not, as it sees fit. That there are such circumstances the Westminster Confession acknowledges: “There are some circumstances concerning the worship of God . . . common to human actions and societies, which are to be ordered by the light of nature, and Christian prudence, according to the general rules of the word, which are always to be observed” (1:6). However, God did not treat instruments as mere circumstances. They had no place in Old Testament worship until He put them in it by His express command. And He has never put them into New Testament worship. Plus, to class something as a mere circumstance rather than an element of worship, it must be common to human society and necessary. Appointing a suitable time and place to meet for public worship is a circumstance of worship, because without that no gathering of people could be possible, and is done for all orderly public meetings. But singing with instruments is not necessary: it may be done, but it does not need to be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/k-m-watkins.html">K.M. Watkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Watkins is a minister</cite>, p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

<blockquote><p>Also whatever is a profession in fact, of a false religion by ceremonies indifferent, and yet proper to a false religion, is a denying of the true religion; but the using of these ceremonies, used by Papists and Jews is such; Therefore… The proposition [above] is Scripture, Gal. 2:14, Peter lived after the manner of the Jews in using the religious materials of the Jews, though he had no Jewish intention or opinion; yea, Acts 10, he disputes against that: So circumcision, Gal. 6:14-15, is put for the Jewish Church. Now altars, organs, Jewish ephods, or surplice, Mass-clothes, and Romish crossing, bowing to altars, images, are badges of Jewish and Popish religion:</p></blockquote>

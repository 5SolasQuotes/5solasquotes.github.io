<blockquote><p>The princes of Judah were like them that remove the bound: therefore I will pour out my wrath upon them like water.” Hosea 5:10

The princes; the great men about the king and court, the rulers and governors, who by the law of God and man should have been the maintainers of equity and justice among the people. Of Judah; of the kingdom of Judah, or the two tribes. Were; have been, and now are in the days of Ahaz, for to this man’s time the prophet now pointeth.

Like them that remove the bound; the ancient bounds which limited every one, prevented controversies and oppressions of encroaching, covetous men. The prophet, I doubt not, aims at reproving the sin of these great ones in changing the laws of religion, as well as altering the bounds of civil rights, whether by encroaching upon foreigners, and enlarging the kingdom of Judah by entrenching on the neighbouring kingdoms, or, which is more certain, by injustice and violence seizing what was another’s. Therefore I will pour out my wrath upon them: this was sin and forbidden, Deut. xix.14; this practice is cursed, Deut. xxvii. 17, and God now will punish it. Like water; like an overflowing flood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; 3 vols, London: Banner of Truth, 1962), 2: 863.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-913596b6c3" data-kw="">
<blockquote><p>1st Conclusion: Fire and sword, or war, or the coactive power of a magistrate is not God’s way of planting the Gospel in a heathen nation which never heard of the gospel before:

1. Because the apostles were commanded by teaching the gospel to all nations, Mt. 28:19-20; Mk. 16:15; Acts 7:8; and not by war to spread the gospel;

2. Because Christ’s Kingdom is not of this world, for then his servants would fight for Him (Jn. 18:36), nor are the weapons of our warfare carnal (2 Cor. 10:4), nor is Christ’s sword any other thing than the Word of God (Rev. 19:15; Gal. 6:17). And in this meaning, and with relation to the internal acts of sound believing, have the learned taught us that, religio suaderi potest, cogi non potest [‘Religion can be persuaded; it cannot be forced.’]. If these be the Constitutions of Clement, let it go for a truth in this sense, that: ‘God has given liberty of will to men, not punishing them with temporal death, but calls them to give an account of their doings in the life to come.’ …and Athanasius meant with us, when he cites that, ‘If any will come after me, let him take up his cross,’ to prove that the will cannot be compelled; and that of Lactantius is approved by all: Defendenda tamen religio est, non occidendo, sed moriendo, non saevitia, sed sapientia, non scelere, sed fide; illa enim malorum sunt, haec bonorum; et necesse est bonum in religione versari, non malum: Nam si sanguine, si tormentis, si malo religionem defendere velis, jam non defendetur illa, sed polluetur, et violabitur. Nihil est tam voluntarium quam religio, in qua si animus sacrificantis est eversus, jam sublata, jam nulla est. (Institutes, bk. 5, ch. 19) [“Religion, however, must be defended not by killing but by dying, not by cruelty but by wisdom, not by crime but by faith; for the former belong to the wicked, the latter to the good. And it is necessary that good, not evil, should be found in religion. For if you wish to defend religion by blood, by tortures, or by evil, it will no longer be defended but polluted and profaned. Nothing is so voluntary as religion; for if the heart of the worshiper is overturned, it is already destroyed—it no longer exists.”] All which tends to this, that religion is like free-will, and free-will like a virgin which cannot be ravished. Let that of Tertullian stand, Lex nostra non se vindicat ultore gladio [‘Our Law does not avenge itself with the avenging sword.’]. Procopius says that Justinian was blamed, because he compelled the Samaritans to embrace the Christian faith. (Procopius, in Arca. Histor.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: 1644), pt. 2, ch. 6, p. 353</span></figcaption>

<blockquote><p>Therefore, in order that none of us may stumble on that stone, let us first consider that there is a twofold government in man (duplex esse in homine regimen): one aspect is spiritual, whereby the conscience is instructed in piety and in reverencing God; the second is political, whereby man is educated for the duties of humanity and citizenship that must be maintained among men. These are usually called the “spiritual” and the “temporal” jurisdiction (not improper terms) by which is meant that the former sort of government pertains to the life of the soul, while the latter has to do with the concerns of the present life—not only with food and clothing but with laying down laws whereby a man may live his life among other men holily, honorably, and temperately. For the former resides in the inner mind, while the latter regulates only outward behavior. The one we may call the spiritual kingdom, the other, the political kingdom. Now these two, as we have divided them, must always be examined separately; and while one is being considered, we must call away and turn aside the mind from thinking about the other. There are in man, so to speak, two worlds, over which different kings and different laws have authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559 edition), 3.19.15 (Battles edition).</span></figcaption>

<blockquote><p>[M]odern pedagogy has emancipated us, whether we be in the pulpit or in the professor’s chair or in the pew, from anything so irksome as earnest labor in the acquisition of knowledge. It never seems to occur to many modern teachers that the primary business of the teacher is to study the subject that he is going to teach. Instead of studying the subject that he is going to teach, he studies “education”; a knowledge of the methodology of teaching takes the place of a knowledge of the particular branch of literature, history or science to which a man has devoted his life. This substitution of methodology for content in the preparation of the teacher is based upon a particular view of what education is. It is based upon the view that education consists primarily, not in the imparting of information, but in a training of the faculties of the child; that the business of the teacher is not to teach, but to develop in the child a faculty which will enable the child to learn.

This child-centred notion of education seems to involve emancipation from a vast amount of drudgery. It used to be thought necessary to do some hard work at school. When a textbook was given to a class, it was expected that the contents of the textbook should be mastered. But now all that has been changed. Storing up facts in the mind was a long and painful process, and it is indeed comforting to know that we can now do without it. Away with all drudgery and all hard work! Self-expression has taken their place, A great pedagogic discovery has been made the discovery that it is possible to think with a completely empty mind.

It cannot be said that the results of the discovery are impressive. This child-centred notion of education has resulted, particularly in America, where it has been most ruthlessly applied, in a boundless superficiality of which. we Americans certainly have little reason to be proud; but it has probably not been confined to America by any means. I wonder when the reaction will come. I wonder when we shall have that revival of learning which we so much need, and which I verily believe might be, in the providence of God, as was the Renaissance of the fifteenth century, the precursor of a Reformation in the Church.

When that revival of learning comes, we may be sure that it will sweep away the present absurd over-emphasis upon methodology in teaching at the expense of content. We shall never have a true revival of learning until teachers turn their attention away from the mere mental processes of the child out into the marvelous richness and variety of the universe and of human life. Not teachers who have studied the methodology of teaching, but teachers who are on fire with a love of the subjects that they are going to teach are the real torch-bearers of intellectual advance.</p></blockquote>

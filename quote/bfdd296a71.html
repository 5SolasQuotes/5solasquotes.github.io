<main class="wrap"><figure class="quote" id="q-bfdd296a71" data-kw="">
<blockquote><p>But I come back to your interrogatories. You say, “The bread which our Savior brake, was surely unleavened. No other was in existence among the Jews on the Passover day. How do you justify the use of leavened bread at our sacramental table?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ace8b8da3" data-kw="">
<blockquote><p>After the thanksgiving, it is very clear that our Divine Lord broke the bread. We scarcely know what kind of bread was used on that occasion; it was probably the thin passover cake of the Jews; but there is nothing said in Scripture about the use of leavened or unleavened bread, and therefore it matters not which we use. Where there is no ordinance, there is no obligation; and we are, therefore, left free to use the bread. which it is our custom to eat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

</figure><figure class="quote" id="q-98af2d2317" data-kw="">
<blockquote><p>In regard to the external form of the ordinance, whether or not believers are to take into their hands and divide among themselves, or each is to eat what is given to him; whether they are to return the cup to the deacon or hand it to their neighbor; whether the bread is to be leavened or unleavened, and the wine to be red or white, is of no consequence. These things are indifferent, and left free to the Church, though it is certain that it was the custom of the ancient Church for all to receive into their hand. And Christ said, “Take this, and divide it among yourselves” (Luk_12:17). History relates that leavened and ordinary bread was used before the time of Alexander the Bishop of Rome, who was the first that was delighted with unleavened bread: for what reason I see not, unless it was to draw the wondering eyes of the populace by the novelty of the spectacle, more than to train them in sound religion. I appeal to all who have the least zeal for piety, whether they do not evidently perceive both how much more brightly the glory of God is here displayed and how much more abundant spiritual consolation is felt by believers than in these frigid and histrionic [exaggerated dramatic behavior designed to attract attention] follies, which have no other use than to impose on the gazing populace. They call it restraining the people by religion, when, stupid and infatuated, they are drawn hither and thither by superstition. Should any one choose to defend such inventions by antiquity, I am not unaware how ancient is the use of Christ and exorcism in baptism, and how, not long after the age of the apostles, the Supper was tainted with adulteration; such, indeed, is the forwardness of human confidence, which cannot restrain itself, but is always sporting and wantoning in the mysteries of God. But let us remember that God sets so much value on obedience to his word, that, by it, He would have us to judge his angels and the whole world. All this mass of ceremonies being abandoned, the sacrament might be celebrated in the most becoming manner…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, vol. 2, Ed. John McNeill, Tr. Ford Battles (Philadelphia: The Westminster Press, 1960) 1420-1422, this quote was compiled by Peter Allison.</span></figcaption>

</figure><figure class="quote" id="q-0fbb9ae289" data-kw="">
<blockquote><p>He took bread. The bread which Christ took was leavened bread, such as they ate at the feast of the Passover. This circumstance, however, does not properly belong to the Supper, any more than the evening at which time it was instituted; for the use of leavened bread at the institution was accidental. Hence we must not infer from this that there is any necessity for the use of such bread in the celebration of the Supper, or that Christ would lay down any particular way of baking or using it. Yet still the bread which is used in the celebration of the Lord’s supper differs from common bread, for whilst the latter is eaten for the nourishment of the body, the former is received for the nourishment of the soul, or for the confirmation of our faith, and union with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, reprinted 1888, trans. G.W. Williard, 4th American ed,, Cincinnati, | Question 77, p. 384</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/elements-and-words.html">Elements and Words</a></span></div>

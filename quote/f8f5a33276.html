<main class="wrap"><figure class="quote" id="q-f8f5a33276" data-kw="">
<blockquote><p>But there is still greater ground for contradicting, when they are not ashamed to affirm that nothing is to prevent believers from satisfying the Law, at least in a degree proportioned to the present state, and meriting eternal life. … With the same confidence do they talk of a heaven for hire, while they themselves meanwhile continue engrossed with the present hire, after which they are always gaping.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on ch. 16</span></figcaption>

<blockquote><p>Accordingly, as the same writer elsewhere teaches, no man will embrace the gifts of Christ till he has forgotten his own merits. He sometimes gives the reason: because, what is called merit is naught else but the free gift of God.</p></blockquote>

</figure><figure class="quote" id="q-eca3f1de29" data-kw="">
<blockquote><p>There are those who think that the good works of the just are meritorious of eternal life ex condigno by reason of the work, even if no divine agreement existed. So Cajetan teaches. … Others, on the contrary, think that good works proceeding from grace are not meritorious ex condigno by reason of the work, but only by reason of the pact and of divine acceptance. So Scotus teaches. … To us the middle opinion seems more probable, which teaches that the good works of the just are meritorious of eternal life ex condigno by reason of the pact and of the work together; not indeed that without the pact or acceptance a good work has no proportion to eternal life, but because God is not bound to accept a good work for that reward, even though it be equal and on a par with the reward, unless an agreement intervene.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-e4653bc431" data-kw="">
<blockquote><p>Scripture, however, says absolutely nothing to the effect that we either should or could make satisfaction to God for our sins in some part either by our works or by our sufferings. It does not say that when the priest in absolution looses and remits sin he should impose penalties as punishment and satisfaction for sins. It says nothing about the punishments of purgatory; it has nothing about a treasury of works of supererogation; it teaches nothing about a key, delivered solely to the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 4, p. 168</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/penance-and-confession.html">Penance and Confession</a> › <a href="../topics/repentance-and-conversion/penance-and-confession/satisfactions.html">Satisfactions</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a></span></div>

</figure><figure class="quote" id="q-f8ab438839" data-kw="Merit of condignity">
<blockquote><p>Although they who embrace the Scotist opinion (acknowledging no merit except from agreement) err less dangerously than others and come nearer the truth, still they cannot be excused. First they greatly abuse words, calling that merit of condignity which in no way deserves that name (if we wish to follow the ordinary method of speaking). For who would say that a work of condignity merited eternal life which by itself is not worthy of so great a reward, but to which that reward is liberally promised above its own worth? Again, this manner of speaking is not only abusive, but also very dangerous (to wit, favoring Pharisaical pride, which affords the occasion of making grievous mistakes in the thing itself—to wit, ascribing too much to our works and not a little diminishing the glory of the divine mercy, which has evidently been the case in the Roman church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.11</span></figcaption>

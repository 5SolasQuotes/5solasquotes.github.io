<main class="wrap"><figure class="quote" id="q-7a2d8b19e7" data-kw="">
<blockquote><p>Whenever we meet with the word reward, or whenever it occurs to our recollection, let us look upon this as the crowning act of the goodness of God to us, that, though we are completely in his debt, he condescends to enter into a bargain with us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 17:7-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whenever we meet with the word reward, or whenever it occurs to our recollection, let us look upon this as the crowning act of the goodness of God to us, that, though we are completely in his debt, he condescends to enter into a bargain with us.”

— John Calvin, Commentary on a Harmony of the Evangelists, Luke 17:7-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhenever%20we%20meet%20with%20the%20word%20reward%2C%20or%20whenever%20it%20occurs%20to%20our%20recollection%2C%20let%20us%20look%20upon%20this%20as%20the%20crowning%20act%20of%20the%20goodness%20of%20God%20to%20us%2C%20that%2C%20though%20we%20are%20completely%20in%20his%20debt%2C%20he%20condescends%20to%20enter%20into%20a%20bargain%20with%20us.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentary%20on%20a%20Harmony%20of%20the%20Evangelists%2C%20Luke%2017%3A7-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7a2d8b19e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7a2d8b19e7.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom32" rel="noopener" target="_blank">Read it online · CCEL, vol. 2</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3cdade0ee1" data-kw="">
<blockquote><p>Accordingly, when the Scripture speaks of &quot;a crown of righteousness which God the righteous Judge shall give&quot; &quot;at that day,&quot; (2 Tim. 4:8), I not only say with Augustine, … but I also add, how could he impute righteousness to our works, did not his indulgence hide the unrighteousness that is in them? How could he deem them worthy of reward, did he not with boundless goodness destroy what is unworthy in them? Augustine is wont to give the name of grace to eternal life, because, while it is the recompense of works, it is bestowed by the gratuitous gifts of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Accordingly, when the Scripture speaks of &quot;a crown of righteousness which God the righteous Judge shall give&quot; &quot;at that day,&quot; (2 Tim. 4:8), I not only say with Augustine, … but I also add, how could he impute righteousness to our works, did not his indulgence hide the unrighteousness that is in them? How could he deem them worthy of reward, did he not with boundless goodness destroy what is unworthy in them? Augustine is wont to give the name of grace to eternal life, because, while it is the recompense of works, it is bestowed by the gratuitous gifts of God.”

— John Calvin, Institutes of the Christian Religion, 3.18.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAccordingly%2C%20when%20the%20Scripture%20speaks%20of%20%22a%20crown%20of%20righteousness%20which%20God%20the%20righteous%20Judge%20shall%20give%22%20%22at%20that%20day%2C%22%20%282%20Tim.%204%3A8%29%2C%20I%20not%20only%20say%20with%20Augustine%2C%20%E2%80%A6%20but%20I%20also%20add%2C%20how%20could%20he%20impute%20righteousness%20to%20our%20works%2C%20did%20not%20his%20indulgence%20hide%20the%20unrighteousness%20that%20is%20in%20them%3F%20How%20could%20he%20deem%20them%20worthy%20of%20reward%2C%20did%20he%20not%20with%20boundless%20goodness%20destroy%20what%20is%20unworthy%20in%20them%3F%20Augustine%20is%20wont%20to%20give%20the%20name%20of%20grace%20to%20eternal%20life%2C%20because%2C%20while%20it%20is%20the%20recompense%20of%20works%2C%20it%20is%20bestowed%20by%20the%20gratuitous%20gifts%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.18.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3cdade0ee1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3cdade0ee1.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.”

— Joseph Pohle, The Catholic Encyclopedia, s.v. “Merit” (1911)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom%20an%20ethical%20point%20of%20view%20the%20difference%20practically%20amounts%20to%20this%20that%2C%20if%20the%20reward%20due%20to%20condign%20merit%20be%20withheld%2C%20there%20is%20a%20violation%20of%20right%20and%20justice%20and%20the%20consequent%20obligation%20in%20conscience%20to%20make%20restitution%2C%20while%2C%20in%20the%20case%20of%20congruous%20merit%2C%20to%20withhold%20the%20reward%20involves%20no%20violation%20of%20right%20and%20no%20obligation%20to%20restore%2C%20it%20being%20merely%20an%20offence%20against%20what%20is%20fitting%20or%20a%20matter%20of%20personal%20discrimination%20%28acceptio%20personarum%29.%20Hence%20the%20reward%20of%20congruous%20merit%20always%20depends%20in%20great%20measure%20on%20the%20kindness%20and%20liberality%20of%20the%20giver%2C%20though%20not%20purely%20and%20simply%20on%20his%20good%20will.%E2%80%9D%0A%0A%E2%80%94%20Joseph%20Pohle%2C%20The%20Catholic%20Encyclopedia%2C%20s.v.%20%E2%80%9CMerit%E2%80%9D%20%281911%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1be46483e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1be46483e7.html">Permalink</a><a class="src" href="https://www.newadvent.org/cathen/10202b.htm" rel="noopener" target="_blank">Read it online · New Advent</a></div>
</figure><figure class="quote" id="q-83223a61ea" data-kw="">
<blockquote><p>There is nothing in the term reward to justify the inference that our works are the cause of salvation. First, let it be a fixed principle in our hearts, that the kingdom of heaven is not the hire of servants, but the inheritance of sons (Eph. 1:18); an inheritance obtained by those only whom the Lord has adopted as sons, and obtained for no other cause than this adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“There is nothing in the term reward to justify the inference that our works are the cause of salvation. First, let it be a fixed principle in our hearts, that the kingdom of heaven is not the hire of servants, but the inheritance of sons (Eph. 1:18); an inheritance obtained by those only whom the Lord has adopted as sons, and obtained for no other cause than this adoption.”

— John Calvin, Institutes of the Christian Religion, 3.18.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere%20is%20nothing%20in%20the%20term%20reward%20to%20justify%20the%20inference%20that%20our%20works%20are%20the%20cause%20of%20salvation.%20First%2C%20let%20it%20be%20a%20fixed%20principle%20in%20our%20hearts%2C%20that%20the%20kingdom%20of%20heaven%20is%20not%20the%20hire%20of%20servants%2C%20but%20the%20inheritance%20of%20sons%20%28Eph.%201%3A18%29%3B%20an%20inheritance%20obtained%20by%20those%20only%20whom%20the%20Lord%20has%20adopted%20as%20sons%2C%20and%20obtained%20for%20no%20other%20cause%20than%20this%20adoption.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.18.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83223a61ea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83223a61ea.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-8f475c5af3" data-kw="">
<blockquote><p>Moreover, sure reason persuades that no one (Christ excepted), however just and holy, can merit grace de condigno for others. For there exists no pact, no promise concerning the merit of another&#x27;s salvation; and Christ alone, as head of the whole Church, had that grace by which he might merit grace and glory for all the members. … But just as it is certain that one cannot merit grace for another ex condigno, so there is no doubt that this can be done ex congruo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.21 (translated from the Latin)</span></figcaption>

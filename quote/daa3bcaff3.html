<blockquote><p>6. Though it were lawful to add other things contrived by ourselves, the Fathers, the papists or others to the sacred ceremonies instituted by God, yet nevertheless they must not be vain or frivolous; they are not to be multiplied excessively, and neither their perpetuity, uniformity or observation is necessary without a case of scandal or contempt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Propositions on Indifferent Things &amp; Ceremonies in Worship” tr. T. Fentiman (1623; RBO, 2021)</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“6. Though it were lawful to add other things contrived by ourselves, the Fathers, the papists or others to the sacred ceremonies instituted by God, yet nevertheless they must not be vain or frivolous; they are not to be multiplied excessively, and neither their perpetuity, uniformity or observation is necessary without a case of scandal or contempt.”

— David Calderwood, “Propositions on Indifferent Things &amp; Ceremonies in Worship” tr. T. Fentiman (1623; RBO, 2021), p. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+Though+it+were+lawful+to+add+other+things+contrived+by+ourselves%2C+the+Fathers%2C+the+papists+or+others+to+the+sacred+ceremonies+instituted+by+God%2C+yet+nevertheless+they+must+not+be+vain+or+frivolous%3B+they+are+not+to+be+multiplied+excessively%2C+and+neither+their+perpetuity%2C+uniformity+or+observation+is+necessary+without+a+case+of+scandal+or+contempt.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+%E2%80%9CPropositions+on+Indifferent+Things+%26+Ceremonies+in+Worship%E2%80%9D+tr.+T.+Fentiman+%281623%3B+RBO%2C+2021%29%2C+p.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdaa3bcaff3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/daa3bcaff3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=6.%20Though%20it%20were%20lawful%20to,a%20case%20of%20scandal%20or%20contempt." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d6816a2724" data-kw="">
<blockquote><p>The gross impiety of which they had been accused was now well refuted; and yet they seem not to have been in every respect free from blame, because the Law forbids the erection of any kind of statues. It is easy, however, to excuse this by saying, that no kind of statues are condemned except those which are intended to represent God. To erect a heap of stones as a trophy, or in testimony of a miracle, or a memorial of some signal favor of God, the Law has nowhere prohibited. (Exodus 20:4; Leviticus 26:1; Deuteronomy 5:8) Otherwise, Joshua and many holy judges and kings after him, would have defiled themselves by profane innovation. But the only thing displeasing to God was to see the minds of men drawn hither and thither, so as to worship him in a gross and earthly manner. The children of Reuben, Gad, and Manasseh do all that is required for their exculpation, when they declare that they would use the altar only as a bond of brotherly union; and add a sufficient reason…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Josh. 22 | v. 26</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church: 1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’ 2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 5</cite>, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 9</cite>, pp. 46-7</span></figcaption>

</figure><figure class="quote" id="q-541cecb321" data-kw="">
<blockquote><p>And these temporal circumstances, whether of evening or night-time, or of the sixth day of the week [i.e. Thursday night] or that particular day of the year (i.e., of the third day before Christ’s resurrection), and also of the place (i.e. a private place), do not have any force of prescribed necessity or of observance. Nor do the following facts have any force of being required or observed: that the supper was given to them after they had eaten a meal, after their feet had been washed, when they were lying at table, and even that there were twelve in number (some of which were observed for some time in the early church).</p></blockquote>

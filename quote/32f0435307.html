<main class="wrap"><figure class="quote" id="q-32f0435307" data-kw="">
<blockquote><p>If one maintains that a right to eternal life is acquired by his good works, and that this right is granted by way of justification by works, all would nevertheless be attributed to man, and therefore he that has performed these good works would the have to thank himself. This is contrary to Scripture and the confession of the Reformed Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, 2:371–72.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-2a0c39a651" data-kw="">
<blockquote><p>Because we are justified solely because of the righteousness of Christ, our role in justification is not to obey but to have faith in Christ… When we seek to justify ourselves by human effort of any kind, we undermine the sufficiency of Christ’s atoning work. Only justification by faith alone preserves the honor and glory of what Jesus did on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-harvey.html">Jay Harvey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Don’t Call it a Comeback</cite>, p. 100</span></figcaption>

</figure><figure class="quote" id="q-1ba5ff7aab" data-kw="">
<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), p. 34</span></figcaption>

ng+Justification%E2%80%A6+%28d.+1654%3B+London%3A+Brome%2C+1670%29%2C+p.+34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ba5ff7aab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ba5ff7aab.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=2.%20That%20which%20is%20exhibited%20whither,3%3A24%2D25%20and%202%20Cor.%205%3A19%2C%2021&amp;text=2.%20That%20which%20is%20exhibited%20whither%20by%20doing&amp;text=distinguished%2C%20Rom.%203%3A24%2D25%20and%202%20Cor.%205%3A19%2C%2021" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb601da6ae" data-kw="Sola fide Faith alone">
<blockquote><p>The reader now perceives with what fairness the Sophists of the present day cavil at our doctrine, when we say that a man is justified by faith alone (Rom. 4:2). They dare not deny that he is justified by faith, seeing Scripture so often declares it; but as the word alone is nowhere expressly used they will not tolerate its being added. … Does he not plainly enough attribute everything to faith alone when he disconnects it with works?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.19</span></figcaption>

</figure><figure class="quote" id="q-888559a1bd" data-kw="">
<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-wigglesworth.html">Michael Wigglesworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day of Doom; or A Description of the Great and Last Judgment, with a short discourse about Eternity</cite>, (London, 1666) This is an extended poem, and was written during the Great London Plague. | Wigglesworth was a puritan. Stanzas 139, 142, 211 &amp;, p. 91:</span></figcaption>

</figure><figure class="quote" id="q-e6f79cad8b" data-kw="">
<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-melville.html">Andrew Melville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘To Pastors of the Kirk of Geneva &amp; Zurich’</cite>, pp. 165-66 in David Calderwood, History of the Kirk of Scotland, vol. 4</span></figcaption>

</figure><figure class="quote" id="q-7b8a14eefb" data-kw="">
<blockquote><p>…but it cannot follow, that because teaching and publishing of errors in non-fundamentals is consistent with [the persons having] saving grace, that therefore these non-fundamental sins of murder, adultery, tolerating of idolatrous high places, persecuting of faithful prophets, making of a golden calf, and hallowing of it to be adored as the God that brought Israel out of Egypt, are sins not to be tolerated in the truly godly, such as Aaron, David, and Asa, for then should they be tolerated in the wicked also, for the toleration of such in the godly, because they are not fundamental wickednesses inconsistent with saving grace, is as destructive and more because of their extreme scandalousness, to all peace and safety of human societies, and to the duty of the godly magistrate, as these same sins in the wicked, upon the same grounds publishing of all errors non-fundamental, the toleration of the high places, are as inconsistent with peace, destructive and injurious to souls, especially in the godly, as scandalous to other false teachers, as these non-fundamental sins.</p></blockquote>

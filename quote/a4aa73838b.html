<main class="wrap"><figure class="quote" id="q-a4aa73838b" data-kw="">
<blockquote><p>For good works are fruitful not only in reference to an ample and manifold reward, but in reference to good works:¹ as the parable of our Savior in the twenty-fifth of Matthew plainly informs us, where it is said: ‘Then he that had received the five talents went and traded with the same and made them other five talents.’ (Mt. 25:16) ¹ Serva ergo mandata Dei-Sanctifica cor tuum ut Deus inhabitet in te. Et quotidie magis &amp; magis invenies Deum [Therefore keep the commandments of God—sanctify your heart so that God may dwell in you. And every day you will find God more and more]. [Ps. Chrysostom,] Imperfect Work on Matthew, Homily 4. These five talents acquired to the first five cannot be interpreted [as] the reward ultimate; for that is expressed afterward to be the joy of the Lord [vv. 21, 23]: but they were the intermediate effects of the stock of grace treasured up in the soul, and exhorting and improving itself by the continual supply of the Spirit of Christ, according to the doctrine of St. Paul to the Corinthians, saying: ‘Insomuch that we desired Titus, that as he had begun, so he would also finish in you the same grace also: Therefore as ye abound in everything, in faith, in utterance, in knowledge, and in all diligence, and in your love to us, see that ye abound in this grace also.’ [2 Cor. 8:6-7] Of this influence of Christ’s Spirit to the augmentation of grace in the hearts of the true believers, speaks the same apostle to the Colossians, thus: ‘The Head from which all the body by joints and bands having nourishment, ministered and knit together, encreases with the increase of God.’ (Col. 2:19) … That God therefore accepted their burnt-offering (Jud. 13:23), it is a sign He approved their persons, but the reason antecedent of God’s acceptation of their sacrifice, was because He first approved their persons. And yet, notwithstanding the goodness of the person is the original of the goodness of the work, nothing hinders but the goodness of the work may add value, favour, and estimation unto the person. As (to use Luther’s comparison and others after and before him) the tree bears the fruit, and not the fruit the tree: And the goodness of the tree is the cause of the goodness of the fruit, and not the goodness of the fruit the cause of the goodness of the tree: Yet the fruit does procure an esteem and valuation from the owner to the tree; and endears it to him, to the cultivating the ground and dressing it and conferring much more on that than others. In like manner, the person sanctified and justified produces good works, and not those good works, him: but some actions accompanied with God’s grace, antecedent and inferior to the fruit itself: Yet does the fruit of good works add much of esteem and honor from God to such a person; and render him capable of an excellent reward: for St. Paul to the Philippians assures them and us, when he says, ‘I desire fruit that may abound to your account.’ (Phil. 2:7)</p></blockquote>

<blockquote><p>Note also that by being ‘sanctified to Christ as a peculiar people,’ we intend first the real change, commonly called sanctification, and also the relation that thence follows, of being a separated, sanctified, dedicated, peculiar people.</p></blockquote>

</figure><figure class="quote" id="q-46d07c19ed" data-kw="">
<blockquote><p>It’s a question, Whether this drawing [Jn. 12:32] be justification or sanctification? Antinomians say it’s both: But withal, both is one (say they). Answer: Position 1. Drawing is relative to running and walking, Cant. 1:4. Now this is rather in acts of sanctification and in running in the ways of God’s commandments, Ps. 119:32, than in justification, though “coming” go for an act of believing and approaching to Christ, Jn. 6:44, and so excludes not faith. Position 2. It is most unsound to affirm that justification and regeneration are all one;† for this must confound all acts flowing from justification with those that flow from regeneration, or the infused habit of sanctification. † [Margin Note:] ]Libertines falsely teach that justification and regeneration is one.

1. Justification is an indivisible act; the person is but once for all justified, by grace. But sanctification is a continued daily act.

2. Justification does not grow; the sinner is either freed from the guilt of sin and justified, or not freed; there is not a third. But in sanctification we are said to grow in grace, 2 Pet. 3:14, and advance in sanctification: nor is it ever consummate and perfect so long as we bear about a body of sin. Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise.

1. Because this is faith; and the Scripture says we are justified by faith.

2. We receive Christ by faith, Jn. 1:12.

3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them.

4. We are to believe without staggering, Rom. 4.19.

5. We have peace of conscience through faith, Rom. 5:1.

6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.</p></blockquote>

rsuaded+of+them.+4.+We+are+to+believe+without+staggering%2C+Rom.+4.19.+5.+We+have+peace+of+conscience+through+faith%2C+Rom.+5%3A1.+6.+By+faith+we+have+access+into+this+grace+wherein+we+stand%2C+Rom.+5%3A2.+And+boldness+to+enter+into+the+holy+of+holiest%2C+and+draw+near+to+our+High+Priest%2C+with+full+assurance+of+faith%2C+Heb.+10%3A19-22.+Now+we+are+not+justified+by+repentance+and+mortification%3B+we+neither+receive+Christ%2C+nor+embrace+the+promises+by+repentance.+The+apostle+requires+in+repentance%2C+sorrow%2C+carefulness+to+eschew+sin%2C+clearing%2C+indignation%2C+fear%2C+zeal%2C+desire%2C+revenge%2C+2+Cor.+7%3A10-11%2C+but+nowhere+does+the+Scripture+require+this+as+an+ingredient+of+repentance%2C+that+we+have+boldness+and+access%2C+and+full+assurance%3A+nor+do+Antinomians+admit+that+by+repentance+we+have+peace+or+pardon%2C+but+this+they+ascribe+to+faith.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%28London%3A+1647%29%2C+pp.+271-72&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46d07c19ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46d07c19ed.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=It%E2%80%99s%20a%20question%2C%20Whether%20this%20drawing,but%20this%20they%20ascribe%20to%20faith&amp;text=It%E2%80%99s%20a%20question%2C%20Whether%20this%20drawing%20%5BJn.%2012%3A32&amp;text=or%20pardon%2C%20but%20this%20they%20ascribe%20to%20faith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>751. Faith, which is implanted in man in regeneration and calling by the powerful working of the Holy Spirit, is the means of justification, the foundation of sanctification, and the symbol and down payment of glorification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamentals of Sacred Theology Pre</cite>, (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 181</span></figcaption>

<div class="actions"><button class="copy" data-copy="“751. Faith, which is implanted in man in regeneration and calling by the powerful working of the Holy Spirit, is the means of justification, the foundation of sanctification, and the symbol and down payment of glorification.”

— Campegius Vitringa, The Fundamentals of Sacred Theology Pre (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 181">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C751.+Faith%2C+which+is+implanted+in+man+in+regeneration+and+calling+by+the+powerful+working+of+the+Holy+Spirit%2C+is+the+means+of+justification%2C+the+foundation+of+sanctification%2C+and+the+symbol+and+down+payment+of+glorification.%E2%80%9D%0A%0A%E2%80%94+Campegius+Vitringa%2C+The+Fundamentals+of+Sacred+Theology+Pre+%28d.+1722%3B+RHB%2C+2024%29%2C+ch.+21%2C+%E2%80%98Justification%E2%80%A6%E2%80%99%2C+p.+181&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F168aa179d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/168aa179d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=751.%20Faith%2C%20which%20is%20implanted%20in,symbol%20and%20down%20payment%20of%20glorification&amp;text=751.%20Faith%2C%20which%20is%20implanted%20in%20man%20in&amp;text=and%20the%20symbol%20and%20down%20payment%20of%20glorification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a733512508" data-kw="">
<blockquote><p>God is omnipotent, or God can do all things. That, things which imply a contradiction: as namely, for the same thing to be, and not to be; and impossibilities, as namely, for a man not to be a reasonable creature, and the like: fall not under the compass of omnipotency, is not from any defect (it is indeed from the perfection) of power in God; but from the impossibility of the things… So likewise that God cannot sin, lie, or deny Himself, is not from defect, but from the eminency of his power and absolute perfection, whence He is uncapable of being touched with any imperfection. … Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. Eminential continency and virtual continency (that is, for one thing to be contained in another eminently, as the excellency of the creature is in the Creator; or virtually, as all things saleable are in money, Eccl. 10:9) are not the same: the first is proper to the Creator, the second is found in the creature. The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.</p></blockquote>

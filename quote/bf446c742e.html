<main class="wrap"><figure class="quote" id="q-bf446c742e" data-kw="">
<blockquote><p>If any person walk unworthy of the Gospel or commit any trespass, he is (unless the scandal be public and notorious) admonished first: secretly by one, next by two or three more. And thirdly, if he contemn both, then according to the order prescribed by our Savior (Matt 18), the matter is brought before the minister and elders where he is accused both of the trespass and of the contempt. If he cannot yet be brought to repentance, then is the matter in some measure made known unto the congregation and he is called before the greater presbytery, where, if he give signs of his repentance, he is remitted to satisfy his own session. But if he persist in his obstinacy, then by the ordinance of the presbytery, the particular eldership is to proceed against him with the censures of the church even to excommunication. The matter being thus heard, known and judged, and the whole process revised by the greater presbytery, the next Sabbath (without delay) the trespass and order of admonitions are declared to the congregation and the person (without specification of his name) is admonished yet to satisfy. Which, if he still refuse to do, the next Sabbath his name, with his offence and contempt, are published. If he yet continue obstinate, then on the next Sabbath (which is the third), he is charged publicly to satisfy for his offence and contempt under the pain of excommunication. If now he offer himself to the particular presbytery, then do they (at the appointment of the presbytery) give order for his public repentance, the removing of the scandal, and his reconcilement to the church. Otherwise the minister proceeds in this order: … As the presbytery excommunicates profane professors, so does it also depose preachers… … The subject and matters treated in the presbytery are all the ecclesiastical matters of weight which concern the particular churches there represented, as: the examination, ordination, suspension and deposition of ministers, scandals of ministers in doctrine, life, or any part of their calling, the decerning [decreeing] of excommunication…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government &amp; Order of the Church of Scotland</cite></span></figcaption>

</figure><figure class="quote" id="q-badc6b380d" data-kw="">
<blockquote><p>Take heed of pretending to greater purity and strictness about Church communion and administrations than the Word of God commends, or the examples of Christ and the apostles and the primitive Church do commend; nor be so extremely rigid as not to bear with things that they have tolerated. It is an observable rule laid down by wise and eminent divines that too much strictness and severity often does injury the Church more than profit it; it’s the way to overturn churches, not to reform them; especially this severity is unbecoming private Christians, who having no authority, yet complain such persons and such things are defilements: they must separate from them, they must not touch the unclean thing: such should take heed that they be not ‘righteous over-much,’ and not dare to be wise above what is written, lest their too much affected purity and misguided zeal hurt more the Church of Christ, and their own souls than the corruptions they so much complain of. Calvin adv. Anab., Art. 2. ‘Cum sub specie studii perfectionis imperfectionem nulam tollerare possumus; tune Diabolum nos tumefacere superbia, et hypocrisi seducere moneamur.&#x27;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>[James] Renwick, he was told, would have to subscribe the Confession and Catechisms of the Dutch church, as was mandatory in all ordinations; otherwise there was no prospect of the Presbytery ordaining him. Hamilton asked to see a copy of the Confession, and found his worst fears confirmed… there were vestiges of pre-Reformation practices–ceremonial, liturgy, and the role of the civil power in the church–which were reflected all too plainly in the [Belgic] Confession. Hamilton on seeing this, urgently consulted Renwick. Together they had to accept that Renwick could not subscribe the [Belgic] Confession, since to do so would be to compromise the basic principles of the Scottish Reformation and Covenants… …he [Hamilton] went round the ministers of the Presbytery and pleaded with them that, if Renwick was to subscribe anything, ti should be the Confession and Catechisms of the Church of Scotland… they eventually assented.</p></blockquote>

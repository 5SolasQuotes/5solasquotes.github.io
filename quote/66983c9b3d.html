<blockquote><p>Q. 20. What is vindictive justice?

A. It is God’s inflicting the punishment upon sin, which is threatened in the law, Gen. 2:17; Ezek. 18:4.

Q. 21. Could God, of his own will, have pardoned sin without a satisfaction to his justice?

A. No; for he has declared, “that in forgiving iniquity, transgression and sin,” he “will by no means clear the guilty;” namely, without a satisfaction, Ex. 34:7.

Q. 22. How do you prove, that vindictive, or punishing justice, is essential to God?

A. From the infinite holiness of God, who cannot but hate, and consequently punish sin, Hab. 1:12, 13; from his faithfulness in the threatening, Gen. 2:17; Psalm 95:11; from the remarkable judgments that have been inflicted on sinners in this life, Jude, verse 5-7; and from the sufferings and death of God’s only begotten Son, whom he would surely have spared, if there had been any other possible way of pardoning sin, but through his satisfaction, Matt. 26:42; 2 Cor. 5:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher-and-ebenezer-erskine.html">James Fisher and Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism explained, by way of question and answer. In two parts</cite>, (1765; Stoke-on-Trent, 1998), p. 42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2c91f18eb" data-kw="">
<blockquote><p>In this covenant [of grace] the principle of representation was involved as an essential element. Christ, by the appointment of the Father, and by his own spontaneous election, became the legal representative of the elect seed who were given to him to be redeemed. He undertook all their legal responsibilities, as well those which related them to the preceptive requirements of the moral law, as those which bound them as transgressors to endure its penalty. Whatever the law exacted of them, in order to their justification, he as their representative obligated himself to render. The life of obedience due from them he engaged to live, the death demanded of them he bound himself to die.

It is indispensable to a just apprehension of this vitally important subject, to notice that what was a covenant of redeeming grace to his seed was a covenant of works to Christ. It was they, not he, who needed to be redeemed; they, not he, who were to be debtors to grace. He stood under the covenant, as the second Adam, a probationer, required and undertaking to render perfect, personal obedience to every demand of law, in order to the justification of his seed in him.

This exhaustive obedience he performed. Viewed in relation to the commands of the law, it may properly be denominated preceptive obedience; in relation to its curse, penal obedience. It is usual to distinguish these two aspects of it by the terms active and passive obedience. But it was both, during his life and at his death, at the same time active and passive. From the inception of his obedience he suffered, and at the climax of his sufferings he acted. From beginning to end he was a suffering actor, an acting sufferer. In life and death, consequently, and in relation to precept and penalty alike, he rendered obedience. This obedience was marred by not the slightest flaw—it was absolutely perfect. By it justice was completely satisfied and the law gloriously exalted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina</cite></span></figcaption>

<blockquote><p>None of our works neither save us nor condemn us.

It is proved that no works make us neither righteous nor unrighteous, good nor evil, but first we are good ere we do good works &amp; evil ere we do evil works, ergo no works neither save us nor condemn us. Thou wilt say, thee maketh it no matter what we do. I answer, yes. For if thou do evil, it is a sure argument that thou art evil, &amp; wantest the faith. If thou do good it is an argument that thou art good &amp; hast the faith, for a good tree beareth good fruit and an evil tree evil fruit, yet good fruit maketh not the tree good, nor evil fruit the tree evil, so the man is good ere he do good deeds and evil ere he do evil deeds. The man is ye there, his works are the fruit. Faith maketh the good tree &amp; incredulity the evil tree such a tree such fruit such a man such works. For all that is done in faith pleaseth God &amp; are good works. And all the is done without faith displeaseth god and are evil works.

Who so ever believeth or thinketh to be saved his works denieth that Christ is his saviour, that Christ died for him &amp; all thing that pertaineth to Christ. For how is he thy saviour, it thou mightest save thy self by thy works? or whereto should he die for thee if any works might have saved ye? what is this to say, Christ died for ye? verily that is, thou shouldest have died perpetually, &amp; Christ to deliver ye for that death, died for ye &amp; changed thy perpetual death in to his own death. For thou madest ye fault, &amp; he suffered ye pain, &amp; yet for ye love he had to the ere ever thou wast born when thou haddest done neither good nor evil.

Now sith he hath paid thy debt thou needest not: no thou canst not, but shouldest be damned if his blood were not. But sith he was punished for the thou shalt not be punished. Finally, he hath delivered ye from thy condemnation &amp; all evil, &amp; desireth nought of the but that thou wilt acknowledge what he hath done for ye &amp; bear it in mind, &amp; that thou wouldest help other for his sake both in word &amp; deed, even as he hath holpen ye for nought &amp; without reward, O how ready would we be to help other, if we knew his goodness &amp; gentleness towards us. He is a good &amp; a gentle lord for he doth all for nought. Let us I beseech you follow his footsteps whom all the world ought to praise and worship, Amen.</p></blockquote>

Who so ever believeth or thinketh to be saved his works denieth that Christ is his saviour, that Christ died for him &amp; all thing that pertaineth to Christ. For how is he thy saviour, it thou mightest save thy self by thy works? or whereto should he die for thee if any works might have saved ye? what is this to say, Christ died for ye? verily that is, thou shouldest have died perpetually, &amp; Christ to deliver ye for that death, died for ye &amp; changed thy perpetual death in to his own death. For thou madest ye fault, &amp; he suffered ye pain, &amp; yet for ye love he had to the ere ever thou wast born when thou haddest done neither good nor evil.

Now sith he hath paid thy debt thou needest not: no thou canst not, but shouldest be damned if his blood were not. But sith he was punished for the thou shalt not be punished. Finally, he hath delivered ye from thy condemnation &amp; all evil, &amp; desireth nought of the but that thou wilt acknowledge what he hath done for ye &amp; bear it in mind, &amp; that thou wouldest help other for his sake both in word &amp; deed, even as he hath holpen ye for nought &amp; without reward, O how ready would we be to help other, if we knew his goodness &amp; gentleness towards us. He is a good &amp; a gentle lord for he doth all for nought. Let us I beseech you follow his footsteps whom all the world ought to praise and worship, Amen.”

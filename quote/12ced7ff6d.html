</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5930dd7363" data-kw="">
<blockquote><p>Thirdly, suffer thyself to be over-borne in things indifferent by the authority of the Church, till thou be able to prove it simply unlawful, or to prove that there is a greater scandal in the use of it than in disobeying the voice of the Church and of the Christian magistrate.</p></blockquote>

</figure><figure class="quote" id="q-5a2fdbda56" data-kw="">
<blockquote><p>The partial conformist Paul, when he offered animal sacrifices, or arranged such for others (Acts 21:23–26; Num. 6:13–14) after Christ’s death, was, under a certain degree of necessity for a greater good (Acts 21:20–23), fulfilling the good in this deficient, yet lawful worship to God, without approving the deficiencies as best. Note these deficiencies in the material worship were in some ways contrary to Gospel principles (Acts 15:10, 28; Gal. 3:19, 23, 24–25; 4:1–3, 5–7, 9, 24, 30–31; 5:1, 7; Col. 2:14, 17, 20, 22; Tit. 1:14; Heb. 7:16, 27; 8:7–8, 10; 9:9–11, 28; 10:1–2, 10–11; 13:9) and the authorities would not remove them. Many may have accused Paul, knowing his convictions and what he had previously preached (Acts 21:21, albeit in a different context with a different kind of people for different formal reasons, e.g. Gal. 2–4 &amp; Col. 2:8–23), of compromising, conforming, backsliding and having temporizing motives for his own ease, avoiding suffering and of breaking the solemn, Gospel covenant. Ought not one to separate from such a scandalous Christian minister, who, for a time and in the circumstances, materially conformed at the permitted, yet restricting indulgence of the tyrannous authorities over God’s Church (as the rest of the story manifests, Acts 21:26–33)? God forbid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), “A True Principle”, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-96301fde29" data-kw="">
<blockquote><p>But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 54-55</span></figcaption>

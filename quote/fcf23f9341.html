<main class="wrap"><figure class="quote" id="q-fcf23f9341" data-kw="">
<blockquote><p>The doctrine of perseverance may also be proved in an inferential way. a. From the doctrine of election. Election does not merely mean that some will be favored with certain external privileges and may be saved, if they do their duty, but that they who belong to the number of the elect shall finally be saved and can never fall short of perfect salvation. It is an election unto an end, that is, unto salvation. In working it out God endows believers with such influences of the Holy Spirit as to lead them, not only to accept Christ, but to persevere unto the end and to be saved unto the uttermost. b. From the doctrine of the covenant of redemption. In the covenant of redemption God gave His people to His Son as the reward for the latter’s obedience and suffering. This reward was fixed from eternity and was not left contingent on any uncertain faithfulness of man. God does not go back on His promise, and therefore it is impossible that they who are reckoned as being in Christ, and as forming a part of His reward, can be separated from Him (Rom. 8:38, 39), and that they who have entered the covenant as a communion of life should fall out. c. From the efficacy of the merits and intercession of Christ. In His atoning work Christ paid the price to purchase the sinner’s pardon and acceptance. His righteousness constitutes the perfect ground for the justification of the sinner, and it is impossible that one who is justified by the payment of such a perfect and efficacious price should again fall under condemnation. Moreover, Christ makes constant intercession for those who are given Him of the Father, and His intercessory prayer for His people is always efficacious, John 11:42; Heb. 7:25. d. From the mystical union with Christ. They who are united to Christ by faith become partakers of His Spirit, and thus become one body with Him, pulsating with the life of the Spirit. They share in the life of Christ, and because He lives they live also. It is impossible that they should again be removed from the body, thus frustrating the divine ideal. The union is permanent, since it originates in a permanent and unchangeable cause, the free and eternal love of God. e. From the work of the Holy Spirit in the heart. Dabney correctly says: “It is a low and unworthy estimate of the wisdom of the Holy Spirit and of His work in the heart, to suppose that He will begin the work now, and presently desert it; that the vital spark of heavenly birth is an ignis fatuus, burning for a short season, and then expiring in utter darkness; that the spiritual life communicated in the new birth, is a sort of spasmodic or galvanic vitality, giving the outward appearance of life in the dead soul, and then dying.” According to Scripture the believer is already in this life in possession of salvation and eternal life, John 3:36; 5:24; 6:54. Can we proceed on the assumption that eternal life will not be everlasting? f. From the assurance of salvation. It is quite evident from Scripture that believers can in this life attain to the assurance of salvation, Heb. 3:14; 6:11; 10:22; 2 Pet. 1:10. This would seem to be entirely out of the question, if it were possible for believers to fall from grace at any moment. It can be enjoyed only by those who stand in the firm conviction that God will perfect the work which He has begun. …The denial of the doctrine of perseverance virtually makes the salvation of man dependent on the human will rather than on the grace of God. This consideration will, of course, have no effect on those who share the Pelagian conception of salvation as autosoteric—and their numbers are great—but certainly ought to cause those to pause who glory in being saved by grace. The idea is that, after man is brought to a state of grace by the operation of the Holy Spirit alone, or by the joint operation of the Holy Spirit and the will of man, it rests solely with man to continue in faith or to forsake the faith, just as he sees fit. This renders the cause of man very precarious and makes it impossible for him to attain to the blessed assurance of faith.</p></blockquote>

<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>

<blockquote><p>Controversy VIII: Can justifying faith be lost? Thesis: Although the elect frequently fall into grave sins and thus lose faith in its act, time, and part, they are not completely abandoned by God, nor do they totally and finally lose faith and the other gifts of the Holy Spirit in terms of the root and habit, even if they may lose them in terms of quantity. [Romanist] Antithesis: Justifying faith and justice not only can be totally and finally lost but are sometimes indeed lost. Confirmation of the Thesis:

1. Scripture teaches that Christ’s sheep cannot perish (John 10) and that nothing can separate them from the love of God (Romans 8).

2. Faith is our victory by which we overcome the world (1 John 5).

3. God does not abandon the work of His hands (Psalm 138), nor does He tempt His own beyond their strength, but provides a happy escape (1 Corinthians 10). [Romanist] Confirmation of the Antithesis:

1. “The righteous can turn from their justice” (Ezekiel 18).

2. Some fall temporarily (Luke 8), and the charity of many will grow cold (Matthew 24). Many fall from the grace of God (Galatians 5). Many also depart from the faith (1 Timothy 4 and 6).

3. Some branches in Christ do not bear fruit and are thrown into the fire (John 15).

4. The apostle says he subdues his body to avoid being disqualified (1 Corinthians 9).

5. Some, after tasting the grace of God, fall back (Hebrews 6).

6. Some, like dogs, return to their own vomit (2 Peter 2).

7. Examples of fallen angels, the first parents, Saul, David, Solomon, Peter, etc., who fell into grave sins, show that some lost all final justice.

8. The nature of faith or justice is not such that it cannot be lost. Experience shows that many fall from faith every day. Many, though baptized and justified in baptism, fall. [The Reformed] Censure:

1. It does not concern here the living root of justice but the external appearance, so that the name “justice” refers to our senses, not to God’s hidden judgment. Moreover, the hypothesis is not correctly turned into a categorical.

2. Faith here means the doctrine and profession of faith, not the heart’s trust. The charity of hypocrites, which seems like fire, cools in winter, that is, in calamities.

3. It concerns hypocrites who, for some time, are branches in their own opinion and that of others.

4. Paul speaks of pious concern, not of a final event. 5.

6. It concerns hypocrites who, on the one hand, taste the grace of God, insofar as they receive various gifts of the Holy Spirit, on the other hand, seem truly to be elect.

7. Examples of fallen angels and Saul are irrelevant and unequal; the others are false.

8. Perseverance is attributed not to the merit of faith but to God’s mercy in Christ. Hence it is said: “Faith is immovable because of the Father’s election, the Son’s satisfaction, and the Holy Spirit’s seal.” Moreover, many hypocrites fall from faith. Finally, it is false to say that baptism justifies by the act itself. In short, in this controversy, the fallacy of “secundum quid ad simpliciter” is commonly used, that is, what is true in a certain sense is considered true absolutely; this is the fallacy of arguing from appearance to essence.</p></blockquote>

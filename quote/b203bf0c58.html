<main class="wrap"><figure class="quote" id="q-b203bf0c58" data-kw="">
<blockquote><p>The style and difficulty of Scripture requires all sober and serious study of it. – The thing that I assert, will, on the one hand, please the Romanist, if he may limit it to his sense; but, on the other hand, it will not so very well please the enthusiast. The one will tell you, that the Scripture is so difficult, indeed, that it requires all serious study; but of the clergy only, for it is too difficult for laity to meddle withal: the other will tell you, there is no difficulty at all in the Scripture, to them, that have the Spirit; but all things easy enough to understand and explicate, by revelation, without any study. So that here are two rocks more for us to sail, and hold a middle course, between, – lest we dash either upon the one or upon the other: arid the card and compass I shall go by, shall be the Scripture itself.

The Scripture itself tells us, there are difficulties in it: and, if it did not so in words, yet we might easily find it in deed. And I might need no other proof of this assertion, than such a one as he gave to prove motion, who rose out of his chair and moved up and down. “Tolle, lege” “take up the Bible and read pressly;” – and that very thing will show you, that you had need to read pressly, because of the difficulty.

Let me but observe, in our entrance into this matter, these two things to you:

I. That the difficulty of Scripture doth so much require study, that none, but by serious study, can perceive its difficulty:- as the philosopher could not so much as imagine, how hard it was to define God, till he set seriously to study upon the matter; and then he found it. The farther you go in Ezekiel’s waters, the deeper you go; and the more you study the Scriptures seriously, the more cause you will still find to study them seriously. And it is not the least cause of their error, that hold the explaining of Scripture is so very easy, that they have not attained to so much skill in the study of the Scriptures as to see their hardness. And I doubt not, but I could show them scores, nay, hundreds, of very hard and obscure places, which they had never eyes to see: and I doubt as little, that they would find as little eyesight to resolve them, if they saw them.

II. The Holy Ghost bath purposely penned the Scriptures so as to challenge all serious study of them. Else, what think you is the meaning of that, “He that readeth, let him understand?” Peter tells us, that there are divers things in Paul’s Epistles hard to be understood; and why did the Holy Ghost dictate them so hard by Paul? and why did not Peter explain them, who had the same Spirit? As to that passage of Peter, you may very well remember the parable of the wounded man betwixt Jerusalem and Jericho. The priest and Levite pass by, look on him, but afford him no help. And why does Peter so by those hard places, and afford them no explication? Because the Holy Ghost hath penned Scripture so as to challenge all serious study. He could have penned all so plain, that he that runneth, might have read them; but he hath penned them in such a style, that he that will read them, must not run and read, but sit down and study.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon on 2 Sam. xix.12 in The Whole Works of Rev. John Lightfoot, D.D. Master of Catharine Hall, Cambridge</cite></span></figcaption>

<blockquote><p>In the next place, let me charge you to hold fast the old doctrine of the Church of England about the sanctity and right observance of the Sabbath Day. I name this point because our old English Sunday appears to me to be in great danger. We live in perilous times. Partly from the spread of infidelity, that old enemy of the Lord’s Day; partly from the morbid love of liberty, and letting every one do as he likes; partly from the exaggerated love of pleasure which marks this age; partly from the facilities afforded by railways for Sabbath travelling, of which our fathers knew nothing, and got on well enough without them; partly from one cause and partly from another, the devil is just now getting more help in his campaign against the Lord’s Day than he has done since the Reformation.

You may see what I mean in the persistent attempts frequently made to throw open places of amusement, aquariums, libraries, theatres, museums, picture galleries, and the like, under the plausible pretence of ‘affording recreation to the working-classes’! All such attempts, I maintain, ought to be firmly and vigilantly resisted. They are the first steps towards a Continental Sunday, and a general flood of Sabbath desecration, Sunday shop-opening, and Sunday delivery of letters in London. I would not have you give way to such attempts. ‘No surrender!’ should be our cry. Let us fight to the last plank for the old English Sunday. Give up the outworks, and the citadel will soon fall.

That laymen of high position and education, noblemen, philosophers, and scientific lecturers, should assist the attempt to break down the standard of Sunday observance, is matter for deep regret. I can only suppose that they do it in ignorance. If they would only study hearts and consciences and death-bed feelings half as much as they study political economy, or stones and plants and beasts and geology and astronomy and light and chemistry and the secrets of earth and air and sea, I believe they would not act as they do. I pity and pray for them. ‘They know not what they do.’

But how any clergyman holding office in the Church of England, and reading the Fourth Commandment every Sunday to his congregation, can lend his aid to movements which must infallibly prevent the Sabbath being kept holy, if they succeed, is one of those mysteries of the nineteenth century which pass my understanding. I am amazed, pained, troubled, grieved, and astonished. The good that the best clergyman does at his very best in a fallen world is small. But he that expects to do good by introducing a Continental Sunday into his parish, exhibits, in my judgment, however excellent his intentions, great ignorance of human nature. He is cutting off his right hand, and destroying his own usefulness.

Whatever may be the bad habits of the working-classes in large parishes, they will never be cured by organizing modes of breaking the Fourth Commandment. We should call that statesman a poor lawgiver who sanctioned petty larceny in order to prevent burglary; and I call that clergyman an unwise man, who, in order to stop drunkenness and its concomitants, is prepared to throw overboard the Sabbath Day. Surely to sacrifice one commandment in order to prevent the breach of another, is neither Christianity nor common-sense. It is, in my opinion, ‘doing evil that good may come.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hold Fast. The Fourth Triennial Charge to the Diocese of Liverpool, November 4, 1890 in Charges and Addresses</cite></span></figcaption>

<blockquote><p>24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not.</p></blockquote>

<blockquote><p>St. Paul giving a rule how men should sing, first says, “I will sing in voice, and I will sing with understanding.” And in another place, showing what songs should be song, exhorts the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual, singing in their hearts to the Lord with thanks giving.” As if the Holy Ghost would say, that the song did inflame the heart to call upon God, and praise him with a more fervent and lively zeal. And as music or singing is natural unto us, and therefore every man delights therein; so our merciful God sets before our eyes, how we may rejoice and singe to the glory of his name, recreation of our spirits, and profit of ourselves. But as there is no gift of God so precious or excellent, that Satan has not after a sort drawn to himself and corrupt, so has he most impudently abused this notable gift of singing, chiefly by the Papists his ministers, in disfiguring it, partly by strange language, that cannot edify, and partly by a curious wanton sort, hiring men to tickle the ears and flatter the fantasies, not esteeming it as a gift approved by the Word of God, profitable for the Church, and confirmed by all antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.” If any, perhaps, would doubt, when, or by whom these churches or assemblies were institute, it is likewise evident, that St. John the Apostle, who, although in Domitian’s time he was banished in the Isle Patmos; yet when Nerva his successor, and next before Trajan reigned, returned to Ephesus, and so planted the churches, as the stories report. Seeing therefore God’s Word does approve it, antiquity bears witness thereof, and best reformed Churches have received the same, no man can reprove it, except he will condemn God’s Word, despise antiquity, and utterly condemn the godly reformed Churches. And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost has framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appears by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their common speech and prose, gave thanks to God for such comfort as He sent them. Here it were to long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just pauses, but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he fashioned many Psalms according to the letters of the alphabet; so that every verse begins with the letters thereof in order. Sometimes ‘A’ begins the half verse, and ‘B’ the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation. Now, to make you privy also why we altered the rhyme in certain places of him, whom for the gifts that God had given him, we esteemed and reverenced, this may suffice: that in this enterprise, we did only set God before our eyes, and therefore weighed the words and sense of the Prophet, rather considering the meaning thereof than what any man had write. And chiefly being in this place, whereas most perfect and godly judgment did assure us, and exhortations to the same encourage us, we thought it better to frame the rhyme to the Hebrew sense, than to bind that sense to the English meter: and so either altered for the better, in such places as he had not attained unto, or else where he had escaped part of the verse, or sometimes the whole, we added the same, not as men desirous to find faults, but only as such which covet to hide them, as the learned can judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whittingham.html">William Whittingham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory Letter to The Form of Prayers and Ministration of the Sacraments, etc., used</cite>, (Edinburgh, 1562)</span></figcaption>

<blockquote><p>A man preaches that sermon only well unto others which preaches itself in his own soul. And he that does not feed on and thrive in the digestion of the food which he provides for others will scarce make it savoury unto them; yea, he knows not but the food he has provided may be poison, unless he have really tasted of it Himself. If the Word do not dwell with power in us, it will not pass with power from us.</p></blockquote>

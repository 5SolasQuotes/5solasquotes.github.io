<main class="wrap"><figure class="quote" id="q-76a8711059" data-kw="">
<blockquote><p>So when God layeth sin to the charge of the sinner, in punishing it, He is said to lay a burden on the sinner, 2 Kings 9:25. And to remove this burden, is to pardon the sin. 2 Chron. 7:14, “If my people humble themselves, then will I hear from heaven, and will forgive their sin, and will heal their land;” by removing the locusts and the pestilence. See, the pardoning of their sin is exponed [expounded] to be the removing of the locusts and pestilence [2 Chron. 7:13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, ... (London, 1647), p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“So when God layeth sin to the charge of the sinner, in punishing it, He is said to lay a burden on the sinner, 2 Kings 9:25. And to remove this burden, is to pardon the sin. 2 Chron. 7:14, “If my people humble themselves, then will I hear from heaven, and will forgive their sin, and will heal their land;” by removing the locusts and the pestilence. See, the pardoning of their sin is exponed [expounded] to be the removing of the locusts and pestilence [2 Chron. 7:13].”

— Samuel Rutherford, Christ Dying and Drawing Sinners to Himself... (London, 1647), p. 37">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+when+God+layeth+sin+to+the+charge+of+the+sinner%2C+in+punishing+it%2C+He+is+said+to+lay+a+burden+on+the+sinner%2C+2+Kings+9%3A25.+And+to+remove+this+burden%2C+is+to+pardon+the+sin.+2+Chron.+7%3A14%2C+%E2%80%9CIf+my+people+humble+themselves%2C+then+will+I+hear+from+heaven%2C+and+will+forgive+their+sin%2C+and+will+heal+their+land%3B%E2%80%9D+by+removing+the+locusts+and+the+pestilence.+See%2C+the+pardoning+of+their+sin+is+exponed+%5Bexpounded%5D+to+be+the+removing+of+the+locusts+and+pestilence+%5B2+Chron.+7%3A13%5D.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+and+Drawing+Sinners+to+Himself...+%28London%2C+1647%29%2C+p.+37&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76a8711059.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76a8711059.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-spreading-diseases-and-plagues/#:~:text=So%20when%20God%20layeth%20sin%20to,locusts%20and%20pestilence%20%5B2%20Chron.%207%3A13&amp;text=So%20when%20God%20layeth%20sin%20to%20the%20charge&amp;text=of%20the%20locusts%20and%20pestilence%20%5B2%20Chron.%207%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-129abc9c11" data-kw="">
<blockquote><p>Those who are engaged in a spiritual ministry such as preachers and pastors must likewise remain steadfast before the peril of death.¹ We have a plain command from Christ, “A good shepherd lays down his life for the sheep but the hireling sees the wolf coming and flees” [Jn. 10:11]. For when people are dying, they most need a spiritual ministry which strengthens and comforts their consciences by Word and sacrament and in faith overcomes death. ¹ Elector John wrote Luther and urged him and the professors at the university to leave on account of the plague and go to Jena. Luther, Bugenhagen, and two chaplains, however, stayed on at Wittenberg. However, where enough preachers are available in one locality and they agree to encourage the other clergy to leave in order not to expose themselves needlessly to danger, I do not consider such conduct sinful because spiritual services are provided for and because they would have been ready and willing to stay if it had been necessary. We read that St. Athanasius fled from his church that his life might be spared because many others were there to administer his office (Augustine, MPL 30.1017). Similarly, the brethren in Damascus lowered Paul in a basket over the wall to make it possible for him to escape, Acts 9 [:25]. And also in Acts 19[:30] Paul allowed himself to be kept from risking danger in the marketplace because it was not essential for him to do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether one may Flee from a Deadly Plague’</cite>, (c. 1527), p. 2 in Luther’s Works, Vol. 43: Devotional Writings II, ed. Jaroslav Jan Pelikan, Hilton C. Oswald &amp; Helmut T. Lehmann, vol. 43 (Philadelphia: Fortress Press, 1999), 119–38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

+II%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald+%26+Helmut+T.+Lehmann%2C+vol.+43+%28Philadelphia%3A+Fortress+Press%2C+1999%29%2C+119%E2%80%9338&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F129abc9c11.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/129abc9c11.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=Those%20who%20are%20engaged%20in%20a,essential%20for%20him%20to%20do%20so&amp;text=Those%20who%20are%20engaged%20in%20a%20spiritual%20ministry&amp;text=was%20not%20essential%20for%20him%20to%20do%20so" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fb097aeaa4" data-kw="">
<blockquote><p>Nor is it the restraining of him [a spiritual seducer] from personal liberty because of it [his false opinion]; but, because he doth not, nor will not use his personal liberty without prejudice to the whole body, which is to be preferred to him: even as a man, infected with the pestilence, ought justly to be restrained, though against his will; yet cannot that be accounted a restraint of just liberty; for, it is no just liberty to have liberty to hurt others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (Edinburgh, 1659), p. 255</span></figcaption>

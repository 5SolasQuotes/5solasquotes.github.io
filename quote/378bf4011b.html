<main class="wrap"><figure class="quote" id="q-378bf4011b" data-kw="">
<blockquote><p>Believers are not one with Christ by transfusion of the properties and qualities of the Godhead or manhood unto us. It may be said, how then are they one with Him? I answer, by one and the same Spirit dwelling in Christ and in all the members of Christ. “He that cleaveth to the Lord, is one Spirit” (1 Cor. 6:17). Paul says in this sense that Christ makes the two distinct nations of Jews and Gentiles “one new man” (Eph. 2:15). St. John says, that Christ “dwells in us and we in him by the Spirit’ (1 John 3:24). … all the saints in heaven and all believers upon earth, having one and the same Spirit of Christ dwelling in them, are all one in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 234–35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ.html">Union with Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d98fcfabd" data-kw="">
<blockquote><p>In ourselves we are unworthy. All kindness towards us is of the nature of grace. Christ is the beloved for his own sake; and it is to us only as in him and for his sake that the grace of God is manifested.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a> › <a href="../topics/attributes-of-god/goodness-love-and-mercy/grace.html">Grace</a></span></div>

</figure><figure class="quote" id="q-b684704658" data-kw="">
<blockquote><p>Here note well that we thought meet before we expressed the particular works of the Spirit in believers, to mention first the relative change of their states, which in order goes between their believing and their further sanctification: These we have expressed in four terms: The first in order is our conjunction to Christ as our Head, called by divines, our union with Him. The second is our membership in the universal Church, which is his body. The third is our pardon or justification. The fourth is our adoption. Where note: 1. That we call not these ‘the works of the Spirit,’ but put them in as in a parenthesis between our believing and the works of the indwelling Spirit. 2. Yet we choose rather to put them in this part of our Profession than the former, because as no man has right to these benefits but through faith, so though they are not the effects of that faith (which the Spirit works), yet are they consequents of it by virtue of Christ’s promise or New Law; and though faith be not the cause of them in strict sense, yet it is the condition of our right in them. And therefore they seem here to be placed, as divines commonly do, between faith and sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/application-of-redemption-in-general/order-of-salvation.html">Order of Salvation</a></span><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

Fquote%2Fb684704658.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b684704658.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-application-of-redemption/#:~:text=Here%20note%20well%20that%20we%20thought,commonly%20do%2C%20between%20faith%20and%20sanctification&amp;text=Here%20note%20well%20that%20we%20thought%20meet%20before&amp;text=as%20divines%20commonly%20do%2C%20between%20faith%20and%20sanctification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d04c21ab00" data-kw="Grace">
<blockquote><p>It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Union and Communion</cite>, Introduction (nature of the union, 1)</span></figcaption>

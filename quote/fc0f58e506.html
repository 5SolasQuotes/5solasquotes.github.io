<main class="wrap"><figure class="quote" id="q-fc0f58e506" data-kw="">
<blockquote><p>I certainly cannot say I was surprised as much as some, and simply because I was a Christian I had long been vexed with the Sabbath-breaking which took place in connexion with the bank, visits to partners, and consultations about worldly business, and the like, and I had a strong presentiment that such a complete departure from my Grandfather’s godly ways, would sooner or later be severely chastened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop J. C. Ryle’s Autobiography: The Early Years</cite>, ed. Andrew Atherstone (Edinburgh: Banner of Truth, 2017), p. 88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>We leave our duty but half-performed, if we do not follow missionaries and bibles with prayer — unceasing, earnest prayer. God may, indeed, in his sovereign grace, send forth the Spirit in converting efficacy, irrespective of our prayerlessness, and he may make the bibles and the missionaries that have been sent forth by prayerless men, “the savour of life unto life;” but, besides that this does not alter the obligation under which he has laid us, — it is an expectation which we are not warranted to entertain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-lumsden.html">James Lumsden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Nations to the Church, and their Danger in Neglecting it in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-57f3f0dde2" data-kw="">
<blockquote><p>The Spiritual Christian knows no Sabbath but the bosom of the Father.

Answ. No wonder Antinomians destroy the fourth Commandment, they destroy the other nine, and all the letter of the Bible, as fleshly, and a killing Letter. I believe the Lord’s day is moral and perpetually moral till Christ’s coming, from Gen. 2.2. Exod. 20.8. Deut. 5.12. Matth. 24.20. John 19.42. Luke 24.56. 1 Cor. 16.1. Acts 20.7. Rev. 1.10. Let Saltmarsh and Familists call for the book of sports on the Lord’s day: I knew never any truly Godly in either Kingdom despise the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.26, p. 229.</span></figcaption>

</figure><figure class="quote" id="q-989f6f9a74" data-kw="">
<blockquote><p>But they like men have transgressed the covenant: there have they dealt treacherously against me.” (Hosea 6:7)

I told them by my prophets what I required of them by covenant, but I could not obtain it, they regarded not what I said. Like men; or, like Adam: some take it for a proper name, and so refer it unto the first man, and his breaking covenant; and, for aught I see, it may well enough refer to him, who forgot or slighted the threat, who judged of what he did by what it appeared, as a small matter; and so these forget and slight my threats, and judge of the place where, and the persons by whom, and the times when, sacrifices are to be offered as no material circumstances, and therefore do choose what places they please, and appoint what priest liketh them best to offer; or else transgress the covenant, as if it were the covenant of a man like themselves.

The covenant; the law of their God, which directed and encouraged their obedience, and which threatened their disobedience, and cursed it. There; in that very place, the good land, which by covenant I gave them, they have broken my covenant; or in the things in which they thought they kept covenant, in their sacrifices, and observing of feasts, in these things they transgress the covenant. Dealt treacherously against me; very frowardly, and with wilful resolutions perverted my law; their transgressing was a designed perfidiousness. I told them, Obedience, not sacrifice; they reply, Sacrifice, and stop there; they give no obedience, though they offer many sacrifices.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; 3 vols, London: Banner of Truth, 1962), 2: 865.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-2274f4a73a" data-kw="">
<blockquote><p>It is worthy of note, that in every form of religion established by God among men, the Sabbath has stood forth its most conspicuous monument. In the religion of nature, which was strictly a religion of law, and had respect to man in his primitive holiness, the Sabbath was the only ordinance of worship.

There was the law written upon Adam’s heart; there was the tree of temptation for the proof of his obedience; there was the sacramental tree of life, the seal of the covenant and its blessings, instantly forfeited upon transgression; but amidst them all rose the Sabbath, itself the sign of a more perfect rest, the great comprehensive institute of natural religion, embodying the worship which man owes to God, and embracing that obedience to His law, which was its fundamental element. It was eminently proper that man should thus bring, in the worship of the Sabbath, a pledge of his soul’s deepest homage to God. But this was not all; in its repose also, he brought a religious tribute of that very life and being which God had bestowed.

In the gift of immortality, God set the seal of His own image upon the existence which He gave to man. If it was not self-being, since this could not be given, it was at least ceaseless being; and this natural endowment is placed as the stake of man’s obedience, which the law covers with its mortgage. Now, it is of this very being, thus consecrated by the seal of God’s image, and placed as the pawn to be redeemed only by perfect obedience to the divine law, that man, in the repose of the first Sabbath, offered the first fruits to God; and ever as this weekly day of rest recurs, is there presented a perpetual wave-offering before the Lord, by which our whole time and life are surrendered to Him, and anew received at His hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-morgan-palmer.html">Benjamin Morgan Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Letter on the Observance of the Sabbath, to the Churches and Church members within the Synod of South Carolina in Minutes of the Synod of South Carolina, at their Sessions, in Winnsborough, Fairfield District, S.C., Nov. 1851</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-d5c6ab179c" data-kw="">
<blockquote><p>But the Romish clergy, together with the infinite orders of religious votaries, are not few but many, and those chosen promiscuously without any respect had whether they be endowed with that gift or no: therefore, being unable to contain, and forbidden to use the lawful remedy ordained by God, they must of necessity fall into lawless and inordinate lusts: Besides, seeing that every man that will, be he never so defamed for incontinency, and so by experience known to be void of that same excellent gift, may become a votary, and on the contrary (our Savior says) every man cannot receive this, what hope can there be of chastity among these men? Is the gift of chastity indeed so common, that every man may have it that will? Is it so ordinary, that it is communicated to thousands of priests, monks, friars, and nuns? yea, to innumerable of that order in all places? why then, what meant Cassander, a learned divine of their own, to say, that the world was come to that pass, that a man could scarce find one of an hundred that kept himself free from incontinency?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beard.html">Thomas Beard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retractive from the Romish Religion</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e200b6f225" data-kw="">
<blockquote><p>In this behalf no law can be prescribed, neither can we judge one of another, but every man should be a sufficient witness to himself, because in himself he feels the infirmities and pricks of the flesh. And albeit there appear never so many stops and lets in marriage, yet this must all understand to whom God has not given the gift of chastity (and so by that means not able to withstand the pricks of the flesh), that this commandment is by the Lord laid upon their shoulders as a burden to bear, which if it be not performed (seeing that God has appointed this as a remedy against sin), they commit grievous iniquity, and by that their dealing heap unto themselves wrath against the day of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eusebius-pagit.html">Eusebius Pagit</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon</cite>, 9th June, 1572</span></figcaption>

</figure><figure class="quote" id="q-24bf54aa64" data-kw="">
<blockquote><p>We deny that Papalism, or the faith of the Papists according to the Roman formula and the prescription of the Council of Trent, considered abstractly and in itself, is salutary (that is, that it is meritorious of salvation, or a cause, or a means, or a sine qua non condition, or the way through which it is obtained); but on the contrary, we say that it is damnable. For considered formally, it is composed of mere errors, heresies, idolatry, and superstitions.</p></blockquote>

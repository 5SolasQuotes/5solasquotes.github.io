<main class="wrap"><figure class="quote" id="q-252239b9c2" data-kw="">
<blockquote><p>While living in Geneva about 1558, Knox was asked by persons back in England to answer a book circulating there titled Careless by Necessity. This work, written by an Anabaptist, denied the doctrine of Predestination. Knox complied… This work is the longest of Knox’s writings… On Predestination is in the form of an ‘answer’, and is disputational in structure. Knox alternately [block] quotes an assertion from his ‘Adversarie’ [in the order of the adversary’s book] immediately following it with his ‘Answer’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-l-dole.html">Brian L. Dole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘John Knox on Predestination’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-a29a73f9ec" data-kw="predestination definition Calvin all not created equal">
<blockquote><p>By predestination we mean the eternal decree of God, by which he determined with himself whatever he wished to happen with regard to every man. All are not created on equal terms, but some are preordained to eternal life, others to eternal damnation; and, accordingly, as each has been created for one or other of these ends, we say that he has been predestinated to life or to death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.5</span></figcaption>

</figure><figure class="quote" id="q-d88e89822c" data-kw="">
<blockquote><p>16. God’s providence extensively is occupied concerning all both entities and acts of entities, and intensively is partly effective, partly permissive, partly directive.

17. Works of grace are either preparatory of it [i.e. decrees] or applicatory.

18. Secondary preparatory works of grace [such as infra decrees] can be given; primary ones [such as supra decrees] cannot be given.

19. Secondary preparatory works of grace are the eternal destination of the Mediator, and his temporal mission, and the obedience of the one sent, consisting both in his appearance and in the execution of the threefold office undertaken by him. …

24. Applicatory works of grace are either external or internal.

25. External ones are both calling through the Word partly of law, partly of gospel, and the sealing of those called through sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-ab49ef4f0f" data-kw="good pleasure election">
<blockquote><p>The orthodox maintain that the good pleasure (eudokian) alone has place and think that no other cause can either be given or rightly sought. But the adversaries (who cherish Pelagianism or semi-Pelagianism) suppose that others also can come in order: for instance, either Christ and his merit, or the foresight of faith and works.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-acac1af563" data-kw="">
<blockquote><p>Who then, who can declare the Father by number, so as to discover the powers of His Word? For like as He is the Father’s Word and Wisdom, so too condescending to created things, He becomes, to impart the knowledge and apprehension of Him that begot Him, His very Brightness and very Life, and the Door, and the Shepherd, and the Way, and King and Governor, and Saviour over all, and Light, and Giver of Life, and Providence over all. Having then such a Son begotten of Himself, good, and Creator, the Father did not hide Him out of the sight of His creatures, but even day by day reveals Him to all by means of the organisation and life of all things, which is His work.

But in and through Him He reveals Himself also, as the Saviour says: “I in the Father and the Father in Me:” so that it follows that the Word is in Him that begat Him, and that He that is begotten lives eternally with the Father. But this being so, and nothing being outside Him, but both heaven and earth and all that in them is being dependent on Him, yet men in their folly have set aside the knowledge and service of Him, and honoured things that are not instead of things that are: and instead of the real and true God deified things that were not, “serving the creature rather than the Creator,” thus involving themselves in foolishness and impiety.

For it is just as if one were to admire the works more than the workman, and being awestruck at the public works in the city, were to make light of their builder, or as if one were to praise a musical instrument but to despise the man who made and tuned it. Foolish and sadly disabled in eyesight! For how else had they known the building, or ship, or lyre, had not the ship-builder made it, the architect built it, or the musician fashioned it?

As then he that reasons in such a way is mad, and beyond all madness, even so affected in mind, I think, are those who do not recognise God or worship His Word, our Lord Jesus Christ the Saviour of all, through Whom the Father orders, and holds together all things, and exercises providence over the Universe; having faith and piety towards Whom, my Christ-loving friend, be of good cheer and of good hope, because immortality and the kingdom of heaven is the fruit of faith and devotion towards Him, if only the soul be adorned according to His laws. For just as for them who walk after His example, the prize is life everlasting, so for those who walk the opposite way, and not that of virtue, there is great shame, and peril without pardon in the day of judgment, because although they knew the way of truth their acts were contrary to their knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Heathen</cite>, (c. 335), 28.1-4 in Nicene and Post-Nicene Fathers 2, 4: 29-30.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74c3572d0d" data-kw="unity three persons">
<blockquote><p>While he proclaims his unity, he distinctly sets it before us as existing in three persons. These we must hold, unless the bare and empty name of Deity merely is to flutter in our brain without any genuine knowledge. Moreover, lest any one should dream of a threefold God, or think that the simple essence is divided by the three Persons, we must here seek a brief and easy definition which may effectually guard us from error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.2</span></figcaption>

</figure><figure class="quote" id="q-3a922f0ea6" data-kw="">
<blockquote><p>By person, then, I mean a subsistence in the Divine essence,--a subsistence which, while related to the other two, is distinguished from them by incommunicable properties. By subsistence we wish something else to be understood than essence. For if the Word were God simply and had not some property peculiar to himself, John could not have said correctly that he had always been with God. When he adds immediately after, that the Word was God, he calls us back to the one essence. But because he could not be with God without dwelling in the Father, hence arises that subsistence, which, though connected with the essence by an indissoluble tie, being incapable of separation, yet has a special mark by which it is distinguished from it. Now, I say that each of the three subsistences while related to the others is distinguished by its own properties. Here relation is distinctly expressed, because, when God is mentioned simply and indefinitely the name belongs not less to the Son and Spirit than to the Father. But whenever the Father is compared with the Son, the peculiar property of each distinguishes the one from the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.6</span></figcaption>

</figure><figure class="quote" id="q-1021da70d5" data-kw="">
<blockquote><p>The Scriptures teach that there is essentially but one God, and, therefore, that the essence both of the Son and Spirit is unbegotten; but inasmuch as the Father is first in order, and of himself begat his own Wisdom, he, as we lately observed, is justly regarded as the principle and fountain of all the Godhead. Thus God, taken indefinitely, is unbegotten, and the Father, in respect of his person, is unbegotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.25</span></figcaption>

</figure><figure class="quote" id="q-0a4b69cfda" data-kw="">

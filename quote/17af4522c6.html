<main class="wrap"><figure class="quote" id="q-17af4522c6" data-kw="">
<blockquote><p>[We say no:] 3. Because God denied this effectual influence to Adam not willing to have it; and therefore there was here a virtual and interpretative demerit of Adam, although not formal–because in the same instant of time in which God denied this actual influence, Adam freely willed to lack it, and by this very fact, that he sinned the first sin, he interpretatively willed to lack that predetermining grace, which if he had had, he would have devoutly avoided the first sin. Nor do we deem it absurd for the lack of predetermining grace, and the culpable demerit of that lack, to coexist at the same time, although the lack is prior in the order of nature to the demerit–which I acknowledge to be a mystery of our theology not to be scrutinized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668) | “Is not God made the author of the first sin, if man sinned for this reason, because God denied him, apart from his own fault, the grace necessary for avoiding the first sin?”, pp. 199-200, ch. 5, State of the First Man.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e0f2f5954" data-kw="">

</figure><figure class="quote" id="q-a58969579b" data-kw="">
<blockquote><p>23. To imagine God either without providence, or with general only, not special, indeed also singular, concerning any entities whatsoever and any acts of entities, is impious and hurls God from his throne.

24. But this providence is either effective of all good, or permissive and directive of evil, nor idle concerning evil but efficacious, although not efficient.

25. Whence those who strive to ascribe to God the efficiency of evil reduplicatively as such to orthodox [Reformed] Churches, do what they do from mere either ignorance or malice, since they constantly teach that God can be neither the physical nor the ethical cause of ethical evil as such.

26. To imagine God also without predestination is both to detract the eternal direction of all things from God, and to establish an uncertain end of the creation of men, and to make primary causes from secondary, and to constitute man the craftsman and architect of his own salvation.

27. Yet the orthodox doctrine of the Reformed Churches concerning predestination neither removes the guilt of the fall from man, nor imputes it to God, nor establishes a necessity of the fall incompossible with the freedom of the one falling or fallen. Nor have those who oppose necessity in every way to freedom well-perceived the nature either of necessity or of freedom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-d43476860a" data-kw="">
<blockquote><p>All the acts necessary for war-making are, in an eminent manner, ascribed to God, as (1) The Lord fights for his own people. (2) The Lord scattered the enemies. (3) The Lord slew Og, king of Bashan. (4) The battle is the Lord’s. (5) The victory [is] the Lord’s; therefore Israel never fought a battle. So Deut. 32[:10], The Lord alone led his people — the Lord led them in the wilderness — their bow and their sword gave them not the land. God wrought all their works for them (Isa. 26:12), therefore Moses led them not; therefore the people went not on their own legs through the wilderness; therefore the people never shot an arrow, never drew a sword. It follows not. God did all these as the first, eminent, principal and efficacious pre-determinator of the creature (though this Arminian and popish prelate [John Maxwell] mind not so to honour God).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 18</span></figcaption>

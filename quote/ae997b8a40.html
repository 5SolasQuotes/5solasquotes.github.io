<main class="wrap"><figure class="quote" id="q-ae997b8a40" data-kw="">
<blockquote><p>Worthy receivers, outwardly partaking of the visible elements in this sacrament,[n]… [n] 1 Cor. 11:28. …Wherefore all ignorant and ungodly persons, as they are unfit to enjoy communion with Him, so are they unworthy of the Lord’s table, and cannot, without great sin against Christ, while they remain such, partake of these holy mysteries,[p] or be admitted thereunto.[q] [p] 1 Cor. 11:27-29. 2 Cor. 6:14-16. [q] 1 Cor. 5:6,7,13. 2 Thess. 3:6,14,15. Matt. 7:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession of Faith 1646</cite>, 29.7-8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cab4783fca" data-kw="">
<blockquote><p>Apostles and members-dissolved are not fixed members of a single congregation, and yet members they must be of the visible, Church-catholic: sure it is no paradox, that the Apostles are such members, for they had right to all the seals in all congregations; Therefore, they must by this reason be members and no members: the like may be said of godly professors-sojourners [travellers], of these baptized by John Baptist, Mt. 3, by Peter, Acts 10, by Paul, Acts 16. For if we say that professors are only members of a particular congregation, then we confine a brother to be gained only to one congregation: ‘let all the rest perish: they are not my brethren.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, ... (1658), bk. 1, ch. 25; p. 159</span></figcaption>

<blockquote><p>1st Conclusion. An adjoining to a visible Church either formally to be a member thereof, or materially, confessing the Faith of the true visible Church, God offering occasion, is necessary to all: 1. Because we are to be ready to give a confession of the hope that is in us, to every one who asks, 1 Pet. 3:15. 2 Because he who denies Christ before men, him also will Christ deny before the Father and before the holy angels, Mt. 10:33.

3. Yet if some die without the Church, having faith in Christ, and want opportunity to confess Him before men, as repenting in the hour of death, their salvation is sure, and they are within the invisible Church: so is that to be taken, extra Ecclesiam nulla salus, none can be saved who are every way without the Church, both visible and invisible; as all perished who were not in Noah’s Ark. 2nd Conclusion. When God offers opportunity, all are obliged to join themselves to a true visible Church:

1. Because God has promised his presence to the Churches as his Son walks in the midst of the golden candlesticks, Rev. 2:2.

2. Because faith comes by hearing a sent preacher, Rom. 10:4.

3. Separation from the true visible Church is condemned, Heb. 10:24; Jude v. 19; 1 Jn. 2:19.

4. Good men esteem it a rich favour of God to lay hold on the skirt of a Jew, Zech. 8:23, and to have any communion, even as a door keeper in God’s House, and have desired it exceedingly and complained of the want thereof, Ps. 84:10. v. 1-2; Ps. 27:4; Ps. 42:1-4; Ps. 63:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London: 1644), pt. 1, p. 79</span></figcaption>

<blockquote><p>Ch. 8, Of their Dismissing of Members from one church to another, or otherwise. 1. No person once thus admitted (as aforesaid) into any of their churches ought to remove thence without the consent of the said church first sought and obtained. For if he do, they hold that he breaks covenant with God and the Church and like Ananias and Sapphira lies against the Holy Ghost. Answer to 9th Position, p. 73; Apology of the Churches in New England for Church Covenant, p. 39; R.M. to E.B., p. 6. Inasmuch as they conceive their covenant binds them not to depart without consent. Ibid.

2. Therefore when any would remove, they require that he first give notice thereof to their church wherewith he is in covenant and lay before them (how many soever they be) in a public meeting both his reasons for which he desires to remove and also to what other church he would remove, and consult with them about both. Answer to 9th Position, p. 74; Apology, p. 20.

3. If upon examination they approve both of his reasons why and of the place whither he would go, then they consent, and giving him letters of dismission and recommendation to that other church, they send him away with their prayers and blessing. Ibid.

4. If contrarily they approve not, either the one or the other, they dissuade him from his purpose; if they prevail not, they will not hold him by violence (for that they cannot), yet they will neither give their consent, nor give him their letters of recommendation (though he were otherwise never so well deserving), nor send him away with their benediction as otherwise they would. Ibid. Yea, he shall depart little better than an excommunicate, as a covenant breaker with God and man, and as one that is wise in his own conceit and refuses to hearken to counsel. Ibid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644) Rathband was a Westminster divine., pp. 31-32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e20ef78ad3" data-kw="">
<blockquote><p>He [Owen] intimates that it is not in our power to close with some and not withal. This is his first error. Though man give us no such power, God does: as it is in my power to believe all that one speaks truly and well, and not that which he speaks amiss. I am not bound to own all that any preacher or priest shall say in the church. God put it in the disciples’ power to beware of the leaven of the Pharisees [Mt. 16:6], and yet to hear them [Mt. 23:1-3]. Proving all things [1 Thess. 5:21] is not approving all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 25</span></figcaption>

</figure><figure class="quote" id="q-2f0051a23a" data-kw="">
<blockquote><p>John the Baptist was an occasional conformist to the Jewish Church: He went to Jerusalem to worship thrice a year at the solemn feasts, according to the Law [Dt. 16:16]; but at other times he held separate assemblies¹ in the wilderness of Judea at Jordan [Mk. 1:5], and at Aenon [Jn. 3:23], where he taught and baptized… ¹ [For a summary in English Church history after the Reformation of presbyterians and puritans who at times held separate assemblies from the established Anglican Church, yet still held communion with her, see James Owen, Moderation Still a Virtue, 1704, pp. 42-44.] Our Lord Jesus Christ, the Author of our holy religion, was also an occasional conformist. We find Him sometimes in the Temple and synagogues; at other times preaching in private houses, on mountains and in the wilderness, etc… He preached in separate congregations, was a dissenter from the imposed ceremonies and traditions of the elders, and vindicated his disciples in their non-conformity to them, telling his censorious accusers that they ‘taught for doctrine the commandments of men.’ (Mt. 15:1-9; Mk. 7:1-8) The apostles of our Lord Jesus, in imitation of their Master, were occasional conformists. One, while we find them in the Temple at public worship and teaching there (Acts 3:1; 4:1); another [time] while in a private meeting, or conventicle, as some would call it. St. Luke says, ‘They continued daily with one accord in the Temple’, and ‘broke bread from house to house.’ (Acts 2:46) St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity… From this different constitutions of the Jewish [in Acts 15:21] and Gentile Churches, it follows: 1. That there was no exact uniformity in the Churches planted by the apostles. Nor did they make any laws of uniformity in lesser matters, as the condition of Christian communion; but left the believers to follow their different sentiments, and to approve themselves to God therein. Some were free to eat all things, others eat herbs, rather than forbidden flesh, or clean flesh dressed after the manner of the gentiles, some observed days, others not. (Rom. 14:2, 5) Here is a manifest difference in practice, and the rule or canon which the apostle gives about it, is not a rule of uniformity, but of charity, not to despise or judge one another. (Rom. 14:3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Occasional Communion</cite>, Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful. | Lawfulness &amp; Need in Some Circumstances for Some Separation, while Maintaining Occasional Communion, or Conformity</span></figcaption>

<blockquote><p>…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?”

<blockquote><p>Seeing therefore that inward contrition for sin is the first step to repentance, and that which killeth the root of sin, and setteth us free from the power and dominion of it, and erecteth in our hearts a throne for Christ Jesus; the use of this point is,

First for reproof of those that persuade themselves, and bear others in hard that they have truly repented, and do continually confess their faults, and ask pardon for them: but what grief and pain have they had in their hearts for their sins? nay, they thank God, they were never terrified nor troubled in their consciences. Do you thank God for this? it is in effect to thank him for that you want the first and principal note of true conversion: if your hearts have never been pricked and slung with the sense of your vileness and wretchedness, it is because you are senseless: for there is cause sufficient why you should be grieved; and the less you have had, the more you are likely to have, if not here, yet in the world to come, and at that day when you shall be most unwilling of it.

Secondly, here are those to be reproved that run into far greater excess of sinning than ever David did, breaking forth into gross and foul evils, that every body seeth and knoweth, and condemneth, and yet they pass them over slightly, and carelessly, as if they were matters of nothing. When David did but cut off the lap of Saul’s coat, his heart smote him, and was grieved within him, in that he was so near unto sin: what then shall we think of these that do not cut off the lap of the coat of an enemy, but are injurious to their friends, and cruel against their brethren, that break covenant and promise, sin against God, blaspheme his name, profane his Sabbaths, and the like, and yet none of all these do soundly work upon them, nor much trouble them? surely such men are not of David’s spirit, and therefore not being broken hearted here, they shall be broken and crushed in pieces with the unsupportable weight of God’s vengeance hereafter.

Thirdly, sith this inward touch for sin is a thing so necessary, let us hence learn to labour for it, and to keep tenderness of heart when we have obtained it: for that sorrow which breaketh the heart, doth withal break the neck of sin: and therefore when the Lord doth check &amp; control our consciences, let us esteem it as a great mercy, and not let such strokes pass without their right use, but let us go to God and to his children for help and direction, and them that little spark of the fire of God in our souls, being fed &amp; nourished, will grow in the end to a great flame. Now that our hearts may be kept always tender &amp; sensible of those checks which God’s spirit giveth us, let us use these means that follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal</cite>, (London: William Welbie, 1611), pp 4-5.</span></figcaption>

v>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1292c4462a" data-kw="">
<blockquote><p>…repentance is taken sometimes largely and sometimes strictly: By this distinction it may easily appear how sorrow goes before repentance and how repentance goes before faith. Indeed, for the latter is the great controversy, but some reconcile it thus: Repentance has two parts, the aversion of the soul from sin, and the conversion of the soul to God; the latter part of it is only an effect of faith, the former part of it, viz. the turning of the soul from sin is also an effect, but not only an effect, for it is begun before faith, though it be not ended till our life end. Some object that God works repentance and faith together: But we dispute not how God works them, but how the soul acts them; not which is in the soul first, but which appears out of the soul first: neither is it any new thing in philosophy to say those causes which produce an effect, though they be in time together, yet are mutually before one another in order of nature, in diverse respects to their several causalities. Thus a man must have repentance before he have saving and justifying faith; and yet a man must have faith before the work of repentance be perfect in the soul. As we maintain repentance to be a precedent work, so we deny it not to be a subsequent effect: Sorrow is before the birth too, as the apostle intimates, 2 Cor. 7:10, ‘Godly sorrow works repentance,’ that is, sorrow prepares a man for repentance, it goes afore it and prepares for it. And now it is that God’s spirit begins to renew his heart…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 29-30 of ‘The New Birth’ in Prima the First Things... (London, 1650)</span></figcaption>

<blockquote><p>…take notice of this distinction, as a foundation, viz. that there is in Scripture a twofold repentance or humiliation of the soul for sin: The one antecedent and going before pardon, and this the Scripture requires as a necessary condition, without which forgiveness of sin cannot be obtained: of this repentance the Scripture for the most part speaks, Eze. 18:18, 30; Mt. 3.2; Mk. 6.12; Lk. 13:3; Acts 3:19; and generally in most places of Scripture. In the second place there is an humiliation of heart and brokenness of soul for sin, arising from the apprehension of God’s love in pardoning, whereby we grieve that we should deal so unkindly with so good and gracious a God: this, though more rarely, yet is sometimes spoken of in Scripture, as first in this woman, who out of the apprehension of God’s love in pardoning so much to her did pour out her soul in all ways of thankfulness. After this manner also was David’s repentance, Ps. 51; for he was thus deeply affected after Nathan had told him his sin was taken away; although it does appear by the psalm also that he had not as yet that sense of pardon which did quiet his conscience. This kind of affection was also in Paul, 1 Tim. 1:12–16; 1 Cor. 15:8–9, in which places the apostle, remembering his former sins, confesses them, and acknowledges thereby his unworthiness of all that grace and favour he had received; so that the apostle does not there humble himself that he may obtain mercy, but because he had obtained mercy. The most eminent instance of this kind of sorrow and shame is Eze. 16:62–63, where God promises to establish his covenant with them, and then mark the event of this: ‘That thou mayest remember and be confounded, and never open thy mouth more because of thy shame, when I am pacified toward thee.’ So then both these kinds of humiliations are to be owned and practiced; and therefore it is a false and dangerous error to acknowledge no other kind of repentance than the latter [former]. The Papists will not acknowledge this latter humiliation at all, because they deny all faith and assurance that a believer may have of his sins in particular. And others say that there is only this latter; and therefore the forementioned author, in his treatise of Gospel Repentance, makes this only gospel-repentance. But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it. Repentance therefore may be thought to go before a twofold act of faith: first, that whereby Christ is laid hold upon and made ours, and so the repentance that precedes this may be called legal and slavish. Or secondly, before a persuasion that my sins are pardoned; and before this act of faith repentance must necessarily go, because the covenant of grace dispenses pardon only to such.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…take notice of this distinction, as a foundation, viz. that there is in Scripture a twofold repentance or humiliation of the soul for sin: The one antecedent and going before pardon, and this the Scripture requires as a necessary condition, without which forgiveness of sin cannot be obtained: of this repentance the Scripture for the most part speaks, Eze. 18:18, 30; Mt. 3.2; Mk. 6.12; Lk. 13:3; Acts 3:19; and generally in most places of Scripture. In the second place there is an humiliation of heart and brokenness of soul for sin, arising from the apprehension of God’s love in pardoning, whereby we grieve that we should deal so unkindly with so good and gracious a God: this, though more rarely, yet is sometimes spoken of in Scripture, as first in this woman, who out of the apprehension of God’s love in pardoning so much to her did pour out her soul in all ways of thankfulness. After this manner also was David’s repentance, Ps. 51; for he was thus deeply affected after Nathan had told him his sin was taken away; although it does appear by the psalm also that he had not as yet that sense of pardon which did quiet his conscience. This kind of affection was also in Paul, 1 Tim. 1:12–16; 1 Cor. 15:8–9, in which places the apostle, remembering his former sins, confesses them, and acknowledges thereby his unworthiness of all that grace and favour he had received; so that the apostle does not there humble himself that he may obtain mercy, but because he had obtained mercy. The most eminent instance of this kind of sorrow and shame is Eze. 16:62–63, where God promises to establish his covenant with them, and then mark the event of this: ‘That thou mayest remember and be confounded, and never open thy mouth more because of thy shame, when I am pacified toward thee.’ So then both these kinds of humiliations are to be owned and practiced; and therefore it is a false and dangerous error to acknowledge no other kind of repentance than the latter [former]. The Papists will not acknowledge this latter humiliation at all, because they deny all faith and assurance that a believer may have of his sins in particular. And others say that there is only this latter; and therefore the forementioned author, in his treatise of Gospel Repentance, makes this only gospel-repentance. But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it. Repentance therefore may be thought to go before a twofold act of faith: first, that whereby Christ is laid hold upon and made ours, and so the repentance that precedes this may be called legal and slavish. Or secondly, before a persuasion that my sins are pardoned; and before this act of faith repentance must necessarily go, because the covenant of grace dispenses pardon only to such.”

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures, (London: Miller, 1651), Lecture 30, on Lk. 7:47, pp. 267-68">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6take+notice+of+this+distinction%2C+as+a+foundation%2C+viz.+that+there+is+in+Scripture+a+twofold+repentance+or+humiliation+of+the+soul+for+sin%3A+The+one+antecedent+and+going+before+pardon%2C+and+this+the+Scripture+requires+as+a+necessary+condition%2C+without+which+forgiveness+of+sin+cannot+be+obtained%3A+of+this+repentance+the+Scripture+for+the+most+part+speaks%2C+Eze.+18%3A18%2C+30%3B+Mt.+3.2%3B+Mk.+6.12%3B+Lk.+13%3A3%3B+Acts+3%3A19%3B+and+generally+in+most+places+of+Scripture.+In+the+second+place+there+is+an+humiliation+of+heart+and+brokenness+of+soul+for+sin%2C+arising+from+the+apprehension+of+God%E2%80%99s+love+in+pardoning%2C+whereby+we+grieve+that+we+should+deal+so+unkindly+with+so+good+and+gracious+a+God%3A+this%2C+though+more+rarely%2C+yet+is+sometimes+spoken+of+in+Scripture%2C+as+first+in+this+woman%2C+who+out+of+the+apprehension+of+God%E2%80%99s+love+in+pardoning+so+much+to+her+did+pour+out+her+soul+in+all+ways+of+thankfulness.+After+this+manner+also+was+David%E2%80%99s+repentance%2C+Ps.+51%3B+for+he+was+thus+deeply+affected+after+Nathan+had+told+him+his+sin+was+taken+away%3B+although+it+does+appear+by+the+psalm+also+that+he+had+not+as+yet+that+sense+of+pardon+which+did+quiet+his+conscience.+This+kind+of+affection+was+also+in+Paul%2C+1+Tim.+1%3A12%E2%80%9316%3B+1+Cor.+15%3A8%E2%80%939%2C+in+which+places+the+apostle%2C+remembering+his+former+sins%2C+confesses+them%2C+and+acknowledges+thereby+his+unworthiness+of+all+that+grace+and+favour+he+had+received%3B+so+that+the+apostle+does+not+there+humble+himself+that+he+may+obtain+mercy%2C+but+because+he+had+obtained+mercy.+The+most+eminent+instance+of+this+kind+of+sorrow+and+shame+is+Eze.+16%3A62%E2%80%9363%2C+where+God+promises+to+establish+his+covenant+with+them%2C+and+then+mark+the+event+of+this%3A+%E2%80%98That+thou+mayest+remember+and+be+confounded%2C+and+never+open+thy+mouth+more+because+of+thy+shame%2C+when+I+am+pacified+toward+thee.%E2%80%99+So+then+both+these+kinds+of+humiliations+are+to+be+owned+and+practiced%3B+and+therefore+it+is+a+false+and+dangerous+error+to+acknowledge+no+other+kind+of+repentance+than+the+latter+%5Bformer%5D.+The+Papists+will+not+acknowledge+this+latter+humiliation+at+all%2C+because+they+deny+all+faith+and+assurance+that+a+believer+may+have+of+his+sins+in+particular.+And+others+say+that+there+is+only+this+latter%3B+and+therefore+the+forementioned+author%2C+in+his+treatise+of+Gospel+Repentance%2C+makes+this+only+gospel-repentance.+But+as+gospel-faith+is+not+that+reflex+act+of+the+soul+in+a+man+whereby+it+is+persuaded+that+Christ+is+his%2C+but+a+direct+act+of+taking+and+receiving+Christ+to+be+ours%2C+so+a+gospel-repentance+is+not+that+mainly+whereby+we+are+humbled+because+we+receive+God%E2%80%99s+love+to+us+in+pardoning%2C+but+principally+in+that+loathing+of+ourselves+to+obtain+pardon.+It+is+therefore+great+ignorance+in+that+author%2C+in+his+treatise+of+Gospel+Repentance%2C+when+p.+58%2C+he+calls+repentance+that+goes+before+this+faith%2C+viz.+that+my+sins+are+pardoned%2C+a+dead+work%3B+as+if+the+faith+that+justifies%2C+and+without+which+it+is+impossible+to+please+God%2C+were+the+believing+that+my+sins+are+pardoned%3B+whereas+the+Scripture+makes+it+to+be+the+receiving+of+Christ+and+laying+hold+on+Him.+And+seeing+that+the+object+must+in+order+of+nature+be+before+the+act+that+is+employed+about+it%2C+it+follows+infallibly+that+I+must+have+justification+before+I+can+believe+I+have+it.+Repentance+therefore+may+be+thought+to+go+before+a+twofold+act+of+faith%3A+first%2C+that+whereby+Christ+is+laid+hold+upon+and+made+ours%2C+and+so+the+repentance+that+precedes+this+may+be+called+legal+and+slavish.+Or+secondly%2C+before+a+persuasion+that+my+sins+are+pardoned%3B+and+before+this+act+of+faith+repentance+must+necessarily+go%2C+because+the+covenant+of+grace+dispenses+pardon+only+to+such.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures%2C+%28London%3A+Miller%2C+1651%29%2C+Lecture+30%2C+on+Lk.+7%3A47%2C+pp.+267-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72e0afa985.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72e0afa985.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=take%20notice%20of%20this%20distinction%2C%20as,grace%20dispenses%20pardon%20only%20to%20such&amp;text=take%20notice%20of%20this%20distinction%2C%20as%20a%20foundation&amp;text=covenant%20of%20grace%20dispenses%20pardon%20only%20to%20such" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

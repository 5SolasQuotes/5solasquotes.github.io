<blockquote><p>Let us, however, bear in mind, that in this matter the error is merely in so far as decorum is violated, and the distinction of rank which God has established, is broken in upon. For we must not be so scrupulous as to look upon it as a criminal thing for a teacher to have a cap on his head, when addressing the people from the pulpit. Paul means nothing more than this — that it should appear that the man has authority, and that the woman is under subjection, and this is secured when the man uncovers his head in the view of the Church, though he should afterwards put on his cap again from fear of catching cold. In fine, the one rule to be observed here is το πρέπον — decorum If that is secured, Paul requires nothing farther.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Cor. 11, | v. 4</cite></span></figcaption>

<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgess [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the [Scottish] bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgess himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more than non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached. But others (I hear) object that if a man should uncover his head at the sight of a graven image, we would account this to be an adoring of the image; and why then shall not we call our uncovering at the sacrament adoration also? Answer: Though veneration and adoration be distinguished in holy things, to show that adoration given to them is idolatry, but veneration given to them is not idolatry, yet in profane things, such as images are, veneration given to them is idolatry as well as adoration: and we are idolaters for doing so much as to respect and reverence them, as things sacred or holy. For as I touched [upon] before, and as Zanchi evidences by sundry instances (bk. 1, de Viti. ext. cult. oppos., cols. 504-5), idolatry is committed when more estimation is had of anything, more dignity and excellency placed in it, and more regard had to it, than God allows, or than can stand with God’s revealed will. For a thing thus regarded, though it be not exalted, ut Deus simpliciter [as God simply], yet it is set up, tanquam Deus ex parte [like as unto God in some degree].</p></blockquote>

<blockquote><p>2nd Point. …whereby we have good light for the expounding of a place in Paul, 1 Cor. 11:10, saying, that the woman ought to have power over her head, that is, be covered, because of the angels. Whereby ‘angels’ may well be understood the preachers and ministers of the Gospel. And the reason of that precept may be this: Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection. And therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, according to the custom of their country in other assemblies, to signify their submission and reverence unto the ministry of the Gospel.</p></blockquote>

</figure><figure class="quote" id="q-27d84b2ac8" data-kw="">
<blockquote><p>This article analyses the recodification of the covering of women from the Reformation to the Enlightenment, discussing and juxtaposing rich visual material, normative regulations and court cases… Early modern costume books demonstrate the potential of the veil to map locally specific cultural differences manifested in dress. Veiled women could stand for propriety, yet veils might also be read as a sign of lust, disorder and seduction. Case studies of Reformation Basel and Zürich develop these broader findings in detail. They show not only that the veil provided a screen onto which could be projected strangeness and danger, but also how in practice it marked women as respectable or dishonourable, rich or poor, married or unwed. Furthermore, it was read as an index of morality and gained much attention in a fashion policy critical of luxury. The veil was thus central to an identity politics preoccupied with social ordering, moral standards, and also fashion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/susanna-burghartz.html">Susanna Burghartz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Covered Women? Veiling in Early Modern Europe’ Pre Abstract in History Workshop Journal, no. 80 (Autumn, 2015), pp. 1-32 with numerous pictures</cite></span></figcaption>

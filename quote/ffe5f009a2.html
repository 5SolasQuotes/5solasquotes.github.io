<main class="wrap"><figure class="quote" id="q-ffe5f009a2" data-kw="">
<blockquote><p>An Instruction in, and consent unto the Doctrine of Self-denial and bearing of the Cross, in a particular manner: For this is made indispensably necessary by our Saviour himself, unto all that will be his Disciples. And it hath been a great disadvantage unto the Glory of Christian Religion, that Men have not been more and better instructed therein.

It is commonly thought, that who ever will, may be a Christian at an easy rate, it will cost him nothing. But the Gospel gives us another account of these things. For it not only warns us, that Reproaches, Hatred, Sufferings of all sorts, oft-times to Death it self, are the common lot of all its Professors, who will live Godly in Christ Jesus; but also requires, that at our initiation into the Profession of it, we consider aright the dread of them all, and engage cheerfully to undergo them.

Hence, in the Primitive Times, whilst all sorts of miseries were continually presented unto them who Embraced the Christian Religion, their willing engagement to undergo them, who were Converted, was a firm Evidence of the sincerity of their Faith, as it ought to be unto us also in times of Difficulty and Persecution. Some may suppose that the Faith and Confession of this Doctrine of Self-denial and readiness for the Cross, is of use only in time of Persecution, and so doth not belong unto them who have continually the countenance and favour of public Authority.

I say, it is, at least as they judge, well for them; with others it is not so, whose outward state makes the public avowing of this Duty indispensably necessary unto them: And I may add it as my own thoughts, (though they are not my own alone) That notwithstanding all the Countenance that is given unto any Church by the public Magistracy, yet whilst we are in this World, those who will faithfully discharge their Duty, as Ministers of the Gospel especially, shall have need to be prepared for sufferings. To escape sufferings, and enjoy worldly advantages by sinful compliances, or bearing with Men in their Sins, is no Gospel Direction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true nature of a gospel church and its government</cite>, (London: William Marshall, 1689), pp 7-8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-65efbc49b5" data-kw="">
<blockquote><p>As for the veils wherewith the apostle would have women covered whileas they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1) they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign, for that comely and orderly distinction of men and women which civil decency required in all their meetings: wherefore, that distinction of habits [garments], which they used for decency and comliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness still to retain in their holy assemblies. And further the apostle shows, that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman vv. 3. 8-9 (For covering was then a sign of subjection) and by the long hair which nature gives to a woman v. 15. Where he would have the artificial covering, to be fashioned in imitation of the natural. What need we anymore? Let us see nature’s institution, or the apostles’ recommendation for the controverted ceremonies (as we have seen them for women’s veils) and we yield the argument. Last of all, the sign of imposition of hands, helps not the cause of our Opposites, because it the example of Christ, and the apostles, and their disciples, which our ceremonies have not: yet we think not imposition of hands to be any sacred or mystical sign, but only a moral, for designation of a person: let them who think more highly or honorably of it, look to their warrants.</p></blockquote>

<blockquote><p>80. But since, as Augustine says, it is the same to say for God is my witness and I swear by God, the Apostle seems to be acting against the Lord’s command: I say to you, do not swear at all (Matt 5:34); above all, my brethren, do not swear (Jas 5:12).

However, as Augustine also says, the meaning of Sacred Scripture is gathered from the actions of the saints. For it is the same Spirit who inspired the Sacred Scriptures: men moved by the Holy Spirit spoke from God (2 Pet 1:21) and who moves holy men to act: all who are led by the Spirit are sons of God (Rom 8:14).

Consequently, if Paul is found to swear, it shows that the Lord’s word and that of the apostle James are not to be understood as indicating that an oath is absolutely unlawful, but that men should strive as far as possible not to use oaths as though they were something good and desirable of their very nature. And this on account of the danger involved in frequent swearing, namely, the possibility of perjury due to a slip of the tongue. …</p></blockquote>

<blockquote><p>Worship is an homage performed to God immediately, in consideration of his excellency. This is Aquinas’s, and other of the schoolmens’ notion about worship, and it is a very good one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Intercourses of Divine Love betwixt Christ &amp; his Church</cite>, (London, 1683), Sermon 39, pp. 564-65</span></figcaption>

<main class="wrap"><figure class="quote" id="q-68759469ef" data-kw="">
<blockquote><p>For he that is nether hot nor cold, but indifferent to use the college of God’s Word and Christ’s Church, with the word and gloss of man that teaches the use of images in the church, before he can prove by authority of God’s Word that they may be suffered in the church does not well, they have been the occasion of great hurt and idololatry the church of the Old Testament nor the New never taught the people with images. Therefore it shall be the office of every man that loves God and his Word to follow the Scripture only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Declaration of Christ &amp; of his Office Compiled… (Zurich: Augustyne Fries, [1547]), ch. 4, no page number Hooper (c. 1495–1555) was an English bishop and reformer.</cite></span></figcaption>

</figure><figure class="quote" id="q-da2a25cf96" data-kw="">
<blockquote><p>We should, in our own churches, keep to apostolic precedent, and follow the rule of Christ in all things. No venerable name is sufficient authority for going aside from Holy Scripture. &quot;To the law and to the testimony;&quot; if a doctrine or a ceremony is not there, it is nowhere for you and for me. Our sole authority is the Word of the Lord.</p></blockquote>

</figure><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 3 (p. 415)</span></figcaption>

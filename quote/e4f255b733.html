<main class="wrap"><figure class="quote" id="q-e4f255b733" data-kw="">
<blockquote><p>Corollary 1. We reject the Pelagian error of those who establish that only the sensuality or lower part, not indeed the higher, is corrupted by sin and consequently must be regenerated. See to the contrary Rom. 1:7 [1:21], 21; and 8:7; and 12:2; Gen. 6:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Corollary 1. We reject the Pelagian error of those who establish that only the sensuality or lower part, not indeed the higher, is corrupted by sin and consequently must be regenerated. See to the contrary Rom. 1:7 [1:21], 21; and 8:7; and 12:2; Gen. 6:5.”

— Gisbertus Voetius, Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCorollary+1.+We+reject+the+Pelagian+error+of+those+who+establish+that+only+the+sensuality+or+lower+part%2C+not+indeed+the+higher%2C+is+corrupted+by+sin+and+consequently+must+be+regenerated.+See+to+the+contrary+Rom.+1%3A7+%5B1%3A21%5D%2C+21%3B+and+8%3A7%3B+and+12%3A2%3B+Gen.+6%3A5.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+29%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+1+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+p.+432+ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe4f255b733.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e4f255b733.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/#:~:text=Corollary%201.%20We%20reject%20the%20Pelagian,and%208%3A7%3B%20and%2012%3A2%3B%20Gen.%206%3A5&amp;text=Corollary%201.%20We%20reject%20the%20Pelagian%20error%20of&amp;text=1%3A21%5D%2C%2021%3B%20and%208%3A7%3B%20and%2012%3A2%3B%20Gen.%206%3A5" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1670871fbd" data-kw="">
<blockquote><p>Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Jonathan Edwards &amp; the Absence of Free Choice</cite>, 2010, at Trinity Evangelical Divinity School, being the Inaugural Lecture for the Jonathan Edwards Center. This lecture is in article form above.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Jonathan Edwards is often regarded as an epitome of Calvinism for his teaching on the freedom of will, though he was, in his own time and for a century after his death, a much-debated thinker whose views polarized Reformed circles. This lecture will concentrate on Edwards’s reception in Britain, which has received little attention despite its significance in the Reformed tradition. Concentrating on two historical contexts, Dr. Muller will consider the mixed reception of Edwards’ thought, note differences between Edwards and the older Reformed orthodoxy, and point to a parting of the ways in the Reformed tradition that took place largely in the eighteenth century.”

— Richard Muller, “Jonathan Edwards &amp; the Absence of Free Choice: A Parting of Ways in the Reformed Tradition” 71 min., Sept. 29th, 2010, at Trinity Evangelical Divinity School, being the Inaugural Lecture for the Jonathan Edwards Center. This lecture is in article form above.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJonathan+Edwards+is+often+regarded+as+an+epitome+of+Calvinism+for+his+teaching+on+the+freedom+of+will%2C+though+he+was%2C+in+his+own+time+and+for+a+century+after+his+death%2C+a+much-debated+thinker+whose+views+polarized+Reformed+circles.+This+lecture+will+concentrate+on+Edwards%E2%80%99s+reception+in+Britain%2C+which+has+received+little+attention+despite+its+significance+in+the+Reformed+tradition.+Concentrating+on+two+historical+contexts%2C+Dr.+Muller+will+consider+the+mixed+reception+of+Edwards%E2%80%99+thought%2C+note+differences+between+Edwards+and+the+older+Reformed+orthodoxy%2C+and+point+to+a+parting+of+the+ways+in+the+Reformed+tradition+that+took+place+largely+in+the+eighteenth+century.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+%E2%80%9CJonathan+Edwards+%26+the+Absence+of+Free+Choice%3A+A+Parting+of+Ways+in+the+Reformed+Tradition%E2%80%9D+71+min.%2C+Sept.+29th%2C+2010%2C+at+Trinity+Evangelical+Divinity+School%2C+being+the+Inaugural+Lecture+for+the+Jonathan+Edwards+Center.+This+lecture+is+in+article+form+above.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1670871fbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1670871fbd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=Jonathan%20Edwards%20is%20often%20regarded%20as,place%20largely%20in%20the%20eighteenth%20century&amp;text=Jonathan%20Edwards%20is%20often%20regarded%20as%20an%20epitome&amp;text=that%20took%20place%20largely%20in%20the%20eighteenth%20century" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-720043aa18" data-kw="">
<blockquote><p>V. There are two principal characteristics of free will in which its formal nature consists: (1) the choice, so that what is done is done by a previous judgment of reason; (2) the willingness, so that what is done is done voluntarily and without compulsion. The former belongs to the intellect; the latter belongs to the will. Two species of necessity also contend [are in opposition] with it. The first is physical and brute necessity; the other the necessity of coaction. The former takes away the choice; the latter, however, the willingness. For the things done from a physical necessity by natural agents determined to one thing by nature and without reason, cannot be done freely, i.e. with the previous light of reason. And the things done by force and compulsion cannot be done voluntarily. There is no controversy about these between us and our opponents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes, Tenth Topic, ‘The Free Will of Man in a State of Sin’, Question 2. The reader is encouraged to see Turretin’s numerous discussions relating to the related issues throughout his Institutes, as he has a lot more to say., p. 662</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-d3fe61928f" data-kw="">
<blockquote><p>He [Jesus] plainly states that mankind, unchanged by divine influence, labor under such an indisposition to embrace his Gospel, and the blessings which it at once reveals and conveys, as amounts to a moral incapacity,—an indisposition which nothing short of divine influence can remove: ‘No man can come to Me, except the Father, which has sent Me, draw him;’ and with equal plainness He states that this influence, while absolutely necessary, is also fully competent to produce the desired effect,—‘All that the Father has given Me shall come to Me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-edinburgh.html">John Brown of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses &amp; Sayings of our Lord</cite>, (1852; Banner of Truth, 1990), vol. 1, p. 462</span></figcaption>

</figure><figure class="quote" id="q-8f393fe631" data-kw="">
<blockquote><p>4. Another expression of this arrogant ignorance is, when men will not believe the several truths of God, because they are not able to reconcile them, and place each one in its own order, and see the method and body of truth in its true locations and proportion: Nay, perhaps they will believe none, because they cannot discern the harmony. …These self-conceited ignorant souls, do imagine all to be impossible which exceeds their knowledge; and because they cannot see[?] the sweet consent of Scripture, and how those places do suit, and fortify each other, which to them seemed to contradict each other, therefore they think that no one else can see it; no not God Himself… And upon this account many cast away particular truths, though they will not cast away all. Some cannot reconcile the efficiency of the Spirit, with that of the Word, in the Conversion and Confirmation of sinners; and therefore some exclude one, and some the other, or own by the empty names; some cannot reconcile the Law, and the Gospel: And too great a part of the teachers, in the Christian world, have been so troubled to reconcile God’s grace, with man’s free-will, that of old, many did too much exclude the natural liberty of the will, upon a supposition of the inconsistency; only the names of both were still owned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arrogancy of Reason Against Divine Revelations</cite>, Repressed. Or, Proud Ignorance the Cause of Infidelity, and of Men’s Quarrelling with the Word of God (1655; London), pp. 21-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<main class="wrap"><figure class="quote" id="q-af723c8aa3" data-kw="">
<blockquote><p>10. On the 6th Article of the 11th Chapter [of The Discipline of the Reformed Chuches of France, 1559], a question was propounded by the Province of Higher Languedoc, Whether in case of grievous sickness, and the child being in apparent danger of death, he might be baptized on lecture-days, before sermon began, and whether baptism might be administred at such times when as there is no sermon preached, but only public common-prayers? It was answered that if the consistory, or any of the elders did attest the malady of the infant, the pastor might do it [the baptism]. And if the observation of this article should beget new difficulties, the provinces were intreated to come prepared unto the next national synod, for their assoiling of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/qualifications.html">Qualifications</a></span><span class="wk"><span class="lbl">Work:</span> <cite>French Reformed Churches</cite>, John Quick, Synodicon (London, 1692) | Synod of St. Maixant (1609), ch. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-128651e0cf" data-kw="">
<blockquote><p>For St. Paul’s baptizing in the house of the jailor had been more fit for him [John Whitgift], for unto his place it may be easily answered that Cornelius, having so great a family, as it is like he had, and besides that diverse soldiors underneath him, and further his friends and his acquaintance which he had called, had a competent number, and as many as would make a congregation, and as could commodiously be preached unto in one place. But the answer to both these examples, and other such like, as that St. Paul baptized in the house of Ananias [Acts 9] is easy. For there being persecutions at that time, so that it was not safe, neither for the minister nor for the people, to be seen, it was meet that they should do it in houses, which otherwise they would have done in open places: and then those houses which receive the congregation are not, as I have showed, for the time to be counted private houses: and further in places where the gospel has not been received, nor no church gathered, but one only household embracing the Gospel, I say in such a case, and especially in the time of persecution, where should the ministers preach, or minister the sacraments more conveniently than in that house where those professors of the gospel be? Now to draw this into our churches, which may safely come into open places, and where the church and congregation stands of diverse households, is a token of greate want of judgment, in shuffling those things together which, for the great diversity of their natures, will not be mingled.</p></blockquote>

</figure><figure class="quote" id="q-48dc2b88ba" data-kw="">
<blockquote><p>This Covenant was first published and made known by lively voice: afterwards it was committed to writing, the tables thereof being the holy Scripture. It was made both by word and oath (Ps. 85:4, 35; Dt. 29:12, 14; Isa. 54:9; Heb. 6:17-18; Gen. 22:16; Lk. 1:72), to demonstrate the certainty and constancy thereof: and sealed by the sacraments, which on God’s part do confirm the promise made by Him: and on man’s part are bills obligatory or hand-writings, whereby they testify and bind themselves to the performance of their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, p. 23</span></figcaption>

</figure><figure class="quote" id="q-8424af3a24" data-kw="">
<blockquote><p>Do you think that the Supper of the Lord ought to be celebrated in any other place than in the common and public congregation? Answer: This was a custom in the beginning of the old Church, that the sacrament should be sent by deacons to the sick that were absent from the public meeting, that is to say, at that time that the mysteries were celebrated of the rest in that meeting, because it was meet that those whom one disease did let [prevent] to be present in body, should be accompted as if they were present: neither do I doubt but that that thing brought great comfort to those that were sick, the which custom I would very gladly [wish it] were restored. But whether it be meet to be celebrated to the sick at that time when the Supper of the Lord is not ministred in the Church, of this I greatly doubt. … Notwithstanding I do acknowledge that in this case it is somewhat diverse. For although it were very meet that these mysteries throughout [the] whole [of] Christendom, albeit in diverse places, yet notwithstanding daily also if it were possible, or at least upon appointed and set days were celebrated, which should profit very much to the witnessing of that same mutual fellowship and consolation in Christ: notwithstanding forasmuch as neither of both can be obtained for many just and necessary causes it seems, I know not in what sort to be contrary to the institution of the Supper of the Lord, that all the rest of the Church omitting it, some one house extraordinarily should celebrate those mysteries. Moreover, unless that were done amongst all those that were sick, how shall the suspicion of partiality in respecting of persons be shunned? Now if the Supper of the Lord be to be ministered amongst all that are sick, let pastors see by what means the profanation thereof may be avoided and how they may satisfy and undergo so great labors. The custom therefore of certain [persons] do nothing at all [to] move me, although that it be very ancient, because the matter is to be judged not by examples, but by reasons… But if a man think that he can shun all these inconveniences, and think that those mysteries may be ministred to a sick man in the congregration, he requiring it, upon these conditions I would not be against this custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Other Part of Christian Questions &amp; Answers, which is concerning the Sacraments</cite>, Question 242, ‘Of the Celebration of the Supper of the Lord in Private Houses besides the Time of the Ecclesiastical Meeting’ in The Other Part of Christian Questions &amp; Answers, which is Concerning the Sacraments (London, 1580), no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“Do you think that the Supper of the Lord ought to be celebrated in any other place than in the common and public congregation? Answer: This was a custom in the beginning of the old Church, that the sacrament should be sent by deacons to the sick that were absent from the public meeting, that is to say, at that time that the mysteries were celebrated of the rest in that meeting, because it was meet that those whom one disease did let [prevent] to be present in body, should be accompted as if they were present: neither do I doubt but that that thing brought great comfort to those that were sick, the which custom I would very gladly [wish it] were restored. But whether it be meet to be celebrated to the sick at that time when the Supper of the Lord is not ministred in the Church, of this I greatly doubt. … Notwithstanding I do acknowledge that in this case it is somewhat diverse. For although it were very meet that these mysteries throughout [the] whole [of] Christendom, albeit in diverse places, yet notwithstanding daily also if it were possible, or at least upon appointed and set days were celebrated, which should profit very much to the witnessing of that same mutual fellowship and consolation in Christ: notwithstanding forasmuch as neither of both can be obtained for many just and necessary causes it seems, I know not in what sort to be contrary to the institution of the Supper of the Lord, that all the rest of the Church omitting it, some one house extraordinarily should celebrate those mysteries. Moreover, unless that were done amongst all those that were sick, how shall the suspicion of partiality in respecting of persons be shunned? Now if the Supper of the Lord be to be ministered amongst all that are sick, let pastors see by what means the profanation thereof may be avoided and how they may satisfy and undergo so great labors. The custom therefore of certain [persons] do nothing at all [to] move me, although that it be very ancient, because the matter is to be judged not by examples, but by reasons… But if a man think that he can shun all these inconveniences, and think that those mysteries may be ministred to a sick man in the congregration, he requiring it, upon these conditions I would not be against this custom.”

— Theodore Beza, Question 242, ‘Of the Celebration of the Supper of the Lord in Private Houses besides the Time of the Ecclesiastical Meeting’ in The Other Part of Christian Questions &amp; Answers, which is Concerning the Sacraments (London, 1580), no page numbers">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDo+you+think+that+the+Supper+of+the+Lord+ought+to+be+celebrated+in+any+other+place+than+in+the+common+and+public+congregation%3F+Answer%3A+This+was+a+custom+in+the+beginning+of+the+old+Church%2C+that+the+sacrament+should+be+sent+by+deacons+to+the+sick+that+were+absent+from+the+public+meeting%2C+that+is+to+say%2C+at+that+time+that+the+mysteries+were+celebrated+of+the+rest+in+that+meeting%2C+because+it+was+meet+that+those+whom+one+disease+did+let+%5Bprevent%5D+to+be+present+in+body%2C+should+be+accompted+as+if+they+were+present%3A+neither+do+I+doubt+but+that+that+thing+brought+great+comfort+to+those+that+were+sick%2C+the+which+custom+I+would+very+gladly+%5Bwish+it%5D+were+restored.+But+whether+it+be+meet+to+be+celebrated+to+the+sick+at+that+time+when+the+Supper+of+the+Lord+is+not+ministred+in+the+Church%2C+of+this+I+greatly+doubt.+%E2%80%A6+Notwithstanding+I+do+acknowledge+that+in+this+case+it+is+somewhat+diverse.+For+although+it+were+very+meet+that+these+mysteries+throughout+%5Bthe%5D+whole+%5Bof%5D+Christendom%2C+albeit+in+diverse+places%2C+yet+notwithstanding+daily+also+if+it+were+possible%2C+or+at+least+upon+appointed+and+set+days+were+celebrated%2C+which+should+profit+very+much+to+the+witnessing+of+that+same+mutual+fellowship+and+consolation+in+Christ%3A+notwithstanding+forasmuch+as+neither+of+both+can+be+obtained+for+many+just+and+necessary+causes+it+seems%2C+I+know+not+in+what+sort+to+be+contrary+to+the+institution+of+the+Supper+of+the+Lord%2C+that+all+the+rest+of+the+Church+omitting+it%2C+some+one+house+extraordinarily+should+celebrate+those+mysteries.+Moreover%2C+unless+that+were+done+amongst+all+those+that+were+sick%2C+how+shall+the+suspicion+of+partiality+in+respecting+of+persons+be+shunned%3F+Now+if+the+Supper+of+the+Lord+be+to+be+ministered+amongst+all+that+are+sick%2C+let+pastors+see+by+what+means+the+profanation+thereof+may+be+avoided+and+how+they+may+satisfy+and+undergo+so+great+labors.+The+custom+therefore+of+certain+%5Bpersons%5D+do+nothing+at+all+%5Bto%5D+move+me%2C+although+that+it+be+very+ancient%2C+because+the+matter+is+to+be+judged+not+by+examples%2C+but+by+reasons%E2%80%A6+But+if+a+man+think+that+he+can+shun+all+these+inconveniences%2C+and+think+that+those+mysteries+may+be+ministred+to+a+sick+man+in+the+congregration%2C+he+requiring+it%2C+upon+these+conditions+I+would+not+be+against+this+custom.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Question+242%2C+%E2%80%98Of+the+Celebration+of+the+Supper+of+the+Lord+in+Private+Houses+besides+the+Time+of+the+Ecclesiastical+Meeting%E2%80%99+in+The+Other+Part+of+Christian+Questions+%26+Answers%2C+which+is+Concerning+the+Sacraments+%28London%2C+1580%29%2C+no+page+numbers&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8424af3a24.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8424af3a24.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=Do%20you%20think%20that%20the%20Supper,would%20not%20be%20against%20this%20custom&amp;text=Do%20you%20think%20that%20the%20Supper%20of%20the&amp;text=conditions%20I%20would%20not%20be%20against%20this%20custom" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2fb22158c4" data-kw="">
<blockquote><p>For petra (rock) is not derived from Peter, but Peter from petra; just as Christ is not called so from the Christian, but the Christian from Christ. For on this very account the Lord said, On this rock will I build my Church, because Peter had said, You are the Christ, the Son of the living God. On this rock, therefore, He said, which you have confessed, I will build my Church. For the Rock (Petra) was Christ; and on this foundation was Peter himself also built. For other foundation can no man lay than that is laid, which is Christ Jesus. The Church, therefore, which is founded in Christ received from Him the keys of the kingdom of heaven in the person of Peter, that is to say, the power of binding and loosing sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tractates on the Gospel of John</cite>, tract. 124, §5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/primacy-of-peter.html">Primacy of Peter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/peters-primacy.html">Peter&#x27;s primacy</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/keys-of-the-kingdom.html">Keys of the Kingdom</a> › <a href="../topics/church-government-and-the-ministry/keys-of-the-kingdom/power-of-the-keys.html">Power of the keys</a></span></div>

</figure><figure class="quote" id="q-788f2fe55a" data-kw="Papal infallibility">
<blockquote><p>Thirdly, if Christ asked this for all the Roman pontiffs, that they should be exempt from error, then he did not obtain what he asked. For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies; as Alphonsus asserts, Contra Hæres. Lib. I. c. 4, where he affirms that the pope not only may err, but even be a heretic. The same is written and held by other papists also. Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-75fb9ddff4" data-kw="">
<blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 214</span></figcaption>

</figure><figure class="quote" id="q-6a9610e713" data-kw="">
<blockquote><p>But that they who are at Rome do not observe those things in all cases which are handed down from the beginning, and vainly pretend the authority of the apostles; any one may know also from the fact, that concerning the celebration of Easter, and concerning many other sacraments of divine matters, he may see that there are some diversities among them, and that all things are not observed among them alike, which are observed at Jerusalem</p></blockquote>

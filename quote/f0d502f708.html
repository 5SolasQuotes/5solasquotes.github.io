<main class="wrap"><figure class="quote" id="q-f0d502f708" data-kw="">
<blockquote><p>Is it of no importance whether the Son of God actually came in the flesh? Is it of no importance whether he actually died on the tree for our sins? Whether he actually rose again for our justification? Whether he actually ascended to heaven and sits there on his throne, the Lord of the world? Beautiful dreams these! But if only beautiful dreams! How dreadful to have only an imaginary Saviour and an imaginary salvation. But this is precisely what we must come to on the principle that it is the ideal, not the real that counts in the religious life.

It makes no difference what actually happened so only prophets and sages and apostles have risen to these great conceptions – if the independence of the ideal on the real is the most important lesson of religious thinking – why, then, we must be prepared to satisfy ourselves with a Christianity innocent of a real Redeemer and a real Redemption. Are we content to be saved from sin only an idea – to “go to heaven” only in imagination?

And this leads us to a right estimate of the assertion that is now so constantly made all about us, that Christianity has nothing to fear from the criticism which is evaporating (to its own satisfaction) the historicity of the Bible narratives. That depends on what Christianity is. If it is a religion that is founded on the actual – if it is a religion of fact – if it has any historical content – it is evaporated with its history. If it is a religion of “ideas,” it is of course unaffected by the destruction of any history that may have become accidentally associated with it.

But in that case, it is not Christianity in any intelligible sense; it is nothing but a natural religion – a religion of “eternal verities” – as inoperative as all the rest of its fellows actually to save, though it may be infinitely superior to its fellows in the loftiness of its conceptions. A God who is only an idea, and who never intervenes in the world of fact, can never actually save a soul that is read from sin that is real.

For the actual salvation of an actual sin-stricken soul we require an actual Redeemer who has actually intervened in the actual course of history. … Christianity is a historical religion, all of whose doctrines are facts. He who assaults the trustworthiness of the record of the intervention of God for the redemption of the world, is simply assaulting the heart of Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>How to get rid of Christianity (1900) in Selected Shorter Writings of Benjamin B. Warfield</cite></span></figcaption>

<blockquote><p>Nobody should trust in his zeal for religious matters to the extent of believing that good intentions will automatically lead to right actions. Unless our zeal is controlled by the Word of God it will do more harm than good. The person who is addicted to superstitions and false doctrine will be a determined enemy of the truth and will probably turn out to be a fierce persecutor of those who worship it. That kind of zeal derives from an excessive devotion to ancestral traditions.

It is characteristic of such traditions of people that they invent a different God from the one who really exists but who appears to be close enough to ours that he takes pleasure in the things that we glorify. Before long, mixed forms of worship appear that are defended on the ground of their antiquity, the example of the masses and above all on the authority of their ancestors, which is sacrosanct for many and from which it would be wrong to depart. If they see other people who think and believe differently, they start to hate them and think that they should not be allowed to do anything, because they are considered to be enemies of religion and very dangerous people.

Furthermore, as Christ predicted, they think that they are better worshipers of God if they persecute such people and torture them with all kinds of torments. Paul provides us with an example of this because his zeal drove him to persecute the church. He took godly worshipers of both sexes to prison and forced them to deny their faith.</p></blockquote>

<blockquote><p>We should not imagine, that all that which is called Zeal for Religion, and a design to convert Heretics, should necessarily flow from a good Principle. On the contrary, God, for the Trial of the Faith of his Elect, hath almost always permitted, that false Religions have had more Zeal for the destruction of the True, than the True Religion for the ruin of the Falser. When Christian Religion became predominant, She did not do that for the ruin of Paganism, which had been done against her during the Reign of Pagan Emperors.

It’s true, that true Zeal is always accompanied with Moderation, and false Zeal with Violence. So that in the Eyes of Flesh, the true faithful Ones do appear Luke-warm; and the Enemies of Truth do pass for true Zealots. When Human Passions do mingle themselves in those Sentiments of Hearts called Religion, there is no Excess that they are not capable of. In respect of other Objects, in the midst of their greatest Transports they do reproach themselves secretly, which stops their fury, and steal away some part of their Impetuousness; and chiefly when they are allayed, and consider in cold blood their Conduct past, they do often accuse their own selves. But contrarily here, Passions do solicit and animate themselves, they make Merit of their Violence, and believe that God and his Church are concerned in their Justification; because they imagine, that they have laboured for the Truth. This is one of the Reasons why often Men believe, that they see but little Zeal in the true Church, while there is so much Fire in the Conduct of Them, that endeavour her Ruin.

But we must needs grant, that there is something more. The Moderation of the Faithful doth not alway proceed from that Sweet Spirit, which is the very Genius of the Gospel: It comes often from the coldness of their Zeal; God permits it to oblige us to adore in Silence the Mysteries of his Conduct, and to confound at the same time the Pride of Man’s heart. We have much less Love for the Truth, than the World and the Devil have of Hatred against it. And whilst we act in the Establishment of Religion by a Principle, of Self-love, we have quite another kind of Ardour than when we have no other prospect than that of the Glory of God.

The Church doth easily relent; the fervour of the Zeal, which seeks the Conversion of Others, doth not last long. It is so hard a thing to seek for Salvation, that Men imagine they do enough to labour for their own, without charging themselves with the Care of Others. And we easily fall into those unhappy Thoughts, That God is good enough to do his own Business; that he will have a care of his own Interest, and that he will not want Means to Convert them whom he hath destined to eternal Salvation. Whereas false Zeal doth hold it self up, doth persevere, and finds it self often more capable to endure greater Labours, than the true Devotion.

It is a thing that confounds us: I grant it’s one of the great Temptations which good Souls are to overcome. But truly, it’s a Thing whereof it’s impossible to deny the Truth, if we have any thing of good Faith or Probity. Our Lord Jesus Christ himself doth teach us, that the Pharisees and the false Doctors of Judaism did compass Sea and Land to make a Proselyte; and all their labours did conclude to render Him a Son of Hell, likes themselves. All those things do make me conclude, That the Zeal to make Conversions, is not always a certain Sign that the Truth is in that Party.

It is a favourable Prejudice; but after all it’s but a Prejudice, and we should not suffer our selves to be conducted by those kinds of Lights, which are often deceitful. We must be permitted to examine, If the Zeal of Religion, which causes so many Emotions, be a Divine fire, or a Passion merely Human. Now we cannot better know the Nature of that Zeal which seeks for Conversions, than by the Means which it employs: for it’s an indubitable Principle, That true Piety never doth any ill, that good may come thereof. She seeks the Salvation of Men; but she seeks it by ways that are just, lawful, and rational.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We should not imagine, that all that which is called Zeal for Religion, and a design to convert Heretics, should necessarily flow from a good Principle. On the contrary, God, for the Trial of the Faith of his Elect, hath almost always permitted, that false Religions have had more Zeal for the destruction of the True, than the True Religion for the ruin of the Falser. When Christian Religion became predominant, She did not do that for the ruin of Paganism, which had been done against her during the Reign of Pagan Emperors.

It’s true, that true Zeal is always accompanied with Moderation, and false Zeal with Violence. So that in the Eyes of Flesh, the true faithful Ones do appear Luke-warm; and the Enemies of Truth do pass for true Zealots. When Human Passions do mingle themselves in those Sentiments of Hearts called Religion, there is no Excess that they are not capable of. In respect of other Objects, in the midst of their greatest Transports they do reproach themselves secretly, which stops their fury, and steal away some part of their Impetuousness; and chiefly when they are allayed, and consider in cold blood their Conduct past, they do often accuse their own selves. But contrarily here, Passions do solicit and animate themselves, they make Merit of their Violence, and believe that God and his Church are concerned in their Justification; because they imagine, that they have laboured for the Truth. This is one of the Reasons why often Men believe, that they see but little Zeal in the true Church, while there is so much Fire in the Conduct of Them, that endeavour her Ruin.

But we must needs grant, that there is something more. The Moderation of the Faithful doth not alway proceed from that Sweet Spirit, which is the very Genius of the Gospel: It comes often from the coldness of their Zeal; God permits it to oblige us to adore in Silence the Mysteries of his Conduct, and to confound at the same time the Pride of Man’s heart. We have much less Love for the Truth, than the World and the Devil have of Hatred against it. And whilst we act in the Establishment of Religion by a Principle, of Self-love, we have quite another kind of Ardour than when we have no other prospect than that of the Glory of God.

The Church doth easily relent; the fervour of the Zeal, which seeks the Conversion of Others, doth not last long. It is so hard a thing to seek for Salvation, that Men imagine they do enough to labour for their own, without charging themselves with the Care of Others. And we easily fall into those unhappy Thoughts, That God is good enough to do his own Business; that he will have a care of his own Interest, and that he will not want Means to Convert them whom he hath destined to eternal Salvation. Whereas false Zeal doth hold it self up, doth persevere, and finds it self often more capable to endure greater Labours, than the true Devotion.

It is a thing that confounds us: I grant it’s one of the great Temptations which good Souls are to overcome. But truly, it’s a Thing whereof it’s impossible to deny the Truth, if we have any thing of good Faith or Probity. Our Lord Jesus Christ himself doth teach us, that the Pharisees and the false Doctors of Judaism did compass Sea and Land to make a Proselyte; and all their labours did conclude to render Him a Son of Hell, likes themselves. All those things do make me conclude, That the Zeal to make Conversions, is not always a certain Sign that the Truth is in that Party.

It is a favourable Prejudice; but after all it’s but a Prejudice, and we should not suffer our selves to be conducted by those kinds of Lights, which are often deceitful. We must be permitted to examine, If the Zeal of Religion, which causes so many Emotions, be a Divine fire, or a Passion merely Human. Now we cannot better know the Nature of that Zeal which seeks for Conversions, than by the Means which it employs: for it’s an indubitable Principle, That true Piety never doth any ill, that good may come thereof. She seeks the Salvation of Men; but she seeks it by ways that are just, lawful, and rational.”

— Pierre Jurieu, A preservative against the change of religion, or, A just and true idea of the Roman Catholic religion, opposed to the flattering portraitures made thereof, and particularly to that of my Lord of Condom, trans. Claudius Gilbert (London: Thomas Cockerill, 1683), pp 3-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+should+not+imagine%2C+that+all+that+which+is+called+Zeal+for+Religion%2C+and+a+design+to+convert+Heretics%2C+should+necessarily+flow+from+a+good+Principle.+On+the+contrary%2C+God%2C+for+the+Trial+of+the+Faith+of+his+Elect%2C+hath+almost+always+permitted%2C+that+false+Religions+have+had+more+Zeal+for+the+destruction+of+the+True%2C+than+the+True+Religion+for+the+ruin+of+the+Falser.+When+Christian+Religion+became+predominant%2C+She+did+not+do+that+for+the+ruin+of+Paganism%2C+which+had+been+done+against+her+during+the+Reign+of+Pagan+Emperors.%0A%0AIt%E2%80%99s+true%2C+that+true+Zeal+is+always+accompanied+with+Moderation%2C+and+false+Zeal+with+Violence.+So+that+in+the+Eyes+of+Flesh%2C+the+true+faithful+Ones+do+appear+Luke-warm%3B+and+the+Enemies+of+Truth+do+pass+for+true+Zealots.+When+Human+Passions+do+mingle+themselves+in+those+Sentiments+of+Hearts+called+Religion%2C+there+is+no+Excess+that+they+are+not+capable+of.+In+respect+of+other+Objects%2C+in+the+midst+of+their+greatest+Transports+they+do+reproach+themselves+secretly%2C+which+stops+their+fury%2C+and+steal+away+some+part+of+their+Impetuousness%3B+and+chiefly+when+they+are+allayed%2C+and+consider+in+cold+blood+their+Conduct+past%2C+they+do+often+accuse+their+own+selves.+But+contrarily+here%2C+Passions+do+solicit+and+animate+themselves%2C+they+make+Merit+of+their+Violence%2C+and+believe+that+God+and+his+Church+are+concerned+in+their+Justification%3B+because+they+imagine%2C+that+they+have+laboured+for+the+Truth.+This+is+one+of+the+Reasons+why+often+Men+believe%2C+that+they+see+but+little+Zeal+in+the+true+Church%2C+while+there+is+so+much+Fire+in+the+Conduct+of+Them%2C+that+endeavour+her+Ruin.%0A%0ABut+we+must+needs+grant%2C+that+there+is+something+more.+The+Moderation+of+the+Faithful+doth+not+alway+proceed+from+that+Sweet+Spirit%2C+which+is+the+very+Genius+of+the+Gospel%3A+It+comes+often+from+the+coldness+of+their+Zeal%3B+God+permits+it+to+oblige+us+to+adore+in+Silence+the+Mysteries+of+his+Conduct%2C+and+to+confound+at+the+same+time+the+Pride+of+Man%E2%80%99s+heart.+We+have+much+less+Love+for+the+Truth%2C+than+the+World+and+the+Devil+have+of+Hatred+against+it.+And+whilst+we+act+in+the+Establishment+of+Religion+by+a+Principle%2C+of+Self-love%2C+we+have+quite+another+kind+of+Ardour+than+when+we+have+no+other+prospect+than+that+of+the+Glory+of+God.%0A%0AThe+Church+doth+easily+relent%3B+the+fervour+of+the+Zeal%2C+which+seeks+the+Conversion+of+Others%2C+doth+not+last+long.+It+is+so+hard+a+thing+to+seek+for+Salvation%2C+that+Men+imagine+they+do+enough+to+labour+for+their+own%2C+without+charging+themselves+with+the+Care+of+Others.+And+we+easily+fall+into+those+unhappy+Thoughts%2C+That+God+is+good+enough+to+do+his+own+Business%3B+that+he+will+have+a+care+of+his+own+Interest%2C+and+that+he+will+not+want+Means+to+Convert+them+whom+he+hath+destined+to+eternal+Salvation.+Whereas+false+Zeal+doth+hold+it+self+up%2C+doth+persevere%2C+and+finds+it+self+often+more+capable+to+endure+greater+Labours%2C+than+the+true+Devotion.%0A%0AIt+is+a+thing+that+confounds+us%3A+I+grant+it%E2%80%99s+one+of+the+great+Temptations+which+good+Souls+are+to+overcome.+But+truly%2C+it%E2%80%99s+a+Thing+whereof+it%E2%80%99s+impossible+to+deny+the+Truth%2C+if+we+have+any+thing+of+good+Faith+or+Probity.+Our+Lord+Jesus+Christ+himself+doth+teach+us%2C+that+the+Pharisees+and+the+false+Doctors+of+Judaism+did+compass+Sea+and+Land+to+make+a+Proselyte%3B+and+all+their+labours+did+conclude+to+render+Him+a+Son+of+Hell%2C+likes+themselves.+All+those+things+do+make+me+conclude%2C+That+the+Zeal+to+make+Conversions%2C+is+not+always+a+certain+Sign+that+the+Truth+is+in+that+Party.%0A%0AIt+is+a+favourable+Prejudice%3B+but+after+all+it%E2%80%99s+but+a+Prejudice%2C+and+we+should+not+suffer+our+selves+to+be+conducted+by+those+kinds+of+Lights%2C+which+are+often+deceitful.+We+must+be+permitted+to+examine%2C+If+the+Zeal+of+Religion%2C+which+causes+so+many+Emotions%2C+be+a+Divine+fire%2C+or+a+Passion+merely+Human.+Now+we+cannot+better+know+the+Nature+of+that+Zeal+which+seeks+for+Conversions%2C+than+by+the+Means+which+it+employs%3A+for+it%E2%80%99s+an+indubitable+Principle%2C+That+true+Piety+never+doth+any+ill%2C+that+good+may+come+thereof.+She+seeks+the+Salvation+of+Men%3B+but+she+seeks+it+by+ways+that+are+just%2C+lawful%2C+and+rational.%E2%80%9D%0A%0A%E2%80%94+Pierre+Jurieu%2C+A+preservative+against+the+change+of+religion%2C+or%2C+A+just+and+true+idea+of+the+Roman+Catholic+religion%2C+opposed+to+the+flattering+portraitures+made+thereof%2C+and+particularly+to+that+of+my+Lord+of+Condom%2C+trans.+Claudius+Gilbert+%28London%3A+Thomas+Cockerill%2C+1683%29%2C+pp+3-5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ed7420708.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ed7420708.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/04/04/pierre-jurieu-on-good-and-bad-zeal-in-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

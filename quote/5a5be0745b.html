<blockquote><p>So Christ, ‘He that believes in the Son, has life eternal.’ And Peter, ‘To Him bare all the prophets witness, that all who believe in Him, shall receive remission of sins through his name.’ There is the like reason of all other evangelical promises: for they have annexed expressly or tacitly the condition of faith and repentance;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all…’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645)</cite>, p. 810</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

— David Pareus, ‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all…’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645), p. 810">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+Christ%2C+%E2%80%98He+that+believes+in+the+Son%2C+has+life+eternal.%E2%80%99+And+Peter%2C+%E2%80%98To+Him+bare+all+the+prophets+witness%2C+that+all+who+believe+in+Him%2C+shall+receive+remission+of+sins+through+his+name.%E2%80%99+There+is+the+like+reason+of+all+other+evangelical+promises%3A+for+they+have+annexed+expressly+or+tacitly+the+condition+of+faith+and+repentance%3B%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+%E2%80%98A+Piece+of+a+Speech+concerning+that+Question%2C+To+whom+properly+do+the+benefits+of+Christ%E2%80%99s+sufferings+and+death+belong%3F+And+how+Christ+is+said+to+die+for+all%E2%80%A6%E2%80%99+in+Zachary+Ursinus%2C+Sum+of+Christian+Religion%E2%80%A6+%28London%3A+Young%2C+1645%29%2C+p.+810&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a5be0745b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a5be0745b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=So%20Christ%2C%20%E2%80%98He%20that%20believes%20in,the%20condition%20of%20faith%20and%20repentance&amp;text=So%20Christ%2C%20%E2%80%98He%20that%20believes%20in%20the%20Son&amp;text=or%20tacitly%20the%20condition%20of%20faith%20and%20repentance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d06f8999c0" data-kw="">
<blockquote><p>For faith, termed special mercy, naturally precedes justification in a repentant sinner, as seen in the tax collector who first pleads for mercy through faith; ‘God, be merciful to me a sinner,’ meaning, he trusts he will receive forgiveness of sins. This faith also accompanies justification; during the act of justification, he trusts that his sins are forgiven. Furthermore, it follows justification; for, justified, he descends to his house with the same confidence that his sins have been forgiven. Hence, he later infers that the special object of justifying faith is the promise of the Gospel about the future, present, and past, to each one, to me, to you, to him, believing in the Son, through faith in His blood, sins will be, are being, and have been forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXVII. Similar views are seen in Paraeus. He states:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-eae6011327" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it… If he cannot destroy faith by open infidelity, he will try to make men believe too much, by making the objects of their own belief and calling that a particular faith, and altering God’s Word and casting away the reasons and evidences of faith, to show the strength and nobleness of their faith, which needs no such helps as these; till by over-doing they have raised their edifice in the air and rejected their foundations, and put out their eyes in honor of the sun, and of their physician, lest either of them should be accused as insufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 57</cite>, pp. 270-71</span></figcaption>

<blockquote><p>Fiftly, that man is iustified by faith only, that is, for the onely satisfaction of Christ apprehended by faith: and not partly by faith, that is, for Christs satisfaction imputed; and partly by works, that is, for inherent iustice: may be gathered by the sayings following, which teach that a man is iustified without workes.</p></blockquote>

<blockquote><p>XIV. In addition, it is worth inquiring how faith influences justification, or how it stands in relation to justification: (1) it certainly does not influence it as its meritorious cause, either totally or partially, because Scripture not only testifies constantly that we are justified freely by the grace of God (Rom. 3:24; Eph. 2:8–9), but it also refers our justification to the righteousness of Christ as our only dikaioma on account of which we are justified (Rom. 3:25; Phil. 3:9). Nor (2) on account of our faith considered in any way as our righteousness which is admitted in the gospel by God by way of acceptilation, in place of full obedience to the law, because Scripture nowhere says that we are justified on account of faith, but only by faith, and in addition, it wholly refers that on account of which we are justified to Christ’s righteousness (Rom. 5:18; 3:25). Nor (3) by faith insofar as that speaks of and implies an obedience to the commands of Christ on account of which through the pure grace of God we are justified, because Scripture throughout contrasts faith and obedience or good works (Rom. 3:27–28; Eph. 2:8–9; Gal. 2:16). Perhaps (4) it justifies as an instrument by which we take hold of Christ. Protestants generally think in this way, and certainly truly, if only you take this with due distinction. And so that you may do this, we must distinguish between passive and active justification. In passive justification, we are persuaded that we are justified by God, or from it we conclude that we are justified by God. In this way it certainly can be said that we are justified by faith as an instrument, insofar as in the practical syllogism, by means of which we conclude that we are infallibly justified, faith stands as the middle term: “The one who believes is justified; I believe; therefore, I am justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, sect. 14, ‘How faith influences justification: How it does not influence’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

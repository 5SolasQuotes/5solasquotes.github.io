<blockquote><p>Oh! it is a grievous thing for Christ to call and we to refuse his gracious calling… And thus we see how all under the gospel are called by the Word: Secondly, all under the gospel are called by the Spirit working within as well as by the Word preached without… Question 3. Whether the call of the Spirit be ineffectual or not?… Answer. All this [unquoted here, including Bible verses] is true of the effectual operation of the Holy Spirit, because that is certain and eternal; but there is a general work of the Spirit, which ends in perdition; that is, many may and do fall finally and totally into sin, and consequently into eternal destruction, in whom sometimes there has been some good motions, and general operations of the blessed Spirit; this is clear from these places, to wit, Mt. 7:22; 13:20; Heb. 6:4; 10:26; 2 Pet. 2:20. Now this general call and operation of the Holy Spirit has these degrees following: viz. First, an understanding of the Word, for the mere natural man cannot understand it, Mt. 16:23 &amp; 1 Cor. 2:14. Here observe two things, to wit, First, there are many in the places of the Gospel who hear the Word preached all the days of their lives and yet understand nothing, but remain children in understanding; now these never were made partakers so much as of common or general grace: Secondly, there are some who live under the Word, and do dogmatically understand the Word; now these must remember that knowledge is not enough, God having given them knowledge for practice’s sake, yea to know and not to obey will aggravate their punishment. Secondly, a taste of spiritual things and the heavenly gift, Heb. 6:4: this is to receive the Word with joy. Mt. 13:20, and there are few ordinary hearers, but at some time or other have these affecting motions, although for the most part the reprobate rather rejoices in the newness than in the trueness of that which he hears. Thirdly, obedience in part, forsaking some sins and doing God some service, Mk. 6:20.</p></blockquote>

<blockquote><p>V. The form or manner of this calling is chiefly: (1) In the tender or offering of Christ and of all saving happiness in Him unto Sinners. (2) In sinners’ accepting, embracing or closing with this tender. 1. Christ, and all saving happiness in him, is offered or tendered unto sinners on God’s part, etc. Acts 4:12; Heb. 7:25; 1 Cor. 1:23-24; 2 Cor. 5:19-21; Mt. 22:2 to 15; Mt. 11:28-30. This tender or offer of Christ to sinners is twofold, viz. ineffectual and effectual. (1) Ineffectual, which becomes not fully efficacious to conversion and salvation. And this again is either, outward only, when Christ and his benefits are only outwardly tendered in his Gospel, New Covenant promises, etc. preached and propounded, Acts 2:38-39 &amp; 9:15 &amp; 13:38-39. As when the preaching of the Gospel is tendered to them that refuse to hear it, but put it from them, stop their ears against it, contradict, etc. Acts 7:57 &amp; 13:45-46, or if they do hear it, yet do not understand it (much less assent to it) as the hearer compared to the ground by the wayside, Mt. 13:4, 19. Inward also, when the Word is not only offered and propounded to the outward ear, but also to the inward heart: So that they not only hear it, but understand it, Mt. 21:45-46. Yea sometimes not only understand it, but also by a temporary faith for a time assent to it and receive it with joy, Mt. 13:5-6, 20-21; Lk. 8:6, 13. All these degrees of calling, outward and inward, are ineffectual and insufficient to salvation: yet are they of great use, consequence and advantage to the interessing of persons in the visible Church, to the partaking of all the ordinances and means of grace, whereby much sin may be prevented and perhaps true grace may be conveyed. (2) Effectual, when Christ and his benefits are so tendered to the mind and heart in the New Covenant-doctrine that the mind is savingly illuminated to understand and the heart effectually opened to assent to the tender, and fiducially to apply it, Lk. 8:15; Eph. 1:17; Jn. 6:45; Acts 16:14 &amp; 8:35-37. From this different tender of Christ ineffectual and effectual, arises that distinction of ineffectual calling; ‘Many are called and few chosen:’ (Mt. 22:14 &amp; 20:26) and effectual calling, viz. according to God’s purpose of election (Rom. 8:28, 30). That may befall hypocrites and reprobates; this is peculiar only to the elect. Thus Christ and all saving happiness in Him is propounded and tendered to sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; Medulla Bibliorum: the Mystery &amp; Marrow of the Bible, viz. God’s Covenant with Man</cite>, … (London: R.W., 1657), bk. 4, Of God’s Covenant of Performance made and confirmed in Jesus Christ, ch. 6, Of the Blessed Messiah, Aphorism 4, ‘Of Christ’s Establishment of his New Covenant and Application of it to God’s Elect’, pp. 1645-46</span></figcaption>

<blockquote><p>Fifthly, if thou art a holy person, if thou art one that hast that real holiness without which there is no happiness, then know for thy comfort, that thy holiness is a glorious witness and evidence of thy effectual vocation, 1 Pet. 1:15, ‘As He who hath called you is holy, so be ye holy in all manner of conversation.’ Many are externally called that are not internally called, and many are ineffectually called that are not effectually called. But now real holiness that speaks out an internal call, an effectual call, a call out of darkness into marvelous light… The Author of this call is a holy God; our holy calling depends upon the purpose of God, the power of God, and the grace and good pleasure of God; the means of our holy calling are the Spirit of God and the Word of God; and the ends of our calling are holiness and the glory of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity, or Holiness, the only way to happiness, discovered in 58 Sermons</cite>, ... (London: Crips, 1662), The Necessity, Excellency, Rarity &amp; Beauty of Holiness, Use 3, pp. 623-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>
<div class="actions"><button class="copy" data-copy="“Fifthly, if thou art a holy person, if thou art one that hast that real holiness without which there is no happiness, then know for thy comfort, that thy holiness is a glorious witness and evidence of thy effectual vocation, 1 Pet. 1:15, ‘As He who hath called you is holy, so be ye holy in all manner of conversation.’ Many are externally called that are not internally called, and many are ineffectually called that are not effectually called. But now real holiness that speaks out an internal call, an effectual call, a call out of darkness into marvelous light… The Author of this call is a holy God; our holy calling depends upon the purpose of God, the power of God, and the grace and good pleasure of God; the means of our holy calling are the Spirit of God and the Word of God; and the ends of our calling are holiness and the glory of God.”

— Thomas Brooks, The Crown and Glory of Christianity, or Holiness, the only way to happiness, discovered in 58 Sermons... (London: Crips, 1662), The Necessity, Excellency, Rarity &amp; Beauty of Holiness, Use 3, pp. 623-24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFifthly%2C+if+thou+art+a+holy+person%2C+if+thou+art+one+that+hast+that+real+holiness+without+which+there+is+no+happiness%2C+then+know+for+thy+comfort%2C+that+thy+holiness+is+a+glorious+witness+and+evidence+of+thy+effectual+vocation%2C+1+Pet.+1%3A15%2C+%E2%80%98As+He+who+hath+called+you+is+holy%2C+so+be+ye+holy+in+all+manner+of+conversation.%E2%80%99+Many+are+externally+called+that+are+not+internally+called%2C+and+many+are+ineffectually+called+that+are+not+effectually+called.+But+now+real+holiness+that+speaks+out+an+internal+call%2C+an+effectual+call%2C+a+call+out+of+darkness+into+marvelous+light%E2%80%A6+The+Author+of+this+call+is+a+holy+God%3B+our+holy+calling+depends+upon+the+purpose+of+God%2C+the+power+of+God%2C+and+the+grace+and+good+pleasure+of+God%3B+the+means+of+our+holy+calling+are+the+Spirit+of+God+and+the+Word+of+God%3B+and+the+ends+of+our+calling+are+holiness+and+the+glory+of+God.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+The+Crown+and+Glory+of+Christianity%2C+or+Holiness%2C+the+only+way+to+happiness%2C+discovered+in+58+Sermons...+%28London%3A+Crips%2C+1662%29%2C+The+Necessity%2C+Excellency%2C+Rarity+%26+Beauty+of+Holiness%2C+Use+3%2C+pp.+623-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06ea2b0dbe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/06ea2b0dbe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-calling/#:~:text=Fifthly%2C%20if%20thou%20art%20a%20holy,holiness%20and%20the%20glory%20of%20God&amp;text=Fifthly%2C%20if%20thou%20art%20a%20holy%20person%2C%20if&amp;text=calling%20are%20holiness%20and%20the%20glory%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-099f204dae" data-kw="">
<blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Heads 3–4, Art. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a> › <a href="../topics/effectual-calling/external-and-internal-call/outward-call-by-the-word.html">Outward call by the Word</a></span><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a> › <a href="../topics/the-covenant-of-grace/the-gospel-offer/the-sincere-call-to-all.html">The sincere call to all</a></span></div>
<div class="actions"><button class="copy" data-copy="“As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.”

— Synod of Dort, The Canons of Dort, Heads 3–4, Art. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+many+as+are+called+by+the+gospel+are+unfeignedly+called.+For+God+has+most+earnestly+and+truly+declared+in+His+Word+what+is+acceptable+to+Him%2C+namely%2C+that+those+who+are+called+should+come+unto+Him.+He+also+seriously+promises+rest+of+soul+and+eternal+life+to+all+who+come+to+Him+and+believe.%E2%80%9D%0A%0A%E2%80%94+Synod+of+Dort%2C+The+Canons+of+Dort%2C+Heads+3%E2%80%934%2C+Art.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F099f204dae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/099f204dae.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" rel="noopener" target="_blank">Read it online · CRCNA</a></div>
</figure><figure class="quote" id="q-3d90ee188b" data-kw="">
<blockquote><p>…there remains a necessary distinction to be attended unto of God’s call, that it is twofold: either external only, or external and internal also; or an effectual and ineffectual calling. For though this distinction be hated by some men, yet the Scripture is very clear that there are many called, who yet are not chosen: and when he says called, it is not meant only actively on God’s part, as some were called, but yet refused and would not so much as outwardly profess obedience, but ‘called’ is to be understood passively on man’s part, so that he gives some outward conformity to Gods call. There is an external reception and submission to it, but yet there is no true inward sanctification: Insomuch that some who are called the children of the Kingdom shall be cast forth; and they are said not to be all Israel who are of Israel. In the Old Testament we read of many who outwardly submitted to the profession of God’s commands, who yet were not found at heart; and therefore our Savior in the course of his ministry did not direct his preaching more to any subject almost than this, viz. to have the internals of grace as well as externals; so that we may say, There is a called and elected Church, and a called Church only, not elected; and this is to take off all Churches from idolizing and doting upon the ordinances and external administrations which are in a Church, as the Jews did, and as most Christians do. We are to go further and to see whether we be indeed and really Christ’s body, as well as seemingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Expository Comment, Doctrinal, Controversial &amp; Practical upon the Whole First Chapter to the Second Epistle of St. Paul to the Corinthians</cite>, (London: A.M., 1661), sermon 13, p. 54</span></figcaption>

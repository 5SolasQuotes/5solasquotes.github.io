<main class="wrap"><figure class="quote" id="q-03ce32e19e" data-kw="">
<blockquote><p>We cannot expel demons with certain ceremonies and words, as Jesus Christ, the prophets, and the apostles did. All we can do is, in the name of Jesus Christ, to pray the Lord God, of his infinite mercy, to deliver the possessed persons. And if our prayer is offered up in full faith, we are assured by Christ himself (John 16:23) that it will be efficacious, and overcome all the devil’s resistance. I might mention many instances of this. But we cannot of ourselves expel the evil spirits, nor must we even attempt it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, (1556), ‘Of the Devil and His Works’, section 625</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e977de2a40" data-kw="">
<blockquote><p>In MPD [or Dissociative Identity Disorder], we have a phenomenon that was traditionally categorized as demonic possession. Accordingly, people exhibiting the behavior now associated with MPD described it, not as a fragmentation of a single mind into multiple ones, but as the entrance from without of a distinct and alien mind… Many well-known cases of alleged MPD–such as that of ‘Sybil,’ made famous in the film of that title–have been shown to have been exaggerations or even hoaxes. ‘Sybil’ herself has admitted that her ‘disorder’ was more or less her own invention, that she was coxed into believing that she had multiple personalities by therapists eager to prove that MPD was real, and that under their encouragement and in an emotionally fragile state she had manufactured and acted out various ‘personalities’ to confirm their diagnosis. Many other MPD patients, emotionally disturbed people to start with, acknowledge that they see themselves less as literally ‘fragmenting’ into different personalities than as fantasizing and acting out different roles–again, often under the influence of overzealous therapists. The behavior of ‘split-brain’ patients is no less subject to interpretation, interpretation that can reflect the enthusiastic theorizing of the researcher as much as the objective facts. To begin with, the two hemispheres of the brains of such patients are not completely disconnected–there are other connections between the halves that remain undisturbed, and thus there are no grounds for insisting that the halves must be associated with different ‘minds’. Furthermore, under ordinary conditions, such patients behave more or less normally, or at least no in any way that suggests that more than a single mind occupies their bodies. It is only in contrived experimental contexts that they can be made to exhibit remarkable behavior, and even then that behavior is by no means obviously best interpreted as involving a ‘division’ of the mind. Many researchers hold instead that such behavior, when examined carefully, amounts to little more than a variation on the awkwardness, failure of co-ordination, or general cognitive malfunctioning that can result from any serious injury to brain…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Philosophy of Mind</cite>, (Oneworld, 2006), pp. 27-8</span></figcaption>

<blockquote><p>3. The ceremonies are proven to be superstitious by this reason: If there were no more, they have no necessary nor profitable use in the Church (as has been proved), which kind of things cannot be used without superstition. It was according to this rule, that the Waldenses and Albingenses taught that the exorcisms, breathings, crossings, salt, spittle, unction, chrism, etc. used by the Church of Rome in baptism, being neither necessary nor requisite in the administration of the same, did occasion error and superstition rather than edification to salvation. (History of the Waldenses, pt. 3, bk. 1, ch. 6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 1, ‘That the Ceremonies are unlawful, because superstitious…’, p. 2</span></figcaption>

</figure><figure class="quote" id="q-531ab0edd0" data-kw="">
<blockquote><p>To proceed yet further, we are here to consider the particular remedies which they of the popish church have prescribed against the hurts that have come by witchcraft. And they are principally five. The first is the name of Jesus. We must grant that any Christian may lawfully call upon the name of Jesus in prayer, for the help and deliverance of those who are possessed and bewitched, but yet with the caveat and condition before specified, if it is the will of God, and if their recovery may make for His glory, the benefit of the church, and the good of the diseased parties. But the papist, by the use of this name, intends a further matter, to wit, that the very name uttered in so many letters and syllables is powerful to cast out devils and to help those who are bewitched. For when it is uttered, then (they say) the authority of Christ is present, that the work may be done. [This is] a flat untruth and a practice full of danger. For let this be well considered, whatsoever any man does in this case, he must do it by virtue of his calling, and have also his warrant for the doing thereof out of the Word. If he lacks this, and yet undertakes such a work, he may justly fear the like event that befell the vagabond Jews who were exorcists (Acts 19:13). Now the church of Christ has no warrant in the Word to use this name of Christ for any such purpose. Neither has any ordinary Christian a special calling from God so to do. Therefore, he may not do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft</cite>, … (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’, pp. 239-40</span></figcaption>

craft%E2%80%A6+%28Cambridge%2C+1610%29%2C+ch.+7%2C+%E2%80%98The+application+of+the+doctrine+of+witchcraft+to+our+times%E2%80%99%2C+section+3%2C+question+3%2C+%E2%80%98Whether+a+man+may+prevent+the+danger+of+witchcraft%2C+and+if+he+may%2C+then+what+remedies+he+may+lawfully+and+effectually+use+against+it%3F%E2%80%99%2C+pp.+239-40&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F531ab0edd0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/531ab0edd0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-exorcism/#:~:text=To%20proceed%20yet%20further%2C%20we%20are,Therefore%2C%20he%20may%20not%20do%20it&amp;text=To%20proceed%20yet%20further%2C%20we%20are%20here%20to&amp;text=to%20do.%20Therefore%2C%20he%20may%20not%20do%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c328fa613d" data-kw="">
<blockquote><p>Sixthly, escaping of worldly pollutions is not always an argument of a renewed nature, because sin may drive out sin, even as divines say about popish exorcisms, when the priest calls out devils from men possessed, it is by collusion: the devil recedes not because those exorcismes are of divine efficacy, but because hereby he would confirm people more in believing a lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), Section 3, Sermon 32, p. 192</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b5655c6311" data-kw="">
<blockquote><p>Nor can I address every issue that arise in connection with the question of when the life of a human being ends, which has become no less heated because of its relationship to the ethics of euthanasia.† But as with the embryo, so too with human beings whose rational faculties no longer function due to brain damage, the fact that the exercise of a power is absent does not entail that the power itself is absent, or that the substantial form that grounds the power is absent. Recall what was said in chapter 5 about the relationship between a substance’s properties and the essence from which they flow or follow. The manifestation of the properties that flow from a substance’s essence can be blocked because of either damage or incomplete development, but the essence itself is nevertheless still there. † For treatment of the subject from an Aristotelian hylemorphist point of view, see Oderberg, Applied Ethics, chapter 2, and David S. Oderberg, “Death, Unity, and the Brain,” Theoretical Medicine and Bioethics 40 (2019): 359-79. The bottom line is that given hylemorphism, if a living human body is present, then its substantial form is present, which entails that the soul is present. Hence we are dealing with a rational animal or human being, whether or not the human being happens to be capable of exercising all his distinctively human powers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholastica, 2024), pt. 4, ch. 11, pp. 512-13</span></figcaption>

<blockquote><p>…some speak of a sentence [in justification] before the angels, as if God did declare before them who is righteous; but this I think is altogether unscriptural: others speak of a sentence in conscience, but this is but the manifestation of justification. Let us first distinguish of justification, and then answer. There is a double justification, constitutive justification, whereby God makes us just in this life; sentential justification, whereby God pronounces us just at death and judgment. Constitutive justification is the foundation of sentential, for the true God will not pronounce us just unless we are such, and sentential justification is the compleature of constitutive: For here there is sententia judicis [a sentence of judgment] crowning us as righteous;</p></blockquote>

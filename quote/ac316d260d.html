</figure><figure class="quote" id="q-978f8c9d05" data-kw="">
<blockquote><p>We are knit to him both by consanguinity and by affinity. The nearest affinity is marriage, and the nearest consanguinity is sister. So that there are all bonds to knit us to Christ. Whatsoever is strong in any bond, he knits us to him by it. Is there any love in an husband, a brother, a mother, a friend, in an head to the members? in anything in the world? Is there any love scattered in any relation, gather it all into one, and all that love, and a thousand times more than that, is in Christ in a more eminent manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, Sermon VI (Song 5:2, “My sister”)</span></figcaption>

</figure><figure class="quote" id="q-6c7372b0c9" data-kw="Perseverance Comfort">
<blockquote><p>Christ your Head is risen, therefore you cannot be lost: nay, he is not only risen from the dead himself, but is also &quot;become the first-fruits of them that slept,&quot; 1 Cor. 15: 20. Believers are his members, his fulness, he cannot therefore be complete without you: a part of Christ cannot perish in the grave, much less burn in hell. Remember, when you feel the natural union dissolving, that this mystical union can never be dissolved: the pangs of death cannot break this tye.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), Inference 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/union-and-communion.html">Union and Communion</a> › <a href="../topics/union-with-christ/union-and-communion/believers-as-members-of-christs-body.html">Believers as members of Christ&#x27;s body</a></span><span class="t"><a href="../topics/perseverance-of-the-saints/grounds-of-perseverance.html">Grounds of Perseverance</a></span></div>

</figure><figure class="quote" id="q-e5278482a5" data-kw="Mediator">
<blockquote><p>That the saints are nearer unto Christ than angels are, as I told you before; he is so a head to men as he is not to them. Both their union and ours with God is by Christ; now, if we be more united to Christ than they are, then we are more nearly united to God too; more nearly united to Christ we are, for he is our brother, he hath our nature, he hath more of ours, he hath done more for us; we are sons by adoption in him, he is our husband. To which of all the angels was it said that Christ is their husband? Of which of all the angels is it said that Christ is their Saviour?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon X (Eph. 1:10), Obs. 3</span></figcaption>

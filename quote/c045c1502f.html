<main class="wrap"><figure class="quote" id="q-c045c1502f" data-kw="">
<blockquote><p>But it will yet be said, An institution is wanting, we have no precept, we have no president of the baptizing of Infants: The institution is, Go teach all nations, baptizing them, &amp;c. We must baptize those whom by teaching we have discipled: to the word signifieth.

I answer, First, That which hath been said doth conclude that they are within the verge of an institution, being such that have so full title: I have heard one of the most learned and reverend that ever I knew or heard of that was of that way more then once profess with no small solemnity, that if he knew an Infant to be sanctified as he acknowledged John Baptist was, such a one he would baptize: And that the particular infants whom Christ was seen for to bless might have been baptized: Those then that are thus entitled, through want of an institution are not to be excluded, and how far and fully Infants of believing parents are entitled we have heard.

2. The place quoted hath not in it the Institution of that Sacrament: Baptism was appointed of God before those words were uttered; He that spoke them was himself before baptized; They to whom they were spoken had baptized others; It is only an enlargement of their Commission for the exercise of their Ministry, being before confined unto one Nation, now it is enlarged to all Nations.

3. The words there comprise infants, they are no more excluded then men of years, serving to make up a Nation as well as parents: The Infants of Nineveh did make a considerable party of the City of Nineveh; The Infants of any Nation make up a part of the Nation; and the Nation where they came was to be discipled, And that Infants are here comprehended further appears by this argument.

In the same sense and latitude as Nation was taken in respect of the Covenant of God, when the Covenant, and Covenant-initiating-Sacrament was restrained to that one only Nation, where their Commission was first limited: In the same sense it is to be taken (unless the text express the contrary) now the Commission is enlarged. This cannot be denied of any that will have the Apostles to be able to know Christ’s meaning by his words in this enlarged Commission.

But Nation, then as is confessed did comprehend all in the Nation in respect of the Covenant, and nothing is expressed in the text to the contrary, therefore it is to be taken in that latitude, to comprehend Infants. Will it be said that an exception of Infants is implied, in that all of the Nation must be discipled before they be baptized, but Infants are not capable of being discipled, and so they are made uncapable of Baptism.

I answer, 1. Here is rather implied that they are of capacity to be Disciples, in that Christ sends to disciple Nations, and they serve to make up the nation.

2. It is the way of the Scripture, speaking of an universality of a people in a land, expressly to except infants, in case they be to be excepted: As we see in the judgement that befell Israel in the wilderness to the cutting off of those that came out of the land of Egypt. And in the Covenant entered by the body of the Nation of all degrees and sexes at their return from Babylon, and an exception could be nowhere more useful and necessary then here, to let us know that it is otherwise with Gentiles in this particular then it was with the Jews, that the Nations where their Commission is thus enlarged were herein differenced from the Nation to which their Ministry was first limited.

3. Let that text of the Prophet be well weighed, where speaking by the spirit of prophecy of the rejection of the Jews, and the glorious call of the Gentiles in their stead, in that ample way as it is there set out hath these words, Behold, I will lift up mine band to the Gentiles, and set up my standard to the people: and they shall bring thy sons in their arms: and thy daughters shall be carried upon their shoulders. If there were but such an hint as that by way of prophesy to have left them behind, we should from some have heard of it with a noise.

4. In the Lord Christ’s Dialect, who is best able to express his own meaning, they are Disciples, To belong to Christ is to be a Disciple of Christ, This is plain from our Saviour’s own mouth, comparing his words recorded in Matthew and Mark, To give a cup of cold water to drink in the name of a disciple, it is in the one; To give a cup of water to drink in my Name, because ye belong to me, it is in the other: To belong to Christ, to be a Disciple of Christ, and to bear the Name of Christ is one and the same thing with our Saviour.

Now that Infants are of the number of those who as Disciples in Christ’s account doe belong unto him, and bear his Name, is yet further plain by another text of St Matthew, where Christ setting a little child in the midst of his hearers saith, Who so shall receive one such little child in my Name, receiveth me. By all which it appears, that which is done to Infants is done to Disciples, hath a glorious reward as done to Disciples; Infants therefore are Disciples of Christ, are of those that do belong unto him, and bear his Name: who then is not afraid to refuse them who will receive Christ? who will not baptize them that is willing to baptize Disciples in the Name of Christ?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The birth-privilege, or, Covenant-holiness of believers and their issue in the time of the Gospel together with the right of infants to baptism</cite>, (London: Tho. Underhill, 1644), pp 20-21.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5affed3a6d" data-kw="">
<blockquote><p>When they [Baptists] allege that all the cases of baptism recorded in the New Testament are those of adults, and employ this as an argument against the baptism of infants, we object at once to the conclusion as wholly unwarranted from the premises.

The cases of baptism administered by the apostles, and first ministers of Christianity, were evidently those of persons who, like the converts from Jew and Gentile under the ministrations of Christian missionaries in our own day, were convinced by the power of the truth, and embraced it; and were, in consequence, baptized as the badge of their profession and the seal of their privileges. But we have not on record in the New Testament a single instance of the child of a Christian parent being allowed to grow up to adult age before being baptized; while there is strong presumptive evidence to the contrary.</p></blockquote>

<blockquote><p>We have examples not to be contemned of the baptism of whole households, and whether infants were there or no, as it is not certain (though probable) so it is not material: The precedent is a houshold; he that follows the precedent must baptize households. It appears not that any wife was there, yet he that follows the precedent in baptizing of households, must baptize wives, and so (I may say) servants, if they be of the household.</p></blockquote>

— Thomas Blake, The Birth-Privilege, (London, 1644), p. 22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+have+examples+not+to+be+contemned+of+the+baptism+of+whole+households%2C+and+whether+infants+were+there+or+no%2C+as+it+is+not+certain+%28though+probable%29+so+it+is+not+material%3A+The+precedent+is+a+houshold%3B+he+that+follows+the+precedent+must+baptize+households.+It+appears+not+that+any+wife+was+there%2C+yet+he+that+follows+the+precedent+in+baptizing+of+households%2C+must+baptize+wives%2C+and+so+%28I+may+say%29+servants%2C+if+they+be+of+the+household.%E2%80%9D%0A%0A%E2%80%94+Thomas+Blake%2C+The+Birth-Privilege%2C+%28London%2C+1644%29%2C+p.+22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd013782eff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d013782eff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=We%20have%20examples%20not%20to%20be,if%20they%20be%20of%20the%20household&amp;text=We%20have%20examples%20not%20to%20be%20contemned%20of&amp;text=say%29%20servants%2C%20if%20they%20be%20of%20the%20household" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3f5a6379d7" data-kw="">
<blockquote><p>As it is full of Consolation to Believers in respect of themselves, so also in reference to posterity: Their children are God’s children: They being of the Lord’s Inheritance, their children are his heritage in like manner: These bring forth children to God, their seed be owns and challenges for His: An infinite love in God, an unspeakable comfort to a parent, when the Infant, who by corruption of nature is in Satan’s jaws, in no less danger of Hell, then Moses was of the water; and not so much as sensible of it; God pleases to look upon him in this condition and to make it the time of love, and to find out ways of freedom.

What the Apostle speaks from the Prophet of God’s care of the Gentiles, is certainly true being applied to Infants. I was found of them that sought me not, and made manifest to them that enquired not after me. Had we that hopeless opinion of our children as Papists of theirs that die without Baptism; what a wretched case were it (with David) to part with an Infant out of the world? How could such mourn in any other way then those that are without hope? parting with an Infant without part in Christ, and in no better posture towards God then the seed of the sinners of the Gentiles. But we find God more rich in mercy, Christ himself embracing them in their infancy, and taking them into his special love as those that bear his name:

And though death prevent their Baptism, He that hath appointed Ordinances is not tied to them, but can save without them. Bellarmine confesseth that the desire of Baptism in one of the Catechumen, (that is, one instructed in the Principles of Christ and not baptized) doth save; though the text, John 3.5. understood with their Comment be in the Letter against it, why then should not that Grace? which when the person is of capacity would shew it self in desires qualify for Salvation in like manner? Finding this love in God, these bowels in Christ, we may safely conclude, that Children have bliss, Parents have comfort, and let God have the Glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-blake.html">Thomas Blake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The birth-privilege, or, Covenant-holiness of believers and their issue in the time of the Gospel together with the right of infants to baptism</cite>, (London: Tho. Underhill, 1644), pp 32-33.</span></figcaption>

</figure><figure class="quote" id="q-d546e837e5" data-kw="">
<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-horn.html">John Horn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>…A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister</cite></span></figcaption>

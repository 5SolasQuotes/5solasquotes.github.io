<main class="wrap"><figure class="quote" id="q-8d7bd0cf91" data-kw="">
<blockquote><p>6. Wherefore concerning this use, it was only of those times: referendum est ad illius temporis morem, ‘it must be referred to the manner of those times’, Beza: it is not necessary either to retain it or any other outward ceremony or usage instead of it: St. Paul exacts not the outward gesture, but the inward affection, and so as Clemens Alexandria says well, dilectio non sensetur in osculo, sed in benevolentia, ‘love is not measured by the kiss, but by the goodwill.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Sixfold Commentary upon the Most Divine Epistle of the Holy Apostle St. Paul to the Romans... (Cambridge, 1611) | Question 13, ‘Of the Custom then used to Kiss One Another, v. 16’, pp. 726-27</cite>, ch. 16, Questions &amp; Doubts Discussed</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09b3b03b78" data-kw="">
<blockquote><p>If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies... ([Leiden] 1637), | pt. 4, ‘Against the Indifferency of the Ceremonies’ | ch. 3, ‘Whether There be Anything Indifferent In Actu Exercito [In the Exercised Act]?’ No.</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.”

</figure><figure class="quote" id="q-035d8f0bf3" data-kw="">
<blockquote><p>Here it may be considered whether every adjunct of worship instituted of God does by that institution become a matter or part of worship, which otherwise it would not be. Some say that in the old Law the least ceremony prescribed of God was a part of worship, which assertion I do not now so far examine as to declare my assent or dissent. But if it were so, I think it was not merely as prescribed of God, but upon some further reason. For I do not see that God cannot prescribe a mere adjunct of worship, but it must thereby lose its formal state, or become formally another thing, viz. a matter of worship, but think it may remain in its own state, a mere adjunct still. Nevertheless, the observation of that divinely prescribed adjunct may be an act of worship so far as every act of obedience to God as such may be so called. But here we speak of worship, not in so large, but in the stricter sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet (London, 1684), Of Divine Worship, pt. 1, §16. ‘Of Time &amp; Place considered as Adjuncts, or as Matter of Worship’</cite>, pp. 184-85.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-5d62beb4ee" data-kw="">
<blockquote><p>But, Mr. Prefacer [Howe’s separatist opponent], if your judgment upon the case itself, be true, I conceive that truth, accompanied with your temper of spirit, is much worse than their error.</p></blockquote>

</figure><figure class="quote" id="q-d63e93fbac" data-kw="">
<blockquote><p>Your Popish Pax is scarce as good as an apish imitation of the Apostle’s kiss: who doth not institute a ceremony of a superstitious toy to be kissed at the mass, but willeth that the manner of salutation, which was then usual, to be performed with a kiss, should be reverently used, in holiness and sincerity. And of such a kiss speaketh Origen used in the church, after prayers, not of the Pax at Mass.</p></blockquote>

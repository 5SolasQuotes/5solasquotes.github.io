</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12ba2291d7" data-kw="">
<blockquote><p>…you must know therefore that righteousness is no proper real being, but a modus entis, ‘the modification of a being’. The subject of it is: 1. an action, 2. or a person. An action is the primary subject, and so the disposition; and the person secondary, as being therefore righteous, because his disposition and actions are so. Righteousness is the conformity of dispositions and actions, and consequently the person to the rule prescribed. It is not a being distinct therefore from the dispositions and actions, but their just and well being. This [de]finition is only of the creatures’ righteousness. God is the Primum Iustum, and so the rule of righteousness to the creature, and has no rule but Himself for the measuring of his actions. Yet his essence is too far above us, remote and unknown to be this rule to the creature, therefore has He given us his laws, which flow from his perfection, and they are the immediate rule of our dispositions and actions and so of our righteousness. Here carefully observe, that this law has two parts: 1. The precept and prohibition prescribing and requiring duty: 2. The promise and commination [threatening] determining of the reward of obedience, and penalty of disobedience. As the precept is the principal part, and the penalty annexed but for the precept’s sake; so the primary intent of the lawgiver is the obeying of his precepts, and our suffering of the penalty is but a secondary for the attaining of the former. So is there accordingly a two-fold Righteousness or fulfilling of this law, (which is the thing I would have observed): the primary, most excellent and most proper Righteousness lies in the conformity of our actions to the precept: The secondary, less excellent righteousness) yet fitly enough so called) (see Pemble, Of Justification, p. 2) is, when though we have broke the precepts, yet we have satisfied for our breach, either by our own suffering, or some other way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 16, pp. 62-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-71b550412f" data-kw="">
<blockquote><p>We conclude that Holy Scripture does not speak of a reward such as is owed, by a right of hire, on account of worthiness corresponding to the reward; but rather of that which is conferred not upon the idle but upon those who labor, by virtue of covenant and of a gratuitous promise. Hence it is elsewhere also called an inheritance. Nor ought the name “inheritance” to be thought to prevent its being called a “reward”; for even to an adopted son, who has diligently obeyed his adopter and endured many things for his sake, the inheritance comes by filial right, and yet, in respect of the works he has performed and the afflictions he has undergone, it may be called a reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhard-j-vossius.html">Gerhard J. Vossius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam., p. 76</span></figcaption>

<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith; and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that having their fruit unto holiness they may have the end eternal life.</p></blockquote>

</figure><figure class="quote" id="q-ba5c800737" data-kw="">
<blockquote><p>II. There are three principal opinions about the necessity of good works…; The third is that of those who (holding the middle ground between these two extremes) neither simply deny, nor simply assert; yet they recognize a certain necessity for them against the Libertines, but uniformly reject the necessity of merit against the Romanists. This is the opinion of the orthodox. III. Hence it is evident that the question here does not concern the necessity of merit, causality, and efficiency—whether good works are necessary to effect salvation or to acquire it by right. (For this belongs to another controversy, of which hereafter). Rather the question concerns the necessity of means, of presence and of connection or order—Are they required as the means and way for possessing salvation? This we hold. IV. Although the proposition concerning the necessity of good works to salvation (which was thrust forward in a former century by the Romanists under the show of a reconciliation in the Intermistic formula, but really that imperceptibly the purity of the doctrine concerning justification might be corrupted) was rejected by various Lutheran theologians as less suitable and dangerous; nay, even by some of our theologians; still we think with others that it can be retained without danger if properly explained. We also hold that it should be pressed against the license of the Epicureans so that although works may be said to contribute nothing to the acquisition of our salvation, still they should be considered necessary to the obtainment of it, so that no one can be saved without them–that thus our religion may be freed from those most foul calumnies everywhere cast mot unjustly upon it by the Romanists (as if it were the mistress of impiety and the cushion of carnal licentiousness and security)… VII. And as to the covenant, everyone knows that it consists of two parts: on the one hand the promise on the part of God; on the other the stipulation of obedience on the part of man…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol 2, 17th Topic, Third Question: ‘The Necessity of Good Works; Are good works necessary to salvation? We affirm., p. 703</span></figcaption>

<blockquote><p>They all happen and are according to the decree, but they are not caused by it, and therefore rational agents may act freely notwithstanding the preordination of God. For the decree does not so affect the actions of men, as to lay any force upon the actors. It is not denied that there is a necessity of the certain futurition of the acts and events, so that they shall infallibly and inevitably come to pass; but there is not on the things themselves or the actors a necessity, whereby the persons are forced to do what they do, and ot do it unwillingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Veritas Redux</cite>, p. 266</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“They all happen and are according to the decree, but they are not caused by it, and therefore rational agents may act freely notwithstanding the preordination of God. For the decree does not so affect the actions of men, as to lay any force upon the actors. It is not denied that there is a necessity of the certain futurition of the acts and events, so that they shall infallibly and inevitably come to pass; but there is not on the things themselves or the actors a necessity, whereby the persons are forced to do what they do, and ot do it unwillingly.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8aec757b9c" data-kw="">
<blockquote><p>However, God’s activity differs from an artisan’s activity in two ways. The first way is on the part of the matter. For since an artisan does not produce matter but rather works with a given matter, he does not confer on the matter the potency to receive the forms that he introduces to the matter, nor can he put this into the matter. But God, who is the author of the entire thing, conferred not only natural forms and powers on things but also the potency for receiving that which he would make in the matter. The second way is on the part of the form, because the forms that the artisan introduces do not reproduce themselves; for a couch that putrefies does not sprout into a couch but into a plant, as is clear from the Physics 1. But natural forms [of living things] can reproduce themselves. Thus, they have the property of a seed and are called ‘seedlike.’ Now, the forms of things as existing in the divine art are called ‘primordial’ because they are, simply speaking, the first principles of things to be produced. The potency that has been implanted in things for receiving into themselves that which the will of God decrees is called ‘obediential principles’ by some, based on which matter has the ability to become what God wills it to be. Finally, the actual powers placed in matter, which give rise to natural effects, are called ‘seedlike principles.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 18, Creation of Woman, quest. 1, art. 2, I answer that, bk. 2</span></figcaption>

<blockquote><p>5. In what sense is this inability absolute, and in what sense natural, and in what sense moral? … 4th. It is not natural in another sense, because it does not result in the least from any constitutional deficiency in human nature as it now exists as to its rational and moral faculties of soul. 5th. This inability is purely moral, because while every responsible man possess all moral as well as intellectual faculties requisite for right action, the moral state of his faculties is such that right action is impossible. Its essence is in the inability of the soul to know, love, or choose spiritual good, and its ground exists in that moral corruption of soul whereby it is blind, insensible, and totally averse to all that is spiritually good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, 1860, expanded 1879, reprinted 1979, Zondervan, pp. 340-41.</span></figcaption>

<blockquote><p>only we may observe, that though there may such a thing be allowed to the Will, in actu primo [its first act], which the Schools call Simultas potentiae [simultaneous potentialities], by virtue where of the Will, according to its own nature, is capable of acting or not acting, or acting either thus or contrarily; and is capable of acting thus now, and is afterwards capable of revoking that act: nay indeed, this is the root of the liberty of the Will. Nevertheless, in actu secundo [the following act], or which the Schools call Potentia Simultatis [a potency for simultaneous alternatives], which is in the Wills applying itself to its act, it does not then act Indifferently, but upon choice, by which it is determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Reply to Mr. George Kieth, as quoted in Muller, Divine Will</cite>, p. 290. Willard was a New England puritan and here follows the paradigm laid out in Turretin, that an initial free deliberation and power of the soul to alternatives ought to be distinguished from when the soul chooses its choice and no longer remains indifferent towards it, but determines it and follows through upon it.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

al-necessity/#:~:text=only%20we%20may%20observe%2C%20that%20though,choice%2C%20by%20which%20it%20is%20determined&amp;text=only%20we%20may%20observe%2C%20that%20though%20there%20may&amp;text=but%20upon%20choice%2C%20by%20which%20it%20is%20determined" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We are immediately conscious that we are free agents. The validity of this witness as regard our volitions themselves seems to be of the same weight and certitude that we have of our own cognition. Hence we are certain that something at least is contingent, namely our willing. To the extent that we can prove other actions or effects of this sort to be truly under the command or our will, to that extent is the existence of other contingent beings proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Wolter was a Scotist. | ‘On the Existence of Contingent Being’, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<main class="wrap"><figure class="quote" id="q-b898a123ec" data-kw="">
<blockquote><p>What has been said about the predetermination of the will to good acts must be extended to the act of sin, as far as it is an act and a being. Hence, whatever entity is found in any act of sin, even if otherwise it is intrinsically evil, must be traced back to God as the first cause pre-moving and predetermining the created will to such an act as it is an act and as it is a being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXI. The ninth chapter bears the title, “That God by a previous motion truly efficiently moves free will to the act of sin, as far as it is an act and as it is a being.” The chapter begins with these words:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f0eaba27e" data-kw="Author of sin">
<blockquote><p>God by his influence is indeed the principal cause of the act itself, but man is the sole cause of the sin itself, which is in that act. … Nor can even one theologian be shown who has said that God is the author of lawlessness, or of sin insofar as it is sin.</p></blockquote>

</figure><figure class="quote" id="q-112da71237" data-kw="">
<blockquote><p>Indeed, from the different mode in which Scotus speaks here of God’s concurrence toward the act of sin, it entirely follows that this is an exception to that general rule [according to Macedo] — namely, that God both predefines from eternity and predetermines in time antecedently all good acts of the will; and only with respect to evil and sinful acts does he behave differently — that is, not by determining antecedently, but by awaiting the action of the deficient and sinning will. If we establish this by proving it, we establish the doctrine of Scotus on the subordination of causes, and we marvelously reconcile it with the doctrine of the Council of Trent — as we will demonstrate afterward — which teaches against Calvin and the other innovators that God concurs in a different mode with the good and meritorious act than with the evil and demeritorious one. [Yet the Reformed affirm this, ignoring the part about meriting.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Difference with the Reformed</cite>, p. 420</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-7086ee12f9" data-kw="">
<blockquote><p>Nevertheless, regarding the mode of concurring by determining, Scotus does not agree with the position of the Thomists positing a prior quality or positive influx in the secondary cause through which it is constituted in first act and proximately capable of operating. This is apparent from nearly all the cited places, where he excepts antecedent motion of the first cause from being done through an intermediate other created power — which exception establishes the rule of the impossibility of determining from a created cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Scotus</cite>, pp. 394-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Scotus, pp. 394-95">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNevertheless%2C+regarding+the+mode+of+concurring+by+determining%2C+Scotus+does+not+agree+with+the+position+of+the+Thomists+positing+a+prior+quality+or+positive+influx+in+the+secondary+cause+through+which+it+is+constituted+in+first+act+and+proximately+capable+of+operating.+This+is+apparent+from+nearly+all+the+cited+places%2C+where+he+excepts+antecedent+motion+of+the+first+cause+from+being+done+through+an+intermediate+other+created+power+%E2%80%94+which+exception+establishes+the+rule+of+the+impossibility+of+determining+from+a+created+cause.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Scotus%2C+pp.+394-95&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7086ee12f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7086ee12f9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=Nevertheless%2C%20regarding%20the%20mode%20of%20concurring,of%20determining%20from%20a%20created%20cause&amp;text=Nevertheless%2C%20regarding%20the%20mode%20of%20concurring%20by%20determining&amp;text=the%20impossibility%20of%20determining%20from%20a%20created%20cause" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ee4a4b51ea" data-kw="">
<blockquote><p>Regarding the nature of free will; it suffices that from the previous judgment of the practical intellect, it chooses one of the opposites, while still being able to choose the other from a different judgment of the same intellect; because, namely, the root and foundation of free will lie in the intellect, insofar as it can consider various aspects of good in opposites and propose them to the will. But the nature of free will does not include that while the free agent chooses from previous judgment, it is not moved by a superior cause to judge and choose so. Therefore, since the divine motion predetermining the will does not hinder a person from having full and perfect judgment of reason and judging that one means is contingent and the other is necessarily connected to the end, and could also choose otherwise from a different judgment, it follows that such a motion does not harm the freedom of our will. For it is proper to the uncreated will to have its choice from no prior cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXIII. To this, he responds:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

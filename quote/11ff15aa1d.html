<main class="wrap"><figure class="quote" id="q-11ff15aa1d" data-kw="">
<blockquote><p>Question 2. What are those things which make an action to become not voluntary. 4th Answer. Nothing at all but either absolute violence of constraint, or chance which could not be foreseen or prevented. And for such things as are done through absolute violence or mere chance, they have neither the nature of obedience or sin. As if one should be forced to offer incense or bow the knee before an idol, or should merely by chance kill another, Deut. 19:5-10. Question 3. What are we to think of those actions which are done through ignorance? 5th Answer. First, that ignorance which is in some sort a cause of the action (so that if a man knew what he did, he would not do it), if it be involuntary, both in itself and in its cause, that is, not affected nor procured, nor tolerated, does make the action merely casual and involuntary, and so excuses from sin.

6. Secondly, ignorance of the Law does never wholly excuse, because all men are bound to know the Will of God: but yet it does somewhat lessen the fault if it be not affected, 1 Tim. 1:13; John 4:41; Acts 3:17. But if it be affected, it is of itself a sin and so does not diminish, but rather increase the guilt of other sins, 2 Pet. 3:5.

7. Thirdly, an ignorance of the fact, if a man has used such diligence as he ought, does excuse him, because by such an ignorance the fact is made casual. So Jacob being deceived lay with Leah, whom he took to be Rachel, Gen. 29. But if due diligence have not been used, ignorance of the fact does not altogether excuse, although it do somewhat lessen the fault. And this seems to have been the case of Abimelech, Gen. 20:5. Question 4. What are we to judge of those actions which are done through fear? 8th Answer. First, fear does not simply make an action involuntary: but does, considering the circumstances of time and place, etc., impel a man to will this or that. As appears in that known instance of the merchant, who is induced through fear of death to throw away his merchandise into the sea. Fear therefore does never wholly excuse from sin: yea more, fear itself is oft a sin forbidden, and a cause too of most grievous sins, Mt. 10:26; Phil. 1:28; 1 Pet. 3:14; Apoc. 21:8. Although therefore, a great fear or terror, such as is wont sometimes to trouble even a man of good courage before men, be accounted for a good excuse, and is of force to make contracts done through fear void, yet before God such an excuse will not be taken. 9. Secondly, yet that sin which is committed through some strong terror, is not so grievous (if other things be alike) as that which is committed of the voluntary inclination of the will without any such fear of danger, because in fear the temptation is stronger: and such a fall, if repentance follow, does proceed not so much from malice, as from infirmity and perturbation. And this was Peter’s case when he denied Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, p. 92-4</span></figcaption>

</figure><figure class="quote" id="q-d1674f7d7e" data-kw="">
<blockquote><p>The mentioning of these two duties meeting together at one time in our practise does not intend that they do both of them bind the conscience at the same instant, but they are called duties as they are considered apart; being both works are commanded of God in two several commandments: Which two works being duties considered apart, do sometimes offer themselves to our practise at one instant; As to hear a sermon at the church on the Sabbsth, and to tend a sick person ready to die at home at the same time, both are duties being considered apart, but meeting together, and offering themselves to our practise at one time, there is indeed but one duty, because both cannot be performed in one instant; In which case the greater work is the duty, the lesser binds not for that present…</p></blockquote>

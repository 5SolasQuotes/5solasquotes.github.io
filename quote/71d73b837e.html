<main class="wrap"><figure class="quote" id="q-71d73b837e" data-kw="">
<blockquote><p>But if we prove indeed that it [the Anglican Liturgy] is ‘defective and faulty, that you bring for an offering to God,’ when you [bishops] or your neighbors have a better, which you will not bring, nor suffer them that would (Mal. 1:13) and that you call evil good in justifying its blemishes, which in humble modesty we besought you to amend, or excuse us from offering, then God will better judge of the unlawful act than you [bishops] have done.</p></blockquote>

</figure><figure class="quote" id="q-7c69e010b9" data-kw="">
<blockquote><p>If it be asked then, With what kind of defects or discontents may a union be made up? or, what rules may be walked by therein? For answer, we offer these considerations or rules:

1. Whatever doesn’t warrant an initial separation doesn’t warrant a continued separation…

2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation…

3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty…

4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice…

5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful…

6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh, 1659) | pt. 4, ch. 7, ‘General Grounds leading to Unity’, pp. 320-24</span></figcaption>

<blockquote><p>We do believe and own, that Jesus Christ is the only Head and King of his Church; and that he has instituted in his Church officers and ordinances, order and government, and not left it to the will of man, magistrate or Church to alter at their pleasure; and we believe this government is neither prelatical nor congregational, but presbyterian, which now, through the mercy of God, is established amongst us; and believe we have a better foundation for this our Church government, than the inclination of the people or laws of men, etc.</p></blockquote>

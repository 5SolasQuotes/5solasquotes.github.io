<blockquote><p>§13… 3. The will of God is also most free, inasmuch as it is determined by no cause outside God, and this on account of the independence of the divine essence… Meanwhile it is inquired concerning the will of God tending toward creatures (which we have called free, because in them alone a possible existence can be conceived) whether God has willed and wills them with a freedom of indifference. We, if anyone by the indifference of God understands that the will of God in decreeing was not determined by the objects regarded in the decree, acknowledge that all things which are proposed to the decree as possible must in themselves be conceived as indifferent toward futurition, involving no necessity in their concept that they should be made, or compelling God to determine anything. If also by the indifference of the freedom of God anyone understands the sufficiency of God, whereby, being in need of nothing outside Himself, He did not need to seek the supply of any deficiency outside Himself, and therefore to deliberate concerning the production of creatures—in this respect also we acknowledge that God acted with a freedom of indifference. Which, however, is not to be extended so far as though, the will to manifest His glory being posited, His freedom was not determined by His own decency [decentia], which did not admit that He should will otherwise than what is consonant with His glory and virtues. But whether God was so indifferent to creation itself and the manifestation of His glory, considered antecedently to the decree, that He could decently also not create, or not will to manifest His glory, is a problem which is debated among learned men, worthy of further investigation. You may see here the celebrated Wittichius of blessed memory and the celebrated Roëllius disagreeing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>Creation is the action of God, whereby out of nothing He brought forth nature itself and all things in nature, both substances and accidents, in and with the substances, and finished them in the space of six days, both to his own glory and the salvation of the elect… Or thus, creation is a transient or external action of God, whereby in the beginning He made the world by a mere command out of his own free will in six days’ space to the glory of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 225</span></figcaption>

<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

<blockquote><p>1st Conclusion. The relative expression of God which is in the works of God, is no formal ground of any adoration of the creatures.

1. Because adoration upon this ground, though the creatures, the host of heaven be excellent, is forbidden, Dt. 4:19.

2. [If it were the case, then] Not only images (which cannot represent God) and the sacraments, but all the creatures, even, rats, mice, flies, frogs, worms, Judas and wicked men, yea, and devils are to be worshipped, because all things having being are shadows and footsteps of God, their cause, first author and last end, Ps. 19:1; 103:22; Rom. 1:19-20; Acts 17:27-28; Prov. 16:4; Rev. 4:11; Rom. 11:36-37.

3. Because God is really, and by the diffusion of his blessed essence, present in all creatures, it follows not that we should adore them: The Formalists upon this ground, that Christ is really present in the sacrament, though the manner we know not, think that Christ should be adored in the sacrament, according to that, Verbum audimus, motum sentimus, modum nescimus. But if this be good logic, because we know not the way of the Spirit and how the bones grow in a woman with child, Eccl. 11:5, and God, where he works, is present by the immediation of essence and power, though we know not the way of his presence, we are to adore the soul of man and the bones of a young child in a woman’s belly; and though they should say that God-man Christ is in a more powerful and efficacious manner present in the sacrament than in the works of nature; yet should it follow that God is to be worshipped in the works of nature also, for magis et minus non variant speciem [greater or less does not vary the species]; for then we could not conclude any thing but this: Though there be not so real a ground of adoring lice and frogs as adoring of the sacrament, yet there is a ground, seeing God is, in the reality of his blessed essence, present in all creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) | section 2, p. 151, ch. 1, Question 5</span></figcaption>

<blockquote><p>God could have created them all at once, but He made them in the space of six days,¹ that He might show… ¹ That opinion of Augustine, that God made all things in a moment and distributed them into days because of our better understanding, is exploded by all. Although Creation was done in a moment, in respect of the particular bodies severally considered, yet in respect of all, it was not perfected in an instant, but in the space of six days; which spaces of days, note not a temporal succession of the same, but the order of diverse works. Some allege [against this the singular word ‘day’ in] Gen. 2:4, but it is not unusual in the Scripture to comprehend many days under the name of one. See Aquinas, [Summa] pt. 1, quest. 74, art. 2.</p></blockquote>

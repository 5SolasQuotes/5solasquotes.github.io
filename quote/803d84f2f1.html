<main class="wrap"><figure class="quote" id="q-803d84f2f1" data-kw="">
<blockquote><p>4. There are places of persecution where no liberty is granted for public assemblies: and places of peace, where Churches have much rest, and great liberty. In places of persecution bounden duties must rather be performed in private, than omitted. For matter of circumstance must give place to matters of substance: matters of conveniency to matters of necessity. Wherefore to leave extraordinary persons to their extraordinary warrant…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Sacrifice: or, a Commentary on the 116th Psalm</cite>, … (1632), Section 115, p. 258, on Ps. 116:19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f78ef9fd2e" data-kw="">
<blockquote><p>A spiritual prayer is accompanied with the use of means… When Hezekiah was sick, he did not only pray for recovery, but he laid a lump of figs to the boil, Isa. 38:21. Thus it is in case of the soul, when we pray against sin, and avoid temptations; when we pray for grace, and improve opportunities, this is the laying a fig to the boil, which will make us recover: To pray for holiness, and neglect the means, is like winding up the clock, and pulling off the weights.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Godly Man’s Picture Drawn with a Scripture Pencil</cite>, (London, 1666), p. 125</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-86f1b7b339" data-kw="">
<blockquote><p>Yea and the Christian king rules over men as men, and also as Christian-men; he rules over them as men, with a dominion over their bodies, lives and goods by his civil laws, he has also dominion as king over men, as Christians and members of Christ’s kingdom and Church, not over their consciences (for that is proper only to the Father of spirits), but he has a coactive [coercive] power over all men, even pastors, as to cause them do their Christian duties, he has power to compel Church-men in assemblies to determine truth, and to use the keys right, and to preach and use the sacraments according as Christ has commanded in his Word, and to punish them when they do otherwise. … I answer, the infallible rule of judging for both [Church and State] is the Word of God, which speaks home impartially to both, if they will hear, but certainly the king’s civil, kingly coactive power to compel men to do their duty remains the highest and most supreme power on earth, in genere potestatis politicae, in ‘the kind of politic-power’, and pastors and all men may by this power be compelled to do right; as for the abuse of the power, it is no part of the power; and in this kind the king has a negative-politic and kingly suffrage [vote] and voice in all Church assemblies, no ecclesiastical constitution has the force of a [civil] law without the politic suffrage of the civil judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 19, ‘…as about… the King’s Power in Things Ecclesiastical’, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>We hold that… Christians are governed by Magistrates, neither as they are Christians, nor as they are men, but as they are subjects, and they are governed by Christian Magistrates as they are Christian subjects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, … (Edinburgh, 1641), p. 42</span></figcaption>

— George Gillespie, An Assertion of the Government of the Church of Scotland… (Edinburgh, 1641), p. 42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+hold+that%E2%80%A6+Christians+are+governed+by+Magistrates%2C+neither+as+they+are+Christians%2C+nor+as+they+are+men%2C+but+as+they+are+subjects%2C+and+they+are+governed+by+Christian+Magistrates+as+they+are+Christian+subjects.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+An+Assertion+of+the+Government+of+the+Church+of+Scotland%E2%80%A6+%28Edinburgh%2C+1641%29%2C+p.+42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff33153f387.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f33153f387.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=We%20hold%20that,Magistrates%20as%20they%20are%20Christian%20subjects&amp;text=We%20hold%20that&amp;text=by%20Christian%20Magistrates%20as%20they%20are%20Christian%20subjects" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-956a73bdb4" data-kw="">
<blockquote><p>Dr. Begg’s ministry in Paisley began under most trying circumstances, as much so as any with which a young minister ever had to contend. In 1832 there was a fearful outbreak of cholera, which visited many parts of the country, carried off many of all classes, and produced terror in the hearts of multitudes who escaped its actual attack. Probably on account of overcrowding and the want of sanitary arrangements, Paisley was one of the places which suffered most severely. The greater portion of the victims were of the destitute, enfeebled, and dissipated classes. But not all. The mansions of the higher classes were not exempt from the visitation. The strong and the fair were among the victims. The virtuous and the pious did not escape. In all faces were traces of deepest sorrow, mingled with the expression of anxiety and alarm. And there was more than simple sorrow, comfortless weeping for the dead because they were not. A strange madness took hold of the minds of the most ignorant portion of the people, and in some cases extended even to some of whom better things might have been expected. The medical men, who battled with the fell disease with all the courage and energy which are nobly characteristic of their profession, were regarded as its abettors. Every case which baffled their skill was regarded as a murder perpetrated by them. This strange and wicked delusion was, unhappily, not confined to Paisley, but it seems to have found there a peculiarly congenial soil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The following historical events are related</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

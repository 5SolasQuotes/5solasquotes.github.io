<blockquote><p>Labour chiefly on the principal points of religion: To bring down the fundamental mysteries of the gospel to the capacities of your hearers, and inculcate on their consciences the great points of union to and fellowship with Christ, regeneration, justification, and sanctification,—these will require all your grace, learning, and labour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Address to Students of Divinity in John Brown and Ebenezer Brown (eds), Select Remains of the Rev. John Brown, Late Minister of the Gospel at Haddington</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf0f47a498" data-kw="">
<blockquote><p>Another ground of love among friends, is societas periculi, et 〈◊〉, when men partake of the same danger or deliverance, as captives under the Turk delivered by the same ransom. This ground of love we have, who being all in danger of hell and become captives of Satan, are delivered by the same ransom, by Christ. This makes friendship and causes love in men that never saw one another before.

3. Now for proximus, it is defined ab use, of the use and benefit that one has by another. God has not given to any man such gifts, but that he needs the gifts of his brother. God has not given all his gifts to any one, and therefore there is none but has need of another: and therefore 〈◊〉 et utilitas, use and utility, are the grounds of propinquity, and make men become proximi, neighbors.

4. Lastly, there is 〈◊〉 instituti; both amongst 〈◊〉, friends and neighbors, all do tendere ad idem, tend to one and the same end; that is, to be partakers of the blessedness, which the angels of God enjoy: for this is institutum 〈◊〉, et proximi 〈◊〉, et amici, et nostrum omnium, the end and scope of my brother, neighbor, friend, and myself, and of all of us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large</cite>, (d. 1626; 1675), 5th Commandment, p. 315</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-ccdcf103c5" data-kw="">
<blockquote><p>4. You [Gilbert Burnet] suggest, that ‘Non-conformists think, they may quit the communion of the Church, if, in their opinion, [the Church is] not in the truth in every point’… in name of all true non-conformists, that as they do not think they may quit the communion of the Church, if in their opinion, [it is] not in the truth, unless the difference be both real [as opposed to only a mistaken perception, etc.], &amp; in profession and practice; so it is not every real difference in profession or practice that they hold to be a sufficient cause; nor do they judge that, even the cause being sufficient, the separation should be always carried to the extremity [furthest point]; but the sound and clear rule which they propose for Christian practice in this matter is that, where the controverted difference is such as would render a conjunction therein either [1.] sinful or [2.] contagious [infectious], then a just and proportionate separation, precisely and with all tenderness, commensurate to the exigence [need], is the safer course.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, ... ([Amsterdam?] 1671), 1st Dialogue, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…whatsoever is wanting [lacking] of that which is commanded, or remaining of that which is forbidden, is not able to put that assembly, which by faith is laid upon Christ, from the right and title of being the Church of Christ: for faith can admit no such thing which gives an utter overthrow and turning upside down of the truth. By this title of ‘the faithful,’ the apostle in his epistles notes out the Churches of God, it being all one with him to say, ‘To the faithful,’ or ‘To the saints,’ as ‘To the Church’ of such a place. Whatsoever wants unto this, or is more than enough that wants, or abounds to the disgrace or uncomeliness or to the hazard of continuance, and not to the present overthrow of the Church. Hereupon the people of Israel, which neglected for the space of forty years the holy sacrament of circumcision and the Passover also as it seems (one only time excepted), ceased not therefore to be the Churches of God and to have the Sanctuary among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, (1584), pp. 7-8 in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>

</figure><figure class="quote" id="q-895f6f5922" data-kw="">
<blockquote><p>Although a Church be defective in purging out of corrupt members, yet that does not pollute the ordinances to others, or necessitate them to separate from them. These Churches continue to be Churches, and the ordinances to be ordinances of Christ, although such were continued in communion with them; and, notwithstanding thereof, these who were free of those corruptions are approven and commended by Jesus Christ: And if it were not so, that a person’s endeavoring in his station to amend such a fault, and to have such scandals censured, did not exempt him from guiltiness so as to continue in Church communion, although the plurality of officers should be short of their duty in that respect; then there might be still separation after separation in infinitum [to infinity].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>The judgments of God do not always follow crimes, as thunder does lightning, but sometimes the space of many ages coming between. When the sun has shined fair the space of six days upon their tabernacle, we know not what clouds the seventh may bring. And when their punishment does come, let them make their account, in the greatness of their sufferings to pay the interest of that respite which has been given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker</cite>, … in Eight Books of Ecclesiastical Polity (d. 1600; London: Newcomb, 1666), A Remedy against Sorrow &amp; Fear, delivered in a Funeral Sermon, p. 546 Note Hooker’s use of the phrase here is not limited to natural days.</span></figcaption>

<blockquote><p>…consider the selection pressures which operated during his presumed rise from the apes… The first [problem] is that on this hypothesis, the only genes that are consistently passed on are the ones for traits which have adaptive value. But obviously this isn’t so. Tell me the adaptive value in seeking to know the meaning of life, or in the ability to be awed, humbled, and transported by the music of J.S. Bach. One eminent sociobiologist claims that we have genes for believing in God, which are adaptive because belief in God unites the social group. Apparently no one told him that believing different things about God can tear the group apart. Besides — why not just have genes for social unity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-budziszewski.html">J. Budziszewski</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What makes Men Men?’, pt. 1</cite>, (2019)</span></figcaption>

<blockquote><p>Intellection can exist (as is plain from our own inner experience); but God, as supreme cause of everything outside himself, must have the perfection of his effects either formally or at least virtually. He does not have intellection merely virtually, because a being that is formally unknowing cannot be the sufficient reason of anything formally knowing, otherwise the effect would be more perfect than its cause; therefore he has intellection formally, which is [the] proposed conclusion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 93-95; p. 96</span></figcaption>

<blockquote><p>33. The divine ideas, therefore, are not the creatures themselves known by God, but are objective reasons, that is, the divine essence itself, conceived by God, insofar as it is imitable by created things: so that the divine exemplar is infinitely more perfect than created things, since it is the divine essence itself known as imitable. 34. But they express the things themselves, because the divine essence, which holds the nature of an idea, insofar as it is known by God, as in tablets by creatures, eminently contains man, for example, of whom it is the idea, as it is imitable by him, and similarly the other things, and represents them most perfectly. 35. The ideas are removed and separated from the commerce of matter and the concretion of singulars. 36. They are eternal, stable, unchangeable, and incorruptible. And they themselves are not formed: just as neither are created ideas made by an artificer, as Plato rightly teaches in the tenth book of the Republic, not far from the beginning. 37. They agree in part with created ideas and in part differ from them. They agree in that both are objective reasons: they differ in that the ideas of the supreme Architect are not things which he intends to produce, as the created ideas of a created artisan. The reason for this distinction is that in the divine essence, which is the primary object of divine understanding, all things that can be made are contained and reflected; therefore, it is necessary that God, in making any work, principally regards the idea of it in his mind and primarily imitates it. In the created artisan, however, the matter is not so, who sometimes changes something as the situation arises and does not always imitate the idea first conceived. They also differ from the conjoined forms of things. For ideas are objective forms, from which imitation is taken, and they always remain outside the essences of made things, not becoming part of them: but the conjoined forms of things are [Hebrew or Greek] forms, constitutive, and part of composite things. Furthermore, ideas are the prototypical reasons of things, of which they are the exemplars: but the conjoined forms, induced into things by God the Creator, are certain principled likenesses of them, which by informing matter comprehend essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, (Hanau, 1609-1610) tr. ChatGPT-4 by Monergism | bk. 5, Creation &amp; Man, ch. 6, ‘On the Definition of the Creature’, pp. 126-28</span></figcaption>

</figure><figure class="quote" id="q-f1d631ae1a" data-kw="">
<blockquote><p>To the eternal decree corresponds temporal execution. For since God neither changes His counsel nor can be hindered by anyone, whatever He decreed with Himself from eternity, He executes outside Himself in time. From the variety of this execution arises the distinction of God’s works. … Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ff29c0ec7" data-kw="">
<blockquote><p>How this Worship is Correspondent to the Nature of God. The Lord does show it in the fourth of John, verses 23 and 24, saying, the true worshippers, shall worship God in spirit and truth, that is in the Spirit of sanctification dwelling in the mind, helping our infirmities with sighs and groans, which cannot be expressed; and in the truth of his Word dwelling in us in all wisdom and spiritual understanding, such as these the Father requires should worship Him, because God is a Spirit, and they that worship Him, must worship Him in spirit and truth, and not in the ignorance of the mind, nor in the invention and will-worship of man; For this cause the Psalmist says in the 51:6, ‘Thou O Lord lovest truth in the inward affections’; and in the 50th Psalm he says, ‘Offer to God the sacrifice of praise, and pay the vows of the Most High, and call upon God; for the Lord loves truth in the inward parts.’ This is the pure and simple worship of God, without the glory and beauty of outward ceremonies, agreeing with the simple pure essence and nature of God Himself. Consider well Paul’s caveat in the Col. 2:8,18,20-23, warning all men to beware of human wisdom, and deceitful inventions and traditions, according to the rudiments of the world, and not after Christ; the outward show of holiness which puffs up men’s hearts with self-conceit, being burdened with traditions, which having a glorious show of holiness, of wisdom and voluntary religion, wherein men are out of measure superstitious in zeal, not sparing their bodily labor.</p></blockquote>

</figure><figure class="quote" id="q-00ec4eb6e3" data-kw="">
<blockquote><p>But as the said Jews, I say, did then refuse such waters, so the said people refusing both the said pure and simple worship of God and true Church discipline, and preferring to it that vain, frothy, pompous, human will-worship, or liturgy of Rome, somewhat refined I confess, but yet the very same in substance, therefore did the Lord bring upon them that proud prelatical, hierarchical Church government, by the means of it, the which has at length broken into England, especially, and has so overflowed and passed through it, that it is come, not only to the neck, but even to the very top of the cheeks and ears of some of the best servants of God…</p></blockquote>

<blockquote><p>With regard to public worship, the Presbyterian system is characterized by great simplicity and plainness. Many have censured the Presbyterian mode of worship as too plain–as not availing itself enough of those external means which tend to excite reverential emotion. But in this point, also, it took for its rule the simplicity of the Scriptures. The great idea presented in the Gospel is spiritual worship, free alike from multitudinous forms that cumber memory and distract the mind, and from a gorgeous apparatus that dazzles and beguiles the senses. Its object is to direct the eye of faith to the Savior alone, and to fill the mind with nothing but sacred truth. Such is scriptural simplicity in worship and in instruction; and this perfect example the Presbyterian Church strove closely to follow. Praise, prayer, and preaching, all simple, all direct, all spiritual, all from the heart, all for God’s glory and man’s salvation, were the sole elements and aim of Presbyterian worship. This was its idea of what public worship ought to be; because this was all for which the Gospel record gave authority. And the Scottish Reformers firmly held that will-worship was sinful and pernicious; that God alone could prescribe what mode of worship would be acceptable in his sight; and that it was equally dangerous to add to, or to take from, whatsoever God had commanded. They had seen too much of the ignorance, folly, and crime prevalent among those who were addicted to the sensuous and emotional worship of Rome, to attach much value to mere forma and show in matters of religion. And when they turned to the pure and simple worship of the New Testament, they beheld in it the majestic simplicity of the clear blue heavens in their cloudless glory. They felt, therefore, that they were rendering homage to the God of heaven best, when they were worshipping Him after the example of the Lord Jesus Christ and his apostles. No other defense for the plainness and simplicity of their mode of worship would they have offered; and no other defense does any true Presbyterian think it can require–perhaps it were more correct to say, in this very simplicity and plainness, so directly scriptural, consists its greatest merit. And it may be safely said, that in no other system has there been produced a greater amount of religious knowledge, strong faith, and practical piety throughout the entire body of worshippers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of the Church of Scotland</cite>, … vol. 1 (1848), ‘Introductory Essay on the Principles &amp; Constitution of the Church of Scotland’, pp. xxix-xxx</span></figcaption>

<blockquote><p>‘Your reasonable service’: This sentence, I think, was added, that he might more clearly apply and confirm the preceding exhortation, as though he had said, — “Offer yourselves a, sacrifice to God, if ye have it in your heart to serve God: for this is the right way of serving God; from which, if any depart, they are but false worshippers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, 12, verse 1</span></figcaption>

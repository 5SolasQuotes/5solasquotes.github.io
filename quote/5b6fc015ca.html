<blockquote><p>52. Because nothing is done without a sufficient Reason (sect. 1), also liberty in election cannot act without reason, we therefore define the same as that faculty of the mind to elect or choose out of more possible things what one pleases, agreeable to proposed reasons. Hence all coaction [coercion] by which man is compelled thorugh extrinsical violence is at a great distance from liberty; metaphysical necessity, where there is but one only object possible, and consequently election ceases, has nothing to do with liberty; also physical necessity (i.e. natural necessity), when there is no knowledge of the objects, is far distant from liberty (or is utterly inconsistent with the very nature of it); but there is only a moral necessity, which is no more than a certainty so that man is sweetly and willingly inclined or moved to this or that thing from these or other motives, namely because he sees what things are best. 53. Hence since liberty of indifference is repugnant to the principle of a sufficient reason, it is utterly impossible (i.e. there is no liberty of indifference); it is a chimera (or a groundless and vain imagination which has no foundation in reason or nature); it is nothing but the mere inaction of the will; besides let those who maintain an indifference of the equilibrium in liberty (or those who place the essence of liberty in the indifference of the will), let them answer us (let them reply to the following queries, viz.), Whether God, the (holy) angels and all the inhabitants of heaven are not most free, or act with the most perfect liberty? and whether they are indifferent about good and evil?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-wyttenbach.html">Daniel Wyttenbach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses, containing the Chief Heads of the Christian Doctrine, Deduced from Axioms… (1747; NY: Samuel Brown, 1766)</cite>, pp. 24-25</span></figcaption>

<blockquote><p>203. He therefore that is so far disposed to any good act, and whose indisposition, or disposition to the contrary, is but such, as that in his present state, without any more help than he has, he can move his own will to the said act, and the difficulty is not so great but that such power sometime does overcome it, is said to have a moral power. But he that wants [lacks] not natural force or power, but only a right disposition of his will, and so far wants it, as that none in his case do ever change their own acts to good, without more help and power than he has, is said to be morally unable or impotent: and not only to want the habit. 204… Unbelievers want not that natural power or faculty, which can believe and repent if duly suscitated and disposed: But through an ill disposition and contrary course of action, and want of due excitation, that power will not act, without God’s special grace. Which ‘will not’ signifies: 1. the undisposedness, 2. the non-agency. And in strictest speech, the former is best expressed by, ‘The will is undisposed and averse to believe, etc.’ and the latter by ‘The will does not consent.’ But the first may be expressed by, ‘It cannot’ because it will not come to pass, though it is no such ‘cannot’ as is distinct from ‘will not,’ but the very same. And as ‘power’ is distinct fom ‘will’ and a man is said to be able to do that which ‘he can do if he will,’ so no doubt but he that will believe and repent, can do it, so far as he is willing. And this is it that [which] Augustine so much pleads for, when he would have us distinguish ‘cannot’ and ‘will not,’ and when he says that Posse credere est omnium; Credere autem fidelium. [To be able to believe is common to all; but actually to believe is the mark of the faithful.] … 213. A man may be able mediately to do that which he is not able immediately to do: I mean he that can write with a pen, or move things with an engine, and so act but as a partial, though principal cause, may not be able to write without a pen, nor to do the same alone as a total cause. 214. And a man may have power to do that mediately and hypothetically hereafter, which he cannot do immediately, that is, at the present time. He can learn to write, and after can write, who cannot write till he hath learned. Thus infants have a remote power of speaking, and infidels of believing.</p></blockquote>

<blockquote><p>From both the faculty of perceiving and of desiring arises then free choice, which is nothing other than the faculty of acting from counsel or rational complacency. It can admit a certain natural indifference, in the divided sense (as they say), but it by no means consists in indifference.</p></blockquote>

<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences | distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that</cite>, bk. 2</span></figcaption>

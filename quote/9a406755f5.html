<main class="wrap"><figure class="quote" id="q-9a406755f5" data-kw="">
<blockquote><p>7. That the same Lord, who has commanded us not to despise prophesying, 1 Thess. 5:19, has also commanded us to prove all things, and to hold fast that which is good, ver. 20. And no[t] to believe every spirit, but to try the spirits, whether they be of God, because many false prophets are gone forth into the world, 1 Jn. 4:1. And that whatsoever is not of faith is sin, Rom. 14:15. And that we ought not to be the servants of men, 1 Cor. 7:23. That is to do things (especially in the matters of God) for which we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (1658)</cite>, pp. 96-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

<blockquote><p>93. Next it may be granted that the matter may be put under a further examination, yet upon condition, that when it is come to the revision of the former sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>111 Propositions</cite></span></figcaption>

</figure><figure class="quote" id="q-41b50b3756" data-kw="">
<blockquote><p>…ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean la Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 71-75 of Ch. 10, ‘Of Ecclesiastical Ordinances’ in The Christian Casuist: or, a Treatise of Conscience (London: 1705) La Placette (1629-1718) was a French Huguenot minister:</cite></span></figcaption>

<blockquote><p>6. Why holds he us [to be] contemners of the Church for not receiving the five Articles of Perth [1618]? We cannot be called contemners for not obeying, but for not subjecting ourselves, wherewith we cannot be charged. Could he not distinguish betwixt subjection and obedience? Art thou a doctor in Israel, and knowest not these things? Nay, art thou a conformist, and knowest not what thy fellow conformists do hold? (Field, Of the Church, bk. 4, ch. 34 &amp; Bilson, apud Parker of the Cross, pt. 2, p. 33)</p></blockquote>

</figure><figure class="quote" id="q-f01b2e689e" data-kw="">
<blockquote><p>If then nothing be good [simply] because rulers command it; but, by the contrary, they do lawfully command it because it is good. The Church’s power is one and the same in things indifferent, and necessary in matters of doctrine, discipline and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find preexistent goodness in doctrine, discipline, and matters of order. Therefore, will of authority, as will, has no power to dispose of the east circumstance of time, place or person; but the Church’s power is ministerial and determined to what is good, expedient and convenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, pp. 648-9</span></figcaption>

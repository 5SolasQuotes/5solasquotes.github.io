<main class="wrap"><figure class="quote" id="q-1195ebf77a" data-kw="">
<blockquote><p>And they two shall be one flesh. They shall be one man, or, to use a common phrase, they shall constitute one person; which certainly would not hold true with regard to any other kind of relationship. All depends on this, that the wife was formed of the flesh and bones of her husband. Such is the union between us and Christ, who in some sort makes us partakers of his substance. “We are bone of his bone, and flesh of his flesh,” (Gen. 2:23;) not because, like ourselves, he has a human nature, but because, by the power of his Spirit, he makes us a part of his body, so that from him we derive our life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, trans. William Pringle (repr. Bellingham, WA: Logos Bible Software, 2010), 324.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e2bfe81dd" data-kw="">
<blockquote><p>We indeed know that repudiation [divorce], properly speaking, had never been allowed by God; for though it was not punished under the [Mosaic] Law, yet it was not permitted. It was the same as with a magistrate, who is constrained to bear many things which he does not approve; for we cannot so deal with mankind as to restrain all vices. It is indeed desirable, that no vice should be tolerated; but we must have a regard to what is possible. Hence Moses has specified no punishment, according to the heinousness of the crime, if one repudiated his wife; and yet it was never permitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-ac520fbb30" data-kw="">
<blockquote><p>Some Citizens at Church prepar’d to pray; But (as they had been excommunicate) The good Church-wardens [lay grounds-keepers, regulated by Church and State] thrust them out the gate. Another country virtue I’ll repeat, The people’s charity was grown so great That whatsoever Londoner did die, In Church or Church-yard should not buried lie. Thus were they scorn’d, despised, banished, Excluded from the Church, alive, and dead, Alive, their bodies could no harbor have, And dead, not be allow’d a Christian grave: Thus was the Country’s kindness cold, and small, No house, no Church, no Christian burial. Oh Thou that on the winged winds dost sit And seest our misery, remedy it, Although we have deserv’d thy vengeance hot, Yet in thy jury (Lord) consume us not. But in thy mercies sheath thy slaying sword, Deliver us, according to thy word, Shut up thy quiver, stay thy angry rod That all the world may know Thou art our God, Oh open wide the gate of thy compassion Assure our souls that thou art our salvation. Then all our thoughts and words, and works, we’ll frame To magnify thy great and glorious Name, The ways of God, are intricate, no doubt Unsearchable, and pass man’s finding out, He at his pleasure worketh wond’rous things And in his hand doth hold the hearts of kings, And for the love, which to our king he bears, By sickness He our sinful Country clears, That he may be a Patron, and a guide Unto a people purg’d and purified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-taylor.html">John Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Fearful Summer, or London’s Calamity, the Country’s Courtesy, and Both their Misery’</cite>, (Oxford, 1625) in All the Works of John Taylor, the Water-Poet Being Sixty and Three in number. Collected into one volume… (London, 1630), pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

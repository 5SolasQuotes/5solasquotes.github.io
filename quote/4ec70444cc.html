<main class="wrap"><figure class="quote" id="q-4ec70444cc" data-kw="">
<blockquote><p>This Argument he explains two ways; First, By shewing, that the Gentiles had certain remnants of the light of Nature, concerning the worshiping of God; because that which may be known of God by natural light, was manifest to them, to wit, The Eternity, Power, and Divinity of God, with the rest of his Attributes, which are apprehended by the light of Nature, even from the Creation of the World, were manifested (by the things that were made) clearly as in a glass, that they could not plead ignorance. …

Secondly, He explains the former Argument, by shewing that the Gentiles detained and imprisoned the known truth, partly, in that they gave not God the glory of his Attributes, and divine works, as also that they were not thankful for his benefits, which the light of Nature would have taught them. Partly, because they became vain in their imaginations, and deceived themselves, being blind where they seemed most of all to be wise, leaving those true Principles concerning God, through their own false reasonings, they drew false conclusions about God, and the worshiping of him.

Lastly, They apparently manifested their ingratitude and folly by their works; they framed the images of men and beasts, whereby they would represent God, or the properties of God, to the eye; thus, as much as in them lay, they changed the glory of God, dishonoured by so vile a comparison, into those abominable images.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 3-4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6af9d79b53" data-kw="">
<blockquote><p>[Chapter 3] CANON IV.

‘Tis true that since the Fall there remain in Man some Relics of Natural Light, by means whereof he yet retaineth some Knowledge of God, and of Natural things, he can discern between what is honest and dishonest, and expresseth some kind of Care and Study for Virtue, and Exterior Discipline. But he is so far from being able by this Light of Nature to attain the saving Knowledge of God, and to return unto him, that he doth not so much as make a right use of it in Natural and Civil things, but rather doth in divers ways soil and pollute it, and holds it under Hatches through Unrighteousness, by doing whereof he is left inexcusable before God.

CANON V.

And as it is with the light of Nature, even just so it is with the Decalogue which God particularly gave unto the Jews; for it doth indeed discover the heinousness of Sin, and doth more and more convince the Conscience of it, but not propounding any Remedy, nor imparting any Strength or Power whereby to get rid of this Misery, and being weak as to the Flesh, it leaves the Transgressor under the Curse, so that he cannot possibly obtain any saving Grace.

CANON VI.

This gift then which neither the Light of Nature, nor the Law of God can give, is wrought effectually by the virtue of the Holy Ghost, through the preaching of the Word, or Ministry of Reconciliation, to wit, the Gospel concerning the Messias, by whom it hath been, and still is the good pleasure of God to save all Believers both under the Old and New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-quick.html">John Quick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Galliâ Reformatâ: or, the Acts, Decisions, Decrees and Canons of the seven last National Councils of The Reformed Churches in France: a work never before Extant in any language. Collected and Composed Out of the original manuscript acts of those councils. VOL. II.</cite>, (2 vols, London: Thomas Parkhurst, 1692), 2: 138-39.</span></figcaption>

</figure><figure class="quote" id="q-b4f52f4f03" data-kw="">
<blockquote><p>The extrinsic arguments or testimonies are:

1. Internal, of synteresis and conscience, Rom. 2, and here about the common notions;

2. External, the consensus of all nations, and the doctrine of all sages. But with all reasons having been subtracted and repeated thoughts more often recurring, we have found that the order both of nature and of our better knowledge is rather to be observed and more safely served in this way, that the demonstration from effects to cause, from works to maker and governor, be put first as preeminent and universal, which embraces all others in itself since indeed all others depend on it and are derived from it, and all presuppose it. For no one doubts that the law of nature and of implanted common notion, and hence the acknowledgment and profession of deity, in addition miracles, prophecies and political order, are to be referred to the works of God. As for those axioms about causes, about motion, about order, those complex principles would not exist unless those things from which induction and finally complex theses and principles arise had been observed in the works of God or creatures; there would not be observation nor induction about and from creatures unless there were creatures. But that this method is safest, most expeditious, and most evident, the doctrine and example of the Holy Spirit persuade Christians, Rom. 1, Ps. 19, Acts 17, Isa. 40, etc. To accuse Him of ignorance or pseudography is atheism lurking under the cloak of a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin, pp. 206-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>Mattson challenged us to answer Richard Gaffin’s exegetical defense of Van Til and presuppositionalism from 1 Corinthians 2:6-16: “The natural man does not accept the things of the Spirit of God.”… In summary, Gaffin argues that “the things of the Spirit of God” which “the natural man does not accept” include all things, not only the content of special revelation but also knowledge of the whole creation which falls under the influence of the inaugurated and coming kingdom of God. Gaffin concludes: “1 Cor 2:6-16 (1:18-3:23) is the death blow to all natural theology” (123)… Gaffin, in order to extract his desired exegetical conclusion, assumes a controversial philosophical doctrine: The British idealist doctrine of holism. Holism is the doctrine that all truths are connected such that a difference at one point affects all points. Only by assuming this doctrine can Gaffin, and Mattson, argue that the natural man’s inability to understand the things of the Spirit of God obviates the possibility of natural law and natural theology. On the contrary, 1 Corinthians 2 was a favorite passage of Thomas Aquinas’s, which provided an exegetical basis for a distinction between the realm of nature and that of grace. Radically non-speculative exegesis of 1 Corinthians 2:6-16, I argue, leaves open all possible orthodox positions on this matter, from Van Til’s to Aquinas’s to my own… Gaffin, noting that verse 22 speaks of “all things” as having been “committed to me by the Father,” argues that “these things” – apparently limited in scope – now include our knowledge of all things. Everything is hidden from the unbeliever; knowledge of anything requires revelation and belief… Their method is the theological method I was taught at Westminster Seminary, what John Murray called, “radically non-speculative theology.” It is the idea that the content of systematic theology can be read directly off the pages of Scripture, redemptive-historically interpreted… an idea like “there is nothing in the entire creation that is irrelevant to the kingdom” is not one of the positions on Christ and culture, a distinctively presuppositionalist one. That is all of the positions… Gaffin infers that, if all things are impacted by the “hidden things,” then our knowledge of anything must begin from knowledge of the “hidden things.” But this inference only follows, given the truth of epistemological holism: The doctrine that the content of truths or facts are not separable but a unified, systematic whole. The authors of Classical Apologetics put it this way: “To know the flower in the wall, you have to know the world and all.” Holism was a central doctrine of the British Idealist philosophers. Cornelius Van Til’s philosophy Ph.D. at Princeton University was on the Idealists (“God and the Absolute”)… Van Til held that, if the Christian faith is true, then no truth is unaffected, truths of logic, mathematics, and scientific observation not excepted. Accordingly, no natural human knowledge, no science or philosophy, is fully true. (It might be “true so far as it goes.”) No natural theology or natural law can be built up from below, because all is affected by the content of special revelation. The question of the legitimacy of this logical leap is a philosophical question, and it is one that divides presuppositionalists from classical apologists… Epistemological holists, by contrast, hold that if thinkers have a difference at one point, then they effectively differ at all points. There are no individual truths, only holistic worldviews. Likewise, you cannot accurately perceive some of the world, some of the truth, but misunderstand other parts. The failure to understand the whole undermines apparent success in analyzing the parts… And on philosophical grounds, I would argue that holism is false. While the world is a unity and one part affects another, our knowledge of the world is separable and incomplete. Some people are masters of international finance and failures at emotional intelligence. Some people know every jot and tittle of Reformed theology but are ignorant of philosophy, economics, and politics. It happens… The incompleteness of this knowledge of morality and God is no knock against it. In fact, on biblical grounds, I would claim that it is such incomplete knowledge that renders people accountable to God (Rom 1:19-20). Often, it is such incomplete knowledge that leads people toward a more complete knowledge of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Mattson challenged us to answer Richard Gaffin’s exegetical defense of Van Til and presuppositionalism from 1 Corinthians 2:6-16: “The natural man does not accept the things of the Spirit of God.”… In summary, Gaffin argues that “the things of the Spirit of God” which “the natural man does not accept” include all things, not only the content of special revelation but also knowledge of the whole creation which falls under the influence of the inaugurated and coming kingdom of God. Gaffin concludes: “1 Cor 2:6-16 (1:18-3:23) is the death blow to all natural theology” (123)… Gaffin, in order to extract his desired exegetical conclusion, assumes a controversial philosophical doctrine: The British idealist doctrine of holism. Holism is the doctrine that all truths are connected such that a difference at one point affects all points. Only by assuming this doctrine can Gaffin, and Mattson, argue that the natural man’s inability to understand the things of the Spirit of God obviates the possibility of natural law and natural theology. On the contrary, 1 Corinthians 2 was a favorite passage of Thomas Aquinas’s, which provided an exegetical basis for a distinction between the realm of nature and that of grace. Radically non-speculative exegesis of 1 Corinthians 2:6-16, I argue, leaves open all possible orthodox positions on this matter, from Van Til’s to Aquinas’s to my own… Gaffin, noting that verse 22 speaks of “all things” as having been “committed to me by the Father,” argues that “these things” – apparently limited in scope – now include our knowledge of all things. Everything is hidden from the unbeliever; knowledge of anything requires revelation and belief… Their method is the theological method I was taught at Westminster Seminary, what John Murray called, “radically non-speculative theology.” It is the idea that the content of systematic theology can be read directly off the pages of Scripture, redemptive-historically interpreted… an idea like “there is nothing in the entire creation that is irrelevant to the kingdom” is not one of the positions on Christ and culture, a distinctively presuppositionalist one. That is all of the positions… Gaffin infers that, if all things are impacted by the “hidden things,” then our knowledge of anything must begin from knowledge of the “hidden things.” But this inference only follows, given the truth of epistemological holism: The doctrine that the content of truths or facts are not separable but a unified, systematic whole. The authors of Classical Apologetics put it this way: “To know the flower in the wall, you have to know the world and all.” Holism was a central doctrine of the British Idealist philosophers. Cornelius Van Til’s philosophy Ph.D. at Princeton University was on the Idealists (“God and the Absolute”)… Van Til held that, if the Christian faith is true, then no truth is unaffected, truths of logic, mathematics, and scientific observation not excepted. Accordingly, no natural human knowledge, no science or philosophy, is fully true. (It might be “true so far as it goes.”) No natural theology or natural law can be built up from below, because all is affected by the content of special revelation. The question of the legitimacy of this logical leap is a philosophical question, and it is one that divides presuppositionalists from classical apologists… Epistemological holists, by contrast, hold that if thinkers have a difference at one point, then they effectively differ at all points. There are no individual truths, only holistic worldviews. Likewise, you cannot accurately perceive some of the world, some of the truth, but misunderstand other parts. The failure to understand the whole undermines apparent success in analyzing the parts… And on philosophical grounds, I would argue that holism is false. While the world is a unity and one part affects another, our knowledge of the world is separable and incomplete. Some people are masters of international finance and failures at emotional intelligence. Some people know every jot and tittle of Reformed theology but are ignorant of philosophy, economics, and politics. It happens… The incompleteness of this knowledge of morality and God is no knock against it. In fact, on biblical grounds, I would claim that it is such incomplete knowledge that renders people accountable to God (Rom 1:19-20). Often, it is such incomplete knowledge that leads people toward a more complete knowledge of God.”

— Joel Carini, ”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology, (2024)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMattson+challenged+us+to+answer+Richard+Gaffin%E2%80%99s+exegetical+defense+of+Van+Til+and+presuppositionalism+from+1+Corinthians+2%3A6-16%3A+%E2%80%9CThe+natural+man+does+not+accept+the+things+of+the+Spirit+of+God.%E2%80%9D%E2%80%A6+In+summary%2C+Gaffin+argues+that+%E2%80%9Cthe+things+of+the+Spirit+of+God%E2%80%9D+which+%E2%80%9Cthe+natural+man+does+not+accept%E2%80%9D+include+all+things%2C+not+only+the+content+of+special+revelation+but+also+knowledge+of+the+whole+creation+which+falls+under+the+influence+of+the+inaugurated+and+coming+kingdom+of+God.+Gaffin+concludes%3A+%E2%80%9C1+Cor+2%3A6-16+%281%3A18-3%3A23%29+is+the+death+blow+to+all+natural+theology%E2%80%9D+%28123%29%E2%80%A6+Gaffin%2C+in+order+to+extract+his+desired+exegetical+conclusion%2C+assumes+a+controversial+philosophical+doctrine%3A+The+British+idealist+doctrine+of+holism.+Holism+is+the+doctrine+that+all+truths+are+connected+such+that+a+difference+at+one+point+affects+all+points.+Only+by+assuming+this+doctrine+can+Gaffin%2C+and+Mattson%2C+argue+that+the+natural+man%E2%80%99s+inability+to+understand+the+things+of+the+Spirit+of+God+obviates+the+possibility+of+natural+law+and+natural+theology.+On+the+contrary%2C+1+Corinthians+2+was+a+favorite+passage+of+Thomas+Aquinas%E2%80%99s%2C+which+provided+an+exegetical+basis+for+a+distinction+between+the+realm+of+nature+and+that+of+grace.+Radically+non-speculative+exegesis+of+1+Corinthians+2%3A6-16%2C+I+argue%2C+leaves+open+all+possible+orthodox+positions+on+this+matter%2C+from+Van+Til%E2%80%99s+to+Aquinas%E2%80%99s+to+my+own%E2%80%A6+Gaffin%2C+noting+that+verse+22+speaks+of+%E2%80%9Call+things%E2%80%9D+as+having+been+%E2%80%9Ccommitted+to+me+by+the+Father%2C%E2%80%9D+argues+that+%E2%80%9Cthese+things%E2%80%9D+%E2%80%93+apparently+limited+in+scope+%E2%80%93+now+include+our+knowledge+of+all+things.+Everything+is+hidden+from+the+unbeliever%3B+knowledge+of+anything+requires+revelation+and+belief%E2%80%A6+Their+method+is+the+theological+method+I+was+taught+at+Westminster+Seminary%2C+what+John+Murray+called%2C+%E2%80%9Cradically+non-speculative+theology.%E2%80%9D+It+is+the+idea+that+the+content+of+systematic+theology+can+be+read+directly+off+the+pages+of+Scripture%2C+redemptive-historically+interpreted%E2%80%A6+an+idea+like+%E2%80%9Cthere+is+nothing+in+the+entire+creation+that+is+irrelevant+to+the+kingdom%E2%80%9D+is+not+one+of+the+positions+on+Christ+and+culture%2C+a+distinctively+presuppositionalist+one.+That+is+all+of+the+positions%E2%80%A6+Gaffin+infers+that%2C+if+all+things+are+impacted+by+the+%E2%80%9Chidden+things%2C%E2%80%9D+then+our+knowledge+of+anything+must+begin+from+knowledge+of+the+%E2%80%9Chidden+things.%E2%80%9D+But+this+inference+only+follows%2C+given+the+truth+of+epistemological+holism%3A+The+doctrine+that+the+content+of+truths+or+facts+are+not+separable+but+a+unified%2C+systematic+whole.+The+authors+of+Classical+Apologetics+put+it+this+way%3A+%E2%80%9CTo+know+the+flower+in+the+wall%2C+you+have+to+know+the+world+and+all.%E2%80%9D+Holism+was+a+central+doctrine+of+the+British+Idealist+philosophers.+Cornelius+Van+Til%E2%80%99s+philosophy+Ph.D.+at+Princeton+University+was+on+the+Idealists+%28%E2%80%9CGod+and+the+Absolute%E2%80%9D%29%E2%80%A6+Van+Til+held+that%2C+if+the+Christian+faith+is+true%2C+then+no+truth+is+unaffected%2C+truths+of+logic%2C+mathematics%2C+and+scientific+observation+not+excepted.+Accordingly%2C+no+natural+human+knowledge%2C+no+science+or+philosophy%2C+is+fully+true.+%28It+might+be+%E2%80%9Ctrue+so+far+as+it+goes.%E2%80%9D%29+No+natural+theology+or+natural+law+can+be+built+up+from+below%2C+because+all+is+affected+by+the+content+of+special+revelation.+The+question+of+the+legitimacy+of+this+logical+leap+is+a+philosophical+question%2C+and+it+is+one+that+divides+presuppositionalists+from+classical+apologists%E2%80%A6+Epistemological+holists%2C+by+contrast%2C+hold+that+if+thinkers+have+a+difference+at+one+point%2C+then+they+effectively+differ+at+all+points.+There+are+no+individual+truths%2C+only+holistic+worldviews.+Likewise%2C+you+cannot+accurately+perceive+some+of+the+world%2C+some+of+the+truth%2C+but+misunderstand+other+parts.+The+failure+to+understand+the+whole+undermines+apparent+success+in+analyzing+the+parts%E2%80%A6+And+on+philosophical+grounds%2C+I+would+argue+that+holism+is+false.+While+the+world+is+a+unity+and+one+part+affects+another%2C+our+knowledge+of+the+world+is+separable+and+incomplete.+Some+people+are+masters+of+international+finance+and+failures+at+emotional+intelligence.+Some+people+know+every+jot+and+tittle+of+Reformed+theology+but+are+ignorant+of+philosophy%2C+economics%2C+and+politics.+It+happens%E2%80%A6+The+incompleteness+of+this+knowledge+of+morality+and+God+is+no+knock+against+it.+In+fact%2C+on+biblical+grounds%2C+I+would+claim+that+it+is+such+incomplete+knowledge+that+renders+people+accountable+to+God+%28Rom+1%3A19-20%29.+Often%2C+it+is+such+incomplete+knowledge+that+leads+people+toward+a+more+complete+knowledge+of+God.%E2%80%9D%0A%0A%E2%80%94+Joel+Carini%2C+%E2%80%9DThe+Natural+Man+does+Not+Accept+the+Things+of+the+Spirit+of+God%E2%80%99+%E2%80%93+But+He+Can+Accept+Natural+Theology%2C+%282024%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaf88a4b2d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaf88a4b2d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-theology/#:~:text=Mattson%20challenged%20us%20to%20answer%20Richard,a%20more%20complete%20knowledge%20of%20God&amp;text=Mattson%20challenged%20us%20to%20answer%20Richard%20Gaffin%E2%80%99s%20exegetical&amp;text=people%20toward%20a%20more%20complete%20knowledge%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>

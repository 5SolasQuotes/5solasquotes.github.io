<main class="wrap"><figure class="quote" id="q-4c53765dbf" data-kw="pelagius">
<blockquote><p>The ancient Pelagians, following their master, the British Pelagius, denied original sin as to all its parts, maintaining that Adam’s sin hurt no one but himself; or if it may be said to have hurt others, it does so only as to example and imitation, not as to propagation. Therefore, the question between us and our opponents is whether there is any inherent depravity (called original sin) propagated from Adam to all his posterity springing from him by natural generation. They deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.10.5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/pelagianism-and-semi-pelagianism.html">Pelagianism and Semi-Pelagianism</a> › <a href="../topics/sin/pelagianism-and-semi-pelagianism/pelagius-and-the-denial-of-original-sin.html">Pelagius and the denial of original sin</a></span><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a> › <a href="../topics/sin/original-sin/imputation-of-adams-sin.html">Imputation of Adam&#x27;s sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin The Fall Depravity">
<blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 15</span></figcaption>

</figure><figure class="quote" id="q-3630fcaed0" data-kw="Original Sin Author of sin Justice">

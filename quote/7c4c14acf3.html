<main class="wrap"><figure class="quote" id="q-7c4c14acf3" data-kw="">
<blockquote><p>We must hold this doctrine and not listen to those who preach faith in Christ in such a way as to insist that we are justified not by it alone but by it in combination with our works. The sum of their teaching is that faith justifies us by the works that we do in faith. The glory of justification by faith is attributed to nothing other than the fact that it is by faith that we come to a knowledge of Christ. Here [Galatians 2:16] Paul says that it is by faith alone because he simply rejects works altogether.

His quarrel was not with people who denied the role of faith outright but with those who denied that it was sufficient to justify and save us. Paul affirms the doctrine and at the same time excludes the works of the law, from which it follows that all the praise should be ascribed to faith alone. What other works deserve to be associated with faith when no room is given to those things that are done according to the prescription of the law of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

>Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed27b9bc75" data-kw="">
<blockquote><p>For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae theologicae: liber unus</cite>, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?”

— Theodore Beza, Epistolae theologicae: liber unus, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+what+is+vainer+than+regarding+someone+as+righteous+who+has+not+kept+the+law%3F+Yet+the+law+not+only+forbids+that+anything+be+done+which+it+condemns+%28to+which+is+attached+a+threatening+with+death%29+but+also+prescribes+the+outcome+of+what+it+enjoins+%28to+which+is+attached+the+promise+of+life%29.+Thus%2C+whoever+in+Christ+is+judged+to+be+%E2%80%98no+sinner%E2%80%99+has+indeed+evaded+death%3B+but+on+the+grounds+of+what+other+right+would+anyone+demand+life%2C+other+than+that+he+has+in+Christ+fulfilled+all+the+righteousness+of+the+law%3F%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Epistolae+theologicae%3A+liber+unus%2C+%28Geneva%3A+Vignon%2C+1573%29%2C+Epistle+35%2C+to+Olevianus+%281560%29%2C+p.+200+as+trans.+G.A.+van+den+Brink%2C+The+Transfer+of+Sin%E2%80%A6+%28Brill%2C+2024%29%2C+p.+219+cf.+Epistle+45%2C+p.+228&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed27b9bc75.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed27b9bc75.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=For%20what%20is%20vainer%20than%20regarding,all%20the%20righteousness%20of%20the%20law&amp;text=For%20what%20is%20vainer%20than%20regarding%20someone%20as&amp;text=Christ%20fulfilled%20all%20the%20righteousness%20of%20the%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3e2d83e76c" data-kw="">
<blockquote><p>It never was the doctrine of the Reformation, or of the Lutheran and Calvinistic divines, that the imputation of righteousness affected the moral character of those concerned. It is true, whom God justifies he also sanctifies; but justification is not sanctification, and the imputation of righteousness is not the infusion of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @5Solas2</cite>, Oct 21, 2024</span></figcaption>

— Charles Hodge, Quoted on X by @5Solas2, Oct 21, 2024">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+never+was+the+doctrine+of+the+Reformation%2C+or+of+the+Lutheran+and+Calvinistic+divines%2C+that+the+imputation+of+righteousness+affected+the+moral+character+of+those+concerned.+It+is+true%2C+whom+God+justifies+he+also+sanctifies%3B+but+justification+is+not+sanctification%2C+and+the+imputation+of+righteousness+is+not+the+infusion+of+righteousness.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Quoted+on+X+by+%405Solas2%2C+Oct+21%2C+2024&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e2d83e76c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e2d83e76c.html">Permalink</a><a class="src" href="https://x.com/5Solas2/status/1848274775866585095" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-798c9ac4e0" data-kw="">
<blockquote><p>As for the last of them, which answers first in this 13th verse, he says that it is not sufficient for justification before God to have received the law, and simply to be hearers of it; but that must be observed and reduced to practice. This is incontestable truth. For the law has not been given as a matter of curiosity or contemplation as a philosophical science, but to be obeyed; and the greatest outrage against the law and the Legislator, is to hear it and not to take heed practice it. It will be in vain, therefore, for the Jew to say, I am a hearer of the law, I attend on its services, I belong to the covenant of God, who has given me his testimonies. On all these accounts, being a transgressor, as he is, he must be condemned. The presence of the article before the word law in both the clauses of this verse, which is wanting in the preceding verse, shows that the reference is to the Jews under the written law. The doers of the law shall be justified—By this we must understand an exact obedience to the law to be intended, which can defend itself against that declaration, ‘Cursed is every one that continueth not in all things which are written in the book of the law to do them.’ For it is not the same with the judgement of the law as with that of grace. The Gospel indeed requires of us a perfect obedience to its commands, yet it not only provides for believers’ pardon of the sins committed before their calling, but of those also which they afterwards commit. But the judgment of the law admits of no indulgence to those who are under it; it demands a full land perfect personal observance of all its requirements—a patient continuance in well-doing, without the least deviation, or the smallest spect of sin; and when it does not find this state of perfection, condemns the man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-haldane.html">Robert Haldane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Epistle to the Romans</cite>, (Edinburgh: The Banner of Truth, repr. 1996), 89 (On Romans 2:13).</span></figcaption>

</figure><figure class="quote" id="q-7d996b190a" data-kw="">
<blockquote><p>The incarnation of Christ was once done and is not to be done again; but remission of sin is so done as that it is continually to be done for us, and the ultimate complete effect of it will then only be when sin shall be quite taken away, so that a total and full remission will be only at the Day of Judgment, as appears, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come:’ Not but that every sin here forgiven is fully and perfectly forgiven, but because we renew sin daily, therefore there is need of a daily pardon: Away therefore with all such opinions as shall either plead such an inherent righteousness in the Pelagian way, or such an imputed righteousness in the Antinomian way that will overthrow this petition [in the Lord’s prayer] for forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, 14.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

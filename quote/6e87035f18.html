<main class="wrap"><figure class="quote" id="q-6e87035f18" data-kw="">
<blockquote><p>The power of God in its second meaning, δύναμις (dunamis) in Greek, and potentia in Latin, refers to the power and strength of God whereby He is able to execute and accomplish everything which is in agreement with His character and His truth—also to create whatever is conceivable and to do whatever He wishes to do. From stones He is able to raise up children unto Abraham (Matthew 3:9), that is, to create human beings from a lump of clay as He did in the beginning, and make such human beings partakers of both the faith and life of Abraham. God could even create thousands of worlds. In a word, God’s power is unlimited.

One could imagine the creation of many things which would be contrary to the nature and truth of God. One could speculate about imaginary things which bear no resemblance to a creature. To relate this to the omnipotence of God and to ask whether God would be able to perform such things, is to entertain thoughts about God which are void of reverence and godly fear. Whatever is contradictory to the nature and truth of God, as well as contrary to the essential nature of a creature, is no reflection upon the power of God. Far be it from us to attribute this to the omnipotent and holy God. “Far be it from God, that He should do wickedness; and from the Almighty, that He should commit iniquity” (Job 34:10).

God can neither deny Himself (2 Timothy 2:13), nor can He lie or deceive (Titus 1:2). “It was impossible for God to lie” (Hebrews 6:18). Even though God has eternally been capable of creating a world, it does not follow that the world could have existed eternally. “Yes” and “no” are at all times opposites and cannot be simultaneous realities. One and the same body, one and the same man, cannot be simultaneously present at many places which are far removed from each other. These and a thousand-fold more things do not appertain to omnipotence.

Nevertheless, we maintain that God by His omnipotence is able to accomplish whatever He will even beyond what He has willed, as well as whatever He would will. His arm is not shortened and therefore He is called the Almighty. “I am the Almighty God” (Genesis 17:1); “When the Almighty was yet with me” (Job 29:5); “… saith the Lord Almighty” (2 Corinthians 6:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 131-32.</span></figcaption>

<blockquote><p>1. Voluntas essentialis and voluntas personalis. This is an admittedly rare distinction, given the Reformed orthodox unwillingness to speculate into the doctrine of the Trinity in a manner like that of the medieval doctors. This distinction parallels, of course, the basic distinction of properties of the Godhead into proprietates essentiales and proprietates personales. Thus, the voluntas essentialis is simply the will of God, understood as an essential property or as a faculty of the divine life. The ‘essential’ will of God can also be termed the voluntas realis, namely, will by which God discerns all things existent or nonexistent. The voluntas personalis, then, can only relate to the inward begetting and proceeding of the persons of the Trinity, understood as somehow belonging to the divine willing–as such, this language relates also to the concept of a necessary divine will, the voluntas necessaria. Thus, God the Father necessarily wills to beget God the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 2nd</cite>, ed. (Baker Academic, 2003), vol. 3, p. 453</span></figcaption>

<blockquote><p>[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.</p></blockquote>

<blockquote><p>And so in all the commandments of God, we must understand the will of God to be either (Zanchi, Of the Nature of God, ch. 3):

1. Declarans [declaring]

2. Efficiens [effecting] The first is that which shows what should be done, and so the Law is called doctrina, a rule which shows us what pleases or displeases God. The second is that which causes us to do what is pleasing to Him, and so the Law is called mandatum [a commandment], when He makes the elect to walk in his paths (Eze. 11:20), or works faith in their hearts to believe in Christ. The 1. may be broken by the wicked. The 2. cannot: ‘For my counsel shall stand, and my will shall be done, says the Lord.’ (Isa. 46) But then it may be objected that the wicked sin not, because they do not break or do any thing against the absolute and proper will of God. I answer: That sin is not defined to be the transgressing of the secret will of God which cannot be broken, but of his declared and revealed will (Zanchi, bk. 3, ch. 4, Of the Nature of God), which only shows what is pleasing or displeasing to Him. Hereby then you see the will of God is only one, immutable and unchangeable, and that although He gives his Law unto all, yea, both legem operandi and lege credendi [the law to be worked and the law to be believed], to show what should be done and what should be believed; yet it is not his absolute will that all men should either do or believe the same, that they might be saved. For if it were, who could resist it? (Rom. 9:19)</p></blockquote>

1. Declarans [declaring]

2. Efficiens [effecting] The first is that which shows what should be done, and so the Law is called doctrina, a rule which shows us what pleases or displeases God. The second is that which causes us to do what is pleasing to Him, and so the Law is called mandatum [a commandment], when He makes the elect to walk in his paths (Eze. 11:20), or works faith in their hearts to believe in Christ. The 1. may be broken by the wicked. The 2. cannot: ‘For my counsel shall stand, and my will shall be done, says the Lord.’ (Isa. 46) But then it may be objected that the wicked sin not, because they do not break or do any thing against the absolute and proper will of God. I answer: That sin is not defined to be the transgressing of the secret will of God which cannot be broken, but of his declared and revealed will (Zanchi, bk. 3, ch. 4, Of the Nature of God), which only shows what is pleasing or displeasing to Him. Hereby then you see the will of God is only one, immutable and unchangeable, and that although He gives his Law unto all, yea, both legem operandi and lege credendi [the law to be worked and the law to be believed], to show what should be done and what should be believed; yet it is not his absolute will that all men should either do or believe the same, that they might be saved. For if it were, who could resist it? (Rom. 9:19)”

.1589%E2%80%931672%29+was+an+Anglican+bishop%2C+opposed+to+the+puritans.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06dacfd041.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/06dacfd041.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-signified-will-or-will-of-sign/#:~:text=And%20so%20in%20all%20the%20commandments,who%20could%20resist%20it%3F%20%28Rom.%209%3A19&amp;text=And%20so%20in%20all%20the%20commandments%20of%20God&amp;text=it%20were%2C%20who%20could%20resist%20it%3F%20%28Rom.%209%3A19" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For it is commonly conceded today that a composition in concepts does not argue to a real composition in the thing. For if the formal notion of one perfection (for example knowing, even if the knowing is omniscient) does not include the formal notion of another perfection (for example loving, even if the loving is altogether perfect), then to be sure this fact does not necessarily imply that both perfections have, in respect of the thing (e.g. God), the idea of parts and so the idea of being mutually perfectible. But this condition would be required for having composition on the part of the thing. If we were able to conclude anything from the conceptual separability of one perfection from another, then some non-identity on the part of the thing would be proved (as a virtual or so-called formal non-identity, which we will deal with in the treatment of the formal distinction). But such a non-identity implies neither composition nor imperfection in the being that has those perfections. At most, indeed, a reason is to be sought why one such perfection is found in the same thing along with another perfection not included in the formal concept of the first, but I do not know why the only adequate assignable reason for explaining it must be found in a mutual perfectability (a perfectibility after the manner of parts) that those perfections have on the side of the thing. But if anyone wishes to dispute this question, let him do so.</p></blockquote>

<blockquote><p>…an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. [That is, a magistrate not doing these ennumerated things is still a valid magistrate.] For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [from the nature of the magisterial work], and operantium [from the nature of the persons working by the office]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither from the nature or the intention of the work of magistracy, nor from the nature of the magistrate working]…</p></blockquote>

gistrate%20working" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is an agreed principle of theological and sociological teaching that Catholic citizens should not vote for leaders who are inimical to Christianity… It is, however, held to be lawful to vote for an unworthy candidate in certain circumstances—for instance, if this is necessary to exclude an even more unsuitable one, or if failure to vote for a particular candidate would involve disproportionate personal loss, or if there is good hope, all things considered, that the election of this candidate may ultimately conduce to the common good… To sum up then: we agree that normally Catholics should not vote for non-Christian candidates. But if it is clear, when account is taken of the circumstances of person and place, that a particular non-Christian candidate is willing to act in accordance with Christian principles, we think that it is not unlawful to vote for him…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-canon-mccarthy.html">John Canon McCarthy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems in Theology II: the Commandments (Dublin, 1959), sect. 2, 1st &amp; 2nd Commandments, ‘The Morality of Voting for Non-Christians’, pp. 86-88 McCarthy was a Romanist professor of moral theology.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

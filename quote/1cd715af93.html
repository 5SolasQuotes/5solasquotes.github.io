<main class="wrap"><figure class="quote" id="q-1cd715af93" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are:

I. Real and passive, or received, union with Christ, and ingrafting into the new covenant, and thus communion of all goods in Christ.

II. Passive reconciliation and justification (as they call it), or rather internal, in us—from which is distinguished external or active justification, which is concerning us. Furthermore, this necessary distinction [between active and passive justification] has been illustrated above all others, and clearly and solidly defended by Dr. [Johannes] Maccovius in his Theological Collection, pt. 4, Disputation 9, compared with pt. 3, Disputation 16, and his particular syllabus of disputations on Justification. And we in the Problems on Justification shall vindicate it ἐν παρόδῳ [en parodō, in passing] from certain objections. There is no reason therefore to pursue it here at greater length. Only I add these three things for the sake of younger students:

      1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.

      2. That active justification is distinguished from the decree of justification, as the execution of a decree from the decree, and the emanating action of God from the immanent. Just as the decree of creation must necessarily be distinguished from creation itself.

      3. That the same was accomplished fundamentally and κατ’ ἐπαγγελίαν [kat’ epangelian, according to promise] in the first institution, contracting, and promulgation of the new covenant, Gen. 3 [v. 15]; consummatively in the cross and resurrection of Christ, Rom. 8:32–33; 2 Cor. 5:18–19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 447 ff. Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>The Covenant of Redemption is two ways considered:

</figure><figure class="quote" id="q-b684704658" data-kw="">
<blockquote><p>Here note well that we thought meet before we expressed the particular works of the Spirit in believers, to mention first the relative change of their states, which in order goes between their believing and their further sanctification: These we have expressed in four terms: The first in order is our conjunction to Christ as our Head, called by divines, our union with Him. The second is our membership in the universal Church, which is his body. The third is our pardon or justification. The fourth is our adoption. Where note:

1. That we call not these ‘the works of the Spirit,’ but put them in as in a parenthesis between our believing and the works of the indwelling Spirit.

2. Yet we choose rather to put them in this part of our Profession than the former, because as no man has right to these benefits but through faith, so though they are not the effects of that faith (which the Spirit works), yet are they consequents of it by virtue of Christ’s promise or New Law; and though faith be not the cause of them in strict sense, yet it is the condition of our right in them. And therefore they seem here to be placed, as divines commonly do, between faith and sanctification.</p></blockquote>

1. That we call not these ‘the works of the Spirit,’ but put them in as in a parenthesis between our believing and the works of the indwelling Spirit.

2. Yet we choose rather to put them in this part of our Profession than the former, because as no man has right to these benefits but through faith, so though they are not the effects of that faith (which the Spirit works), yet are they consequents of it by virtue of Christ’s promise or New Law; and though faith be not the cause of them in strict sense, yet it is the condition of our right in them. And therefore they seem here to be placed, as divines commonly do, between faith and sanctification.”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+note+well+that+we+thought+meet+before+we+expressed+the+particular+works+of+the+Spirit+in+believers%2C+to+mention+first+the+relative+change+of+their+states%2C+which+in+order+goes+between+their+believing+and+their+further+sanctification%3A+These+we+have+expressed+in+four+terms%3A+The+first+in+order+is+our+conjunction+to+Christ+as+our+Head%2C+called+by+divines%2C+our+union+with+Him.+The+second+is+our+membership+in+the+universal+Church%2C+which+is+his+body.+The+third+is+our+pardon+or+justification.+The+fourth+is+our+adoption.+Where+note%3A+1.+That+we+call+not+these+%E2%80%98the+works+of+the+Spirit%2C%E2%80%99+but+put+them+in+as+in+a+parenthesis+between+our+believing+and+the+works+of+the+indwelling+Spirit.+2.+Yet+we+choose+rather+to+put+them+in+this+part+of+our+Profession+than+the+former%2C+because+as+no+man+has+right+to+these+benefits+but+through+faith%2C+so+though+they+are+not+the+effects+of+that+faith+%28which+the+Spirit+works%29%2C+yet+are+they+consequents+of+it+by+virtue+of+Christ%E2%80%99s+promise+or+New+Law%3B+and+though+faith+be+not+the+cause+of+them+in+strict+sense%2C+yet+it+is+the+condition+of+our+right+in+them.+And+therefore+they+seem+here+to+be+placed%2C+as+divines+commonly+do%2C+between+faith+and+sanctification.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity%2C+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98A+Brief+Explication+of+some+Passages+in+the+Profession%E2%80%99%2C+p.+24&amp;url=https%3A%2F%2F5solasquotes.github.

<main class="wrap"><figure class="quote" id="q-97333e61c1" data-kw="">
<blockquote><p>That seeing Politique Lawes should be laid in with Moral possibility, and multiplicity of commands makes them impossible, as well as the difficulty of the duties; therefore it is believed a good course not to over-lay any State with positive penal Laws, promissory Oaths, discovering Subscriptions, or multitude of Ceremonies; especially a Church that hath the Law of God as a perfect rule of Doctrine, Manners, and necessary Discipline:

But let the things be few that are required, and then let them be strongly commanded. For many indifferent things have cost too dear, having been put on too hard upon pious and peaceable men, without any accommodation or toleration: Thus without cases reserved to an arbitrary power, conscientious men may be moderately dealt with, that they complain not of a rigorous remedy as a grievance and persecution of mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/calybute-downing.html">Calybute Downing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerations Toward a Peaceable Reformation in Matters Ecclesiastical. Submitted to the Judicious Reader</cite>, (London: Richard Hearn, 1641), p. 8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-70b462bc5a" data-kw="">
<blockquote><p>Q. What if by the wrong a man does me, I observe such infirmity, yea and iniquity to be in him, as by experience I find him to be a far other man than at first I supposed him to be, ought I notwithstanding to make such account of him as I did before? A. We must put difference betwixt a wrong done upon such an occasion as may afterwards be avoided, and that which is done upon an evil disposition, which remaining in a man, may be a means to make him continue to do more and more wrongs. The wrong of the former must be so forgiven, as the wrong doer be so accepted as if he had done no wrong at all. As for the latter, we are to try if he may be brought to sight of his evil disposition, and to repentance for the same. If he be, then ought we to esteem him as if he never had done us any hurt. But if obstinately he persist in that evil disposition, and be like, on all occasions, again and again to wrong us, though we do, as we ought, fully forgive all the wrongs done, and neither take any present revenge, nor keep them in mind and memory for any future revenge, yet may we in our judgment esteem him to be such an one as we find him to be. (Woe to them that call evil good: that put light for darkness, and sweet for bitter.) For example, if I find one of whom I have had a very good account, and thereupon used him very familiarly, to have no command of his tongue, but on all occasions to be ready to blab out, and blaze abroad whatsoever he sees or hears, if therein he have wronged me, I may forbear to use him so familiarly as I did before, and take heed what secrets I communicate to him, though I fully forgive the wrong that is past. Or if I have accounted one to be an entire friend to me, but by experience find him to be hollow-hearted, and maliciously minded against me, I ought wisely and warily to avoid his society, and to take heed of the snares which he lays for me. (For which we have the pattern of David, and Christ) yet so to pass by the wrongs done as if none had been done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God</cite>, (London, 1626), §148. ‘Of a full forgiving one another,’, pp. 186-87</span></figcaption>

</figure><figure class="quote" id="q-f0d502f708" data-kw="">
<blockquote><p>Is it of no importance whether the Son of God actually came in the flesh? Is it of no importance whether he actually died on the tree for our sins? Whether he actually rose again for our justification? Whether he actually ascended to heaven and sits there on his throne, the Lord of the world? Beautiful dreams these! But if only beautiful dreams! How dreadful to have only an imaginary Saviour and an imaginary salvation. But this is precisely what we must come to on the principle that it is the ideal, not the real that counts in the religious life.

It makes no difference what actually happened so only prophets and sages and apostles have risen to these great conceptions – if the independence of the ideal on the real is the most important lesson of religious thinking – why, then, we must be prepared to satisfy ourselves with a Christianity innocent of a real Redeemer and a real Redemption. Are we content to be saved from sin only an idea – to “go to heaven” only in imagination?

And this leads us to a right estimate of the assertion that is now so constantly made all about us, that Christianity has nothing to fear from the criticism which is evaporating (to its own satisfaction) the historicity of the Bible narratives. That depends on what Christianity is. If it is a religion that is founded on the actual – if it is a religion of fact – if it has any historical content – it is evaporated with its history. If it is a religion of “ideas,” it is of course unaffected by the destruction of any history that may have become accidentally associated with it.

But in that case, it is not Christianity in any intelligible sense; it is nothing but a natural religion – a religion of “eternal verities” – as inoperative as all the rest of its fellows actually to save, though it may be infinitely superior to its fellows in the loftiness of its conceptions. A God who is only an idea, and who never intervenes in the world of fact, can never actually save a soul that is read from sin that is real.

For the actual salvation of an actual sin-stricken soul we require an actual Redeemer who has actually intervened in the actual course of history. … Christianity is a historical religion, all of whose doctrines are facts. He who assaults the trustworthiness of the record of the intervention of God for the redemption of the world, is simply assaulting the heart of Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>How to get rid of Christianity (1900) in Selected Shorter Writings of Benjamin B. Warfield</cite></span></figcaption>

</figure><figure class="quote" id="q-744ddd16ab" data-kw="">
<blockquote><p>Of these two conflicting systems of religion, the one has its centre in the truth. The truth as it is in Jesus, is its sun. Around this, all revolves, and to this all is subordinated. It is essentially tolerant of diversities of form, where the truth is preserved and honoured. … The other system revolves around the form. It asks not simply is the truth held, but how it is held. Orders, rites, ceremonies, are the grand principles on which it rests the weightier matters of its law. And by a very natural consequence, one indeed which results from the laws of our being, this undue exaltation of the form, draws after it a corresponding depreciation of the spirit. The apotheosis of external religion, is the dethronement of the internal and the spiritual, and to a greater or less extent, this result is unvarying. Go where you will among the adherents of this system, and you find a latitudinarian tolerance of diversities of doctrine, prevailing in exact proportion to the rigidness of the demand for uniformity of practice in the observances of religion.

Not unfrequently this laxity of doctrine is boasted of, as an ornament and trusted in as a secret of strength. You may believe what you will, within certain very broad and somewhat dimly defined limits, provided the loved and cherished form is observed. The very Church that, avowedly, so framed its declarations of truth as to comprehend well nigh all shades of theological opinion, even inviting to her bosom those who held some of the grand distinguishing principles of the great anti-christian apostacy, takes its position with unflinching firmness on the ground of rites and ceremonies, and cuts off from Church relationship, and valid ordinances, and abandons to the uncovenanted mercies of God, all who do not use her Shibboleth. She drowns the voice of admitted truth and piety, pleading for Christian recognition and fellowship, with the deafening cry “great is Diana of the Ephesians.” Instead of seeking for the living spirit of Christianity, and recognizing it when found; this system of externalism is satisfied with the lifeless corpse, from which the animating spirit has fled, provided you give it

Before decay’s effacing fingers

Have swept the lines where beauty lingers.

Instead of giving free scope to the spirit, allowing it to develop itself, controlled by no laws save those God has given, it forms an encrustation around it, compelling all its growth, if it grow at all, to a conformity to its fossil mould. In short its body is more a mummy than a man.

Now between these two rival systems every man must make his choice. He cannot serve God and Mammon. He cannot have two supreme tests of the Church. These systems are antagonistic, and every man must array himself with the one or the other. And the gathering with one, is scattering abroad so far as the other is concerned. If his system is distinctively ritual, the spirit must be neglected. Dethroned from its rightful sovereignty, it will be confined in the cruel bondage of a prescribed and unalterable mould; and there is great danger that it will pine away and die in its captivity. But if the spiritual element be regnant, forms will not be despised as useless, or cumbersome; but they will be held in subordination to the truth, and if they attempt to bind and hinder its free exercise, they will be burst asunder, as will the cerements of the tomb when the life-giver shall bid the dead to come forth.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Of these two conflicting systems of religion, the one has its centre in the truth. The truth as it is in Jesus, is its sun. Around this, all revolves, and to this all is subordinated. It is essentially tolerant of diversities of form, where the truth is preserved and honoured. … The other system revolves around the form. It asks not simply is the truth held, but how it is held. Orders, rites, ceremonies, are the grand principles on which it rests the weightier matters of its law. And by a very natural consequence, one indeed which results from the laws of our being, this undue exaltation of the form, draws after it a corresponding depreciation of the spirit. The apotheosis of external religion, is the dethronement of the internal and the spiritual, and to a greater or less extent, this result is unvarying. Go where you will among the adherents of this system, and you find a latitudinarian tolerance of diversities of doctrine, prevailing in exact proportion to the rigidness of the demand for uniformity of practice in the observances of religion.

Not unfrequently this laxity of doctrine is boasted of, as an ornament and trusted in as a secret of strength. You may believe what you will, within certain very broad and somewhat dimly defined limits, provided the loved and cherished form is observed. The very Church that, avowedly, so framed its declarations of truth as to comprehend well nigh all shades of theological opinion, even inviting to her bosom those who held some of the grand distinguishing principles of the great anti-christian apostacy, takes its position with unflinching firmness on the ground of rites and ceremonies, and cuts off from Church relationship, and valid ordinances, and abandons to the uncovenanted mercies of God, all who do not use her Shibboleth. She drowns the voice of admitted truth and piety, pleading for Christian recognition and fellowship, with the deafening cry “great is Diana of the Ephesians.” Instead of seeking for the living spirit of Christianity, and recognizing it when found; this system of externalism is satisfied with the lifeless corpse, from which the animating spirit has fled, provided you give it

Before decay’s effacing fingers

Have swept the lines where beauty lingers.

Instead of giving free scope to the spirit, allowing it to develop itself, controlled by no laws save those God has given, it forms an encrustation around it, compelling all its growth, if it grow at all, to a conformity to its fossil mould. In short its body is more a mummy than a man.

Now between these two rival systems every man must make his choice. He cannot serve God and Mammon. He cannot have two supreme tests of the Church. These systems are antagonistic, and every man must array himself with the one or the other. And the gathering with one, is scattering abroad so far as the other is concerned. If his system is distinctively ritual, the spirit must be neglected. Dethroned from its rightful sovereignty, it will be confined in the cruel bondage of a prescribed and unalterable mould; and there is great danger that it will pine away and die in its captivity. But if the spiritual element be regnant, forms will not be despised as useless, or cumbersome; but they will be held in subordination to the truth, and if they attempt to bind and hinder its free exercise, they will be burst asunder, as will the cerements of the tomb when the life-giver shall bid the dead to come forth.”

— Samuel James Pierce Anderson, Article III. Form and Spirit. An Address, Delivered before the Alumni, and the Society of Inquiry of Union Theological Seminary, Prince Edward, Va. June, 1850 in Southern Presbyterian Review">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+these+two+conflicting+systems+of+religion%2C+the+one+has+its+centre+in+the+truth.+The+truth+as+it+is+in+Jesus%2C+is+its+sun.+Around+this%2C+all+revolves%2C+and+to+this+all+is+subordinated.+It+is+essentially+tolerant+of+diversities+of+form%2C+where+the+truth+is+preserved+and+honoured.+%E2%80%A6+The+other+system+revolves+around+the+form.+It+asks+not+simply+is+the+truth+held%2C+but+how+it+is+held.+Orders%2C+rites%2C+ceremonies%2C+are+the+grand+principles+on+which+it+rests+the+weightier+matters+of+its+law.+And+by+a+very+natural+consequence%2C+one+indeed+which+results+from+the+laws+of+our+being%2C+this+undue+exaltation+of+the+form%2C+draws+after+it+a+corresponding+depreciation+of+the+spirit.+The+apotheosis+of+external+religion%2C+is+the+dethronement+of+the+internal+and+the+spiritual%2C+and+to+a+greater+or+less+extent%2C+this+result+is+unvarying.+Go+where+you+will+among+the+adherents+of+this+system%2C+and+you+find+a+latitudinarian+tolerance+of+diversities+of+doctrine%2C+prevailing+in+exact+proportion+to+the+rigidness+of+the+demand+for+uniformity+of+practice+in+the+observances+of+religion.%0A%0ANot+unfrequently+this+laxity+of+doctrine+is+boasted+of%2C+as+an+ornament+and+trusted+in+as+a+secret+of+strength.+You+may+believe+what+you+will%2C+within+certain+very+broad+and+somewhat+dimly+defined+limits%2C+provided+the+loved+and+cherished+form+is+observed.+The+very+Church+that%2C+avowedly%2C+so+framed+its+declarations+of+truth+as+to+comprehend+well+nigh+all+shades+of+theological+opinion%2C+even+inviting+to+her+bosom+those+who+held+some+of+the+grand+distinguishing+principles+of+the+great+anti-christian+apostacy%2C+takes+its+position+with+unflinching+firmness+on+the+ground+of+rites+an <blockquote><p>None will pretend to deny that there is not great risk to the riders in the steeple-chase, from the nature of the ground, and for impediments in the course. And surely he who perils the life of a human being, without any adequate cause, should not be held guiltless.

The fact is, that the death of riders in steeple-chases is a matter of frequent occurrence. In October last, a man was killed at once in a race of this kind in the south of Ireland, and he left behind him a wife and family to bewail his untimely end. If the annals of racing are carefully inspected, it will be found that throughout these three kingdoms, at an average, several deaths – sometimes as many as six or eight – take place every year from this cruel punishment.

Surely the public authorities should interfere to prevent this prodigal waste of human life. If the same number of murders were annually committed by persons associated for this purpose, it would excite a thrill of horror throughout the whole community, and the most stringent measures would be demanded to put an end to such crimes. The only difference here is that the direct object of the steeple-chase is not the taking away of human life; but as it manifestly puts it in jeopardy, and as when followed it will inevitably cause the death of numbers, it is to be justly held chargeable with murder, and should therefore be put down, as opposed to the law of God, and an offence of the highest kind against society.

Where riders are not killed in the steeple-chase, numbers of them, by falls and sometimes by blows from the horses thrown, are often injured and greatly disabled. Were not horse-racing a fashionable amusement, countenanced and supported by those who, from their station, too often regard themselves, or are regarded as not amenable to the laws of morality, we are persuaded that the barbarous practice of the steeple-chase would not be tolerated in civilized society. Let the one be discontinued, and the other will disappear, only to be hereafter mentioned as a relic of savage life, or as the sport of madmen.</p></blockquote>

<blockquote><p>Chapter 11 – Seeing it is not possible that the reprobate should receive this grace and live, and also seeing this is infallibly foreseen of God; and again, seeing God has fore-determined to suffer it so to be: Why does He yet will and command that the Gospel, and so grace in the general tenders [offers] thereof, should be proffered unto them? That God is willing to save even those that perish forever, is apparent, both from the consideration of the goodness of his nature, of man’s being his creature, and indeed in a miserable state. But I say, as I have also said already, there is a great difference between his being willing to save them, through their complying with these his reasonable terms, and his being resolved to save them, whether they, as men, will close therewith, or no: So only He saves the elect themselves, even according to the riches of his Grace, even according to his riches in glory, by Christ Jesus working effectually in them what the Gospel, as a condition, calls for from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reprobation Asserted</cite>, (1688)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5040eba8d0" data-kw="">
<blockquote><p>III. God tells us, that sinners will their death, ‘Why will ye die,’ saith God, — The way which sinners take is the way of death, and it is their voluntary choice, they are not force’t to it by God, and neither are they drag’d to by the Devil — but it is their free will &amp; act— Adam acted voluntarily in what he did — IV. God expressly tells us in our text and context, that He has no pleasure in the death of a sinner, but yt [that] he turn and live — God wills the life and eternal salvation of poor sinners turn ye turn ye for why will ye die — God is sincere, hearty, and earnest in his will, it is plainly to be seen and understood by word, which is his revealed will to the children,— in particular his amazing will to save sinners is to be discovered in his sending his dearly beloved and only begotten Son into this world in amazing manner as He did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samson-occom.html">Samson Occom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Sermon on Ezekiel 33:11’</cite>, (1765)</span></figcaption>

</figure><figure class="quote" id="q-cdcac0f5d7" data-kw="">
<blockquote><p>When love is attributed to God in Scripture, it does not mean a passion or an affect, for God is dispassionate [ἀπαθής], the freest, the most blissful, the most blessed, the most perfect. Nothing slavish happens to Him, nothing lowly, and finally nothing that indicates any imperfection. But God’s love denotes three completely, perfect things: eternal benevolence, actual beneficence, and actual delight in the thing loved. For he who loves something is well-disposed towards it, does it whatever good he is capable of, and delights in it. These three things are found in the love of God. Now this love is first the love of God in Himself, and then towards his creatures. For God loves Himself and above all things: the Father: the Son and the Holy Spirit; the Son: the Father and the Holy Spirit, and the Holy Spirit: the Father and the Son. God’s love for his creatures is first general and then special. That general love is the one by which He fully embraces all things created by Him, blesses them, and preserves and sustains them. In this way there is no one, no man, and no devil either, who can say that He is not loved by God. The special love is that by which alone He leads the elect to eternal life, as He acknowledges them to be his own children in Christ: this passage [Mal. 1:2] here must be understood from this special love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Analysis of the Book of the Prophet Malachi</cite>, (Basil: Waldkirch, 1597), p. 10 tr. Damianus Cathedralulus (Domke), “Reading the Book of Malachi with Polanus #2,” A Bear to be Loved: Thoughts on Zacharias Ursinus and Amandus Polanus (blog), March 18, 2023</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Christ sets before us a picture of this kind in the character of the publican, who beats on his breast and begs for pardon with a dejected countenance. (Lk. 18:13). Thus also the sons of God throw down their prayers in that spirit of humility which springs from penitence. Then they raise their prayers by faith for when God invites them to Himself, and gives them the witness to his propitious disposition, they raise themselves up and overtop the clouds, yea, even heaven itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Daniel</cite>, 9:18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

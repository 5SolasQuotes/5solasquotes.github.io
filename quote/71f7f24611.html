<blockquote><p>That they may the better obey the former Exhortations, he admonishes them, that they have a care of false teachers which will arise in the Church, and were now risen; He also describes and reproves their manners and vices, from whence, as from certain marks, they may be known and taken heed of.

Vers. 1. But there were false Prophets also among the people, even as there shall be false Teachers among you, who privily shall bring in damnable heresies, even denying the Lord that bought them, and bring upon themselves swift destruction.

The marks of false Teachers, which also contain the reasons, why they ought to be taken heed of, are nine: Not that they are all to be seen in some one Heretic, but that some of them may be seen in other Heretics.

But there were] Note 1. Such as in times past the false Prophets were amongst the people of God, such shall be the false Teachers in the Church, viz. Egregious hypocrites, counterfeiting themselves to be true Prophets, insinuating themselves into the favour of the people.

Bring in] Note 2. They will craftily bring in damnable heresies, and although not expressly, yet by consequence, or in very deed they will deny Christ (at least-wise in some Article of Faith) i. e. they will be the betrayers of Christ.

The Lord] He amplifies the crime four ways. 1. From this, that they will deny the Lord or Master that bought them, which is spoken in the language of the Visible Church, wherein they were. That they would both boast that they were redeemed, and also the Church esteemed them so: which also in a judicial sense is true; whereby whosoever confesseth with his mouth Christ to be his Redeemer, and in the mean time denies him in deed, being judged out of his own mouth, is said to deny the Lord that bought him; Because as to the merit of the crime, it is as much as if he was really bought, if he suppose and profess himself bought, and yet denies him that bought him.

Bring] 2. He amplifies the crime from this, that by these heresies they deservedly bring upon themselves swift destruction.

Vers. 2. And many shall follow their pernicious ways, by reason of whom the way of truth shall be evil spoken of:

3. He amplifies the crime from this, that they will seduce and draw many Disciples with them into destruction.

By reason of whom] 4. From this, that they themselves and their followers will both blaspheme the way of truth, or the sound Doctrine of the Gospel, and give occasion to others to speak contumeliously of it.

Vers. 3. And through covetousness, shall they with feigned words make Merchandise of you, whose judgement now of a long time lingreth not, and their damnation slumbreth not.

Note] 3. Is covetousness, which is the root of all evil, and for the most part the companion and Mother of all heresies.

Feigned] Note 4. Is a false and feigned speech artificially composed to seduce, covering and drawing into errours with a counterfeiting eloquence.

Shall make Merchandise] Note 5. The selling of souls and filthy Merchandise whereby Heretics will be solicitous to promote their profit, nothing regarding the loss of souls.

Whose] He apprehends the crime from the damnation and destruction which will swiftly follow them, as it was prepared in times past.</p></blockquote>

<blockquote><p>We, all and every one of us underwritten, protest, that after long and due examination of our own consciences in matters of true and false religion, are now thoroughly resolved in the truth, by the Word and Spirit of God. And, therefore, we believe with our hearts, confess with our mouths, subscribe with our hands, and constantly affirm, before God and the whole world, that this only is the true Christian faith and religion, pleasing God and bringing salvation to man, which is now, by the mercy of God, revealed to the world by the preaching of the blessed Evangel, and is received, believed, and defended by many and sundry notable kirks and realms, but chiefely by the Kirk of Scotland, the king’s Majesty, and three Estates of this realm, as God’s eternal truth, and only ground of our salvation; as more particularly is expressed in the confession of our faith, stablished, and publicly confirmed, by sundry acts of Parliaments and now, of a long time has been openly professed by the king’s Majesty, and whole body of his realm, both in burgh and land. To the which Confession and form of religion we willingly agree in our consciences, in all points, as unto God’s undoubted truth and verity, grounded only upon his written Word. And, therefore, we abhor and detest all contrary religion and doctrine, but chiefly, all kind of Papistry, in general and particular heads, even as they are now damned and confuted by the Word of God, and Kirk of Scotland… We, therefore, willing to take away all suspicion of hypocrisy, and of such double dealing with God and his Kirk, protest, and call the Searcher of all hearts to witness, that our minds and hearts do fully agree with this our confession, promise, oath, and subscription, so that we are not moved for any worldly respect, but are persuaded only in our consciences, through the knowledge and love of God’s true religion, printed in our hearts by the Holy Spirit, as we shall answer to Him in the day when the secrets of all hearts shall be disclosed…</p></blockquote>

— David Calderwood, The History of the Kirk of Scotland, vol. 3, pp. 501-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+all+and+every+one+of+us+underwritten%2C+protest%2C+that+after+long+and+due+examination+of+our+own+consciences+in+matters+of+true+and+false+religion%2C+are+now+thoroughly+resolved+in+the+truth%2C+by+the+Word+and+Spirit+of+God.+And%2C+therefore%2C+we+believe+with+our+hearts%2C+confess+with+our+mouths%2C+subscribe+with+our+hands%2C+and+constantly+affirm%2C+before+God+and+the+whole+world%2C+that+this+only+is+the+true+Christian+faith+and+religion%2C+pleasing+God+and+bringing+salvation+to+man%2C+which+is+now%2C+by+the+mercy+of+God%2C+revealed+to+the+world+by+the+preaching+of+the+blessed+Evangel%2C+and+is+received%2C+believed%2C+and+defended+by+many+and+sundry+notable+kirks+and+realms%2C+but+chiefely+by+the+Kirk+of+Scotland%2C+the+king%E2%80%99s+Majesty%2C+and+three+Estates+of+this+realm%2C+as+God%E2%80%99s+eternal+truth%2C+and+only+ground+of+our+salvation%3B+as+more+particularly+is+expressed+in+the+confession+of+our+faith%2C+stablished%2C+and+publicly+confirmed%2C+by+sundry+acts+of+Parliaments+and+now%2C+of+a+long+time+has+been+openly+professed+by+the+king%E2%80%99s+Majesty%2C+and+whole+body+of+his+realm%2C+both+in+burgh+and+land.+To+the+which+Confession+and+form+of+religion+we+willingly+agree+in+our+consciences%2C+in+all+points%2C+as+unto+God%E2%80%99s+undoubted+truth+and+verity%2C+grounded+only+upon+his+written+Word.+And%2C+therefore%2C+we+abhor+and+detest+all+contrary+religion+and+doctrine%2C+but+chiefly%2C+all+kind+of+Papistry%2C+in+general+and+particular+heads%2C+even+as+they+are+now+damned+and+confuted+by+the+Word+of+God%2C+and+Kirk+of+Scotland%E2%80%A6+We%2C+therefore%2C+willing+to+take+away+all+suspicion+of+hypocrisy%2C+and+of+such+double+dealing+with+God+and+his+Kirk%2C+protest%2C+and+call+the+Searcher+of+all+hearts+to+witness%2C+that+our+minds+and+hearts+do+fully+agree+with+this+our+confession%2C+promise%2C

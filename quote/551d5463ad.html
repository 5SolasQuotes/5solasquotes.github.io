<main class="wrap"><figure class="quote" id="q-551d5463ad" data-kw="">
<blockquote><p>If all mixed perfections are reducible to a plurality of pure perfections existing in limited degree, and if an infinite being possesses all pure perfections, the consequent is that God in some way possesses every positive perfection that is found or can be found in creatures, and indeed possesses it in unlimited degree. Accordingly God seems to differ from creatures by something positive not possessed by creatures. Creatures, by contrast, do not seem, in the ultimate analysis, to differ from God by any positive perfection precisely but rather because they lack some perfection that God has. This notion is also expressed in the theory of participation, according to which creatures are finite or imperfect likenesses of God insofar as any perfection possessed by them is found in God either formally or virtually or eminently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 80-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-074219182d" data-kw="">
<blockquote><p>Seventhly, some may ask in what space did God make the world? I answer: God could have made the world and all things in it in one moment: but He began and finished the whole work in six distinct days. [This phrase is likely opposed to those in the early and Medieval Church who taught that the six days were but one day repeated six times.] In the first day He made the matter of all things and the light… and in the end of the sixth day He made man. Thus in six distinct spaces of time, the Lord did make all things: and that especially for three causes:

I. To teach men that they ought to have a distinct and serious consideration of every creature: for if God had made the world in a moment, some might have said, this work is so mystical that no man can speak of it. But for the preventing of this cavil, it was his pleasure to make the world and all things therein in six days: and the seventh day He commanded it to be sanctified by men, that they might distinctly and seriously meditate upon every work of the creation.

II. God made the world and every thing therein in six distinct days, to teach us what wonderful power and liberty He had over all his creatures: for He made the light when there was neither sun nor moon, nor stars: to show that in giving light to the world, He is not bound to the sun, to any creature or to any means: for the light was made the first day: but the sun, the moon and the stars were not created before the fourth day. Again, trees and plants were created the third day: but yet the sun, moon and the stars, and rain which nourish and make herbs, trees and plants to grow were not created till after the third day: which shows plainly that God can make trees, plants and herbs to grow without the means of rain, and without the virtue and operation of the sun, the moon and the stars.

III. He made the world in six distinct days and framed all things in this order to teach us his wonderful providence of his creatures: for before man was created He provided for him a dwelling place and all things necessary for his perpetual preservation and perfect happiness and felicity. So also He created beasts and cattle: but not before He had made herbs, plants and grass, and all means whereby they are preserved. And if God had this care over man when as yet He was not: much more will God have care over him now when he is, and has a being in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (London, 1595), pp. 62-63</span></figcaption>

</figure><figure class="quote" id="q-842ad3680c" data-kw="">
<blockquote><p>…when he commands to sanctify the rest of the Sabbath, he recites not all the works of God from which He rested, but only them which He made in the space of six days: the heaven, the earth, the sea and all that therein is, and that after the doing of them, He rested the seventh day. Therefore He appointed the sanctifying of the Sabbath, chiefly for this purpose, that the people should above all things be fed and strengthened in the faith of the creation… So that first their error is most bayne that say that the world was ever [eternal].</p></blockquote>

</figure><figure class="quote" id="q-54fedc6566" data-kw="">
<blockquote><p>It is therefore clear from the foregoing, that if there be an intellect which knows all things by its essence, then its essence must needs have all things in itself immaterially; thus the early philosophers held that the essence of the soul, that it may know all things, must be actually composed of the principles of all material things. Now this is proper to God, that His Essence comprise all things immaterially as effects pre-exist virtually in their cause. God alone, therefore, understands all things through His Essence: but neither the human soul nor the angels can do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 84, art. 2, I answer that</span></figcaption>

<blockquote><p>3. Creation is the act by which God made the world and all that is in it, partly from nothing and partly from unsuitable material, in order to reveal the glory of his power, wisdom and goodness. …

III. For creatures, but not for the creator, creation is the transition from potency to act.

IV. This potency is not privative but negative.</p></blockquote>

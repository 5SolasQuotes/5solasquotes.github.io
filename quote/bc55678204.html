<main class="wrap"><figure class="quote" id="q-bc55678204" data-kw="">
<blockquote><p>There is a political end of the Sabbath, viz. The refreshment and recreative breathing of the outward man, a relaxation of the body from the pains and toil of the week; and therefore the Sabbath is called a rest. It is said of God Himself that on the seventh day He rested and was refreshed, Ex. 31:17. And how much more does poor man stand in need of rest and refreshment? Death indeed fairly unpins our tabernacle of clay, folds it up and lays it in the grave, but too much labour tears it down; man’s body is taken down by death, is thrown down by too much toil, therefore the wearisome labours of the week must be allayed by the rest of the Sabbath. The very name of a Sabbath signifies nothing but rest, strongly to argue, that that holy day was appointed for mans relaxation from the hurries of the world, and the sweats of the week. The Sabbath is a rest to the body and a revival to the soul, the body’s ease, and the soul’s enjoyment; the outward man on the Sabbath recovers strength, and the inward man receives Christ: Our exhausted spirits on God’s holy day are sweetly recruited, and our importunate souls are rarely answered, they then prey upon a Christ offered in the Gospel. Plato observes that the gods willing to recrui• mankind over-toiled with labour, in pity have appointed festival days for their ease and relaxation. Thus that heathen philosopher gives in his verdict to this particular; Indeed God’s blessed Sabbath shores up a piece of clay, and it builds up a piece of eternity, the precious and the immortal soul. The Sabbath is the body’s friend, and the soul’s fosterer; the body’s rest-time, and the soul’s term-time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wells.html">John Wells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Sabbatarian</cite>, … (London, 1668) Wells was an English puritan. | ch. 23, ‘We must not only meditate on the God of the Sabbath, but on the Sabbath of God, in the morning of his holy day’, pp. 193-94</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b9e3ff6fa" data-kw="">
<blockquote><p>In this commandment there are properly said to be two parts—the one natural, the other moral [positive]; the one the genus, the other the species. Of the former it is said, that the natural part or genus is perpetual, and cannot be abrogated, as being a command concerning the maintenance of the public ministry, so that on some one day the people should be taught, and divinely appointed ceremonies handled. But the species, which bears respect to the seventh day in particular, is abrogated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Natural Law &amp; Divine Positive Law’</cite>, As quoted in Paul Barth</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-443581e996" data-kw="">
<blockquote><p>For honest games and pass-times, howbeit honest, may be [an] impediment to spiritual exercises, and distract the mind as much as the lawful works of our calling. Refreshment by meat and drink was allowed by God Himself, when He provided for the seventh day, and by Christ Himself, who being invited, went to the pharisee’s house upon the sabbath to dinner. A man may recreate himself with the free air of his garden or the fields, if family duties or the like hinder him not, providing he spend the time in holy exercises, or holy conference with some other. But games and pass-times cannot consist with such holy exercises.</p></blockquote>

</figure><figure class="quote" id="q-698e135415" data-kw="Lord&#x27;s day resurrection">
<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>

<blockquote><p>For all kinds of bodily labors on the Lord’s day are unlawful, except they be referred to the sanctification of the Sabbath, as the means of it (Mt. 12:5), of which sort are the labors of the minister in the duties appertaining to his ministry, and of the people travailing to the places of God’s worship.</p></blockquote>

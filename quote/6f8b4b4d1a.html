<main class="wrap"><figure class="quote" id="q-6f8b4b4d1a" data-kw="">
<blockquote><p>The agent in, and chief author of, this great work of our redemption is the whole blessed Trinity; for all the works which outwardly are of the Deity are undivided and belong equally to each person, their distinct manner of subsistence and order being observed. It is true, there were sundry other instrumental causes in the oblation, or rather passion of Christ but the work cannot in any sense be ascribed unto them; — for in respect of God the Father, the issue of their endeavours was exceeding contrary to their own intentions, and in the close they did nothing but what the “hand and counsel of God had before determined should be done,” Acts iv. 28; and in respect of Christ they were no way able to accomplish what they aimed at, for he himself laid down his life, and none was able to take it from him, John x. 17, 18: so that they are to be excluded from this consideration.

In the several persons of the holy Trinity, the joint author of the whole work, the Scripture proposeth distinct and sundry acts or operations peculiarly assigned unto them; which, according to our weak manner of apprehension, we are to consider severally and apart; which also we shall do, beginning with them that are ascribed to the Father.

1. Two peculiar acts there are in this work of our redemption by the blood of Jesus, which may be and are properly assigned to the person of the Father:— First, The sending of his Son into the world for this employment. Secondly, A laying the punishment due to our sin upon him.

The Father loves the world, and sends his Son to die: He “sent his Son into the world that the world through him might be saved,” John iii. 16, 17. He “sending his Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh, that the righteousness of the law might be fulfilled in us,” Rom. viii. 3, 4. He “set him forth to be a propitiation through faith in his blood,” chap. iii. 25. For “when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law, to redeem them that were under the law, that we might receive the adoption of sons,” Gal. iv. 4, 5. So more than twenty times in the Gospel of John there is mention of this sending; and our Saviour describes himself by this periphrasis, “Him whom the Father hath sent,” John x. 36; and the Father by this, “He who sent me,” chap. v. 37.

So that this action of sending is appropriate to the Father, according to his promise that he would “send us a Saviour, a great one, to deliver us,” Isa. xix. 20; and to the profession of our Saviour, “I have not spoken in secret from the beginning; from the time that it was, there am I: and now the Lord God, and his Spirit, hath sent me,” Isa. xlviii. 16. Hence the Father himself is sometimes called our Saviour: 1 Tim. i. 1, “According to the commandment Θεοῦ σωτῆρος ἡμῶν,” — “of God our Saviour.” Some copies, indeed, read it, Θεοῦ καὶ σωτῆρος ἡμῶν, — “of God and our Saviour;” but the interposition of that particle καὶ arose, doubtless, from a misprision that Christ alone is called Saviour. But directly this is the same with that parallel place of Tit. i. 3, Κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν Θεοῦ, — “According to the commandment of God our Saviour,” where no interposition of that conjunctive particle can have place; the same title being also in other places ascribed to him, as Luke i. 47, “My spirit hath rejoiced in God my Saviour.” As also 1 Tim. iv. 10, “We trust in the living God, who is the Saviour of all men, specially of them that believe;” though in this last place it be not ascribed unto him with reference to his redeeming us by Christ, but his saving and preserving all by his providence.</p></blockquote>

<blockquote><p>The Father’s appointing him to be a sacrifice, doth not impair his own willingness in undertaking. The Father is said to send him and deliver him, John iii. 84, Rom. viii. 32; not that the Son was over-persuaded, or came only out of obedience, without any inclination of his own. The Father being the root and fountain of the deity, all actions are originally ascribed to him, though common to all; so he is first in order of being, as he is first in order of working.

The Father is said to deliver him, because the first motion of redemption is supposed to arise from the will and motion of the Father; yet the love of Christ was the spring of all mediatory actions, and his taking our nature on him; and therefore he is no less said to give himself, than the Father is said to give him to us and for us. God is said to set him forth, Rom. iii. 25; yet he is said to come, Mat. xx. 28, not thrust out or forced to come. God lays our sins upon him, yet Christ is said to bear them.

His engagement was an act of choice, liberty, and affection. He could not be constrained by his Father to undertake it; his will was as free in consenting, as his Father was in proposing. The Spirit is said to be sent by the Father and the Son, to take of Christ’s and show it to us, to fit those for heaven that are given to Christ; yet his distributions are according to his own will: 1 Cor. xii. 11, ‘Dividing to every man according as he will.’

If you consider Christ as one God with the Father, there is but one and the same will in both. Will belongs to essence or nature; the essence of God being one, there are not in God divers wills, though the Godhead be in divers persons, because the power of willing is the nature, not a personal propriety.

The decree of redemption was joint in Father and Son. What Christ decreed as God, he executed as man; and what he willed from eternity, he began in time to will as man, Christ, as God, gave himself to death with the same will and’ by the same action as the Father gave him; but as man he gave himself by a will inspired by the Father.

Yet for our conception’s sake the Scripture represents things so as if they were distinct wills, which yet we must not imagine, any more than because the Scripture, in condescension to our weakness, represents God with eyes, and ears, and hands, we must conceive God to have a fleshly body like ours.</p></blockquote>

</figure><figure class="quote" id="q-103dd6146c" data-kw="">
<blockquote><p>It were unbecoming to say nothing of a distinction which we observe that the Scriptures have pointed out. This distinction is, that to the Father is attributed the beginning of action, the fountain and source of all things; to the Son, wisdom, counsel, and arrangement in action, while the energy and efficacy of action is assigned to the Spirit. Moreover, though the eternity of the Father is also the eternity of the Son and Spirit, since God never could be without his own wisdom and energy; and though in eternity there can be no room for first or last, still the distinction of order is not unmeaning or superfluous, the Father being considered first, next the Son from him, and then the Spirit from both.</p></blockquote>

<blockquote><p>24. III. And the existence of this divine essence must be known by us in this gradual threefold conception: 1. In virtute (vel potentia) [in virtue or power], 2. In actu immanente [in an immanent act], 3. In actione transeunte [in a transitive action]. Of the first I shall say no more than what is said before. By the second I mean God’s own most perfect essence as active in itself, without extrinsic effect or object. By the third, I mean not the creature, or the divine action ut recipitur in passo [as it is received in the patient], or the effect, but the divine essence itself in the state of agency ad extra [toward what is outside]; which the schools conclude to be eternal, though the effect is but in time. Yet if any will call this a free and not a necessary state of the divine essence, I contend not.

25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

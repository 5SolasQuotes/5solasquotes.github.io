<main class="wrap"><figure class="quote" id="q-068f6eb218" data-kw="unchangeable essence">
<blockquote><p>God is unchangeable in his essence, nature, and perfections. Immutability and eternity are linked together; and indeed true eternity is true immutability, whence eternity is defined the possession of an immutable life. It is the essential property of God, not to have any change in his being, or any alteration by any thing without him or within him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Immutability of God</span></figcaption>

<blockquote><p>Is God immense and omnipresent as to essence? We affirm against Socinus and Vorstius. The question does not concern the presence of power and operation which is called energetic; for the adversaries do not deny this. Rather the question concerns the presence of nature, called essential, which they do not admit.</p></blockquote>

</figure><figure class="quote" id="q-ef4bec73dc" data-kw="will irresistible precept">
<blockquote><p>The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).</p></blockquote>

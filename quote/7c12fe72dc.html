<blockquote><p>We say, the man is not persecuted for his conscience, that, declining from God, blaspheming his Majestie, and contemning his religion, obstinately defendeth erroneous and false doctrine. This man, I say, lawfully convicted, if he suffer the death pronounced by a lawful Magistrate, is not persecuted, (as in the name of Servetus ye furiously complain,) but he suffereth punishment according to God’s commandment, pronounced in Deuteronomie, the xiii. chapter.</p></blockquote>

<blockquote><p>24. But as we have hitherto described the magistrate who truly is what he is called-viz. the father of his country, and (as the Poet speaks) the pastor of the people, the guardian of peace, the president of justice, the vindicator of innocence, he is justly to be deemed a madman who disapproves of such authority. And since in almost all ages we see that some princes, careless about all their duties on which they ought to have been intent, live, without solicitude, in luxurious sloth; others, bent on their own interest, venally prostitute all rights, privileges, judgments, and enactments; others pillage poor people of their money, and afterwards squander it in insane largesses; others act as mere robbers, pillaging houses, violating matrons, and slaying the innocent; many cannot be persuaded to recognize such persons for princes, whose command, as far as lawful, they are bound to obey. For while in this unworthy conduct, and among atrocities so alien, not only from the duty of the magistrate, but also of the man, they behold no appearance of the image of God, which ought to be conspicuous in the magistrate, while they see not a vestige of that minister of God, who was appointed to be a praise to the good and a terror to the bad, they cannot recognize the ruler whose dignity and authority Scripture recommends to us. And, undoubtedly, the natural feeling of the human mind has always been not less to assail tyrants with hatred and execration, than to look up to just kings with love and veneration.

25. But if we have respect to the Word of God, it will lead us farther, and make us subject not only to the authority of those princes who honestly and faithfully perform their duty toward us, but all princes, by whatever means they have so become, although there is nothing they less perform than the duty of princes. For though the Lord declares that a ruler to maintain our safety is the highest gift of his beneficence, and prescribes to rulers themselves their proper sphere, He at the same time declares, that of whatever description they may be, they derive their power from none but Him. Those, indeed, who rule for the public good, are true examples and specimens of his beneficence, while those who domineer unjustly and tyrannically are raised up by him to punish the people for their iniquity. Still all alike possess that sacred majesty with which he has invested lawful power. I will not proceed further without subjoining some distinct passages to this effect (Job 34:30; Hos. 13:11; Isa. 3:4; 10:5; Deut. 28:29). We need not labor to prove that an impious king is a mark of the Lord’s anger, since I presume no one will deny it, and that this is not less true of a king than of a robber who plunders your goods, an adulterer who defiles your bed, and an assassin who aims at your life, since all such calamities are classed by Scripture among the curses of God. But let us insist at greater length in proving what does not so easily fall in with the views of men, that even an individual of the worst character, one most unworthy of all honor, if invested with public authority, receives that illustrious divine power which the Lord by his Word devolved on the ministers of his justice and judgment, and that, accordingly, in so far as public obedience is concerned, he is to be held in the same honor and reverence as the best of kings. … 27. …If we constantly keep before our eyes and minds the fact, that even the most iniquitous kings are appointed by the same decree which establishes all regal authority, we will never entertain the seditious thought, that a king is to be treated according to this deserts, and that we are not bound to act the part of good subjects to him who does not in his turn act the part of a king to us. … 29. This feeling of reverence, and even of piety, we owe to the utmost to all our rulers, be their characters what they may. This I repeat the oftener, that we may learn not to consider the individuals themselves, but hold it to be enough that by the will of the Lord they sustain a character on which he has impressed and engraven inviolable majesty. But rulers, you will say, owe mutual duties to those under them. This I have already confessed. But if from this you conclude that obedience is to be returned to none but just governors, you reason absurdly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 4, ch. 20</span></figcaption>

<blockquote><p>XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, (1681), pp. 47-48</span></figcaption>

ted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.”

— Robert MacWard, The Banders Disbanded, (1681), pp. 47-48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVI.+%E2%80%A6Yet+the+case+may+be%2C+and+often+has+been+%28and+whither+or+no+it+be+ours+now+%5Breferring+to+Scotland+in+1681%5D%2C+is+not+mine+to+determine%29+that+a+people+may+and+ought+to+submit+themselves+to+the+government+even+of+such+a+magistrate+who+either+has+injuriously+usurped+that+office%2C+or+has+so+maleversed+in+the+exercise+thereof+%28by+violating+the+main+and+most+of+the+conditions+upon+which+he+was+admitted+to+it%29+that+his+government+is+degenerat%5Bed%5D+into+a+manifest+tyranny+and+irreligion%2C+and+so+has+%28de+jure%29+fore-faulted+his+right+to+rule+as+a+magistrate%3A+I+say+the+case+of+a+people+may+be+so+circumstantiate+%5Bbound+by+circumstances%5D%2C+that+they+ought+to+subject+themselves+even+to+such+a+tyrant+till+the+Lord+clearly+point+forth+to+them+a+way%2C+either+from+his+written+Word%2C+or+some+extraordinary+impulse+and+influence+upon+their+spirits%2C+or+from+indubitable+grounds+and+persuasives+of+sound+moral+principles%2C+or+such+like%2C+whereby+they+may+emerge+from+under+that+yoke.+Hereby+I+do+not+yield%2C+nor+assert%2C+that+it+is+lawful+to+give+obedience+to+any+unlawful+commands%2C+or+that+it+is+no+ways+lawful+for+a+people+to+shake+off+the+yoke+of+an+unlawful+and+tyrannical+government%3A+but+only+that+there+may+be+some+cases+wherein+it+is+lawful+for+a+people+to+yield+subjection+to+a+lawless+tyrant%2C+and+wherein+it+may+be+unlawful+for+them+to+perpetrate+or+attempt+their+own+liberation+by+external+force+%28which+abstractly+from+those+circumstances+might+be+both+lawful%2C+laudable+and+a+necessary+duty%29%2C+viz.+when+the+thing+attempted+is+either+altogether+impracticable%2C+the+means+or+manner+of+effectuating+it+dubious+or+unwarrantable%2C+the+timing+of+it+inexpedient+and+unseasonable%2C+or+the+necessary+concomitants+or+consequents+of+the+cure+more+hurtful+or+dangerous+than+the+disease%3B+or+the+like%3A+Neit <blockquote><p>Writing from the Netherlands, James Renwick et al reminded the suffering Covenanters in Scotland that one way to endure persecution and affliction is to remember the greatness of our sin:

We think there is nothing will help us so well to bear patiently, as a full sight of the wrongs that we have done to the work of a holy God. We would then be made to say, we are “afflicted less than our iniquities deserve.” We would be then put to desire no deliverance from the yoke of our oppression, without a deliverance from the yoke of our transgressions.</p></blockquote>

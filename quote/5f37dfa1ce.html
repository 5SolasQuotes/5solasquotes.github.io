<main class="wrap"><figure class="quote" id="q-5f37dfa1ce" data-kw="">
<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [prelate] Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches and Gregory de Valentia, as I show[ed] before… …when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo [therefore], it [the Church’s judgment] cannot remove my doubting and beget faith… 7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646) | Appendix, ‘An Introduction to the Doctrine of Scandal’ | Question 4</cite>, p. 43</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf6b14572d" data-kw="">
<blockquote><p>…for neither magistrate nor people can be bound to follow the judgement of the Churches or ministry farther than they follow the rule of the Word; they follow their judgement conditionally, not absolutely and simply; and it is a great calumny of Mr. [Henry] Burton and our [Independent] Brethren, that we lay bands on the consciences of prince and people to follow the acts and determinations of the Church, be they true or false: and that there is no place left to appeal to the next, or a better informed synod, and to the consciences of the collective Church of the godly judicious professors, and to protest and deny obedience to erring assemblies.</p></blockquote>

</figure><figure class="quote" id="q-9a406755f5" data-kw="">
<blockquote><p>7. That the same Lord, who has commanded us not to despise prophesying, 1 Thess. 5:19, has also commanded us to prove all things, and to hold fast that which is good, ver. 20. And no[t] to believe every spirit, but to try the spirits, whether they be of God, because many false prophets are gone forth into the world, 1 Jn. 4:1. And that whatsoever is not of faith is sin, Rom. 14:15. And that we ought not to be the servants of men, 1 Cor. 7:23. That is to do things (especially in the matters of God) for which we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2.</p></blockquote>

</figure><figure class="quote" id="q-826115b327" data-kw="">
<blockquote><p>…we shall premise some common and known truths concerning Church-judicatories and their decrees and sentences, as: 1. That (to express it in Calvin’s words, in the eighth chapter of the fourth book of his Institutions) whatsoever reverence or dignity is by the Spirit of God in the Scriptures given, whether to the priests, or prophets, or apostles, or their successors, all of it is given not properly to men themselves, but to the ministry, wherewith they are clothed; or (to speak more expeditely) to the Word; the ministry whereof is committed unto them, Ex. 3:4; 14:31; Deut. 17:•; Mal. 2:46; Deut. 17:10; Eze. 3:17; Jer. 23:28; Jer. 1:6; Mt. 28:19; Acts 15:10; etc. 2. That as their authority is founded upon, and wholly derived from the Word of God, so in the administration and exercise thereof, they are in all things to walk according to this rule, Isa. 8:19-20; Mal. 2:6-7; Mt. 28:19. 3. That Church-power is not a lordly and magisterial power, but a lowly and ministerial-power, not an absolute and autocratoric, but a limited and hyperetic-[below-kind-of-]power; and that Church decrees and sentences are all of them regulae regulatae, [rules being regulated] rules that are subordinated, and do not bind but in the Lord, and so far as they are conform to that first inflexible and unerring-rule, prescribed by Himself, Lk. 22:24-27; Gal. 6:16; 1 Peter 5:2-3; 1 Tim. 3:15-17; 1 Thess. 5:12; Eph. 6:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (1658)</cite>, p. 95-6</span></figcaption>

<blockquote><p>Out of all which, I conclude that no law as a law does oblige the conscience, but that which has from the matter moral equity, and not from the intention of the lawgiver, as Cajetan, Silvester, Angelus and Corduba teach, which intention must take a rule from the matter of the law, and not give a rule. Gerson, no law (says he) is a law to be called as necessary to salvation (as all good laws should be) but that which de jure divino, is according to God’s law… And therefore his [Durandus’s] mind is that all obligation of conscience in human commandments comes from God’s will and law, that is, from the just and necessary matter of the law, not from the will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, Ch. 2, Question 2; p. 205</span></figcaption>

<blockquote><p>5. ‘The persons are proposed (Rom. 13) to be the object of our obedience,’ says Dr. Ferne [an erastian royalist]. This is very true: but he is ignorant of our mind in expounding the word ‘person’. We never meant that fear, honor, royalty, tribute, must be due to the abstracted accident of kingly authority [a righteous rule that a bad king may not be exercising], and not to the man who is king; nor is it our meaning that royalty, in abstracto is crowned king [the office apart from the particular king], and is anointed, but that the person is crowned and anointed. But, again, by a ‘person’ we mean nothing less than the man Nero wasting Rome, burning, crucifying Paul and torturing Christians; and that we owe subjection to Nero and to his person in concreto [materially as a specific man], as [distinguished from and compared] to God’s ordinance, God’s minister, God’s sword-bearer, in that notion of a ‘person’, is that only that we deny. Nay, in that Nero, in concreto [as a man, and that sinful], to us is no power ordained of God, no minister of God, but a minister of the devil, and Satan’s armour-bearer, and therefore we owe not fear, honor, subjection, or tribute to the person of Nero. But the person thus far is the object of our obedience, that fear, honor, subjection and tribute must be due to the man in concreto [in particular], to his person who is prince, but not because he is a man, or a person simply, or a sword-bearer of papists, but for his office,- for that eminent place of royal dignity that God has conferred on his person… so here we honor and submit to the man who is king, not because he is a man, that were treason; not because he uses his sword against the church, that were impiety; but because of his royal dignity, and because he uses it for the Lord. …Subjection is due to Nero as an emperor, but not any subjection is due to him in the burning of Rome, and torturing of Christians… Because some believed Christians were free from the yoke of magistracy, and that the dignity itself was unlawful; and because (ch. 12) he had set down the lawful church rulers, and in this and the following chapter, the duties of brotherly love of one toward another; so here ([Rom.] ch. 13) he teaches that all magistrates, suppose [they be] heathen, are to be obeyed and submitted unto in all things, so far as they are ministers of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, Question 29, p. 146; p. 148</span></figcaption>

</figure><figure class="quote" id="q-18f4a949e3" data-kw="">
<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Tim., 2:17</span></figcaption>

<blockquote><p>Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<main class="wrap"><figure class="quote" id="q-e5b4ab6634" data-kw="">
<blockquote><p>…the same brotherhood that inspired valiant acts of bravery, self-sacrifice, and loyalty was subtly turned to promote silence and the heinous ends of self-preservation and protection. The brotherhood demanded unswerving allegiance… Impartiality is one of the most needed and maybe one of the most neglected aspects of faithful ministry. The closer our relational bonds are the more easily we can be tempted by line drawing, blind loyalty, party spirit, or clouded judgment… Sacrificing friendship for the sake of Christ isn’t easy. But sometimes it’s necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kyle-borg.html">Kyle Borg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Band of Brothers’ (2023) 13 paragraphs</cite></span></figcaption>

<blockquote><p>Some Imperious Presbyterians are known for high-handed and arbitrary uses of church discipline. What is the status of a congregation that doles out ecclesiastical discipline in a tyrannical manner? Such an assembly is unhealthy or corrupt, regardless of whether it has an outward form of Presbyterian polity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kevin-reed.html">Kevin Reed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Imperious Presbyterianism (Unicoi, TN: Trinity Foundation, 2008)</cite>, p. 18</span></figcaption>

</figure><figure class="quote" id="q-e56ab7366e" data-kw="">
<blockquote><p>Thirdly, the practice of wisdom consists, first, in avoiding extremities, vv. 16-17. Secondly, in keeping the mean, v. 18. The extremities are excess or defect. The excess is an error on the right hand, when a man by pride abuses his wisdom, in stretching it beyond the limits and bounds of human capacity, either in defining thereby what is just, what unjust, or what is truth, what error. ‘Be not righteous overmuch.’ A man cannot be too righteous in respect of obedience to the Commandments, yet if he be so much addicted to one or some, as that he despises the rest, he bewrays hypocrisy and folly, and may well be said to be too just. For a man is not to cull out what he thinks good, thereby to justify himself, and to condemn others…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-granger.html">Thomas Granger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Familiar Exposition, or Commentary, on Ecclesiastes, wherein the World’s Vanity &amp; the True Felicity are Plainly Deciphered (1621), ch. 7</cite>, p. 182</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

</figure><figure class="quote" id="q-effa2508d0" data-kw="">
<blockquote><p>That no sort of gayety or expensiveness in dress is permittted to any persons whatsoever: no sort of recreation or diversion; nothing but an universal mortification and self-denial: no pleasure, but from religion only… No allowances are to be made for melancholy, misfortunes or human infirmity: grief must be cured only by prayer; to divert it (as the world speaks) by worldly amusements is carnal and unchristian: No books must be read, but books of piety… a Christian… ought to renounce human learning and ‘know nothing but Jesus Christ and Him crucified.’ Now is it not a sufficient confutation of all this, to appeal to common sense; and then ask every Christian, Whether what is inconsistent with that, can be consistent with Christianity? The apostle, Rom. 12:1, bids us present our bodies to God, but these men talk as if we had no bodies at all… We are for as much strictness as Christianity requires, which indeed is a great deal, but we will never allow that a doctrine must be eminently Christian merely because ’tis strict… …all their arguments both from reason and Scripture are (as all arguments ever must be that are contrary to common sense) entirely fallacious and inconclusive, confounding the most distinct ideas with one another, as the abuse of a thing with the use of it, chiefly with only, dangerous with unlawful, etc…. They are likewise (as is usual upon these occasions) inconsistent with themselves, and run into manifest self-contradictions… Many things indeed are intermixed with these singular doctrines, which are true and of great importance. This world is certainly very vain, and a mere nothing in comparison of the world to come: it is certianly our duty to live above it, to be heavenly-minded, and to set our affections upon things above, more than upon things on earth. But does it from hence follow that we must have nothing to do with the world, but, literally speaking, live in it, as if we were not in it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-trapp.html">Joseph Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nature, Folly, Sin &amp; Danger of Being Righteous Over-Much, with a particular view to the doctrines and practices of certain modern Enthusiasts, being the substance of four discourses… 3rd ed. (London: Austen, 1739) 69 pp. on Eccl. 7:16</cite>, pp. 15-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

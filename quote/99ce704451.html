<main class="wrap"><figure class="quote" id="q-99ce704451" data-kw="">
<blockquote><p>…God took notice of the sacrifice: but now they see the fire coming out from the presence of God, they are convinced both of the power and acceptation of the Almighty; They are at once amazed, and satisfied to see the same God answer by fire, which before had spoken by fire: God does no less approve our evangelical sacrifices than theirs under the [Mosaic] Law; But as our sacrifices are spiritual, so are the signs of his acceptation: Faith is our guide, as sense was theirs. Yea even still does God testify his approbation by sensible evidences: when by a lively faith, and fervent zeal, our hearts are consecrated to God, then does his heavenly fire come down upon our sacrifices; Then are they holy, living, acceptable. [Rom. 12:1-2]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations upon the Principal Passages of the Holy Story. The Second Volume; in Four Books (London: 1614), ‘Nadab &amp; Abihu’</cite>, pp. 176-77</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bce4e3a71" data-kw="">
<blockquote><p>Let the prayer, thanksgiving, or blessing of the bread and wine, be to this effect: ‘With humble and hearty acknowledgment of the greatness of our misery, from which neither man nor angel was able to deliver us, and of our great unworthiness of the least of all God’s mercies; to give thanks to God for all his benefits… and for this sacrament in particular, by which Christ, and all his benefits, are applied and sealed up unto us, which, notwithstanding the denial of them unto others, are in great mercy continued unto us, after so much and long abuse of them all…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship | Of the Celebration of the Communion, or Sacrament of the Lord’s Supper</cite></span></figcaption>

</figure><figure class="quote" id="q-c240066799" data-kw="">
<blockquote><p>Go to the Word of God, look what is written; and then the Lord will accept the service, when thou strivest to come near the commandment. See what is punctually required, and then diligently set thyself awork. The Lord will accept weak endeavors, so they be suitable to the command; so you do but endeavour to perform what is written, the Lord will accept it more than all the pomp and outside of those that would supererogate in the outward part… lookest to what God requires; though thou dost not come near it but in thy purposes and desires, the Lord will accept thee. All that the faithful could say for themselves in the prophet was, ‘The desire of our soul is to thy name, and to the remembrance of Thee,’ Isa. 26:8. And all that Nehemiah could urge for the best Jews was that they did desire to fear God’s name, Neh. 1:11. I say, see thou hast prepared to meet the Lord in his own ordinances, and wouldest feign do what is written: remember the death of the Lord Jesus after the due order and right manner, then the Lord will be pleased with thy sacrifice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 15 | ‘First Sermon’ of Sermons on the Sacraments</cite>, pp. 351-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress. 2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do. 3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 6-7, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

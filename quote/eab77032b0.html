<main class="wrap"><figure class="quote" id="q-eab77032b0" data-kw="">
<blockquote><p>II. We own all those as visible Christians and members of the universal Church that make a credible profession of Christianity and destroy it not by heresy or ungodly lives.

III. So many of these as also consent to hold communion with this church as members of it, submitting to the ministers and discipline of Christ, we shall esteem our flock and special charge, and faithfully perform the duties of our office for their good, as we are able.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed</cite>, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6dc426196a" data-kw="">
<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London: Cockerill, 1681), p. 173</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].”

</figure><figure class="quote" id="q-585edc577b" data-kw="">
<blockquote><p>As for schismatics who only for schism are out of the Church, and do hold no erroneous point of doctrine, and are not yet convinced [convicted by a church court], they are yet members of the visible Church, as Morton says from Gerson (Morton, Apologia de no•is R•cl., ch. 2, •at. 1, p. 7), as also Glorianus (lib. de schismat., p. 181); but he who is casten out as a schismatic, is in the same case with an excommunicate[d] person.</p></blockquote>

</figure><figure class="quote" id="q-221fa855fe" data-kw="">
<blockquote><p>There are many cases in which local separation may be lawful: First, as if our callings justly remove us to another place or country. Secondly, if our spiritual advantage bind us to remove to a better minister and more suitable society when we are free. Thirdly, if our lawful pastors be turned out of the place, and we follow them, and turn away but from usurpers. Fourthly, if the pastors turn heretics or wolves. Fifthly, if the public good of the churches require my removal. Sixthly, if any sin be imposed on me, and I be refused by the Church unless I will commit it. In these and some other such cases a remove is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 59, p. 238</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>From all this its clear that it is false which Mr. [Thomas] Hooker says, ‘that all particular churches are all the members that the Church-visible has.’ For apostles, godly sojourners, dissolved members, are not members of congregations, nor are they congregations themselves, and yet they are members of the visible, integral, catholic Church.</p></blockquote>

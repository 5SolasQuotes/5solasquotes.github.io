<main class="wrap"><figure class="quote" id="q-3199370867" data-kw="">
<blockquote><p>The officers which Christ hath appointed for the edification of his church, and the perfecting of the saints, are, some extraordinary, as apostles, evangelists, and prophets, which are ceased. Others ordinary and perpetual, as pastors, teachers, and other church-governors, and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Form of Presbyterial Church-Government</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“The officers which Christ hath appointed for the edification of his church, and the perfecting of the saints, are, some extraordinary, as apostles, evangelists, and prophets, which are ceased. Others ordinary and perpetual, as pastors, teachers, and other church-governors, and deacons.”

— Westminster Assembly, The Westminster Form of Presbyterial Church-Government">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+officers+which+Christ+hath+appointed+for+the+edification+of+his+church%2C+and+the+perfecting+of+the+saints%2C+are%2C+some+extraordinary%2C+as+apostles%2C+evangelists%2C+and+prophets%2C+which+are+ceased.+Others+ordinary+and+perpetual%2C+as+pastors%2C+teachers%2C+and+other+church-governors%2C+and+deacons.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+The+Westminster+Form+of+Presbyterial+Church-Government&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3199370867.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3199370867.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-offices-of-apostles-prophets-evangelists/#:~:text=The%20officers%20which%20Christ%20hath%20appointed,teachers%2C%20and%20other%20church%2Dgovernors%2C%20and%20deacons." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f915b7b479" data-kw="">
<blockquote><p>…for all argument they come at last to this,’By what authority doest thou these things; and who gave thee this authority?’ where the Lord answering for Himself, then, and for us now in the like case, most plainly and at length shows that, howsoever in the ordinary course of a constitute Church, a careful regard must be had to the ordinary calling, yet when (as sometime it falls) that the ordinary husband-men become murderers, and the ordinary builders become destroyers, there God extraordinarily stirs up men whose ministry proves itself to be from Heaven and not from men, even by this, that they come in the way of righteousness: and sinners are converted by them, that, so the Lord of the vineyard may report fruit thereof, even when the ordinary husbandmen rebel, and that the stone, rejected, even of the ordinary builders, may yet be made the head of the corner: which, howsoever it be marvelous in our eyes, yet it is the Lord his doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-forbes.html">Patrick Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of the Lawful calling of the Ministers of Reformed Churches Against the Cavillations of Romanists… (Middleburg, 1614)</cite>, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-6ac434a282" data-kw="">
<blockquote><p>III. Whether there can be regeneration of adults without antecedent or conjoined external calling through the Word externally set forth; and whether de facto there has been such? Response: The former is not to be denied. To the latter we say that ordinarily it does not happen, according to Rom. 10:15, 17; 1 Cor. 1 [1:21]; 2 [2:4-5], 21 [This should be different], compared with Ps. 147 [vv. 19-20]; Eph. 2:11–12. Nor do I see any example adduced after the new covenant was established. Concerning Abraham, it can be said that he had in his paternal family the external Word handed down from hand to hand through the patriarchs. Concerning Adam and Eve, it can be said that they were the first in whom God established the church after the fall, from whom thenceforth the church was propagated through the external Word. Nor is it certain that their first conversion was accomplished without some Word sounding externally (although in an extraordinary manner, because it was necessary first to establish the order and to begin from them).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

oopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e12333728f" data-kw="">
<blockquote><p>…Whether pastors are to be believed or obeyed any farther than they show a Word of God revealing or commanding the particular thing? Divine faith and obedience is one thing, and human is another: 1. If as a preacher he say, ‘This is God’s Word, believe it and obey it as such,’ you must believe with a human faith that it is likelier that he knows what he says than you do (unless 1. you see evidence, 2. or the consent of more credible persons to be against him, and then you are not to believe him at all). Even as a child believes his teacher in order to learn the things himself, so you are so far to take his word while you are learning to know whether it be so or not. But not to rest in it as certain, nor to take your belief of him and obedience to him, to be a believing and obeying God formally, though a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory: a Sum of Practical Theology and Cases of Conscience</cite>, p. 889</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

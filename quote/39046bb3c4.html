<main class="wrap"><figure class="quote" id="q-39046bb3c4" data-kw="">
<blockquote><p>§X. And since before the Eucharist, priests are accustomed to hear confession, we add this. We admit public confession of sins:

1. Made by the whole Church to God.

2. Of particular parts of the whole Church (2 Cor. 2:6). And private:

1. Made to God.

2. To those whom we have injured.

3. By the troubled and doubting conscience to any believer who can console us. §XI. But we disapprove of confessions: 1. Being forced, 2. Of all sins, 3. Including secret sins.

4. Only to the ears of the priest.

5. For obtaining from the priest remission of sins. Controversy – Is it necessary for someone seeking remission of sins to tell his secret sins to a priest? We deny against the Papists. Arguments:

1. Christ remits the sins of the one who believes, including those not recounted in detail (Mt. 9:2), “and as the Father sent him, so He sends us” and wants us to do the same (Jn. 20:21).

2. Saints who confessed their sins only to God obtained remission (Ps. 32:5, Lk. 18:13-14).

3. No one has to reveal his own wickedness (Jude v. 13).

4. God alone, not priests, can remit and wipe away sins (Lk. 5:21).

5. This is pure tyranny over consciences. Objections:

1. Then, for what purpose was the power of remitting sins given (Jn. 20:23, 2 Cor. 5:19)? Reply: This is nothing else than proclaiming remission of sins in the name of God to the penitent.

2. “Many confessed their sins” (Acts 19:18). Reply: Those who had lived profanely before conversion and performed magic confessed publicly not to a priest in the ear that they had lived wickedly.

3. Confess your sins one to another (Jas. 5:16). Reply: Then why not the priests to the people? This refers to someone who is afflicted on account of sins. We are warned concerning these sins that we should not deny them.

4. If we confess our sins, He will remit them (1 Jn. 1:9). Reply: If we confess to God, God remits.</p></blockquote>

<blockquote><p>The visible Church of Christ is a congregation of faithful men, in the which the pure Word of God is preached, and the Sacraments be duly ministered according to Christ&#x27;s ordinance in all those things that of necessity are requisite to the same. As the Church of Jerusalem, Alexandria, and Antioch, have erred; so also the Church of Rome hath erred, not only in their living and manner of Ceremonies, but also in matters of Faith.</p></blockquote>

</figure><figure class="quote" id="q-d5c6ab179c" data-kw="">
<blockquote><p>But the Romish clergy, together with the infinite orders of religious votaries, are not few but many, and those chosen promiscuously without any respect had whether they be endowed with that gift or no: therefore, being unable to contain, and forbidden to use the lawful remedy ordained by God, they must of necessity fall into lawless and inordinate lusts: Besides, seeing that every man that will, be he never so defamed for incontinency, and so by experience known to be void of that same excellent gift, may become a votary, and on the contrary (our Savior says) every man cannot receive this, what hope can there be of chastity among these men? Is the gift of chastity indeed so common, that every man may have it that will? Is it so ordinary, that it is communicated to thousands of priests, monks, friars, and nuns? yea, to innumerable of that order in all places? why then, what meant Cassander, a learned divine of their own, to say, that the world was come to that pass, that a man could scarce find one of an hundred that kept himself free from incontinency?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2fa395322e" data-kw="">
<blockquote><p>Now we come to the Covenant of grace. Which is nothing else but a compact made between God and man touching reconciliation and life everlasting by Christ. This covenant was first of all revealed and delivered to our first parents in the garden of Eden, immediately after their fall by God himself, in these words, The seed of the woman shall bruise the serpent’s head: and afterward it was continued and renewed with a part of Adam’s posterity, as with Abraham, Isaac, Jacob, David, &amp;c. but it was most fully revealed and accomplished at the coming of Christ.

In the Covenant I will consider two things, the parties reconciled between whom the covenant is made, &amp; the foundation thereof. The parties are God and man. God is the principal, &amp; he promiseth righteousness and life eternal in Christ: Man again binds himself by God’s grace to believe &amp; to rest upon the promise. Here it may be demanded why man is more in the covenant then angels. Answ. The will of God in this point, is not revealed unless it be because angels fell of themselves, not moved by any other: but man did fall by them.

Again it may be asked, whether all mankind were ever in the covenant or no? Ans. We cannot say that all &amp; every man hath been &amp; now is in the covenant, but only that little part of mankind which in all ages hath been in the Church of God; &amp; hath by faith embraced the covenant. as Paul plainly avoucheth, The scripture (saith he) hath concluded all under sin, that the promise of the faith of Jesus Christ should be given [not unto all men] but to them that believe.

Without faith no man can please God: and therefore God makes no covenant of reconciliation without faith. Again since the beginning of the world there hath been always a distinction̄ between man &amp; man. This appears in the very tenor of the words of the covenant made with our first parents, where God saith he will put difference between the seed of the woman &amp; the seed of the serpent: meaning by the seed of the woman, Christ with all the elect whom the father hath given unto him, who shall bruise the serpents head, and tread Satan under their feet. And by the seed of the serpent he meaneth wicked men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 259.</span></figcaption>

<blockquote><p>Hath Jesus Christ our Mediator confirmed the Covenant by his death! Then O Christian, keep up thy faith, and draw out thy faith, and exceedingly rejoice in Christ; for thy estate is sure, and thy soul is sure, and thy salvation is sure, all is sure, because all is surely confirmed by the death of Christ:

The death of Christ was a ratification to the whole Testament, to the whole covenant, and to every part and tittle of it: and as sure as Christ hath died, so sure art thou to enjoy all that God hath Covenanted with thee for there shall not fail one word of all the good he which [sic] hath promised.

Object Not one word? Not one good thing?

Sol. No, not any one; why then Mercy shall be thine, and Grace shall be thine, and Peace shall be thine, and Joy shall be thine, and Glory, and Salvation shall be thine, for all these, and more than these are promises by God in his Covenant, and are sealed by his death.</p></blockquote>

</figure><figure class="quote" id="q-9250e3080a" data-kw="">
<blockquote><p>We are told, then, that because the kingdom of God is near we must be converted and believe the gospel. We have already explained, though rather briefly, what is meant by ‘the kingdom of God.’ It means that God has chosen to reveal Himself to men from whom He was formerly estranged, and who were more or less cut off from Him. We have all been banished from the heavenly life by Adam’s sin and fall. God therefore sends his only Son and, as it were, with outstretched arms asks us to turn back to Him, for He is willing to receive us. Although we have strayed and are lost because of our demerits, He still wills to show us mercy. Because the kingdom of God is near, our Lord Jesus Christ urges men to repentance and faith. Notice first of all that nothing should move or inflame us to yield to God more than his offer of infinite grace and goodness. When Paul, for example, seeks to pierce men’s stony hearts and to soften their hardness and obduracy, he appeals to ‘the bowels of God’s mercy’ (Phil. 2:1). In speaking thus, he is really saying: ‘Will you now continue in our madness? Must you be worse than the devils? And when God comes to you, displaying his mercy and opening his heart to welcome you as his own children—when he gives you his own Son, will you be so unfeeling as not to be softened or inflamed by love for his grace? Will you not allow Him to lead you, and will you not delight in the goodness He shows you?’ It is in just this way that Jesus Christ urges men to repentance and faith. But on what does he base his appeal? On the fact that God wishes to draw near to those from whom He was once estranged. God, therefore, in receiving us in mercy, sets his goodness before us without waiting for us to seek Him out; he forestalls us with such exceptional grace that we cannot grasp even a hundredth part of it. Since He is so kindly disposed toward us, we should be rightly and deeply touched, to the very core of thought and feeling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Gospel of God</cite>, (Mt. 4:12, 17; Mk. 1:14–15; Lk. 3:19–20; 4:14–15)” in In the Power of the Spirit: Sermons on Matthew, Mark &amp; Luke, tr. Robert White (Banner of Truth, 2024), pp. 154–55</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We are told, then, that because the kingdom of God is near we must be converted and believe the gospel. We have already explained, though rather briefly, what is meant by ‘the kingdom of God.’ It means that God has chosen to reveal Himself to men from whom He was formerly estranged, and who were more or less cut off from Him. We have all been banished from the heavenly life by Adam’s sin and fall. God therefore sends his only Son and, as it were, with outstretched arms asks us to turn back to Him, for He is willing to receive us. Although we have strayed and are lost because of our demerits, He still wills to show us mercy. Because the kingdom of God is near, our Lord Jesus Christ urges men to repentance and faith. Notice first of all that nothing should move or inflame us to yield to God more than his offer of infinite grace and goodness. When Paul, for example, seeks to pierce men’s stony hearts and to soften their hardness and obduracy, he appeals to ‘the bowels of God’s mercy’ (Phil. 2:1). In speaking thus, he is really saying: ‘Will you now continue in our madness? Must you be worse than the devils? And when God comes to you, displaying his mercy and opening his heart to welcome you as his own children—when he gives you his own Son, will you be so unfeeling as not to be softened or inflamed by love for his grace? Will you not allow Him to lead you, and will you not delight in the goodness He shows you?’ It is in just this way that Jesus Christ urges men to repentance and faith. But on what does he base his appeal? On the fact that God wishes to draw near to those from whom He was once estranged. God, therefore, in receiving us in mercy, sets his goodness before us without waiting for us to seek Him out; he forestalls us with such exceptional grace that we cannot grasp even a hundredth part of it. Since He is so kindly disposed toward us, we should be rightly and deeply touched, to the very core of thought and feeling.”

— John Calvin, “The Gospel of God, (Mt. 4:12, 17; Mk. 1:14–15; Lk. 3:19–20; 4:14–15)” in In the Power of the Spirit: Sermons on Matthew, Mark &amp; Luke, tr. Robert White (Banner of Truth, 2024), pp. 154–55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+told%2C+then%2C+that+because+the+kingdom+of+God+is+near+we+must+be+converted+and+believe+the+gospel.+We+have+already+explained%2C+though+rather+briefly%2C+what+is+meant+by+%E2%80%98the+kingdom+of+God.%E2%80%99+It+means+that+God+has+chosen+to+reveal+Himself+to+men+from+whom+He+was+formerly+estranged%2C+and+who+were+more+or+less+cut+off+from+Him.+We+have+all+been+banished+from+the+heavenly+life+by+Adam%E2%80%99s+sin+and+fall.+God+therefore+sends+his+only+Son+and%2C+as+it+were%2C+with+outstretched+arms+asks+us+to+turn+back+to+Him%2C+for+He+is+willing+to+receive+us.+Although+we+have+strayed+and+are+lost+because+of+our+demerits%2C+He+still+wills+to+show+us+mercy.+Because+the+kingdom+of+God+is+near%2C+our+Lord+Jesus+Christ+urges+men+to+repentance+and+faith.+Notice+first+of+all+that+nothing+should+move+or+inflame+us+to+yield+to+God+more+than+his+offer+of+infinite+grace+and+goodness.+When+Paul%2C+for+example%2C+seeks+to+pierce+men%E2%80%99s+stony+hearts+and+to+soften+their+hardness+and+obduracy%2C+he+appeals+to+%E2%80%98the+bowels+of+God%E2%80%99s+mercy%E2%80%99+%28Phil.+2%3A1%29.+In+speaking+thus%2C+he+is+really+saying%3A+%E2%80%98Will+you+now+continue+in+our+madness%3F+Must+you+be+worse+than+the+devils%3F+And+when+God+comes+to+you%2C+displaying+his+mercy+and+opening+his+heart+to+welcome+you+as+his+own+children%E2%80%94when+he+gives+you+his+own+Son%2C+will+you+be+so+unfeeling+as+not+to+be+softened+or+inflamed+by+love+for+his+grace%3F+Will+you+not+allow+Him+to+lead+you%2C+and+will+you+not+delight+in+the+goodness+He+shows+you%3F%E2%80%99+It+is+in+just+this+way+that+Jesus+Christ+urges+men+to+repentance+and+faith.+But+on+what+does+he+base+his+appeal%3F+On+the+fact+that+God+wishes+to+draw+near+to+those+from+whom+He+was+once+estranged.+God%2C+therefore%2C+in+receiving+us+in+mercy%2C+sets+his+goodness+before+us+without+waiting+for+us+to+seek+Him+out%3B+he+forestalls+us+with+such+exceptional+grace+that+we+cannot+grasp+even+a+hundredth+part+of+it.+Since+He+is+so+kindly+disposed+toward+us%2C+we+should+be+rightly+and+deeply+touched%2C+to+the+very+core+of+thought+and+feeling.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%9CThe+Gospel+of+God%2C+%28Mt.+4%3A12%2C+17%3B+Mk.+1%3A14%E2%80%9315%3B+Lk.+3%3A19%E2%80%9320%3B+4%3A14%E2%80%9315%29%E2%80%9D+in+In+the+Power+of+the+Spirit%3A+Sermons+on+Matthew%2C+Mark+%26+Luke%2C+tr.+Robert+White+%28Banner+of+Truth%2C+2024%29%2C+pp.+154%E2%80%9355&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9250e3080a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9250e3080a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=We%20are%20told%2C%20then%2C%20that%20because,very%20core%20of%20thought%20and%20feeling&amp;text=We%20are%20told%2C%20then%2C%20that%20because%20the%20kingdom&amp;text=to%20the%20very%20core%20of%20thought%20and%20feeling" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

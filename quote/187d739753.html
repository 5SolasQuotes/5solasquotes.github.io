<main class="wrap"><figure class="quote" id="q-187d739753" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more. Christ was not strict enough for the Pharisees, in keeping the Sabbath, nor in his company, nor in his diet. Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it. If he cannot destroy zeal, by scorning it and quenching it; he will try to do it by overheating and distempering it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 57, p. 270</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

</figure><figure class="quote" id="q-fd7f6ad98e" data-kw="">
<blockquote><p>…a definition of the worship of God may be framed thus: The worship or service of God is when, upon right knowledge of God, we freely give Him the honor that is proper to him, in our hearts, according to his own will. Worship thus defined must be condsidered as a distinct thing from that honor which is called ‘veneration’. For worship properly belongs to persons, and veneration to things which appertain to persons. And veneration is to have a reverent estimation of anything or to preserve and keep it without hurt, as making store of it, and to use it reverently if it be to be used.</p></blockquote>

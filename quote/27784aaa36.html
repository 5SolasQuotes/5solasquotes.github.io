<main class="wrap"><figure class="quote" id="q-27784aaa36" data-kw="">
<blockquote><p>When you [congregationalists] say that ‘a seal does not make a thing that was not, but confirm a thing that was,’ while you would seem to refute Papists, who vainly teach that sacraments do confer grace ex opere operato, by the deed done, yet do you make the sacrament but a naked sign and take part with Arminians and Socinians, whose very arguments in express words you use, for Socinius goes before you in this argument, and so does Smalcius follow him: ‘To obsignation and sealing there is required the trying of the thing, and some teaching or document; but that ceremony (a baptism) and that rite, though it be holy, does nothing to the remission of sins, but it does only shadow out, and as it were delineate and point forth remission of sins by the washing of water exponed in the Word of God.’ You say, ‘Sacraments do not make a thing that was not, but confirm a thing that was before;’ you can have no other meaning than to deny all causality and all real exhibition of grace in the sacraments: for if a sacrament make not a thing that was not before, or if God give not, and really produce, confer and exhibit grace, and a stronger measure of faith, and assurance of remission of sins, at the due and right use of the sacrament [that is with faith], the Sacrament is a naked sign, and not an exhibitive seal. But if† Christ give and in the present exhibit as surely remission of sins, as the infant is washen with water, as our divines and the Palatinate [Heidelberg] Catechism teaches, yea and the [Belgic] confession thereof, and the Synod of Dort teaches, then by the sacrament of baptism, a thing is made that which it was not. † [That is, this does not necessarily always occur, but if it does, then etc.] It is true a civil seal, as I said before, adds no new lands to the owner of the charter, but if Christ by his seals rightly and in faith used, do not only confirm grace and pardon, but also really exhibit and give grace and pardon in a further degree, and a new measure of assurance to the conscience which there was not before, you go not a streas [star’s?] breadth from Arminians and Socinians, especially seeing Episcopius, Henricus Welsingius say that remission of sins is not sealed by baptism, but signified only, and the Remonstrants in their Apology, while they expone our communion with Christ in the Lord’s Supper, and will reject a physical union of our souls with the physical substance of Christ’s body, which we also reject, they say that communion signifies, ‘only a profession of one and the same worship, whereby Christians solemnly testify that they adhere to Christ as to be partaker of the table of devils and of devils themselves, 1 Cor. 10:18,20, is a testimony of a communion with the devils’: But the Word of God says more, Gal. 3:17, ‘As many of you as are baptized have put on Christ;’ So Rom. 6:3, ‘Therefore we are buried with Him by baptism unto his death, that like as Christ was raised up from the dead, by the glory of the Father, even so we also should walk in newness of life,’ Eph. 5:26, ‘That He might sanctify and cleanse his Church with the washing of water by the Word,’ Tit. 3:5, and 1 Pet. 3:21, ‘The like figure whereunto even baptism does also now save us, etc.’ All this is more than a naked signification, otherwise manna saved Israel, and the water of the rock did wash them from their sins, and the sacrifice of bulls and goats did cleanse from sin, and open Heaven to sinners. Therefore by baptism and the Lord’s Supper something is made what it was not before, as by partaking of the table of devils, the partaker is really made a partaker with the devil, and an idolater; and his idolatry that he committed before was not only confirmed and signified to be what it was before. And in this civil seals and sacraments differ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 2, ch. 4, section 5, pp. 216-18</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1233e8e1e" data-kw="">
<blockquote><p>Furthermore, did Christ deliver his Last Supper to all his disciples that were present? Did none stand by, and gaze on while other received? Then hereby fall to the ground the private communions of the popish Church, where all is devoured by the priest, nothing delivered to the people. For whereas the ordinance of Christ and ancient order of the church was for the minister and people to receive the sacrament together: among them the priest accompanied with his boy to make answer, receives the sacrament himself alone, without distribution made to others, yea although the whole congregation be present and look upon him, whereby God is dishonored, the communion is abolished, the people of God are there by deprived and robbed of all comfort. How is this a feast which the priest prepares for himself, not for others: receives by himself, not with his brethren: he speaks to himself, and not to the assembly: he uses a strange tongue, and no man knows what he means: the people is taught nothing, they understand nothing, they hear nothing, they receive nothing; and a few childish, apish, foolish, and unseemly gestures excepted, they see nothing: they taste nothing, they partake nothing, neither comfort of heart, nor memory of Christ, nor benefit of his passion. But Christ in his Last Supper, did not eat up all alone, but after the disciples had supped as Mathew sets it down, He took bread and blessed He brake and gave it to them, saying, ‘Take ye, eat ye:’ neither did He drink alone of the fruit of the vine, but taking the cup He gave thanks, and gave to them all, saying, ‘Drink ye all of this.’ So then, albeit a certain number of communicants are not limited and determined: yet Christ in these words appoints a company to be present, as appears by the number, ‘take ye, eat ye,’ ‘drink ye all,’ ‘divide ye it among yourselves,’ ‘do ye this in my remembrance,’ ‘ye set forth the Lord’s death,’ ‘when ye come together to eat,’ ‘tarry ye one for another,’ ‘as often as ye shall eat this bread.’ These words cannot be understood of one particular man, but necessarily import a greater number of men: nay, the Philosopher teaches that the word ‘all’ must be verified at the least of the number of three, which is the least and lowest number that would be admitted to this supper. Neither do we read that so soon as one was gained to the faith, that the apostles administered this sacrament to him, much less would they minister to themselves alone, when none were converted in a nation or city.</p></blockquote>

<blockquote><p>But since this sacrament [of baptism] is a solemn reception into the church of God, or rather a testimony of burghership in the heavenly city into which are enrolled all those whom God adopts for his children, above all things it is to be observed that it is not lawful to administer it except in the society of professed believers. Not that it is necessary to have a public temple, but assuredly it is indispensable that there should be a certain flock assembled, forming a body constituted as a church, and recognizing for its pastor, the person appointed to baptize. For should a child be baptized in private and without witnesses, the ceremony would in no wise correspond to the ordinance instituted by Jesus Christ, nor to the practice of the Apostles. It is then requisite that the child should be baptized in a society that keeps itself separate from the pollutions of Popery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of John Calvin</cite>, vol. 3 ed. Jules Bonnet trans. Marcus Gilchrist (Philadelphia: Presbyterian Board of Publication), Letter 368, ‘To John Paule’, p. 87</span></figcaption>

0of%20Popery" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>From baptism, you [Gilbert Burnet] pass to plead for the private administration of the Communion to persons on death-bed, and this you think the seasonableness of its use and the propriety of its ends to such a case do abundantly persuade: To which I answer:

1. That though at no time faith and love need more to be quickened, the death of Christ more to be remembered, nor communion with the Church to be declared, than in the approach of the last pangs, it will not thence follow that therefore the Communion may then be privately administrat[ed]: for, since not the seasonableness of the fruits, but the warrant and rule given unto us is first to be heeded in the going about of holy administrations; nay, since that without this regard duly adhibit the blessing and fruits are but in vain expected, it is evident that barely from the exigence of the fruits to conclude, in any case, the lawfulness of the celebration, is preposterous religion and worse reason: Now 2. That the rule set down to us in this sacrament does reprobate this your observance is evident not only from that connection that there is and ought to be observed betwixt the word and Sacraments: But, 1. From our Lord’s own pattern in the institution, keeping this solemnity with the company of his disciples, making as it were a little Christian Church:

2. Because the apostle in his regulation of this sacrament, according and with respect to his Master’s pattern, does suppose the Church’s coming together into one place, and consequently the ordinary Church assemblies, as a necessary requisite in the free and peaceable times of the Church:

3. Because the very mystery of the Lord’s Supper, representing the union of believers with and their communion in Jesus Christ their Head and the name that it has thence obtained, 1 Cor. 10:16-17, is not well consistent with this private administration: ‘Tis true, the authors of your [Perth] Articles, not being able to decline the convincing evidence of this reason, do, among other preparations, require that there be three or four, free of lawful impediments, present with the sick person to communicate with him; but as such a packed conventicle, beside other inconveniences, has no just resemblance of the Church her ordinary assemblies, much less can communicating with hand-wealed companions be a sign of that free, equable and comprehensive communion signified by this sacrament; so, it is manifest, that the forementioned requisite is only a colorable evasion, manifestly acknowledging the force of our argument, andin fraudem Legis, salvis verbis sententiam ejus circumveniens: But 3. This your private Communion is to be reprobate because, as the decumbent’s faith, love, and other graces in that hour of his need are only best excited by the means at that time allowed and competent, and the sanctified remembrance and improvement of other privileges and ordinances formerly enjoyed, so, it is certain, that this observance has not only been abused by the Papists unto the abomination of their private mass, but is also rejected by the Reformed Churches, not Lutheran, as found to be inductive of vain superstition wherever it is used; and for this I need not go far in search of confirmations, for you yourself in telling us that your practice was very early in the Church, subjoin that Justin Martyr says they sent of the Eucharist to them that were absent, and that the story of Serapion shows how necessary Christians then thought it to be guarded by this holyviaticum[journey], which two instances, whether true or false, being generally held to be an excess, both inclining to and introductive of vain superstition, and therefore, reckoned among the first Naevi [novelties] appearing in the face of the primitive Church, and now generally disused by all the Churches of Christ, as they are by you adduced, do to evidently demonstrate how much both your spirit and customs do bend to a relapse in these evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam?] 1671), 5th Dialogue, pp. 292-94</span></figcaption>

<blockquote><p>As to that question, Whether baptism may be lawfully administred extraordinarily where the child is ready to die? It was resolved that in those places where the Word of God is ordinarily preached, the established order shall be observed; but in such places where sermons are had only extraordinarily, at an undue hour, it is left to the minister’s discretion to accommodate themselves to the infirmities of parents, yet to be very careful that they do not nourish them up in superstition.</p></blockquote>

</figure><figure class="quote" id="q-e15e1b5f18" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing, and we are not only to shun that which gives scandal, but also that whereupon follows a scandal taken, whatsoever it be, if it be not necessary. This is so evident, that Papists themselves subscribe to it, for both Cardinal Cajetan and Dominicus Bannes say that we should abstain even spiritualibus non necessariis [non-necessary spiritual things] when scandal rises out of them. … XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious; and from things that are not necessary, we ought to abstain for the scandal of the malicious as well as for the scandal of the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, p. 32-33</span></figcaption>

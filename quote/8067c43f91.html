<main class="wrap"><figure class="quote" id="q-8067c43f91" data-kw="">
<blockquote><p>The name of that angel, who first became wicked is Satan. When the first man and woman were created, he came flying from his black prison; he saw the man and the woman, he hated them because they were good, and loved Jehovah, and loved one another. Satan persuaded the man and woman to turn away from Jehovah, and to become wicked like himself.

And ever since, he, and many of his angels, have often come into this world. Men and women, we perceive that they are in this island, though you do not see nor hear them. They have been here persuading you to be wicked. These vile spirits take great delight to see men and women mingling together like the beasts of the field, without any true love to each other, and forgetful that they bear the image of Jehovah on their souls within their bodies. These wicked spirits take pleasure in blood, especially in the blood of little harmless infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Addresses to the People of Otaheite, Designed to Assist the Labour of Missionaries and Other Instructors of the Ignorant. To which is Prefixed A Short Address to the Members and Friends of the Missionary Society in London in Sermons Preached on Public Occasions: With Fifteen Addresses to the People </cite></span></figcaption>

<blockquote><p>Ineffectual calling is of the reprobate.—It is called ineffectual not per se [in-of-itself] but per accidens [by accident, or contrary to its intention], not in respect of God who calls, but in respect of men who have deaf ears of the heart. In itself calling is always effectual, although it is not so in those who are perishing, as the sun is effective by his light in itself, although it by no means illumines the blind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, (d. 1610; Hanover, 1624-25), sect. 6, p. 32 as quoted in Heinrich Heppe, Reformed Dogmatics, ed. Ernst Bizer, tr. G.T. Thompson (1861; 1950; Wipf &amp; Stock, 2007), p. 517</span></figcaption>

</figure><figure class="quote" id="q-9e6d3c36ef" data-kw="">
<blockquote><p>55. Nor can it [unregenerate choice] apprehend offered grace, unless it first receives through regeneration the faculty of apprehending.

56. In receiving this faculty of apprehending grace and assenting to the promise, it conducts itself merely passively, because then the choice is only the subject in which God works, in which he imprints new qualities and inclinations (Ezk. 11:19; 36:26; Eccl. 17:14; Job 33:3-6; Jn. 1:13).

57. But in the very apprehension of grace, or the act of apprehending, it conducts itself both passively and actively; for the choice acts, but having been acted upon by the Holy Spirit (Ezk. 36:27).

58. For one thing is δύναμις, the faculty of apprehending; another is ἐνέργεια, the act of apprehending or the apprehension itself.

59. After the choice has been regenerated, it indeed wills and does good, and perseveres in it, but only insofar as God effects and confirms these things in it (Phil. 1:6, 2:13; 1 Cor. 4:7; Jn. 15:5; 1 Cor. 12:3, 1:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Choice of Man’, pt. 2</cite>, (Basel: Waldkirchius, 1597) trans. at Obedientia Mortis Christi Latin</span></figcaption>

<blockquote><p>Neither Zwingli, nor Calvin, nor any one of us, places, without distinction in heaven with the saints, all infants who die without baptism, whether unborn or in birth, or while they are carried to baptism, but they pronounce this, by the law of charity, of the infants alone of the Church, born in the Covenant if they be prevented by death, nevertheless, without interference with the election of God, which as of old in the family of Abraham and Isaac, so in after time often hath made, and doth make a discrimination which we are neither to search into nor to scoff at, but to adore (Rom. 9:11). This is the constant judgment of ourselves, and of our divines concerning this question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism and Infant Salvation</cite>, As quoted in Krauth, … (Philadelphia: Lutheran Books Store, 1874), p. 20. Krauth gives as the reference: Pareus, Castigations in Bellarmine on the Loss of Grace (1613), Book 6, p. 871, though the page number does not exactly correspond to the Google Books edition (1613), though it appears to be close.</span></figcaption>

<blockquote><p>4. It is from the unsuitableness that is betwixt the things of Christ and the temper of a sinner. Christ’s yoke does no way fit a carnal heart… It is the base love of this present world that makes the call of the Gospel so unsuccessful and ineffectual; you may see it in that parable, Mt. 22:5: They make light of the tenders of Christ, and what is the reason? why the farm and the oxen, and the merchandise were in the case; these must not be left for Christ where lust has the casting voice. O how sad is this! if Christ should offer you riches and honors, you would come; and yet for heaven and glory you will not.</p></blockquote>

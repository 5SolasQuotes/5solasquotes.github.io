</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3fe43b0229" data-kw="">
<blockquote><p>11. We thought it meet to subjoin the full proof of every word [of our agreed upon articles] from the Scripture, that it might be past controversy with all believers. Concerning the texts cited, I must desire you to observe that every text does not express the very words that we have put down, but all express the sense and sum of the words; so that I think scarce two syllables can be found that are not expressly in the words of Scripture, which contain any matter that is liable to controversy. If you find ten texts cited for one thing, if the words be not in nine of them, it is sufficient if they be in the tenth; and therefore I must intreat you, if you doubt, to peruse them all. And let not the number offend you: If you need them not, they are no trouble to you: Few of them, I think, or none, are impertinent: A consent of many texts may convince more than one single text: at least it will be useful to have so many texts at hand for the convincing any others of any article of the Faith, though you doubt not yourselves. Only the particular application of some parts of the last branch, viz. ‘our consent that such a man shall be our pastor,’ and that ‘we will be members of this or that particular church:’ cannot be proved in terms from Scripture, but by consequence: For who can expect that Scripture should name the persons of our pastors or the places of our habitation?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>…and since Christ prayed for infants and blessed them, which is a praying for them, Gen. 48:15,16; Deut. 33:1.6-8, etc.; Eph. 1:2; Gal. 1:3; 1 Cor. 1:3; 1 Tim. 1:2; 2 Tim. 1:3; see Mk. 10:16; He must own them as blessed in Christ in whom all the nations of the earth are blessed, and so Covenanted with God in Christ.</p></blockquote>

<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (1641), p. 4</span></figcaption>

</figure><figure class="quote" id="q-c72dbed8e3" data-kw="">
<blockquote><p>The learned [John] Selden [an Erastian] in his discourse of the Civil Right of Tithes, has endeavoured to prove this [that tithes are not by any Divine Law due to the ministers of the Gospel]. There has been a war in the Romish Church about this question, between the canonists and the scholastics; the former hotly maintaining that tithes are due to the Church jure divino [by divine right]; the latter, that they are due only by ecclesiastical constitution: so says [Robert] Bellarmine, and other of their learned men. Yet some of their theologues, agree with the canonists: So does Baronius (Annals, tome 1, anno. 57, s. 74)… Among Protestant writers, prelates, and prelatical men plead hard for the divine right of tithes as the ministers’ due. Bishop [Lancelot] Andrews and Bishop [George] Carleton have said as much for it as any that I have seen. But most of our reformed divines maintain the negative. So Peter Martyr (Common Places, pt. 4, ch. 13), Zanchy (Of Redemption, book 1, ch. 16), Daneus (Ethic., book 2, ch. 10 [also in 4th Precept, p. 810]), Rivet (in Genesis, exercitation 80), Voetius (Eccle. 1, book 4, p. 824): And to this we adhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/increase-mather.html">Increase Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning the Maintenance due to those that Preach the Gospel</cite>, (1706) Mather was a New England, congregationalist puritan minister., pp. 48-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>Rather the question concerns the first moment when he is converted and receives new life by regeneration. We contend that he is merely passive in this, as a receiving subject and not as an acting principle. Again, the question is not whether man is able to convert himself without grace. Rather the question is whether he is able to cooperate with that exciting grace.</p></blockquote>

</figure><figure class="quote" id="q-0985b8d1c9" data-kw="">
<blockquote><p>As God raised Christ from the dead and set him at his own right hand in heavenly places; so you, that were dead in sins, hath he quickened and raised you up together in him. This analogy is the very thing he would have them understand. They had undergone a great change; they had been brought to life; they had been raised from the dead by the same almighty power which wrought in Christ. There was as great a difference between their present and their former condition, as between Christ in the tomb and Christ at the right hand of God.</p></blockquote>

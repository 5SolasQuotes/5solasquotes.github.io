<main class="wrap"><figure class="quote" id="q-916a188361" data-kw="">
<blockquote><p>Every man naturally makes a god of himself, is his own Alpha and Omega, the beginning of his actions, and the end of them, which is proper to God. … Self-righteousness is men’s great idol, which, when all other baser and grosser idols are down, they do all seek to establish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary, or, A discovery made of those glorious privileges offered unto the penitent and faithful under the Gospel unfolding their freedom from death, condemnation, and the law, in forty sermons upon Romans, Chap. 8</cite>, (1670) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 312.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f49c1f4576" data-kw="">
<blockquote><p>At their famous council of 754, the iconoclasts, as is well-known, did not denounce all representations of Christ but only those which attempted in one way or another to stimulate his outward form or appearance by means of painting or sculpture. In fact, they specifically endorsed what they called the image of Christ as set forth in the Eucharist… Many, however, seem not to be aware that the iconoclasts at the same time announced their approval of still another, and, from the ethical point of view, at least, more significant conception of an image, which described the virtues of the saints as living images and called for their imitation. This spiritual or ethical interpretation of the image is probably to be understood as a part of the iconoclastic campaign to purify Christian worship of what many took to be superstitious and idolatrous practices. Our knowledge of these iconoclastic efforts in the direction of reform, dating from the so-called First Iconoclastic period (726-787), we owe principally to the text of the oros, (Horos, or dogmatic definition) and anathemas pronounced by the iconoclastic Council of 754… Apart from a brief general introduction and conclusion, the florilegium of 754 consists of eight excerpts from the fathers, of which all but two deal with what I shall, for the sake of brevity, call the ethical theory of the image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers</cite>, vol. 8 (1954), pp. 153-60, p. 153</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-789a0114c6" data-kw="">
<blockquote><p>Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal Son in whom dwells the fullness of the God head, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine Majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, Sermon on Deuteronomy, May 23, 1555</span></figcaption>

</figure><figure class="quote" id="q-e683d53964" data-kw="">
<blockquote><p>if any man go about to express God’s Majesty by any shape: he does Him wrong, and it is high treason to Him, because He is uncomprehensible in his glory… Now we see that the Papists have gone about to express God by shapes: therefore it follows that they have marred all religion. And whereas they allege that there were cherubins painted upon the vail of the Temple, and that two likewise did cover the ark: it serves to condemn them the more. When the Papists pretend that men may make any manner of image: What, say they? Has not God permitted it? No: but the imagery that was set there, served to put the Jews in mind that they ought to abstain from all counterfeiting of God, insomuch that it was a mean to confirm them the better, that it was not lawful for them to represent God’s Majesty, or to make any resemblance thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 23, the 5th upon Dt. 4, p. 138</span></figcaption>

</figure><figure class="quote" id="q-31910b646a" data-kw="">
<blockquote><p>Ninethly… Images, however, which are misused for worship, I do not count among ceremonies, but among the number of those things which are diametrically opposed to the Word of God. But those which do not serve for worship and in whose cases there exists no danger of future worship, I am so far from condemning that I acknowledge both painting and statuary as God’s gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rule of Faith in</cite>, ed. James Dennison, Jr., Reformed Confessions… (RHB, 2008), vol. 1, pp. 131-32</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c0fb8a2f9f" data-kw="">
<blockquote><p>Therefore, because cruel and greedy masters should not use them too hardly, God remembered them in his creation, and made every week one day of rest, wherein they should be as free as their masters, Gen. ii. 2; so God pitieth the labourer from heaven, and every Sabbath looks down upon him from heaven, as if he should say, One day thy labours shall have an end, and thou shalt rest for ever, as thou restedst this day.

By this we see, as David did limit Joab, that he should not kill Absalom, 2 Sam. xviii. 5, so God hath bound masters, that they should not oppress their servants. Shall God respect thine more than thou? Art thou made fresher to thy labour by a little rest? And is not thy servant made stronger by rest to labour for thee? How many beasts and sheep did Laban lose, only for hardly entreating of a good servant, Gen. xxxi. 9; therefore that is the way to lose, but not to thrive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 33.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b49b78d7ff" data-kw="">
<blockquote><p>…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jekyll.html">Thomas Jekyll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peace &amp; Love Recommended &amp; Persuaded in Two Sermons</cite>, … (1675) Jekyll (d. 1698) was an Anglican minister.</span></figcaption>

</figure><figure class="quote" id="q-392310d4f8" data-kw="">
<blockquote><p>I hasten to mark out decisive proofs of this wide-wasting treason against the Majesty of the Holy Spirit of the living God.

Of these, the first and most prominent is —

Sabbath-breaking, or the prostitution of Sacred time.

Were it my design to establish the authority of this wise, good, holy institution, I might go back to the foundation of the world, and to the bowers of the original paradise; or I might call you to listen to that terrific voice of words, which, issuing from the tempestuous darkness and flames of Sinai, conveyed terror to the breasts of millions, while it pronounced the statute of Heaven, “Remember the Sabbath-day to keep it holy.” But I take it for granted, that the institution is Divine. My present object is to mark the atrocity of its violation, as implying a vile contempt of the influences of the Holy Spirit.

When the glorious Saviour, having finished the mysterious purchase of salvation, rose to endless life and dominion on the first day of the week, the honours of the Sabbath were justly transferred to that day; and its hours became peculiarly sacred and auspicious, as the season when mortals, humbly waiting upon God, might hope to be visited with those operations of the Spirit of Jesus Christ which apply the blessings of redemption. What then might be expected in a country wherein such a Sabbath is made known?

We plead not for the formal austerities of hypocrisy; but we contend for it, and all the sophistry in the world cannot resist us, that to refuse a serious, diligent observation of the Christian Sabbath, with a view to the spiritual ends of its appointment, is to contemn those influences of the Eternal Spirit, which bring salvation, and heaven, into immortal souls. Every Sabbath-breaker is such a despiser; every act of Sabbath-breaking expresses such contempt.

What then must be the state of a country filled with such rebels? Be astonished, ye Heavens; be ashamed, thou Sun, whom the Spirit of God placed in the skies — withdraw thy shining beams from the haunts of such transgressors; and thou solid Earth, tremble under their steps, while they assemble in unashamed crowds, to declare, before angels and men, how much they despise the Majesty and Grace of thy Creator!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Radical Cause of National Calamity: A Sermon, Preached at the Scots Church, Crown Court, Russel Street, Covent Garden, October 27. 1794 in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, and A Serious Call Respecting a Mission to the River Indus</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>But if we love Christ and our souls better then our lives, let us resolve never to embrace any conditions of Peace which mingle the Inventions of men with the truth of God: Let us maintain the Doctrine of free Justification, our Salvation depends upon it, and let us preserve the Worship of God entire and pure; for saith he, if we look only to matters of Faith, and contend not for purity of Worship, we seem to have less care of God’s honour, then of our Salvation.</p></blockquote>

<blockquote><p>4. When a man, finding that God is a free and intellectual Agent, and sees, as he may by natural reason, everything ordered to a suitable end to his Being, and by a suitable means or rule conducing to that end, and finds a higher degree of being in himself than in other creatures, and consequently an higher end, and consequently an higher rule conducing to that end, he does most naturally resolve this rule into that law, which by the will of God is given to man conducing to that end, the subject of which rule must be all his internal and external actions, both in reference to God, to himself and to others: but here then is the next question, and the next degree of ignorance in men, viz. What that law or will of God is concerning man? and from hence grow those varieties and errors in worship of God. And though haply most men, knowing the true God, may by the same Light of Nature concur in the general and fundamentals of worship, viz. That God is to be feared with all reverence, loved with all intention, obeyed with all sincerity, cheerfulness and exactness: all which are but natural conclusions from the nature of God, the nature of Man, and the relation that he bears to God, as his Creator, Lord, and Preserver…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-hale.html">Matthew Hale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of God, &amp; of Ourselves I. by the Light of Nature, II. by the Sacred Scriptures</cite>, (London: 1688), pt. 1, ‘By the Light of Nature’, ch. 5, pp. 87-88</span></figcaption>

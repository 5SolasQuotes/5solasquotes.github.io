<blockquote><p>1. What it is that is the formal reason of it, — that which renders him a meet object of the church’s worship, and the church’s worship to be truly divine or religious. 2. What is the principal motive prevailing with us to give him this glory and honour. For the first, it is no other but the divine nature. The natural and essential excellencies of the Deity are the formal reason and proper object of all divine worship.

We worship the Lord Christ, who is God and man. He is so in one person; and his person who is God and man is the object of that worship. But the formal reason and object of it is the divine nature in that person. Give me leave to say, God himself could not command the Lord Christ to be worshipped with divine religious adoration were he not God by nature, for the thing itself implieth a contradiction. Religious worship is nothing but an assignation of that honour which is due to divine excellencies; namely, to trust, believe, fear, obey, love, and submit unto infinite holiness, goodness, righteousness, power, in the first cause, last end, and sovereign Lord of all.

Now, to assign glory proper to divine excellencies, and which receiveth its nature from its object, where divine excellencies are not, is openly contradictory. Besides, God hath said, “I am the LORD: that is my name: and my glory will I not give to another,” Isa. xlii. 8. He that hath not the name of God, (that is, his nature,) shall not, nor can have this glory, which is to be the object of the worship mentioned. And there are scarcely more gross idolaters in the world than those who profess to worship Christ and to believe in him, in a word, to give him all the glory that is due to God, and yet deny him so to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 549-50.</span></figcaption>

<blockquote><p>One of the basic principles of covenant theology is that we must presume continuity with the Old Testament unless discontinuity can be proved from the New Testament. In other words, when God gives a command we must presume that it is still in force unless he has altered it. William Twisse helpfully applies this to the issue of Sabbath observance:

For in this respect it was, that at the first the Lord blessed the seventh day and sanctified it: and some thousand of years after gives this reason, why after six days of labour the seventh being the Sabbath of the Lord our God, no manner of work should be done therein: which being once thus ordered by the Lord of the Sabbath, it must be in force of perpetual observation, as a requisite determination of the morality of this Law; and not of an alterable nature, save only by the same authority whereby it was ordained.

Now to my understanding, by the fourth Commandment it is clear: First, that God commanded some time to be set apart, and sanctified unto his service. Second, that the proportion of this time he hath defined to be one day in seven. Thirdly, that the particular day under this proportion was designed to be the seventh, and that unto the Jews in correspondence to the seventh day from the first creation, whereon God commanded them to rest from all their works, like as on that day the Lord rested from his works. And there is no question amongst Christians, but that all this ought to be religiously observed by the people of God, until the Lord himself manifest his pleasure for alteration, and no farther, in any particular, than God shall manifest his pleasure for alteration.

As for example. First for the time, then for the rest, lastly, for the service of the day it self. First, if God hath not manifested his will for any alteration, of setting apart some time for divine service; we must still continue to set some time apart for divine service. Likewise, if God hath not manifested his pleasure, to have the proportion of time altered, which hath been originally allotted unto his service, we must not presume to allow a less proportion of time for his service, than hath been formerly prescribed by him. […] And as for the particularity of the day, if God hath manifested his pleasure to have it altered, it must be altered, (as in case it appear to have been ceremonial, in respect of the rest commanded thereon) and another in the seven substituted in place thereof, and that according to God’s direction, and not otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the morality of the fourth commandment, as still in force to bind Christians. Delivered by way of answer to the translator of Doctor Prideaux his lecture, concerning the doctrine of the Sabbath</cite>, (London, 1641), the preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal Son in whom dwells the fullness of the God head, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine Majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>

<blockquote><p>So much of the Parts of God’s Worship prescribed, together with the right use and abuse thereof. What say you of such Forms of Worship as are not prescribed by God in his Word?

We are commanded to serve God, not according to the Traditions of Men, but according to his Will revealed in the Scripture, Col. 2. 18, Mat. 15. 9.

What followeth hereupon?

That no Power must be admitted in the Church to prescribe other Forms of Worship, not appointed by God himself in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: or, The Sum and Substance of Christian Religion</cite>, ed. Michael Nevarr (1648; Herndon VA: Solid Ground Christian Books, 2007), p. 204.</span></figcaption>

We are commanded to serve God, not according to the Traditions of Men, but according to his Will revealed in the Scripture, Col. 2. 18, Mat. 15. 9.

What followeth hereupon?

That no Power must be admitted in the Church to prescribe other Forms of Worship, not appointed by God himself in his Word.”

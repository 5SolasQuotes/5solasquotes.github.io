<main class="wrap"><figure class="quote" id="q-9b55840893" data-kw="">
<blockquote><p>The ark of the covenant, with its lid as the mercy-seat, and the cherubims at each end with outstretched wings, was the whole furniture properly belonging to the most holy place in the tabernacle; it was the very heart and centre of the Old Testament dispensation, out of which all its ceremonial institutions grew, and around which they all in a manner circulated.

And why was the ark called the ark of the covenant? Simply because it contained, and was made for the sole purpose of containing, the two tables of stone, which formed what is called the book of the covenant; for the covenant made with the Israelites properly consisted in the Ten Commandments, and not, as is very commonly imagined, in the laws and statutes of ceremonial worship.

This is repeatedly affirmed, and in the most express terms. Thus, in Exod. xxxiv. 28, it is said of God, that he “wrote upon the tables the words of the covenant, the Ten Commandments.” And in Deut. iv. 13, ix. 9, 11, 15, the tables are constantly named the tables of the covenant which God made with them in Horeb. For this reason it was, then, that the ark, or chest, which stood in the most holy place, was called the ark of the covenant, being made for the single and express purpose of holding the words or tables of the covenant — the Ten Commandments; and the character which belonged to the ark, in the Old Testament dispensation, belonged to it merely as the sacred repository of these all-important statutes: so that they formed the very innermost point and centre of that former dispensation — the ground and basis on which its entire superstructure of rites and ordinances was reared.

And why so singular a place given to these Ten Commandments? No adequate reason can possibly be assigned but this — that together they formed the substance of that duty which God requires of man; they are the brief but comprehensive expression of God’s holiness, as manifested in his government of his creatures on earth; the sum and perfection of all righteous obedience — attained only when there is the exercise of perfect love to God, and perfect love to man.

Who could prevail to keep that summary of complete and faultless obedience? None but the Holy One of Israel; who alone could say, in the language prepared for him by the Psalmist, “Lo, I come to do thy will, O God.” Therefore, till he came, the most holy place, where these Commandments were kept, was a barred region, excepting once a year to the high priest, who typified the person and work of Christ; and the Commandments themselves were covered out of tight beneath the lid of the ark, which was the mercy-seat, and on which the blood of atonement was sprinkled, to testify the guilt of sin committed against these Commandments could indeed be purged away, but only by the blood of Him who was himself sinless, perfect in all the righteousness of God.

Thus was the work of Christ shadowed forth by these outward symbols; the law, or book of the covenant, in the centre of the whole, declaring the perfect righteousness he had to perform, even unto death, before any sinner could enter the presence of a holy God in peace; the mercy-seat revealing the well-pleased satisfaction with which God should contemplate the work of his Son, as that through which be could dispense pardon to the guilty; and the cherubims, with intent eye, looking into the glorious mystery of this great redemption, and ready, as birds on the wing, to “minister to those who should be heirs of salvation.”

Now it is obvious, that the whole meaning and design of this fundamental part of the Old Testament dispensation depends upon the Ten Commandments being that perfect rule and covenant of obedience, for the fulfilment of which Christ led his spotless lite, and shed his atoning blood.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c3b933e99" data-kw="">
<blockquote><p>I agree also, that the Law of the Sabbath is one of the Decalogue or Ten Commandments delivered to Israel on Mount Sinai. Ex. 20. But I am willing to think it was a Law before. Not only because we find it observed, Exod. 16. (before the giving of the Law on Mount Sinai, Ex. 20.) but especially because of that in Gen. 2. 3. God blessed the Seventh day and Sanctified it, because in it he rested from all his Work. And those who are most averse to the Morality (as it is wont to be called) or the Perpetuity of the Sabbath, or Day of Holy Rest, and are yet very zealous for the Holiness of Places, would be very fond of it if they could find so clear a Testimony, and so ancient, for the holiness of Place, as here is for that of Time.

I agree also that the Law of the Decalogue or Ten Commandments, though then given peculiarly to Israel, is Obligatory to Us also. For though some Clauses therein do peculiarly respect them; as that who brought thee out of the land of Egypt out of the house of bondage, and that thy days may be long in the land which the Lord thy God giveth thee, (which I think is there said with a particular respect to the land of Canaan, which God gave to Israel, not to us;) yet the Body of that Law and the preceptive part of it, I take to be Obligatory to others also, and to Us in particular; the Decalogue being Declarative of what was (I think) a Law before (however neglected or forgotten,) and is by Christ and his Apostles frequently cited as such, even to Gentiles as well as Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wallis.html">John Wallis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A defense of the Christian Sabbath in answer to a treatise of Mr. Tho. Bampfield pleading for Saturday-sabbath</cite>, (Oxford: Chr. Coningsby, 1692), pp 3-4.</span></figcaption>

<blockquote><p>The relation of the law to the Gospel is one of the most important questions of theology. To misunderstand it, is to misunderstand the whole theory of the Divine government, and the whole plan of redemption. It needs not to add that it is, in a very marked and special sense, one of the questions of the day.

Views regarding it have been recently, and ostentatiously promulgated, which cut far deeper into the foundations of both morality and religion, than is at all perceived by multitudes of those who favourably listen to them, or even by some of those who adopt and teach them. …

In bringing out the relation of the law to the mission and work of Christ, the first thing to which attention must be turned, is the great and fundamental fact, that it was the existence of the law, and the necessity which had arisen for upholding it in all its integrity and honour, which brought Christ into this world. As saith the Apostle Paul, “Where no law is, there is no transgression.” In the absence of law there could have been no sinner, and, therefore, no saviour. The proper and scriptural definition of sin is this, — “it is the transgression of the law.” The object of law is to express the will and to assert the authority of the Ruler. The law declares this to be right and that to be wrong — this to be duty and that to be disobedience — this to be required and that to be forbidden.

Where no law is, therefore, it follows of necessity that there is, and can be, no such thing as sin; for, as already has been said, — “sin is the transgression of the law.” It is a contempt of the authority and disregard of the will of God. But that will cannot be disregarded where there is no law to express it; and that authority cannot be contemned, where there is no law to assert it. The fact that law did not begin, for the first time, to exist in this world when it was given on the two tables of stone to the people of Israel, was made conclusively manifest from this, — that there was sin in the world for ages before.

Sin, as Paul tells us (Rom. v. 12), “is not imputed” — is not held to exist; that is, “where there is no law.” But as death, which is the wages of sin, reigned universally among men, “from Adam to Moses,” the conclusion is inevitable that law existed, and was in full force all the while. And I again repeat, it was the existence of this law, as a law, which man had broken, and under whose awful curse and penalty he had consequently fallen, which created the necessity for Christ’s coming into the world, if man was to be saved.

It is this very truth which is explicitly proclaimed in those well-known words of the Epistle to the Galatians (iv. 4-5), “When the fulness of the time was come, God sent forth His Son, made of a woman, made under the law, to redeem them that were under the law” (or more strictly and literally “those under the law;” those, that is, that were, and those that are and those that are to be, under the law), “that we might receive the adoption of sons.”

In His pre-existent state, as the eternal and only begotten Son of God, Christ was not under the law. He was then in the form of God, and thought it not robbery to be equal with God. As such, He was not a member or subject of the kingdom of Heaven, but its Sovereign Head and Lord. He possessed, indeed, in that condition, the most absolute and perfect holiness; but it was not the holiness which consists in obedience. The law which is holy, and the commandment which is holy, and just, and good, was conformed to Him; not He to the law. His holiness was exercised as the lawgiver, in making the law, and in governing the world by it.

But in undertaking, and entering on the blessed mission which brought Him down from heaven to earth, He “took upon Him the form of a servant, and was made in the likeness of men.” (Phil. ii. 7). By so doing, He placed himself “under the law;” the very law to which those were subject, whom He had come to redeem. Had they — that is, the human race — kept that law, His interposition in their behalf would not have been required. The law itself would have secured them eternal life. But having broken that law, they had both forfeited the rewards of obedience, and incurred the tremendous penalty of transgression. It was in this extremity that Christ came to seek and to save that which was lost: and this He did, by meeting, in the room and stead of His people — and as their substitute and surety — all the law’s demands.

We have thus seen, as the first result of our inquiry into the subject before us, that the law stands, to the mission and work of Christ, in a relation of the closest and most fundamental kind. Take away the law, and you take away the gospel; for, in taking away the law, you take away the only adequate ground, or necessity, for such a work as Christ came into this world to accomplish.</p></blockquote>

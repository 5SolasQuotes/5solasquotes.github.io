<blockquote><p>15. Argument 9 [of Rutherford against an Arminian conception of the antecedent will of God]: If such an antecedent will, by which He naturally wills good to the creature, belongs to God, then by the same reasoning God by an antecedent will willed the existence of the creature and from eternity willed the creation of the world by the impulse of nature. But then why did God for infinite ages before the creation of the world not satisfy that natural volition? What resisted God here? Not the world, not men, not a defect of matter. They will say that God’s absolute will resisted the natural will: But how absurd? Christians argue against Aristotle, Proclus and others that God created the world freely. Therefore He could have from eternity not have created, and such a will was in vain for eternity; and by equal reasoning God eternally wills the τὸ esse [being] of infinite worlds and of infinite men and angels… Indeed, because attributes in God are necessary and eternal, they never begin, they never cease; from eternity God naturally willed all men to be saved, and indeed naturally, and consequently by necessity of nature He created the world and could not have not created it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apologetic Exercitations (Amsterdam: Laurentius, 1636), Exercise 2, ch. 4, ‘On the Antecedent &amp; Consequent Will of God’, pp. 323-63 tr. AI by The Faith Received Latin</cite></span></figcaption>

<blockquote><p>25. Axioms concerning the perfection of God: I. God is in Himself absolutely and in every way perfect from eternity to eternity, devoid of all defect or progress. Rom. 11:35, ‘Who has first given to Him, and it shall be recompensed to them?’ 26. II. God can lack no perfection, neither privatively nor negatively: that is, No privation of perfection, no negation can fall upon God. 27. III. All perfections belong to God according to one and simple form, which is His essence. 28. IV. God is the cause of all perfections in other things, Rom. 11:36, ‘For from Him, and through Him, and to Him are all things.’ 29. V. All perfections, which are found in things created by God, were first in God most perfect and in the most perfect manner. Indeed, God, as the first cause, contains all possible perfection in Himself. All perfections are simply simple in God, because in their formal concept they have no imperfection, but pure perfection, nor do they involve any contradiction among themselves. God, by reason of His perfection, eminently contains the perfections of creatures. Eminently: to contain the perfection of something is to have such a perfection of a higher order, which by its power contains whatever is in the lower perfection: whence, because He also contains eminently, He can bring it about. For all effects are in efficient causes by power, so that such causes are said to be like their effects; and conversely, effects are such as their causes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology (Hanau, 1609-1610) tr. ChatGPT-4 by Monergism | bk. 2, God &amp; his Attributes, ch. 9, ‘On the Perfection of God’</cite>, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

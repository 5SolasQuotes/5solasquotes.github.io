<main class="wrap"><figure class="quote" id="q-4d15f33f96" data-kw="">
<blockquote><p>But mark what a cure God in wisdom and mercy has provided for us: As it is but one day in seven which is thus to be wholly employed with God, and as much of this day is taken up with the bodily necessaries aforesaid, so for the rest, God appoints us variety of exercises, that when we are weary of one, another may be our recreation. When we have heard we must pray, and when we have prayed we must hear again: We must read, we must sing and speak God’s praises, we must celebrate the memorial of Christ’s death in the sacrament; we must meditate; we must confer, we must instruct our families: and we have variety of subjects for each of these. As a student that is weary has variety of books and studies to recreate his mind, so has every Christian variety of holy employment on the Lord’s day. And all of it [is] excellent profitable and delightful!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 110-27 of ch. 10, ‘How the Lords day should not be spent: Or, What is unlawful on it?’ in The Divine Appointment of the Lords’ Day Proved (1671)</cite>, pp. 122-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

iv>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a66e20ff8" data-kw="">
<blockquote><p>It being impossible for the mind of man to be always intent upon business and for the body to be exercised in continual labours, the wisdom of God has therefore adjudged some diversion and recreation (the better to fit both body and mind for the service of their Maker) to be both needful and expedient: such is the constitution of our bodies and the complexion of our minds that neither of them can endure a constant toil without some relaxation and delighting diversion. As a bow, if always bent, will prove sluggish and unserviceable, in like manner will a Christian’s mind if always intent upon the best things: the arrow of devotion will soon flag, and fly but slowly towards heaven. A wise and good man perhaps could wish that his body needed no such diversion, but finding his body tire and grow weary, he is forced to give way and choose such recreations as are healthful, short and proper to refresh both mind and body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-burkitt.html">William Burkitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help &amp; Guide to Christian Families… (d. 1703; London: SPCK, 1840), ch. 6, ‘Of Glorifying God in our Recreations,’</cite>, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-da3987fe7e" data-kw="">
<blockquote><p>3 Q. Of how many hours does the Sabbath day consist? A. Of four and twenty. Gen. 2:3 The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day. 4 Q. Are all those hours to be sanctified? A. Yes. Exod. 20:11 The Lord rested the whole seventh day: and all the time wherein He rested He sanctified. Gen. 2:2,3 5 Q. How can all that time be sanctified? A. 1. By observing things commanded. Jer. 17:22 2. By observing things permitted. Exod. 12:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification (1641)</cite>, p. 2</span></figcaption>

</figure><figure class="quote" id="q-7b9e3ff6fa" data-kw="">
<blockquote><p>In this commandment there are properly said to be two parts—the one natural, the other moral [positive]; the one the genus, the other the species. Of the former it is said, that the natural part or genus is perpetual, and cannot be abrogated, as being a command concerning the maintenance of the public ministry, so that on some one day the people should be taught, and divinely appointed ceremonies handled. But the species, which bears respect to the seventh day in particular, is abrogated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted in Paul Barth, ‘Natural Law &amp; Divine Positive Law’</cite></span></figcaption>

</figure><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>

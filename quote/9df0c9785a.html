<blockquote><p>So the love-tokens and testimonial rings and bracelets of the Husband, my love to the saints, my keeping of his word, my holy walking in Christ, being the works of his Spirit, which dwelt in Jesus Christ, are actu primo [the first act], in themselves, as infallible signs of the Bridegroom’s love to me; as the Beloved’s word who spake and said, ‘Arise, my love’: And if the spirations and breathings of the Spirit go not along, both the voice and the love-bracelets (for Christ is no more counterfeit in his love-tokens than in his word when He speaks as a Husband) are alike ineffectual to persuade the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), pp. 98-99</span></figcaption>

<blockquote><p>[1.] We do not speak of parents that are so far deprived of judgment, that they are not fit to determine this matter; nor, [2.] Such as have divested themselves of the natural affection of parents, and entertaining an ungrounded prejudice against some of their children, are endeavoring to expose them to ruin, that they may show more kindness to others. These forfeit that right, which is otherwise founded in nature. [3.] If parents, by refusing to comply with the desire of their children, plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them. [4.] The case is vastly different, when applied to children who are so far from being dependent on their parents, that they depend on them. Nevertheless, in this case, some deference and respect ought to be paid to them; and as it is the children’s duty, it may be their interest so to do; since we can hardly suppose, that parents, who depend on their children, would oppose their happiness, in an affair that is apparently contrary to their own interest, if they did not think that they had sufficient reason for it; which ought to be duly weighed, that it may be known, whether their advice is expedient to be complied with, or no. And if in this, or any other instance, children are obliged to act contrary to the will of their parents; they ought to satisfy them, that it is not out of contempt to their authority, but a conscientious regard to the glory of God; and that it is conducive to their happiness, in the opinion of the wisest and best of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism</span></figcaption>

</figure><figure class="quote" id="q-c31eee4ece" data-kw="">
<blockquote><p>…to say [as the opponent does], that the Word teaches the Church to abstain from blood (Acts 15), is a part of the perfection of the Scripture, and yet the Scripture teaches that abstinence from blood, not as an eternal and unalterable Law, for we are not now tied to abstain from blood, therefore the Scripture may make the man of God perfect in some works that are alterable and changeable: This (I say) is no answer, for saying that God should now make abstinence from blood and things strangled indifferent (Acts 15), as He made them in that interval of time when the [Levitical] ceremonies were mortal [alive] but not deadly and unlawful, as is clear in that Paul circumcised Timothy (Acts 16:1-3), that rite being then indifferent; and yet he writes in another case when the Gospel is now fully promulgated, that to be circumcised makes a man a debtor in conscience to keep the whole Law of Moses, and so to abstain from eating of blood and things strangled must be a falling from the grace of Christ and an apostasy from the Gospel (Gal. 5:1-7). The like I say of observing of days (Rom. 14:5-6) which were indifferent and [yet] in another case (Gal. 4:9-10; Col. 2:16-17) [were] deadly, unlawful and not necessary. So the matter (Acts 15), which in the case of scandalizing the weak, is abstinence from things indifferent, say ‘that they are indifferent’ binds as a perpetual law to the end of the world, and binds us this same very day (Rom. 14:20) in the morality of it, as abstinence from murdering one for whom Christ died, (Rom. 14:15; 1 Cor. 8:12-13; 1 Cor. 10:26-28). And upon the ground laid by prelates, which is most false and untrue, to wit, that many positive things in Church government, such as are [by] prelates deemed to be warranted by apostolic, though not by Divine, right: ceremonies and crossing, kneeling to bread, altars, surplice, rochet, corner-cap, yea, and circumcision, a passover lamb, and all the Jewish ceremonies, though with another spirit and intention than to shadow forth Christ to come in the flesh, [are] imagined to be indifferent and alterable things, we hold that all these are to be abstained from as eating of blood and things strangled of old were. If you say they are as indifferent as blood and some meats were in the case (Acts 15; Rom. 14; 1 Cor. 8; 1 Cor. 10), its a most false principle as we shall hear, and therefore the Scripture, if it make the man of God perfect to every good work, as the apostle says, it must teach us to abstain from all these as scandalous [things], and must set down as perfect and particular directions for Church-Government as Paul does (Rom. 14) set down a particular platform, how we shall eschew murder for scandalizing our brethren in the use of things indifferent, is spiritual murder (Rom. 14:15,20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Introduction, p. 8-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

monies, though with another spirit and intention than to shadow forth Christ to come in the flesh, [are] imagined to be indifferent and alterable things, we hold that all these are to be abstained from as eating of blood and things strangled of old were. If you say they are as indifferent as blood and some meats were in the case (Acts 15; Rom. 14; 1 Cor. 8; 1 Cor. 10), its a most false principle as we shall hear, and therefore the Scripture, if it make the man of God perfect to every good work, as the apostle says, it must teach us to abstain from all these as scandalous [things], and must set down as perfect and particular directions for Church-Government as Paul does (Rom. 14) set down a particular platform, how we shall eschew murder for scandalizing our brethren in the use of things indifferent, is spiritual murder (Rom. 14:15,20).”

— Samuel Rutherford, Divine Right of Church Government (1646), Introduction, p. 8-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6to+say+%5Bas+the+opponent+does%5D%2C+that+the+Word+teaches+the+Church+to+abstain+from+blood+%28Acts+15%29%2C+is+a+part+of+the+perfection+of+the+Scripture%2C+and+yet+the+Scripture+teaches+that+abstinence+from+blood%2C+not+as+an+eternal+and+unalterable+Law%2C+for+we+are+not+now+tied+to+abstain+from+blood%2C+therefore+the+Scripture+may+make+the+man+of+God+perfect+in+some+works+that+are+alterable+and+changeable%3A+This+%28I+say%29+is+no+answer%2C+for+saying+that+God+should+now+make+abstinence+from+blood+and+things+strangled+indifferent+%28Acts+15%29%2C+as+He+made+them+in+that+interval+of+time+when+the+%5BLevitical%5D+ceremonies+were+mortal+%5Balive%5D+but+not+deadly+and+unlawful%2C+as+is+clear+in+that+Paul+circumcised+Timothy+%28Acts+16%3A1-3%29%2C+that+rite+being+then+indifferent%3B+and+yet+he+writes+in+another+case+when+the+Gospel+is+now+fully+promulgated%2C+that+to+be+circumcised+makes+a+man+a+debtor+in+conscience+to+keep+the+whole+Law+of+Moses%2C+and+so+to+abstain+from+eating+of+blood+and+things+strangled+must+be+a+falling+from+the+grace+of+Christ+and+an+apostasy+from+the+Gospel+%28Gal.+5%3A1-7%29.+The+like+I+say+of+observing+of+days+%28Rom.+14%3A5-6%29+which+were+indifferent+and+%5Byet%5D+in+another+case+%28Gal.+4%3A9-10%3B+Col.+2%3A16-17%29+%5Bwere%5D+deadly%2C+unlawful+and+not+necessary.+So+the+matter+%28Acts+15%29%2C+which+in+the+case+of+scandalizing+the+weak%2C+is+abstinence+from+things+indifferent%2C+say+%E2%80%98that+they+are+indifferent%E2%80%99+binds+as+a+perpetual+law+to+the+end+of+the+world%2C+and+binds+us+this+same+very+day+%28Rom.+14%3A20%29+in+the+morality+of+it%2C+as+abstinence+from+murdering+one+for+whom+Christ+died%2C+%28Rom.+14%3A15%3B+1+Cor.+8%3A12-13%3B+1+Cor.+10%3A26-28%29.+And+upon+the+ground+laid+by+prelates%2C+which+is+most+false+and+untrue%2C+to+wit%2C+that+many+positive+things+in+Church+government%2C+such+as+are+%5Bby%5D+prelates+deemed+to+be+warranted+by+apostolic%2C+though+not+by+Divine%2C+right%3A+ceremonies+and+crossing%2C+kneeling+to+bread%2C+altars%2C+surplice%2C+rochet%2C+corner-cap%2C+yea%2C+and+circumcision%2C+a+passover+lamb%2C+and+all+the+Jewish+ceremonies%2C+though+with+another+spirit+and+intention+than+to+shadow+forth+Christ+to+come+in+the+flesh%2C+%5Bare%5D+imagined+to+be+indifferent+and+alterable+things%2C+we+hold+that+all+these+are+to+be+abstained+from+as+eating+of+blood+and+things+strangled+of+old+were.+If+you+say+they+are+as+indifferent+as+blood+and+some+meats+were+in+the+case+%28Acts+15%3B+Rom.+14%3B+1+Cor.+8%3B+1+Cor.+10%29%2C+its+a+most+false+principle+as+we+shall+hear%2C+and+therefore+the+Scripture%2C+if+it+make+the+man+of+God+perfect+to+every+good+work%2C+as+the+apostle+says%2C+it+must+teach+us+to+abstain+from+all+these+as+scandalous+%5Bthings%5D%2C+and+must+set+down+as+perfect+and+particular+directions+for+Church-Government+as+Paul+does+%28Rom.+14%29+set+down+a+particular+platform%2C+how+we+shall+eschew+murder+for+scandalizing+our+brethren+in+the+use+of+things+indifferent%2C+is+spiritual+murder+%28Rom.+14%3A15%2C20%29.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Divine+Right+of+Church+Government+%281646%29%2C+Introduction%2C+p.+8-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc31eee4ece.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c31eee4ece.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-eating-and-drinking-blood/#:~:text=to%20say%20%5Bas%20the%20opponent%20does,indifferent%2C%20is%20spiritual%20murder%20%28Rom.%2014%3A15%2C20&amp;text=to%20say%20%5Bas%20the%20opponent%20does%5D%2C%20that%20the&amp;text=of%20things%20indifferent%2C%20is%20spiritual%20murder%20%28Rom.%2014%3A15%2C20" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

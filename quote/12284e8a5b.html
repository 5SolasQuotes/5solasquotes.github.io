<main class="wrap"><figure class="quote" id="q-12284e8a5b" data-kw="">
<blockquote><p>‘The calling of God.’ There is a twofold calling: one ineffectual, the other effectual: the former according to means, not flowing from election: for, many are thus called, but not chosen: the latter, according to purpose, which is ever effectual to the change and renewing of the heart.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b114ded39c" data-kw="">
<blockquote><p>Oh! it is a grievous thing for Christ to call and we to refuse his gracious calling… And thus we see how all under the gospel are called by the Word: Secondly, all under the gospel are called by the Spirit working within as well as by the Word preached without… Question 3. Whether the call of the Spirit be ineffectual or not?… Answer. All this [unquoted here, including Bible verses] is true of the effectual operation of the Holy Spirit, because that is certain and eternal; but there is a general work of the Spirit, which ends in perdition; that is, many may and do fall finally and totally into sin, and consequently into eternal destruction, in whom sometimes there has been some good motions, and general operations of the blessed Spirit; this is clear from these places, to wit, Mt. 7:22; 13:20; Heb. 6:4; 10:26; 2 Pet. 2:20. Now this general call and operation of the Holy Spirit has these degrees following: viz. First, an understanding of the Word, for the mere natural man cannot understand it, Mt. 16:23 &amp; 1 Cor. 2:14. Here observe two things, to wit, First, there are many in the places of the Gospel who hear the Word preached all the days of their lives and yet understand nothing, but remain children in understanding; now these never were made partakers so much as of common or general grace: Secondly, there are some who live under the Word, and do dogmatically understand the Word; now these must remember that knowledge is not enough, God having given them knowledge for practice’s sake, yea to know and not to obey will aggravate their punishment. Secondly, a taste of spiritual things and the heavenly gift, Heb. 6:4: this is to receive the Word with joy. Mt. 13:20, and there are few ordinary hearers, but at some time or other have these affecting motions, although for the most part the reprobate rather rejoices in the newness than in the trueness of that which he hears. Thirdly, obedience in part, forsaking some sins and doing God some service, Mk. 6:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>73. ‘Passages razed out concerning our effectual vocation’ in Canterbury’s Doom, or the first part of a complete history of the commitment, charge, trial, condemnation, execution of William Laud... (London: Macock, 1646)</cite>, pp. 344-45</span></figcaption>

</figure><figure class="quote" id="q-d9eee47935" data-kw="">
<blockquote><p>2. God’s gracious invitation of lost sinners to Christ, which properly is his calling them, is either external or internal; external by the word, internal by his Spirit. [1.] External, by the commands and promises of the word, requiring such duties from them, and assuring them of such blessings upon obedience. Thus Wisdom’s maidens are sent forth to invite guests to her palace, Prov. 4:2; and the king’s servants to call them to the marriage-feast, Matt 22:9; and so far they prevail in their message, that many present themselves. God would not leave us to a book, but has appointed a living ministry, 2 Cor. 6:10. [2.] Internal, not only by the word, but by his Spirit, and the checks of their own conscience, which is a nearer approach of his grace and power to us. By the motions of his Spirit; how else could it be said, Gen. 6:3, ‘My Spirit shall not always strive with man’? and Acts 7:51, ‘Ye do always resist the Holy Ghost’? And also by their consciences soliciting them to the performance of their duty, and challenging them for the neglect of it. It is natural duty: Rom. 2:14,15, ‘The Gentiles do by nature the things contained in the law; these, having not the law, are a law to themselves, which show the works of the law written in their hearts; their consciences also bearing witness, and their thoughts in the meanwhile accusing or excusing one another.’ And for acceptance of the gospel-covenant: 1 John 3:20,21, ‘If our heart condemn us, God is greater than our heart and knows all things; if our heart condemn us not, then have we confidence towards God.’ 3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works (d. 1677; London: J. Nisbet, 1870), vol. 12, Sermons Upon Romans 8, Sermon 8</cite>, p. 288</span></figcaption>

<blockquote><p>First, that it does not follow necessarily that whosoever has that taste there mentioned [in 1 Pet. 2:3] shall not be saved: for men may have that taste, and finding it ineffectual, go on till they find a true taste: That taste is dangerous if men fall away, else there may be good use of those tastes: For it brings men near the kingdom of God and makes preparation for true grace.</p></blockquote>

<blockquote><p>The promise of the gospel is that whosoever believes in Christ crucified shall not perish, but have eternal life. This promise, together with the command to repent and believe, ought to be declared and published to all nations, and to all persons promiscuously and without distinction, to whom God out of His good pleasure sends the gospel.</p></blockquote>

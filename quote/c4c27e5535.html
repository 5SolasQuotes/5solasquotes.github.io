<main class="wrap"><figure class="quote" id="q-c4c27e5535" data-kw="">
<blockquote><p>That saying of our Savior, that the Sabbath was not made for man etc. was not uttered by Him to show that the action of the disciples in plucking and eating the ears of corn was warranted by necessity against the command of the Sabbath, but that it was not within the prohibition of works on the Sabbath, which ordinarily is restrained to works of a civil or servile nature, not to natural refreshment, which is always indulged on the Sabbath and so that work of mercy is not under the prohibition, for the plucking of the ears of corn, when they were in the field was no more then drawing drink out of a vessel and of this opinion is learned [Martin] Chemnitz: Hoc Christus it a defendit, ut simul ostendat extra casum contempus publici ministry, et turbationis cultus sabati propter otium externum Sabati, hominem ne levi quidē incommodo assiciendum. ‘By this Christ does so defend his disciples, as withal He shows that, out of the case of contempt of the public ministry and disturbance of the worships of the Sabbath, for the external rest of the Sabbath, a man is not to undergo the least damage.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-geree.html">John Geree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Might Overcoming Right. Or a Clear Answer to Mr. John Goodwin’s Might and Right well met (London: Bostock, 1649), ch. 1, section 3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ath&amp;text=man%20is%20not%20to%20undergo%20the%20least%20damage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-acf56f7acf" data-kw="">
<blockquote><p>3. Works needful for the comfortable passing of the Sabbath, as dressing of moderate food, and the like, may be done on the Sabbath-day; for seeing Christ allows us to lead the ox to the water, and requires not to fetch in water for him over night, he allows us to dress meat, and requires not to dress it over night. For the order in the Law of not kindling a fire pertained alone to the business of the Tabernacle, and that order of dressing what they would dress on the sixth day, pertained alone to the matter of manna. And for this we have Christ’s clear example, who being invited went to a feast on the Sabbath-day, which he might not have done if it had been unlawful to dress meat and drink on the Lord’s day, for a feast sure was not kept without some preparation of warm meat. This example of Christ we have Luke 14:1, 8, 12, which verses compared make it apparent that it was a feast whereto He was bidden amongst diverse others. So then all labors and businesses except in these three cases are unlawful, for mercy, necessity, and present needful comfort… but as sauce for work, only the spiritual pastimes of singing holy Psalms and songs as a spiritual recreation is allowed to prevent all weariness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London: A.M., 1654), 9th Book, of the Moral Law, ch. 5, 4th Commandment</cite>, p. 818</span></figcaption>

<blockquote><p>This delight is spiritual in God as the proper object, and in the ordinances as the only means to lead us unto God, Job 27:10; Ps. 43:4; Canticles, 2:3; Isa. 56:7. Reasons. 1. Because the duties of that day are higher, we have then all the means of communion with God: 1. We have them in a more raised solemn way without any interruption; there is then a double institution, not only of the worship, but the time. 2. Its a spiritual feast, a day of God’s appointment, our recompence as well as our duty, Neh. 2:26. Ordinances are fodinae gratiae [wells of grace], Isa. 12:3. 3. This day we come to remember the highest favours of God to the creature, to contemplate the works of Creation, God’s rest, and of Redemption, Christ’s rest, 1 Pet. 4:1, and our own eternal rest, Heb. 4:9, the Sabbaths of the faithful are the suburbs of Heaven, Heb. 12:23, the Lord’s Supper is heaven in a map, Luke 14:15; Mt. 26:29. 4. Many of the duties of the day are but spiritual recreations; meditation is the solace of the mind in the contemplation of God’s works, Ps. 104:34. Singing of Psalms is a vent for spiritual mirth, Lam. 5; Eph. 5:18-19; then God should be solemnly praised, Ps. 92:1-2. 5. It is the temper of the people of God to delight in his solemn worship, Ps. 2; 1 Cor. 2:12. Male concordat canticum novum et vetus homo [The new song and old man poorly agree]. Augustine; Ps. 84:1, 10; Ps. 122:1. 6. Delight in the Sabbath is the best way to discharge the duties: 1. With comfort; delight sweetens all; how will men toil at their sport? Neh. 11:8. 2. With profit, Isa. 64:5; God will not send them away sad which come into his presence with joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London: A.M., 1654), 9th Book, of the Moral Law, ch. 5, 4th Commandment</cite>, pp. 820-21</span></figcaption>

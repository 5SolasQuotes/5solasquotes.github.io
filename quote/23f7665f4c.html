<main class="wrap"><figure class="quote" id="q-23f7665f4c" data-kw="">
<blockquote><p>But thus they [medieval scholastics] expound themselves, that God works, decrees and wills the deformity that is found in the sins of commission, not by his antecedent will, whereby He works things out of his own liking, but by his consequent and conditional will, whereby presupposing the purpose of suffering his creature to avert and turn from Him, He still intends to move, impel and carry them forward, though being by their own fault out of the way, He carries them thither whither they should not go: first, say they, by substraction of grace, upon the withdrawing whereof He saw the creature would turn from Him, He purposed to suffer the sin of aversion or omission to enter: secondly, this purpose being presupposed, and foreseeing that which would follow upon it in his consequent and conditional will, He positively decreed the other, which is of commission. Man by creation was made to seek an infinite good, and love it infinitely; which if he omit to seek in God, then must he needs commit the contrary and seek it in himself: for so God decreed that man not continuing to adhere unto Him, should fall into self-love, pride and all evils of that kind. All this might be borne withal, save only they make deformity of the essence of an action, which cannot be borne withal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-yates.html">John Yates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Arraignment of Hypocrites with an Enlargement concerning God’s Decree in Ordering Sin</cite>, ... (Cambridge, 1615), pt. 3, Reasons Objected to make God the Author of Sin, p. 76</span></figcaption>

<blockquote><p>Effective permission or willing permission; especially, the providential concursus (q.v.) underlying evil acts of human beings; a concept typical of Reformed theology, which will not allow a bare or ineffectual permission on the part of God and which will acknowledge no realm of activity outside of the will of God. God therefore is viewed as positively willing to permit the free agency of human beings and as supporting their acts with his providential concursus even when those acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker, 1985), pp. 222, 329 &amp; 332-33 | permissio efficax</span></figcaption>

</figure><figure class="quote" id="q-47e01e8576" data-kw="">
<blockquote><p>5. Voluntatas absoluta and voluntas conditionata. The distinction between decretive and perceptive will, voluntas beneplaciti and voluntas signi, relates also to a distinction between absolute will and conditioned will (voluntas absoluta et voluntas conditionata). According to the former, God wills and determines that something should occur ‘without any condition’ in the object of God’s willing—but the latter, the conditional will, rests upon the fulfillment of a condition in or by the object of the divine will, for example, the will of God to save men upon condition of faith. Maccovius notes, against the Arminians, that the distinction is ‘utterly vain.’ Wendelin indicates that this distinction causes some difficulty, but makes perfectly good sense if it is understood solely in terms of the voluntas signi [will of sign, or revealed will]—granting that most of the divine precepts, promises, and condemnations are stated conditionally. The distinction is, however, extended improperly to the eternal decree, inasmuch as the decree cannot be ‘suspended on conditions’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 463</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. Voluntatas absoluta and voluntas conditionata. The distinction between decretive and perceptive will, voluntas beneplaciti and voluntas signi, relates also to a distinction between absolute will and conditioned will (voluntas absoluta et voluntas conditionata). According to the former, God wills and determines that something should occur ‘without any condition’ in the object of God’s willing—but the latter, the conditional will, rests upon the fulfillment of a condition in or by the object of the divine will, for example, the will of God to save men upon condition of faith. Maccovius notes, against the Arminians, that the distinction is ‘utterly vain.’ Wendelin indicates that this distinction causes some difficulty, but makes perfectly good sense if it is understood solely in terms of the voluntas signi [will of sign, or revealed will]—granting that most of the divine precepts, promises, and condemnations are stated conditionally. The distinction is, however, extended improperly to the eternal decree, inasmuch as the decree cannot be ‘suspended on conditions’…”

rget="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47e01e8576.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conditional-aspects-of-gods-revealed-will/#:~:text=5.%20Voluntatas%20absoluta%20and%20voluntas%20conditionata,decree%20cannot%20be%20%E2%80%98suspended%20on%20conditions&amp;text=5.%20Voluntatas%20absoluta%20and%20voluntas%20conditionata.%20The%20distinction&amp;text=as%20the%20decree%20cannot%20be%20%E2%80%98suspended%20on%20conditions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-13b047c2a0" data-kw="">
<blockquote><p>Further, there are some which interpret these words of the apostle [1 Tim. 4:2, “God will have all men to be saved”], of the will of the sign or of the antecedent, that all men are invited, for that preaching is indifferently set forth to all men. Neither is there any, in a manner, which inwardly feels not some prick whereby he is oftimes stirred up to live well. So that if we respect this will of God, we easily grant that He will have all men to be saved. But they will not have it to be understood of the hidden and effectual will, which they call consequent: and after this manner may those kinds of speech be understood: ‘God lightens every man which comes into this world;’ (Jn. 1:9) ‘Come unto Me all ye which labor, and are laden.’ (Mt. 11:21) For all men are provoked by the oracles of God, and all men are inwardly moved by some provoking. All these interpretations are doubtless very likely, and also apt… 46. They object also a sentence of Christ, ‘How often would I have gathered together thy children, as a hen gathers together her chickens, and thou wouldest not?’ (Mt. 23:37) But here also is meant of the antecedent will of the sign, whereby God by his prophets, preachers, apostles and scriptures, many times invited the Jews to fly unto Him by repentance: which yet they refused to do. But yet God, by his effectual will, which they call consequent, perpetually drew to Him those that were his: neither was there ever any age wherein He gathered not together as many of the Hebrews as He had predestinated. Therefore Augustine said, ‘Those which I would, I have gathered together, although thou wouldest not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, (d. 1562; London, 1583), pt. 3, ch. 1, Of Predestination upon the 9th Chapter to the Romans, pp. 31-33</span></figcaption>

<blockquote><p>Election and rejection or reprobation, and in general the will of God, may be considered either quoad actum voluntis, ‘as touching the act of’ God ‘willing,’ or as touching the things willed. Of this distinction, this author [Samuel Hoard] takes no notice; It is fit for some and advantageous to fish in troubled waters. Now as touching the act of God willing, both Aquinas has proved that there can be no cause thereof and withal professes that never was any so mad as to say that merits can be the cause of predestination, quoad actum praedestinantis, ‘as touching the act of’ God ‘predestinating’. And Bradwardine has curiously disputed this way, that no will of God is conditional, to will quoad actum volentis; and [Johannes] Piscator against Vorstius has proved the same after his way; and by variety of demonstration this way may be convinced, as in part I have showed in this discourse, both on the part of election and on the part of reprobation. And both Dr. [Thomas] Jackson [an Arminian] in his book of Providence, professes that the distinction of Voluntas antecedens and consequens, or antecedent and consequent will in God, is to be understood quoad res volitas, ‘as touching the things willed’, as much as to say, non quoad actum volentis. And Gerardus Vossius [an Arminian], drawing the distinction of will antecedent and will consequent unto the distinction of will absolute and will conditional, applies it only quoad res volitas, and so interprets Fathers’ discourse[s] thereof; And of a conditional will gives this instance: God will have men to be saved in case they believe, where faith is clearly made the condition of salvation, a temporal thing, the condition of a temporal thing, not the condition of God’s will to save, it being no way fit that a temporal thing should be made the condition of a thing eternal, such as is God’s will to save. And this is more apparent by the reading of Vossius himself, History of Pelagianism, bk. 7, treating of God’s will to save all. Now if we speak thus of God’s will quoad res volitas, ‘as touching the things willed,’ these things willed being very different, we have reason to consider them distinctly also. Now these things are either grace or glory, commonly called salvation; and as touching grace, to wit, the grace of regeneration, the grace of faith and repentance, we willingly confess that God’s will to confer them is so absolute that He has determined to confer them according to the mere pleasure of his will, not according to man’s works (which is plain Pelagianism and condemned in the Synod of Palestine above 1200 years ago); and as He gives them to whom He will, so He denies them to whom He will, according to that Rom. 9:18, ‘He hath mercy on whom He will, and whom He will He hardneth.’ But as touching salvation or damnation, in which respect this author usually speaks of the absolute or conditional will of God, we utterly deny that God in the dispensation or administration, or execution of these proceeds or ever did decree to proceed according to the mere pleasure of his own will, but altogether according to their works. For albeit God has made no law according whereto He means to proceed in giving or denying grace, yet has He made a law according whereto He proceeds in bestowing salvation and inflicting damnation. And the law is this: ‘Whosever believeth shall be saved; whosoever believeth not shall bedamned.’ 2 Cor. 5:10, ‘We must all appear before the judgment seat of Christ, that every man may receive the things, which are done in his body according to that he hath done, whether good or evil.’ So that according to that sense wherein this author usually speaks of the absolute and conditional will of God, we utterly deny that God does absolutely elect any man to salvation or reject any man unto damnation, though He does absolutely elect some unto grace, that is to the grace of regeneration, to the grace of faith and repentance, and absolutely reject others therefrom. For as much as He bestows these graces on some and denies them unto others not according to their works, but according to the mere pleasure of his own will, but he does not inflict damnation or bestow salvation according to the mere pleasure of his will, but according unto man’s works. And as he carries himself in the execution of salvation and damnation, after the same manner He did from everlasting decree to carry Himself, namely to save no man of ripe years but by way of reward of their faith, repentance and good works, [and] so to damn none but for their infidelity, impenitency and evil works.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d5c2b420e4" data-kw="">
<blockquote><p>All things then being considered, it is manifest and plain, that the baptism of children is of God, against the which, sith that the anabaptists do repugn, it is without doubt that they do contrary the gospel, the election of God, and the everlasting covenant. They are therefore over bold &amp; rash, they are open violators or breakers of the covenant of God, unfaithful against God, sith that they do exclude and debar them from the covenant of God, whom God’s grace doth comprehend in the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists</cite>, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e895dc2d9f" data-kw="">
<blockquote><p>Anno, 1522. Did arise in Saxony Nicholas Stork, who boasted of dreams and visions and rejected the Scripture as being a carnal and literal rule. Antinomians call it carnal, literal, and legal. From him and others arose Thomas Muntzer, about anno 1524, who styled himself “Thomas Muntzer, the servant of God, with the sword of Gideon against the ungodly.” This man, being hungry for glory, hunted for Luther’s name to his new designs but not obtaining it, said but [unclear] Antichrist: that Luther’s carnal and literal gospel was worse than the pope and therefore cried down books and the letter of Scripture and said the Spirit was the leader and rule to believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, …The Mind of Luther a Most Professed Opposer of Antinomians is cleared and Diverse Considerable Opinions Of the Law and the Gospel, of the Spirit and the Letter, of t</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/anabaptists/infant-baptism.html">Anabaptists: Infant Baptism</a></span></div>

</figure><figure class="quote" id="q-a0c4324357" data-kw="">
<blockquote><p>Hence I believe that there is one Church of those who have the same Spirit, through whom they are made certain that they are the true children of the family of God; and this is the first fruits of the Church. I believe that this Church does not err in regard to truth, namely in those fundamental matters of faith upon which everything depends. I believe also that the universal, visible Church is one, while it maintains that true confession, of which we have already spoken. I believe also that all belong to this Church who give their adherence to it according to the rule and promise of God’s Word. I believe that to this Church belong Isaac, Jacob, Judah and all who were of the seed of Abraham, and also those infants whose parents in the first beginnings of the Christian Church, through the preaching of the apostles, were won to the cause of Christ. For if Isaac and the rest of the ancients had not belonged to the Church, they would not have received the Church’s token, circumcision. Since these, then, were members of the Church, infants and children belonged to the primitive Church. Therefore I believe and know that they were sealed by the sacrament of baptism. For children also make a confession, when they are offered by their parents to the Church, especially since the promise offers them to God, which is made to our infants no less, but even far more amply and abundantly, than formerly to the children of the Hebrews. These are the grounds for baptizing and commending infants to the Church, against which all the weapons and war engines of the Anabaptists avail nothing. For not only are they to be baptized who believe, but they who confess, and they who, according to the promise of God’s Word, belong to the Church. For otherwise even the apostles would not have baptized anyone, since no apostle had absolute evidence regarding the faith of one confessing and calling himself a Christian. For Simon the impostor, Ananias, Judas, and no one knows who, were baptized when they declared their adherence to Christ, even though they did not have faith. On the other hand, Isaac was circumcised as an infant without declaring his adherence or believing, but the promise acted in his behalf. But since our infants are in the same position as those of the Hebrews, the promise also declares their adherence to our Church and makes confession. Hence, in reality baptism, like circumcision (I am speaking of the sacrament of baptism) pre-supposes nothing but one of two things, either confession, i.e., a declaration of allegiance or a covenant, i.e., a promise. All of which will become somewhat clearer from what follows.</p></blockquote>

</figure><figure class="quote" id="q-43f6d35149" data-kw="">
<blockquote><p>13. Our indulgence ought to extend much farther in tolerating imperfection of conduct. Here there is great danger of falling, and Satan employs all his machinations to ensnare us. For there always have been persons who, imbued with a false persuasion of absolute holiness, as if they had already become a kind of aerial spirits, spurn the society of all in whom they see that something human still remains. Such of old were the Cathari and the Donatists, who were similarly infatuated Such in the present day are some of the Anabaptists, who would be thought to have made superior progress. Others, again, sin this respect, not so much from that insane pride as from inconsiderate zeal. Seeing that among those to whom the gospel is preached, the fruit produced is not in accordance with the doctrine, they forthwith conclude that there no church exists.</p></blockquote>

</figure><figure class="quote" id="q-b7c21b431b" data-kw="">
<blockquote><p>But this place hath need of a sound exposition, because of fantastical [fanatical] spirits, which do feign a commonalty or participation together of goods, whereby all policy or civil government is taken away; as in this age the Anabaptists have raged, because they thought there was no Church unless all men’s goods were put and gathered together, as it were, in one heap, that they might all one with another take thereof.

Wherefore, we must in this point beware of two extremes. For many, under colour of policy, do keep close and conceal whatsoever they have; they defraud the poor, and they think that they are twice righteous, so they take away no other men’s goods. Other some are carried into the contrary error, because they would have all things confused. But what doth Luke? Surely he noteth another order, when he saith that there was choice made in the distribution. If any man object that no man had anything which was his own, seeing all things were common, we may easily answer.

For this community or participation together must be restrained unto the circumstance which ensueth immediately; to wit, that the poor might be relieved as every man had need. We know the old proverb, “All things are common amongst friends.” When as the scholars of Pythagoras said thus, they did not deny but that every man might govern his own house privately, neither did they intend to make their own wives common; so this having of things common, whereof Luke speaketh, and which he commendeth, doth not take away household government; which thing shall better appear by the fourth chapter, whereas he nameth two alone which sold their possessions of so many thousands. Whence we gather that which I said even now, that they brought forth and made common their goods in no other respect, save only that they might relieve the present necessity.

And the impudency of the monks was ridiculous, who did profess that they did observe the apostles’ rule, because they call nothing their own; and yet, nevertheless, they neither sell anything, neither yet do they pass for any man’s poverty; but they stuff their idle bellies with the blood of the poor, neither do they regard any other thing in their having of things common, save only that they may be well filled and daintily, although all the whole world be hungry. Wherein, then, are they like to the first disciples, with whom they will be thought to be able to compare?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 130-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/anabaptists/infant-baptism.html">Anabaptists: Infant Baptism</a></span></div>

Wherefore, we must in this point beware of two extremes. For many, under colour of policy, do keep close and conceal whatsoever they have; they defraud the poor, and they think that they are twice righteous, so they take away no other men’s goods. Other some are carried into the contrary error, because they would have all things confused. But what doth Luke? Surely he noteth another order, when he saith that there was choice made in the distribution. If any man object that no man had anything which was his own, seeing all things were common, we may easily answer.

For this community or participation together must be restrained unto the circumstance which ensueth immediately; to wit, that the poor might be relieved as every man had need. We know the old proverb, “All things are common amongst friends.” When as the scholars of Pythagoras said thus, they did not deny but that every man might govern his own house privately, neither did they intend to make their own wives common; so this having of things common, whereof Luke speaketh, and which he commendeth, doth not take away household government; which thing shall better appear by the fourth chapter, whereas he nameth two alone which sold their possessions of so many thousands. Whence we gather that which I said even now, that they brought forth and made common their goods in no other respect, save only that they might relieve the present necessity.

And the impudency of the monks was ridiculous, who did profess that they did observe the apostles’ rule, because they call nothing their own; and yet, nevertheless, they neither sell anything, neither yet do they pass for any man’s poverty; but they stuff their idle bellies with the blood of the poor, neither do they regard any other thing in their having of things common, save only that they may be well filled and daintily, although all the whole world be hungry. Wherein, then, are they like to the first disciples, with whom they will be thought to be able to compare?”

— John Calvin, Commentary on the Acts of the Apostles, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 130-31.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+this+place+hath+need+of+a+sound+exposition%2C+because+of+fantastical+%5Bfanatical%5D+spirits%2C+which+do+feign+a+commonalty+or+participation+together+of+goods%2C+whereby+all+policy+or+civil+government+is+taken+away%3B+as+in+this+age+the+Anabaptists+have+raged%2C+because+they+thought+there+was+no+Church+unless+all+men%E2%80%99s+goods+were+put+and+gathered+together%2C+as+it+were%2C+in+one+heap%2C+that+they+might+all+one+with+another+take+thereof.%0A%0AWherefore%2C+we+must+in+this+point+beware+of+two+extremes.+For+many%2C+under+colour+of+policy%2C+do+keep+close+and+conceal+whatsoever+they+have%3B+they+defraud+the+poor%2C+and+they+think+that+they+are+twice+righteous%2C+so+they+take+away+no+other+men%E2%80%99s+goods.+Other+some+are+carried+into+the+contrary+error%2C+because+they+would+have+all+things+confused.+But+what+doth+Luke%3F+Surely+he+noteth+another+order%2C+when+he+saith+that+there+was+choice+made+in+the+distribution.+If+any+man+object+that+no+man+had+anything+which+was+his+own%2C+seeing+all+things+were+common%2C+we+may+easily+answer.%0A%0AFor+this+community+or+participation+together+must+be+restrained+unto+the+circumstance+which+ensueth+immediately%3B+to+wit%2C+that+the+poor+might+be+relieved+as+every+man+had+need.+We+know+the+old+proverb%2C+%E2%80%9CAll+things+are+common+amongst+friends.%E2%80%9D+When+as+the+scholars+of+Pythagoras+said+thus%2C+they+did+not+deny+but+that+every+man+might+govern+his+own+house+privately%2C+neither+did+they+intend+to+make+their+own+wives+common%3B+so+this+having+of+things+common%2C+whereof+Luke+speaketh%2C+and+which+he+commendeth%2C+doth+not+take+away+household+government%3B+which+thing+shall+better+appear+by+the+fourth+chapter%2C+whereas+he+nameth+two+

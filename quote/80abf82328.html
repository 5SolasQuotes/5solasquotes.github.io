<blockquote><p>…to show that the glory of God should not be concealed but revealed; but man’s glory is to be concealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Cor. 11 in Commentary on 1 Corinthians | on vv. 4-7:</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f89644db8" data-kw="">
<blockquote><p>It is partly true, that ‘the men’ were peculiar in their dress, but it is not at all true, that they adopted any kind of badge, or that they wore a uniform that distinguished them as a class. In the circle in which they moved, there were attempts made, by the careless and worldly, to follow, at a distance, the mutations of fashion in their attire. The men would not, and, merely, on that account, their dress was peculiar. It was often the case, that they wore long hair, partly, because a regard to appearances did not remind them of cutting it, and, partly, that they might discountenance the attempts at clipping and combing ‘after the fashion,’ by which many around them evidenced their conformity to the world. It is true, also, that they often appeared with a handkerchief on their heads, but so did many besides them, who met to worship under a scorching sun, and regarded it as unbecoming to have a hat or a bonnet on their heads. If their dress seemed peculiar, it was only because it was old-fashioned, even in the highlands. Its singularity was not owing to any affectation, or to an undue regard to what was external and trivial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-kennedy.html">John Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Days of the Fathers in Ross-Shire 4th ed. (Toronto: James Campbell &amp; Son, 1867)</cite>, pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

oopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6b695031cf" data-kw="">
<blockquote><p>First, their head [of the idolaters in Ahab’s time]; they prayed before their idols with their heads covered, because the people of the East worshipped their great men with their heads covered; therefore they prayed after the same manner, and honored their idols standing before them with their heads covered. Maimonides says that religious outward worship should be given after the same manner as they worshipped great men, and he adds, nisi forte sit mos illius loci, ut quis stet coram magnatibus aperto capite, that is, ‘unless it be the manner of men in that place to stand bare-headed, when they do reverence to great men’; where we see that the gesture and the manner of praying is to be accommodated to the custom of the place where one lives, and they should testifie their outward reverence by such signs as men testify their reverence to great men. This manner of worship varies in sundry parts. Maimonides wrote his Mishna in Egypt, and amongst the Mahometans who uncover not their heads before great men, but bow only their head before them; and therefore when they pray they uncover not their head: So the Jews both the priests and people uncover not the head in time of divine service. The priests had such bonnets upon their heads which could not easily be taken off and put on as ours, and when they came abroad they never uncovered their heads; but when they made great lamentation they uncovered their heads, and cast ashes upon them: But the Christians in the West, when they do reverence to their superiors, they always uncover their heads; and therefore it is the fittest gesture for us to uncover our heads when we pray. The Jews who live here in Europe, when they are in their synagogues, they never uncover their heads, which is altogether contrary to the custom of Europe: They salute great men here uncovering their heads, and so should they pray according to the canon of Maimonides; but they do this in despite of the Christians: The apostle, 1 Cor. 11, wills men to be uncovered, and women to be covered, when they pray, because that was the usual form amongst the Grecians, for the men did uncover their heads, when they did any reverence to their superiours; and the women had vails which covered their heads and faces when they came abroad: therefore he would not have them uncovered in time of prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Four Degenerate Sons… wherein are handled many… sundry places of Scripture, cleared out of the original tongues. Being the fourth volume, of the Works… (London, 1636), On the 3rd Degenenerate Son, the Idolater, section 6</cite>, pp. 264-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>…if [1 Cor. 11:2 speaks] of indifferent ceremonies, it is still farther from touching us. For these may be changed, provided only the reason and end be preserved; nor are they necessary, as is plain from the place before us. For the apostle speaks of that modesty which women ought to observe in the congregation, and of that decency also which is required in men when they frequent religious meetings and assemblies. He desires men to pray with uncovered, women with covered heads: which injunctions are not of a perpetual obligation; for they are not now observed even by the papists themselves, so as to make it plain that all churches are not bound to the same ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton (1588; Cambridge: Parker Society, 1849)</cite>, p. 549</span></figcaption>

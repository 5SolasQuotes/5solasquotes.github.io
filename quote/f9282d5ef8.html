<main class="wrap"><figure class="quote" id="q-f9282d5ef8" data-kw="">
<blockquote><p>We hold it as unlawful (as themselves) outwardly and but in appearance to join with idolaters in their idolatry; and yet we see not warrant why every particular act, that in a large sense is idolatrous, adjoined to God’s true worship, we should forbear our presence, as the true worship itself: Or that our presence for the true worship’s sake alone should in respect of some point of false worship thereunto annexed be… the submitting our bodies to a strange worship, especially when we are not particular actors in it, but only present, beholding it with grief and suffering it in others for the true worship’s sake, unto which it is adjoind. If this should be held unlawful then can no man present himself with a good conscience at any public worship of God wheresoever, because… he can have no assurance but that some errors in matter or form will be committed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of the Separation made Apparent</cite>, ... (1614; Amsterdam, 1640), pt. 1, 6th Reason, p. 103</span></figcaption>

<blockquote><p>…as to the preaching of the Word, we grant that the people are not obliged to give blind and implicit obedience to what is delivered by the ministers, as if they ought to receive as the Word of God whatsoever is delivered by them, but that they have power and ought by the judgment of discretion to search the Scriptures whether the things delivered by the ministers be so, to try the spirits whether they be of God or not, to prove all things and hold fast that which is good, Acts 17:11; 1 Jn. 4:1; 1 Thess. 5:18; and the like judgment of discretion we grant to them in relation to other parts of worship.</p></blockquote>

</figure><figure class="quote" id="q-c240066799" data-kw="">
<blockquote><p>Go to the Word of God, look what is written; and then the Lord will accept the service, when thou strivest to come near the commandment. See what is punctually required, and then diligently set thyself awork. The Lord will accept weak endeavors, so they be suitable to the command; so you do but endeavour to perform what is written, the Lord will accept it more than all the pomp and outside of those that would supererogate in the outward part… lookest to what God requires; though thou dost not come near it but in thy purposes and desires, the Lord will accept thee. All that the faithful could say for themselves in the prophet was, ‘The desire of our soul is to thy name, and to the remembrance of Thee,’ Isa. 26:8. And all that Nehemiah could urge for the best Jews was that they did desire to fear God’s name, Neh. 1:11. I say, see thou hast prepared to meet the Lord in his own ordinances, and wouldest feign do what is written: remember the death of the Lord Jesus after the due order and right manner, then the Lord will be pleased with thy sacrifice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 15 | ‘First Sermon’ of Sermons on the Sacraments, pp. 351-52</span></figcaption>

</figure><figure class="quote" id="q-f7398ec5b3" data-kw="">
<blockquote><p>…take heed that you not act like the weak in Rom. 14. Those who were weak in the Christian Faith (v. 1) held excessive religious strictures and scruples, especially in practical matters, however inconvenient (v. 2). Their simplistic beliefs determined their actions, which set them apart from other Christians. They prided themselves in their strict living, self-denial and high standard (v. 2), taking what they thought was righteous grief, offense and scandal at things actually lawful (vv. 20–21), they not thinking them best or godly enough (vv. 4–5). They spoke ill of their Christian brothers, judged them (vv. 3–4, 16, even Paul implicitly), whom they saw as worldly, licentious and not devoted enough, though their brethren were equally devoted (v. 6) and actually stronger and more understanding in the truth than they (v. 14). The weak’s distinctives exemplified misplaced priorities, valuing certain external practices they considered to be religiously necessary above their brethren’s fellowship, and hence also above the fundamentals of “righteousness, and peace, and joy in the Holy Ghost,” in which the kingdom of God consists. (v. 17) The weak practically valued what they considered to be sanctification, and that in others, above other Christians’ faith and justification (v. 18), that they are accepted with God forever in Christ, and He will make them stand. (v. 4) It was not only the strong, but the weak as well that were deficient in following “after the things which make for peace, and things wherewith one may edify another.” (v. 19) If such a weak person began to teach their distinctives and seek to bind them on others, would not he be sectarian?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 185-86</span></figcaption>

<blockquote><p>If a man were unavoidably brought into an idolatrous temple, or to mass, he might trust in God for strength and grace to preserve him… when a man shall put himself upon such a temptation, either out of vanity, curiosity, or desire to see novelty (though it were not unlawful to afford presence in an idolatrous worship, which yet it is) yet does a man put himself upon a greater temptation than he can in God’s way with confidence expect preservation from or deliverance out [of].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, … (London: 1646), p. 82</span></figcaption>

<main class="wrap"><figure class="quote" id="q-47757e585a" data-kw="">
<blockquote><p>But it is now asked, What sort of Doctrine is Theology, Theoretical or Practical? … This question turned out to be of greater moment, because the Socinians and Remonstrants [Arminians] made the whole of Theology practical with a perverse intention, namely, so that they might separate the knowledge of mysteries, for example, the Trinity, the Incarnation, etc., from the fundamentals of Religion, and say that Religion is summed up in the obedience of precepts and the faith of promises.

Thus Episcopius, Institutionibus Theologicis, book I, chapter II, asserts that Theology is not a speculative science, but practical; neither is it partly speculative and partly practical; but a purely practical science. This the Remonstrants also argue in their Apologia pro Confessione, pages 17, 18, in which they at the same time falsely accuse us, as if our Theology were merely speculative. …

As so, if one or the other must be chosen here; it would be better to be said, yet with the error of the Socinians and Arminians put away, that Theology is a Practical Discipline, rather than a Theoretical Discipline; for, 1. all knowledge of Religion is to be drawn unto practice, John 13:17; 1 Timothy 1:5: 2. and the End, of the glorification of God and salvation of men, is Practical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 28, pp 191-92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology.html">Theology</a></span></div>

Thus Episcopius, Institutionibus Theologicis, book I, chapter II, asserts that Theology is not a speculative science, but practical; neither is it partly speculative and partly practical; but a purely practical science. This the Remonstrants also argue in their Apologia pro Confessione, pages 17, 18, in which they at the same time falsely accuse us, as if our Theology were merely speculative. …

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e28b7eb9b" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 389.</span></figcaption>

</figure><figure class="quote" id="q-45bc9da0a8" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Science and Revelation (c. 1887) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>

</figure><figure class="quote" id="q-47d596d2bb" data-kw="">
<blockquote><p>Medieval theology received from the church fathers a great body of highly detailed doctrine, but virtually nothing that could be called a system [of] theology and, certainly, no theological prolegomena. The received body of patristic teaching was clarified and systematized… to the point that, toward the close of the twelfth century… [they] were able to draw doctrine together into collections of theological statements and definitions, the sententiae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, Ch. 2, sections 1-2, pp. 85-96 of Post-Reformation Reformed Dogmatics, vol. 1, 2nd ed. (Baker, 2003), p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-bd83c980d6" data-kw="necessity amp">
<blockquote><p>Although all the truths revealed in Scripture are necessary to be believed as divine and infallible, yet they are not all equally necessary and the amplitude and extension of faith must be accurately distinguished here from its necessity. Not everything which belongs to the amplitude of faith must therefore belong to its necessity. All truths are not of the same weight. Some have a greater, others a lesser degree of necessity. For example, some are necessary by the necessity of means; others only by the necessity of precept. Some relate to doctrines strictly so called, others only to rites and ceremonies. One relates to some article or doctrine as to substance (for instance that Christ suffered and died); another to the same considered only with reference to circumstances (for instance, that Christ suffered under Pontius Pilate and was crucified between two thieves). For we might be ignorant of the latter without peril to our salvation. Proof of this from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.14.5</span></figcaption>

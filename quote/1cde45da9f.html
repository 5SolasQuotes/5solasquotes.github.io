<main class="wrap"><figure class="quote" id="q-1cde45da9f" data-kw="">
<blockquote><p>One could in fact defend the paradox that it is precisely the particularistic doctrine of predestination that makes possible those universalistic-sounding phrases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4, pp. 726-27 | Thus, in the Second Helvetic Confession, article 1, we read: “At the same time we recognize that God can illuminate whom and when he will, even without the external ministry, for that is in his power”…And the Westminster Confession states (in ch. X, §3) that “elect infants, dying in infancy, are regenerated and saved by Christ through the Spirit, who works when, and where, and how he pleases”, and that this applies also to “all other elect persons who are incapable of being outwardly called by the ministry of the Word.” Reuter, accordingly, after explaining Augustine’s teaching on this point, correctly states:</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1598a035d7" data-kw="">
<blockquote><p>The officers which Christ gave to his church were of two sorts—extraordinary ones advanced to a higher office in the church: such were apostles, prophets, and evangelists. The apostles were chief. These Christ immediately called, furnished them with extraordinary gifts and the power of working miracles, and with infallibility in delivering his truth; and, they having been the witnesses of his miracles and doctrine, he sent them forth to spread the gospel and to plant and govern churches. The prophets seem to have been such as expounded the writings of the Old Testament, and foretold things to come. The evangelists were ordained persons (2 Tim. 1:6 ), whom the apostles took for their companions in travel (Gal. 2:1 ), and sent them out to settle and establish such churches as the apostles themselves had planted (Acts. 19:22 ), and, not being fixed to any particular place, they were to continue till recalled, 2 Tim. 4:9. And then there are ordinary ministers, employed in a lower and narrower sphere; as pastors and teachers…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Eph.</cite>, 4:11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“The officers which Christ gave to his church were of two sorts—extraordinary ones advanced to a higher office in the church: such were apostles, prophets, and evangelists. The apostles were chief. These Christ immediately called, furnished them with extraordinary gifts and the power of working miracles, and with infallibility in delivering his truth; and, they having been the witnesses of his miracles and doctrine, he sent them forth to spread the gospel and to plant and govern churches. The prophets seem to have been such as expounded the writings of the Old Testament, and foretold things to come. The evangelists were ordained persons (2 Tim. 1:6 ), whom the apostles took for their companions in travel (Gal. 2:1 ), and sent them out to settle and establish such churches as the apostles themselves had planted (Acts. 19:22 ), and, not being fixed to any particular place, they were to continue till recalled, 2 Tim. 4:9. And then there are ordinary ministers, employed in a lower and narrower sphere; as pastors and teachers…”

</figure><figure class="quote" id="q-451aa4b924" data-kw="">
<blockquote><p>But that which is used to express or described a practice [such as the laying on of hands], would seem to be an important, if not an essential part of it.</p></blockquote>

</figure><figure class="quote" id="q-04aae92d6a" data-kw="">
<blockquote><p>There will be no one found among men that is free from every vice; but it is one thing to be blemished with ordinary vices, which do not hurt the reputation, because they are found in men of the highest excellence, and another thing to have a disgraceful name, or to be stained with any baseness. In order, therefore, that a bishop may not be without authority, he enjoins that there shall be made a selection of one who has a good and honorable reputation, and not chargeable with any remarkable vice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Timothy, ch. 3, verse 2, “A bishop, therefore, must be blameless.”</cite></span></figcaption>

<blockquote><p>2. Because when the Church is overgone with heresy and apostasy, our reformers, in the exercise of their ministry, were not to keep a certain flock as in a constitute[d] Church, and suppose they had no calling but eminent gifts, they were to spread the Gospel to nations, as Luther did; And suppose the people should resist them, as in many places they did; yet God called them, and they were not to expect election from people: So [men of] Cyprus and Cyrenus preached, Acts 11 and 18, and we read of no vocation that they had from either people or apostle. So Origen preached to a people in a certain town where there was not one Christian, and afterwards he was chosen their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea (1642)</cite>, pp. 126-7</span></figcaption>

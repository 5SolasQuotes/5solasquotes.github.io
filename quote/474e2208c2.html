<main class="wrap"><figure class="quote" id="q-474e2208c2" data-kw="">
<blockquote><p>Then the visible church was not betrothed to Christ as a chaste Virgin: contrary to this our Brethren alleged, 1 Cor. 11. 1 2, 3. 3. Not only is conversion professedly true in the judgment of charity, but also in the judgement of verity, essential to a visible church as you teach; and so none can be a member of the visible church, but he who is a member of the invisible Church, which is Anabaptism. 4. Three thousand in one day were added to the visible church, who could not (as I have proved) all be approved to the conscience one of another, as true converts, Acts 2. Since amongst them were Ananias and Saphira, and the time was short.

5. If we are to bear one another’s burdens, and so fulfil the Law of Christ, and if grace may be beside many and great sins, as we see in Asa, in Salomon who remained the children of God, under many out breakings, if the children of God may be the children of God, and yet some of them habitually proud, passionate, some of them worldly minded, some talkative and imprudently rash in zeal, some lustful, some slothful, some ambitious, yea and if Simon Magus his profession, though false, was esteemed sufficient, for to give him baptism, the Seal of the covenant, Acts 8. 9. Then it is not required that all the members of the visible church be such as positively we know (so far as human knowledge can reach) that they are converted, yea if this were true, then special commandments would be given, that as we are to examine and try our selves, 1 Cor. 11. 28. 2 Cor. 13. 5. And to try officers before they be admitted, 1 Tim. 3. 10. 1 Tim. 5 22. and to try the spirits of Prophets and their Doctrine, 1 John 4. 1. and, 1 Thess. 5. 21. Acts 17. 13. So would God in his Word give a charge, that we try, examine and judge carefully one another, and that every man labour to be satisfied in conscience anent the regeneration one of another. But such commandments we read not of.

6. If many be brought and called into the visible church, of purpose both on Gods revealed intention in his Word to convert them, and on the churches part that they may be converted; Then doth not the church consist of these who are professedly converted, but the former is true; Ergo, so is the latter.

The proposition is sure, these whom God purposeth to convert by making them Church-members, they are not Church-members because they are already converted. I prove the assumption, because. 1. The contrary doctrine, to wit, that none are under a pastor’s care till they be first converted, maketh to the eversion of the public Ministry, and gratifieth Arminians and Socinians, as before I observed, because Faith cometh not by hearing of sent pastors, as God’s ordinance is, Rom. 10. 14. but by the contrary, we ask a warrant from the Testament of Christ, that now since the Apostles are not in the Earth, private men not sent to preach, should be ordinary Fishers of men, and gatherers of Christ’s church and Kingdom.

2. That Christ hath provided no Pastors nor Teachers to watch over the Elect, yet remaining in the Kingdom of darkness, and that Christ ascending on high, as a victorious King hath not given Pastors and Teachers by office to bring in his redeemed flock, which he hath bought with his blood, Acts 20. 28. 3. It is against the nature of the visible Kingdom of Christ which is a drawnet and an officina, a workhouse of external calling into Christ, even such as are serving their honour, buying a Farm; and their gain, buying five yoke of Oxen; and their lusts, having married a Wife. Luk. 14. 16, 17 18. 4. It is against the nature of the Ministry, and Wisdoms maids, sent out to compel them to come in. Luke 14. 23. Matthew 22. 4, 5, 6. Prov. 9. 2, 3, 4, 5. who are yet without.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), pp 253-54.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-abd7767cf3" data-kw="">
<blockquote><p>Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized; not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such [by] that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>

<blockquote><p>2. The law-fear upon a believer is conditional, and not absolute, as he fears hell and falling away, jure, as his deserving, if God should enter in judgment with him, and if he were not in Christ. But he is obliged to a Gospel-faith which lays hold on Christ, righteousness, and deliverance from condemnation; and if Christ and interest in Him be hid from him, and nothing on but law-fear, that is a trial, not a duty of law-fear. (So the faith of Joseph and Mary, that Christ their son shall be great, shall sit in the throne of David his father and shall reign over the house of Jacob forever, Lk. 1:32-33, did well consist with that holy and obediential fear of fleeing into Egypt, for fear that Herod should murdher that hopeful young King in his cradle, Mt. 2) But there is a godly law-fear, or a Gospel-law-fear, which is a godly horror conditional for that which is never to be inflicted, but yet according to deserving may be inflicted; and this is the terror of the Lord, which breeds Gospel persuasion, 2 Cor. 5:11, and so may well stand with Gospel-faith and assurance of deliverance from falling away and of being stablished and confirmed to the end. As a child in the father’s arm threatened to be cast over a sharp rock in the sea, may have horror and fear and cry out for fear, and yet believe so his father’s compassion as he will not through him in the sea, because the threatening is ordained not to be exercised, but that the child may so much the more thrust his arms about his father’s neck.</p></blockquote>

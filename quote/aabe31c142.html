<blockquote><p>The State of the controversy is: Whether private confession and absolution is necessary? Whether bowing of the knees and an uncovering of the head is at the mention of the name of Jesus has been commanded? and lastly, whether Latin songs may be allowed in public assemblies? The Lutherans affirm; we deny.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c49d678bc0" data-kw="">
<blockquote><p>Yea further, times and places which are applied to the worship of God as circumstances only for outward order and policy may be by a private Christian applied to a civil use, for in so doing he breaks not the ordinance of the Church: For example, material churches are appointed to be the receptacles of Christian assemblies, and that only for such common commodity and decency, which has place as well in civil as in holy meetings, and not for any holiness conceived to be in them more than in other houses. Now if I be standing in a churchyard when it rains, may not I go into the church that I may be defended from the injury of the weather? If I must meet with certain men for putting order to some of my worldly affairs, and it fall out that we cannot conveniently meet in any part but in the church, may we not there keep our tryst? A material church then may serve for a civil use, the same way that it serves to a holy use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 1, ‘That the Ceremonies are Unlawful, because superstitious…’</cite>, pp. 11-12</span></figcaption>

<blockquote><p>7. If we may make images and crosses alike in shape, but dislike in use, in God’s worship, we may bring in golden calves to the temples [church buildings], and the image of Dagon, and the Sidonian gods, and altars such as Josiah destroyed, so at their first molding we imprint on them chaste and innocent religious intentions and signification, and make them alike in shape, but dislike in use to heathen worship. But sure the calf of Egypt and the calf that Aaron made, though like in shape, yet were dislike in use.</p></blockquote>

</figure><figure class="quote" id="q-f23d618857" data-kw="">
<blockquote><p>…Bread and Wine… Christ did not take these two by accident, because He found them then on the table, but by choice and election for their use in signifying… … But what shall those places or countries do that have no bread of corn, no fruit of the vine: I confess that though God said in the Passover, a lamb or kid, yet Christ expresses nothing there of other materials, and therefore in case of extreme necessity, where the proper elements cannot be had, they must either be without the ordinance, or celebrate in that which is analogical and which passes for bread with them, or wine with them; which it’s better (say some, Moulin, Buckler, p. 531; Beza, Epistle 2) to do, than wholly to be deprived; but this eclipse is not likely to be seen in our horizon, therefore I shall not further discuss it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Right Institution, Administration &amp; Receiving of the Sacrament of the Lord’s Supper… (London, 1657), Ch. 6, ‘Of the Outwards of this Ordinance of the Supper’, section 3, ‘Of the Elements of Bread &amp; Wine’, pp. 72 &amp; 75 bound after Sermons Preached upon Several Public &amp; Eminent Occasions… (London, 1656) Vines was a presbyterian and Westminster divine.</cite></span></figcaption>

<blockquote><p>§17. 11. He that has commanded us to express our minds in several cases about his worship (as in confession of our sins, in profession of our faith, in choosing of our pastors, in consenting to the casting out or taking in, or restoring of members, in renewing promises of obedience, and the like) has hereby made a profession necessary in general, and so has made it our duty to signify our consent in all these cases by some convenient sign: For man’s mind is not known to others but by signs. But He has not tied us absolutely to any particular sign. If a confession of faith be read, and we are called to signify our consent, or if we are called to signify our consent to be Church-members, or to be guided by our pastors, or submit to discipline; God has not tied us in such cases, whether we shall signify this consent by speaking, or by subscribing our names (Isa. 44:3-5) or by lifting up the hand, or by laying it on a Book (as in swearing) or by standing up, or such like. A sufficient signification or profession of our minds is necessary; but the special sign is left to our own, or our governor’s determination. Of which I shall speak more anon. §18. To this end, and on these terms was the sign of the cross used heretofore by Christians, and to this end they used standing in public worship every Lord’s Day (forbidding kneeling) and afterward standing up at the [saying of the Apostles’] Creed: as also adoring with their faces towards the east, etc. They used these only as significations of their own minds, instead of words; As the prophets of old were wont by other signs, as well as words to prophesy to the people… And I dare not condemn the cautelous [prudent, cautious] use of such professing signs as these: Though the tongue be the chief instrument, yet not the only instrument to express the mind; and though words be the ordinary sign, yet not the only sign. Dumb men must speak by other signs: And usually more silent signs are fitter for assemblies, to avoid disturbance: And sometimes more permanent signs (as subscription, or a stone or pillar of remembrance, as Josh. 24, etc.) are more desirable. And this is left to human prudence. §19. And therefore I durst not have reproved any of the ancient Christians that used the sign of the cross merely as a professing signal action, to show to the heathen and Jews about them that they believed in a crucified Christ, and were not ashamed of his cross. The occasional, indifferent use of this, when it is merely to this end, I durst not have condemned. Nor will I now condemn a man that, living among the enemies of a crucified Christ, shall wear a cross in his hat, or on his breast, or set it on his doors, or other convenient place, merely as a professing sign of his mind, to be but instead of so many words, q. d. [as to say] ‘I thus profess myself the servant of a crucified Christ, of whom I am not ashamed.’ Whether these things be fit or unfit, the time, place, occasion and other circumstances must show: but the lawfulness I dare not deny. … §40… I think neither magistrate nor synod should do any more than hinder undecency: But yet if they do more, and tie all to one habit [garment] (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; He does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment if I could not be dispensed with [it]. Yea though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily, we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul, and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful. … §57. That it [the minister making the sign of the cross in baptism] is ordained for this use, appears from the words (anon to be recited) in the use of it, and by those words prefixed before the Common Prayer Book, ‘of ceremonies; why some are abolished and some retained,’ where they say that they ‘be not dark and dumb ceremonies, but are so set forth that every man may understand what they do mean, and to what use they do serve,’ and ‘that they are such as are apt to stir up the dull mind of man, to the remembrance of his duty to God, by some notable and special signification, whereby he might be edified.’ So that this and such other (if there be more such) are appointed by their signification to teach the understanding, and stir up the dull mind of man to the remembrance of his duty to God: Which are good works, but to be done only by good means. [Baxter goes on to take exceptions to the use of the cross in baptism]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London, 1659), 5th Disputation, ch. 2</cite>, pp. 403-5, 409-10, 419-20</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§17. 11. He that has commanded us to express our minds in several cases about his worship (as in confession of our sins, in profession of our faith, in choosing of our pastors, in consenting to the casting out or taking in, or restoring of members, in renewing promises of obedience, and the like) has hereby made a profession necessary in general, and so has made it our duty to signify our consent in all these cases by some convenient sign: For man’s mind is not known to others but by signs. But He has not tied us absolutely to any particular sign. If a confession of faith be read, and we are called to signify our consent, or if we are called to signify our consent to be Church-members, or to be guided by our pastors, or submit to discipline; God has not tied us in such cases, whether we shall signify this consent by speaking, or by subscribing our names (Isa. 44:3-5) or by lifting up the hand, or by laying it on a Book (as in swearing) or by standing up, or such like. A sufficient signification or profession of our minds is necessary; but the special sign is left to our own, or our governor’s determination. Of which I shall speak more anon. §18. To this end, and on these terms was the sign of the cross used heretofore by Christians, and to this end they used standing in public worship every Lord’s Day (forbidding kneeling) and afterward standing up at the [saying of the Apostles’] Creed: as also adoring with their faces towards the east, etc. They used these only as significations of their own minds, instead of words; As the prophets of old were wont by other signs, as well as words to prophesy to the people… And I dare not condemn the cautelous [prudent, cautious] use of such professing signs as these: Though the tongue be the chief instrument, yet not the only instrument to express the mind; and though words be the ordinary sign, yet not the only sign. Dumb men must speak by other signs: And usually more silent signs are fitter for assemblies, to avoid disturbance: And sometimes more permanent signs (as subscription, or a stone or pillar of remembrance, as Josh. 24, etc.) are more desirable. And this is left to human prudence. §19. And therefore I durst not have reproved any of the ancient Christians that used the sign of the cross merely as a professing signal action, to show to the heathen and Jews about them that they believed in a crucified Christ, and were not ashamed of his cross. The occasional, indifferent use of this, when it is merely to this end, I durst not have condemned. Nor will I now condemn a man that, living among the enemies of a crucified Christ, shall wear a cross in his hat, or on his breast, or set it on his doors, or other convenient place, merely as a professing sign of his mind, to be but instead of so many words, q. d. [as to say] ‘I thus profess myself the servant of a crucified Christ, of whom I am not ashamed.’ Whether these things be fit or unfit, the time, place, occasion and other circumstances must show: but the lawfulness I dare not deny. … §40… I think neither magistrate nor synod should do any more than hinder undecency: But yet if they do more, and tie all to one habit [garment] (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; He does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment if I could not be dispensed with [it]. Yea though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily, we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul, and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful. … §57. That it [the minister making the sign of the cross in baptism] is ordained for this use, appears from the words (anon to be recited) in the use of it, and by those words prefixed before the Common Prayer Book, ‘of ceremonies; why some are abolished and some retained,’ where they say that they ‘be not dark and dumb ceremonies, but are so set forth that every man may understand what they do mean, and to what use they do serve,’ and ‘that they are such as are apt to stir up the dull mind of man, to the remembrance of his duty to God, by some notable and special signification, whereby he might be edified.’ So that this and such other (if there be more such) are appointed by their signification to teach the understanding, and stir up the dull mind of man to the remembrance of his duty to God: Which are good works, but to be done only by good means. [Baxter goes on to take exceptions to the use of the cross in baptism]”

— Richard Baxter, Five Disputations of Church-Government &amp; Worship (London, 1659), 5th Disputation, ch. 2, pp. 403-5, 409-10, 419-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A717.+11.+He+that+has+commanded+us+to+express+our+minds+in+several+cases+about+his+worship+%28as+in+confession+of+our+sins%2C+in+profession+of+our+faith%2C+in+choosing+of+our+pastors%2C+in+consenting+to+the+casting+out+or+taking+in%2C+or+restoring+of+members%2C+in+renewing+promises+of+obedience%2C+and+the+like%29+has+hereby+made+a+profession+necessary+in+general%2C+and+so+has+made+it+our+duty+to+signify+our+consent+in+all+these+cases+by+some+convenient+sign%3A+For+man%E2%80%99s+mind+is+not+known+to+others+but+by+signs.+But+He+has+not+tied+us+absolutely+to+any+particular+sign.+If+a+confession+of+faith+be+read%2C+and+we+are+called+to+signify+our+consent%2C+or+if+we+are+called+to+signify+our+consent+to+be+Church-members%2C+or+to+be+guided+by+our+pastors%2C+or+submit+to+discipline%3B+God+has+not+tied+us+in+such+cases%2C+whether+we+shall+signify+this+consent+by+speaking%2C+or+by+subscribing+our+names+%28Isa.+44%3A3-5%29+or+by+lifting+up+the+hand%2C+or+by+laying+it+on+a+Book+%28as+in+swearing%29+or+by+standing+up%2C+or+such+like.+A+sufficient+signification+or+profession+of+our+minds+is+necessary%3B+but+the+special+sign+is+left+to+our+own%2C+or+our+governor%E2%80%99s+determination.+Of+which+I+shall+speak+more+anon.+%C2%A718.+To+this+end%2C+and+on+these+terms+was+the+sign+of+the+cross+used+heretofore+by+Christians%2C+and+to+this+end+they+used+standing+in+public+worship+every+Lord%E2%80%99s+Day+%28forbidding+kneeling%29+and+afterward+standing+up+at+the+%5Bsaying+of+the+Apostles%E2%80%99%5D+Creed%3A+as+also+adoring+with+their+faces+towards+the+east%2C+etc.+They+used+these+only+as+significations+of+their+own+minds%2C+instead+of+words%3B+As+the+prophets+of+old+were+wont+by+other+signs%2C+as+well+as+words+to+prophesy+to+the+people%E2%80%A6+And+I+dare+not+condemn+the+cautelous+%5Bprudent%2C+cautious%5D+use+of+such+professing+signs+as+these%3A+Though+the+tongue+be+the+chief+instrument%2C+yet+not+the+only+instrument+to+express+the+mind%3B+and+though+words+be+the+ordinary+sign%2C+yet+not+the+only+sign.+Dumb+men+must+speak+by+other+signs%3A+And+usually+more+silent+signs+are+fitter+for+assemblies%2C+to+avoid+disturbance%3A+And+sometimes+more+permanent+signs+%28as+subscription%2C+or+a+stone+or+pillar+of+remembrance%2C+as+Josh.+24%2C+etc.%29+are+more+desirable.+And+this+is+left+to+human+prudence.+%C2%A719.+And+therefore+I+durst+not+have+reproved+any+of+the+ancient+Christians+that+used+the+sign+of+the+cross+merely+as+a+professing+signal+action%2C+to+show+to+the+heathen+and+Jews+about+them+that+they+believed+in+a+crucified+Christ%2C+and+were+not+ashamed+of+his+cross.+The+occasional%2C+indifferent+use+of+this%2C+when+it+is+merely+to+this+end%2C+I+durst+not+have+condemned.+Nor+will+I+now+condemn+a+man+that%2C+living+among+the+enemies+of+a+crucified+Christ%2C+shall+wear+a+cross+in+his+hat%2C+or+on+his+breast%2C+or+set+it+on+his+doors%2C+or+other+convenient+place%2C+merely+as+a+professing+sign+of+his+mind%2C+to+be+but+instead+of+so+many+words%2C+q.+d.+%5Bas+to+say%5D+%E2%80%98I+thus+profess+myself+the+servant+of+a+crucified+Christ%2C+of+whom+I+am+not+ashamed.%E2%80%99+Whether+these+things+be+fit+or+unfit%2C+the+time%2C+place%2C+occasion+and+other+circumstances+must+show%3A+but+the+lawfulness+I+dare+not+deny.+%E2%80%A6+%C2%A740%E2%80%A6+I+think+neither+magistrate+nor+synod+should+do+any+more+than+hinder+undecency%3A+But+yet+if+they+do+more%2C+and+tie+all+to+one+habit+%5Bgarment%5D+%28and+suppose+it+were+an+undecent+habit%29%2C+yet+this+is+but+an+imprudent+use+of+power.+It+is+a+thing+within+the+magistrate%E2%80%99s+reach%3B+He+does+not+an+alien+work%2C+but+his+own+work+amiss%3A+and+therefore+the+thing+in+itself+being+lawful%2C+I+would+obey+him+and+use+that+garment+if+I+could+not+be+dispensed+with+%5Bit%5D.+Yea+though+secondarily+the+whiteness+be+to+signify+purity%2C+and+so+it+be+made+a+teaching+sign%2C+yet+would+I+obey%3A+For+secondarily%2C+we+may+lawfully+and+piously+make+teaching+signs+of+our+food+and+raiment%2C+and+everything+we+see.+But+if+the+magistrate+had+said+that+the+primary+reason+or+use+of+the+surplice+was+to+be+an+instituted+sacramental+sign%2C+to+work+grace+on+my+soul%2C+and+engage+me+to+God%2C+then+I+durst+not+have+used+it%2C+though+secondarily+it+had+been+commanded+as+a+decent+garment.+New+sacraments+I+durst+not+use%2C+though+a+secondary+use+were+lawful.+%E2%80%A6+%C2%A757.+That+it+%5Bthe+minister+making+the+sign+of+the+cross+in+baptism%5D+is+ordained+for+this+use%2C+appears+from+the+words+%28anon+to+be+recited%29+in+the+use+of+it%2C+and+by+those+words+prefixed+before+the+Common+Prayer+Book%2C+%E2%80%98of+ceremonies%3B+why+some+are+abolished+and+some+retained%2C%E2%80%99+where+they+say+that+they+%E2%80%98be+not+dark+and+dumb+ceremonies%2C+but+are+so+set+forth+that+every+man+may+understand+what+they+do+mean%2C+and+to+what+use+they+do+serve%2C%E2%80%99+and+%E2%80%98that+they+are+such+as+are+apt+to+stir+up+the+dull+mind+of+man%2C+to+the+remembrance+of+his+duty+to+God%2C+by+some+notable+and+special+signification%2C+whereby+he+might+be+edified.%E2%80%99+So+that+this+and+such+other+%28if+there+be+more+such%29+are+appointed+by+their+signification+to+teach+the+understanding%2C+and+stir+up+the+dull+mind+of+man+to+the+remembrance+of+his+duty+to+God%3A+Which+are+good+works%2C+but+to+be+done+only+by+good+means.+%5BBaxter+goes+on+to+take+exceptions+to+the+use+of+the+cross+in+baptism%5D%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship+%28London%2C+1659%29%2C+5th+Disputation%2C+ch.+2%2C+pp.+403-5%2C+409-10%2C+419-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ee02e814e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ee02e814e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=%C2%A717.%2011.%20He%20that%20has%20commanded,use%20of%20the%20cross%20in%20baptism%5D" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

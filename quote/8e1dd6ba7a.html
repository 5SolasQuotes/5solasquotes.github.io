<main class="wrap"><figure class="quote" id="q-8e1dd6ba7a" data-kw="">
<blockquote><p>The Westminster divines worked on what might have been called “The Medium Catechism” before scrapping it and writing the Shorter and Larger Catechisms. The minutes of the Assembly give us some insight into what this catechism would have looked like had it been published:

Q. 6. What doe the Scriptures teach us to conceive of God?

A. God is a most glorious being, infinite in all perfections. …

Q. 15. What are we to believe concerning the holiness of God?

A. God is most perfectly holy, and neither causeth nor alloweth any to sin. …

Q. 19. Is God subject to any change or changeableness?

A. God is always the same unchangeably notwithstanding the changes in all others things.

Q. 20. What are we to believe concerning the truth of God?

A. God is most true in all his words, particularly in his promises and threatenings, and it is not possible for him to lie.

Q. 21. What are we to believe concerning the blessedness of God?

A. God is in himself most blessed, every way, and for ever, neither can any creature add to his happiness or take anything from it.</p></blockquote>

<blockquote><p>§I. Sacred Scripture, of both the Old and the New Testament, exhorts and obliges man under the Covenant of Grace to perfection. In the Old Testament, God Himself addresses Abraham: Gen. 17:1, ‘Walk before Me, and be perfect;’… §II. ‘In the New Testament, Christ commands in Mt. 5:48, ‘Be ye therefore perfect, τέλειοι, even as your Father which is in heaven is perfect.’ Paul in 1 Cor. 2:6 says, ‘we speak wisdom among them that are perfect, τελείοις. Phil. 3:15, the same apostle stimulates himself and other Christians to perfection, ‘Let us therefore, as many as be perfect, τέλειοι, be thus minded.’ Col. 1:28, he professes that he and the other apostles announce Christ, so that we may present every man perfect, τέλειον, in Christ Jesus. Col. 3:14, he calls charity σύνδεσμον τῆς τελειότητος, the bond or chain of perfection. Col. 4:12, it is said of Epaphras that he is always striving in prayers for the Colossians, that they may stand perfect, τέλειοι, and complete, πεπληρωμένοι, in all the will of God… Heb. 5:14, the apostle says that strong meat belongs to them that are of full age (perfect), τελείων. §III. Examples of perfect men also occur in the sacred writings… Concerning Noah, God Himself testifies that he was a just and perfect man before him in his generations, Gen. 6:9, and walked with God without ceasing. Concerning Job, God Himself, addressing Satan, gives this sentence in chap. 1 &amp; 2, ‘Hast thou considered my servant Job, that there is none like him in the earth, תםָּ שׁאיִ , a perfect and an upright man, one that feareth God, and escheweth evil.’… §IV. Therefore, the term for Christian ‘perfection’ exists, which we can use without suspicion of heterodoxy, even if others, namely the Novatians and Pelagians, have abused it… Certainly, in the age of Justin Martyr [2nd century A.D.], the name of the perfect was so customary that in his Dialogue with Trypho he himself interprets to become perfect as to become a Christian. … §VI… Perfection is twofold: Legal and Evangelical. Legal is either absolute, or in a certain respect… §VII. Evangelical perfection, on the contrary, consists in the recognition of our misery, both corporal and spiritual, and the necessity of fleeing to the grace of God in Jesus Christ our propitiator, and in a sincere and ἀνυπόκριτος, that is, undisguised and serious and constant endeavor to serve and obey God, through the grace of the Holy Spirit, to be obtained from Him for that purpose by ardent prayers, according to all the commands of the Law, and according to all the faculties of the soul and body, and to grow and advance daily more and more in faith, charity, hope, and other Christian virtues, and to implore pardon for errors and lapses for the sake of the Mediator. §VIII. The former [legal] perfection is rightly called one of degrees, full, and absolute and consummate in all its parts. The latter [evangelical] is called a perfection of parts, inchoate, and in one word, sincerity. And it is such, either absolutely without respect to others who are more imperfect; or comparatively with respect to others who are more imperfect and less mature.</p></blockquote>

<blockquote><p>Controversy XI: Can the justified men fulfill God’s law? Orthodox Position: None of the justified can perfectly keep God’s law, as Scripture teaches (Romans 8; Galatians 3), experience, and the Church Fathers. The perfection of the righteous, mentioned in Matthew 5:48 and Genesis 6:9, 17:1, Philippians 3:15, consists in the imputation of Christ’s justice and in sincerity and uprightness, which consist in acknowledging one’s own imperfection and firmly resolving to obey all of God’s commandments. [Romanist] Position of [Robert] Bellarmine: The justified men can keep God’s law, not by the forces of free will, but by the aid of God’s grace, that is, by the spirit of faith and charity infused in justification. The reasons are:

1. Christ’s yoke is easy, and His commandments are not burdensome (Matthew 11; 1 John 5).

2. God gives us His Spirit, who makes us walk in His ways (Ezekiel 36). That is why the apostle says in Philippians 4:13 that he can do all things.

3. The elect are endowed with charity (John 13, 15; 1 John 3, 4). Charity is the fulfillment of the law (John 14; Romans 13).

4. We read about many saints who kept God’s commandments blamelessly and were perfect and truly righteous (Genesis 6, 17; 1 Samuel 14, 15; 2 Samuel 23; Luke 1).

5. God is not like a tyrant who demands impossible tributes from His friends. Therefore, the Church Fathers teach that no one is obligated to do the impossible.

6. Christ died so that the justice of the law might be fulfilled in us (Romans 8:4).

7. Man can do more than is commanded (Matthew 19:21). [The Reformed] Censure: 1.2. God’s commandments are not only possible but also easy for the elect, not by their own strength but by God’s grace. Furthermore, the defects found in their works are graciously forgiven by God. 3.4. Perfection of parts and sincerity are attributed to the elect, not absolute and supreme perfection, which is called perfection of degrees. Though the elect love God, the mode of this love in this life is imperfect.

5. Not every obligation to do the impossible is unjust, especially when one has incurred a debt by one’s own fault. Moreover, God requires from His own what is possible through Christ.

6. The substance of God’s law is fulfilled in us when we are justified in Christ according to the perfect formula of the law.

7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.</p></blockquote>

7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.”

— Johann Heinrich Alsted, ‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio, (d. 1638) at Nosferatu’s Substack (2024)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CControversy+XI%3A+Can+the+justified+men+fulfill+God%E2%80%99s+law%3F+Orthodox+Position%3A+None+of+the+justified+can+perfectly+keep+God%E2%80%99s+law%2C+as+Scripture+teaches+%28Romans+8%3B+Galatians+3%29%2C+experience%2C+and+the+Church+Fathers.+The+perfection+of+the+righteous%2C+mentioned+in+Matthew+5%3A48+and+Genesis+6%3A9%2C+17%3A1%2C+Philippians+3%3A15%2C+consists+in+the+imputation+of+Christ%E2%80%99s+justice+and+in+sincerity+and+uprightness%2C+which+consist+in+acknowledging+one%E2%80%99s+own+imperfection+and+firmly+resolving+to+obey+all+of+God%E2%80%99s+commandments.+%5BRomanist%5D+Position+of+%5BRobert%5D+Bellarmine%3A+The+justified+men+can+keep+God%E2%80%99s+law%2C+not+by+the+forces+of+free+will%2C+but+by+the+aid+of+God%E2%80%99s+grace%2C+that+is%2C+by+the+spirit+of+faith+and+charity+infused+in+justification.+The+reasons+are%3A+1.+Christ%E2%80%99s+yoke+is+easy%2C+and+His+commandments+are+not+burdensome+%28Matthew+11%3B+1+John+5%29.+2.+God+gives+us+His+Spirit%2C+who+makes+us+walk+in+His+ways+%28Ezekiel+36%29.+That+is+why+the+apostle+says+in+Philippians+4%3A13+that+he+can+do+all+things.+3.+The+elect+are+endowed+with+charity+%28John+13%2C+15%3B+1+John+3%2C+4%29.+Charity+is+the+fulfillment+of+the+law+%28John+14%3B+Romans+13%29.+4.+We+read+about+many+saints+who+kept+God%E2%80%99s+commandments+blamelessly+and+were+perfect+and+truly+righteous+%28Genesis+6%2C+17%3B+1+Samuel+14%2C+15%3B+2+Samuel+23%3B+Luke+1%29.+5.+God+is+not+like+a+tyrant+who+demands+impossible+tributes+from+His+friends.+Therefore%2C+the+Church+Fathers+teach+that+no+one+is+obligated+to+do+the+impossible.+6.+Christ+died+so+that+the+justice+of+the+law+might+be+fulfilled+in+us+%28Romans+8%3A4%29.+7.+Man+can+do+more+than+is+commanded+%28Matthew+19%3A21%29.+%5BThe+Reformed%5D+Censure%3A+1.2.+God%E2%80%99s+commandments+are+not+only+possible+but+also+easy+for+the+elect%2C+not+by+their+own+strength+but+by+God%E2%80%99s+grace.+Furthermore%2C+the+defects+found+in+their+works+are+graciously+forgiven+by+God.+3.4.+Perfection+of+parts+and+sincerity+are+attributed+to+the+elect%2C+not+absolute+and+supreme+perfection%2C+which+is+called+perfection+of+degrees.+Though+the+elect+love+God%2C+the+mode+of+this+love+in+this+life+is+imperfect.+5.+Not+every+obligation+to+do+the+impossible+is+unjust%2C+especially+when+one+has+incurred+a+debt+by+one%E2%80%99s+own+fault.+Moreover%2C+God+requires+from+His+own+what+is+possible+through+Christ.+6.+The+substance+of+God%E2%80%99s+law+is+fulfilled+in+us+when+we+are+justified+in+Christ+according+to+the+perfect+formula+of+the+law.+7.+The+conditional+is+not+categorical.+Christ+is+not+saying+here+what+the+arrogant+young+man+could+do+but+refuting+him+for+his+false+hope+of+justice.+Moreover%2C+it+is+true+that+there+are+works+of+supererogation%2C+but+in+Christ.+.+Controversy+XII%3A+Are+the+good+works+of+the+justified+truly+pure%3F+Orthodox+Position%3A+The+good+works+of+the+justified%2C+considered+in+themselves%2C+are+wrapped+in+many+defects+and+are+therefore+not+absolutely+pure+but+only+relatively%2C+considering+the+justified+person%2C+who+is+pure+in+Christ.+Scripture+teaches+this+%28Psalm+130%3B+Romans+7%3B+1+Corinthians+13%3B+James+3%29.+Experience+also+confirms+this%2C+as+we+experience+various+temptations+in+thoughts%2C+words%2C+and+deeds.+The+Church+Fathers%2C+like+Bernard%2C+also+approve+this%3A+%E2%80%9CIf+there+is+any+justice+in+us%2C+it+is+humble%2C+perhaps+upright%2C+but+not+pure.%E2%80%9D%0A%0A%E2%80%94+Johann+Heinrich+Alsted%2C+%E2%80%98On+Justification+%26+Good+Works+in+General%E2%80%99+in+Theologia+polemica%2C+exhibens+praecipuas+huius+aeui+in+religionis+negotio+controuersias+sex+in+partes+tributa+studio%2C+%28d.+1638%29+at+Nosferatu%E2%80%99s+Substack+%282024%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa020fd1c93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a020fd1c93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perfectionism/#:~:text=Controversy%20XI%3A%20Can%20the%20justified%20men,humble%2C%20perhaps%20upright%2C%20but%20not%20pure&amp;text=Controversy%20XI%3A%20Can%20the%20justified%20men%20fulfill%20God%E2%80%99s&amp;text=it%20is%20humble%2C%20perhaps%20upright%2C%20but%20not%20pure" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-77a37dace4" data-kw="">
<blockquote><p>The purposes of Deity are not lawless and arbitrary. His will is determined by the perfections of His nature. To say, therefore, that there are things which He cannot do, is simply to affirm that He cannot will them, and to say that He cannot will them, is just to assert that they are inconsistent with the perfections of His Being. In such cases, consequently, we do not limit, we only define the power of God …

It is His glory to be what He is. The possession of infinite perfections and the enjoyment within Himself of unchanging blessedness, independence and self-sufficiency, are characteristics of the Deity which render it impossible that His manifold works should spring from any other motive but the counsel of His Own will.</p></blockquote>

<blockquote><p>[T]he kingdom of grace is still restricted, in that measure in this our mortal life even they who seem to be somewhat nigh unto perfection are under necessity of confessing: “In many things we offend all,” and “If we say that we have no sin, we deceive ourselves, and the truth is not in us.” Wherefore it is that they pray without ceasing, saying: “Thy kingdom come.” But this will not be consummated even in them, until not only doth not sin reign in their mortal body, but there neither is nor can be any sin at all in the body then immortal.</p></blockquote>

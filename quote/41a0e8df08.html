<main class="wrap"><figure class="quote" id="q-41a0e8df08" data-kw="">
<blockquote><p>The belief which human minds share demonstrates that God, the source of all things, is good; for since nothing better than God can be imagined, who can doubt that if something has no better, it is good? Reason in fact establishes that God’s goodness is such as to demonstrate further that perfect good resides within him. Were this not the case, he could not be the source of all things, for there would be something more perfect good, and would be seen to take precedence ahead of him, since all perfect things clearly take precedence over things less complete. So to prevent the argument advancing into infinity, we must allow that the highest God is totally full of the highest and perfect good. Now we have established that the perfect good is true happiness, so true happiness must reside in the highest God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/boethius.html">Boethius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Consolation of Philosophy</cite>, trans. P. G. Walsh (524; Oxford: Oxford University Press, 2000), 3.10.7-10, p. 58.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e66d58afd" data-kw="">
<blockquote><p>God condescends to speak after the manner of men that we may understand him: and here we are not to think that God wants anything needful to him; he is God blessed for ever; or that he labours under any defect of power that he cannot accomplish what he would have, nor that he is capable of any uneasiness or desire of what he has not. To admit of any of those which commonly are found in men when they wish, were to blaspheme the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons Preached before and after the Celebration of the Sacrament of the Lord’s Supper</cite>, (1718; 2nd edn, Glasgow, 1770), p. 257.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-f207ede92f" data-kw="">
<blockquote><p>And does not reason confirm the same truth? For, 1st, if God be not just, whence is there any justice? Either there would be no justice at all, or if there was any, it would not proceed from God; or if it did, it must proceed from one who had none; each of which particulars is absurd.

Besides, 2d, inasmuch as the Lord is governor of the whole universe, he would degenerate into a tyrant if he was not just; and, 3d, seeing Jehovah is judge of all the earth, how could he judge aright without being just himself? Neither can it be otherwise but that God should be just, seeing that he is absolutely perfect. All confess justice to be an excellency, involving no imperfection in it, and therefore it cannot bet wanting to that being, who is absolutely and infinitely perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-tennent.html">Gilbert Tennent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Justice of God in Sermons and Essays by the Tennents and their Contemporaries, Compiled by the Board</cite></span></figcaption>

</figure><figure class="quote" id="q-8825e7f669" data-kw="">
<blockquote><p>Object. Perhaps the promises and threatnings of God, are his conditional decree, and depending upon the performance of the condition by the pleasure of man. Answ. But this cannot truly be said: For if it should be so, this decree would not be certain by the will of God, although the event was certainly foreseen by him: Also nothing can be imagined more absurd, than to appoint God to decree any thing with a condition is fulfilled.

But God willeth nothing, which he willed not from eternity. Indeed God doth promise life under the condition of obedience, but he doth decree nothing under that doubtful condition. He doth not elect Peter if he shall believe, but he electeth him to faith, that he might be saved: Neither was he only willing to preserve the Ninevites if they would be turned, but he also gave them repentance whereby they turned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 4.7, p. 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

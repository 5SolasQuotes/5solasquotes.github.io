<main class="wrap"><figure class="quote" id="q-8357d96c9c" data-kw="">
<blockquote><p>That the bush may represent His human nature is not unlikely, especially as the prophet Isaiah compares Him to a tender plant and root out of a dry ground, in which, to the eye of sense, no form, comeliness, or beauty should be found (Isa. 53:2). That the flame of fire may adumbrate His divine nature will be no less evident when we consider how often the fiery element is, in the Scripture style, an emblem of the deity; yea, it is expressly said, “Our God is a consuming fire” (Heb. 12:29; cf. Deut. 4:24).

That the union of the flame of fire with the bush may denote the union of the Godhead and the manhood is not at all absurd to suppose, for why should Moses in his dying benediction be directed to speak of the goodwill of Him who “dwelt in the bush” (Deut. 33:16)? May it not signify that the continuance of the flame of fire in the bush for a short time was a type of the fullness of the Godhead dwelling forever in the man Christ Jesus (Col. 2:9)? As the bush was in the fire, and the fire was in the bush, yet still they were distinct things, though enjoined thus in one: even so the man Christ Jesus is in the God, and the God is in the man, though both these natures, so mysteriously united, do still retain their own distinct properties.

And if Moses was struck with admiration that the bush was not consumed, though in such near neighbourhood with ruddy flame, much more may we be overwhelmed with amazement to think how a portion of our frail humanity lives forever in a state of the nearest approach unto and most ineffable union with the glorious Godhead in whose unveiled presence we mortals could not live, and even the angels cover their faces with their wings.

Here also may be discerned a shadow of those direful sufferings by which the Son of God was to expiate our sin. For the wrath of God is everywhere in Scripture compared to fire the most fierce and dreadful of all the inanimate creatures, which with severe impartiality devours all combustible things. Who of all the human race could dwell with this devouring element? Far less could any abide with the everlasting burnings of the Almighty’s indignation. But Jesus Christ who dwelt in the bush dwelt also with these fierce flames, and though He endured the wrath of God, which flamed most intensely against Him as He bore the sins of many, though He was compassed by this fire all the days of His humbled life, yet He was not consumed, because His deity, like the angel in the bush, supported His humanity and bade Him be a glorious conqueror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcewen.html">William McEwen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory and Fullness of Jesus Christ: In the Most Remarkable Types, Figures, and Allegories of the Old Testament</cite>, ed. Gordon J. Keddie (1763; Grand Rapids MI: Reformation Heritage Books, 2022), pp 94-95.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4417b543a8" data-kw="">
<blockquote><p>…to appear in the likeness of a flame of fire in a bush, and the bush not consumed, is not an impossible work to a created angel: yet it was God Himself, even Christ the Son of God that so appeared: for He is called the God of Abraham, the God of Isaac, Ex. 3:6, which could be no angel. And Moses pronouncing a blessing upon Joseph, says, The good will of him that dwelt in the bush, shall come upon the head of Joseph, Deut. 33:16, but God only has the power and authority of blessing… It was God therefore, and not an angel that appeared in the bush. Now then by these places given in instance it is evident, that some things said to be done by God in the Scriptures, not exceeding the power of angels, were so done by the Lord Himself, and not by the angels.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1ef4dac9cd" data-kw="">
<blockquote><p>To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 40, art. 3, On Divine Election, quest. 1, ‘Whether election is in God from eternity, or in time.’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05c3589b7c" data-kw="">
<blockquote><p>Secondly, there is Voluntas Signi [will of sign], a manifestation of his will, whether it be in his works, which are the fruits of his will, or his Word which is the evidence of his will, directing us to the knowledge what He would have us do. A sense tropical and figurative, yet most proper to inform us: and this is scattered into five divisions or species. First, Permissio, his permission or allowance, or privilege to things, without which they cannot be; Non fit aliquid nisi omnipotens fieri velit, vel sinendo ut fiat, vel faciendo [Nothing comes to be unless the Omnipotent wills it to come to be, either by permitting it to come to pass or by bringing it about]. (Augustine, Enchiridion) Secondly, Impletio, the perfecting or fulfilling of them. Thirdly, Consilium, his revealed decree. Fourthly, Praeceptum, his positive law; his precepts wherein He teaches and commands us to do what is acceptable in his sight. Fifthly and lastly, Prohibitio, the restraint He lays upon us, his command for the eschewing those actions which are contrary to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-king.html">Henry King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Lord’s Prayer delivered in Certain Sermons</cite>, (London: Haviland, 1628), ‘Thy will be done in earth as it is in heaven’, pp. 146-47 King (1592–1669) was the Bishop of Chichester, a poet and a friend of John Donne.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>13. In the same way too it cannot be concluded that because the outward calling of the rejected is ineffectual it is therefore not seriously meant by God. Outward calling is always per se [of itself, in principle] a real calling to salvation, since everyone who follows it up thereby gains righteousness in Christ and eternal life: only, in the case of the godless, it is ineffectual because of their hardness of heart. Similarly, the calling from God’s side is always seriously intended, since God promises grace even to the rejected upon condition of faith, and makes faith for them a duty. But of course God omits to give faith to the rejected, because He is not bound to do so in the case of any man… From this it follows that even the calling of the godless is on God’s side ‘sincere and serious’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, tr. G.T. Thompson (1861; 1950; Wipf &amp; Stock, 2007), p. 517</span></figcaption>

</figure><figure class="quote" id="q-ef4bec73dc" data-kw="will irresistible precept">
<blockquote><p>The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.2</span></figcaption>

</figure><figure class="quote" id="q-3b72859a83" data-kw="">
<blockquote><p>The second conclusion pretended to be drawn from this [Rev. 2:21] is that the Lord has a universal will to have all men saved, seeing He gives her time to repent. This we say does not follow hence: For: … 4. It will not follow Christ wills persons to repent; therefore He wills their salvation: because He may be said to will them to repent when He requires it of them as their duty: and thus their duty of repenting is the immediate object of his revealed and preceptive will: but a person’s salvation is the proper object of his will of good-pleasure, or of his decreeing and purposing will. And no otherways can He be said to will such persons’ salvation (because He commands them to repent) than this, to wit, that in His Word He has signified repentance to be such a person’s duty, and that He has appointed a connection between repentance and salvation; which still relates to his revealed will: even as when God made the first Covenant with Adam, it might be said that He willed Adam to be holy, and that by that Covenant He had made a connection between holiness and life; yet it is not proper to say that the Lord willed life to Adam upon that condition, because that looks to the event and respects the Lord’s will of purpose: which cannot but be effectual. And if the Lord’s willing of men (at least such as are under his ordinances) to be saved be thus understood as including only the duty which God lays upon men and the connection that He has made between it and salvation in his Word, it may be admitted: but if it be extended to any antecedent will in God Himself, distinct from that which is called His revealed will, this place and such like will give no ground for such an assertion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), ch. 2, Lecture 6, on vv. 18-29, pp. 169-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

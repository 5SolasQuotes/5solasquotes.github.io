<main class="wrap"><figure class="quote" id="q-1c467c1cdc" data-kw="">
<blockquote><p>Thus also, as to the persons for whom Christ engaged to suffer, their coming unto Him looks back to that first donation of the Father, as flowing from that: All that the Father giveth me shall come unto me. John vi. 37.

Now this being God’s great design, it is that which He would have men eye and consider more than all the rest of His works; and yet it is least of all considered by the most! The other Covenant, made with the first Adam, was but to make way, and, if we may so speak, to make work for this.

For He knew that it would not hold; therefore, as this New Covenant became needful by the breach of the other, so, the failing of that other, sets off and commends the firmness of this. The former was made with a man in his best condition, and yet he kept it not: even then, he proved vanity, as it is, Psal. xxxix. 5, Verily, every man, in his best estate, is altogether vanity. So that the second, that it might be stronger, is made with A Man indeed, to supply the place of the former, but he is God-Man, to be surer than the former, and therefore it holds.

And this is the difference, as the Apostle expresses it, that the first Adam, in that Covenant, was laid as a foundation, and, though we say not that the Church, in its true notion, was built on him, yet, the estate of the whole race of mankind, the materials which the Church is built of, lay on him for that time; and it failed. But upon this rock, the second Adam, is the Church so- firmly built, that the gates of hell cannot prevail against her. The first man, Adam, was made a living soul; the last Adam was made a quickening (or life-giving) spirit. 1 Cor. xv. 45. The First had life, but he transferred it not, yea, he kept it not for himself, but drew in and transferred death; but the Second, by death, conveys life to all that are reckoned his seed: He bare their sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 325.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c339dc602" data-kw="">
<blockquote><p>Some choose to refer this [Acts 14:23] to laying on of hands, as if it also were altogether necessary, and under this pretense say, Our calling is null, because the Ordinaries [in the RCC] (as they call them) have not laid hands on us, or because we are not consecrated in the Church of Rome. I answer, by those canons which they boast of, the consecration is null, where there was not first a lawful choice, or which was done by one who is excommunicated: Let them show but one in all their hierarchy who is lawfully chosen, yea who is not by the very law a hundred times excommunicate[d], if they will stand to their own synods. Why should we therefore desire hands to be laid on us by them? Or by what law can they do it? But we have by the blessing of God certain marks of our calling, being (through the grace of God) adorned with the lawful testimony of our life and doctrine from our Churches, and after that by calling upon the name of God confirmed in our ministry, which God I hope will bless, and cast out both the thieves and hirelings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, on Acts 14:23, as quoted in Sidrach Simpson, Diatribe: Wherein the Judgment of the Reformed Churches &amp; Protestant Divines, is Shown Concerning Ordination, Laying on of Hands in Ordination of Ministers, &amp; Preaching by Those who are Not Ordained Ministers (London, 1647), pp. 14-15. Simpson was an Independent and Westminster divine.</span></figcaption>

<blockquote><p>An incident which took place at this time between Hamilton and [Donald] Cargill provides another example of Cargill’s spirit of Christian chairty and his desire to avoid division. The Rotterdam Church, though generally favorable to the exiles, decided to debar [David] Hackston from the communion, presumably because of his involvement in the death of the archbishop [James Sharp, on May 3, 1679]. Cargill was due to officiate at the communion service the following day, 22 October [1679], and Hamilton, on hearing of the church’s decision, immediately went to tell Cargill of it, apparently expecting that he would refuse to take part. ‘But’, says Hamilton, ‘he, with other friends, though resolving to resent it, yet could not determine on such a sudden to withdraw from the church, this being the first step of their ever appearing against us.’ The next day, Cargill gave the communion as planned… an unfortunate disagreement which broke out in the Rotterdam congregation and which split the loyalties of the exiles into two camps. The dispute centered around Robert Fleming, an old fellow-student of Cargill’s at St. Andrews, who was now minister of the Rotterdam Church. Fleming, previously minister of Cambuslang, had been deprived of his charge because of his refusal to conform to the new ecclesiastical order in Scotland, and he was settled in Rotterdam in December, 1677. On revisiting Scotland in 1679 he was arrested and imprisoned in the Edinburgh Tolbooth. Some time after Bothwell [1679], however, he was set at liberty and in October of the same year, shortly after the other exiles arrived, he returned to his charge in Holland. Fleming, a man of judgement and moderation, could not bring himself to condemn those ministers who complied with the Indulgence, though remaining firmly opposed to it himself, and he pleaded with his congregation that such ministers should not be debarred from fellowship. Several of the newly arrived exiles, Robert Hamilton in particular, were highly critical of Fleming’s attitude and refused to countenance his ministry. [Robert] M’Ward, though equally resolute against Fleming’s position, continued to hear him and, instead of condemning him outright, tried by friendly argument to persuade him to change his views. As a result, M’Ward too was ostracized by Hamilton and by some others who sided with him. The disagreement caused M’Ward much distress and mauy well have hastened his end.¹ ¹ In a letter to the church at home [in Scotland] in late 1679 or early 1680 M’Ward wrote, ‘I was so confounded with these cause-destroying excesses… if the principle whereby they defend their practice owned, it would not only infer the dissolution of the united visible church, but also of all Christian society.’… it is clear that the reference is to Hamilton, who himself admits, in a letter dated 15 August 1682, that his fellowship with M’Ward, which had previously been close, ended with the arrival of Fleming. Says Hamilton, ‘Mr M’Ward continued extraordinarily kind until Mr Fleming came over, and then we differing in judgment he became greatly against me, to the making of me so far as possible odious in the whole provinces’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill</cite>, (Durham: Evangelical Press, 1988), pp. 106-7</span></figcaption>

t+and+moderation%2C+could+not+bring+himself+to+condemn+those+ministers+who+complied+with+the+Indulgence%2C+though+remaining+firmly+opposed+to+it+himself%2C+and+he+pleaded+with+his+congregation+that+such+ministers+should+not+be+debarred+from+fellowship.+Several+of+the+newly+arrived+exiles%2C+Robert+Hamilton+in+particular%2C+were+highly+critical+of+Fleming%E2%80%99s+attitude+and+refused+to+countenance+his+ministry.+%5BRobert%5D+M%E2%80%99Ward%2C+though+equally+resolute+against+Fleming%E2%80%99s+position%2C+continued+to+hear+him+and%2C+instead+of+condemning+him+outright%2C+tried+by+friendly+argument+to+persuade+him+to+change+his+views.+As+a+result%2C+M%E2%80%99Ward+too+was+ostracized+by+Hamilton+and+by+some+others+who+sided+with+him.+The+disagreement+caused+M%E2%80%99Ward+much+distress+and+mauy+well+have+hastened+his+end.%C2%B9+%C2%B9+In+a+letter+to+the+church+at+home+%5Bin+Scotland%5D+in+late+1679+or+early+1680+M%E2%80%99Ward+wrote%2C+%E2%80%98I+was+so+confounded+with+these+cause-destroying+excesses%E2%80%A6+if+the+principle+whereby+they+defend+their+practice+owned%2C+it+would+not+only+infer+the+dissolution+of+the+united+visible+church%2C+but+also+of+all+Christian+society.%E2%80%99%E2%80%A6+it+is+clear+that+the+reference+is+to+Hamilton%2C+who+himself+admits%2C+in+a+letter+dated+15+August+1682%2C+that+his+fellowship+with+M%E2%80%99Ward%2C+which+had+previously+been+close%2C+ended+with+the+arrival+of+Fleming.+Says+Hamilton%2C+%E2%80%98Mr+M%E2%80%99Ward+continued+extraordinarily+kind+until+Mr+Fleming+came+over%2C+and+then+we+differing+in+judgment+he+became+greatly+against+me%2C+to+the+making+of+me+so+far+as+possible+odious+in+the+whole+provinces%E2%80%99%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Maurice+Grant%2C+No+King+but+Christ%3A+the+Story+of+Donald+Cargill%2C+%28Durham%3A+Evangelical+Press%2C+1988%29%2C+pp.+106-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F805b7c3578.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8

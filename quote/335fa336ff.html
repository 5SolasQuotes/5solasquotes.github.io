<main class="wrap"><figure class="quote" id="q-335fa336ff" data-kw="">
<blockquote><p>We must ‘make us a new heart and a new spirit.’ This was the matter of a promise, Eze. 11:19. Here it is the matter of a precept. We must do our endeavour, and then God will not be wanting to us to give us his grace. St. Augustine well explains this precept: Deus non jubet impossibilia, sed jubendo monet et facere quod possis et petere quod non possis. ‘God does not enjoin impossibilities, but by his commands admonishes us to do what is in our power and to pray for what is not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ezekiel</cite>, 18, verse 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>The intended scope of it [Ps. 24] may be considered literally and mystically: … 2. Mystically, according to the spiritual mystery and truth intended, it is; To set out the kingdom of Christ, generally over the whole world, but peculiarly over his Church and saints, described by their properties, and dignified with great privileges; and to incite all to open the gates of their hearts, with up-lifted joy, to entertain this King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Clavis Bibliorum, or ‘The Key of the Bible’</cite>, … (1648; London: J.R., 1675), on Ps. 24, p. 873</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-ee56563c5a" data-kw="">
<blockquote><p>Christ knocks at the door of thy heart, O sinner. Though invisible to mortal eyes, He is here, whether you regard it or not. He knocks. But how? By his Word—by a preached gospel—by the admonitions of conscience—and by the strivings of his Spirit. Nor is this all. He calls. “Unto you O men, I call, and my voice is unto the sons of men.” [Prov. 8] He calls by all the invitations of mercy contained in the Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton</cite>, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-7287d3d095" data-kw="">
<blockquote><p>…Under which two excuses [in the text] are comprehended all others of like sort, which flesh and blood does minister, for hindering to rise and open to Christ, and obey his calling, such as we see, Mt. 22, and are usually suggested by our corruption, as the quitting of our pleasure, or profit, our ease, credit, or companions, if we do so; and that we shall fall in disgust, hatred, and obloquy, and other like inconveniences: Neither is it a fit time as yet (but as Felix said to Paul, Acts 24:25) we may take a more convenient season for that, or the like purposes, etc. Such excuses do absenters of themselves from public exercises of divine worship, make, and profaners of the Lord’s Sabbath; such also do covetous extortioners, revengeful oppressors: unclean whoremongers, riotous, drunkards and the like, frame to themselves, and obtrude, and all for this end, to keep Christ out, though He frequently call and knock at their door to enter in. Observations: 1. We see hereby, that it is not an easy matter, but a very hard and difficult one to bring the soul and Christ together, into a near and constant fellowship… but take heed to his voice who calls and knocks, and, as the Father spake at Christ’s baptism from heaven, hear Him and obey. 2. We see, how strong is carnal corruption, and remnants of sin in the regenerate, to hold Christ at the door, and to sleight his voice, calling on the•… to open; and therefore, how much more stronger is the same in the unregenerate, and it is no marvel that they open not unto Him and disobey his voice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Love’s intercourse between the Lamb &amp; his Bride, Christ and his Church, or a clear explication and application of the Song of Solomon</cite>, (London: Wilson, 1657), on Song 5:3, p. 210</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-acf626ff03" data-kw="">
<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37] 4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking unto Jesus: a View of the Everlasting Gospel</cite>, … (d. 1664; Edinburgh: Ormiston, 1723), pp. 246–47</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7b64f84385" data-kw="">
<blockquote><p>Q. 1. Is there but one God to whom these properties do belong?

A. One only, in respect of his essence and being, but one in three distinct persons, of Father, Son, and Holy Ghost. Deut. vi. 4; Matt. xix. 17; Eph. iv. 5, 6. Gen. i. 26; 1 John v. 7; Matt. xxviii. 19.

Q. 2. What mean you by person?

A. A distinct manner of subsistence or being, distinguished from the other persons by its own properties. John v. 17; Heb. i. 3.

Q. 3. What is the distinguishing property of the person of the Father?

A. To be of himself only the fountain of the Godhead. John v. 26, 27; Eph. i. 3.

Q. 4. What is the property of the Son?

A. To be begotten of his Father from eternity. Ps. ii. 7; John i. 14, iii. 16.

Q. 5. What of the Holy Ghost?

A. To proceed from the Father and the Son. John xiv. 17, xvi. 14, xv. 26, xx. 22.

Q. 6. Are these three one?

A. One every way, in nature, will, and essential properties, distinguished only in their personal manner of subsistence. John x. 30; Rom. iii. 30. John xv. 26; 1 John v. 7.

Q. 7. Can we conceive these things as they are in themselves?

A. Neither we nor yet the angels of heaven are at all able to dive into these secrets, as they are internally in God; but in respect of the outward dispensation of themselves to us by creation, redemption, and sanctification, a knowledge may be attained of these things, saving and heavenly. 1 Tim. vi. 16. Isa. vi. 2, 3. Col. i. 11–14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Short Catechisms: Wherein the Principles of the Doctrine of Christ are Unfolded and Explained</cite>, (1645) in William H. Goold (ed.), The Works of John Owen, D.D. (24 vols, Edinburgh: T. &amp; T. Clark, 1850-53), 1: 472-73.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-738fce26aa" data-kw="">
<blockquote><p>The problem with EFS is not Arianism, but the fact that it entails tritheism. Advocates of EFS are… replacing terms like ‘unbegotten’ and ‘begotten’ with the ideas ‘authority’ and ‘submission’… EFS is more in the line of what might be called polytheistic homoiousianism, whereby the Father and the Son have distinct natures, but each is still eternally divine… Because Chalcedonian Christology insists that Jesus has two natures but only one hypostasis, dyothelitism [the orthodox doctrine that Christ has a divine will and a distinct human will] as a development of Chalcedonian Christology necessitates the recognition that a will must be a property of nature [and not the Person] in order for there to be two wills in Christ. To posit such terms as ‘obedience’ and ‘submission’ that imply a distinction of wills between the Father and the Son while affirming dyothelite Christology entails a distinction of natures between the Father and Son (and Spirit) resulting in tritheism… After this historical account, a word study of the term ‘submission’ will demonstrate that the term clearly implies an activity of the will yielding to another will and should therefore be rejected as an eternal property of a divine hypostasis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/butner-jr-d-glenn.html">D. Glenn Butner Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Eternal Functional Subordination and the Problem of the Divine Will’ 19</cite>, pp. in JETS 58/1 (2015) 131–49 The article is also here., p. 132-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-11c5b7239b" data-kw="Father God only begotten">
<blockquote><p>Secondly, It is proposed as the object of our faith, that the Father is God. … For the Father, as he whom we worship, is often called so only with reference unto his Son; as the Son is so with reference to the Father. He is the “only begotten of the Father,” John 1:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, II</span></figcaption>

</figure><figure class="quote" id="q-da3e96a980" data-kw="natural Son not adopted">
<blockquote><p>Christ is said to be “the own Son of the Father” not only inasmuch as it is opposed to one of another family … but inasmuch as it is opposed to an adopted and metaphorical son. Thus he may be called the natural son who is such by the privilege of his nature and not by the grace and benefit of adoption only.</p></blockquote>

</figure><figure class="quote" id="q-c36511e0ac" data-kw="Father unbegotten">
<blockquote><p>However, the Holy Spirit speaking in the Scriptures does not merely propose one God to us but also teaches us the way to approach God. Therefore, God is revealed to us in three persons, namely the Father, the Son, and the Holy Spirit, so that we may know the path by which God is accessible. For if you consider God absolutely as Lord and Judge, that terrifying majesty presents itself to the mind, whose brilliance dazzles the eye, and the most righteous tribunal whose aspect strikes the conscience of men with sheer terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VII</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36d770f0fc" data-kw="Succession of Peter">
<blockquote><p>No one succeeded the apostles in personal apostolic preeminence (hyperochē). Therefore neither did anyone succeed Peter. For the same principle ought to apply to all. Nor ought the privilege of Peter as to ecclesiastical monarchy to be opposed, because this is the capital falsehood (prōton pseudos), which has been refuted before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.4</span></figcaption>

</figure><figure class="quote" id="q-de8f816fdc" data-kw="">
<blockquote><p>This system also conflicts with Scripture, which recognizes no such primacy of Peter as that on which the system is built, and distinctly recognizes the voice of the people in ecclesiastical affairs. Moreover, the claim of the Roman Catholic Church, that there has been an unbroken line of succession from the time of Peter down to the present day, is contradicted by history. The papal system is, both exegetically and historically, untenable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, pt. 5, “The Government of the Church”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/primacy-of-peter.html">Primacy of Peter</a></span></div>

</figure><figure class="quote" id="q-c73ac8b118" data-kw="">
<blockquote><p>At an earlier moment during the [Hague] Conference [1611], the attending Counter-Remonstrants—Ruard Acronius (d. 1611), Joannes Bogardus (d. 1614), Petrus Plancius (1552–1622), Joannes Becius (1558– 1626), Libertus Fraxinus (c.1547–c.1621), and Festus Hommius (1576– 1642)—had noted that the word “irresistible” was ambiguous and that even Jesuits were able to accommodate it within their theory of grace and human free choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Defending Grace: References to Dominicans, Jesuits &amp; Jansenists in Seventeenth-Century Dutch Reformed Theology” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“At an earlier moment during the [Hague] Conference [1611], the attending Counter-Remonstrants—Ruard Acronius (d. 1611), Joannes Bogardus (d. 1614), Petrus Plancius (1552–1622), Joannes Becius (1558– 1626), Libertus Fraxinus (c.1547–c.1621), and Festus Hommius (1576– 1642)—had noted that the word “irresistible” was ambiguous and that even Jesuits were able to accommodate it within their theory of grace and human free choice.”

— Irresistible Grace, Aza Goudriaan, “Defending Grace: References to Dominicans, Jesuits &amp; Jansenists in Seventeenth-Century Dutch Reformed Theology” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 284">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAt+an+earlier+moment+during+the+%5BHague%5D+Conference+%5B1611%5D%2C+the+attending+Counter-Remonstrants%E2%80%94Ruard+Acronius+%28d.+1611%29%2C+Joannes+Bogardus+%28d.+1614%29%2C+Petrus+Plancius+%281552%E2%80%931622%29%2C+Joannes+Becius+%281558%E2%80%93+1626%29%2C+Libertus+Fraxinus+%28c.1547%E2%80%93c.1621%29%2C+and+Festus+Hommius+%281576%E2%80%93+1642%29%E2%80%94had+noted+that+the+word+%E2%80%9Cirresistible%E2%80%9D+was+ambiguous+and+that+even+Jesuits+were+able+to+accommodate+it+within+their+theory+of+grace+and+human+free+choice.%E2%80%9D%0A%0A%E2%80%94+Irresistible+Grace%2C+Aza+Goudriaan%2C+%E2%80%9CDefending+Grace%3A+References+to+Dominicans%2C+Jesuits+%26+Jansenists+in+Seventeenth-Century+Dutch+Reformed+Theology%E2%80%9D+in+eds.+Ballor%2C+Gaetano+%26+Sytsma%2C+Beyond+Dordt+%26+De+Auxiliis%3A+the+Dynamics+of+Protestant+%26+Catholic+Soteriology+in+the+Sixteenth+%26+Seventeenth+Centuries+%28Brill%2C+2019%29%2C+p.+284&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc73ac8b118.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c73ac8b118.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-jesuits/#:~:text=At%20an%20earlier%20moment%20during%20the,of%20grace%20and%20human%20free%20choice&amp;text=At%20an%20earlier%20moment%20during%20the%20%5BHague%5D%20Conference&amp;text=their%20theory%20of%20grace%20and%20human%20free%20choice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-23153d0d1f" data-kw="">
<blockquote><p>It is well known to those that have been conversant in the writings of the Fathers, and confessed by [Robert] Bellarmine himself [a Roman apologist] (De Rom. Pont., bk. 3, ch. 5) that the Primitive Church was taught to look for Antichrist upon the dissolution of the Roman Empire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-garrett.html">Walter Garrett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Pt. 1, Ch. 1, ‘Of the Time of Antichrist’s Coming according to the Doctrine of the Primitive Church. The same confirmed from the Angel’s Interpretation of the Vision [of the Great Whore], Rev. 17′ in A Discourse Concerning Antichrist, Grounded upon the Angel’s Interpretation of the Vision, Rev. 17:3 and from thence proceeding to a particular Explication of the 12th and 13th chapters. Showing that the Church of Rome is that woman mentioned, Rev. 17:3, and the bishops of Rome [are] that Eighth King spoken of, v. 11, who is usually known by the name of Antichrist (London, 1680), p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

<main class="wrap"><figure class="quote" id="q-6b17e7140a" data-kw="">
<blockquote><p>Furthermore, we must note that which Luke saith, that many were turned unto God by faith, because he doth very well express the force and nature of faith; that it is not idle and cold, but such as restoreth men (who were before turned away from God) unto his government, and bindeth them unto his righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, Acts 11:21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/faith-and-works.html">Faith and Works</a> › <a href="../topics/faith/faith-and-works/faith-and-obedience.html">Faith and obedience</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3397fd41f0" data-kw="">
<blockquote><p>I wish the reader to understand that as often as we mention Faith alone in this question, we are not thinking of a dead faith, which worketh not by love, but holding faith to be the only cause of justification. (Galatians 5:6; Romans 3:22.) It is therefore faith alone which justifies, and yet the faith which justifies is not alone: just as it is the heat alone of the sun which warms the earth, and yet in the sun it is not alone, because it is constantly conjoined with light. Wherefore we do not separate the whole grace of regeneration from faith, but claim the power and faculty of justifying entirely for faith, as we ought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, Canon 11, p. 120</span></figcaption>

<blockquote><p>He shews for what purpose the faithful were to strive, that is, that they might have faith adorned with good morals, wisdom, patience, and love. Then he intimates that faith ought not to be naked or empty, but that these are its inseparable companions.</p></blockquote>

</figure><figure class="quote" id="q-e9bc94792c" data-kw="">

</figure><figure class="quote" id="q-9bc1280e57" data-kw="">
<blockquote><p>For if the doctrine of Paul is true, that &quot;Christ dwells in our hearts by faith,&quot; (Ephesians 3:17) they can no more separate faith from charity than Christ from his Spirit. If &quot;our hearts are purified by faith,&quot; as Peter affirms, (Acts 15:9,) if &quot;whosoever believeth hath eternal life,&quot; as our Savior so often declares, (John 3:16; 5:24; 6:40; 20:31,) if the inheritance of eternal life is obtained by faith, (Romans 5:14,) faith is something very different from all forms of dead persuasion.</p></blockquote>

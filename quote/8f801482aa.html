<main class="wrap"><figure class="quote" id="q-8f801482aa" data-kw="">
<blockquote><p>Is it not the same Christians whom you then derided, and now revile at, and condemn as Children of the devil: O miserable man! Is all your hearing and praying come to this? Dare you meet the Messengers of Christ in the face, and tell them they are Liars and deceivers?

Dare you cast out the holy worship of Christ as false worship, and seek to draw people into the contempt of it? Dare you damn those Churches and millions of Saints that Christ hath bought with his precious blood? Dare you seek to draw men to hate their Teachers whom Christ hath set over them, and to hate his people as if they were the Children of the Devil, and to hate his worship and holy ways?

Alas that ever a man in his wits should look upon such abominations as amiable, and much more that any man should be so mad as to do this under the Name and profession of a Christian! That you can imagine that the furious opposition to the whole Army of Christ, his Officers, Church and Ordinances, can yet be a work that Christ accepteth: That you should no better know Christ’s work from Satan’s, nor know that it is the Dragon whose warfare these men do manage?

I must needs profess that it is a very grievous thing in mine eyes, that after all our pains with men’s souls, and after the rejoicings which we had in their seeming conversion, and zealous lives, we should yet see so much ignorance, levity, and giddiness of professors, as that they are ready to entertain the most horrid abominations!

That the devil can no sooner bait his hook, but they greedily catch at it, and swallow it without chewing; yea, nothing seems too gross for them, but so it seems Novelty all goes down. I am afraid if they go a little further, they will believe him that shall say, The Devil is God, and to be worshipped and obeyed. Shall I freely tell you whence all this comes? Even from hellish pride of heart: You see it not (it’s like) in your self or in them, but I shall endeavour to make you see it both in your selves and them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74159f9800" data-kw="">
<blockquote><p>And for my part this I say, and I say it with much integrity, I never yet took up religion by parties, in the lump; I have found by trial of things, that there is some truth on all sides. I have found holiness where you would little think it, and so likewise truth; and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion. My brethren, this rule that I have now mentioned (which I profess I have lived by, and shall do while I live), I know I shall never please men in it. Why? it is plain, For this is the nature and condition of all mankind; if a man dissents from others in one thing, he loses them in all the rest; and therefore if a man do take what is good of all sides, he is apt to lose them all, but he pleases Christ by it, and so will I for this particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, p. 559</span></figcaption>

</figure><figure class="quote" id="q-97886eee8b" data-kw="">
<blockquote><p>The first prejudice then is, That those who dissent and separate from us are the strictest party. In answer to this… As for strictness of opinions, as to government and church communion, if we measure strictness according to the dictates of men’s own spirits, we will yield to them for strictness; and so would our Lord to the Pharisees, and the apostles to the false teachers. But if we measure strictness according to the Word of God, we deny they are strictest, but they are indeed widest from the rule. I will follow Christ to the synagogue of the Jews (I hope some of you at least may understand what I say [who had corruptions in their worship and government]) and in so doing I will be more strict than those that scruple to follow Christ’s example, for fear they be involved in the guilt of the corruptions among them; for the nearer I follow Christ, the more strict I am, if strictness be measured according to the Word of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Evil, Nature &amp; Danger of Schism: a Sermon’</cite>, (1708)</span></figcaption>

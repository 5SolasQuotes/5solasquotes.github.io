<main class="wrap"><figure class="quote" id="q-e67d284668" data-kw="">
<blockquote><p>[According to Hickman’s opponent, Mary] had not set one step forward toward the consummation of her marriage so much as in thought, and possibly had set herself back from it by a vow of chastity and holy celibate… and of the burden [pregnancy] which she bare not hindering her… That she had no pain in the production, for to her alone did not the punishment of Eve extend, that in sorrow she should bring forth… so He came also into the world without doing violence to the virginal and pure body of his mother. He [the opponent] contents not himself to assert the perpetual virginity of Mary, which is not denied by any Protestant, but [he] will abuse Scripture to prove it; viz. that of Eze. 44:2…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Laudensium Apostasia: or A Dialogue in which is shown that some divines risen up in our church since the greatness of the late archbishop</cite>, [Laud, d. 1645], are in sundry points of great moment, quite fallen off from the doctrine received in the Church of England (London, 1660), Preface. Hickman was a reformed puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-eab23cb342" data-kw="">
<blockquote><p>According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955), 22:23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>Matth. 26. 39. And he went a little further, and fell on his face, and prayed, saying, O my Father, if it be possible, let this Cup pass from me; Nevertheless, not as I will, but as thou wilt.

THE Words are our Saviour’s Prayer at his private Passion in the Garden. In Paradise was the first Scene of Man‘s Sin, and in a Garden the first Scene of Christ’s Sorrows.

He was now in the near view of his extreme Sufferings; the fatal hour approached when he was to die with all the concurrent circumstances of Shame and Cruelty. His Nature was Human and Holy, and therefore apprehensive of Misery and the Wrath of God. In this Exigency He fell on his Face, a posture of humble Reverence, and with earnestness prayed, saying, O my Father, an expression of his steadfast Trust in the Love of God: If it be possible, not with respect to his Absolute Power, for by that he could easily have preserved him; but with respect to his Sovereign Pleasure, and Eternal Decree: Let this Cup pass from me, that implies a complete Deliverance from the rage of the Powers of Darkness, and of the perverted World in conjunction with them. He suffered innocent Nature to act as Nature, for he submitted to our Infirmities, but without our Imperfections.

Nevertheless not as I will, but as thou wilt: His Petition was qualified with an Act of Submission; the desire of his Nature, that recoiled from such Sufferings, was overruled by the resignation of Grace. There was no repugnancy, but a subordination between the Sensitive Will and the rational Will, directed by his Mind, that foresaw the blessed effects of his Sufferings, the Glory of God, with the Salvation of lost Mankind. And that just horror, with the strong aversion of his Nature from such a terrible Death, renders his willingness more conspicuous and meritorious. As Man, the apprehension of it put him into an Agony; but as Mediator, by a firm resolution and clear choice he submitted to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great duty of resignation to the divine will in afflictions, enforced from the example of our suffering Saviour</cite>, (London: Brabazon Aylmer, 1684), pp 1-4.</span></figcaption>

<blockquote><p>That God did spiritually and mystically represent unto Moses the incarnation and mediation of Christ, with the church of the elect which was to be gathered thereby, and its spiritual worship. And moreover, he let him know how the tabernacle and all that belonged thereunto, did represent him and them. For the tabernacle that Moses made was a sign and figure of the body of Christ. This we have proved in the exposition of the second verse of this chapter; and it is positively affirmed by the apostle, Col. 2:17. For therein would God dwell really and substantially: Col. 2:9, “In him dwelleth all the fulness of the Godhead bodily.” And the tabernacle was but to represent this inhabitation of God in Christ. Therefore did he dwell therein typically by sundry pledges of his presence, that he might represent the real substantial inhabitation of the Godhead in the body or human nature of Christ. This, therefore, was the ἀρχέτυπος, whereunto the tabernacle was to be framed; and this was that which was showed unto Moses on the top of the mount. These were the “heavenly things,” which they served unto the resemblance and shadow of. It is therefore most probable, and most agreeable unto the mystery of the wisdom of God in these things, that, before the building of the tabernacle below, God did show unto Moses what was to be signified and represented thereby, and what he would introduce when that was to be taken away. He first showed “the true tabernacle,” then appointed a figure of it, which was to abide and serve the worship of the church, until that true one was to be introduced, when this was to be taken down and removed out of the way: which is the substance of what the apostle designeth to prove.</p></blockquote>

<blockquote><p>So profound a repugnance to death and all that death meant,manifesting itself during his life, could not fail to seize upon him with peculiar intensity at the end. If the distant prospect of his sufferings was a perpetual Gethsemane to Him, the immediate imminence of them in the actual Gethsemane could not fail to bring with it that “awful and dreadful torture” which Calvin does not scruple to call the “exordium” of the pains of hell themselves. Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk. xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance. ² [Greek] ademoneo: see Heine, Synonymik etc., 1898, p. 148: “pavesco, angor.” Cf. Lightfoot, on Phil. ii. 26: ” The primary idea of the word will be loathing and discontent.” “It describes the confused, restless, half-distracted state, which is produced by physical discouragement, or by mental distress, or grief, shame, disappointment, etc.” Lagrange on Mk. xviii. 33: “seized with despondency”. Thomas Goodwin (Works, v. 276): “so that we see Christ’s soul was sick and fainted,” “his heart failed him.</p></blockquote>

<blockquote><p>This designation [God’s anointed] also connotes his being thoroughly fitted and furnished for his work, by an unmeasurable effusion of the Holy Ghost. “Grace was poured into his lips.” There is a twofold grace given unto Christ as Mediator, namely, (1.) The grace of personal union, when the human nature, consisting of a true body and a reasonable soul, is taken into the person of the eternal Son of God, which is the great mystery of godliness. (2.) There was a created habitual fulness of grace bestowed on him for the discharging of his mediatorial work, and for the use of his mystical body: he “received gifts for men, that out of his fulness, we might receive grace for grace.” Thus you see what is imported in Christ’s anointing.</p></blockquote>

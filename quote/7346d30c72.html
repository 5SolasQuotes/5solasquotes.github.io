<main class="wrap"><figure class="quote" id="q-7346d30c72" data-kw="">
<blockquote><p>longanimitas: longsuffering; the patient bearing of an offense, particularly over a long period of time; thus, the willingness of God to endure the offense of sin rather than immediately annihilate the world in its wickedness. The longanimitas Dei is the affection of the divine will according to which God wills to await repentance and to allow millennia to elapse, for the sake of mankind, between the fall and the final judgment. Longanimitas is virtually synonymous with patientia, indicating the height of patience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker, 1985), p. 180</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-22b2ca9b6f" data-kw="">
<blockquote><p>In an extensive sense, God is a Father, and is so revealed in his works as well as his Word. The paternal relation among men aids us in contemplating the loving relation in which God stands to his creatures: it is a shadow and representation of the Divine Fatherhood. Fatherly dispositions and dealings are ascribed to Him. By creation, He is the Father of intelligent beings. Angels are those “sons of God” that shouted for joy when “the morning stars,” at the dawn of creation, “sang together.” (Job 38:7) Men are “his offspring,” and He is “the Father of the spirits of all flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works Doctrinal and Practical of Thomas Houston</cite>, (1876), vol. 1, The Adoption of Sons, ch. 3, The Fatherhood of God, p. 128</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-064d9b4208" data-kw="">
<blockquote><p>Mercy and truth are necessarily found in all God’s works, if mercy be taken to mean the removal of any kind of defect. Not every defect, however, can properly be called a misery; but only defect in a rational nature whose lot is to be happy; for misery is opposed to happiness. … Now the work of divine justice always presupposes the work of mercy; and is founded thereupon. For nothing is due to creatures, except for something pre-existing in them, or foreknown. Again, if this is due to a creature, it must be due on account of something that precedes. And since we cannot go on to infinity, we must come to something that depends only on the goodness of the divine will—which is the ultimate end… In all that follows, the power of mercy remains, and works indeed with even greater force; as the influence of the first cause is more intense than that of second causes. For this reason does God out of abundance of His goodness bestow upon creatures what is due to them more bountifully than is proportionate to their deserts: since less would suffice for preserving the order of justice than what the divine goodness confers; because between creatures and God’s goodness there can be no proportion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 21 | art. 4, Whether in every work of God there are mercy and justice, I answer that</span></figcaption>

<main class="wrap"><figure class="quote" id="q-78d7aaf6e7" data-kw="">
<blockquote><p>Whether the human nature holds analogically the principle of a part with respect to the whole Christ, or more so as an adjunct? The latter is affirmed.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f4b7ef13b" data-kw="">
<blockquote><p>We therefore reject the deifications of the Enthusiasts, the spirit and eternal uncreated Word, etc. For by these they subvert the nature of God and of man, and the operations of both. Which abominations, arising from the confusion of God with His work, of substance with accident, of the Holy Spirit with the Word, of man sanctified by God with the Sanctifier Himself and His divine holiness, we detect elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>
<div class="actions"><button class="copy" data-copy="“We therefore reject the deifications of the Enthusiasts, the spirit and eternal uncreated Word, etc. For by these they subvert the nature of God and of man, and the operations of both. Which abominations, arising from the confusion of God with His work, of substance with accident, of the Holy Spirit with the Word, of man sanctified by God with the Sanctifier Himself and His divine holiness, we detect elsewhere.”

</figure><figure class="quote" id="q-f49064ca16" data-kw="">
<blockquote><p>Assumption is properly an action by which the human nature is drawn into the subsistence of the Son, so that it may subsist by his subsistence. Hence this action not only produces in the human nature of Christ a relation of dependence on the Word, but communicates to it the personality of the Word.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-1d98fcfabd" data-kw="">
<blockquote><p>In ourselves we are unworthy. All kindness towards us is of the nature of grace. Christ is the beloved for his own sake; and it is to us only as in him and for his sake that the grace of God is manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, on 1:6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In ourselves we are unworthy. All kindness towards us is of the nature of grace. Christ is the beloved for his own sake; and it is to us only as in him and for his sake that the grace of God is manifested.”

— Charles Hodge, A Commentary on the Epistle to the Ephesians, on 1:6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+ourselves+we+are+unworthy.+All+kindness+towards+us+is+of+the+nature+of+grace.+Christ+is+the+beloved+for+his+own+sake%3B+and+it+is+to+us+only+as+in+him+and+for+his+sake+that+the+grace+of+God+is+manifested.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+A+Commentary+on+the+Epistle+to+the+Ephesians%2C+on+1%3A6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d98fcfabd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d98fcfabd.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-8ffaeccd41" data-kw="">
<blockquote><p>1st. The highest and closest union is between those things that are actuated by one spirit dwelling and moving in them… 2dly. Things at the greatest distance, and between which there is no physical continuity, may be acted by the same spirit, providing he be immense and infinite… 3dly. ‘Tis Christ as mediator that believers are united to… 4. The Holy Ghost did in a singular manner operate upon and reside in the human nature of Christ… 5thly. The Holy Ghost is the immediate renewer and sanctifier of the elect… 6thly. ‘Tis from, by, and through Jesus Christ as mediator that the Spirit, whether it be with respect to his Immediate seisure of us and dwelling in us, or with reference to any of his saving operations, is given to and bestowed upon us… 7ly. Through the communication of the Spirit from Christ to us, and immediately upon his taking the possession of us, the nature of Christ, the seed of God, and a vital living principle comes to be formed in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-ferguson.html">Robert Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 3, ‘Of the Union of Believers with Christ’ Outline in The Interest of Reason in Religion… &amp; the Nature of the Union Betwixt Christ &amp; Believers; (with Reflections on Several Late Writings, especially Mr. Sherlock’s Discourse…)… (London, 1675), pp. 421-665, pp. 656-661:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

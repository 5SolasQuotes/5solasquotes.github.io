<main class="wrap"><figure class="quote" id="q-2a0e5d748a" data-kw="">
<blockquote><p>Our brethren of Scotland writing against the tyranny of Prelates, when they were under it, in that book entitled, English and Popish Ceremonies [by Gillespie], have this passage: ‘If the error of conscience be about things unnecessary, then it is tutior pars, ‘the surest and safest way’ not to urge men to do that which in their consciences they condemn.’ And the ministers of the protestant Churches in France, giving their judgments, De pace inter Evangelicos procuranda, How Peace amongst the Protestants in Germany may be had, set forth by [John] Duraeus, say thus: ‘Let all matters controversal be brought into such a certain model as may give satisfaction to both parties; and that if it be possible, framed out of the very words of Scripture: and let no man require anything else of his brother.’ [Jerome] Zanchi, on the 4th Commandment, has this notable speech, ‘That which I say,’ says he: ‘is diligently to be observed, that those who would stir up princes to have all people, kingdoms, commonwealths which (not overthrowing the fundamentals of religion), differ from them in anything, condemned of heresy, excluded from friendship, driven out of their territories: these are no friends,’ says he, ‘either to their princes or to the Church of Christ.’ Many think they do great service to Christ, the Church and State, if they can stir up magistrates to suppress whatsoever they conceive are errors; it may be their hearts are upright in the main, they aim at peace, but certainly they cause much disturbance in Church and State. Bishop [John] Davenant in a little book entitled his, Exhortation to Brotherly Love amongst Churches, the ninth chapter, has this title: ‘That brotherly communion between Churches evangelical is not to be cut asunder because of diverse opinions about questions controversial.’ And in the beginning of the 10th chapter: ‘This is to be premised: The bonds of the brotherly communion of Christian Churches ought not to be dissolved upon every difference of opinions, but only for the denying or opposing fundamentals.’ Here see the moderation of a prelate. Thus Cyprian of old delivered his opinion and practised it accordingly, differing from many of his brethren, but withal professes: That he meant not to prescribe or give laws to any, that he would not contend with any of his colleagues so as to break divine concord and the peace of our Lord; that he was far from judging or censuring any of his brethren or cutting off from his communion any that were of a different mind; and that in such case none ought to constrain his colleague by tyrannical violence (therein glancing at the violent proceeding of Stephen to whom he wrote) to a necessity of believing or following what he thinks meet. (Epistle 72, to Stephen; Epistle 73, to Jubajanum) This modesty and charity of Cyprian is very often and very deservedly commended by St. Augustine (Contra Donatists, bk. 1, ch. 18; bk. •, chs. 1-2), says Dr. Potter, an episcopal man.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d56418230e" data-kw="">
<blockquote><p>But you will say: ‘England is not a true Church, and therefore you separate; adhere to the true Church.’ I answer: Our Church is easily proved to be a true Church of Christ: First, because it has all the essentials necessary to the constitution of a true Church: as sound preaching of the gospel, right dispensation of the sacraments, prayer religiously performed, and evil persons justly punished (though not in that measure as some criminals and malefactors deserve); and therefore a true Church. … But I hear you reply: ‘Our Church is corrupted with ceremonies and pestered with profane persons. What then?’ Must we therefore separate for ceremonies, which many think may be lawfully used? But admit they be evils, must we make a rent in the Church for ceremonious rites, for circumstantial evils? That were a remedy worse than the disease. Besides, had not all the true Churches of Christ their blemishes and deformities, as you may see in the seven Asian Churches (Rev. 2–3)? And though you may find some Churches beyond sea free from ceremonies, yet notwithstanding they are more corrupt in preachers (which is the main), as in profanation of the Lord’s Day, etc.</p></blockquote>

</figure><figure class="quote" id="q-31d09e463d" data-kw="">
<blockquote><p>Now why should we once name or make mention of that third kind of traditions, which do either shake the foundations of the salvation by Christ, either overthrow the things that are built upon that foundation. Such as are the supremacy of the bishop of Rome, the praying to saints, prayer for the dead, the making and the worshipping of idols, the magistral and doctoral determinations (as they call them) of free will, of merit, of pardons and of such other filthiness, the which things seeing they could never be established so long as the authority of the heavenly doctrine stood unshaken in his full force, so are they over impudent which do think that these things may be established either by the false forged title of the Church or by the prescription and length of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the most renowned Prince Louis [I] of Bourbon [d. 1569], Prince of Conde [in France]… in A Confession of Faith made by Common Consent of diverse Reformed Churches beyond the Seas: with an Exhortation to the Reformation of the Church. Perused &amp; allowed according to the Queen’s Majesty’s injunctions (London: Wykes, 1568)</cite></span></figcaption>

<blockquote><p>Who are they that divide in judgement from all the Reformed Churches of Christ in the world, that have opinions and judgements differing from the opinions and judgements of all the Reformed Churches? we or the Anabaptists? we or the Separatists? we or the—? Possibly they will all say they are of the same opinion with the Reformed Churches in fundamentals as well as we, and their differences are but in minutioribus. Now supposing this to be true (as it may be in some of them), why then do they transgress the apostles’ rule? Why do they not, if that it be in matters of lesser moment wherein they differ from us, why do not they keep their opinions private, and have their faith unto themselves before God [Rom. 14:22]? Why do they upon so small differences (if the differences be so small) withdraw from communion with us and the rest of the Churches, and gather themselves into distinct and separate Churches; some of them not holding one body with us, others neither holding one body nor one baptism with us? Their agreeing with us and the Reformed Churches, in doctrines that are fundamental; their holding one Head and one faith, does not excuse them from being guilty of breach of unity and down-right schism, as long as they hold not one body, one baptism. Schisma (says Augustine) est eadem opinantem et eodem ritu utentem solo Congregationis delectari dissidio. ‘Schisme is, when a man that professes the same faith and worship, is delighted only with the difference of an assembly or congregation. And again, Schismaticos facit non diversa fides sed communion is disrupta societas: ‘It is not a differing faith, but breaking the fellowship of communion that makes men schismatics.’ And again, Schisma est, Recens Congregationis ex aliqua sententiarum diversitate dissensio: ‘Schism is a new or late dissension or disagreement of a congregation, arising from some diversity of opinion.’ It is Beza’s observation that the Corinthians did agree in the fundamentals of religion, and yet they had schisms among them, from whence he takes occasion to say,That [Greek], sive [Greek], est cum alij alijs hominibus sive externis ritibus it a sunt addicti, ut quamvis alioquin in ipsis religionis capitibus consentiant, tamen animis sint ab alienati et factiones quasdam ineant: ‘Schism or division’ (says he) ‘is this, when men are so addicted to some men, or to some outward rites, that though they do agree in the chief points of religion, yet they are estranged in their minds, and engage themselves into parties and factions’: Now who are they that though they professe to agree with us in doctrine, have yet made a secession, withdrawn themselves, gathered Churches, engaged parties? Consider and give sentence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of such as would Walk Worthy of the Gospel (London: 1646), pp. 41-42 Newcomen (c. 1610–1669) was a Westminter divine. He appears to have been presbyterian and then became a congregationalist, before being ejected in the Great Ejection (1662).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Who are they that divide in judgement from all the Reformed Churches of Christ in the world, that have opinions and judgements differing from the opinions and judgements of all the Reformed Churches? we or the Anabaptists? we or the Separatists? we or the—? Possibly they will all say they are of the same opinion with the Reformed Churches in fundamentals as well as we, and their differences are but in minutioribus. Now supposing this to be true (as it may be in some of them), why then do they transgress the apostles’ rule? Why do they not, if that it be in matters of lesser moment wherein they differ from us, why do not they keep their opinions private, and have their faith unto themselves before God [Rom. 14:22]? Why do they upon so small differences (if the differences be so small) withdraw from communion with us and the rest of the Churches, and gather themselves into distinct and separate Churches; some of them not holding one body with us, others neither holding one body nor one baptism with us? Their agreeing with us and the Reformed Churches, in doctrines that are fundamental; their holding one Head and one faith, does not excuse them from being guilty of breach of unity and down-right schism, as long as they hold not one body, one baptism. Schisma (says Augustine) est eadem opinantem et eodem ritu utentem solo Congregationis delectari dissidio. ‘Schisme is, when a man that professes the same faith and worship, is delighted only with the difference of an assembly or congregation. And again, Schismaticos facit non diversa fides sed communion is disrupta societas: ‘It is not a differing faith, but breaking the fellowship of communion that makes men schismatics.’ And again, Schisma est, Recens Congregationis ex aliqua sententiarum diversitate dissensio: ‘Schism is a new or late dissension or disagreement of a congregation, arising from some diversity of opinion.’ It is Beza’s observation that the Corinthians did agree in the fundamentals of religion, and yet they had schisms among them, from whence he takes occasion to say,That [Greek], sive [Greek], est cum alij alijs hominibus sive externis ritibus it a sunt addicti, ut quamvis alioquin in ipsis religionis capitibus consentiant, tamen animis sint ab alienati et factiones quasdam ineant: ‘Schism or division’ (says he) ‘is this, when men are so addicted to some men, or to some outward rites, that though they do agree in the chief points of religion, yet they are estranged in their minds, and engage themselves into parties and factions’: Now who are they that though they professe to agree with us in doctrine, have yet made a secession, withdrawn themselves, gathered Churches, engaged parties? Consider and give sentence.”

— Matthew Newcomen, The Duty of such as would Walk Worthy of the Gospel (London: 1646), pp. 41-42 Newcomen (c. 1610–1669) was a Westminter divine. He appears to have been presbyterian and then became a congregationalist, before being ejected in the Great Ejection (1662).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWho+are+they+that+divide+in+judgement+from+all+the+Reformed+Churches+of+Christ+in+the+world%2C+that+have+opinions+and+judgements+differing+from+the+opinions+and+judgements+of+all+the+Reformed+Churches%3F+we+or+the+Anabaptists%3F+we+or+the+Separatists%3F+we+or+the%E2%80%94%3F+Possibly+they+will+all+say+they+are+of+the+same+opinion+with+the+Reformed+Churches+in+fundamentals+as+well+as+we%2C+and+their+differences+are+but+in+minutioribus.+Now+supposing+this+to+be+true+%28as+it+may+be+in+some+of+them%29%2C+why+then+do+they+transgress+the+apostles%E2%80%99+rule%3F+Why+do+they+not%2C+if+that+it+be+in+matters+of+lesser+moment+wherein+they+differ+from+us%2C+why+do+not+they+keep+their+opinions+private%2C+and+have+their+faith+unto+themselves+before+God+%5BRom.+14%3A22%5D%3F+Why+do+they+upon+so+small+differences+%28if+the+differences+be+so+small%29+withdraw+from+communion+with+us+and+the+rest+of+the+Churches%2C+and+gather+themselves+into+distinct+and+separate+Churches%3B+some+of+them+not+holding+one+body+with+us%2C+others+neither+holding+one+body+nor+one+baptism+with+us%3F+Their+agreeing+with+us+and+the+Reformed+Churches%2C+in+doctrines+that+are+fundamental%3B+their+holding+one+Head+and+one+faith%2C+does+not+excuse+them+from+being+guilty+of+breach+of+unity+and+down-right+schism%2C+as+long+as+they+hold+not+one+body%2C+one+baptism.+Schisma+%28says+Augustine%29+est+eadem+opinantem+et+eodem+ritu+utentem+solo+Congregationis+delectari+dissidio.+%E2%80%98Schisme+is%2C+when+a+man+that+professes+the+same+faith+and+worship%2C+is+delighted+only+with+the+difference+of+an+assembly+or+congregation.+And+again%2C+Schismaticos+facit+non+diversa+fides+sed+communion+is+disrupta+societas%3A+%E2%80%98It+is+not+a+differing+faith%2C+but+breaking+the+fellowship+of+communion+that+makes+men+schismatics.%E2%80%99+And+again%2C+Schisma+est%2C+Recens+Congregationis+ex+aliqua+sententiarum+diversitate+dissensio%3A+%E2%80%98Schism+is+a+new+or+late+dissension+or+disagreement+of+a+congregation%2C+arising+from+some+diversity+of+opinion.%E2%80%99+It+is+Beza%E2%80%99s+observation+that+the+Corinthians+did+agree+in+the+fundamentals+of+religion%2C+and+yet+they+had+schisms+among+them%2C+from+whence+he+takes+occasion+to+say%2CThat+%5BGreek%5D%2C+sive+%5BGreek%5D%2C+est+cum+alij+alijs+hominibus+sive+externis+ritibus+it+a+sunt+addicti%2C+ut+quamvis+alioquin+in+ipsis+religionis+capitibus+consentiant%2C+tamen+animis+sint+ab+alienati+et+factiones+quasdam+ineant%3A+%E2%80%98Schism+or+division%E2%80%99+%28says+he%29+%E2%80%98is+this%2C+when+men+are+so+addicted+to+some+men%2C+or+to+some+outward+rites%2C+that+though+they+do+agree+in+the+chief+points+of+religion%2C+yet+they+are+estranged+in+their+minds%2C+and+engage+themselves+into+parties+and+factions%E2%80%99%3A+Now+who+are+they+that+though+they+professe+to+agree+with+us+in+doctrine%2C+have+yet+made+a+secession%2C+withdrawn+themselves%2C+gathered+Churches%2C+engaged+parties%3F+Consider+and+give+sentence.%E2%80%9D%0A%0A%E2%80%94+Matthew+Newcomen%2C+The+Duty+of+such+as+would+Walk+Worthy+of+the+Gospel+%28London%3A+1646%29%2C+pp.+41-42+Newcomen+%28c.+1610%E2%80%931669%29+was+a+Westminter+divine.+He+appears+to+have+been+presbyterian+and+then+became+a+congregationalist%2C+before+being+ejected+in+the+Great+Ejection+%281662%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8d085700d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8d085700d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Who%20are%20they%20that%20divide%20in,engaged%20parties%3F%20Cons <blockquote><p>…Mr. Calamy in his Fast Sermon, Sept. 24, 1645, did call upon his people to be ashamed and confounded… ‘That while the parliament is sitting and laboring to settle things, and while the [Westminster] Assembly of ministers are studying to settle religion and laboring to heal our breaches, [churches] should be separating from us.’… He [Calamy] never thought, much less preached, that we should join with a defiled Church in her defilements. It is one thing to join with a Church in her corruptions, another thing to separate from a true Church because of some defilements that may be in it. And this is that for which we think people ought to be ashamed and confounded; Because for some few (and those but supposed) defilements, they separate not only from defilements, but from the true Churches of Jesus Christ and engage themselves into separated congregations and do not wait and tarry to see what reformation the Parliament will make. And this is no more than five (as we remember) of your [congregationalist] brethren [at Westminster] have written as their judgement in print. And therefore what Mr. [Henry] Burton writes in his margin to prove that every one ought today, before tomorrow, to separate from present defilements, is but to fight with his own shadow. For though we must separate from the defilements of a Church, yet we are not to separate from a Church for every defilement that is in it. The Church of Corinth had many defilements in it, as many we believe as the Church of Aldermanbury [that Burton exited]; And so had diverse of the Churches to which Christ wrote. And yet neither Christ, nor his apostles does persuade the people to separate from those Churches, because of the defilements. And if this doctrine were true doctrine, we believe men will soon find cause to separate from some of their churches as well as ours.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a99625cdfe" data-kw="">
<blockquote><p>…righteousness and wisdom are the food of the hungry soul, the physick of the sick, and the spiritual heat and life of the mind. But then also, if in relation to those so necessary perfections, we exceed the bounds of sobriety and moderation, that food oppresses, that physick poisons, that heat inflames and enrages our souls. Without that necessary mixture of moderation, our righteousness degenerates into a furious zeal, superstition, and bigotry; and our wisdom into profaneness, presumption and undue curiosity… But the being over-much wicked relates to the duration of sin, and not to the degree of it; and forbids a long persistency and hardness in wickedness, and not only the more heinous and exorbitant acts of impiety. This exposition is sufficiently warranted by the Septuagint translation of this place; in which the word here rendered ‘foolish,’ is [Greek] and properly signifies ‘hard and obstinate’;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-maundrell.html">Henry Maundrell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached before the Honourable Company of Merchants Trading to the Levant-Seas… Dec. 15 1695 (London: Brown, 1696) on Eccl. 7:16-17</cite>, pp. 7-8</span></figcaption>

</figure><figure class="quote" id="q-4690e89c7e" data-kw="">
<blockquote><p>…the victims of abuse usually don’t speak out for fear of reprisal. They just leave, and the abusive pastor remains. And if the abusive pastor remains, then he gets to control the narrative… But, there is a difference with abusive pastors. The “relational debris field” of an abusive pastor is not only different in regard to volume of conflicts, but the depth of those conflicts. The lives in his wake are genuinely destroyed… On top of this, abusive pastors often have unresolved conflict. They are typically estranged from many… At this point, the leaders of the church just need to do the math. There is a common denominator in all these different conflicts, namely the pastor…. …the pattern of relational wreckage is often not recognized because spiritually abusive pastors don’t abuse everyone. They are selective in who they treat this way. In fact, there are other people whom the abusive pastor treats remarkably well. In other words, abusive pastors almost always have two sides. One side is domineering, heavy-handed and threatening. The other side is charming, gracious, and even flattering. The tragic implications of this reality is that abusive pastors will almost always have avid defenders who insist that this pastor is the greatest guy in the world. And, to them, that pastor probably has been great. And such defenders will inevitably use the same logic: “He’s never treated me this way.” In other words, they form their judgment entirely on their personal experience… not everyone is in a position to see this track record.</p></blockquote>

<blockquote><p>The sins forbidden in the ninth commandment are, all prejudicing the truth, and the good name of our neighbours, as well as our own,[b]… giving false evidence,[d]… out-facing and over-bearing the truth;[f] passing unjust sentence,[g] calling evil good, and good evil; rewarding… the righteous according to the work of the wicked;[h] forgery,[i] concealing the truth, undue silence in a just cause,[k] and holding our peace when iniquity calleth for either a reproof from ourselves,[l] or complaint to others;[m]… or perverting it [truth] to a wrong meaning,[p] or in doubtful or equivocal expressions, to the prejudice of truth or justice;[q] speaking untruth,[r]… rash,[b] harsh,[c] and partial censuring;[d] misconstructing intentions, words, and actions;[e] flattering,[f] vain-glorious boasting,[g] thinking or speaking too highly or too meanly of ourselves or others,[h] denying the gifts and graces of God;[i] aggravating smaller faults;[k]… raising false rumours,[n] receiving and countenancing evil reports,[o] and stopping our ears against just defence;[p] evil suspicion;[q] envying or grieving at the deserved credit of any,[r]… scornful contempt,[v] fond admiration;[w]… neglecting such things as are of good report,[y]… [b] 1 Sam. 17:28. 2 Sam. 16:3. 2 Sam. 1:9,10,15,16. [c] Lev. 19:15. Hab. 1:4. [d] Prov. 19:5. Prov. 6:16,19. [e] Acts 6:13. [f] Jer. 9:3,5. Acts 24:2,5. Ps. 12:3,4. Ps. 52:1-4. [g] Prov. 17:15. 1 Kings 21:9-14. [h] Isa. 5:23. [i] Ps. 119:69. Luke 19:8. Luke 16:5-7. [k] Lev. 5:1. Deut. 13:8. Acts 5:3,8,9. 2 Tim. 4:6. [l] 1 Kings 1:6. Lev. 19:17. [m] Isa. 59:4. [n] Prov. 29:11. [o] 1 Sam. 22:9,10 compared with Ps. 52:title,1-5. [p] Ps. 56:5. John 2:19 compared with Matt. 26:60,61. [q] Gen. 26:7,9. [r] Isa. 59:13. [s] Lev. 19:11. Col. 3:9. [t] Ps. 50:20. [v] Ps. 15:3. [w] James 4:11. Jer. 38:4. [x] Lev. 19:16. [y] Rom. 1:29,30. [z] Gen. 21:9 compared with Gal. 4:29. [a] 1 Cor. 6:10. [b] Matt. 7:1. [c] Acts 28:4. [d] Gen. 38:24. Rom. 2:1. [e] Neh. 6:6-8. Rom. 3:8. Ps. 69:10. 1 Sam. 1:13-15. 2 Sam. 10:3. [f] Ps. 12:2,3. [g] 2 Tim. 3:2. [h] Luke 18:9,11. Rom. 12:16. 1 Cor. 4:6. Acts 12:22. Exod. 4:10-14. [i] Job 27:5,6. Job 4:6. [k] Matt. 7:3-5. [l] Prov. 28:13. Prov. 30:20. Gen. 3:12,13. Jer. 2:35. 2 Kings 5:25. Gen. 4:9. [m] Gen. 9:22. Prov. 25:9,10. [n] Exod. 23:1. [o] Prov. 29:12. [p] Acts 7:56,57. Job 31:13,14. [q] 1 Cor. 13:5. 1 Tim. 6:4. [r] Num. 11:29. Matt. 21:15. [s] Ezra 4:12,13. [t] Jer. 48:27. [v] Ps. 35:15,16,21. Matt. 27:28,29. [w] Jude 16. Acts 12:22. [x] Rom. 1:31. 2 Tim. 3:3. [y] 1 Sam. 2:24. [z] 2 Sam. 13:12,13. Prov. 5:8,9. Prov. 6:33.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-099f204dae" data-kw="" data-pol="">
<blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote>
<figcaption>— <a href="../authors/synod-of-dort.html">Synod of Dort</a>, <cite>The Canons of Dort</cite>, Heads 3–4, Art. 8</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c61c9312a" data-kw="">
<blockquote><p>Another argument there is taken from them, that ‘they sought the Lord, etc.’ Which seeking of theirs is set out by the manner of it, that they prepared their whole heart to seek Him: Not as if their hearts were so free from sin, or so full of grace as they should have been; but that they were true and plain, and sincere: Not such as had no sin, for it is said, ‘they were not cleansed according to the purification of the sanctuary,’ but that did love no sin: Not such hearts as wanted no grace, or preparation for God’s ordinance: But such as were humbled for the want of grace and of that preparation that they should have made… For it is said, ‘He healed the people,’ that is, gave them that which God does offer unto his people in the sacrament: They received the seal of the Covenant, and He made good the Covenant unto them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jame-owen.html">Jame Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy</cite>, … (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-13496562b0" data-kw="">
<blockquote><p>In 1650 many ministers in the episcopal Church of England were presbyterian in outlook and sought for reform unto this end. While some progress had been made following the Westminster Assembly, the work was still very incomplete. Oliver Cromwell, the self appointed ‘Protector’ of England, arose to civil power at this time; he was an Independent as far as Church government. Hence, Independent churches were arising all around, sometimes with presbyterian ministers. The Church of England’s theology was Erastian. It did not have local church membership as we do, nor allowed for ruling elders in the churches, nor for the ecclesiastical ministry to have the right of excommunication from the Lord’s Supper. These conditions made it difficult, if at all possible, for ministers to have adequate oversight of their parish, and to adequately bar (beyond verbal warnings) scandalous, professing Christians from disgracing the Lord’s Supper. In Independent churches without ruling elders, especially in large congregations, the conditions were similar. A minister, under regular order, does not have, nor should have, of himself, the power of jurisdiction to bar persons from the Lord’s Supper. Hence, among conscientious presbyterian ministers in these situations, there was a very real question of whether they should administer the Lord’s Supper at all, especially in light of their obligation to maintain the integrity of the Supper and their attendant responsibility, in some respect, to keep persons from scandalously abusing it. Many ministers had determined in the negative, at least for the time, till further presbyterian reform could be made. Such systematic reform never occured thereafter. Henry Jeanes (1611–1662) was an English presbyterian minister that had administered the Supper, with certain qualifications, in such conditions. A group of presbyterian ministers hence asked him to write out his reasons for this, in the hopes that he might be able to shed more light on the question for them. The article above is Jeanes’s answer. It is excellent. He gives the same answer as Thomas Cartwright, an earlier father of presbyterianism (as seen here). Answering the question stated in the title of the article, of whether the Supper may be administered without ruling elders or a presbyterian church government, is quite simple: At the end of Acts 2, the apostles, who were ministers, administered the Supper to the large and growing Church in Jerusalem from house to house. Commentators, presbyterian included, nearly universally agree that they had no ruling elders, or sessions, or presbyteries. Why an affirmative answer to the question is right, though, is a much trickier thing to explicate. And this is the primary value of the article: It clearly, carefully and in a balanced fashion, according to right, detailed, classic presbyterian principles shows how these things consist with each other in their right relations, this giving us an exponentially greater understanding of the Lord’s things. See especially pp. 30-32 &amp; 34 that the Lord’s Supper is more (1) properly and immediately worship, and (2) life-giving, and is therefore of greater import and necessity than having an eldership and exercising a negative discipline so as to exclude the scandalous beyond the verbal guarding of the Table by the minister. A modern application of the question today is: Whether a minister, persuaded that weekly communion is too frequent for the adequate self-preparation of the people, in how it actually plays out, and for the elders to maintain adequate circumspection of the people’s right partaking of the Supper, and yet this church practice is not going to be reformed anytime soon, whether that minister may yet in good conscience administer the Supper in these conditions for the time? The principles discussed in the article would appear to be for the affirmative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regarding a minister administering the Lord’s Supper with a deficient frequency</cite>, Contextual notes on the work of Henry Jeanes, The Want [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650)</span></figcaption>

rmined+in+the+negative%2C+at+least+for+the+time%2C+till+further+presbyterian+reform+could+be+made.+Such+systematic+reform+never+occured+thereafter.+Henry+Jeanes+%281611%E2%80%931662%29+was+an+English+presbyterian+minister+that+had+administered+the+Supper%2C+with+certain+qualifications%2C+in+such+conditions.+A+group+of+presbyterian+ministers+hence+asked+him+to+write+out+his+reasons+for+this%2C+in+the+hopes+that+he+might+be+able+to+shed+more+light+on+the+question+for+them.+The+article+above+is+Jeanes%E2%80%99s+answer.+It+is+excellent.+He+gives+the+same+answer+as+Thomas+Cartwright%2C+an+earlier+father+of+presbyterianism+%28as+seen+here%29.+Answering+the+question+stated+in+the+title+of+the+article%2C+of+whether+the+Supper+may+be+administered+without+ruling+elders+or+a+presbyterian+church+government%2C+is+quite+simple%3A+At+the+end+of+Acts+2%2C+the+apostles%2C+who+were+ministers%2C+administered+the+Supper+to+the+large+and+growing+Church+in+Jerusalem+from+house+to+house.+Commentators%2C+presbyterian+included%2C+nearly+universally+agree+that+they+had+no+ruling+elders%2C+or+sessions%2C+or+presbyteries.+Why+an+affirmative+answer+to+the+question+is+right%2C+though%2C+is+a+much+trickier+thing+to+explicate.+And+this+is+the+primary+value+of+the+article%3A+It+clearly%2C+carefully+and+in+a+balanced+fashion%2C+according+to+right%2C+detailed%2C+classic+presbyterian+principles+shows+how+these+things+consist+with+each+other+in+their+right+relations%2C+this+giving+us+an+exponentially+greater+understanding+of+the+Lord%E2%80%99s+things.+See+especially+pp.+30-32+%26+34+that+the+Lord%E2%80%99s+Supper+is+more+%281%29+properly+and+immediately+worship%2C+and+%282%29+life-giving%2C+and+is+therefore+of+greater+import+and+necessity+than+having+an+eldership+and+exercising+a+negative+discipline+so+as+to+exclude+the+scandalous+beyond+the+verbal+guarding+of+the+Table+by+the+minister.+A+modern+application+of+the+question+today+is%3A+Whether+a+minister%2C+persuaded+that+weekly+communion+is+too+frequent+for+the+adequate+self-preparation+of+the+people%2C+in+how+it+actually+plays+out%2C+and+for+the+elders+to+maintain+adequate+circumspection+of+the+people%E2%80%99s+right+partaking+of+the+Supper%2C+and+yet+this+church+practice+is+not+going+to+be+reformed+anytime+soon%2C+whether+that+minister+may+yet+in+good+conscience+administer+the+Supper+in+these+conditions+for+the+time%3F+The+principles+discussed+in+the+article+would+appear+to+be+for+the+affirmative.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+Regarding+a+minister+administering+the+Lord%E2%80%99s+Supper+with+a+deficient+frequency%3A+%7C+Contextual+notes+on+the+work+of+Henry+Jeanes%2C+The+Want+%5BLack%5D+of+Church-Government+%5Bis%5D+No+Warrant+for+a+Total+Omission+of+the+Lord%E2%80%99s+Supper%E2%80%A6+%28London%2C+1650%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F13496562b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/13496562b0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/#:~:text=In%201650%20many%20ministers%20in%20the,appear%20to%20be%20for%20the%20affirmative&amp;text=In%201650%20many%20ministers%20in%20the%20episcopal%20Church&amp;text=article%20would%20appear%20to%20be%20for%20the%20affirmative" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

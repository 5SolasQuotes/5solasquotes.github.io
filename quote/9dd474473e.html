<main class="wrap"><figure class="quote" id="q-9dd474473e" data-kw="No new doctrine">
<blockquote><p>I ought not to seem contentious when I so vehemently insist that we cannot concede to the Church any new doctrine; in other words, allow her to teach and oracularly deliver more than the Lord has revealed in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.15</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-939396c332" data-kw="Infallibility of the church">
<blockquote><p>When they deny that the Church can err, their end and meaning are to this effect: Since the Church is governed by the Spirit of God, she can walk safely without the word; in whatever direction she moves, she cannot think or speak anything but the truth, and hence, if she determines anything without or beside the word of God, it must be regarded in no other light than if it were a divine oracle. If we grant the first point--viz. that the Church cannot err in things necessary to salvation--our meaning is, that she cannot err, because she has altogether discarded her own wisdom, and submits to the teaching of the Holy Spirit through the word of God. Here then is the difference. They place the authority of the Church without the word of God; we annex it to the word, and allow it not to be separated from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><figure class="quote" id="q-40145f457d" data-kw="Authority of Scripture">
<blockquote><p>The authority of the Holy Scripture, for which it ought to be believed, depends not upon the testimony of any man or church, but wholly upon God (who is truth itself), the author thereof; therefore it is to be received because it is the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.4</span></figcaption>

</figure><figure class="quote" id="q-c89569f066" data-kw="councils can err">
<blockquote><p>The question does not simply concern the invisible church of the elect or the universality of believers, whether it can err in the foundation (which our doctrine concerning the perseverance of the saints sufficiently proves is slanderously charged upon us), but whether it is to be said to be so infallible as to be exposed to no error (which we deny). The question is not properly of the collective visible church of believers, but especially of the representative church in councils and of the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.2</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 18.11.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20question%20does%20not%20simply%20concern%20the%20invisible%20church%20of%20the%20elect%20or%20the%20universality%20of%20believers%2C%20whether%20it%20can%20err%20in%20the%20foundation%20%28which%20our%20doctrine%20concerning%20the%20perseverance%20of%20the%20saints%20sufficiently%20proves%20is%20slanderously%20charged%20upon%20us%29%2C%20but%20whether%20it%20is%20to%20be%20said%20to%20be%20so%20infallible%20as%20to%20be%20exposed%20to%20no%20error%20%28which%20we%20deny%29.%20The%20question%20is%20not%20properly%20of%20the%20collective%20visible%20church%20of%20believers%2C%20but%20especially%20of%20the%20representative%20church%20in%20councils%20and%20of%20the%20Roman%20pontiff.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2018.11.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc89569f066.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c89569f066.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>

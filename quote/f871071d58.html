<main class="wrap"><figure class="quote" id="q-f871071d58" data-kw="">
<blockquote><p>The apostles would make no laws at all of things indifferent except in the case of scandal… If then nothing be good [simply] because rulers command it; but, by the contrary, they do lawfully command it because it is good. The Church’s power is one and the same in things indifferent, and necessary in matters of doctrine, discipline and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find pre-existent goodness in doctrine, discipline, and matters of order. Therefore, will of authority, as will, has no power to dispose of the least circumstance of time, place or person; but the Church’s power is ministerial and determined to what is good, expedient and convenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), pp. 648-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f507a876f" data-kw="">
<blockquote><p>Nor is the right of examination founded in this—that we ought to believe ourselves wiser and more sagacious than entire synods and the whole true church; but in this—that since the privilege of infallibility has been granted by God to no church or pastor, nor are we certain whether they who compose ecclesiastical assemblies are members of the true church and faithful servants of God, who are partakers of the Holy Spirit and follow his guidance; nay, it can happen (and it has too often happened) that such assemblies have erred in their decisions. Hence no other means is left for the believer to know the legitimate authority of these assemblies and the decisions made by them with the certainty of faith, than a comparison and examination of them with the word of God, which he not only permits as possible and lawful, but commands as just and necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.34</span></figcaption>

</figure><figure class="quote" id="q-6522302f75" data-kw="">
<blockquote><p>93. Next it may be granted that the matter may be put under a further examination, yet upon condition, that when it is come to the revision of the former sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>

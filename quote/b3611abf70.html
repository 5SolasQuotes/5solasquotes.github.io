<main class="wrap"><figure class="quote" id="q-b3611abf70" data-kw="">
<blockquote><p>Judicial laws of Moses are all such as prescribe order for the execution of justice and judgement in the common-wealth. They were specially given by God, &amp; directed to the Jews: who for this very cause were bound in conscience to keep them all: and if the common-wealth of the Jews were now standing in the old estate, no doubt they should continue still to bind as before.

But touching other nations and specially Christian common-wealths in these days, the case is otherwise. Some are of opinion, that the whole Judicial law is wholly abolished: and some again run to the other extreme, holding that Judicial laws bind Christians as straightly as Jews: but no doubt, they are both wide; and the safest course, is to keep the mean between both. Therefore the Judicial laws of Moses according to the substance and scope thereof must be distinguished; in which respects they are of two sorts. Some of them are laws of particular equity, some of common equity. Laws of particular equity, are such as prescribe justice according to the particular estate and condition of the Jews’ common-wealth &amp; to the circumstances thereof time, place, persons, things, actions. Of this kind was the law, the brother should raise up seed to his brother, and many such like: &amp; none of them bind us because they were framed and tempered to a particular people.

Judicials of common equity are such as are made according to the law or instinct of nature common to all men: and these, in respect of their substance, bind the consciences not only of the Jews but also of the Gentiles: for they were not given to the Jews as they are Jews that is, a people received into the covenant above all other nations, brought from Egypt to the land of Canaan, of whom the Messias [sic] according to the flesh was to come: but they were given to them as they were moral men subject to the order and laws of nature as all other nations are. Again judicial laws, so far forth as they have in them the general or common equity of the law of nature are moral: and therefore binding in conscience, as the moral law.

A Judicial law may be known to be a law of common equity, if either of these two things be found in it. First, if wise men not only among the Jews, but also in other nations have by natural reason and conscience judged the same to be equal, just, and necessary: and withal, have testified this their judgment by inacting laws for their common-wealths, the same in substance with sundry of the Judicial laws given to the Jews: and the Roman Emperors among the rest have done this most excellently, as will appear by conferring their laws with the laws of God. Secondly, a Judicial hath common equity, if it serve directly to explain and confirm any of the ten precepts of the Decalogue: or, if it serve directly to maintain and uphold any of the three estates of the family, the common-wealth, the Church. And whether this be so or no, it will appear, if we do but consider the matter of the law, and the reasons or considerations upon which the Lord was moved to give the same unto the Jews.

Now to make the point in hand more plain, take an example or two. It is a Judicial law of God that murderers must be put to death: now the question is whether this law for substance be the common equity of nature binding consciences of Christians or no? and the answer is, that without further doubting it is so. For first of all, this law hath been by common consent of wise law-givers enacted in many countries and kingdoms besides the Jews. It was the law of the Egyptians and the old Grecians of Draco, of Numa, and of many of the Roman Emperors. Secondly this law serves directly to maintain obedience to the first commandment: and the consideration upon which the law was made is so weighty that without it a common-wealth cannot stand. The murderer’s blood must be shed (saith the Lord, Numb. 35. v. 33, 34) because the whole land is defiled with blood, and remaineth uncleansed, till his blood be shed.

Again it was a judicial law among the Jews that the adulterer &amp; adulteress should die the death: now let the question be whether this law concern other nations as being derived from the common law of nature: and it seems to be so. For first wise men by the light of reason and natural conscience have judged this punishment equal and just. Judah before this Judicial law was given by Moses appointed Tamar his daughter in law to be burnt to death for playing the whore [Gen. 38:24]. Nabuchadnezzar burnt Echad and Zedechias because they committed adultery with their neighbours’ wives [Jer. 29:23]. By Dracoes law among the Grecians this sin was death, and also by the law of the Romans. Again, this law seems directly to maintain necessary obedience to the seventh commandment: and the considerations upon which this law was given are perpetual &amp; serve to uphold the common-wealth. Lev. 20.22. Ye (saith the Lord) shall keep all mine ordinances &amp; my judgements [the law of adultery being one of them.] Now mark the reasons. 1. Lest the land spue you out. 2. For the same sins I have abhorred the nations.</p></blockquote>

<blockquote><p>7th Conclusion. When the representative Church is universally apostatical, then may the prince use the help of the Church-essential of found believers, for a reformation; and if they also be apostatic (which cannot be, except the Lord utterly have removed his candlestick) we see not what he can do but hear witness against them, but if there be any secret seeker of God in whose persons the essence of a true Church is conserved. The king by a royal power, and the law of charity is obliged to reform the land, as the godly kings with a blessed success have hitherto done, Asa, Josiah, Jehoshaphat, in which case the power of reformation and of performing many acts, of due belonging to the Church officers, are warrantably performed by the king, as in a diseased body, in an extraordinary manner power recurs from the members to the politic head and Christian prince, who both, as a King, in an authoritative way is obliged to do more then ordinary, and as a Christian member of the Church, in a charitative and common way, is to care for the whole body.</p></blockquote>

</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

<blockquote><p>21. ‘Moreover, thou shalt provide out of all the people.’… meaning, thou shalt choose out and take the most worthy, so that such an office be not entrusted rashly to any one that offers. But this was most reasonable, among a free people, that the judges should not be chosen for their wealth or rank, but for their superiority in virtue. Yet although it be right that regard should be chiefly had to virtue, so that if any one of the lower orders be found more suitable than others, he should be preferred to the noble or the rich; still should any one choose to, lay this down as a perpetual and necessary rule, he will be justly accounted contentious.</p></blockquote>

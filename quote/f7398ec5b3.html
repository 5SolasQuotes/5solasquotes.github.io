<main class="wrap"><figure class="quote" id="q-f7398ec5b3" data-kw="">
<blockquote><p>…take heed that you not act like the weak in Rom. 14. Those who were weak in the Christian Faith (v. 1) held excessive religious strictures and scruples, especially in practical matters, however inconvenient (v. 2). Their simplistic beliefs determined their actions, which set them apart from other Christians. They prided themselves in their strict living, self-denial and high standard (v. 2), taking what they thought was righteous grief, offense and scandal at things actually lawful (vv. 20–21), they not thinking them best or godly enough (vv. 4–5). They spoke ill of their Christian brothers, judged them (vv. 3–4, 16, even Paul implicitly), whom they saw as worldly, licentious and not devoted enough, though their brethren were equally devoted (v. 6) and actually stronger and more understanding in the truth than they (v. 14). The weak’s distinctives exemplified misplaced priorities, valuing certain external practices they considered to be religiously necessary above their brethren’s fellowship, and hence also above the fundamentals of “righteousness, and peace, and joy in the Holy Ghost,” in which the kingdom of God consists. (v. 17) The weak practically valued what they considered to be sanctification, and that in others, above other Christians’ faith and justification (v. 18), that they are accepted with God forever in Christ, and He will make them stand. (v. 4) It was not only the strong, but the weak as well that were deficient in following “after the things which make for peace, and things wherewith one may edify another.” (v. 19) If such a weak person began to teach their distinctives and seek to bind them on others, would not he be sectarian?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 185-86</span></figcaption>

<blockquote><p>19. Not meddling with ministers subscribing, declaring, swearing, nor with the discipline, by-offices, baptizing as by our sort of godfathers’ covenanting without the parents, crossing and undue application of words at burial and such like, I know nothing in the common [Anglican] Lord’s-Day worship [1661] spoken in the name of the Church which a godly Christian may not join in with the exercise of the spirit of prayer with faith and comfort,¹ if prejudice and false apprehensions of it affright him not or put not his soul out of relish with it. (As on the other side: prejudice distastes many too much with the faulty methods and words of many men’s extemporate prayers.)</p></blockquote>

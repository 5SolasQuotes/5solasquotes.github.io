<main class="wrap"><figure class="quote" id="q-812f45c829" data-kw="">
<blockquote><p>Another important division of historical interpreters is into Post-Millennarians and Pre-Millennarians, according as the millennium predicted in Rev. 20 is regarded as past or future. Augustine committed the radical error of dating the millennium from the time of the Apocalypse or the beginning of the Christian era (although the seer mentioned it near the end of his book), and his view had great influence; hence the wide expectation of the end of the world at the close of the first millennium of the Christian church. Other post-millennarian interpreters date the millennium from the triumph of Christianity over paganism in Rome at the accession of Constantine the Great (311); still others (as Hengstenberg) from the conversion of the Germanic nations or the age of Charlemagne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pastmillennialism.html">Pastmillennialism</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology | On Augustine | Philip Schaff, History of the Christian Church 3rd rev. (NY: Charles Scribner’s Sons, 1928), vol. 1, Apostolic Christianity, 1st Perdiod, ch. 12, section 101, ‘The Apocalypse’</cite>, p. 839</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

</figure><figure class="quote" id="q-0193a932c3" data-kw="">
<blockquote><p>‘And bound him;’ From the open slaughtering of the saints, as he had done by the heathen emperors; or, from molesting and mischiefing of God’s people, otherwise he is not bound one hour, Job 1:6-12 1 Peter 5:8. And how his vicegerent the beast has bestirred him during the thousand years, who knows not? ‘A thousand years;’ Hos explicate fateor trepide me aggredi, says [David] Pareus. He begins the thousand at the destruction of the temple, A.D. 73, and so it ends in Pope Hildebrand, who stepped into that chair of pestilence, A. D. 1073. Others begin it at the birth of Christ, and end in Sylvester II. Others at Christ’s passion, and end in Benedict IX. But they do best, in my opinion, that begin at Constantine and end in Boniface VIII, who is of his own said to have entered like a fox, reigned as a lion, and died as a dog. He excommunicated the French king, and published this decree, that the Bishop of Rome ought to be judged of none, although he should carry innumerable souls with him to hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Rev. 2, verse 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

</figure><figure class="quote" id="q-1daad5e2a6" data-kw="">
<blockquote><p>Therefore, we dismiss these [previously mentioned] opinions, while holding firmly to the popular and more commonly accepted view which maintains that the Pontiff, his rank and his rule, are correctly described by this prophecy. In fact, we may compute his name in either Greek or Hebrew, the two languages by which God gave his oracles and prophecies (shrouding them in mystery), yet the sum of their letters will yield the same result. For, if the computation be made in Greek, which is quite appropriate considering the Revelation was written in Greek to Greeks, no other suitable name occurs than the name Lateinos, as Irenaeus [A.D. 130-202] conjectured. And, if the name Romanus should be counted in the Hebrew characters, it will mean either Roman seat or Roman, as John Foxe [1516-1587] determined. Moreover, the Hebrew term comprises the same meaning as that of the Greek term. For Romanus or Lateinos is the name of the aforementioned Beast and is that name which the Pope imposes on all his disciples [that is, Roman Catholic]. It is on this self-same Beast that all these and additional marks of Antichrist converge; i.e., such marks as causing the whole earth, which follows him, to wonder; his blaspheming the name of God; and the great power he holds over the heads of all people and tongues, etc. That this name contains the number 666 in both Greek and Hebrew is not a point of dispute [the following is in the Greek alphabet]: L – λ – 30 a – α – 1 t – τ – 300 e – ε – 5 i – ι – 10 n – ν – 50 o – ο – 70 s – ς – 200 = 666 Thus the Roman Pontiff and his Seat is undoubtedly indicated. For he is truly Latin who holds the remains of the Latin empire and the ancient seat. By no small coincidence, he does not allow public worship to be conducted in any other language than Latin; nor does he publish his official documents and decrees in any other language. Also, the Eastern Orthodox call the Roman Church by the name Latin Church, as seen in the general councils where this distinction was meticulously made between the western fathers or bishops, called Latins, while the rest were called Greeks. Therefore, the name Lateinos (in Greek) or Romanus (in Hebrew) is fully consistent with the fulfillment of this prophecy, in that it predicts the seat of the Beast to be Rome, where it remains to this day. The truth is out in the open.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether it can be proven the Pope of Rome is the Antichrist’, section 35</cite></span></figcaption>

y+indicated.+For+he+is+truly+Latin+who+holds+the+remains+of+the+Latin+empire+and+the+ancient+seat.+By+no+small+coincidence%2C+he+does+not+allow+public+worship+to+be+conducted+in+any+other+language+than+Latin%3B+nor+does+he+publish+his+official+documents+and+decrees+in+any+other+language.+Also%2C+the+Eastern+Orthodox+call+the+Roman+Church+by+the+name+Latin+Church%2C+as+seen+in+the+general+councils+where+this+distinction+was+meticulously+made+between+the+western+fathers+or+bishops%2C+called+Latins%2C+while+the+rest+were+called+Greeks.+Therefore%2C+the+name+Lateinos+%28in+Greek%29+or+Romanus+%28in+Hebrew%29+is+fully+consistent+with+the+fulfillment+of+this+prophecy%2C+in+that+it+predicts+the+seat+of+the+Beast+to+be+Rome%2C+where+it+remains+to+this+day.+The+truth+is+out+in+the+open.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+%E2%80%98Whether+it+can+be+proven+the+Pope+of+Rome+is+the+Antichrist%E2%80%99%2C+section+35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1daad5e2a6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1daad5e2a6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/roman-catholicism/what-does-666-mean/#:~:text=Therefore%2C%20we%20dismiss%20these%20%5Bpreviously%20mentioned%5D,truth%20is%20out%20in%20the%20open." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-54e422f3ec" data-kw="">
<blockquote><p>In like manner, as we are taught by the Apostle, Christ, having offered Himself on the cross as a sacrifice for our sins, has passed through the heavens, there to appear before God in our behalf. He is, therefore, said to be the minister of the true tabernacle, which the Lord pitched and not man. His priestly office is now exercised in heaven, where he ever lives to intercede for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 3, ch. 10, § 1, “Christ our Intercessor”</span></figcaption>

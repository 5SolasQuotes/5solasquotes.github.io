<blockquote><p>Rightly therefore and truly we say those signs truly and properly are signs of the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/trigland-sr-jacob.html">Jacob Trigland Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations of Jacob Trigland on Various Opinions on the Will of God &amp; Universal Grace, where is yet something of Middle Knowledge</cite>, (Leiden, 1642) | ‘Of the Will of Sign &amp; of Good-Pleasure’, pp. 158-165 See especially pp. 160-161 where Trigland affirms arguments of the Medieval Scholastics that the Will of Sign always externally signifies something of the internal will of God and his good-pleasure. He then gives counter arguments to those who deny such., p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>XXXVIII. Although God can be said to will men to be saved who yet are not saved (when it treats of the will of complacency [eurestias] which commands man’s duty and declares what is pleasing to God), yet this cannot be said equally of the will of decree. As many as God wills to be saved, He also wills to save and actually saves at the appointed time, that his will may not be rendered vain and frustrated. But in this question (as was just said), it is not treated simply of that which He holds dear and wills to be done by men, but of that which He Himself wills to do towards men by destinating to them salvation under the condition of faith, and determining to send Christ for this end that He might acquire it for them. Therefore they are mistaken who discover a hiding place in this distinction, as if in this affair the question were only whether God wills all men to be saved and not whether He wills to save them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1 | 4th Topic, 17th Question, ‘Can there be attributed to God any conditional will, or universal purpose of pitying the whole human race fallen in sin, of destinating Christ as Mediator to each and all, and of calling them all to a saving participation of his benefits? We deny., p. 412</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>[Edward Leigh:] ‘God is patient, Psalm 103:8; Job. 21:7. God’s patience is that whereby He bears the reproach of sinners and defers their punishments; or it is the most bountiful will of God, whereby He doth long bear with sin which He hates, sparing sinners, not minding their destruction, but that He might bring them to repentance. See Acts 13:18.’¹ … It is, thus, ‘the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but He does warn them beforehand, lightly correct and seek to turn them unto Him.’² ¹ Leigh, Body of Divinity, II.xiii (p. 299), citing marginally Nahum 1:3 and Isa. 30:18; cf. Cocceius, Summa theol., III.x.67. ² Leigh, Treatise, II.xiii (p. 106).</p></blockquote>

<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter</cite>, trans. Johnson &amp; Fentiman (RBO, 2019) | Section 20, ‘Whether because God amiably invites and by supplications solicits, entreats and calls upon reprobates, and as He mourns over them, is grieved by them and laments on account of the disobedient, whether He, therefore, intends the obedience of them?’, pp. 57-58, ch. 2, ‘On God’; pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ... (d. 1629; London: Mabb, 1660), bk. 1, ch. 3, Concerning the Works of God &amp; the Decrees of God in General, The Rules, pp. 33-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.”

— Johannes Wolleb, The Abridgment of Christian Divinity... (d. 1629; London: Mabb, 1660), bk. 1, ch. 3, Concerning the Works of God &amp; the Decrees of God in General, The Rules, pp. 33-37">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BI%5D+This+is+called+his+%5BGreek%5D+%28Acts+2%3A23%29%2C+Determined+purpose%2C+%5BGreek%5D+%28Acts+4%3A28%29%2C+The+hand+and+counsel+of+God%3B+%5BGreek%5D+%28Eph.+1%3A9%29%2C+The+good+pleasure+of+God+and+Gods+eternal+providence.+%28Now+this+is+called+his+eternal+providence%2C+that+it+may+be+distinguished+from+actual+providence%2C+which+is+nothing+else+but+the+execution+of+God%E2%80%99s+decrees.%29+II.+This+is+called%2C+the+Will+of+God%2C+or+The+will+of+his+good+pleasure.+Indeed+the+decree+is+the+very+will+of+God%3B+yet+for+our+better+understanding%2C+the+will+is+considered+as+the+cause+efficient%2C+the+decree+is+the+effect.+Now+whereas+this+word+%E2%80%98will%E2%80%99+is+taken+diversely%2C+it+is+diverse+ways+distinguished+by+divines%2C+to+wit%2C+into+the+will+of+his+good+pleasure+and+the+will+of+the+sign%3B+into+an+antecedent+and+consequent%3B+into+absolute%2C+and+conditional%3B+into+secret+and+revealed.+But+these+are+not+real+distributions+of+the+divine+will%2C+but+distinctions+only+of+the+name%3A+For+to+speak+properly%2C+there+is+in+God+but+one+only+will%2C+which+is+called+the+will+of+his+good+pleasure%2C+because+out+of+his+most+free+good+pleasure+He+has+decreed+what+shall+be+done%3A+It+is+called+also+his+antecedent+will+because+it+had+existence+before+any+creature+and+from+eternity+with+God+it+was+established%3A+It+is+named+also+absolute%2C+because+it+depends+upon+God%E2%80%99s+good+pleasure+and+not+from+the+things+which+are+done+in+time.+Lastly+it+is+called+secret%2C+because+in+respect+of+priority+it+is+known+neither+to+men+nor+angels.+But+these+things+are+improperly+styled+by+the+name+of+divine+will+which+are+comprehended+in+that+ordinary+verse%3A+Praecipit%2C+et+prohibet%2C+promittit%2C+consulit%2C+implet%3A+%E2%80%9CCommands%2C+forbids%2C+promises%2C+consults%2C+fulfills.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wolleb%2C+The+Abridgment+of+Christian+Divinity...+%28d.+1629%3B+London%3A+Mabb%2C+1660%29%2C+bk.+1%2C+ch.+3%2C+Concerning+the+Works+of+God+%26+the+Decrees+of+God+in+General%2C+The+Rules%2C+pp.+33-37&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66bdb9a034.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66bdb9a034.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=I%5D%20This%20is%20called%20his%20%5BGreek,implet%3A%20%E2%80%9CCommands%2C%20forbids%2C%20promises%2C%20consults%2C%20fulfills&amp;text=I%5D%20This%20is%20called%20his%20%5BGreek%5D%20%28Acts%202%3A23&amp;text=promittit%2C%20consulit%2C%20implet%3A%20%E2%80%9CCommands%2C%20forbids%2C%20promises%2C%20consults%2C%20fulfills" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

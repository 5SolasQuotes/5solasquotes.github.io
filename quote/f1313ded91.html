<main class="wrap"><figure class="quote" id="q-f1313ded91" data-kw="">
<blockquote><p>They have not known Me; which is indeed the only true wisdom; they have not studied my disposition or mildness toward them; they are so sottish, that they have neither regarded my counsels nor threats, but utterly stupid; they know not what is for their own good, have no understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, on Jeremiah, 4:22</span></figcaption>

</figure><figure class="quote" id="q-efc6740ffe" data-kw="">
<blockquote><p>This argues God’s willingness to be reconciled, that the Lord is thus pleading with you. And let me speak to everyone in this place who has felt God pleading thus with them. Know that the Lord, by this work of His, strives with you to bring you to be reconciled to Him. This is nothing other than the striving of the Spirit of God Himself with you, though perhaps you think this is troublesome to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Reconciliation</cite>, (d. 1646; 1657; Soli Deo Gloria, 1997), ch. 74, The Fourteenth Argument, pp. 316-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“This argues God’s willingness to be reconciled, that the Lord is thus pleading with you. And let me speak to everyone in this place who has felt God pleading thus with them. Know that the Lord, by this work of His, strives with you to bring you to be reconciled to Him. This is nothing other than the striving of the Spirit of God Himself with you, though perhaps you think this is troublesome to you.”

— Jeremiah Burroughs, Gospel Reconciliation, or Christ’s Trumpet of Peace to the World (d. 1646; 1657; Soli Deo Gloria, 1997), ch. 74, The Fourteenth Argument, pp. 316-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+argues+God%E2%80%99s+willingness+to+be+reconciled%2C+that+the+Lord+is+thus+pleading+with+you.+And+let+me+speak+to+everyone+in+this+place+who+has+felt+God+pleading+thus+with+them.+Know+that+the+Lord%2C+by+this+work+of+His%2C+strives+with+you+to+bring+you+to+be+reconciled+to+Him.+This+is+nothing+other+than+the+striving+of+the+Spirit+of+God+Himself+with+you%2C+though+perhaps+you+think+this+is+troublesome+to+you.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel+Reconciliation%2C+or+Christ%E2%80%99s+Trumpet+of+Peace+to+the+World+%28d.+1646%3B+1657%3B+Soli+Deo+Gloria%2C+1997%29%2C+ch.+74%2C+The+Fourteenth+Argument%2C+pp.+316-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefc6740ffe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efc6740ffe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=This%20argues%20God%E2%80%99s%20willingness%20to%20be,think%20this%20is%20troublesome%20to%20you&amp;text=This%20argues%20God%E2%80%99s%20willingness%20to%20be%20reconciled%2C%20that&amp;text=perhaps%20you%20think%20this%20is%20troublesome%20to%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f476704f37" data-kw="">
<blockquote><p>‘His strange work;’ the execution of his judgment against Israel, which He calls his strange work, to intimate either: … 2. That this work of bringing total and irrecoverable destruction upon Israel was contrary to the benignity of his own nature, and to the usual way of dealing with his people, whom He used and delighted to protect, and spare, and bless; and whom, even when He is angry with them, and punishes them, He handles more gently than He does other persons, in judgment remembering mercy to them, as was noted, Isa. 27:7-8; see also Isa. 26:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, on Isaiah 28, verse 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-9e96acf3b2" data-kw="">
<blockquote><p>‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 28, verse 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.”

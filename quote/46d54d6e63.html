<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians… some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10c6b7e1b6" data-kw="">
<blockquote><p>I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences (d. 1274), bk. 1 | dist. 47 | Treatment of the Questions</cite></span></figcaption>

<blockquote><p>XXXVIII. Although God can be said to will men to be saved who yet are not saved (when it treats of the will of complacency [eurestias] which commands man’s duty and declares what is pleasing to God), yet this cannot be said equally of the will of decree. As many as God wills to be saved, He also wills to save and actually saves at the appointed time, that his will may not be rendered vain and frustrated. But in this question (as was just said), it is not treated simply of that which He holds dear and wills to be done by men, but of that which He Himself wills to do towards men by destinating to them salvation under the condition of faith, and determining to send Christ for this end that He might acquire it for them. Therefore they are mistaken who discover a hiding place in this distinction, as if in this affair the question were only whether God wills all men to be saved and not whether He wills to save them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 1 | 4th Topic, 17th Question, ‘Can there be attributed to God any conditional will, or universal purpose of pitying the whole human race fallen in sin, of destinating Christ as Mediator to each and all, and of calling them all to a saving participation of his benefits? We deny.’</cite>, p. 412</span></figcaption>

<blockquote><p>38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’ 39. Therefore there is no cause properly so called to be given of God’s will. 40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself. 41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another. 42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature. 43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed. 44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’ 45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…</p></blockquote>

<blockquote><p>But many testimonies of Scripture (you will say) teach that even the reprobate have known the truth. Leaving aside the Scriptures of the Old Testament: to Romans the apostle concerning the reprobates says that they hold the truth of God in unrighteousness. And to the Hebrews [6:4-6] he says that some have fallen away from the truth. And he says they taste the word of God and the powers of the world to come: but after the knowledge of the truth they willfully sin. And this is sin against the Holy Spirit: namely the opposition to the truth known, made from the heart. There are twofold cognitions of the truth (as was shown at the outset): one indeed is given and conferred by the gift of the Spirit; but yet inefficacious. For it is only on the surface of the intellect, and the ray has no root in the heart; and therefore it cannot be durable. For it is like seed which is born among rocky chinks and has no root; therefore when the sun arises it withers. Such cognition is common also to the reprobate. … Another is efficacious by the Holy Spirit, the Spirit, I say, of regeneration. For this penetrates into the heart, receives it, reforms and refashions it: there it puts down deep roots, and thrusts itself forth outward in its fruits by charity… Wherefore the Thesis remains firm: only the elect can come to the true knowledge of the truth, and at last the thing itself attains them. Thus it happens that this cognition of the truth is purely the work of the Holy Spirit, efficaciously calling and teaching. What things are demanded of us that we may come to a true and efficacious cognition of the truth? Thesis: That we be led to the cognition of the truth, besides a certain general hearing of the Word of God, we must pray that God may grant us his Spirit: who, when He excites in us the desire to seek that truth, then leads us to seek, to find, and to retain it.</p></blockquote>

<blockquote><p>Sometimes, by elevating his People above the bitterness of their afflictions, by the surpassing sweetness of his Presence, and transporting consolations. Great afflictions may be upon them, but greater divine refreshments may even drown and swallow them up. Our abounding afflictions are sweetly cured by Christ’s abounding and superabounding Consolations. The Moon and Stars are in the sky at mid-day, as well as at mid-night, but not one of them then appears; because the Sun shining in his strength, hath outshined them all: So when Jesus Christ the glorious Sun of righteousness shines in his strength of Grace and Consolation upon the hearts of his afflicted, he so shines away their troubles and distresses, that they scarce appear.

If Christ steel the Spirit with Faith, Courage and Magnanimity, and fill the heart with the Consolations of God, which are not small; how easy is it to trample upon the greatest tribulation, and count all afflictions as no afflictions, yea as great advantages! Holy [John] Bradford Martyr said; I thank God more of this Prison, then of any Parlour, yea then of any pleasure that ever I had; for in it I find God, my most sweet good God always. And Laurence Sanders Martyr confessed; I was in Prison, till I got into Prison. Hierom hath a good note concerning Job: That God came nearest to Job in his extremities, and dealt with him then most familiarly. And he adds: Let strokes come, let all kind of Punishments come: so that after these Christ will come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The chequer-work of God’s providences, towards His own people, made up of blacks and whites, viz., of their abasements, and advancements, their distresses, and deliverances, their sullying tribulations, and beautifying relaxations represented in a sermon preached at the funeral of that faithful serv</cite>, (London: G. Calvert, 1657), pp 34-35.</span></figcaption>

<blockquote><p>First; an earnest deprecation of an impending Judgment, is reconcilable with our Submission to the pleasure of God, declared by the Event. Our Saviour with humility and importunity desired the removing of the Cup of Bitterness. We must distinguish between God’s Law, and his Decree and Counsel; The Law is the Rule of our Duty, and requires an entire exact subjection in all our Faculties, even in our internal Desires, in the first motions of the Will; the least velleity, or rising of the Heart against the Divine Command, is irregular and culpable; for not only the acts of Sin are forbidden in every Command respectively, but all the incitations of Concupiscence, before the deliberate judgment of the Mind, or the actual consent of the Will. But the Decree of God is not the Rule of our Duty, and Secret, till manifested by the event of things. This being premised, the Reasons are evident why we may pray against an Affliction that threatens us, without violating our Duty.

First; Because Afflictions are Evils which the Will naturally declines, and are not desirable things in themselves. They are not beneficial and productive of our good by any proper efficacy and operation, but by the over-ruling Providence of God, and the gracious assistance of his Spirit. When Aaron‘s Rod was put into the Sanctuary, and became green and flourishing with Blossoms and Almonds, ’twas not from any inherent virtue of its own, but from the special influence of the Divine Power; for the other Rods remained dead and dry: thus the happy effects of the Afflicting Rod are from Divine Grace.

Secondly; There are proper Temptations that attend the afflicted State. Many are encompassed in a sad Circle, their Sins procure Afflictions, and their Afflictions occasion many Sins. Indeed, Tribulation that is sanctified, by a happy gradation worketh Patience; and Patience, Experience of the Divine Mercy; and Experience, Hope, and Hope maketh not ashamed. But when it meets with a stubborn Spirit, there are fearful descents of Sin: Tribulation excites Impatience, and Impatience causeth Perplexity, and that Despair, and Despair Confusion.

The Devil lays his trains in every condition, and sometimes by immoderate Sorrow, sometimes by inordinate Joy, doth mischief to the Soul. And as more perish by Surfeits than Abstinence, yet the Diseases that are caused by emptiness, are more dangerous and incurable than those that proceed from fullness: So more are ruined by Prosperity than Adversity: But the guilty Passions that ferment and rage in Adversity, are more pernicious, and more hardly tempered and subdued, than the Luxurious Appetites that are fomented and drawn forth by Prosperity. We are directed by our Saviour to pray, that we may not be led into Temptation, and to be delivered from all Evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great duty of resignation to the divine will in afflictions, enforced from the example of our suffering Saviour</cite>, (London: Brabazon Aylmer, 1684), pp 6-9.</span></figcaption>

</figure><figure class="quote" id="q-c995c769a3" data-kw="">
<blockquote><p>Many of us confuse spiritual desertion with the mental health condition of melancholy (or depression). The Dutch Reformed theologian, Gisbertus Voetius, gave some directions for distinguishing between the two conditions (we omit number five owing to an error that caused the author to say the opposite of what he probably meant to say):

It is distinguished from melancholy as follows. In the first place, a melancholic disorder is directly lodged in the imagination, but abandonment is located in the rational soul.

Second, the symptoms of melancholia are pain and fear without the kind of discernible cause the depressed could advance to explain them, but the abandoned show by a sharp and refined judgment that they know the cause of their disturbance and the total mystery of the temptations and promptings of Satan and can make sense of them by their answers as well as their excuses, their refutations and replies.

Third, this desertion can exist and is frequently there (as the most competent and experienced practical writers such as Perkins, Downame, Abernethy, and Bolton attest) when a person’s temperament and physical condition show no tendency to melancholia and when also no bad humour, intestinal diseases, and such ailments can in any way be found. But this is not true of melancholia.

Fourth, melancholics are most afraid of fantastic and illusory vanities that do not now exist nor have ever existed, as this has been unfolded in the work of the practical writers. … The abandoned, on the other hand, fear only the prospect of becoming insensitive to the grace of God and of coming under his wrath. …

Sixth, melancholia is often cured by medical treatment and medicines, but this is by no means true for abandonment.

Seventh, melancholia is often alleviated or eliminated by recreation, physical diversion, and mental entertainment, by games, music, and song, by the speeches and conversations of comical and farcical entertainers, and so forth, but these measures only intensify the bitterness and severity of desertion and its attendant woes.

Finally, melancholics as well as old fogies are incapable of doing certain things, but the abandoned surpass not only others but often even themselves in intellect and memory, wisdom and prudence, respecting divine and human matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius-and-johannes-hoornbeeck.html">Gisbertus Voetius and Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Desertion</cite>, trans. John Vriend and Harry Boonstra, ed. M. Eugene Osterhaven (1659; Grand Rapids MI: Reformation Heritage Books, 2003), p. 39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

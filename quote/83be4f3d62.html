</figure><figure class="quote" id="q-6201f5bc82" data-kw="">
<blockquote><p>It is an untruth which Raphael de la Torres [a Dominican Romanist], with other schoolmen say, that with the same religion by which we honor holy men, we honor God; upon this reason, because holiness in them is a participation of the divine nature, therefore God must be the intrinsical end, and formal reason for which we honor the saints. [1.] For holiness in saints is a participation of the divine nature; but it is a temporary and a created participation, it is not the same very holiness that is in God; but the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature; and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God, commanded in the First Table of the Law. 2. When I bow to the gray-haired, and to the king, I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man, that I am then bowing to the God of heaven and Worshipping God: No acts terminated upon saints living or dead are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Introduction, section 6, pp. 83-84</span></figcaption>

<blockquote><p>Concerning the Worship of God We call upon God in Spirit and in truth, in true faith, in accordance with the Word of the Lord in Christ Jesus, and worship Him inwardly and outwardly with the deeds commanded by God. For God is not worshipped by human doctrines, mandates, and works, but only by those which He Himself commands and effects by His Holy Spirit through faith and the Word (John 4; Matt. 5; Isa. 29; Rom. 14). We, therefore, confess that the worship of God is the work commanded by God, performed by the Holy Spirit in the elect, with confidence in the Mediator, in Spirit and in truth that we should obey God, celebrate, and acknowledge God (Rom. 12). So the fathers and the councils teach (Ex. 34; Matt. 4; Deut. 6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-confessio-catholica.html">Hungarian Confessio Catholica</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th &amp; 17th Centuries</cite>, ed. James Dennison, Jr. (RHB, 2010), vol. 2, pp. 559-60</span></figcaption>

</figure><figure class="quote" id="q-cd2c8b24bb" data-kw="">
<blockquote><p>1. Worship of God is all that servitude, observancy, reverence and religion whereby as well inwardly in the heart, as outwardly in the work itself, we honor God and serve Him.

2. This, if it be rightly performed according unto the will of God, is termed true worship; but if contrariwise, it is called false and idolatrous worship.

3. True worship of God is every work, inward and outward, commanded by God, performed in faith, to this principal end, that God may be glorified.

4. And to worship God truly is so to worship Him as He has commanded in his Word how He would be worshipped.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 10, ‘Of the Worship of God…’, p. 65 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

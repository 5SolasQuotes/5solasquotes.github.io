<main class="wrap"><figure class="quote" id="q-a58364034a" data-kw="">
<blockquote><p>1. A Christian man ought to aim even at that perfection which he understands he cannot attain in this life. For no sinner hath ever been able to mortify and restrain all the first motions of inordinate concupiscence; yet all are bound to attempt it: for that Divine mandate stands immoveable, Thou shalt not covet. Concerning which, Augustine, Epist. 200, ad Asellicum, truly said, The law, in declaring thou shah not covet, has laid down not the power which we have in this particular, but the object at which we should advance progressively.

2. Those first motions of inordinate desires are sins, though the mind does not assent to them. [Cardinal Robert] Bellarmin, therefore, is wrong, who concludes, in De stat. pecc. 5. 7, that that rebellious motion of concupiscence has the nature, not of guilt, but of punishment. Why does the Apostle call it evil? Why does he say it is to be mortified? He is not wont to speak thus about punishments; which he teaches us are to be borne patiently, not to be mortified or resisted. Let the Jesuit hear Paul, who in Rom. vii. not once, but often, terms inordinate concupiscence sin, even in the regenerate who consent to the law, and oppose these motions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

<blockquote><p>Reformers, however, rejected the distinction as incompatible with the Word of God. They did not deny that there are degrees of sin, and while they continued to employ the terms ‘mortal’ and ‘venial sins,’ they attached a different meaning to them. Lutherans to some extent had to take over this distinction, as much as believers could commit some sins without losing the grace of God and [commit] others that cost them that grace. But the Reformed went further and wanted nothing to do with the whole distinction. If they did at times still use the words, they meant by them that all sins, except the sin of blaspheming the Holy Spirit, can be forgiven and are actually forgiven to believers, but that they are all inherently deserving of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 3 (Baker Academic), part 1, ch. 3, ‘The Nature of Sin’, p. 153 Bavinck’s summary lacks significant qualification, as is seen by the rest of the material on this webpage.</span></figcaption>

</figure><figure class="quote" id="q-508fcbbc57" data-kw="">
<blockquote><p>2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10.

3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ.</p></blockquote>

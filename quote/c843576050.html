<main class="wrap"><figure class="quote" id="q-c843576050" data-kw="">
<blockquote><p>7. They [civil magistrates] might and ought to give their countenance unto, and join their authority with, such ecclesiastic statutes, overtures, or means, as Church-judicatories or officers might be about to make use of for this end in their places; and this can be no more prejudice to liberty, to countenance with their authority the ordinance of discipline, than to confirm by their authority the ordinance of preaching the Gospel. … 9. In recovering a people, in a reeling and staggering time, a magistrate may engage them to formerly received truth, and interpose his authority for this end, as is recorded of Josiah, 2 Chron. 34:31-33. Also, 10. He may and ought to remove all false worships, and endure no corrupt preaching, or writing, or meetings for that end, or administrating of corrupted sacraments, or any ordinance other than what is allowed; for, Josiah did cause the people stand to the Covenant that was made, and having removed all idolatrous worship, he made Israel to serve the Lord, that is, he made them abandon corrupt worship, and wait on pure ordinances, as keeping of the sabbaths, offering of sacrifices, etc. and that according to the manner prescribed by the Lord. Neither was it a wronging of their liberty, to do so, because:

1. It was the preservation of their liberty, to keep them from the abominable bondage of these evils.

2. It was their duty to abstain from these, and to follow the ordinances purely, and the magistrate may well put people to that.

3. It is one thing by force to keep folks from dishonouring God in a corrupt religion, (as Josiah did) another to force them to a religion; the one belongs to the ordering of the outward man, the other to the inward.

4. He might order them to keep the ordinances, and in going about them to keep the rule, because that is but a constraining of them to the means whereby religion works, and a making them, as it were, to give God a hearing, leaving their yielding and consenting to Him, when they have heard Him, to their own wills, which cannot be forced; yet it is reason that when God comes by His ordinances to treat with a people, that a magistrate should so far respect His glory and their good as to interpose His authority to make them hear.

5. Also, there is a difference between the constraining of a circumcised or baptized people, to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized, which were not formerly engaged; because, actual members of a Church have not even that liberty as others have, to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements, and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things, and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (1659), pt. 3, ch. 4, pp. 252-4</span></figcaption>

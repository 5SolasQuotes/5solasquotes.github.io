<main class="wrap"><figure class="quote" id="q-580c562499" data-kw="">
<blockquote><p>We hold against Antinomians that we are never justified till we believe. They say from eternity we were justified; or from the time that the Messiah died, all sins were finished, and we justified, or from our birth. But justification in God’s decree and purpose from eternity, is no more justification then Creation, sanctification, glorification, the crucifying of Christ, and all things that fall out in time; for all these were in the eternal purpose of God.

2. In justification, our sins are, in their guilt, fully done away, as a thick cloud, cast in the bottom of the sea, remembered no more, sought for, and not found; if all this was done from eternity, believers were never sinners, never children of wrath, really, as Paul saith; never dead in sins, never enemies to God, or ungodly; they were only such in a mental consideration. 3. It is true, God loved his chosen ones from eternity to salvation; and from that love, sent his Son to die, to wash, justify, and sanctify them; but this is not their justification, but a fruit of justification in time. When our time is the time of love, and we are dying in our own blood, he washeth us. 4. We behoved to believe from eternity, for we are justified by Faith.

5. All the justified have a real union and interest in Christ, to live by faith, and wait on God in all their troubles by faith; but though their be an union of love in God’s mind from eternity, between the elect and God, yet a complete union between us and Christ, without the Spirit, and without any faith, though it be boldly asserted by Familists, is against the Scripture: for then might wee be born again, and not receive Christ by faith, contrary to the Scripture; and be united to Christ, as branches to the Vine-tree, and not abide in Christ, have Christ dwelling in our heart, and not by faith, contrary to Paul; so might Christ live in us, and we eat and drink him as the true Manna, have the Son, and yet want faith, contrary to the Scriptures. All which, or most of them, prove that we were not justified, when Christ died on the cross.

6. All that are justified, are unseparably sanctified and called, and the blessing of justification hath with it, the receiving of the promise of the Spirit, through faith, and peace with God, through the Lord Jesus Christ, access by faith into grace, whereby we stand, rejoicing in the hope of the glory of God, glorying in tribulation, patience, experience, hope; but many for whom Christ died have none of these, till they be justified by Faith; the distinction of justification in, or before God, or to our own sense by faith, will not help this; for the Scripture no where speaketh of justification, but by faith only; the meritorious price of our justification is paid on the Crosse, but that is not justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.18, pp 19-20.</span></figcaption>

<blockquote><p>1. There are some men who object to all authorized creeds and articles of faith whatsoever, on the ground that they make the name of Christian and the advantages of Christian fellowship dependent on assent to certain positive truths or dogmas, whether more or fewer. There are some writers in the present day who hold the extreme position, that a man may be fully entitled to call himself a Christian, although he does not believe a single fact or doctrine of Christianity, although he denies the historical existence of the Christ of the Gospels, and the Divine origin of the system which He founded. “To declare any one unworthy of the name of Christian,” says Blanco White, “because he does not agree with your belief, is to fall into the intolerance of the articled Churches. The moment that the name Christian is made necessarily to contain its signification belief in certain historical or metaphysical propositions, that moment the name itself becomes a creed: the length of that creed is of little consequence.… No man has a right to reject another from the Christian union on account of any abstract opinion whatever.” “A total disbelief of miracles and prophecy,” observes Mr. Hennel in his Christian Theism, “no more disqualifies a man for bearing with propriety and consistency the Christian name, than any other deduction from the exuberant belief which places Christ in the Triune Godhead.” Upon views such as these it is not needful to dwell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ</cite>, vol. 1 (Edinburgh: T&amp;T Clark, 1868), 316–17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-abebd1591d" data-kw="">
<blockquote><p>Now before I close, let me commend to your notice and practice three or four things.

1. In reading this and such Gospel-Mysteries, you must believe above your Reason natural; so you give God the more honour, Rom. 4.19, 20. The Object of Abraham’s Faith, which was accounted to him for Righteousness, Gen. 15.6. &amp; 18.12. was of that nature, as whereat Sarah laughed; who therein was an Image of Natural Reason.

2. In your Reading and Reasoning of this and such points of eternal moment, ever think that part the safest, which doth least humour man’s pride, and most exalt the Glory of God; since the scope of the Gospel is to shut out boasting, and bring in self-denial, which none can deny.

3. In all your thought-debates about this Subject, seriously bethink your selves what is like to be your opinion of it when you come to die; [Cardinal] Bellarm[ine]. as you heard, professed new Divinity in it before his death.

4. If you have the opportunity to Converse with wounded spirits, and troubled Consciences, with whom it is or hath been as a Specimen of the day of Judgment; they will tell you whether any Righteousness but Jesus Christ made of God unto them Righteousness, could serve their turn in the presence of God, or satisfy their Conscience with a holding peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Serious Readers in The Lord Jesus Christ, the Lord our Righteousness, or, Christ the Righteousness of a Sinner before God delivered in Several Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>For because Paul had taught, that a man is justified by faith without works, hence some inferred, that in whatever manner a man live, it, equally suffices, that he persuade himself that Christ is his Saviour. Which they could have inferred with no plausibility, if that had been evident which the very learned man will have to be so, viz. That Paul, by faith understood evangelical godliness. But because Paul’s words evidently bore that sense, that faith was a thing distinct from all the works of holiness, as in reality it is, hence arose the pretext of calumny. I say, of calumny: for though Paul taught, that works contribute nothing to justification, or to procure a man’s title to salvation; yet he always taught, that they were not only useful, but also necessary to salvation, and that it is impossible, that sanctification should be separated from justification. James treads in the same path, and teaches that it is necessary that he who is justified by faith, should also be justified by works: that is, perform these works which are the evidences and effects of righteousness, and by which it is demonstrated not only before men, but also before God, that he is righteous: according to that of John, “He who doeth righteousness is righteous,” 1 John 3:7. Indeed there is a double justification: one of a man sinful in himself, whereby he is absolved from sin, and declared to have a title to eternal life, on account of Christ’s righteousness apprehended by faith, which Paul inculcated: another of a man, righteous already, sanctified by the Spirit of Christ, and who is declared to be such, by his words and actions. James teaches, that this is so necessary, and so connected with the former, that he is deceived who boasts of that and is destitue of this.</p></blockquote>

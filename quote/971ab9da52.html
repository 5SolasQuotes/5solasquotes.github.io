<main class="wrap"><figure class="quote" id="q-971ab9da52" data-kw="">
<blockquote><p>Although, in relation to the foreknowledge and decree of God, the first Cause, all things come to pass immutably, and infallibly; yet, by the same providence, he ordereth them to fall out, according to the nature of second causes, either necessarily, freely, or contingently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 5.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68f9c7e4a4" data-kw="">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God so far manifest themselves in his providence, that it extendeth itself even to the first fall, and all other sins of angels and men; and that not by a bare permission, but such as hath joined with it a most wise and powerful bounding, and otherwise ordering, and governing of them, in a manifold dispensation, to his own holy ends; yet so, as the sinfulness thereof proceedeth only from the creature, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 5.4</span></figcaption>

</figure><figure class="quote" id="q-0566894940" data-kw="">
<blockquote><p>God, from all eternity, did, by the most wise and holy counsel of his own will, freely, and unchangeably ordain whatsoever comes to pass: yet so, as thereby neither is God the author of sin, nor is violence offered to the will of the creatures; nor is the liberty or contingency of second causes taken away, but rather established.</p></blockquote>

</figure><figure class="quote" id="q-1db2bdaf10" data-kw="Author of sin Permission">
<blockquote><p>The decree which is the cause of the futurition of sin is nevertheless neither its physical cause (by the infusion of evil) nor its ethical cause (by the approbation of it). So although sin necessarily follows the decree, it cannot be said to flow from the decree. The decree does not flow into the thing, nor is it effective of evil, but only permissive and directive.</p></blockquote>

<blockquote><p>Since then they cannot belong to God accidentally, we must necessarily say that they are in him essentially, as immanent acts of his will with a relation and termination outside of him. … Efficient because all future things are for this reason future—that God has decreed them (nor can any prior cause of his works be assigned). Exemplar because the decree of God is (as it were) the idea of all things out of himself.</p></blockquote>

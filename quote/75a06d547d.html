<main class="wrap"><figure class="quote" id="q-75a06d547d" data-kw="">
<blockquote><p>John Baptist and the apostles, Acts 8; Jn. 3, after a confession never asked for their conversion, but baptized, for straightway without delay, even in the night (for so the Word notes, Mt. 21:19; Luke 4:39 &amp; 5:25 &amp; 8:44) the jailor and his house, Acts 16, Cornelius and his house, Acts 10, the eunuch, the multitude of John Baptist’s hearers were baptized members of the universal Church, 1 Cor. 12:12-13, where there was no particular congregation to receive and admit them as members, as Mr. Richard Baxter solidly observes. Nor is it worthy the refuting that the apostles, by an extraordinary power, might baptize them, though to no certain church, but pastors now have not that power: for the apostles baptizing and preaching, and administering the other seal differ not. The apostles preached and baptized in all places as ordinary officers by the same command, Mt. 28:19, by which we teach and baptize in species and nature, from the ordinary pastoral acts of an ordinary minister; they speak with tongues, [and] work miracles as apostles, but they preach and baptize hic &amp; nunc as ordinary officers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658) | bk. 3, ch. 2, ‘Of the First Subject of the Power of the Keys’, p. 293</span></figcaption>

<blockquote><p>1. Where persons are esteemed members of churches by external causes without their own consent, or by parochial cohabitation, they may remove from one church unto another by the removal of their habitation according unto their own discretion. For such cohabitation being the only formal cause of any relation to such a church in particular, upon the ceasing of that cause, the relation ceases of its own accord. 2. Where persons are members of churches by mutual confederation, or express personal consent, causeless departure from them is an evil liable unto many aggravations. 3. But whereas the principal end of all particular churches is edification, there may be many just and sufficient reasons why a person may remove himself from the constant communion of one church unto that of another. And of these reasons he himself is judge on whom it is incumbent to take care of his own edification above all other things. Nor ought the church to deny unto any such persons their liberty desired, peaceably and according unto order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, … (London, 1689), ch. 10, pp. 225-26 Owen was a congregationalist puritan.</span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5265bb184b" data-kw="">
<blockquote><p>3rd Conclusion. A visible profession of the truth and doctrine of godliness is that which essentially constitutes a visible church, and every member of the visible church; Only our [Independent] Brethren and we differ much about the nature of this profession which is required in members added to the Church. Our Brethren will have none members of the visible Church, but such as are satisfactory to the consciences of all the visible church, and give evidences so clear, as the judgement of discerning men can attain unto, that they are truly regenerated. We again do teach that the scandalously wicked are to be cast out of the Church by excommunication, and these of approved piety are undoubtedly members of the visible Church, so these of the middle sort are to be acknowledged members of the Church, though the Church have not a positive certainty of the judgement of charity that they are regenerated, so they be known: 1. to be baptized, 2. that they be free of gross scandals, 3. and profess that they be willing hearers of the doctrine of the Gospel. Such a profession as gives evidences to the positive certainty of the judgment of charity, of sound conversion, is not required to make and constitute a true, visible-Church.</p></blockquote>

<blockquote><p>7th Question: Is it necessary in essence for the Church, or at least as a requirement, that all its members be closely united in terms of locality? Response: Conclusion: It is very convenient, so this should generally be observed, that members are constituted from a common locality, such as from a neighborhood or city. Because such is suggested by the practice of the Apostolic Church. For we do not read that the inhabitants of Cenchreae were included in the Church of the Corinthians, or vice versa. Because if they can observe one another more easily, they can stimulate love and good works, Hebrews 10, and give and receive examples. Because in this way they can best encourage, comfort, and build each other up, 1 Thess. 5:11,14, and indeed as mentioned in Heb. 3:13. Conclusion: Therefore, it should not be proven that without a just necessity, citizens, for example, of our city should be enrolled in the Church of a neighboring city or village, and vice versa. Because this inconvenience exists and affects many looking towards ecclesiastical communion; for the enjoyment of which God primarily instituted gatherings and ecclesiastical societies: See the statements of the preceding problem. Because it breeds confusion, contentions, and divisions among members and churches; it removes harmony and weakens the vigor of ecclesiastical discipline. Hence, ancient canons have prohibited transitions and appeals to other churches for both private believers and clergy. See the Canons of the African Church, especially Canons 23, 28, 54, 105, 125, and notably the Canons and Acts of the Council of Carthage in the year 419, where a synodical letter to Boniface, Bishop of the Roman Church, shows that one should not be summoned from Africa across the sea to the See of Rome. The constitutions, decrees, and practices of the Belgian Churches absolutely prohibit any transfer from one church to another, whether of the same language or a different one, without good permission and dismissal, or written testimony from the church of which one is a member. This especially applies to those transient members around whom the office of correction or even censorship is exercised. Because it smacks of schismatic and factious behavior or carnal curiosity, i.e., factionalism, pride, and disdain; similarly as in the Church of Corinth, 1 Cor. 1:12 &amp; 3:3. Conclusion: If in any case, due to urgent reasons, it is granted to someone or some people to be enrolled in a church outside their place of residence, or to remain in the same church after moving to a nearby city or village, this must be done with the advice and consent of both churches. Conclusion: Another reason is far different when churches are not of the same confession or at least differ to the extent that the advantages of local presence and cohabitation are postponed for the tranquility of conscience and safer and much greater edification. This must be dealt with elsewhere in detail, and we may touch on it below. Conclusion: Where faithful cannot enjoy the benefits of close cohabitation, they should not be circumscribed by the boundaries of that church and excluded from it, just as those who live outside the parish, city, or village should not be forced to join it any more than those who live there. Because the circumstance of location and civil cohabitation is external and accidental to the church; therefore, it is not of its nature or essence. Because it is not a necessary requirement. Ecclesiastical communion acts can be carried out among those members, although not as promptly, abundantly, easily, and excellently. For more and less do not alter the species. Because the status of a clandestine and troubled church often requires such a thing due to persecutions, heresies, schisms, and similar disturbances. Because the defects of other faithful, churches, and ministers in many places leave nothing else for the faithful but to resort to this last refuge, especially since they cannot use the first ship.</p></blockquote>

— Gisbert Voetius, Ecclesiastical Politics tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 59-60 (PDF pp. 62-64)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7th+Question%3A+Is+it+necessary+in+essence+for+the+Church%2C+or+at+least+as+a+requirement%2C+that+all+its+members+be+closely+united+in+terms+of+locality%3F+Response%3A+Conclusion%3A+It+is+very+convenient%2C+so+this+should+generally+be+observed%2C+that+members+are+constituted+from+a+common+locality%2C+such+as+from+a+neighborhood+or+city.+Because+such+is+suggested+by+the+practice+of+the+Apostolic+Church.+For+we+do+not+read+that+the+inhabitants+of+Cenchreae+were+included+in+the+Church+of+the+Corinthians%2C+or+vice+versa.+Because+if+they+can+observe+one+another+more+easily%2C+they+can+stimulate+love+and+good+works%2C+Hebrews+10%2C+and+give+and+receive+examples.+Because+in+this+way+they+can+best+encourage%2C+comfort%2C+and+build+each+other+up%2C+1+Thess.+5%3A11%2C14%2C+and+indeed+as+mentioned+in+Heb.+3%3A13.+Conclusion%3A+Therefore%2C+it+should+not+be+proven+that+without+a+just+necessity%2C+citizens%2C+for+example%2C+of+our+city+should+be+enrolled+in+the+Church+of+a+neighboring+city+or+village%2C+and+vice+versa.+Because+this+inconvenience+exists+and+affects+many+looking+towards+ecclesiastical+communion%3B+for+the+enjoyment+of+which+God+primarily+instituted+gatherings+and+ecclesiastical+societies%3A+See+the+statements+of+the+preceding+problem.+Because+it+breeds+confusion%2C+contentions%2C+and+divisions+among+members+and+churches%3B+it+removes+harmony+and+weakens+the+vigor+of+ecclesiastical+discipline.+Hence%2C+ancient+canons+have+prohibited+transitions+and+appeals+to+other+churches+for+both+private+believers+and+clergy.+See+the+Canons+of+the+African+Church%2C+especially+Canons+23%2C+28%2C+54%2C+105%2C+125%2C+and+notably+the+Canons+and+Acts+of+the+Council+of+Carthage+in+the+year+419%2C+where+a+synodical+letter+to+Boniface%2C+Bishop+of+the+Roman+Church%2C+shows+that+one+should+not+be+summoned+from+Africa+across+the+sea+to+the+See+of+Rome.+The+constitutions%2C+decrees%2C+and+practices+of+the+Belgian+Churches+absolutely+prohibit+any+transfer+from+one+church+to+another%2C+whether+of+the+same+language+or+a+different+one%2C+without+good+permission+and+dismissal%2C+or+written+testimony+from+the+church+of+which+one+is+a+member.+This+especially+applies+to+those+transient+members+around+whom+the+office+of+correction+or+even+censorship+is+exercised.+Because+it+smacks+of+schismatic+and+factious+behavior+or+carnal+curiosity%2C+i.e.%2C+factionalism%2C+pride%2C+and+disdain%3B+similarly+as+in+the+Church+of+Corinth%2C+1+Cor.+1%3A12+%26+3%3A3.+Conclusion%3A+If+in+any+case%2C+due+to+urgent+reasons%2C+it+is+granted+to+someone+or+some+people+to+be+enrolled+in+a+church+outside+their+place+of+residence%2C+or+to+remain+in+the+same+church+after+moving+to+a+nearby+city+or+village%2C+this+must+be+done+with+the+advice+and+consent+of+both+churches.+Conclusion%3A+Another+reason+is+far+different+when+churches+are+not+of+the+same+confession+or+at+least+differ+to+the+extent+that+the+advantages+of+local+presence+and+cohabitation+are+postponed+for+the+tranquility+of+conscience+and+safer+and+much+greater+edification.+This+must+be+dealt+with+elsewhere+in+detail%2C+and+we+may+touch+on+it+below.+Conclusion%3A+Where+faithful+cannot+enjoy+the+benefits+of+close+cohabitation%2C+they+should+not+be+circumscribed+by+the+boundaries+of+that+church+and+excluded+from+it%2C+just+as+those+who+live+outside+the+parish%2C+city%2C+or+village+should+not+be+forced+to+join+it+any+more+than+those+who+live+there.+Because+the+circumstance+of+location+and+civil+cohabitation+is+external+and+accidental+to+the+church%3B+therefore%2C+it+is+not+of+its+nature+or+essence.+Because+it+is+not+a+necessary+requirement.+Ecclesiastical+communion+acts+can+be+carried+out+among+those+members%2C+although+not+as+promptly%2C+abundantly%2C+easily%2C+and+excellently.+For+more+and+less+do+not+alter+the+species.+Because+the+status+of+a+clandestine+and+troubled+church+often+requires+such+a+thing+due+to+persecutions%2C+heresies%2C+schisms%2C+and+similar+disturbances.+Because+the+defects+of+other+faithful%2C+churches%2C+and+ministers+in+many+places+leave+nothing+else+for+the+faithful+but+to+resort+to+this+last+refuge%2C+especially+since+they+cannot+use+the+first+ship.%E2%80%9D%0A%0A%E2%80%94+Gisbert+Voetius%2C+Ecclesiastical+Politics+tr.+by+AI+%28Amsterdam%3A+Joannes+%C3%A0+Waesberge%2C+1663%E2%80%931676%29%2C+vol.+1%2C+%E2%80%98The+Nature+of+the+Instituted+Church%E2%80%99%2C+pp.+59-60+%28PDF+pp.+62-64%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d7fb2af14.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d7fb2af14.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=7th%20Question%3A%20Is%20it%20necessary%20in,they%20cannot%20use%20the%20first%20ship&amp;text=7th%20Question%3A%20Is%20it%20necessary%20in%20essence%20for&amp;text=especially%20since%20they%20cannot%20use%20the%20first%20ship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

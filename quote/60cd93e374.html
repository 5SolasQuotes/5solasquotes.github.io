<main class="wrap"><figure class="quote" id="q-60cd93e374" data-kw="">
<blockquote><p>O Cyaraxe, tò te genos Epainô, kai tén paida, kai dôra; boulomai de, ephê sun tê toû patros gnómê, kai tes metros tanta sunainesai,” (Xenoph., Cyrop., book 8) which is englished in this manner: “Uncle Cyaraxis, I commend the stock and the maid, and the portion; howbeit” (saith he) “by the counsel of my father and mother I will assent unto you:” as if he had said, without their advice I can do nothing. All histories, philosophers and poets in a manner, are full of the practice of this duty (Terent in phormion). And no marvel, for this is agreeable to the common principle in nature, “Whatsoeuer ye would that other men should do unto you, do ye even so to them,” Mt. 7:12. Sampson saw a maid in Timnah that liked him well, notwithstanding he spake not one word to her, but came back to his parents, and desired them to make the marriage for him. They were the first whom he acquainted with his purpose: not as in our days, wherein commonly the parents are the last. Judg. 14:2, “Get her to me, for she pleaseth me well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Fourth Book of Moses, Called Numbers (London, 1618) | This was observed of those that otherwise led no sanctified life, Gen. 21:21, yea of the very heathen themselves. I will produce one testimony among many others, and that is of king Cyrus after he had conquered Babylon, and come home in triumph, his uncle Cyaraxis offered him his daughter unto wife: he thanked his uncle, and praised the maid, and liked the dowry, but for giving consent to marriage, he made him this answer, which I would it were observed and followed of all Christians:</cite>, pp. 1,167-8</span></figcaption>

C+1618%29+%7C+This+was+observed+of+those+that+otherwise+led+no+sanctified+life%2C+Gen.+21%3A21%2C+yea+of+the+very+heathen+themselves.+I+will+produce+one+testimony+among+many+others%2C+and+that+is+of+king+Cyrus+after+he+had+conquered+Babylon%2C+and+come+home+in+triumph%2C+his+uncle+Cyaraxis+offered+him+his+daughter+unto+wife%3A+he+thanked+his+uncle%2C+and+praised+the+maid%2C+and+liked+the+dowry%2C+but+for+giving+consent+to+marriage%2C+he+made+him+this+answer%2C+which+I+would+it+were+observed+and+followed+of+all+Christians%3A%2C+pp.+1%2C167-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60cd93e374.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/60cd93e374.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/quotes-on-the-authority-of-fathers-in-giving-away-their-daughters-in-marriage/#:~:text=O%20Cyaraxe%2C%20t%C3%B2%20te%20genos%20Epain%C3%B4,me%2C%20for%20she%20pleaseth%20me%20well&amp;text=O%20Cyaraxe%2C%20t%C3%B2%20te%20genos%20Epain%C3%B4%2C%20kai%20t%C3%A9n&amp;text=her%20to%20me%2C%20for%20she%20pleaseth%20me%20well" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2476d15112" data-kw="">
<blockquote><p>You will learn from our brother, master Butler, by what circumstances I am hindered and with whom I have to contend within these two days on the subject of divorce. In the commentaries¹ which I lately wrote on the decalogue, I allowed both to the man and his wife an equal liberty of divorce on account of adultery, if they are disposed to use that liberty which Christ has permitted in the gospel of his Church, where the marriage contract is dissolved by adultery. ¹ See a Declaration of the ten holy Commandments of Almighty God, in Hooper’s early writings, Parker Society edition. The passage here referred to will be found in pp. 378, 379, where Hooper complains of the uncharitable construction put upon it. My opponents allow the husband to divorce his wife by reason of adultery, and to marry another; but they do not allow the same liberty to the wife. In your next letter, as you love me, either confirm my opinion, or correct my error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Original Letters relative to the English Reformation, ed. Hastings Robinson for the Parker Society (Cambridge Univ. Press, 1846), vol. 1, Letter 32, Hooper to Bullinger</cite>, p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>2. They [the Jerusalem Church] were under a tie by due proportion, not to keep the Law of Moses and not to be circumcised by any necessity of a Divine Law, but only by permission to use these ceremonies for fear of scandal. 3. They are tied by proportion also to give no offence in things indifferent. 4. Not to reject the gentiles whom the Lord had called to his heavenly kingdom as well as the Jews.</p></blockquote>

</figure><figure class="quote" id="q-c6f6b764a9" data-kw="">
<blockquote><p>As touching matrimonial benediction… through divine institution, it has a necessary use, as we have said. And though the Dr. to make it appear that a pastor’s performing of the same is a thing indifferent, alleges that in Scripture there is nothing commanded thereanent. Yet plain it is from Scripture itself that matrimonial benediction ought to be given by a pastor, for God has commanded his ministers to bless his people (Num. 6), which by just analogy belongs to the ministers of the Gospel; neither is there any ground for making herein a difference betwixt them and the ministers of the Law, but we must conceive the commandment to t•…e both alike to the blessing of God’s people. Unto which ministerial duty of blessing, because no such limits can be set as may exclude matrimonial blessing, therefore they are bound to the performance of it also. And if further we consider that the duty of blessing was performed by the minister of the Lord, even before the law of Moses (Heb. 6:7), we are yet more confirmed to think that the blessing of the people was not commanded in the Law as a thing peculiar and proper to the Levitical priesthood, but as a moral and perpetual duty, belonging to the Lord’s ministers forever. Wherefore, notwithstanding of any abuse of matrimonial benediction among Papists, yet forasmuch as it has a necessary use in the Church and may not (as the controverted ceremonies may) be well spared…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 2</cite>, pp. 24-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>[1.] We do not speak of parents that are so far deprived of judgment, that they are not fit to determine this matter; nor, [2.] Such as have divested themselves of the natural affection of parents, and entertaining an ungrounded prejudice against some of their children, are endeavoring to expose them to ruin, that they may show more kindness to others. These forfeit that right, which is otherwise founded in nature. [3.] If parents, by refusing to comply with the desire of their children, plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them. [4.] The case is vastly different, when applied to children who are so far from being dependent on their parents, that they depend on them. Nevertheless, in this case, some deference and respect ought to be paid to them; and as it is the children’s duty, it may be their interest so to do; since we can hardly suppose, that parents, who depend on their children, would oppose their happiness, in an affair that is apparently contrary to their own interest, if they did not think that they had sufficient reason for it; which ought to be duly weighed, that it may be known, whether their advice is expedient to be complied with, or no. And if in this, or any other instance, children are obliged to act contrary to the will of their parents; they ought to satisfy them, that it is not out of contempt to their authority, but a conscientious regard to the glory of God; and that it is conducive to their happiness, in the opinion of the wisest and best of men.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[1.] We do not speak of parents that are so far deprived of judgment, that they are not fit to determine this matter; nor, [2.] Such as have divested themselves of the natural affection of parents, and entertaining an ungrounded prejudice against some of their children, are endeavoring to expose them to ruin, that they may show more kindness to others. These forfeit that right, which is otherwise founded in nature. [3.] If parents, by refusing to comply with the desire of their children, plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them. [4.] The case is vastly different, when applied to children who are so far from being dependent on their parents, that they depend on them. Nevertheless, in this case, some deference and respect ought to be paid to them; and as it is the children’s duty, it may be their interest so to do; since we can hardly suppose, that parents, who depend on their children, would oppose their happiness, in an affair that is apparently contrary to their own interest, if they did not think that they had sufficient reason for it; which ought to be duly weighed, that it may be known, whether their advice is expedient to be complied with, or no. And if in this, or any other instance, children are obliged to act contrary to the will of their parents; they ought to satisfy them, that it is not out of contempt to their authority, but a conscientious regard to the glory of God; and that it is conducive to their happiness, in the opinion of the wisest and best of men.”

— Thomas Ridgley, Body of Divinity (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B1.%5D+We+do+not+speak+of+parents+that+are+so+far+deprived+of+judgment%2C+that+they+are+not+fit+to+determine+this+matter%3B+nor%2C+%5B2.%5D+Such+as+have+divested+themselves+of+the+natural+affection+of+parents%2C+and+entertaining+an+ungrounded+prejudice+against+some+of+their+children%2C+are+endeavoring+to+expose+them+to+ruin%2C+that+they+may+show+more+kindness+to+others.+These+forfeit+that+right%2C+which+is+otherwise+founded+in+nature.+%5B3.%5D+If+parents%2C+by+refusing+to+comply+with+the+desire+of+their+children%2C+plainly%2C+in+the+judgment+of+the+wisest+of+men%2C+obstruct+their+happiness%2C+and+the+glory+of+God+herein.+Or%2C+if+they+have+no+reason+for+their+not+complying%2C+or+the+reason+given+is+contrary+to+the+laws+of+God%2C+or+the+common+sense+of+all+impartial+judges%3B+especially+if+the+affair+took+its+first+rise+from+them%2C+and+afterwards+they+changed+their+mind%2C+without+sufficient+ground.+This%2C+without+doubt%2C+lessens%2C+or+it+may+be+so+circumstanced%2C+that+it+wholly+takes+away+the+charge+of+sin+in+the+child%2C+in+acting+contrary+to+the+will+of+his+parents%2C+and+fastens+the+guilt+on+them.+%5B4.%5D+The+case+is+vastly+different%2C+when+applied+to+children+who+are+so+far+from+being+dependent+on+their+parents%2C+that+they+depend+on+them.+Nevertheless%2C+in+this+case%2C+some+deference+and+respect+ought+to+be+paid+to+them%3B+and+as+it+is+the+children%E2%80%99s+duty%2C+it+may+be+their+interest+so+to+do%3B+since+we+can+hardly+suppose%2C+that+parents%2C+who+depend+on+their+children%2C+would+oppose+their+happiness%2C+in+an+affair+that+is+apparently+contrary+to+their+own+interest%2C+if+they+did+not+think+that+they+had+sufficient+reason+for+it%3B+which+ought+to+be+duly+weighed%2C+that+it+may+be+known%2C+whether+their+advice+is+expedient+to+be+complied+with%2C+or+no.+And+if+in+this%2C+or+any+other+instance%2C+children+are+obliged+to+act+contrary+to+the+will+of+their+parents%3B+they+ought+to+satisfy+them%2C+that+it+is+not+out+of+contempt+to+their+authority%2C+but+a+conscientious+regard+to+the+glory+of+God%3B+and+that+it+is+conducive+to+their+happiness%2C+in+the+opinion+of+the+wisest+and+best+of+men.%E2%80%9D%0A%0A%E2%80%94+Thomas+Ridgley%2C+Body+of+Divinity+%281731%3B+1814%29%2C+vol.+3%2C+pp.+522-23%2C+commenting+on+Westminster%E2%80%99s+Larger+Catechism&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1106e0da0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1106e0da0a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/quotes-on-the-authority-of-fathers-in-giving-away-their-daughters-in-marriage/#:~:text=1.%5D%20We%20do%20not%20speak%20of,the%20wisest%20and%20best%20of%20men&amp;text=1.%5D%20We%20do%20not%20speak%20of%20parents%20that&amp;text=opinion%20of%20the%20wisest%20and%20best%20of%20men" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-e4653bc431" data-kw="">
<blockquote><p>Scripture, however, says absolutely nothing to the effect that we either should or could make satisfaction to God for our sins in some part either by our works or by our sufferings. It does not say that when the priest in absolution looses and remits sin he should impose penalties as punishment and satisfaction for sins. It says nothing about the punishments of purgatory; it has nothing about a treasury of works of supererogation</p></blockquote>
<figcaption>— <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 4, p. 168</figcaption>
<div class="meta"><a class="tag" href="../topics/rome/justification.html">Rome: Justification</a><a class="tag" href="../topics/good-works/merit-and-reward.html">Merit and Reward</a><a class="tag" href="../topics/priestly-office-satisfaction-and-atonement/nature-of-the-satisfaction.html">Nature of the Satisfaction</a><a class="tag" href="../topics/death-and-the-intermediate-state/purgatory-and-limbo.html">Purgatory and Limbo</a><a class="tag" href="../topics/rome/last-things.html">Rome: Last Things</a></div>

</figure><figure class="quote" id="q-66e59fb3f6" data-kw="">
<blockquote><p>Merit of Condignity removed, they clamor and vociferate until they are hoarse that all the glory of good works is obscured, the necessity of doing good is taken away, and a license for perpetrating every kind of wickedness is indulged to men. But what (in heaven&#x27;s name!) does this itch for lying mean? For we have so proved this to be a notable and transparent lie from the candid confessions of the Papists themselves.</p></blockquote>
<figcaption>— <a href="../authors/thomas-morton.html">Thomas Morton</a>, <cite>Antidote against Merit of Condignity</cite>, p. 5</figcaption>
<div class="meta"><a class="tag" href="../topics/rome/justification.html">Rome: Justification</a><a class="tag" href="../topics/good-works/merit-and-reward.html">Merit and Reward</a><a class="tag" href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></div>

</figure><figure class="quote" id="q-5444a34f69" data-kw="">
<blockquote><p>So then, we do good works, but not for merit— for what would we merit? Rather, we are indebted to God for the good works we do, and not God to us, since God “is at work in [us], enabling [us] both to will and to work for his good pleasure” (Phil. 2:13).</p></blockquote>
<figcaption>— <a href="../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 24</figcaption>
<div class="meta"><a class="tag" href="../topics/rome/justification.html">Rome: Justification</a><a class="tag" href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></div>
<div class="actions"><button class="copy" data-copy="“So then, we do good works, but not for merit— for what would we merit? Rather, we are indebted to God for the good works we do, and not God to us, since God “is at work in [us], enabling [us] both to will and to work for his good pleasure” (Phil. 2:13).”

— Guido de Brès, Belgic Confession, Art. 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+then%2C+we+do+good+works%2C+but+not+for+merit%E2%80%94+for+what+would+we+merit%3F+Rather%2C+we+are+indebted+to+God+for+the+good+works+we+do%2C+and+not+God+to+us%2C+since+God+%E2%80%9Cis+at+work+in+%5Bus%5D%2C+enabling+%5Bus%5D+both+to+will+and+to+work+for+his+good+pleasure%E2%80%9D+%28Phil.+2%3A13%29.%E2%80%9D%0A%0A%E2%80%94+Guido+de+Br%C3%A8s%2C+Belgic+Confession%2C+Art.+24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5444a34f69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5444a34f69.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/belgic-confession" rel="noopener" target="_blank">Read it online · CRCNA</a></div>
</figure><figure class="quote" id="q-76f840e0cf" data-kw="">
<blockquote><p>We cannot by our best works merit pardon of sin or eternal life at the hand of God, by reason of the great disproportion that is between them and the glory to come, and the infinite distance that is between us and God, whom by them we can neither profit nor satisfy for the debt of our former sins; but when we have done all we can, we have done but our duty, and are unprofitable servants (Rom. 3:20; Eph. 2:8–9; Rom. 4:6).</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith</cite>, 1689, 16.5</figcaption>

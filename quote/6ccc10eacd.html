</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7eb132bfe3" data-kw="attributes essence">
<blockquote><p>The divine attributes are the essential properties by which he makes himself known to us who are weak and those by which he is distinguished from creatures; or they are those which are attributed to him according to the measure of our conception in order to explain his nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.5.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a> › <a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general/divisions-of-the-attributes.html">Divisions of the attributes</a></span></div>
<div class="actions"><button class="copy" data-copy="“The divine attributes are the essential properties by which he makes himself known to us who are weak and those by which he is distinguished from creatures; or they are those which are attributed to him according to the measure of our conception in order to explain his nature.”

</figure><figure class="quote" id="q-c563cf8a32" data-kw="">
<blockquote><p>But if any one alleges that the human mind which is finite cannot possibly comprehend divine things which are infinite, we must here properly distinguish–For if by the word ‘comprehend’ be meant to comprehend perfectly, we are quite agreed. For we are entirely of the opinion that a perfect and adequate knowledge of divine matters is quite inconsistent with the imperfection of the human understanding. But if by ‘comprehending’ be understood a clear and convincing knowledge, to a certain degree, the greatness of the objects in such enquiries is by no means inconsistent with this kind of knowledge. For what can the mind conceive greater than eternity? when we attempt to have a full and adequate conception of it, our understanding is quite aborbed by the idea: and yet that there is such a thing as eternity is one of the clearest and most evident truths, as we shall demonstrate in its proper place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-dc93fa3db9" data-kw="">
<blockquote><p>This volume was inspired by Etienne Gilson’s query, made in the early 1950s, as to why medieval authors spoke of God’s being as infinite, a statement found neither in Judaeo-Christian scriptures nor in Greek philosophy… It concludes that infinity is predicated of God not only extrinsically, but also intrinsically: His very being is infinite – a predication resting on an Aristotelian theory of act/potency or on a Platonic version of participation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leo-sweeney.html">Leo Sweeney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Infinity in Greek &amp; Medieval Thought Ref</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>
<div class="actions"><button class="copy" data-copy="“This volume was inspired by Etienne Gilson’s query, made in the early 1950s, as to why medieval authors spoke of God’s being as infinite, a statement found neither in Judaeo-Christian scriptures nor in Greek philosophy… It concludes that infinity is predicated of God not only extrinsically, but also intrinsically: His very being is infinite – a predication resting on an Aristotelian theory of act/potency or on a Platonic version of participation.”

— Leo Sweeney, Divine Infinity in Greek &amp; Medieval Thought Ref">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+volume+was+inspired+by+Etienne+Gilson%E2%80%99s+query%2C+made+in+the+early+1950s%2C+as+to+why+medieval+authors+spoke+of+God%E2%80%99s+being+as+infinite%2C+a+statement+found+neither+in+Judaeo-Christian+scriptures+nor+in+Greek+philosophy%E2%80%A6+It+concludes+that+infinity+is+predicated+of+God+not+only+extrinsically%2C+but+also+intrinsically%3A+His+very+being+is+infinite+%E2%80%93+a+predication+resting+on+an+Aristotelian+theory+of+act%2Fpotency+or+on+a+Platonic+version+of+participation.%E2%80%9D%0A%0A%E2%80%94+Leo+Sweeney%2C+Divine+Infinity+in+Greek+%26+Medieval+Thought+Ref&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc93fa3db9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc93fa3db9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/god#:~:text=This%20volume%20was%20inspired%20by%20Etienne,on%20a%20Platonic%20version%20of%20participation&amp;text=This%20volume%20was%20inspired%20by%20Etienne%20Gilson%E2%80%99s%20query&amp;text=act%2Fpotency%20or%20on%20a%20Platonic%20version%20of%20participation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8fc5fc63ab" data-kw="">
<blockquote><p>But, on account of the impossibility of a fully adequate comprehension of God, nevertheless all conception of God is not to be denied to man, as if finite man is in no way able to form a concept of the infinite, as [Thomas] Hobbes [d. 1679] maintains, against whom Cocquius¹ disputes concerning this matter, in his Anatome Hobbesianismi, locus VI, chapter XII, pages 114-118… ¹ Gisbertus Cocquius (1630-1708) of Utrecht was a Reformed thinker and doctor of philosophy; he opposed Hobbes. Compare also Heidanus² in his Consideratien, etc., pages 134-138, upon occasion of this thesis, proscribed by the curators of the Academy of Leiden, that ‘Men have an adequate idea of God.’ ² Abraham Heidanus (1597-1678) was a Dutch Reformed minister and Cocceian theologian. He served as professor of theology at Leiden from 1648 to 1676, but he was ultimately dismissed for his Cartesianism.</p></blockquote>

<blockquote><p>20. ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ 20. I have my time of offering mercy, and desiring you to entertain it: And if any man hear and obey this call, I will come in by my Spirit, and take habitual possession of him, and have spiritual communion with him, and he with Me. Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical</cite>, ... (1685), on Rev. 3, verse 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-240af0c0f7" data-kw="">
<blockquote><p>(2) If they would comply with his admonitions, he was ready to make them good to their souls: Behold, I stand at the door and knock, etc., v. 20. Here observe, [1.] Christ is graciously pleased by his Word and Spirit to come to the door of the heart of sinners; He draws near to them in a way of mercy, ready to make them a kind visit. [2.] He finds this door shut against Him; the heart of man is by nature shut up against Christ by ignorance, unbelief, sinful prejudices. [3.] When He finds the heart shut, He does not immediately withdraw, but He waits to be gracious, even till his head be filled with the dew. [4.] He uses all proper means to awaken sinners, and to cause them to open to Him: He calls by his Word, He knocks by the impulses of his Spirit upon their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tong.html">William Tong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Henry’s Commentary on the Whole Bible. Tong (1662-1727) was one of the puritans that finished Henry’s Commentary when died, still on Acts. | Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”</span></figcaption>

<blockquote><p>2… Look yonder on the amiable Jesus Christ (for a marriage between whom and thy precious soul I am now wooing). Do but observe his condescending willingness to be united to thee: That great Ahasuerus courts his own captive Esther. The Potter makes suit to his own clay, woos thee, though He wants [needs] thee not; is infinitely happy without thee, yet is not, cannot be satisfied but with thee. Heark how He commands, entreats, begs thee to be reconciled, 2 Cor. 5:20; Swears and pawns his life upon it, that He desires not thy death, Eze. 33:11; seals his oath with his blood; and if after all this thou art fond of thine own damnation and hadst rather be at an agreement with Hell, than with Him; see how the brinish tears trickle down his cheeks, Lk. 19:41-42. He weeps for thee, that dost not, wilt not weep for thyself: Nay, after all this obdurate obstinacy, is resolved still to wait, that He may be gracious, Isa. 30:18. Stands yet and knocks, though his head be wet with rain, and his locks with the dew of the night; fain He would have thee open the door, that He may be come in and sup with thee, and thou with Him, Rev. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lye.html">Thomas Lye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Morning Exercise Methodized</cite>, (London: E.M., 1660), Sermon 18, p. 397</span></figcaption>

<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Catechism</cite>, ... (London: Norton, 1632), pt. 2, 4th Article, pp. 182-83</span></figcaption>

21%E2%80%99+Is+not+this+a+woeful+dishonor+to+the+simplicity+of+the+offer%3F+Was+he+ever+tied+at+all+to+offer+it%3F+and+dost+thou+distrust+his+ingenuous+meaning+in+it%3F+Thy+blood+be+upon+thy+own+head%2C+in+that+thou+choosest+rather+to+smite+the+Lord+to+thy+own+destruction+than+to+set+thy+foot+in+his+ladder+and+put+on+his+cords%2C+that+thou+mightst+come+out%21+The+way+for+thee+is+first+to+step+upward+that+thou+mayst+come+to+the+top+than+to+leap+to+the+top+at+first%2C+to+break+thy+neck+backward.%E2%80%9D%0A%0A%E2%80%94+Daniel+Rogers%2C+A+Practical+Catechism...+%28London%3A+Norton%2C+1632%29%2C+pt.+2%2C+4th+Article%2C+pp.+182-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a4fd6c2c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a4fd6c2c2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=but%20as%20for%20that%20which%20no,first%2C%20to%20break%20thy%20neck%20backward&amp;text=but%20as%20for%20that%20which%20no%20hypocrite%20or&amp;text=top%20at%20first%2C%20to%20break%20thy%20neck%20backward" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The motions of the Spirit are the knockings and rappings at the door of the heart, ‘I stand at the door and knock.’ Now when one raps at the door, we do not only take notice that one knocks, but we command the door to be opened, we are angry with our servants if they do not presently go and open the door. So that is what we should do when the Spirit knocks, allow Him not to stand knocking too long, but make haste to open the door and give Him entrance. The motions of the Spirit are the strivings of the Spirit, as in Gen. 6:3, ‘My Spirit shall not always strive with man.’ He strives in them to bring us to some good or to know some evil. Now when we find Him striving with us, we should not strive against those motions; we should strive with ourselves to let the Spirit of God overcome us in His strivings. We should close with Him and do what He calls for, and second [confirm] His counsels by our obedience.</p></blockquote>

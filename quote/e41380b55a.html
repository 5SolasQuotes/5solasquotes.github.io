<main class="wrap"><figure class="quote" id="q-e41380b55a" data-kw="">
<blockquote><p>But whereas we spake of his actions, done by him either according to his human nature or according to his divine, that yet one and the same and whole Christ performeth the same, it dependeth upon this that the actions were (as the schools say) of supposite natures.

But the diversity of the actions proceedeth from the diverseness of the natures or forms, by which they were done. Sith therefore there is in Christ two natures and but one person, thereon it comes that there is but only one worker, namely whole Christ, two natures that can work and two kind of actions.

Now these actions are called the actions of God and man, not so much for that they proceed from one agent, which is … God and man, as that not only the deity, but also the humanity meet together for this work of our salvation, each joining his actions with the other’s actions. And this is the first and principal force of this hypothetical or personal union, namely, that by it the two natures and their properties and actions are so united in one and the same person, that he, who by the form of God, wherein he hath from the beginning subsisted, is God and by the form of a servant, wherein he now subsisteth, is man, and the same being whole God is whole man, and being whole man is whole God.

And consequently is wholly omnipotent and every where present, and whole inomnipotent and existing in a certain place, and the same whole died and whole by dying destroyed death. And thus it finally followeth that to the obtaining, communicating and applying of our salvation not only his divine nature worketh, but also the human worketh with it.

The second force followeth of the first, namely, that the human nature was made the deity’s instrument united personally thereunto and therefore a most forcible and effectual instrument to bestow all benefits upon us. The third, that by this union this masse or lump of human nature is lift up to such dignity, that we neither can nor ought to bend our actions of adoration, faith, prayer and love to the only deity of Christ, as is declared in the Confession. For we are commanded to worship the Son himself, that is the person Heb. 1, and to believe in him. The fourth force is that, because this human nature is personally united to the divine, therefore the gifts of God conferred upon the same are without measure, …</p></blockquote>

<blockquote><p>First of all, therefore, our position must be explained briefly, which is emphatically this: That the whole Christ is indeed to be worshipped and called upon by us lest we divide the person of Christ (which is unique, consisting of both natures), or separate it. But worship ought not to be directed to the whole of Christ, lest we confuse the natures which remain in the Person unconfused, or regard the human as equal to the divine. Both our worship and invocation are in fact not rendered or directed properly and of themselves to the flesh of Christ itself, that is, to the human nature,¹ but rather to the Deity of Christ itself, nor indeed as it subsists by itself and separate, outside of the assumed human nature (as Nestorius understood, and Cyril refuted in his Anathemas), but instead as it is ever joined together with the same assumed nature in one Person, and remains united. ¹ [Daneau uses strong language below about not directing worship to Christ’s human nature. However, in light of this sentence, and other evidence below, it is clear Daneau is not denying that worship may be materially directed to Christ’s human nature, but only that worship is not to be formally directed to Christ’s human nature.] For in the same way when we praise anyone (for example Apollo, the fellow-worker [Greek] of Paul) as blessed [Greek] and endowed with the greatest faculty of reasoning and understanding, we indeed praise the whole man himself, who consists of body and soul, and we celebrate and proclaim him. Nevertheless the praise and proclamation of that person’s reason and intelligence pertains only to his mind, which nevertheless remains not separately and in itself, but rather conjoined together with its own body. In such a way do we offer our adoration and invocation indeed to the whole Christ (who is God and man) but nevertheless the praise in and of itself, and the invocation and worship, we offer not to the whole of Christ, but rather to his deity, and this we regard, even though it does not subsist piecemeal [Greek], that is, not having a hypostasis of its own, by itself, outside of the human nature. In summary therefore, while we worship Christ, and call upon Him (though here we are talking about religious worship and adoration, but not civil adoration and invocation, a point on which we agree with Chemnitz), neither our invocation nor adoration is directed at, in and of itself, or looks toward, the flesh of Christ itself, even though it remains in union of the Person. And these are some of the many reasons for our opinion.

1. First. The man is cursed (says the prophet, speaking as the very person of God) who puts his trust in man, and makes fleshhis arm (Jeremiah 17:5). Now the flesh of Christ is true flesh, and the man Christ is true man. But the one who adores or calls upon any man in religious worship puts his trust in him whom he thus calls upon and worships. Therefore he who directs his worship to the flesh of Christ itself has been cursed by the mouth of God Himself.

2. Second. They are true idolaters who serve, that is adore or call upon those, who by nature are not Gods (Galatians 4[:8]). Now Christ’s flesh is not by nature God, even though it is hypostatically united to the true God. Therefore those who direct their invocation particularly to it are true idolaters. Butthis word ‘nature’ is of such great significance in this passage of Paul, that even if Chemnitz’s construct of the real communication of the essential properties of deity into the assumed human nature were true, nevertheless the result would not be that on this account Christ’s flesh was an object of worship, which it would [then] be God by grace and [yet] not by nature.

3. Third. Those who adore or call upon their own fellow-slaves who are from among their brothers in religious worship are chastised by the Holy Spirit Himself through his angel and condemned (Revelation 19:10; 22:8). And Christ, as man, is fellow-slave and one of our brothers, even if He is the firstborn. Therefore as man, Christ should not be adored or called upon.

4. Fourth. Only God should be adored (Revelation 19:10). But Christ’s flesh is not God. Therefore.

5. Fifth. He who calls upon a creature or adores one with religious worship, is a blasphemer against God (Deuteronomy 4:6; 10:17; Matthew 4:10). Christ’s flesh remains a creature, even though it is glorified and in the union of the Person of Christ (Augustine on John, sermon 58), therefore he who directs his worship to it blasphemes God.

6. Paul, though he says Christ should be adored, explains that it is to be attributed to Him by reason of his nature, calling Him God (Romans 9:5). Therefore Christ, as God, and not as man, should be adored.

7. The Lord says (Isaiah 43[42:8]), I will not give my glory to another. Therefore the glory of God should not be given to him [that]. And this is the glory of God: religious worship.

8. This was once the error of Nestorius: he taught that Christ, as He is man, should be worshipped together with the Word. Therefore he is a Nestorian who teaches and stresses the same thing today.

9. All the orthodox fathers teach that our invocation and adoration should not be directed to the flesh of Christ itself, even as it remains in the hypostasis of the Son of God, but rather to the very deity of the Son. Therefore he contradicts the orthodox fathers and the pious and learned ancient practice of the Church who desires and thinks and says, when Christ is adored or called upon, that the flesh of Christ itself is also an object of this sort of adoration and invocation. And a little later [in Chemnitz], But I ask, how can it happen that, if Christ’s human nature, just as the divine also, should be worshipped and adored, that it would itself not also be divine, that is, God? And would it follow logically that the distinction between the natures still remain preserved? And a little later, Chemnitz first of all works partly from the very solid and unvanquished foundation by which it is said that no creature ought to be worshipped, and partly by the making sport of the very true and suitable analogy of the crown by which the king is adorned, and which is greeted along with the king himself. Therefore (says Chemnitz), Christ’s flesh should not be adored apart from the union. But whoever said this or thought this? Much to the contrary, the fathers themselves, whose testimonies I have offered, deny, and clearly so, that Christ’s flesh, even as it remains in the union, ought to have our adoration directed to it. Therefore Chemnitz seeks precedence, and perverts the fathers, while he wishes to twist their opinions to his own, though they teach so clearly that not even united to the Word [logos] is the flesh in Christ an object of our worship. And the reason is, since the flesh of Christ, even in the union, is true flesh, and truly creature. And so it is never to be adored with religious worship.</p></blockquote>

%2C+and+we+celebrate+and+proclaim+him.+Nevertheless+the+praise+and+proclamation+of+that+person%E2%80%99s+reason+and+intelligence+pertains+only+to+his+mind%2C+which+nevertheless+remains+not+separately+and+in+itself%2C+but+rather+conjoined+together+with+its+own+body.+In+such+a+way+do+we+offer+our+adoration+and+invocation+indeed+to+the+whole+Christ+%28who+is+God+and+man%29+but+nevertheless+the+praise+in+and+of+itself%2C+and+the+invocation+and+worship%2C+we+offer+not+to+the+whole+of+Christ%2C+but+rather+to+his+deity%2C+and+this+we+regard%2C+even+though+it+does+not+subsist+piecemeal+%5BGreek%5D%2C+that+is%2C+not+having+a+hypostasis+of+its+own%2C+by+itself%2C+outside+of+the+human+nature.+In+summary+therefore%2C+while+we+worship+Christ%2C+and+call+upon+Him+%28though+here+we+are+talking+about+religious+worship+and+adoration%2C+but+not+civil+adoration+and+invocation%2C+a+point+on+which+we+agree+with+Chemnitz%29%2C+neither+our+invocation+nor+adoration+is+directed+at%2C+in+and+of+itself%2C+or+looks+toward%2C+the+flesh+of+Christ+itself%2C+even+though+it+remains+in+union+of+the+Person.+And+these+are+some+of+the+many+reasons+for+our+opinion.+1.+First.+The+man+is+cursed+%28says+the+prophet%2C+speaking+as+the+very+person+of+God%29+who+puts+his+trust+in+man%2C+and+makes+fleshhis+arm+%28Jeremiah+17%3A5%29.+Now+the+flesh+of+Christ+is+true+flesh%2C+and+the+man+Christ+is+true+man.+But+the+one+who+adores+or+calls+upon+any+man+in+religious+worship+puts+his+trust+in+him+whom+he+thus+calls+upon+and+worships.+Therefore+he+who+directs+his+worship+to+the+flesh+of+Christ+itself+has+been+cursed+by+the+mouth+of+God+Himself.+2.+Second.+They+are+true+idolaters+who+serve%2C+that+is+adore+or+call+upon+those%2C+who+by+nature+are+not+Gods+%28Galatians+4%5B%3A8%5D%29.+Now+Christ%E2%80%99s+flesh+is+not+by+nature+God%2C+even+though+it+is+hypostatically+united+to+the+true+God.+Therefore+those+who+direct+their+invocation+particularly+to+it+are+true+idolaters.+Butthis+word+%E2%80%98nature%E2%80%99+is+of+such+great+significance+in+this+passage+of+Paul%2C+that+even+if+Chemnitz%E2%80%99s+construct+of+the+real+communication+of+the+essential+properties+of+deity+into+the+assumed+human+nature+were+true%2C+nevertheless+the+result+would+not+be+that+on+this+account+Christ%E2%80%99s+flesh+was+an+object+of+worship%2C+which+it+would+%5Bthen%5D+be+God+by+grace+and+%5Byet%5D+not+by+nature.+3.+Third.+Those+who+adore+or+call+upon+their+own+fellow-slaves+who+are+from+among+their+brothers+in+religious+worship+are+chastised+by+the+Holy+Spirit+Himself+through+his+angel+and+condemned+%28Revelation+19%3A10%3B+22%3A8%29.+And+Christ%2C+as+man%2C+is+fellow-slave+and+one+of+our+brothers%2C+even+if+He+is+the+firstborn.+Therefore+as+man%2C+Christ+should+not+be+adored+or+called+upon.+4.+Fourth.+Only+God+should+be+adored+%28Revelation+19%3A10%29.+But+Christ%E2%80%99s+flesh+is+not+God.+Therefore.+5.+Fifth.+He+who+calls+upon+a+creature+or+adores+one+with+religious+worship%2C+is+a+blasphemer+against+God+%28Deuteronomy+4%3A6%3B+10%3A17%3B+Matthew+4%3A10%29.+Christ%E2%80%99s+flesh+remains+a+creature%2C+even+though+it+is+glorified+and+in+the+union+of+the+Person+of+Christ+%28Augustine+on+John%2C+sermon+58%29%2C+therefore+he+who+directs+his+worship+to+it+blasphemes+God.+6.+Paul%2C+though+he+says+Christ+should+be+adored%2C+explains+that+it+is+to+be+attributed+to+Him+by+reason+of+his+nature%2C+calling+Him+God+%28Romans+9%3A5%29.+Therefore+Christ%2C+as+God%2C+and+not+as+man%2C+should+be+adored.+7.+The+Lord+says+%28Isaiah+43%5B42%3A8%5D%29%2C+I+will+not+give+my+glory+to+another.+Therefore+the+glory+of+God+should+not+be+given+to+him+%5Bthat%5D.+And+this+is+the+glory+of+God%3A+religious+worship.+8.+This+was+once+the+error+of+Nestorius%3A+he+taught+that+Christ%2C+as+He+is+man%2C+should+be+worshipped+together+with+the+Word.+Therefore+he+is+a+Nestorian+who+teaches+and+stresses+the+same+thing+today.+9.+All+the+orthodox+fathers+teach+that+our+invocation+and+adoration+should+not+be+directed+to+the+flesh+of+Christ+itself%2C+even+as+it+remains+in+the+hypostasis+of+the+Son+of+God%2C+but+rather+to+the+very+deity+of+the+Son.+Therefore+he+contradicts+the+orthodox+fathers+and+the+pious+and+learned+ancient+practice+of+the+Church+who+desires+and+thinks+and+says%2C+when+Christ+is+adored+or+called+upon%2C+that+the+flesh+of+Christ+itself+is+also+an+object+of+this+sort+of+adoration+and+invocation.+And+a+little+later+%5Bin+Chemnitz%5D%2C+But+I+ask%2C+how+can+it+happen+that%2C+if+Christ%E2%80%99s+human+nature%2C+just+as+the+divine+also%2C+should+be+worshipped+and+adored%2C+that+it+would+itself+not+also+be+divine%2C+that+is%2C+God%3F+And+would+it+follow+logically+that+the+distinction+between+the+natures+still+remain+preserved%3F+And+a+little+later%2C+Chemnitz+first+of+all+works+partly+from+the+very+solid+and+unvanquished+foundation+by+which+it+is+said+that+no+creature+ought+to+be+worshipped%2C+and+partly+by+the+making+sport+of+the+very+true+and+suitable+analogy+of+the+crown+by+which+the+king+is+adorned%2C+and+which+is+greeted+along+with+the+king+himself.+Therefore+%28says+Chemnitz%29%2C+Christ%E2%80%99s+flesh+should+not+be+adored+apart+from+the+union.+But+whoever+said+this+or+thought+this%3F+Much+to+the+contrary%2C+the+fathers+themselves%2C+whose+testimonies+I+have+offered%2C+deny%2C+and+clearly+so%2C+that+Christ%E2%80%99s+flesh%2C+even+as+it+remains+in+the+union%2C+ought+to+have+our+adoration+directed+to+it.+Therefore+Chemnitz+seeks+precedence%2C+and+perverts+the+fathers%2C+while+he+wishes+to+twist+their+opinions+to+his+own%2C+though+they+teach+so+clearly+that+not+even+united+to+the+Word+%5Blogos%5D+is+the+flesh+in+Christ+an+object+of+our+worship.+And+the+reason+is%2C+since+the+flesh+of+Christ%2C+even+in+the+union%2C+is+true+flesh%2C+and+truly+creature.+And+so+it+is+never+to+be+adored+with+religious+worship.%E2%80%9D%0A%0A%E2%80%94+Lambert+Daneau%2C+Examination+of+the+Book+of+Dr.+Chemnitz+regarding+the+Two+Natures+in+Christ%2C+%281581%29+as+quoted+and+translated+in+Jakob+Andreae+%26+Theodore+Beza%2C+Lutheranism+vs.+Calvinism%3A+the+Classic+Debate+at+the+Colloquy+of+Montbeliard+1586+ed.+Jeffrey+Mallinson+tr.+Clinton+J.+Armstrong+%28Concordia+Publishing+House%2C+2017%29%2C+pp.+404-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1619c7d1a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1619c7d1a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-grounds-of-christ-the-mediator-receiving-divine-worship/#:~:text=First%20of%20all%2C%20therefore%2C%20our%20position,to%20be%20adored%20with%20religious%20worship&amp;text=First%20of%20all%2C%20therefore%2C%20our%20position%20must%20be&amp;text=is%20never%20to%20be%20adored%20with%20religious%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>No consideration of flesh or human nature is necessary. Much to the contrary, it should be utterly removed from religious adoration of God and the divine nature, even in Christ Himself. Since this honor is owed to God alone (Deuteronomy 6[:14-15]; Matthew 4[:10]).</p></blockquote>

<blockquote><p>As unto the nature of it, it is a kingdom, a heavenly, spiritual state, under the rule of Jesus Christ, whom God hath anointed, and set his king upon his holy hill of Zion, Ps. ii. 6, 7. The state of the gospel, and the rule of Christ therein, were represented and promised from the beginning under the name and notion of a kingdom, being properly so. See Isa. ix. 7.

The kingly office of Christ, and his kingdom, were the common faith of the church of the old testament and the new. Whoever believed the promise of the Messiah, believed that he should be a king, and should have an everlasting kingdom, however the church of the Jews had lost the true notion of it in the latter days. This kingdom in the Scripture is everywhere called “the kingdom of God,” to distinguish it from all other dominions and kingdoms of the world, — the kingdom wherein Christ proceeds in the name and majesty of God for all the ends of his glory, and the salvation of the church.

And this kingdom is usually distinguished into the kingdom of grace and the kingdom of glory; but improperly. For although the saints that are now in glory do belong unto this kingdom, by virtue of the communion that is between them and the church below in Christ as their common head, yet this kingdom of Christ shall cease when the state of glory shall fully take place. So the apostle expressly declares, 1 Cor. xv. 24–28. Wherefore the kingdom of God, the kingdom of heaven, so often mentioned in the Scripture, is that which we call the kingdom of God only. It is true, the saints do and shall reign in heaven, whereon that state may be called the kingdom of glory; but the promised kingdom of the Messiah, is that rule which is to be continued unto the end of this world, and no longer. And at present those in heaven and those on earth do constitute but one kingdom, though they are in various conditions therein.

This kingdom, then, is that rule of Christ in and over the gospel state of the church, which the apostle hath proved to be more excellent than that of the law. Hereunto belong all the light, liberty, righteousness, and peace, which by the gospel we are made partakers of, with all the privileges above the law insisted on by the apostle. Christ is the king, the gospel is his law, all believers are his subjects, the Holy Spirit is its administrator, and all the divine treasures of grace and mercy are its revenue. The reader may see a delineation of this kingdom in our exposition on chap. i. 2. This is the kingdom which is here intended, the present actual participation whereof is made the foundation of the exhortation ensuing, being undeniably cogent unto that end.

(2) This especial property of this kingdom is, that it is ἀσάλευτος such as cannot be shaken, or moved. It is true of it universally, and only, it cannot be moved in any sense, by any ways or means; and this is the only kingdom that cannot be moved. To speak of the unshaken, unmovable kingdom, is all one as if we expressly mentioned the kingdom of Christ, seeing that only is so. All other kingdoms have been, or shall be, shaken and overturned; all boastings and expectations to the contrary are but vain. No dominion ever so dreamed of eternity as did the Roman empire; but it hath not only been shaken, but broken to pieces, and scattered like chaff before the wind. See Dan. ii. 44, vii. 14, 27. No external opposition shall ever be able to shake or move this kingdom. The “gates of hell shall not prevail against it,” Matt. xvi. 18. No internal decays shall ruin it. The spring of it is in Him who lives for ever, and who hath the keys of hell and death.

These things are true, the kingdom of Christ is thus immovable: but that which is here peculiarly intended is, that it is not obnoxious unto such a shaking and removal as the church-state was under the old testament; that is, God himself will never make any alteration in it, nor ever introduce another church-state or worship. God hath put the last hand, the hand of his only Son, unto all revelations and institutions. No addition shall be made unto what he hath done, nor alteration in it. No other way of calling, sanctifying, ruling, and saving of the church, shall ever be appointed or admitted; for it is here called an immovable kingdom in opposition unto the church-state of the Jews, which God himself first shook, and then took away, for it was ordained only for a season.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1684; 7 vols, Edinburgh: Johnston and Hunter, 1855), 7: 370-71.</span></figcaption>

— John Owen, An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (1684; 7 vols, Edinburgh: Johnston and Hunter, 1855), 7: 370-71.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+unto+the+nature+of+it%2C+it+is+a+kingdom%2C+a+heavenly%2C+spiritual+state%2C+under+the+rule+of+Jesus+Christ%2C+whom+God+hath+anointed%2C+and+set+his+king+upon+his+holy+hill+of+Zion%2C+Ps.+ii.+6%2C+7.+The+state+of+the+gospel%2C+and+the+rule+of+Christ+therein%2C+were+represented+and+promised+from+the+beginning+under+the+name+and+notion+of+a+kingdom%2C+being+properly+so.+See+Isa.+ix.+7.%0A%0AThe+kingly+office+of+Christ%2C+and+his+kingdom%2C+were+the+common+faith+of+the+church+of+the+old+testament+and+the+new.+Whoever+believed+the+promise+of+the+Messiah%2C+believed+that+he+should+be+a+king%2C+and+should+have+an+everlasting+kingdom%2C+however+the+church+of+the+Jews+had+lost+the+true+notion+of+it+in+the+latter+days.+This+kingdom+in+the+Scripture+is+everywhere+called+%E2%80%9Cthe+kingdom+of+God%2C%E2%80%9D+to+distinguish+it+from+all+other+dominions+and+kingdoms+of+the+world%2C+%E2%80%94+the+kingdom+wherein+Christ+proceeds+in+the+name+and+majesty+of+God+for+all+the+ends+of+his+glory%2C+and+the+salvation+of+the+church.%0A%0AAnd+this+kingdom+is+usually+distinguished+into+the+kingdom+of+grace+and+the+kingdom+of+glory%3B+but+improperly.+For+although+the+saints+that+are+now+in+glory+do+belong+unto+this+kingdom%2C+by+virtue+of+the+communion+that+is+between+them+and+the+church+below+in+Christ+as+their+common+head%2C+yet+this+kingdom+of+Christ+shall+cease+when+the+state+of+glory+shall+fully+take+place.+So+the+apostle+expressly+declares%2C+1+Cor.+xv.+24%E2%80%9328.+Wherefore+the+kingdom+of+God%2C+the+kingdom+of+heaven%2C+so+often+mentioned+in+the+Scripture%2C+is+that+which+we+call+the+kingdom+of+God+only.+It+is+true%2C+the+saints+do+and+shall+reign+in+heaven%2C+whereon+that+state+may+be+called+the+kingdom+of+glory%3B+but+the+promised+kingdom+of+the+Messiah%2C+is+that+rule+which+is+to+be+continued+unto+the+end+of+this+world%2C+and+no+longer.+And+at+present+those+in+heaven+and+those+on+earth+do+constitute+but+one+kingdom%2C+though+they+are+in+various+conditions+therein.%0A%0AThis+kingdom%2C+then%2C+is+that+rule+of+Christ+in+and+over+the+gospel+state+of+the+church%2C+which+the+apostle+hath+proved+to+be+more+excellent+than+that+of+the+law.+Hereunto+belong+all+the+light%2C+liberty%2C+righteousness%2C+and+peace%2C+which+by+the+gospel+we+are+made+partakers+of%2C+with+all+the+privileges+above+the+law+insisted+on+by+the+apostle.+Christ+is+the+king%2C+the+gospel+is+his+law%2C+all+believers+are+his+subjects%2C+the+Holy+Spirit+is+its+administrator%2C+and+all+the+divine+treasures+of+grace+and+mercy+are+its+revenue.+The+reader+may+see+a+delineation+of+this+kingdom+in+our+exposition+on+chap.+i.+2.+This+is+the+kingdom+which+is+here+intended%2C+the+present+actual+participation+whereof+is+made+the+foundation+of+the+exhortation+ensuing%2C+being+undeniably+cogent+unto+that+end.%0A%0A%282%29+This+especial+property+of+this+kingdom+is%2C+that+it+is+%E1%BC%80%CF%83%CE%AC%CE%BB%CE%B5%CF%85%CF%84%CE%BF%CF%82+such+as+cannot+be+shaken%2C+or+moved.+It+is+true+of+it+universally%2C+and+only%2C+it+cannot+be+moved+in+any+sense%2C+by+any+ways+or+means%3B+and+this+is+the+only+kingdom+that+cannot+be+moved.+To+speak+of+the+unshaken%2C+unmovable+kingdom%2C+is+all+one+as+if+we+expressly+mentioned+the+kingdom+of+Christ%2C+seeing+that+only+is+so.+All+other+kingdoms+have+been%2C+or+shall+be%2C+shaken+and+overturned%3B+all+boastings+and+expectations+to+the+contrary+are+but+vain.+No+dominion+ever+so+dreamed+of+eternity+as+did+the+Roman+empire%3B+but+it+hath+not+only+been+shaken%2C+but+broken+to+pieces%2C+and+scattered+like+chaff+before+the+wind.+See+Dan.+ii.+44%2C+vii.+14%2C+27.+No+external+opposition+shall+ever+be+able+to+shake+or+move+this+kingdom.+The+%E2%80%9Cgates+of+hell+shall+not+prevail+against+it%2C%E2%80%9D+Matt.+xvi.+18.+No+internal+decays+shall+ruin+it.+The+spring+of+it+is+in+Him+who+lives+for+ever%2C+and+who+hath+the+keys+of+hell+and+death.%0A%0AThese+things+are+true%2C+the+kingdom+of+Christ+is+thus+immovable%3A+but+that+which+is+here+peculiarly+intended+is%2C+that+it+is+not+obnoxious+unto+such+a+shaking+and+removal+as+the+church-state+was+under+the+old+testament%3B+that+is%2C+God+himself+will+never+make+any+alteration+in+it%2C+nor+ever+introduce+another+church-state+or+worship.+God+hath+put+the+last+hand%2C+the+hand+of+his+only+Son%2C+unto+all+revelations+and+institutions.+No+addition+shall+be+made+unto+what+he+hath+done%2C+nor+alteration+in+it.+No+other+way+of+calling%2C+sanctifying%2C+ruling%2C+and+saving+of+the+church%2C+shall+ever+be+appointed+or+admitted%3B+for+it+is+here+called+an+immovable+kingdom+in+opposition+unto+the+church-state+of+the+Jews%2C+which+God+himself+first+shook%2C+and+then+took+away%2C+for+it+was+ordained+only+for+a+season.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews.+With+Preliminary+Exercitations%2C+ed.+W.+H.+Goold+%281684%3B+7+vols%2C+Edinburgh%3A+Johnston+and+Hunter%2C+1855%29%2C+7%3A+370-71.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbfbbcbc4a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bfbbcbc4a7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/10/john-owen-on-christs-mediatorial-kingdom/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-dd95c87f66" data-kw="">
<blockquote><p>When he brings in the first-begotten into the world, which was at the time of the incarnation, he says, ‘Let all the angels of God worship Him,’ Heb. 1:6. And upon his resurrection from the dead, ‘God has given Him a name which is above every name; that at the name of Jesus every knee should bow,’ that is, in a way of religious adoration, Phil. 2:9-10; and though Christ, as man, is not the object of such adoration, yet what He has done in the human nature, is a motive and argument why blessing and honor should be given to his Person, having both natures united in Him; ‘Worthy is the Lamb that was slain, to receive power, etc.’ Rev. 5:12-13.</p></blockquote>

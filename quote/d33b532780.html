<main class="wrap"><figure class="quote" id="q-d33b532780" data-kw="">
<blockquote><p>Baptism saves, therefore, no salvation without baptism, so do Anabaptists reason, as says [John] Gerhardus (Common Places, tome 6, Of the Ecclesiastical Ministry, n. 64, p. 71); so reasons [Faustus] Socinus (Tract on the Church, p. 14), averring, It is a work of charity necessary to salvation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 1, p. 31</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5323c4e91a" data-kw="">
<blockquote><p>…in favor of the baptism of infant servants, from the cessation of the Jewish Church to the times of Augustine, we can only say that Augustine speaks of it as a custom in existence; that it resulted, in his day, from the conviction that baptism came in place of circumcision, a conviction which we can trace up through the earliest fathers… …we commend the resolutions of the Synod of South Carolina… ‘1. Resolved, That it is the duty of believing masters to train up their servants, as well as their children, in the nurture and admonition of the Lord. 2. Resolved, That the principles of the Abrahamic covenant, as to the cirucmcision of servants, is till in force in reference to the infant offspring of those who stand to us in this relation; and that as baptism succeeds to circumcision, it is the duty of masters to dedicate such servants to God in the ordinance of baptism, and to do all in their power to train them up in a knowledge of the truth and in the way of salvation through Christ. 3. Resolved, That though there are great and manifest dificulties in carrying out the principles of these resolutions, these difficulties have chiefly resulted from the long continued neglect of believing masters and of the church, and that these difficulties must be gradually overcome by continued and persevering efforts.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-howe.html">George Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 3, ‘The Baptism of Servants’ in Southern Presbyterian Review, no. 1 (June 1847), pp. 63-102</span></figcaption>

</figure><figure class="quote" id="q-a9e9bee965" data-kw="">
<blockquote><p>2. There is no such moral necessity of the sacraments as there is of the ministry of the Word, and consequently of some use of the keys where a scandalous person may infect the Lord’s flock. For where vision ceases the people perish, but it is never said, where baptism ceases the people perish; and therefore uncalled ministers in case of necessity, without ordination or calling from a presbytery, may preach and take on them the holy ministry and exercise power of jurisdiction, because the necessity of the souls of a congregation in a remote island requires so, but I hope no necessity in any [of] the most extraordinary case requires that a midwife may baptize, or that a private man remaining a private man may celebrate the Lord’s Supper to the Church without any calling from the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, pp. 454-455</span></figcaption>

</figure><figure class="quote" id="q-e4c1b32671" data-kw="">
<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-van-hoeke.html">Peter van Hoeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’</cite>, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth, p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-6523b95005" data-kw="">
<blockquote><p>Neither is that after-consent by acceptance and submission which Mr. [John] Robinson speaks of [with reference to a pastor and his hearers] so slight a matter for this purpose as he would make it. For as in wedlock, the after-consent of parents or parties does often make that a lawful state of marriage which before and without that was none: and in government, acceptance and submission does make him a king which before was a tyrant, though in their nature these actions be rather consequences than causes of that calling; so is it [sometimes] betwixt minister and people.</p></blockquote>

<blockquote><p>15. When the [English] Parliament’s armies were worsted and weakened by the King [Charles I], and they found themselves in danger of being overcome, they entreated help from the Scots, who taking the advantage of their straits, brought in the [Solemn League and] Covenant as the condition of their help; which the Parliament rather accepted [in 1643] than they would lose them, which at first was imposed on none by force. But (to pass by all other considerations) was judged by many wise men, to be an occasion of division, as making the opposition to prelacy to be the terms of the kingdom’s unity and concord, when they might know that the king and a great, if not the greatest part of the kingdom, were of the contrary mind; and so it was thought to be (as the Papal terms of unity) a means of unavoidable division: But others thought that because it tied them to no endeavors, but in their places and callings, they might take it.

16. The Assembly of divines at Westminster were men that had lived in conformity, except about eight or nine of them and the Scots: But being such as thought conformity lawful in case of deprivation, but the things imposed to be a snare, which should be removed if it could be lawfully done, they also received the Covenant, but were divided about the sense of the word ‘prelacy,’ many professing their judgment to be for moderate episcopacy; whereupon the describing additions ‘Archbishops, bishops, deans, archdeacons’ were added. And upon such a profession that it disclaimed not all episcopacy, Mr. [Thomas] Coleman is said to have given the Covenant to the House of Lord’s…

17. This Covenant and vow was taken by the Parliament and by their garrisons and soldiers that would voluntarily take it, as a test whom they would trust; the rest being had in suspension: And after the wars, by such as were ordained ministers and by the king’s adherents when they made their compositions: so far was it afterward imposed. But many ministers and gentlemen refused it, and so did Cromwell ‘s soldiers, and in many counties few did take it. … 32. The persons that were silenced [in the Great Ejection of 1662] were not of one mind and measure about all the things imposed on them:

1. Some of them were episcopal, and for as much as Richard Hooker writes for, and were against the Covenant (and never took it) and the Parliament’s War, and were for the liturgy and ceremonies and had conformed had these been all that had been imposed, who yet were cast out of fellowships and ministry: Yea some had suffered for the king, and been ruined in their patrimony, some imprisoned for him, and some had been in arms for him.

2. Besides these, and other episcopal nonconformists, some and very many, and we think the greatest part of any one, were such disengaged pacificators as we before mentioned about associations:

3. Some were for the presbyterian government, and 4. Some for that called Independent, which were comparatively but few. … … 35. As to the late civil wars which some most loudly charge on the nonconformists, this is the truth, that the several parties charge the beginning of that war on one another… The truth is: …3. That some few that had been in the king’s army or cause, and that were sufferers for him, and were against the Covenant and the Parliament’s war, were nonconformists… … 37. The 2,000 silenced [in 1662] were not a quarter of the ministers of England, who were in possession before the return of the bishops: so that it is evident that above three-fourth parts of the ministers that kept in under the Parliament and Protector [Cromwell] (notwithstanding Covenant, [Westminster’s] Directory and all) did prove conformists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 7, pp.</span></figcaption>

<blockquote><p>VIII Rule. We must give place to the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times: but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul… he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but ony in general against false gods, saying that ‘they be no gods that are made with hands,’ v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience</cite>, (Cambridge. 1606), bk. 3, ch. 2, pp. 481-84</span></figcaption>

<blockquote><p>5. …therefore, this reason in the text [Rom. 13] will prove that the man who is king, in so far as he does those things that are against his office [sinful], may be resisted; and that in these we are not to be subject, but only are we to be subject to his power and royal authority, in abstracto [in office], in so far as, according to his office, he is not a terror to good works, but evil.</p></blockquote>

</figure><figure class="quote" id="q-2d2531b3c4" data-kw="">
<blockquote><p>1 Pet. 2:13 ‘Submit yourselves to every ordinance of man for the Lord’s sake: whether it be to the king, as supreme…’ …But this creature, or ordinance, here is to be understood of the magistrate; (as appears by the following words), which is called human, not as if magistracy were not an ordinance of God, (for, Romans 13:1, ‘the powers that are are said to be ordained of God’) but either because it is only among men, and proper to them; or because it is of man secondarily and instrumentally, though of God primarily and originally, God making use of the ministry of men in bringing them into the magistracy… ‘For the Lord’s sake’; for God’s sake, who commands this obedience; and gave them the authority, and is represented by them, and honored by that obedience which is yielded to them in all things agreeable to his will. The phrase seems to be of the same import with that of being obedient in the Lord, Ephesians 6:1. ‘To the king’; to Caesar, the then supreme magistrate, under whose jurisdiction the Jewish Christians were; and this being a general command extending to all Christians, it follows, that obedience is due from them to those chief magistrates whose subjects respectively they are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations on the Holy Bible</cite></span></figcaption>

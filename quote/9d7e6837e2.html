<main class="wrap"><figure class="quote" id="q-9d7e6837e2" data-kw="">
<blockquote><p>Answer [of Rutherford]: It is a calumnious consequence: pastors and teachers will not be judged by the magistrate in things merely ecclesistical, to stand to his ecclesiastical decision, as if his lips, ex officio, should preserve knowledge; Therefore, pastors and doctors do exempt themselves from the lawful power of the magistrate in his civil judging by the sword; it is as if they would say, Churchmen refuse to submit to an usurped and unlawful power of the magistrate; Therefore, they refuse to submit to their lawful power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 27, p. 615</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68a7082485" data-kw="">
<blockquote><p>3. And if communicants will be at the charge of maintaining a pastor whom they can better trust their souls with, than him whom the patron chooses for them, the orthodox or tolerating magistrate must see that he be not an heretic, that does more hurt than good; and must keep them under the laws of loyalty and peace, and see that they sow not sedition, and revile not others under pretense of worshipping God.

4. And no men should, without necessity, lose the advantages of a public ministry which the most consent to, and which has the magistrates countenance and maintenance; because gathering singular churches within parish-bounds, seems some accusation of the parish-minister or Church; and such Churches are oft tempted to envy and censoriousness, and are usually envied and censured by others: And unity is much of our strength and beauty. But in case of necessity it may be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts</cite>, ... (1684), Unnecessary Separating Disowned, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-dcfe852884" data-kw="">
<blockquote><p>…If any person on Sunday shall himself be found labouring at his own or any other trade or calling, or shall employ his apprentices, servants or slaves in labour, or other business, except it be in the ordinary household offices of daily necessity, or other work of necessity or charity, he shall forfeit the sum of ten shillings for every such offence, deeming every apprentice, servant, or slave so employed, and every day he shall be so employed as constituting a distinct offence.† † Report, p. 59. Text of Act as adopted is in Hening, xii, 336–7. Bill was presented by Madison 31 Oct. 1785 and on 14 Dec. postponed to next session; at the Oct. 1786 session it was brought up again, amended by both House and Senate, and passed on 27 Nov. (JHD, Oct. 1785, 1828 edn., p. 12–15, 92; same, Oct. 1786, p. 16–17, 49, 52, 64, 127). The Act as adopted and the Bill as proposed agree except as noted below; Act was suspended until 1 July 1787 (Hening, xii, 410–11).</p></blockquote>

<blockquote><p>…restraints on liberty were advocated by the biggest names of the early Particular Baptist community (Spilsbury, Kiffin, Jessey, Knollys, Tombes, etc.) as well as some of the biggest names to follow (Keach and Gill). The centuries of Baptists that followed tended to have few, if any, qualms about the remaining restrictions that existed after they had achieved the right to worship God as they pleased. Hence, the Particular Baptist community can be characterized as one that advocated for moderation: religious freedom but with common-sense restrictions against blatant immorality. The role of church and state are distinct, but both of them must acknowledge God according to their sphere and jurisdiction.</p></blockquote>

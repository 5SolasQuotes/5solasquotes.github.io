</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31cea46497" data-kw="">
<blockquote><p>The universal moral law either impressed by God upon the mind of all people or immediately discerned by the reason in its encounter with the order of nature. The natural law was therefore available even to those pagans who did not have the advantage of the Sinaitic revelation and the lex Mosaica [Law of Moses], with the result that they were left without excuse in their sins, convicted by conscientia [conscience]. The scholastics argue the identity of the lex naturalis [Natural Law] with the lex Mosaica or lex moralis [Moral Law] quod substantiam, according to substance, and distinguish them quod formam, according to form. The lex naturalis is inward, written on the heart and therefore obscure, whereas the lex Mosaica is revealed externally and written on tablets and thus of greater clarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Greek and Latin Theological Terms 1st</cite>, ed. (Baker, 1985), pp. 174-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-5a1e33509c" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?”

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+warranted+by+the+direction+of+nature%E2%80%99s+light+is+warranted+by+the+law+of+nature%2C+and+consequently+by+a+divine+law%3B+for+who+can+deny+the+law+of+nature+to+be+a+divine+law%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a1e33509c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a1e33509c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/natural-law/#:~:text=What%20is%20warranted%20by%20the%20direction,nature%20to%20be%20a%20divine%20law&amp;text=What%20is%20warranted%20by%20the%20direction%20of%20nature%E2%80%99s&amp;text=law%20of%20nature%20to%20be%20a%20divine%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-94a10c0bd4" data-kw="">
<blockquote><p>Objection 9 [of a congregationalist to presbyterianism]: ‘From the church here spoken of [in Mt. 18] there is no appeal because the sentence is ratified in heaven. It inflicts the highest punishment: the censure of excommunication; and a higher judicature can do no more. There is no reason to appeal to a higher judicature because the inferior may err, because all above a congregation are courts which may err also. For presbyteries, provincial councils, national, and the universal council of the catholic Church may err.’ So Mr. Mather (Richard Mather &amp; William Tompson, Answer to Mr. Herle, ch. 2, pp. 13-14). [Rutherford’s] Answer [1.]: Because the sentence is ratified in heaven is no reason why we may not appeal from a congregation. The sentence of an inferior judge proceeding rightly is ratified in heaven, yet we may appeal from him. To appeal is but upon fears of ill administration; to desert a lower court and go to a higher court. So when we fear that a counsel and advice given by a sister church is not according to the Word of God, which yet is according to the Word of God, upon the supposal of that fear we decline that council and take another. Neither are we to appeal de jure, ‘from a just sentence,’ in a presbytery. Illud possumus quod jure possumus [‘What we can do, is that which we can do by law’]. What the inferior Sanhedrin of Israel did justly was ratified in heaven. Yet by God’s Law there might be an appeal from it to the highest Sanhedrin. 2. Nor is this a good reason: that we may not appeal from a judicature which may inflict the highest censure. For inferior judicatures in Israel had power of life and death, yet might man appeal from them. 3. The cause of appeals is not because inferior judicatures may err: for so we might appeal from all judicatures, even from a general council, for it may err. But the true grounding [of appeals] is: 1. Because rarius errant, they [higher councils] ‘do not so frequently err’. 2. They are not so inclined and disposed to err, ‘for many eyes see more than one,’ and many eyes do more seldom miscarry in not taking up the right object than one. 3. Because we conceive more equality and less partiality in higher courts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Part 1, ch. 10, sect. 10, pp. 315-316</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-cf0bbd4b87" data-kw="">
<blockquote><p>…and it is most true no man by the instinct of nature gives consent to penal laws as penal, for nature does not teach a man, nor incline his spirit to yield that his life shall be taken away by the sword, and his blood shed, except on this remote ground: a man has a disposition that a vein be cut by the physician, or a member of his body cut off, rather than the whole body and life perish by some contagious disease; but here reason in cold blood, not a natural disposition, is the nearest prevalent cause and disposer of the business.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843),.p. 2 rt col mid</span></figcaption>

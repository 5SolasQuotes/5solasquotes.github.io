<main class="wrap"><figure class="quote" id="q-3ef20c2b8f" data-kw="">
<blockquote><p>The person who is a Covenanter because of conviction accepts the doctrines end principles of the Church, not merely because of the tradition or authority of the Church, but because he is convinced in his heart and mind that they really are the doctrines end principles of the word of God, the Holy Bible. His loyalty is a loyalty to the written word of God. …

This kind of Covenanter is not a reed shaken by the wind; he is established firmly in his heart. He knows both what he believes, and why he believes it. He can give real Bible reasons for his belief. As a member of the Covenanter Church he is convinced, honest, and faithful to his obligations, regardless of inconvenience, unpopularity or reproach. He will receive the reward of a conscientious and consistent Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-g-vos.html">J. G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Why be a Covenanter? in Blue Banner Faith and Life</cite></span></figcaption>

</figure><figure class="quote" id="q-ec975dbf30" data-kw="Councils Authority of councils Sola Scriptura">
<blockquote><p>What, then, you will say, is there no authority in the definitions of councils? Yes, indeed; for I do not contend that all councils are to be condemned, and all their acts rescinded, or, as it is said, made one complete erasure. But you are bringing them all (it will be said) under subordination, and so leaving every one at liberty to receive or reject the decrees of councils as he pleases. By no means; but whenever the decree of a council is produced, the first thing I would wish to be done is, to examine at what time it was held, on what occasion, with what intention, and who were present at it; next I would bring the subject discussed to the standard of Scripture. … In this way, councils would be duly respected, and yet the highest place would be given to Scripture, everything being brought to it as a test.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.8</span></figcaption>

</figure><figure class="quote" id="q-6cbd577fcb" data-kw="">
<blockquote><p>That all the members of the catholic Church should meet together to hear one sermon, to partake of one sacrament, etc. as it was possible once, when their number was but an 120, Acts 1, so they are bound still, but that the multitude makes it impossible. That the particular congregations should join together in the same specifical ordinances, and have officers over them alike, is certainly an institution of Jesus Christ, as well, as to make the same profession of faith, and hope. Indeed, that, being so numerous, they should have one officer over them all, and join to hear one sermon, or receive the same sacrament numerical (as he [Owen] speaks) is a ridiculous fancy; and not only false, but impossible. But I would gladly know a reason why 40 or more members of no particular church, but only of the catholic, meeting together, and having a minister among them, may not join together to worship God in prayer, preaching and partaking of the sacrament, as well as the members of several particular churches, and himself [Owen] among them, may do the same; as they do often at London and Oxford when he preaches, unless he will count those ordinances then and there administered no acts of instituted worship; And if he grant them to be worship, how can he deny [on his principles] that assembly to be a particular church, though it be not fixed nor gathered and united by any explicit covenant, or consent to live and die together [as congregationalists held]. I shall only note again, that herein he deserts his [congregationalist] friends in New England…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-87ad15d57f" data-kw="">
<blockquote><p>I do highly approve the distinction following of things commanded, and things permitted on the Lord’s Day, and the explication of each member; the object of the one, all actions advancing God’s service; the object of the other, such things as are no hindrance thereunto; As in the first place works of necessity; then works of charity; yet the permitting of these, is rightly to be understood; not so as if the works of necessity here mentioned, were in such sort permitted as left to a man’s liberty, whether he will perform them or no. For undoubtedly we are bound as much as lies in our power, to quench a dangerous fire kindled in a town, on the Sabbath day, it being a work of mercy, necessarily required. For if to return a pledge ere the poor pawner of it went to his bed, in case it were his covering, were a work of mercy, how much more to save a man’s house from burning, how much more to save a whole town from being consumed, whereby many might be driven to lie without doors, void of all comfort to the body? So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641), p. 241</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>XXV. Here, nevertheless, are excepted [to the prohibition of servile work]: … (4) works of necessity, which are neither feigned nor designedly produced, but imposed upon us by providence (Lk. 14:5); not only absolute and simple, that may be called necessary only (which we can in no way be in want of), but modified and relative so that those things may be reckoned necessary not only which are required absolutely for the existence and support of life, but also those which conduce to our living better. Hence some great advantage and emolument accrues to us or our neighbor if they are done or some great disadvantage and loss if they are omitted. ‘The sabbath’ (as Christ testifies in Mk. 2:27) ‘was made for man and not man for the sabbath.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 11th Topic, Q. 14, ‘The Lord’s Day…, p. 98</span></figcaption>

<blockquote><p>2. Refreshments helpful to nature, so far as to refresh it, that it may have a supply of spirits to go on cheerfully in the duties of holy worship are lawful and useful. Τo macerate the body with abstinences on this day is required of none; and to turn it into a fast or to fast upon it is generally condemned by the ancients. Wherefore, to forbear provision of necessary food for families on this day is Mosaic; and the enforcement of the particular precepts about not kindling fire in our houses on this day, baking and preparing the food of it the day before, cannot be insisted on without a reintroduction of the seventh day precisely, to whose observance they were annexed, and thereby of the law and spirit of the old covenant. Provided always that these refreshments be: 1. Seasonable for the time of them, and not when public duties require our attendance on them. 2nd. Accompanied with a singular regard to the rules of temperance; as: 1. That there be no appearance of evil. 2. That nature be not charged with any kind of excess, so far as [to make one] to be hindered rather than assisted in the duties of the day. 3. That they be accompanied with gravity, and sobriety, and purity of conversation. Now, whereas these things are in the substance of them required of us in the whole course of our lives, as we intend to please God, and to come to the enjoyment of him, none ought to think an especial regard unto them on this day to be a bondage, or troublesome unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (d. 1683), vol. 1 (of 4), p. 749</span></figcaption>

71b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a6b86471b0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=2.%20Refreshments%20helpful%20to%20nature%2C%20so,a%20bondage%2C%20or%20troublesome%20unto%20them&amp;text=2.%20Refreshments%20helpful%20to%20nature%2C%20so%20far%20as&amp;text=to%20be%20a%20bondage%2C%20or%20troublesome%20unto%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5fe307e2c4" data-kw="">
<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsetled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures</cite>, ... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</span></figcaption>

ight+be+no+inconvenience+at+all%3B+howsoever+it+is+out+of+question+that+in+that+unsetled+condition+of+the+Israelites+wandering+in+the+wilderness%2C+when+they+were+enforced+to+pick+up+fuel%2C+where+they+could+get+it%2C+baking+and+boiling+must+needs+be+more+troublesome+and+laborious+than+it+was+afterwards+in+Canaan%2C+where+being+settled+in+their+dwellings%2C+they+had+all+things+whereof+they+were+to+make+use+for+such+works+provided+and+ready+at+hand.%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Way+to+the+Tree+of+Life+Discovered+in+Sundry+Directions+for+the+Profitable+Reading+of+the+Scriptures...+%281647%29%2C+A+Digression+concerning+the+Morality+of+the+Fourth+Commandement%2C+Section+III%2C+%E2%80%98The+Morality+%26+Perpetuity+of+the+Sabbath+Proved+out+of+the+Fourth+Commandement%E2%80%99%2C+pp.+294-95+White+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5fe307e2c4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5fe307e2c4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=The%20reasons%20by%20which%20it%20appears,works%20provided%20and%20ready%20at%20hand&amp;text=The%20reasons%20by%20which%20it%20appears%20that%20this&amp;text=for%20such%20works%20provided%20and%20ready%20at%20hand" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We think to deny the lawfulness of public fasting on the Lord’s day, as if the Christian Sabbath were a day only of spiritual feasting and rejoicing, because that day Christ ended the work of redemption and second creation, is a wronging of the Christian Sabbath, which is ordained for the whole public worship of God, joying, sorrowing for sin, learning God’s will in all and every point, as the Jewish Sabbath was not ordained only for meditation on the work of creation, but for worships of all kinds: The worship of this day, Acts 20:7, is as large as preaching, and being in the Spirit, on the Lord’s day, and seeing the visions of God, Rev. 1:10-12, and the whole ordinary public worship. It is then too narrow to restrict all our Sabbath-worship to one single act of festival rejoicing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ch. 20, Article 7</span></figcaption>

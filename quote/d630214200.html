<main class="wrap"><figure class="quote" id="q-d630214200" data-kw="">
<blockquote><p>In 1690, John Tillotson, the Archbishop of Canterbury, preached before Queen Mary II on the subject of hell where he showed an awareness of annihilationism and the arguments used by its proponents. While Tillotson ultimately defended eternal conscious torment, he left the door open for other possibilities…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ec1f22716" data-kw="hell sense loss">
<blockquote><p>Is there a hell? And what are its punishments—whether only of loss or also of sense? We affirm the latter. The execution of the sentence of the Judge will follow its promulgation. This will be carried out with respect to the wicked by casting them down into hell, where they must be tormented for ever with the devils; but with respect to the pious, by their introduction into heaven, to the joys of eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.7.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a> › <a href="../topics/judgment-and-the-final-state/hell/eternal-punishment.html">Eternal punishment</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a> › <a href="../topics/judgment-and-the-final-state/hell/nature-of-the-punishment.html">Nature of the punishment</a></span></div>

</figure><figure class="quote" id="q-4ca0e1084c" data-kw="">
<blockquote><p>III. Although the resurrection of the dead surpasses nature and man&#x27;s corrupt reason, yet it is neither against nature nor against right reason. For right reason teaches both that the dead can be raised and that they are to be raised. The former is concluded from the omnipotence of God, the latter from his justice. For as it is just that certain sins should be punished after this life, so it is also just that what was the partner of the sins should be the partner of the penalties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 3</span></figcaption>

</figure><figure class="quote" id="q-4540f60acb" data-kw="">
<blockquote><p>…with respect to the very obscure and difficult passage in 1 Pet. 3:19, about his going and preaching to the spirits in prison, I must say that I have never met with an interpretation of it that seemed to me altogether satisfactory. Among the many interpretations that have been given of it, there are just two in support of which anything really plausible, as it appears to me, can be advanced–viz., first, that which regards the preaching there spoken of as having taken place in the time of Noah, and through the instrumentality of Noah; and secondly, that which regards it as having taken place after his resurrection, and through the instrumentality of the apostles. The latter view is ably advocated in Dr. John Brown’s Expository Discourses on First Peter [pp. 515-518]. If either of these interpretations be the true one, the passage has no reference to the period of his history between his death and resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol. 1</cite>, p. 92</span></figcaption>

</figure><figure class="quote" id="q-598435c150" data-kw="">
<blockquote><p>As for annihilationism, the first Anglican cleric to publicly show an openness to the idea was none other than the illustrious Bishop Jeremy Taylor. In his sermon ‘Christ’s Advent to Judgment,’… Taylor explains at some length that church fathers like Justin Martyr and Irenaeus believed that God would eventually annihilate the damned, since immortality is not intrinsic to human nature… Taylor… cannot bring himself to be certain of annihilationism. He settles only for its possibility… No controversy or backlash ever followed Bishop Taylor’s questioning of eternal conscious torment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a></span></div>

<main class="wrap"><figure class="quote" id="q-1d9b9fecdf" data-kw="">
<blockquote><p>Let us not own the way of God by halves, but wholly, fully, and in all things. And particularly, he is against our noble and faithful declaration, published at Sanquhar, whereby that wretched tyrant, Charles Stuart, and all his accomplices, were cast off by us, as we ought; which alas! was too long a doing: and by this he buries the blood, and condemns the faithful testimonies of so many worthies who have died upon that head, and therein have been eminently owned and assisted of the Lord. Indeed, herein he will run this subterfuge, and say, he acknowledges he ought to be rejected and deposed; yea, he may possibly grant that he deserveth death, both by the laws of God and the just laws of man; yet he cannot see how that can be done without another magistrate or magistrates. But we would answer, if he sees no other ways than those, he is but blind, and that is deceitful and double dealing; for magistrates have no power but what is derivative from the people; and magistrates have nothing actually, but what the people have virtually; yea, and more than virtually, for they may actually confer it upon whom they think most fit, for the power of government is natural and radical to them, being unitedly in the whole, and singularly in every one. So whatever magistrates may do, the people may do the same, either when they want magistrates, or when the magistrates fail and refuse to do their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Henry Jenkinson, 3 Oct. 1682 in Thomas Houston (ed.), Spiritual support and consolation in difficult times: the letters of the Rev. James Renwick, the last of Scotland’s covenanted martyrs, with and introduction, containing a historical sketch of Renwick’s life, labours, and martyrdom, and</cite></span></figcaption>

<blockquote><p>[I]t is impossible, in my mind, for a reflecting and unprejudiced Christian to read the history of the progress of the Reformation on the continent of Europe and in our British isles, without perceiving that the doctrine of the Reformers, respecting the advantages of a National Establishment of Religion, had its orthodoxy manifested experimentally before the whole world,—in so much, that it is true beyond all question, that, but for the interposition of the civil state on behalf the Reformation, the current of intellectual, moral, and spiritual improvement would have been rolled backwards, and Papal Rome would have triumphed in every other land as she did in the case of ill fated Spain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of civil establishments of religion in Reformed Presbyterian</cite></span></figcaption>

</figure><figure class="quote" id="q-31c9c6c42f" data-kw="">
<blockquote><p>But it may be asked again, are synodical decrees to be received as infallible? Certainly not. A synod being constituted of men, however wise and grave, yet of like passions with others, may greatly err, and therefore all their decrees are to be examined by the Law and Testimony. But when as in the Synod at Jerusalem, they examine a question by the light of Scripture, and in the decree which they enact, hear and obey the voice of Christ, speaking in his word, then should that decree be felt binding on the consciences of those over whom the court rules, inasmuch as Christ has said, whatever they thus bind on earth, He will bind in heaven.

That power which church courts exercise, be it remembered, is not self-assumed — not self-created. It is derived immediately from Christ. He only has a right to make laws and appoint officers in His church; and the authority which they exert is therefore only ministerial. That is, as His servants they declare and carry into execution those laws, and those only which are agreeable to the expressed will of their Master. Like judges on the bench, they have no power either to make new laws, or change the laws already laid down. The Bible is their great code, and whenever they depart from that, they have no claim on your obedience.

The force which they employ is not carnal, but moral and spiritual; a force which exerts itself, not in controlling the persons of men, not in inflicting bodily penalties, not in taking possession of their properties, not in giving them over to the civil power, that by its mighty arm they may be crushed; but in warning them of their danger, in rebuking them for their folly, in censuring them for sin, and when they belie their profession, in excluding them from the fellowship of the church. Nor can they exercise even this power over any but those who have voluntarily joined the church, and have in doing so, pledged themselves to submit to its laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-denham.html">James Denham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse III in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

<blockquote><p>Forasmuch as we have been freed from the teaching of Moses through Christ the Lord, so that it is no longer necessary for us to observe the civil decrees of the law of Moses, namely, in terms of the way and the circumstances in which they are described, nevertheless, insofar as the substance and proper end of these commandments are concerned, and especially those which enjoin the discipline that is necessary for the whole commonwealth, whoever does not reckon that such commandments are to be conscientiously observed is certainly not attributing to God either supreme wisdom or a righteous care for our salvation.</p></blockquote>

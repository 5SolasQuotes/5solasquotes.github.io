<main class="wrap"><figure class="quote" id="q-ab17de5d36" data-kw="">
<blockquote><p>We are hence taught to acknowledge no love to be in God, which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good: we know but three sorts of love, that God has to the creature, all the three are like the fruitful womb; there is no miscarrying, no barrenness in the womb of divine love;

1. He loves all that He has made; so far as to give them a being, to conserve them in being so long as he pleases: He had a desire to have Sun, Moon, Stars, Earth, Heaven, Sea, Cloud, Air; He created them out of the womb of love, and out of goodness, and keeps them in being…

2. There is a second love and mercy, in God, by which he loves all Men and Angels; yea, even his enemies, makes the Sun to shine on the unjust man, as well as the just, and causes dew and rain to fall on the orchard and fields of the bloody and deceitful man, whom the Lord abhors; as Christ teaches us, (Matt. 5:43-48). Nor does God miscarry in this love, He desires the eternal being of damned angels and men; He sends the Gospel to many reprobates, and invites them to repentance and with longanimity and forbearance suffers pieces of froward dust to fill the measure of their iniquity, yet does not the Lord’s general love fall short of what He willeth to them.

3. There is a love of special election to glory; far less can God come short in the end of this love…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), p. 476 ff. (some copies, p. 440 ff., due to faulty numbering)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec40d74b95" data-kw="">
<blockquote><p>It must also be borne in mind that elsewhere Hoeksema’s [who denies common grace] definition of the word ‘goodness’ is very different from the meaning commonly given to it by Reformed writers and, more particularly, its usage in the Westminster Standards. For example, in Answer 4 of the Shorter Catechism, we read, ‘God is a Spirit, infinite eternal and unchangeable in his being, wisdom, power, holiness, justice, goodness and truth’. The Shorter Catechism has been criticised by some at this point for not using the terms ‘grace, mercy, love’, but it must be recognised that in the minds of the Westminster Assembly the term goodness included all of these. This explains why the term ‘goodness’ is expanded in the Larger Catechism as equivalent to ‘most merciful and gracious, long-suffering, and abundant in goodness’ (Answer 7) and in the Westminster Confession as ‘most loving, gracious, merciful, longsuffering, abundant in goodness…forgiving iniquity, transgression and sin; the rewarder of them that diligently seek him…’ (Ch. 2.1). The terms ‘good’ and ‘goodness’ (Heb. tob) are consistently linked to God’s mercy or faithful love (Heb. chesed), for example in Psalms 23:6, 25:7-8, 86:5, 100:5, 145:9 etc., and when Psalm 34:8 is referred to in 1 Peter 2:3, the term is rendered ‘gracious’ (Gk. chreestos: A.V. ‘kind’). No doubt this explains why the term is rendered ‘gracious’ in the 1650 Metrical Psalter rendering Psalm 86:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-silversides.html">David Silversides</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Free Offer: Biblical &amp; Reformed</cite>, (Marpet Press, 2005), p. 16-17.</span></figcaption>

</figure><figure class="quote" id="q-0dc953a165" data-kw="">
<blockquote><p>8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ …

10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it.

11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4.</p></blockquote>

<blockquote><p>Common grace is great and undeserved mercy to a sinner, and would save him if he did not resist and frustrate it. In and by it, ‘God commandeth all men everywhere to repent,’ and whoever repents will find mercy… Scripture denies that God is under obligation to follow up his defeated common grace with his irresistible special grace. It asserts his just liberty to do as He pleases in regard to imparting that measure of grace which produces the new birth, and makes the sinner ‘willing in the day of God’s power.’… God sincerely desires that the sinner would hear his outward call, and that his common grace might succeed with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 5, pp. 48-51</span></figcaption>

<blockquote><p>Now the book of life in this place must not be so strictly taken as if it included those only that were elect of God to eternal life, but must be understood of that book wherein are recorded the rules and bounds of visible church-communion; and so all those that, through the gifts and operations of special or common grace, do fall within the compass of those rules and bounds. Thus it was in the type at the return out of captivity, none were to be admitted entrance into the church but those that could show their privileges by genealogy and the records of the church; and to others it was said that they had neither portion, nor lot, nor memorial, in Jerusalem (Ezr. 2:62,63; Neh. 7:64,65; 2:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol., 3:449</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now the book of life in this place must not be so strictly taken as if it included those only that were elect of God to eternal life, but must be understood of that book wherein are recorded the rules and bounds of visible church-communion; and so all those that, through the gifts and operations of special or common grace, do fall within the compass of those rules and bounds. Thus it was in the type at the return out of captivity, none were to be admitted entrance into the church but those that could show their privileges by genealogy and the records of the church; and to others it was said that they had neither portion, nor lot, nor memorial, in Jerusalem (Ezr. 2:62,63; Neh. 7:64,65; 2:20).”

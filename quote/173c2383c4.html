<main class="wrap"><figure class="quote" id="q-173c2383c4" data-kw="">
<blockquote><p>For what more commodity did the Jews receive by King David’s means, then we by our sovereign Lady Queen Elizabeth’s? What enemies, what dangers, what deaths did he escape: from the like whereof the Lorde hath not as often, as wonderfully, preserved her Majesty? The ark of the covenant, wherein the testimony was laid, whereon the mercy-seat was placed, from which the voice of God was heard, at which his name was called upon, whereto they had not sought in the days of Saul, King David brought into his city: and caused the Levites joyfully to play on instruments of music, and lift up their voices at the bringing of it.

Queen Elizabeth hath brought us the body and truth of that whereof his ceremonies were but shadows only, the free use and Christian doctrine of the Gospel, the word of God, the holy Scriptures, the prayers and public service of the highest, all in a language known to all: and hath moved her Subjects to receive these means of their instruction and salvation with Psalms, and hymns, and spiritual songs, singing with a grace in their hearts unto the Lord. [1]

David to those heavenly treasures added earthly, &amp; enriched his kingdom with silver and gold. The purity of coin restored by her Majesty for base and copper monies wherewith she found the realm pestered, doth say no less for her: beside place of silver and gold with other ornaments in so great plenty, as if God would verify according to the letter that which he promised his Church in a mystery, For brass will I bring gold, and for iron will I bring silver. Much did it make for the safety of Jury, that David put garrisons in Syria and Idumaea, countries that bordered upon the North and South thereof much.

But more for England, that Elisabeth (to pass over the fortifying of borders) hath furnished it with all sort of armour, and munition, never more or better: and thereto with a royal navy of vessels, so stately, so strong, so well appointed for wars, that our land is fenced with walls, not only of wood as Gręcia was against Xerxes, but of brass &amp; iron too against foreign enemies. The people of Israel confessed of themselves that they were delivered out of the hand of the Philistines, and other enemies by that King. The wars which our Queen hath had for our safeguard in Scotland and France, even aliens have seen and shewed to the world that they were attached with marvellous honour and advantage to her self &amp; her realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon upon part of the eighteenth Psalm preached to the public assembly of scholars in the University of Oxford the last day of August, 1586. by John Rainolds: upon occasion of their meeting to give thanks to God for the late detection and apprehension of traitors, who wickedly conspired against </cite>, (Oxford: Joseph Barnes, 1586), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58bfd29c22" data-kw="">
<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which things are natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

</figure><figure class="quote" id="q-1bdc43c173" data-kw="">
<blockquote><p>Why it is, that while two or three very small denominations of Christians use the Psalms of David exclusively, the remaining “ninety-nine hundredths” of the Christian Church exclude these divine songs from divine worship, and adopt in their stead mere human compositions.

The question then is, shall we use, in the instituted worship of God, the Psalms, and Hymns, and Spiritual songs of the Holy Ghost, usually called the Psalms of David, or shall we use human compositions? Or, in other words, shall we sing in the praise of God his songs, or ours? This is the main question or point; and what is the spontaneous response to this question from every Christian heart? Certainly it is, that we should sing the Lord’s songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter I. Psalmody – The Question in Evangelical Guardian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Why it is, that while two or three very small denominations of Christians use the Psalms of David exclusively, the remaining “ninety-nine hundredths” of the Christian Church exclude these divine songs from divine worship, and adopt in their stead mere human compositions.

The question then is, shall we use, in the instituted worship of God, the Psalms, and Hymns, and Spiritual songs of the Holy Ghost, usually called the Psalms of David, or shall we use human compositions? Or, in other words, shall we sing in the praise of God his songs, or ours? This is the main question or point; and what is the spontaneous response to this question from every Christian heart? Certainly it is, that we should sing the Lord’s songs.”

<blockquote><p>The views on contingency and freedom, including the assumption of alternativity [alternate choice, or the power to choose alternatives] in the definition of freedom, were in the main line of early modern Reformed theological and philosophical development… The early modern Reformed argumentation… was capable of affirming human free choice as defined by intellective deliberation and multiple volitional potencies and as embodying genuine alternativity in a manner that does not comport with the assumptions of modern compatibilist [determinist] theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Will &amp; Human Choice: Freedom, Contingency &amp; Necessity in Early Modern Reformed Thought Excerpt</cite>, p. 311</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-212c3bb667" data-kw="">
<blockquote><p>5. Augustine professes, bk. 1, De Gen. contr. Manich., ch. 3, that all men may believe if they will, and justifies it in his Retractations. But if the will of man be corrupt, and averse from believing, we justly say such a man cannot believe, as our Savior says, ‘How can you believe that receive honor one of another, and seek not the honor that comes of God alone.’ Jn. 5:44 Yet this is an impotency moral only, which is to be distinguished from impotency natural. For notwithstanding this, it may be truly said that, All men may believe if they will, and herein consists the natural liberty of the will. The moral liberty consists, rather in a sanctified inclination unto that which is good, whereby it is freed from the power of sin and Satan; then in a power to do good if they will, and not otherwise. But I never find that Arminians do distinguish these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653), bk. 1, pt. 1, II. The Discourse Itself, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-d3fe61928f" data-kw="">
<blockquote><p>He [Jesus] plainly states that mankind, unchanged by divine influence, labor under such an indisposition to embrace his Gospel, and the blessings which it at once reveals and conveys, as amounts to a moral incapacity,—an indisposition which nothing short of divine influence can remove: ‘No man can come to Me, except the Father, which has sent Me, draw him;’ and with equal plainness He states that this influence, while absolutely necessary, is also fully competent to produce the desired effect,—‘All that the Father has given Me shall come to Me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-edinburgh.html">John Brown of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses &amp; Sayings of our Lord</cite>, (1852; Banner of Truth, 1990), vol. 1, p. 462</span></figcaption>

</figure><figure class="quote" id="q-f57a940b0e" data-kw="">
<blockquote><p>For our purposes, what is relevant here is passive obediential potency, which [the reformed] Senguerdius defines as: ‘[That] whereby a subject can receive an act beyond its nature, that is, to which it is not ordained by nature and would not naturally receive, such as the potency obediential passive given in stones to become sons of Abraham, or in water to be turned into wine.’ The idea here is simple. There is a sense in which you and I are perfectly capable of performing miracles. By this, I do not mean that we currently possess the active and formal power to perform miracles. Nor do I mean that we can affect them by our own natural powers. I only mean that you and I are the sort of beings that have the capacity to be raised by an agent superior to ourselves to perform miracles. … In this sense, man’s ordering to the beatific vision is an end superadded to his nature. When we speak about something being “supernatural,” strictly speaking, we mean that it is above the power of all created nature. The beatific vision clearly belongs to this category, since, as Thomas argues, no created effect of God is proportionate to his essence. Therefore, the beatific vision cannot be man’s intrinsic and natural end. Nevertheless, man’s rational nature entails an obediential potency for this vision, since his intellect and will make him the sort of creature capable of enjoying it, should God will to grant it. This is not because man’s nature is proportioned to that vision by nature, but only because it is not intrinsically repugnant to it as, for instance, would be the case of a stone, which lacks even the obediential potency to enjoy the beatific vision inasmuch as it is irrational. Thus man’s nature is not ‘closed off’ to grace even though it is not naturally ordered to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brandon-corley.html">Brandon Corley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Natural End of Man’</cite>, (2026) at American Reformer</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

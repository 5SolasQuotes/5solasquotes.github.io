<blockquote><p>The first and principal grace promised in this covenant [of grace], is righteousness; which must necessarily here have the first place, for after the breach of the covenant of works, that one first original justice (as they call it) was quite lost; and injustice did succeed into the place thereof. And this justice which is here promised in the covenant of grace, is no inherent righteousness, as that original justice was: but it is the righteousness of our mediator Jesus Christ, which is ours by faith, and by the imputation of God; for which cause the Apostle calls it the righteousness of God: for without this imputative justice we cannot possibly stand before the tribunal of God; and by the imputation of this righteousness are we said to be justified before God.

Next after this kind of righteousness which is by imputation, there is another kind of inherent justice promised in the covenant of grace, even such a sanctity and goodness of nature as was lost in the fall of man, and this is but begun in this life, but perfected in another. And this inherent justice is nothing else but life eternal in us, begun, I say, in earth; and perfected in heaven: And this heavenly and spiritual life doth proceed from that righteousness of Christ which is imputed unto us by faith: For that righteousness of Christ is effectual in us unto eternal life by the spirit of Christ, who sanctifieth and quickneth us. And thus far of the promise, which is in the covenant of grace.

Now it followeth that we see what the condition is of this covenant. The very name of the covenant of grace, might seem to require no condition; for it is called a free covenant, because God freely, and, as it might seem, without all condition, doth promise herein both righteousness and life: for he which promiseth to give any thing freely, he bindeth not to any condition. But we are to understand, that grace, here, or the particle freely, doth not exclude all condition, but that only which is in the covenant of works, which is the condition of the strength of nature, and of works naturally just and good, as we may call them, which can in no wise stand with God’s free grace in Christ Jesus. For neither that freedom of will, which doth import some purity &amp; holiness in nature, nor the works of free-will as they call them, can agree with the grace of God in Christ Jesus.

What is the condition then, which this word grace or freely, will admit in this covenant of grace? I answer, assuredly none other then that which may stand with Christ, and with God’s free grace: and that is faith only, which is also by grace (for it is God’s free gift, Phil. 1. 29. It is given unto you, not only to believe in him, but also to suffer for his sake) having Christ first the object thereof; and next, God’s free mercy in Christ: for faith embraceth God’s mercy in Christ, and makes Christ effectual in us unto righteousness and life. For this cause Paul, Rom. 4. 16. saith, our inheritance is by faith, that it might come by grace. Eph. 2. 8. Ye are saved by grace, by faith, and that not of your selves: that is, as he after expoundeth it, not of works: so he concludeth, that salvation, because it is of God’s free grace by faith, is the free gift of God.

Wherefore we see faith stands best with the grace &amp; mercy of God; as without which, Christ, and God’s mercy in him, cannot be effectual unto righteousness and life. For if we receive not Christ by faith, and God’s mercy in Christ; Christ and the mercy of God can profit us nothing unto justification and life. Howbeit we be here to remember, that whereas God offereth righteousness and life under condition of faith; yet doth he not so respect faith in us (which is also his own gift) as he doth the object of faith, which is Christ, and his own free mercy in Christ, which must be apprehended by faith: for it is not so much our faith apprehending, as Christ himself, and God’s mercy apprehended in him, that is the cause wherefore God performeth the promise of his covenant unto us, to our justification and salvation.

Wherefore the condition of the covenant of grace is not faith only, nor the object of faith only, which is Christ; but faith with Christ, that is, the faith that shall apprehend Christ; or Christ with faith, that is, Christ which is to be apprehended by faith. Note then briefly this, howe these three are one in substance, the ground of the covenant of grace; the condition of it; and the cause wherefore God performeth the condition: yet in reason they differ something. For Jesus Christ is the ground, being absolutely considered, without any respect of application unto us.

But Christ is the condition of the covenant, as he is to be applied unto us, and must be embraced by faith: for every condition is of a future thing to be done: And the cause also of the performance of the covenant, is Jesus Christ already embraced, and applied unto us by faith, Whereas Paul then saith, that we are justified by faith, his meaning is, that we are justified by Christ applied unto us by faith already in our effectual calling; which by order of nature goeth ever before the benefit of justification.</p></blockquote>

<blockquote><p>XVI. They are deceived then who make parallel distinctions of the Old and New Testament; of the Covenant of Works, and of Grace; of the Law, and Gospel: for in both, the Testament of Covenant is the Covenant of Grace; in both, the Law and Gospel are urged.

XVII. But the administration of the Old and New Testament differ first in time; because the Old Testament was exhibited before Christ; but the New is administered, Christ being now exhibition; that was to continue only till Christ, this forever. 2. In the place or amplitude, for that was proffered to the people of Israel only, this extends it self through all the world. 3. In clearness; because the free promises of Christ are more clearly preached in the New Testament, and confirmed, the shadows of Types and Ceremonies being abolished. 4. In facility; because the administration in the Old Testament, was more laborious than in the New. 5. In sweetness; for in the Old Testament, the perfect obedience of the Law is oftener urged, yet not excluding the promises of the Gospel; yet to that end, that they might be compelled to seek Christ by that rigorous exaction of obedience, as it were by a School-master: but in the new Testament, the promises of the Gospel are more frequent, yet not excluding the Law, which drives us to new obedience, to be performed by the grace of Regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), pp 173-4.</span></figcaption>

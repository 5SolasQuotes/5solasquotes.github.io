<main class="wrap"><figure class="quote" id="q-4cb8cffe8a" data-kw="">
<blockquote><p>This argument proves that veneration is not due to the images, as to books of the Trinity, because that the veneration of the image is an honoring of God, there must be a union betwixt the images and God or Christ, betwixt the tree and Christ [in the case of a crucifix]. 1. There is no union-lawful that can be a warrant of honoring anything but a union warranted of God, [to give false examples] betwixt crossing in the air and dedication to Christ’s service, betwixt surplice and pastoral sanctity; There is no union, nor is there a personal union betwixt Christ and the image: Nor 2. a union of parts, as betwixt the shoulders and the head. Nor 3. is there a divine relative union, as betwixt the mean or the end, the servant or the lord: for as John White says well [a puritan, d. 1648], and the Scripture proves, all union betwixt God and the means of worship, which are to be reverenced as means of worship in relation to God, is by divine institution (Mt. 10:14, 42; 2 Cor. 8:4; Gal. 4:14; Acts 10:34; Ps. 119:97, 159, 147, 82, 103, 111, 113, 114, 120, 127, 128, 140, 143, 167, 174); now certainly if by divine ordination there had been a union betwixt the image and God, then had it been lawful to lay the image in the heart, to say: ‘How love I thy image? The painted pictures and wooden portraits of Christ, the wood of the cross are my delight’, ‘I hope in the wood,’ ‘I have taken images for my heritage, they are sweeter to me, nor the honey or the honey comb,’ ‘How pleasant are the wooden feet of these dead and senseless ambassadors of Christ, who bring to my soul news of God, or of my Redeemer Jesus.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, Ch. 1, Question 5, Section 3; p. 189</span></figcaption>

<blockquote><p>11. …for they [Quakers] will salute no man, nor uncover their head, not only to their equals, but neither will they do it unto their superiors, nor give the least sign of respect, of honour, or of reverence in their gesture and carriage unto any whatsoever. And he [Robert Barclay] says he cannot see what we can say in defence of our practice. But we have shown above what is our ground: and we have seen the same practised by other worthy persons mentioned in Scripture… As concerning, says he, the fashions and customs of the nations, it is an evil argument for the practice of Christians, who should follow a better rule. Answer: And so we do follow a better rule; and yet we may follow the Law of nations, which is mostly gathered from the practice of nations, in things not contrary to the Law of God; for even the Law of nations, in such things, is a part of the Law of God, being but some particular applications or explications of the Law of Nature: And though no particular gesture, as a sign of respect and reverence, due to our equals or superiours, be universally received by all nations, yet the Law of Nations and their practice may teach us that by some one outward gesture or other we ought to witness our respect and declare that reverence that we owe to others: Christianity is no enemy to humanity and civility, whatever our morose and unmannerly Quakers dream.</p></blockquote>

</figure><figure class="quote" id="q-e11ed65781" data-kw="">
<blockquote><p>Though a penitentiary kneel to God purposely in the presence and sight of the congregation, that he may make known to them his repentance for the sin whereby he has scandalized them, yet is the confessing of his sin to God kneeling there upon his knees, an immediate worship, neither does the congregation come betwixt him and God as belonging to the substance of this worship, for he kneels to God as well and makes confession of his sin when the congregation is not before him. But I suppose our kneelers themselves will confess that the elements come so betwixt God and them when they kneel that they belong to the essence of the worship in hand, and that they would not, nor could not worship the flesh and blood of Christ in the sacrament if the elements were not before them. To be short, the case of a penitentiary stands thus, that not in his kneeling simpliciter, but in his kneeling publicly and in sight of the congregation, he sets them before him, purposely and with a respect to them: Whereas our kneelers do kneel in such sort that their kneeling simpliciter, and without an adjection or adjunct, has a respect to the elements purposely set before them, neither would they at all kneel, for that end and purpose for which they do kneel, namely, for worshipping the flesh and blood of Christ in the sacrament, except the elements were before the eyes both of their minds and bodies; as the penitentiary does kneel, for making confession of his sin to God, when the congregation is not before him. … For the very kneeling itself (simply considered) before the elements, respects them as then purposely set in our sight, that we may kneel before them: whereas in the case of the penitentiary, it is not his kneeling to confess his sin to God, which has a respect to the congregation as set in his sight for that purpose; But some circumstances of his kneeling only, to wit, When? At that time when the congregation is assembled; and where? Publicly in sight of the congregation. In regard of these circumstances, he has the congregation purposely in his sight, and so respects them; But in regard of the kneeling itself simply, the presence of the congregation is but accidental to him who kneels, and confesses his sin before God. As touching giving thanks before the meat set on our common tables, though a man should do it kneeling, yet this speaks not home to the point now in controversy, except a man so kneel before his meat, that he have a religious respect to it, as a thing separated from a common use and made holy, and likewise have both his mind and his external senses of seeing, touching, and tasting fastened upon it in the act of his kneeling. And if a man should thus kneel before his meat, he were an idolater. Lastly, giving thanks before the elements of bread and wine in the beginning of the holy action, is as far from the purpose: For this giving of thanks is an immediate worship of God wherein we have our minds and senses not upon the bread &amp; wine, as upon things which have a state in that worship of the Lord’s Supper, and belong to the substance of the same (for the very consecration of them to this use, is but then in fieri), but we worship God immediately by prayer and giving of thanks: Which is all otherwise in the act of receiving [the bread and wine].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637) | pt. 3, ch. 4</cite>, pp. 70-71</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Though a penitentiary kneel to God purposely in the presence and sight of the congregation, that he may make known to them his repentance for the sin whereby he has scandalized them, yet is the confessing of his sin to God kneeling there upon his knees, an immediate worship, neither does the congregation come betwixt him and God as belonging to the substance of this worship, for he kneels to God as well and makes confession of his sin when the congregation is not before him. But I suppose our kneelers themselves will confess that the elements come so betwixt God and them when they kneel that they belong to the essence of the worship in hand, and that they would not, nor could not worship the flesh and blood of Christ in the sacrament if the elements were not before them. To be short, the case of a penitentiary stands thus, that not in his kneeling simpliciter, but in his kneeling publicly and in sight of the congregation, he sets them before him, purposely and with a respect to them: Whereas our kneelers do kneel in such sort that their kneeling simpliciter, and without an adjection or adjunct, has a respect to the elements purposely set before them, neither would they at all kneel, for that end and purpose for which they do kneel, namely, for worshipping the flesh and blood of Christ in the sacrament, except the elements were before the eyes both of their minds and bodies; as the penitentiary does kneel, for making confession of his sin to God, when the congregation is not before him. … For the very kneeling itself (simply considered) before the elements, respects them as then purposely set in our sight, that we may kneel before them: whereas in the case of the penitentiary, it is not his kneeling to confess his sin to God, which has a respect to the congregation as set in his sight for that purpose; But some circumstances of his kneeling only, to wit, When? At that time when the congregation is assembled; and where? Publicly in sight of the congregation. In regard of these circumstances, he has the congregation purposely in his sight, and so respects them; But in regard of the kneeling itself simply, the presence of the congregation is but accidental to him who kneels, and confesses his sin before God. As touching giving thanks before the meat set on our common tables, though a man should do it kneeling, yet this speaks not home to the point now in controversy, except a man so kneel before his meat, that he have a religious respect to it, as a thing separated from a common use and made holy, and likewise have both his mind and his external senses of seeing, touching, and tasting fastened upon it in the act of his kneeling. And if a man should thus kneel before his meat, he were an idolater. Lastly, giving thanks before the elements of bread and wine in the beginning of the holy action, is as far from the purpose: For this giving of thanks is an immediate worship of God wherein we have our minds and senses not upon the bread &amp; wine, as upon things which have a state in that worship of the Lord’s Supper, and belong to the substance of the same (for the very consecration of them to this use, is but then in fieri), but we worship God immediately by prayer and giving of thanks: Which is all otherwise in the act of receiving [the bread and wine].”

— George Gillespie, English-Popish Ceremonies (1637) | pt. 3, ch. 4, pp. 70-71">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough+a+penitentiary+kneel+to+God+purposely+in+the+presence+and+sight+of+the+congregation%2C+that+he+may+make+known+to+them+his+repentance+for+the+sin+whereby+he+has+scandalized+them%2C+yet+is+the+confessing+of+his+sin+to+God+kneeling+there+upon+his+knees%2C+an+immediate+worship%2C+neither+does+the+congregation+come+betwixt+him+and+God+as+belonging+to+the+substance+of+this+worship%2C+for+he+kneels+to+God+as+well+and+makes+confession+of+his+sin+when+the+congregation+is+not+before+him.+But+I+suppose+our+kneelers+themselves+will+confess+that+the+elements+come+so+betwixt+God+and+them+when+they+kneel+that+they+belong+to+the+essence+of+the+worship+in+hand%2C+and+that+they+would+not%2C+nor+could+not+worship+the+flesh+and+blood+of+Christ+in+the+sacrament+if+the+elements+were+not+before+them.+To+be+short%2C+the+case+of+a+penitentiary+stands+thus%2C+that+not+in+his+kneeling+simpliciter%2C+but+in+his+kneeling+publicly+and+in+sight+of+the+congregation%2C+he+sets+them+before+him%2C+purposely+and+with+a+respect+to+them%3A+Whereas+our+kneelers+do+kneel+in+such+sort+that+their+kneeling+simpliciter%2C+and+without+an+adjection+or+adjunct%2C+has+a+respect+to+the+elements+purposely+set+before+them%2C+neither+would+they+at+all+kneel%2C+for+that+end+and+purpose+for+which+they+do+kneel%2C+namely%2C+for+worshipping+the+flesh+and+blood+of+Christ+in+the+sacrament%2C+except+the+elements+were+before+the+eyes+both+of+their+minds+and+bodies%3B+as+the+penitentiary+does+kneel%2C+for+making+confession+of+his+sin+to+God%2C+when+the+congregation+is+not+before+him.+%E2%80%A6+For+the+very+kneeling+itself+%28simply+considered%29+before+the+elements%2C+respects+them+as+then+purposely+set+in+our+sight%2C+that+we+may+kneel+before+them%3A+whereas+in+the+case+of+the+penitentiary%2C+it+is+not+his+kneeling+to+confess+his+sin+to+God%2C+which+has+a+respect+to+the+congregation+as+set+in+his+sight+for+that+purpose%3B+But+some+circumstances+of+his+kneeling+only%2C+to+wit%2C+When%3F+At+that+time+when+the+congregation+is+assembled%3B+and+where%3F+Publicly+in+sight+of+the+congregation.+In+regard+of+these+circumstances%2C+he+has+the+congregation+purposely+in+his+sight%2C+and+so+respects+them%3B+But+in+regard+of+the+kneeling+itself+simply%2C+the+presence+of+the+congregation+is+but+accidental+to+him+who+kneels%2C+and+confesses+his+sin+before+God.+As+touching+giving+thanks+before+the+meat+set+on+our+common+tables%2C+though+a+man+should+do+it+kneeling%2C+yet+this+speaks+not+home+to+the+point+now+in+controversy%2C+except+a+man+so+kneel+before+his+meat%2C+that+he+have+a+religious+respect+to+it%2C+as+a+thing+separated+from+a+common+use+and+made+holy%2C+and+likewise+have+both+his+mind+and+his+external+senses+of+seeing%2C+touching%2C+and+tasting+fastened+upon+it+in+the+act+of+his+kneeling.+And+if+a+man+should+thus+kneel+before+his+meat%2C+he+were+an+idolater.+Lastly%2C+giving+thanks+before+the+elements+of+bread+and+wine+in+the+beginning+of+the+holy+action%2C+is+as+far+from+the+purpose%3A+For+this+giving+of+thanks+is+an+immediate+worship+of+God+wherein+we+have+our+minds+and+senses+not+upon+the+bread+%26+wine%2C+as+upon+things+which+have+a+state+in+that+worship+of+the+Lord%E2%80%99s+Supper%2C+and+belong+to+the+substance+of+the+same+%28for+the+very+consecration+of+them+to+this+use%2C+is+but+then+in+fieri%29%2C+but+we+worship+God+immediately+by+prayer+and+giving+of+thanks%3A+Which+is+all+otherwise+in+the+act+of+receiving+%5Bthe+bread+and+wine%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29+%7C+pt.+3%2C+ch.+4%2C+pp.+70-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe11ed65781.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e11ed65781.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=Though%20a%20penitentiary%20kneel%20to%20God,of%20receiving%20%5Bthe%20bread%20and%20wine&amp;text=Though%20a%20penitentiary%20kneel%20to%20God%20purposely%20in&amp;text=the%20act%20of%20receiving%20%5Bthe%20bread%20and%20wine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

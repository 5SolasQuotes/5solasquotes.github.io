<main class="wrap"><figure class="quote" id="q-9fcc17b889" data-kw="">
<blockquote><p>But as far as the law itself is concerned, ‘You will not make for yourself a graven image, nor any likeness of anything under heaven above, etc.’ the Lord forbids two things: the one, that they be made; the other, that they be worshipped. Nevertheless this was not imposed on concsciences except by reason of divine worship, namely lest they be made with this goal in mind, and lest those things that have been fashioned be adored.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, p. 486</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-6b796f8cf5" data-kw="">
<blockquote><p>That which we most love we worship as our God; for love is an act of soul-worship.… This is undoubtedly true, if we intend hereby that love which is superlative and transcendent; for to be loved above all things is an act of honour, worship, which the Lord challenges as his due in peculiar, Deut. 6:5.… Other things may be loved, but he will be loved above all other things.… He looks upon us as not worshipping him at all, not taking him for a God, when we love other things more, or as much as himself, 1 John 2:15.… Those that love their riches, the things of the world, more than, or equally with, God, they make these their gods.… Love, whenever it is inordinate, it is an idolatrous affection.… That which we most trust we make our god; for confidence and dependence is an act of worship which the Lord calls for as due only to himself.… Trust in the creature is always idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (love and trust as soul worship)</span></figcaption>

</figure><figure class="quote" id="q-f03cd9f060" data-kw="">

</figure><figure class="quote" id="q-75c3465029" data-kw="">
<blockquote><p>That Council, because it supports idolatry, the Papists deem holy and lawful. Hence, according to their axiom, it cannot have erred in the exposition of Scripture. But if such interpreters of sacred things are to be listened to, (it is abominable to say they are,) the religion of the Egyptians will be preferable to the Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to Session IV</span></figcaption>

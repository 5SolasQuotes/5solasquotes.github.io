<main class="wrap"><figure class="quote" id="q-04171c467f" data-kw="">
<blockquote><p>The question which you have put seems to me to do honour to chastity, and to demand a kind reply. Chastity, in respect of which I see that the majority of men are ill-disposed, and that their laws are unequal and irregular. For what was the reason why they restrained the woman, but indulged the man, and that a woman who practises evil against her husband’s bed is an adulteress, and the penalties of the law for this are very severe; but if the husband commits fornication against his wife, he has no account to give? I do not accept this legislation; I do not approve this custom.

They who made the Law were men, and therefore their legislation is hard on women, since they have placed children also under the authority of their fathers, while leaving the weaker sex uncared for. God doth not so; but saith Honour thy father and thy mother, which is the first commandment with promise; that it may be well with thee; and, He that curseth father or mother, let him die the death. Similarly He gave honour to good and punishment to evil. And, The blessing of a father strengtheneth the houses of children, but the curse of a mother uprooteth the foundations.

See the equality of the legislation. There is one Maker of man and woman; one debt is owed by children to both their parents. … How then dost thou demand Chastity, while thou dost not thyself observe it? How dost thou demand that which thou dost not give? How, though thou art equally a body, dost thou legislate unequally?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oration XXXVII. On the Words of the Gospel, “When Jesus had finished these sayings,” etc. – S. Matt. XIX. I.</cite>, (n.d.), 6-7 in Nicene and Post-Nicene Fathers 2, 7: 339-40.</span></figcaption>

<blockquote><p>Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates.</p></blockquote>

<blockquote><p>Therefore it is not wholly without reason that some have raised the question: “which is more to be feared or desired: an evil ruler with good counsel, or a good ruler with evil counsel?” For if the counsel of the ruler is evil and full of flatterers, ambitious, avaricious, thieves, debauchers, and tyrants (which is fairly standard for courts), the ruler will not govern, but those to whom the ruler and his name serve as a mask shall govern in his name. They shall establish their reign and tyranny by using the ruler as a decoy serves the huntsman in their chase, and as idols serve the priests in order to emphasize themselves, and bring themselves greater advantages by their use. And in this way the tyranny which is to be feared in a monarchy will be converted into what generally occurs in an aristocracy when it is perverted and altered into this tyrannical state which the Greeks call oligarchy—that is, the principality of a small number who reign tyrannical and not by true justice, instead of a great number and many people. … and among other dangers, there are customarily two great evils which bring great miseries and which often ruin nations. The first is the elections of the magistrates. The second is the judgment and executions of the things ordained by the laws. For where in elections devolve upon the community, it is very difficult to have governors and magistrates such as are required; and this happens chiefly for two reasons. The first is a desire which every man has of living in his own carnal liberty and fleshly pleasure without being subject to any laws. This desire is the reason why those to whom the elections belong prefer to have governors and magistrates elected according to their mold and devoted to them, under whom they can live in greater licentiousness, without rebuke or correction, than to have someone who fears God and who shall take them in hand and punish the wrongdoers according to every man’s deeds. The other reason is ambition and greed, which are the reasons why many take the offices of the country by intrigue, either for themselves or for their friends and consorts, And for those by whom they have been corrupted. And this is done not out of a desire to maintain God’s owner or the public good or to administer true justice, but is done merely for the honor and earthly profit of those who hoped to receive it and to rain above the others. …One further evil still remains, which is the negligence of judgments and the scorn of good laws and ordinances made for the preservation of the public good. For it often happens that the great alliances and relations which exist in the community prevent the right course of justice, and that the criminals are not brought to justice and punished according to the laws according to their wrongdoing, but to the contrary they are tolerated. The chief cause of this proceeds from the fear of the disfavor that those who govern might acquire of such allies who are joined to them if justice were administered as it ought to be, according to the commandments of God, whose Law so often and so expressly forbids having any respect of persons, and commands that just judgment be meted out. Furthermore, it almost always ordinarily happens that within these popular states certain flatterers (who know how to win the good favor of all) are very popular, and easily obtained all they desire. Four, seeing that the people are devoted to them, they easily condescend and consent to what pleases them. Seeing that there are so many drawbacks to all types of civil government, it is not possible that man could ever have justice and live with each other in a lasting peace and remain united unless they possess an authority and a lord who is greater and more excellent in power, wisdom, and goodness than all others combined. God, the Creator of all, shows us this very clearly both in the order which He has established among men and beasts, as well as in the various natures that he has placed within man by joining together the soul and body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-viret.html">Pierre Viret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“How Should Man Be Governed?” in The Christian and the Magistrate</cite>, trans. R. A. Sheats (Monticello, FL: Psalm 78 Ministries, 2015), 14–17.</span></figcaption>

<blockquote><p>If it be said, that God hath forbidden such a forcible resistance by Rom. 13. 1, 2, 3. or the like Scriptures, then it must be affirmed that the Parliament are not the higher powers, which Dr Ferne granteth: for if the Parliament come within the compass of those words (higher Powers) then that Scripture Rom. 13. doth not reach them, but rather requires others to be obedient to them; yea, if by the higher powers is understood only the King, then the two Houses may not make any forcible resistance against any petty Constable that comes in the K[ing’s] authority to do violence to the two Houses.

Surely therefore this and the like Scriptures are much abused, the meaning being only to command obedience to authority in all things that tend to the encouragement of good, and punishment of evil; and therefore there is such a power in the subjects, both by the law of nature, and constitution of the kingdom, to take up Arms when the State or two Houses express it; notwithstanding the expression of any one man to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>
<div class="actions"><button class="copy" data-copy="“If it be said, that God hath forbidden such a forcible resistance by Rom. 13. 1, 2, 3. or the like Scriptures, then it must be affirmed that the Parliament are not the higher powers, which Dr Ferne granteth: for if the Parliament come within the compass of those words (higher Powers) then that Scripture Rom. 13. doth not reach them, but rather requires others to be obedient to them; yea, if by the higher powers is understood only the King, then the two Houses may not make any forcible resistance against any petty Constable that comes in the K[ing’s] authority to do violence to the two Houses.

Surely therefore this and the like Scriptures are much abused, the meaning being only to command obedience to authority in all things that tend to the encouragement of good, and punishment of evil; and therefore there is such a power in the subjects, both by the law of nature, and constitution of the kingdom, to take up Arms when the State or two Houses express it; notwithstanding the expression of any one man to the contrary.”

— William Bridge, The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved, (London: Ben. Allen, 1643), pp 17-18.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+it+be+said%2C+that+God+hath+forbidden+such+a+forcible+resistance+by+Rom.+13.+1%2C+2%2C+3.+or+the+like+Scriptures%2C+then+it+must+be+affirmed+that+the+Parliament+are+not+the+higher+powers%2C+which+Dr+Ferne+granteth%3A+for+if+the+Parliament+come+within+the+compass+of+those+words+%28higher+Powers%29+then+that+Scripture+Rom.+13.+doth+not+reach+them%2C+but+rather+requires+others+to+be+obedient+to+them%3B+yea%2C+if+by+the+higher+powers+is+understood+only+the+King%2C+then+the+two+Houses+may+not+make+any+forcible+resistance+against+any+petty+Constable+that+comes+in+the+K%5Bing%E2%80%99s%5D+authority+to+do+violence+to+the+two+Houses.%0A%0ASurely+therefore+this+and+the+like+Scriptures+are+much+abused%2C+the+meaning+being+only+to+command+obedience+to+authority+in+all+things+that+tend+to+the+encouragement+of+good%2C+and+punishment+of+evil%3B+and+therefore+there+is+such+a+power+in+the+subjects%2C+both+by+the+law+of+nature%2C+and+constitution+of+the+kingdom%2C+to+take+up+Arms+when+the+State+or+two+Houses+express+it%3B+notwithstanding+the+expression+of+any+one+man+to+the+contrary.%E2%80%9D%0A%0A%E2%80%94+William+Bridge%2C+The+truth+of+the+times+vindicated+whereby+the+lawfulness+of+Parliamentary+proceedings+in+taking+up+of+arms%2C+is+justified%2C+Doctor+Ferne%E2%80%99s+reply+answered%2C+and+the+case+in+question+more+fully+resolved%2C+%28London%3A+Ben.+Allen%2C+1643%29%2C+pp+17-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd6829949de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d6829949de.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/04/17/william-bridge-on-romans-13-and-parliament/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>1st Conclusion. The members of the visible-Church are not mere lictors [those who execute judicial decisions] and executioners of the sentences of the eldership:

1. Because they are to observe, warn, watch over the manners of their fellow members and to teach, exhort and admonish one another; and are guilty if they be deficient in that;

2. Because by the law of charity, as they are brethren under one head Christ, they are to warn and admonish their rulers.</p></blockquote>

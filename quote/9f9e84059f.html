<blockquote><p>10. Ye observe days. He adduces as an instance one description of “elements,” the observance of days. No condemnation is here given to the observance of dates in the arrangements of civil society. The order of nature out of which this arises, is fixed and constant. How are months and years computed, but by the revolution of the sun and moon? What distinguishes summer from winter, or spring from harvest, but the appointment of God, — an appointment which was promised to continue to the end of the world? (Genesis 8:22.) The civil observation of days contributes not only to agriculture and to matters of politics, and ordinary life, but is even extended to the government of the church. Of what nature, then, was the observation which Paul reproves? It was that which would bind the conscience, by religious considerations, as if it were necessary to the worship of God, and which, as he expresses it in the Epistle to the Romans, would make a distinction between one day and another. (Romans 14:5.)

When certain days are represented as holy in themselves, when one day is distinguished from another on religious grounds, when holy days are reckoned a part of divine worship, then days are improperly observed. The Jewish Sabbath, new moons, and other festivals, were earnestly pressed by the false apostles, because they had been appointed by the law. When we, in the present age, intake a distinction of days, we do not represent them as necessary, and thus lay a snare for the conscience; we do not reckon one day to be more holy than another; we do not make days to be the same thing with religion and the worship of God; but merely attend to the preservation of order and harmony. The observance of days among us is a free service, and void of all superstition.

11. Lest I have bestowed upon you labour in vain. The expression is harsh, and must have filled the Galatians with alarm; for what hope was left to them, if Paul’s labour had been in vain? Some have expressed astonishment that Paul should be so powerfully affected by the observance of days, as almost to designate it a subversion of the whole gospel. But if we carefully weigh the whole, we shall see that there was just reason; and that the false apostles not only attempted to lay the yoke of Jewish bondage on the neck of the church, but filled their minds with wicked superstitions. To bring back Christianity to Judaism, was in itself no light evil; but far more serious mischief was done, when, in opposition to the grace of Christ, they set up holidays as meritorious performances, and pretended that this mode of worship would propitiate the divine favour. When such doctrines were received, the worship of God was corrupted, the grace of Christ made void, and the freedom of conscience oppressed.

Do we wonder that Paul should be afraid that he had laboured in vain, that the gospel would henceforth be of no service? And since that very description of impiety is now supported by Popery, what sort of Christ or what sort of gospel does it retain? So far as respects the binding of consciences, they enforce the observance of days with not less severity than was done by Moses. They consider holidays, not less than the false apostles did, to be a part of the worship of God, and even connect with them the diabolical notion of merit. The Papists must therefore be held equally censurable with the false apostles; and with this addition in aggravation, that, while the former proposed to keep those days which had been appointed by the law of God, the latter enjoin days, rashly stamped with their own seal, to be observed as most holy.</p></blockquote>

<blockquote><p>DR BEGG ON THE MINISTRY

The Rev Dr Begg presided at the induction on Wednesday of the Rev Dr Tho[ma]s Smith to the Chair of Evangelistic Theology in the New College, Edinburgh, and, in the course of an address on the subject of theological teaching, took occasion to ask, why were the professed ministers of Christ respected in this country?

He replied that it was because, from the days of Knox, a large number of them were cordially respected still; even when men had little regard for their principles. But let the professed ministers of Christ assume a largely different character – let them become mere spiritual showmen and players upon the ecclesiastical stage, entering upon their office by perjury, and making their whole official lives a living lie – and they should soon see a mighty change.</p></blockquote>

<blockquote><p>It’s demanded, What fruit was it, which brought the Axe to the Root of the tree?

1. It was prophanation of the Sabbath, Jerem. 17. 24, 25. 27. If they made conscience of God’s Sabbath, he would take care of their City: If they would hollow that day with pious duties, he would honour them with choice Princes; but if they would defile his day, he would fire their City, and that with unquenchable fire.

This made Nehemiah so zealous for the Sabbath, after the return from Babylon, Neh. 13. 17, 10. he contended with the Nobles, and said, What evil thing is this that ye do, and prophane the Sabbath day? did not your Father’s thus, and did not our God bring all his evils upon us, and upon this City? yet ye bring more wrath upon Israel, by prophaning the Sabbath day. He knew that sin had formerly laid them waste, and would therefore stand for the Sabbath, that the Lord of Sabbaths might stand for and by them. England is not innocent in this thing. The Book of Sports (a Monster that Heathen and Idolatrous Kingdoms never produced) that opened a wide door to prophane the Lord’s day, hath kindled a fire in our Land, which is not like to be extinct till that Book be burnt by publique Authority.

2. Idolatry, that is a Kingdom destroying sin. Jeroboam’s two Calves eat up the 10. Tribes, and Manasses’ Idols devoured Juda, Hos. 13 1. When Ephraim sinned in Baal then he died. Idolatry is the death of a Land, it divides between God and Kingdoms, it breaks the Covenant, and causes God to give a Bill of Divorce, and that is not all, it calls forth Gods fury upon a Land, Ezek. 36. 18. 19. and that is a destructive thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Αξινε προσ τεν Ριζαν. The axe at the root, a sermon preached before the Honourable House of Commons, at their public fast, April 26. 1643</cite>, (London: Benjamin Allen, 1643), pp 21-22.</span></figcaption>

<blockquote><p>But why was circumcision on the eighth day, if not because, after the seventh day of the sabbath, the Lord rose on Sunday, the Lord’s Day? So then, the resurrection of Christ—which indeed happened on the third day after his passion, and on the eighth day in a seven-day week—that is what circumcises us. Listen to the exhortation of the apostle to those circumcised by the true rock: If then you have risen with Christ, seek the things that are above, where Christ is, seated on God’s right; savor the things that are above, not the things on earth (Col 3:1–2). He is speaking to the circumcised; Christ has risen; he has rid you of the desires of the flesh, rid you of evil lusts, rid you of the superfluity you were born with and the much worse extras you have added by bad lives; circumcised with rock, why do you still savor the earth?</p></blockquote>

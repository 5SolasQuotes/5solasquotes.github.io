<main class="wrap"><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 3 (p. 415)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-c78882c4a3" data-kw="">
<blockquote><p>If men abuse the Scriptures, this does not happen per se, but accidentally from the perversity of those who wrongfully wrest them to their own destruction. Otherwise (if on account of the abuse the use should be prohibited), the Scriptures ought to be taken away not only from the laity, but also from the teachers who abuse them far more. For heresies usually arise not from the common people and the unlearned, but from ecclesiastics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.18.5</span></figcaption>

</figure><figure class="quote" id="q-88c9aedd8b" data-kw="">
<blockquote><p>The Bible is to the theologian what nature is to the man of science. It is his store-house of facts; and his method of ascertaining what the Bible teaches, is the same as that which the natural philosopher adopts to ascertain what nature teaches.</p></blockquote>

</figure><figure class="quote" id="q-61f86d9005" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, ch. 2 (The Council of Jerusalem)</span></figcaption>

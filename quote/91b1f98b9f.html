<main class="wrap"><figure class="quote" id="q-91b1f98b9f" data-kw="">
<blockquote><p>1. The beatitude of God is the eternal condition in himself of absolute satisfaction and delight. That’s bound up with God’s fullness of glory as the Father, the Son, and the Holy Spirit. Now that’s a traditional understanding of God’s beatitude. This is not something that I’m just coming up with myself. We may not hear a lot about the attribute of God’s beatitude, but it is a tradition throughout church history. 2. The outward beauty of God is expressed and perceivable as an aesthetic quality of his glory in his work of creation, redemption, and consummation. It’s important here to call attention to the distinctive characteristic of beauty. Beauty as beauty is not desired as a means to another end. Pleasure or delight associated with beholding the beautiful is its own end. 3. That characteristic to communicate the delight as its own end is correlative to that absolute self that characterizes God’s own eternal, internal life as Father, Son, and Spirit. The uniqueness of beauty, as opposed to goodness or truth (we just talked about the transcendentals there), is that beauty evokes a delight, but you don’t use that delight to then do something more. It is its own end. 4. We talk about God’s beatitude. It is its own end. It is itself delight. He’s self-satisfied. Where I draw this all together is with a postulation that the beauty of God in his outward works as it is perceived and experienced by human beings is what most clearly can be traced to that perfection of beatitude and sense of delight that belongs to God in himself as Father, Son, and Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-king.html">Jonathan King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How can I see the Beauty of God?: Interview with Jonathan King’</cite>, (2019) at Desiring God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ae08d984d" data-kw="">
<blockquote><p>A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) if love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, pp. 100-101 Wolter was a Scotus scholar.</span></figcaption>

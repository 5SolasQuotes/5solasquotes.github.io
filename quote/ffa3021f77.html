<blockquote><p>VII. The efficient cause of justification is God, considered both οὐσιωδῶς [ousiōdōs, essentially] and ὑπαρκτικῶς [hyparktikōs, subsistentially/personally]. Essentially, with respect to the whole complex — which, as a work ad extra [external work], is common to the three Persons of the Holy Trinity as to the ἀποτέλεσμα [apotelasma, effect] itself, yet remains distinct both in order and in mode of operation. Subsistentially, with respect to the parts of the complex: and thus to the Father is attributed the διακριτικός [diakritikos, distinguishing/decisive] act of justification, Rom. III.25; VIII.33; to the Son, the merit of justification, Isa. LIII.11; Matt. IX.6; and to the Holy Spirit, its application, 1 Cor. VI.11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on Justification’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chovet, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>This union [of the person of the Son with the human nature in the inarnation] can be viewed either in respect of the principle or in respect of the terminus. In the former sense, it is attributed to the whole Trinity, by the power of which such union is made (to wit, by a transient action of God by which he united in the person of the Logos, the humanity of Christ). In the latter, it belongs to the Logos alone because it is terminated on him. Although the person of the Logos may well be said to have been incarnate, yet the Trinity itself may not because the incarnation is not terminated on the divine nature absolutely, but on the person of the Logos relatively.</p></blockquote>

<blockquote><p>Engages narrative theology and post-metaphysical thought of the last 75 years by retrieving the exegetical and metaphysical account of Aquinas.” – Mark Jones Wanless, Brandon L. – Universality &amp; the Divine Essence: St. Thomas Aquinas on the Unity Characteristic of the Trinitarian Persons a Masters thesis (University of St. Thomas, 2015) 92 pp. Introduction: “The greatest of the Scholastic doctors understood himself as a conduit of the wisdom he himself received from earlier doctors of the Church. This medieval method of theology—originating in part with such persons as St. John of Damascus in the East and Peter Lombard in the West—amounted to a synthetic engagement of the patristic theologians with the goal of producing a unified and holistic theological account of the faith… …The disagreement itself regards the proper predication of the relation of the three persons of the Trinity to the divine nature, and whether we can speak of the divine essence as a universal, that is, as a relation of three individuals to a species. In other words, are the trinitarian persons three individuals of the one divine species of divinity? Augustine argues in the negative, whereas [John the] Damascene speaks affirmatively…. After addressing the specifics of the relative positions of Augustine and Damascene, and their treatment by Peter Lombard in his Sentences in the following chapter, I will spend the bulk of this paper examining Aquinas’s theology of the Trinity… he uniquely provides a definitive account of the various concepts needed to thoroughly understand the relation of individuals to a species and its applicability to the Godhead… Aquinas proves on multiple levels that, properly speaking, God cannot be said to be a divine species with three subordinate individuals… I will also show how it is that Aquinas recognizes some similarities (and thus allows for Damascene’s position) between the species/individual relationship and that of the divine essence and persons… What follows in this paper is a relatively unique Thomistic analysis of this question, putting to use his trinitarian and metaphysical principles as a way to understand all the critical implications of a relationship of universality between essence and persons in the Godhead.</p></blockquote>

<blockquote><p>Works of Nature they call those which God produces in Nature by a certain common operation. And they are either of Creation, or of Conservation and Governance. … By this, however, no Persons of the Deity are excluded from creation, but only creatures and fictitious divinities. For the individual Persons are that one, true, living, and everlasting God, and in respect to them this work no less than the other external works is counted indivisible or common. Which the very history of creation openly testifies, when it introduces several Persons consulting and creating, Gen. 1:26. Scripture testifies elsewhere, where concerning the one God the creator it speaks by the name of makers, Isa. 54:5, in the plural number, Job 35:10. Moreover, the work of creation is attributed no less to the Son, John 1:3; Col. 1:16; Heb. 1:2; and to the Holy Spirit, Gen. 1:2; Job 26:13; 33:4; Ps. 104:30, than the Father claims it διὰ ῥητῶν [dia rhētōn, explicitly]. That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Works of Nature they call those which God produces in Nature by a certain common operation. And they are either of Creation, or of Conservation and Governance. … By this, however, no Persons of the Deity are excluded from creation, but only creatures and fictitious divinities. For the individual Persons are that one, true, living, and everlasting God, and in respect to them this work no less than the other external works is counted indivisible or common. Which the very history of creation openly testifies, when it introduces several Persons consulting and creating, Gen. 1:26. Scripture testifies elsewhere, where concerning the one God the creator it speaks by the name of makers, Isa. 54:5, in the plural number, Job 35:10. Moreover, the work of creation is attributed no less to the Son, John 1:3; Col. 1:16; Heb. 1:2; and to the Holy Spirit, Gen. 1:2; Job 26:13; 33:4; Ps. 104:30, than the Father claims it διὰ ῥητῶν [dia rhētōn, explicitly]. That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.”

— Johann H. Alting, The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWorks+of+Nature+they+call+those+which+God+produces+in+Nature+by+a+certain+common+operation.+And+they+are+either+of+Creation%2C+or+of+Conservation+and+Governance.+%E2%80%A6+By+this%2C+however%2C+no+Persons+of+the+Deity+are+excluded+from+creation%2C+but+only+creatures+and+fictitious+divinities.+For+the+individual+Persons+are+that+one%2C+true%2C+living%2C+and+everlasting+God%2C+and+in+respect+to+them+this+work+no+less+than+the+other+external+works+is+counted+indivisible+or+common.+Which+the+very+history+of+creation+openly+testifies%2C+when+it+introduces+several+Persons+consulting+and+creating%2C+Gen.+1%3A26.+Scripture+testifies+elsewhere%2C+where+concerning+the+one+God+the+creator+it+speaks+by+the+name+of+makers%2C+Isa.+54%3A5%2C+in+the+plural+number%2C+Job+35%3A10.+Moreover%2C+the+work+of+creation+is+attributed+no+less+to+the+Son%2C+John+1%3A3%3B+Col.+1%3A16%3B+Heb.+1%3A2%3B+and+to+the+Holy+Spirit%2C+Gen.+1%3A2%3B+Job+26%3A13%3B+33%3A4%3B+Ps.+104%3A30%2C+than+the+Father+claims+it+%CE%B4%CE%B9%E1%BD%B0+%E1%BF%A5%CE%B7%CF%84%E1%BF%B6%CE%BD+%5Bdia+rh%C4%93t%C5%8Dn%2C+explicitly%5D.+That+the+Father+is+sometimes+peculiarly+called+creator+and+Lord+of+heaven+and+earth%2C+Acts+4%3A24%3B+Mt.+11%3A25%2C+is+all+from+the+order+and+mode+of+operation+in+creation.+For+He+created+not+from+another+but+from+Himself%2C+inasmuch+as+He+is+the+fountain+of+the+Deity+and+of+divine+operations.+The+Son%2C+however%2C+and+the+Holy+Spirit+created+not+from+themselves+but+from+the+Father%2C+and+the+Father+through+them%2C+1+Cor.+8%3A6%3B+Rom.+11%3A36.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alting%2C+The+Scriptural+Theology+of+Heidelberg%2C+vol.+1+%28d.+1644%3B+Amsterdam%3A+Jansson%2C+1646%29%2C+Locus+5%2C+%E2%80%98On+Creation%E2%80%99%2C+trans.+AI+at+Confessi

</figure><figure class="quote" id="q-e7fea6ed50" data-kw="">
<blockquote><p>The mode of giving supernatural grace to nature is, Junius stated, infusion, a term that is strikingly redolent of Aquinas’s conception of the mode of communicating grace.” (Seung J. Lee, Orders of Nature &amp; Grace, p. 60) Gale: “That supernatural good and virtue comes from God by divine infusion is generally asserted and demonstrated by the sectators of Augustin and Aquinas.” (4.496) . No Proper Habitual vs. Actual Grace Distinction On Maresius and Thomas: “Supernatural habits, by contrast [with natural habits], are stirred into action by the Holy Spirit, who dwells in the recipients of habitual grace (Maresius 1646-48, 2:143). Maresius disagrees with some Roman Catholic theologians, who suggest that people imbued with habitual grace require an additional gift of ‘actual grace’ before habitual grace bears fruit. For Maresius, the Spirit’s powerful presence is quite sufficient. As a result, Maresius is suspicious of the distinction between habitual and actual grace—a distinction, he notes, which is not found in Aquinas. That said, if by ‘actual grace’ is meant simply the Spirit’s activity in exciting supernatural habits into action, Maresius does not object, although he prefers the term ‘moving grace’ (Maresius 1646-48, 2:144). And since the Holy Spirit dwells with believers permanently, he argues that moving grace is also permanently present as to the principle of its motion, even if it is not permanently active.” (Stephen Hampton in Oxford Handbook of Early Modern Theology, p. 236) . Deification Thomas: “Now the gift of grace surpasses every capability of created nature, since it is nothing short of a partaking of the Divine Nature, which exceeds every other nature. And thus it is impossible that any creature should cause grace. For it is as necessary that God alone should deify [deificet], bestowing a partaking of the Divine Nature by a participated likeness, as it is impossible that anything save fire should enkindle.</p></blockquote>

</figure><figure class="quote" id="q-5f865897be" data-kw="">
<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>

</figure><figure class="quote" id="q-1119b32edf" data-kw="">
<blockquote><p>…views like Ockham’s prefigured themes that would come to define modern philosophy, and modern civilization more generally. The idea that only particular individual things exist and share no universal natures in common… Aristotelian metaphysics involves a number of complex distinctions which require for their expression an equally complex technical vocabulary; and this complexity only grew as Aquinas and other Aristotelian Scholastic philosophers of the Middle Ages developed Aristotle’s views further. This is unfortunate for the student of philosophy, but unavoidable given that the real world just is, Aristotelians would say, as complex as the vocabulary needed to describe it. But suppose that we interpreted this vocabulary in terms of a nominalist or conceptualist metaphysics, rather than a realist one. Then all those complicated technicalities would reflect, not objective reality, but only our subjective ideas or the way we decided to use words. The Scholastic philosophy that inherited this terminology would come to seem an exercise in mere wordplay and irrelevant hair-splitting, rather than a serious investigation of the real world. And that is exactly what happened as views like Ockham’s started to proliferate within Scholasticism. The early modern philosophers who rejected Aristotle and his Scholastic successors as mere sophists…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: A Refutation of the New Atheism (St. Augustine’s Press, 2008), ch. 5</cite>, p. 170-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

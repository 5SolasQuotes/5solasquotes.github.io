<blockquote><p>[…] The Second Book of Discipline, having been sanctioned by a free General Assembly in the reforming period, is to be regarded as one of the authoritative standards of the Covenanting Church. […]</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9dde05490c" data-kw="">
<blockquote><p>But though this has been said with reference to what is here handled, yet we may hence draw a general truth, — that no government is to be set up in the Church by the will of men, but that we are to wait for the command of God, and also that we ought to follow a certain rule in electing ministers, so that no one may intrude according to his own humour. Both these things ought to be distinctly noticed: for the Apostle here speaks not of persons only, but also of the office itself; nay, he denies that the office which men appoint without God’s command is lawful and divine. For as it appertains to God only to rule his Church, so he claims this right as his own, that is, to prescribe the way and manner of administration. I hence deem it as indisputable, that the Papal priesthood is spurious; for it has been framed in the workshop of men. God nowhere commands a sacrifice to be offered now to him for the expiation of sins; nowhere does he command priests to be appointed for such a purpose. While then the Pope ordains his priests for the purpose of sacrificing, the Apostle denies that they are to be counted lawful priests; they cannot therefore be such, except by some new privilege they exalt themselves above Christ, for he dared not of himself to take upon him this honour, but waited for the command of the Father. […] It hence appears that the greatest defect is the character of the office itself, that is, when men of themselves invent what God has never commanded. The less endurable then are those Romish sacrificers, who prattle of nothing but their own titles, that they may be counted sacred, while yet they have chosen themselves without any authority from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 116-17.</span></figcaption>

</figure><figure class="quote" id="q-e23ee680bb" data-kw="">
<blockquote><p>So may we say, can any man forbid bread and wine, that these should not receive the Lord’s Supper, which have received the Holy Ghost; and have in some degree all spiritual qualifications requisite in communicants. They have the word of promise, which is the greater; who can inhibit the sign which is the less? They are Mr. Geree his words for the baptism of infants. They are faederati, therefore they must be signati. It is Mr. Marshal’s argument upon the same subject; and mutatis mutandis applyable to our purpose. Perhaps you will say, you would willingly give believers their right, but prophane and scandalous persons will also intrude [into the Supper] who have no right: What if they do? If you have no power or authority from Christ to keep them back by yourself; If you have used the utmost of your power to erect an eldership in the congregation; if you have used your power of order to the utmost for keeping them back by exhortation, if you mourn for their intrusion, wherein are you to be blamed? Because they do wrong, will you do no right? And shall the saints be debarred their dues, because these wretches without your allowance, sieze upon what is undue, that unto which they have no right?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650) Jeanes was an English presbyterian., pp. 35-36</span></figcaption>

</figure><figure class="quote" id="q-27fdd8bb2e" data-kw="">
<blockquote><p>Those who hold Church government to be of divine right may feel uneasy in calling it positive. Rutherford, who wrote The Book on the subject, The Divine Right of Church Government (1646), did not. One reason why Church government is positive is because it is a special arrangement that does not simply inhere in or derive from nature; rather, it has been appointed in special revelation by the will of Christ about redemption. It is also political, in the sense of binding men in society. Church government could be otherwise (if Christ had so appointed); however the specific form of it, namely classical presbyterianism, is the particular form that Christ has chosen and instituted as the Mediatorial King of the Church, his Kingdom. The form of the government binds not from the nature of it (though it is in accord with the light of nature), but from Christ’s authority alone. Church government was different in the Old Testament, and had changed, developed and progressed numerous times therein. To say that New Testament Church government is positive does not mean that there is not any continuity between it and the Church government of the Old Testament; there is. But there is also not a direct one-to-one correlation between the two either, which some persons find perplexing. On the one hand, as these positive laws of Church government are binding as they are positive (just as the Mosaic ceremonial laws were binding to the Old Testament Church as they were positive), so under the normal circumstances of the Church in the course of history, every last spiritually prescribed detail (however minute) of Biblical, classical presbyterianism is binding by the authority and honor of Christ, the Church’s Lord. However, on the other hand, it is also because the laws of Church government are positive, and as moral obligations (in necessity) override positive ones, that alterations in the regular government of the Church, grounded in natural principles, may, and should, legitimately occur in extraordinary and necessary circumstances (as the Bible and historic presbyterianism teach). Because human, Church government is positive, according to the needs and circumstances of the Church in this age, it will greatly change and fall away with the renovation of all things in the Age to Come, when no teachers will be needed, as we will be beholding God face to face, immediately (Jer. 31:33-34; 1 Cor. 15:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Introduction’ to On Positive Laws &amp; Ordinances, &amp; the Law of Nations</cite></span></figcaption>

2C+it+is+also+because+the+laws+of+Church+government+are+positive%2C+and+as+moral+obligations+%28in+necessity%29+override+positive+ones%2C+that+alterations+in+the+regular+government+of+the+Church%2C+grounded+in+natural+principles%2C+may%2C+and+should%2C+legitimately+occur+in+extraordinary+and+necessary+circumstances+%28as+the+Bible+and+historic+presbyterianism+teach%29.+Because+human%2C+Church+government+is+positive%2C+according+to+the+needs+and+circumstances+of+the+Church+in+this+age%2C+it+will+greatly+change+and+fall+away+with+the+renovation+of+all+things+in+the+Age+to+Come%2C+when+no+teachers+will+be+needed%2C+as+we+will+be+beholding+God+face+to+face%2C+immediately+%28Jer.+31%3A33-34%3B+1+Cor.+15%3A28%29.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%98Introduction%E2%80%99+to+On+Positive+Laws+%26+Ordinances%2C+%26+the+Law+of+Nations&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27fdd8bb2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27fdd8bb2e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-extraordinary-acts-of-church-government-superintendents-assessor-elders-etc/#:~:text=Those%20who%20hold%20Church%20government%20to,immediately%20%28Jer.%2031%3A33%2D34%3B%201%20Cor.%2015%3A28&amp;text=Those%20who%20hold%20Church%20government%20to%20be%20of&amp;text=to%20face%2C%20immediately%20%28Jer.%2031%3A33%2D34%3B%201%20Cor.%2015%3A28" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

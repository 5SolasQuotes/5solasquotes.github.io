<main class="wrap"><figure class="quote" id="q-66a6fa8b73" data-kw="">
<blockquote><p>Cessation from labor for prayers or preaching on those appointed days of the week [by the Church], at some occasions, may be omitted… 3. …to leave work to come to the ordinary weekly meetings, they are only exhorted… for in one place where his [the bishop’s] antagonist maintains truly that the craftsman cannot be lawfully commanded nor compelled to leave his work and to go to public divine service, except on the day that the Lord has sanctified… …the 9th Head of the [Scottish] First Book of Discipline [1560], which says: ‘In great towns, we think expedient that every day there be either sermon or common prayers, etc.’ where there is nothing of compulsion or a forcing command; only there is an exhortation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 1, ch. 7, section 7, p. 24 Gillespie was a Scottish presbyterian, Westminster divine.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20a88fffc5" data-kw="">
<blockquote><p>Last of all, we are to distinguish between the condition of the primitive churches, before the division of parishes, and the state of our churches now after such division. At the first, when the multitude of Christians in those great cities of Rome, Corinth, Ephesus, etc. was not divided into several parishes, the common presbytery in the city did suffice for the government of the whole [as described in the N.T.], and there was no need of a particular consistory [session] of elders for every assembly and congregation of Christians within the city, except perhaps to admonish, rebuke or exhort, or to take notice of such things as were to be brought into the common presbytery. But after that parishes were divided, and Christian congregations planted in the rural villages, as well as in the cities, from henceforth it was necessary that every congregation should have at hand, within itself, a certain consistory, for some acts of church government, though still those of greater importance were reserved to the greater presbytery… If it be said that I seem to deny the divine right of the same, or that they have any warrant from the pattern of the apostolic Church, I answer: I acknowledge the conformity of the same with the pattern thus far: 1. It is to be suposed that in some small cities (especially the same not being wholly converted to the Christian faith) there was but one Christian congregation, the eldership whereof did manage matters of jurisdiction proper thereto. 2. Even in the great cities, at the first there was but one congregation of Christians, and so but one particular eldership. 3. After that the Gospel had spread, and Christians were multiplied in those great cities, it is true, they were all governed by a common presbytery, but that presbytery was not remote, but ready at hand among themselves. Now in this we keep ourselves as close to the pattern, as the alteration of the Church’s condition by the division of parishes will suffer us, that is to say, we have a common presbytery for governing the congregations within a convenient circuit, but withal our congregations have, ad manum, among themselves, an inferior eldership for lesser acts of government; though in respect of the distance of the seat of the common presbytery from sundry of our parishes, they cannot have that ease and benefit of neareness which the apostolic Churches had, yet by the particular elderships they have as great ease of this kind as conveniently can be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, ... (Edinburgh: 1641), pt. 2, ch. 2, 128-30</span></figcaption>

</figure><figure class="quote" id="q-989e42eb34" data-kw="">
<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation… 3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty… 4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice… 5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful… 6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>

<blockquote><p>3. The matter that Paul recommend Phebe for to the Roman Christians was a duty of common Christian love, to entertain her kindly as a Christian, to assist her as they could in her affairs at Rome, a duty jure naturali [by natural law] incumbent to all Christians both conjunctly and severally. And so the recommendation for that on her behalf might well be directed to all, elders and people. But interest of concurring in actings of Church government, being not juris naturalis but juris positivi [by positive law], persons must be sure of special warrant and vocation for concurring in them. So that ’tis but a very sick consequence, if letters of recommendation for such purpose, as these for Phebe, may be (or if ye will, ought to be) directed to the whole Church, then ought the whole Church also to concur in actings of Church government and jurisdiction [as in congregationalism]…</p></blockquote>

<blockquote><p>Although it be a great sin to contemn or neglect this ordinance,[n]… [n] Luke 7:30 with Exod. 4:24-26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession of Faith 1646</cite>, 28.5</span></figcaption>

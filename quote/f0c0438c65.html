<main class="wrap"><figure class="quote" id="q-f0c0438c65" data-kw="">
<blockquote><p>Jesus Christ, very God and very man (Matt. 1:21-23; Luke 1:35), i.e., having a true and human soul and a true human body formed of the same substance of the virgin Mary, daughter of David, by virtue of the Holy Ghost, was by this means conceived and born of the same virgin Mary—a virgin I say both after and before her deliverance; and all this was done for the accomplishment of our reconciliation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beza’s Confession</cite>, (1560), Article 23 in Dennison, Reformed Confessions 2.249-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>This is especially evident with respect to the blessed virgin, to whom they not only frequently ascribe divine names and articles (when they call her &quot;Goddess, Mistress, Queen of Heaven, Mother of Mercy, Redemptress, Our Omnipotent Mistress, the Refuge of sinners&quot;), but also worship internal as well as external.</p></blockquote>

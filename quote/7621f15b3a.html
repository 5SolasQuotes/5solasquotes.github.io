<main class="wrap"><figure class="quote" id="q-7621f15b3a" data-kw="">
<blockquote><p>The cause of our war is of great weight: as namely, for the glory of God and our own Salvation, for in all Satan’s skirmishes he seeketh to impeach God’s glory, with false imputations, and to bring us to utter destruction, and this may appear with the first conflict of his with our Mother Eve, Gen. 3. 4, 5. where he accuseth God of a lie, who is truth itself, and of impotency and envious disdain, saying that the cause why he did forbid them to eat of the tree of knowledge of good and evil, was not (as he had said) because they should die, but because he knew that when they should eat thereof their eyes should be opened, and they should be as God’s knowing good and evil.

1. Where he seeketh to dim the beams of God’s glory, by accusing him of a lie, and to persuade them that he was not Omnipotent, seeing that he was able to hinder them from being [g]ods, if they tasted of this fruit: lastly, that he forbid them to eat thereof, because he envied them so glorious an estate.

2. He laboreth to destroy our first Parents both body and soul, by tempting them to disobedience and transgression of God’s commandment, and therefore our Saviour Christ doth justly join those two together in the 8 of John 44. saying, That he was a liar, and a man-slayer from the beginning. A liar, in that he falsely accused God of a lie; a Man-slayer, because he did it to this end, that he might murder our first Parents, and all their posterity both body and soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s combat: or, His true spiritual warfare wherein is laid down the nature, power, and cunning deceit of Satan, the great enemy of our salvation. With the means whereby every good Christian may withstand his dreadful assaults</cite>, (London: Charles Tyus, 1664), pp 7-8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6be81c6b5f" data-kw="">
<blockquote><p>Thirdly, your cause is just also, agreeable to the Law of Nature; for, Conservatio sui ipsius est opus naturalissimum, to the Law of God: for David though not the representative body yet lawfully took up arms for his own defence; to the Law of the Kingdom, for what more legal then that the Houses of Parliament should bring in Delinquents to trial, and how can that be without Arms when the Delinquents betake themselves to their Arms? The Schoolmen say three things concur to a just war.

First, Jurisdictio indicentis, and for that you have the Authority of Parliament, which, as one writes, if you respect Antiquity, is of all Courts the most ancient; if dignity, is of all Courts the most honourable; if authority and jurisdiction, is of all Courts the most copious. Secondly, Offensio patientis, and for that you have matter too much, and your enemies too little, the great cause of their arms is but some peace of prerogative (if they pretend truly) a cause infinitely beneath so unkind &amp; bloody a war as this is. Thirdly, Intentïo boni convenientis, and for that I dare say you are bellando pacifici, your war being to prevent war, and your present bleeding to prevent some great sickness which this State would sink under.

Fourthly, your Forces live and march under as many prayers as ever English Armies did, you have preces armaras; and though Joshua fought valiantly, Exod. 17. yet the prayers of Moses (who was not in the fight) got the field.

Fifthly, If you do overcome, you shall not make your selves slaves by your own victories; we may truly say of some, Dum vincunt victi sunt: when they have overcome others, they are slaves themselves; your Religion, Laws, and Liberties stand all ready to reward your prowess.

And sixthly, If you be overcome and die, you die for God and your Country; who can bring his life into a better market? blessed are those that dye for the Lord, so that word is rather to be read, Rev. 14. 13. Wherefore as heretofore so now much more labour to hold forth the virtues of him that hath called you to this great employment. As Soldiers are more honoured then others, so they should be more virtuous; he had need carry much grace in his heart that doth daily carry his life in his hand; and your Soldiers should as well overcome the Countries with their good examples, as the Enemies with their swords.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-7456f1d0c7" data-kw="">
<blockquote><p>For our wills and affections; we should be ready to cross and bend them against all the noise of corrupt delights; to pluck out our right eye, cut off our right hand; to be crucified to the world; to be disposed of by God’s providence, cheerfully in any course, whether of passive obedience to have a mind submitting unto it, and rejoicing in it; or of active obedience to obey him, contrary to the stream and current of our natural desires; though it be to offer unto him our Isaac, our closest and choicest affection; though to shake off the child that hangeth about our neck, to stop our ear to the voice of her that bare us, to throw the wife out of our bosom, when they shall tempt us to neglect God, to spit out the sweetest sin that lies under our tongue; briefly, to take under Christ’s banners the Roman oath, to go and do where and whatsoever our great captain commanded; neither for fear of death, or dread of enemy, to forsake service, or resign weapon till death shall extort it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 58.</span></figcaption>

</figure><figure class="quote" id="q-e8b87cac6e" data-kw="">
<blockquote><p>XV. …the orthodox maintain… the question here… (4) It is not whether any dissent of parents avaricious and through sheer obstinacy will not consent to the proper marriage of children and cannot give sufficient reasons for their dissent after the request has been made by their children that the latter are not absolutely bound to their will, but it is right for them to apply to a superior power to whom a judgment concerning the justice or injustice of the dissent belongs. Thus the matter being well considered, they may determine what the children ought to do and consult their interest by supplying in this point the defect of the consent of the parents.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XV. …the orthodox maintain… the question here… (4) It is not whether any dissent of parents avaricious and through sheer obstinacy will not consent to the proper marriage of children and cannot give sufficient reasons for their dissent after the request has been made by their children that the latter are not absolutely bound to their will, but it is right for them to apply to a superior power to whom a judgment concerning the justice or injustice of the dissent belongs. Thus the matter being well considered, they may determine what the children ought to do and consult their interest by supplying in this point the defect of the consent of the parents.”

— Francis Turretin, Institutes of Elenctic Theology, (P&amp;R), vol. 2, 11th Topic, ‘The Law of God’, Q. 16, ‘May Children Withdraw Themselves from the Power of Their Parents &amp; Marry Without their Consent? We Deny Against the Papists., p. 108">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXV.+%E2%80%A6the+orthodox+maintain%E2%80%A6+the+question+here%E2%80%A6+%284%29+It+is+not+whether+any+dissent+of+parents+avaricious+and+through+sheer+obstinacy+will+not+consent+to+the+proper+marriage+of+children+and+cannot+give+sufficient+reasons+for+their+dissent+after+the+request+has+been+made+by+their+children+that+the+latter+are+not+absolutely+bound+to+their+will%2C+but+it+is+right+for+them+to+apply+to+a+superior+power+to+whom+a+judgment+concerning+the+justice+or+injustice+of+the+dissent+belongs.+Thus+the+matter+being+well+considered%2C+they+may+determine+what+the+children+ought+to+do+and+consult+their+interest+by+supplying+in+this+point+the+defect+of+the+consent+of+the+parents.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+%28P%26R%29%2C+vol.+2%2C+11th+Topic%2C+%E2%80%98The+Law+of+God%E2%80%99%2C+Q.+16%2C+%E2%80%98May+Children+Withdraw+Themselves+from+the+Power+of+Their+Parents+%26+Marry+Without+their+Consent%3F+We+Deny+Against+the+Papists.%2C+p.+108&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8b87cac6e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8b87cac6e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/quotes-on-the-authority-of-fathers-in-giving-away-their-daughters-in-marriage/#:~:text=the%20orthodox%20maintain,of%20the%20consent%20of%20the%20parents&amp;text=the%20orthodox%20maintain&amp;text=the%20defect%20of%20the%20consent%20of%20the%20parents" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>About the middle of August [1665] I set myself to write a short exhortation to those who were shut up because of the plague, and just when I had finished it, heard the melancholy news of my father’s death, on the 16th; upon which I wrote a letter to comfort my mother, wherewith I much comforted myself; and on the 24th sent abroad my little exhortation to those who were shut up, beseeching God that it might do good to all. And on the 30th I thought of writing a little treatise of comfort in this sad time, which I finished and sent to my bookseller September the first, praying the blessing of Heaven might attend upon these my little labors for the good of souls.” – Autobiography Grosvenor, Benjamin – Preparation for Death, the Best Preservative Against the Plague, being the substance of 2 Sermons (London, 1721) Grosvenor (1676–1758) was originally an English, primitive baptist, but was excommunicated when he became a presbyterian. He then served as a dissenting presbyterian minister and was a ‘moderate Calvinist’. From 1720-22 there were plagues in France (the Great Plague of Marseille) and in New England. England prepared for it, but apparently never got it. Barnard, John – ‘2nd Sermon, The Fatal Consequence of a People’s Persisting in Sin: Preached… on a Public Fast in the Time of the Measles, Jan, 14, 1713/14’ in Two Sermons: The Christian’s Behavior under Severe and Repeated Bereavements, and The Fatal Consequence of a Peoples Persisting in Sin (Boston, 1714) Clarke, Samuel – Sermons 7-9 in XVII sermons on several occasions… (London, 1724) on Isa. 26:9; Lk. 13:2-3 &amp; Mt. 24:7 Clarke (1675-1729) was a latitudinarian, Anglican clergyman and English philosopher. He is considered the major British figure in philosophy between John Locke and George Berkeley. Emerson, Joseph – ‘A Word to those that are Afflicted very much; Mr. Emerson’s sermon on the mortal sickness at Malden; Essay to preserve the memory, and improve the affliction, of the late mortal sickness at Malden; a sermon preached at the lecture in Malden, October 20th 1738, on occasion of the repeated and multiplied deaths of children in many families in said town, by the throat distemper’ (Boston, 1738) . American Presbyterians Davies, Samuel – ‘This Very Year You Are Going to Die!’ (1761) A sermon on Jer. 28:16, “This year thou shalt die.</p></blockquote>

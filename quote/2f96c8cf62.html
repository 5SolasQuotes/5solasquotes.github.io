<main class="wrap"><figure class="quote" id="q-2f96c8cf62" data-kw="">
<blockquote><p>For seeing that the sin of Adam hath so corrupted man, that our whole kind of his own nature can now do nothing else but sin, and whatsoever sins have afterward followed, are the fruits of that transgression: the sin of Adam may seem to have been of no less force to destroy, then the grace of Christ to restore. To dissolve this doubt, we confess that of the offence of the first parent, and of original sin dispersed abroad into every one of us, do spring other sins. Howbeit, this is to be noted, that all wicked acts are not so of necessity knit with original sin, that they straightway proceed thereof. For otherwise we should all commit so many and the self same sins. And that this is not true, both the thing itself, &amp; also experience teacheth.

Wherefore Paul considered, that thorough our counsels &amp; deliberations, are after a sort infinite sins added unto that first fault, but the grace of God through Jesus Christ hath not only removed away that one sin, which is in us by nature, but also hath from (in a manner) infinite other sins brought us unto righteousness, &amp; hath after a sort for one ill turn, rendered unto us three good. For he hath both abolished that one sin which is in us by nature, and hath removed away infinite other sins, which we have committed since, and hath restored us to a righteous life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romans wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Epi</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 116.</span></figcaption>

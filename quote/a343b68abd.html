<blockquote><p>As a result of the influence of Libertarian Theology on most modern theonomists, they have generally shunned the establishment principle and rejected the idea that the civil magistrate is to financially endow the external observance of true religion. The irony of this is that it violates a central principle of theonomic hermeneutics: that whatever is commanded in the Old Testament, and was not repealed in the New Testament, remains binding. It is clear that true religion was nationally endowed in the Old Testament, yet the majority of contemporary theonomists argue that the state should not endow the church in the New Testament. David Scott corrects this muddled thinking in the extract below:

It is objected that the New Testament contains no appointment of such provision. The answer to this objection is brief but most satisfactory. The Old Testament is of divine authority as well as the New, and as obligatory in its precepts for our direction in doctrine and practice as the New Testament, in every thing except the peculiarities of the former dispensation. To provide for the maintenance of religion is peculiar to no administration of religion, but common to all. It is a moral principle which is in no ways affected by any change in its outward dispensation. The provision made for the Old Testament church is an example having all the force of a command, for the command though given to the Jewish people, regarded a moral duty, and therefore not peculiar to them, but common to them and us. It is not necessary then that there should be any precept in the New Testament; that which was given in a former dispensation continues in full force. The friends of a public provision for religion, have a right to ask those who are opposed to it, to furnish New Testament authority for the rescinding of the precept which was formerly given. Nothing short of this can affect the argument or form an objection to the duty of a national provision for religion. A merely positive appointment remains in force till it is abrogated. Does the New Testament contain any such rescinding act? Had it been only a positive appointment if not rescinded it would have remained in force; how much more being a moral duty?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 292.</span></figcaption>

<blockquote><p>A good thing brings forth a bad one, they say, if it is not given at the right time. Accordingly even the study of the best and greatest things are harmful if they are not undertaken at the appropriate time. Therefore our ancestors – when they established the sequence of learning – thought out certain steps like grades, by which the young would be led in order from the lower arts to the higher ones. Now, as if these restraints had been broken, the matter is done without order.

Suddenly, like mushrooms, theologians, lawyers and doctors are brought forth, without dialectics, without knowledge of speaking, without the cradle-bands of natural and moral philosophy. The knowledge of these was once taught to all alike, before they were admitted to the higher disciplines, not only because this makes for very good education, but also because it sharpens the judgement and prepares one for the acquisition of greater things. However, now it is sufficient to take a large felt cap to these most venerable disciplines, and to show great contempt for all humanities teaching.

If the laws and the magistrates do not restrain this temerity, there will soon be no erudition in the state, no teaching of anything. For these theologians, lawyers and doctors who spring forth suddenly, not endowed with any decent teaching, not only allow the other arts to perish, but they cannot preserve their own professions either. And it is not the case that these concerns for the preservation of scholarship are not the business of the magistrates, for they are called gods by the Holy Spirit, so that they would preserve and retain the divine gifts on earth – religion, civil order and all the honourable arts. Because of that responsibility for divine things they bear the solemn title, and the magistrates have no greater and more venerable distinction than that.

Therefore it is appropriate that they keep watch on them, so that the honourable disciplines do not fall into oblivion, the order of learning having been upset. Plato said [Republic IV, 424c] that the state changes if it comes about that the music changes; and this is not said uselessly. But it is much truer that the state changes if studies are changed. And indeed, all changes of the state are of concern to the magistrates. An overturned order of studies brings with it the downfall of the greatest and best things; therefore the magistrates need to be more watchful about this than about anything else. And I do not doubt that one day new laws will be established concerning these things, once the current disorder and commotion of the state have calmed down. May an effortless and easy overturning be granted to them by the favour of God!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-cruciger.html">Caspar Cruciger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Order of Learning (1531) in Orations on Philosophy and Education</cite></span></figcaption>

</figure><figure class="quote" id="q-64f61fc0cc" data-kw="">
<blockquote><p>For in a Christian communion there are these different administrations or polities or states, ecclesiastical and civil. … For, 1. Though both agree in this, that there is order in their administrations, yet with this difference that the guides in the church have not a despotical, but Œconomical power only, being not lords over Christ’s heritage, but stewards and ministers of Christ and of the church; the dominion and law-giving power being reserved to Christ alone, as he only [is the] head of the church. But in the other state he has given lordly power, authority, and dominion unto men.

2. Though both agree in this, that man is the common subject of them both, yet with this difference, man by nature being a reasonable and sociable creature, capable of civil order, is or may be the subject of civil power and state. But man by grace called out of this world to fellowship with Jesus Christ, and with his people, is the only subject of church power; yet so, as the outward man of church members is subject to the civil power in common with other men, while their inward man is the subject of spiritual order and administrations.

3. Though they both agree in this, that God is the efficient [cause] and author of them both, and that by Christ, yet not eadem ratione [for the same reason]. For, God as the Creator and Governor of the world is the author of civil order and administrations. But God as in covenant with his people in Christ is the author of church administrations. So likewise Christ, as the essential word and wisdom of God creating and governing the world is the efficient [cause] and fountain of civil order and administrations. But as mediator of the New Covenant and head of the church, he establishes ecclesiastical order.

4. Though they both agree in this, that they have the same last end, viz., the glory of God, yet they differ in their next ends; for the next end of civil order and administrations is the preservation of humane societies in outward honour, justice, and peace. But the next ends of church order and administrations are the conservation, edification, and salvation of souls, pardon of sins, power against sin, peace with God, etc.

5. Hence arises another difference about the objects of these different states. For though both agree in this, that they have the common welfare for their aim and scope, yet the things about which the civil power is primary conversant are bodies, τα βιωτικά (1 Cor. 6:4) or τά πρός τόν βίον, “the things of this life” as goods, lands, honour, the liberties and peace of the outward man. The things whereabout the church power is exercised are τά πρός τόν θεόν, “the things of God” (Heb. 5:1) as the souls and consciences of men, the doctrine and worship of God, the communion of the saints. Hence also they have different laws, different officers, different power, whereby to reduce men to order, according to their different objects and ends.</p></blockquote>

ise+Christ%2C+as+the+essential+word+and+wisdom+of+God+creating+and+governing+the+world+is+the+efficient+%5Bcause%5D+and+fountain+of+civil+order+and+administrations.+But+as+mediator+of+the+New+Covenant+and+head+of+the+church%2C+he+establishes+ecclesiastical+order.%0A%0A4.+Though+they+both+agree+in+this%2C+that+they+have+the+same+last+end%2C+viz.%2C+the+glory+of+God%2C+yet+they+differ+in+their+next+ends%3B+for+the+next+end+of+civil+order+and+administrations+is+the+preservation+of+humane+societies+in+outward+honour%2C+justice%2C+and+peace.+But+the+next+ends+of+church+order+and+administrations+are+the+conservation%2C+edification%2C+and+salvation+of+souls%2C+pardon+of+sins%2C+power+against+sin%2C+peace+with+God%2C+etc.%0A%0A5.+Hence+arises+another+difference+about+the+objects+of+these+different+states.+For+though+both+agree+in+this%2C+that+they+have+the+common+welfare+for+their+aim+and+scope%2C+yet+the+things+about+which+the+civil+power+is+primary+conversant+are+bodies%2C+%CF%84%CE%B1+%CE%B2%CE%B9%CF%89%CF%84%CE%B9%CE%BA%CE%AC+%281+Cor.+6%3A4%29+or+%CF%84%CE%AC+%CF%80%CF%81%CF%8C%CF%82+%CF%84%CF%8C%CE%BD+%CE%B2%CE%AF%CE%BF%CE%BD%2C+%E2%80%9Cthe+things+of+this+life%E2%80%9D+as+goods%2C+lands%2C+honour%2C+the+liberties+and+peace+of+the+outward+man.+The+things+whereabout+the+church+power+is+exercised+are+%CF%84%CE%AC+%CF%80%CF%81%CF%8C%CF%82+%CF%84%CF%8C%CE%BD+%CE%B8%CE%B5%CF%8C%CE%BD%2C+%E2%80%9Cthe+things+of+God%E2%80%9D+%28Heb.+5%3A1%29+as+the+souls+and+consciences+of+men%2C+the+doctrine+and+worship+of+God%2C+the+communion+of+the+saints.+Hence+also+they+have+different+laws%2C+different+officers%2C+different+power%2C+whereby+to+reduce+men+to+order%2C+according+to+their+different+objects+and+ends.%E2%80%9D%0A%0A%E2%80%94+John+Cotton%2C+A+discourse+about+civil+government+in+a+new+plantation+whose+design+is+religion.+Written+many+years+since%2C+by+that+Reverend+and+worthy+Minister+of+the+Gospel%2C+John+Cotton%2C+B.D.%3B+And+now+published+by+some+undertakers+of+a+new+plantation%2C+for+general+direction+and+information%2C+%28Cambridge+MA%3A+Samuel+Green%2C+1663%29%2C+pp+6-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64f61fc0cc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64f61fc0cc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/08/john-cotton-on-the-differences-between-the-two-kingdoms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-31c9c6c42f" data-kw="">
<blockquote><p>But it may be asked again, are synodical decrees to be received as infallible? Certainly not. A synod being constituted of men, however wise and grave, yet of like passions with others, may greatly err, and therefore all their decrees are to be examined by the Law and Testimony. But when as in the Synod at Jerusalem, they examine a question by the light of Scripture, and in the decree which they enact, hear and obey the voice of Christ, speaking in his word, then should that decree be felt binding on the consciences of those over whom the court rules, inasmuch as Christ has said, whatever they thus bind on earth, He will bind in heaven.

That power which church courts exercise, be it remembered, is not self-assumed — not self-created. It is derived immediately from Christ. He only has a right to make laws and appoint officers in His church; and the authority which they exert is therefore only ministerial. That is, as His servants they declare and carry into execution those laws, and those only which are agreeable to the expressed will of their Master. Like judges on the bench, they have no power either to make new laws, or change the laws already laid down. The Bible is their great code, and whenever they depart from that, they have no claim on your obedience.

The force which they employ is not carnal, but moral and spiritual; a force which exerts itself, not in controlling the persons of men, not in inflicting bodily penalties, not in taking possession of their properties, not in giving them over to the civil power, that by its mighty arm they may be crushed; but in warning them of their danger, in rebuking them for their folly, in censuring them for sin, and when they belie their profession, in excluding them from the fellowship of the church. Nor can they exercise even this power over any but those who have voluntarily joined the church, and have in doing so, pledged themselves to submit to its laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-denham.html">James Denham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse III in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

</figure><figure class="quote" id="q-83f4d58b1c" data-kw="">
<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lawfulness of Obeying the Present Government</cite>, … (London, 1649) Rouse was a Westminster divine., pp. 9-10</span></figcaption>

<blockquote><p>The church of Scotland is tied yet with another bond to hate holidays, of which other churches are free; for, by a solemn oath sworn to the God of heaven, she hath abjured all antichristian and popish rites, and dedicating of days particularly.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99bc451774" data-kw="">
<blockquote><p>The Mohammedan imposture is, in some respects, the most remarkable of all false religions. The specious simplicity of its essential doctrines, and its perfect freedom from idolatry, distinguish it forever from the gross mythology of classical and oriental paganism. But besides these characteristics, it displays a third, more interesting still. We mean the peculiar relation which it bears to Christianity. Whether it happened from a happy accident or a sagacious policy, we think it clear that Islam owes a vast proportion of its vast success, to the fact that Mohammed built upon another man’s foundation. Assuming the correctness of the common doctrine that the impostor was a brilliant genius, though a worthless libertine, and that his book is the offspring, not of insane stupidity, but of consummate artifice, there certainly is ground for admiration in the apparent union of simplicity and efficacy in the whole design.

The single idea of admitting freely the divine legation of the Hebrew seers, and exhibiting himself as the topstone of the edifice, the Last Great Prophet, and the Paraclete of Christ, has certainly the aspect of a master stroke of policy. Besides conciliating multitudes of Jews and soi-disant Christians, at the very first, this circumstance has aided the imposture not a little ever since. It relieves the Moslem doctors from the dire necessity of waging war against both law and gospel. Whatever can be cited from the Greek and Hebrew Scriptures, without disparaging Mohammed, they admit as readily as any Jew or Christian. Whatever, on the contrary, is hostile to his doctrines or pretensions, or at all at variance with the statements of the Koran, is disposed of, not by an absolute rejection of the Bible, but by a resort to the convenient supposition of corruption in the text. It is not the policy of Islam to array itself against the Jewish and the Christian dispensations, as an original and independent system; but to assume the same position in relation to the Gospel, which the Gospel seems to hold in relation to the Law—or, in other words, to make itself the grand denouement of that grand scheme, of which the Old and New Testaments were only the preparatory stages.

Indeed, if we were fully satisfied that the Rasool Allah [the apostle of God] had any plan at all, we should be disposed to account for it in this way. He was acquainted with three forms of religion, Judaism, Christianity, and Paganism. Disgusted with the latter, he was led, we may suppose, to make some inquiries into the points of difference, between the Jews and Christians. This he could not do, without discovering their singular relation to each other the Christians acknowledging the Scriptures of the Jews, but adding others to them, and regarding Jesus Christ as the Messiah—the Jews on the other hand rejecting the New Testament, and bitterly denying the Messiahship of Christ. This fact might very readily suggest the project of a new dispensation—a third one to the Christian, and a second to the Jew. The impostor would thus be furnished with an argument ad hominem to stop the mouths of both.

To the Jews he could say, Did not Moses tell your fathers that a prophet should rise up in the latter days, greater than all before him? I am he. Do you doubt it? Here is a revelation just received from Gabriel. Do not all your sacred books predict the coming of a great deliverer, a conqueror, a king? I am he. In a few months you shall see me at the head of a thousand tribes going forth to the conquest of the world. If this was the ground really taken at first, how striking must have been the seeming confirmation of these bold pretensions, when Mohammed and his successors had in fact subjected, not Arabia only, but Greece, Persia, Syria, and Egypt.

To the objection of the Christians, that the line of prophets was long since completed, he could answer, Did not Jesus come to abrogate or modify the law, when its provisions were no longer suited to the state of things? Even so come I, to supersede the Gospel—not to discredit, but to render it unnecessary, by a more extensive and authoritative doctrine. So far from being antichrist (as some no doubt objected) I am the very Comforter whom Jesus promised.

That such sophistry might easily have undermined the faith of renegadoes [sic] and half-pagan Christians, is certainly conceivable. Whether this was in fact the course adopted in the infancy of Islam, will admit a doubt. Be that as it may, it is certain, that the impostor considered it expedient to incorporate the leading facts of sacred history into his revelation, so far as they were known to him. That his knowledge of the subject was imperfect, need not excite our wonder. The sources which probably supplied his information, could scarcely be expected to emit a purer stream than that which irrigates the pages of the Perspicuous Book.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-addison-alexander.html">Joseph Addison Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Statements of the Koran in Biblical Repertory and Theological Review</cite></span></figcaption>

<blockquote><p>…Tertullian wanted all females veiled from the time of puberty (1.1; 16.3). Some virgins, to the contrary, were attending the church gatherings unveiled, and some married women made only a token covering of the head (17.1, 4). Both sides, it seems, assumed that married women would be veiled in public. It is not clear whether Tertullian, who was under the influence of the Montanist movement on the basis of a revelation by the Paraclete (1.7) is an innovator or is trying to restore a practice being neglected or abandoned. His description of varied hairstyles (On the Apparel of Women 2.7) indicates not many women were in fact veiled.</p></blockquote>

<blockquote><p>Does not the importance of the Sabbath, in a civil view, invest it with an undeniable claim to the protection of public law? The laws of all Christian States have, to a greater or less extent, given their authority and protection to the Sabbath. Men of wisdom, honour, and virtue, have ever felt that it ought to be among the earliest objects of their solicitude to perpetuate the blessings of this holy day.

And does not the importance of the Sabbath plead irresistibly for this paternal interposition? Is the Sabbath the great means of perpetuating in the earth the knowledge of the true religion? Is it the great means of intellectual advancement? Does it lie at the foundation of all sound morality? Is it not less a distinguished means of temporal prosperity, than of holiness and eternal life? Then is there no institution around which a more impenetrable barrier of wholesome restrictions ought to be erected.

The Sabbath is the noblest and firmest pillar of a well-regulated society. It is the corner-stone of that noble edifice of morals, liberty, and public weal, which is the pride and exultation of every prosperous community. If our political institutions cannot be preserved unless the laws and usages of the land are formed on the basis of sound morality; if morality cannot be maintained without the active impression of religious principle; and if neither can exist long, where the Sabbath exerts none of its heaven-born influence; then is it not the truest policy of a State to enforce the observance of this day?</p></blockquote>

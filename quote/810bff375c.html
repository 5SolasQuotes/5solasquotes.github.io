<blockquote><p>VI. On the Personality of God. The use has spread among pantheists of denying God’s true and real personality, so that those who defend a personal God are accused by them of anthropomorphism, as if the notion of personality cannot apply to God without anthropomorphizing Him, or constituting Him in the image and likeness of humans. These views are widely disseminated in Hegelian philosophy, as can be seen in Vera’s Introduction à la philosophie de Hegel. Avant-propos, p. 20, and the following (2nd edition). However, to deny the existence of a personal God is tantamount to denying God Himself, nor does asserting the personal nature of God lead to anthropomorphism. Let us prove both assertions. VII. The Admission of a Personal God. We defined elsewhere a suppositum, which is a perfectly subsistent substance, self-owned and incommunicable to another. From this it follows that since substantiality, by virtue of its subsistence, is the perfection by which substance exceeds accidents, a fortiori, perfect subsistence, by which a substance becomes self-owned and incommunicable to another, exhibits true and real perfection. And because a spiritual nature is the most perfect among beings, a subsisting complete subsistence (which is therefore called a person, as we stated in Ontology loc. cit.), implies something supremely perfect. Or, as St. Thomas says in STh. I, q. 29, a. 3, “Person signifies what is most perfect in all nature — that is, a subsistent individual of a rational nature.” We have indeed proved the truly and really existing First Efficient Cause of all substances, the Most Perfect Being, the Supreme Reason ordering all created things towards their end; therefore, the first Substance truly exists, most perfect in the notion of subsistence, and therefore fully self-owned and incommunicable, supremely intelligent, most notably endowed with the requisites for the notion of personality; and this first substance is called God. Consequently, God is truly a person, with a personality distinct from other things, as proven against pantheists. However, the term “person” is not applied to God in the same way as it is to creatures but in a more excellent manner, just as other names are attributed to God in a more excellent manner than to creatures. Those who wish to deny a personal God should indeed be considered atheists. For without a doubt, they either concede that God is a real substance, perfectly subsistent and intelligent in Himself, and by this admission, they must acknowledge God as personal, as is evident from what has been said, or they deny to God proper perfect substantiality and intelligence, and in this second hypothesis, God becomes something abstract or indeterminate, like every universal, as the adversaries indeed contend. However, what is abstract, as abstract, and what is indeterminate, as indeterminate, etc., exists not in reality outside the mind but in the mind itself, without its proper actions; for they do not act unless through singulars. Therefore, an impersonal God is merely a concept of reason, and thus by word only God is left, while in reality God is removed. Moreover, not only are the assertions about anthropomorphism absurd but also blatantly ridiculous. For they suppose that the notion of personality requires a body, or that real infinity is incompatible with personality; yet they fail to realize that if personality is a perfection derived uniquely from a spiritual nature, then to any subsisting substance, the notion of personality must correspond to the extent to which it is more spiritual, dissociated from and independent of the body, and possesses the most perfect nature. Now, God is in the highest degree of spirituality and infinite perfection. Therefore, He is in the highest degree of personality, so that personality in God not only does not imply anthropomorphism but essentially excludes it.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-899d6c24a5" data-kw="">
<blockquote><p>Works of Nature they call those which God produces in Nature by a certain common operation. And they are either of Creation, or of Conservation and Governance. … By this, however, no Persons of the Deity are excluded from creation, but only creatures and fictitious divinities. For the individual Persons are that one, true, living, and everlasting God, and in respect to them this work no less than the other external works is counted indivisible or common. Which the very history of creation openly testifies, when it introduces several Persons consulting and creating, Gen. 1:26. Scripture testifies elsewhere, where concerning the one God the creator it speaks by the name of makers, Isa. 54:5, in the plural number, Job 35:10. Moreover, the work of creation is attributed no less to the Son, John 1:3; Col. 1:16; Heb. 1:2; and to the Holy Spirit, Gen. 1:2; Job 26:13; 33:4; Ps. 104:30, than the Father claims it διὰ ῥητῶν [dia rhētōn, explicitly]. That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.</p></blockquote>

<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>

<blockquote><p>And as the Author, and fellow-Counsellor, and Framer of the things that are in formation, He begot the Word; and as He bears this Word in Himself, and that, too, as (yet) invisible to the world which is created, He makes Him visible; (and) uttering the voice first, and begetting Him as Light of Light, He set Him forth to the world as its Lord, (and) His own mind; and whereas He was visible formerly to Himself alone, and invisible to the world which is made, He makes Him visible in order that the world might see Him in His manifestation, and be capable of being saved. 11. And thus there appeared another beside Himself. But when I say another, I do not mean that there are two Gods, but that it is only as light of light, or as water from a fountain, or as a ray from the sun. For there is but one power, which is from the All; and the Father is the All, from whom comes this Power, the Word. And this is the mind which came forth into the world, and was manifested as the Son of God. All things, then, are by Him, and He alone is of the Father. Who then adduces a multitude of gods brought in, time after time? For all are shut up, however unwillingly, to admit this fact, that the All runs up into one.</p></blockquote>

<blockquote><p>71. Fourthly, they [Romanists] accuse us of blasphemy against the Son of God, for denying (as they say) that He is Deus ex Deo, God of God: against the doctrine of the Nicene Creed; and this they call the atheism of Calvin and Beza: a palpable slander: for neither Calvin nor Beza did ever imagine, much less utter the same in that sense which they lay to their charges: for let [Robert] Bellarmine their sworn adversary speak for them: ‘Calvin and Beza teach’ (says he) ‘that the Son is of Himself in respect of his essence, but not in respect of his Person, and they seem to say that the essence of the Deity in Christ is not begotten, but is of itself: which opinion’ (says he) ‘I see not why it may not be called Catholic.’ Here Bellarmine tells us truly what their opinion was, and does acknowledge it to be a true catholic doctrine: and yet in the same chapter he contemns Calvin for his manner of speaking of it and of intolerable sauciness for finding fault with the harshness of the phrase used by the Nicene Council, ‘God of God: Light of light’. Mark (I pray you) his absurdity, it is catholic, and yet it may not be spoken: it is true, and yet it is to be blamed. May not a catholic doctrine be spoken then? or must the truth be smothered? This is such an inconsequence as neither reason nor religion can any ways bear withal: and for his saucy dealing with the Nicene Council, all that ever he says is, that it is durum dictum, ‘a hard phrase’: yet so that he confesses it may receive a good and commodious interpretation if it be understood in the concrete, that Christ who is God, is of the Father that is God: the word being taken personally, and not in the abstract; as if the essence of the Deity of the Son should be from the Father, which is entirely subsisting, in, of, and by its own eternal, incomprehensible, and most glorious nature: and this without question was the true intendement of the Council; for else it had not confuted, but favored the blasphemous heresy of Arius, against whom it was assembled, which Calvin and Beza do not anyways cross, but onely bring unto it a fit and fauourable exposition. Thus we have Bellarmine, Calvin’s and Beza’s patron in this doctrine, though full ill against his will: and not only him, but Ribera and Gregory de Valentia, two other no mean Rabbies, both which do conclude that: ‘the Son as He is a Person, is of another; but as He is a simple ens [being], is not of another: and that the essence does not beget the essence, but the Father the Son;’ so that either they are slanderers of the truth, or their catholic doctrines may be atheism and blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beard.html">Thomas Beard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retractive from the Romish Religion… (London, 1616), Motive 12</cite>, pp. 469-70</span></figcaption>

<blockquote><p>The civil part, or the duty of nations to acknowledge the Lord Jesus Christ as king over (not of) them, to give and administer God’s law.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e81afad5ea" data-kw="">
<blockquote><p>It is an agreed principle of theological and sociological teaching that Catholic citizens should not vote for leaders who are inimical to Christianity… It is, however, held to be lawful to vote for an unworthy candidate in certain circumstances—for instance, if this is necessary to exclude an even more unsuitable one, or if failure to vote for a particular candidate would involve disproportionate personal loss, or if there is good hope, all things considered, that the election of this candidate may ultimately conduce to the common good… To sum up then: we agree that normally Catholics should not vote for non-Christian candidates. But if it is clear, when account is taken of the circumstances of person and place, that a particular non-Christian candidate is willing to act in accordance with Christian principles, we think that it is not unlawful to vote for him…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-canon-mccarthy.html">John Canon McCarthy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems in Theology II: the Commandments</cite>, (Dublin, 1959), sect. 2, 1st &amp; 2nd Commandments, ‘The Morality of Voting for Non-Christians’, pp. 86-88 McCarthy was a Romanist professor of moral theology.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a3c70a2ef6" data-kw="">
<blockquote><p>21. ‘Moreover, thou shalt provide out of all the people.’… meaning, thou shalt choose out and take the most worthy, so that such an office be not entrusted rashly to any one that offers. But this was most reasonable, among a free people, that the judges should not be chosen for their wealth or rank, but for their superiority in virtue. Yet although it be right that regard should be chiefly had to virtue, so that if any one of the lower orders be found more suitable than others, he should be preferred to the noble or the rich; still should any one choose to, lay this down as a perpetual and necessary rule, he will be justly accounted contentious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Exodus</cite>, 18, v. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-5abffce96c" data-kw="">
<blockquote><p>…for the king and people are each of them above and below others in divers respects: the people, because they create the man king, they are so above the king, and have a virtual power to compel him to do his duty; and the king, as king, has an authoritative power above the people, because royalty is formally in him, and originally and virtually only in the people, therefore may he compel them to their duty, as we shall hear anon; and therefore there is no need of an earthly ruler higher than both, to compel both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 56 rt col mid</span></figcaption>

</figure><figure class="quote" id="q-090b207887" data-kw="">
<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, (1681), p. 47 McWard was a protege of Rutherford and leader of the Scottish covenanters.</span></figcaption>

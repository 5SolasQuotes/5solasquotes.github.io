<main class="wrap"><figure class="quote" id="q-3e0539d1e4" data-kw="">
<blockquote><p>In The Confession of Cyril Lukaris (1629/31), the “Calvinist Patriarch of Constantinople” affirmed justification by faith alone:

We believe that man is justified by faith, not by works. But when we say by faith, we mean the correlative of faith, which is the righteousness of Christ; on which faith, as it were, lays hold, and applies the same unto us for our salvation; which we declare to be for the sustaining, and not for the detriment, of works. And that works are not to be neglected, since they are necessary means for a witness to faith, and for certification of our calling, the truth itself teaches us. But withal they are of themselves in no wise sufficient to give boldness at the tribunal of Christ, and to claim a recompense as by merit of condignity, and to save the possessor; and that this is so human frailty testifies. But the righteousness of Christ applied to such as repent and imputed unto them alone justifies and saves the believer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-james-t-dennison.html">James T. Dennison Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th and 17th Centuries in English Translation</cite>, (Grand Rapids MI: Reformation Heritage Books, 2014), 4: 160.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-afe324ad34" data-kw="">
<blockquote><p>These three opinions [two involve the imputation of Christ’s active obedience], agreeing all in the main point (that is, that only Christ in his obedience is our righteousness) may well (without any contention, strife or schism) be tollerated in the Church of God: if Christian modesty, humbleness of mind, and meekness did in that measure possess all, that they could support one another in love: and study more to keep the unity of the Spirit, in the bond of peace: then by controversies of disputations, to engender strife. Especially seeing none of these opinions overthrow the foundation: or yet contains in them any impiety: or leads any man from the mark or matter of his righteousness, seeing all three exclude all things except only Christ’s obedience from our righteousness. Moreover, if we shall consider two things distinctly: we shall easily perceive that these three opinions may easily be reconciled, and made all to agree in one: and that none of them is contrary to the truth of God.</p></blockquote>

</figure><figure class="quote" id="q-6a3cb9e0fc" data-kw="">
<blockquote><p>Paul and James do not contradict one another; Paul shows what is that which justifies, and James shows what kind of faith justifies, viz. a lively effectual faith. James shows that faith justifies quae viva [in the manner of it living], Paul shows that it does not justify qua viva [as it is living], which is a great difference though the Remonstrants [Arminians] scoff at such a nicety: who would give a lemmon-paring for the difference?</p></blockquote>

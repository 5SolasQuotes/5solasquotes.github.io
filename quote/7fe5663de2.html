<main class="wrap"><figure class="quote" id="q-7fe5663de2" data-kw="">
<blockquote><p>I wonder [in response to an opponent] more in what capacity the magistrate can have to do with commanding and governing men, if not as they converse morally with men, and in their families, as fathers and sons, as masters and servants, and as Christians who both in private and public may perform duties to one another, or oppress one another; else the judge could not punish the rebellious son, the wicked servant, or the murdering father and the oppressing master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 12, p. 488</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>But it is obvious that it is repugnant, not only to the laws of pious emperors, but also to the law of God and of nature and to every law of nations, that children who are in the power of their parents do or attempt anything of great moment outside the knowledge and will of the parents, much less emancipate themselves completely from the power of their parents and withdraw themselves from their control, as occurs in matrimony.</p></blockquote>

</figure><figure class="quote" id="q-30a0357d09" data-kw="">
<blockquote><p>For first although there be accidents or certain adjuncts of worship, yet there is no worship to be simply called accidental, because it has in it the very essence of worship. Secondly, as the least commands of God—even to iotas and tittles—are religiously to be observed (Mat. 5:18-19), so additions which seem very small are by the same reason to be rejected. Thirdly, Moses does seal up even those laws of the place of Divine worship, of the manner, of abstinence from blood, and the like, which must needs be referred to accidental worship (if any such be), with this very caution of not adding or taking away (Deut. 12:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1639), book 2, ch. 13, section 21, p. 272-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-4738b8d808" data-kw="">
<blockquote><p>For as children ought to have the consent of their careful parents, and not to dare to bestow themselves without their advice, which practice we see in the very gentiles, as appeareth in Euripides, where Hermione answereth Orestes, desiring of her a promise of marriage (Eurip., in Andromacha): ‘Sponsaliorum meorum pater meus curam habebit, non est meum statuere hoc;’ That is: ‘It lyeth not in my hand at all myself for to contract: Unto my father’s care and power, I must refer that act:&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), p. 1,257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

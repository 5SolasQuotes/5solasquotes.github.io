<blockquote><p>Fourthly, if it be asked when God created all things, nothing else can be responded, than in the beginning of time. For Moses also thus begins the history of creation: ‘In the beginning God created heaven and earth.’ And the question concerning time cannot have place there, where time was not yet. But time was not yet, when none were yet created, which the spaces of times should serve. Yet also distinct times are assigned in the Scriptures, in which by order this world with all things which exist in it has been created.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd</cite>, ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>4th Problem. Whether creatures can be similar to God? Answer: Of an accidental similitude, and by participation, Affirmed—as is manifestly proved from Gen. 1, where it treats of the creation of man to the image and likeness of God. But of an essential similitude, or one by essence, Denied. And under this distinction is to be explained, against the enthusiastic distortions, the passage 2 Pet. 1:4, where the participation of θείας φύσεως [the divine nature] is to be understood accidentally, by imitation and similitude—but not essentially according to substance, whether the same in number or in species. Hence, too, the passage Isa. 46 receives light, where God denies Himself to be similar to any thing—much less that any external image can be a picture of Him, or a formal sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin, vol. 5 (1669)</span></figcaption>

<blockquote><p>X. That the world lacked a beginning, and therefore VI. is eternal by reason of duration, was stated by Ocellus Lucanus and Xenophanes of Colophon, and after them, Aristotle. Although there are not wanting those who excuse Aristotle: and of these, some deny that he simply denied that the world had a beginning, like Thomas, pt. 1, quest. 46, art. 1; others affirm that Aristotle spoke hesitantly on this matter in several places, like Grotius, bk. 1, Of the Truth of the Christian Religion, §7; others use a distinction, and assert that Aristotle stated that God is the emanative cause of the world, without novelty of being, so that the world is indeed posterior to God by nature, but not by duration; like Suarez, Metaphysical Disputations, 20, sect. 1, n. 24, 26. The more common opinion, however, is that Aristotle affirmed that the world is eternal. Whence many Scholastics, rightly supposing from the foundations of the Christian religion that the world was created in time, nevertheless, in deference to Aristotle, defend that the world could have been from eternity; with whom, however, others disagree. We, although we do not deny that this question, setting aside revelation, is most difficult to solve, and that therefore this error should be pardoned in Aristotle and other philosophers who assert eternal matter; yet from revelation, to which sound reason, let alone illuminated reason, is not repugnant, we believe it as indubitable that the world was created by God in time. For:

      1. Gen. 1:1, God is said to have created the heaven and the earth “in the beginning”; although indeed the Targum of Jerusalem rendered that “in the beginning” as מהָ כְ וֹבחְּ, “through wisdom”; and Origen, Ambrose, Jerome, and Basil understand the Son of God, from Prov. 8:22; Jn. 1:1; c. 8:28; Col. 1:18; Apoc. 3:14, and take “beginning” not by reason of time, but of order; of which version Menasseh Ben Israel also makes mention, Problems, 13, On Creation; yet we see no solid reason why the more common interpretation should be deserted and the beginning of time be relinquished here.

      2. Because in Ps. 90:2, a beginning of time is attributed to the world: “Before the mountains were brought forth, or ever you had formed the earth and the world.” Prov. 8:24-26, “When there were no depths… before the fountains abounded with water. Before the mountains were settled, before the hills was I brought forth: While as yet he had not made the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, Of Creation, pp. 21-22 trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-a198ed1450" data-kw="">
<blockquote><p>The creation of the world is an external, temporal, and universal action of God, by which He alone made and perfected the whole universe, by the power of His omnipotent will, in the space of six days; for His own glory, and the utility of creatures, especially intelligent ones, and the eternal salvation of the elect in heaven. … The adjunct of time is that God created the world in the space of six natural days, Gen. 2:3, Ex. 20:11. For although God could have created it in a moment, yet He willed to use these intervals: that He might more openly declare that the creation of the world was not made from eternity, but in time; and that He might render men more attentive in the particular meditation of distinct works, as appears especially from Ps. 104 &amp; 136.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“The creation of the world is an external, temporal, and universal action of God, by which He alone made and perfected the whole universe, by the power of His omnipotent will, in the space of six days; for His own glory, and the utility of creatures, especially intelligent ones, and the eternal salvation of the elect in heaven. … The adjunct of time is that God created the world in the space of six natural days, Gen. 2:3, Ex. 20:11. For although God could have created it in a moment, yet He willed to use these intervals: that He might more openly declare that the creation of the world was not made from eternity, but in time; and that He might render men more attentive in the particular meditation of distinct works, as appears especially from Ps. 104 &amp; 136.”

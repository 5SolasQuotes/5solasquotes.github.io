<blockquote><p>The adopted [children of God] see their own sins, Satan’s snares, and Christ’s beauty which they whom the god of the world has blinded cannot discern.​</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eae6011327" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it… If he cannot destroy faith by open infidelity, he will try to make men believe too much, by making the objects of their own belief and calling that a particular faith, and altering God’s Word and casting away the reasons and evidences of faith, to show the strength and nobleness of their faith, which needs no such helps as these; till by over-doing they have raised their edifice in the air and rejected their foundations, and put out their eyes in honor of the sun, and of their physician, lest either of them should be accused as insufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 57, pp. 270-71</span></figcaption>

</figure><figure class="quote" id="q-4ae08d984d" data-kw="">
<blockquote><p>A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) if love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, pp. 100-101 Wolter was a Scotus scholar.</span></figcaption>

</figure><figure class="quote" id="q-b88afc4031" data-kw="">
<blockquote><p>The beautiful is the same as the good, and they differ in aspect only. For since good is what all seek, the notion of good is that which calms the desire; while the notion of the beautiful is that which calms the desire, by being seen or known. Consequently those senses chiefly regard the beautiful, which are the most cognitive, viz., sight and hearing, as ministering to reason; for we speak of beautiful sights and beautiful sounds. But in reference to the other objects of the other senses, we do not use the expression beautiful, for we do not speak of beautiful tastes, and beautiful odors. Thus it is evident that beauty adds to goodness a relation to the cognitive faculty: so that good means that which simply pleases the appetite; while the beautiful is something pleasant to apprehend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 of pt. 2, q. 27, art. 1, reply to obj. 3</span></figcaption>

<blockquote><p>1. Whether the sacred is founded in a special ordination and by divine mandate? It is affirmed.

2. Whether under the New Testament some things are relatively sacred, such as church-buildings, times (except the weekly Sabbath), utensils, tables, cups, lamps, pulpits, furnishings, cloths, garments of ministers? It is denied.

3. Whether under the New Testament, is the preaching of the Word, the water of baptism and the bread and wine in the eucharist sacred? It is affirmed.

4. Whether whatever external particular the Church has instituted is sacred? It is affirmed. See the disputation on benedictions and sacramental things.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bed2f84f26" data-kw="">
<blockquote><p>This hunger and thirst are followed by a receiving of Christ the Lord for justification, sanctification, and so for complete salvation, which is the fifth, and indeed, the formal and principal act of faith. … And the soul, now conscious of its own misery, and with joy and hope observing the fulness of salvation that is in Christ, and earnestly desiring communion with him, cannot but lay hold on and receive, with the highest complacency of soul, that extraordinary blessing thus offered, and thus by receiving, appropriate or make it his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 3.7.19</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eae029983e" data-kw="">
<blockquote><p>We are commanded to look to Christ, as the dying Israelites looked up to the brazen serpent. This looking involved trusting; and looking is declared to be believing. Sinners are exhorted to flee to Christ as a refuge. The man-slayer fled to the city of refuge because he relied upon it as a place of safety. We are said to receive Christ, to rest upon Him, to lay hold of Him. All these, and other modes of expression which teach us what we are to do when we are commanded to believe, show that trust is an essential element in the act of saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a> › <a href="../topics/faith/faith-as-instrument/faith-receives-christ.html">Faith receives Christ</a></span></div>

</figure><figure class="quote" id="q-8c3b736334" data-kw="">
<blockquote><p>The special object of faith, therefore, is Christ, and the promise of salvation through Him. And the special definite act of faith which secures our salvation is the act of receiving and resting on Him as He is offered to us in the Gospel.</p></blockquote>

</figure><figure class="quote" id="q-4c8b9ec505" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chain</cite>, ch. 36</span></figcaption>

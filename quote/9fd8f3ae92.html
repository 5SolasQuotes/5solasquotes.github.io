<main class="wrap"><figure class="quote" id="q-9fd8f3ae92" data-kw="">
<blockquote><p>They that would know more of these sectaries [Brownists], let them read these books following: First, a book called, A Discovery of Brownism, or a briefe Declaration of the errors and 〈◊〉 dayly practised and increased among the English company of the Separation, remaining at this present at Amsterdam in Holland, by Mr. White. A book called, The Raising of the Foundation of Brownism, by S.B., printed by Henr. Windet, 1588. A Plain Declaration that our Brownists be full Donatists, by comparing them together from point to point, out of the writings of St. Augustine, by George Gifford, minister of God’s Word at Malden. An Apology of the Church of England against the Brownists, written by Doctor [Joseph] Hall, now Lord Bishop of Norwich. Master [Ricahrd] Bernard’s Separatists’ Schism. The Prophane Schism of the Brownists or Separatists, with the impiety, dissensions, lewd and abominable vices of that impure sect, discovered by Christopher Lawne, John Fowler, Clement Sanders and Robert Bulward. Item, a book called, The Shield of Defence: written against Master de le Cluse, in defence of Mr. Brightman, printed 1612.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times (London: Wilson, 1645), ‘Of the Brownists’, 24. ‘How these Sectaries have been punished’</cite>, pp. 73-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6e533dfc7" data-kw="">
<blockquote><p>I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon anything amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things accoding to the Word of God. This my protesting, and refusing to join with them, enraged them exceedingly against me; and as their scourge of tongues was grievously bent against others, so now was it against myself, in a most grievous, unjust and unreasonable manner, and very hypocritically gave it out far and near… Thus I left that party of the dissenters who now commonly go under the name of Mr. M’Millan’s people; for the Quakers, Gibb’s faction, the Harlaw’s faction, and episcopacy by bishops, I had never any thing to do with them in matters of religion, neither directly nor indirectly; yea, my soul abhors all their evil ways: but I lieved retired by myself; all which time the Lord pitied me, and restored me to some measure of communion with Himself. Praise, praise. Amen…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters (Edinburgh: Oliphant, 1827)</cite>, pp. 237-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

nism/#:~:text=I%20alleging%2C%20what%20was%20wrong%20in,communion%20with%20Himself.%20Praise%2C%20praise.%20Amen&amp;text=I%20alleging%2C%20what%20was%20wrong%20in%20the%20administration&amp;text=measure%20of%20communion%20with%20Himself.%20Praise%2C%20praise.%20Amen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0291564760" data-kw="">

</figure><figure class="quote" id="q-091418bc31" data-kw="">
<blockquote><p>Sixthly, as things are yet with us [congregationalist churches], there is no such great reason of that outcry there is amongst us against gathering of churches [out of other churches] as so great a dividing practice as many seem to make it. How can this practice be so very offensive when almost all of you [non-Independents] think it lawful for a man for any commodiousness to remove from that church of which now he is, to join with another, sobeit he will remove his dwelling?</p></blockquote>

</figure><figure class="quote" id="q-f6b4c66580" data-kw="">
<blockquote><p>Though a Church of schismatics retaining the sound Faith, yet separating from others, be deserted by any, it is a negative separation from a true Church, and laudable. As the faithful in Augustine’s time did well in separating from the Donatists; for with them they were never one in that faction, though they separated not from the true Faith holden by Donatists, but kept a positive union with them: So do all the faithful well to separate from the churches of the separatists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-cb27ea038b" data-kw="">
<blockquote><p>It is not more clearly set forth that man is under the curse of a broken law, than that Christ delivers his people from the curse of the law, being made a curse for them. The clear and unambiguous declaration of the Word of God is, that the sinner can be justified only by the righteousness of Christ. … In saying, however, that we are justified by the righteousness of Christ, let it be clearly understood what this implies; for different views have been entertained as to the place which this righteousness holds in the scheme of redemption. Some have regarded the righteousness of Christ as merely supplementary to ours; that is, that his righteousness is designed to make up for our deficiency. This is putting the Saviour into a subordinate place in the scheme of man’s salvation.

According to this view, Christ is not all our salvation, but only a part of it. It is making the sinner in part his own justifier, and they who hold such an opinion cannot say with the Psalmist, “Not unto us, Lord, not unto us, but unto thy name be the glory;” nor with the Apostle, “Not by works of righteousness which we have done, but according to His mercy, hath he saved us.” If all our righteousness be as filthy rags in the sight of God, how impious to ascribe our justification, even in part, to such a righteousness! Nor is there in all the Word of God any warrant for such a dishonouring view of the complete and all-sufficient righteousness of Christ. His righteousness, when imputed to the sinner, and received by faith, is the only and the all-sufficient ground of his justification.

But again, it has also been held by those who would make the sinner stand upon his own righteousness, that the law of God, under the gospel, has been brought down to the level of our capacity for obeying it. All such dogmas are a virtual denial of Christ, and robbing him of his glory. This would neither be magnifying nor making honourable the law. To bring down the law of God to the level of our capacity, would just be to extinguish it altogether; for it is not in man that walketh to direct his own steps. The carnal mind is enmity against God, and is not subject to his law, neither indeed can be. It is with our own righteousness, when we receive, and are justified by Christ’s, as it is with the stars when the sun shines. The stars appear beautiful objects in the night, and in the absence of the sun; but let the sun arise and reach his mid-day splendour, where are the stars then? Would it diminish aught from the light of noon-day, although all the stars in the firmament were blotted out from their spheres? Neither does a man’s own righteousness add anything to the excellency of his character, when the Sun of Righteousness is risen upon him. His own glory disappears, and Christ is to him all his salvation.

If, then, we tell the sinner that the Day of Judgment is approaching—that the Lord is at hand—and urge him to prepare for that day, what must be our counsel to him? Shall we beseech him to set himself diligently to do this and the other thing in the way of religious duty, such as prayer, church-going, alms-deeds? We would not, indeed, have any man to believe that these things are unnecessary; but neither would we have any man to imagine that these things will secure us justification. We might do all this, and we might succeed in producing these things in his practice, and yet have left the man as far from Christ as ever.

We might teach thus a system of dry and sapless morality, the only effect of which might be at once to send the conscience of the sinner to sleep, and encourage within him that legal spirit, which in many, we fear, is a formidable barrier to the acceptance of the Redeemer’s justifying righteousness. It is right to urge the sinner to do these things, but it is not right to stop there; neither is it right to make him believe, that his doing of these things will constitute any part of the ground upon which he is justified. Such is not the ground upon which this matter is put in the Word of God. The immaculate Son of God will not give the glory of this work to another; he undertook, and he finished the work, and it can receive no help from man. His work is perfect. And whoever has the righteousness of Christ, needeth no other. Whoever comes to the gate of the celestial city with this robe, will need no other passport.</p></blockquote>

<blockquote><p>If someone could believe with a certain and constant faith, and could understand the magnitude of it all, that he is the son and heir of God, he could regard all the power and wealth of all the kingdoms of the world as filth and refuse in comparison with his heavenly inheritance. Whatever the world has that is sublime and glorious would make him sick. And the greater the pomp and glory of the world is, the more detestable it would be to him. In other words, whatever the world admires and exalts most, that is foul and worthless in his eyes. For what is the whole world with its power, wealth, and glory in comparison with God, whose heir and son he is? He also desires anxiously to depart with Paul and to be with Christ (Phil. 1:23). Nothing more delightful could happen to him than a premature death, which he would embrace as the most joyous peace; for he would know that it is the end of all his evils and that through it he comes into his inheritance. In fact, a man who believed this completely would not go on living very long but would soon be consumed by his overwhelming joy.</p></blockquote>

<blockquote><p>God demanded this perfect obedience from a man that was perfect in every way, and equal to the stipulated duty, for indeed: (1) through the image of God conferred upon Him, and in that image, original righteousness, He was blessed with spiritual wisdom… (2) He was to that point without any vice or sin (as much original as actual), through which alone his whole posterity was incapable of rendering to God his due (Rom. 8:3). Thus: (3) intrinsically, he was equipped with a perfect principle of obeying, namely, original righteousness; extrinsically, there was before him a perfect norm of obeying, nor did anything hinder that obedience.</p></blockquote>

</figure><figure class="quote" id="q-eb601da6ae" data-kw="Sola fide Faith alone">
<blockquote><p>The reader now perceives with what fairness the Sophists of the present day cavil at our doctrine, when we say that a man is justified by faith alone (Rom. 4:2). They dare not deny that he is justified by faith, seeing Scripture so often declares it; but as the word alone is nowhere expressly used they will not tolerate its being added. … Does he not plainly enough attribute everything to faith alone when he disconnects it with works?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.19</span></figcaption>

</figure><figure class="quote" id="q-76dea1a2e8" data-kw="">
<blockquote><p>Christ hath merited righteousness for as many as are found in him. In him God findeth us, if we be faithful, for by faith we are incorporated into Christ. Then although in our selves we be altogether sinful, and unrighteous, yet even the man which is impious in him self, full of iniquity, full of sin, him being found in Christ through faith, and having his sin remitted through repentance: him God upholdeth with a gracious eye; putteth away his sin by not imputing; taketh quite away the punishment due thereunto, by pardoning it; and accepteth him in Jesus Christ, as perfectly righteous, as if he had fulfilled all that was commanded him in the law: shall I say more perfectly righteous, then if him self had fulfilled the whole law?</p></blockquote>

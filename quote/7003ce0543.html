<main class="wrap"><figure class="quote" id="q-7003ce0543" data-kw="">
<blockquote><p>One can observe a variety of physical bearing in the prayers of the saints. Moses fell upon his face (Deuteronomy 9:18); David was stretched upon the ground and clothed in sackcloth when he prayed for his infant son (2 Samuel 12:16). Job was seated in ashes and dust (Job 42:6); the Israelites were standing (Nehemiah 9:5); Ezra and Paul were kneeling down (Ezra 9:5 and Acts 20:36). Solomon prayed on bended knees and with hands outstretched (2 Chronicles 6:13); Christ with eyes lifted up towards heaven (John 17:1), while the tex-collector prayed with his eyes cast down to the earth (Luke 18:13). And while men pray with their heads uncovered, women do so with covered head, according to the apostle’s instruction (1 Corinthians 11:4).† † The annotation on the verse in the Dutch Statenvertaling, of which Walaeus possibly was the author, states that the uncovering of the head at that time was a sign of power and sovereignty, whereas today those who are in authority shall keep their heads covered and those who are subject to them shall uncover their heads: ‘But in this matter one must always regard the use in different times and countries and what is correct and build up… A comparison of all these things with each other makes it clear that a certain amount of freedom was given for various gestures, but that at the same time we should adopt the kind of postures that are best suited to every nation’s own customs and that promote rather than hinder the attentiveness of our soul. We should avoid every form of vanity in those postures, but also carelessness and pride; and the gestures should convey, without pretense and in a most suitable manner, the inner disposition and ardent longing of those who are praying. Yet the saints most frequently employed the bending of the knees,‡ and so that gesture was sometimes used in the absolute sense for the prayer itself, as one can see from Romans 11:4 and 14:11, and likewise in Ephesians 3:14. And in the same vein the apsotle links the stretching forth of lifting up of hands to the injunction that they should prayer everywhere (1 Timothy 2:8). ‡ In 1610 the consistory of Middelburg–where Walaeus served as a pastor from 1605 to 1619–admonished the people to humble themselves bodily during the public prayers by kneeling and folding their hands… According to Van Deursen that was rather common at the time…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synopsis of True Theology</cite>, (1625; Brill, 2016), vol. 2, Disputation 36, ‘On the Religious Practice of Invocation’, pp. 431, 433</span></figcaption>

<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>

<blockquote><p>4. It is granted [by the most sober nonconformists] not to be idolatrous. So Mr. [Paul] Baynes: ‘Kneeling is neither an occasion, nor by participation idolatry: Kneeling never bred bread-worship.’ (Christian Letters, Letter 24, p. 201) And [Richard Baxter]: ‘Our doctrine of the sacrament [that one is kneeling to God], known to all the world, does free us from suspicion of adoration in it.’ (Baxter, Christian Directory, p. 616) To these Mr. [John] Tombes [a baptist] adds (Theodulia, p. 256, etc.): ‘1. That the Papists adore not the bread at putting it into their mouths, but at the elevation [of it], it being inconsistent with their principles to worship that which is not above them.

2. That the worship of God not directed to a creature, but before it, as an occasional object of adoration to God, is not idolatry.

3. That yet in the Church of England the elements are not occasionally so, but [rather] the benefits of Christ in the Lord’s Supper [are]. And 4. Kneeling is not to the bread, but as the signification of an humble and grateful mind; as he shows from the rubric [in the Anglican Book of Prayer].’ (T. D., Jerubbaal, p. 41 &amp; Mr. [Zachary] Crofton‘s Answer, p. 28; [William] Ames, Fresh Suit, ch. 4, §4, p. 382; [William] Perkins, Cases) Fifthly, Those that do account it inconvenient, yet account it not to be unlawful. Thus Mr. [Thomas] Cartwright: ‘Kneeling in receiving the sacrament, being incommodious in its own nature, and made far more incommodious by Popish superstition, is not therefore so to be rejected that we should abstain from the sacrament (if we cannot otherwise be partakers of it), because the thing is not in its own nature unlawful.’ (Evangelical Harmony, on Lk. 22:14, etc. Second Reply, p. 262) So it’s said of the old non-conformists: ‘Kneeling at the sacrament was disliked by all, but yet thought tolerable, and that it might be submitted to by some of the most Learned.’ (Troughton, An Apology for the Nonconformists [1681], p. 90) From all which we may conclude with Mr. [Richard] Vines [a Westminster divine], that the posture being a circumstance of action, as well as the time and place, ‘is not of the free-hold of the ordinance’ (On the Sacrament, p. 102); and with Mr. [Richard] Baxter that those that think they must not receive kneeling, ‘think erroneously.’ (Sacrilegious Desertion, p. 19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-williams.html">John Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London</cite>, (London, 1685), vol. 1, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’, pp. 73-72 Williams (d. 1709) was an Anglican bishop.</span></figcaption>

— John Williams, A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London, (London, 1685), vol. 1, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’, pp. 73-72 Williams (d. 1709) was an Anglican bishop.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+It+is+granted+%5Bby+the+most+sober+nonconformists%5D+not+to+be+idolatrous.+So+Mr.+%5BPaul%5D+Baynes%3A+%E2%80%98Kneeling+is+neither+an+occasion%2C+nor+by+participation+idolatry%3A+Kneeling+never+bred+bread-worship.%E2%80%99+%28Christian+Letters%2C+Letter+24%2C+p.+201%29+And+%5BRichard+Baxter%5D%3A+%E2%80%98Our+doctrine+of+the+sacrament+%5Bthat+one+is+kneeling+to+God%5D%2C+known+to+all+the+world%2C+does+free+us+from+suspicion+of+adoration+in+it.%E2%80%99+%28Baxter%2C+Christian+Directory%2C+p.+616%29+To+these+Mr.+%5BJohn%5D+Tombes+%5Ba+baptist%5D+adds+%28Theodulia%2C+p.+256%2C+etc.%29%3A+%E2%80%981.+That+the+Papists+adore+not+the+bread+at+putting+it+into+their+mouths%2C+but+at+the+elevation+%5Bof+it%5D%2C+it+being+inconsistent+with+their+principles+to+worship+that+which+is+not+above+them.+2.+That+the+worship+of+God+not+directed+to+a+creature%2C+but+before+it%2C+as+an+occasional+object+of+adoration+to+God%2C+is+not+idolatry.+3.+That+yet+in+the+Church+of+England+the+elements+are+not+occasionally+so%2C+but+%5Brather%5D+the+benefits+of+Christ+in+the+Lord%E2%80%99s+Supper+%5Bare%5D.+And+4.+Kneeling+is+not+to+the+bread%2C+but+as+the+signification+of+an+humble+and+grateful+mind%3B+as+he+shows+from+the+rubric+%5Bin+the+Anglican+Book+of+Prayer%5D.%E2%80%99+%28T.+D.%2C+Jerubbaal%2C+p.+41+%26+Mr.+%5BZachary%5D+Crofton%E2%80%98s+Answer%2C+p.+28%3B+%5BWilliam%5D+Ames%2C+Fresh+Suit%2C+ch.+4%2C+%C2%A74%2C+p.+382%3B+%5BWilliam%5D+Perkins%2C+Cases%29+Fifthly%2C+Those+that+do+account+it+inconvenient%2C+yet+account+it+not+to+be+unlawful.+Thus+Mr.+%5BThomas%5D+Cartwright%3A+%E2%80%98Kneeling+in+receiving+the+sacrament%2C+being+incommodious+in+its+own+nature%2C+and+made+far+more+incommodious+by+Popish+superstition%2C+is+not+therefore+so+to+be+rejected+that+we+should+abstain+from+the+sacrament+%28if+we+cannot+otherwise+be+partakers+of+it%29%2C+because+the+thing+is+not+in+its+own+nature+unlawful.%E2%80%99+%28Evangelical+Harmony%2C+on+Lk.+22%3A14%2C+etc.+Second+Reply%2C+p.+262%29+So+it%E2%80%99s+said+of+the+old+non-conformists%3A+%E2%80%98Kneeling+at+the+sacrament+was+disliked+by+all%2C+but+yet+thought+tolerable%2C+and+that+it+might+be+submitted+to+by+some+of+the+most+Learned.%E2%80%99+%28Troughton%2C+An+Apology+for+the+Nonconformists+%5B1681%5D%2C+p.+90%29+From+all+which+we+may+conclude+with+Mr.+%5BRichard%5D+Vines+%5Ba+Westminster+divine%5D%2C+that+the+posture+being+a+circumstance+of+action%2C+as+well+as+the+time+and+place%2C+%E2%80%98is+not+of+the+free-hold+of+the+ordinance%E2%80%99+%28On+the+Sacrament%2C+p.+102%29%3B+and+with+Mr.+%5BRichard%5D+Baxter+that+those+that+think+they+must+not+receive+kneeling%2C+%E2%80%98think+erroneously.%E2%80%99+%28Sacrilegious+Desertion%2C+p.+19%29%E2%80%9D%0A%0A%E2%80%94+John+Williams%2C+A+Collection+of+Cases+%26+other+Discourses+lately+written+to+recover+Dissenters+to+the+communion+of+the+Church+of+England+by+some+Divines+of+the+City+of+London%2C+%28London%2C+1685%29%2C+vol.+1%2C+%E2%80%98The+Non-Conformists%E2%80%99+Plea+for+Lay-Communion+with+the+Church+of+England%E2%80%99%2C+pp.+73-72+Williams+%28d.+1709%29+was+an+Anglican+bishop.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F046a960d93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/046a960d93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=4.%20It%20is%20granted%20%5Bby%20the,think%20erroneously.%E2%80%99%20%28Sacrilegious%20Desertion%2C%20p.%2019&amp;text=4.%20It%20is%20granted%20%5Bby%20the%20most%20sober&amp;text=receive%20kneeling%2C%20%E2%80%98think%20erroneously.%E2%80%99%20%28Sacrilegious%20Desertion%2C%20p.%2019" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For the more clear opening of the ensuing treatise it is necessary to speak somewhat of worship and adoration, and especially of these: 1. honor. 2. praise. 3. glory, 4. reverence. 5. veneration. 6. devotion. 7. religion. 8. service. 9. worship. 10. love. 11. obedience. 12. adoration.

1. Honor, is a testification of the excellency of any, Aristotle, Ethics, bk. 8, ch. 8; Aquinas, Honos est signum quoddam excellentiae. ‘Honour is a sign or expression of excellency in any,’ it does not import any superiority in the party whom we honor, as adoration does. [2.] Praise is a special honoring of any, consisting in words. [3.] Glory is formally the effect of honor, though it be taken, pro claritate, ‘for the celebrity’ or renownedness of any; yet glory seems to be founded upon celebrity, as its foundation. [4.] Reverence is a sort of veneration of a person for excellency connotating a sort of fear. [5.] Veneration is a sort of fear, and reverencing of a person: I see not well any difference between reverence and veneration, except that veneration seems to be some more, and comes nearer to adoration. [6.] Devotion is the promptitude, cheerfulness, or spiritual propension of the will to serve God; [7.] Religion is formally in this, when a man subjects himself to God, as to his supreme Lord, and thence arises to give him honor, as his God and absolute Lord. The two integral parts of religion are the subjection of the reasonable creature to God.

2. An exhibition of honour… [8.] Service is from the bond of subjection, to reverence God as an inferior or servant does his Lord and Master: A servant does properly do the will of his master for the gain or profit that redounds to his master… [9.] For worship formally is to give reverence to God for his excellency; in one and the same act we may both worship God and serve Him. Only service does include the obligation of a servant to a lord. As concerning [10.] love, faith and hope, they are internal worship, not properly adoration: Love as love does rather import an equality with the thing loved, and a desire of an union, rather than a submission. It is true, there is a perfection in that which we love, but not essentially to perfect the lover… Faith and hope may suppose a resting on a helper as a helper, and so are internal worship; if they be adoration formally may be a question… [11.] Obedience is founded, not formally upon God’s excellency, properly so called, but upon his jurisdiction and authority to command. [12.] Adoration is the subjection or prostration of soul or body to God in the due recognition and acknowledgement of his absolute supremacy. There is no need, that Vasquez [a Romanist] should deny that there is any internal adoration, for that adoration is only an external and bodily worship of God, can hardly be defended… as external adoration is an act by which we offer our bodies to God and subject the utter man to him, in sign of service and reverence to so supreme a Lord, so there is a heart-prostration and inward bowing of the soul answerable thereunto.</p></blockquote>

<blockquote><p>Thus he will have images adored with the same worship that is given to God: But I answer: 1. if he shall kiss that creature and direct religious bowing toward it, and through that external religious act, convey his worship to God, and give no other external adoration and sign of heart submission to God, then that which is tied and alligated of purpose to that fair creature, as Papists and Jews did of old, who kissed the calves and fell down before the images (as Isa. 44:17, which yet were but memorials of Jehovah teaching them of Iehovah, Isa. 40:18; 46:6-7; Hab. 2:18-19), such a one should also worship that fair creature.</p></blockquote>

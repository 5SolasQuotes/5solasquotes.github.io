<main class="wrap"><figure class="quote" id="q-bfa35df102" data-kw="">
<blockquote><p>I say, therefore, that the apostle doth not here consider the new covenant absolutely, and as it was virtually administered from the foundation of the world, in the way of a promise; for as such it was consistent with that covenant made with the people in Sinai. And the apostle proves expressly, that the renovation of it made unto Abraham was no way abrogated by the giving of the law, Galatians 3:17. There was no interruption of its administration made by the introduction of the law. But he treats of such an establishment of the new covenant as wherewith the old covenant made at Sinai was absolutely inconsistent, and which was therefore to be removed out of the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 77</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ce0cb580a" data-kw="new cov">
<blockquote><p>The new covenant is also taken in a twofold manner either broadly, inasmuch as it stands for the covenant of grace in general made with sinners, which existed under the Old Testament as well before Christ appeared as under the New after he had been manifested; or strictly, for the covenant of grace promulgated after the manifestation of Christ in the flesh, which should continue to the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.5</span></figcaption>

</figure><figure class="quote" id="q-ed7e8b1e1e" data-kw="">
<blockquote><p>On this consideration it is said, that the two covenants mentioned, the new and the old, were not indeed two distinct covenants, as unto their essence and substance, but only different administrations of the same covenant, called two covenants from some different outward solemnities and duties of worship attending of them.  […] But on the other hand, there is such express mention made, not only in this, but in sundry other places of the Scripture also, of two distinct covenants, or testaments, and such different natures, properties, and effects, ascribed unto them, as seem to constitute two distinct covenants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 85</span></figcaption>

</figure><figure class="quote" id="q-cef707d457" data-kw="">
<blockquote><p>The Lutherans, on the other side, insist on two arguments to prove, that not a twofold administration of the same covenant, but that two covenants substantially distinct, are intended in this discourse of the apostle. 1. Because in the Scripture they are often so called, and compared with one another, and sometimes opposed unto one another; the first and the last, the new and the old. 2. Because the covenant of grace in Christ is eternal, immutable, always the same, obnoxious unto no alteration, no change or abrogation; neither can these things be spoken of it with respect unto any administration of it, as they are spoken of the old covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 89</span></figcaption>

— John Owen, An Exposition of the Epistle to the Hebrews, 8:6; Works, vol. 22, p. 89">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20Lutherans%2C%20on%20the%20other%20side%2C%20insist%20on%20two%20arguments%20to%20prove%2C%20that%20not%20a%20twofold%20administration%20of%20the%20same%20covenant%2C%20but%20that%20two%20covenants%20substantially%20distinct%2C%20are%20intended%20in%20this%20discourse%20of%20the%20apostle.%201.%20Because%20in%20the%20Scripture%20they%20are%20often%20so%20called%2C%20and%20compared%20with%20one%20another%2C%20and%20sometimes%20opposed%20unto%20one%20another%3B%20the%20first%20and%20the%20last%2C%20the%20new%20and%20the%20old.%202.%20Because%20the%20covenant%20of%20grace%20in%20Christ%20is%20eternal%2C%20immutable%2C%20always%20the%20same%2C%20obnoxious%20unto%20no%20alteration%2C%20no%20change%20or%20abrogation%3B%20neither%20can%20these%20things%20be%20spoken%20of%20it%20with%20respect%20unto%20any%20administration%20of%20it%2C%20as%20they%20are%20spoken%20of%20the%20old%20covenant.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20An%20Exposition%20of%20the%20Epistle%20to%20the%20Hebrews%2C%208%3A6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcef707d457.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cef707d457.html">Permalink</a><a class="src" href="https://archive.org/details/worksofjohnowend0023owen" rel="noopener" target="_blank">Read it online · Internet Archive (Goold)</a></div>
</figure><figure class="quote" id="q-40b5bfce1f" data-kw="">
<blockquote><p>Wherefore we must grant two distinct covenants, rather than a twofold administration of the same covenant merely, to be intended. We must, I say, do so, provided always that the way of reconciliation and salvation was the same under both. But it will be said, —and with great pretense of reason, for it is that which is the sole foundation they all build upon who allow only a twofold administration of the same covenant, —&#x27;That this being the principal end of a divine covenant, if the way of reconciliation and salvation be the same under both, then indeed are they for the substance of them but one.&#x27; And I grant that this would inevitably follow, if it were so equally by virtue of them both. If reconciliation and salvation by Christ were to be obtained not only under the old covenant, but by virtue thereof, then it must be the same for substance with the new. But this is not so; for no reconciliation with God nor salvation could be obtained by virtue of the old covenant, or the administration of it, as our apostle disputes at large, though all believers were reconciled, justified, and saved, by virtue of the promise, whilst they were under the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 92</span></figcaption>

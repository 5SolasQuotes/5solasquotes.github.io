<main class="wrap"><figure class="quote" id="q-9a71a3adaa" data-kw="">
<blockquote><p>We say nothing different from that which Scripture says.—But in a Divine nature, as such, when once we have believed in it, we can recognize no distinctions suggested either by the Scripture teaching or by our own common sense; distinctions, that is, that would divide that Divine and transcendent nature within itself by any degrees of intensity and remission, so as to be altered from itself by being more or less.

Because we firmly believe that it is simple, uniform, incomposite, because we see in it no complicity or composition of dissimilars, therefore it is that, when once our minds have grasped the idea of Deity, we accept by the implication of that very name the perfection in it of every conceivable thing that befits the Deity. Deity, in fact, exhibits perfection in every line in which the good can be found. If it fails and comes short of perfection in any single point, in that point the conception of Deity will be impaired, so that it cannot, therein, be or be called Deity at all; for how could we apply that word to a thing that is imperfect and deficient, and requiring an addition external to itself? …

So Deity, as long as it possesses perfection throughout all the properties that devotion may attach to it, by virtue of this perfection in everything good does not belie its name; but if any one of those things that contribute to this idea of perfection is subtracted from it, the name of Deity is falsified in that particular, and does not apply to the subject any longer. It is equally impossible to apply to a dry substance the name of water, to that whose quality is a state of coolness the name of fire, to stiff and hard things the name of air, and to call that thing Divine which does not at once imply the idea of perfection; or rather the impossibility is greater in this last case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit. Against the Followers of Macedonius</cite>, (c. 380) in Nicene and Post-Nicene Fathers 2, 5: 316.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84f4da8a14" data-kw="">
<blockquote><p>If yet you see not the pride of these men, I will shew it you in these four particular Evidences, and that so plainly, that if you know the difference between the language of heaven and of hell, you may easily perceive the devil speaking by their mouths.

1. They affirm themselves to be perfect without sin (yea, some of them say they are Christ and God.) And is it possible that any man in this life, that is not mad with spiritual pride, can indeed believe that he hath no sin? what? that he transgresseth no Law? That he doth love God in the highest degree that he is bound to do? That he never hath a thought or word that is sinful, nor sinfully loseth one minute of his time?

Yea, and this when in the eyes and ears of the wisest, they foam out their own shame, as the raging Sea doth cast out the dirt. The devil himself hath either less pride or less ignorance, then to think himself to be perfect without sin; If they have no sin, what need they pray, Forgive us our sins, or what further need have they of the blood of Christ or his Intercession to procure them any further forgiveness? If you can see no pride in this, I fear you are blinded with them to destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-a1b0a92aaf" data-kw="">
<blockquote><p>Whether sanctification precede justification. Bishop [George] Downame in his appendix to the Covenant of Grace, does oppose my worthy tutor Mr. [William] Pemble for holding this opinion, but perhaps a distinction may solve all. As sanctification is taken for the act of the Holy Ghost working holiness into us, so it goes before faith and justification, so the apostle puts it before justifying, saying 1 Cor. 6:11, ‘But ye are sanctified, justified;’ but as it is taken for the exercise of holiness in regard of amendment of heart and life, so it follows justification in nature, but it is joined with it in time. The apostle Rom. 8:30, places vocation before justification, which vocation is the same thing with the first sanctification or regeneration. See Acts 26:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’, p. 530</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>For good works are fruitful not only in reference to an ample and manifold reward, but in reference to good works:¹ as the parable of our Savior in the twenty-fifth of Matthew plainly informs us, where it is said: ‘Then he that had received the five talents went and traded with the same and made them other five talents.’ (Mt. 25:16) ¹ Serva ergo mandata Dei-Sanctifica cor tuum ut Deus inhabitet in te. Et quotidie magis &amp; magis invenies Deum [Therefore keep the commandments of God—sanctify your heart so that God may dwell in you. And every day you will find God more and more]. [Ps. Chrysostom,] Imperfect Work on Matthew, Homily 4. These five talents acquired to the first five cannot be interpreted [as] the reward ultimate; for that is expressed afterward to be the joy of the Lord [vv. 21, 23]: but they were the intermediate effects of the stock of grace treasured up in the soul, and exhorting and improving itself by the continual supply of the Spirit of Christ, according to the doctrine of St. Paul to the Corinthians, saying: ‘Insomuch that we desired Titus, that as he had begun, so he would also finish in you the same grace also: Therefore as ye abound in everything, in faith, in utterance, in knowledge, and in all diligence, and in your love to us, see that ye abound in this grace also.’ [2 Cor. 8:6-7] Of this influence of Christ’s Spirit to the augmentation of grace in the hearts of the true believers, speaks the same apostle to the Colossians, thus: ‘The Head from which all the body by joints and bands having nourishment, ministered and knit together, encreases with the increase of God.’ (Col. 2:19) … That God therefore accepted their burnt-offering (Jud. 13:23), it is a sign He approved their persons, but the reason antecedent of God’s acceptation of their sacrifice, was because He first approved their persons. And yet, notwithstanding the goodness of the person is the original of the goodness of the work, nothing hinders but the goodness of the work may add value, favour, and estimation unto the person. As (to use Luther’s comparison and others after and before him) the tree bears the fruit, and not the fruit the tree: And the goodness of the tree is the cause of the goodness of the fruit, and not the goodness of the fruit the cause of the goodness of the tree: Yet the fruit does procure an esteem and valuation from the owner to the tree; and endears it to him, to the cultivating the ground and dressing it and conferring much more on that than others. In like manner, the person sanctified and justified produces good works, and not those good works, him: but some actions accompanied with God’s grace, antecedent and inferior to the fruit itself: Yet does the fruit of good works add much of esteem and honor from God to such a person; and render him capable of an excellent reward: for St. Paul to the Philippians assures them and us, when he says, ‘I desire fruit that may abound to your account.’ (Phil. 2:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17, pp. 62-63</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For good works are fruitful not only in reference to an ample and manifold reward, but in reference to good works:¹ as the parable of our Savior in the twenty-fifth of Matthew plainly informs us, where it is said: ‘Then he that had received the five talents went and traded with the same and made them other five talents.’ (Mt. 25:16) ¹ Serva ergo mandata Dei-Sanctifica cor tuum ut Deus inhabitet in te. Et quotidie magis &amp; magis invenies Deum [Therefore keep the commandments of God—sanctify your heart so that God may dwell in you. And every day you will find God more and more]. [Ps. Chrysostom,] Imperfect Work on Matthew, Homily 4. These five talents acquired to the first five cannot be interpreted [as] the reward ultimate; for that is expressed afterward to be the joy of the Lord [vv. 21, 23]: but they were the intermediate effects of the stock of grace treasured up in the soul, and exhorting and improving itself by the continual supply of the Spirit of Christ, according to the doctrine of St. Paul to the Corinthians, saying: ‘Insomuch that we desired Titus, that as he had begun, so he would also finish in you the same grace also: Therefore as ye abound in everything, in faith, in utterance, in knowledge, and in all diligence, and in your love to us, see that ye abound in this grace also.’ [2 Cor. 8:6-7] Of this influence of Christ’s Spirit to the augmentation of grace in the hearts of the true believers, speaks the same apostle to the Colossians, thus: ‘The Head from which all the body by joints and bands having nourishment, ministered and knit together, encreases with the increase of God.’ (Col. 2:19) … That God therefore accepted their burnt-offering (Jud. 13:23), it is a sign He approved their persons, but the reason antecedent of God’s acceptation of their sacrifice, was because He first approved their persons. And yet, notwithstanding the goodness of the person is the original of the goodness of the work, nothing hinders but the goodness of the work may add value, favour, and estimation unto the person. As (to use Luther’s comparison and others after and before him) the tree bears the fruit, and not the fruit the tree: And the goodness of the tree is the cause of the goodness of the fruit, and not the goodness of the fruit the cause of the goodness of the tree: Yet the fruit does procure an esteem and valuation from the owner to the tree; and endears it to him, to the cultivating the ground and dressing it and conferring much more on that than others. In like manner, the person sanctified and justified produces good works, and not those good works, him: but some actions accompanied with God’s grace, antecedent and inferior to the fruit itself: Yet does the fruit of good works add much of esteem and honor from God to such a person; and render him capable of an excellent reward: for St. Paul to the Philippians assures them and us, when he says, ‘I desire fruit that may abound to your account.’ (Phil. 2:7)”

— Matthew Scrivener, A Course of Divinity, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17, pp. 62-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+good+works+are+fruitful+not+only+in+reference+to+an+ample+and+manifold+reward%2C+but+in+reference+to+good+works%3A%C2%B9+as+the+parable+of+our+Savior+in+the+twenty-fifth+of+Matthew+plainly+informs+us%2C+where+it+is+said%3A+%E2%80%98Then+he+that+had+received+the+five+talents+went+and+traded+with+the+same+and+made+them+other+five+talents.%E2%80%99+%28Mt.+25%3A16%29+%C2%B9+Serva+ergo+mandata+Dei-Sanctifica+cor+tuum+ut+Deus+inhabitet+in+te.+Et+quotidie+magis+%26+magis+invenies+Deum+%5BTherefore+keep+the+commandments+of+God%E2%80%94sanctify+your+heart+so+that+God+may+dwell+in+you.+And+every+day+you+will+find+God+more+and+more%5D.+%5BPs.+Chrysostom%2C%5D+Imperfect+Work+on+Matthew%2C+Homily+4.+These+five+talents+acquired+to+the+first+five+cannot+be+interpreted+%5Bas%5D+the+reward+ultimate%3B+for+that+is+expressed+afterward+to+be+the+joy+of+the+Lord+%5Bvv.+21%2C+23%5D%3A+but+they+were+the+intermediate+effects+of+the+stock+of+grace+treasured+up+in+the+soul%2C+and+exhorting+and+improving+itself+by+the+continual+supply+of+the+Spirit+of+Christ%2C+according+to+the+doctrine+of+St.+Paul+to+the+Corinthians%2C+saying%3A+%E2%80%98Insomuch+that+we+desired+Titus%2C+that+as+he+had+begun%2C+so+he+would+also+finish+in+you+the+same+grace+also%3A+Therefore+as+ye+abound+in+everything%2C+in+faith%2C+in+utterance%2C+in+knowledge%2C+and+in+all+diligence%2C+and+in+your+love+to+us%2C+see+that+ye+abound+in+this+grace+also.%E2%80%99+%5B2+Cor.+8%3A6-7%5D+Of+this+influence+of+Christ%E2%80%99s+Spirit+to+the+augmentation+of+grace+in+the+hearts+of+the+true+believers%2C+speaks+the+same+apostle+to+the+Colossians%2C+thus%3A+%E2%80%98The+Head+from+which+all+the+body+by+joints+and+bands+having+nourishment%2C+ministered+and+knit+together%2C+encreases+with+the+increase+of+God.%E2%80%99+%28Col.+2%3A19%29+%E2%80%A6+That+God+therefore+accepted+their+burnt-offering+%28Jud.+13%3A23%29%2C+it+is+a+sign+He+approved+their+persons%2C+but+the+reason+antecedent+of+God%E2%80%99s+acceptation+of+their+sacrifice%2C+was+because+He+first+approved+their+persons.+And+yet%2C+notwithstanding+the+goodness+of+the+person+is+the+original+of+the+goodness+of+the+work%2C+nothing+hinders+but+the+goodness+of+the+work+may+add+value%2C+favour%2C+and+estimation+unto+the+person.+As+%28to+use+Luther%E2%80%99s+comparison+and+others+after+and+before+him%29+the+tree+bears+the+fruit%2C+and+not+the+fruit+the+tree%3A+And+the+goodness+of+the+tree+is+the+cause+of+the+goodness+of+the+fruit%2C+and+not+the+goodness+of+the+fruit+the+cause+of+the+goodness+of+the+tree%3A+Yet+the+fruit+does+procure+an+esteem+and+valuation+from+the+owner+to+the+tree%3B+and+endears+it+to+him%2C+to+the+cultivating+the+ground+and+dressing+it+and+conferring+much+more+on+that+than+others.+In+like+manner%2C+the+person+sanctified+and+justified+produces+good+works%2C+and+not+those+good+works%2C+him%3A+but+some+actions+accompanied+with+God%E2%80%99s+grace%2C+antecedent+and+inferior+to+the+fruit+itself%3A+Yet+does+the+fruit+of+good+works+add+much+of+esteem+and+honor+from+God+to+such+a+person%3B+and+render+him+capable+of+an+excellent+reward%3A+for+St.+Paul+to+the+Philippians+assures+them+and+us%2C+when+he+says%2C+%E2%80%98I+desire+fruit+that+may+abound+to+your+account.%E2%80%99+%28Phil.+2%3A7%29%E2%80%9D%0A%0A%E2%80%94+Matthew+Scrivener%2C+A+Course+of+Divinity%2C+...+%28London%3A+Roycroft%2C+1674%29%2C+pt.+1%2C+bk.+1%2C+ch.+17%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4aa73838b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4aa73838b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=For%20good%20works%20are%20fruitful%20not,abound%20to%20your%20account.%E2%80%99%20%28Phil.%202%3A7&amp;text=For%20good%20works%20are%20frui <blockquote><p>38. The instruments of producing this faith are the Word and sacraments…

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>

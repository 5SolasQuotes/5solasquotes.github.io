<blockquote><p>35. Justification both presupposes and accompanies effectual calling with indivisible connection. 36. But it is not a physical action, but moral, or rather forensic, nor transmutative of the subject, nor inhesive in the subject, but rather terminative toward the subject. 37. It is to be attributed to God efficiently, to Christ meritoriously, to faith instrumentally. 38. One act of faith is direct toward its object, another reflexive toward itself. Also the first act of faith is to believe, the second to work through charity and by means of it. 39. This latter act is the instrument of our sanctification…</p></blockquote>

<blockquote><p>18. That imputation of the righteousness of Christ is neither fictitious, nor ideal, nor absurd; nor does it overthrow the δικαιοκρισία [dikaiokrisia, righteous judgment] of God, nor does it clash with human reason or practice. Nay, it is established by the Pontificals themselves through the trafficking of papal indulgences and the market of satisfactions and pardons, where the λογισμός [logismos, reckoning/imputation] and communication of another’s righteousness — albeit fictitious — is manifestly taught. It is no wonder, however, that the imputation of the righteousness of Christ is denied and opposed in this matter by those who neither know nor feel the union of ourselves with Christ and the power and efficacy thereof, and who prefer the means of salvation to be profitable to themselves [as independent workers] rather than gratuitous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-c88e043db4" data-kw="">
<blockquote><p>It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Media: the Middle Things… (London: Field, 1649), ch. 1, 2. ‘First Privilege: Justification’</cite>, pp. 2-3</span></figcaption>

</figure><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

<blockquote><p>10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.</p></blockquote>

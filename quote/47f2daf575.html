<blockquote><p>VI. The agents by whom sacraments are administered, are ministers who have been legitimately called.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (London, 1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 22, ‘The Seals or Sacraments…’, p. 121; ch. 23, p. 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27784aaa36" data-kw="">
<blockquote><p>When you [congregationalists] say that ‘a seal does not make a thing that was not, but confirm a thing that was,’ while you would seem to refute Papists, who vainly teach that sacraments do confer grace ex opere operato, by the deed done, yet do you make the sacrament but a naked sign and take part with Arminians and Socinians, whose very arguments in express words you use, for Socinius goes before you in this argument, and so does Smalcius follow him: ‘To obsignation and sealing there is required the trying of the thing, and some teaching or document; but that ceremony (a baptism) and that rite, though it be holy, does nothing to the remission of sins, but it does only shadow out, and as it were delineate and point forth remission of sins by the washing of water exponed in the Word of God.’ You say, ‘Sacraments do not make a thing that was not, but confirm a thing that was before;’ you can have no other meaning than to deny all causality and all real exhibition of grace in the sacraments: for if a sacrament make not a thing that was not before, or if God give not, and really produce, confer and exhibit grace, and a stronger measure of faith, and assurance of remission of sins, at the due and right use of the sacrament [that is with faith], the Sacrament is a naked sign, and not an exhibitive seal. But if† Christ give and in the present exhibit as surely remission of sins, as the infant is washen with water, as our divines and the Palatinate [Heidelberg] Catechism teaches, yea and the [Belgic] confession thereof, and the Synod of Dort teaches, then by the sacrament of baptism, a thing is made that which it was not. † [That is, this does not necessarily always occur, but if it does, then etc.] It is true a civil seal, as I said before, adds no new lands to the owner of the charter, but if Christ by his seals rightly and in faith used, do not only confirm grace and pardon, but also really exhibit and give grace and pardon in a further degree, and a new measure of assurance to the conscience which there was not before, you go not a streas [star’s?] breadth from Arminians and Socinians, especially seeing Episcopius, Henricus Welsingius say that remission of sins is not sealed by baptism, but signified only, and the Remonstrants in their Apology, while they expone our communion with Christ in the Lord’s Supper, and will reject a physical union of our souls with the physical substance of Christ’s body, which we also reject, they say that communion signifies, ‘only a profession of one and the same worship, whereby Christians solemnly testify that they adhere to Christ as to be partaker of the table of devils and of devils themselves, 1 Cor. 10:18,20, is a testimony of a communion with the devils’: But the Word of God says more, Gal. 3:17, ‘As many of you as are baptized have put on Christ;’ So Rom. 6:3, ‘Therefore we are buried with Him by baptism unto his death, that like as Christ was raised up from the dead, by the glory of the Father, even so we also should walk in newness of life,’ Eph. 5:26, ‘That He might sanctify and cleanse his Church with the washing of water by the Word,’ Tit. 3:5, and 1 Pet. 3:21, ‘The like figure whereunto even baptism does also now save us, etc.’ All this is more than a naked signification, otherwise manna saved Israel, and the water of the rock did wash them from their sins, and the sacrifice of bulls and goats did cleanse from sin, and open Heaven to sinners. Therefore by baptism and the Lord’s Supper something is made what it was not before, as by partaking of the table of devils, the partaker is really made a partaker with the devil, and an idolater; and his idolatry that he committed before was not only confirmed and signified to be what it was before. And in this civil seals and sacraments differ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 2, ch. 4, section 5, pp. 216-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-2a35968f71" data-kw="">
<blockquote><p>Secondly, as this sacrament being a communion admonishes that we are all one in Christ: so it teaches that it is to be received of many together in the church, not of one alone, and therefore it overthrows the private masses of the church of Rome, where one partakes all and the rest of the Church nothing at all. There is a flat opposition between these two: so that the communion cannot be a private mass, and private mass cannot be a communion. That which is ordained and prepared for many, delivered unto many, and received of many, cannot stand with the mass, where the priest prepares for himself, not for the people: he speaks to himself, not to the church: he receives himself alone, not with his brethren: all which are directly contrary to the apostles rule, ‘Tarry one for another.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), bk. 3, ‘Of the Lord’s Supper’, p. 206</span></figcaption>

</figure><figure class="quote" id="q-4acd1df203" data-kw="">
<blockquote><p>The same prelate pleads for the expediency of giving the Communion to the sick in private houses, because he thinks they should not want [lack] this mean of comfort: As if the wanting of the sacramental signs, not procured by a man’s own negligence or contempt, could stop or stay the comforts of the Holy Spirit. Nay, it is not so: we have seen some who received not the Communion in time of their sickness, end more gloriously and comfortably than ever we heard of any who received the sacrament for their viaticum [journey] when they were a dying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 2, 14</span></figcaption>

<blockquote><p>4. A graceless man, as [Simon] Magus [Acts 8:9-13; 18-24], hath thus far right to demand the seals, that he may say to the Church, ‘You sin in withholding the seals, and therefore I require you baptize me, as Christ hath commanded you’: but he cannot say, ‘I have right, even external, to receive Baptism, and I sin not in receiving it.’ And Mr. Hooker’s argument to prove it is naught: ‘Why’, saith he, ‘Graceless men have the command of God to challenge the seals’; Magus hath the command of God to challenge, and to receive the Lord’s Supper. [Rutherford:] A command absolute he has none: show me such a command: Magus, Judas, eat and drink at the Lord’s Supper, challenge, claim and receive Baptism; All Israel eat the Passover, be ye real believers or hypocrites, be ye self-triers, and prepared or not, be ye clean or unclean. I confess there were no better right to challenge the seals than such a command, if any such were; but if Mr. Hooker or any of his read such a command, I pray I may see and read also. But Magus has only a conditional command, which gives him no true and real right, save only conditionally, to wit, Magus, receive the seals and the Lord’s Supper. So thou believe and examine thyself: if not, thou hast no right to the seals, but eatest and drinkest thine own damnation. And because these graceless men fulfill not the condition, and believe not, Mr. Hooker’s argument is wa[…]ry; They have right from the command of God, which is the b[irth?]right: that is, they have no right at all from a conditional command, they not fulfilling the condition, but such right as robbers have to the traveler’s purse; yea, they have no command of God, but the contrary: a severe discharge, Isa. 1:13, ‘Bring no more vain oblations.’ Mt. 22:12, ‘Friend, how camest thou in hither, not having a wedding garment?’ ‘He that eateth and drinketh unworthily, eateth and drinketh damnation to himself,’ 1 Cor. 11:29.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0820d8d034" data-kw="">
<blockquote><p>Upon believing, or with believing (I shall explain it by and by) the whole right of salvation is given us; but all the holiness and works we have do not serve for the right, but only we are led through them to the possession of it. You have it said in 2 Thess. 2:13 that we are saved through faith and sanctification. But the Apostle here [in Eph. 2:8-10] orders them, how through faith, and how through sanctification. He speaks in common of both there; here, so through faith as not through sanctification. ‘Not of works,’ saith he. How shall we solve that? This is the clear distinction of it. We are saved through faith, as that which gives us the present right, or that which God doth then give as a judge, when we believe, before faith hath done a whit of work else; but we are led through sanctification and good works to the possession of salvation. Distinguish the right and the possession, and you have clearly the Apostle’s meaning; for, saith he, ‘he hath ordained good works, that we should walk in them,’ as being already ‘saved through faith,’ which he speaks before that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Eph. 2:8-10 in An Exposition of the Second Chapter of the Epistle to the Ephesians, Verses 1-11 in Works, vol. 2, p. 336</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<main class="wrap"><figure class="quote" id="q-8bd6e9c392" data-kw="">
<blockquote><p>When Paul says: “He who does them, etc.,” he is comparing the righteousness of the Law and that of faith, as he also does in Romans 10:5 ff. It is as though he were saying: “It would indeed be fine if someone kept the Law.” But since no one does so, we must take refuge in Christ, who was put under the Law to redeem those who were under the Law (Gal. 4:4). Believing in Him, we receive the Holy Spirit and begin to keep the Law. Because of our faith in Christ what we do not keep is not imputed to us. But in the life to come believing will cease, and there will be a correct and perfect keeping and loving. For when faith ceases, it will be replaced by glory, by means of which we shall see God as He is (1 John 3:2). There will be a true and perfect knowledge of God, a right reason, and a good will, …heavenly, divine, and eternal. Meanwhile we must persevere here in faith that has the forgiveness of sins and the imputation of righteousness through Christ. Therefore no legalist keeps the Law. Since he is without faith, he is under a curse.” Thus Paul clearly distinguishes the worker of the Law from the man of faith. He is not speaking here about the believing doer of the Law; he is speaking about the doer of the Law who does not have the forgiveness of sins through Christ but wants to be justified solely through the Law.</p></blockquote>

<blockquote><p>Now, since Christ confers upon us, and we obtain by faith, both free reconciliation and newness of life, reason and order require that I should here begin to treat of both. The shortest transition, however, will be from faith to repentance; for repentance being properly understood it will better appear how a man is justified freely by faith alone, and yet that holiness of life, real holiness, as it is called, is inseparable from the free imputation of righteousness.</p></blockquote>

<blockquote><p>verse 4. That the justification of the law might be fulfilled, etc. They who understand that the renewed, by the Spirit of Christ, fulfil the law, introduce a gloss wholly alien to the meaning of Paul; for the faithful, while they sojourn in this world, never make such a proficiency, as that the justification of the law becomes in them full or complete. This then must be applied to forgiveness; for when the obedience of Christ is accepted for us, the law is satisfied, so that we are counted just. For the perfection which the law demands was exhibited in our flesh, and for this reason — that its rigor should no longer have the power to condemn us. But as Christ communicates his righteousness to none but to those whom he joins to himself by the bond of his Spirit, the work of renewal is again mentioned, lest Christ should be thought to be the minister of sin: for it is the inclination of many so to apply whatever is taught respecting the paternal kindness of God, as to encourage the lasciviousness of the flesh; and some malignantly slander this doctrine, as though it extinquished the desire to live uprightly.</p></blockquote>

</figure><figure class="quote" id="q-c6059b169b" data-kw="">
<blockquote><p>After effectual calling follows justification, which consists in God’s imputation of the righteousness of Christ, who has already been apprehended by faith in effectual calling, to the sinner, just as if that righteousness were the sinner’s own… On the basis of these considerations, take note that faith has a twofold function: the first in effectual calling, when it accepts Christ with his righteousness as such is offered to man; the second in justification, when it accepts Christ with his righteousness as such is imputed to man. It should be noted, moreover, that when man is said to be justified through faith, the faith in question is that which has already played a role in effectual calling—a role, that is, in apprehending Christ and his righteousness as such is offered to man. But salvation is more appropriately attributed to that faith that apprehends the righteousness of Christ imputed to man in justification. “By grace you have been saved through faith” (Eph. 2.8).”… It may be asked: If in effectual calling Christ’s righteousness is apprehended through faith, then cannot someone be said to be justified already by that righteousness? I answer, no. For justification is the pronouncement of a sentence. But in effectual calling there is no pronouncement of a sentence. Therefore, one cannot be called justified as a result of effectual calling alone.</p></blockquote>

</figure><figure class="quote" id="q-cd461b1d8a" data-kw="">
<blockquote><p>You may remember that I said (a word perhaps that some think much of) that the question betwixt us and Rome is not whether we be justified by faith or no? But whether we be justified at all; I will make it good. There are two graces, righteousness imputed, which implies forgiveness of sins; and righteousness inherent, which is that grace of sanctification begun. They utterly deny that there is any righteousness but righteousness inherent. They say forgiveness of sins is nothing but sanctification. A new doctrine never heard of in the Church of God, till these last days, till the spawn of the Jesuits devised it. Forgiveness of sin is this, that God will never charge me with it again. They say that forgiveness of sin is an abolishing of sin in the subject, where is true remission; as much as to say, There is no justification distinct from sanctification: whereas the apostle distinguishes them, when as he says, ‘The Son of God is made unto us wisdom, righteousness, sanctification and redemption’: ‘He is made unto us’ (of God). By the way let me expound it unto you. Christ has three offices; A Prophetical, Regal and Sacerdotical office… The work of Christ’s priestly office is to be a propitiation for our sins; sanctification proceeds from the scepter of his kingdom: The one is without me, the other within me. The one receives degrees, the other not. As a man that is holy may be more holy; but imputed righteousness does not more forgive one man than another. Imputation is without augmentation or diminution. Those things which have diverse contraries, cannot be one and the same thing. Justification and sanctification have diverse contraries. The contrary to justification is condemnation; but the contrary to sanctification is wickedness, and false-dealing, etc. Aristotle distinguishes homonymous words and bids you consider their contraries; thus you see the difference between these two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 16th Sermon, on Rom. 5:1, pp. 421-23</span></figcaption>

<div class="actions"><button class="copy" data-copy="“You may remember that I said (a word perhaps that some think much of) that the question betwixt us and Rome is not whether we be justified by faith or no? But whether we be justified at all; I will make it good. There are two graces, righteousness imputed, which implies forgiveness of sins; and righteousness inherent, which is that grace of sanctification begun. They utterly deny that there is any righteousness but righteousness inherent. They say forgiveness of sins is nothing but sanctification. A new doctrine never heard of in the Church of God, till these last days, till the spawn of the Jesuits devised it. Forgiveness of sin is this, that God will never charge me with it again. They say that forgiveness of sin is an abolishing of sin in the subject, where is true remission; as much as to say, There is no justification distinct from sanctification: whereas the apostle distinguishes them, when as he says, ‘The Son of God is made unto us wisdom, righteousness, sanctification and redemption’: ‘He is made unto us’ (of God). By the way let me expound it unto you. Christ has three offices; A Prophetical, Regal and Sacerdotical office… The work of Christ’s priestly office is to be a propitiation for our sins; sanctification proceeds from the scepter of his kingdom: The one is without me, the other within me. The one receives degrees, the other not. As a man that is holy may be more holy; but imputed righteousness does not more forgive one man than another. Imputation is without augmentation or diminution. Those things which have diverse contraries, cannot be one and the same thing. Justification and sanctification have diverse contraries. The contrary to justification is condemnation; but the contrary to sanctification is wickedness, and false-dealing, etc. Aristotle distinguishes homonymous words and bids you consider their contraries; thus you see the difference between these two.”

— James Ussher, Eighteen Sermons preached in Oxford, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 16th Sermon, on Rom. 5:1, pp. 421-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYou+may+remember+that+I+said+%28a+word+perhaps+that+some+think+much+of%29+that+the+question+betwixt+us+and+Rome+is+not+whether+we+be+justified+by+faith+or+no%3F+But+whether+we+be+justified+at+all%3B+I+will+make+it+good.+There+are+two+graces%2C+righteousness+imputed%2C+which+implies+forgiveness+of+sins%3B+and+righteousness+inherent%2C+which+is+that+grace+of+sanctification+begun.+They+utterly+deny+that+there+is+any+righteousness+but+righteousness+inherent.+They+say+forgiveness+of+sins+is+nothing+but+sanctification.+A+new+doctrine+never+heard+of+in+the+Church+of+God%2C+till+these+last+days%2C+till+the+spawn+of+the+Jesuits+devised+it.+Forgiveness+of+sin+is+this%2C+that+God+will+never+charge+me+with+it+again.+They+say+that+forgiveness+of+sin+is+an+abolishing+of+sin+in+the+subject%2C+where+is+true+remission%3B+as+much+as+to+say%2C+There+is+no+justification+distinct+from+sanctification%3A+whereas+the+apostle+distinguishes+them%2C+when+as+he+says%2C+%E2%80%98The+Son+of+God+is+made+unto+us+wisdom%2C+righteousness%2C+sanctification+and+redemption%E2%80%99%3A+%E2%80%98He+is+made+unto+us%E2%80%99+%28of+God%29.+By+the+way+let+me+expound+it+unto+you.+Christ+has+three+offices%3B+A+Prophetical%2C+Regal+and+Sacerdotical+office%E2%80%A6+The+work+of+Christ%E2%80%99s+priestly+office+is+to+be+a+propitiation+for+our+sins%3B+sanctification+proceeds+from+the+scepter+of+his+kingdom%3A+The+one+is+without+me%2C+the+other+within+me.+The+one+receives+degrees%2C+the+other+not.+As+a+man+that+is+holy+may+be+more+holy%3B+but+imputed+righteousness+does+not+more+forgive+one+man+than+another.+Imputation+is+without+augmentation+or+diminution.+Those+things+which+have+diverse+contraries%2C+cannot+be+one+and+the+same+thing.+Justification+and+sanctification+have+diverse+contraries.+The+contrary+to+justification+is+condemnation%3B+but+the+contrary+to+sanctification+is+wickedness%2C+and+false-dealing%2C+etc.+Aristotle+distinguishes+homonymous+words+and+bids+you+consider+their+contraries%3B+thus+you+see+the+difference+between+these+two.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+Eighteen+Sermons+preached+in+Oxford%2C+1640%2C+of+conversion%2C+unto+God%2C+of+redemption+%26+justification%2C+by+Christ+%28London%3A+1660%29+%7C+16th+Sermon%2C+on+Rom.+5%3A1%2C+pp.+421-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd461b1d8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd461b1d8a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=You%20may%20remember%20that%20I%20said,see%20the%20difference%20between%20these%20two&amp;text=You%20may%20remember%20that%20I%20said%20%28a%20word&amp;text=thus%20you%20see%20the%20difference%20between%20these%20two" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

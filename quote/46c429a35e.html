<main class="wrap"><figure class="quote" id="q-46c429a35e" data-kw="">
<blockquote><p>And hence in those very passages in which the Holy Spirit promises eternal glory as the reward of works, by expressly calling it an inheritance, he demonstrates that it comes to us from some other quarter. … You see how, as it were, in formal terms they carefully caution us to attribute eternal blessedness not to works, but to the adoption of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“And hence in those very passages in which the Holy Spirit promises eternal glory as the reward of works, by expressly calling it an inheritance, he demonstrates that it comes to us from some other quarter. … You see how, as it were, in formal terms they carefully caution us to attribute eternal blessedness not to works, but to the adoption of God.”

— John Calvin, Institutes of the Christian Religion, 3.18.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd%20hence%20in%20those%20very%20passages%20in%20which%20the%20Holy%20Spirit%20promises%20eternal%20glory%20as%20the%20reward%20of%20works%2C%20by%20expressly%20calling%20it%20an%20inheritance%2C%20he%20demonstrates%20that%20it%20comes%20to%20us%20from%20some%20other%20quarter.%20%E2%80%A6%20You%20see%20how%2C%20as%20it%20were%2C%20in%20formal%20terms%20they%20carefully%20caution%20us%20to%20attribute%20eternal%20blessedness%20not%20to%20works%2C%20but%20to%20the%20adoption%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.18.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46c429a35e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46c429a35e.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d2ec44acf" data-kw="">
<blockquote><p>If Christ were now speaking of the cause of our salvation, the Papists could not be blamed for inferring that we merit eternal life by good works; but as Christ had no other design than to exhort his people to holy and upright conduct, it is improper to conclude from his words what is the value of the merits of works. … But we have another reply to offer, which is still more clear; for we do not deny that a reward is promised to good works, but maintain that it is a reward of grace, because it depends on adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“If Christ were now speaking of the cause of our salvation, the Papists could not be blamed for inferring that we merit eternal life by good works; but as Christ had no other design than to exhort his people to holy and upright conduct, it is improper to conclude from his words what is the value of the merits of works. … But we have another reply to offer, which is still more clear; for we do not deny that a reward is promised to good works, but maintain that it is a reward of grace, because it depends on adoption.”

— John Calvin, Commentary on a Harmony of the Evangelists, Matthew 25:35">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf%20Christ%20were%20now%20speaking%20of%20the%20cause%20of%20our%20salvation%2C%20the%20Papists%20could%20not%20be%20blamed%20for%20inferring%20that%20we%20merit%20eternal%20life%20by%20good%20works%3B%20but%20as%20Christ%20had%20no%20other%20design%20than%20to%20exhort%20his%20people%20to%20holy%20and%20upright%20conduct%2C%20it%20is%20improper%20to%20conclude%20from%20his%20words%20what%20is%20the%20value%20of%20the%20merits%20of%20works.%20%E2%80%A6%20But%20we%20have%20another%20reply%20to%20offer%2C%20which%20is%20still%20more%20clear%3B%20for%20we%20do%20not%20deny%20that%20a%20reward%20is%20promised%20to%20good%20works%2C%20but%20maintain%20that%20it%20is%20a%20reward%20of%20grace%2C%20because%20it%20depends%20on%20adoption.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentary%20on%20a%20Harmony%20of%20the%20Evangelists%2C%20Matthew%2025%3A35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d2ec44acf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d2ec44acf.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom33" rel="noopener" target="_blank">Read it online · CCEL, vol. 3</a></div>
</figure><figure class="quote" id="q-ae28ff4efe" data-kw="">
<blockquote><p>For though it may be easy to object, that the reward was laid up with a view to their future merits, any person who will candidly examine the words must acknowledge that there is an implied commendation of the grace of God. Nay more, Christ does not simply invite believers to possess the kingdom, as if they had obtained it by their merits, but expressly says that it is bestowed on them as heirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“For though it may be easy to object, that the reward was laid up with a view to their future merits, any person who will candidly examine the words must acknowledge that there is an implied commendation of the grace of God. Nay more, Christ does not simply invite believers to possess the kingdom, as if they had obtained it by their merits, but expressly says that it is bestowed on them as heirs.”

— John Calvin, Commentary on a Harmony of the Evangelists, Matthew 25:34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%20though%20it%20may%20be%20easy%20to%20object%2C%20that%20the%20reward%20was%20laid%20up%20with%20a%20view%20to%20their%20future%20merits%2C%20any%20person%20who%20will%20candidly%20examine%20the%20words%20must%20acknowledge%20that%20there%20is%20an%20implied%20commendation%20of%20the%20grace%20of%20God.%20Nay%20more%2C%20Christ%20does%20not%20simply%20invite%20believers%20to%20possess%20the%20kingdom%2C%20as%20if%20they%20had%20obtained%20it%20by%20their%20merits%2C%20but%20expressly%20says%20that%20it%20is%20bestowed%20on%20them%20as%20heirs.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentary%20on%20a%20Harmony%20of%20the%20Evangelists%2C%20Matthew%2025%3A34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae28ff4efe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae28ff4efe.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom33" rel="noopener" target="_blank">Read it online · CCEL, vol. 3</a></div>
</figure><figure class="quote" id="q-e8064395f9" data-kw="">
<blockquote><p>We must therefore hold these two principles, first, that believers are called to the possession of the kingdom of heaven, so far as relates to good works, not because they deserved them through the righteousness of works, or because their own minds prompted them to obtain that righteousness, but because God justifies those whom he previously elected, (Romans 8:30.) Secondly, although by the guidance of the Spirit they aim at the practice of righteousness, yet as they never fulfill the law of God, no reward is due to them, but the term reward is applied to that which is bestowed by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“We must therefore hold these two principles, first, that believers are called to the possession of the kingdom of heaven, so far as relates to good works, not because they deserved them through the righteousness of works, or because their own minds prompted them to obtain that righteousness, but because God justifies those whom he previously elected, (Romans 8:30.) Secondly, although by the guidance of the Spirit they aim at the practice of righteousness, yet as they never fulfill the law of God, no reward is due to them, but the term reward is applied to that which is bestowed by grace.”

— John Calvin, Commentary on a Harmony of the Evangelists, Matthew 25:35">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%20must%20therefore%20hold%20these%20two%20principles%2C%20first%2C%20that%20believers%20are%20called%20to%20the%20possession%20of%20the%20kingdom%20of%20heaven%2C%20so%20far%20as%20relates%20to%20good%20works%2C%20not%20because%20they%20deserved%20them%20through%20the%20righteousness%20of%20works%2C%20or%20because%20their%20own%20minds%20prompted%20them%20to%20obtain%20that%20righteousness%2C%20but%20because%20God%20justifies%20those%20whom%20he%20previously%20elected%2C%20%28Romans%208%3A30.%29%20Secondly%2C%20although%20by%20the%20guidance%20of%20the%20Spirit%20they%20aim%20at%20the%20practice%20of%20righteousness%2C%20yet%20as%20they%20never%20fulfill%20the%20law%20of%20God%2C%20no%20reward%20is%20due%20to%20them%2C%20but%20the%20term%20reward%20is%20applied%20to%20that%20which%20is%20bestowed%20by%20grace.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentary%20on%20a%20Harmony%20of%20the%20Evangelists%2C%20Matthew%2025%3A35&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8064395f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8064395f9.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom33" rel="noopener" target="_blank">Read it online · CCEL, vol. 3</a></div>
</figure><figure class="quote" id="q-fdfd4585cb" data-kw="">
<blockquote><p>First, I differ from them in this, that they make eternal life the reward; … whereas Scripture uniformly proclaims that it is the inheritance which falls to us by no other right than that of free adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on ch. 16</span></figcaption>

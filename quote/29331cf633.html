<main class="wrap"><figure class="quote" id="q-29331cf633" data-kw="">
<blockquote><p>Now this general call and operation of the Holy Spirit has these degrees following: viz. First, an understanding of the Word, for the mere natural man cannot understand it, Mt. 16:23 &amp; 1 Cor. 2:14. Here observe two things, to wit, First, there are many in the places of the Gospel who hear the Word preached all the days of their lives and yet understand nothing, but remain children in understanding; now these never were made partakers so much as of common or general grace:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canterbury’s Doom, or the first part of a complete history of the commitment, charge, trial, condemnation, execution of William Laud</cite>, ... (London: Macock, 1646), 73. ‘Passages razed out concerning our effectual vocation’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-498d9d8ee6" data-kw="">
<blockquote><p>If you look into 1 Peter 3:19-20, you there find that Christ “went and preached unto the spirits in prison; which sometime were disobedient, when once the long-suffering of God waited in the days of Noah.” The meaning of which is, that in the days before the flood, Christ by his Spirit strove [Gen. 6:3] with the disobedient and rebellious sinners in the ministry of Noah, who then were living men and women as we are, but now are “spirits in prison,” that is, damned souls in hell, for their disobedience…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Knocking at the Door of Sinners’ Hearts; or, A Solemn Entreaty to Receive the Savior and His Gospel in This the Day of Mercy</cite>, (New York: American Tract Society, 1850), p. 97. This quote was compiled by Tony Byrne.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-30acc8691f" data-kw="">
<blockquote><p>Nebuchadnezzar… was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven… And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation. And all the inhabitants of the earth are reputed as nothing: and He doeth according to his will in the army of heaven, and among the inhabitants of the earth… At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">Old Testament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Dan., 4:33-36</span></figcaption>

</figure><figure class="quote" id="q-67c096ad66" data-kw="">
<blockquote><p>In point of fact, the Old Testament has a great deal to teach on the benevolent side of God’s self-revelation to the world at large. The strongest of terms are used on occasion to emphasize this truth. Even the covenant conception is not deemed too sacred to be employed for the purpose of describing the solemn manner in which God pledged to the whole of creation, in the day of Noah, His abundant, ever-flowing kindness in the sphere of natural life, His longsuffering in the view of universal sin, His common grace working for the restraint of sin. It is attributed to His righteousness, universally revealed, that He keeps this covenant and preserves man and beast. As Jonah took pity on his gourd, so He pities and spares the Ninevites and their cattle. His mercy is wider and deeper than the ocean of human misery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Doctrine of the Love of God in The Presbyterian &amp; Reformed Review 13:1-37</cite>, (1902), p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<main class="wrap"><figure class="quote" id="q-041822af0e" data-kw="angels spirits">
<blockquote><p>Are angels spiritual and incorporeal substances? We affirm. Scripture expressly calls them spirits; now for what purpose would they be called “spirits” if they are corporeal? Spirit is diametrically opposed to body: “A spirit hath not flesh and bones,” says Christ, “as ye see me have” (Lk. 24:39). For the same reason they are classed among things “invisible” (Col. 1:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.2.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/nature-number-orders.html">Nature, number, orders</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Predestination</cite>, p. 30</span></figcaption>

</figure><figure class="quote" id="q-5569676ec3" data-kw="ministry angels heirs">
<blockquote><p>No one can doubt that God uses the ministry of angels, since they are called “ministering spirits” (Heb. 1:14), “ministers of God” (Ps. 104:4), who continually stand before him and minister unto him (Dan. 7:10) and do his will (Ps. 103:21). He uses their help not from necessity and indigence, but from indulgence and love—for the good of the angels themselves and for the good of the heirs of salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8.1–2</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 7.8.1–2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNo%20one%20can%20doubt%20that%20God%20uses%20the%20ministry%20of%20angels%2C%20since%20they%20are%20called%20%E2%80%9Cministering%20spirits%E2%80%9D%20%28Heb.%201%3A14%29%2C%20%E2%80%9Cministers%20of%20God%E2%80%9D%20%28Ps.%20104%3A4%29%2C%20who%20continually%20stand%20before%20him%20and%20minister%20unto%20him%20%28Dan.%207%3A10%29%20and%20do%20his%20will%20%28Ps.%20103%3A21%29.%20He%20uses%20their%20help%20not%20from%20necessity%20and%20indigence%2C%20but%20from%20indulgence%20and%20love%E2%80%94for%20the%20good%20of%20the%20angels%20themselves%20and%20for%20the%20good%20of%20the%20heirs%20of%20salvation.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%207.8.1%E2%80%932&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5569676ec3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5569676ec3.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-a85264f608" data-kw="against angel worship">
<blockquote><p>Are angels our intercessors with God, and is any religious worship due to them? We deny against the Romanists. Mediation and intercession by which they would carry our prayers up to God and by their patronage render us acceptable to him do not pertain to their ministry; nor is any religious worship due to them, for God alone is to be worshipped.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.9.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/worship-of-angels.html">Worship of Angels</a> › <a href="../topics/angels-and-demons/worship-of-angels/against-angel-worship.html">Against angel worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Are angels our intercessors with God, and is any religious worship due to them? We deny against the Romanists. Mediation and intercession by which they would carry our prayers up to God and by their patronage render us acceptable to him do not pertain to their ministry; nor is any religious worship due to them, for God alone is to be worshipped.”

</figure><figure class="quote" id="q-bbd51f384d" data-kw="fall of angels">
<blockquote><p>What was the sin of the angels by which they are said to have rebelled against God? Sin in particular is distinguished with regard to the subjects in which it inheres: the sin of the angels, who became devils by it; and the sin of men. To no purpose is it inquired how angels could sin. It is evident from Scripture that they did sin and reason persuades us that they could fall into sin since they were created capable of falling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.5.1–2</span></figcaption>

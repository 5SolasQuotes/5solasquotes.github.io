<main class="wrap"><figure class="quote" id="q-993670cede" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?… All civil power is immediately from God in its root; in that, 1st, God has made man a social creature, and one who inclines to be governed by man; then certainly He must have put this power in man’s nature: so are we, by good reason, taught by Aristotle. 2nd, God and nature intends the policy and peace of mankind, then must God and nature have given to mankind a power to compass this end; and this must be a power of government… As domestic society is by nature’s instinct…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>

</figure><figure class="quote" id="q-9251b8fa2a" data-kw="">
<blockquote><p>Assertion 2: That the king only has the power of war and raising armies must be but a positive civil law. For: 1. By divine right, if the inferior judges have the sword given to them of God, then have they also power of war and raising armies. 2. …as therefore the king cannot take from one particular man the power of the sword for natural self-preservation, because it is the birthright of life, neither can the king take from a community and kingdom a power of rising in arms for their own defense… 3. Because no king, no civil power can take away nature’s birthright of self-defense from any man or a community of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644; Edinburgh: Ogle, 1843), p. 184 rt col</span></figcaption>

</figure><figure class="quote" id="q-6fa60112ce" data-kw="">
<blockquote><p>§29 The Decalogue has been prescribed for all people to the extent that it agrees with and explains the common law of nature for all peoples. It has also been renewed and confirmed by Christ our king. Jerome Zanchius says that this is the common judgement of theologians (De Redemptione, I, 10, 1 [actually thesis 1 of the second section (“De legibus humanis“) of Chapter 10].)… §30 Proper law (lex propia) is the law that is drawn up and established by the magistrate on the basis of common law (lex communis) and according to the nature, utility, condition, and other special circumstances of his country. It indicates the peculiar way, means, and manner by which this natural equity among men can be upheld, observed, and cultivated in any given commonwealth. Therefore, proper law (jus proprium) is nothing other than the practice of this common natural law (jus naturale) as adapted to a particular polity. It indicates how individual citizens of a given commonwealth are able to seek and attain this natural equity. Whence it is called the servant and handmaiden of common law (jus commune), and a teacher leading us to the observance of common law. §31 Proper law is established for two principal reasons, as Zanchius says [De Redemptione, I, 11, 1]. The first reason is that not all men have sufficient natural capacity that they are able to draw from these general principles of common law the particular conclusions and laws suitable to the nature and condition of an activity and its circumstances. The second reason is that natural law is not so completely written on the hearts of men that it is sufficiently efficacious in restraining men from evil and impelling them to good… In this sense, it is said that “law is set forth not for the just, but the unjust.” (1 Tim. 1:9) §32 There are two parts of this [proper] law. The first is its agreement with common law, and the second is its difference, as Francis Junius observes (De Politicae Mosis Observatione) and the jurists teach (In commentaries on the Digest I, 1, 4)… Its agreement (convenientia) with common law is in those matters common to each law, namely, in the starting point from which analogical deductions are made, in the subject under consideration, and in the purpose… The purpose of each [common and proper law] is justice and piety, or sanctity, and the same equity and common good in human society. Its difference (discrepantia) from common law arises from the fact that, in accommodation to particular and special circumstances, it departs somewhat from common law, adding or subtracting something from it. Proper law differs for two reasons, each of which provides a necessity for adding or subtracting something from common law. And so mutability, or the possibility and necessity of just changes, is introduced… Since the nature and condition of these circumstances may be diverse, inconstant, and changeable, it is not possible for proper law to acknowledge one and the same disposition of common law for everything and in everything, as Junius and Zanchius, together with the jurists, say. Therefore, this law is rightly said to be mutable or subject to change with respect to circumstances and its consequent difference from common law. But it is altogether immutable with respect to its agreement with common law. So the jurists assert together with Junius, Zanchius, Martyr, and Bucer. Thus common or moral law concludes from its principles that evildoers ought to be punished, but proposes nothing concerning the punishment. Proper law determines specifically that adulterers, murderers, and the like are to be punished by death, unless the punishment should be mitigated because of further circumstances. Various punishments, for example, exist in the Mosaic Law for these crimes… For this reason, the moral precepts of the Decalogue, having no certain, special, and fixed punishment attached to them, are general. The forensic and political law then makes specific determinations, which it relates to the circumstances of any act. §34 This proper law is one thing among the Jews, another among the Romans, another among the Germans today, and still another among other peoples… §35 Jewish proper law is twofold. It is in part ceremonial, and in part forensic or judicial… §37 The forensic [judicial] law was the means by which the Jews were informed and instructed to observe and obey both Tables, or the common law, for the cultivation of human society among them in their polity, according to the circumstances of things, persons, place, and time… §40 It should be observed that often one and the same law of the Jews could be said in varying respects to be moral (or common), ceremonial, and forensic, and to this extent mixed. What is moral in such a law is perpetual; what is judicial can be changed by the change of circumstances… … Ch. 22, §3 From these things it follows that the magistrate is obligated in the administration of the commonwealth to the proper law of Moses so far as moral equity or common law are expressed therein. This is to say, he is required to conform to everything therein that is in harmony with common law. But he is by no means required to conform in those things in which the proper law of Moses, in order to be accommodated to the polity of the Jews, differs from common law. §4 For if the magistrate should establish as absolutely necessary these proper Jewish laws, which by their nature are either changeable or obsolete, he would destroy christian liberty, which has been given for edification to him and to others, and would entangle himself and others in the yoke of slavery. Thereby he would make a necessity of something free, and impede consciences by a grievous and dangerous snare. He would obtrude mortal laws, which were promulgated in former times only for the Jewish people and are by their nature subject to change for a variety of reasons, as if they were immortal. And unless proper laws are changed with the changing circumstances because of which they broadly exist, they become wicked and attain neither to the equity of the Second Table of the Decalogue nor the piety of the First. Thus they cease to contain the common foundation of right reason. Accordingly, the magistrate who makes the proper law of Moses compulsory in his commonwealth sins grievously. For those particular circumstances and considerations because of which the Jewish proper law was promulgated should bear no weight in his commonwealth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-althusius.html">Johannes Althusius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Politica</cite>, pp. 144-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

makes specific determinations, which it relates to the circumstances of any act. §34 This proper law is one thing among the Jews, another among the Romans, another among the Germans today, and still another among other peoples… §35 Jewish proper law is twofold. It is in part ceremonial, and in part forensic or judicial… §37 The forensic [judicial] law was the means by which the Jews were informed and instructed to observe and obey both Tables, or the common law, for the cultivation of human society among them in their polity, according to the circumstances of things, persons, place, and time… §40 It should be observed that often one and the same law of the Jews could be said in varying respects to be moral (or common), ceremonial, and forensic, and to this extent mixed. What is moral in such a law is perpetual; what is judicial can be changed by the change of circumstances… … Ch. 22, §3 From these things it follows that the magistrate is obligated in the administration of the commonwealth to the proper law of Moses so far as moral equity or common law are expressed therein. This is to say, he is required to conform to everything therein that is in harmony with common law. But he is by no means required to conform in those things in which the proper law of Moses, in order to be accommodated to the polity of the Jews, differs from common law. §4 For if the magistrate should establish as absolutely necessary these proper Jewish laws, which by their nature are either changeable or obsolete, he would destroy christian liberty, which has been given for edification to him and to others, and would entangle himself and others in the yoke of slavery. Thereby he would make a necessity of something free, and impede consciences by a grievous and dangerous snare. He would obtrude mortal laws, which were promulgated in former times only for the Jewish people and are by their nature subject to change for a variety of reasons, as if they were immortal. And unless proper laws are changed with the changing circumstances because of which they broadly exist, they become wicked and attain neither to the equity of the Second Table of the Decalogue nor the piety of the First. Thus they cease to contain the common foundation of right reason. Accordingly, the magistrate who makes the proper law of Moses compulsory in his commonwealth sins grievously. For those particular circumstances and considerations because of which the Jewish proper law was promulgated should bear no weight in his commonwealth…”

— Johannes Althusius, Politica, pp. 144-48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A729+The+Decalogue+has+been+prescribed+for+all+people+to+the+extent+that+it+agrees+with+and+explains+the+common+law+of+nature+for+all+peoples.+It+has+also+been+renewed+and+confirmed+by+Christ+our+king.+Jerome+Zanchius+says+that+this+is+the+common+judgement+of+theologians+%28De+Redemptione%2C+I%2C+10%2C+1+%5Bactually+thesis+1+of+the+second+section+%28%E2%80%9CDe+legibus+humanis%E2%80%9C%29+of+Chapter+10%5D.%29%E2%80%A6+%C2%A730+Proper+law+%28lex+propia%29+is+the+law+that+is+drawn+up+and+established+by+the+magistrate+on+the+basis+of+common+law+%28lex+communis%29+and+according+to+the+nature%2C+utility%2C+condition%2C+and+other+special+circumstances+of+his+country.+It+indicates+the+peculiar+way%2C+means%2C+and+manner+by+which+this+natural+equity+among+men+can+be+upheld%2C+observed%2C+and+cultivated+in+any+given+commonwealth.+Therefore%2C+proper+law+%28jus+proprium%29+is+nothing+other+than+the+practice+of+this+common+natural+law+%28jus+naturale%29+as+adapted+to+a+particular+polity.+It+indicates+how+individual+citizens+of+a+given+commonwealth+are+able+to+seek+and+attain+this+natural+equity.+Whence+it+is+called+the+servant+and+handmaiden+of+common+law+%28jus+commune%29%2C+and+a+teacher+leading+us+to+the+observance+of+common+law.+%C2%A731+Proper+law+is+established+for+two+principal+reasons%2C+as+Zanchius+says+%5BDe+Redemptione%2C+I%2C+11%2C+1%5D.+The+first+reason+is+that+not+all+men+have+sufficient+natural+capacity+that+they+are+able+to+draw+from+these+general+principles+of+common+law+the+particular+conclusions+and+laws+suitable+to+the+nature+and+condition+of+an+activity+and+its+circumstances.+The+second+reason+is+that+natural+law+is+not+so+completely+written+on+the+hearts+of+men+that+it+is+sufficiently+efficacious+in+restraining+men+from+evil+and+impelling+them+to+good%E2%80%A6+In+this+sense%2C+it+is+said+that+%E2%80%9Claw+is+set+forth+not+for+the+just%2C+but+the+unjust.%E2%80%9D+%281+Tim.+1%3A9%29+%C2%A732+There+are+two+parts+of+this+%5Bproper%5D+law.+The+first+is+its+agreement+with+common+law%2C+and+the+second+is+its+difference%2C+as+Francis+Junius+observes+%28De+Politicae+Mosis+Observatione%29+and+the+jurists+teach+%28In+commentaries+on+the+Digest+I%2C+1%2C+4%29%E2%80%A6+Its+agreement+%28convenientia%29+with+common+law+is+in+those+matters+common+to+each+law%2C+namely%2C+in+the+starting+point+from+which+analogical+deductions+are+made%2C+in+the+subject+under+consideration%2C+and+in+the+purpose%E2%80%A6+The+purpose+of+each+%5Bcommon+and+proper+law%5D+is+justice+and+piety%2C+or+sanctity%2C+and+the+same+equity+and+common+good+in+human+society.+Its+difference+%28discrepantia%29+from+common+law+arises+from+the+fact+that%2C+in+accommodation+to+particular+and+special+circumstances%2C+it+departs+somewhat+from+common+law%2C+adding+or+subtracting+something+from+it.+Proper+law+differs+for+two+reasons%2C+each+of+which+provides+a+necessity+for+adding+or+subtracting+something+from+common+law.+And+so+mutability%2C+or+the+possibility+and+necessity+of+just+changes%2C+is+introduced%E2%80%A6+Since+the+nature+and+condition+of+these+circumstances+may+be+diverse%2C+inconstant%2C+and+changeable%2C+it+is+not+possible+for+proper+law+to+acknowledge+one+and+the+same+disposition+of+common+law+for+everything+and+in+everything%2C+as+Junius+and+Zanchius%2C+together+with+the+jurists%2C+say.+Therefore%2C+this+law+is+rightly+said+to+be+mutable+or+subject+to+change+with+respect+to+circumstances+and+its+consequent+difference+from+common+law.+But+it+is+altogether+immutable+with+respect+to+its+agreement+with+common+law.+So+the+jurists+assert+together+with+Junius%2C+Zanchius%2C+Martyr%2C+and+Bucer.+Thus+common+or+moral+law+concludes+from+its+principles+that+evildoers+ought+to+be+punished%2C+but+proposes+nothing+concerning+the+punishment.+Proper+law+determines+specifically+that+adulterers%2C+murderers%2C+and+the+like+are+to+be+punished+by+death%2C+unless+the+punishment+should+be+mitigated+because+of+further+circumstances.+Various+punishments%2C+for+example%2C+exist+in+the+Mosaic+Law+for+these+crimes%E2%80%A6+For+this+reason%2C+the+moral+precepts+of+the+Decalogue%2C+having+no+certain%2C+special%2C+and+fixed+punishment+attached+to+them%2C+are+general.+The+forensic+and+political+law+then+makes+specific+determinations%2C+which+it+relates+to+the+circumstances+of+any+act.+%C2%A734+This+proper+law+is+one+thing+among+the+Jews%2C+another+among+the+Romans%2C+another+among+the+Germans+today%2C+and+still+another+among+other+peoples%E2%80%A6+%C2%A735+Jewish+proper+law+is+twofold.+It+is+in+part+ceremonial%2C+and+in+part+forensic+or+judicial%E2%80%A6+%C2%A737+The+forensic+%5Bjudicial%5D+law+was+the+means+by+which+the+Jews+were+informed+and+instructed+to+observe+and+obey+both+Tables%2C+or+the+common+law%2C+for+the+cultivation+of+human+society+among+them+in+their+polity%2C+according+to+the+circumstances+of+things%2C+persons%2C+place%2C+and+time%E2%80%A6+%C2%A740+It+should+be+observed+that+often+one+and+the+same+law+of+the+Jews+could+be+said+in+varying+respects+to+be+moral+%28or+common%29%2C+ceremonial%2C+and+forensic%2C+and+to+this+extent+mixed.+What+is+moral+in+such+a+law+is+perpetual%3B+what+is+judicial+can+be+changed+by+the+change+of+circumstances%E2%80%A6+%E2%80%A6+Ch.+22%2C+%C2%A73+From+these+things+it+follows+that+the+magistrate+is+obligated+in+the+administration+of+the+commonwealth+to+the+proper+law+of+Moses+so+far+as+moral+equity+or+common+law+are+expressed+therein.+This+is+to+say%2C+he+is+required+to+conform+to+everything+therein+that+is+in+harmony+with+common+law.+But+he+is+by+no+means+required+to+conform+in+those+things+in+which+the+proper+law+of+Moses%2C+in+order+to+be+accommodated+to+the+polity+of+the+Jews%2C+differs+from+common+law.+%C2%A74+For+if+the+magistrate+should+establish+as+absolutely+necessary+these+proper+Jewish+laws%2C+which+by+their+nature+are+either+changeable+or+obsolete%2C+he+would+destroy+christian+liberty%2C+which+has+been+given+for+edification+to+him+and+to+others%2C+and+would+entangle+himself+and+others+in+the+yoke+of+slavery.+Thereby+he+would+make+a+necessity+of+something+free%2C+and+impede+consciences+by+a+grievous+and+dangerous+snare.+He+would+obtrude+mortal+laws%2C+which+were+promulgated+in+former+times+only+for+the+Jewish+people+and+are+by+their+nature+subject+to+change+for+a+variety+of+reasons%2C+as+if+they+were+immortal.+And+unless+proper+laws+are+changed+with+the+changing+circumstances+because+of+which+they+broadly+exist%2C+they+become+wicked+and+attain+neither+to+the+equity+of+the+Second+Table+of+the+Decalogue+nor+the+piety+of+the+First.+Thus+they+cease+to+contain+the+common+foundation+of+right+reason.+Accordingly%2C+the+magistrate+who+makes+the+proper+law+of+Moses+compulsory+in+his+commonwealth+sins+grievously.+For+those+particular+circumstances+and+considerations+because+of+which+the+Jewish+proper+law+was+promulgated+should+bear+no+weight+in+his+commonwealth%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johannes+Althusius%2C+Politica%2C+pp.+144-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fa60112ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fa60112ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=29%20The%20Decalogue%20has%20been%20prescribed,bear%20no%20weight%20in%20his%20commonwealth&amp;text=29%20The%20Decalogue%20has%20been%20prescribed%20for%20all&amp;text=promulgated%20should%20bear%20no%20weight%20in%20his%20commonwealth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

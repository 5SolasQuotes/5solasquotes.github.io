<main class="wrap"><figure class="quote" id="q-d3b9d31e0a" data-kw="">
<blockquote><p>[W]e hold that the king, by office, is the church’s nurse father, a sacred ordinance, the deputed power of God; but by the Prelate’s way, all inferior judges, and God’s deputies on earth, who are also our fathers in the fifth commandment style are to be obeyed by no divine law; the king, misled by p[opish]. prelates, shall forbid to obey them, who is in downright truth, a mortal civil pope, may loose and liberate subjects from the tie of a divine law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex, Rex; or, the law and the prince</cite>, (1644; Edinburgh, 1843), xxi-ii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>About the middle of August [1665] I set myself to write a short exhortation to those who were shut up because of the plague, and just when I had finished it, heard the melancholy news of my father’s death, on the 16th; upon which I wrote a letter to comfort my mother, wherewith I much comforted myself; and on the 24th sent abroad my little exhortation to those who were shut up, beseeching God that it might do good to all. And on the 30th I thought of writing a little treatise of comfort in this sad time, which I finished and sent to my bookseller September the first, praying the blessing of Heaven might attend upon these my little labors for the good of souls.” – Autobiography Grosvenor, Benjamin – Preparation for Death, the Best Preservative Against the Plague, being the substance of 2 Sermons (London, 1721) Grosvenor (1676–1758) was originally an English, primitive baptist, but was excommunicated when he became a presbyterian. He then served as a dissenting presbyterian minister and was a ‘moderate Calvinist’. From 1720-22 there were plagues in France (the Great Plague of Marseille) and in New England. England prepared for it, but apparently never got it. Barnard, John – ‘2nd Sermon, The Fatal Consequence of a People’s Persisting in Sin: Preached… on a Public Fast in the Time of the Measles, Jan, 14, 1713/14’ in Two Sermons: The Christian’s Behavior under Severe and Repeated Bereavements, and The Fatal Consequence of a Peoples Persisting in Sin (Boston, 1714) Clarke, Samuel – Sermons 7-9 in XVII sermons on several occasions… (London, 1724) on Isa. 26:9; Lk. 13:2-3 &amp; Mt. 24:7 Clarke (1675-1729) was a latitudinarian, Anglican clergyman and English philosopher. He is considered the major British figure in philosophy between John Locke and George Berkeley. Emerson, Joseph – ‘A Word to those that are Afflicted very much; Mr. Emerson’s sermon on the mortal sickness at Malden; Essay to preserve the memory, and improve the affliction, of the late mortal sickness at Malden; a sermon preached at the lecture in Malden, October 20th 1738, on occasion of the repeated and multiplied deaths of children in many families in said town, by the throat distemper’ (Boston, 1738) . American Presbyterians Davies, Samuel – ‘This Very Year You Are Going to Die!’ (1761) A sermon on Jer. 28:16, “This year thou shalt die.</p></blockquote>

<blockquote><p>(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(XI, 27) as quoted in Heinrich Heppe, Reformed Dogmatics, ch. 17, Person of Christ, section 12</cite>, pp. 425-6</span></figcaption>

<blockquote><p>Persons who are justly condemned to slavery [penal servitude], as a punishment of their dishonesty or other crimes, may be lawfully bought for slaves: and prisoners may be bought from conquerors, if it be in order to preserve their lives.

But to make war upon neighbours, or encourage others to it, in order to procure slaves, – or to trade in buying slaves, – is altogether unmerciful, and shocking to right reason and humanity, – natively entailing upon these merchants the blood of the souls and bodies of their fellow-creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A compendious view of natural and revealed religion</cite>, (1782; Fearn: Christian Focus Publications, 2002), p. 22.</span></figcaption>

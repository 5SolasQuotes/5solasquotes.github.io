<main class="wrap"><figure class="quote" id="q-e6d50a5df4" data-kw="">
<blockquote><p>The necessities of our being and the wise appointments of Providence subjecting us to a great variety of occupations, we expect to discern their unity in some ultimate object which they were designed to promote. But are we capable of discerning an ultimate purpose, towards which all the arrangements of life are tending?” The inquiry is useless,” say some. “It is presumptuous,” say others. “It is positively hurtful,” say others; “for it interferes with the free investigations of nature.” The ancient Epicurean discarded from his philosophy, most consistently, the whole doctrine of final causes; but a Christian scholar, we hold, cannot prosecute any science or any pursuit aright, unless he prosecute it to an ultimate use and end.

The geologist, carefully observing the phenomena of natural agencies, finds that their action results in the formation of strata of rock and coal, and the deposition of soils. When his theory is authenticated, is it not a pertinent question for him to propose, — And for what was the earth made at all? The eye of Harvey was arrested by the beautiful play of the valves of the veins; and the inquiry which spontaneously arose to his mind was, “What use were they designed to subserve?” The conviction that now prevails among physiologists, that all the arrangements of the animal frame were formed for some purpose, is so strong, that it is a guide in all discoveries and speculations.

The anatomist, when dissecting the eye, observing the combination of lenses and nerves which compose the organ itself—the socket in which it moves —the mucus which makes it easy—the ligature which ties it in—the lid which screens it from harm—the limpid tear which prevents the roughness of friction, cannot doubt that it is an instrument designed to paint within the images of objects without. He will demonstrate to your satisfaction that the external configuration and position, the internal spiral tubes, cells, and tympanum of the ear, are all intended to form an organ for catching the vibrations of sound, and transmitting them to the mysterious lodger within. He will show you what a variety of bones, muscles, tendons, hinges, and sockets, enter into that most wonderful machine, the human hand; and, in like manner, he investigates and discloses the uses of all the various organs of the human body.

Now the intellectual philosopher begins to observe the beautiful adaptations of the being within to the world without: the skilful, yet simple arrangement of instincts, appetites, affections, which belong to the human mind. At length we are brought to perceive the symmetry and completeness of our physical and mental constitution, and man stands before us the admirable and august master-work of Infinite Skill. But has science now reached its limit? Has it arrived at the ultimate knowledge where it is compelled to stop? It has discovered the uses of bones, and nerves, and instincts, to form a living man. Can we stop at this point, without asking, FOR WHAT WAS MAN HIMSELF MADE?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-adams.html">William Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity the End and Unity of all Sciences and Pursuits: An Address Delivered before the Alumni of Yale College, New Haven, September 18, 1847</cite>, (New York: Leavitt, Trow &amp; Company, 1847), pp 14-16.</span></figcaption>

<blockquote><p>CARLYLE. I am no worshipper of Force. I see nothing to admire in mere power, i.e. in its quantity apart from its quality. Carlyle’s earnestness is very touching and noble; but it seems to me that, according to his teaching, if you could conceive an omnipotent devil, you ought to worship him as much as Israel’s Jehovah. [So that he is in one sense a modem Manichee?] I suspect so. And an omnipotent militia of darkness would be the very horror of horrors. . .

The connection between Carlylism and despotism I see, but the link is nowhere explicitly avowed. Carlyle is sometimes difficult to understand, and very difficult to judge. Why did he call Chalmers the last of the Christians? I suppose he forgets what he has written elsewhere. Hero-worship! ah well, he and I have to meet a strange hero yet … the greatest that I know of next to Him who overcame him. Carlyle has great faith in the devil, but I suspect he always appreciates quantity of being and of power more than quality. Have you observed how Christianity takes up the fragmentary truth that lies in the demonological and the spirit-inhabited? We Christians have lost nothing that could be retained in the old mythologies. And perhaps these beliefs in spiritual presences in nature are but the lingering mist of patriarchal tradition concerning the spirit-world. …

Carlyle, too, when he keeps to genuine English, when his historical narrative (as in some parts of his “French Revolution “) is vigorously sustained, has done a great deal to display the capabilities of English prose. But he often writes sheer gibberish, according to the classical tests. And whenever a man becomes cloudy in his words, be sure that his thought has grown shadowy too.</p></blockquote>

</figure><figure class="quote" id="q-f896b156a0" data-kw="">
<blockquote><p>Of all conceptions of the human mind, the idea of God is the most sublime. It is not only sublime, but awful. Every thing else appears diminutive while the mind is occupied with this thought. Though the idea of an eternal and infinite being is too great for the grasp of the human intellect, yet it is suited to the human mind. It fills it, and produces a feeling of reverence, which is felt to be a right emotion. If there is no such being, this is the grandest illusion which ever possessed the imagination of man.

If it be an error, then error is preferable to truth; for on this supposition, truth in its whole compass has nothing in grandeur to compare with illusion. Remove this idea, and the mind is confounded with an infinite blank. Deprived of this, the intellect has no object to fill it: it is confounded and distressed with the retrospect of the past, and prospect of the future. But it cannot be, that this noblest of all conceptions of the human mind should be false: the capacity of the soul of man to form such a conception is a proof of the existence of a great and good and intelligent First Cause.</p></blockquote>

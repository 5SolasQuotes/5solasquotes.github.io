<main class="wrap"><figure class="quote" id="q-9984774744" data-kw="">
<blockquote><p>…even by 1679 there were some twenty or thirty ministers still preaching in the fields, and no significant decline in the number of their hearers. But the year 1679 was to bring a very radical change and to usher in an era of persecution on a scale hitherto unknown. To some extent this situation resulted from the annoyance caused to the government by the activities of Robert Hamilton and his followers, who were by now acting as a kind of sel-appointed armed bodyguard to Cameron in his preaching tours about the country. Hamilton had already been involved, as early as November 1677, in a violent incident at the home of his friend John Balfour of Kinloch, in Fife [a principal actor in the assassination of Archbishop James Sharp in 1679], when a party of soldiers who approached the house were fired upon and one of them was seriously wounded. How far Hamilton himself may have been responsible for incidents of this kind is not altogether clear…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill</cite>, (Durham: Evangelical Press, 1988), p. 88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-0b0b1af9c1" data-kw="">
<blockquote><p>XL. Third, zeal for exploring, if we observe some propensity of God toward us, some love, grace, or mercy, whether is it only that universal propensity which is inclined to beasts as well as men (Ps. 36:6), or that common propensity which is inclined to the reprobate as well as the elect.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a534325fc2" data-kw="">
<blockquote><p>…why then did Christ here urge the testimony of John? Why, these things I say, that you may be saved. This He aimed at in all this discourse, to save not his own life, but the souls of others; He produced John’s testimony because, being one of themselves, it was to be hoped that they would hearken to it. Note, First, Christ desires and designs the salvation even of his enemies and persecutors. Secondly, the word of Christ is the ordinary means of salvation. Thirdly, Christ in his word considers our infirmities and condescends to our capacities, consulting not so much what it befits so great a prince to say as what we can bear, and what will be most likely to do us good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite></span></figcaption>

</figure><figure class="quote" id="q-cad23babcc" data-kw="">
<blockquote><p>And now, before we close, let us once more entreat you who are unconverted to turn to Jesus. Could ministers but give you some faint idea of Christ’s willingness to save you! If any soul here can declare that it is willing to receive Christ, let it know that Christ is yet more willing to save and to bless. He does not wish you to remain an hour longer a stranger to his love. Why did He suffer? Why did He die? Oh! not merely that He might be glorified in your destruction.</p></blockquote>

</figure><figure class="quote" id="q-2b13774c16" data-kw="">
<blockquote><p>1. The first ground is the Lord’s disposition and nature of mercy and placableness towards a poor sinner, which gives him footing for his hope abundantly in any particular case, as: (1.) From his Name and attributes, whereby He has made Himself known to his people. God proclaims his Name to Moses to be ‘the Lord, the Lord God, the powerful, the mighty Jehovah’ (Ex. 34 [vv. 6-7]), which ministers comfort when annexed to his manifestation of Himself in this way of mercy. ‘Merciful,’ inclined to pity the sin and misery of his people, ready to relieve them in their distress and not only just to require the due service and punish the defaults; ‘Gracious,’ of an affable condescending descending nature, not standing upon the distance that He is in as a great King above all his creatures; He may be petitioned, sought unto and prevailed with by his poor suitors. ‘Long-suffering,’ that is, not hasty to use severity with the worst of sinners, usually taking all other ways first with them, willing that all men should repent and come to the knowledge of the truth (1 Tim. 2:4): Trying many that repent not with much goodness to draw them to it. Enduring with much patience the very vessels of wrath before He brings destruction on them (Rom. 9:22). In all cases He forgives iniquity, transgression and sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-newcome.html">Henry Newcome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Hope... (London: E.C., 1660 [1659]), ch. 4</cite>, pp. 25-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

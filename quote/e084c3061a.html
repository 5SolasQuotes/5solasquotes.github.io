<blockquote><p>IV. We say it is a universal apostasy from true Christianity or of the truth of the gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency. V… it be committed against the knowledge of the truth not only legal, but especially gospel; not only theoretical and historical (for whoever sins against knowledge would sin against the Holy Spirit), but practical and convictive (although not persuasive). Conviction is when anyone knows the truth of the gospel, but is also convinced in his own mind of its goodness, so that he cannot even mutter against it (although he may wish to)… IX. Second, to constitute this sin is required a total defection from the truth and its wicked rejection and denial; not from fear simply and the weakness of the flesh… that denial of the truth should proceed from pure wickedness and petulance (arising from deadly hatred and obstinate contempt of it)… XI. The third mark is not only the denial of the recognized truth, but also a pertinacious opposition to it. For as they persecute it with the deepest hatred, it is no wonder that they endeavor with all their might to overturn it… This is evident in the Pharisees… XII. Finally, the fourth mark is stubbornness of mind and perseverance in wickedness even unto the end… XIII. And hence the unpardonableness of that sin, which is its inseparable adjunct… XV… it rises from the very nature of the sin, which is such that it excludes the very condition requisite to pardon (viz., repentance…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c8c15e343" data-kw="wages curse">
<blockquote><p>The reasons are: (1) “The wages of sin is death” (Rom. 6:23) and “the soul that sinneth, it shall die” (Ezk. 18:20). These deal not with any sin in particular, but with sin in general. Thus either venial sin is not sin or it deserves death and so is not venial. Second, the terrible formula of the law proves this: “Cursed be he that confirmeth not all the words of this law to do them” (Dt. 27:26; Gal. 3:10). If every deviation from the law deserves a curse and every sin is illegality, no sin can be granted (even the smallest) which does not bring upon it the curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.7-8</span></figcaption>

</figure><figure class="quote" id="q-7bdadc8749" data-kw="">
<blockquote><p>Some diseases are opprobria medicorum, the reproaches of physicians; but there’s no immedicabile vulnus, no disease can pose Christ’s skill; He can cure the gangrene of sin when it is come to the heart; He healed Mary Magdalen an unchaste sinner; He healed Paul who breathed out persecution against the Church, insomuch that Paul stands and wonders at the cure, 1 Tim. 1:13, ‘But I obtained mercy〈 Greek 〉; ‘I was bemercied.’ Christ heals head-distempers and heart-distempers which may keep poor trembling souls from despair. ‘O’ says the sinner, ‘never was any so diseased as I!’ But look up to thy Physician Christ, who has healing under his wings; he can melt a heart of stone and wash away black sins in the crimson of his blood; there are no desperate cases with Christ; He has those salves, oils, balsoms which can cure the worst disease. Indeed there is one disease which Christ does not heal, namely the sin against the Holy Ghost; this is called a ‘sin unto death’; if we knew any who had sinned this sin, we were to shut them out of our prayer: ‘There is a sin unto death, I do not say that he shall pray for it,’ 1 Jn. 5:16. There’s no healing for this disease; not but that Christ could cure this, but the sinner will not be cured. The king could pardon a traitor, but if he will have no pardon, he must die. The sin against the Holy Ghost is unpardonable, because the sinner will have no pardon; he scorns Christ’s blood, despites his Spirit, therefore his sin has no sacrifice, Heb. 10:26, 29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes: or a Discourse upon part of Christ’s Famous Sermon on the Mount... (London: Smith, 1660), ‘The Soul’s Malady &amp; Cure,’</cite>, pp. 493-94</span></figcaption>

</figure><figure class="quote" id="q-efef431fc6" data-kw="">
<blockquote><p>I… John speaks of a ‘sin unto death’ (1 Jn. 5:16) for which we are not to pray, which can be no other than a sin against the Holy Spirit… XIII… And for this reason it is called a ‘sin unto death’ (1 Jn. 5:16, 17), not only because it deserves death in its own nature (for so all sins are unto death (which is the case with all the sins of reprobates), but because it is such as to be absolutely unpardonable in itself.</p></blockquote>

</figure><figure class="quote" id="q-93c2c65903" data-kw="">
<blockquote><p>Hence, (7) it is said that those born of God cannot sin (1 John 3:9; 5:18), namely unto death (1 John 5:16), because by the grace of God, before death they are certainly restored (Ps. 37:24; Prov. 24:16).</p></blockquote>

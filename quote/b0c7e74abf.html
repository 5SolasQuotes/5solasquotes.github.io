<main class="wrap"><figure class="quote" id="q-b0c7e74abf" data-kw="">
<blockquote><p>Also whatever is a profession in fact, of a false religion by ceremonies indifferent, and yet proper to a false religion, is a denying of the true religion; but the using of these ceremonies, used by Papists and Jews is such; Therefore… The proposition [above] is Scripture, Gal. 2:14, Peter lived after the manner of the Jews in using the religious materials of the Jews, though he had no Jewish intention or opinion; yea, Acts 10, he disputes against that: So circumcision, Gal. 6:14-15, is put for the Jewish Church. Now altars, organs, Jewish ephods, or surplice, Mass-clothes, and Romish crossing, bowing to altars, images, are badges of Jewish and Popish religion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, pp. 142-143</span></figcaption>

</figure><figure class="quote" id="q-3e726a8c53" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sean-p-m-mcdonald.html">Sean P.M. McDonald</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”I will not hear the melody of thy viols’: Opposition to Instrumental Music in Historic Presbyterian &amp; Puritan Worship’ M.A. thesis</cite>, (Liberty University, 2026) 138 pp. Covers Geneva, England, Scotland and the Netherlands, 1500’s to c. 1800, and touches upon Germany. | McDonald, from the second quote above, also appears to interpret silence in foundational Church documents as being against musical instruments. McMillan (p. 94), as quoted by McDonald (p. 33, fn. 74) relates:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is somewhat remarkable that in our [Scottish] Reformation documents there is no reference to instrumental music. While many Roman practices are condemned in the first Book of Discipline and the Confession of Faith, nothing whatever is said against the use of organs or other instruments of music in the worship of God;”

— Sean P.M. McDonald, ”I will not hear the melody of thy viols’: Opposition to Instrumental Music in Historic Presbyterian &amp; Puritan Worship’ M.A. thesis (Liberty University, 2026) 138 pp. Covers Geneva, England, Scotland and the Netherlands, 1500’s to c. 1800, and touches upon Germany. | McDonald, from the second quote above, also appears to interpret silence in foundational Church documents as being against musical instruments. McMillan (p. 94), as quoted by McDonald (p. 33, fn. 74) relates:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+somewhat+remarkable+that+in+our+%5BScottish%5D+Reformation+documents+there+is+no+reference+to+instrumental+music.+While+many+Roman+practices+are+condemned+in+the+first+Book+of+Discipline+and+the+Confession+of+Faith%2C+nothing+whatever+is+said+against+the+use+of+organs+or+other+instruments+of+music+in+the+worship+of+God%3B%E2%80%9D%0A%0A%E2%80%94+Sean+P.M.+McDonald%2C+%E2%80%9DI+will+not+hear+the+melody+of+thy+viols%E2%80%99%3A+Opposition+to+Instrumental+Music+in+Historic+Presbyterian+%26+Puritan+Worship%E2%80%99+M.A.+thesis+%28Liberty+University%2C+2026%29+138+pp.+Covers+Geneva%2C+England%2C+Scotland+and+the+Netherlands%2C+1500%E2%80%99s+to+c.+1800%2C+and+touches+upon+Germany.+%7C+McDonald%2C+from+the+second+quote+above%2C+also+appears+to+interpret+silence+in+foundational+Church+documents+as+being+against+musical+instruments.+McMillan+%28p.+94%29%2C+as+quoted+by+McDonald+%28p.+33%2C+fn.+74%29+relates%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e726a8c53.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e726a8c53.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/musical-instruments/#:~:text=It%20is%20somewhat%20remarkable%20that%20in,music%20in%20the%20worship%20of%20God&amp;text=It%20is%20somewhat%20remarkable%20that%20in%20our%20%5BScottish&amp;text=instruments%20of%20music%20in%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9aed13649e" data-kw="">
<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

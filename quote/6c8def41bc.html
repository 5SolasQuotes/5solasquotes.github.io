<blockquote><p>Who are these that fly as a cloud, and as doves to their windows” (Isaiah 60:8)

When preaching on the above text, the early Seceder Ebenezer Erskine distinguished between water baptism and the baptism of the Spirit:

There is the public window of baptism, that initiating ordinance, ‘which signifies and seals our ingrafting into Christ, and our partaking of the benefits of the new covenant, and our engagement to be the Lord’s.’ Sirs, ye are all entered into God’s outer house by this window. O do not stay there, but fly in a little further, even into the chambers of presence. The outward seal of God’s covenant gives you a right to take hold of the covenant, and of Christ the covenant Head; and I may say to you (who have come in at this window of the visible church), what Paul says concerning the Jews, Rom. ix. 4, “To you belongs the adoption, and the glory, and the covenants, and the giving of the law, and the service of God, and the promises;” and therefore take care that you do not forsake your own mercy; never rest until you get the baptism of the Spirit, as well as the baptism of water, by which ye shall be “sealed unto the day of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s doves flying to his windows’ in The works of Ebenezer Erskine</cite></span></figcaption>

</figure><figure class="quote" id="q-cfefc8c245" data-kw="">
<blockquote><p>This is sure and certain, that God instituted his sacraments and covenant seals only for those who recognize and maintain the church as already made up of parties of the covenant, and that it is not His intention to make them Christians by the sacraments first, but rather to make those who are already Christians to be Christians more and more and to confirm the work begun in them… Hence, if anyone considers the children of Christians to be pagans and non-Christians, and damns all those infants who cannot come to be baptized, let him take care on what ground he does so, because Paul calls them holy (1 Cor. 7), and God says to all believers in the person of Abraham that He will be their God and the God of their seed… Next let him consider how he will permit them to be baptized with a good conscience, for knowingly to baptize a pagan and unbeliever [which is entailed if the children are not already in the Covenant] is an open abuse and desecration of baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sudhoff, Olevianus und Ursinus</cite>, pp. 633 ff. as quoted in Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’, p. 264-5 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-b066cda5ea" data-kw="">
<blockquote><p>But since before baptism was instituted God’s people had circumcision instead, let us examine how these two signs differ from each other, and in what respects they are alike. From this will appear the anagogic relationship of the one to the other. When the Lord commands Abraham to observe circumcision, he previously states that he will be God to him and his descendants [Gen. 17:7, 10], adding that he possesses the abundance and sufficiency of all things [Gen. 17:1, 6, 8]. This he does in order that Abraham may regard His hand as the source of every good. The promise of eternal life is contained in these words as Christ interprets them, drawing an argument from them for the immortality and resurrection of believers. For Christ says, “He is not the God of the dead but of the living” [Luke 20:38; Matt. 22:32]. Paul also, therefore, when he shows to the Ephesians out of what destruction the Lord has delivered them, from the fact that they had not been admitted into the covenant of circumcision infers that they were without Christ, without God, without hope, strangers to the testaments of promise [Eph. 2:12]—all of which the covenant itself contained. But the first access to God, the first entry into immortal life, is the forgiveness of sins. Accordingly, this corresponds to the promise of baptism that we shall be cleansed. Afterward, the Lord covenants with Abraham that he should walk before him in uprightness and innocence of heart [Gen. 17:1]. This applies to mortification, or regeneration.1 And lest anyone be in doubt, Moses more clearly explains elsewhere, when exhorting the Israelite people to circumcise the foreskin of their heart for the Lord [Deut. 10:16], that circumcision is the sign of mortification; on this account Israel has been chosen as the people of God out of all the nations of the earth [Deut. 10:15]. As God, when he adopts the posterity of Abraham as his people, commands them to be circumcised, so Moses declares that they ought to be circumcised in heart, explaining the true meaning of this carnal circumcision [Deut. 30:6]. Again, that no man should strive after it by his own strength, Moses teaches that it is a work of God’s grace. All these things are so often reiterated by the prophets that there is no need to heap up here the many texts, as they occur repeatedly [Jer. 4:4; Ezek. 16:30]. We have, therefore, a spiritual promise given to the patriarchs in circumcision such as is given us in baptism, since it represented for them forgiveness of sins and mortification of flesh. Moreover, as we have taught that Christ is the foundation of baptism, in whom both of these reside, so it is also evident that he is the foundation of circumcision. For he is promised to Abraham, and in him the blessing of all nations [Gen. 12:2–3]. To seal this grace, the sign of circumcision is added.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (Battles edition), 4.16.3</span></figcaption>

<blockquote><p>As it is full of Consolation to Believers in respect of themselves, so also in reference to posterity: Their children are God’s children: They being of the Lord’s Inheritance, their children are his heritage in like manner: These bring forth children to God, their seed be owns and challenges for His: An infinite love in God, an unspeakable comfort to a parent, when the Infant, who by corruption of nature is in Satan’s jaws, in no less danger of Hell, then Moses was of the water; and not so much as sensible of it; God pleases to look upon him in this condition and to make it the time of love, and to find out ways of freedom.

What the Apostle speaks from the Prophet of God’s care of the Gentiles, is certainly true being applied to Infants. I was found of them that sought me not, and made manifest to them that enquired not after me. Had we that hopeless opinion of our children as Papists of theirs that die without Baptism; what a wretched case were it (with David) to part with an Infant out of the world? How could such mourn in any other way then those that are without hope? parting with an Infant without part in Christ, and in no better posture towards God then the seed of the sinners of the Gentiles. But we find God more rich in mercy, Christ himself embracing them in their infancy, and taking them into his special love as those that bear his name:

And though death prevent their Baptism, He that hath appointed Ordinances is not tied to them, but can save without them. Bellarmine confesseth that the desire of Baptism in one of the Catechumen, (that is, one instructed in the Principles of Christ and not baptized) doth save; though the text, John 3.5. understood with their Comment be in the Letter against it, why then should not that Grace? which when the person is of capacity would shew it self in desires qualify for Salvation in like manner? Finding this love in God, these bowels in Christ, we may safely conclude, that Children have bliss, Parents have comfort, and let God have the Glory.</p></blockquote>

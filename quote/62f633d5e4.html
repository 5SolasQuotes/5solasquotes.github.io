<main class="wrap"><figure class="quote" id="q-62f633d5e4" data-kw="">
<blockquote><p>From the very beginning of the Reformation there have been various attempts for a composition of the differences between the church of Rome and those who were departed from it. Councils of princes, conventions of divines, imperial edicts, sedate consultations of learned men, have all been made use of unto this end; and all in vain. And it was for a while the judgment of most wise men, that the council of Trent had rendered all reconciliations, so much as by a pretence of any condescension on the part of Rome, utterly impossible; for it hath bound itself and all the world that will own its authority, under solemn curses, not to make any change or alteration in the present state of the papal church, though the salvation of all men living should depend thereon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief and Impartial Account of the Nature of the Protestant Religion</cite>, ed. William H. Goold, vol. 14 (Edinburgh: T&amp;T Clark, n.d.), 545–46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a></span></div>

</figure><figure class="quote" id="q-623aa7b562" data-kw="">
<blockquote><p>The Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith</cite>, on ch. 1, §§ 9–10</span></figcaption>

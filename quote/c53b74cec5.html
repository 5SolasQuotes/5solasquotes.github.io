<main class="wrap"><figure class="quote" id="q-c53b74cec5" data-kw="">
<blockquote><p>Q. 17. How does it appear that the scriptures are not an imposition upon mankind?

A. If the penman of the scriptures had inclined to deceive, they would have accommodated themselves to the dispositions of the people with whom they conversed, and connived at their lusts; but, on the contrary, we find they faithfully exposed the errors and vices of men, and impartially set themselves against everything that corrupt nature is fond of; and that, though they were laid open to the greatest hardships and sufferings for so doing, Acts 5:29-41.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher-and-ebenezer-erskine.html">James Fisher and Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism explained, by way of question and answer. In two parts</cite>, (1765; Stoke-on-Trent, 1998), pp 20-1.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a69526e11" data-kw="">
<blockquote><p>That this covenant is not dissolved without the consent of this Church. Distinguish here direct dissolution from indirect, or that which consequently accompanies something else. The former is when someone decides to migrate elsewhere of his own accord; cessation of actual and explicit communion with and in that particular Church follows migration. Here, a free person is subject to the judgment of no Church; nor do the Bin and Luc. 12, D. 14, 14, which pertain directly to the Church. Unless someone extends ecclesiastical unity and power with the Pontificals to all secular matters, in order, as they say, to spiritual matters. … Furthermore, another departure is different from renunciation and separation or division, from exchange: just as one moves from one room to another in the same house, or from house to house in the same city. The former is directly subordinated to the judgment and authority of the Church; the latter is not at all. For he does not depart from Christ and ecclesiastical communion who migrates from one church to another. But he does depart who through migration forsakes all external communion of the Church or even passes over to sects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 62-63 (PDF p. 67)</span></figcaption>

</figure><figure class="quote" id="q-6e67728399" data-kw="">
<blockquote><p>Our Lord Jesus is no approver nor countenancer of separation from a true Church for the faults of some members in it; neither do faults in some members, and defects in ministers and officers in executing discipline, pollute the ordinances in themselves, or to others who are free of that guilt; and so do not necessitate a separation from such a Church, or any ordinance thereof: For, this and the former epistle being compared together, these things are clear, that there were gross members in the Church, adulterers, Nicolaitans, seducers, etc. that they are continued in Church-communion, ‘thou hast them and sufferest them,’ clearly import this; for that angel no otherwise had them but as Church-members under his charge. 3. That this angel sinfully permitted them to continue Church-members, and therefore is reproved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-45df795f4a" data-kw="">
<blockquote><p>[Amyrauldianism] is not… an acceptable form of Calvinism, or even a tenable form of Calvinism. For one thing, it is a logically inconsistent form of Calvinism and therefore an unstable form of Calvinism… …it is impossible to contend that God intends the gift of his Son for all men alike and equally and at the same time intends that it shall not actually save all but only a select body which He Himself provides for it. The schematization of the order of decrees presented by the Amyraldians, in a word, necessarily implies a chronological relation of precedence and subsequence among the decrees, the assumption of which abolishes God, and this can be escaped only by altering the nature of the atonement. And therefore the nature of the atonement is altered by them, and Christianity is wounded at its very heart… A conditional substitution being an absurdity, because the condition is no condition to God, if you grant him even so much as the poor attribute of foreknowledge, they necessarily turn away from a substitutive atonement altogether…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Plan of Salvation</cite>, (USA: Simpson Publishing Company, rep. 1989), pp. 96-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d01b24491" data-kw="">
<blockquote><p>Amyraldus (whom I look upon as one of the greatest wits of these days) will at present go a middle way between the [Reformed] churches of France and the Arminians. What hath been the issue? Among the churches, divisions, tumult, disorder; among the professors and ministers, revilings, evil surmisings; to the whole body of the people, scandals and offences; and in respect of himself, evidence of daily approaching nearer to the Arminian party, until, as one of them saith of him, he is not far from their kingdom of heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, (Great Britain: Banner, rep. 1967), vol. 12, pp. 48-49</span></figcaption>

</figure><figure class="quote" id="q-dbe4dc9a76" data-kw="">
<blockquote><p>Objection 4. The fathers which believed aright do affirm that Christ redeemed all and the whole world. Answer: Whereas they write that Christ redeemed all men and the world, their meaning is that He did it according unto sufficiency and the common cause and common nature of all, which Christ did take upon Him: and not effectually on God’s part. This very thing does Prosper (Resp. ad object. vin. 1, obj.) make plain: ‘All men’ (says he): ‘are rightly said to be redeemed in respect of the one nature of all and the one cause of all, which our Lord did truly take upon Him: and yet all are not delivered from captivity: The propriety of redemption without doubt belongs unto them for whom the prince of the world is sent abroad:—whose death was not so bestowed for mankind as that it should also pertain unto the redemption of them who were not to be regenerated.’ And again he says (Ad Capit. Gall., ch. 9): ‘Our Savior may fitly be said to be crucified for the redemption of all the world, both in respect that He truly took upon Him the nature of man, and also in respect of the common or general perdition in the first man: and yet He may be said to be crucified only for those unto whom his death was available.’ Moreover the fathers speak of the universality and of the world of believers. So says he that is the author of The Calling of the Gentiles: ‘The people of God’ (says he, bk. 1) ‘have their fulness?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606) | 4th Crimination, pp. 105-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

<blockquote><p>The weight of the debate was clearly on the side of the proposition proposed, and on that score alone we cannot feel surprise that it was retained in the Confession.</p></blockquote>

</figure><figure class="quote" id="q-d45da0a230" data-kw="">
<blockquote><p>Especially since Robert Godfrey’s dissertation on the British delegation’s moderating influence at the Synod of Dordt, most scholars have accepted the fact that the Second Main Doctrine at Dordt responding to the Remonstrants’ Second Article [on the Atonement] was written in such a way as to make room for English hypothetical universalism. To be sure, it did not positively countenance such a view, but it allowed someone like Davenant to subscribe to the Canons. We know that all the British delegates signed the Canons and publicly supported their publication. Ten years after the Synod, Davenant confessed, ‘As for the Synod of Dort, wee may bouldly affirm, that there is no one of the 5 points there determined, but iumps with the doctrine w[hi]ch our Professors in the Chair, &amp; our Preachers in the pulpit have commonly taught with the approbation of our church.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-lynch.html">Michael Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy Pre</cite>, (Oxford Univ. Press, 2021), p. 85</span></figcaption>

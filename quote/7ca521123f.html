<main class="wrap"><figure class="quote" id="q-7ca521123f" data-kw="">
<blockquote><p>Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations Divine &amp; Moral… (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’</cite>, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7997c10a9" data-kw="">
<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into by all the members of the visible Church of one nation or kingdom: when the Church in that kingdom or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not accrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn Covenant in the presence of God. 4. …it is lawful also expressely, publicly and solemnly to vow to God those things which are in the precepts of God enjoined to all believers: But that necessity of making this public, solemn and express covenant, in the presence of the whole Church, requiring it as a thing of absolute necessity to the essential constitution of a particular church, we do not acknowledge: But that union above mentioned, we conceive sufficient by the Word of God for the joining men professing the faith into one particular church. So that, by the Word of God, to the essence and entireness of a particular Church, this union is sufficient.</p></blockquote>

</figure><figure class="quote" id="q-369bf50e10" data-kw="">
<blockquote><p>I beseech you consider, that if when an oath whose institution by God is to be the end of all strife [Heb. 6:16], shall have a natural tendency to the maintaining of strife, division and contention, to be the occasion of wars and commotions in the land of our nativity, to administer matter and occasion of jealousy in our superiors, that while we judge ourselves bound in conscience by an oath that we have taken to endeavour to alter and change the government, whether he will or no, there can be no safety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-lytler.html">Richard Lytler</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Presbyterian, humbly offering to the consideration of all pious and peaceable spirits several arguments for obedience to the Act for Uniformity… (London: 1662), ch. 6</cite>, p. 47</span></figcaption>

</figure><figure class="quote" id="q-1826e86ef5" data-kw="oath obligation third commandment">
<blockquote><p>To the third commandment belongs the celebrated question concerning the faith of an oath; or what and how great is the obligation of an oath; and in what cases we can violate or are bound to keep plighted faith. First, every oath repugnant to the law of God and the lawful obedience to magistrates (concerning things either unlawful or impossible) does not bind the swearer to a performance of it. An oath ought not to be a bond of iniquity and no one ought to be compelled to do anything iniquitously. The apostolic maxim ought always to hold good here, “It is better to obey God rather than men” (Acts 5:29).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.11.1–2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-62f4e9eeda" data-kw="">
<blockquote><p>…in 1 Cor. 11:6, ‘if the woman be not covered, let her also be shorn’: If she lays her vail aside and appears in the public assemblies without a covering, then I say, ‘let her also be shorn or shaved’, let her hair be cut close to the skin, let her go like some of the cropped philosophers among the Stoics. Not that he would have her do so, but only by this sarcastic way of speaking he signifies that one is as decent as the other. It is as disgraceful to be uncovered as to be shaved: for ’twas the laudable custom then in the Christian churches for the women to be vailed, and it was disgraceful and reproachful for any of that sex to appear bare-faced in the time of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New-Testament with a Continued Illustration of Several Difficult Texts of Scripture throughout the Whole Work</cite>, (London, 1693), ‘Of the Style of the Holy Scriptures’, ch. 4, pp. 132-33 See also, pp. 241-44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…in 1 Cor. 11:6, ‘if the woman be not covered, let her also be shorn’: If she lays her vail aside and appears in the public assemblies without a covering, then I say, ‘let her also be shorn or shaved’, let her hair be cut close to the skin, let her go like some of the cropped philosophers among the Stoics. Not that he would have her do so, but only by this sarcastic way of speaking he signifies that one is as decent as the other. It is as disgraceful to be uncovered as to be shaved: for ’twas the laudable custom then in the Christian churches for the women to be vailed, and it was disgraceful and reproachful for any of that sex to appear bare-faced in the time of worship.”

— John Edwards, A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New-Testament with a Continued Illustration of Several Difficult Texts of Scripture throughout the Whole Work (London, 1693), ‘Of the Style of the Holy Scriptures’, ch. 4, pp. 132-33 See also, pp. 241-44.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6in+1+Cor.+11%3A6%2C+%E2%80%98if+the+woman+be+not+covered%2C+let+her+also+be+shorn%E2%80%99%3A+If+she+lays+her+vail+aside+and+appears+in+the+public+assemblies+without+a+covering%2C+then+I+say%2C+%E2%80%98let+her+also+be+shorn+or+shaved%E2%80%99%2C+let+her+hair+be+cut+close+to+the+skin%2C+let+her+go+like+some+of+the+cropped+philosophers+among+the+Stoics.+Not+that+he+would+have+her+do+so%2C+but+only+by+this+sarcastic+way+of+speaking+he+signifies+that+one+is+as+decent+as+the+other.+It+is+as+disgraceful+to+be+uncovered+as+to+be+shaved%3A+for+%E2%80%99twas+the+laudable+custom+then+in+the+Christian+churches+for+the+women+to+be+vailed%2C+and+it+was+disgraceful+and+reproachful+for+any+of+that+sex+to+appear+bare-faced+in+the+time+of+worship.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+A+Discourse+concerning+the+Authority%2C+Style+%26+Perfection+of+the+Books+of+the+Old+%26+New-Testament+with+a+Continued+Illustration+of+Several+Difficult+Texts+of+Scripture+throughout+the+Whole+Work+%28London%2C+1693%29%2C+%E2%80%98Of+the+Style+of+the+Holy+Scriptures%E2%80%99%2C+ch.+4%2C+pp.+132-33+See+also%2C+pp.+241-44.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62f4e9eeda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62f4e9eeda.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=in%201%20Cor.%2011%3A6%2C%20%E2%80%98if%20the,bare%2Dfaced%20in%20the%20time%20of%20worship&amp;text=in%201%20Cor.%2011%3A6%2C%20%E2%80%98if%20the%20woman%20be&amp;tex

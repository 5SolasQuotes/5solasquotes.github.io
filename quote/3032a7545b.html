<blockquote><p>Who would not wish that these elegancies might universally hold, and that as sure as Moses knew that God was extraordinarily present in the burning bush… and the apostles that the Spirit was come down when they saw the fiery cloven tongues…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6efcea5a25" data-kw="Mary Queen of Heaven Idolatry Paganism">
<blockquote><p>As the heathens had, so the Papists have, their idols and images of things in heaven, of God, angels, saints; and want not their queen of heaven, as well as the Pagans had.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, Of the Second Commandment</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As the heathens had, so the Papists have, their idols and images of things in heaven, of God, angels, saints; and want not their queen of heaven, as well as the Pagans had.”

— Thomas Boston, An Illustration of the Doctrines of the Christian Religion, Of the Second Commandment">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+the+heathens+had%2C+so+the+Papists+have%2C+their+idols+and+images+of+things+in+heaven%2C+of+God%2C+angels%2C+saints%3B+and+want+not+their+queen+of+heaven%2C+as+well+as+the+Pagans+had.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+An+Illustration+of+the+Doctrines+of+the+Christian+Religion%2C+Of+the+Second+Commandment&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6efcea5a25.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6efcea5a25.html">Permalink</a><a class="src" href="https://archive.org/search?query=title%3A%28illustration+of+the+doctrines+of+the+christian+religion%29+AND+creator%3A%28boston%29" rel="noopener" target="_blank">Read it online · Internet Archive (multi-volume)</a></div>
</figure><figure class="quote" id="q-6618d7e760" data-kw="">
<blockquote><p>1. The form of worship forbidden in the word of God is idolatry and the adoration of saints. 2. Idolatry is the making, maintaining and religious worshipping of an idol. … 3. An idol is an image of likeness [simulacrum] made for the purposes of religious worship. Propositions I. An idol differs from an image and likeness as species from genus… So not every likeness [simulacrum] is an idol; in fact, Tertullian calls man the simulacrum of God. … III. To make an idol is to make an image or likeness for purposes of religious worship. IV. Therefore, not all making of images and likenesses is idolatry; they may be made for memorials, for enjoyment and other secular [politicus] purposes. V. The cherubim, the bronze serpent, and other objects made by God’s order were not made for purposes of religious worship, but as types of Christ. Therefore, the papists wrongly seek to defend their idols on this pretext. For (1) God ordered the making of these objects, but forbids idols; (2) no religious worship was given them, so that when the bronze serpent began to be worshipped, it was destroyed (2 Kings 18:4); to idols the religious worship is given; (3) since all types are done away since the coming of Christ, such objects have no place in the New Testament. Saints are true idols [images of God]. VI. The images that the papists make of Christ, the angels, Mary and the saints [are forbidden]. The reason is tht they are made for purposes of religious worship. The papists deny that they are idols because… (4) the saints lived in genuine human form, and (5) the images are books for the laity. Response: …(4) As to the fourth, it follows from this only that images of the saints can be made, that is, if it is not done for purposes of religious worship. (5) As for the fifth argument, its premise is false; what kind of books the idols [note Wolleb does not say “images”] are is evident from Jeremiah 10:14-15 and Habakkuk 2:18-19, where they are called teachers of lies and vanity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity (1626), bk. 2, ‘The Service of God’, 2nd Commandment in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965)</cite>, pp. 208-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. The form of worship forbidden in the word of God is idolatry and the adoration of saints. 2. Idolatry is the making, maintaining and religious worshipping of an idol. … 3. An idol is an image of likeness [simulacrum] made for the purposes of religious worship. Propositions I. An idol differs from an image and likeness as species from genus… So not every likeness [simulacrum] is an idol; in fact, Tertullian calls man the simulacrum of God. … III. To make an idol is to make an image or likeness for purposes of religious worship. IV. Therefore, not all making of images and likenesses is idolatry; they may be made for memorials, for enjoyment and other secular [politicus] purposes. V. The cherubim, the bronze serpent, and other objects made by God’s order were not made for purposes of religious worship, but as types of Christ. Therefore, the papists wrongly seek to defend their idols on this pretext. For (1) God ordered the making of these objects, but forbids idols; (2) no religious worship was given them, so that when the bronze serpent began to be worshipped, it was destroyed (2 Kings 18:4); to idols the religious worship is given; (3) since all types are done away since the coming of Christ, such objects have no place in the New Testament. Saints are true idols [images of God]. VI. The images that the papists make of Christ, the angels, Mary and the saints [are forbidden]. The reason is tht they are made for purposes of religious worship. The papists deny that they are idols because… (4) the saints lived in genuine human form, and (5) the images are books for the laity. Response: …(4) As to the fourth, it follows from this only that images of the saints can be made, that is, if it is not done for purposes of religious worship. (5) As for the fifth argument, its premise is false; what kind of books the idols [note Wolleb does not say “images”] are is evident from Jeremiah 10:14-15 and Habakkuk 2:18-19, where th </figure><figure class="quote" id="q-33147b1c16" data-kw="">
<blockquote><p>The angel of the Lord; not a created angel, but the Angel of the covenant, Christ Jesus, who then and ever was God, and was to be man… And these temporary apparitions of his were presages or forerunners of his more solemn mission and coming… I am the Lord, etc. …By a flame of fire was fitly represented God’s majesty, and purity, and power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the Bible, on Exodus, ch. 3, verse 2</cite></span></figcaption>

</figure><figure class="quote" id="q-942af74721" data-kw="">
<blockquote><p>Though making of images simply be not unlawful and discharged by this [2nd] Commandment, yet thereby every representation of God (who is the object to be worshipped) and every image religiously made use of in worship is condemned (though civil and political images and statues, which are used as ornaments, or badges of honor, or remembrancers of some fact, etc. be not condemned)… …images (otherwise lawful) when abused to idolatry become unlawful, and are not to be suffered but orderly to be removed, we call that more than a civil or a common use, when religious worship or reverence is purposely intended to them, or there is, by some one occasion or other, danger lest they may be so abused; and of this sort (viz. dangerous ones) are: 1. Images in places of worship, but it is not idolatry to have dead men’s images on their tombs or monuments in churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments… (London, 1675), 1st Commandment, pp. 55 &amp; 57-58</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-69d18d838f" data-kw="">
<blockquote><p>The promise of eternal life according to the legal covenant [pactum legale], or the covenant of works [foedus operum], is so truly conditional that it depends upon the perfect and rigid observance of the Law; and our Saviour Christ wisely sent the one who supposed that he could merit eternal life by his good deeds back to that covenant.

But the promise of eternal life ac­cording to the evangelical covenant [pactum evangelicum] and covenant of grace [foedus gratiae] depends upon the condition of faith; and all those who, feeling their infirmity and sickness, acknowledge themselves unequal to the keeping of the divine law or meriting their salvation are directed to this covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praelectiones de Duobus in Theologia Controversis Capitibus: de Judice Controversiarum, Primo; de Justitia Habituali et actuali, Altero</cite>, (Cambridge: Printing Shop of the Most-Celebrated Academy, 1631), p. 407. Quoted in Michael J. Lynch, John Davenant’s Hypothetical Universalism: A Defense of Catholic and Reformed Orthodoxy (New York: Oxford University Press, 2021), p. 134.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

ener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1dca5616f3" data-kw="">
<blockquote><p>The seed of the Messiah stand in his relation to the Father, sons by Grace because he is the Son by Nature. His children. The full meaning, we take it, is, they are children in him; for the expressions his children and his brethren are interchangeably used — “He is not ashamed to call them brethren, saying, Behold I and the children which God hath given me.” Heb. ii. 11-13. He raises all whom the Father hath given him as near himself as possible, to the rank of sons in the family of God, with a title to the heavenly glory.

The foundation of our being children is, that Christ is God’s only-begotten Son in a sense peculiarly his own before the world was; and we find the order of the Covenant, when he said — “I ascend unto my Father and your Father, and to my God and your God,” not to our Father, for there is no such equality, but to my Father by nature, and yours by being found in me. This relationship is Christ’s of right, it is ours of grace through him — an undeserved boon; and God becomes our Father only because he is the Father of one so near and dear to us.

Christ’s Sonship is not a mere official Sonship, beginning when he took the flesh. The relationship is from everlasting, founded in nature and not arbitrary; and in like manner the love involved in it had no beginning, and can have no end. The Son dwelt in the Father’s bosom before the world was, dear to him as his own soul. Had the Sonship begun in time, as some men vainly speak, we could imbibe but little comfort; for there might be constant fear, that what had a beginning might also have an end. But when we see that the Sonship is founded in the very nature of the Godhead, and can no more change than God can change, a joy unspeakable is derived from the discovery. And is not the thought an overwhelming one, that to us it should be given to stand within this bond between the Father and the Son — to be taken up, as far as may be, into this relationship, and remembered in inseparable connection with God’s dear Son?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord s Jealousy Against Backsliders Consistent with His Unchanging Love’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-6431a663f2" data-kw="">
<blockquote><p>Now such a Surety every way did Christ become unto God for us, both to pay the debt, by undergoing death in our stead, and so to satisfy God; and then as the Heir, to execute his will and testament.

He became Surety of the whole covenant, and every condition in it, take it in the largest sense; and this of all, both on God’s part, and on ours. For us he undertook to God to work all our works, and undergo all our punishments; to pay our debts for us, and to work in us all that God required should be done by us, in the covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Set Forth</cite>, (1642; Edinburgh: Banner of Truth, 2015), pp 65-66.</span></figcaption>

</figure><figure class="quote" id="q-016b0f6c72" data-kw="">
<blockquote><p>Remember and consider what the Lord says in this case, ‘My thoughts are not your thoughts;’ (Isa. 55:7) He can pardon abundantly. The very holiness of God inclines Him to mercy, as man’s wickedness inclines him to cruelty: The tender mercies of the wicked are cruel. The Devil, who is the greatest of sinners, is disposed to the greatest revenge and cruelty: he would revenge himself on God if he could; and therefore he belies God to man, as well as he does man to God… There is no such thing in the Devil as the least pity towards any sinner. But God’s holiness disposes Him to pity poor sinners, when their souls are in trouble for sin. Thus says the high and lofty One that inhabits eternity, whose Name is Holy: ‘I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite one.’ (Isa. 57:15)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations upon our Savior’s Parable of the Prodigal Son</cite>, … (London: Roycroft, 1678), ch. 27, pp. 253-54</span></figcaption>

/a></div>
</figure><figure class="quote" id="q-d1bc25edd6" data-kw="">
<blockquote><p>As the term God is more distinctly expressive of majesty, so the term ‘Father’ conveys the idea of clemency and benevolent disposition. It becomes us to contemplate both as existing in God, that his majesty may inspire us with fear and reverence, and that his fatherly love may secure our full confidence. Hence it is not without good reason that Paul has conjoined these two things… At the same time there will be no inconsistency in saying, that he contents himself with the single term, ‘Father’. Farther, as it is necessary that his incomparable grace should be expressed by the term ‘Father’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, 1:12</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As the term God is more distinctly expressive of majesty, so the term ‘Father’ conveys the idea of clemency and benevolent disposition. It becomes us to contemplate both as existing in God, that his majesty may inspire us with fear and reverence, and that his fatherly love may secure our full confidence. Hence it is not without good reason that Paul has conjoined these two things… At the same time there will be no inconsistency in saying, that he contents himself with the single term, ‘Father’. Farther, as it is necessary that his incomparable grace should be expressed by the term ‘Father’…”

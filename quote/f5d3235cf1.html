<blockquote><p>II. Although, in relation to the foreknowledge and decree of God, the first cause, all things come to pass immutably and infallibly:[h] yet, by the same providence, he ordereth them to fall out, according to the nature of second causes, either necessarily, freely, or contingently.[i] [h] Acts 2:23. [i] Gen. 8:22. Jer. 31:35. Exod. 21:13 with Deut. 19:5. 1 Kings 22:28,34. Isa. 10:6,7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, 5.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcd03ed59b" data-kw="">
<blockquote><p>Q. 112. What is required in the third commandment? A. The third commandment requires, That the name of God, his titles, attributes, ordinances, the word, sacraments, prayer, oaths, vows, lots,[r] his works, and whatsoever else there is whereby he makes himself known, be holily and reverently used in thought,[t] meditation,[v] word,[w] and writing;[x] by an holy profession,[y] and answerable conversation,[z] to the glory of God,[a] and the good of ourselves,[b] and others.[c] … [r] Acts 1:24,26. [s] Job 36:24. [t] Mal. 3:16. [v] Ps. 8. [w] Col. 3:17. Ps. 105:2,5. [x] Ps. 102:18. [y] 1 Pet. 3:15. Micah 4:5. [z] Phil. 1:27. [a] 1 Cor. 10:31. [b] Jer. 32:39. [c] 1 Pet. 2:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-59fd7dbf92" data-kw="">
<blockquote><p>It is farther observed in this Answer [of the Larger Catechism], that men take the name of God in vain by sinful lots. This subject, however, needs explanation. Let it be considered, then, that when lots were an ordinance, by which God in an extraordinary manner determined things which were before unknown, they being an instituted means of appealing to Him for that end, as in the case of Achan and others, were not to be used in a common way; for to have used them so would have been a profaning of a sacred institution. But as this extraordinary ordinance has now ceased, it does not seem unlawful, so as to be an instance of profaneness to make use of lots in civil matters, provided we do not consider them as an ordinance which God has appointed, in which we think we have ground to expect his immediate interposition and to depend upon it as if it were a divine oracle. In this view it would be unlawful, at present, to use lots in any respect whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (d. 1734; NY: Robert Carter, 1855), vol. 2, p. 340 Ridgley (c. 1667–1734) was an English dissetning minister and here wrote the first commentary on Westminster’s Larger Catechism.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><figure class="quote" id="q-f92399d50e" data-kw="against mental reservations">
<blockquote><p>Whether it is lawful to use ambiguous equivocations and mental reservations in oaths. We deny against the papists and especially the Jesuits. We do not speak of the rhetorical use of equivocations, nor of the logical use which often obtains in disputations. Rather we speak of the theological and moral use in giving testimony and in oaths, where truth and sincerity are required.</p></blockquote>

</figure><figure class="quote" id="q-7ca521123f" data-kw="">
<blockquote><p>Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations Divine &amp; Moral</cite>, … (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’, pp. 253-54</span></figcaption>

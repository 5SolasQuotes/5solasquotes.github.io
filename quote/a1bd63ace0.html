<main class="wrap"><figure class="quote" id="q-a1bd63ace0" data-kw="judicial equity abrogation">
<blockquote><p>In that law various ends must be distinguished. For inasmuch as it was a distinction of the Jewish state from the Gentiles and a type of the kingdom of Christ, it is simply abrogated because there is no longer any distinction between the Jews and the Gentiles in Christ (Gal. 3:28; Eph. 2:14). As the Jewish state and polity has been destroyed, so there is no need of a type to adumbrate the future kingdom of Christ, since it has already come. But as to the good order or form of government of the people of God, those things which are of common and perpetual equity remain and must still be observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.26.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d867ceb0c2" data-kw="">
<blockquote><p>The law was once our foe when it came to our justification. But now the law is our friend when it comes to our sanctification.</p></blockquote>

</figure><figure class="quote" id="q-c2ea72c458" data-kw="">
<blockquote><p>When we pursue worldly wealth or worldly reputation with more vehemence than the riches of grace or the favor of God; when we have a foolish imagination that our happiness consists in them, we prefer earth before heaven, broken cisterns that can hold no water before an ever-springing fountain of glory and bliss, and, as though there were a defect in God, cannot be content with him as our portion without an addition of something inferior to him; when we make it our hopes to say to the wedge, “You are my confidence,” and rejoice more because it is great and because our hand has gotten much than in the privilege of communion with God and the promise of an everlasting fruition of him (Job 31:24–25)—this is so gross that Job joins it with the idolatry of the sun and moon.… And the apostle, when he mentions covetousness or covetous men, passes it not over without the title of idolatry to the vice and idolater to the person (Col. 3:5), in that it is a preferring of clay and dirt as an end more desirable than the original of all goodness, in regard of affection and dependence.</p></blockquote>

</figure><figure class="quote" id="q-56cfa7cd20" data-kw="Holiness">
<blockquote><p>Since the precept about not coveting is general, it ought to be extended to all depraved and inordinate concupiscence, original and habitual as well as actual—whether this is determinate and voluntary or still indeterminate and only titillating. This is true in order that the perfect purity and holiness of the lawgiver may be noted (which will suffer not even the smallest taint of depraved concupiscence in man, but demands righteousness and holiness of every kind).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.21.3</span></figcaption>

</figure><figure class="quote" id="q-ffaa63822b" data-kw="civil pedagogical conviction restraint">
<blockquote><p>In the destitute state of sin, the use of the law cannot be “justification” because it was weak in the flesh. It is not said to have been given for life, but “because of transgressions” (Gal. 3:19). Still there is a threefold use of the law. (a) For conviction, when it brings man to a knowledge of sin and convinces him of his guilt—“by the law is the knowledge of sin” (Rom. 3:20). Thus it is like a mirror in which we see our blemishes. (b) For restraint, restraining and checking men by its commands and threatenings, so that they who feel no regard for justice and rectitude unless compelled (while they hear its direful sanctions) may be restrained at least by the fear of punishment. In this respect, Paul says “the law is not made for a righteous man, but for lawless and disobedient, for the ungodly and for sinners” (1 Tim. 1:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-af5c7cc37e" data-kw="">
<blockquote><p>The carnal man, who does not know God due to his innate ignorance, and consequently has no understanding regarding the intimate and essential relationship between God’s holy and glorious attributes, separates these attributes one from the other. He subscribes to some of God’s attributes while rejecting others, and in so doing the carnal and natural man subscribes to a God of his own liking who conforms to his foolish imagination.

He subscribes to a God who is only gracious, compassionate, merciful, and longsuffering, but who is not at all holy, truthful, just, etc., and thereby he constructs a God according to his own liking and will. Of such a God, the carnal man has nothing or little to fear, for He is only merciful and gracious, and He very readily forgives sin. This gives a man all the latitude he desires, so that he can live and conduct himself according to the desires of his heart. Oh, wretched ignorance of God! How many a sinner, traversing upon this pathway, will perish eternally!

If, however, we desire to lend an ear to good teaching and instruction, the instructor will provide this for us, saying that God is indeed merciful, but also just. Both these attributes, justice and mercy, are inseparably united in God’s being, and may therefore in no wise be separated. If we separate them, we then deny who God is, and we fabricate a worthless idol. In the Holy Scriptures, God is never set before us in any way but as a God who is both just and merciful.

Nearly every page of the Bible teaches this. Listen only to one passage, Exodus 34:6–7, where God declares His glory: “The LORD, the LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear the guilty; visiting the iniquity of the fathers upon the children, and upon the children’s children, unto the third and to the fourth generation.”

We are not to think of God in any other way than the description Moses here gives of Him: He is abundant in grace, longsuffering, and mercy, but He is also a God who will by no means clear the guilty, but will always severely punish sin both temporally and eternally. Thus, God’s mercy cannot be in conflict with His holiness and justice, nor can it function in such a fashion that it would eradicate or in any way be detrimental to His holiness and justice. Rather, they must coexist in God in a most intimate manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 54.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee337ad3d7" data-kw="">
<blockquote><p>What is God’s simplicity? That attribute of God whereby He is free of all composition and distinction. God is free: a) Of logical composition; in Him there is no distinction between genus and species. b) Of natural composition; in Him there is no distinction between substance and form. c) Of supernatural composition; in Him there is no distinction between slumbering capacity and action. Proof texts: 1 John 1:5; 4:8; Amos 4:2; 6:8. The Socinians and Vossius deny this attribute in order better to escape the Trinity, that is, the oneness in being of the three Persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. and ed. Richard B. Gaffin, Jr. (Bellingham: Lexham Press, 2020), 19.</span></figcaption>

</figure><figure class="quote" id="q-f732cb3bef" data-kw="">
<blockquote><p>The doctrine of divine simplicity has fallen on hard times in Reformed circles, which is largely owing to the lack of emphasis placed on this subject in the late 19th and early 20th centuries. One theologian who continued to hold the line on the subject was the Dutch-American theologian, Herman Hoeksema.

In accordance with the Thomistic-Reformed position on divine simplicity, he reminded us that the divine attributes were identical with the simple divine essence, and so identical with one another:

His virtues are … identical with that Essence, so are all His virtues one in Him. For even though we do not and cannot comprehend this simple divine Essence … this does not alter the fact that all God’s virtues are one in Him. Hence, His righteousness is His mercy, His holiness is His grace, His truth is His love. And therefore, this eternal Being, this independent, simple Essence that is called God is also the Immutable, in Whom there is no variableness, neither shadow of turning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-hoeksema.html">Herman Hoeksema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, (Grand Rapids: Reformed Free Publishing Association, 1966), p. 36.</span></figcaption>

</figure><figure class="quote" id="q-1d38054c31" data-kw="">
<blockquote><p>Now Christian theology has always been more or less conscious of this calling. On the whole, its teaching has been that God is “simple,” that is, sublimely free from all composition, and that therefore one cannot make any real [i.e., ontological] distinction between his being and his attributes. Each attribute is identical with God’s being: he is what he possesses. In speaking of creatures we make all sorts of distinctions between what they are and what they have. A person, for example, is still human even though he or she has lost the image of God and has become a sinner. But in God all his attributes are identical with his being. God is light through and through; he is all mind, all wisdom, all logos, all spirit, and so forth. In God “to be is the same as to be wise, which is the same as to be good, which is the same as to be powerful. One and the same thing is stated whether it be said that God is eternal or immortal or good or just.” Whatever God is, he is that completely and simultaneously. “God has no properties but is pure essence. God’s properties are really the same as his essence: they neither differ from his essence nor do they differ materially from each other.”68 68. Augustine, The Trinity, VI, 7; John of Damascus, The Orthodox Faith, I, 9; T. Aquinas, Summa theol., I, qu. 2, art. 3; H. Heppe, Dogmatik der evangelisch-reformierten Kirche, 42, 51–53; H. F. F. Schmid, Doctrinal Theology of the Evangelical Lutheran Church, 122.</p></blockquote>

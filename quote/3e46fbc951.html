<main class="wrap"><figure class="quote" id="q-3e46fbc951" data-kw="">
<blockquote><p>The first trial of the faith of the new converts was the definition of the dogma of the Immaculate Conception, in 1852, when a doctrine was declared to be the universal ancient tradition of the Church, on which eminent divines had notoriously held different opinions, so much so, that this diversity had been accounted for by Bishop Milner and other controversialists by the assertion that neither Scripture nor tradition contained anything on the subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/immaculate-conception.html">Immaculate conception</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-31e2552aa2" data-kw="">
<blockquote><p>We by no means think or teach that the relics of the saints should be held in contempt, or treated in an irreverent and irreligious manner, but that they should be given that place, and be held in that regard, which the testimonies of Scripture we have quoted show. It does not follow from this, however, that we should gather from the cogitations of human reason, or learn from the examples of the heathen or of any people, or that everyone ought to figure out for himself, with what veneration the relics of the saints are to be honored; but the same Scripture which teaches that the relics of the saints are to be considered precious also shows the mode and manner of their true veneration.</p></blockquote>

</figure><figure class="quote" id="q-eb60913018" data-kw="Contentment">
<blockquote><p>Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Baptist Catechism</cite>, Q. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/second-table-commandments-5-10.html">Second Table (Commandments 5-10)</a> › <a href="../topics/the-law-of-god/second-table-commandments-5-10/covetousness.html">Covetousness</a></span><span class="t"><a href="../topics/the-christian-life/patience-and-contentment.html">Patience and Contentment</a> › <a href="../topics/the-christian-life/patience-and-contentment/contentment.html">Contentment</a></span></div>
<div class="actions"><button class="copy" data-copy="“Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).”

— Benjamin Keach, The Baptist Catechism, Q. 86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+86.+What+is+forbidden+in+the+tenth+commandment%3F+A.+The+tenth+commandment+forbids+all+discontentment+with+our+own+estate+%281+Kings+21%3A4%3B+Est.+5%3A13%3B+1+Cor.+10%3A10%29%2C+envying+or+grieving+at+the+good+of+our+neighbor+%28Gal.+5%3A26%3B+James+3%3A14%2C+16%29%2C+and+all+inordinate+motions+and+affections+to+anything+that+is+his+%28Rom.+7%3A7%E2%80%938%3B+13%3A9%3B+Deut.+5%3A21%29.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Keach%2C+The+Baptist+Catechism%2C+Q.+86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb60913018.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb60913018.html">Permalink</a><a class="src" href="https://founders.org/library/the-baptist-catechism/" rel="noopener" target="_blank">Read it online · Founders Ministries</a></div>
</figure><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-20d92c6b49" data-kw="">
<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

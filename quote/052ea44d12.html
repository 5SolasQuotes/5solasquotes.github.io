<main class="wrap"><figure class="quote" id="q-052ea44d12" data-kw="">
<blockquote><p>Now, since Christ confers upon us, and we obtain by faith, both free reconciliation and newness of life, reason and order require that I should here begin to treat of both. The shortest transition, however, will be from faith to repentance; for repentance being properly understood it will better appear how a man is justified freely by faith alone, and yet that holiness of life, real holiness, as it is called, is inseparable from the free imputation of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a> › <a href="../topics/repentance-and-conversion/repentance-and-faith/how-they-relate.html">How they relate</a></span><span class="t"><a href="../topics/justification/justification-and-sanctification-distinguished.html">Justification and Sanctification Distinguished</a> › <a href="../topics/justification/justification-and-sanctification-distinguished/distinguished-but-inseparable.html">Distinguished but inseparable</a></span></div>

</figure><figure class="quote" id="q-e4653bc431" data-kw="">
<blockquote><p>Scripture, however, says absolutely nothing to the effect that we either should or could make satisfaction to God for our sins in some part either by our works or by our sufferings. It does not say that when the priest in absolution looses and remits sin he should impose penalties as punishment and satisfaction for sins. It says nothing about the punishments of purgatory; it has nothing about a treasury of works of supererogation; it teaches nothing about a key, delivered solely to the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 4, p. 168</span></figcaption>

</figure><figure class="quote" id="q-df9ae49be8" data-kw="">
<blockquote><p>Does the Roman Church possess a treasury of satisfactions, which the Pope and Bishops may dispense according to their power and will in Indulgences and Jubilees, for the forgiveness and absolution of sins in various and complete manners to the living and the dead? Neg.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on the Errors of the Papists</cite>, p. 4, Thesis XVII</span></figcaption>

</figure><figure class="quote" id="q-d5ed6e136d" data-kw="">
<blockquote><p>To assume a power to forgive sin, and absolve from it, is the height of antichristianism; it is with respect to this that antichrist is said to sit in the temple of God, &quot;showing himself that he is God&quot;, by taking that to himself which belongs to God only; namely, to forgive sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, on repentance/absolution, p. 980</span></figcaption>

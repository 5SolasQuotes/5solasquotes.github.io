<blockquote><p>Thus, in the first place, the certainty of the salvation of believers is in a remarkable manner bound up in Holy Scripture, with this doctrine. They for whom Christ died cannot perish; and it is his dying for them that makes their perishing an impossibility. This is very clearly brought out in the tenth chapter of John’s Gospel. There it is explicitly declared by Christ himself that he was to “lay down his life for the sheep” (ver. 15); and that this declaration is exclusive — implying that he lays down his life for them alone, without any reference to the world at large — is to be inferred from the connection in which he introduces it. He is enlarging on the security which his people have in him; and it is as the proof of this — the only tangible proof which he alleges — that he brings in the appeal to the fact of his dying for them.

But this would be no proof at all, if others besides his sheep were interested in his death; or, which is the same thing, if any for whom he laid down his life might, after all, perish. Hence, in a subsequent part of the chapter (ver. 25-30), it is expressly given as the reason why some believe not, and therefore are lost, that they are not of his sheep, for whom he lays down his life; and, on the other hand, the safety of believers, or the security that they shall never perish, is made to depend on their being his sheep, to whom he gives eternal life (ver. 28), and whom the Father hath given to him (ver. 29); the former of these gifts being the consequence, and the latter the cause, of his laying clown his life for them, and for them alone.

He lays down his life for those whom the Father hath given him; and to those for whom he lays down his life, he giveth eternal life; and this is that threefold cord, not to be quickly broken, which fastens believers to the Rock of Ages; — the Father’s gift of a people to the Son to be his sheep; the Son’s dying for his sheep thus given to him by the Father; and his giving to them, as the fruit of his dying for them, eternal life. But unless all the three lines in this cord be of equal extent, it cannot hold fast — it must yield, or stretch, or break; nor, on any supposition of a wider purpose in the death of the Son than in the gift which the Father makes to him of a chosen number to be his sheep, is there any value in the assurance with which the Lord rivets the last link of the chain: “I and my Father are one.” (Ver. 30.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross of Christ; The Call of God; Saving Faith: An Inquiry into the Completeness and Extent of the Atonement. With especial reference to the Universal Offer of the Gospel, and the Universal Obligation to Believe</cite>, (2nd edn, Edinburgh: John Johnstone, 1845), xxxii-iv.</span></figcaption>

<blockquote><p>. . . how Christ was a curse, or accursed, who is the fountain of blessedness? Answer. He is not so by nature. For He is the natural Son of God. Not by His own fault, for He is the unspotted lamb of God. But by voluntary dispensation, and therefore Paul says, “He was made a curse.” And He was made a curse, first, because He was set apart in the eternal counsel of the Father, Son, and Holy Ghost to be our redeemer and consequently to be a curse. In this regard, the Father is said to have “sealed” Him (John 6:27), and He is said again to be “preordained before all worlds” (1 Peter 1:20) and given “according to the counsel and foreknowledge of God” (Acts 2:23). Secondly, He was made a curse in that He was in time consecrated to be our mediator and so a curse. And this consecration was first in His baptism, in which He put upon Him our guilt, as we put off the same in ours; and, secondly, on the cross and passion, in which He took unto Him the punishment of our sin. And thus was He made a curse. It may be objected that He is the Son of God, and therefore no curse. Answer. Christ must be considered as the Son of God, and again as our pledge and surety (Heb. 7:22). In the first respect He was not accursed, but in the second.</p></blockquote>

<blockquote><p>The first right which God gave to man to eat flesh, was after the promise, and after that Beasts were consecrated to be sacrificed as Types of Christ, and of his Death. Now these sacrifices of Beasts did shew the nature of the Covenant, and the manner of man’s reconciliation; choosing of clean and harmless Beasts, showed that Christ should be pure and holy in himself, like a Lamb without spot; The consecration of them showed that Christ should in his conception be sanctified, and take our nature, and our sins upon him, that he might be our Redeemer, and our Sacrifice.

The killing of the Beasts, and the burning of the fat, and some parts of them, signified the manner of Christ’s reconciling of us, and working our peace, even by his Death, and passing through the fire of God’s wrath. God’s clothing of Adam and his wife with their skins, signified that Man’s sin and shame is covered with Christ’s satisfaction, and the faithful are to be clothed with the robe of his Righteousness. The liberty which God gave man to eat flesh of Beasts, which he might not before sacrifices were ordained, showeth that we gain more by Christ, than we lost in Adam. This was the first making and revealing of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The manifold wisdom of God In the divers dispensation of grace by Jesus Christ, In the Old New Testament. In the covenant of faith. In the covenant of works. Their agreement and difference</cite>, (London: John Bartlet, 1641), pp 60-61.</span></figcaption>

<blockquote><p>That Christ, by his obedience, truly purchased and merited grace for us with the Father, is accurately inferred from several passages of Scripture. I take it for granted, that if Christ satisfied for our sins, if he paid the penalty due by us, if he appeased God by his obedience; in fine, if he suffered the just for the unjust, salvation was obtained for us by his righteousness; which is just equivalent to meriting.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-81bd11dc55" data-kw="">
<blockquote><p>…our Saviour has obtained at the hands of his Father reconciliation, and forgiveness of sins, not for the reprobate, but elect only, and not for them neither, before they be truly regenerated, and implanted into Himself… That impetration, whereof the Arminians speak, I hold to be a fruit, not of his satisfaction, but intercession; and seeing I have learned from Christ’s own mouth, ‘I pray not for the reprobate world’: I must needs esteem it a great folly to imagine that He has impetrated [obtained] reconciliation and remission of sins for that world. I agree therefore thus far with Mr. [William] Ames in his dispute against Grevinchovius, that application and impetration, in this matter we have in hand, are of equal extent; and, that forgiveness of sins is not by our Saviour impetrated for any unto whom the merit of his death is not applied in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71</cite>, p. 564</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d45da0a230" data-kw="">
<blockquote><p>Especially since Robert Godfrey’s dissertation on the British delegation’s moderating influence at the Synod of Dordt, most scholars have accepted the fact that the Second Main Doctrine at Dordt responding to the Remonstrants’ Second Article [on the Atonement] was written in such a way as to make room for English hypothetical universalism. To be sure, it did not positively countenance such a view, but it allowed someone like Davenant to subscribe to the Canons. We know that all the British delegates signed the Canons and publicly supported their publication. Ten years after the Synod, Davenant confessed, ‘As for the Synod of Dort, wee may bouldly affirm, that there is no one of the 5 points there determined, but iumps with the doctrine w[hi]ch our Professors in the Chair, &amp; our Preachers in the pulpit have commonly taught with the approbation of our church.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-lynch.html">Michael Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy Pre (Oxford Univ. Press, 2021)</cite>, p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-19e85ccd5a" data-kw="">
<blockquote><p>…that I might clear the truth, that is (as they call it) the Calvinists’ doctrine, of those reproaches which are cast upon it: and that I might mitigate and appease the minds of some of our brethren, which have been more offended at it then was fit. For I do willingly acknowledge and teach universal redemption and grace, so far as it is possible by the word. My mind is to pursue after peace, which is departing from us: and I would have all men so interpret my fact. I allege the testimonies of the ancient everywhere… I hold it necessary, that there should be had an example of consent and concord in that doctrine which is expounded in holy books, and is propagated to all posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace (d. 1602: London: Welby &amp; Clarke, 1606) | ‘To the Reader’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-d33ddd19d4" data-kw="">
<blockquote><p>Amyraut, however, builds on Calvin’s argument and, indeed, claims to be interpreting and clarifying it by arguing two mercies and two wills in God where Calvin did not; in fact where Calvin had specifically stated that the will of God is one and simple, albeit with distinctions that can be observed in its revelation. Where Calvin resolved the issue of the universal call and particular election by simply declaring a resolution in the fact that, as promised, the repentant are saved, Amyraut indicated a double divine intentionality… Even if Amyraut had added, as he would do at the Synod of Alençon, that his language of two decrees was by rational distinction and intended “without any succession of Thought, or Order of Priority and Posteriority” in God, his exegesis still would differ from Calvin’s in its postulation of two divine mercies and two intentions. The exegesis of the particular text, therefore, does not fully support those who appeal to it in order to interpret Amyraut as a precise follower of Calvin… Amyraut offered his own conclusion, modifying and supplementing Calvin’s argument with a concept of two wills in God—a scholastic distinction not found in Calvin’s reading of the text and related, probably, to Amyraut’s own training under John Cameron.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Tale of Two Wills: Calvin &amp; Amyraut on Ezekiel 18:23’ in Calvin Theological Journal 44 (2009): 211-25</cite>, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

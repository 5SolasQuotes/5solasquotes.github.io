<main class="wrap"><figure class="quote" id="q-941cd4088a" data-kw="">
<blockquote><p>To use a mean in an act of worship which God has neither by the light of nature directed, nor in his Word prescribed (no natural necessity compelling us so to do) is sinful: But for us, or any of us to whom God has given the gift of prayer, ordinarily in prayer to perform our ministerial acts by the prescribed forms of others read or recited, were for us (no natural necessity compelling) in acts of worship to use means neither of God directed by the light of nature, nor by Him in his Word prescribed; Therefore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 4 in A Reasonable Account why some Pious, Nonconforming Ministers in England Judge it Sinful for them to perform their ministerial acts, in publick, solemn prayer by the prescribed forms of others… (London: 1679), pp. 71-92, p. 71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-a4670b4bbd" data-kw="">
<blockquote><p>…the last place, 2 Chron. 29, out of which no more can be drawn but that the people worshipped whiles the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, (though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4; p. 72</span></figcaption>

</figure><figure class="quote" id="q-74390f58c1" data-kw="">
<blockquote><p>§5. What things of or belonging to divine worship, may be devised or instituted by man. The things set down under the former head as forbidden, are such new ordinances of worship as are coordinate with the divine ordinances, and are in proper sense additions, pretending, or in themselves expressing the same nature, reason, end and use that the divine ordinances have, and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same. And they are not proper additions, because they are not of the same nature and use: and these are unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684), pt. 3, ch. 5, pp. 213-14</span></figcaption>

</figure><figure class="quote" id="q-00ec4eb6e3" data-kw="">
<blockquote><p>But as the said Jews, I say, did then refuse such waters, so the said people refusing both the said pure and simple worship of God and true Church discipline, and preferring to it that vain, frothy, pompous, human will-worship, or liturgy of Rome, somewhat refined I confess, but yet the very same in substance, therefore did the Lord bring upon them that proud prelatical, hierarchical Church government, by the means of it, the which has at length broken into England, especially, and has so overflowed and passed through it, that it is come, not only to the neck, but even to the very top of the cheeks and ears of some of the best servants of God…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-acac4f9207" data-kw="">
<blockquote><p>I. I was born and bred of parents piously affected, but of no such knowledge or acquaintance as might engage them in any controversies, or disaffect them to the present government of the Church, or cause them to scruple conformity to its doctrine, worship or discipline: In this way I was bred myself, but taught by my parents and God Himself to make conscience of sin and to fear God, and to discern between the godly and the notoriously wicked: For which my parents and I were commonly derided as puritans, the spirit of the vulgar being commonly then fired with hatred and scorn of serious godliness, and using that name as their instrument of reproach, which was first forged against the nonconformists only; And the clergy where I lived, being mostly only readers of the liturgy, and some others that rather countenanced than reproved this course, I soon confined my reverence to a very few among them that were learned and godly (but conformists), and for going out of my parish to hear them, my reproach increased: About eighteen or nineteen years of age I fell acquainted with some persons, half conformists and half nonconformists, who for fear of severities against private meetings, met with great secresy only to repeat the public sermons, and pray, and by pious conference edify each other. Their spirits and practice was so savoury to me, that it kindled in me a distaste of the prelates as persecutors, who troubled and ruined such persons, while ignorant drunkards and worldlings were tolerated in so many churches, yea, and countenanced for crying down such persons, and crying up bishops, liturgie and conformity: Before I was aware, my affections began to solicit my understanding to judge of the things and causes by the persons (where the difference was very great). But yet my first teachers kept my judgement for conformity as lawful, though not desirable had we liberty, till I was ordained. But soon after a new acquaintance provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgy and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640, the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacie (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was that I settled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government. My genius was inquisitive, and earnestly desirous to know the truth: my helps for piety were greater than my helps for learning, of which I had not much besides books: sickness helped my seriousness, keeping me still in expectation of death. All my reverenced acquaintances (save one) cried down Arminianism as the Pelagian heresy, and the enemy of grace: I quickly plunged myself into the study of Dr. [William] Twisse and [William] Amesius, and [John] Camero, and [William] Pemble, and others on that subject: By which my mind was settled in prejudice against Arminianism, without a clear understanding of the case: whereupon I felt presently in my mind a judgment of those that were for Arminianism, as bad or dangerous adversaries to the Church; and specially of the then ruling bishops: which yet I think I had not-entertained, had I not taken them withal for the great persecutors of godly able ministers, and serious Christians, not only for ceremonies, but for holy practices of life. Being under these apprehensions, when the wars began [early-1640’s], though the cause itself lay in civil controversies between king and parliament, yet the thoughts that the Church and godliness itself was deeply in danger by persecution and Arminianism did much more to bias me to the parliament’s side than the civil interest (which at the heart I little regarded)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, ... (London: White, 1675), Preface</span></figcaption>

<blockquote><p>…the Rejoinder [of an opponent] brings abundance of instances [for human ceremonies in worship though they had been idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy [which are a form of natural worship]. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>

+to+dance+a+certain+round%2C+or+galliard+after+every+fiddle%3F+It+is+natural+for+a+child+to+signify+his+discerning+of+those+that+it+is+used+to+by+some+such+sound+as+dad+and+mam%2C+but+not+to+make+verses+in+a+certain+number.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+A+Fresh+Suit+Against+Human+Ceremonies+in+God%E2%80%99s+Worship%E2%80%A6+%281633%29%2C+pp.+495-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F765ea3c2b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/765ea3c2b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-dance-and-drama-in-worship/#:~:text=the%20Rejoinder%20%5Bof%20an%20opponent%5D%20brings,make%20verses%20in%20a%20certain%20number&amp;text=the%20Rejoinder%20%5Bof%20an%20opponent%5D%20brings%20abundance%20of&amp;text=not%20to%20make%20verses%20in%20a%20certain%20number" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘Yea but’ (say they) ‘our significant ceremonies were taken from idolaters and limbs of [the Roman] Antichrist who have abused them.’ Were this true, yet take the dross from the silver and make a vessel for the finer (Prov. 25:4); but it is false. Though they have had such as ours and have still, yet ours are our own and were never theirs in special. Fire and water are contrary, yet they agree in their kind: they are both elements. So ours are ceremonies and so are theirs, but otherwise they differ as fire and water; they scorn therefore ours and we deride theirs. We read of sacrifices offered to devils, yet some of this was sold in shambles and some the heathens made feasts of [such]. It was all the same flesh in kind, but not in use. The Christians did damnably if they went to it when it was sacrificed, yea and if they went to their idol feasts when they blessed an idol, it was idolatry; but if they bought part of that flesh in the shambles and ate it, or went to their private feasts when they ate of it (for aught they knew) without reference to the idol, then, says Paul, ‘Eat, making no question for conscience sake.’ So say we of our cross, surplice, kneeling: they were ordinances before idolaters abused them. If they take them and bless an idol with them, be it upon their own pates; but if we be invited to them in a better use (and not know, nor have just cause to suspect any lurking idolatry), why should we make so many needless questions about the use of them? Put [the] case, such as they are pertained to idolaters. So did Goliath’s sword, yet David laid it up in a holy place for better use. So did bowing belong to Baal, prostrating the whole body to idols, kissing to the calves, kissing the hand to the host of heaven, lifting up the eyes, stretching forth both hands, shouting for joy, sitting or lying along upon the ground or on a carpet to idols; yet all these we may use in the worship of the true God. So for our ceremonies, such as they are pertained to idolaters, but were not idolatrous of themselves. The cross was used as a sign of profession before idolatry prevailed. The white garment was ordained as a cover-sloven in the poverty of the Church; kneeling was used as an act of reverence before the breaden god was hatched. And may not we lawfully use them now, to show that we are in communion and fellowship with that blessed and persecuted Church, without such noises and schisms?</p></blockquote>

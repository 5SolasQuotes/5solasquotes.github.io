<main class="wrap"><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>

<blockquote><p>23. In the words just recited, observe these four assertions of Cyril of Alexandria: 1. The flesh of Christ in the participants of the Eucharist is life-giving. (For those who approach unworthily do not partake of the flesh of Christ.) 2. This occurs not by the virtue of the flesh, as it is flesh, but by the virtue of the Deity with which this flesh is united in hypostasis. And the preservation of us and the wondrous effects related to the flesh are to be attributed to the glory of the Deity. 3. For the accomplishment of these things, the bodily presence of the flesh is neither required nor desired. 4. Christ, by the power of His Deity, accomplishes these things, being present with us through His ineffable Deity even though He has departed from us in the flesh. 24. Indeed, the power of Deity accomplishes that we can hold onto Him even when absent, by imitating faith in heaven. We partake of Him when absent by believing, as Augustine teaches. And even when absent in the flesh, He spiritually nourishes us with that same flesh, and His flesh becomes for us life-giving bread, as Cyril teaches here. For this spiritual nourishment is the operation of Deity and is not the least part of that preservation and those miraculous works, which Cyril says should be attributed not to the bodily presence of the flesh but to the glory of the Deity. Therefore, elsewhere, Cyril says the same: just as (he says) the root sends its quality to the branches, so the only-begotten Son of God, by giving the Spirit, bestows the affinity of the Father and His own nature (so to speak) on the saints connected to Him by faith and sanctity, nourishing them with piety and all kinds of virtue. He calls the Father the Farmer so that this might not seem to be the work of the Son alone, but rather a marvelous work of the entire Trinity. Therefore, He nourishes us with piety and faith through the Son in the Spirit, and the Farmer does the work, looking after and nurturing, and reducing everything to virtue, also through the Son in the Spirit. In my judgment, we understand this more correctly. Nor is this from the Father, nor that from the Son, nor both separated from the Spirit. For all things are from the Father through the Son in the Spirit. Neither will the Father be separated from cultivating us, nor will the Son be estranged from His care. Therefore, Christ holds the place of the vine, and we, hanging from it, draw the power and grace of the Spirit for our nourishment and spiritual fruit. This is what Cyril says in book 10 of the Gospel of John, chapter 13. Namely, as the Lord speaks in John, chapter 6, ‘It is the Spirit that gives life; the flesh is of no avail.’ The flesh of Christ is not life-giving from itself but by the power of the Deity dwelling corporeally within it. It is substantially life, and from itself, it gives life. He gave to the body in which He dwells the power of giving life, not by the confusion of the two natures in Christ or the operation of natural properties but by the hypostatic union of natures. So that the flesh of the Word becomes life-giving, for it is the flesh of God; and being spiritually united to this flesh, we are connected to God, and thus, being already connected to Him, we are infallibly given life: as Cyril teaches in book 4 of his Commentary on the Gospel of John, chapter 14, and the following chapters until the end of chapter 25, and in book 1, chapter 21. And the operation of Deity is so powerful that it unites us to His flesh by its consenting will, nourishes us, and allows us to draw from His fullness. Therefore, for the salutary eating of the flesh of Christ, the bodily presence of the flesh is not required with the one partaking, as we explained a little earlier from the same Cyril. 25. However, ignorantly or dishonestly, Bellarmine (in Book 2, On the Eucharist, chapter 25) abuses certain words of Cyril, attributing to them a meaning entirely alien to Cyril’s own mind, as if they favored transubstantiation and the bodily eating of the flesh of Christ. He first cites certain words from a letter of Cyril to Nestorius, intending to convey that Cyril meant nothing other than that the flesh of Christ, of which we are participants in the mysteries, is not common flesh, the mere flesh of a man or a sanctified man (as Nestorius deliriously claimed), but the proper flesh of the Word Himself. Read that letter of Cyril that contains twelve anathemas, and you will find nothing else there, not even in those very words that Bellarmine excerpts. Having discussed this at length, he promises us clearer passages from Cyril and adduces some from Cyril’s books on the Gospel of John, from which he draws three arguments.</p></blockquote>

equired+with+the+one+partaking%2C+as+we+explained+a+little+earlier+from+the+same+Cyril.+25.+However%2C+ignorantly+or+dishonestly%2C+Bellarmine+%28in+Book+2%2C+On+the+Eucharist%2C+chapter+25%29+abuses+certain+words+of+Cyril%2C+attributing+to+them+a+meaning+entirely+alien+to+Cyril%E2%80%99s+own+mind%2C+as+if+they+favored+transubstantiation+and+the+bodily+eating+of+the+flesh+of+Christ.+He+first+cites+certain+words+from+a+letter+of+Cyril+to+Nestorius%2C+intending+to+convey+that+Cyril+meant+nothing+other+than+that+the+flesh+of+Christ%2C+of+which+we+are+participants+in+the+mysteries%2C+is+not+common+flesh%2C+the+mere+flesh+of+a+man+or+a+sanctified+man+%28as+Nestorius+deliriously+claimed%29%2C+but+the+proper+flesh+of+the+Word+Himself.+Read+that+letter+of+Cyril+that+contains+twelve+anathemas%2C+and+you+will+find+nothing+else+there%2C+not+even+in+those+very+words+that+Bellarmine+excerpts.+Having+discussed+this+at+length%2C+he+promises+us+clearer+passages+from+Cyril+and+adduces+some+from+Cyril%E2%80%99s+books+on+the+Gospel+of+John%2C+from+which+he+draws+three+arguments.%E2%80%9D%0A%0A%E2%80%94+John+Forbes%2C+Instructiones+Historico+Theologicae+%281645%3B+Geneva%3A+John+Pictetum%2C+1680%29%2C+pp.+590-91&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4e9c0078fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4e9c0078fc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=23.%20In%20the%20words%20just%20recited,from%20which%20he%20draws%20three%20arguments&amp;text=23.%20In%20the%20words%20just%20recited%2C%20observe%20these&amp;text=of%20John%2C%20from%20which%20he%20draws%20three%20arguments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0bce3d4602" data-kw="">
<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil112 (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>

<blockquote><p>I. When two commandments of the moral law are opposite in respect of use as we can not do them both at the same time: then the lesser commandment gives place to the greater and does not bind for that instant. Example 1. God commands one thing, and the magistrate commands the flat contrary: in this case which of these two commandments must be obeyed, ‘Honor God,’ or, ‘Honor the Magistrate’? The answer is, that the latter must give place to the former, and the former must only be obeyed. Acts 4:19, ‘Whether it be right in the sight of God to obey you rather than God judge ye.’ II. The 4th Commandment prescribes rest on the Sabbath day. Now it [falls?] out that at the same time [that] a whole town set on fire, and the Sixth Commandment requires our help in saving our neighbor’s life and goods. Now of these two commandments, which must be obeyed? For both cannot. The answer is that the Fourth Commandment at this time is to give place, and the Sixth Commandment alone binds the conscience: so as then (if need should require) a man might labor all the day without offence to God. Mt. 9:13, ‘I will have mercy and not sacrifice.’ And the rule must not be omitted that charity towards our neighbor is subordinate to the love of God, and therefore must give place to it. For this cause the commandment concerning charity must give place to the commandment concerning love to God: and when the case so falls out that we must either offend our neighbor or God, we must rather offend our neighbor than God.</p></blockquote>

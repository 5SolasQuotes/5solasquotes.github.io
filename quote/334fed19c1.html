<main class="wrap"><figure class="quote" id="q-334fed19c1" data-kw="">
<blockquote><p>From which memorable history there are these considerable observations naturally deducible. First, that Apostates from God’s true Worship to Idolatry and false Worship, are to be executed, slain, and put to death by the Judges and Civil Magistrate, by God’s own special Command. Secondly, that the Apostacy of God’s own people to Idolatry, and the Magistrates connivance thereat, is an immediate cause of provoking God’s wrath, and bringing down public plagues and other judgements upon that whole Nation or Kingdom wherein they are not punished.

Thirdly, that God’s own immediate punishing and cutting off Idolaters with a plague, is no argument nor excuse at all for the temporal Magistrates sparing or not punishing such with death (whose execution is here said to be &amp; styled God’s own act, since they are but his Ministers herein) but rather an argument to excite them to the more speedy exemplary punishing of them even with death itself: which answers and repels one grand objection against punishing Heretics, and Blasphemers with death, because God himself will punish them if they repent not, and we must wholly leave them to his judgement.

Fourthly, that the best and speediest course to remove God’s judgements brought upon a Nation for Idolatry, Apostacy, Heresy, or Blasphemy, is for the temporal Magistrates to execute speedy and exemplary capital punishments on those who are notoriously guilty of them; and that fasting and prayer without such exemplary executions upon the most eminent Malefactors in this kind, will never pacify God’s wrath, nor remove his judgements inflicted for these sins.

Fifthly, that the executing of capital punishments upon such, is an argument of true zeal to GOD: And therefore it seems strange to me, that those in this age, who pretend themselves the only Saints, Zealots, faithful ones, paramount all others by head and shoulders in grace and piety, should be so void of Christian zeal for God, as to plead, preach, write, and print against the corporal and capital Punishment or Apostates, Idolaters, Heretics, and Blasphemers by temporal Magistrates, and for a free Toleration of all Sects, Heresies, and Religions whatsoever, under the pretence of Liberty of Conscience:

Certainly this extreme want of holy zeal for God against Apostates, Idolaters, Heretics; Blasphemers, and pleading for their impunity, at least with capital Censures, argues them to be no real Saints, because they have no true love to, nor zeal for God, which would make them as forward to thrust their Javelins, or the sword of Justice through the Bowels of such transcendent offenders, as Phineas was to thrust his Javelin through Zimri and Cozbi, without any question or dispute.

Sixthly, that the exemplary capital punishing of such, is so far from being a persecution of the Saints, or against the Clemency of God under the Law or Gospel, that it is a most acceptable service to God, and procures a special Blessing upon the persons and posterities of those who are most zealous and active in this service, as appears by this example of Phineas, registered for his eternal honour and our future imitation and encouragement in this kind.</p></blockquote>

<blockquote><p>This offence was plagued with most sharp punishment even in the beginning almost, and as soon as the world was created. Pharao [sic], the king of Egypt, commanded Sara, Abraham’s wife, to be taken away and carried to his palace, that he might use her as his wife; thinking verily that she had been Abraham’s sister. But the scripture saith, “The Lord vexed Pharaoh and all his house with great plagues, because of Sara, Abraham’s wife.” Lo, here the king of Egypt is punished with grievous plagues for his adultery; and yet he knew not that Sara was Abraham’s wife: how great plagues therefore are prepared for the men that wittingly and willingly, without all shame, commit adultery! To Abimelech, king of the Philistines, the Lord doth say, “Lo, thou shalt die, because of the woman which thou hast taken away from her husband.” And yet this king also had taken away Sara, not knowing that she was Abraham’s wife. Joseph, being provoked to adultery by his master’s wife, doth simply say, “How should I do this great wickedness, and sin against God?” Every woth doth bear some weight: for adultery is an heinous sin. Whereupon in the book of Job we find these words of Job himself: “If mine heart have been deceived by a woman, or I have laid wait at my neighbour’s door; then let my wife be another man’s harlot, and let other men have to do with her. For this is a wickedness and sin that is worthy to be judged to death: yea, it is a fire that utterly should consume and root out all mine increase.” [Job 31] Job saith that he hath not only not committed adultery to defile another man’s wife. He confesseth that adultery is a sin, and so grievous an offence, that it doth deserve to have the adulterer’s wife to be defiled with adultery. He addeth that adultery is a fire that utterly consumeth and devoureth all things; and, lastly, that it is a sin to be judged, and punished with death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 410-11.</span></figcaption>

</figure><figure class="quote" id="q-2a4ea25045" data-kw="">
<blockquote><p>The General Assembly, soon after the Disruption, thought it necessary to embody the great principle for the sake of which the Church had resigned the emoluments of the State, in an additional question to be proposed to all office-bearers at the time of their ordination. The question is in these terms:—“Do you believe that the Lord Jesus Christ, as King and Head of the Church, has therein appointed a government in the hands of Church-officers, distinct from, and not subordinate in its own province to, civil government, and that the civil magistrate does not possess jurisdiction or authoritative control over the regulation of the affairs of Christ’s Church! and do you approve,” &amp;c.

Let the opening statement be observed carefully, “that the Lord Jesus Christ, as King and Head of the Church, has therein appointed a government in the hands of Church-officers, distinct from, and not subordinate in its own province to, civil government.” It is but a slight enlargement of the following words of the Confession of Faith:—“The Lord Jesus Christ, as King and Head of his Church, hath therein appointed a government in the hand of Church officers, distinct from the civil magistrate.”

First, that Christ is the only King and Head of the Church: second, that as such he has appointed a government of the Church in the hands of officers of her own, of ecclesiastical office-bearers; and, third, that this government in their hands, derived from Him, is wholly distinct from the State, or civil power, is subordinate to Him alone,—is not subordinate within its own province to the civil magistrate.</p></blockquote>

Let the opening statement be observed carefully, “that the Lord Jesus Christ, as King and Head of the Church, has therein appointed a government in the hands of Church-officers, distinct from, and not subordinate in its own province to, civil government.” It is but a slight enlargement of the following words of the Confession of Faith:—“The Lord Jesus Christ, as King and Head of his Church, hath therein appointed a government in the hand of Church officers, distinct from the civil magistrate.”

First, that Christ is the only King and Head of the Church: second, that as such he has appointed a government of the Church in the hands of officers of her own, of ecclesiastical office-bearers; and, third, that this government in their hands, derived from Him, is wholly distinct from the State, or civil power, is subordinate to Him alone,—is not subordinate within its own province to the civil magistrate.”

— Charles J. Brown, The Disruption Question Stated. Reprinted (with some additions) from the Free Church Record, at the request of the Free Presbytery of Edinburgh, (Edinburgh: T. Nelson and Sons, 1863), pp 3-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+General+Assembly%2C+soon+after+the+Disruption%2C+thought+it+necessary+to+embody+the+great+principle+for+the+sake+of+which+the+Church+had+resigned+the+emoluments+of+the+State%2C+in+an+additional+question+to+be+proposed+to+all+office-bearers+at+the+time+of+their+ordination.+The+question+is+in+these+terms%3A%E2%80%94%E2%80%9CDo+you+believe+that+the+Lord+Jesus+Christ%2C+as+King+and+Head+of+the+Church%2C+has+therein+appointed+a+government+in+the+hands+of+Church-officers%2C+distinct+from%2C+and+not+subordinate+in+its+own+province+to%2C+civil+government%2C+and+that+the+civil+magistrate+does+not+possess+jurisdiction+or+authoritative+control+over+the+regulation+of+the+affairs+of+Christ%E2%80%99s+Church%21+and+do+you+approve%2C%E2%80%9D+%26c.%0A%0ALet+the+opening+statement+be+observed+carefully%2C+%E2%80%9Cthat+the+Lord+Jesus+Christ%2C+as+King+and+Head+of+the+Church%2C+has+therein+appointed+a+government+in+the+hands+of+Church-officers%2C+distinct+from%2C+and+not+subordinate+in+its+own+province+to%2C+civil+government.%E2%80%9D+It+is+but+a+slight+enlargement+of+the+following+words+of+the+Confession+of+Faith%3A%E2%80%94%E2%80%9CThe+Lord+Jesus+Christ%2C+as+King+and+Head+of+his+Church%2C+hath+therein+appointed+a+government+in+the+hand+of+Church+officers%2C+distinct+from+the+civil+magistrate.%E2%80%9D%0A%0AFirst%2C+that+Christ+is+the+only+King+and+Head+of+the+Church%3A+second%2C+that+as+such+he+has+appointed+a+government+of+the+Church+in+the+hands+of+officers+of+her+own%2C+of+ecclesiastical+office-bearers%3B+and%2C+third%2C+that+this+government+in+their+hands%2C+derived+from+Him%2C+is+wholly+distinct+from+the+State%2C+or+civil+power%2C+is+subordinate+to+Him+alone%2C%E2%80%94is+not+subordinate+within+its+own+province+to+the+civil+magistrate.%E2%80%9D%0A%0A%E2%80%94+Charles+J.+Brown%2C+The+Disruption+Question+Stated.+Reprinted+%28with+some+additions%29+from+the+Free+Church+Record%2C+at+the+request+of+the+Free+Presbytery+of+Edinburgh%2C+%28Edinburgh%3A+T.+Nelson+and+Sons%2C+1863%29%2C+pp+3-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a4ea25045.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a4ea25045.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/29/charles-j-brown-on-disruption-principles/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Vers. 32. And the Spirits of the Prophets are subject to the Prophets.

Reason 3. Because the Spirits of the Prophets are to be examined and judged of by the other Prophets, who might afterwards give their opinions concerning those things which were heard, whether anyone hath seasonably interrupted another, and whether it were agreeable to the Word of God, which was delivered by him; and therefore there was no danger, if he that spoke before, should give place to him that modestly interrupted him, and so more might speak in their order.

When he refers to the Prophets, the judging of the Spirit, or the Doctrine which the Prophet utters by the Spirit, he does not exclude Spiritual men, i. e. the other Governors of the Church, who were skilful in spiritual knowledge and judgement, such as all ought to be in an Ecclesiastical Senate: For he commands these, vers. 37. together with the Prophets, or Ministers of the Word, that according to their Ecclesiastical authority, they acknowledge and defend their doctrine in the Church, that according thereunto they would judge and determine concerning those that were disorderly.</p></blockquote>

<blockquote><p>For will it be more difficult to get over any stop that the religion of Mahomet may lay in our inquirer’s way? Let a man seriously peruse the Alcoran [Koran], and if he has his senses about him, he cannot but there see the most pregnant evidences of the grossest, most scandalous and impudent imposture that ever was obtruded upon the world. Here he must expect no other evidence for what he is to believe but the bare assertion of one who was scandalously impious to that degree that his own followers know not how to apologise for him.

If you inquire for any other evidence, you are doomed by the Alcoran to everlasting ruin, and his slaves are ordered to destroy you. He forbids any inquiry into his religion or the grounds of it, and therefore you must either admit in bulk the entire bundle of fopperies, inconsistencies and shocking absurdities that are cast together in the Alcoran, without any trial, or reject all; and in this case, no wise man will find it hard to make a choice.</p></blockquote>

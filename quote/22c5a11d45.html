<main class="wrap"><figure class="quote" id="q-22c5a11d45" data-kw="">
<blockquote><p>Robert Buchanan, who later joined the Free Church of Scotland as a result of the Disruption of 1843, warned the British Prime Minister, Sir Robert Peel, of the danger to the Church of Scotland that was posed by the government’s policy of restricting the spiritual independence of the established Church of Scotland:

The Right Honble Sir Robert Peel Bart Private

Sir

I have this day received a communication to which I venture most earnestly to solicit your attention. It is contained in the accompanying printed circular. I believe that the head of her Majesty’s Govt, as a wise &amp; discerning Statesman, will not seem [illegible] the multitude of grave &amp; momentous questions which are at this moment engrossing his mind, deem it unworthy of serious thought. If I came using an undue liberty in presuming to obtrude it on your notice my only apology is the strength of my conviction that it is due to both you &amp; the country to make you aware of the facts which the document in question will disclose. If I am wrong in thinking so at least I am conscious of acting in the sincerity of my heart. No one knows, &amp; so far as I am concerned, no one shall know that I have done what I am now doing. My sole object &amp; desire is to place the matter before you leaving the result in the hands of Him whose counsel shall stand &amp; who will do all His pleasure. I court no reply.

Permit me only in the [illegible] form, to advert to the way in which the alarming event the circular contemplates, is expected to arrive. Ten days ago what appeared most probable was that the disruption of the Scottish Church might be produced by the passing of a law at variance with what the majority of her office-bearers regard as a fundamental principle of her constitution.

The commencement since them made in Parlt that Govt do not propose to legislate upon the subject at all, but to support the law as it has been or may be declared in the civil courts, changed the form in which the destructive collision will take place, but can hardly be said in any degree to have lessened the possibility of its coming.

The question now under discussion in the courts of civil law is substantially this, is the jurisdiction of the church supreme &amp; exclusive in matters spiritual? The civil courts may decide in such a way as to negate that proposition, for they have already before the points has been tried, assumed a power which they cannot vindicate their right to exercise in any other way.

The instant that decision is pronounced, the church of necessity is driven to the wall. She will not part with a jurisdiction which she hold as an article of faith &amp; believes to be committed to her keeping by the Lord Jesus Christ, which she believes moreover to have been solemnly ratified by the constitution of this being done.

There will then therefore be no other alternative but separation from the State.

Believe me Sir Robert Peel I write these words with all their tremendous import before my mind. But knowing what I do if the question at issue &amp; of the parties who are concerned in it, I declare, as in the sight of God my firm belief, that in the event of such a decision as I have alluded to being come to &amp; Parlt declining to interpose there will be greatly more difficulty than now, the breaking us of the Church of Scotland will be altogether inevitable.

I retain no copy of what I have now written.

I have done what I believed to be a duty in placing the subject before you. I regard it as more really important, in its bearings on the peace &amp; welfare of this empire, than even the greatest of those other national questions that now agitate the public mind.

That the Lord of all grace &amp; wisdom may guide you in the disposal of it is the earnest prayer.

Sir Yr most obt humble servt Robert Buchanan Glasgow 24 March 1842</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Robert Peel, 24 Mar. 1842 (British Library, London, Peel Papers, Add MS 40508, ff 207-11).</cite></span></figcaption>

</figure><figure class="quote" id="q-de3a7d083a" data-kw="">
<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and complaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it…</p></blockquote>

thstanding%E2%80%A6+We+found+its+very+authors+and+advocates+disregarding+it+the+very+next+year%3B+acting+as+though+no+such+doctrine+had+ever+been+broached.+If+they+practically+abandoned+it+as+untenable%E2%80%A6+The+Synod+of+Philadelphia+extended+the+%5Bnew%5D+doctrine+to+appeals%2C+complaints+and+protests.+Thus+putting+minorities+completely+under+the+feet+of+majorities%2C+not+allowing+them+even+the+right+of+recording+their+dissent+with+the+reasons+for+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%2C+%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+16%2C+%E2%80%98Discipline%E2%80%99%2C+section+3%2C+%E2%80%98Appeals+%26+Complaints%E2%80%99%2C+a.+%E2%80%98Appeals+in+Cases+Not+Judicial%E2%80%99%2C+pp.+470-72&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fde3a7d083a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/de3a7d083a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=That%20is%2C%20the%20General%20Assembly%20decided,dissent%20with%20the%20reasons%20for%20it&amp;text=That%20is%2C%20the%20General%20Assembly%20decided%20that%20appeals&amp;text=recording%20their%20dissent%20with%20the%20reasons%20for%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Magistrates in their place have their influence on them to preserve them from corruption: but especially Ministers are useful that way. In such Nations where there is no Gospel Ministry, People are very corrupt: if by the light of Nature and severity of Rulers, they be preserved from grosser iniquities, yet they are always very corrupt. But the Faithful Services of Gospel-Ministers is a special help to preserve from corruptions.

A Gospel-Ministry is looked upon by some Persons as an heavy charge, they groan under the burden of it; but Men have little reason to think much of the charge considering the benefit that they are to a People, as they are means to prevent the growing of corruption. Ministers had need be careful that they do fulfil their Ministry, for their work is not only of great concernment to themselves, but also to Multitudes of others, by keeping the Country from corruption.</p></blockquote>

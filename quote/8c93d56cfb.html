<blockquote><p>1. It is necessary that they should be imbued with the spirit of religion, and cultivate its practice… we have embraced the Christian system…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-thacher.html">Thomas Thacher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Principles and Maxims on which the Security and Happiness of a Republic Depend: a Sermon</cite>, … being the day of General Election’ (1811) 32 pp., p. 11</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-32aa7ad0f8" data-kw="">
<blockquote><p>Princes therefore may not suffer bishops to usurp the power of suspending and depriving at their pleasure [as that belongs to presbyteries], and whensoever they commit any such tyranny in smiting of their fellow servants, it is the part of princes to cause these things to be redressed, and for this end graciously to receive the grievances of oppressed ministers. The Arians of old beeing assembled in a Council at Antioch [A.D. 341] (Canon 11), decreed that if any ecclesiastical person should, without the advice and the letters of the bishops of the province, and chiefly of the Metropolitan, go to the emperour to put up any grievance unto him, he should be cast out, not only from the holy communion, but from his proper dignity which he had in the Church. Whereupon Osiander has this observation (Hist. Eccl., Century 4, bk. 2, ch. 48, p. 242): ‘This canon also was composed against holy Athanasius: for Athanasius being expelled by the Arians, had fled to the Emperour Constantine the younger, and had from him obtained a return to his own Church. Now this canon is very unjust, which forbids that a bishop or any other minister of the Church, being unjustly oppressed, flee to his godly civil magistrate: since it was lawful to the apostle paul to appeal to the Roman Emperor, wicked Nero, as the acts of the apostles witness. But it may be seen in this place, that bishops were very soon seeking dominion, yea tyranny over the Church and over their colleges [ecclesiastical assemblies].&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, bk. 8, Digression 4, pp. 194-5</span></figcaption>

<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/south-carolina.html">South Carolina</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of South Carolina</cite>, 1788 (Thorpe, 6.3249-50, 3252, 3255-6)</span></figcaption>

</figure><figure class="quote" id="q-fa38b87c94" data-kw="">
<blockquote><p>1. Whether men should be compelled to communicate with any church by corporal penalties?… 1. It were happy if the sword could compel unbelievers to believe, but it cannot, nor is a way which nature or Scripture ever allowed man to use for such an end. 2. To force an unbeliever to lie, by saying he believes, is a sin. 3. An infidel must not be baptized till he profess with seeming seriousness and willingness that he believes in God, the Father, Son and Holy Ghost, and will vow and devote himself to Him: Therefore to force the unwilling to be baptized, is a sacrilegious profanation of baptism. 4. To be baptized is to be solemnly invested in a visible state of regeneration, pardon, adoption, and right to Christ and life eternal, by a ministerial delivery of such right as in the name of Christ. But no unwilling person has any right to these invaluable gifts: Therefore no unwilling person should be forced to receive the said investiture. 5. Christ’s trial and description of the willing, is, whether they resolve to accept of his grace, forsaking all worldly interest that stands against it: Lk. 14:26-27, to the end. Therefore to baptize all that are forced to it by the sword, and had rather be baptized, and say they believe, than lose all they have, and lie in gaol [prison], is to preach another Gospel in part 6. Persons baptized in infancy, have no right to communion in the Lord’s Supper, till they profess their personal faith and consent to the baptismal Covenant: And the unbaptized are not to be forced to communicate: The Lord’s Supper redelivering all the same great invaluable gifts to the receivers which were delivered in baptism; the unwilling are no more capable of one, than the other. And to force them to say they are willing, and to receive that which they have no right to, is sacrilegious profaning holy things. 7. The ancient Churches for many hundred years, were so far from forcing any to baptism or Church-communion, or thinking that they should be forced, that they admitted none that did not earnestly desire it: And if the baptized by impenitency, or apostasy, or a long withdrawing from communion, did show themselves again uncapable by unwillingness, they declaratively cast them out. 8. And that the excommunicate, as such, should be laid up in prison, and undone, to force them again to be willing to be Christians or to communicate, has the same reasons against it, as against doing it at the first; and to take them for willing and capable of absolution, and salvation, who had rather say, they repent and consent, than lie in gaol, is to pervert Christ’s gospel and sacraments, and confound the Church: And the ancient Churches would have abhorred the notion of such a thing. 9. But it is just and meet that princes make a difference between Christian and infidel subjects; and between those that live willingly in communion of the Church, and those that refuse it: And that a Christian kingdom should give those powers and immunities to willing Christians, which they give not to infidels and the justly excommunicate; especially in matters relating to government, legislative and judiciary, and especially about religion, and the Church. And if any to obtain such immunities or powers, do hypocritically profess Christianity and consent, themselves only are guilty of the profanation, no wrong means was used, and the Church is no searcher of the heart. 10. But Christianity being necessary to our salvation; and it being the Christian magistrate’s duty to do his best for the salvation of all his subjects, and knowledge being the means of consent, and teaching and learning the means of knowledge; it is the duty of such magistrates to provide sufficient teachers for number and quality for all the subjects; and to compel men to hear, consider, and learn, as catechumens: The ancient Churches had their previous instructions for such, who were yet dismissed before the communion exercises, proper to the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts</cite>, ... (1684), Unnecessary Separating Disowned, p.</span></figcaption>

unwilling+are+no+more+capable+of+one%2C+than+the+other.+And+to+force+them+to+say+they+are+willing%2C+and+to+receive+that+which+they+have+no+right+to%2C+is+sacrilegious+profaning+holy+things.+7.+The+ancient+Churches+for+many+hundred+years%2C+were+so+far+from+forcing+any+to+baptism+or+Church-communion%2C+or+thinking+that+they+should+be+forced%2C+that+they+admitted+none+that+did+not+earnestly+desire+it%3A+And+if+the+baptized+by+impenitency%2C+or+apostasy%2C+or+a+long+withdrawing+from+communion%2C+did+show+themselves+again+uncapable+by+unwillingness%2C+they+declaratively+cast+them+out.+8.+And+that+the+excommunicate%2C+as+such%2C+should+be+laid+up+in+prison%2C+and+undone%2C+to+force+them+again+to+be+willing+to+be+Christians+or+to+communicate%2C+has+the+same+reasons+against+it%2C+as+against+doing+it+at+the+first%3B+and+to+take+them+for+willing+and+capable+of+absolution%2C+and+salvation%2C+who+had+rather+say%2C+they+repent+and+consent%2C+than+lie+in+gaol%2C+is+to+pervert+Christ%E2%80%99s+gospel+and+sacraments%2C+and+confound+the+Church%3A+And+the+ancient+Churches+would+have+abhorred+the+notion+of+such+a+thing.+9.+But+it+is+just+and+meet+that+princes+make+a+difference+between+Christian+and+infidel+subjects%3B+and+between+those+that+live+willingly+in+communion+of+the+Church%2C+and+those+that+refuse+it%3A+And+that+a+Christian+kingdom+should+give+those+powers+and+immunities+to+willing+Christians%2C+which+they+give+not+to+infidels+and+the+justly+excommunicate%3B+especially+in+matters+relating+to+government%2C+legislative+and+judiciary%2C+and+especially+about+religion%2C+and+the+Church.+And+if+any+to+obtain+such+immunities+or+powers%2C+do+hypocritically+profess+Christianity+and+consent%2C+themselves+only+are+guilty+of+the+profanation%2C+no+wrong+means+was+used%2C+and+the+Church+is+no+searcher+of+the+heart.+10.+But+Christianity+being+necessary+to+our+salvation%3B+and+it+being+the+Christian+magistrate%E2%80%99s+duty+to+do+his+best+for+the+salvation+of+all+his+subjects%2C+and+knowledge+being+the+means+of+consent%2C+and+teaching+and+learning+the+means+of+knowledge%3B+it+is+the+duty+of+such+magistrates+to+provide+sufficient+teachers+for+number+and+quality+for+all+the+subjects%3B+and+to+compel+men+to+hear%2C+consider%2C+and+learn%2C+as+catechumens%3A+The+ancient+Churches+had+their+previous+instructions+for+such%2C+who+were+yet+dismissed+before+the+communion+exercises%2C+proper+to+the+faithful.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Communion+Defended+against+both+Extremes%2C+and+Unnecessary+Division+Confuted+in+Five+Parts...+%281684%29%2C+Unnecessary+Separating+Disowned%2C+p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa38b87c94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa38b87c94.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=1.%20Whether%20men%20should%20be%20compelled,communion%20exercises%2C%20proper%20to%20the%20faithful&amp;text=1.%20Whether%20men%20should%20be%20compelled%20to%20communicate&amp;text=before%20the%20communion%20exercises%2C%20proper%20to%20the%20faithful" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

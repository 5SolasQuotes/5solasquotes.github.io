</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f59b161fb7" data-kw="">
<blockquote><p>2… When sinners shall consider they were in a fair way to the kingdom; they had a possibility of salvation; though the door of Heaven were strait, yet it was open; they had the means of grace; the jubilee of the gospel was proclaimed in their ears; God called but they refused; Jesus Christ offered them a plaister of his own blood to heal them, but they trampled it under foot; the Holy Spirit stood at the door of their heart knocking and crying to them to receive Christ and Heaven, but they repulsed the Spirit and sent away this Dove, and now they have, through their own folly and willfulness, lost the Kingdom of Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, (d. 1686; London: Parkhurst, 1692), The Lord’s Prayer, ‘Thy Kingdom Come’ | Use 4, p. 488</span></figcaption>

</figure><figure class="quote" id="q-8062fcc4ca" data-kw="">
<blockquote><p>I have followed this method in the Theses on the secret of eternal Predestination, in which I considered primarily the efficient cause of Election and Reprobation with utmost diligence and faith. However, I could not escape the foul calumnies of detractors and some unreasonable people. For when I have shown from the Gospel of Jesus Christ that the decree of eternal election must be distinguished from our eternal salvation as a cause from its effect, and that the means leading us to that eternal salvation, among which are faith in Christ and His merit, are efficient causes of eternal salvation, but not the decree of election, some have dared, prompted by weakness or perhaps ignorance combined with a malicious intent, to affirm that I have taught that we are not saved by faith in Christ and that the merit of Christ is not the cause of our eternal salvation. But I give thanks to my God, who deigns to gradually make me conformed to the image of His Son, for enduring calumnies for the sake of heavenly truth; and I persuade myself that it is Christian to be ill-spoken of when you believe rightly and teach and do well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

</figure><figure class="quote" id="q-2693a5332b" data-kw="">
<blockquote><p>The doctrinal structure which stands out as most original in Bullinger’s Compendium is the definitive establishment of the gracious covenant of God as the ground for our understanding of Christology and soteriology. Bullinger accords to the covenant a position in relation to his doctrine of God much like the position of an infralapsarian doctrine of predestination.</p></blockquote>

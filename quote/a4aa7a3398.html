<main class="wrap"><figure class="quote" id="q-a4aa7a3398" data-kw="">
<blockquote><p>I constantly keep exactly the same order of books, treatises, disputations, chapters, and sections which the author, Father Suárez, observed, so that, if anyone should at times wish to inspect or weigh more fully some subject that has been proposed, he may at once be able to ﬁnd it in the very archetype without any diﬃculty or toil. Sometimes, however, for the sake of brevity, I have gathered into a single heading certain chapters of his which were divided, but have a great mutual connexion; yet not even thus is the ease of ﬁnding the matter desired taken away, since I always retain the original order of the subject-matter. Further, if sometimes from the title the sense of the question does not suﬃciently appear, I preﬁx a brief explanation of it, and, when needful, I set out the whole question for clearer understanding by a successive series of cardinal numbers, saying 1, 2, 3, etc., as Father Suárez himself also more frequently is wont to set things forth. Next, because he oﬅen preﬁxes to his own position the diverse opinions of authors or the heresies, I likewise indicate these at the outset along with his own, and at the end I resolve in a body their arguments or objections. Yet do not expect, dear reader, that all and each of the original’s proofs and refutations—especially those drawn from authority—could have been included in so narrow a compendium; I have excerpted only those more necessary, suitable, and eﬀective, for the most part merely indicating the rest in general. Moreover, I have always striven, as brieﬂy as I could, to embrace his whole line of argument and meaning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-noel.html">Francis Noel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendium of R.P. Fancisco Suarez tr. AI (Madrid: 1732; Paris: Migne, 1858) More detailed tables of contents are at the front of each volume. | Preface by Noel:</cite></span></figcaption>

<blockquote><p>2 …but the metaphysician proves the principles of the inferior sciences in as much as if those principles are obstinately denied by anyone, he explains their terms, which having been declared and perceived by the adversary, he cannot but assent to the truth of the proposed principles, unless he be completely stripped of reason in the manner of a brute. For nothing conduces more to the confirmation of principles than the perception of the same: and nothing more helps the intellect, that it perceive principles than the understanding of the terms from which the principles are composed. Furthermore, he proves those principles a posteriori [from those things that follow], and indeed by leading the adversary through the impossible, in as much as unless he acknowledge the truth of the principles it will be necessary for him to have acknowledged the greatest absurdity resulting from the denied principles. Thus to one denying that the whole is greater than its part, it will be explained what part, what whole. If he be not yet sufficiently moved, it will be inferred from that negation, the acception of the terms having been presupposed according to the explained way, that the whole would not be whole, nor would the part be part; and thus the same would be and not be at the same time. Which, as most absurd, will not be to be admitted. 5. …All principles, of whatever genus they be, can be called first; and in what way first, in that way also they are indemonstrable. They are therefore first in as much as they do not recognize others through which they are demonstrated a priori [from things prior]. Then they are first in as much as in that science of which they are principles, they do not recognize others prior to themselves through which they are demonstrated. But what principles in their science are first can still in the order of another science be posterior and thus demonstrable, at least a posteriori, if not also a priori.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-voet.html">Paul Voet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Philosophy Reformed tr. by AI by Onku (Utrecht: Johann Waesberg, 1657), ch. 2, sect. 2</cite></span></figcaption>

</figure><figure class="quote" id="q-2744cc85f0" data-kw="">
<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Heinrich Bullinger on Natural Reason, Theology &amp; Law’</cite></span></figcaption>

281504%2D1575%29%2C%20a%20Swiss%20reformer%2C%20was%20the%20successor&amp;text=or%2C%20the%20effect%20of%20this%20knowledge%20on%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-595686e025" data-kw="">
<blockquote><p>Certainly [James] Arminius… saw that… the novel Pseudo-philosophy of the Jesuits was being confounded with true metaphysics and the Thomistic Scholastics… His disciples—when they perceived that the little pseudo-philosophical reasonings, by which at the beginning, and almost alone, they had assailed the received truth, were no longer a terror but a derision, and that their own theology daily grew worse—began strenuously to declaim against the philosophy of the schools, especially the metaphysical… Solid ratiocinations they call Scholastic subtleties: by this name they pretext their fault. … But [the Arminian] Vorstius, in his writings… in place of the philosophy of Aristotle and of the Scholastics—rightly emended in the reformed schools and accommodated to the truth of religion—substitutes the metaphysics of Taurellus, conjoined with the declamations of Ramus (which they call schools), with Bodin’s Theater [of Nature] from time to time employed… Let now the metaphysics and Triumphus of Taurellus be compared, with some things of Bodin added, and the declamations of Ramus, and let it be judged whether by their help the Atheistic, Epicurean, Ethnic [pagan], Judaic, Muhammadan, Enthusiastico-Libertine, Vorstian, Socinian, etc. [errors] can better be refuted than out of Thomas and the other Scholastics, and the more recent disciples of these, Suárez, Fonseca, etc. Certainly of these it may be said what was once said of Origen: where good, none better; where bad, none worse. When they are not hindered by the prejudices and authority of the corrupted religion and church of their own [communion], they render truly useful service (certain errors, and things too curious, excepted)—e.g. in the defense of the Trinity, of the divine attributes, of Christ the θεάνθρωπος [God-man], of the creation of the world, of the resurrection, of the general theses concerning the end of man, concerning the affections, faculties, etc. Hence it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 4 in Select Theological Disputations, pt. 5 (Utrecht, 1669) tr. AI by Roman Prestarri Latin</cite></span></figcaption>

 it is that our most excellent theologians not unwillingly plow with their heifer [i.e. make use of them]—e.g. Martyr, Zanchi, Danaeus, Franciscus Junius, Ferrius, Molinaeus, Perkins, Twisse, Rutherford, etc. And the [Protestant] philosophers have, in emulation, out of the same—and chiefly out of Suárez, among the more recent—composed their own metaphysics: e.g. Cornelius Martinius, Jacobus Martinius, Combachius, Werenbergius, Scheibler, Jachaeus, Rutgersius, Burgersdicius, Senguerdius, etc. But the virtues and vices of Scholastic Theology we have explained ex professo [expressly, professedly] in the disputation On Scholastic Theology.”

— Gisbertus Voetius, Problems on God, pt. 4 in Select Theological Disputations, pt. 5 (Utrecht, 1669) tr. AI by Roman Prestarri Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCertainly+%5BJames%5D+Arminius%E2%80%A6+saw+that%E2%80%A6+the+novel+Pseudo-philosophy+of+the+Jesuits+was+being+confounded+with+true+metaphysics+and+the+Thomistic+Scholastics%E2%80%A6+His+disciples%E2%80%94when+they+perceived+that+the+little+pseudo-philosophical+reasonings%2C+by+which+at+the+beginning%2C+and+almost+alone%2C+they+had+assailed+the+received+truth%2C+were+no+longer+a+terror+but+a+derision%2C+and+that+their+own+theology+daily+grew+worse%E2%80%94began+strenuously+to+declaim+against+the+philosophy+of+the+schools%2C+especially+the+metaphysical%E2%80%A6+Solid+ratiocinations+they+call+Scholastic+subtleties%3A+by+this+name+they+pretext+their+fault.+%E2%80%A6+But+%5Bthe+Arminian%5D+Vorstius%2C+in+his+writings%E2%80%A6+in+place+of+the+philosophy+of+Aristotle+and+of+the+Scholastics%E2%80%94rightly+emended+in+the+reformed+schools+and+accommodated+to+the+truth+of+religion%E2%80%94substitutes+the+metaphysics+of+Taurellus%2C+conjoined+with+the+declamations+of+Ramus+%28which+they+call+schools%29%2C+with+Bodin%E2%80%99s+Theater+%5Bof+Nature%5D+from+time+to+time+employed%E2%80%A6+Let+now+the+metaphysics+and+Triumphus+of+Taurellus+be+compared%2C+with+some+things+of+Bodin+added%2C+and+the+declamations+of+Ramus%2C+and+let+it+be+judged+whether+by+their+help+the+Atheistic%2C+Epicurean%2C+Ethnic+%5Bpagan%5D%2C+Judaic%2C+Muhammadan%2C+Enthusiastico-Libertine%2C+Vorstian%2C+Socinian%2C+etc.+%5Berrors%5D+can+better+be+refuted+than+out+of+Thomas+and+the+other+Scholastics%2C+and+the+more+recent+disciples+of+these%2C+Su%C3%A1rez%2C+Fonseca%2C+etc.+Certainly+of+these+it+may+be+said+what+was+once+said+of+Origen%3A+where+good%2C+none+better%3B+where+bad%2C+none+worse.+When+they+are+not+hindered+by+the+prejudices+and+authority+of+the+corrupted+religion+and+church+of+their+own+%5B <blockquote><p>Let your theologians [O Stapleton] dispute as much as they will that it is the least of all sins, and less than any venial one: what else do they reveal to all but their singular ignorance? If it is so minimal that it ought to be considered less than even any venial sin, then it cannot even be a sin, because what is less than venial is not to be placed among sins, since no sin is less than venial. Do you think Thomas felt this, when he writes that original sin is greater extensively than actual sin, but intensively less, because the actual has more of the nature of the voluntary (Thomas, in pt. 1 of 2, q. 82, art. 2)? If that reason does not deceive, they did rightly who placed it below any venial sin whatsoever, since in the slightest sin there is more of the voluntary than in the original, unless we are understood to have willed in Adam.</p></blockquote>

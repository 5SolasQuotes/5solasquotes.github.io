<main class="wrap"><figure class="quote" id="q-ba4b257802" data-kw="">
<blockquote><p>34 The Law is the doctrine of works: Therefore it manifesteth unto us the corruption of our nature; it terrifieth us, and prescribeth unto us the rule of well-doing.

35 The Gospel is the doctrine of faith: which pointeth at Christ our Mediator, who hath made satisfaction for our sins, and raiseth up the conscience of man.

36 The practice of the Law and the Gospel consisteth in true Repentance.

37 Whereunto there is required Contrition, to be wrought in us by the Law; and Faith, by the Gospel.

38 Faith apprehendeth the Righteousness of Christ offered in the word of the Gospel: by which man, after Contrition wrought in him by the void of the Law, is justified before God, and beginneth to be renewed by the receiving of the Holy Ghost.

39 For by faith our hearts are purified. Acts 15.9.

40 Therefore the fruits of true Repentance are good works.

41 For, Faith worketh by Love. Gal. 5.6. And Christ giveth unto us not only his righteousness, but also his Holy Spirit, which beginneth to renew our nature, and bridle in us the concupiscences of the flesh.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd6aeca99e" data-kw="">
<blockquote><p>XXIII. Hence is easily gathered the reason why God wished to recall that [natural] law by Moses, to deliver it to his people viva voce, and proclaimed it in a solemn manner, committing it to writing and comprehending it in the decalogue. For although in upright nature there was no need of such a promulgation, still (after sin) so great was the blindness of mind, such the perversity of will and disturbance of the affections that only remains of this law survived in the hearts of all (like rubbed pictures of the same, which on that account ought to be retouched by the voice and hand of God as by a new brush).

Hence there were weighty causes for that promulgation. (1) That the natural law might be confirmed more and more, lest the remaining traces might gradually be obliterated by the vanity and wickedness of men or be considered as their uncertain and doubtful opinions. (2) That it might be corrected in those things in which it had been corrupted by the fall. (3) That it might be supplemented in those things which were wanting in it and had been obliterated. (4) That the necessity of a mediator might be understood and a desire for him to be enkindled more strongly every day on account of the weakness of man and of the law in the flesh (Rom. 3:20; 8:3; 10:4). (5) That the people of Israel might be joined by this law into one republic and be separated from all other nations (Dt. 4:6, 7; Ps. 147:19, 20; Rom. 9:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-a4f8e5a8bc" data-kw="">
<blockquote><p>This is one principal difference between the law and the gospel, and was ever so esteemed in the church of God, until all communication of efficacious grace began to be called in question: The law guides, directs, commands, all things that are against the interest and rule of sin. It judgeth and condemneth both the things that promote it and the persons that do them; it frightens and terrifies the consciences of those who are under its dominion. But if you shall say unto it, “What then shall we do? this tyrant, this enemy, is too hard for us. What aid and assistance against it will you afford unto us? what power will you communicate unto its destruction?” Here the law is utterly silent, or says that nothing of this nature is committed unto it of God; nay, the strength it hath it gives unto sin for the condemnation of the sinner: “The strength of sin is the law.” But the gospel, or the grace of it, is the means and instrument of God for the communication of internal spiritual strength unto believers. By it do they receive supplies of the Spirit or aids of grace for the subduing of sin and the destruction of its dominion. By it they may say they can do all things, through Him that enables them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of the dominion of sin and grace; wherein sin’s reign is discovered, in whom it is, and in whom it is not; how the law supports it; how grace delivers from it, by setting up its dominion in the heart</cite>, (London, 1688) in The works of John Owen, ed. W. H. Goold (16 vols, Edinburgh, 1965), vii, 546-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

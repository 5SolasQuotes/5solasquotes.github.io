<main class="wrap"><figure class="quote" id="q-2258402bd8" data-kw="">
<blockquote><p>The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697)</cite>, pp. 33-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-43c4f14f1b" data-kw="">
<blockquote><p>And because in this matter it chiefly behoves to know who is truly said to be an heretic or whom is a schismatic: of these matters I will first of all speak these few words. St. Augustine thinks that this difference there is between an heretic and a schismatic: That a heretic does corrupt the sincerity of faith and doctrine of the apostles with his wicked doctrine; and a schismatic, although he sin not at all against the pure doctrine and sincere faith, yet he rashly separates himself from the Church, breaking the bond of unity. And surely he properly is an heretic, whosoever he be that contrary to the Scripture, which is the Word of God, against the Articles of Faith,¹ or against the sound opinions of the Church grounded on the Word of God, through hope of any temporal commodity, of his own brain and fleshly choice chooses, receives, teaches, follows strange things, and stiffly retaining does both defend them and spread them abroad. ¹ [This likely refers to the Apostles’ Creed, which was also known as the 12 Articles, and around which Bullinger’s Decades was roughly organized.] By the imperial edict of Augustus Cesar, Gratian, Valentinian and Theodosius, they are defined to be catholics or Christians who continue in that religion which St. Peter taught the church of Rome and which blessed Damasus and St. Peter, bishop of Alexandria, did teach, that is to say, confessing according to the teaching of the apostles and doctrine of the Gospel the only Godhead of the Father, and of the Son, and of the Holy Ghost in equal majesty and in an holy Trinity. And again they are by them declared to be heretics, who follow contrary opinions, whom they accompt both mad and infamous, and worthy of punishment. And he is a scismatic, whosoever he be that separates himself from the unity of the true Church of God, and either himself gathers together new assemblies, or joins himself to congregations gathered by others, albeit in doctrine he err little or nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades… (d. 1575; London: Newberrie, 1577), 5th Decade, Sermon 2, “That there is one catholic Church”</cite>, p. 850</span></figcaption>

</figure><figure class="quote" id="q-ef31857eec" data-kw="">
<blockquote><p>Wherefore I cannot marvel enough at the corrupt and scismatical manners of certain men, who separate themselves for every light cause, from the most wholesome and pleasant company or society of the Church. For you shall find in these days, captious and phantastical men, not a few, which of many years have had fellowship with no Church, nor as yet have fellowship with any. For in every man that is, they find some kind of fault, in themselves only they find nothing worthy reprehension. Therefore they conceive with themselves a wonderful fashion of the Church, which except they see somewhere established after that fashion which they themselves haue devised, they contend (with shame enough) that there is as yet no true Church of Christ in the world.</p></blockquote>

<blockquote><p>The Reformed orthodox generally also note… three kinds of doctrinal error: 1. errors against a fundamental article… 2. errors around a fundamental or in indirect contradiction to it… 3. errors beyond a fundamental article (praeter fundamentum)… The third category of error does not address fundamental articles directly or indirectly but rather involves faith in problematic and curious questions… that do not arise out of the revealed Word–hay and stubble!–and that, because of their curiosity and vanity, constitute diversions from and impediments to salvation. (Rijssen, Summa, I.xiii; cf. Turretin, Inst. theol., I.xiv.9)” – Muller, PRRD (2003) 1.422-23 Hottinger, Johann Heinrich – The 8th Theological Disputation of the Gymnasium: Of the Use &amp; Abuse of the Distinction of [Theological] Places into Fundamental &amp; Non-Fundamental (Zurich, 1664) Cocceius, Johannes – ch. 7. ‘Of that which is Fundamental’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 90-97 Velthuysen, Lambert – 3. ‘Of Principles from the First Rising, or Fundamental Articles &amp; Errors’ in Theology (Fribourg, 1666), pp. 8-11 Velthuysen (1623-1685) Burman, Francis – Ch. 3. ‘Of the Foundation &amp; Fundamental Articles’ in A Synopsis of Theology… (Utrecht, 1671), vol. 2, Locus 41, ‘Of Revelation &amp; the Word under the Economy of the New Covenant’, pp. 308-317 Burman (1628-79) Pauli, Reinhold – A Compendium of Theological Disputations… Ch. 1, On the Fundamental of the Faith (Marburg 1672) Pauli (1638-1682) was a German reformed professor of theology at Marburg. Heidegger, Johann Heinrich – A Dissertation on the Foundation of Salvation, whereby the Whole Subject of Fundamental &amp; Non-Fundamental Articles &amp; Errors is Struck (Zurich, 1676) Rissen, Leonard – Locus 1, ‘Of Theology’, Controversy 3, sections 12-13, pp. 13-14 in A Sum of Didactic &amp; Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology... (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

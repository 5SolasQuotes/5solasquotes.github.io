<main class="wrap"><figure class="quote" id="q-051045ced0" data-kw="">
<blockquote><p>It plainly appears to such as read the Scriptures with a humble mind, and consider the doctrine therein delivered, and take notice of the Lord’s way of dealing with his own, that the grand design of God in the contrivance of the elect’s salvation, is, to evoke the riches of the free grace of God in Christ … I say, not simply to exalt grace, (which is always here to be understood of the free favour of God, or the grace of God without us); for even by the first covenant, the grace of God was exalted, and manifestly appeared in God’s condescending to enter into a covenant with Adam, and to require obedience of him by virtue of a covenant, and that with a promise of so great a reward, to which his best works could bear no proportion; when, by virtue of his sovereignty merely, he might have exacted all obedience; here was grace, though, as [Paul] Bayn[e] calls it, a more common and inferior grace: But I say the riches of grace, in respect of which the former was but a small scantling of grace. Thus the apostle holds it forth, Eph. i. 7. “According to the riches of his grace.” Chap. ii. 4. “But God, who is rich in mercy;” and ver. 7. “That in the ages to come he might show the exceeding riches of his grace.”

This then is clearly the great design of God in the contrivance of man’s salvation. Now the heart of a child of God is (if I may so term it) shapen out in breadth and length to this design: for what is faith bat an hearty acquiescing in the way of salvation held forth in the gospel, as suited both to man’s necessity, and the divine perfections, and particularly tending unto the manifestation of the riches of grace whereby Christ is made all, and the creature nothing?

Here then I apprehend, we may find the great reason of the Lord’s dispensation in the matter of the believer’s sanctification, the knowledge and consideration whereof is most likely to give satisfaction to the soul thus exercised. And it is briefly this: The exalting of Christ, and of the free grace of God in him, is the great design and end of the contrivance of man’s salvation, as held forth in the gospel; but God’s leaving of sin to be, and to be active in the regenerate while they are in this world, yea and keeping of them for a while in that case in the world, does contribute more to the advancement of that design, than the making of them sinless immediately upon their closing with Christ. Therefore may we already not only believe, but see, that in this matter he hath done all things well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Questions</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 120-21.</span></figcaption>

<blockquote><p>The French national synods of Gap (1603) and La Rochelle (1607) were prime examples of this. Philippe du Plessis-Mornay (1549-1623), the advisor to Henry of Navarre, used fundamental articles in his Traite de I’Eglise (1578) as a basis for suggesting an accord with the Church of England. James I responded to the French Reformed initiative by sending a letter to the Synod of Toniens (1614) expressing his own desire for union. The Synod went on to adopt a series of procedures designed to set up an international synod which would formulate procedures for establishing a common Reformed-Anglican-Lutheran statement of faith based on the fundamental articles… Mornay also used fundamental articles in his description of the true church. Philippe du Plessis-Mornay, Traite de l’Eglise, 2d ed. (La Rochelle, 1599), pp. 75-77; 172-75.” – Martin Klauber, “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 338 fn. 16 Beza, Theodore – Traicté des vrayes essencielles et visibles marques de la vraye Eglise catholique (1592) 108 pp. Martin Klauber: “Beza placed his discussion of fundamental articles within the framework of his treatise on the true marks of the Church. In his Traicte des vrayes essencielles et visibles marques de la vraye Eglise Catholique (1592), Beza defined the fundamental articles as being summarized in the Ten Commandments, the Apostles Creed, and the Lord’s Prayer. He argued further that such fundamental articles such as the Trinity and the two natures of Christ are essential marks of the true Church.” “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 336, fn. 7 Junius, Francis – Le paisible chrestien ou de la paix de l’Eglise catholique… sur les Pseaumes 122 et 133 (Leiden: 1593) 392 pp. no ToC . 1600’s Jurieu, Pierre The Authentic System of the Church &amp; a True Analysis of the Faith… (Dort, 1686) ToC Jurieu (1637-1713) was a French reformed minister and prolific author. Wikipedia: “The most famous of the controversies on this subject was that between [the Romanist, Jacques-Bénigne] Bossuet [1627-1704] and the Calvinist Jurieu. Jurieu’s book… ‘Le Vray Systeme’ was an attempt to demonstrate the right of the French Protestants to rank as members of the Church Universal… According to him all sects without exception are members of Body of Christ. For this nothing is necessary but “to belong to a general confederation, to confess Jesus Christ as Son of God, as Saviour of the world, and as Messias; and to receive the Old and New Testaments as the rule and Law of Christians”, (Système, p. 53). Yet among the various portions of the Church we must, he tells us, distinguish four classes:

1. Sects that have retained all the truths taught in the Scriptures;

2. Sects that, while retaining the more important truths, have mingled with them superstitions and errors;

3. Sects that have retained the fundamental truths, but have added doctrines incompatible with them;

4. Sects that have set the fundamental verities aside altogether. This last class are dead members of the mystical body (ibid., p. 52). Those who have retained the fundamental articles of the faith are, one and all, living parts of the Church. When he comes to define precisely which doctrines are, and which are not, fundamental, Jurieu bids us fall back on the rule of Vincent of Lérins [d. c. 445]: Quod semper, quod ubique, quod ab omnibus [that which is always, everywhere and from all]. Wherever all bodies of Christians still exist and possess some importance in the world, and agree in accepting a dogma, we have, in that agreement, a criterion that may be considered infallible. Among truths so guaranteed are the doctrine of the Trinity, the Divinity of Jesus Christ, the Redemption, the satisfaction, original sin, creation, grace, the immortality of the soul, the eternity of punishment (ibid, 236-237). This work was followed, in 1688, by another entitled “Traité de l’unité de l’Eglise et des articles fondamentaux”, written in reply to Nicole’s criticisms. In the same year appeared Bossuet’s “Histoire des Variations des Eglises protestantes”… In regard to the relation of the fundamental doctrines to salvation, Jurieu is in agreement with the English divines already quoted. “By fundamental points”, he says, “we understand certain general principles of the Christian religion, a distinct faith and belief in which are necessary to salvation” (Traité, p. 495).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The French national synods of Gap (1603) and La Rochelle (1607) were prime examples of this. Philippe du Plessis-Mornay (1549-1623), the advisor to Henry of Navarre, used fundamental articles in his Traite de I’Eglise (1578) as a basis for suggesting an accord with the Church of England. James I responded to the French Reformed initiative by sending a letter to the Synod of Toniens (1614) expressing his own desire for union. The Synod went on to adopt a series of procedures designed to set up an international synod which would formulate procedures for establishing a common Reformed-Anglican-Lutheran statement of faith based on the fundamental articles… Mornay also used fundamental articles in his description of the true church. Philippe du Plessis-Mornay, Traite de l’Eglise, 2d ed. (La Rochelle, 1599), pp. 75-77; 172-75.” – Martin Klauber, “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 338 fn. 16 Beza, Theodore – Traicté des vrayes essencielles et visibles marques de la vraye Eglise catholique (1592) 108 pp. Martin Klauber: “Beza placed his discussion of fundamental articles within the framework of his treatise on the true marks of the Church. In his Traicte des vrayes essencielles et visibles marques de la vraye Eglise Catholique (1592), Beza defined the fundamental articles as being summarized in the Ten Commandments, the Apostles Creed, and the Lord’s Prayer. He argued further that such fundamental articles such as the Trinity and the two natures of Christ are essential marks of the true Church.” “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 336, fn. 7 Junius, Francis – Le paisible chrestien ou de la paix de l’Eglise catholique… sur les Pseaumes 122 et 133 (Leiden: 1593) 392 pp. no ToC . 1600’s Jurieu, Pierre The Authentic System of the Church &amp; a True Analysis of the Faith… (Dort, 1686) ToC Jurieu (1637-1713) was a French reformed minister and prolific author. Wikipedia: “The most famous of the controversies on this subject was that between [the Romanist, Jacques-Bénigne] Bossuet [1627-1704] and the Calvinist Jurieu. Jurieu’s book… ‘Le Vray Systeme’ was an attempt to demonstrate the right of the French Protestants to rank as members of the Church Universal… According to him all sects without exception are members of Body of Christ. For this nothing is necessary but “to belong to a general confederation, to confess Jesus Christ as Son of God, as Saviour of the world, and as Messias; and to receive the Old and New Testaments as the rule and Law of Christians”, (Système, p. 53). Yet among the various portions of the Church we must, he tells us, distinguish four classes:

1. Sects that have retained all the truths taught in the Scriptures;

2. Sects that, while retaining the more important truths, have mingled with them superstitions and errors;

3. Sects that have retained the fundamental truths, but have added doctrines incompatible with them;

4. Sects that have set the fundamental verities aside altogether. This last class are dead members of the mystical body (ibid., p. 52). Those who have retained the fundamental articles of the faith are, one and all, living parts of the Church. When he comes to define precisely which doctrines are, and which are not, fundamental, Jurieu bids us fall back on the rule of Vincent of Lérins [d. c. 445]: Quod semper, quod ubique, quod ab omnibus [that which is always, everywhere and from all]. Wherever all bodies of Christians still exist and possess some importance in the world, and agree in accepting a dogma, we have, in that agreement, a criterion that may be considered infallible. Among truths so guaranteed are the doctrine of the Trinity, the Divinity of Jesus Christ, the Redemption, the satisfaction, original sin, creation, grace, the immortality of the soul, the eternity of punishment (ibid, 236-237). This work was followed, in 1688, by another entitled “Traité de l’unité de l’Eglise et des articles fondamentaux”, written in reply to Nicole’s criticisms. In the same year appeared Bossuet’s “Histoire des Variations des Eglises protestantes”… In regard to the relation of the fundamental doctrines to salvation, Jurieu is in agreement with the English divines already quoted. “By fundamental points”, he says, “we understand certain general principles of the Christian religion, a distinct faith and belief in which are necessary to salvation” (Traité, p. 495).”

— Philippe de Mornay, Tract on the Church 2nd, ed. (1578; Geneva, 1599) Note this was published in a different city than what Klauber cites below.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+French+national+synods+of+Gap+%281603%29+and+La+Rochelle+%281607%29+were+prime+examples+of+this.+Philippe+du+Plessis-Mornay+%281549-1623%29%2C+the+advisor+to+Henry+of+Navarre%2C+used+fundamental+articles+in+his+Traite+de+I%E2%80%99Eglise+%281578%29+as+a+basis+for+suggesting+an+accord+with+the+Church+of+England.+James+I+responded+to+the+French+Reformed+initiative+by+sending+a+letter+to+the+Synod+of+Toniens+%281614%29+expressing+his+own+desire+for+union.+The+Synod+went+on+to+adopt+a+series+of+procedures+designed+to+set+up+an+international+synod+which+would+formulate+procedures+for+establishing+a+common+Reformed-Anglican-Lutheran+statement+of+faith+based+on+the+fundamental+articles%E2%80%A6+Mornay+also+used+fundamental+articles+in+his+description+of+the+true+church.+Philippe+du+Plessis-Mornay%2C+Traite+de+l%E2%80%99Eglise%2C+2d+ed.+%28La+Rochelle%2C+1599%29%2C+pp.+75-77%3B+172-75.%E2%80%9D+%E2%80%93+Martin+Klauber%2C+%E2%80%9CDrive+toward+Protestant+Union%2C%E2%80%9D+Church+History%2C+61.3+%281992%29%2C+p.+338+fn.+16+Beza%2C+Theodore+%E2%80%93+Traict%C3%A9+des+vrayes+essencielles+et+visibles+marques+de+la+vraye+Eglise+catholique+%281592%29+108+pp.+Martin+Klauber%3A+%E2%80%9CBeza+placed+his+discussion+of+fundamental+articles+within+the+framework+of+his+treatise+on+the+true+marks+of+the+Church.+In+his+Traicte+des+vrayes+essencielles+et+visibles+marques+de+la+vraye+Eglise+Catholique+%281592%29%2C+Beza+defined+the+fundamental+articles+as+being+summarized+in+the+Ten+Commandments%2C+the+Apostles+Creed%2C+and+the+Lord%E2%80%99s+Prayer.+He+argued+further+that+such+fundamental+articles+such+as+the+Trinity+and+the+two+natures+of+Christ+are+essential+marks+of+the+true+Church.%E2%80%9D+%E2%80%9CDrive+toward+Protestant+Union%2C%E2%80%9D+Church+History%2C+61.3+%281992%29%2C+p.+336%2C+fn.+7+Junius%2C+Francis+%E2%80%93+Le+paisible+chrestien+ou+de+la+paix+de+l%E2%80%99Eglise+catholique%E2%80%A6+sur+les+Pseaumes+122+et+133+%28Leiden%3A+1593%29+392+pp.+no+ToC+.+1600%E2%80%99s+Jurieu%2C+Pierre+The+Authentic+System+of+the+Church+%26+a+True+Analysis+of+the+Faith%E2%80%A6+%28Dort%2C+1686%29+ToC+Jurieu+%281637-1713%29+was+a+French+reformed+minister+and+prolific+author.+Wikipedia%3A+%E2%80%9CThe+most+famous+of+the+controversies+on+this+subject+was+that+between+%5Bthe+Romanist%2C+Jacques-B%C3%A9nigne%5D+Bossuet+%5B1627-1704%5D+and+the+Calvinist+Jurieu.+Jurieu%E2%80%99s+book%E2%80%A6+%E2%80%98Le+Vray+Systeme%E2%80%99+was+an+attempt+to+demonstrate+the+right+of+the+French+Protestants+to+rank+as+members+of+the+Church+Universal%E2%80%A6+According+to+him+all+sects+without+exception+are+members+of+Body+of+Christ.+For+this+nothing+is+necessary+but+%E2%80%9Cto+belong+to+a+general+confederation%2C+to+confess+Jesus+Christ+as+Son+of+God%2C+as+Saviour+of+the+world%2C+and+as+Messias%3B+and+to+receive+the+Old+and+New+Testaments+as+the+rule+and+Law+of+Christians%E2%80%9D%2C+%28Syst%C3%A8me%2C+p.+53%29.+Yet+among+the+various+portions+of+the+Church+we+must%2C+he+tells+us%2C+distinguish+four+classes%3A+1.+Sects+that+have+retained+all+the+truths+taught+in+the+Scriptures%3B+2.+Sects+that%2C+while+retaining+the+more+important+truths%2C+have+mingled+with+them+superstitions+and+errors%3B+3.+Sects+that+have+retained+the+fundamental+truths%2C+but+have+added+doctrines+incompatible+with+them%3B+4.+Sects+that+have+set+the+fundamental+verities+aside+altogether.+This+last+class+are+dead+members+of+the+mystical+body+%28ibid.%2C+p.+52%29.+Those+who+have+retained+the+fundamental+articles+of+the+faith+are%2C+one+and+all%2C+living+parts+of+the+Church.+When+he+comes+to+define+precisely+which+doctrines+are%2C+and+which+are+not%2C+fundamental%2C+Jurieu+bids+us+fall+back+on+the+rule+of+Vincent+of+L%C3%A9rins+%5Bd.+c.+445%5D%3A+Quod+semper%2C+quod+ubique%2C+quod+ab+omnibus+%5Bthat+which+is+always%2C+everywhere+and+from+all%5D.+Wherever+all+bodies+of+Christians+still+exist+and+possess+some+importance+in+the+world%2C+and+agree+in+accepting+a+dogma%2C+we+have%2C+in+that+agreement%2C+a+criterion+that+may+be+considered+infallible.+Among+truths+so+guaranteed+are+the+doctrine+of+the+Trinity%2C+the+Divinity+of+Jesus+Christ%2C+the+Redemption%2C+the+satisfaction%2C+original+sin%2C+creation%2C+grace%2C+the+immortality+of+the+soul%2C+the+eternity+of+punishment+%28ibid%2C+236-237%29.+This+work+was+followed%2C+in+1688%2C+by+another+entitled+%E2%80%9CTrait%C3%A9+de+l%E2%80%99unit%C3%A9+de+l%E2%80%99Eglise+et+des+articles+fondamentaux%E2%80%9D%2C+written+in+reply+to+Nicole%E2%80%99s+criticisms.+In+the+same+year+appeared+Bossuet%E2%80%99s+%E2%80%9CHistoire+des+Variations+des+Eglises+protestantes%E2%80%9D%E2%80%A6+In+regard+to+the+relation+of+the+fundamental+doctrines+to+salvation%2C+Jurieu+is+in+agreement+with+the+English+divines+already+quoted.+%E2%80%9CBy+fundamental+points%E2%80%9D%2C+he+says%2C+%E2%80%9Cwe+understand+certain+general+principles+of+the+Christian+religion%2C+a+distinct+faith+and+belief+in+which+are+necessary+to+salvation%E2%80%9D+%28Trait%C3%A9%2C+p.+495%29.%E2%80%9D%0A%0A%E2%80%94+Philippe+de+Mornay%2C+Tract+on+the+Church+2nd%2C+ed.+%281578%3B+Geneva%2C+1599%29+Note+this+was+published+in+a+different+city+than+what+Klauber+cites+below.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8383eea572.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8383eea572.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=The%20French%20national%20synods%20of%20Gap,necessary%20to%20salvation%E2%80%9D%20%28Trait%C3%A9%2C%20p.%20495&amp;text=The%20French%20national%20synods%20of%20Gap%20%281603%29%20and&amp;text=which%20are%20necessary%20to%20salvation%E2%80%9D%20%28Trait%C3%A9%2C%20p.%20495" rel="noopener" ta

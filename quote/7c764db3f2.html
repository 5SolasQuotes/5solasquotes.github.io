<main class="wrap"><figure class="quote" id="q-7c764db3f2" data-kw="">
<blockquote><p>For if they only wanted” (he says of ours) “the merits of Christ to be imputed to us, because they were given to us, and we can offer them to God the Father for our sins, because Christ took upon Himself the burden of satisfying for us, and reconciling us to God the Father; their opinion would be right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism tr. by AI by Onku (1639-1642; 1668) | But the Jesuit himself in the same place, arg. 4, responds for us:</cite>, ch. 9, On Universal Redemption, on 1 Pet. 2:24, pp. 259-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-204a8a1f7f" data-kw="">
<blockquote><p>But do not Libertines teach that no man is saved, but these that walk holily, and that sanctification is the unseparable fruit and effect of justification? Answer: They say it in words, but fraudulently: 1. Because all sanctification to them, all repentance, all mortification, all new obedience is but an apprehension that Christ has done all these for them, and that is their righteousness, and so Christ repented for them and mortified sin for them, and performed all active obedience for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 321</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-f980f0e3eb" data-kw="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</span></figcaption>

</figure><figure class="quote" id="q-e52f9a1a92" data-kw="">
<blockquote><p>Rule II. That justification stands in two things: First in the remission of sins by the merit of Christ’s death: Secondly in the imputation of Christ’s righteousness; which is another action of God whereby He accounts and esteems that righteousness which is in Christ, as the righteousness of that sinner which believes in Him. By Christ’s righteousness we are to understand two things: First his sufferings, specially in his death and passion; Secondly his obedience in fulfilling the Law: both which go together: for Christ in suffering obeyed, and obeying suffered. And the very shedding of his blood to which our salvation is ascribed, must not only be considered as it is passive, that is a suffering, but also as it is active, that is, an obedience, in which He showed his exceeding love both to his Father and us, and thus fulfilled the law for us. This point, if some had well thought on, they would not have placed all justification in remission of sins as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’</cite>, p. 925</span></figcaption>

</figure><figure class="quote" id="q-35afe7c913" data-kw="">
<blockquote><p>Which [Scriptural phrases] all signify one thing: that is, his suffering in the flesh. For nowhere in the Scriptures of God is our righteousness particularly attributed to any other action of Christ. Neither can it be collected to consist in any other action, except out of the general word of ‘obedience’. Neither is there any necessity (if the matter be well weighed) to add anything to the sufferings of Christ in the matter of our righteousness. Yea moreover, it would appear by diverse grounds of the truth of God that nothing can or may be added thereunto in the matter of our righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-forbes.html">John Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 24 in A Treatise tending to Clear the Doctrine of Justification (Middelburgh: Richard Schilders, 1616), pp. 93-110</cite>, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

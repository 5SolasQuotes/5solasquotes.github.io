<main class="wrap"><figure class="quote" id="q-e34b41b393" data-kw="">
<blockquote><p>…it is impossible for the aforesaid truth of faith to be contrary to those principles which reason knows naturally…. Now, the knowledge of naturally known principles is instilled into us by God, since God himself is the author of our nature. Therefore, the divine wisdom also contains these principles. Consequently, whatever is contrary to these principles is contrary to the divine wisdom. Therefore, it cannot be from God. Therefore, those things which are received by faith from divine revelation cannot be contrary to our natural knowledge… God does not instil into man any opinion or belief contrary to natural knowledge… Yet, because it [the word of faith] surpasses reason, some look upon it as though it were contrary to reason; which is impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1 | ch. 7, ‘That the truth of reason is not in opposition to the truth of the Christian faith’</span></figcaption>

<blockquote><p>Frame takes it for granted that “worldview” is a durable, if not permanent, concept. This assumption seems unwarranted. Worldview is itself a product of modern philosophy—of Hegel’s idealism, to be precise. Frame doesn’t see an antithesis between worldview and Christianity. But that tension needs to be explored. Worldview as a concept may not even survive the passing of the modern age. If not, then Christians need to be equipped for life after worldview.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-m-gamble.html">Richard M. Gamble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>New Horizons</cite>, (March 2017), a magazine of the OPC</span></figcaption>

<blockquote><p>to children lacking the use of reason, who cannot distinguish between spiritual and bodily food, the Eucharist should not be given, although some of the Byzantines maintain the opposite, though irrationally: because actual devotion is required for the consumption of the Eucharist, which children of that age cannot have. However, once children have begun to have discretion, even before the age of maturity, for example when they are ten or eleven years old, or around then, it can be given to them, if signs of discretion and devotion appear in them… Baptized infants acquire the right to receive the body of Christ, not right away though, but at the fitting time;” (Sentences, bk. 4, dist. 9, q. 1, art. 5, resp. to Quaestiuncula 4) For the Reformed: ‘Paedocommunion’. . Contra Intinction Thomas: “Here he [Peter Lombard] considers… how it should be distributed now, at: ‘And the Eucharist is not to be given by intinction to the people ‘as a supplement of communion.”” (Sentences, bk. 4, dist. 11) On the Reformed: ‘Intinction’. . Disagreements Rome’s Supper is Not Valid &amp; is Not to be Received by Christians, or Attended apart from Necessity Needless to say, Thomas held the Roman Supper to be valid and ethically obliging to receive. The Reformed held the mass to be invalid (as it involved the formal idolatry of worshipping the creature, bread and wine), that it was sinful to receive from a priest, and that the mass ought not to be attended apart from necessity: ‘Why is Romish Baptism Valid but the Supper Not to be Received by a Romish Priest?’ ‘On the Mass &amp; Transubstantiation’ ‘On Attending the Mass’ . Only Ministers may Administer, even in “Necessity</p></blockquote>

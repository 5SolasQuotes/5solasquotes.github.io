<main class="wrap"><figure class="quote" id="q-4322decca7" data-kw="">
<blockquote><p>The way of holiness is the King’s highway to heaven. Read that notable place: ‘And a highway shall be there, and a way, and it shall be called, The Way of Holiness; the unclean shall not pass over it…’ (Isa. 35:8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sheffield.html">John Sheffield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Puritan Sermons</cite>, vol. 5, p. 436</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9aa27b38b9" data-kw="">
<blockquote><p>What is the end of our Justification? … Lastly, that we ourselves might be bettered and made righteous. Gal. 2:17, “If then while we seek to be made righteous by Christ, we ourselves are found sinners, is Christ therefore the minister of sin? God forbid.” For to this end are we justified by faith through Christ, that the old man being abolished by the power and efficacy of Christ crucified, Christ might live in us and that we should by our study and labor endeavor to bring forth good works, [and] show ourselves thankful to God for so great a benefit. And therefore it is that the apostle Paul almost in all his epistles derives the doctrine of sanctification, or good works, from the doctrine of faith or justification as the cause from the effect, or the necessary consequent from the antecedent. What are the adjuncts of Justification? … For saiys Augustine, good works do follow a man already justified, and do not go before a man that is to be justified, as good fruits are not before a good tree… The works accompanying or following it are… Moreover the adopting of us to be sons of God, our sanctification or newness of life, the fruits whereof are described, Gal. 5:22. For they that are made partakers of Christ through faith, they do with Him receive the Holy Ghost, the author of all holiness; from whence it is, that these two benefits are indeed distinguished one from another, but yet so linked together by an unseparable bond that they can never be plucked asunder; and the latter is the testimony of the former, both in the soul of the faithful man himself and to other men also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London, 1606), ch. 31, ‘Justification’, pp. 354-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-fe58df6214" data-kw="">
<blockquote><p>‘Blessed are they that do his commandments, that they may have right to the tree of life, and may enter in through the gates into the city.’ And lest we should think the commands are all but one only precept of believing, he addeth “for without are dogs and sorcerers, and whoremongers, and murderers, etc.” “He that hath my commandments, and keepeth them, he it is that loveth me, and he that loveth me shall be loved of my Father, and I will love him and manifest myself to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, (London, 1648), pt. 2, ch. 37, ‘How Good Works are Necessary’, pp. 37-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><figure class="quote" id="q-f773a7b874" data-kw="">
<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q&amp;A 86</span></figcaption>

</figure><figure class="quote" id="q-62db74b4f4" data-kw="">
<blockquote><p>We are created unto good works which God hath ordained, that we should walk in them as the elect vessels of God, not thereby to merit salvation, but to signify unto the world that we be the elect of God, who being possessed with faith, show forth the fruits of faith, which are our good works, to the example of others, that they may follow in well-doing.</p></blockquote>

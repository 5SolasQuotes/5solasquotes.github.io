<main class="wrap"><figure class="quote" id="q-4b44eb7803" data-kw="">
<blockquote><p>And as praying and hearing; so the worthy receiving of his sacraments, is not only a sealing of his grace unto us, but also a testifying of our godliness towards him. His sacraments are two in number, instituted by Christ to be received of Christians:

By the one, which is Baptism, we are received and incorporated into the Church of Christ; by the other, which is the Eucharist or Lord’s supper, we are nourished and fed unto life everlasting.

These are pledges, and assurances of remission of sins and salvation purchased by the death of Christ. These are God’s seals, added unto his most certain promises, for the confirmation of our weak faith, weak by reason of the infirmity of our flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the Most Reverend Father in God, Edwin, Archbishop of York, Primate of England and Metropolitan</cite>, (London: Henry Midleton, 1585), p. 74.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general.html">The Sacraments in General</a></span></div>

</figure><figure class="quote" id="q-a16dd689d4" data-kw="">
<blockquote><p>If any good Christian visited with long sickness and known to the pastor, by reason of his present infirmity [be] unable to resort to the church for receiving of the holy Communion, or being sick shall declare to the pastor upon his conscience that he thinks his sickness to be deadly, and shall earnestly desire to receive the same in his house: The minister shall not deny to him so great a comfort, lawful warning being given to him upon the night before, and that there be three or four [persons] of good religion and conversation, free of lawful impediments, present with the sick person to communicate with him, who must also provide a convenient place in his house and all things necessary for the reverend administration thereof, according to the order prescribed in the Church.</p></blockquote>

</figure><figure class="quote" id="q-1f85e5fd28" data-kw="intention">
<blockquote><p>(1) The personal sin of one does not injure another who does not share in it. Now the defect of intention of the minister is the personal sin of that minister. Therefore it does not injure another not partaking of it—him, namely, who is the partaker of the sacrament rightly celebrated. However, it would injure him, if from the defect of that intention, the sacrament would be made void. 2. Because there is the same relation of the sacrament as of the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.7.5</span></figcaption>

</figure><figure class="quote" id="q-78847cd3b3" data-kw="">
<blockquote><p>confirmatio: confirmation; a rite of the church viewed by the medieval doctors and by the Roman Catholic Church as a sacrament, but denied sacramental status by the Reformers and the Protestant scholastics on the ground that it does not rest on a command of God (see sacramentum). Nevertheless, both the Lutheran and Reformed orthodox view confirmatio, rightly conceived and performed, as a useful and edifying support of piety. Children baptized in infancy should receive formal instruction in the faith when they have reached an age of discretion. After this instruction they may come publicly before the bishop or pastor in order to make a profession of faith and receive the support of the church’s prayers and of the nonsuperstitious laying-on of hands. Such a rite coincides with the teaching of Scripture and the ancient custom of the Church. Since, moreover, it is an act of piety and edification and not a sacrament or means of grace, the Protestant scholastics note that it is in no way a completion of baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Greek and Latin Theological Terms 1st</cite></span></figcaption>

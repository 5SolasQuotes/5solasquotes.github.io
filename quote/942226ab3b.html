<main class="wrap"><figure class="quote" id="q-942226ab3b" data-kw="">
<blockquote><p>But what ought to be clearly observed is that Covenant of Works or Covenant of Life did not offer “salvation.” The word “salvation” implies something from which one is saved. Adam was not lost when that Covenant of Life was given him. On the contrary he had knowledge, righteousness and holiness. The Covenant of Works was not given as a way by which a sinner might get rid of his sin and merit eternal life. Neither was the Mosaic Law given for any such purpose. It was not given to present, even hypothetically, a way by which a sinner, already eternally under the condemnation of sin, could by future perfect obedience merit the favor of God. And Dr. Charles Hodge surely does not regard it as given for any such purpose. The root error, or one of the many root errors of the Dispensationalism of the Scofield Bible seems to me to be the utter failure to recognize and make central the fact of the Fall of man. I know that there are salutary inconsistencies in the Scofield Bible. I know that in the notes on the fifth chapter of Romans there is taught, not indeed the orthodox doctrine of imputation, but still some recognition of the universal corruption that has come from Adam’s sin. But by what a back-door even that much of the central Biblical teaching is brought in! As one reads Dr. Scofield’s notes one does not for the most part get the slightest inkling of the fact that anything irrevocable took place when Adam fell. After his Fall man continued to be tested in successive dispensations. See for example the definition of a dispensation which Dr. Scofield gives at the beginning. That is one of the things that seems to me to be so profoundly heretical in this commentary. It is contrary to the very heart of the Augustinian and Calvinistic view of sin. According to that view — and surely according to the Bible — the guilt of Adam’s first sin was imputed to his posterity. Adam being by divine appointment the representative or federal head of the race. Thus all descended from Adam by ordinary generation are guilty. They are guilty before they individually have done anything either good or bad. They are under the penalty of sin when they are born. Part of that penalty of sin is hopeless corruption, from which, if there is growth to years of discretion, individual transgressions spring. How utterly absurd would it have been therefore for God to offer the Mosaic Law, to such an already condemned and fallen race, as something which, if only obeyed by that already condemned and fallen race, would bring salvation and eternal life! Thus Dr. Scofield’s view of the Mosaic Law is rooted in a wrong view of sin — a wrong view which is against the very heart and core of the Reformed Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to J. Oliver Buswell, October 19, 1936.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2fcae9d028" data-kw="">
<blockquote><p>In the earliest times, “the Holy Ghost fell upon them that believed: and they spake with tongues,” which they had not learned, “as the Spirit gave them utterance.” These were signs adapted to the time. For there behooved to be that betokening of the Holy Spirit in all tongues, to show that the Gospel of God was to run through all tongues over the whole earth. That thing was done for a betokening, and it passed away. In the laying on of hands now, that persons may receive the Holy Ghost, do we look that they should speak with tongues? Or when we laid the hand on these infants, did each one of you look to see whether they would speak with tongues, and, when he saw that they did not speak with tongues, was any of you so wrong-minded as to say, These have not received the Holy Ghost; for, had they received, they would speak with tongues as was the case in those times? If then the witness of the presence of the Holy Ghost be not now given through these miracles, by what is it given, by what does one get to know that he has received the Holy Ghost? Let him question his own heart. If he love his brother, the Spirit of God dwelleth in him.</p></blockquote>

</figure><figure class="quote" id="q-f130a1ffdf" data-kw="">
<blockquote><p>One hopes that reviews like this will become a thing of the past, as neo-Calvinist anxieties about the Protestant retrieval of 17th century Reformed thought subside. Retrieval has increasingly revealed that, despite the diversity in the doctrinal development of the 17th century, the distinctives of neo-Calvinism have no place in that diversity, nor could they arise logically from that diversity. Reformed theology, from Calvin to the 19th century, was thoroughly “dualistic” – affirming distinctions between natural/supernatural, nature/grace, reason/faith, temporal/eternal, earth/heaven, and secular/sacred. Reformed theology did not reject these medieval categories as popish errors, let alone as paganistic. They incorporated them in their theological systems, modifying them as they saw fit, and these became essential to their system’s coherence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-wolfe.html">Stephen Wolfe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Correcting Theologians: A Response to Brian Mattson’ (2023)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“One hopes that reviews like this will become a thing of the past, as neo-Calvinist anxieties about the Protestant retrieval of 17th century Reformed thought subside. Retrieval has increasingly revealed that, despite the diversity in the doctrinal development of the 17th century, the distinctives of neo-Calvinism have no place in that diversity, nor could they arise logically from that diversity. Reformed theology, from Calvin to the 19th century, was thoroughly “dualistic” – affirming distinctions between natural/supernatural, nature/grace, reason/faith, temporal/eternal, earth/heaven, and secular/sacred. Reformed theology did not reject these medieval categories as popish errors, let alone as paganistic. They incorporated them in their theological systems, modifying them as they saw fit, and these became essential to their system’s coherence.”

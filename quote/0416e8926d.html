<main class="wrap"><figure class="quote" id="q-0416e8926d" data-kw="">
<blockquote><p>…some, upon designs best known to themselves, have projected, and (as we have the charity to believe) ensnared others to join with them in a Petition, for making void and abolishing all civil Sanctions establishing the Doctrine, Discipline, and Government of this Church (the fruits of the many prayers and sad sufferings of the Godly in this and former ages) that so they may enjoy a vast Toleration and encouragement in embracing vilest errors, which they are pleased to set off under the specious names of just Liberties and Gospel-privileges.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/presbytery-of-edinburgh.html">Presbytery of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Testimony &amp; Warning of the Presbytery of Edinburgh Against a Late Petition tending (in the Scope &amp; Design thereof) to the Overturning of the Ordinances &amp; Truth of Christ in this Church’ (1659) at TrueCovenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“…some, upon designs best known to themselves, have projected, and (as we have the charity to believe) ensnared others to join with them in a Petition, for making void and abolishing all civil Sanctions establishing the Doctrine, Discipline, and Government of this Church (the fruits of the many prayers and sad sufferings of the Godly in this and former ages) that so they may enjoy a vast Toleration and encouragement in embracing vilest errors, which they are pleased to set off under the specious names of just Liberties and Gospel-privileges.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-28c3555c70" data-kw="">
<blockquote><p>5. Also, there is a difference between the constraining of a circumcised or baptized people to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized which were not formerly engaged; because, actual members of a Church have not even that liberty as others have to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal... (Edinburgh: Higgins, 1659), pt. 3, ch. 4</cite>, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-0ca8881730" data-kw="">
<blockquote><p>Yea, Dr. Ursinus, in his Judicium de Disciplina Ecclesiastica et Excommunicatione, exhibited to the Prince Elector Palatine Frederick III (who had required him to give his judgment concerning Erastus’ theses), does once and again observe, that all the reformed churches and divines, as well as those that did not practice excommunication as those who did practice it, agree, notwithstanding, in this principle, that excommunication ought to be in the church; which is a mighty advantage against Erastianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Judgment Concerning Ecclesiastical Discipline &amp; Excommunication 1569 17 pp. in Works, vol. 3</cite>, pp. 801-18</span></figcaption>

</figure><figure class="quote" id="q-3a5a622bb0" data-kw="">
<blockquote><p>1. We do not question the duty of obeying the king and all his officers, governing as magistrates by the power of the swords which the king may commit to them. If bishops or lay-chancellors be made magistrates, we will obey them as such: And therefore when they summon us, we appear and answer, because the king authorizes them. And many non-conformists have defended the taking the promise [of canonical obedience to a bishop or ordinary in things lawful and honest] as supposing that the word ‘ordinary’ signifies only the judge of a court set up by the king as supreme governor by the sword in matters and over persons ecclesiastical as well as civil, according to the true sense of the Oath of Supremacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689) The preface is dated 1683.</cite>, ch. 6, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

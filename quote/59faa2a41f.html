<main class="wrap"><figure class="quote" id="q-59faa2a41f" data-kw="">
<blockquote><p>Finally, in the Difference of the Definition is mentioned its End; the supreme End of Revealed Theology is the Glory of God; which He set before Himself in all His works, Proverbs 16:4, but especially in Redemption, 1 Peter 2:9, and its doctrine, Ephesians 3:10, even as Redemption and its doctrine show forth most perfectly the Glory of God, through a demonstration of His highest attributes.

The subordinate End is the Salvation of the Elect, John 20:31; Titus 1:2. Because, of course, in the Salvation of the Elect the Attributes of God shall be most gloriously manifested, and shall be most perfectly acknowledged and celebrated forever by Those Saved, 2 Thessalonians 1:10; hence the Salvation of the Elect shall be as advantageous as possible to the Glory of God as the supreme End; and hence the whole work of Redemption has subordinate End, the leading of the Elect unto Salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 36, p. 243.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b0e021c59" data-kw="">
<blockquote><p>That, however, of which it now consists (for it must not be called immaterial) is corporeal substance. For it will be, and in part already is, the ordinary place of glorified bodies, Jn. 14:2-3; 17:24. It was visibly opened, Mt. 3:16; Acts 7:56, and was passed through by Christ ascending, Eph. 4:10. It also has its own magnitude, Jn. 14:2-3. Meanwhile, we maintain that this substance is most subtle, most lucid, and subject to no corruption, on the ground of the places: 1 Tim. 6:16; Rev. 21-22. The position of this heaven is uppermost and outermost, above all visible heavens, Dt. 4:39; Lk. 2:14; Eph. 4:10. Its circuit, moreover, is most capacious, Jn. 14:2-3.</p></blockquote>

<blockquote><p>There are two main views. One of them has come to be called corruptionism, and it holds that at death the human being ceases to exist (unless and until God resurrects him), even though the soul carries on. The other view is called survivalism, and it hold that the human being persists in existence after death and even before any resurrection, though only as constituted by his soul… …the position I favor is the survivalist one. For I have said that after death the human being persists, albeit in a severely reduced or incomplete state. Now the survivalist view is characterized as the view that after death but before the resurrection, the soul constitutes the human being… a form qua [as] form exists only together with the substance of which it is the form. However, since the substance of which the human soul is the form is not entirely coporeal, that substance subsists and continues beyond the death of the body because the death of the body involves the cessation of only the corporeal aspect of said substance, not the incorporeal aspect. Hence, because the substance that the human soul is the form of persists beyond the death of the body, the soul persists beyond the death of the body… this thing that exists beyond the death of the body is also a substance–albeit an incomplete one–and, since this incomplete substance just is the human being in a radically impaired state, it is quite natural to say that the soul that survives death just is the human being surviving death (again, in a radically incomplete state)… …For the corruptionist position holds, again, that at death the human being cease to exist, even though the soul carries on. Yet the human being is the substance of which the soul is a form. So, if the human being ceases to exist at death, then that means that the substance of which the soul is the form ceases to exist at death. And in that case, how could the soul carry on? How could a form exist apart from the substance of which it is the form?… There are two further important arguments for survivalism, one philosophical and one theological. The first is this… just as it is the human being who sees, and not the eye, it is the human being who thinks, and not the intellect. The eye sees only in a loose sense, and the intellect thinks only in a loose sense. Now, on both the survivalist view and the corruptionist view, the intellect survives the death of the body and thought occurs as well. But if thought occurs and if on Aquinas’s own principles it is strictly speaking only the human being, and not the intellect, which thinks, then it follows that there must be a sense in which the human being survives as well. The second, theological argument is this. Being a Christian theologian, Aquinas holds that, after death, the soul is rewarded, punished, or purged in light of the deeds of this present life. But it makes sense to reward, punish, or purge only perons, not mere parts of persons. It makes no sense, for example, to speak of rewarding or punishing Bob’s foot or hi pancreas for Bob’s good or bad deeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, pp. 497-502 in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 11</span></figcaption>

<blockquote><p>The good that springs forth from this peace [of the gospel] means blessedness. Philosophers have tried in different ways to find this good, though they have never been able to, because they, being devoid of the light of the gospel and the eyes of faith, have neither been able to recognize in themselves the supreme good of the eternal inheritance obtained through Christ’s blood, nor their original leprosy, nor the guilt of eternal death, two distinct evil diseases in contrast with this supreme good, nor have been able to find the right remedy for both diseases outside of themselves in the atoning offering of Christ for our sins.</p></blockquote>

<blockquote><p>The twelfth subject of Meditation. Meditate of hell. 1. Meditate upon the pain of loss, Mat. 25.10. and the door was shut. To have Christ’s face veiled over, and a perpetual eclipse, and mid-night in the soul, to be cast out of God’s presence, in whose presence is fullness of joy, this doth accent and embitter the condition of the damned; ’tis like mingling gall with wormwood.

2. Meditate upon the pain of sense; the Photinians hold there is no hell, but they speak in a dream, Psalm 9.17. The wicked shall be turned into hell. And here meditate of two things.

1. The place of hell.

2. The company.

1. Meditate of the place of hell. ‘Tis called a place of torment, Luke 16.28. There are two things especially in hell to torment.

2. Fire, Revel. 20.15. ‘Tis called a lake of burning fire, Austin, Peter Lombard, Gregory the Great, say, this fire of hell is a material fire, though they say it is infinitely hotter than any culinary fire; that is but painted fire to this. I wish none of us may know what kind of fire it is, but I rather think, the fire of hell is partly material, and partly spiritual; the material fire is to work upon the body, the spiritual to torture the soul. This is the wrath of God, which is both fire and bellows, who knows the power of thy anger, Psalm 90.11.

But it may be objected, if there be any material fire in hell, it will consume the bodies there? I answer, it shall burn without consuming, as Moses bush did, Ex. 3.2. The power of God silenceth all disputes. If God by his infinite power could make the fire of the three children not to consume, cannot he make the fire of hell burn and not consume? Austin in his book, de civitate Dei, tells us of a strange salt in Sicily, which if it be put in the fire swims; That God which can make salt, contrary to its nature, swim in the fire, can make the bodies of the damned not consume in the fire.

2. The worm, Mark 9.44. Where the worm never dies, Homer in his Odisses fains, that Titius his liver was gnawn by two vultures in hell. This never-dying worm Christ speaks of, is the gnawing of a guilty conscience. Melanchthon calls it Erynnis conscientiae; an hellish fury, Siculi non invenere tyranni tormentum majus,—they that will not hear conscience preaching, shall feel conscience gnawing; and so great is the extremity of these two, the fire which burns, and the worm which bites, that there will follow gnashing of teeth, Mat 8.12. the damned will gnash their teeth for horror and anguish. That must needs be sad cheer (as Latimer saith) where weeping is served in for the first course, and gnashing of teeth for the second: to endure this will be intolerable, to avoid it will be impossible.

3. Meditate of the company in hell, the devil and his Angels, Matth. 25.41. Job complains he was a companion to owls, chap. 30.29. What will it be to be a companion to devils? Consider, 1. Their ghastly deformity, they make hell look blacker. 2. Their deadly antipathy; they are fired with rage against man-kind; first they become tempters, then tormentors.

Meditate much on hell. Let us go into hell by contemplation, that we may not go into hell by condemnation. How restless is the condition of the damned; The ancients fain of Endymion, that he got leave of Jupiter always to sleep. What would the damned in hell give for such a Licence? in their pains is neither intermission, nor mitigation.

The serious meditation of hell, would make us, 1. Fear sin as hell. Sin is hell’s fuel; sin like Sampson’s foxes, carries devouring fire in the tail of it.

2. The meditation of hell would cause rejoicing in a child of God. The Saints fear of hell is like the two Marie’s fear, Matth. 28.8. They departed from the Sepulchre with fear and great joy. A believer may fear to think of the place of torment, but rejoice to think he shall not come into this place. When a man stands upon a high rock, he trembles to look down into the sea, yet he rejoiceth that he is not there struggling with the waves. A child of God, when he thinks of hell, he rejoiceth with trembling. A Prison is not made for the King’s sons to be put in.

A great Naturalist observes that nothing will so soon quench fire as salt and blood; sure I am, the salt brinish tears of repentance, and the blood of Christ will quench the fire of hell to a believer. Christ himself hath felt the pains of hell for you. The Lamb of God being roasted in the fire of God’s wrath, by this burnt-offering the Lord is now appeased towards his people. Oh how may the godly rejoice. There’s no condemnation to them that are in Christ, Rom. 8.1. When the Son of God was in the furnace, Dan. 3.25. the fire did the three children no hurt; so Christ being for a time in the fiery furnace of God’s wrath, that fire can do a believer no hurt. The Saints have the garment of Christ’s righteousness upon them, and the fire of hell can never singe this garment.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-089a20e32e" data-kw="">
<blockquote><p>Each creature is limited by place, though spirits do not fill up a place† by commensuration of parts, yet they have a certain compass (as I may call it) beyond which their essence extends not: they are so here that they are not there; so in heaven, that they are not the same time on earth. † The angels are in an ubi [where] though not in a place properly; in English we cannot so well distinguish these words: they are limited and confined to some space; an angel cannot be at the same time in heaven and earth. But God is altogether above place, he is omnipresent, not by any material extension, but after an incomprehensible and unexpressible manner. He is quite above all place, wholly without and within all and every place, and that without all local motion or mutation of place. He is every where totally and equally…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal</cite>, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4</cite>, p. 462</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><figure class="quote" id="q-636b608490" data-kw="">
<blockquote><p>The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 1, bk. 1, ch. 11, section 3</cite>, pp. 122-23</span></figcaption>

</figure><figure class="quote" id="q-75e6fff963" data-kw="">
<blockquote><p>Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of… John Corbet… (London: Parkhurst, 1684), Of Divine Worship, 2nd Part, section 18</cite>, p. 205</span></figcaption>

</figure><figure class="quote" id="q-df026d6c02" data-kw="">
<blockquote><p>There is no created holiness sure, stable, and perfect in itself: The glorious angels which are, and ever shall be saints in Heaven, and the saints in Heaven who are like angels, stand not in that holy and happy estate by their own sufficiency, but by the decree and grace of God. Those angels which fell at first were holy, and they who now stand, might have fallen notwithstanding their created holiness, if God had not superadded confirming grace which establishes them forever. Yet this is not all, that the angels are imperfect because they might fall if not supported, there is somewhat more in it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job… (London: 1650), sermon on Job 15:15</cite>, pp. 62-63</span></figcaption>

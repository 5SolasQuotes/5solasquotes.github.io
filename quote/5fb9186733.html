</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-039d0d1ff8" data-kw="">
<blockquote><p>But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; and when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this [absolute, necessary, passive] submission [to erroneous Church decisions] which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny, because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, it being for matter God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: a Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (1658)</cite>, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-41deb671e7" data-kw="">
<blockquote><p>Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful. How then shall I acquiesce in their sentence? How can my conscience certainly determine, so as to leave no room for my faith to waver, that whatever they may pronounce is true? This is surely to leave no difference between God and men. For I believe what God says to be true, because he says it, and seek no other reason; but when I hear scripture saying that “all men are liars,” I dare not ascribe so much to man, lest I make him equal to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, q. 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-c81ef37003" data-kw="">
<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches, and Gregory de Valentia, as I show[ed] before (supra, Question 6 of this treatise), when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo, it [the Church’s judgment] cannot remove my doubting and beget faith; and also the conscience is so much the bolder to venture on a sin against God for fear of eschewing a sin against men, which is questionable, and [that] in a matter indifferent; this is also the stout conscience of Bonaventura (2 Sentences, dist. 39), plus est standum praecepto Praelati quam conscientiae. 7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646) | Appendix, ‘An Introduction to the Doctrine of Scandal’, Question 4</cite>, p. 43</span></figcaption>

</figure><figure class="quote" id="q-624feea60c" data-kw="">
<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that. In reference to which, these things are to be adverted to: 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word, going before, or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament... (1659), pt. 2, ch. 2</cite>, p. 69</span></figcaption>

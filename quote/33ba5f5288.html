<main class="wrap"><figure class="quote" id="q-33ba5f5288" data-kw="">
<blockquote><p>It is well cleared by the Schoolmen, That those relations which are attributed to God in time, as a Creator, Father, or Lord, are not because of any new thing in God, but in respect of the creatures; so that when the world is created, when a man is justified, we say, God who was not a Creator before, is a Creator, who was not a Father by grace, is now by grace; not because any new accident is in him, but because there is a new effect in the creatures. Thus, if a man once the child of wrath, be now a son of God’s love, the change is not in God, but in the creature.

For the better clearing of this, we are to take notice in the fourth place, That it is one thing, as Aquinas observeth, Mutare voluntatem, to change the Will; and another thing, Velle mutationem, to Will a change. By the same unchangeable Will, we may Will several changes in an Object. As the Physician without any change of his Will, may will his Patient to take one kind of Physick one day, and another the third: here he wills a change, but doth not change his Will. Thus God with the same Will, decreed to permit in time such an elect man to be in a state of sin, under the power of Satan, and afterwards to call him out of this condition, to justify his person; here indeed is a great change made in the man, but none at all in God.

There is no new act in God, which was not from all Eternity, though every effect of this love of God was not from Eternity, but in time. Hence when our Divines argue against Arminians, That if the Saints should apostatize, God’s love would be changeable, it is meant of God’s love of Election, which is an absolute purpose and efficacious will to bring such a man to glory: now although such a decree was free, and so might not have been; yet ex hypothesi, supposing God hath made this decree, it doth very truly follow, That if that Saint should not be brought to glory, God would be changeable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 192.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82db385220" data-kw="">
<blockquote><p>Mercy is, God willing, to succor the creature in misery. Mercy in God is either essential: namely that which is in Him by necessity of nature, and had been in Him though He had never willed the manifestation thereof by showing mercy to any; this is God’s sufficiency to show mercy. Or, Relative, namely, that which is in Him with respect to the creature, and is his will to manifest mercy to whom He pleases; Ex. 33:19; Rom. 9:18. Mercy is increated, viz. the attribute of God: or created, viz. a transient act of God in time, or the effects of such transient acts: so vocation is said to be an act of mercy, Rom. 11:30, 32; 1 Pet. 2:10. Remission of sin, Lk. 1:78; Mt. 18:33; Salvation, Jud. 21. Increated mercy is God’s will to show mercy. Created mercy is God’s actual showing mercy according to his will. The effects of mercy are either special: proper to the elect, as flowing from special grace, Rom. 9:23. The elect are called (and by effectual calling so made) vessels of mercy. Or common, extended to those who are not elected, Lk. 6:35-36. Unto the beasts of the field, Ps. 104:27; Yea, over all his works, Ps. 145:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, ... (London: 1654), ch. 1, Of the Divine Essence, p. 14</span></figcaption>

</figure><figure class="quote" id="q-fd11d9c75c" data-kw="">
<blockquote><p>There is no composition in God, neither Physical, nor Logical, nor Metaphysical; because in him there is no priority nor posteriority, as in composition where the compositum is posterior to the parts compounding.

2. In composition there is act and possibility; but God is all act.

3. In composition the parts differ from the compositum; but in God there is no difference.

4. There is no composition in form; but God is a most simple form.

5. Whatsoever is compounded hath a cause of that composition; but in God there is no cause.</p></blockquote>

</figure><figure class="quote" id="q-906ec32c7c" data-kw="">
<blockquote><p>This comes in here as a token of God’s displeasure at those who married strange wives; He threatens to withdraw from them his Spirit, whom they had grieved by such marriages, contrary to their convictions: fleshly lusts are often punished with spiritual judgments, the sorest of all judgments. Or as another occasion of the great wickedness of the old world; the Spirit of the Lord, being provoked by their resistance of his motions, ceased to strive with them, and then all religion was soon lost among them. This He warns them of before, that they might not further vex his Holy Spirit, but by their prayers might stay Him with them. Observe in this verse, I. God’s resolution not always to strive with man by his Spirit. The Spirit then strove by Noah’s preaching (1 Pt. 3:19–20) and by inward checks, but it was in vain with the most of men; therefore, says God, He shall not always strive. Note, 1. The blessed Spirit strives with sinners, by the convictions and admonitions of conscience, to turn them from sin to God. If the Spirit be resisted, quenched, and striven against, though He strive long, he will not strive always, Hos. 4:17. Those are ripening apace for ruin whom the Spirit of grace has left off striving with. II. The reason of this resolution: For that he also is flesh, that is, incurably corrupt, and carnal, and sensual, so that it is labor lost to strive with him. Can the Ethiopian change his skin? He also, that is, All, one as well as another, they have all sunk into the mire of flesh. Note, 1. It is the corrupt nature, and the inclination of the soul towards the flesh, that oppose the Spirit’s strivings and render them ineffectual. When a sinner has long adhered to that interest, and sided with the flesh against the Spirit, the Spirit justly withdraws his agency, and strives no more. None lose the Spirit’s strivings but those that have first forfeited them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 6:3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9a5a5dc267" data-kw="">
<blockquote><p>The supporters of this Seminary are thorough and sound Presbyterians. No uncertain note is given from the pulpits of the alumni of this institution. The directors believe that the students graduated from this Seminary will be, theologically, largely what you make them. Therefore, we believe your teaching must be dogmatic. Your philosophy and your metaphysics will be great contributions to the power of your teaching. But, after all, our theology is not based on secular philosophy or modern psychology but on the Word of God, as contained in the Holy Scriptures, — described in our Confession as the only infallible rule of faith and practice.

Therefore, we expect the students to be taught with a fire of conviction, which cannot help leaving its impression upon them, so that your teaching will not seem to be the abstract discussion of a man who has only half thought his subject through: “Ever learning, but never coming to a knowledge of the truth”. But rather that kind of teaching which presents the result of the teacher’s own labours as he builds his system of theology on the eternal truth of God, revealed by him in our infallible Scriptures.

Such a teacher translates his theological science for his students — not alone correlating great theological principles or distinguishing the Biblical and professional teaching from erroneous views; but while it will be teaching of the highest scholarship, it will gain power — constructive power — by reason of the teacher’s own experience in the application of these great truths to his own soul. This, I believe, is what makes great theological teachers. It was this that made more than one of your distinguished predecessors what they were, and it is this that produces in our ministry men who are not dabblers in theology, but constructive defenders of our Presbyterian doctrinal heritage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maitland-alexander.html">Maitland Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charge to Dr. Snowden in Bulletin of the Western Theological Seminary</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c99f9d01df" data-kw="">
<blockquote><p>ENGLISHMEN and Americans frequently use the word “sensualist” to describe one in whom the animal appetites are predominant. We shall see that it is a just charge against the Sensualistic philosophy, that it not seldom inclines its advocates to this dominion of beastly lusts. But it is not from this fact that we draw the phrase by which we name it.

The Sensualistic philosophy is that theory, which resolves all the powers of the human spirit into the functions of the five senses, and modifications thereof. It is the philosophy which finds all its rudiments in sensation. It not only denies to the spirit of man all innate ideas, but all innate powers of originating ideas, save those given us from our senses. It consequently attempts to account for every general and every abstract judgment, as an empirical result of our sensations, and consistently denies the validity of any à priori ideas. Such was the philosophy which was dominant in France at the close of the eighteenth century; and which, untaught by the frightful results it produced there, is now striving again to establish its dominion among us towards the close of the nineteenth age. …

Let it then be understood, that the philosophy which I maintain against the Sensualistic, or exclusively empirical, and which has just been described, shall be called the Rational. It holds that the human intelligence is not a bundle of organs, but a pure spirit; it asserts for man a Reason, and not merely senses and their modifications.

In the eighteenth century, the Sensualistic philosophy appeared under many phases; it does so again in the nineteenth. But it always has its characteristic traits, and carries its own dangers to truth, virtue, and happiness. One attempt of this criticism of it will be to show that it always involves tendencies to erroneous logic, vitiating even the physical sciences, which it is wont to claim as its peculiar clients; to universal scepticism; to idealism; to nihilism; to the obliterating of moral distinctions, and the destruction of moral responsibility; to materialism; to a denial of the supernatural; and thus, to atheism.

Let us be understood: we do not charge that every Sensualistic philosopher holds to all these results, or approves them; we charge that they are all latent in the system, and that one or another of them is continually making itself patent in the outgrowth of this philosophy. Of this, one of the most instructive proofs is the historical; for there “the tree is known by its fruits.” We shall, therefore, prepare the way for the stricter criticism, by a brief, but perspicuous review of the chief movements of Sensualism, especially in our own age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sensualistic Philosophy of the Nineteenth Century, Considered</cite>, (New York: Anson D. F. Randolph &amp; Company, 1875), pp 1, 2-3.</span></figcaption>

</figure><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665; 2024) at Translationes Lyncei</span></figcaption>

<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?”

— Augustine of Hippo, City of God, bk. 11, ch. 26 in NPNF1 2.220">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+we+both+are%2C+and+know+that+we+are%2C+and+delight+in+our+being%2C+and+our+knowledge+of+it.+Moreover%2C+in+these+three+things+no+true-seeming+illusion+disturbs+us%3B+for+we+do+not+come+into+contact+with+these+by+some+bodily+sense%2C+as+we+perceive+the+things+outside+of+us%E2%80%94colors%2C+e.g.%2C+by+seeing%2C+sounds+by+hearing%2C+smells+by+smelling%2C+tastes+by+tasting%2C+hard+and+soft+objects+by+touching%E2%80%94of+all+which+sensible+objects+it+is+the+images+resembling+them%2C+but+not+themselves+which+we+perceive+in+the+mind+and+hold+in+the+memory%2C+and+which+excite+us+to+desire+the+objects.+But%2C+without+any+delusive+representation+of+images+or+phantasms%2C+I+am+most+certain+that+I+am%2C+and+that+I+know+and+delight+in+this.+In+respect+of+these+truths%2C+I+am+not+at+all+afraid+of+the+arguments+of+the+Academicians%2C+who+say%2C+%E2%80%98What+if+you+are+deceived%3F%E2%80%99+For+if+I+am+deceived%2C+I+am.+For+he+who+is+not%2C+cannot+be+deceived%3B+and+if+l+am+deceived%2C+by+this+same+token+I+am.+And+since+I+am+if+I+am+deceived%2C+how+am+I+deceived+in+believing+that+I+am%3F+for+it+is+certain+that+I+am+if+I+am+deceived.+Since%2C+therefore%2C+I%2C+the+person+deceived%2C+should+be%2C+even+if+I+were+deceived%2C+certainly+I+am+not+deceived+in+this+knowledge+that+I+am.+And%2C+consequently%2C+neither+am+I+deceived+in+knowing+that+I+know.+For%2C+as+I+know+that+I+am%2C+so+I+know+this+also%2C+that+I+know.+And+when+I+love+these+two+things%2C+I+add+to+them+a+certain+third+thing%2C+namely%2C+my+love%2C+which+is+of+equal+moment.+For+neither+am+I+deceived+in+this%2C+that+I+love%2C+since+in+those+things+which+I+love+I+am+not+deceived%3B+though+even+if+these+were+false%2C+it+would+still+be+true+that+I+loved+false+things.+For+how+could+I+justly+be+blamed+and+prohibited+from+loving+false+things%2C+if+it+were+false+that+I+loved+them%3F+But%2C+ <blockquote><p>In more modern systems of theology published on the continent, and especially in Germany, it is common, in order to exhibit a rigidly and minutely accurate method, and to follow out fully the idea that a system of Christian theology is just a systematic exposition of the information actually contained in or deducible from the Bible itself, to introduce a summary of the evidences of Christianity, and of the divine authority of the sacred Scriptures, under the designation of prolegomena, or præcognita, or præcognoscenda; while with that strong tendency to divide and subdivide by which the Germans especially are distinguished, they have given to this subject, viewed by itself and apart from its relation to systematic divinity, the special designation of apologetic theology, to indicate that it comprehends everything connected with the defence of the claims which Christianity and the Bible put forth to be received as coming from God.

This naturally occupies the first place in a course of theological study, both because the question, whether God has given a direct and supernatural revelation of himself to men, obviously occurs whenever men’s thoughts are directed to the contemplation of God, and because it is only a conviction of the divine origin of Christianity and the Bible that will lead men to examine the Scriptures in a right spirit, and with right objects, and to make a right use of the information which they contain.</p></blockquote>

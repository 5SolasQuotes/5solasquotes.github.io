<blockquote><p>because they had not freedom to retract their Protestation, and profess their sorrow for it, two sinful terms of ministerial communion have been imposed: 1. That no minister of this Church should testify from the pulpit against acts of Assembly, and proceedings of Church judicatories, even though they were such as had a direct tendency to undermine our constitution. 2. That no minister or member of this Church should protest, for their own exoneration, against acts, sentences, or decisions of the supreme judicatory, even though they should nearly affect the public cause of God and restrain ministerial freedom and faithfulness in testifying against the sins and defections of a backsliding Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-11fa616f61" data-kw="">
<blockquote><p>I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton [was 39-40 years old], who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world; but it is straight before me, and I firmly resolve, if the Lord will, to give a more distinct account of the rise, steps, and unheard-of heights of all the right-hand extremes that have been in Scotland these 49 years, past and present; and set them up as beacons to the following ages, to beware of splitting upon such dangerous rocks. … But it is plain that these formed, divided parties of Dissenters are so puffed up with a frothy conceit of themselves and their actings, that they speak and write with, as if religion, zeal and faithfulness, wit and sense, would live and die with them; and none [other are held] to know anything of the times, nor what Israel ought to do, disdaining, disesteeming, disregarding, rash and harsh constructing of all who differ from, or oppose, them or their way of managing of a testimony; the very reverse of a gospel spirit. And I am sadly confirmed, by the many, long, melancholly debates these 48 years, of the truth of this spiritual pride rampant amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols</cite>, ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript, pp. 138-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-38d43ec2b4" data-kw="">
<blockquote><p>But that is expressly restricted to that broken and declining state of the Church, Informatory Vindication, page 73, and tantum pro tempore [so far as the time], while they continued in that course, Testimony, page 30. Now the ministry of these with whom we are pleading to unite [the established Church of Scotland in 1690], is not so circumstantiated; it is not subject to strange lords, nor have they any holding, new or old upon any usurped power; nor are they by any confederacy servants of men: nor is our hearing of them a submitting unto any encroachment made upon the privileges of this Church, or liberties of this kingdom… But as that is restricted to the then broken and declining state in three several repetitions, Informatory Vindication, page 74 and 76. So now it cannot be applied to the generality of the present ministers, who now neither condemn the then testimony in their preaching, nor if they did in some things differ from it, would it be a sufficient ground of withdrawing, when that now is not the testimony, and they are faithful in the present testimony againft Popery, Prejacy, Erastianism and tyranny, etc… But whatever might be said for justifying that then in that broken and declining state of the Church, page 78, when these compliances were snares and stumbling-blocks persisted in and defended, that cannot be an argument now for withdrawing from all these compliers, when now the Church is not so declining but recovering her freedom from fetters, when now these cease to be snares and stumbling-blocks, when they are not persisted in, seeing also all these compliances are not alike, nor do they all deserve deposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was settled anno 1689 and 1690</cite>, … (1706; Edinburgh: Gray, 1747), pp. 29-31</span></figcaption>

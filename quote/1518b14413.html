<main class="wrap"><figure class="quote" id="q-1518b14413" data-kw="">
<blockquote><p>For from these things Christ is known, since to know Christ means to know his benefits, and not as they teach, to reflect upon his natures and the modes of his incarnation. For unless you know why Christ put on flesh and was nailed to the cross, what good will it do you to know merely the history about him?</p></blockquote>

<blockquote><p>They usurp the divinity and office of Christ. The effect is the same as if they said, &quot;I am Christ; I am a Savior. I save myself and others.&quot; This is the impression the monks give out. The Pope is the Antichrist, because he is against Christ, because he takes liberties with the things of God, because he lords it over the temple of God.</p></blockquote>

</figure><figure class="quote" id="q-0496af17d0" data-kw="Mary Queen of Heaven Mediator King Invocation of saints">
<blockquote><p>As Christ alone is our mediator and redeemer, none of the saints nor even the most blessed virgin Mary (even though we recognize her as the most blessed among women and praiseworthy above all others as the mother of God) may be called mediators between God and men. Nor is it to be assigned to Mary to be the queen of heaven with lordship over all creatures, which is the province of Christ alone.</p></blockquote>

</figure><figure class="quote" id="q-fecc17f84e" data-kw="Mary Mediator Invocation of saints Idolatry">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>

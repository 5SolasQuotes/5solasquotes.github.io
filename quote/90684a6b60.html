<main class="wrap"><figure class="quote" id="q-90684a6b60" data-kw="">
<blockquote><p>12. They [congregationalist puritans] hold that if any member of the congregation having committed a scandalous sin, shall of self forsake the worship of God and the spiritual communion with the Church, that the Church shall then send for the said person, and if he refuse to come they shall (after much seeking and long patience) openly declare that he has no part nor portion in the holy things of God among them; that then the ecclesiastical officers have no authority or jurisdiction over him, but only the civil magistrate, and those unto whom he owes civil subjection, as parents, masters, landlords, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English [Congregationalist] Puritanism, containing the Main Opinions of the Rigidest Sort of Those that are Called Puritans [of the Congregational Variety] in the Realm of England (1641)</cite>, pp. 18-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6670386a33" data-kw="">
<blockquote><p>Our divines from Scripture make three degrees of excommunication: 1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication. 2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially. 3. Maranatha in the Syriac, is an utter cursing till Christ’s Second Coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, Ch. 9, section 9, p. 283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

<blockquote><p>Simon Magus was not so tried [as to his sincerity or hypocrisy], yea when Peter found him in the gall of bitterness, we find not that he cast him out of the visible Church in respect his sin was not that publicly scandalous as to offend the whole Church.</p></blockquote>

</figure><figure class="quote" id="q-e72ea9db60" data-kw="">
<blockquote><p>…I grant that persons grosly ignorant and notoriously scandalous and impenitent ought to be excluded from the Lord’s Supper, but it must be done by them only to whom God has given this power, and in such order and manner as the Lord has appointed. That is necessary (says Mr. [John] Ball in his Tryal of the Grounds Tending to Separation, p. 190) to them that have received commission from God, which is unlawful to them that want authority. In the commonwealth the execution of justice is necessary; but private persons must not challenge the sword of the magistrate. In a corporation no one must take that upon himself which belongs to the common-council. Holy things must not be given to prophane persons; but every one at his pleasure must not deny holy things to unholy persons, but unholy persons must be debarred from holy things in such order as God has prescribed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government… (London, 1650), p. 46 Jeanes was an English presbyterian.</cite></span></figcaption>

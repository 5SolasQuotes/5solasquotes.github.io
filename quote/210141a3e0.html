<main class="wrap"><figure class="quote" id="q-210141a3e0" data-kw="">
<blockquote><p>Therefore, if the activity is conducive to worship, then it is lawful. We cannot ignore the human conscience here either, since an activity that might be conducive for worship to one person may not be conducive to worship for someone else. To take one example, it is certainly wise to let small children let loose some of their excess energy on the Sabbath (contrary to Laura Ingalls Wilder’s Farmer Boy! [below]). Otherwise, they will not be able to sit still and pay attention in worship. One does not have to take the attitude of Almanzo Wilder’s father [in Farmer Boy] in order to have a Puritan view of what is acceptable on the Sabbath! It is certainly a work of necessity to do something about the energy of small children. We must avoid both extremes of legalism and antinomianism here, as well as everywhere in our treatment of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lane-keister.html">Lane Keister</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Day &amp; Recreations on the Sabbath…’ in Confessional Presbyterian, #5 (2009)</cite>, p. 323</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth… (London, 1595), | pt. 2</cite>, p. 249</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-c4c27e5535" data-kw="">
<blockquote><p>That saying of our Savior, that the Sabbath was not made for man etc. was not uttered by Him to show that the action of the disciples in plucking and eating the ears of corn was warranted by necessity against the command of the Sabbath, but that it was not within the prohibition of works on the Sabbath, which ordinarily is restrained to works of a civil or servile nature, not to natural refreshment, which is always indulged on the Sabbath and so that work of mercy is not under the prohibition, for the plucking of the ears of corn, when they were in the field was no more then drawing drink out of a vessel and of this opinion is learned [Martin] Chemnitz: Hoc Christus it a defendit, ut simul ostendat extra casum contempus publici ministry, et turbationis cultus sabati propter otium externum Sabati, hominem ne levi quidē incommodo assiciendum. ‘By this Christ does so defend his disciples, as withal He shows that, out of the case of contempt of the public ministry and disturbance of the worships of the Sabbath, for the external rest of the Sabbath, a man is not to undergo the least damage.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-geree.html">John Geree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Might Overcoming Right. Or a Clear Answer to Mr. John Goodwin’s Might and Right well met (London: Bostock, 1649), ch. 1, section 3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ks Online</a></div>
</figure><figure class="quote" id="q-375ecdb9c1" data-kw="">
<blockquote><p>6. Works of comliness, tending to honest or decent walking… By all which believers have allowance: 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord has not straightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will he have their consciences to be fettered with inextricable scruples: He leaveth it to men on other days how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but [that] men would look: 1. to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments... (Glasgow, 1676), 4th Commandment</cite>, p. 171</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-51ba2af284" data-kw="">
<blockquote><p>Surely that which is most sweet to the soul of God should be most sweet to our souls: You would wonder to hear a man say that he takes as much delight and he can recreate himself as much in reading, in praying, in hearing sermons, in holy conference as you can do in all your good cheer, in playing and drinking of wine in bowls: You think that men are made to say that they have as much pleasure in those things, as playing at cards, and merriment, and music, and good cheer: you call upon them to play at cards with you, or be merry, you say to them, why should you be dumpish and never be merry? They tell you again that they can be as merry and as cheerful in hearing the Word, and praying, and reading, as you in all your playing, and all that you account delightful. You say to them that they have no recreation. They tell you that those things that are your burdens, are their recreation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea... (London: Cole, 1650), pp. 164-65. The context of this does not regard the Sabbath specifically. Burroughs was a Westminster divine.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Surely that which is most sweet to the soul of God should be most sweet to our souls: You would wonder to hear a man say that he takes as much delight and he can recreate himself as much in reading, in praying, in hearing sermons, in holy conference as you can do in all your good cheer, in playing and drinking of wine in bowls: You think that men are made to say that they have as much pleasure in those things, as playing at cards, and merriment, and music, and good cheer: you call upon them to play at cards with you, or be merry, you say to them, why should you be dumpish and never be merry? They tell you again that they can be as merry and as cheerful in hearing the Word, and praying, and reading, as you in all your playing, and all that you account delightful. You say to them that they have no recreation. They tell you that those things that are your burdens, are their recreation…”

— Jeremiah Burroughs, An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea... (London: Cole, 1650), pp. 164-65. The context of this does not regard the Sabbath specifically. Burroughs was a Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSurely+that+which+is+most+sweet+to+the+soul+of+God+should+be+most+sweet+to+our+souls%3A+You+would+wonder+to+hear+a+man+say+that+he+takes+as+much+delight+and+he+can+recreate+himself+as+much+in+reading%2C+in+praying%2C+in+hearing+sermons%2C+in+holy+conference+as+you+can+do+in+all+your+good+cheer%2C+in+playing+and+drinking+of+wine+in+bowls%3A+You+think+that+men+are+made+to+say+that+they+have+as+much+pleasure+in+those+things%2C+as+playing+at+cards%2C+and+merriment%2C+and+music%2C+and+good+cheer%3A+you+call+upon+them+to+play+at+cards+with+you%2C+or+be+merry%2C+you+say+to+them%2C+why+should+you+be+dumpish+and+never+be+merry%3F+They+tell+you+again+that+they+can+be+as+merry+and+as+cheerful+in+hearing+the+Word%2C+and+praying%2C+and+reading%2C+as+you+in+all+your+playing%2C+and+all+that+you+account+delightful.+You+say+to+them+that+they+have+no+recreation.+They+tell+you+that+those+things+that+are+your+burdens%2C+are+their+recreation%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+An+Exposition+with+Practical+Observations+continued+upon+the+Eighth%2C+Ninth+and+Tenth+Chapters+of+the+Prophesy+of+Hosea...+%28London%3A+Cole%2C+1650%29%2C+pp.+164-65.+The+context+of+this+does+not+regard+the+Sabbath+specifically.+Burroughs+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F51ba2af284.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51ba2af284.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/recreation-on-the-lords-day/#:~:text=Surely%20that%20which%20is%20most%20sweet,are%20your%20burdens%2C%20are%20their%20recreation%E2%80%A6" rel=

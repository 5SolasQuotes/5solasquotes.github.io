<blockquote><p>The third is faith, which is a miraculous and supernatural faculty of the heart, apprehending Christ Jesus, being applied by the operation of the Holy Ghost, and receiving Him to itself. … Christ is received when each individual person particularly applies to himself, Christ with His merits, by an inward persuasion of the heart.</p></blockquote>

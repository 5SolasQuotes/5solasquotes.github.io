<main class="wrap"><figure class="quote" id="q-fb33c5f527" data-kw="">
<blockquote><p>You say – The Argument from Circumcision is invalid upon infinite considerations.

It will, I doubt not at last prove so strong, that neither you, nor any other Advocates shall ever be able to over-throw it: for that which circumcision was in the Old Testament, Baptism is in the New, which succeeded it, and hath the same end and use, that is, to be a seal of the Righteousness of Faith, Rom. 4. 11. The same Faith in the same Christ: and therefore the Apostle tells the Colossians that they were Circumcised in Christ, – in that they were buried with him in Baptism: so that Baptism is our Circumcision, or Sacrament, whereby the same things are conferred and confirmed: an in-let for us into the visible Church of Christ, a Seal of the Covenant of Grace, and free remission of sins by Faith in him into whom it implanteth us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anabaptism Routed: Or, A Survey of the Controverted Points</cite>, (London: Thomas Johnson, 1655), pp 9-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98e749d745" data-kw="">
<blockquote><p>Naturally, therefore, this sign and seal belongs only to those who are the Lord’s. Or, to put it rather in the positive form, this sign and seal belongs to all those who are the Lord’s. There are no distinctions of race or station, sex or age; there is but one prerequisite—that we are the Lord’s. What it means is just this and nothing else: that we are the Lord’s. What it pledges is just this and nothing else: that the Lord will keep us as his own. We need not raise the question, then, whether infants are to be baptized. Of course they are, if infants, too, may be the Lord’s. Naturally, as with adults, it is only the infants who are the Lord’s who are to be baptized; but equally naturally as with adults, all infants that are the Lord’s are to be baptized. Being the Lord’s they have a right to the sign that they are the Lord’s and to the pledge of the Lord’s holy keeping. Circumcision, which held the place in the old covenant that baptism holds in the new, was to be given to all infants born within the covenant. Baptism must follow the same rule. This and this only can determine its conference: Is the recipient a child of the covenant, with a right therefore to the sign and seal of the covenant? We cannot withhold the sign and seal of the covenant from those who are of the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1920 | (HT: Kim Riddlebarger)</span></figcaption>

<blockquote><p>After this Examination of the Convert, this following Prayer was made.

O Eternal God, how wonderful art thou in thy works! Thou hast been found by those who have not sought thee; Thy grace hath prevented their thoughts. It is neither from him that willeth, nor from him that runneth, but from thy mercy alone that Salvation doth proceed. It is neither from the West, nor from the East, but from thy wonderful dispensation; when it pleaseth thee, thou stretchest forth thy arm from the height of Heavens to the bottom of the Abyss, to pluck out those who were already on the brink of Hell; O God who hast commanded that light should shine in the midst of darkness, enlighten the flames of thy truth amongst those who do lie in the valley of the shade of Death, that the most barbarous people may see the ways &amp; traces of thy Christ; that the pavilions of Ismael, and of Midian may be shaken, that the sheep which are not yet in thy fold may henceforth be brought into it.

Behold here a Soul which prostrates it self at thy feet to be washed in the blood of thy holy Son Jesus, in the blood of that sprinkling which speaketh for Sinners; be pleased to pardon this poor Sinner that is here present; pardon the faults committed by him in the time of his ignorance; cause thou the Scales to fast from his eyes. Create in him a new heart, that being a new Creature he may walk in righteousness and holiness. Cause thou that the Baptism which according to thy ordinance we do confer upon him be effectual to his salvation, that it may redound to the glory of thy great name, to the joy of thy Angels, and to the comfort of those who love thy Anointed who is blessed for evermore.

Immediately after this Prayer, the Convert being on his knees was baptized, presented by Monsieur Armand of Caumont Marquis of Montpouillan, and the Lady Adrian de Mayern who were his Godfather and Godmother, from whom he received the name of Armand Adrian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The joyful convert: represented in a short but elegant sermon preached at the baptizing of a Turk, who renouncing the law of Mahomet, and having given abundant satisfaction for the reasons and soundness of his conversion, was baptized in the French Church May 2. 1658. the Marquis of Montpouillian, a</cite>, (London: I. Leach, 1658), pp 22-24.</span></figcaption>

</figure><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, Book XI, ch. II, Of the Efficacy of the Sacraments</span></figcaption>

<blockquote><p>The children of Christians are born Christians, as the children of Jews were born Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicon</cite>, p. 262 &amp; Commentary on Rom. 11, p. 1143 as quoted in Krauth, Infant Baptism and Infant Salvation in the Calvinistic System… (Philadelphia: Lutheran Books Store, 1874), p. 24</span></figcaption>

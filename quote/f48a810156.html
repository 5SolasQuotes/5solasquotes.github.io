<blockquote><p>Vers. 3. Blessed be the God and Father of our Lord Jesus Christ, who hath blessed us with all spiritual blessings in heavenly places in Christ.

After the Preface follows the Thanksgiving, containing a Proposition to be proved in the first part of this Chapter, which is this; That the Grace of God in Christ ought to be celebrated with an acknowledgement of God’s blessing towards us, in the whole business of the Salvation of Believers: For our blessing, as it hath relation to God, is nothing else but an acknowledgement that God is every way the Author of all blessing or Grace towards us.

In this Proposition he puts a difference between God the Father, and Jesus Christ the Mediator God-man, that the person and office of the Mediator might more manifestly appear. And he calls God the Father the God of Christ, (1) Because of that Grace, whereby the human nature of Christ was predestinated to the personal union with the Word, his Son. (2) Because of the Covenant of Redemption made between God and Christ the Mediator. And then he calls him the Father of Jesus Christ, (1) Because of the eternal Generation of the Son, by which the Father hath from all eternity communicated to him his whole infinite essence. (2) Because of the personal union of the assumed human Nature, by which the Son of man is made the Son of God. The chief Arguments to prove the aforesaid Proposition are Thirteen.

Hath blessed] Arg. 1. The God and Father of Christ hath blessed us believers, or hath graciously heapt upon us all spiritual and heavenly blessings in Christ. Therefore he is to be blessed, or his grace is to be celebrated by us: To this purpose, that the grace of God might appear and be celebrated, all the words of this Argument tend, every one whereof breathes our grace. For (1.) The giver of these benefits is called God, and the Father of Jesus Christ, and by consequence the God and Father of all us which are in Christ, and that from the Covenant made between the Father and Christ concerning us; and consequently our Father, who with a fatherly affection gives us all things.

Hath blessed] 2. The giving of these benefits is actively called the blessing of God, that is, the actual or effectual demonstration of God’s grace (according to his word) in deed towards us.

Hath blessed us] (3.) And here is grace. For we whom God blesseth, are by nature the sons of wrath, and liable to the curse of God, in whom there is nothing, nor can be any thing, which can deserve any good.

With all blessing] (4.) The nature and matter of the benefits themselves includes grace; for a blessing taken passively, is nothing else but a benefit, taking its rise from mere grace.

Spiritual blessings] (5) Here is grace also; For the benefits which are bestowed on us before others are spiritual, such as have reference to the eternal salvation of the spirit or soul, which do far exceed all measure of proportion to any earthly and temporal works, which we can perform in this body, and therefore they are of grace.

All blessing] (6.) This tends to grace too. Because every spiritual gift, which pertains to the salvation of souls, is bestowed upon us; of which gifts there is none, which flows not from the fountain of grace and blessing, and is freely given to us without any merit of ours, or respect to our works, whether they be knowledge of God, or acknowledgement of our sin, or repentance, or faith, or any effect of faith, or any good work, or intention of a good work: all this is freely given by him, who blesseth us with all spiritual blessing: Therefore they are of grace.

In heaven] Here is a beam of grace too, because these benefits, with which we, above others, are blessed, are heavenly, that is, they are such as take their original from heaven, are conversant in heaven, and shall be completed in heaven; nor do they any ways savour any thing of our flesh, but yet do season to us our condition on earth.

In Christ] Here the whole ocean of grace is opened for all these benefits are ours in Christ, who himself is ours, and all these are made ours in him, as in the root and fountain, as in our head and common parent, before they come to us, that so they may be derived on us by him: in whom as we are united together, we possess those things we have, and in whom we have right to those things which as yet we have not, and by whom we shall hereafter receive those things which remain; and as he hath obtained all things for us, so he keeps both them in himself for our use, and us that we may use and enjoy them. From all, and every one of which it follows, that all our spiritual benefits are free and gracious, or effects of mere grace, and therefore we ought to celebrate the grace of God as the fountain and cause of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 107-08.</span></figcaption>

</figure><figure class="quote" id="q-b75b7256b9" data-kw="virgin birth Holy Spirit">
<blockquote><p>The conception is that by which Christ was invisibly formed in the womb of the blessed virgin, without the concurrence of man, but by the power and overshadowing of the Holy Spirit alone: “That which is conceived in her is of the Holy Ghost” (Mt. 1:20). In this a twofold principle must be remarked: an active—the Holy Spirit; a passive—the blessed virgin. The active principle was not a man (as in ordinary generation) because the conception should be such as to permit the virginity of the blessed virgin to remain pure and inviolate. It was also one by which Christ should be free from all taint of sin, which is usually propagated and contracted by ordinary generation.</p></blockquote>

<blockquote><p>Actions and passions belong to individual incommunicable subsistences denominatively. Yet they may also be ascribed formally to one or the other nature. Thus suffering and death properly and formally belong to human nature, but denominatively to the person according to the other nature.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7dc5b5cb68" data-kw="">
<blockquote><p>Holy Scripture most especially highlights this eternal and undeserved grace of our election and brings it out more clearly for us, in that it further bears witness that not all people have been chosen but that some have not been chosen or have been passed by in God’s eternal election—those, that is, concerning whom God, on the basis of his entirely free, most just, irreproachable, and unchangeable good pleasure, made the following decree: to leave them in the common misery into which, by their own fault, they have plunged themselves; not to grant them saving faith and the grace of conversion; but finally to condemn and eternally punish those who have been left in their own ways and under God’s just judgment, not only for their unbelief but also for all their other sins, in order to display his justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 15</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef2c0c632" data-kw="">
<blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 12</span></figcaption>

</figure><figure class="quote" id="q-9306f26ff2" data-kw="Affliction Comfort">
<blockquote><p>As all good things, so all bad things are ordered by providence for the good of the church. That which in its own nature is an injury, by God&#x27;s ordering puts on the nature of a mercy; and what is poison in itself, by the almighty art becomes a sovereign medicine. Are God&#x27;s dispensations in their own nature destructive? That wise physician knows how to make poisons work the effect of purges. Are they sharp? It is to humble and purge the church. As shadows serve to set out the pictures, so the darkest passages of providence are made by God to commend the beauty of those glorious things he works for his church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 2 (all providences for the good of the church)</span></figcaption>

</figure><figure class="quote" id="q-9c2ff7740d" data-kw="Sovereignty Wisdom Comfort">
<blockquote><p>Our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sovereignty of God</cite>, ch. 12, “The Value of This Doctrine” (6. It supplies comfort in sorrow)</span></figcaption>

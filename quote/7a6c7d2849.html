</figure><figure class="quote" id="q-de3a7d083a" data-kw="">
<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and complaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity… (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, a. ‘Appeals in Cases Not Judicial’</cite>, pp. 470-72</span></figcaption>

</figure><figure class="quote" id="q-cf6f469558" data-kw="">
<blockquote><p>The embracing of refusing the Oath of Abjuration, affords not the least ground for separation. This proposition,” adds he, “shines with such a bright and convincing light of truth, that none who can allow themselves, without prejudice, to reflect upon its evidence, will refuse to admit of it as undeniable.</p></blockquote>

</figure><figure class="quote" id="q-cd9c648b65" data-kw="">
<blockquote><p>So that it would not be a sufficient reason for forsaking the communion of a Church, only to allege a general depravation of manners, even when it should be true, that it did reign therein: But it is no less certain, that when it falls out, that one party of the Church… should confirm itself in errors, and in practices contrary to the service of God, and the salvation of men; and that not only it rejects the instructions given it upon that occasion, but would even force all others to be of the same sentiments, and to practice the same worship, the separation of the other party is just, necessary and indispensable: It is just, for everywhere where there can be nothing else but an unjust communion, there is justice in a separation from it: But there can be nothing else, but unjust communion with a party, which essentially destroys the true worship of God, which shuts up itself in errors, directly contrary to men’s salvation, and which, through an intolerable tyrrany, would constrain all those who live in it, to make a profession of the same errors, it is then just for a man to separate himself from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>

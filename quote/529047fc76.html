<main class="wrap"><figure class="quote" id="q-529047fc76" data-kw="">
<blockquote><p>For the Church does bind and loose in the external court, either by a commission from Him who as head of the Church, and who as King gave to her the keys of the Kingdom, or by a general arbitrary power given to the magistrate and Church, to do in these things as they please, so they do nothing contrary to the Word, though not according to the Word, as they are to do in doctrinals; If the former be said, then must the external government be upon the shoulder of Christ as King, which is that which we teach: If the latter be said, then might the magistrate &amp; Church appoint such an ordinance as excommunication, and so they may by their arbitrary power make a Gospel promise of ratifying an ordinance in heaven and of pardoning sins in heaven; for he that can make the ordinance can make also the Gospel-promise, and he that can by an arbitrary power make one promise or part of the Gospel, may make all. And if either magistrate or Church can appoint such an ordinance as has a promise of binding and loosing made good in heaven, they may also take away such ordinances and Gospel-promises; for it is the same power to make and add, to unmake and destroy ordinances. Hence also I argue for the immutability of a Scriptural Platform, that the Church cannot alter at her will… I infer that the whole Platform of Law and Gospel is of divine institution, and the particulars of obedience and faith are not arbitrary to the Church; just so in discipline, I say the like, there is no more reason for one part written by God than for another.</p></blockquote>

<blockquote><p>Section 7. Third part of liberty, viz., the free rise of things indifferent. The knowledge of this part necessary to remove despair and superstition. Superstition described… The third part of this liberty is that we are not bound before God to any observance of external things which are in themselves indifferent, (“adiafora”) but that we are now at full liberty either to use or omit them. The knowledge of this liberty is very necessary to us; where it is wanting our consciences will have no rest, there will be no end of superstition. In the present day many think us absurd in raising a question as to the free eating of flesh, the free use of dress and holidays, and similar frivolous trifles, as they think them; but they are of more importance than is commonly supposed. For when once the conscience is entangled in the net, it enters a long and inextricable labyrinth, from which it is afterwards most difficult to escape. When a man begins to doubt whether it is lawful for him to use linen for sheets, shirts, napkins, and handkerchiefs, he will not long be secure as to hemp, and will at last have doubts as to tow; for he will revolve in his mind whether he cannot sup without napkins, or dispense with handkerchiefs. Should he deem a daintier food unlawful, he will afterwards feel uneasy for using loafbread and common eatables, because he will think that his body might possibly be supported on a still meaner food. If he hesitates as to a more genial wine, he will scarcely drink the worst with a good conscience; at last he will not dare to touch water if more than usually sweet and pure. In fine, he will come to this, that he will deem it criminal to trample on a straw lying in his way. For it is no trivial dispute that is here commenced, the point in debate being, whether the use of this thing or that is in accordance with the divine will, which ought to take precedence of all our acts and counsels. Here some must by despair be hurried into an abyss, while others, despising God and casting off his fear, will not be able to make a way for themselves without ruin. When men are involved in such doubts whatever be the direction in which they turn, every thing they see must offend their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.10.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>22. They that think that conforming ministers are guilty of great sin must consider what diversity of education, company and interest may do, even on men of conscience, and that we have all our sins. And it’s sinful uncharitableness to think and speak worse of them than they deserve and to talk against all for the faults of some. …

24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not. ¹ [The Anglican parish churches tended to have a simpler and more plain and Scriptural worship than the cathedral churches of the cities, which had many more human and showy additions. Many of the older non-conformist ministers that separated from the cathedral worship yet would not separate in principle from the parish churches. Baxter was of this mind.]

25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²</p></blockquote>

24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not. ¹ [The Anglican parish churches tended to have a simpler and more plain and Scriptural worship than the cathedral churches of the cities, which had many more human and showy additions. Many of the older non-conformist ministers that separated from the cathedral worship yet would not separate in principle from the parish churches. Baxter was of this mind.]

25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²”

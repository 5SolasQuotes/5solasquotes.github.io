<main class="wrap"><figure class="quote" id="q-462fd7899f" data-kw="">
<blockquote><p>V. The subscriptio [to the letter to the Colossians] indicates the ministerial cause through which the Holy Spirit, as the author and primary authority, has used this epistle. That [ministerial] cause is Paul.

VI. It is described by the added clause, namely that he is an Apostle of Jesus Christ, that is, an Ambassador and Teacher of the Church, immediately taught by Christ Himself through revelation and sent to proclaim the Gospel of the Messiah exhibited everywhere in the whole world and to establish the foundation of the Church, having this testimony from God, that he has not erred in doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-710d2a4b41" data-kw="">
<blockquote><p>1… in [you, Edward Bagshaw] saying I deny the Scripture to be a perfect rule, when I still say, ‘It is a perfect rule so far as it is a rule’! 2. If you intend sense and truth, your argument must run thus: ‘He that says the Scripture is not a particular rule, commanding the thing in particular, but only a general rule, for the meter and tunes of psalms, for the dividing of itself into chapters and verses, for the hour and place of meetings, for the choice of a text to preach on, and words and method of sermon and prayer, for the naming or determining the person that shall be a pastor, for the form of pulpits, tables, cups, etc. yea, for the making of a clock, or watch, or hour-glass, to measure the time by, or for building the house to preach in, etc. He that says these are not determined of particularly in Scripture, but only under the general rule of doing all things to God’s glory, to edification, decently and in order, etc. this man does deny Scripture to be a perfect rule, and labors to overthrow the foundation of faith and practice, and proving what he says by the ill consequences that else will follow, will in the end be found in perfect folly and madness, reproved by God and found a liar: But such a one is R.B. Therefore, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London: Simmons, 1671), section 74, pp. 160-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

you%2C%20Edward%20Bagshaw%5D%20saying%20I,a%20one%20is%20R.B.%20Therefore%2C%20etc&amp;text=in%20%5Byou%2C%20Edward%20Bagshaw%5D%20saying%20I%20deny%20the&amp;text=But%20such%20a%20one%20is%20R.B.%20Therefore%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ec738a4a8b" data-kw="authority">
<blockquote><p>The authority of Scripture (concerning which we here inquire) is nothing else than the right and dignity of the sacred books, on account of which they are most worthy of faith with regard to those things which they propose to be believed and of our obedience in those things which they command us to omit or to do. The divine and infallible truth of these books (which have God for their author) is the foundation because he has the highest right to bind men to faith and duty. But this truth may be either intrinsic or extrinsic. The former is the credibility (axiopistia) in itself of the word which is always equal and consistent with itself, whether it has the testimony of men or not. The latter is the estimation or judgment of men in relation to the Scriptures, which is different as the subjects are different. Of history and of rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.4.3</span></figcaption>

</figure><figure class="quote" id="q-8751f6c3ae" data-kw="">
<blockquote><p>We believe and confess the canonical Scriptures of the holy prophets and apostles of both Testaments to be the true Word of God, and to have sufficient authority of themselves, not of men. For God himself spoke to the fathers, prophets, apostles, and still speaks to us through the Holy Scriptures.</p></blockquote>

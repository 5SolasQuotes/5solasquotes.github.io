<main class="wrap"><figure class="quote" id="q-da0c28f09c" data-kw="">
<blockquote><p>THERE being nothing more certain to man then death, and nothing more uncertain than the hour thereof, and desiring to provide that Death surprise me not before I make my latter will, having as yet by the mercy of God the use of all my senses and of my reason, understanding and judgement, I have thought it necessary shortly to declare mine estate and latter will as follows. I do confess and protest that I live and die in that true and lively faith whereby the just man lives which is taught us in Holy Scripture.

And that I believe the remission of all my sins by the shedding of the most precious blood of mine only Saviour, Mediator and Advocate, Jesus Christ, in whose hands I do give over and commend my self, beseeching him that he would sanctify me thoroughly and keep my whole spirit, soul and body, without blemish unto his last coming. I leave my body to be buried in the ground in a Christian manner without all unnecessary pomp or shew, to be made partaker of the blessed resurrection at the latter day, which I do expect and believe with a steadfast faith. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-casaubon.html">Isaac Casaubon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Isaac Casaubon, 1614’ Camden Old Series</cite></span></figcaption>

</figure><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

te/2382ecf531.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=For%20the%20transgression%20of%20my%20people,and%20forever%20perfected%20His%20set%2Dapart%20ones&amp;text=For%20the%20transgression%20of%20my%20people%20was%20he&amp;text=their%20sins%2C%20and%20forever%20perfected%20His%20set%2Dapart%20ones" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6d229d0aff" data-kw="">
<blockquote><p>There remains the seventh part of the sentence propounded, to wit, that man is justified by the iustice of God, whereby He accepts Christs satisfaction for the elect. Of this Paul testifies, Rom. 3:25-26, where he says, ‘Whom’ (to wit Christ) ‘God hath set forth to be are conciliation through faith in his blood to declare his justice, by the forgiveness of the sins that are past through the patience of God, to show at this time his iustice, that He might be just and a justifier of him which is of the faith of Jesus.’ By which words the apostle teaches that God declares his justice, in as much as he forgives sins to them for whom Christ has satisfied, namely the believers. For it is the part of justice, to be content, if satisfaction be made for the debt by a surety, and not to exact satisfaction of the debtor himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned and Profitable Treatise of Man&#x27;s Justification</cite>, (London, 1599), bk. 1, ch. 10, pp. 45-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-1d54e976df" data-kw="against Socinian denial">
<blockquote><p>Concerning the necessity of a satisfaction, there are three principal opinions of theologians. The first of those simply denying it (as the Socinians, who not only deny that Christ made a real satisfaction, but that there was any need of it). The satisfaction here discussed is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.3–4</span></figcaption>

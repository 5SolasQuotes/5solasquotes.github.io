<main class="wrap"><figure class="quote" id="q-0efd71aa3e" data-kw="">
<blockquote><p>In discussing such a subject as this, it is necessary to act as Nehemiah’s workers did, every one of whom “with one of his hands wrought in the work, and with the other hand held a weapon.” And like these patriotic builders, the historical student is often cumbered with “much rubbish.” In the devoted band of hymn-singers, Dr. H[oratius]. Bonar has long held a conspicuous place, by his ardent attempts to prove that the Reformers of Scotland used human hymns in the public worship of God.

In considering this question therefore, it will not be amiss to examine pretty carefully what such a veteran champion has advanced; though, perhaps, it may be thought presumptuous for one, who marches in the rank and file of Presbyterianism, to criticise the utterances of the Moderator of the Free Church Assembly. But the highest dignitaries—not excepting the Pope of Rome—are just as fallible as the greatest geniuses, and the best of scholars, and neither of these claim to be beyond criticism.

Dr. Bonar, however, stands head and shoulders above most of his contemporaries in a far better sense, to wit, in vital godliness. Well does the writer of this article remember hearing him commending Christ to a crowd of people near the Heart of Mid-Lothian more than a dozen years ago. His countenance and especially his eyes seemed lit up with the reflection of his Master’s glory. And not only are we assured that “the secret of the Lord is with them that fear Him,” but, that, “a good understanding have all they that do His commandments.” Yet Paul says, “Be ye followers of me, even as I also am of Christ,” and Dr. Bonar will ask no more. Moreover, if an attempt were made to count heads, it might be rather difficult to say on which side of the hymn-question most of Christ’s earnest followers have been ranged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hymnology of the Scottish Reformation. I. in Original Secession Magazine</cite></span></figcaption>

<blockquote><p>CANON 24. Concerning the branches of the vine. The branches on the vine do not give life to the vine, but receive life from it; thus the vine is related to its branches in such a way that it supplies them with what they need to live, and does not take this from them. Thus it is to the advantage of the disciples, not Christ, both to have Christ abiding in them and to abide in Christ. For if the vine is cut down another can shoot up from the live root; but one who is cut off from the vine cannot live without the root (John 15:5ff).</p></blockquote>

</figure><figure class="quote" id="q-a15b770ca8" data-kw="">
<blockquote><p>Secondly, whereas there goes but two things to the reformation of the Church, they are both in the word glory.

First, there must be all the ordinances; thus the Ark was called glory, and the Ark signified both the word and Sacraments; here are communicants in these, and they are such as are cleansed and undefiled, vers. 3. here is thirdly, government; 2 Pet. 2.10. it is said of some they do despise and not respect dominions, or glories, as the word is; and the glory that is there spoken is not evil but ecclesiastical, for it is such a kind of despising, as Corah and Dathan were guilty of against Moses, Jude 8.11. Now they opposed Moses, not as a Magistrate, but as a Minister and Law-giver unto the Church, and therefore they said, Are not all the people of the Lord holy? and not wise, or valorous, or true hearted? which art the virtues of a Magistrate. Besides, false teachers are for the most part flatterers of Princes, not Despisers, as Zedekiah was, and Simon Magus who adored Nero.

When you have the ordinances, then the Second thing required to a Reformation, is to have them pure, and after God’s prescript, without human addition or alteration: take this for a rule, the more plain God’s ordinances are, the more powerful; the more there is of man, the less there is of God in them, Ezek. 44.7. God tells them they had polluted his Sanctuary, that is, made it common, the sacramental bread did them no more good than their own ordinary bread, and the company of the Saints no more then the company and society of men. You have this in the text too, for here is beauty joined with glory in vers. 2. and beauty is a native complexion; here is glory joined with purging, the spirit of judgement, and of burning, in the verse before my text; here is holiness written on every Soul, vers. 3. and to be holy is all one with being set apart to a holy use and being prepared, and fitted for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sidrach-simpson.html">Sidrach Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation’s preservation opened in a sermon preached at Westminster before the honourable House of Commons, at the late solemne fast, July 26, 1643</cite>, (London: Benjamin Allen, 1643), pp 4-5.</span></figcaption>

</figure><figure class="quote" id="q-3e878b279c" data-kw="">
<blockquote><p>As altered from the seventh to the first day of the week, the Sabbath should be kept by us, as we are enjoined to do so in the fourth commandment.

That precept requires us to devote one day in seven unto God; by abstaining “even from such worldy employments and recreations, as are lawful on other days, and spending the whole time in the public and private exercises of God’s worship, except so much as it to be taken upon in the works of necessity and mercy.” It is not disputed that the fourth commandment once required this, it is, however, denied that we are now bound to keep the Sabbath, with all the strictness which it enjoins.

To those who advocate a relaxed mode of observing the Sabbath, we reply; the fourth commandment was given by God, – it was once the duty of men to keep the Sabbath as required by that precept, – it is incumbent upon them to do so still – unless it can be shewn that it has been annulled or modified by divine authority. No such inference can be drawn from our spiritual necessities. Are not our hearts as carnal as were those of the Jews?

Are not our employments as secularizing? Had not they many other days, besides Sabbath, that were set apart for public worship, while we have no other? And have not we then as much need as they had, to spend one whole seventh part of our time in the public and private exercises of God’s worship? And are we not under stronger obligations to give a whole seventh of our time unto God, than the Jews were? Our privileges are greater than theirs, and shall our homage, therefore, be less?

The economy under which we live, is more spiritual than theirs, and we will not believe it, until we are expressly told so by God, that our Sabbaths should be less sacred. It is true, that there is no precept in the New Testament, that commands us to keep the Sabbath as strictly as we are required by the fourth commandment; but we must remember, that after a law is once enacted, it continues to bind unless it is repealed, although it be not enacted a second time; and, therefore, unless we can shew that the fourth commandment has been repealed, it is still binding upon us, although no similar law be found in the New Testament.

It is also true, that the Mosaical economy has come to an end, and abolished such things as were commanded only in the judicial or ceremonial law. The fourth commandment, however, has not its place in either of these laws, but in that law which was written by the finger of God upon the tables of stone. This law, the abrogation of the Mosaical economy did not affect; amid all that it swept away, it left every one of its precepts remaining.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), pp 15-16.</span></figcaption>

— William White, Three Sermons on the Sabbath, Preached in September 1838, (Haddington: Neill &amp; Sons, 1838), pp 15-16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+altered+from+the+seventh+to+the+first+day+of+the+week%2C+the+Sabbath+should+be+kept+by+us%2C+as+we+are+enjoined+to+do+so+in+the+fourth+commandment.%0A%0AThat+precept+requires+us+to+devote+one+day+in+seven+unto+God%3B+by+abstaining+%E2%80%9Ceven+from+such+worldy+employments+and+recreations%2C+as+are+lawful+on+other+days%2C+and+spending+the+whole+time+in+the+public+and+private+exercises+of+God%E2%80%99s+worship%2C+except+so+much+as+it+to+be+taken+upon+in+the+works+of+necessity+and+mercy.%E2%80%9D+It+is+not+disputed+that+the+fourth+commandment+once+required+this%2C+it+is%2C+however%2C+denied+that+we+are+now+bound+to+keep+the+Sabbath%2C+with+all+the+strictness+which+it+enjoins.%0A%0ATo+those+who+advocate+a+relaxed+mode+of+observing+the+Sabbath%2C+we+reply%3B+the+fourth+commandment+was+given+by+God%2C+%E2%80%93+it+was+once+the+duty+of+men+to+keep+the+Sabbath+as+required+by+that+precept%2C+%E2%80%93+it+is+incumbent+upon+them+to+do+so+still+%E2%80%93+unless+it+can+be+shewn+that+it+has+been+annulled+or+modified+by+divine+authority.+No+such+inference+can+be+drawn+from+our+spiritual+necessities.+Are+not+our+hearts+as+carnal+as+were+those+of+the+Jews%3F%0A%0AAre+not+our+employments+as+secularizing%3F+Had+not+they+many+other+days%2C+besides+Sabbath%2C+that+were+set+apart+for+public+worship%2C+while+we+have+no+other%3F+And+have+not+we+then+as+much+need+as+they+had%2C+to+spend+one+whole+seventh+part+of+our+time+in+the+public+and+private+exercises+of+God%E2%80%99s+worship%3F+And+are+we+not+under+stronger+obligations+to+give+a+whole+seventh+of+our+time+unto+God%2C+than+the+Jews+were%3F+Our+privileges+are+greater+than+theirs%2C+and+shall+our+homage%2C+therefore%2C+be+less%3F%0A%0AThe+economy+under+which+we+live%2C+is+more+spiritual+than+theirs%2C+and+we+will+not+believe+it%2C+until+w </figure><figure class="quote" id="q-b5d3fe3556" data-kw="">
<blockquote><p>A corrupt and wicked life argues a man to be a stranger to God, and God him; for otherwise a man might draw nigh to God, and have unclean hands too, which the Text [James 4:8] supposes that it cannot be. That power which draws a man into acquaintance with God, doth proportionably kill sin.

That power which flows from God in acquaintance with a man, kills sin too: whether I go out to the sun, or the sun come in to me, the darkness is expelled: sin hath not dominion over them that are under grace, Rom. 6. 14. the knowledge of God sets a man loose from his bondage to the enslaving lusts he before served, ye shall know the truth, and the truth shall make you free, John 8. 32. draw nigh to God, and be unclean if you can. That faith which is uniting to Christ, is a purifying faith; rebellion against the Commandments of God, is inconsistent with communion with God; you may fast, and pray, and ask, that you may consume upon your lusts, ver. 4. like a cutpurse in a Church, who comes not thither to seek God, but his prey.

They that draw nigh to God, must cleanse their hands; I will wash mine hands in innocency, so will I compass thine Altar, O Lord, Psal. 26. 6. Where you may observe, that thanksgivings and praises, which the Psalmist calls sacrifices of shouting, or loud music, Psal. 27. 6. and wherein they used (as one saith) … are to be performed with washen hands: so in your prayers, the Lord requires that you should lift up pure hands, 1 Tim. 2. 8. and what a sweet reflection may you make upon your deliverances which are wonderful, when you can say, I was upright with God, and I kept my self from mine iniquity? Therefore hath the Lord recompensed me according to my righteousness, according to the cleanness of my hands in his eye-sight, Psal. 18. 23, 24.

If ye fall into straits, and be plunged into depths of misery; If your face be foul with weeping, and on your eye lids be the shadow of death; what a lifting up of the head will it be unto you, to be able to say, Not for any injustice in my hands? Job. 16. 17. If the Lord shall deliver this Island from the oppression and injustice under which it hath groaned; what a crown and comfort will it be to you, that it is delivered by the pureness of your hands? Job. 22. 30.

To conclude. If there be a frustration of our counsels, and our endeavours bring forth nothing but wind; You shall find the reason why God makes all void and ineffectual, Isa. 59. 6. Their webs shall not become garments, neither shall they cover themselves with their works; Their works are works of iniquity, and the act of violence is in their hands.</p></blockquote>

<blockquote><p>Men may be very straight and tender in the work of God, and bold in reference to suffering, and yet be faint and defective in the prosecuting of Church censures against erroneous men;” he puts the question, “What can be the reason, that honest, tender and zealous men should be so often defective in this, who yet may be zealous and fervent against scandalous practices?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-841395551f" data-kw="">
<blockquote><p>7. To wave a little that which concerns private and particular persons, we offer it to consideration whether inferior Kirk-judicatories are subordinate to the greater and superior simply and absolutely, because they are greater and superior, or, because the inferior have no intrinsical power given them by Jesus Christ, but in, and with subordination to the greater, because greater. If so, it would seem that all the inferior Judicatories of the Kirk, Congregational-Elderships, Presbyteries, and Provincial Synods must be fenced and act in the name, and by virtue of the authority derived from the General Assembly, as all those Civil Courts that have no intrinsic power in themselves, but in, and with subordination to the supreme Civil Magistrate are fenced in his name and act by virtue of his authority. Inferior Kirk-judicatories, being ordinances of Jesus Christ, have the promise made to them when they meet in His Name and do adhere to His Truth, Mt. 18:18-19. And if so, shall the sentence of the superior Judicatory, when wrong upon the matter, oblige them to submission? If a Presbytery, or a Synod with the consent of the Presbytery, do in an orderly way of procedure, cast out an heterodox and scandalous minister, must they, because the Synod or General Assembly does sustain his unjust appeal, be obliged in conscience again to receive him as a member of the Presbytery or Synod, and acknowledge him for a lawful minister of the Gospel; or, if they have in an orderly way of procedure, admitted an able orthodox godly man to the Ministry: Must they, because the superior Judicatory commands them so to do, cease to acknowledge him or own him for one of their number, or as a Minister of the Gospel? If so, it seems to be an ill-grounded truth that is commonly delivered by some divines writing of synods, that the power of synods is not corruptive, privative, or destructive to the power of classical presbyteries or single congregations, but perfective, acumulative, and conservative thereunto.

8. What is denied jure to ecomenic councils, and so lawfully called prophets and ministers of the Gospel, to Nathan, to David, to Paul, to an angel from heaven, Gal. 1:8, cannot warrantably be given to General Assemblies. If ecomenic councils, lawfully called ministers, if Nathan, if Samuel, if Paul, if an Angel teach or decree but according to the Word of the Lord, we are to counteract, and to contradict, Gal. 1:8. “But though we or an angel from heaven, preach to you, beside what we have preached, let him be accursed,” Gal. 1:8. Therefore, etc.</p></blockquote>

</figure><figure class="quote" id="q-6ecf0eb130" data-kw="">
<blockquote><p>Sundry of the better sort among us are prone to think that testimonies are of no value without that they be carried to great heights. Hence I pointed them to a notable instance we have have upon record concerning Joseph of Arimathea, to whom the Spirit of God has given a great character, Lk. 23:50-51. He was a good man and just, he consented not to the horrid deed of the murderers of our Lord. Some of note in our day would have said, That was not enough, he ought to have made a more resolute appearance; but we read not that the Lord said so. In several cases the current may be so very strong, that there’s access for no more than through grace to guard against the being carried down with it; ‘Thou shalt not follow a multitude to do evil,” Ex. 23:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-75aa907c5f" data-kw="">
<blockquote><p>V. When I can have better, caeteris paribus [other things being equal], without greater hurt than good, I prefer it; and only use occasional local communion with the [Anglican] liturgy-churches, as I would do with strangers were I in foreign lands.

VI. Where I can have no better without more hurt than good, I communicate constantly and only with the parish-church where I live, as to local-communion.</p></blockquote>

<blockquote><p>It is a delusion to think that it is the only way to testify against what I judge amiss in the minister, to cast at this ministry, and to withdraw from him. Whosoever adopts this principle and practices it accordingly, has not the mind of Christ; for there are other patent and obvious ways to witness against all the evil of our ways besides these: Nay, this way of witnessing is such as Christ will witness against it, as not the way.</p></blockquote>

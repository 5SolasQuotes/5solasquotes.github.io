<main class="wrap"><figure class="quote" id="q-8c31a3df95" data-kw="">
<blockquote><p>…but take these for marks of deluded men: … 2. Profession [of Christianity] looks like paradise and the rainbow; its big in its own eyes and the fairest for variety of coulors, but its a self-plague and does carry millions of souls to hell without din and noise of feet, it’s Christ acting judicially on the hypocrite within pistol shot of a besieged soul, making fire-works under the earth; and when all within are sleeping, Christ springs a powder-mine, and burns up all forward: Gospel-fire-works makes more than ordinary fury in the soul; Open, open to Christ;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pt. 3, ‘All Men’, pp. 461-62</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1781c2acfa" data-kw="">
<blockquote><p>2. This Day of Grace is not passed when the sinner sets open the door of his heart that Christ the Lord may enter. That promise is most sure, ‘If any man hear my voice and open the door, I will come into him, and sup with him, and he shall sup with Me,’ Rev. 3:20. Christ complains of the Jews that they would not come to him that they might have life; but if any are made willing to come, the waters of life are open, and none that desire shall be denied them, Rev. 22:17, ‘Let him that is a thirst come, and whoever will, let him drink of the waters of life freely.’ Doest thou know Christ? Art thou acquainted with his kingdom as well as his priesthood? and art thou willing to have his kingdom set up in thy heart, and thy very thoughts and affections brought into obedience and captivity? Art thou willing thus to receive Him? Certainly thou shalt be received by Him and have power to become a child of God, Jn. 1:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day of Grace in which the Chief of Sinners may be Turned &amp; Healed</cite>, (London: Parkhurst, 1669), ‘The Day of Grace’ on Lk. 19:41-42, pp. 98-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

Books Online</a></div>
</figure><figure class="quote" id="q-619c122c44" data-kw="">
<blockquote><p>Were not the heart closed, the door shut, Christ would not need to knock; were not the sinner unwilling to open, Christ would not be put to stand knocking, the heart would open to Him at his first approach, at his first knock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works</cite>, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100, p. 45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-d7ba100245" data-kw="">
<blockquote><p>(4) Wilfully. Christ comes and stands; He stands and knocks. Why does He not enter? Why, you will not open. He stands, He is ready to take possession; why is He yet without? Why, you will not give it Him. If Christ did not stand, did not knock, you might pretend a better reason why ye do not open. But when He stands ready to enter, what can be alleged why he is not admitted, but because you will not open?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works</cite>, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100, p. 61</span></figcaption>

</figure><figure class="quote" id="q-71d1c41f51" data-kw="">
<blockquote><p>Or it may be taken as a poetical figure designed to represent the subject more affectingly. God, in his Word and ordinances, is thus to be welcomed by us, 1. With great readiness: the doors and gates must be thrown open to Him. Let the Word of the Lord come into the innermost and uppermost place in our souls; and, if we had 600 necks, we should bow them all to the authority of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 24, verses 7-10</span></figcaption>

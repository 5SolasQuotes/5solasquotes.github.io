<main class="wrap"><figure class="quote" id="q-87ff0c8b2a" data-kw="">
<blockquote><p>[T]hose that have condemned me (the whole rabble of the papistical clergy) have declined from the true faith, have given ear to deceivable spirits and to doctrine of devils, are the stars fallen from the heaven to earth, are fountains without water, and finally are enemies to Christ Jesus, deniers of His virtue and horrible blasphemers of His death and passion.

And further, as that visible church had no crime whereof justly they could accuse either the Prophets either the Apostles, except their doctrine only, so have no such as seek my blood other crime to lay my charge except that I affirm, as always I offer to prove, that the religion which now is maintained by fire and sword is no less contrarious to the true religion taught and established by the Apostles than is darkness to light or the devil to God; and also that such as now do claim the title and name of the church are not more the elect spouse of Christ Jesus than was the synagogue of the Jews the true Church of God what time it crucified Christ Jesus, damned His doctrine and persecuted His Apostles.</p></blockquote>

</figure><figure class="quote" id="q-be26a1a388" data-kw="">
<blockquote><p>Canon IV: Before the creation of the world, God decreed in Christ Jesus our Lord according to his eternal purpose (Eph 3:11), in which, from the mere good pleasure of his own will, without any prevision of the merit of works or of faith, to the praise of his glorious grace, to elect some out of the human race lying in the same mass of corruption and of common blood, and, therefore, corrupted by sin. He elected a certain and definite number to be led, in time, unto salvation in Christ, their Guarantor and sole Mediator. And on account of his merit, by the mighty power of the regenerating Holy Spirit, he decreed these elect to be effectually called, regenerated and gifted with faith and repentance. So, indeed, God, determining to illustrate his glory, decreed to create man perfect, in the first place, then permit him to fall, and finally pity some of the fallen, and therefore elect those, but leave the rest in the corrupt mass, and finally give them over to eternal destruction. Canon V: Christ himself is also included in the gracious decree of divine election, not as the meritorious cause, or foundation prior to election itself, but as being himself also elect (I Pet 2:4, 6). Indeed, he was foreknown before the foundation of the world, and accordingly, as the first requisite of the execution of the decree of election, chosen Mediator, and our first born Brother, whose precious merit God determined to use for the purpose of conferring, without detriment to his own justice, salvation upon us. For the Holy Scriptures not only declare that election was made according to the mere good pleasure of the divine counsel and will (Eph 1:5, 9; Matt 11:26), but was also made that the appointment and giving of Christ, our Mediator, was to proceed from the zealous love of God the Father toward the world of the elect. Canon VI: Wherefore, we can not agree with the opinion of those who teach: l) that God, moved by philanthropy, or a kind of special love for the fallen of the human race, did, in a kind of conditioned willing, first moving of pity, as they call it, or inefficacious desire, determine the salvation of all, conditionally, i.e., if they would believe, 2) that he appointed Christ Mediator for all and each of the fallen; and 3) that, at length, certain ones whom he regarded, not simply as sinners in the first Adam, but as redeemed in the second Adam, he elected, that is, he determined graciously to bestow on these, in time, the saving gift of faith; and in this sole act election properly so called is complete. For these and all other similar teachings are in no way insignificant deviations from the proper teaching concerning divine election; because the Scriptures do not extend unto all and each God’s purpose of showing mercy to man, but restrict it to the elect alone, the reprobate being excluded even by name, as Esau, whom God hated with an eternal hatred (Rom 9:11). The same Holy Scriptures testify that the counsel and will of God do not change, but stand immovable, and God in the, heavens does whatsoever he will (Ps 115:3; Isa 47:10); for God is in finitely removed from all that human imperfection which characterizes inefficacious affections and desires, rashness repentance and change of purpose. The appointment, also, of Christ, as Mediator, equally with the salvation of those who were given to him for a possession and an inheritance that can not be taken away, proceeds from one and the same election, and does not form the basis of election.</p></blockquote>

<blockquote><p>Lordship is God’s having absolute right and power to, and over all his creatures, and disposing thereof according to his will, 1 Sam. 3:18; 1 Tim. 6:13; Mt. 20:15; Dan. 4:25. Absolute Soveraignty is due unto God by four titles: Of Creation, Rom. 9:20; Of Conservation, Heb. 1:3; To give the creature to continue in being is more than merely to give it being: as the shadow depends upon the body, so the creature depends upon the Creator. Of Redemption, 1 Cor. 6:20; this exceeds both the former. Of the Last End, Prov. 16:4. The end of the creature is the manifestation of the glory of the Creator. Lordship is in God after the most eminent manner: He has subjects of Himself, authority of Himself, Legislative Power of Himself. He appoints the rule with recompence to the obedient, and punishment to the disobedient according to his mere good pleasure. He is his own rule, his will is the most absolute reason. He gives no account of his matters, Job 33:13. Every creature depends essentially and universally upon the Creator: that is, the creature cannot be, but it must be at the disposing of God. We do not acknowledge ourselves to be creatures, nor God to be Lord, if his pleasure be not acknowledged to be a sufficient and satisfactory reason, of whatsoever He does. The Lordship of God is of Himself, not by occupation, as a title of property arising from a thing found without an owner; nor by donation, succession, purchase or conquest, as created lordships are. All created jurisdiction descends from this absolute Lordship of God. The jurisdiction that Christ as man received from God is universal over all the creatures respectively, Mt. 28:18. The jurisdiction of other men is limited according to the several objects thereof: whether ecclesiastical, where their authority and office is immediately received from Christ though the designation of such persons to such offices be by the call of men. Or civil, whether natural, as parent, and child: Or voluntary, as magistrate and subject.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Lordship is God’s having absolute right and power to, and over all his creatures, and disposing thereof according to his will, 1 Sam. 3:18; 1 Tim. 6:13; Mt. 20:15; Dan. 4:25. Absolute Soveraignty is due unto God by four titles: Of Creation, Rom. 9:20; Of Conservation, Heb. 1:3; To give the creature to continue in being is more than merely to give it being: as the shadow depends upon the body, so the creature depends upon the Creator. Of Redemption, 1 Cor. 6:20; this exceeds both the former. Of the Last End, Prov. 16:4. The end of the creature is the manifestation of the glory of the Creator. Lordship is in God after the most eminent manner: He has subjects of Himself, authority of Himself, Legislative Power of Himself. He appoints the rule with recompence to the obedient, and punishment to the disobedient according to his mere good pleasure. He is his own rule, his will is the most absolute reason. He gives no account of his matters, Job 33:13. Every creature depends essentially and universally upon the Creator: that is, the creature cannot be, but it must be at the disposing of God. We do not acknowledge ourselves to be creatures, nor God to be Lord, if his pleasure be not acknowledged to be a sufficient and satisfactory reason, of whatsoever He does. The Lordship of God is of Himself, not by occupation, as a title of property arising from a thing found without an owner; nor by donation, succession, purchase or conquest, as created lordships are. All created jurisdiction descends from this absolute Lordship of God. The jurisdiction that Christ as man received from God is universal over all the creatures respectively, Mt. 28:18. The jurisdiction of other men is limited according to the several objects thereof: whether ecclesiastical, where their authority and office is immediately received from Christ though the designation of such persons to such offices be by the call of men. Or civil, whether natural, as parent, and child: Or voluntary, as magistrate and subject.”

— John Norton, The Orthodox Evangelist, ... (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 11-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLordship+is+God%E2%80%99s+having+absolute+right+and+power+to%2C+and+over+all+his+creatures%2C+and+disposing+thereof+according+to+his+will%2C+1+Sam.+3%3A18%3B+1+Tim.+6%3A13%3B+Mt.+20%3A15%3B+Dan.+4%3A25.+Absolute+Soveraignty+is+due+unto+God+by+four+titles%3A+Of+Creation%2C+Rom.+9%3A20%3B+Of+Conservation%2C+Heb.+1%3A3%3B+To+give+the+creature+to+continue+in+being+is+more+than+merely+to+give+it+being%3A+as+the+shadow+depends+upon+the+body%2C+so+the+creature+depends+upon+the+Creator.+Of+Redemption%2C+1+Cor.+6%3A20%3B+this+exceeds+both+the+former.+Of+the+Last+End%2C+Prov.+16%3A4.+The+end+of+the+creature+is+the+manifestation+of+the+glory+of+the+Creator.+Lordship+is+in+God+after+the+most+eminent+manner%3A+He+has+subjects+of+Himself%2C+authority+of+Himself%2C+Legislative+Power+of+Himself.+He+appoints+the+rule+with+recompence+to+the+obedient%2C+and+punishment+to+the+disobedient+according+to+his+mere+good+pleasure.+He+is+his+own+rule%2C+his+will+is+the+most+absolute+reason.+He+gives+no+account+of+his+matters%2C+Job+33%3A13.+Every+creature+depends+essentially+and+universally+upon+the+Creator%3A+that+is%2C+the+creature+cannot+be%2C+but+it+must+be+at+the+disposing+of+God.+We+do+not+acknowledge+ourselves+to+be+creatures%2C+nor+God+to+be+Lord%2C+if+his+pleasure+be+not+acknowledged+to+be+a+sufficient+and+satisfactory+reason%2C+of+whatsoever+He+does.+The+Lordship+of+God+is+of+Himself%2C+not+by+occupation%2C+as+a+title+of+property+arising+from+a+thing+found+without+an+owner%3B+nor+by+donation%2C+succession%2C+purchase+or+conquest%2C+as+created+lordships+are.+All+created+jurisdiction+descends+from+this+absolute+Lordship+of+God.+The+jurisdiction+that+Christ+as+man+received+from+God+is+universal+over+all+the+creatures+respectively%2C+Mt.+28%3A18.+The+jurisdiction+of+other+men+is+limited+according+to+the+several+objects+thereof%3A+whether+ecclesiastical%2C+where+their+authority+and+office+is+immediately+received+from+Christ+though+the+designation+of+such+persons+to+such+offices+be+by+the+call+of+men.+Or+civil%2C+whether+natural%2C+as+parent%2C+and+child%3A+Or+voluntary%2C+as+magistrate+and+subject.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%2C+...+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+Of+the+Divine+Essence%2C+pp.+11-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9242468e62.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9242468e62.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-decrees-of-god#:~:text=Lordship%20is%20God%E2%80%99s%20having%20absolute%20right,Or%20voluntary%2C%20as%20magistrate%20and%20subject&amp;text=Lordship%20is%20God%E2%80%99s%20having%20absolute%20right%20and%20power&amp;text=and%20child%3A%20Or%20voluntary%2C%20as%20magistrate%20and%20subject" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

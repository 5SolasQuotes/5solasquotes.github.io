<main class="wrap"><figure class="quote" id="q-836ac9f30c" data-kw="">
<blockquote><p>Thus we simply interpret justification, as the acceptance with which God receives us into his favor as if we were righteous; and we say that this justification consists in the forgiveness of sins and the imputation of the righteousness of Christ.</p></blockquote>

</figure><figure class="quote" id="q-14cd8c458c" data-kw="Imputation Forgiveness">
<blockquote><p>Indeed it remains till death, and it is sin considered in itself, so long as it remains, but it is not imputed unto the person: and in that respect is as though it were not; it being pardoned.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Indeed it remains till death, and it is sin considered in itself, so long as it remains, but it is not imputed unto the person: and in that respect is as though it were not; it being pardoned.”

— William Perkins, A Reformed Catholic, Of Original Sin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIndeed+it+remains+till+death%2C+and+it+is+sin+considered+in+itself%2C+so+long+as+it+remains%2C+but+it+is+not+imputed+unto+the+person%3A+and+in+that+respect+is+as+though+it+were+not%3B+it+being+pardoned.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+Of+Original+Sin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14cd8c458c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14cd8c458c.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" rel="noopener" target="_blank">Read it online · Internet Archive (1597 ed.)</a></div>
</figure><figure class="quote" id="q-31ccf53a7e" data-kw="">
<blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

</figure><figure class="quote" id="q-04f7e630cc" data-kw="">
<blockquote><p>At last, by the mercy of God, meditating day and night, I gave heed to the context of the words, namely, “In it the righteousness of God is revealed, as it is written, ‘He who through faith is righteous shall live.’” There I began to understand that the righteousness of God is that by which the righteous lives by a gift of God, namely by faith. And this is the meaning: the righteousness of God is revealed in the gospel, namely, the passive righteousness with which merciful God justifies us by faith, as it is written, “He who through faith is righteous shall live.” Here I felt that I was altogether born again and had entered paradise itself through open gates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to the Complete Edition of Luther’s Latin Writings</cite>, 1545</span></figcaption>

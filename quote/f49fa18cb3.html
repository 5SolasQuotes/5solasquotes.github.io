<main class="wrap"><figure class="quote" id="q-f49fa18cb3" data-kw="">
<blockquote><p>…we are able to prove that greater corruptions have been found in those Churches unto which the Holy Ghost in the Scriptures has given notable testimony: 2 Kings 12:23[?]; 14:3-4; 2 Chron. 20:31; Mt. 15:5-6; Lk. 3:2 &amp; 2:22, 27; Mt. 8:4 &amp; 23:2-3; 2 Cor. 11:21-22; 1 Cor. 15:12; Rev. 2:14-15, 20-21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England</cite>, [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 4, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…we are able to prove that greater corruptions have been found in those Churches unto which the Holy Ghost in the Scriptures has given notable testimony: 2 Kings 12:23[?]; 14:3-4; 2 Chron. 20:31; Mt. 15:5-6; Lk. 3:2 &amp; 2:22, 27; Mt. 8:4 &amp; 23:2-3; 2 Cor. 11:21-22; 1 Cor. 15:12; Rev. 2:14-15, 20-21.”

— Arthur Hildersham, A Treatise of the Ministry of the Church of England, wherein is handled this Question: Whether it be to be separated from, or joined unto. Which is discussed in Two Letters, the one [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 4, p. 44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+are+able+to+prove+that+greater+corruptions+have+been+found+in+those+Churches+unto+which+the+Holy+Ghost+in+the+Scriptures+has+given+notable+testimony%3A+2+Kings+12%3A23%5B%3F%5D%3B+14%3A3-4%3B+2+Chron.+20%3A31%3B+Mt.+15%3A5-6%3B+Lk.+3%3A2+%26+2%3A22%2C+27%3B+Mt.+8%3A4+%26+23%3A2-3%3B+2+Cor.+11%3A21-22%3B+1+Cor.+15%3A12%3B+Rev.+2%3A14-15%2C+20-21.%E2%80%9D%0A%0A%E2%80%94+Arthur+Hildersham%2C+A+Treatise+of+the+Ministry+of+the+Church+of+England%2C+wherein+is+handled+this+Question%3A+Whether+it+be+to+be+separated+from%2C+or+joined+unto.+Which+is+discussed+in+Two+Letters%2C+the+one+%5Bfor+joining%5D+written+for+it+%5Bby+Hildersham%5D%2C+the+other+against+it+%5Bby+Francis+Johnson%5D+%28Low+Countries%2C+1595%29%2C+section+4%2C+p.+44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff49fa18cb3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f49fa18cb3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=we%20are%20able%20to%20prove%20that,1%20Cor.%2015%3A12%3B%20Rev.%202%3A14%2D15%2C%2020%2D21&amp;text=we%20are%20able%20to%20prove%20that%20greater%20corruptions&amp;text=Cor.%2011%3A21%2D22%3B%201%20Cor.%2015%3A12%3B%20Rev.%202%3A14%2D15%2C%2020%2D21" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ef3bef083" data-kw="">
<blockquote><p>Furthermore that must be observed: what kind of idolatry that is which saint Paul says may fall into a brother and yet he retain the name of ‘brother’. (1 Cor. 8, 10) This appears upon the discourse he makes in that epistle to have been only a sitting down to eat at the feast of idolaters, made in honor of their idols, without any honor done to idols by sacrifice or bodily worship, and without any conscience of that meat more than of other. Which although he prove a species of idolatry: yet was that one of the least and lightest kinds, and such as holding still the foundation of Christianity, could not without obstinacy in it, cut [him] from the church. Whereby [it] falls out that the papists, which in their idolatry raze the foundations of true religion, cannot, by that place, come into any account of the church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, (Heidelberg, 1575), ‘Of election of ministers’, p. 246</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-363697ea87" data-kw="">
<blockquote><p>In which case the Church cannot be settled all in one day, or in one year, but must crave time, as the building of Solomon’s Temple, and of the second Temple after the Babylonian Captivity, which was not accomplished in several years. Nor can it be planted over again all at once, no more than it could be in Joshua’s days, or the Judges, or in the time of the reforming kings of Judah, until the Canaanites and other enemies be subdued. Nor can it be purged totally altogether, but gradually, least it be in hazard of a superpurgation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion</cite>, ed. (1706; Edinburgh: William Gray, 1747), p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

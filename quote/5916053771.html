<main class="wrap"><figure class="quote" id="q-5916053771" data-kw="">
<blockquote><p>If it be here replied that the actions which make up mediate worship, must be actions of the Second Table, not of the First… I answer: It is the verdict of the Word and the common consent of all divines that all the actions and duties which concern our brother as the next object and end, and so determine upon him are required, and regulated by the Second Table: since therefore these things of comliness and order are of this nature, by the Rejoinder’s grant, I do not see how it can be avoided with any colour of reason but they must be commanded in the Second Table, and so come under the definition of mediate worship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship (Amsterdam: Thorp, 1633), Manuduction, ch. 12, ‘Concerning Worship’</cite>, p. 137</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a98356753" data-kw="">
<blockquote><p>Thesis 6. The end is that rational creatures testify their subjection and gratitude to God the Creator, Lord and Benefactor. Thesis 7. These are the causes of divine worship. Two adjuncts above all are sincerity and promptitude. God indeed wills Himself to be worshipped by a soul sincere, not hypocritical, prompt and willing, not unwilling and forced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology (Hanau, 1634; 2nd ed., Amsterdam, 1657), bk. 2, ‘Of the Worship of God’ | 1. ‘Of the Causes, Adjuncts &amp; Distribution of Divine Worship’, theses 3-7</cite>, pp. 652-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thesis 6. The end is that rational creatures testify their subjection and gratitude to God the Creator, Lord and Benefactor. Thesis 7. These are the causes of divine worship. Two adjuncts above all are sincerity and promptitude. God indeed wills Himself to be worshipped by a soul sincere, not hypocritical, prompt and willing, not unwilling and forced.”

— Marcus F. Wendelin, Christian Theology (Hanau, 1634; 2nd ed., Amsterdam, 1657), bk. 2, ‘Of the Worship of God’ | 1. ‘Of the Causes, Adjuncts &amp; Distribution of Divine Worship’, theses 3-7, pp. 652-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThesis+6.+The+end+is+that+rational+creatures+testify+their+subjection+and+gratitude+to+God+the+Creator%2C+Lord+and+Benefactor.+Thesis+7.+These+are+the+causes+of+divine+worship.+Two+adjuncts+above+all+are+sincerity+and+promptitude.+God+indeed+wills+Himself+to+be+worshipped+by+a+soul+sincere%2C+not+hypocritical%2C+prompt+and+willing%2C+not+unwilling+and+forced.%E2%80%9D%0A%0A%E2%80%94+Marcus+F.+Wendelin%2C+Christian+Theology+%28Hanau%2C+1634%3B+2nd+ed.%2C+Amsterdam%2C+1657%29%2C+bk.+2%2C+%E2%80%98Of+the+Worship+of+God%E2%80%99+%7C+1.+%E2%80%98Of+the+Causes%2C+Adjuncts+%26+Distribution+of+Divine+Worship%E2%80%99%2C+theses+3-7%2C+pp.+652-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a98356753.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4a98356753.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=Thesis%206.%20The%20end%20is%20that,and%20willing%2C%20not%20unwilling%20and%20forced&amp;text=Thesis%206.%20The%20end%20is%20that%20rational%20creatures&amp;text=hypocritical%2C%20prompt%20and%20willing%2C%20not%20unwilling%20and%20forced" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8d0a5de47d" data-kw="">
<blockquote><p>5. Divine worship is internal only or external also. Internal worship is merely spiritual, and performed only within the temple of man’s heart, of which none are witnesses but God and a man’s own conscience. All the inward motions of the heart directed unto God are parts of this worship, as faith, hope, confidence, love, fear and joy in God, etc. which are all of them diverse acts and parts of inward worship, in everyone of which God is honored. All which spring from the apprehension of our own wants, and God’s infinite excellency and goodness towards us… 6. External worship is an expressing and setting forth of the internal by outward signs and rites: by which as by certain outward bodily shadows and colors the spiritual and inward worship of God is made visible and sensible to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Divine Worship… (1604), ch. 1</cite></span></figcaption>

</figure><figure class="quote" id="q-77ab6c7afd" data-kw="">
<blockquote><p>The magistrate as such has nothing to do with the spirit, nor can he command the sincerity of the worship; his care is that there be a divine worship, that is, materially and externally right and consonant, externally to the rules of the word; and for this cause learned divines make the external man the object of the magistrates office;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (1646), ch. 24</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-b832562738" data-kw="">
<blockquote><p>What holy invectives does Paul in his epistles make against superstitious worship? Yet how few are the men that mind the pure instituted worship of God, that would have the fountains of Israel without the mixture of any mud in them? Outward oppressions in Popery were nothing so heavy upon the godly as the corrupt mixtures in God’s worship; but if you observe the general disposition of men, they are wholly carried out to some sensible superstitious ways of worship. They love not the simplicity and purity of God’s worship. It is great proficiency in Christianity not to have our minds corrupted herein. As children delight in babies, so do men [delight] in some worships of their own that they have made. What is Popery but a mere stage-play in the worship of God? And if you ask of hundreds of ceremonies they have: ‘Whose image and superscription is upon them?’ You shall find none of God’s imprinted on them. There were the statutes of the heathens (Lev. 20) and these the people must not go in (Eze. 20). There are statutes of our fathers we must not walk in: Oh there is too much of this superstition still in men! Men by false worship manifest they have not spiritual hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652) | section 11, sermon 95</cite>, pp. 563-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

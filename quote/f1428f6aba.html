<main class="wrap"><figure class="quote" id="q-f1428f6aba" data-kw="">
<blockquote><p>To the [citation of the] Confession of Wittenburg [by ‘good divines’] it is answered [by Ames’s opponents]: 1. That it does not so much as give any glance at Mark 7. Which, how true it is, may appear by these their words: ‘Nor is it lawful to restore either the old rites of the law, or to devise new in their place to signify the truth of the gospel now come to light, as for example, to use banners and crosses to sign Christ’s victory on the cross: of which kind of i […]ly devised representations is the whole furniture of Mass accontrements, which they say does set forth the whole passion of Christ and many such like things. Of which sacred ceremonies Christ preaches out of Isaiah: In vain they worship Me, teaching for doctrines the precepts of men.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 7-8, 214, 232, 353, 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6410d65b06" data-kw="">
<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, on the First Commandment (heart / creature idolatry)</span></figcaption>

<blockquote><p>…we have not now the miraculous presence of God, his appearing as at the bush. God has not given us under the Gospel those symbols of his standing presence and residency, as by the ark, and mercy-seat, and altar of old He gave unto his people.</p></blockquote>

</figure><figure class="quote" id="q-b4ae3141e7" data-kw="">
<blockquote><p>The extraordinary presence of God was by his miraculous apparitions and discovering Himself by some miraculous token, vision, sign, or manifestation of his presence, as now here in this burning, and not consumed bush; here was a miraculous token of God’s presence. We shall and in the fifth of Joshua… I conceive, hence it is, the mountain in which Christ was transfigured is called, ‘the holy mountain,’ 2 Pet. 1:18… Why holy? Not as if it were holy at that time when the apostle writ that epistle, but it were manifest there was an extraordinary manifestation and sign of God’s presence, and so long as this extraordinary manifestation of God’s presence continued it was called ‘holy.’… And remember this place now, of God’s extraordinary miraculous manifestation of Himself in the bush was holy for that time, and no longer, wherein He did manifest Himself; for otherwise, in the time of the Law, it were unholy to offer up sacrifice there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Collection of Farewell Sermons preached by the Late London-Ministers</cite>, … (London: 1662), Mr. Jenkin’s Afternoon Sermon, pp. 287-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

%20offer%20up%20sacrifice%20there" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

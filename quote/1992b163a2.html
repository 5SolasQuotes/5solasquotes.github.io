<main class="wrap"><figure class="quote" id="q-1992b163a2" data-kw="">
<blockquote><p>For do we not believe that Christ had indeed Man’s bones; and therefore such as of their own nature might at any time have been broken; and yet indeed they could not be broken, for that it was otherwise decreed by God: There­fore by hap and chance, concerning their own nature they were not bro­ken; when as notwithstanding they were such as might have been broken, and yet by God’s Decree they remained of necessity unbroken. Again, that Christ from the very time that he took upon him our Human nature was endued with a Mortal body, all Christians do confess; therefore of his own nature he might have been slain by Herod, with the other little Children; but by God’s Decree he could not:

Therefore that he was not then slain, fell out by hap and chance, if you consider the nature of his Body, when as it might have chanced otherwise: But, by God’s Decree, he could no more be slain by Herod, than the will of God could be chan­ged. Christ when he was carried to be crucified, was then undoubtedly of such health, that he needed not at that time to have died; he died there­fore by chance, if you do consider the cause of his Natural death; and yet be died of necessity, if you look to the unchangeable appointment of his Father, because his hour was come: and withal he died willingly, be­cause he laid down his Life for us. Thus far therefore is neither chance nor will repugnant unto the most certain Decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A learned treatise of the plague wherein the two questions, whether the plague be infectious or no, and, whether and how far it may be shunned of Christians by going aside, are resolved. Written in Latin</cite>, (London: Thomas Ratcliffe, 1665), pp 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

Therefore that he was not then slain, fell out by hap and chance, if you consider the nature of his Body, when as it might have chanced otherwise: But, by God’s Decree, he could no more be slain by Herod, than the will of God could be chan­ged. Christ when he was carried to be crucified, was then undoubtedly of such health, that he needed not at that time to have died; he died there­fore by chance, if you do consider the cause of his Natural death; and yet be died of necessity, if you look to the unchangeable appointment of his Father, because his hour was come: and withal he died willingly, be­cause he laid down his Life for us. Thus far therefore is neither chance nor will repugnant unto the most certain Decree of God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f34c6a4968" data-kw="">
<blockquote><p>XXIII. While Christ’s passion is minimized by the foregoing errors, those who teach that he died for all human beings (pro omnibus et singulis) broaden the object of his passion more than is allowable. Of course, if we take into consideration the magnitude and worthiness of the merit, we admit that it would suffice for the redemption of ten worlds; but if we take the plan of God and the intention of Christ into consideration, then it is false to say that Christ died for every person. For this reason others say that his death was sufficient for all, but not effective for all; that is, the merit of Christ, because of his worthiness, is sufficient for all, but it is not effective for all in its application, because Christ did not die with the intention that his death be applied to all. Why should He die for those for whom He would not pray?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ed. John Beardslee, Reformed Dogmatics (Grand Rapids: Baker, 1977), pp. 105-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-d8e09614c0" data-kw="">
<blockquote><p>Whether Christ died for us, that is vicariously and in our place, and further that salvation was brought forth for us? It is affirmed against the Socinians. … Whether He is our mediator only so far as a messenger is? It is denied. Whether Christ truly reconciled us to the Father, or whether our redemption done through that indeed was only metaphorical? The former is affirmed, the latter is denied. … Whether Christ’s death is meritorious to us, or it was in truth a preparation only unto his priesthood? The former is affirmed. Whether the dogma of satisfaction and merit in the sacred pages is founded, or repugnant to right reason? The former is affirmed, the latter is denied. …</p></blockquote>

</figure><figure class="quote" id="q-1b869e136d" data-kw="">
<blockquote><p>Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The “Miscellanies”</cite>, (1722), WJE Online vol. 13, t. ‘Universal Redemption’, p. 174</span></figcaption>

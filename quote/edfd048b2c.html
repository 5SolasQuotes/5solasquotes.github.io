<blockquote><p>The Free Church of Scotland minister, Dr Thomas Guthrie, said the following about Northern and British guilt in Southern slavery:

Abuse the South as men may, I say that in some respects the North is the guiltier of the two. They know the truth, they had the truth, they were free, and they ought to have more sympathy with the cause of freedom than men bred up in the South with slavery; and, for my part, I sometimes think there are six of the one and half-a-dozen of the other. I don’t say that our own country is without blame in the matter, and I should not be surprised that we suffer some share of the judgment. Our merchants and manufacturers were long guilty of neglecting to raise cotton in our own colonies, and thereby to cut the foundation out below slavery. But just look at New York – look at its merchants. It is a notorious fact that the merchants of New York, by the reverence which they pay to the dollar, have been the mainstay of slavery in the South. It is New York dollars that have built every slave ship, and it is by New York merchants that every ship is owned that carries on that infamous traffic. And look to the pulpits of the North – look to their preachers and their ministers. They have employed their pens and prostituted their pulpits in defending this atrocious system.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-guthrie.html">Thomas Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 14 May 1861.</span></figcaption>

<blockquote><p>BELFAST ANTI-SLAVERY SOCIETY

On Thursday evening, a meeting of this Society was held in the Presbyterian Church, Rosemary-street, to give the delegates from the American Anti-slavery Society the opportunity of laying before the people of this country the present condition of slavery in the United States, and the results of emancipation in the British Colonies.

At half-past seven o’clock, the Rev. THOMAS DREW, of Christ Church, was called to the chair, and commenced the business by prayer. He afterwards proceeded to observe, that he was happy to respond to the wish of the Society, to preside at this meeting; and believed that every one, whatever were his opinions on other subjects, was convinced of this, – that slavery was a curse. (Hear, hear.) The great meeting held this year in London, at which the illustrious husband of our gracious Sovereign [Prince Albert] presided, was a striking demonstration of this, for there men of all sects and parties, united by one common bond of charity and mercy, came to the declaration, that no man had the power over his fellow-creature to treat him as if he were chattel property; for what is so degrading and brutalizing as the whole iniquitous system? what can a slave man be as a husband? what a slave woman as a wife?

Here, under the place we are now assembled, is an admirable Sunday School, conducted by Mr [James] Gibson, which is an honour to that gentleman, and to the town at large; but mark the contrast in the States of America, which is an honour to that gentleman, and to the town at large; but mark the contrast in the States of America, which boast of their freedom. If any negro shall venture to teach a Sunday school, he is fined £500; and if the offence shall be repeated, he is subject to the penalty of death. I am sorry to say that a native of this town, a man of great talents, has written a book in favour of slavery.

It may not be generally known, that the Lough of Belfast has been stained with the blood of slaves. More than 100 years ago, when slavery was even worse than at present, a ship with slaves, driven by stress of weather, took shelter in our beautiful Lough. She anchored near Bangor, and there many of the slaves instinctively leaped into the water, and got on shore – proud of the glorious privilege which spoke to their hearts, that the slave who planted his foot on British ground was free.

The captain seeing the danger of losing all his ill fated cargo, and determined by a signal act of tyranny to make an example to deter the slaves from seeking their freedom, took a young female slave, and placing round her waist a rope, lowered her repeatedly from the yard-arm into the water – her shrieks were loud, but disregarded – at last he drew up only one-half of his murdered victim, for the sharks, seeking for human blood, had followed the vessel, and now got their prey. That blood is still crying out for vengeance, and no conscientious man is innocent who does not protest against the atrocious injustice of slavery. (Cheers.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-drew.html">Thomas Drew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commercial Chronicle</cite>, 31 October 1840.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

<blockquote><p>To go as pirates and catch up poor negroes or people of another land, that never forfeited life or liberty, and to make them slaves, and sell them, is one of the worst kinds of thievery in the world; and such persons are to be taken for the common enemies of mankind; and they that buy them and use them as beasts, for their mere commodity, and betray, or destroy, or neglect their souls, are fitter to be called incarnate devils than Christians, though they be no Christians whom they so abuse.</p></blockquote>

<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach… nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>

<blockquote><p>What compelled people may do to redeem their lives, with loss of liberty, is nothing to the point… and that they may sell the liberty of their posterity, not yet born, is utterly denied as unlawful; yea, a violentated father to me is a father, and not a father, and the posterity may vindicate their own liberty given away unjustly before they were born, Qua omne regnum vi partum potest vi dissolvi.</p></blockquote>

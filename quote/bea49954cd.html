<main class="wrap"><figure class="quote" id="q-bea49954cd" data-kw="">
<blockquote><p>James McLeod Willson’s periodical praised the First Book of Discipline of the Church of Scotland for its proposed system of education. Note that it commends the idea of schools and universities, further demonstrating that radical or exclusive homeschooling is a position at odds with Covenanter doctrine:

Still, there are portions of this first Book, which never having, been superseded, or set aside, we must acknowledge and claim as imbodying [sic] the principles and aims of that church whose faith we have inherited and embraced. For example, chapter vii, which treats of “Schools and Universities,” contains the most masterly synopsis of sound principles and wise practical directions on the subject of both a common and a finished education, that the world bas probably ever seen. Even Scotland has many steps to take before she fills up the outline marked out, so long ago, by her sagacious and intrepid Reformer. We hold to this part of our ecclesiastical attainments. And we expect to see the day — at all events, the day will come — when the noble and patriotic scheme of education adopted three centuries ago by the Church of Scotland, will be carried out there, and in other lands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philadelphia-covenanter.html">Philadelphia Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Second Book of Discipline’ in Covenanter</cite>, ii (May 1846), p. 294.</span></figcaption>

<blockquote><p>64. Is universal doubt necessary in order to knowledge and sound conviction of natural theology, as some have taught? Ans. No; it is useless, impossible, sinful, and dangerous.

65. Wherein useless? Ans. Doubt gives no light, removes no bias of mind or affections, and does not dispose the mind to a thorough investigation.

66. Why or wherein impossible? Ans. We cannot at plea sure remove all convictions.

67. How is it sinful? Ans. It rejects the love, fear, reverence, obedience, and worship, due to God, for the time, and trifles with light and evidences already received.

68. How is it dangerous? Ans. It trifles with light and conviction, refuses duty for the time, and God may judicially harden and blind us; Isa. vi. 9, 10; xliv. 18, 19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), p. 23.</span></figcaption>

</figure><figure class="quote" id="q-cab3ffe377" data-kw="">
<blockquote><p>Fifthly, purchase this inestimable jewel, and be diligent in giving it a place in your home. One of the current customs which I consider most desirable and praiseworthy is that of many prominent citizens having a large, beautiful Bible, together with a Psalm book, on display in every room. If only they would use them more frequently! One of the most appropriate acts of mercy is to provide the poor with Bibles, and to question them frequently whether they are also reading them daily.

Those of limited means who do not wish to receive anything as a gift, must be diligent in saving all their pennies for the purpose of purchasing a Bible. Those who are not able to read must exert every effort to learn, with the objective to be able to read the Word of God. A home without a Bible is a ship without a rudder and a Christian without a Bible is a soldier without a weapon</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 76.</span></figcaption>

<blockquote><p>[H]ow blessed a privilege is God’s holy day … To sit entirely loose to the world for a seventh part of our sojourn within it – to know that, insignificant as man is, the movements of the whole heavens and the earth are reciprocally attuned and adjusted, so as to evolve to us a weekly period of holy rest – to know that, when it comes, God’s ear, never closed, is specially open to our cry – to know that, when we come into his courts, the ever present God is then specially present Father, to bless, and save, and sanctify. Oh! surely the heart must be callous and cold indeed, steeled in the hardness of triple brass, which does not respond to all this with its inmost and most holy feeling; and which, in the simple knowledge of this, not to speak of the enjoyment of it, does not grow humbler, and wiser, and holier, and better!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath made for Man: A Sermon Preached in the Free Church, Panbride, on February 2, 1845. In Accordance with the Recommendation of the General Assembly</cite>, (Dundee: McCosh, 1845), p. 16.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ea83841810" data-kw="remaining corruption">
<blockquote><p>Is sanctification so perfect in this life that believers can fulfill the law absolutely? We deny against the Romanists and Socinians. Among the questions concerning sanctification agitated between us and the ancient and modern Pelagians, are two principal ones: the first referring to its origin, the other to its perfection. It is well known that this is enumerated also among the many heads of the Pelagian hydra—that he contended that the believer can in this life live without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.2.1</span></figcaption>

</figure><figure class="quote" id="q-e2292fd89c" data-kw="Mortification">
<blockquote><p>Every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, -- it is enmity, it will poison, it will burn. … Mortification abates of its force, but doth not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote>

<blockquote><p>I appeal to every man’s conscience, whether the very light of nature doth not suggest that not only some time but a convenient proportion of time ought to be consecrated unto God; and when God hath manifested this to be one day in seven under the Law; doth not the very light of nature suggest, that we should sin against God, if we should not allow unto him as good a proportion of time under the Gospel? And further if the Lord’s Day, be of Divine institution amongst us Christians, is it not still the Law of God even unto us, to allow unto him one day in seven?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment, as still in force to bind Christians</cite>, (London, 1641), p. 153.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-283f0623bb" data-kw="">
<blockquote><p>8. Does the fourth commandment require the observance of the seventh day of the week, or Saturday, as the Sabbath? No. It is of course true, as a matter of that the Old Testament Sabbath was on the seventh day of the week, but the fourth commandment does not require this. It commands diligent labour for six days, but does not specify on what day the week is to begin. The fourth commandment requires that the seventh day after six days of labour be observed as the Sabbath, but this does not imply that it must necessarily be on the seventh (or last) day of the week. The requirement of the commandment is met by the Christian practice of working from Monday through Saturday (six days) and then observing the first day of the foIlowing week as the Sabbath.

9. Why was the Old Testament Sabbath the seventh day of the week? The Old Testament Sabbath was the seventh (last) day of the week because of God’s example and ordinance at the time of the creation (Gen. 2:1-3). Apart from providing an appointed day for rest and worship, the Sabbath served as a reminder of God’s work of creation. This truth of creation, of course, implies that all things, including human beings, are absolutely dependent on God for their very existence. It also implies that human beings are morally responsible to God for their lives. Thus the weekly Sabbath, commemorating the creation, was calculated to serve as a continually repeated reminder of man’s dependence on God and his moral accountability to God, which is to say that the Sabbath was calculated to serve as a constant reminder of the very foundations of religion and morality.

10. Why is the Christian Sabbath on the first day of the week? The Christian Sabbath, or the Lord’s Day is on the first day of the week in remembrance of Christ’s resurrection from the dead. Thus it may he said that the Old Testament Sabbath commemorated God’s original creation, while the Christian Sabbath in addition calls attention to God’s new creation, his great work of redemption in Jesus Christ.

11. Who changed the day of the Sabbath from the seventh to the first day of the week? Our Lord Jesus Christ, by the accomplishment of his great redemptive work, brought about the close of the Old Testament dispensation and the opening of the New Testament dispensation of the covenant of grace. The change from the seventh to the first day of the week is a part of this change of dispensation. It has been observed that our Saviour was crucified on the sixth day of the week, and buried on the evening of the sixth day, and remained in the tomb the whole of the seventh day, and arose from the dead on the first day of the week. Thus Christ buried the Old Testament seventh day Sabbath in the tomb with himself; and left it there, and when he arose he brought with him the New Testament Sabbath, which is to he observed on the first day of the week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 323-24.</span></figcaption>

</figure><figure class="quote" id="q-55419a7a8f" data-kw="">
<blockquote><p>What a stop hath been set to Superstition? How good a progress hath been made in Reformation? And may we not yet hope that God will do better unto us then at our beginnings? God’s promise is the ground of hope: and my Text sheweth that God hath promised as much.

Go on, Right Honourable, and put forth your utmost endeavours, for bringing on those better things that yet remain. Where there is Hope, their endeavours use to be most earnest: For Hope stirreth up men’s spirits to set upon great things.

Though the full accomplishment of the remaining better things should be reserved to a future age, yet it becomes us, to be as earnest in prosecuting them, according to the ability and opportunity that God doth give us, as if we our selves were sure, while we live, to have the fruition of them.

Experience sheweth that to be true, which of old was said of the provident husbandman, that he planteth trees which may be useful in an other age. But I hope that God will let you see and enjoy the fruit of your Counsels, and of our desires. This shall be the continual prayer of

Your Honours’ humble Servant and Orator, William Gouge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), epistle dedicatory.</span></figcaption>

<blockquote><p>Q. WHAT ought to be the chief, &amp; continual care of every man in this life?

A. To glorify God, and save his soul.

Expos. 1. God’s glory, that is, his surpassing worthiness, cannot be increased, nor fully manifested. Ex. 33. 20. because he is most perfect. Psal. 16. 2. and infinite. Job 22. 2. and 35. 7. God is said to glorify himself when he makes his excellency to appear. Numb. 14. 21. Psal. 72. 19. Ezeck. 43. 2. Angels and men glorify him when they extoll his greatness, and testify their acknowledgement of his glory. Luc. 2. 14. Rev. 14. 7. Ex. 15. 2. Here then to glorify God, is inwardly in heart. Rom. 4. 20. 1. Cor. 6. 20. and outwardly in word and action. Matth. 5. 16. 1. Pet. 2. 12. to acknowledge God to be such a one as he hath revealed himself. Rev. 4. 9. 11. Psal. 29. 1. 2. and. 50. 23. Of glorifying God, man should be most careful: for God is the beginning from which, and the end unto which all things do tend. Rom. 11. 36. his glory is in it self most excellent. Exod. 33. 18. 19. Psal. 148. 13. most dear to him. Ex. 7. 4. 5. Esa. 42. 8. and 48. 11. the supreme end of all divine revelation. Eph. 2. 7. of all his works. Eph. 1. 5. 6. Pro. 16. 4. Exod. 9. 16. Psal. 50. 15. Ioh. 11. 4. 40. of man’s life. Psa. 6. 4. 5. and service. Zach. 7. 5. 6. Psa. 101. 1. Joh. 3. 28. 29: and all means furthering the same, are available to man’s salvation. Rom. 4. 20. 21. Jer. 13. 16. Matth. 2. 2. 1. Sam. 2. 30. Psal. 50. 23.

2. To take care for our salvation, is so to live here, that we may live with the Lord hereafter. Phi. 2. 12. 2. Pet. 3. 11. 14. The salvation of the soul is most precious. Psal. 49. 8. cannot be obtained without care. Act. 2. 37. 1. Cor. 9. 24. Matth. 7. 13. Luk. 12 24. and he is ever mindless of God’s glory, that is careless of his eternal happiness. Eph. 2. 12. Joh. 5. 44. and, 7. 18. Also eternal life is a durable treasure. Luk. 12. 33. and 16. 9. 10. 1. Tim. 6. 17. 18. all worldly things are vain, uncertain, and transitory. Matth. 6. 19. Psa. 73. 18. 19. the soul came from God and is after a restless manner carried to seek, and desire communion with God, and a desire to be happy, is naturally planted in the hearts of all men, by God himself; therefore we should earnestly set our affections upon things that are above. Col. 3. 1, 2. Phil. 3. 12, 13, 14. and infinitely desire the enjoying of God’s presence in heaven, for he is infinite in goodness, the highest of all things that are to be desired.

Q. Whence must we take direction to attain hereunto?

A. Out of the word of God alone.

Expos. 3. God only can give the crown of glory. 2. Tim. 4. 8. Jam. 1. 12. he also is the author, object, &amp; end of true religion. Gen. 18. 19. Act. 18. 25. 26. Joh. 6. 29. therefore none but he can reveal the way how we should obtain that everlasting inheritance. Psal. 16. 11. Pro. 2. 6. 9. For the nature of God is incomprehensible, his will and works are unsearchable. Heb. 11. 6. Deut. 4. 4. 6. and 29. 29. Heb. 11. 3. No man hath known the Father but the Son, and he to whom the Son hath revealed him. Joh. 1. 18. Matth. 11. 27. and the Gospel is an hidden mystery. 1. Cor. 2. 7. 10. Rom. 16. 25. 26. so that we can know nothing of God, until God himself manifesteth it unto us. Psal. 103. 7. and 147. 19. 20. By the word of God, we understand the will of God revealed to reasonable creatures, teaching them what to do, believe, and leave undone. Deut. 29. 29.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Q. WHAT ought to be the chief, &amp; continual care of every man in this life?

A. To glorify God, and save his soul.

Expos. 1. God’s glory, that is, his surpassing worthiness, cannot be increased, nor fully manifested. Ex. 33. 20. because he is most perfect. Psal. 16. 2. and infinite. Job 22. 2. and 35. 7. God is said to glorify himself when he makes his excellency to appear. Numb. 14. 21. Psal. 72. 19. Ezeck. 43. 2. Angels and men glorify him when they extoll his greatness, and testify their acknowledgement of his glory. Luc. 2. 14. Rev. 14. 7. Ex. 15. 2. Here then to glorify God, is inwardly in heart. Rom. 4. 20. 1. Cor. 6. 20. and outwardly in word and action. Matth. 5. 16. 1. Pet. 2. 12. to acknowledge God to be such a one as he hath revealed himself. Rev. 4. 9. 11. Psal. 29. 1. 2. and. 50. 23. Of glorifying God, man should be most careful: for God is the beginning from which, and the end unto which all things do tend. Rom. 11. 36. his glory is in it self most excellent. Exod. 33. 18. 19. Psal. 148. 13. most dear to him. Ex. 7. 4. 5. Esa. 42. 8. and 48. 11. the supreme end of all divine revelation. Eph. 2. 7. of all his works. Eph. 1. 5. 6. Pro. 16. 4. Exod. 9. 16. Psal. 50. 15. Ioh. 11. 4. 40. of man’s life. Psa. 6. 4. 5. and service. Zach. 7. 5. 6. Psa. 101. 1. Joh. 3. 28. 29: and all means furthering the same, are available to man’s salvation. Rom. 4. 20. 21. Jer. 13. 16. Matth. 2. 2. 1. Sam. 2. 30. Psal. 50. 23.

2. To take care for our salvation, is so to live here, that we may live with the Lord hereafter. Phi. 2. 12. 2. Pet. 3. 11. 14. The salvation of the soul is most precious. Psal. 49. 8. cannot be obtained without care. Act. 2. 37. 1. Cor. 9. 24. Matth. 7. 13. Luk. 12 24. and he is ever mindless of God’s glory, that is careless of his eternal happiness. Eph. 2. 12. Joh. 5. 44. and, 7. 18. Also eternal life is a durable treasure. Luk. 12. 33. and 16. 9. 10. 1. Tim. 6. 17. 18. all worldly things are vain, uncertain, and transitory. Matth. 6. 19. Psa. 73. 18. 19. the soul came from God and is after a restless manner carried to seek, and desire communion with God, and a desire to be happy, is naturally planted in the hearts of all men, by God himself; therefore we should earnestly set our affections upon things that are above. Col. 3. 1, 2. Phil. 3. 12, 13, 14. and infinitely desire the enjoying of God’s presence in heaven, for he is infinite in goodness, the highest of all things that are to be desired.

Q. Whence must we take direction to attain hereunto?

A. Out of the word of God alone.

Expos. 3. God only can give the crown of glory. 2. Tim. 4. 8. Jam. 1. 12. he also is the author, object, &amp; end of true religion. Gen. 18. 19. Act. 18. 25. 26. Joh. 6. 29. therefore none but he can reveal the way how we should obtain that everlasting inheritance. Psal. 16. 11. Pro. 2. 6. 9. For the nature of God is incomprehensible, his will and works are unsearchable. Heb. 11. 6. Deut. 4. 4. 6. and 29. 29. Heb. 11. 3. No man hath known the Father but the Son, and he to whom the Son hath revealed him. Joh. 1. 18. Matth. 11. 27. and the Gospel is an hidden mystery. 1. Cor. 2. 7. 10. Rom. 16. 25. 26. so that we can know nothing of God, until God himself manifesteth it unto us. Psal. 103. 7. and 147. 19. 20. By the word of God, we understand the will of God revealed to reasonable creatures, teaching them what to do, believe, and leave undone. Deut. 29. 29.”

— John Ball, A short treatise: containing all the principal grounds of Christian religion. By way of questions and answers: very profitable for all sorts of men, but especially for householders, (London: William Welby, 1617), pp 1-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+WHAT+ought+to+be+the+chief%2C+%26+continual+care+of+every+man+in+this+life%3F%0A%0AA.+To+glorify+God%2C+and+save+his+soul.%0A%0AExpos.+1.+God%E2%80%99s+glory%2C+that+is%2C+his+surpassing+worthiness%2C+cannot+be+increased%2C+nor+fully+manifested.+Ex.+33.+20.+because+he+is+most+perfect.+Psal.+16.+2.+and+infinite.+Job+22.+2.+and+35.+7.+God+is+said+to+glorify+himself+when+he+makes+his+excellency+to+appear.+Numb.+14.+21.+Psal.+72.+19.+Ezeck.+43.+2.+Angels+and+men+glorify+him+when+they+extoll+his+greatness%2C+and+testify+their+acknowledgement+of+his+glory.+Luc.+2.+14.+Rev.+14.+7.+Ex.+15.+2.+Here+then+to+glorify+God%2C+is+inwardly+in+heart.+Rom.+4.+20.+1.+Cor.+6.+20.+and+outwardly+in+word+and+action.+Matth.+5.+16.+1.+Pet.+2.+12.+to+acknowledge+God+to+be+such+a+one+as+he+hath+revealed+himself.+Rev.+4.+9.+11.+Psal.+29.+1.+2.+and.+50.+23.+Of+glorifying+God%2C+man+should+be+most+careful%3A+for+God+is+the+beginning+from+which%2C+and+the+end+unto+which+all+things+do+tend.+Rom.+11.+36.+his+glory+is+in+it+self+most+excellent.+Exod.+33.+18.+19.+Psal.+148.+13.+most+dear+to+him.+Ex.+7.+4.+5.+Esa.+42.+8.+and+48.+11.+the+supreme+end+of+all+divine+revelation.+Eph.+2.+7.+of+all+his+works.+Eph.+1.+5.+6.+Pro.+16.+4.+Exod.+9.+16.+Psal.+50.+15.+Ioh.+11.+4.+40.+of+man%E2%80%99s+life.+Psa.+6.+4.+5.+and+service.+Zach.+7.+5.+6.+Psa.+101.+1.+Joh.+3.+28.+29%3A+and+all+means+furthering+the+same%2C+are+available+to+man%E2%80%99s+salvation.+Rom.+4.+20.+21.+Jer.+13.+16.+Matth.+2.+2.+1.+Sam.+2.+30.+Psal.+50.+23.%0A%0A2.+To+take+care+for+our+salvation%2C+is+so+to+live+here%2C+that+we+may+live+with+the+Lord+hereafter.+Phi.+2.+12.+2.+Pet.+3.+11.+14.+The+salvation+of+the+soul+is+most+precious.+Psal.+49.+8.+cannot+be+obtained+without+care.+Act.+2.+37.+1.+Cor.+9.+24.+Matth.+7.+13.+Luk.+12+24.+and+he+is+ever+mindless+of+God%E2%80%99s+glory%2C+that+is+careless+of+his+eternal+happiness.+Eph.+2.+12.+Joh.+5.+44.+and%2C+7.+18.+Also+eternal+life+is+a+durable+treasure.+Luk.+12.+33.+and+16.+9.+10.+1.+Tim.+6.+17.+18.+all+worldly+things+are+vain%2C+uncertain%2C+and+transitory.+Matth.+6.+19.+Psa.+73.+18.+19.+the+soul+came+from+God+and+is+after+a+restless+manner+carried+to+seek%2C+and+desire+communion+with+God%2C+and+a+desire+to+be+happy%2C+is+naturally+planted+in+the+hearts+of+all+men%2C+by+God+himself%3B+therefore+we+should+earnestly+set+our+affections+upon+things+that+are+above.+Col.+3.+1%2C+2.+Phil.+3.+12%2C+13%2C+14.+and+infinitely+desire+the+enjoying+of+God%E2%80%99s+presence+in+heaven%2C+for+he+is+infinite+in+goodness%2C+the+highest+of+all+things+that+are+to+be+desired.%0A%0AQ.+Whence+must+we+take+direction+to+attain+hereunto%3F%0A%0AA.+Out+of+the+word+of+God+alone.%0A%0AExpos.+3.+God+only+can+give+the+crown+of+glory.+2.+Tim.+4.+8.+Jam.+1.+12.+he+also+is+the+author%2C+object%2C+%26+end+of+true+religion.+Gen.+18.+19.+Act.+18.+25.+26.+Joh.+6.+29.+therefore+none+but+he+can+reveal+the+way+how+we+should+obtain+that+everlasting+inheritance.+Psal.+16.+11.+Pro.+2.+6.+9.+For+the+nature+of+God+is+incomprehensible%2C+his+will+and+works+are+unsearchable.+Heb.+11.+6.+Deut.+4.+4.+6.+and+29.+29.+Heb.+11.+3.+No+man+hath+known+the+Father+but+the+Son%2C+and+he+to+whom+the+Son+hath+revealed+him.+Joh.+1.+18.+Matth.+11.+27.+and+the+Gospel+is+an+hidden+mystery.+1.+Cor.+2.+7.+10.+Rom.+16.+25.+26.+so+that+we+can+know+nothing+of+God%2C+until+God+himself+manifesteth+it+unto+us.+Psal.+103.+7.+and+147.+19.+20.+By+the+word+of+God%2C+we+understand+the+will+of+God+revealed+to+reasonable+creatures%2C+teaching+them+what+to+do%2C+believe%2C+and+leave+undone.+Deut.+29.+29.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+short+treatise%3A+containing+all+the+principal+grounds+of+Christian+religion.+By+way+of+que <blockquote><p>They [congregationalists] count it necessary that all the church officers should live upon the charge of the congregation, the ruling elders and deacons as well as the pastors and doctors; but all they will have them to receive, is a mere alms, a voluntary contribution, laid down as an offering at the deacons’ feet every Lords Day, and by him distributed to all the officers and the poor of the congregation according as they have need. This is their doctrine, but it seems they are weary long ago of its practice.</p></blockquote>

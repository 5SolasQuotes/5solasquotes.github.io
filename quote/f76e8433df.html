<main class="wrap"><figure class="quote" id="q-f76e8433df" data-kw="">
<blockquote><p>Now although the efficiency of Christ&#x27;s Resurrection extends to the resurrection of the good and wicked alike, still its exemplarity extends properly only to the just, who are made conformable with His Sonship, according to Romans 8:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, III, q. 56, a. 1, ad 3</span></figcaption>

</figure><figure class="quote" id="q-ed34e8b466" data-kw="">
<blockquote><p>Properly speaking, Christ&#x27;s Resurrection is not the meritorious cause, but the efficient and exemplar cause of our resurrection.... And since, as was stated above (Reply to Objection 2), the primary cause of human resurrection is the Divine justice, from which Christ has &quot;the power of passing judgment, because He is the Son of Man&quot; (John 5:27); the efficient power of His Resurrection extends to the good and wicked alike, who are subject to His judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, III, q. 56, a. 1, ad 3</span></figcaption>

</figure><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 7, ch. 4 (Of the Resurrection of the Body)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement/particular-redemption.html">Particular redemption</a></span><span class="t"><a href="../topics/resurrection/christs-resurrection-as-the-pledge.html">Christ&#x27;s Resurrection as the Pledge</a> › <a href="../topics/resurrection/christs-resurrection-as-the-pledge/united-to-the-risen-head.html">United to the risen Head</a></span></div>

</figure><figure class="quote" id="q-9fe71f9563" data-kw="last things necessity">
<blockquote><p>The necessity and utility of this discussion are of the very highest. There is no precaution against sin and incentive to good works more efficacious than this meditation which impresses upon our minds: a contempt for the world and all earthly things; a desire for heaven and heavenly goods; hatred of sin and desire of holiness; a reverence and fear of the deity, before whom we must stand; an alleviation and solace for all troubles, which are shortly to come to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.1.2</span></figcaption>

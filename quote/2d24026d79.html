<main class="wrap"><figure class="quote" id="q-2d24026d79" data-kw="">
<blockquote><p>For matter of imposing-upon, I am not guitly. In the [Westminster] Assembly, I gave my vote with others; that the Confession of Faith, put out by authority, should not be required to be subscribed to, we having been burnt in the hand in that kind before: but so as not to be publicly preached or written against; which indeed is contrary to that ‘liberty of prophesying’ which some so call for…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Moral &amp; Religious Aphorisms collected from the Manuscript Papers of the Reverend &amp; Learned Doctor Whichcote... ed. Samuel Salter (London: Payne, 1753), 3rd Letter, pp. 76-77 Tuckney (d. 1670) was a Westminster divine. For context to this quote, see Leith, p. 104.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c40102e8" data-kw="Creeds and confessions">
<blockquote><p>To this power belongs the making of public creeds and confessions, which are usually and by synods and presbyteries to preserve the unity and agreement of faith and reject errors. They do not have the same authority as the Scriptures, since they must be compared with and corrected by them. Yet they have even their own memorable weight and ought to be valued very highly by the pious. Both because they contain the sum and foundation of the Christian doctrine and are like barriers against the errors and corruptions which can injure religion. And because they are the bonds of ecclesiastical communion and formulas of consent which testify of the unity of faith and the agreement of churches with each other and are distinguished from unbelievers, as soldiers by marks or watchwords from their enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/authority-of-creeds.html">Authority of creeds</a></span></div>

</figure><figure class="quote" id="q-b7bb4144e7" data-kw="">
<blockquote><p>Wherefore custom is not made by examples, but by the assent, approbation and ordinance of the people… 11… But whereas he says that that use ought to be agreeing with reason, that is not enough: but this ought first to be preferred, that it must be agreeable to the Word of God. For that is to be accounted for the chiefest reason; and afterward let it be allowed by the institution of the people…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, (d. 1562; London: 1583) | pt. 1, ch. 11, ‘Of Prescription &amp; Custom’, p. 98</span></figcaption>

</figure><figure class="quote" id="q-25881b937a" data-kw="">
<blockquote><p>But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true; but that all the letters of bishops which have been written, or are being written, since the closing of the canon, are liable to be refuted if there be anything contained in them which strays from the truth, either by the discourse of some one who happens to be wiser in the matter than themselves, or by the weightier authority and more learned experience of other bishops, by the authority of Councils</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Baptism, Against the Donatists, bk. 2, ch. 3, §4</span></figcaption>

</figure><figure class="quote" id="q-e89b8c838c" data-kw="">
<blockquote><p>Rather the question is Are the fathers to be considered as judges, capable of deciding controversies of faith by their infallible authority? … We do not use them as judges whose opinion is to be acquiesced in absolutely and without examination and as the standard of truth in doctrines of faith or in the interpretation of the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, Second Topic, Q. 21, §VI</span></figcaption>

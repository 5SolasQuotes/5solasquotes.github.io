<blockquote><p>§34. II. So much for what is necessary to the being of the sacred office: Now what is necessary to the well-being. And indeed, though the essential unity of the Church lie not upon this, yet the peace and concord of it does, and that so much as that no other means without this will attain it: And the want of what is necessary ad bene esse in the ministry and bishops [or ministers], is it that has caused the common calamities. §35. And I. Nothing is more wanting hereto than better qualifications in the persons: 1. That there be a strong wit, and good acquired gifts of knowledge, and a strong and lively faith from divine illumination, and good acquaintance with the oracles of God: A pastor or teacher should not only know the essentials of Christianity, which every Christian knows, but also the integrals [things that complete the whole of Christianity] and many accidents. And both essentials and integrals should be known by him by a more clear, distinct and orderly understanding, not only above the vulgus fidelium, (common Christians) but above the better sort of the flock. And some store of natural and common knowledge called learning is needful hereunto: But especially more illumination, faith and holy wisdom and skilfulness in matter, sense and method of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 218-19</span></figcaption>

<blockquote><p>Q. IV. What are the ends that I aim at in the great undertaking? … 3. I can appeal to God, that I have no design in the least to maintain a party, or to keep up any schismatical faction; my heart rises against the thoughts of it. I hate dividing principles and practices, and whatever others use, I am for peace and healing; and if my blood would be sufficient balsam, I would gladly part with the last drop of it, for the close up of the bleeding wounds of differences that are amongst true Christians. Peace is such a precious jewel, that I would give anything for it but truth. Those who are hot and bitter in their contendings for or against little things, and zealous in keeping up names of division and maintaining parties, are of a spirit which I understand not. Let not my soul come into their secret. My ends then are according to my principles, and I humbly appeal to God concerning the integrity of my heart in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Serious Self-Examination Before Ordination’</cite>, (1687) in the biographies of Henry by William Tong &amp; J.B. Williams</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>10. We have said that the symbols by which the Church is discerned are the preaching of the Word and the observance of the sacraments, for these cannot any where exist without producing fruit and prospering by the blessing of God… When the preaching of the gospel is reverently heard, and the sacraments are not neglected, there for the time the face of the Church appears without deception or ambiguity; and no man may with impunity spurn her authority… far less revolt from her, and violate her unity, (see Chap. II, sec. 1, 10, and Chap. VIII, sec. 12). For such is the value which the Lord sets on the communion of his Church, that all who contumaciously alienate themselves from any Christian society, in which the true ministry of his Word and sacraments is maintained, He regards as deserters of religion. So highly does He recommend her authority, that when it is violated He considers that his own authority is impaired. For there is no small weight in the designation given to her, “the house of God,” “the pillar and ground of the truth,” (1 Tim. 3:15)… 11… How perilous, then, nay, how fatal the temptation, when we even entertain a thought of separating ourselves from that assembly in which are beheld the signs and badges which the Lord has deemed sufficient to characterise his Church!… If it holds the order instituted by the Lord in Word and sacraments there will be no deception; we may safely pay it the honour due to a church: on the other hand, if it exhibit itself without Word and sacraments, we must in this case be no less careful to avoid the imposture… 12… in the administration of word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 1, sect. 10-11, p. 22-23</span></figcaption>

<blockquote><p>‘Private interpretation,’ [2 Pet. 1] is either Praeter fundamentum veritatis, ‘by the ground of verity,’ or Praeter fundamentum salutis, ‘by the ground of salvation;’ circa fundamentum salutis, ‘about the ground of salvation;’ or contra fundamentum salutis, or ‘contrary to the foundation of salvation’. 1. Praeter fundamentum veritatis, is when an interpretation agrees not with the place intreated, although it be not contra fundamentum salutis: these the Greeks called [Greek] aliena a proposito, out of purpose: as those who seek gold in the earth, if they miss the vein, they lose the gold (Chrysostom): so these who interpret Scripture, besides the meaning of the place intreated, they miss the sense of the Scripture. 2. Praeter fundamentum salutis, is that interpretation which is not only besides the verity, but also besides the foundation, Christ: this by the apostle is called hay and stubble, it shall burn, but the builder may be safe. (1 Cor. 3:15) 3. Circa fundamentum salutis, is that interpretation, which weakens the foundation, although it raze it not directly. 4. Contra fundamentum salutis, is that interpretation, which razes the foundation, ‘not holding the head Christ’. (Col. 2:19) … True interpretation is that interpretation which is super fundamentum, upon the foundation, and gives the true interpretation of the place intreated. The doctors of the Jews were called bonim, aedificantes, ‘builders,’ because they were bound to build upon the foundation. (Mk. 12:10)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Synagogue</cite>, … (London, 1623), bk. 1, ch. 1, paragraph 5, pp. 30-31</span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘Private interpretation,’ [2 Pet. 1] is either Praeter fundamentum veritatis, ‘by the ground of verity,’ or Praeter fundamentum salutis, ‘by the ground of salvation;’ circa fundamentum salutis, ‘about the ground of salvation;’ or contra fundamentum salutis, or ‘contrary to the foundation of salvation’. 1. Praeter fundamentum veritatis, is when an interpretation agrees not with the place intreated, although it be not contra fundamentum salutis: these the Greeks called [Greek] aliena a proposito, out of purpose: as those who seek gold in the earth, if they miss the vein, they lose the gold (Chrysostom): so these who interpret Scripture, besides the meaning of the place intreated, they miss the sense of the Scripture. 2. Praeter fundamentum salutis, is that interpretation which is not only besides the verity, but also besides the foundation, Christ: this by the apostle is called hay and stubble, it shall burn, but the builder may be safe. (1 Cor. 3:15) 3. Circa fundamentum salutis, is that interpretation, which weakens the foundation, although it raze it not directly. 4. Contra fundamentum salutis, is that interpretation, which razes the foundation, ‘not holding the head Christ’. (Col. 2:19) … True interpretation is that interpretation which is super fundamentum, upon the foundation, and gives the true interpretation of the place intreated. The doctors of the Jews were called bonim, aedificantes, ‘builders,’ because they were bound to build upon the foundation. (Mk. 12:10)”

<blockquote><p>I will not say but sometimes it may be meet to discover the least error, and it may be by circumstances so aggreged that it may be needful judicially to take notice of it, as when it’s involved with offence and ready to breed schism or scandal, or in such like cases (in which respect there are some things mentioned in the decree, Acts 15, which are not very material in themselves, as the eating of things strangled) yet, we say, it is not simply and always necessary for ministers to press at the convincing of all who maintain something different from truth, or which is supposed to be so by them, if it be of things extra-fundamental, or, which have not direct or palpable influence upon the violating of faith, or corrupting of manners, much less to censure for the maintaining of it. For, it is not of such that these epistles speak: and we see, Rom. 14, and in the epistles to the Corinthians, in the debate about meats and eating of things sacrificed to idols, and such like, wherein though there was still a right side and a wrong, yet does he rather press the forbearing of these debates, than the dipping into them, not astricting men always to follow this or that, providing it be done without breach of unity and charity. Hence it is that although there be somethings he will give no forbearance unto, but authoritatively and ministerially he decides in them, yet in the same epistles there is something amongst the saints that he seeks rather to heal, and to obtain mutual forbearance in, than peremptorily to decide. See Rom. 14:1; Cor. 8:2-3, etc.; Phil. 2:3. … …there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>

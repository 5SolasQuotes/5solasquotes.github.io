<main class="wrap"><figure class="quote" id="q-5ce83c846f" data-kw="federal head">
<blockquote><p>Man must be viewed under a double relation—either as just or as the first. In the former respect, he had the power to perform the prescribed duty. In the latter, Adam in a certain manner included the whole human race, which was to spring from him, both as the root and the seminal principle from whom the whole human race was to descend; and as a public person and representative head, because he represented all men who were to spring naturally from him. Hence that covenant pertained not only to Adam, but to all his posterity in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.11</span></figcaption>

</figure><figure class="quote" id="q-b72020f7f1" data-kw="eternal life">
<blockquote><p>However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run). The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance.</p></blockquote>

</figure><figure class="quote" id="q-ad2829052d" data-kw="death tree of life">
<blockquote><p>A law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life and from the threatening of death (which by reason of contraries had the implied promise of life).</p></blockquote>

</figure><figure class="quote" id="q-d2b2d7251f" data-kw="covenant of nature works">
<blockquote><p>The covenant of nature is that which God the Creator made with innocent man as his creature, concerning the giving of eternal happiness and life under the condition of perfect and personal obedience. It is called “natural,” not from natural obligation (which God does not have towards man), but because it is founded on the nature of man (as it was at first created by God) and on his integrity or powers. It is also called “legal” because the condition on man’s part was the observation of the law of nature engraved within him; and of “works” because it depended upon works or his proper obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.5</span></figcaption>

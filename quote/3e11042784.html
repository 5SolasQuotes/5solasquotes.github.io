<blockquote><p>The compared attributes of God are those titles which do belong properly to creatures, but are by a metaphor or similitude attributed to God. For the Scripture oftentimes doth speak of God, according to man’s capacity.

Of them some are taken from man, some from other creatures. Those which are taken from man, are said to be attributed to God, by a human passion. A human passion is a metaphor, whereby those things which pertain to man, are by a similitude attributed to God.

Of this sort are these, the parts, members, senses, affections, and adjoints of man.

The soul which is a part of man, is attributed to God Jere. 5.29. and 9.9. Amos. 6.8.

Where by the soul is meat, the life of God, that is to say, the very essence of God it self.

And by the members of the body, by the senses, affections &amp; adjoints, which are attributed to God, a power is meant to be in God, performing for us certain actions by an incomprehensible manner, whereof the works which men perform by the means of their members, senses, affections and adjoints be as it were a certain resemblance.

These members of the body are attributed to God: the head, the face, the eye, the apple of the eye, the mouth, the ear, the nose the nostrils, the hand, the arm, the right hand, the finger, the hart, the womb, the feet.

By God’s head is meant God himself being such a one as to whose glory all things are to be referred, which are subject to him in Christ 1. Cor. 11.3. God is the head of Christ.

By face or countenance, is meant sometime presence, sometimes the favour &amp; kindness or God. Psal. 114.7. and 27.8.9. and 31.17. Sometimes anger. Psal. 34.17.

By the eyes is meant, either the good will and favour of God. Psal. 34.16. Or the providence of God: or else this, namely that God seeth all things.

By the apple of the eye is meant, that which is most dear to God. Deut. 32.10. Psal. 17.8. Zach. 2.8.

By the mouth is meant either the decree of God’s providence. Mat. 4.4. or else the commandment or revealing of his word. Jere. 9.12.

By the ears is meant, either readiness, and facilities in hearing our prayers. Psal. 31.3. and 34.16. Or this, that God heareth all things.

By the nose is meant the fierce wrath of God. Jerem. 49.37.

By the nostrils to which smelling is attributed is meant, that acceptation by which he taketh sacrifices to be well pleasing, and acceptable unto him. Genes. 8.21.

By the hand is meant power, protection, liberality, workmanship, and those things which are like these. Job. 10.8. Psal. 31.6. &amp; 8.7.

By the arm is meant power, strength and might. Genes. 49.24. Exod. 6.6.

By the right hand, is meant, the power, or rule of God. As in the Creed of the Apostles.

By the finger is meant, power, mighty working. Exod. 8.19. or else workmanship. Exod. 31.18.

By the heart is meant, either the living essence of God, for the heart is judged to be the seat of life in a living creature. Genes. 6.6. or the decree of God, because the holy Scripture doth appoint the heart to be the seat of the sense, whose part is to think, &amp; to determine. Jere. 19.5. or the good pleasure of God, as when David is said to be a man according to Gods own hart.

By the womb is meant generation. Psal. 110.3.

By the feet is meant strength or power. Psal. 110.1. or else the presence of God. …

By the senses attributed to God there is understood the providence of God. Mat. 14.2. The senses which are attributed to God, are either inward or outward.

Inward, as memory or remembrance. Esa. 49.16. 1. Sam. 15.2. To which is opposed forgetfulnesse. Esa. 49.14.

The outward senses attributed to God are sight. Genes. 1.4. Hearing. Psal. 5.2. and 6.8.9. Smelling. Genes. 8.21.</p></blockquote>

<blockquote><p>…if the work be necessarily required to the performance of the service of God, servile or not, it must be done. As circumcision on the eighth day, if it fell upon the Sabbath, it was to be done, Jn. 7:22. And the priests on the Sabbath killed the sacrifice and were blameless, Mt. 12:5. And in this respect the minister on the Sabbath is allowed to go to preach, as Christ did upon the Sabbath, Mt. 12, and the people are to go to hear. An example whereof we have in the Shunamite, that went ordinarily upon the Sabbath and new moon to the prophet: For when she demanded leave of her husband to go to the prophet, ‘Why wilt thou go’ (says he) ‘seeing it is neither Sabbath nor new moone’: intimating thereby that upon those times she went to hear him. And in this regard was the Sabbath day’s journey allowed, Acts 1:12. And therefore whosoever shall break the rest of the Sabbath in this respect is blameless. For the Sabbath was made for man, that he might keep it holy unto the Lord. Now, if it may so fall that the rest itself should any way be a let to the keeping of it holy, then the rest itself is to be broken: and they that so doe are blameless. For the end of the law in this respect is to be regarded and not the letter. For the Sabbath was made for man, that is, for the good of man; and not man for the Sabbath, that is for the rest. And this is the meaning of that place, Mk. 2:27, ‘The Sabbath was made for man, and not man for the Sabbath.’ … The conclusion then of this point is this: That no kind of ordinary or servile work may be done upon the Sabbath; neither in the house, nor in the city, nor in the fields, nor upon the seas, be they never so small, or never so meet, or never so glorious in show, except either God command it extraordinarily, or that the work tend directly to God’s worship: or be of necessity either for the preservation of life, or health, or goods; in which respects God has given us allowance upon the Sabbath to work, and not otherwise.</p></blockquote>

<blockquote><p>Carnal sports and pleasures are as great a profanation of the sabbath, as the most servile labour and drudgery in the world. Dicing and card-playing do as much violate the law of the sabbath, as digging and carting; playing, as much as ploughing; dancing and morrice-games, as much as working in the smith’s forge; bowling and shooting, as well as hewing of wood and drawing of water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark</cite></span></figcaption>

— Thomas Case, Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCarnal+sports+and+pleasures+are+as+great+a+profanation+of+the+sabbath%2C+as+the+most+servile+labour+and+drudgery+in+the+world.+Dicing+and+card-playing+do+as+much+violate+the+law+of+the+sabbath%2C+as+digging+and+carting%3B+playing%2C+as+much+as+ploughing%3B+dancing+and+morrice-games%2C+as+much+as+working+in+the+smith%E2%80%99s+forge%3B+bowling+and+shooting%2C+as+well+as+hewing+of+wood+and+drawing+of+water.%E2%80%9D%0A%0A%E2%80%94+Thomas+Case%2C+Sermon+VI.+Of+Sabbath+Sanctification+in+Puritan+Sermons+1659-1689%3A+Being+the+Morning+Exercises+at+Cripplegate%2C+St.+Giles+in+the+Fields+and+in+Southwark&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb7595389b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb7595389b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/13/thomas-case-sports-are-not-for-the-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-055366a403" data-kw="">
<blockquote><p>The Lord Christ Jesus takes delight in his own day. He delights to honour it. He delights to meet with and manifest himself to his disciples on it, as he showed before his ascension by appearing to them from time to time on this day. He delights to give his Holy Spirit on this day, as he intimated by choosing of it to pour it out on the primitive church in so remarkable a manner upon it, and by giving his Spirit to the apostle John on this day.

God blessed the seventh day of old, or appointed it to be a day wherein he especially would bestow blessings on his people as an expression, as it were, of his own joyful remembrance of that day and of the rest and refreshment he had on it; Exodus 31:16–17, “Wherefore the children of Israel shall keep the sabbath … for in six days the Lord made heaven and earth, and on the seventh day he rested, and was refreshed,” as princes give gifts on their birthday, on their marriage days, and the like.

But how much more reason has Christ to bless the day of his resurrection, and to delight to honour it, and to be conferring his graces and blessed gifts on his people on this day. It was a day wherein Christ rested and was refreshed in a literal sense. It was a day of great refreshment and joy to Christ, being the day of his deliverance from the chains of death, the day of his finishing that great and difficult work of redemption that had been upon his heart from all eternity, the day of his justification of the Father, the day of the beginning of his exaltation and the fulfilment of the promises of his Father, the day when he had eternal life, which he had purchased, put into his hands. And Christ does delight to distribute gifts and blessings and joy and happiness on this day, and will to the end of the world.

O, therefore, how well is it worth our while to improve this day, to call upon God and seek Jesus Christ on it!

Let awakened sinners be stirred up by these things to improve the sabbath day, as they would lay themselves most in the way of the Spirit of God. Improve the sabbath day to call upon God, for then he is near. Improve the sabbath day for reading the holy Scriptures and diligently attending his Word preached, for then is the likeliest time to have the Spirit accompanying of it. Let the saints that are desirous of growing in grace and enjoying communion with Christ improve the sabbath in order to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 246.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-9045564d62" data-kw="">
<blockquote><p>The rule of faith (regula fidei), indeed, is altogether one, alone immoveable and irreformable; the rule, to wit, of believing in one only God omnipotent, the Creator of the universe, and His Son Jesus Christ, born of the Virgin Mary, crucified under Pontius Pilate, raised again the third day from the dead, received in the heavens, sitting now at the right (hand) of the Father, destined to come to judge quick and dead through the resurrection of the flesh as well (as of the spirit). First we affirm that we desire to follow Scripture alone as rule of faith and religion, without mixing with it any other thing which might be devised by the opinion of men apart from the Word of God, and without wishing to accept for our spiritual government any other doctrine than what is conveyed to us by the same Word without addition or diminution, according to the command of our Lord. Genevan Confession (1536), art. 1 But we hold that the interpretation of the Scripture to be orthodox and genuine which is gleaned from the Scriptures themselves (from the nature of the language in which they were written, likewise according to the circumstances in which they were set down, and expounded in the light of and unlike passages and of many and clearer passages) and which agree with the rule of faith (regula fidei) and love, and contributes much to the glory of God and man’s salvation. Second Helvetic Confession (Heinrich Bullinger; 1566), ch. 2. Under the name of Holy Scripture, or the Word of God written, are now contained all the books of the Old and New Testaments…All which are given by inspiration of God to be the rule of faith and life. Westminster Confession of Faith 1.2. All synods or councils, since the Apostles’ times, whether general or particular, may err; and many have erred. Therefore they are not to be made the rule of faith, or practice; but to be used as a help in both. Westminster Confession of Faith 31.3 3. Q: What is the Word of God? A. The Holy Scriptures of the Old and New Testament are the Word of God, the only rule of faith and obedience. Westminster Larger Catechism, 3.</p></blockquote>

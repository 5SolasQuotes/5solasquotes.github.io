<main class="wrap"><figure class="quote" id="q-83ef30fcf6" data-kw="">
<blockquote><p>Now, the Son is able to be called the Word of God metonymically: whether by metonymy of the adjunct in place of the subject, because He is the principal argument/subject of the divine Word, both the prophetic Word formerly, and also the evangelical Word afterward under the New Testament; or by metonymy of the effect in the place of the cause, because God sets forth unto men His entire Word through the Son as the supreme and divine Prophet, not only under the New Testament, Hebrews 1:1, but also under the Old, 1 Peter 1:11.

Yet far more preferably by the name of the Λόγου/Logos/Word the person of the Son and His eternal subsistence is declared to us metaphorically, as we hold against the Socinians who deny it: for, α. this name is attributed to the Son, when mention is made, on the one side of Jehovah or the Father, on the other side of the Spirit, as of divine persons distinguished among themselves by these names; whence the middle name of the Word shall be of the same, rather than of a different, order.

β. This name is also substituted for the name of the Son, which is in Matthew 28:19, just as also John attributed to the incarnate Word the glory as of the Only Begotten of the Father, John 1:14, and he adds that God set forth to us, not the Word, but the Only Begotten Son of God, τὸν ὄντα εἰς τὸν κόλπον τοῦ πατρός, which is in the bosom of the Father, John 1:18. γ. This name is attributed to Christ, when there is regard, not to the Gospel, which was proclaimed after the Fall, but to the first Creation: whence also then it is evident that it is actually applicable to Him with respect to His eternal subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, §3, p. 56.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fde3152e82" data-kw="">
<blockquote><p>We shouldn’t doubt that the Holy Spirit lives in us, but we should certainly recognize that we are temples of the Holy Spirit, as Paul says in 1 Corinthians 6:19. If someone feels a love for God’s Word and gladly hears, speaks, thinks, teaches, and writes about Christ, you should know that this comes, not from a person’s will or reason, but from the Holy Spirit. It’s impossible for this to happen without the Holy Spirit. On the other hand, where there is hatred and contempt for the Word, we should know that the devil, the ruler of this world, blinds the hearts of the people and holds them captive so that the light of the gospel, the glory of Christ, can’t shine on them. We see this today in the masses who are not moved by the Word but despise it as if it has nothing to do with them. But those who have any kind of love and desire for the Word should gratefully acknowledge that these attitudes are poured into them by the Holy Spirit. For we are not born with these attitudes and cannot acquire them through the law. This transformation rests completely and absolutely in the hand of the Almighty. So when we eagerly listen to preaching about Jesus Christ, the Son of God—who for our sakes became a human being and subjected himself to the law to save us—then God sends the Holy Spirit into our hearts through this preaching. Therefore, it’s very useful for us to remember that we have the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, (p. 292). Zondervan. Kindle Edition.</span></figcaption>

</figure><figure class="quote" id="q-62955810eb" data-kw="">
<blockquote><p>Why is the Son so called? Answer. Because He was begotten of the Father by a perfect and eternal generation, not to be uttered of man or conceived. And we must be warned not to conceive it in any carnal or human manner. For an earthly father is in time before his son, and the son after. But God the Father and the Son are coeternal, and not one before or after the other for time. An earthly father is forth of [i.e., separate from] the son, and the son forth of the father. But God the Father is in the Son, and the Son in the Father. An earthly child is from his father by propagation, but the Son is from the heavenly Father not by propagation, but by communication of substance. Lastly, the heavenly Father begets the Son by communication of His whole substance, and so does no earthly father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 246.</span></figcaption>

<blockquote><p>Vers. 5. For unto which of the Angels said he at any time, Thou art my Son, this day have I begotten thee: And again, I will be to him a Father, and he shall be to me a Son? This last Argument the Apostle confirms with eight Reasons, whereof the seven first are taken out of so many places of Scripture.

Reas. 1. From Psal. 2.7. Concerning Christ, saith God the Father, Thou art my Son, this day have I begotten thee. From which place the Deity of Christ is proved, that he after another and higher manner is a Son, than any of the Angels: A Son, to wit, by eternal Generation, which is confirmed out of Act. 3.33. and Rom. 1.4. where this place is applied to the manifestation of the Deity of Christ, which he had from Eternity, before he was manifested in his Resurrection from the dead: For had not Christ been in himself a Son, he could not be declared a Son to the world: And although in Scripture, some things are said to be done when they are manifested:

And so, This day have I begotten thee, will be, This day have I declared thee to the world to be my only begotten Son: Yet [This day] ought not to signify only the time of Christ’s declaration, as a Son, but also his eternal and immutable Generation: For Eternity is very well expressed by This day, whereby the present day is signified, because Eternity is as one day, and always wholly present, wherein there is nothing successive, or one after another, as in our time, but one constant permanency. And here also he uses a word of the Pretertense, that although thou hearest of him as present, yet thou mayest understand his Generation perfectly past, or eternal, as the shining of the Sun is perfect, and yet it continually beams forth from the Sun: Therefore Christ is so much the more excellent above Angels, by how much a Son is more excellent than a Messenger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 186.</span></figcaption>

<blockquote><p>The first [Old Testament proof] is the promise of GOD unto Adam and Eve: Gene. 3. that the seed of a woman should break the Serpent’s head. This promise was spoken of Christ, for he solve and only brake the Serpent’s head, that is to say destroyed the works of the devil, satisfied for sin and over came it, and also the world, hell, and the Devil, and set God and man at one, removing the occasion of Enmity, and the Enmity it self in his precious blood.

Breaking the writings of our condemnation upon the cross, Eph. 2. &amp; this our Saviour and peace maker is called the seed of a woman. The which word alone were sufficient to confound the contrary part, that saith Christ took not the substance of his humanity of the blessed Virgin. Where so ever ye find this word, the seed of a woman in the holy scripture, ye shall see always it is taken for the child, and birth that hath of the substance of his mother: and not for any thing that passeth through the mother, as the water passeth through a pipe: But that part of the mother’s substance doth concur and necessarily is required to the procreation of the child as all Physick holdeth.

And this way wrought God almighty the humanity of his only son our Saviour Jesus of Nazareth without the knowledge of man, using the blessed virgin by the operation of the holy Ghost to conceive &amp; bring forth this blessed seed, which was made of her, and took the original of his humanity of, and in her, by the operation of the holy Ghost, and neither nourished in her womb, neither brought forth she, the humanity of Christ, as a thing that God had given Christ from heaven, or else from some other where, but nourished in her, and brought forth the blessed seed, that God had made by his holy pour, of her own substance. Other else were this promise false, the seed of a woman shall break the serpent’s head. It is no seed of a woman nor hath anything to do to be called the seed of a woman, that never take thought of a woman.

But God doeth warrant that he that shall break the Serpent’s head shall be the seed of a woman. If it be true (as it can not be false) that the Serpent’s head is broken: who can deny but that it is broken by the seed of a woman. That is, by him that took his humanity of the woman’s substance. Men must beware, they be not deceived in this case with allegories, and wrong interpretation of the word: but plainly make answer, Christ is the seed of a woman, and not a thing that passed through her, nor was partaker of her nature. For then should she not have brought forth her son, but such as one as she know neither father neither mother of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A lesson of the Incarnation of Christ that he took, his humanity in and of the Blessed Virgin made the twentieth day of June by John Hopper, 1549</cite>, (London: Edward Whitechurch, 1549), unpaginated.</span></figcaption>

<blockquote><p>XI. Mary is rightly called the Mother of God (theotokos) in the concrete and specifically because she brought forth him who is also God, but not in the abstract and reduplicatively as God. Although this is not expressly stated in the Scriptures, still it is sufficiently intimated when she is called the mother of the Lord (Lk. 1:43) and the mother of Immanuel. If the blessed virgin brought nothing to the person of the Logos (Logou) absolutely considered, still she can be said to have brought something to the person of the incarnate Logos (Logou) economically considered, inasmuch as she gave the human nature which he took into the unity of person.

XII. The title Mother of God given to the virgin was perverted by superstitious men into an occasion of idolatry, as Paul Sarpi observes. “Because the impiety of Nestorius divided Christ, constituting two sons and denying that he, who was born of the virgin Mary, is God; the church, in order to implant the catholic truth in the minds of believers, decided that the words, Mary, the Mother of God (Maria theotokos), should be more frequently inculcated in the churches of the East as well as of the West. This, instituted indeed solely for the honor of Christ, by degrees began to be shared with the mother and at length was referred entirely to her alone” (History of the Council of Trent 2 [1620], p. 181). Although, I say, this most gross error either arose from or was increased by this occasion, it derogates nothing from the truth because the abuse and error of the papists ought not to take away the lawful use of this name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 13.7.11–12 (p. 320).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>

<blockquote><p>We prove the vanity of this fiction in this way. First, because scripture teaches that the faithful (for whom they want Purgatory to be constructed) pass from here through death into eternal life. John 5:24 — &quot;Whoever hears my word and believes him who sent me has eternal life and will not come under judgment but has passed from death to life.&quot; Therefore they do not come into the judgment of Purgatory.</p></blockquote>

<blockquote><p>That is not the essential righteousness of God, as Andreas Osiander contended … And it is not partly composed of Christ’s righteousness and partly of ours, which the sophists invent, whom Calvin refutes in the same chapter. But it is only by the righteousness of Jesus Christ, our Mediator and Savior, as the apostle Paul teaches and confirms in Romans 5:12 and following.</p></blockquote>

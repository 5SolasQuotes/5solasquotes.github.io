<blockquote><p>Question 7. Where the freedom of election is diminished by bishops, magistrates, [civil] patrons, what kind of calling is there? 29. Answer: Although election be not in that manner and degree free as it ought to be, yet a voluntary consent, as in marriage, so in the ministry, though procured by unjuft means, has the essence of an election and vocation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof… (London, 1639), bk. 4, ch. 25, thesis 29</cite>, p. 69</span></figcaption>

</figure><figure class="quote" id="q-177a58748a" data-kw="">
<blockquote><p>Question: Did Zipporah do well in this act of circumcising her son? Answer: 1. This act is unparalleld in all sacred history, therefore hereupon dubious. 2. Though the law before this time doth not declare to us the administratour strictly, yet this worke was first committed to Abraham, and afterwards in the setlement of the Church to Ministers fit for the doing of it; and this sheweth what was right to be done in former times. 3. It was doubtles her husbands duty, and for her to do it in his presence could not belong to her but upon necessity, he being at that time by the opposition of Gods hand disinabled. 4. Doubtles here was infirmity in all, which though God pardoned, yet he did not allow. 5. This was a singular extraordinary act, therefore not to be drawn into imitation by any against Gods law of administration of baptism under the Gospel, as the Papists do. Learn hence: … D. 2. It is the wife’s duty and praise to save the husband from perishing under God’s hand. D. 3. Sacrament-administration may reconcile, where the neglect has provoked God. D. 4. God has born with weak and unfit hands in such administrations, but not to approve them. … D. 9. Forms of words are useful in the Sacraments, such as are sutable to their nature, but not arbitrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hughes.html">George Hughes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of the Whole First Book of Moses, called Genesis, &amp; of XXIII chap. of his Second Book, called Exodus… (d. 1667; 1672), on Exodus, ch. 4</cite>, p. 693</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a3abc12509" data-kw="">
<blockquote><p>Lawyer: What have you against our use of godfathers in baptism? Minister: Negatively, we are not at all against the old sort of patrimi, ‘susceptors,’ or sponsors that were used at baptism in the ancient Churches, though we think it but a prudential thing and not of necessity to baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689) | ch. 10, ‘Of the English Sort of Godfathers at Baptism’, pp. 57-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Lawyer: What have you against our use of godfathers in baptism? Minister: Negatively, we are not at all against the old sort of patrimi, ‘susceptors,’ or sponsors that were used at baptism in the ancient Churches, though we think it but a prudential thing and not of necessity to baptism.”

— Richard Baxter, The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689) | ch. 10, ‘Of the English Sort of Godfathers at Baptism’, pp. 57-69">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLawyer%3A+What+have+you+against+our+use+of+godfathers+in+baptism%3F+Minister%3A+Negatively%2C+we+are+not+at+all+against+the+old+sort+of+patrimi%2C+%E2%80%98susceptors%2C%E2%80%99+or+sponsors+that+were+used+at+baptism+in+the+ancient+Churches%2C+though+we+think+it+but+a+prudential+thing+and+not+of+necessity+to+baptism.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued+%281683%3B+London%3A+Parkhurst%2C+1689%29+%7C+ch.+10%2C+%E2%80%98Of+the+English+Sort+of+Godfathers+at+Baptism%E2%80%99%2C+pp.+57-69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa3abc12509.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a3abc12509.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Lawyer%3A%20What%20have%20you%20against%20our,and%20not%20of%20necessity%20to%20baptism&amp;text=Lawyer%3A%20What%20have%20you%20against%20our%20use%20of&amp;text=prudential%20thing%20and%20not%20of%20necessity%20to%20baptism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-faa832cb3e" data-kw="">
<blockquote><p>There can be little doubt that this doctrine of the regeneration of infants, at least according to the judgment of charity concerning individuals, is the received view of the Belgic church… …who hold that the initial regeneration of elect infants under the covenant precedes their baptism. I acknowledge that with those who maintain this opinion I am so far at one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Efficacy &amp; Utility of Baptism in the Case of Elect Infants whose Parents are Under the Covenant’</cite>, (Utrecht, 1693) in MJT 17 (2006), pp. 121-90, Includes an introduction by Mark Beach. Originally an appendix in William Marshall, Popery in The Full Corn, the Ear &amp; the Blade; or, The Doctrine of Baptism in the Popish, Episcopalian &amp; Congregational Churches; with a Defence of the Calvinistic or Presbyterian View (Edinburgh: Paton and Ritchie, 1852) | Witsius gives his own view in sections 31-32, pp. 150-151, which we do not agree with, that:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-c7a8c38437" data-kw="">
<blockquote><p>Of all these great difficulties I have said what I know in my Appendix to Infant Baptism to Mr. Bedford and Dr. Ward, and of Bishop Davenant’s judgement. And I confess that my judgment agrees more in this with Davenant’s than any others, saving that he does not so much appropriate the benefits of baptism to the children of sincere believers as I do. And though by a Letter in pleading Davenant’s cause, I was the occasion of good Mr. [Thomas] Gataker’s printing of his answer to him, yet I am still most inclined to his judgement; Not that all the baptized, but that all the baptized seed of true Christians are pardoned, justified, adopted, and have a title to the Spirit and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism? And whether all the children of true Christians have inward sanctifying grace? Or whether they can be said to be justified, and to be in a state of salvation, that are not inherently sanctified? And whether any fall from this infant state of salvation?’ in A Christian Directory... (London: 1673), pp. 817-21, pp. 817-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Of all these great difficulties I have said what I know in my Appendix to Infant Baptism to Mr. Bedford and Dr. Ward, and of Bishop Davenant’s judgement. And I confess that my judgment agrees more in this with Davenant’s than any others, saving that he does not so much appropriate the benefits of baptism to the children of sincere believers as I do. And though by a Letter in pleading Davenant’s cause, I was the occasion of good Mr. [Thomas] Gataker’s printing of his answer to him, yet I am still most inclined to his judgement; Not that all the baptized, but that all the baptized seed of true Christians are pardoned, justified, adopted, and have a title to the Spirit and salvation.”

</figure><figure class="quote" id="q-e2fe3ccfb3" data-kw="">
<blockquote><p>The fifth argument taken of the end [design] of baptism, to wit, because that they which are baptized, are baptized for dead, that is to say, that they may have a remedy against death because that baptism is a token of regeneration. They that are baptized [are baptized] to this end and purpose, that death may be put out in them, or, to rise again from the death, whereof baptism is a seal.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3dca8c4bdb" data-kw="">
<blockquote><p>4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (1646), Question 23</cite>, pp. 106-7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f18afe3f69" data-kw="">
<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (Edinburgh, 1655)</cite>, pp. 17-18</span></figcaption>

<blockquote><p>As touching submission or subjection, we say with Dr. Field that subjection is generally and absolutly required where obedience is not, and even when our consciences suffer us not to obey, yet still we submit and subject ourselves, and neither do nor shall (I trust) show any the least contempt of authority.</p></blockquote>

</figure><figure class="quote" id="q-7a7bfa6eef" data-kw="">
<blockquote><p>In reality there are two, and only two, foundations of law; and they are both of them conditions without which nothing can give it any force; I mean equity and utility. With respect to the former, it grows out of the great rule of equality, which is grounded upon our common nature, and which Philo, with propriety and beauty, calls the mother of justice. All human laws are, properly speaking, only declaratory; they may alter the mode and application, but have no power over the substance of original justice. The other foundation of law, which is utility, connected in the same manner with, and derived directly from, our rational nature; for any other utility may be the utility of a robber, but cannot be that of a citizen; the interest of the domestic enemy, and not that of a member of the commonwealth. This present equality can never be the foundation of statues which create an artificial difference between men, as the laws before us [under consideration in his time] do, in order to induce a consequential inequality in the distribution of justice. Law is a mode of human action respecting society, and must be governed by the same rules of equity which govern every private action; and so Tully [Cicero?] considers it in his Offices as the only utility [being a utility to all commonly] agreeable to that [common] nature…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works &amp; Correspondence of the Right Honourable Edmund Burke. A New Edition, in 8 Volumes, vol. 6 (d. 1797; London, 1852), p. 17. See also the larger context from pp. 14-18, which includes helpful Latin quotes from Suarez. Burke is opposing certain laws contrary to Romanists in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>§2. But first I will lay together some propositions for decision of the controversy: How far we are bound to obey men’s precepts about religion, especially in case we doubt of the lawfulness of obeying them, and so cannot obey them in faith? §3. Briefly: 1. We must obey both magistrates and pastors in all things lawful which belong to their offices to command. 2. It belongs not to their office to make God a new worship; but to command the mode and circumstances of worship belongs to their office. For guiding them wherein, God has given them general rules. 3. We must not take the lawful commands of our governors to be unlawful. 4. If we do through weakness or perverseness take lawful things to be unlawful, that will not excuse us in our disobedience. Our error is our sin, and one sin will not excuse another sin. Even as on the other side, if we judge things unlawful to be lawful, that will not excuse us for our disobedience to God in obeying men. 5. As I have before showed, many things that are miscommanded must be obeyed. 6. As an erroneous judgment will not excuse us from obedience to our governors, so much less will a doubtfulness excuse us. 7. As such a doubting, erring judgment cannot obey in (plenary) faith, so much less can he disobey in faith. For it is a known command of God, that we obey them that have the rule over us: but they have no Word of God against the act of obedience now in question. It is their own erring judgment that entangles them in a necessity of sinning (till it be changed). 7. In doubtful cases, it is our duty to use God’s means for our information: and one means is to consult with our teachers and hear their words with teachableness and meekness. 8. If upon advising with them we remain in doubt about the lawfulness of some circumstance of order, if it be such as may be dispensed with, they should dispense with us: if it may not be dispensed with without a greater injury to the Church or cause of God than our dispensation will countervail, then is it our duty to obey our teachers notwithstanding such doubts: For it being their office to teach us, it must be our duty to believe them with a human faith, in cases where we have no evidences to the contrary: And the duty of obeying them being certain, and the sinfulness of the thing commanded being uncertain and unknown, and only suspected, we must go on the surer side. 9. Yet must we in great and doubtful cases, not take up with the suspected judgment of a single pastor, but apply ourselves to the unanimous pastors of other Churches. 10. Christians should not be over-busy in prying into the work of their governors, not too forward to suspect their determinations: But when they know that it is their ruler’s work to guide them by determining of due circumstances of worship, they should without causeless scruples readily obey, till they see just reason to stop them in their obedience; They must not go out of their own places to search into the actions of another man’s office to trouble themselves without any cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations on Church Government &amp; Worship (London, 1659) | ch. 15, ‘Reasons for Obedience in Lawfull things’</cite>, pp. 483-85</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§2. But first I will lay together some propositions for decision of the controversy: How far we are bound to obey men’s precepts about religion, especially in case we doubt of the lawfulness of obeying them, and so cannot obey them in faith? §3. Briefly: 1. We must obey both magistrates and pastors in all things lawful which belong to their offices to command. 2. It belongs not to their office to make God a new worship; but to command the mode and circumstances of worship belongs to their office. For guiding them wherein, God has given them general rules. 3. We must not take the lawful commands of our governors to be unlawful. 4. If we do through weakness or perverseness take lawful things to be unlawful, that will not excuse us in our disobedience. Our error is our sin, and one sin will not excuse another sin. Even as on the other side, if we judge things unlawful to be lawful, that will not excuse us for our disobedience to God in obeying men. 5. As I have before showed, many things that are miscommanded must be obeyed. 6. As an erroneous judgment will not excuse us from obedience to our governors, so much less will a doubtfulness excuse us. 7. As such a doubting, erring judgment cannot obey in (plenary) faith, so much less can he disobey in faith. For it is a known command of God, that we obey them that have the rule over us: but they have no Word of God against the act of obedience now in question. It is their own erring judgment that entangles them in a necessity of sinning (till it be changed). 7. In doubtful cases, it is our duty to use God’s means for our information: and one means is to consult with our teachers and hear their words with teachableness and meekness. 8. If upon advising with them we remain in doubt about the lawfulness of some circumstance of order, if it be such as may be dispensed with, they should dispense with us: if it may not be dispensed with without a greater injury to the Church or cause of God than our dispensation will countervail, then is it our duty to obey our teachers notwithstanding such doubts: For it being their office to teach us, it must be our duty to believe them with a human faith, in cases where we have no evidences to the contrary: And the duty of obeying them being certain, and the sinfulness of the thing commanded being uncertain and unknown, and only suspected, we must go on the surer side. 9. Yet must we in great and doubtful cases, not take up with the suspected judgment of a single pastor, but apply ourselves to the unanimous pastors of other Churches. 10. Christians should not be over-busy in prying into the work of their governors, not too forward to suspect their determinations: But when they know that it is their ruler’s work to guide them by determining of due circumstances of worship, they should without causeless scruples readily obey, till they see just reason to stop them in their obedience; They must not go out of their own places to search into the actions of another man’s office to trouble themselves without any cause.”

— Richard Baxter, Five Disputations on Church Government &amp; Worship (London, 1659) | ch. 15, ‘Reasons for Obedience in Lawfull things’, pp. 483-85">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A72.+But+first+I+will+lay+together+some+propositions+for+decision+of+the+controversy%3A+How+far+we+are+bound+to+obey+men%E2%80%99s+precepts+about+religion%2C+especially+in+case+we+doubt+of+the+lawfulness+of+obeying+them%2C+and+so+cannot+obey+them+in+faith%3F+%C2%A73.+Briefly%3A+1.+We+must+obey+both+magistrates+and+pastors+in+all+things+lawful+which+belong+to+their+offices+to+command.+2.+It+belongs+not+to+their+office+to+make+God+a+new+worship%3B+but+to+command+the+mode+and+circumstances+of+worship+belongs+to+their+office.+For+guiding+them+wherein%2C+God+has+given+them+general+rules.+3.+We+must+not+take+the+lawful+commands+of+our+governors+to+be+unlawful.+4.+If+we+do+through+weakness+or+perverseness+take+lawful+things+to+be+unlawful%2C+that+will+not+excuse+us+in+our+disobedience.+Our+error+is+our+sin%2C+and+one+sin+will+not+excuse+another+sin.+Even+as+on+the+other+side%2C+if+we+judge+things+unlawful+to+be+lawful%2C+that+will+not+excuse+us+for+our+disobedience+to+God+in+obeying+men.+5.+As+I+have+before+showed%2C+many+things+that+are+miscommanded+must+be+obeyed.+6.+As+an+erroneous+judgment+will+not+excuse+us+from+obedience+to+our+governors%2C+so+much+less+will+a+doubtfulness+excuse+us.+7.+As+such+a+doubting%2C+erring+judgment+cannot+obey+in+%28plenary%29+faith%2C+so+much+less+can+he+disobey+in+faith.+For+it+is+a+known+command+of+God%2C+that+we+obey+them+that+have+the+rule+over+us%3A+but+they+have+no+Word+of+God+against+the+act+of+obedience+now+in+question.+It+is+their+own+erring+judgment+that+entangles+them+in+a+necessity+of+sinning+%28till+it+be+changed%29.+7.+In+doubtful+cases%2C+it+is+our+duty+to+use+God%E2%80%99s+means+for+our+information%3A+and+one+means+is+to+consult+with+our+teachers+and+hear+their+words+with+teachableness+and+meekness.+8.+If+upon+advising+with+them+we+remain+in+doubt+about+the+lawfulness+of+some+circumstance+of+order%2C+if+it+be+such+as+may+be+dispensed+with%2C+they+should+dispense+with+us%3A+if+it+may+not+be+dispensed+with+without+a+greater+injury+to+the+Church+or+cause+of+God+than+our+dispensation+will+countervail%2C+then+is+it+our+duty+to+obey+our+teachers+notwithstanding+such+doubts%3A+For+it+being+their+office+to+teach+us%2C+it+must+be+our+duty+to+believe+them+with+a+human+faith%2C+in+cases+where+we+have+no+evidences+to+the+contrary%3A+And+the+duty+of+obeying+them+being+certain%2C+and+the+sinfulness+of+the+thing+commanded+being+uncertain+and+unknown%2C+and+only+suspected%2C+we+must+go+on+the+surer+side.+9.+Yet+must+we+in+great+and+doubtful+cases%2C+not+take+up+with+the+suspected+judgment+of+a+single+pastor%2C+but+apply+ourselves+to+the+unanimous+pastors+of+other+Churches.+10.+Christians+should+not+be+over-busy+in+prying+into+the+work+of+their+governors%2C+not+too+forward+to+suspect+their+determinations%3A+But+when+they+know+that+it+is+their+ruler%E2%80%99s+work+to+guide+them+by+determining+of+due+circumstances+of+worship%2C+they+should+without+causeless+scruples+readily+obey%2C+till+they+see+just+reason+to+stop+them+in+their+obedience%3B+They+must+not+go+out+of+their+own+places+to+search+into+the+actions+of+another+man%E2%80%99s+office+to+trouble+themselves+without+any+cause.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+on+Church+Government+%26+Worship+%28London%2C+1659%29+%7C+ch.+15%2C+%E2%80%98Reasons+for+Obedience+in+Lawfull+things%E2%80%99%2C+pp.+483-85&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F70c58eeba7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/70c58eeba7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=2.%20But%20first%20I%20will%20lay,to%20trouble%20themselves%20without%20any%20cause&amp;text=2.%20B

<blockquote><p>55. That every person, appointed to any office of profit or trust shall, before he enters on the execution thereof, take the following oath… ‘I, A. B., do swear, that I… will be faithful and bear true allegiance to the State of Maryland;’ and shall also subscribe a declaration of his belief in the Christian religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maryland.html">Maryland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Constitution or Form of Government, etc. 1776 (Thorpe, 3.1700)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e6ae97590" data-kw="">
<blockquote><p>Of the promises it is evident, that to lawful powers is given the sword for punishment of malefactors, for maintenance of innocents, and for the profit and utility of their subjects. Now let us consider, whether the reformation of religion fallen in decay, and punishment of false teachers, do pertain to the Civil Magistrate and Nobility of any realm. I am not ignorant that Satan of old time, for maintenance of his darkness, has obtained of the blind world two chief points: Former, he has persuaded to Princes, Rulers, and Magistrates, that the feeding of Christ’s flock appertains nothing to their charge, but that it is rejected [i.e., devolved] upon the bishops and estate ecclesiastical: and secondarily, that the reformation of religion, be it never so corrupt, and the punishment of such as be sworn soldiers in their kingdom, are exempted from all civil power [per Romanism, for the clergy], and are reserved to themselves and to their own cognition. But that no offender can justly be exempted from punishment, and that the ordering and reformation of religion, with the instruction of subjects, does especially pertain to the Civil Magistrate, shall God’s perfect ordinance, his plain Word, and the facts and examples of those that of God are highly praised, most evidently declare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Appellation, to the Nobility and Estates of Scotland…’ (1558)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“Of the promises it is evident, that to lawful powers is given the sword for punishment of malefactors, for maintenance of innocents, and for the profit and utility of their subjects. Now let us consider, whether the reformation of religion fallen in decay, and punishment of false teachers, do pertain to the Civil Magistrate and Nobility of any realm. I am not ignorant that Satan of old time, for maintenance of his darkness, has obtained of the blind world two chief points: Former, he has persuaded to Princes, Rulers, and Magistrates, that the feeding of Christ’s flock appertains nothing to their charge, but that it is rejected [i.e., devolved] upon the bishops and estate ecclesiastical: and secondarily, that the reformation of religion, be it never so corrupt, and the punishment of such as be sworn soldiers in their kingdom, are exempted from all civil power [per Romanism, for the clergy], and are reserved to themselves and to their own cognition. But that no offender can justly be exempted from punishment, and that the ordering and reformation of religion, with the instruction of subjects, does especially pertain to the Civil Magistrate, shall God’s perfect ordinance, his plain Word, and the facts and examples of those that of God are highly praised, most evidently declare.”

e%20promises%20it%20is%20evident,are%20highly%20praised%2C%20most%20evidently%20declare&amp;text=Of%20the%20promises%20it%20is%20evident%2C%20that%20to&amp;text=of%20God%20are%20highly%20praised%2C%20most%20evidently%20declare" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-edb3caa851" data-kw="">
<blockquote><p>They [Papists] do not only say… that one born in an heretical country may deny his country, but that by heresy a man, nay, a king, is deprived of all his jurisdiction, whether natural, civil or politic… One of their own bishops says, “As soon as a Christian king becomes heretical, forthwith the people are freed from subjection.” A cardinal says, “As long as the prince continues excommunicated (as he must do ever, if he be not a Romanist, for the Pope excommunicates ipso facto all heretics) the subject is freed from the oath of subjection,” but by whom? By the Pope, says a Jesuit, who upon just cause has power to absolve from oaths both himself, (as Gregory the 12th did when he sware that if he were chosen Pope he would give it over) and all others. If he be personally excommunicated, then, says their lawyer, subjects are freed from their allegiance and all his heretical assistants are to be rooted out, and their land to be exposed to be possessed of (strangers) Catholics. Nay, says another lawyer, if he be not excommunicated, yet if his heresy be publicly known, there needs no pronunciation of the sentence of excommunication, so that (says the Jesuit) subjects may lawfully deny him obediencer? How so? For the evidence of the crime, (says their whole school, and make it a matter of certainty and faith) does infer a sentence of condemnations because (as the more common opinion does define it) there must we understand the Pope’s will to have him excommunicated, whom upon the knowledge of his fault he would excommunicate. Nay, suppose that a Protestant prince have a just quarrel: yet, no war can be lawfully denounced or waged by the Queen (being excommunicated by name) though otherwise in itself it were most just: because her power is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion, ch. 49, ‘Concerning Magistrates’, ‘What are the Assertions of Papists in this Point?’</cite>, p. 901-902</span></figcaption>

</figure><figure class="quote" id="q-dfcdf3c447" data-kw="">
<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)</cite></span></figcaption>

</figure><figure class="quote" id="q-da5bda3de4" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: And his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Even so when Satan finds that he cannot directly destroy the unity of the Church and bring division into credit, he will be more zealous for unity than Christ Himself: He will then endure no disagreement among Christians, no not in an opinion, nor a form or ceremony; not in meats or drinks or keeping of days, or in judging of things lawful or unlawful, which are not of necessity to the Church’s concord. He is either for tolerating all propagation of heresy and practice of wickedness, or else he is so much for unity, that no difference almost is to be tolerated. For he well knows that while men are imperfect such differences will still be: And then if he can but persuade the world that for concord sake they must not be endured, what follows but that the dissenters must be fined, imprisoned or banished to bring them (or the rest) to unity. And so he will set all the world together by the ears in cruelties and bloodshed and in hating one another, and all under pretense of making them one. You may think that till mankind be all turned bedlams [mental patients], they can never be so cheated by such a gross deceit, nor ever guilty of so mad a work. But what will you say if this be the common case of the far greatest part of the Christian world? And what will you say further, if after above a thousand years’ universal experience of the unhappy success, they continue it still as the only way to unity and peace? Look but about you with opened eyes and see whether it be not so. Were not he a gracious promoter of unity in the world that would say, ‘Unity is so excellent a thing that it is meet we should be all of one complexion, or at least that the world should speak but one language; and therefore no other but one should be tolerated.’ And here how easy is it to dilate of the great inconveniences of many languages: I could write a volume in folio of it myself; and all true and evident. Methinks I see hereupon how these books are scattered and read, and how those called learned men and politicians applaud them, and shake their heads and gnash their teeth at those that would have so great a mischief tolerated: And hereupon they set about the business and desire a law that upon pain of imprisonment and banishment (I know not whither) no one in the world shall speak any other language but one. And now I hope unity will be promoted indeed, when all the world is thus engaged in a war to perfect nature and make men one. But methinks I hear one man that is awake thus bespeak the promoters of this concord: ‘Unity and concord in those points where God has made them necessary, cannot be over-valued’: But yet it is visible that there is a marvelous diversity which nature is delighted in: when of all faces and of all voices, and of all the sorts of animals and plants, there is so discernable a difference: yea of all the millions of stones in the field, no two is perfectly like each other. And where greater unity is most desirable, it must first be considered how much of it is possible or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world.’ The speech being ended, the hearers derided it and made a law for unity to destroy it, and set every man on hating and fighting against his neighbor, to make all one. It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8f5ace4f9b" data-kw="">
<blockquote><p>If by the word cross, we understand the sufferings which the son of God endured, both in soul and body, as Esay 55. verse 3. Being filled with sorrows, and full of heaviness in soul, even to the death, as having drunk the cup of God’s anger, whereon he cried, My God, my god, why hast thou forsaken me? it is most certain, that such sufferings exceed representation. For our sense cannot comprehend them: but by faith we understand, that they were infinite and unspeakable. Therefore we say in our Creed, that we believe Christ Jesus did suffer, that he was crucified, dead, and buried, that he descended into hell: all these then being unspeakable, must needs be likewise irrepresentable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief treatise of the virtue of the cross and the true manner how to honour it</cite>, trans. Anthony Munday (London: Edward White, 1599), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<blockquote><p>There is felt to be something incomplete in the character of one with whom everything has gone smoothly, and who has never known sorrow or anxiety. That jovial high-spirited man may be a pleasant companion in our lighter hours, but is it to him we would turn for advice in our own anxiety, or for sympathy in our own affliction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cathedral and University Sermons</cite>, (2nd edn, London: John Murray, 1901), pp 176-77.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-e05ce1b10d" data-kw="">
<blockquote><p>My dearest Spalatin, I heartily sympathize with you and earnestly pray our Lord Jesus Christ to strengthen you and give you a cheerful heart. I should like to know, and am making diligent inquiries to find out, what your trouble may be or what has caused your breakdown. I am told by some that it is nothing else than depression and heaviness of heart, caused by the matrimonial affair of a parson who was publicly united in marriage to the stepmother of his deceased wife. If this is true, I beseech you most urgently not to become self-centered and heed the thoughts and sensations of your own heart, but to listen to me, your brother, who is speaking to you in the name of Christ. Otherwise your despondency will grow beyond endurance and kill you; for St. Paul says, 2 Corinthians 7:10: ‘The sorrow of the world worketh death.’ I have often passed through the same experience and witnessed the same in 1540, in the case of Magister Philip, who was nearly consumed by heaviness of heart and despondency on account of the landgrave’s affair. However, Christ used my tongue to raise him up again? I say this on the supposition that you have sinned and are partly to blame for the aforementioned marriage, because you approved it. Yea, I shall go further and say: Even if you had committed more numerous and grievous sins in this present and other instances than Manasseh, the king of Judah, whose offenses and crimes could not be eradicated throughout his posterity down to the time when Jerusalem was destroyed, while your offense is very light, because it concerns a temporal interest and can be easily remedied; nevertheless, I repeat it, granted you are to blame, are you going to worry yourself to death over it and by thus killing yourself commit a still more horrible sin against God? It is bad enough to know that you made a mistake in this matter. Now do not let your sin stick in your mind, but get rid of it. Quit your despondency, which is a far greater sin. Listen to the blessed consolation which the Lord offers you by the prophet Ezekiel, who says, chap. 33:11: ‘As I live, saith the Lord God, I have no pleasure in the death of the wicked, but that the wicked turn from his way and live. Do you imagine that only in your case the Lord’s hand is shortened? Isaiah 59:1. Or has He in your case alone forgotten to be gracious and shut up His tender mercies? Psalm 77:10. Or are you the first man to aggravate his sin so awfully that henceforth there is no longer a High Priest who can be touched with the feeling of our infirmities Hebrews 4:15. Do you consider it a new marvel when a person living this life in the flesh, with innumerable arrows of so many devils flying about him, is occasionally wounded and laid prostrate? It seems to me, my dear Spalatin, that you have still but a limited experience in battling against sin, an evil conscience, the Law, and the terrors of death. Or Satan has removed from your vision and memory every consolation which you have read in the Scriptures. In days when you were not afflicted, you were well fortified and knew very well what the office and benefits of Christ are. To be sure, the devil has now plucked from your heart all the beautiful Christian sermons concerning the grace and mercy of God in Christ by which you used to teach, admonish, and comfort others with a cheerful spirit and a great, buoyant courage. Or it must surely be that heretofore you have been only a trifling sinner, conscious only of paltry and insignificant faults and frailties. Therefore my faithful request and admonition is that you join our company and associate with us, who are real, great, and hard-boiled sinners. You must by no means make Christ to seem paltry and trifling to us, as though He could be our Helper only when we want to be rid from imaginary, nominal, and childish sins. No, no! That would not be good for us. He must rather be a Saviour and Redeemer from real, great, grievous, and damnable transgressions and iniquities, yea, from the very greatest and most shocking sins; to be brief, from all sins added together in a grand total. Dr. Staupitz comforted me on a certain occasion when I was a patient in the same hospital and suffering the same affliction as you, by addressing me thus: Aha! you want to be a painted sinner and, accordingly, expect to have in Christ a painted Savior. You will have to get used to the belief that Christ is a real Saviour and you a real sinner. For God is neither jesting nor dealing in imaginary affairs, but He was greatly and most assuredly in earnest when He sent His own Son into the world and sacrificed Him for our sakes, etc. Romans 8:32; John 3:16. These and similar reflections, drawn from consolatory Bible-texts, have been snatched from your memory by the accursed Satan, and hence you cannot recall them in your present great anguish and despondency. For God’s sake, then, turn your ears hither, brother, and hear me cheerfully singing—me, your brother, who at this time is not afflicted with the despondency and melancholy that is oppressing you and therefore is strong in faith, so that you, who are weak and harried and harassed by the devil, can lean on him for support until you have regained your old strength, can bid defiance to the devil, and cheerfully sing: ‘Thou hast thrust sore at me that I might fall; but the Lord helped me. Psalm 118:13. Imagine now that I am Peter holding out my hand to you and saying to you: ‘In the name of Jesus Christ, rise up and walk.’ Acts 3:6. For I know I am not mistaken, nor is the devil talking through me; but since I am laying the Word of Christ before you, it is Christ who speaks to you through me and bids you obey and trust your brother who is of the same household of faith. It is Christ that absolves you from this and all your sins, and I am a partaker of your sin by helping you to bear up under it. See that you accept and appropriate to yourself the comfort I am offering you; for it is true, certain, and reliable, since the Lord has commanded me to communicate it to you and bidden you to accept it from me. For if even I am cut to the quick by seeing you in such awful distress because of your deep melancholy, it gives God a far greater displeasure to behold it; for ‘He is gracious and merciful, slow to anger, and of great kindness, and repenteth Him of the evil.’ Joel 2:13. Therefore do not turn away from him who is coming to comfort you and announce the will of God to you and who hates and abominates your despondency and melancholy as a plague of Satan. Do not by any means permit the devil to portray Christ to you differently from what He is in truth. Believe the Scripture, which testifies that He ‘was manifested that He might destroy the works of the devil.’ 1 John 3:8. Your melancholy is a work of the devil, which Christ wants to destroy if you will only let Him. You have had your fill of anguish; you have sorrowed enough; you have exceeded your penance. Therefore, do not refuse my consolation; let me help you. Behold my faithful heart, dear Spalatin, in dealing with you and speaking to you. I shall consider it the greatest favour that I have ever received from you if you allow the comfort which I am offering you, or rather the absolution, pardon, and restoration of the Lord Christ, to abide in you. If you do this, you will, after your recovery, be forced to confess yourself that you have offered the most pleasing and acceptable sacrifice to the Lord by your obedience; for in Psalm 147:11 it is written: ‘The Lord taketh pleasure in them that fear Him, in those that hope in His mercy’; again, in Psalm 34:18: ‘The Lord is nigh unto them that are of a broken heart and saveth such as are of a contrite spirit; and in Psalm 51:17: ‘The sacrifices of God are a broken spirit; a broken and a contrite heart, O God, Thou wilt not despise? Therefore let the accursed devil with his despondency scamper away like a whipped dog. He wants to make me sad on your account; he wants to blast my joy in the Lord; yea, if he could, he would swallow us all up at one gulp. May Christ, our Lord, rebuke and chastise him, and may He strengthen, comfort, and preserve you by His Spirit! Amen. Comfort your wife with these and your own more effectual words. I have not the leisure to write also to her. Given at Zeitz, August 21, AD 1544. Your Martin Luther.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to George Spalatin</cite>, Other citations (work not named), 21 August 1544 (Weimar Ausgabe, Br X. No.402).</span></figcaption>

d+by+thus+killing+yourself+commit+a+still+more+horrible+sin+against+God%3F+It+is+bad+enough+to+know+that+you+made+a+mistake+in+this+matter.+Now+do+not+let+your+sin+stick+in+your+mind%2C+but+get+rid+of+it.+Quit+your+despondency%2C+which+is+a+far+greater+sin.+Listen+to+the+blessed+consolation+which+the+Lord+offers+you+by+the+prophet+Ezekiel%2C+who+says%2C+chap.+33%3A11%3A+%E2%80%98As+I+live%2C+saith+the+Lord+God%2C+I+have+no+pleasure+in+the+death+of+the+wicked%2C+but+that+the+wicked+turn+from+his+way+and+live.+Do+you+imagine+that+only+in+your+case+the+Lord%E2%80%99s+hand+is+shortened%3F+Isaiah+59%3A1.+Or+has+He+in+your+case+alone+forgotten+to+be+gracious+and+shut+up+His+tender+mercies%3F+Psalm+77%3A10.+Or+are+you+the+first+man+to+aggravate+his+sin+so+awfully+that+henceforth+there+is+no+longer+a+High+Priest+who+can+be+touched+with+the+feeling+of+our+infirmities+Hebrews+4%3A15.+Do+you+consider+it+a+new+marvel+when+a+person+living+this+life+in+the+flesh%2C+with+innumerable+arrows+of+so+many+devils+flying+about+him%2C+is+occasionally+wounded+and+laid+prostrate%3F+It+seems+to+me%2C+my+dear+Spalatin%2C+that+you+have+still+but+a+limited+experience+in+battling+against+sin%2C+an+evil+conscience%2C+the+Law%2C+and+the+terrors+of+death.+Or+Satan+has+removed+from+your+vision+and+memory+every+consolation+which+you+have+read+in+the+Scriptures.+In+days+when+you+were+not+afflicted%2C+you+were+well+fortified+and+knew+very+well+what+the+office+and+benefits+of+Christ+are.+To+be+sure%2C+the+devil+has+now+plucked+from+your+heart+all+the+beautiful+Christian+sermons+concerning+the+grace+and+mercy+of+God+in+Christ+by+which+you+used+to+teach%2C+admonish%2C+and+comfort+others+with+a+cheerful+spirit+and+a+great%2C+buoyant+courage.+Or+it+must+surely+be+that+heretofore+you+have+been+only+a+trifling+sinner%2C+conscious+only+of+paltry+and+insignificant+faults+and+frailties.+Therefore+my+faithful+request+and+admonition+is+that+you+join+our+company+and+associate+with+us%2C+who+are+real%2C+great%2C+and+hard-boiled+sinners.+You+must+by+no+means+make+Christ+to+seem+paltry+and+trifling+to+us%2C+as+though+He+could+be+our+Helper+only+when+we+want+to+be+rid+from+imaginary%2C+nominal%2C+and+childish+sins.+No%2C+no%21+That+would+not+be+good+for+us.+He+must+rather+be+a+Saviour+and+Redeemer+from+real%2C+great%2C+grievous%2C+and+damnable+transgressions+and+iniquities%2C+yea%2C+from+the+very+greatest+and+most+shocking+sins%3B+to+be+brief%2C+from+all+sins+added+together+in+a+grand+total.+Dr.+Staupitz+comforted+me+on+a+certain+occasion+when+I+was+a+patient+in+the+same+hospital+and+suffering+the+same+affliction+as+you%2C+by+addressing+me+thus%3A+Aha%21+you+want+to+be+a+painted+sinner+and%2C+accordingly%2C+expect+to+have+in+Christ+a+painted+Savior.+You+will+have+to+get+used+to+the+belief+that+Christ+is+a+real+Saviour+and+you+a+real+sinner.+For+God+is+neither+jesting+nor+dealing+in+imaginary+affairs%2C+but+He+was+greatly+and+most+assuredly+in+earnest+when+He+sent+His+own+Son+into+the+world+and+sacrificed+Him+for+our+sakes%2C+etc.+Romans+8%3A32%3B+John+3%3A16.+These+and+similar+reflections%2C+drawn+from+consolatory+Bible-texts%2C+have+been+snatched+from+your+memory+by+the+accursed+Satan%2C+and+hence+you+cannot+recall+them+in+your+present+great+anguish+and+despondency.+For+God%E2%80%99s+sake%2C+then%2C+turn+your+ears+hither%2C+brother%2C+and+hear+me+cheerfully+singing%E2%80%94me%2C+your+brother%2C+who+at+this+time+is+not+afflicted+with+the+despondency+and+melancholy+that+is+oppressing+you+and+therefore+is+strong+in+faith%2C+so+that+you%2C+who+are+weak+and+harried+and+harassed+by+the+devil%2C+can+lean+on+him+for+support+until+you+have+regained+your+old+strength%2C+can+bid+defiance+to+the+devil%2C+and+cheerfully+sing%3A+%E2%80%98Thou+hast+thrust+sore+at+me+that+I+might+fall%3B+but+the+Lord+helped+me.+Psalm+118%3A13.+Imagine+now+that+I+am+Peter+holding+out+my+hand+to+you+and+saying+to+you%3A+%E2%80%98In+the+name+of+Jesus+Christ%2C+rise+up+and+walk.%E2%80%99+Acts+3%3A6.+For+I+know+I+am+not+mistaken%2C+nor+is+the+devil+talking+through+me%3B+but+since+I+am+laying+the+Word+of+Christ+before+you%2C+it+is+Christ+who+speaks+to+you+through+me+and+bids+you+obey+and+trust+your+brother+who+is+of+the+same+household+of+faith.+It+is+Christ+that+absolves+you+from+this+and+all+your+sins%2C+and+I+am+a+partaker+of+your+sin+by+helping+you+to+bear+up+under+it.+See+that+you+accept+and+appropriate+to+yourself+the+comfort+I+am+offering+you%3B+for+it+is+true%2C+certain%2C+and+reliable%2C+since+the+Lord+has+commanded+me+to+communicate+it+to+you+and+bidden+you+to+accept+it+from+me.+For+if+even+I+am+cut+to+the+quick+by+seeing+you+in+such+awful+distress+because+of+your+deep+melancholy%2C+it+gives+God+a+far+greater+displeasure+to+behold+it%3B+for+%E2%80%98He+is+gracious+and+merciful%2C+slow+to+anger%2C+and+of+great+kindness%2C+and+repenteth+Him+of+the+evil.%E2%80%99+Joel+2%3A13.+Therefore+do+not+turn+away+from+him+who+is+coming+to+comfort+you+and+announce+the+will+of+God+to+you+and+who+hates+and+abominates+your+despondency+and+melancholy+as+a+plague+of+Satan.+Do+not+by+any+means+permit+the+devil+to+portray+Christ+to+you+differently+from+what+He+is+in+truth.+Believe+the+Scripture%2C+which+testifies+that+He+%E2%80%98was+manifested+that+He+might+destroy+the+works+of+the+devil.%E2%80%99+1+John+3%3A8.+Your+melancholy+is+a+work+of+the+devil%2C+which+Christ+wants+to+destroy+if+you+will+only+let+Him.+You+have+had+your+fill+of+anguish%3B+you+have+sorrowed+enough%3B+you+have+exceeded+your+penance.+Therefore%2C+do+not+refuse+my+consolation%3B+let+me+help+you.+Behold+my+faithful+heart%2C+dear+Spalatin%2C+in+dealing+with+you+and+speaking+to+you.+I+shall+consider+it+the+greatest+favour+that+I+have+ever+received+from+you+if+you+allow+the+comfort+which+I+am+offering+you%2C+or+rather+the+absolution%2C+pardon%2C+and+restoration+of+the+Lord+Christ%2C+to+abide+in+you.+If+you+do+this%2C+you+will%2C+after+your+recovery%2C+be+forced+to+confess+yourself+that+you+have+offered+the+most+pleasing+and+acceptable+sacrifice+to+the+Lord+by+your+obedience%3B+for+in+Psalm+147%3A11+it+is+written%3A+%E2%80%98The+Lord+taketh+pleasure+in+them+that+fear+Him%2C+in+those+that+hope+in+His+mercy%E2%80%99%3B+again%2C+in+Psalm+34%3A18%3A+%E2%80%98The+Lord+is+nigh+unto+them+that+are+of+a+broken+heart+and+saveth+such+as+are+of+a+contrite+spirit%3B+and+in+Psalm+51%3A17%3A+%E2%80%98The+sacrifices+of+God+are+a+broken+spirit%3B+a+broken+and+a+contrite+heart%2C+O+God%2C+Thou+wilt+not+despise%3F+Therefore+let+the+accursed+devil+with+his+despondency+scamper+away+like+a+whipped+dog.+He+wants+to+make+me+sad+on+your+account%3B+he+wants+to+blast+my+joy+in+the+Lord%3B+yea%2C+if+he+could%2C+he+would+swallow+us+all+up+at+one+gulp.+May+Christ%2C+our+Lord%2C+rebuke+and+chastise+him%2C+and+may+He+strengthen%2C+comfort%2C+and+preserve+you+by+His+Spirit%21+Amen.+Comfort+your+wife+with+these+and+your+own+more+effectual+words.+I+have+not+the+leisure+to+write+also+to+her.+Given+at+Zeitz%2C+August+21%2C+AD+1544.+Your+Martin+Luther.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Letter+to+George+Spalatin%2C+Other+citations+%28work+not+named%29%2C+21+August+1544+%28Weimar+Ausgabe%2C+Br+X.+No.402%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe05ce1b10d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e05ce1b10d.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/10/luthers-cure-for-spiritual-depression/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-5284cf8707" data-kw="">
<blockquote><p>Now of all other temptations, it pleaseth God to suffer his church to be tempted with afflictions. It is never free either from the sword of Ishmael; which is a reviling tongue: or the sword of Esau, a persecuting hand. Neither was there yet ever Christian man found, who had not his part in the cup of affliction. We must drink of the same cup our master did: the disciple is not about his master.

The reasons why God doth visit vs thus with afflictions, are: 1. To humble us. 2. To wean us. 3. To winnow us. 4. To prevent us. 5. To teach us. 6. To enlighten us. 7. To honour us. 8. To cure us. 9. To crown us. 10. To comfort us. 11. To protect us. 12. To adopt us. And last of all, to teach and comfort others.

To humble us, that we be not proud: to wean us, that we love not his world: to winnow us, that we be not chaff: to prevent us, that we do not sin: to teach us, that we be patient in adversity: to enlighten us, that we see our errors: to honour us, that our faith may be manifest: to cure us, that we surfeit not of security: to crown us, that we may live eternally: to comfort us, that he may send his spirit: to protect us, that he may guide us by his Angels: to adopt us, that we may be his sons: and to teach others, that they seeing how sin is punished in us, they may take heed it be not found in them: that they seeing our comforts in troubles, may not be discouraged in the like trials.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0c0ab4d26c" data-kw="priesthood changed Melchizedek">
<blockquote><p>Hence the apostle infers, “The priesthood being changed, there is made of necessity a change also of the law” (Heb. 7:12, 13). “For if,” says he, “perfection were by the Levitical priesthood, what further need was there that another priest should rise after the order of Melchizedek, and not be called after the order of Aaron?” (Heb. 7:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.25.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a> › <a href="../topics/the-law-of-god/ceremonial-law/abrogation.html">Abrogation</a></span><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a> › <a href="../topics/the-law-of-god/ceremonial-law/its-types.html">Its types</a></span><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a> › <a href="../topics/the-law-of-god/ceremonial-law/its-relation-to-christ.html">Its relation to Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a2e559560" data-kw="believer obedience not punishment">
<blockquote><p>In the state of grace, it binds the believer only to obedience, not to punishment because there is no condemnation to those who are in Christ (Rom. 8:1), whose transgressions are forgiven (Ps. 32:1). Rather the question concerns the state of sin—whether in it the sinner is bound to both (which we assert). First, from the twofold condition of sinful man, who is both a creature and a sinful creature. As a creature, he owes to God obedience forever and never can be discharged from it. As a sinner, he owes punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.12–13</span></figcaption>

</figure><figure class="quote" id="q-da6a422848" data-kw="sabbath partly moral ceremonial">
<blockquote><p>Whether the first institution of the Sabbath was in the fourth commandment; and whether the commandment is partly moral, partly ceremonial. The former we deny; the latter we affirm. The true derivation of the word is from the verb shbhth (i.e., “to cease” or “to rest”), which relates either to the existence of a thing, when it ceases to be and fails, or to the operation of an agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.13.1</span></figcaption>

</figure><figure class="quote" id="q-a1bd63ace0" data-kw="judicial equity abrogation">
<blockquote><p>In that law various ends must be distinguished. For inasmuch as it was a distinction of the Jewish state from the Gentiles and a type of the kingdom of Christ, it is simply abrogated because there is no longer any distinction between the Jews and the Gentiles in Christ (Gal. 3:28; Eph. 2:14). As the Jewish state and polity has been destroyed, so there is no need of a type to adumbrate the future kingdom of Christ, since it has already come. But as to the good order or form of government of the people of God, those things which are of common and perpetual equity remain and must still be observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.26.3</span></figcaption>

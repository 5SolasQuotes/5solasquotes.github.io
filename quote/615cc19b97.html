<blockquote><p>Our justification means not only that our sins are forgiven and that we have been declared to be righteous by God Himself, not merely that we were righteous at the moment when we believed, but permanently righteous. For justification means this also, that we are given by God the positive righteousness of His own Son, the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-martyn-lloyd-jones.html">D. Martyn Lloyd-Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Depression – Its Causes and its Cures</cite>, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-as-a-one-time-act.html">Justification as a one-time act</a></span></div>

</figure><figure class="quote" id="q-0a52eda260" data-kw="">
<blockquote><p>35. Justification both presupposes and accompanies effectual calling with indivisible connection.

36. But it is not a physical action, but moral, or rather forensic, nor transmutative of the subject, nor inhesive in the subject, but rather terminative toward the subject.

37. It is to be attributed to God efficiently, to Christ meritoriously, to faith instrumentally.

38. One act of faith is direct toward its object, another reflexive toward itself. Also the first act of faith is to believe, the second to work through charity and by means of it.

39. This latter act is the instrument of our sanctification…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-ff83496309" data-kw="">
<blockquote><p>16. And indeed, as among the external instrumental causes of justification there is both the Word of the Gospel, Rom. I.16, and the sacraments, Tit. III.5; 1 Pet. III.21: so the internal instrumental cause is not hope, charity, fear, repentance, etc., but faith alone among causes of its own order — and alone indeed not by reason of its existence, but by reason of its apprehension and the faculty of apprehending — inasmuch as it alone is the analogous instrument suited to the apprehension of the righteousness of Christ.

17. Faith, moreover, is considered in the act of justification neither dispositively, nor habitually, nor formally, nor meritoriously, nor in the genus of a work, but partly organically by reason of its own act, and partly correlatively by reason of its object [i.e. Christ]. Whence the apostle wisely says that we are justified πίστει [pistei, by faith], ἐκ πίστεως [ek pisteōs, out of faith], διὰ τῆς πίστεως [dia tēs pisteōs, through faith] — but never διὰ τὴν πίστιν [dia tēn pistin, on account of faith].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

f83496309.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff83496309.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=16.%20And%20indeed%2C%20as%20among%20the,t%C4%93n%20pistin%2C%20on%20account%20of%20faith&amp;text=16.%20And%20indeed%2C%20as%20among%20the%20external%20instrumental&amp;text=%CF%80%CE%AF%CF%83%CF%84%CE%B9%CE%BD%20%5Bdia%20t%C4%93n%20pistin%2C%20on%20account%20of%20faith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

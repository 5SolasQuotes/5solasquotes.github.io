<main class="wrap"><figure class="quote" id="q-57f3f0dde2" data-kw="">
<blockquote><p>The Spiritual Christian knows no Sabbath but the bosom of the Father.

Answ. No wonder Antinomians destroy the fourth Commandment, they destroy the other nine, and all the letter of the Bible, as fleshly, and a killing Letter. I believe the Lord’s day is moral and perpetually moral till Christ’s coming, from Gen. 2.2. Exod. 20.8. Deut. 5.12. Matth. 24.20. John 19.42. Luke 24.56. 1 Cor. 16.1. Acts 20.7. Rev. 1.10. Let Saltmarsh and Familists call for the book of sports on the Lord’s day: I knew never any truly Godly in either Kingdom despise the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.26, p. 229.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-eb7595389b" data-kw="">
<blockquote><p>Carnal sports and pleasures are as great a profanation of the sabbath, as the most servile labour and drudgery in the world. Dicing and card-playing do as much violate the law of the sabbath, as digging and carting; playing, as much as ploughing; dancing and morrice-games, as much as working in the smith’s forge; bowling and shooting, as well as hewing of wood and drawing of water.</p></blockquote>

</figure><figure class="quote" id="q-0da00a44f2" data-kw="">
<blockquote><p>I saw the evil of legal preaching, which lies in one of two things, or in both. 1. In laying too much stress upon the works of the law, our duties and strength: Or, 2. In pressing evangelical doctrines without an eye to that which is the spring of the church’s edification, the Spirit of the Lord… O Lord, thou knowest how much of it is in this poor church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Of Legal Preaching” in Memoirs of the Rev. Thomas Halyburton</cite>, (William Collins, 1838), 261-62.</span></figcaption>

<blockquote><p>Broken hearts are a wonderful delight unto the Lord: There are somethings in which God hath no delight in sinnings, nor in punishments: and there are two hearts in which God takes much delight, namely, in an upright heart and in a contrite heart, The broken heart he will not despise, nay he will look upon that heart to revive it: If broken hearts be God’s delight, and the objects of his reviving, then without question they are a means to prevent destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Preservation or, A Sermon Discovering the only way to prevent Destroying Judgements: Preached to the Honourable House of Commons at their last Solemn Fast, being on May, 25, 1642</cite>, (London: Samuel Gellibrand, 1642), p. 17.</span></figcaption>

<blockquote><p>[19] Q. What is the outward theological calling? An. It is medium ad salitem [a means to salt], as the word and sacraments and the members of the visible church belong unto it. [20] Q. What is that inward theological calling? An. It is when God’s word brings [God’s word’s ring?] does not rest in our outward ears but comes into the heart and works somewhat there. [21] Q. How many ways [is] this taken? An. It is either effectual or ineffectual. [22] Q. What is the inward ineffectual calling? An. When it comes into the heart and falls as on stony ground. [23] Q. How far may this inward ineffectual calling bring us? An. To these four degrees of grace principally. 1. It may bring a man to see his own sin &amp; misery. 2ly. It may so work upon him, as it may bring him to have a desire after the thing persuaded [for?] 3ly It may bring him to some kind of degree of possession of the thing called for. 4ly It may bring him to some outward correspondence, as to reform many sins. [24] Q. Why then is it called an ineffectual calling? An. Because it does not fully persuade [the] heart to come in. … [30] Q. By what wording in scripture is our vocation expressed? An. By many expressions: as first by alluring and persuading. Hos. 2:14. 2ly by inviting and compelling. Math 22:4. 3ly by stretching out of the hand. Rom. 10:21. 4ly by beseeching, 2 Cor. 5:20. 5ly by drawing us. John 6.44. Lastly by apprehending. [31] Q. Do all these properly belong to effectual calling? An. No, the four first may be applied to ineffectual calling. … [38] Q. Whither do effectual and ineffectual calling differ in this respect or no, do not both come from God? An. They agree in this that both proceed from God, yet they differ in regard of the manner of work, for God does the work not secundum propositum [according to the purpose], but secundum obviam [according to the thing encountered]. … [55] Q. What and how many are the instrumental causes of our vocation? An. They are of two sorts either primary or secondary? [56] Q. What were the primary? An. The word. [57] Q. In what propositions was that expressed? An. James 5:11 [1:21?] suggests the word is the ordinary means whereby He calls and so by consequence the ministry of it. 2d. That it was but an instrumental cause under God and so it’s called the [sassed?] of God, the arm of god and sometime the power of God. 3ly. That as it’s but an instrumental cause so it did only belong to those which are adults, for infants may be said to be sanctified but not called. 4. That it was but a separable instrument. [58] Q. How can we say if the converting word is a separable means? An. For two reasons: Because the word may be without the Spirit. 2. Because the Spirit may be and may call some without the word. … [86] Q. Now you have spoken of the primary instruments of salvation as the word and sacraments. What are the secondary instruments? An. They are many as: 1. The mercies and favors of God common to all. Rom. 10:21 [“But to Israel he saith, All day long I have stretched forth my hands unto a disobedient and gainsaying people.”]. Bounty is one thing that may cause love so that one main instrument or means God uses to call us home which is to draw us with the thick cords of love [Hos. 11:4]. … [95] Q. Whether do effectual and ineffectual calling differ in this [Q: 94: ‘who are they whom God is thus pleased to call’]? An. Yes, for the ineffectual calling, many are called but few are chosen.</p></blockquote>

<blockquote><p>9. There must be a satisfaction with the terms of the gospel, and the heart must actually close with Christ, as He is offered in the gospel. The heart must open to Him, and take Him in, Rev. 3:20. The soul must embrace and receive Him, John 1:12. The man must take Him, as his Lord and Master King, Priest and Prophet; must give up himself to Him as his Leader and Commander, and resolve to follow Him in all things, and thus close a bargain with Him. … 8. That, as to them, all Christ’s entreaties, motives, allurements, patience and long suffering, his standing at the door and knocking, till his locks be wet with the dew, etc., are in vain: yea, they are contemptuously rejected, despised, slighted, and undervalued.</p></blockquote>

<blockquote><p>…Under which two excuses [in the text] are comprehended all others of like sort, which flesh and blood does minister, for hindering to rise and open to Christ, and obey his calling, such as we see, Mt. 22, and are usually suggested by our corruption, as the quitting of our pleasure, or profit, our ease, credit, or companions, if we do so; and that we shall fall in disgust, hatred, and obloquy, and other like inconveniences: Neither is it a fit time as yet (but as Felix said to Paul, Acts 24:25) we may take a more convenient season for that, or the like purposes, etc. Such excuses do absenters of themselves from public exercises of divine worship, make, and profaners of the Lord’s Sabbath; such also do covetous extortioners, revengeful oppressors: unclean whoremongers, riotous, drunkards and the like, frame to themselves, and obtrude, and all for this end, to keep Christ out, though He frequently call and knock at their door to enter in. Observations:

1. We see hereby, that it is not an easy matter, but a very hard and difficult one to bring the soul and Christ together, into a near and constant fellowship… but take heed to his voice who calls and knocks, and, as the Father spake at Christ’s baptism from heaven, hear Him and obey.

2. We see, how strong is carnal corruption, and remnants of sin in the regenerate, to hold Christ at the door, and to sleight his voice, calling on the•… to open; and therefore, how much more stronger is the same in the unregenerate, and it is no marvel that they open not unto Him and disobey his voice.</p></blockquote>

<blockquote><p>Secondly, we must from hence be exhorted to take heed of usurping Christ’s honor to our selves, of being our own rule or way. The Lord is a jealous God, and will not suffer any to be a self mover, or a God unto himself. It is one of God’s extremest judgments to give men over to themselves, and leave them to follow their own rules. When He has first woo’d men by his Spirit, and that is resisted; enticed them by his mercies, and they are abused; threatened them with his judgments, and they are mis-attributed to second causes; cried unto them by his prophets, and they are reviled; sent his own Son to persuade them, and He is trampled on and despised: when He offers to teach them, and they stop their ears; to lead them, and they pull away their shoulder; to convert them, and they hardened their heart; when they set up mounds against the Gospel, as it were to non-plus and pose the mercies of God, that there may be no remedy left; then after all these indignities to the Spirit of Grace, this is the judgement with which God uses to revenge the quarrel of his Grace and Covenant, to leave them to the hardness and impenitency of their own hearts, to be a rule and way unto themselves. My people would not hearken to my voice, and Israel would none of me. … [Reynolds below is describing Christ’s offers, wooings and entreaties both before and after conversion, which is clear from the beginning and end of the quote] We see then, to conclude all, what an absolute necessity lies upon us of having Christ, because with Him we have All things, and can do all things: without Him we are poor and can do nothing. And the more necessary the duty, the more sinful the neglect: especially considering that Christ withholds not Himself, but is ready to meet, to prevent, to attend every heart that in truth desires Him. If a man have a serious, simple, sincere will, to come wholly to Christ, not to be held back from him by His dearest and closest corruptions, by the sweetest pleasures, or strongest temptations, which can allure or assault him, he may draw near unto Him with boldness, and assurance of acceptation: he has a call, Christ invites [Margin Note: Rev. 22:17], yea entreats him, and therefore he may come: he has a command, Christ requires it of him, and therefore he must come. And now when we have Christ, how careful should we be to keep Him; how tender and watchful over all our behaviors towards Him, lest He be grieved and depart again. The Spirit of the Lord is a delicate spirit, most sensible of those injuries which his friends do Him. Let us therefore take heed of violating, afflicting, discouraging, grieving this Spirit (which is the bond of all our union and interest with Christ) in any of those his sacred breathings and operations upon the Soul. But when He teaches, let us submit and obey, receive the belief and the love of His Truth: when He promises, let us neither distrust nor despise, but embrace as true, and admire as precious, all the offers which He makes to us: when He contends with our lusts in His Word and secret suggestions, let him not always strive, but let us give up our fleshly affections to be crucified by Him: when He woos and invites us, when He offers to lead and to draw us, let us not stop the ear, or pull away the shoulder, or draw backward like froward children, or cast cold water in the face of Grace, by thwarting the motions, and rebelling against the dictates thereof, but let us yield our selves unto Him, captivate all our lusts, and consecrate all our powers, and submit all our desires to His rule and government; and then when He has been a Spirit of union, to incorporate us into Christ’s Body; and a Spirit of unction, to sanctify us with His Grace, He will undoubtedly be a Spirit of comfort and assurance, to seal us unto the day of our full redemption.</p></blockquote>

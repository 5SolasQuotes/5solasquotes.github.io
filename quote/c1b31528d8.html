<main class="wrap"><figure class="quote" id="q-c1b31528d8" data-kw="">
<blockquote><p>Finally, “Why will ye die?” Are ye, after mature deliberation, finally and firmly resolved to reject all that can make you happy, and to court all that can make you miserable? Are you resolved to be Satan’s slaves rather than Jesus’ freemen? Have you made up your minds that the vials of that wrath which agonizes soul and body through eternity, are preferable to that cup of salvation which the Gospel invites you to drink? Are you resolved that Christ and salvation shall never be yours? Are you resolved that those healthful countenances shall. through eternity, be writhed in unutterable anguish?

Are you resolved that the voices which have been mingled to-day in the songs of Zion, shall be ultimately and for ever spent in the hideous wailings and lamentations of those who are consigned to the lake that burneth? Have the shrieks of eternal despair more charms than the new and ceaseless song of ransomed, happy Zion? Are you resolved to dwell with devouring flames, and to lie down in everlasting burnings, rather than in good earnest seek an entrance into that blessed abode where there is fulness of joy, and where there are pleasures for evermore? Are you resolved to cast away eternal life, with all the glory and the happiness it implies, and to prefer the second death with all the unmitigated agonies it ensures? Eternal Spirit! draw nigh in preventing grace, touch and soften every heart, that all may listen to the affecting question, “Why will ye die?</p></blockquote>

<blockquote><p>And in this judgment of God’s Church, the ground of the condemnation of Hypocrites, is the default of good works is the ground of the condemnation of hypocrites, because that thereby is shown the falsity of their faith and profession: and contrariwise the practice of them, is the true proof of a lively faith, and the accomplishment of the duties of the evangelical covenant, on the believer’s behalf; and the beginning of the spiritual life, which shall never be perfected in Heaven unless it be begun in this world. See concerning this judgment, Ps. 50:4; Eze. 34:17; Heb. 10:30; Jam. 2:24. And as the life everlasting is altogether holiness and charity, so Christ represents the disposition which is necessary unto it, by the pureness of the sheep, and by spiritual charity practiced towards his as towards Himself.</p></blockquote>

<blockquote><p>[The saints] in heaven will behold an outward glory as they [behold] the human nature of Christ, which is united to the Godhead, as it is the body of that person that is God. And there will doubtless be appearances of a divine and inimitable glory and beauty in Christ’s glorified body, which it will indeed be a ravishing and blessed sight to see.

But the beauty of Christ’s body that will be beheld with bodily eyes will be ravishing and delighting chiefly as it will express his spiritual glories. The majesty that will appear in Christ’s body will express and show forth the spiritual greatness and majesty of the divine nature. The pureness and beauty of that light and glory will express the perfection of the divine holiness. The sweetness and ravishing mildness of his countenance will express his divine and spiritual love and grace.

Thus it was, when the three disciples beheld Christ at his transfiguration upon the mount. They beheld a wonderful, outward glory in Christ’s body, an inexpressible beauty in his countenance; but that outward glory and beauty delighted them principally as it was an expression or signification of the divine excellencies of his mind, as we may see by their manner of speaking of it.

It was the sweet mixture there was of majesty and grace in his countenance that ravished them; 2 Peter 1:16–18, “We were eyewitnesses of his majesty. For he received from God the Father honour and glory, when there came such a voice to him from the excellent glory, This is my beloved Son, in whom I am well pleased. And this voice we heard when we were with him in the holy mount.”

But especially by the account that John gives of it; John 1:14, “And the Word was made flesh and dwelt among us (and we beheld his glory, the glory as of the only begotten of the Father), full of grace and truth,” where John very probably had in his mind what he had seen in the mount at the Transfiguration. Grace and truth are not outward but spiritual glories.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Pure in Heart Blessed</cite>, (1730) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 62-63.</span></figcaption>

</figure><figure class="quote" id="q-1c51b93be9" data-kw="">
<blockquote><p>This blissful sight of God, being quite above our present capacities, we must needs be much in the dark about it. But it seems to be something else, than the fight of that glory, which we will see with our bodily eyes, in the saints and in the man Christ, or any other splendour or refulgence from the Godhead whatsoever; for no created thing can be our chief good and happiness, nor fully satisfy our souls; and it is plain, that these things are somewhat different from God himself. Therefore I conceive, that the souls of the saints shall see God himself: so the scriptures teach us, that we shall see face to face, and know even as we are known, 1 Cor xiii 12. And that we shall see him as he is, 1 John iii. 12.

Howbeit the saints can never have an adequate conception of God; they cannot comprehend that which is infinite. They may touch the mountain, but cannot grasp it in their arms They cannot with one glance of their eye, behold what grows on every side: but the divine perfections will be an unbounded field, in which the glorified shall walk eternally, seeing more and more of God: since they can never come to the end of that which is infinite. They may bring their vessels to this ocean every moment, and fill them with new waters.

What a ravishing sight would it be, to see all the perfections, and lovely qualities, that are scattered here and there among the creatures, gathered together into one! but even such a sight would be infinitely below this blissful sight the saints shall have in heaven. For they shall see God, in whom all these perfections shall eminently appear, with infinitely more; whereof there is no vestige to be found in the creature. In him shall they see every thing desirable, and nothing but what is desirable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa</cite>, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 309.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“This blissful sight of God, being quite above our present capacities, we must needs be much in the dark about it. But it seems to be something else, than the fight of that glory, which we will see with our bodily eyes, in the saints and in the man Christ, or any other splendour or refulgence from the Godhead whatsoever; for no created thing can be our chief good and happiness, nor fully satisfy our souls; and it is plain, that these things are somewhat different from God himself. Therefore I conceive, that the souls of the saints shall see God himself: so the scriptures teach us, that we shall see face to face, and know even as we are known, 1 Cor xiii 12. And that we shall see him as he is, 1 John iii. 12.

Howbeit the saints can never have an adequate conception of God; they cannot comprehend that which is infinite. They may touch the mountain, but cannot grasp it in their arms They cannot with one glance of their eye, behold what grows on every side: but the divine perfections will be an unbounded field, in which the glorified shall walk eternally, seeing more and more of God: since they can never come to the end of that which is infinite. They may bring their vessels to this ocean every moment, and fill them with new waters.

What a ravishing sight would it be, to see all the perfections, and lovely qualities, that are scattered here and there among the creatures, gathered together into one! but even such a sight would be infinitely below this blissful sight the saints shall have in heaven. For they shall see God, in whom all these perfections shall eminently appear, with infinitely more; whereof there is no vestige to be found in the creature. In him shall they see every thing desirable, and nothing but what is desirable.”

— Thomas Boston, Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 309.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+blissful+sight+of+God%2C+being+quite+above+our+present+capacities%2C+we+must+needs+be+much+in+the+dark+about+it.+But+it+seems+to+be+something+else%2C+than+the+fight+of+that+glory%2C+which+we+will+see+with+our+bodily+eyes%2C+in+the+saints+and+in+the+man+Christ%2C+or+any+other+splendour+or+refulgence+from+the+Godhead+whatsoever%3B+for+no+created+thing+can+be+our+chief+good+and+happiness%2C+nor+fully+satisfy+our+souls%3B+and+it+is+plain%2C+that+these+things+are+somewhat+different+from+God+himself.+Therefore+I+conceive%2C+that+the+souls+of+the+saints+shall+see+God+himself%3A+so+the+scriptures+teach+us%2C+that+we+shall+see+face+to+face%2C+and+know+even+as+we+are+known%2C+1+Cor+xiii+12.+And+that+we+shall+see+him+as+he+is%2C+1+John+iii.+12.%0A%0AHowbeit+the+saints+can+never+have+an+adequate+conception+of+God%3B+they+cannot+comprehend+that+which+is+infinite.+They+may+touch+the+mountain%2C+but+cannot+grasp+it+in+their+arms+They+cannot+with+one+glance+of+their+eye%2C+behold+what+grows+on+every+side%3A+but+the+divine+perfections+will+be+an+unbounded+field%2C+in+which+the+glorified+shall+walk+eternally%2C+seeing+more+and+more+of+God%3A+since+they+can+never+come+to+the+end+of+that+which+is+infinite.+They+may+bring+their+vessels+to+this+ocean+every+moment%2C+and+fill+them+with+new+waters.%0A%0AWhat+a+ravishing+sight+would+it+be%2C+to+see+all+the+perfections%2C+and+lovely+qualities%2C+that+are+scattered+here+and+there+among+the+creatures%2C+gathered+together+into+one%21+but+even+such+a+sight+would+be+infinitely+below+this+blissful+sight+the+saints+shall+have+in+heaven.+For+they+shall+see+God%2C+in+whom+all+these+perfections+shall+eminently+appear%2C+with+infinitely+more%3B+whereof+there+is+no+vestige+to+be+found+in+the+creature.+In+him+shall+they+see+every+thing+desirable%2C+and+nothing+but+what+is+desirable.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+Human+nature+in+its+fourfold+state%2C+of+primitive+integrity%2C+subsisting+in+the+parents+of+Mankind+in+paradise.+Entire+depravation%2C+subsisting+in+the+unregenerate.+Begun+recovery%2C+subsisting+in+the+regenerate.+And+consummate+happiness+or+misery%2C+subsisting+in+all+mankind+in+the+future+state.+In+severa%2C+ed.+Michael+Boston+%281784%3B+United+States%3A+The+Booksellers%2C+1787%29%2C+p.+309.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1c51b93be9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1c51b93be9.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/03/08/thomas-boston-on-the-beatific-vision/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

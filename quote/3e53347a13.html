<blockquote><p>… Whether God is imaginable? It is denied. … Whether we know God immediately, whether in this life or in the future? It is denied. Whether we may know him through intelligible species? It is affirmed. Whether through proper species or indeed through species of creatures? It is distinguished. From whence are those species? It is explained. Whether the created intellect is able clearly and intuitively to see the essence of God? It is denied. Whether the created intellect is able to comprehend the essence of God? It is denied. Whether the essence of God is seen by any created intellect according to any created species? It is denied. … Whether the created intellect needs an intelligible species to see God? It is affirmed. Whether the created intellect needs the light of glory to see God? It is distinguished. Whether God is able to supply the activity of the light of glory? A curious question Whether above natural cognition in the present life another cognition of God may hold through grace? It is affirmed. Whether all beatific visions are equally perfect essentially? It is affirmed. Whether all beatific visions are equally perfect accidentally? It is denied. Whether it may prove that one vision is more perfect than another? It is explained and the question is curious. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(8) ‘Invisibility &amp; Incomprehensibility’ in Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 1, tract 2, I. ‘Of God’, 4. Attributes of God in Specific, 1st Kind Abbr.</span></figcaption>

<blockquote><p>22. And so we must conceive of God by all these following inadequate conceptions, confessing the impropriety, but having no better: I. The essence of God, who in Scripture is called in two words “An Infinite Spirit,” is necessarily conceived of by these three conceptions: 1. [Greek], 2. Vita [life], 3. Perfectio [perfection]. The two first being the substantial conceptus of a spirit, and the third that which answers to all perfective degrees, properties, and accidents in creatures, and comprehends a multitude of perfective attributes; which I express in the abstract, being loath much to use concretes or adjectives of God. Of these, as the first answers to matter in materials and to the genus and substantia abstracte sumpta in spirits, so the second to the form and difference, when yet in God there is no composition or matter. 22. II. And the formal conceptus ‘Vita’ must itself be conceived of in this threefold inadequate conception: 1. Potentia-Actus [power-act], 2. Intellectus [understanding], 3. Voluntas [will]. I call the first Potentia-Actus to avoid concretes, and to signify that as God has no potentia passiva [passive power], so his potentia activa [active power] is not an idle, ceasing power, but in perpetual perfect act; and that act is a most powerful act: so that neither potentia alone, nor actus alone, but both together, are our best conception of this first principle in the Deity. And I take it for granted that even in man’s soul, the potentia vitalis activa [vital active power], the intellect, and the will, are not, as Thomas thought, accidents, but the formal essence of the soul, as the Scotists and Nominalists better say. And I have largely elsewhere proved this, and therefore stand not here upon it. … 25. IV. The essential immanent acts of God are three:

1. Sibi vivere [to live to Himself], or to be essential active life in Himself;

2. Se intelligere [to understand Himself], to know Himself;

3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

</figure><figure class="quote" id="q-7eb132bfe3" data-kw="attributes essence">
<blockquote><p>The divine attributes are the essential properties by which he makes himself known to us who are weak and those by which he is distinguished from creatures; or they are those which are attributed to him according to the measure of our conception in order to explain his nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.5.1</span></figcaption>

</figure><figure class="quote" id="q-c563cf8a32" data-kw="">
<blockquote><p>But if any one alleges that the human mind which is finite cannot possibly comprehend divine things which are infinite, we must here properly distinguish–For if by the word ‘comprehend’ be meant to comprehend perfectly, we are quite agreed. For we are entirely of the opinion that a perfect and adequate knowledge of divine matters is quite inconsistent with the imperfection of the human understanding. But if by ‘comprehending’ be understood a clear and convincing knowledge, to a certain degree, the greatness of the objects in such enquiries is by no means inconsistent with this kind of knowledge. For what can the mind conceive greater than eternity? when we attempt to have a full and adequate conception of it, our understanding is quite aborbed by the idea: and yet that there is such a thing as eternity is one of the clearest and most evident truths, as we shall demonstrate in its proper place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-70474a5499" data-kw="">
<blockquote><p>When we speak of a concept that is predicated univocally, we say, with Scotus, that that concept is univocal “which is one in such a way that its unity suffices for contradiction, by affirming and denying it of the same thing. It suffices too for a middle term in syllogisms, so that extremes united in a middle term that is thus one are shown, without the fallacy of equivocation, to be united with each other” (Oxon. 1 d.3 q.2 n.5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 89</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25f516dcaa" data-kw="">
<blockquote><p>In order effectively to serve the needs of human life, modern biology reconstructed the nature of the organic body, representing it not as something animated, purposive and striving, but as dead matter-in-motion. This reductive science has given us enormous power, but it offers no standards to guide its use. Worse, it challenges our self-understanding as creatures of dignity, rendering us incapable of recognizing dangers to our humanity that arise from the very triumphs biology has made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-may.html">William May</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Leon Kass &amp; the Challenge of Bioethics’</cite>, (2003) | Kass:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-773bdeeacd" data-kw="">
<blockquote><p>16. ‘Thine eyes beheld my shapelessness, etc.’ The embryo, when first conceived in the womb, has no form; and David speaks of God’s having known him when he was yet a shapeless mass, τὸ κύημα, as the Greeks term it; for τὸ εμβρυον is the name given to the fetus from the time of conception to birth inclusive. The argument is from the greater to the less. If he was known to God before he had grown to certain definite shape, much less could he now elude his observation… The other is the more natural meaning, that the different parts of the human body are formed in a succession of time; for in the first germ there is no arrangement of parts, or proportion of members, but it is developed, and takes its peculiar form progressively… that though the members were formed in the course of days, or gradually, none of them had existed; no order or distinctness of parts having been there at first, but a formless substance. And thus our admiration is directed to the providence of God in gradually giving shape and beauty to a confused mass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 139:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

oks Online</a></div>
</figure><figure class="quote" id="q-5b778fc720" data-kw="">
<blockquote><p>…we cannot give an account of the whole process of generation, which consists of conception, formation or the delineation of the several parts, and animation by infusing the soul; but this we know, that it far surpasses all finite power. And without doubt Monsieur Descartes, who was so thinking a philosopher, would never have ascribed this great work to mere mechanism, but that he was unawares betrayed into it by his solving of other things by mechanic principles: So that it would be expected that he should make an uniform piece of philosophy. And thence he was, as it were, forced to go through with his work that he had begun, and to maintain that all is done mechanically, even in the production of man.</p></blockquote>

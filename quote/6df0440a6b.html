<main class="wrap"><figure class="quote" id="q-6df0440a6b" data-kw="">
<blockquote><p>And where greater unity is most desirable, it must first be considered how much of it is possible, or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world. … It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>

3. My engagement to endeavors of reformation does also engage me against schism.</p></blockquote>

<blockquote><p>We have no new calves, new altars, new feasts, but profess, and really do hazard life and estate to put away the Prelate’s calves, images, tree-worship, altar-worship, saints, feast-days, idolatry, masses; and nothing is said here but Jesuits, and Canaanites, and Baalites, might say (though falsely) against the reformation of Josiah. Truth and purity of worship this year is new in relation to idolatry last year, but it is simpliciter older.</p></blockquote>

</figure><figure class="quote" id="q-25c214506e" data-kw="">
<blockquote><p>There is a great difference between inimical segregation, like sedition in a commonwealth; and a going severally upon weighty reasons and without breach of charity. And among other weighty reasons [for this,] this may be one: That all Christians of sound faith and good life, that are dissatisfied about some human injunctions and orders in a Church, may not for lack of tender regard towards them be utterly abandoned and exposed to be led aside into the errors of the wicked, as to heresy, apostasy or a course of irreligion. It is in the power of rulers to grant this indulgence to such dissenters, when it is not in the power of dissenters to change their judgments. And this is not to set up Church against Church, or according to an ancient manner of speaking, altar against altar, but only either occasional and temporary assemblies, or at the most but diverse churches distinguished by their several places of assembling, as one parish-church from another; and by diversity of external order, as the allowed congregations of foreigners in London from the parish churches. The same true religion for the substance thereof, is exercised; and the same holy ends are pursued in the one and the other. And there will be no opposition between them but what an unchristian enmity, proceeding from worldly lusts and interests, will produce. … After such [a] Comprehension [be] setled, the toleration of all tolerable dissenters within such limits as will secure public peace and safety, is more agreeable to the wisdom and clemency of rulers, and the charity of Christians, than the rigorous constraining of the said dissenters to what they cannot bear and the restraining of them from the liberty of serving God according to their consciences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683) | A Defense of my Endeavors for the Work of the Ministry, pp. 26-27</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There is a great difference between inimical segregation, like sedition in a commonwealth; and a going severally upon weighty reasons and without breach of charity. And among other weighty reasons [for this,] this may be one: That all Christians of sound faith and good life, that are dissatisfied about some human injunctions and orders in a Church, may not for lack of tender regard towards them be utterly abandoned and exposed to be led aside into the errors of the wicked, as to heresy, apostasy or a course of irreligion. It is in the power of rulers to grant this indulgence to such dissenters, when it is not in the power of dissenters to change their judgments. And this is not to set up Church against Church, or according to an ancient manner of speaking, altar against altar, but only either occasional and temporary assemblies, or at the most but diverse churches distinguished by their several places of assembling, as one parish-church from another; and by diversity of external order, as the allowed congregations of foreigners in London from the parish churches. The same true religion for the substance thereof, is exercised; and the same holy ends are pursued in the one and the other. And there will be no opposition between them but what an unchristian enmity, proceeding from worldly lusts and interests, will produce. … After such [a] Comprehension [be] setled, the toleration of all tolerable dissenters within such limits as will secure public peace and safety, is more agreeable to the wisdom and clemency of rulers, and the charity of Christians, than the rigorous constraining of the said dissenters to what they cannot bear and the restraining of them from the liberty of serving God according to their consciences.”

— John Corbet, The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683) | A Defense of my Endeavors for the Work of the Ministry, pp. 26-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+great+difference+between+inimical+segregation%2C+like+sedition+in+a+commonwealth%3B+and+a+going+severally+upon+weighty+reasons+and+without+breach+of+charity.+And+among+other+weighty+reasons+%5Bfor+this%2C%5D+this+may+be+one%3A+That+all+Christians+of+sound+faith+and+good+life%2C+that+are+dissatisfied+about+some+human+injunctions+and+orders+in+a+Church%2C+may+not+for+lack+of+tender+regard+towards+them+be+utterly+abandoned+and+exposed+to+be+led+aside+into+the+errors+of+the+wicked%2C+as+to+heresy%2C+apostasy+or+a+course+of+irreligion.+It+is+in+the+power+of+rulers+to+grant+this+indulgence+to+such+dissenters%2C+when+it+is+not+in+the+power+of+dissenters+to+change+their+judgments.+And+this+is+not+to+set+up+Church+against+Church%2C+or+according+to+an+ancient+manner+of+speaking%2C+altar+against+altar%2C+but+only+either+occasional+and+temporary+assemblies%2C+or+at+the+most+but+diverse+churches+distinguished+by+their+several+places+of+assembling%2C+as+one+parish-church+from+another%3B+and+by+diversity+of+external+order%2C+as+the+allowed+congregations+of+foreigners+in+London+from+the+parish+churches.+The+same+true+religion+for+the+substance+thereof%2C+is+exercised%3B+and+the+same+holy+ends+are+pursued+in+the+one+and+the+other.+And+there+will+be+no+opposition+between+them+but+what+an+unchristian+enmity%2C+proceeding+from+worldly+lusts+and+interests%2C+will+produce.+%E2%80%A6+After+such+%5Ba%5D+Comprehension+%5Bbe%5D+setled%2C+the+toleration+of+all+tolerable+dissenters+within+such+limits+as+will+secure+public+peace+and+safety%2C+is+more+agreeable+to+the+wisdom+and+clemency+of+rulers%2C+and+the+charity+of+Christians%2C+than+the+rigorous+constraining+of+the+said+dissenters+to+what+they+cannot+bear+and+the+restraining+of+them+from+the+liberty+of+serving+God+according+to+their+consciences.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+The+Nonconformist%E2%80%99s+Plea+for+Lay-Communion+with+the+Church+of+England%2C+together+with+a+Modest+Defense+of+Ministerial+Nonconformity...+%28London%3A+1683%29+%7C+A+Defense+of+my+Endeavors+for+the+Work+of+the+Ministry%2C+pp.+26-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F25c214506e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/25c214506e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-reformation/#:~:text=There%20is%20a%20great%20difference%20between,serving%20God%20according%20to%20their%20consciences&amp;text=There%20is%20a%20great%20difference%20between%20inimical%20segregation&amp;text=liberty%20of%20serving%20God%20according%20to%20their%20consciences" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

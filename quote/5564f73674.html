<main class="wrap"><figure class="quote" id="q-5564f73674" data-kw="">
<blockquote><p>Moreover, grace perfects nature and does not annul it (ibid., I, qu. 1, art. 8, ad 2). Grace presupposes nature (ibid., qu. 2, art. 2, ad 1) and perfects nature according to the proper mode of that nature (ibid., qu. 62, art. 5, a). Just as grace presupposes nature and perfects it, divine law presupposes and perfects natural law (ibid., I-II, qu. 90, art. 2, ad 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/germain-grisez.html">Germain Grisez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dualism &amp; the New Morality’ (1977)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d7eb092a8b" data-kw="">
<blockquote><p>Whatever is committed against right reason, the same is committed against God and divine law (Rom. 2:12, 14–15), insofar as the law of God made known through nature is identical with the law which is published by a living voice or writing, for which reason the law of nature once obligated our first parents to obedience in the state of integrity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’, section 23</cite>, p. 510</span></figcaption>

</figure><figure class="quote" id="q-0c1508adb3" data-kw="">
<blockquote><p>9. It seems to threaten a snare when inquiry about the duty of the time is pursued without respect to the present case and circumstances thereof. For thus a snare may wait in a thing at other times indifferent, the neglect whereof under some special circumstances may be a quitting their duty; and the doing also, or yielding to something in another case warrantable, at sometimes may fall under a moral prohibition. As this, when a thing in itself indifferent, circa sacra et cultum Dei [around sacred things and the worship of God], is pressed by the magistrate as necessary by virtue of his sole command, and to the subjecting the godly in things wherein they are not subject, and to the prejudice of an other jurisdiction; can there be an inquiry about this in the general, without a particular application to the complex case? It may be said a snare is then on the entry when that consideration of the prophet is not much regarded in the present question, ‘Is this a time for such a thing?’ For the disciples to refresh themselves with sleep was a piece of innocent duty; but that they could not watch this one hour with their Master in his sufferings, must needs vary the case, for it was in so far a deserting Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-fleming.html">Robert Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fulfilling of the Scripture… (Boston, 1743), Appendix</cite>, pp. 508-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-42eb1b733f" data-kw="">
<blockquote><p>And as touching the binding power of their [magistrates’] laws, be they never so just, they cannot bind you any other way, nor [except] in respect of the general end of them: For per se they cannot bind more than the Churches’ laws can. Which things Dr. Forbes also has told you out of Calvin [Irenicum, bk. 2, ch. 4, §3]. And hence it follows, that whensoever you may omit that which princes enjoin, without violating the law of charity, you are not holden to obey them, [even] for the majesty of princely authority. … whatsoever princes can commendably either do by themselves, or command to be done by others in such matters as anyway pertain to the external worship of God, must be both lawful in the nature of it, and expedient in the use of it, which conditions if they be wanting [lacking], their commandments cannot bind to obedience. … 3. We are bound by the Law of God to do nothing which is not good and profitable or edifying, 1 Cor. 6:12 &amp; 14:26. This Law of Charity is of a higher and straighter bound than the Law of any prince in the world… Therefore it is most necessary as well for princes to permit, as for subjects to take liberty to try and examine by the judgement of discretion, everything which authority enjoins whether it be agreeable or repugnant to the rules of the Word, and if after trial it be found repugnant to abstain from the doing of the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies… (1637), pt. 3</cite>, ch. 8, pp. 133-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-85005d587a" data-kw="">
<blockquote><p>VIII. Human Law is that which, from principles known by nature and experience, prescribes, sanctions, and commands to be observed certain particular conclusions and determinations, useful, honest, and necessary for the public and private good both of Church and Commonwealth, according to the reason and convenience of persons, things, times, places, and other circumstances: which laws, if they conflict with divine or natural right, are unworthy of the name of law, and in no way obligate the conscience of those who are subject either to observance or to punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’ (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

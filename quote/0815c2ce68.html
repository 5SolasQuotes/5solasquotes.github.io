<blockquote><p>Touching the first, the soul-trouble of Christ, we are to consider: 1st Position. This holy soul thus troubled, was like the earth before the Fall, out of which grew roses without thorns, or thistles, before it was cursed. Christ’s anger, his sorrow, were flowers that smelled of heaven, and not of sin: All his affections of fear, sorrow, sadness, hope, joy, love, desire, were like a fountain of liquid and melted silver; of which the banks, the head-spring, are all as clear from dross as pure crystal: such a fountain can cast out no clay, no mud, no dirt. When his affections did rise and swell in their acts, every drop of the fountain was sinless, perfumed and adorned with grace; so as the more you stir or trouble a well of rose-water, or some precious liquor, the more sweet a smell it casts out: Or, as when a summer soft wind blows on a field of sweet roses, it diffuses precious and delicious smells through the air. There is such mud and dregs in the bottom and banks of our affections, that when our anger, sorrow, sadness, fear, does arise in their acts, our fountain casts out sin. We cannot love, but we lust; nor fear, but we despair; nor rejoice, but we are wanton and vain and gaudy; nor believe… O that Christ would plant some of his flowers in our soul, and bless the soil, that they might grow kindly there, being warmed and nourished with his grace: If grace be within, in sad pressures it comes out… … 3rd Position. Undeniably, grace did so accompany nature, that he could not fear more than the object required. Had all the strength of men and angels been massed and contemperated in one, they should have been in a higher measure troubled than Christ was: So how much trouble was in Christ’s affections, as much there was of reason, perfumed and lustered with grace… So neither were his affections above banks; he saw the blackest and darkest hour that ever any saw; suppose all the sufferings of the damned, for eternity, were before them in one sight, or came on them at once, it should annihilate all that are now, or shall be in hell. Christ now saw, or foresaw as great sufferings, and yet: 1. believed, 2. prayed, 3. hoped, 4. was encouraged under it, 5. suffered them to the bottom with all patience, 6. rejoiced in hope, Ps. 16:9. Now our affections rise and swell before reason: 1. They are often imaginary, and are on horse-back and in arms at the stirring of a straw. 2. They want that clearness and serenity of grace that Christ had, through habituall grace following nature from the womb. 3. We can raise our affections, but cannot allay them: as some magicians can raise the Devil, but cannot conjure, or command him: or, some can make war, and cannot create peace… And this extremity of soul-trouble was most rational, coming from the infallible apprehension of the most pressing cause of soul-trouble, that ever living man was under.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: Crooke, 1647)</cite>, pp. 3-6</span></figcaption>

<blockquote><p>Nor was this perfect exemption from violence or injury at the hand of men a mere isolated fact. It was part of the general scheme or of the understood relation to human life occupied by Christ. He was not to dash His foot against a stone (Ps. xci.). Disease in the ordinary course, or as it is commonly contracted, could not touch Him, because He did not come within the power of sin in the world; and hence we never read of His contracting any distemper or disease like other men. Nor could death in any of the thousand forms in which it comes to other men, come to Him, till He consented…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Atonement taught by Christ Himself (Edinburgh: T&amp;T Clark, 1868)</cite>, pp. 130-31</span></figcaption>

<blockquote><p>His profound feeling of dependence on God, for example, is illustrated in every conceivable way, not least strikingly in the constant habit of prayer which the Evangelists ascribe to him. But we are never directly told that he felt this dependence on God or “feared God”, or felt the emotions “of reverence and awe in the divine presence…¹ The narrative brings Jesus before us as acting under the impulse of all the religious emotions; but it does not stop to comment upon the emotions themselves. ¹ Cf. Heb. v. 7: “having been heard for his godly fear ([Greek] Eulabeia)”, i.e. for his reverent and submissive awe,” that religious fear of God and anxiety not to offend Him which manifests itself in voluntary and humble submission to his will” (Delitzsch in loc.). Davidson in loc: “The clause throws emphasis on the Son’s reverent submission.” Humanitarian writers debate whether “fear” of God is to be attributed to Jesus. Wellhausen (Israel, und jud. Geschichte, p. 383, expanded in Skizzen und Vorarbeiten, i. 1884, p. 98) represents him as passing his life in fear of the judge of all: “He feels the reality of God dominating life, he breathes in the fear of the Judge who demands account of every idle word and has power to destroy body and soul in hell.” Similarly Bousset (Jesus, 1904, pp. 54, 99, E. T. pp. 112, 203) speaks of him as learning by his own experience” that God is terrible (furchtbar) and that an awful darkness and dread encircles him even for those who stand nearest to him,” and as “sharing to the bottom of his soul” “the fear of that almighty God who has power to damn body and soul together,” which he “has stamped upon the hearts of his disciples with such marvellous energy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’ (1912)</cite>, pp. 80-81</span></figcaption>

<blockquote><p>Did the Son of God assume human nature into the unity of his person? We affirm against the Socinians. As in the Trinity, the unity of essence does not hinder the persons from being distinct from each other and their properties and operations from being incommunicable, so the union of natures in the person of Christ does not hinder the natures and their properties from remaining distinct and unconfounded.</p></blockquote>

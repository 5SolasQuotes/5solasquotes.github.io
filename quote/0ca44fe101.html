<main class="wrap"><figure class="quote" id="q-0ca44fe101" data-kw="">
<blockquote><p>Paul says that all Scripture is inspired by God (πᾶσαν γραφὴν esse θεόπνευστον), and useful for teaching, reproof, correction, and training in righteousness, that the man of God may be complete, equipped for every good work (II Tim. 3:16–17). Here lie a number of arguments for the perfection of Scripture. First that the sacred writings can instruct for salvation (v. 15). Who would ask for more than that we be made capable of salvation? Second, it is useful for all purposes, theoretical and practical: for teaching faith, and for guiding conduct. Third, it can make the man of God complete for every good work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8141366f7a" data-kw="">
<blockquote><p>Likewise we reject human traditions, even if they be adorned with high-sounding titles, as though they were divine and apostolical, delivered to the Church by the living voice of the apostles, and, as it were, through the hands of apostolical men to succeeding bishops which, when compared with the Scriptures, disagree with them; and by their disagreement show that they are not Apostolic at all. … it would be wicked to assert that the apostles by a living voice delivered anything contrary to their writings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-4385f208ce" data-kw="Sufficiency">
<blockquote><p>Scripture is not only one of those means which relate to salvation, but the entire and sole medium, the perfect and complete medium, because it produces a perfect faith. For that faith which brings salvation is perfect; and consequently the medium whereby that faith is produced is also perfect.</p></blockquote>

— William Whitaker, A Disputation on Holy Scripture, Question 6, ch. 14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CScripture+is+not+only+one+of+those+means+which+relate+to+salvation%2C+but+the+entire+and+sole+medium%2C+the+perfect+and+complete+medium%2C+because+it+produces+a+perfect+faith.+For+that+faith+which+brings+salvation+is+perfect%3B+and+consequently+the+medium+whereby+that+faith+is+produced+is+also+perfect.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+Question+6%2C+ch.+14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4385f208ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4385f208ce.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-56392f2102" data-kw="">
<blockquote><p>The question therefore comes to this: does Scripture contain perfectly, not absolutely everything, but whatever is necessary for salvation, not explicitly and in exact words, but with equal force [to explicit statement] or by valid conclusion (aequipollenter vel per legitimam consequentiam), so that there is no need to resort to any unwritten word; or, is Scripture a full and sufficient rule of faith and conduct, not merely a partial and inadequate one? We uphold the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.9</span></figcaption>

</figure><figure class="quote" id="q-0df9e898c7" data-kw="">
<blockquote><p>I must turn to the Word of God. In questions of this kind it matters nothing what the world thinks right or wrong. There is only one sure test of truth. What says the Scripture? What is written in the Bible? What is the mind of the Holy Spirit? If we cannot submit our judgments to this infallible umpire, it is useless to pretend that we have any religion at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, ch. on The Heart, p. 322</span></figcaption>

<main class="wrap"><figure class="quote" id="q-41d3a725ae" data-kw="">
<blockquote><p>Reason 2. They that consenting with others in the doctrine of salvation by Christ, do nevertheless separate themselves from them as touching spiritual communion, are schismatics (1 Cor. 1:10-11; Jud. 19)… They that without just cause, renounce all spiritual communion in public with a true Church, are schismatics… The Church of England is a true Church of God… The Gospel of our saluation is the word of truth. The Church of England upholds as a pillar, the Gospel of our salvation. Therefore it upholds the word of truth, and by consequence it is a true Church. Let them not here stand to show a difference between the Church of England and Ephesus. There may be a difference between true Churches: notwithstanding they are all true that maintain the word of truth, the Gospel. … If they are to be accounted true teachers, who keep this foundation (Christ is come in the flesh) and build not upon it any doctrine overthrowing the same, then a Church, as that now of England, is to be held for a true Church, which retains this foundation of the Christian Faith and builds not upon it any doctrines overthrowing the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gilgate.html">William Gilgate</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Reasons, proving the Separation, commonly called Brownists, to be Schismatics</cite>, (London: Stansby, 1621), n.p. Gilgate was an English minister.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc73da6e14" data-kw="">

</figure><figure class="quote" id="q-d56418230e" data-kw="">
<blockquote><p>But you will say: ‘England is not a true Church, and therefore you separate; adhere to the true Church.’ I answer: Our Church is easily proved to be a true Church of Christ: First, because it has all the essentials necessary to the constitution of a true Church: as sound preaching of the gospel, right dispensation of the sacraments, prayer religiously performed, and evil persons justly punished (though not in that measure as some criminals and malefactors deserve); and therefore a true Church. … But I hear you reply: ‘Our Church is corrupted with ceremonies and pestered with profane persons. What then?’ Must we therefore separate for ceremonies, which many think may be lawfully used? But admit they be evils, must we make a rent in the Church for ceremonious rites, for circumstantial evils? That were a remedy worse than the disease. Besides, had not all the true Churches of Christ their blemishes and deformities, as you may see in the seven Asian Churches (Rev. 2–3)? And though you may find some Churches beyond sea free from ceremonies, yet notwithstanding they are more corrupt in preachers (which is the main), as in profanation of the Lord’s Day, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consolatory Letter to an Afflicted Conscience</cite>, … (London: Coules, 1641), pp. 4-5</span></figcaption>

<blockquote><p>38. Although therefore in some assembly, either in doctrine, or in the administration of the sacraments, the worship of God, and morals, some vice may creep in, nevertheless the assembly does not cease to be in the Church of God, as long as it retains the foundation, which is Christ. Just as Paul does not take away the name of the Church of God from the Corinthians and Galatians, even though false doctrines had begun to be spread among them, and some lived dissolutely. Nor is the Church to be denied immediately because of the neglect or cessation of ecclesiastical discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, tr. ChatGPT-4 (Hanau, 1609-1610), bk. 7, Church &amp; its Government, p. 309</span></figcaption>

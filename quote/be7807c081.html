<main class="wrap"><figure class="quote" id="q-be7807c081" data-kw="">
<blockquote><p>It is very much abused, if it be offered to any such thing as that we must come out from among the ministers, and be separated from them, for: 1. This separation here commanded is from infidels, unrighteousness, darkness, Belial, idols. The Corinthians did very ill in eating and sitting at the idols’ tables of the gentiles, which gave great offense to the weak, 1 Cor. 10:17, 20. 2. This was not a separation from the Church of Corinth, nor from the ministers thereof; though there were many corruptions entertained among them, yet they were to have communion in public ordinances, as is proved above: Only it is a separation from the idolatry in it. There may be a separation from the corruptions of a Church, very well consistent with abiding in the communion of that Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6328f0a56" data-kw="">
<blockquote><p>…[After Bothwell in 1679] [Donald] Cargill received an urgent invitation from [Robert] M’Ward and Brown [of Wamphray] in Holland to go over and join them… he determined at once to accept. Apparently, however, there were others included in the invitation and time was pressing, for on receiving the letter Cargill wrote at once to Robert Hamilton, who was now in hiding in Galloway, to come to Edinburgh in all haste to meet him. Hamilton duly arrived, heavily disguised for fear of capture, and Cargill put the proposition to him. Hamilton, who was in daily danger of his life so long as he remained in the country, readily assented; and some time in mid-August he and Cargill appear to have left for Holland together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill (Durham: Evangelical Press, 1988)</cite>, p. 101</span></figcaption>

</figure><figure class="quote" id="q-f9c9c7ceee" data-kw="">
<blockquote><p>A separation, when not upon clear and just ground, is a greater sin before God, and more wounding to the heart of Christ, than either murder or adultery, etc. And whoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>[1.] In order to engage us to this charity, which would issue in an unity of measures, let us consider what melancholy consequences may ensue upon our divisions, if they be not happily removed. ‘Tis notour, they have been fatal to all societies, have tumbled down flourishing monarchies, and laid magnificent cities into ashes; they have rent Churches into pieces, and knocked religion on the head. 2. The enemies of our Zion, whose projects have been baffled of Heaven, and their counsels infatuated of God, will have this piece of satisfaction left them, to rejoice when they see us disagree among ourselves, and be pleased with the agreeable thoughts that we are about to accomplish ourselves what they designed for us.</p></blockquote>

</figure><figure class="quote" id="q-7249d18b63" data-kw="">
<blockquote><p>After the defeat at Bothwell, he avoided the consequences of his attainder and condemnation by an escape into Holland. There, in Geneva and the Palatinate, he endeavoured to excite the sympathy of foreign protestants with the sufferings of their Scottish brethren; and along with his brother-in-law, Gordon of Earlston, he acted as commissioner in behalf of the united societies, whom he greatly assisted by his influence in obtaining for them the countenance and support of the continental churches. He continued to reside principally in Holland, although the English government, apprised of his intention of returning with arms and money to the assistance of his persecuted countrymen, repeatedly urged upon the States an application for his delivery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3</cite>, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

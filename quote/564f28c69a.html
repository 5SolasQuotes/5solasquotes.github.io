<blockquote><p>She [Wisdom] is studious of ecclesiastical peace: to that end she knows how to distinguish between substantials and ceremonials; nor dares she rent Christ’s seameless coat because the fringe is not every way complete. Between fundamentals and circumstantials, matters Fidei Catholicae, et scientiae theologicae [of the catholic Faith and between theological wisdom], necessary to be believed, and problematically disputed, allowing a latitude of opinion in some things, to those who hold the foundation; in a word, she abhors, as to injure the truth of Christ by error, so to disturb the peace of the Church by schism.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f4649e9c9" data-kw="">
<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

</figure><figure class="quote" id="q-74e165a50d" data-kw="">
<blockquote><p>And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.”

— John Currie, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 3, Where some things are instanced, which, though just ground for fasting, mourning and lamentation, yet are not sufficient causes of separation from a Church of Christ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+1st%2C+albeit+there+be+errors%2C+and+errors+of+a+heinous+nature+among+some+in+a+Church%2C+this+is+not+sufficient+ground+of+separation+from+that+Church%2C+nay%2C+not+though+these+errors+should+remain+uncensured.+For%2C+as+was+noticed+above%2C+there+were+some+in+the+Church+of+Corinth+who+had+drunk+in+this+gross+error%2C+%E2%80%9CThat+there+is+no+resurrection+of+the+body%3B%E2%80%9D+hence+the+apostle+asks%2C+%E2%80%9CHow+say+some+among+you%2C+there+is+no+resurrection+of+the+dead%3F%E2%80%9D+%281+Cor.+15%3A12%29+The+interrogation+plainly+intimates+there+were+some+among+them+who+denied+that+great+and+fundamental+doctrine+of+the+Christian+religion%3B+and+yet+this+Church+of+Corinth+was+a+true+Church+of+Christ%2C+from+which+it+was+not+lawful+to+separate.+So%2C+in+the+Church+of+Pergamos%2C+there+were+some+uncensured+who+held+the+doctrine+of+Balaam%2C+and+the+doctrine+of+the+Nicolaitans%3B+and+yet+she+was+a+true+Church+of+Christ%2C+right+and+approven+in+the+main.+So%2C+in+the+Church+of+Thyatira%2C+%E2%80%9Cthat+wicked+woman%E2%80%9D+Jezebel+was+tolerated+without+being+censured%2C+though+she+taught+the+Lord%E2%80%99s+servants+to+commit+heinous+iniquity.+So%2C+though+there+should+be+sundry+persons+leavened+with+gross+errors+in+the+Church+of+Scotland+at+this+day%2C+this+is+no+sufficient+ground+for+a+secession+or+separation+from+her.+I+own+it+is+a+sin%2C+and+I+think+a+very+heinous+sin+in+any+Church%2C+to+wink+at+errors%2C+or+not+to+censure+for%2C+and+be+zealous+against+them%2C+especially+if+of+a+heinous+nature%2C+as+are+some+of+these+wherewith+some+among+us+have+been+charged%E2%80%A6+%E2%80%A6+And+as+%5BJohn%5D+Owen+justly+%28Exposition%2C+p.+174%29+observes%2C+%E2%80%9CThere+may+be+a+fundamental+error+in+a+true+Church+for+a+season%2C+where+the+Church+errs+not+fundamentally%2C%E2%80%9D+citing+for+proof+of+this%2C+1+Cor.+15%3B+2+Tim.+2%3A18.%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland%2C+in+which+the+Chief+Things+in+the+Testimonies+of+these+Reverend+Brethren+who+lately+made+a+Secession+from+her+are+considered+%26+shown+to+be+no+Ground+of+Separation+or+Secession+%281738%29+%7C+ch.+3%2C+Where+some+things+are+instanced%2C+which%2C+though+just+ground+for+fasting%2C+mourning+and+lamentation%2C+yet+are+not+sufficient+causes+of+separation+from+a+Church+of+Christ&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74e165a50d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74e165a50d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=And%201st%2C%20albeit%20there%20be%20errors,1%20Cor.%2015%3B%202%20Tim.%202%3A18&amp;text=And%201st%2C%20albeit%20there%20be%20errors%2C%20and%20errors&amp;text=of%20this%2C%201%20Cor.%2015%3B%202%20Tim.%202%3A18" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§34. II. So much for what is necessary to the being of the sacred office: Now what is necessary to the well-being. And indeed, though the essential unity of the Church lie not upon this, yet the peace and concord of it does, and that so much as that no other means without this will attain it: And the want of what is necessary ad bene esse in the ministry and bishops [or ministers], is it that has caused the common calamities. §35. And I. Nothing is more wanting hereto than better qualifications in the persons: 1. That there be a strong wit, and good acquired gifts of knowledge, and a strong and lively faith from divine illumination, and good acquaintance with the oracles of God: A pastor or teacher should not only know the essentials of Christianity, which every Christian knows, but also the integrals [things that complete the whole of Christianity] and many accidents. And both essentials and integrals should be known by him by a more clear, distinct and orderly understanding, not only above the vulgus fidelium, (common Christians) but above the better sort of the flock. And some store of natural and common knowledge called learning is needful hereunto: But especially more illumination, faith and holy wisdom and skilfulness in matter, sense and method of the Word of God.</p></blockquote>

<blockquote><p>If he [the opponent] judge the terms of our communion lawful [in the Church of Scotland], then he must either join and keep communion with us, or maintain that a Church, the terms of whose communion are lawful, or, to keep to our these [thesis], in which there are no sinful terms of communion imposed, is yet to be separated from. This is a new tenet, never known before among men that called themselves presbyterians. I think they had reason, who, when these [separatist] men began to call themselves ‘the true presbyterians of the Chuch of Scotland’ [after the Glorious Revolution of 1689], they called them ‘the new presbyterians’.</p></blockquote>

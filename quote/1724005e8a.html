<main class="wrap"><figure class="quote" id="q-1724005e8a" data-kw="">
<blockquote><p>The devil is a bewitcher who deceives and ensnares the minds of people by his spells and delusions, which seem to shine with what is right and good, so that they will accept false doctrine in the place of sound teaching, false worship instead of true worship, wrong interpretations of words instead of true ones, false ways of justification for true ones. False teachers are also bewitchers who under the guidance of Satan and the pretext and appearance of true godliness deceive and ensnare the minds of people in the same way. False doctrine is bewitching doctrine, which appears in the guise of the truth, and so on.

Faced with these bewitching and subtle deceptions stirred up by the tricks of the devil, we need the greatest Christian wisdom, because otherwise it is very easy to be misled by them. Just look at the papacy, which has arisen by means of such bewitching and subtle deceptions and has now spread all over the place. Moreover, since the devil and false teachers operate by means of enchantments and delusions under the guise and appearance of true godliness, nothing could be easier than to be led astray by them. Heretics always use the Bible and Scripture to deceive people by distorting the true meaning, understanding and judgment of spiritual things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f63f38128e" data-kw="">
<blockquote><p>4. As in serious prayer, specially in secret, the affections of the heart do utter themselves in the answerable gestures of the body, as well as in the voice and words of the mouth: so those gestures have their own speech unto God, no less than the words of the mouth have; as here, ‘I have stretched out my hands unto Thee,’ is brought forth to express his submissive rendering up of himself unto God and his dependance upon him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London, 1653), on Ps., 88:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-17c8f5d1fa" data-kw="">
<blockquote><p>If truly the consequence is made good only by the will of governors, then this consequence will be valid: All such things are orderly and decent; therefore, let the calf of Aaron be made and openly worshiped, for worship in such a visible way is by [the will of] the governors. A good consequence is one which stands indivisible: then it is a good consequence or not a good consequence. This consequence, however, where the truth has been mixed, depending partly on reason and partly on the will of men, is nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. Charles Johnson &amp; Travis Fentiman (1638-1642; 1668; RBO, 2019), ch. 1, section 17, p. 48</span></figcaption>

</figure><figure class="quote" id="q-d7404b9526" data-kw="">
<blockquote><p>Teaching and admonishing one another in Psalmes, and Hymnes, and spiritual Songs] See Ephes. 5.19. In both which places, as the Apostle exhorteh us to singing, so he instructeth what the matter of our Song should be, viz. Psalms, Hymns, and spiritual Songs. Those three are the Titles of the Songs of David, as they are delivered to us by the Holy Ghost himself; some of them are called Mizmorim Psalmes; some Tehillim Hymns; some Shirim Songs, Spiritual Songs.</p></blockquote>

</figure><figure class="quote" id="q-544f7ad273" data-kw="">
<blockquote><p>But as touching these ceremonies in question, we are upon evident grounds persuaded in our consciences that they are both unlawful and inexpedient for our Church: and though they were lawful in themselves, yet we may answer as the oppugners of the Interim [1548] replied to those who urged yielding to the ceremonies of the same (Friedrich Balduin [a Lutheran], On Cases of Conscience, bk. 4, ch. 11, case 3), surplice, holy days, tapers [candles], etc. because of the emperor’s commandment. That the question is not about things indifferent, but about a main article of faith, namely Christian Liberty, which admits not any yoke to be imposed upon the conscience, no not in things indifferent.</p></blockquote>

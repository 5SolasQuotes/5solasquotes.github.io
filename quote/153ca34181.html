<blockquote><p>Doct. 4. The other part of our duty on the Lord’s day, is to sanctify this our rest; that is, to apply the leisure that we have, to God’s worship, as well publicly as privately.

Duties of this kind are first, a preparing of our minds to God’s solemn worship. Secondly, Hearing of his Word. Thirdly, Solemn prayers. Fourthly, Partaking of the Sacraments. Fifthly, Works of Charity. Sixthly, Meditation and conference about holy things. Seventhly, A religious considering of the works of God, of Creation and Providence, and even of such as occasionally we then hear or see, though they be otherways worldly.

Reas. 1. Because in such duties, we make profession of Religion, and of that honour, that is due unto God; which therefore is to him honourable, and accepted.

Reas. 2. Because by this means, we build up our selves, and advance our communion that we have with God: For seeing that by worldly occupations through the six days of the week, our mind is somewhat pressed towards the earth, it was by a most wise purpose and counsel of God ordained, that every seventh day at least again they should be lifted up to heaven, and sent up thitherwards by all such means, that they might be restored to their former step or degree, from which they had been declining:

And seeing we contract also some filthiness from such worldly businesses, on the Lord’s day they should be wiped off, and we cleansed from them by the exercises of sanctification. And seeing many occasions fall on the other days, which bring their own difficulties and tentations with them; on this day we ought to be well furnished and armed, so that it ought to be our day of spiritual mustering or weapon showing; and a day of lustration. A cleansing our selves from all filthinesses before contracted; and a day of our ascending into heaven, in as far as our Faith and Charity, with other heavenly gifts, on this day should be singularly kindled in our hearts.

Reas. 3. Because by this means also we build up one another in the practise of our Religion, so that he who hears the preaching of the word, though he learn nothing himself, yet he teaches others some good thing, even in this, that he hears, and thereby presses that he both should do so and other too: So hereby he teaches others, that God is to be solemnly worshipped, and his word with reverence to be heard.

Use 1. Is of Admonition, that we beware of the neglect of these duties, which can not consist with any vigour either of religion to God, or of love and care of our own salvation: Or lastly, of love and Christian affection towards the Church, and our neighbours.

Use 2. Is of Direction, that according to this rule we judge of the duties, which on this day we perform about God’s worship: For all of them in common should rise up so high as to a sanctifying of this day; and this sanctifying again of the day, depends on our sanctifying of the name of God, and our advancing of our own salvation: Unless therefore we seek such fruits in our consciences, we have therein just cause of great humiliation; but if we feel them in any degree, we have as great reason to give the Lord as great thanks for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XXXVIII, pp 233-35.</span></figcaption>

<blockquote><p>First of all, doth not the impious profanation of the Sabbath impropriate from God that which he hath ever reserved to himself, without any redemption by appropriating it to unnecessary journeys, hellish and lascivious revellings, wicked sports, and recreations? hath not God inhibited it peremptorily, above a hundred times in express Scripture? hath he not annexed a combination of public vengeance for it, Amos, 8. even to set fire on the Gates of our chief City therefore? Jerem. 17. Hath not this of late troubled most of the Lord’s Hosts, made the hearts of the Elders melt like Water, slaughtered more then twice thirty-six, in respect of their livelihood, and calling? who then can doubt that a profaner of the Sabbath is an Achan and troubler of Israel?</p></blockquote>

<blockquote><p>In 1 Corinthians 11:3-15, Paul writes that if a woman is to be so immodest as to wear her hair uncovered while praying or prophesying in a Christian assembly she might as well shave her head. Paul instructs the Corinthians that it is “one and the same” for a woman to have her head shaved and for her to unveil her hair. There is a large body of works cataloging the modesty standards in Hellenistic Greece but Paul’s reference to head-shaving remains obscure. This thesis looks to find the best explanation of Paul’s instructions. …a popular modern view… that women in ancient Greece with their head shaved were prostitutes… probably temple prostitutes. The evidence does not bear this out as there is no artwork depicting prostitutes, or indeed any women, with their heads shaved. Instead prostitutes are shown in Greek erotic art with both long and short hair, some with and some without head coverings. Literary sources do offer several different examples of women who had their hair cut off… the most probable impetus behind Paul’s writing [that the uncovered woman be shaved] relates to punishments for adultery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/curtis-e-montier.html">Curtis E. Montier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Let Her Be Shorn</cite>, (Univ. of North Texas, 2015) 67 pp. Images (involving orgies) are on, pp. 13-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>To the proposition, ‘What things are done for the glory of God,’ to wit, of themselves; that is, such things as are commanded by God to this special end and purpose, that by those works we might declare our obedience towards Him: they are the worship of God. And not such [things] as serve for the glory of God accidentally, that is, such as do sometimes serve for the performance of those things which are commanded by God for accidental causes and circumstances, which if they concur not, yet God may be honored as well by such as omit them as by those that perform them, so they be omitted or performed of faith, which causes the person to be reconciled unto God and makes the doing or omission of all indifferent actions to agree and stand with the Will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 74-75 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“To the proposition, ‘What things are done for the glory of God,’ to wit, of themselves; that is, such things as are commanded by God to this special end and purpose, that by those works we might declare our obedience towards Him: they are the worship of God. And not such [things] as serve for the glory of God accidentally, that is, such as do sometimes serve for the performance of those things which are commanded by God for accidental causes and circumstances, which if they concur not, yet God may be honored as well by such as omit them as by those that perform them, so they be omitted or performed of faith, which causes the person to be reconciled unto God and makes the doing or omission of all indifferent actions to agree and stand with the Will of God.”

— Gabriel Powel, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 74-75 Powel (baptised 1576–1611) was a Welsh Anglican minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+the+proposition%2C+%E2%80%98What+things+are+done+for+the+glory+of+God%2C%E2%80%99+to+wit%2C+of+themselves%3B+that+is%2C+such+things+as+are+commanded+by+God+to+this+special+end+and+purpose%2C+that+by+those+works+we+might+declare+our+obedience+towards+Him%3A+they+are+the+worship+of+God.+And+not+such+%5Bthings%5D+as+serve+for+the+glory+of+God+accidentally%2C+that+is%2C+such+as+do+sometimes+serve+for+the+performance+of+those+things+which+are+commanded+by+God+for+accidental+causes+and+circumstances%2C+which+if+they+concur+not%2C+yet+God+may+be+honored+as+well+by+such+as+omit+them+as+by+those+that+perform+them%2C+so+they+be+omitted+or+performed+of+faith%2C+which+causes+the+person+to+be+reconciled+unto+God+and+makes+the+doing+or+omission+of+all+indifferent+actions+to+agree+and+stand+with+the+Will+of+God.%E2%80%9D%0A%0A%E2%80%94+Gabriel+Powel%2C+De+adiaphoris%2C+Theological+%26+Scholastical+Positions+concerning+the+Nature+%26+Use+of+Things+Indifferent.+Where+also+is+Methodically+%26+Briefely+Handled%2C+of+Civil+%26+Ecclesiastical+Magistrates%2C+of+Human+Laws%2C+of+Christian+Liberty%2C+of+Scandal+%26+of+the+Worship+of+God%2C+De+adiaphoris%2C+Theological+%26+Scholastical+ <blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them?… …whereas it might bee thought, that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places… …that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 1, ch. 8, ‘That Festival Days take away our Christian Liberty, proved out of the Gospel’, pp. 25-26</span></figcaption>

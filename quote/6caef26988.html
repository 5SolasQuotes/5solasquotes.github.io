<main class="wrap"><figure class="quote" id="q-6caef26988" data-kw="">
<blockquote><p>That God is a simple act is the next thing excepted against and decried, name and thing; in the room whereof, that he is compounded of matter and form, or the like, must be asserted. Those who affirm God to be a simple act do only deny him to be compounded of divers principles, and assert him to be always actually in being, existence, and intent operation. God says of himself that his name Ehejeh, and he is I am, — that is, a simple being, existing in and of itself; and this is that which is intended by the simplicity of the nature of God, and his being a simple act. The Scripture tells us he is eternal, I am, always the same, and so never what he was not ever.

This is decried, and in opposition to it his being compounded, and so obnoxious to dissolution, and his being in potentia, in a disposition and passive capacity to be what he is not, is asserted; for it is only to deny these things that the term “simple” is used, which he condemns and rejects. And this is the second instance that Mr B. gives in the description of his God, by his rejecting the received expressions concerning him who is so: “He is limited, and of us to be comprehended; his essence and being consisting of several principles, whereby he is in a capacity of being what he is not.” Mr [John] B[iddle]., solus habeto; I will not be your rival in the favour of this God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 24 vols, Edinburgh: Banner of Truth, 1966), 12: 70-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39eaecf6b8" data-kw="">
<blockquote><p>1. If you turn not [in conversion], you cannot answer the end [design] of your creation. You must not think God gave you a being and sent you into the world to please yourselves, to satisfy your inordinate and corrupt desires, and to live carelessly and rebelliously against Him. But this you do until you are converted. Did the Lord give you an understanding faculty, and not design that He should be understood and known by you? Did He give you a heart to love and to desire, and not design Himself as the Chief Object of both? Did He give you affections that you should give them away to sin and vanity? Oh, do not cross the end [design] for which you were made any longer lest you cause the Lord to ‘repent and grieve’ at the heart He made you, Gen. 6:6, and so resolve to destroy the workmanship of His own hands…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conversion of a Sinner, Explained and Applied, a sermon on Eze. 33:11</cite>, 1669, in The Puritans on Conversion, reprinted Soli Deo Gloria, 1990, pp. 146</span></figcaption>

</figure><figure class="quote" id="q-2f839aab40" data-kw="">
<blockquote><p>IV. God also, besides his other proprieties, is simple or unmixed, that he can no ways be said to be compounded of many things. No, not of his being and essence.

V. For, although he attribute unto himself many things in the scriptures, as it were many qualities as to be good, just, might etc., yet no quality doth in very deed fall into God. But of what sort soever he is, the same he is in his own simple essence. But by these divers names the infinite perfection of his most simple essence is signified unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, eds Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), Position 2.IV-V, 2: 661.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><figure class="quote" id="q-4f0ad7c7ae" data-kw="">
<blockquote><p>The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny [though the Reformed affirm] the contrast between a universally offered salvation revealed in the voluntas signi [the will of sign, or revealed will] and a secret elective will in the voluntas beneplaciti. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), voluntas Dei, pp. 332-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

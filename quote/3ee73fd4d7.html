<main class="wrap"><figure class="quote" id="q-3ee73fd4d7" data-kw="">
<blockquote><p>A good thing brings forth a bad one, they say, if it is not given at the right time. Accordingly even the study of the best and greatest things are harmful if they are not undertaken at the appropriate time. Therefore our ancestors – when they established the sequence of learning – thought out certain steps like grades, by which the young would be led in order from the lower arts to the higher ones. Now, as if these restraints had been broken, the matter is done without order.

Suddenly, like mushrooms, theologians, lawyers and doctors are brought forth, without dialectics, without knowledge of speaking, without the cradle-bands of natural and moral philosophy. The knowledge of these was once taught to all alike, before they were admitted to the higher disciplines, not only because this makes for very good education, but also because it sharpens the judgement and prepares one for the acquisition of greater things. However, now it is sufficient to take a large felt cap to these most venerable disciplines, and to show great contempt for all humanities teaching.

If the laws and the magistrates do not restrain this temerity, there will soon be no erudition in the state, no teaching of anything. For these theologians, lawyers and doctors who spring forth suddenly, not endowed with any decent teaching, not only allow the other arts to perish, but they cannot preserve their own professions either. And it is not the case that these concerns for the preservation of scholarship are not the business of the magistrates, for they are called gods by the Holy Spirit, so that they would preserve and retain the divine gifts on earth – religion, civil order and all the honourable arts. Because of that responsibility for divine things they bear the solemn title, and the magistrates have no greater and more venerable distinction than that.

Therefore it is appropriate that they keep watch on them, so that the honourable disciplines do not fall into oblivion, the order of learning having been upset. Plato said [Republic IV, 424c] that the state changes if it comes about that the music changes; and this is not said uselessly. But it is much truer that the state changes if studies are changed. And indeed, all changes of the state are of concern to the magistrates. An overturned order of studies brings with it the downfall of the greatest and best things; therefore the magistrates need to be more watchful about this than about anything else. And I do not doubt that one day new laws will be established concerning these things, once the current disorder and commotion of the state have calmed down. May an effortless and easy overturning be granted to them by the favour of God!</p></blockquote>

<blockquote><p>And what further authority, or proceedings purely ecclesiastical, of one, or many sister Churches towards another whole Church, or Churches offending, either the Scriptures do hold forth, or can rationally be put in execution (without the magistrates interposing a power of another nature, unto which we upon his particular cognizance, and examination of such causes, profess ever to submit, and also to be most willing to have recourse unto) for our parts we saw not then, nor do yet see… And if the magistrate’s power (to which we give as much, and (as we think) more, than the principles of the presbyterial government will suffer them to yield) do but assist and back the sentence of other Churches denouncing this non-communion [of Independent churches] against Churches miscarrying, according to the nature of the crime, as they judge meet…</p></blockquote>

<blockquote><p>9. The prime Positive Law of God is the Judicial Law, which God by the ministry of Moses, prescribed to the people of Israel, wherein the Lord was pleased to be the particular Lawgiver and Judge of that people, whom He had chosen from among all nations for a peculiar people to Himself, and to whose inclinations it is befitted. There are not a few who esteem the Judicial Law obliging unto all nations, mainly, because it does not appear in the Gospel, to be abolished as the Ceremonial Laws are, and because of its excellency beyond the laws of heathens, or other men, who might not only err in expediency, rendering their laws unprofitable, but also might make them unjust and inconsistent with the immutable moral Law of Nature; which reasons do sufficiently infer, that in the constitution of human laws, chief respect ought to be had to the Judicial Laws of God, and they assumed where the inclination of the people and their condition do not render them inconvenient. But that these laws were accommodat[ed] unto the Jews proper temper, is evident in the law concerning the bill of divorcement [Dt. 24:1-4], which bears, to be permitted for the hardness of their hearts; which was natural and peculiar to them, of jealousy and bitterness against their wives, therefore the Lord not only appointed trial, neither natural, necessary, nor accustomed elsewhere, by those tokens of virginity, for evidencing the wife’s unfaithfulness in not giving a polluted woman for a chaste [Dt. 22:14-20], but also the extraordinary and miraculous trial, by the water of jealousy [Num. 5:12-31], and therefore Christ did expressly abrogate that law [Mt. 5:31-32] and show us that Moses did not command to divorce, but for the hardness of their hearts only permitted it, and did command that when the husband would put away his wife, he should give her a bill of divorce, but it does not follow that the Judicial Law is in itself a Law to all nations, or that the Lord purposed it so to her, but on the contrair, it appears that his purpose was only to deliver it, for a peculiar Law to Israel, when He says, ‘What nation is so great that has statutes and judgments so righteous, as is all this Law, which I set before you this day,’ Dt. 4:8. And again ‘He shows his Word unto Jacob, his statutes and judgments to Israel, He has not dealt so with every nation, and as for his Judgments, they have not known them.’ Ps. 147:19 And therefore the same Law was not to Israelites and to strangers, even to proselytes; as appears in the matter of usury and bondage, which were allowed to strangers, but the former simply forbidden, and the latter limited as to Israelites: Neither is there any necessity of an express abolition of this Law in the Gospel, seeing it was not given to all nations; and it does yet bind the Jews so far as it does not build upon the Ceremonial Law: And therefore that part of the Judicial Law, which is founded upon, or conducible to the Moral Law may be well received by other nations, to whose inclination the same expediences will agree as most of the criminal laws are…</p></blockquote>

at the Lord purposed it so to her, but on the contrair, it appears that his purpose was only to deliver it, for a peculiar Law to Israel, when He says, ‘What nation is so great that has statutes and judgments so righteous, as is all this Law, which I set before you this day,’ Dt. 4:8. And again ‘He shows his Word unto Jacob, his statutes and judgments to Israel, He has not dealt so with every nation, and as for his Judgments, they have not known them.’ Ps. 147:19 And therefore the same Law was not to Israelites and to strangers, even to proselytes; as appears in the matter of usury and bondage, which were allowed to strangers, but the former simply forbidden, and the latter limited as to Israelites: Neither is there any necessity of an express abolition of this Law in the Gospel, seeing it was not given to all nations; and it does yet bind the Jews so far as it does not build upon the Ceremonial Law: And therefore that part of the Judicial Law, which is founded upon, or conducible to the Moral Law may be well received by other nations, to whose inclination the same expediences will agree as most of the criminal laws are…”

— James Dalrymple, The Institutions of the Law of Scotland, vol. 1, p. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C9.+The+prime+Positive+Law+of+God+is+the+Judicial+Law%2C+which+God+by+the+ministry+of+Moses%2C+prescribed+to+the+people+of+Israel%2C+wherein+the+Lord+was+pleased+to+be+the+particular+Lawgiver+and+Judge+of+that+people%2C+whom+He+had+chosen+from+among+all+nations+for+a+peculiar+people+to+Himself%2C+and+to+whose+inclinations+it+is+befitted.+There+are+not+a+few+who+esteem+the+Judicial+Law+obliging+unto+all+nations%2C+mainly%2C+because+it+does+not+appear+in+the+Gospel%2C+to+be+abolished+as+the+Ceremonial+Laws+are%2C+and+because+of+its+excellency+beyond+the+laws+of+heathens%2C+or+other+men%2C+who+might+not+only+err+in+expediency%2C+rendering+their+laws+unprofitable%2C+but+also+might+make+them+unjust+and+inconsistent+with+the+immutable+moral+Law+of+Nature%3B+which+reasons+do+sufficiently+infer%2C+that+in+the+constitution+of+human+laws%2C+chief+respect+ought+to+be+had+to+the+Judicial+Laws+of+God%2C+and+they+assumed+where+the+inclination+of+the+people+and+their+condition+do+not+render+them+inconvenient.+But+that+these+laws+were+accommodat%5Bed%5D+unto+the+Jews+proper+temper%2C+is+evident+in+the+law+concerning+the+bill+of+divorcement+%5BDt.+24%3A1-4%5D%2C+which+bears%2C+to+be+permitted+for+the+hardness+of+their+hearts%3B+which+was+natural+and+peculiar+to+them%2C+of+jealousy+and+bitterness+against+their+wives%2C+therefore+the+Lord+not+only+appointed+trial%2C+neither+natural%2C+necessary%2C+nor+accustomed+elsewhere%2C+by+those+tokens+of+virginity%2C+for+evidencing+the+wife%E2%80%99s+unfaithfulness+in+not+giving+a+polluted+woman+for+a+chaste+%5BDt.+22%3A14-20%5D%2C+but+also+the+extraordinary+and+miraculous+trial%2C+by+the+water+of+jealousy+%5BNum.+5%3A12-31%5D%2C+and+therefore+Christ+did+expressly+abrogate+that+law+%5BMt.+5%3A31-32%5D+and+show+us+that+Moses+did+not+command+to+divorce%2C+but+for+the+hardness+of+their+hearts+only+permitted+it%2C+and+did+command+that+when+the+husband+would+put+away+his+wife%2C+he+should+give+her+a+bill+of+divorce%2C+but+it+does+not+follow+that+the+Judicial+Law+is+in+itself+a+Law+to+all+nations%2C+or+that+the+Lord+purposed+it+so+to+her%2C+but+on+the+contrair%2C+it+appears+that+his+purpose+was+only+to+deliver+it%2C+for+a+peculiar+Law+to+Israel%2C+when+He+says%2C+%E2%80%98What+nation+is+so+great+that+has+statutes+and+judgments+so+righteous%2C+as+is+all+this+Law%2C+which+I+set+before+you+this+day%2C%E2%80%99+Dt.+4%3A8.+And+again+%E2%80%98He+shows+his+Word+unto+Jacob%2C+his+statutes+and+judgments+to+Israel%2C+He+has+not+dealt+so+with+every+nation%2C+and+as+for+his+Judgments%2C+they+have+not+known+them.%E2%80%99+Ps.+147%3A19+And+therefore+the+same+Law+was+not+to+Israelites+and+to+strangers%2C+even+to+proselytes%3B+as+appears+in+the+matter+of+usury+and+bondage%2C+which+were+allowed+to+strangers%2C+but+the+former+simply+forbidden%2C+and+the+latter+limited+as+to+Israelites%3A+Neither+is+there+any+necessity+of+an+express+abolition+of+this+Law+in+the+Gospel%2C+seeing+it+was+not+given+to+all+nations%3B+and+it+does+yet+bind+the+Jews+so+far+as+it+does+not+build+upon+the+Ceremonial+Law%3A+And+therefore+that+part+of+the+Judicial+Law%2C+which+is+founded+upon%2C+or+conducible+to+the+Moral+Law+may+be+well+received+by+other+nations%2C+to+whose+inclination+the+same+expediences+will+agree+as+most+of+the+criminal+laws+are%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Dalrymple%2C+The+Institutions+of+the+Law+of+Scotland%2C+vol.+1%2C+p.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16ee5f6fb3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16ee5f6fb3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=9.%20The%20prime%20Positive%20Law%20of,most%20of%20the%20criminal%20laws%20are&amp;text=9.%20The%20prime%20Positive%20Law%20of%20God%20is&amp;text=agree%20as%20most%20of%20the%20criminal%20laws%20are" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

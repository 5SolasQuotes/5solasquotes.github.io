<blockquote><p>Let us do as Jacob did, who sent a present and gift before to his brother: for as the wise man saith, a man’s gift enlargeth his steps, and leadeth him before great men (Prov. 18:16). So let us present the Lord, with contrite hearts, humble and sorrowful spirits, bring forth worthy fruits of repentance, which are the most acceptable gifts unto God. As Aaron took a censor and censed before the Lord, and so stayed the plague (Num. 16:48). So let us cense up unto God the sighs and groanings of our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A fruitful and godly sermon preached at Paul’s Cross before the Honorable audience and assembly there, this present year 1592, upon the 5th chapter of the prophesy of Zachariah, vv. 1-5’ (London, 1592)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-305c9484c3" data-kw="">
<blockquote><p>Neither in this case ought the authority of certain worthy and most learned men to move us, who seem too indiscreetly for to deny that this care appertains unto the Magistrate, whose office (say they) it is not to rid men from diseases, but only to maintain the safety and peace of our life and goods. For it may even out of their own words be proved sufficiently, that albeit the magistrate ought not to cure the diseases of every several man, or preserve them from such as do not openly ravage, nor have common causes (for this is the proper duty of the physicians), yet when as they hold it to be belonging to their charge, by their service and authority to perform, that their subjects may live commodiously: who sees not that this commodiousness does also appertain unto the health of the body? Which thing he that believes not, the same has never seen how miserably all the duties of men are cumbered, the order of the churches, the exercises of godliness, the instruction of youth, the traffic of citizens, whereupon must needs ensue a most grievous destruction of particular persons, when the plague troubles a city or country. Wherefore, I appeal unto thyself, whosoever thou art that art of this opinion, that thou thinkest not it to be the duty of the Magistrate to preserve the commonwealth from diseases (and especially common diseases) do not such sicknesses seem unto thee to be numbered amongst other incommodities? And can men live together commodiously when as these diseases do rage? Doubtless this canst thou not affirm if ever thou hast had experience before what the plague is, or what it may work, where it once has prevailed? Why then, say I, doest thou think it a thing not appertaining unto the duty of the magistrate, to deliver men from such diseases, that is with public care to defend? I pray thee, hast thou not seen that which is usual in all well ordered commonwealths, how diligently in cities the Magistrate provides and stores up such things as serve for the use of war? How carefully he prepares weapons? How busily he retains garrisons set in a readiness? Especially when he is in fear of some hurt to ensue? and to what end? but that men should live commodiously. Wherefore are horses kept; ships built; walls repaired, trenches dug, towers set up and banks cast: but that the citizens should live more commodiously in safety against the invasions or assaults of the enemies? Dogs are maintained for the like cause, nets are pitched, hunters are hired and troops of country people draw together if at any time wolves or such like beasts do trouble a country. I remember in the kingdom of France that certain leopards, which the king uses to keep, did break out of ward, and in every place slew the countrymen. The whole country was mustered and neither cost nor labor spared until they had rid the land from that fear. How much more justly then in this calamity and misery also ought there some provident course to be taken whereby this so mighty an enemy and cruel beast may be kept away from our throats, which in a very short time is wont to ravage very far, and as it were a canker, eat up every thing that is next [to] it? To the end that the clean in the Old Testament should not keep company with the unclean lepers, by the authority of the Magistrate, there was made a separation, neither were they received among the other people before that they were by the priests appointed to this office, judged cleansed after they were viewed naked.</p></blockquote>

<blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church. 54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>

<blockquote><p>Every person is engaged in his place and capacity to appear against vice, and to endeavor the extirpation of it; but here the Magistrate in a special manner is concerned, who is to see that all infected persons be shut up. The leper under the Law was to dwell alone without the camp, that he might not converse with those that were whole: now I have told you, that sin is the worst of plagues and leprosies. You therefore that are in public places and offices are to set a watch over notorious sinners, that they go not abroad to infect others: if they break out, you may shoot at them; if sinners will be bold and daring, you are bound to unsheath the sword of justice and strike at them; as indeed there are a sort of hardened sinners that stare justice in the face, and say she is blind, and laugh at her sword, and make their brag that they never felt the edge of it. Here you will do well to make them experience how sharp it is; that others too, beholding the punishment inflicted on them, may not presume to glory in their shame.</p></blockquote>

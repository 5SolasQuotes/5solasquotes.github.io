<blockquote><p>[Humfrey said:] ‘He obeyed and suffered both in our stead.’ That notion I [Clark] cannot swallow. I cannot apprehend that we are bound to obey and suffer both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clark.html">Samuel Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in John Humfrey, Ultimas manus… (1698), “To Mr. Humfrey”</cite>, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afe324ad34" data-kw="">
<blockquote><p>These three opinions [two involve the imputation of Christ’s active obedience], agreeing all in the main point (that is, that only Christ in his obedience is our righteousness) may well (without any contention, strife or schism) be tollerated in the Church of God: if Christian modesty, humbleness of mind, and meekness did in that measure possess all, that they could support one another in love: and study more to keep the unity of the Spirit, in the bond of peace: then by controversies of disputations, to engender strife. Especially seeing none of these opinions overthrow the foundation: or yet contains in them any impiety: or leads any man from the mark or matter of his righteousness, seeing all three exclude all things except only Christ’s obedience from our righteousness. Moreover, if we shall consider two things distinctly: we shall easily perceive that these three opinions may easily be reconciled, and made all to agree in one: and that none of them is contrary to the truth of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-forbes.html">John Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 24 in A Treatise tending to Clear the Doctrine of Justification (Middelburgh: Richard Schilders, 1616), pp. 93-110</cite>, p. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-99a2a68393" data-kw="">
<blockquote><p>Inveni igitur in Epistolis tuis in lucem editis Epistolas duas 35 et 45 in quarum illa controversiam hanc paucis attingis. In ista vero copiosius et plenius edisseris. In 35 igitur epistola ‘Quid vanius est, inquis, quam justum arbitrari qui Legem non impleverit?’ At, inquam, justicia Evangelii a justicia Legis, prudenter discernenda est, Justicia qua nos justi censemur a Deo ac proinde ab eodem justificamur seu absolvimur, non est justicia Legis, neque enim Deus ideo nos justificat, quod Legem vel ipsi nos impleverimus, vel Christus pro nobis impleverit. Sed est justicia Evangelii, id est quam Deus nobis per Evangelium donat, nempe remissio peccatorum sanguine Christi parta. Vitam igitur petimus a Deo non jure impletae Legis seu obedientiae Legi praestitae sed jure adoptionis, quam Christus sua morte nobis peperit.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

8393.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99a2a68393.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Inveni%20igitur%20in%20Epistolis%20tuis%20in,quam%20Christus%20sua%20morte%20nobis%20peperit." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Rule II. That justification stands in two things: First in the remission of sins by the merit of Christ’s death: Secondly in the imputation of Christ’s righteousness; which is another action of God whereby He accounts and esteems that righteousness which is in Christ, as the righteousness of that sinner which believes in Him. By Christ’s righteousness we are to understand two things: First his sufferings, specially in his death and passion; Secondly his obedience in fulfilling the Law: both which go together: for Christ in suffering obeyed, and obeying suffered. And the very shedding of his blood to which our salvation is ascribed, must not only be considered as it is passive, that is a suffering, but also as it is active, that is, an obedience, in which He showed his exceeding love both to his Father and us, and thus fulfilled the law for us. This point, if some had well thought on, they would not have placed all justification in remission of sins as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’</cite>, p. 925</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

<blockquote><p>5. Because the righteousness of Christ is imputed to us, indeed, because Christ died for us, i.e., in our place and stead, as sponsor and surety, He was made a curse for us, and sustained in Himself the malediction and penalty of the violated Law due to us. From which necessarily flowed from Christ to us surety-righteousness, or such as a sponsor renders for debtors. But this is imputed righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism tr. by AI by Onku (1639-1642; 1668)</cite>, ch. 12, Justification of a Sinner, p. 315</span></figcaption>

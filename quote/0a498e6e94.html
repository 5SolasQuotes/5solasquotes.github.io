<main class="wrap"><figure class="quote" id="q-0a498e6e94" data-kw="">
<blockquote><p>It avails not, indeed, a little to increase our confidence, that we are united to the Son of God by a bond so close, that we can find in our nature that holiness of which we are in want; for he not only as God sanctifies us, but there is also the power of sanctifying in his human nature; not that it has it from itself, but that God had poured upon it a perfect fulness of holiness, so that from it we may all draw. And to this point this sentence refers, “For their sakes I sanctify myself.” (John 17:19.) If, then, we are sinful and unclean, we have not to go far to seek a remedy; for it is offered to us in our own flesh. If any one prefers to regard as intended here that spiritual unity which the godly have with the Son of God, and which differs much from that which men commonly have among themselves, I offer no objection, though I am disposed to follow what is more commonly received, as it is not inconsistent with reason</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (Bellingham, WA: Logos Bible Software, 2010), 64–65.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ.html">Union with Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da5932d3cd" data-kw="">
<blockquote><p>And 1. as to the [Lutheran] dogma of [the] ubiquity [of Christ’s human nature], I plainly think that the opinion of certain most learned theologians should be acceded to, I mean the most learned [Jerome] Zanchi, and our most famous theologians [Richard] Hooker and [Richard] Field, who having diligently weighed the arguments agitated hither and thither in this controversy, think that the German theologians who are and were assertors of ubiquity, although they use unaccustomed, hard, doubtful, and indeed dangerous forms of speaking, yet never thought that the body of Christ, according to its natural being, is immense, infinite, uncircumscribed, illocal; but only according to its personal being, inasmuch as no place can be given where the body of Christ is not personally united to the word. For since the human nature of Christ is a created nature, it is necessary that it be finite. And since that nature of itself has no existence, but being assumed by the Word to the very subsistence of the Word, it cannot be denied that it has an infinite subsistence, and subsists in an incomprehensible and unlimited manner, and consequently everywhere. It can also be added what the most famous Hooker observed, that the humanity of Christ can be said to be present everywhere not only on account of the inseparable conjunction with the Word, but also according to the universal cooperation with the Word, and from both of these arises the infinite and perpetual efficacy of the immolated body of Christ, which is infinitely applicable to subject bodies, that is, to true believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Determinations, ‘The Reformed Churches do not Dissent in the Fundamentals of the Faith’ in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-7ba75fe427" data-kw="">
<blockquote><p>But this communication of the subsistence of the second Person unto the humanity is not (as [Robert] Baron,Philosophia. Theol. Ancil., Article 12, and after him Mr. Barlow in the forementioned place, very excellently show) by way of real inhesion, or denomination, but only by way of sustentation: And this is no advantage unto the Lutherans’ communication of divine properties. Look as when a subject does communicate itself unto its accidents by way of support, it does not hereupon follow that it inheres in them, or does denominate them. So though the person of the Son do assume, receive, and sustain the humanity of Christ, yet it does not hereupon follow that the subsistence of the Son is formally in the manhood, or that the manhood is a person, as is proved at large by those two mentioned authors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity, with Practical, in Several Tractates</cite>, … (Oxford, 1656) Jeanes (1611-1662) was an English, clergyman and puritan minister., p. 33</span></figcaption>

</figure><figure class="quote" id="q-3024f40bc6" data-kw="">
<blockquote><p>From this, also, we infer, that we cannot be justified freely through faith alone without at the same time living holily. For these fruits of grace are connected together, as it were, by an indissoluble tie, so that he who attempts to sever them does in a manner tear Christ in pieces. Let therefore the man who seeks to be justified through Christ, by God&#x27;s unmerited goodness, consider that this cannot be attained without his taking him at the same time for sanctification, or, in other words, being renewed to innocence and purity of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Corinthians</cite>, 1 Corinthians 1:30</span></figcaption>

<main class="wrap"><figure class="quote" id="q-88ec5a5ba6" data-kw="">
<blockquote><p>Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (1644)</cite>, p. 150</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f871071d58" data-kw="">
<blockquote><p>The apostles would make no laws at all of things indifferent except in the case of scandal… If then nothing be good [simply] because rulers command it; but, by the contrary, they do lawfully command it because it is good. The Church’s power is one and the same in things indifferent, and necessary in matters of doctrine, discipline and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find pre-existent goodness in doctrine, discipline, and matters of order. Therefore, will of authority, as will, has no power to dispose of the least circumstance of time, place or person; but the Church’s power is ministerial and determined to what is good, expedient and convenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646)</cite>, pp. 648-9</span></figcaption>

</figure><figure class="quote" id="q-67509949cf" data-kw="Councils under Scripture">
<blockquote><p>The weightiest controversies have been determined and settled in councils, but not by the absolute authority of the council itself, but by the judgment and authority of scripture in the council. Pious bishops never assembled to define a point themselves by their own authority, but by that of scripture. Therefore all religious councils have ascribed the supreme decision to the scriptures. … Since, then, councils, whenever they are good and pious, follow the scriptures, it is manifest that the supreme authority of judging belongs to the scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a> › <a href="../topics/church-government-and-the-ministry/synods-and-assemblies/authority-of-synods.html">Authority of synods</a></span><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/ecumenical-councils.html">Ecumenical councils</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-59fc4a82a3" data-kw="">
<blockquote><p>By which it does manifestly appear that they would bear dominion over our consciences, not as lords only, by requiring the willing and ready assent of our consciences to those things which are urged upon us by their sole will and authority, but even as tyrants, not caring if they get so much as constrained obedience, and if by their authority they can compel conscience to that which is contrary to the [Greek] and full persuasion which it has conceived. It will be said that our consciences are in an error, and therefore ought to be corrected by the sentence of superiors, whose authority and will does bind us to receive and embrace the ceremonies, though our consciences do condemn them. Answer: Giving and not granting that our consciences do err in condemning the ceremonies, yet so long as they cannot be otherwise persuaded, the ceremonies ought not to be urged upon us, for if we be made to do that which our consciences do condemn, we are made to sin. Rom. 14:23. It is an audacious contempt in Calvin’s judgment to do any thing repugnante conscientia.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (Edinburgh, 1637) | Pt. 1</cite>, ch. 5, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

&amp;text=Calvin%E2%80%99s%20judgment%20to%20do%20any%20thing%20repugnante%20conscientia" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-445466e81c" data-kw="">
<blockquote><p>2. As concerning actions of Church-policy that cannot be warranted by the light of nature, and yet have intrinsical conveniency and aptitude to edify and decently to accommodate the worship of God. I conceive these may be done, but not because the Church so commands, as if their commandment were the formal reason of our obedience, but because partly the light of the Law of reason, partly scripture does warrant them… … Question. But does not the Church determine things that of themselves are indifferent, as whether [the] sermon should begin at nine of clock or ten in the morning; and after the Church has past a determination for the diet of ten a clock, the indifferency of either nine or ten is removed and the practice, without any warrant of Scripture, [is] restricted to one, for order and peace sake; and why may not the like be done in positives of Church-government? Answer. The truth is [that] the Church by her will puts no determination on the time, but only ministerially declares that which God’s providence accommodating itself to the season, climate, the conveniency of the congregation as they lie in distance from the place of meeting, has determined already…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646) | Intro, section 5, ‘Moral Obedience Resolved Ultimately in Scripture’</cite>, pp. 80-82</span></figcaption>

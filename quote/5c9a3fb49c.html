<main class="wrap"><figure class="quote" id="q-5c9a3fb49c" data-kw="">
<blockquote><p>God is independent altogether, and self-sufficient. This is his royal prerogative, wherein he infinitely transcends all created perfection. “He is of himself, and for himself,” from no other, and for no other, “but of him, and for him are all things.” He is the fountain-head; you ought to follow the streams up to it, and then to rest: for you can go no further. …

As God’s being is independent, so that he cannot be expressed by any name, more suitable than such as he takes to himself, “I am that I am;” importing a boundless, ineffable, absolute and transcendent being, beside which, no creature deserves so much as to have the name of being, or to be made mention of in one day with his name, because his glorious light makes the poor derived shadow of light in other creatures to disappear, and to evanish out of the world of beings: so it is the glorious perfection of his nature, that he doth all things for himself, for his own name, Prov. Xvi. 4, and his glory is as dear to him, as himself. Isa. xlii. 8, “I am the Lord, that is my name, and therefore my glory will I give to no other …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 9-10.</span></figcaption>

<blockquote><p>But did the Son take his Deity from the Father?

When we speak simply of the Son without the Father, we avouch truly and properly that he is of himself, and call him God, because of himself he hath his being, and all that he hath; and therefore we call him one alone beginning. But when we point at that relation which he hath with his Father, we justly make the Father the beginning of the Son, and say that the Son received all from the Father, Joh. 3.33.

For the Essence is one thing, and the manner of subsisting another. Hence it is that the schoolmen say, that the Son is by himself not of himself. So the essence of the Son is without beginning, but the Father is the beginning of his Person. This made Hilary to say: The gifts of the Father do not infirm but affirm the Divinity of the Son. And Augustine, Christ in regard of himself is called God, and of the Father is called the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/spirituality-and-aseity.html">Spirituality and Aseity</a></span></div>

</figure><figure class="quote" id="q-6178fb71dc" data-kw="">
<blockquote><p>Did we know what being and life are, we might possibly form some satisfying conception, though nothing that could deserve the name of an idea; and here we are taught to fix our last resource, by the name that God hath chosen for himself, and which distinguishes him from every other being, Jehovah, which is best rendered by, He that is,—the possessor and proprietor of being; and, consequently, of all measures and degrees of perfection.

The nearer we can raise our conceptions to this, which always implies life, and all its powers, the nearer will we approach to right conceptions of that incomprehensible being, who hath condescended to give an authentic history of his works and ways, by which he hath discovered himself to us in his true character, and the perfections which belong to him.

However we may be forced to apprehend the divine perfections separately, or in different views, they are all one in the divine essence. Perfect being is perfect forever; and perfect power cannot be conceived without absolute perfection subsisting in the most perfect manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Several of the Doctrines of Revelation</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 169-70.</span></figcaption>

</figure><figure class="quote" id="q-6f01bb37e2" data-kw="without beginning">
<blockquote><p>God is without beginning. “In the beginning God created” the world, Gen. 1:1. God was then before the beginning of it; and what point can be set wherein God began, if he were before the beginning of created things? God was without beginning, though all other things had time and beginning from him. As unity is before all numbers, so is God before all his creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Eternity of God</span></figcaption>

</figure><figure class="quote" id="q-0a705e8a69" data-kw="">
<blockquote><p>§ 4. For God is a being infinitely and absolutely perfect. He has all those Perfections which are contained or implied in the Words good, right, excellent, amiable, and all other Words of the like Import—all those Perfections which can possibly exist, or that can be conceived of by the most perfect Intelligent: For there can be no Limitation of Perfection in a necessary and self-existent Being.

§ 5. Indeed we get the Idea of a Perfection from those small Degrees of Perfection which we observe in the Creatures, and then we ascribe all Perfections to God, in an infinite Degree; and unite them all in the Idea of ONE ALL-PERFECT BEING.

§ 6. So that, in the Order of our Conceptions, we conceive of a Perfection as existing in the Creature, before we conceive of it as existing in God, and generally (it may be) before we have any Idea of God at all. And therefore we are apt to conceive (or, at least, to use some Expressions as if we did conceive) some Perfections to have an independent Existence out of God, and prior to him; and as if we would try him by that Standard, and approve of his Qualities according as we conceived them to be agreeable to it. But this is a great Mistake: For all Perfection is originally in God, as the primary Foundation and Standard, and from that Fountain is communicated to the Creatures, in various limited Degrees, according to their several Ranks and Orders.

§ 7. As his Being includes and comprehends all Perfection; so no Perfection can possibly exist in the Creature, or be conceived by him, but what first existed in the Creator: Neither can it have any innate Excellency or permanent Existence, but only so far as it resembles Something in God, and is dependent upon him. The Perfection of the Creature consists in his Resemblance or Conformity to God; but the Perfection of God consists in his being what he is, or like to himself, as the primary Standard; without any antecedent or concomitant Rule or Standard to measure himself by.</p></blockquote>

§ 6. So that, in the Order of our Conceptions, we conceive of a Perfection as existing in the Creature, before we conceive of it as existing in God, and generally (it may be) before we have any Idea of God at all. And therefore we are apt to conceive (or, at least, to use some Expressions as if we did conceive) some Perfections to have an independent Existence out of God, and prior to him; and as if we would try him by that Standard, and approve of his Qualities according as we conceived them to be agreeable to it. But this is a great Mistake: For all Perfection is originally in God, as the primary Foundation and Standard, and from that Fountain is communicated to the Creatures, in various limited Degrees, according to their several Ranks and Orders.

§ 7. As his Being includes and comprehends all Perfection; so no Perfection can possibly exist in the Creature, or be conceived by him, but what first existed in the Creator: Neither can it have any innate Excellency or permanent Existence, but only so far as it resembles Something in God, and is dependent upon him. The Perfection of the Creature consists in his Resemblance or Conformity to God; but the Perfection of God consists in his being what he is, or like to himself, as the primary Standard; without any antecedent or concomitant Rule or Standard to measure himself by.”

— Thomas Clap, An essay on the nature and foundation of moral virtue and obligation; being a short introduction to the study of ethics; for the use of students of Yale-College, (New Haven: B. Mecom, 1765), pp 3-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7+4.+For+God+is+a+being+infinitely+and+absolutely+perfect.+He+has+all+those+Perfections+which+are+contained+or+implied+in+the+Words+good%2C+right%2C+excellent%2C+amiable%2C+and+all+other+Words+of+the+like+Import%E2%80%94all+those+Perfections+which+can+possibly+exist%2C+or+that+can+be+conceived+of+by+the+most+perfect+Intelligent%3A+For+there+can+be+no+Limitation+of+Perfection+in+a+necessary+and+self-existent+Being.%0A%0A%C2%A7+5.+Indeed+we+get+the+Idea+of+a+Perfection+from+those+small+Degrees+of+Perfection+which+we+observe+in+the+Creatures%2C+and+then+we+ascribe+all+Perfections+to+God%2C+in+an+infinite+Degree%3B+and+unite+them+all+in+the+Idea+of+ONE+ALL-PERFECT+BEING.%0A%0A%C2%A7+6.+So+that%2C+in+the+Order+of+our+Conceptions%2C+we+conceive+of+a+Perfection+as+existing+in+the+Creature%2C+before+we+conceive+of+it+as+existing+in+God%2C+and+generally+%28it+may+be%29+before+we+have+any+Idea+of+God+at+all.+And+therefore+we+are+apt+to+conceive+%28or%2C+at+least%2C+to+use+some+Expressions+as+if+we+did+conceive%29+some+Perfections+to+have+an+independent+Existence+out+of+God%2C+and+prior+to+him%3B+and+as+if+we+would+try+him+by+that+Standard%2C+and+approve+of+his+Qualities+according+as+we+conceived+them+to+be+agreeable+to+it.+But+this+is+a+great+Mistake%3A+For+all+Perfection+is+originally+in+God%2C+as+the+primary+Foundation+and+Standard%2C+and+from+that+Fountain+is+communicated+to+the+Creatures%2C+in+various+limited+Degrees%2C+according+to+their+several+Ranks+and+Orders.%0A%0A%C2%A7+7.+As+his+Being+includes+and+comprehends+all+Perfection%3B+so+no+Perfection+can+possibly+exist+in+the+Creature%2C+or+be+conceived+by+him%2C+but+what+first+existed+in+the+Creator%3A+Neither+can+it+have+any+inna

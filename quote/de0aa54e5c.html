<main class="wrap"><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641), p. 241</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>…whatsoever recreations and exercises of body and mind are necessar[il]y required for the bettering of our sanctification of the Lord’s day and the enabling of us to perform with more cheerfulness, strength and courage the holy worship of God, and the work and service of his holy Sabbath, and which are also intended by us only to that end and use, them we may use, and so far as they serve to further and in no wise to hinder God’s holy worship and the immediate works and duties thereof. This is manifest by God’s allowing to his people in the Law dressing of meat and cheerful feasting on his Sabbath and holy days: which are needfull to cheer up men, and to provoke them to worship Him with all thankfulness of heart, also to put on our best apparel that we may come decently to God’s house. As these are lawful, being directed to holy use, so undoubtedly honest refreshing with recreations which cheer up the heart and refresh the spirits are lawful when they are helpful to holy exercises and are directed to that end, as stirring of the body, walking into gardens or fields to take fresh air, being found very helpful to preachers to revive their spirits, strengthen their loins, clear their voices, sharpen and quicken their wits and memories; and being done only to that end are lawful. So also walking into the corn fields in summer or harvest, or into meadows or pastures in the spring, both to refresh our bodies and spirits, and to give us occasion to admire God’s bounty in clothing the bodies, and his Fatherly providence in making the earth so fruitful, and to laud and praise Him, is lawful for us. And if after public and private exercise we do so walk about, diverse together, conferring of heavenly things and taking occasion by sight of earthly blessings to provoke one another to thankfulness and acknowledgment of God’s love, this no doubt is a recreation fit for the Lord’s day, and helps much our devotion; and this seems to have been practiced by our Savior, who went through the corn fields on the Sabbath day, Mt. 12:1, and his disciples with them.</p></blockquote>

</figure><figure class="quote" id="q-d42f7d329e" data-kw="">
<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures</cite>, ... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</span></figcaption>

<blockquote><p>Yet 2. we assert, That by this rest all sort of actions are not condemned, but only such as are inconsistent with the end and scope of this command; as by other Scriptures, and the practice of Christ and the Saints is clear: we conceive therefore these to be permitted: …

5. Works of necessity, such as… much more preparing honestly sober allowance for the sustaining of the body, as the disciples plucked the ears of corn, Mt. 12, and the Jews, Ex. 16:23, dressed the manna on the Sabbath, though they were not to gather it, yet on the sixth day to bake and seethe a part, and to keep a part till the morrow, but not till the day following, and therefore they behoved to dress it also; yea, Jesus Christ went Himself to a feast on the Sabbath, Lk. 14 (that He might take that opportunity by his spiritual discourse to edify the company as He did notably) which He would not have done had it been unlawful to dress any meat on the Sabbath, yet his carriage was such at that feast most remarkably, that it would be followed as a pattern by such as may be invited by others to eat with them, and shall be disposed to go on the Sabbath: And if this were the design of the inviters and invited, men’s eating together on that day would not readily prejudice the sanctification of it, as very often it does…

6. Works of comliness, tending to honest or decent walking, as putting on of clothes honestly, making the house clean from any uncleanness that may fall in it throughout the Sabbath, etc. By all which believers have allowance, 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord hath not streightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will He have their consciences to be festered with inextricable scruples: He leaves it to men on other days, how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but men would look, 1 to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>

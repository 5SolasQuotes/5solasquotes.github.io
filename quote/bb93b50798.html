<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>

</figure><figure class="quote" id="q-501d90c574" data-kw="">
<blockquote><p>1. Some brethren of the Classical [presbytrian] way may possibly object [to joining an accommodated church-association such as Baxter’s], that joining with us in this way may seem to signify a dislike of the resolutions of the [Westminster?] Assembly, or a consent to the undoing of what they have done. Answer: There is no ground for this scruple: For we do not disclaim or condemn the judgment or way of any party, by taking up at present with what all are agreed in. A present forbearance of the use of full Classical government is no rejecting it. We did in this county seek for authority from the parliament many years ago for the establishing of the presbyterian government, and all our endeavors were frustrated. And many brethren that make this objection do preach themselves without the exercise of the presbyterian government. For because they live not in London, Lancashire, Shropshire, where that government was authorized by parliament, therefore they will not use it: And so some of them for many years have forborne all administration of the Lord’s Supper, and others administer it without any exercise of discipline: And may not we as lawfully exercise so much as all are agreed in, as they may forbear all? Objection: But why may not you as well set up the Classical government punctually, as do what you do? Answer: We are not all of one mind; and those of us that are for the Classical government do not think those parts of it which we here omit and forbear to be of so great necessity or moment as for the present use of it to disjoin and divide from all our brethren of a different judgment. We take ourselves bound to do much for the unity and peace of the churches: Besides, being many of us at a loss in several controverted points of discipline, we think the amicable union and association of brethren where all things may be frequently and plainly debated will be the likeliest way to satisfy and rectify us in those controverted points. In the meantime, you may join with us in going so far as we can go unanimously, without disclaiming, yea or forbearing your own way. For I think the constant exercise of the presbyterian government may well consist with our Propositions and associations: part of it being indeed above, but not contrary to our Agreement, and therefore may be done by those that will overgo us, without dividing from us. … And whereas it may be objected that we do allow a single minister to name offenders and to charge it on the people’s consciences to avoid communion with them, which only a presbytery is authorized to do, I answer: 1. We desire each church may have a presbytery, and then we are agreed. 2. The brethren of the Classical Way do allow a single pastor to pronounce the sentence of excommunication itself, so be it he have the advice and consent of a presbytery. And to avoid all possibility of breach upon this ground, we have agreed to take the advice of the Association of ministers before we require the people to avoid communion with any. Only we resolve not to do this all on the same reasons and principles: One may think it of flat necessity in a regimental way: Another may think it of necessity in a way of union: Another may think it convenient to avoid miscarriages and rash censures in so weighty a case: Another may think it fit to be yielded to for peace with those brethren that judge it necessary, seeing it is unquestionably lawful to take advice in cases of such weight. And why must we needs agree in our reasons as long as we agree in our practice? 3. It is only a preaching power that we exercise, applying Christ’s doctrine to particular persons and cases: supposing the evidence of the fact and guilt to be beyond question, we do but apply the word to the person hereupon… Have not pastors a charge of particular souls, but only of people in general? Is not the Old Testament and New full of examples to warrant us in this? Take heed of crying down duty, under pretense of questioning authority. … I will say no more to any objections that may possibly be made by my brethren of the Classical Way, because I find by experience it is needless (if others be as those with us), for they are the forwardest men to our union and Association of any others (here). The Lord grant the like spirit of unity and condescension in other parts. … Brethren! Would you have unity and peace or no? If you would, must not you condescend as far as may be to others, as well as others to you? Let it be the property of the Pope to accept of no peace with any Church that will not wholly come up to his will and way. And you know that this is the great point which you must yield in or you cannot have union with the contrary minded… Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches. 5. In the mean time, I pray you observe, that you may join with us in this without contradicting or deserting your own principles… The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member. What confusion will follow the plucking up of Christ’s and the magistrate’s and the churches’ bounds?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

ntroverted points. In the meantime, you may join with us in going so far as we can go unanimously, without disclaiming, yea or forbearing your own way. For I think the constant exercise of the presbyterian government may well consist with our Propositions and associations: part of it being indeed above, but not contrary to our Agreement, and therefore may be done by those that will overgo us, without dividing from us. … And whereas it may be objected that we do allow a single minister to name offenders and to charge it on the people’s consciences to avoid communion with them, which only a presbytery is authorized to do, I answer: 1. We desire each church may have a presbytery, and then we are agreed. 2. The brethren of the Classical Way do allow a single pastor to pronounce the sentence of excommunication itself, so be it he have the advice and consent of a presbytery. And to avoid all possibility of breach upon this ground, we have agreed to take the advice of the Association of ministers before we require the people to avoid communion with any. Only we resolve not to do this all on the same reasons and principles: One may think it of flat necessity in a regimental way: Another may think it of necessity in a way of union: Another may think it convenient to avoid miscarriages and rash censures in so weighty a case: Another may think it fit to be yielded to for peace with those brethren that judge it necessary, seeing it is unquestionably lawful to take advice in cases of such weight. And why must we needs agree in our reasons as long as we agree in our practice? 3. It is only a preaching power that we exercise, applying Christ’s doctrine to particular persons and cases: supposing the evidence of the fact and guilt to be beyond question, we do but apply the word to the person hereupon… Have not pastors a charge of particular souls, but only of people in general? Is not the Old Testament and New full of examples to warrant us in this? Take heed of crying down duty, under pretense of questioning authority. … I will say no more to any objections that may possibly be made by my brethren of the Classical Way, because I find by experience it is needless (if others be as those with us), for they are the forwardest men to our union and Association of any others (here). The Lord grant the like spirit of unity and condescension in other parts. … Brethren! Would you have unity and peace or no? If you would, must not you condescend as far as may be to others, as well as others to you? Let it be the property of the Pope to accept of no peace with any Church that will not wholly come up to his will and way. And you know that this is the great point which you must yield in or you cannot have union with the contrary minded… Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches. 5. In the mean time, I pray you observe, that you may join with us in this without contradicting or deserting your own principles… The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member. What confusion will follow the plucking up of Christ’s and the magistrate’s and the churches’ bounds?”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Some+brethren+of+the+Classical+%5Bpresbytrian%5D+way+may+possibly+object+%5Bto+joining+an+accommodated+church-association+such+as+Baxter%E2%80%99s%5D%2C+that+joining+with+us+in+this+way+may+seem+to+signify+a+dislike+of+the+resolutions+of+the+%5BWestminster%3F%5D+Assembly%2C+or+a+consent+to+the+undoing+of+what+they+have+done.+Answer%3A+There+is+no+ground+for+this+scruple%3A+For+we+do+not+disclaim+or+condemn+the+judgment+or+way+of+any+party%2C+by+taking+up+at+present+with+what+all+are+agreed+in.+A+present+forbearance+of+the+use+of+full+Classical+government+is+no+rejecting+it.+We+did+in+this+county+seek+for+authority+from+the+parliament+many+years+ago+for+the+establishing+of+the+presbyterian+government%2C+and+all+our+endeavors+were+frustrated.+And+many+brethren+that+make+this+objection+do+preach+themselves+without+the+exercise+of+the+presbyterian+government.+For+because+they+live+not+in+London%2C+Lancashire%2C+Shropshire%2C+where+that+government+was+authorized+by+parliament%2C+therefore+they+will+not+use+it%3A+And+so+some+of+them+for+many+years+have+forborne+all+administration+of+the+Lord%E2%80%99s+Supper%2C+and+others+administer+it+without+any+exercise+of+discipline%3A+And+may+not+we+as+lawfully+exercise+so+much+as+all+are+agreed+in%2C+as+they+may+forbear+all%3F+Objection%3A+But+why+may+not+you+as+well+set+up+the+Classical+government+punctually%2C+as+do+what+you+do%3F+Answer%3A+We+are+not+all+of+one+mind%3B+and+those+of+us+that+are+for+the+Classical+government+do+not+think+those+parts+of+it+which+we+here+omit+and+forbear+to+be+of+so+great+necessity+or+moment+as+for+the+present+use+of+it+to+disjoin+and+divide+from+all+our+brethren+of+a+different+judgment.+We+take+ourselves+bound+to+do+much+for+the+unity+and+peace+of+the+churches%3A+Besides%2C+being+many+of+us+at+a+loss+in+several+controverted+points+of+discipline%2C+we+think+the+amicable+union+and+association+of+brethren+where+all+things+may+be+frequently+and+plainly+debated+will+be+the+likeliest+way+to+satisfy+and+rectify+us+in+those+controverted+points.+In+the+meantime%2C+you+may+join+with+us+in+going+so+far+as+we+can+go+unanimously%2C+without+disclaiming%2C+yea+or+forbearing+your+own+way.+For+I+think+the+constant+exercise+of+the+presbyterian+government+may+well+consist+with+our+Propositions+and+associations%3A+part+of+it+being+indeed+above%2C+but+not+contrary+to+our+Agreement%2C+and+therefore+may+be+done+by+those+that+will+overgo+us%2C+without+dividing+from+us.+%E2%80%A6+And+whereas+it+may+be+objected+that+we+do+allow+a+single+minister+to+name+offenders+and+to+charge+it+on+the+people%E2%80%99s+consciences+to+avoid+communion+with+them%2C+which+only+a+presbytery+is+authorized+to+do%2C+I+answer%3A+1.+We+desire+each+church+may+have+a+presbytery%2C+and+then+we+are+agreed.+2.+The+brethren+of+the+Classical+Way+do+allow+a+single+pastor+to+pronounce+the+sentence+of+excommunication+itself%2C+so+be+it+he+have+the+advice+and+consent+of+a+presbytery.+And+to+avoid+all+possibility+of+breach+upon+this+ground%2C+we+have+agreed+to+take+the+advice+of+the+Association+of+ministers+before+we+require+the+people+to+avoid+communion+with+any.+Only+we+resolve+not+to+do+this+all+on+the+same+reasons+and+principles%3A+One+may+think+it+of+flat+necessity+in+a+regimental+way%3A+Another+may+think+it+of+necessity+in+a+way+of+union%3A+Another+may+think+it+convenient+to+avoid+miscarriages+and+rash+censures+in+so+weighty+a+case%3A+Another+may+think+it+fit+to+be+yielded+to+for+peace+with+those+brethren+that+judge+it+necessary%2C+seeing+it+is+unquestionably+lawful+to+take+advice+in+cases+of+such+weight.+And+why+must+we+needs+agree+in+our+reasons+as+long+as+we+agree+in+our+practice%3F+3.+It+is+only+a+preaching+power+that+we+exercise%2C+applying+Christ%E2%80%99s+doctrine+to+particular+persons+and+cases%3A+supposing+the+evidence+of+the+fact+and+guilt+to+be+beyond+question%2C+we+do+but+apply+the+word+to+the+person+hereupon%E2%80%A6+Have+not+pastors+a+charge+of+particular+souls%2C+but+only+of+people+in+general%3F+Is+not+the+Old+Testament+and+New+full+of+examples+to+warrant+us+in+this%3F+Take+heed+of+crying+down+duty%2C+under+pretense+of+questioning+authority.+%E2%80%A6+I+will+say+no+more+to+any+objections+that+may+possibly+be+made+by+my+brethren+of+the+Classical+Way%2C+because+I+find+by+experience+it+is+needless+%28if+others+be+as+those+with+us%29%2C+for+they+are+the+forwardest+men+to+our+union+and+Association+of+any+others+%28here%29.+The+Lord+grant+the+like+spirit+of+unity+and+condescension+in+other+parts.+%E2%80%A6+Brethren%21+Would+you+have+unity+and+peace+or+no%3F+If+you+would%2C+must+not+you+condescend+as+far+as+may+be+to+others%2C+as+well+as+others+to+you%3F+Let+it+be+the+property+of+the+Pope+to+accept+of+no+peace+with+any+Church+that+will+not+wholly+come+up+to+his+will+and+way.+And+you+know+that+this+is+the+great+point+which+you+must+yield+in+or+you+cannot+have+union+with+the+contrary+minded%E2%80%A6+Is+it+not+fit+that+bounds+for+order+and+division+should+be+set%3F%E2%80%A6+And+is+it+not+done+in+most+places+as+well+as+you+can+desire%3F+And+where+it+is+not%E2%80%A6+get+them+amended+as+soon+as+you+can.+In+the+mean+time%2C+affect+not+confusion%3A+turn+not+all+order+upside+down%3A+God+is+not+the+God+of+confusion%2C+but+of+order%2C+which+He+would+have+established+in+all+the+Churches.+5.+In+the+mean+time%2C+I+pray+you+observe%2C+that+you+may+join+with+us+in+this+without+contradicting+or+deserting+your+own+principles%E2%80%A6+The+public+welfare+and+unity+of+the+churches+is+to+be+preferred+before+the+pleasing%2C+yea+or+edifying+of+any+single+member.+What+confusion+will+follow+the+plucking+up+of+Christ%E2%80%99s+and+the+magistrate%E2%80%99s+and+the+churches%E2%80%99+bounds%3F%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98Objections+Answered%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F501d90c574.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/501d90c574.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-occasional-partial-conformity-or-moderate-puritanism/#:~:text=1.%20Some%20brethren%20of%20the%20Classical,the%20magistrate%E2%80%99s%20and%20the%20churches%E2%80%99%20bounds&amp;text=1.%20Some%20brethren%20of%20the%20Classical%20%5Bpresbytrian%5D%20way&amp;text=Christ%E2%80%99s%20and%20the%20magistrate%E2%80%99s%20and%20the%20churches%E2%80%99%20bounds" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-2114a44213" data-kw="">
<blockquote><p>However, it is not agreed between the Scholastic Doctors and at least some of our theologians, as is evident from what has been said, whether the soul of our Lord Jesus Christ, while he was still on earth, before death already enjoyed that highest blessedness which it now enjoys in Heaven; and thus whether Christ could then be said to be simultaneously a wayfarer and a comprehender (which the Roman School teaches by common consent). But some of our theologians deny this, while others affirm it, most being silent and saying or establishing nothing about it. Furthermore, from that matter another dispute arises, whether Christ had faith and hope properly so called, which the Roman School denies, as has been shown before. But those of our theologians who deny that Christ’s soul was always perfectly blessed affirm it. Concerning faith, however, there seems to be a λογομαχία [logomachy, or dispute about words]… Moreover, from what has been said it appears that our theologians, either all or most, differ from the Roman School in this, that they think that all fullness of grace was not poured out upon Christ’s soul at once and simultaneously as soon as he was conceived in the Virgin’s womb, but that Christ made progress in grace with time, not only as to acts, but also as to habits; whereas on the contrary the Roman School holds that the gifts of the Spirit were conferred upon Christ in such abundance in his very first conception, that afterwards there was no place at all for increase, but whatever gifts and grace Christ now possesses in his soul, he always had even in his mother’s womb in the same measure and degree. But the principal dispute is about the knowledge of Christ’s soul, which indeed all agree now knows all things in heaven of which knowledge can fall to any creature, but they do not agree whether he always knew all things and never learned anything which he truly did not know before. And the Pontificals indeed by common consent hold that the soul of our Lord Jesus Christ was so filled with knowledge from its very creation, that it afterwards learned nothing which it did not know before, and that Christ never labored under any privative and properly so called ignorance, but through some created knowledge always knew all things which he now knows, and which it is possible for a creature to know. On the contrary, however, most of our theologians assert that it can be truly and properly said that Christ, insofar as he is man, was sometimes ignorant of something, and that his knowledge began to have various increases with age, and thus that he knows some things in heaven which he did not know when he was not yet glorified.</p></blockquote>

0not%20agreed%20between%20the%20Scholastic&amp;text=not%20know%20when%20he%20was%20not%20yet%20glorified" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d861ec537" data-kw="">
<blockquote><p>I come now to my third [point]: that it is lawful to do good works intuitu mercedis, ‘with an eye or respect to the recompense of reward’. It is plain that Nehemiah here did so: “Remember me, O my God, concerning this,” etc. [Neh. 13:14] So did Moses, of whom it is said that he chose rather to suffer affliction with the people of God than to enjoy the pleasures of sin for a season; esteeming the reproach of Christ greater riches than the treasures of Egypt(Heb. 11:25–26), for, says the text, [Greek] (aspiciebat or intuebatur) [Greek], he had respect unto the recompense of reward. And, I confess, it seems an unreasonable thing to me [1] that that which is made the end (though but in part) of the action should not be at all looked unto by the agent; whereas finis is principium actionis [‘the end is the principle of the action]; and [2] that that which God has promised unto us as an encouragement, to make us work with the more alacrity, should not be thought on nor looked to in our working. Do not they who would persuade this go the way to discourage men from good works, by removing out of their sight the encouragement which God has given them? But they object, the obedience of God’s children ought to be filial, that is, free, and not mercenary, as that of hirelings. I answer: obedience which is only for reward, without all respect or motive of love and duty, is the obedience of a hireling; not that which acknowledges the tie of obedience-absolute, and the reward no otherwise due than of his Father’s free love and bounty, as every true child of God does, and ought to do. They object again that of the apostle, 1 Cor. 13:5, “Charity seeks not her own.” Now, say they, the works of God’s children must proceed from love and charity. I answer: what though charity seeks not her own? May not yet a charitable man so much as look or hope for his own, or have an eye to what is promised him? But this place is altogether misapplied and abused: for that property of charity now mentioned (as some also of the rest in that chapter) concerns only our charity towards men, and not our charity towards God; the meaning thereof being that a charitable man will sooner lose his own than, by seeking or contending for it, break the bond of charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-mede.html">Joseph Mede</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … (d. 1638; London: 1672), Discourse 34 on Neh. 13:14, pp. 176-77</span></figcaption>

</figure><figure class="quote" id="q-434f3c8a49" data-kw="eternal life vision">
<blockquote><p>To the eternal death which awaits the damned, eternal life is opposed—the fulfillment and crown of all of Christ’s benefits. So great a good as neither eye has seen, nor ear heard, nor has it entered into the heart of anyone to conceive, and will not enter until we, obtaining our wish, ascend thither and know as we are known, and no longer walk by faith, but by sight.</p></blockquote>

</figure><figure class="quote" id="q-ac45295e01" data-kw="">
<blockquote><p>There was a little Christian child who was asked, when she was dying, why she was so happy? ‘Because,’ she said, ‘I am going to be with Christ.’ ‘But,’ they said to her, ‘perhaps Christ will leave heaven.’ ‘Ah! Then,’ she said, ‘I will leave it, too, and go with Him.’ It is our very heaven to be with Christ; we shall see eye to eye.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Church in Sardis’</cite></span></figcaption>

<blockquote><p>Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9f537cdcf5" data-kw="">
<blockquote><p>The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5eb1da003c" data-kw="">
<blockquote><p>III. …the church can be regarded either as to its external or its internal state. The external answers to the external call by the Word, upon which depends the external form of the church, placed in a profession of faith or an external and sensible communion of the same sacred things… The question [Turretin addresses] is not whether the reprobate belong to the external state (which we do not deny)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, 3rd Question, ‘Besides the elect, are reprobates and infidels (whether secret or open) also true members of the church of Christ? We deny against the Romanists., p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-5e10d988a6" data-kw="">
<blockquote><p>I distinguish between the Church and her external polity: That which is essential to the Church’s being never ceases, but that which is essential to her outward polity may, because polity itself is not essential. The Church, for being, like Christ as God, never dies; but in her external order, like Christ as man, she dies and rises again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lazarus-seaman.html">Lazarus Seaman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Diatribe Proved to be Paradiatribe, or a Vindication of the Judgment of the Reformed Churches, and Protestant Divines, from misrepresentations concerning ordination and laying on of hands</cite>, ... (London: T.R., 1647), ‘Answer to the Tract bearing title, The Judgment of the Reformed Churches’, p. 49 Seaman (d. 1675) was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-02bfdf5044" data-kw="">
<blockquote><p>…whatsoever is wanting [lacking] of that which is commanded, or remaining of that which is forbidden, is not able to put that assembly, which by faith is laid upon Christ, from the right and title of being the Church of Christ: for faith can admit no such thing which gives an utter overthrow and turning upside down of the truth. By this title of ‘the faithful,’ the apostle in his epistles notes out the Churches of God, it being all one with him to say, ‘To the faithful,’ or ‘To the saints,’ as ‘To the Church’ of such a place. Whatsoever wants unto this, or is more than enough that wants, or abounds to the disgrace or uncomeliness or to the hazard of continuance, and not to the present overthrow of the Church. Hereupon the people of Israel, which neglected for the space of forty years the holy sacrament of circumcision and the Passover also as it seems (one only time excepted), ceased not therefore to be the Churches of God and to have the Sanctuary among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, (1584), pp. 7-8 in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

<main class="wrap"><figure class="quote" id="q-de54466b40" data-kw="">
<blockquote><p>Faith then is the hand and wheel which must frame a vessel for honor, prepared, as for all other, so for this work of marriage. And in truth, as it is all religion (upon point) so it is the marriage ring, which makes the soul one with the Lord; and this ring is beset with many rich jewels, all of them serving for the honor, that is, the well carrying and discharge of marriage duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matrimonial Honour (1642)</cite>, pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e81acd84b" data-kw="">
<blockquote><p>But then (say they) this makes things arbitrary and indifferent to become necessary. This is true: but you must conceive that a thing may be said to be necessary two ways: necessary in itself, and necessary in the outward submission to the use of it. In itself, a thing indifferent cannot be made necessary. It is always as it is by nature, and conscience informed must so judge it; yet in the outward use, for the peace of the Church, it may upon command become necessary. After the death of Christ, till the destruction of the temple, abstaining from things strangled and blood, circumcision, legal vows and purifyings were indifferent in themselves, (for else the apostles would not have used them so): yet for the peace of some churches they were judged necessary to be yielded in love; and so may it be in other things: yet the indifferent nature of things is not taken away, but the necessary use prescribed for the peace of the church, upon better grounds than that we should suffer ourselves to be unsettled from royal power [as in his day with the civil government instituting ceremonies].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25, Section 10, pp. 94-95 Abbot was a reformed Anglican.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

uting%20ceremonies&amp;text=But%20then%20%28say%20they%29%20this%20makes%20things%20arbitrary&amp;text=his%20day%20with%20the%20civil%20government%20instituting%20ceremonies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7fe5663de2" data-kw="">
<blockquote><p>I wonder [in response to an opponent] more in what capacity the magistrate can have to do with commanding and governing men, if not as they converse morally with men, and in their families, as fathers and sons, as masters and servants, and as Christians who both in private and public may perform duties to one another, or oppress one another; else the judge could not punish the rebellious son, the wicked servant, or the murdering father and the oppressing master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline penned by Mr. Thomas Hooker… (London, 1658), bk. 4, ch. 12</cite>, p. 488</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

— Samuel Rutherford, A Survey of the Survey of that Sum of Church Discipline penned by Mr. Thomas Hooker… (London, 1658), bk. 4, ch. 12, p. 488">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+wonder+%5Bin+response+to+an+opponent%5D+more+in+what+capacity+the+magistrate+can+have+to+do+with+commanding+and+governing+men%2C+if+not+as+they+converse+morally+with+men%2C+and+in+their+families%2C+as+fathers+and+sons%2C+as+masters+and+servants%2C+and+as+Christians+who+both+in+private+and+public+may+perform+duties+to+one+another%2C+or+oppress+one+another%3B+else+the+judge+could+not+punish+the+rebellious+son%2C+the+wicked+servant%2C+or+the+murdering+father+and+the+oppressing+master.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church+Discipline+penned+by+Mr.+Thomas+Hooker%E2%80%A6+%28London%2C+1658%29%2C+bk.+4%2C+ch.+12%2C+p.+488&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7fe5663de2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7fe5663de2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/family#:~:text=I%20wonder%20%5Bin%20response%20to%20an,murdering%20father%20and%20the%20oppressing%20master&amp;text=I%20wonder%20%5Bin%20response%20to%20an%20opponent%5D%20more&amp;text=or%20the%20murdering%20father%20and%20the%20oppressing%20master" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a45f6ee05b" data-kw="">
<blockquote><p>If it be asked, whether the consent of parents be essential to marriage? the common sentence will resolve it, Multa impediunt matrimonium contrahendum, quae non dirimunt contractum, so that consent is necessary, necessitate praecepti, sed non necessitate medii [by the necessity of precept, but not by a necessity of means]; though by human constitution such marriages may be disallowed, and the issue repute as unlawful, but the marriage cannot be annulled, l. 11. de stat. hom. l. 13 §. 6. de Adult, by which laws, not only the Issue of such marriages are excluded from succession, but the marriage itself insinuate to be null, which human constitutions cannot reach, though the magistrate or minister, celebrator of the marriage, may refuse to proceed without consent of the parents; as by the law and custom of Holland, Art. 3. Ord. Pol. It is statute that… where the parties are minor, they be not married without consent of their parents; and where they are both major, intimation must be made to the parents, and if they appear not, their consent is presumed; and if they do appear and dissent, they must condescend upon the reasons, that it may be cognosced whether they be sufficient or not: And if the marriage do otherways proceed, they account it null… neither do the civil constitutions of princes annul or dissolve marriage, whatever they may work as to the interest of the married persons… Yea, between Jews and Christians, for diversity of religion cannot annul it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Title 4, ‘Conjugal Obligations’ in The Institutions of the Law of Scotland Deduced from its Originals… (Edinburgh: Anderson, 1681), pp. 28-44</cite>, p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>Forbidden in the 2nd part, to worship images, to set them up, to gild them, or any manner of way to serve them, Mt. 4:10; Apoc. 19:20. Also here is forbidden all additions of sacraments, as the papists made matrimony, and so gave it a sign of the wedding ring, all additions unto them, 1 Cor. 11:13. All addition of ministries in the service of the Lord, as the papists added priests to sacrifice, exorcists to conjure, etc., Lk. 20:6; Jn. 1:21-23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise upon the First Table of the Law Orderly Disposing the Principles of Religion (1588), 2nd Commandment, no page number. Dudley was an English puritan.</cite></span></figcaption>

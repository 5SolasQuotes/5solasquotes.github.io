<main class="wrap"><figure class="quote" id="q-fbbb4fa4d8" data-kw="">
<blockquote><p>I often think of that prayer, Rom. 15. 5, 6. Now the God of patience and consolation, grant you to be likeminded one towards another according to Christ Jesus: that ye may with one mind and one mouth glorify God, even the Father of our Lord Jesus Christ. Why the God of all patience? Surely to imply, that unless God be pleased to beget mutual patience, and forbearance of one another in some things, Christians will never be like minded one towards another according to Christ Jesus; neither will our heavenly Father ever be glorified by all his own children, with one mind and one mouth, according to their duty.

In an Army, where the several Regiments are distinguished by several colours, yet all under command of one General, and engaged in one common cause, if the soldiers by reason of some diversity in their colours, should mistake one another for foes, and accordingly charge every one upon those of the Regiment next adjoining; how inevitable would the ruin of such an host of men be?

The Church of Christ is an Army with Banners, there always hath been, and will always be some variety of opinion even among the good Soldiers of Jesus Christ: But so long as they are all obedient to the known commands of the Captain General of their salvation (as the Scripture styles Christ) this variety should not engage them in the destruction of one another, lest thereby the Armies of the living God come to be destroyed, and preyed upon by the common enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), pp 41-42.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e67d319b43" data-kw="">
<blockquote><p>The daring attack that is now made by some of the directors of the Edinburgh and Glasgow Railway on the law of God and the peace of our Scottish Sabbath – the blasphemous motion which they mean to propose to the shareholders in February next – and the wicked pamphlets which are now being circulated in thousands, full of all manner of lies and impieties- call loudly for the calm, deliberate testimony of all faithful ministers and private Christians in behalf of God’s holy day. … (1) The keeping open of Reading-Rooms – In this town, and in all the large towns of Scotland, I am told, you may find in the public reading-rooms many of our men of business turning over the newspapers and magazines at all hours of the Lord’s day… (2) The keeping open Public-Houses – Public-houses are the curse of Scotland. I never see a sign, “Licensed to sell spirits,” without thinking that it is a licence to ruin souls. (3) Sunday Trains upon the Railway – A majority of the directors of the Edinburgh and Glasgow Railway have shown their determination, in a manner that has shocked all good men, to open the railway on the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘I Love the Lord’s Day’</cite>, (1841)</span></figcaption>

</figure><figure class="quote" id="q-183d7cc39f" data-kw="">
<blockquote><p>I do not know all the things that will happen when the great revival sweeps over the Church, the great revival for which we long. Certainly I do not know when that revival will come; its coming stands in the Spirit’s power. But about one thing that will happen when that blessing comes I think we can be fairly sure. When a great and true revival comes in the Church, the present miserable, feeble talk about avoidance of controversy on the part of the servants of Jesus Christ will all be swept away as with a mighty flood. A man who is really on fire with his message never talks in that feeble and compromising way, but proclaims the gospel plainly and boldly in the presence of every high thing that is lifted up against the gospel of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Facing the Facts Before God”</cite>, (1931).</span></figcaption>

</figure><figure class="quote" id="q-2e0d54db80" data-kw="">
<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, ... (London: 1653), on 2 Samuel, ch. 7, p. 390</span></figcaption>

<blockquote><p>2. To behave ourselves as those that do expect this help, not tempting God, not grieving the angels; We should take heed how we carry ourselves in regard of this honorable attendance; our sins and vanity offends them, as it does God… Angels are pure and holy creatures that still abode in the truth; pride, lust, and vanity is very offensive to them, especially impurities and undecencies in God’s worship, about which they have a special attendance; therefore the apostle bids the women to cover their heads because of the angels, 1 Cor. 11:10, their fashion being to come into the congregation with loose dishevelled locks, he minds them of the presence of the angels: We may use a like argument to women to cover their naked breasts, now their immodesty is grown so impudent as to out-face the ordinances of God.</p></blockquote>

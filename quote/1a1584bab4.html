<main class="wrap"><figure class="quote" id="q-1a1584bab4" data-kw="">
<blockquote><p>From these [Mt. 23:27; Lk. 13:34; Mk. 7:24; 14:35-36; Mt. 26:39] and other like passages, the Fathers in the Sixth General Council concluded against the heresy of the Monothelites [that Christ has only one will], and established the true doctrine of a twofold will in Christ, not contrary to themselves, but still subordinate the one unto the other, at least in the final issue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-creed.html">William Creed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>paragraphs 61-73</cite>, pp. 236-43 in sect. 13 in The Refuter Refuted, or Dr. [Henry] Hammond’s Ektenesteron Defended, against the impertinent cavils of Mr. Henry Jeanes... (London: Royston, 1660), p. 237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“From these [Mt. 23:27; Lk. 13:34; Mk. 7:24; 14:35-36; Mt. 26:39] and other like passages, the Fathers in the Sixth General Council concluded against the heresy of the Monothelites [that Christ has only one will], and established the true doctrine of a twofold will in Christ, not contrary to themselves, but still subordinate the one unto the other, at least in the final issue.”

— William Creed, paragraphs 61-73, pp. 236-43 in sect. 13 in The Refuter Refuted, or Dr. [Henry] Hammond’s Ektenesteron Defended, against the impertinent cavils of Mr. Henry Jeanes... (London: Royston, 1660), p. 237">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+these+%5BMt.+23%3A27%3B+Lk.+13%3A34%3B+Mk.+7%3A24%3B+14%3A35-36%3B+Mt.+26%3A39%5D+and+other+like+passages%2C+the+Fathers+in+the+Sixth+General+Council+concluded+against+the+heresy+of+the+Monothelites+%5Bthat+Christ+has+only+one+will%5D%2C+and+established+the+true+doctrine+of+a+twofold+will+in+Christ%2C+not+contrary+to+themselves%2C+but+still+subordinate+the+one+unto+the+other%2C+at+least+in+the+final+issue.%E2%80%9D%0A%0A%E2%80%94+William+Creed%2C+paragraphs+61-73%2C+pp.+236-43+in+sect.+13+in+The+Refuter+Refuted%2C+or+Dr.+%5BHenry%5D+Hammond%E2%80%99s+Ektenesteron+Defended%2C+against+the+impertinent+cavils+of+Mr.+Henry+Jeanes...+%28London%3A+Royston%2C+1660%29%2C+p.+237&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1a1584bab4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1a1584bab4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=From%20these%20%5BMt.%2023%3A27%3B%20Lk.%2013%3A34,at%20least%20in%20the%20final%20issue&amp;text=From%20these%20%5BMt.%2023%3A27%3B%20Lk.%2013%3A34%3B%20Mk.%207%3A24&amp;text=the%20other%2C%20at%20least%20in%20the%20final%20issue" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef4bec73dc" data-kw="will irresistible precept">
<blockquote><p>The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/decretive-and-preceptive-will.html">Decretive and preceptive will</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a> › <a href="../topics/attributes-of-god/will-of-god/secret-and-revealed-will.html">Secret and revealed will</a></span></div>
<div class="actions"><button class="copy" data-copy="“The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).”

— Francis Turretin, Institutes of Elenctic Theology, 3.15.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20decretive%20will%20relates%20to%20the%20futurition%20and%20the%20event%20of%20things%20and%20is%20the%20rule%20of%20God%E2%80%99s%20external%20acts%3B%20the%20preceptive%20is%20concerned%20with%20precepts%20and%20promises%20and%20is%20the%20rule%20of%20our%20action.%20The%20former%20cannot%20be%20resisted%20and%20is%20always%20fulfilled%3A%20%E2%80%9CWho%20hath%20resisted%20his%20will%3F%E2%80%9D%20%28Rom.%209%3A19%29.%20The%20latter%20is%20often%20violated%20by%20men%3A%20%E2%80%9CHow%20often%20would%20I%20have%20gathered%20you%20together%2C%20and%20ye%20would%20not%E2%80%9D%20%28Mt.%2023%3A37%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.15.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef4bec73dc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ef4bec73dc.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ce882a2742" data-kw="">
<blockquote><p>And this much touching the wisdom of God. Now follows concerning his will. … 2. Again the will of God is either absolute or conditional. … The conditional will of God is that by which God wills certain things, with a condition adjoined thereunto. And this is called the will of sign, because God does declare and manifest the same, both in precepts and prohibition, and also in promises, and threatenings, as it were by signs. It is also called the antecedent [that which comes before] will, because it goes before the reward or the punishment, that is propounded in the promises, or in the threatenings. By this, God will have all men to be saved and to come to the acknowledgment of truth [1 Tim. 2:4]: to with, if they believe the promises and preaching of the Gospel, and also obey the same. And therefore He calls and invites all men of all sorts and degrees (and therefore magistrates also) to the fellowship of salvation, and to the confession of the truth: yet he commands all to work their own salvation, and to come to the acknowledging of his truth, though all do it not. 1 Tim. 2:4. By this will Christ would have gathered together the Israelites, as a hen does her chickens, Lk. 13:34 to wit, unless they that were called had refused to come. This will is manifested, not by our conjectures, but only out of his word. And it is the square of all our works, and the perfect rule of all righteousness and holiness. Neither is this will of God dissembled or counterfeit, as though God commanded many things, which he would not: for example, when Gen. 22, He commanded Abraham to offer his son, and yet afterwards forbade it. Whatsoever God commands that He wills. So He commanded that Abraham should offer up his son, to wit, in will, in mind, and in appointing him for a burnt offering, for so God tried his faith and readiness to obey his commandments, and not that Abraham should indeed kill and slay his son Isaac, though Abraham did so understand the word of offering: and this the Lord Himself does sufficiently declare when in verse 12. He says, ‘Now I know and have tried that thou fearest God, seeing that thou hast not spared or withheld thy son even thy only son from me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, (London, 1600), pp. 11-16</span></figcaption>

</figure><figure class="quote" id="q-566fda3c78" data-kw="">
<blockquote><p>I. Although the will in God is only one and most simple, by which He comprehends all things by a single and most simple act that He sees and understands all things at one glance, yet because it is occupied differently about various objects, it thus happens that in our manner of conception, it may be apprehended as manifold (not in itself and intrinsically on the part of the act of willing, but extrinsically and objectively on the part of the things willed). … XVIII. There cannot be contrariety between these two wills because they do not will and nill the same thing in the same manner and respect… … XIX. Although God may be said to will the salvation of all by the will of sign and to nill it by the beneplacit will, yet there is no contradiction here….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, pp. 220-26</span></figcaption>

</figure><figure class="quote" id="q-a3d00f4a29" data-kw="">
<blockquote><p>voluntas Dei, ‘the will of God’ … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. 1</span></figcaption>

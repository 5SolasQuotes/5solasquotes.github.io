<main class="wrap"><figure class="quote" id="q-b278e3c6b7" data-kw="">
<blockquote><p>The third way whereby we must make right use to our selves of this judgement that we see upon others, is this; it must increase our care to reform (not our selves only, but) our families. It is a vain thing for any man to bless himself or take comfort in his repentance without this care; say not, if I use all good means to make peace with GOD for my self, I hope the faults of my family shall never be imputed unto me. Search the Scriptures, and you shall find there was never any man that was himself reconciled and at peace with GOD, but his care was, that his family might fear GOD, and be in favour with Him, as well as himself.

Cornelius (though he were a Centurion, and kept a great family, and had souldiers to serve him, yet) feared God with all his house, Acts 10. 2. So soon as Zacchaeus himself was become a son of Abraham (a true believer) salvation came unto his house too, Luke 19. 9. Christ promised he should have a faithful and a religious family. So speaketh Eliphaz also to Job, Job 22. 23. If thou return to the Almighty, thou shalt be built up, thou shalt put away iniquity far from thy tabernacles.

No man that is himself truly returned unto the Almighty, need to be discouraged in this; if he do his endeavour, God hath promised, that he shall be able (through His gracious assistance and blessing) to reform his family; though not to convert the heart of every one in it, yet to keep them from open and scandalous offences. Certainly we do not make the right use we ought, of this heavy scourge of God, unless we be made thereby more careful to reform our families.

For this cause the Lord said He would not conceal from Abraham His purpose against the Sodomites, because He knew that he would make this use of it. For I know him (saith the Lord, Gen. 18. 19.) that he will command his children, and his household after him; and they shall keep the way of the Lord to do justice and judgement; that the Lord may bring upon Abraham that which He hath spoken of him.

1. Abraham (upon the knowledge and observation of God’s wrath even upon the Sodomites) would become more careful to look to his whole family, and to reform it. 2. God would assist and bless him in this his endeavour, and he should see the fruit of it in his family. 3. This care that Abraham had of his family should be a principal means to make good unto him all God’s promises, to bring upon him, and make sure unto him all the blessings and good things that God had promised unto him, and without this he could have had no assurance of them.

O that we could once believe and take to heart these things. Certainly one main cause of this, and all other judgements that are upon our Land, is the want of care that is in them that profess themselves to be the people of God, in reforming their families; whether they of their family be drunkards, or sober persons; blasphemers, or such as fear an oath; unclean, or chaste; profane, or religious; is all one to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of fasting and prayer, and humiliation for sin. Delivered in sundry sermons at the fast appointed by publique authority, in the year 1625</cite>, (London: Edward Brewster, 1633), pp 23-24.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0799281407" data-kw="">
<blockquote><p>We firmly believe Christ’s nativity, against the Jews.

The confirmation is twofold. The first out of the Prophets: because the places in which he should be born &amp; educated, in which he should teach and suffer are wasted; and the time is past, in which according to Prophetical oracles he was to come. For he was to be borne in Bethlehem, Mich. 5.2 to be educated in Nazareth, Esa. 11.1. and to enter Jerusalem while the second Temple stood, Zach. 9.9. Hag. 2.7, 9. and that when the fourth Monarchy was abolished; Dan. 2.44. the Scepter not being totally departed from the Jews, Gen. 49.10.

But Bethlehem, Nazareth, Jerusalem and the second Temple are long since destroyed, that fourth Monarchy is abolished, and the Scepter totally departed from Judah: the Messiah then is doubtless come. The second confirmation, is taken from the agreement of Luke’s Evangelical History concerning Christ his nativity, with the prophetical oracles concerning the time of the Messiah’s coming, Gen. 49.10. of his Pedegree Jer. 23.5. of the Virgin his mother, Esa. 7.14. of his Country, Mich. 5.2. Lastly concerning his condition, Esa 53.2.

II The Nativity (to speak properly) is not of the humanity, but of the man Christ; not of the nature but of the person.

III. There be two generations of the Son: the one eternal, to wit of the Father; the other temporal, namely of the Virgin his mother. There be also two filiations or Sonships; by the one whereof he is the Son of the Father, by the other the Son of Mary.

IV. Yet we must not say there is a double Son or two Sons; for he is not two Persons, but one Person and two Natures.

V. Therefore Mary is to be named not only the Mother of Christ, with Nestorians; but also the mother of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), pp 127-28.</span></figcaption>

</figure><figure class="quote" id="q-dba7f99092" data-kw="">
<blockquote><p>But some out of a peaceable inclination, designing the reconciling Rome and us in one, or at least not so far to offend that party, as if Rome were to be complemented and obliged thereby to favour our cause or persons the more, were we in their power.

Whereas by such our connivance and silence, not speaking out what is truth, that Rome is Babylon, the Pope Antichrist; and that communion there is dangerous to some, and to others damnable, and by our tender forbearance in this, Popery and that Church doth pass for Catholic, Ancient, Holy, and the very way to Salvation. Whereby not few have been seduced and drawn away from the Truth professed, as others may be, who hear of nothing to the contrary; thereby are also those of that communion fastened there, they being confirmed by this our silence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jones.html">Henry Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of antichrist preached at Christ-Church, Dublin, Novemb. 12, 1676. By the Right Reverend Father in God, HENRY, Lord Bishop of MEATH.</cite>, (2nd edn, London: Nathaniel Ponder, 1679), epistle to the reader.</span></figcaption>

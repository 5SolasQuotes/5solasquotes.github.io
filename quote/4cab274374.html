<blockquote><p>…for it is a greater obligation for pastors to subject men to divine wrath, if they receive not what they preach, than for synods to bind them only to ecclesiastical censures; and yet none can say that Pastors exercise tyranny over the conscience [because what they preach is God’s Word]…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47c8ab8f0f" data-kw="">
<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 3rd Distinction. Public preaching, as it is the ordinary mean of saving such as believe, is proper and peculiar to the Church, both subjectively, as being only in the Church, and objectively as being only exercised on the Church members per se, but upon pagans by accident. 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are. 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another; 4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office. 5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Pt. 2, p. 272</span></figcaption>

<blockquote><p>2. It is not said that deacons were ordained with fasting and prayer, Acts 6, as the elders are chosen in every Church, Acts 14:23, and as hands are laid upon Paul and Barnabas; Acts 13:3-4, but simply that the apostles, Acts 6:6, prayed and laid their hands on them. Which seemeth to me to be nothing but a sign of praying over the deacons, and no ceremony or sacrament conferring on them the Holy Ghost: And Steven his working of miracles, and speaking with wisdom irresistible was but the fruit of that grace and extraordinary measure of the Holy Ghost abundantly poured forth on all ranks of persons in those days when the prophecy of Joel was now taking its accomplishment; Acts 2:16-19; Joel 2:28-29. which grace was in Steven before he was ordained a deacon by the laying on of hands. Acts 6:3-5. And the Text saith not that Steven did wonders and signs amongst the people by virtue of imposition of hands, or of his deaconry, but because he was full of faith and power. v. 8, else you must make working of miracles a gift bestowed on all those who serve tables, and are not to give themselves to continual praying and the ministry of the Word. I think papists will not say so much of all their priests; and we can say it of none of our pastors, nor doth Chysostom say that Steven, as a deacon, and by virtue of the office of a deacon wrought miracles, but only that his miracles and disputing was a mere consequent of laying on of hands. Further, laying on of hands was taken from the custom of blessing amongst the Jews, Christ laid his hands upon young children and blessed them, yet did he not, thereby, design them to any office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Part 1, ch. 7, section 7, ‘Of Deacons’, pp. 169-70</span></figcaption>

</figure><figure class="quote" id="q-c5f1d6f9a6" data-kw="">
<blockquote><p>Answer. Suppose in this or that Church all the ministers should die, yet it follows not that a ministry can utterly fail in the Church: It is contrary to Eph. 4:11 and to the perpetuity of Christ’s kingly government and throne, which shall endure as the days of heaven: And what if God extraordinarily supply the want of ordination in this or that particular church? A ministerial power is conferred in that case immediately upon some in a Church removed from any Church-consociation from other Churches, and so Christ’s ministerial power dies not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), p. 269</span></figcaption>

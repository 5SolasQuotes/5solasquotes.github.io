<main class="wrap"><figure class="quote" id="q-2e8b168620" data-kw="">
<blockquote><p>V. Religion should be cared for by all, chiefly be Magistrates and Ministers. For they are the Churches nursing Fathers, by preserving Schools and Churches, and by maintaining of Ministers, &amp;c.

[…]

IX. Religion may be defended by arms but not propagated by arms.

Examples of pious Kings, the Maccabees, Emperors as Constantine and Theodosius shew this.

X. Reformation of things amiss in Religon, belong to the prince or Magistrate.

After the examples of Moses, Joshua, David, Asa, Jehosaphat, Hezekiah, Josiah, Constantine, Theodosius, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), pp 330-1, 333.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd434c5b45" data-kw="">
<blockquote><p>IN the year 1521 and the year ensuing, there arose a certain number of mutinous and seditious persons, who secretly made Factions: they chiefly dwelt in the quarters of Saxony, which bordered upon the River Salah; among whom their chief was Nicholas Stork.

They dreamed dreams, and said, That they spake familiarly with God by Visions, they preached their dreams for truths and Divine Oracles; and because that there should come a new world, wherein should dwell righteousness: Therefore they ought to exterminate all the wicked, with all the Princes and unbelieving Magistrates, from off the earth (they called all those unbelievers which were not of their Sect and Faction.)

From out of this School came Thomas Muntzer, Dr. Balthazar Hubmore, Melchior Rink, John Hutt, John Deuter, Lodovike Hetzer, &amp;c. All these boasted that they familiarly conferred with the Lord. In their teachings, they with heat of affection did defame and detract from the Ministers of the Gospel: afterward with the like violence fell upon the Magistrate, thinking that if they could make void these two Orders unto the Church, the wolves might safely fall upon and dismember the Flock; wherefore these wolves, (i. e.) these false Teachers, have always principally set themselves against the Ministers of the Church, and the Magistrates, to see if they could drive them out from the Flock, or at least disgust some of the sheep against their Pastors; that so estranging them from them, they might undo them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, spring and foundation of the Anabaptists, or re-baptized of our time</cite>, trans. Joshua Scottow (1565; Cambridge MA: Marmaduke Johnson, 1668), pp 1-2.</span></figcaption>

</figure><figure class="quote" id="q-301897e599" data-kw="">
<blockquote><p>For such a man shows his profligacy in everything so that everyone readily recognizes the life of the profligate and the life of the pure man by what is valued in each one’s household. In the house of the one there are frescoes on the wall which by their artful pictures inflame the sensual passions. These things bring out the nature of the illness, and through the eye passion pours in upon the soul from the dishonorable things which are seen. But in the house of the prudent man there is every precaution and foresight to keep the eye pure from sensual spectacles.</p></blockquote>

</figure><figure class="quote" id="q-dd27223d60" data-kw="">
<blockquote><p>Question 9: Is a man ever bound to accuse himself, and seek justice against himself? Answer 1: In many cases a man is bound to punish himself: As when the law against swearing, cursing or the like, does give the poor a certain mulct [fine] which is the penalty: He ought to give that money himself: And in cases where it is a necessary cure to himself: And in any case where the public good requires it: As if a magistrate offend whom none else will punish, or who is the judge in his own cause: he should so far punish himself as is necessary to the suppression of sin, and to the preserving of the honor of the laws: As I have heard of a justice that swore twenty oaths, and paid his twenty shillings for it.

2. A man may be bound in such a divine vengeance or judgment as seeks after his particular sin, to offer himself to be a sacrifice to justice, to stop the judgement: As Jonah and Achan did.

3. A man may be bound to confess his guilt and offer himself to justice to save the innocent, who is falsely accused and condemned for his crime.

4. But in ordinary cases a man is not bound to be his own public accuser or executioner. Question 10: May a witness voluntarily speak that truth which he knows will further an unrighteous cause, and be made use of to oppress the innocent? Answer: He may never do it as a confederate in that intention: Nor may he do it when he knows that it will tend to such an event (though threatened or commanded) except when some weightier accident does preponderate for the doing it (as the avoiding of a greater hurt to others than it will bring on the oppressed, etc.). Question 11: May a witness conceal some part of the truth? Answer: Not when he swears to deliver the whole truth: nor when a good cause is like[ly] to suffer, or a bad cause to be furthered by the concealment: nor when he is under any other obligation to reveal the whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Ecclesiastical judgment is spiritual, in distinction from that which is civil or secular. The government of the church and the government of the state, with the judgment which is competent to those who respectively administer them, differ widely from one another.

They differ in their origin. Both indeed are derived from God, who is the original fountain of all authority and justice. But civil government is from God as Creator; ecclesiastical government from Christ as Mediator. The former holds of him as King of nations, the latter as King of saints. The law of nature, written on the hearts of all men, is sufficient to direct in all that is essential to the former; the latter is founded on the law supernaturally revealed in the scriptures. Civil magistrates and judges are “the ministers of God;” ecclesiastical rulers are “the ministers of Christ,” and pronounce judgment in his name, or by his authority. “Jesus said, All power is given unto me in heaven and in earth.”

They differ in their objects. Civil judgment is pronounced on things that pertain to this life and the external man—his property, his life, his liberty, or his good name; ecclesiastical judgment, on things that pertain to the welfare of the soul and to the life to come. If the former has to do with religious matters, it is either upon the ground that religion in general is conducive to the welfare of secular society, or because particular religious acts interfere with civil rights; if the latter have to do with civil matters, it is only in so far as they relate to the conscience. If at any time the same actions, materially considered, fall under the cognizance of both jurisdictions, as in the case of theft or murder, the formal light in which they are judged by each is different; the secular judicatory proceeds against them as crimes, which injure civil society; the ecclesiastical as scandals, which mar the purity of the church.

They differ in their ends. The end of secular judgment, in subordination to the glory of God, is the external peace and temporal prosperity of men, or, as the apostle expresses it, “that we may live quiet and peaceable lives in all godliness and honesty.” The end of ecclesiastical judgment, in subordination to the glory of God by Christ, is the promoting of the spiritual and eternal interests of man, or, in the words of the same apostle, “that the spirit may be saved in the day of the Lord Jesus.”

They differ, so far as their subjects are concerned, in their extent. Civil judgment extends to all who belong to the commonwealth; spiritual judgment is confined to those who have been embodied into a church state.

They differ in their sanctions, and in the means which they employ to accomplish their ends. Civil authority is supported by the power of the sword, ecclesiastical authority by the power of the word, or, as it is sometimes designed, of “the keys.” By the former, judgment is executed on the delinquent, according to the nature of his crime, to imprisonment, banishment, confiscation of goods, or death; by the latter, judgment is executed on the offender to admonition, rebuke, suspension from sealing ordinances, or excommunication.

In fine, even when the same offences fall under the cognizance of both judicatures, the issue may be different. The ecclesiastical judges may pronounce the highest spiritual sentence against one whom the secular authorities, in the exercise of prudent policy, may spare; and the latter may inflict capital punishment on an individual whom the former may receive and absolve at the last hour, as in the case of a penitent murderer or traitor.

From these premises it follows, that, as there is an exercise of judgment in the church essentially distinct from that which is civil and criminal in the state; so, on the one hand, the two jurisdictions, so far from being inconsistent with one another, are fitted for being mutually helpful in the advancement of objects common to both; and, on the other hand, the ecclesiastical judicature, not being derived from the secular, is not subordinate to it, and is equally competent and necessary under Christian and Heathen rulers.

<div class="actions"><button class="copy" data-copy="“Ecclesiastical judgment is spiritual, in distinction from that which is civil or secular. The government of the church and the government of the state, with the judgment which is competent to those who respectively administer them, differ widely from one another.

They differ in their origin. Both indeed are derived from God, who is the original fountain of all authority and justice. But civil government is from God as Creator; ecclesiastical government from Christ as Mediator. The former holds of him as King of nations, the latter as King of saints. The law of nature, written on the hearts of all men, is sufficient to direct in all that is essential to the former; the latter is founded on the law supernaturally revealed in the scriptures. Civil magistrates and judges are “the ministers of God;” ecclesiastical rulers are “the ministers of Christ,” and pronounce judgment in his name, or by his authority. “Jesus said, All power is given unto me in heaven and in earth.”

They differ in their objects. Civil judgment is pronounced on things that pertain to this life and the external man—his property, his life, his liberty, or his good name; ecclesiastical judgment, on things that pertain to the welfare of the soul and to the life to come. If the former has to do with religious matters, it is either upon the ground that religion in general is conducive to the welfare of secular society, or because particular religious acts interfere with civil rights; if the latter have to do with civil matters, it is only in so far as they relate to the conscience. If at any time the same actions, materially considered, fall under the cognizance of both jurisdictions, as in the case of theft or murder, the formal light in which they are judged by each is different; the secular judicatory proceeds against them as crimes, which injure civil society; the ecclesiastical as scandals, which mar the purity of the church.

They differ in their ends. The end of secular judgment, in subordination to the glory of God, is the external peace and temporal prosperity of men, or, as the apostle expresses it, “that we may live quiet and peaceable lives in all godliness and honesty.” The end of ecclesiastical judgment, in subordination to the glory of God by Christ, is the promoting of the spiritual and eternal interests of man, or, in the words of the same apostle, “that the spirit may be saved in the day of the Lord Jesus.”

They differ, so far as their subjects are concerned, in their extent. Civil judgment extends to all who belong to the commonwealth; spiritual judgment is confined to those who have been embodied into a church state.

They differ in their sanctions, and in the means which they employ to accomplish their ends. Civil authority is supported by the power of the sword, ecclesiastical authority by the power of the word, or, as it is sometimes designed, of “the keys.” By the former, judgment is executed on the delinquent, according to the nature of his crime, to imprisonment, banishment, confiscation of goods, or death; by the latter, judgment is executed on the offender to admonition, rebuke, suspension from sealing ordinances, or excommunication.

Even during the Jewish dispensation, under which civil and religious matters were more intimately conjoined than under the Christian, the two jurisdictions were kept distinct. A line of demarcation between the office of the civil judge, and that of the priest, was laid down in the Mosaic code; and in the arrangements “for the judgment of the Lord, and for controversies,” made in the days of the reforming Jehoshaphat, we find Amariah the high priest appointed as president “in all matters of the Lord,” and Zebadiah, the ruler of the house of Judah, “for all the king’s matters.”

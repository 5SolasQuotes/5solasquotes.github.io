<main class="wrap"><figure class="quote" id="q-61eea66ae6" data-kw="">
<blockquote><p>Therefore there is no binding men’s faith to that the Scripture avers not. The Papists do bind to things:

1. Citra fundamentum, besides the foundation; as traditions, untempered mortar daubed on the walls of truth to hide it.

2. Circa fundamentum, to things about the foundation, such as endanger it: as denial of Scripture to laymen. This is a wretched sin, to obtrude for matter of faith, that it is not lawful to read the Scriptures which are the rule of faith.

3. Contra fundamentum, to things against the foundation; as the sacrifice of the mass, distinction of mortal and venial sins, justification by works, etc. What is against that which is necessarily to be believed to salvation, is against the foundation. But it is necessary to trust in Christ’s blood and merits only, because there is no other name given under heaven whereby we may be saved. (Acts 4:12) Therefore to trust in others, to let angels or men share part of our faiths, is against the foundation. Indeed they boast that they only hold the foundation: but ‘I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing.’ (Gal. 5:2) If you join your own merits with Christ’s merits, he shall profit you nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition upon the divine Second Epistle General, written by the blessed Apostle St. Peter</cite>, (London: Badger, 1633), on ch. 1, verse 5, p. 110</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

booksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=Therefore%20there%20is%20no%20binding%20men%E2%80%99s,merits%2C%20he%20shall%20profit%20you%20nothing&amp;text=Therefore%20there%20is%20no%20binding%20men%E2%80%99s%20faith%20to&amp;text=with%20Christ%E2%80%99s%20merits%2C%20he%20shall%20profit%20you%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ca5bdad230" data-kw="">
<blockquote><p>We must therefore know, it is not every seperation from that which is called a Church that is a note of an Antichristian spirit, but it must be known whether that were the true Church; now this Church St. John speaks of was the true Church, for it was from such whose sins were forgiven; now if it be not a true Church that they break from, it is no sign of Antichrist: 2 Chron. 11:16, such as set their hearts to seek the Lord, separated themselves from those that followed Jeroboam, and came to Jerusalem; so the apostles were fain to seperate from the Church of the Jews which persecuted Christ, and them, and so constituted a Church by themselves, a Christian Church; so then it is not a seperation from a false Church, but a true, that is a sign of an Antichristian spirit. … Use 2. It may teach us what to judge of the Separatists, or Brownists, are they of Antichrist? Surely their practise is blame-worthy:

1. Because they seperate, where Christ keeps fellowship, Rev. 1:18; and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? If they be converted, where had they their conversion?

2. Have not many of God’s servants heretofore kept company with Churches as corrupt as ours are? Did not Peter and John keep company with them and shall they be more pure and curious?

3. Christ commands: ‘If thy brother offends admonish him; if he hear thee not, take two or three more; if he hear not them, then tell it to the Church, and if he hear not the Church, let him be to thee as an heathen, or publican;’ (Mt. 18:17) but if the church hear not thy complaint, He does not say let the church be as an heathen, or publican;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary</cite>, (London: Parkhurst, 1658), on 1 Jn. 2:19, pp. 155-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

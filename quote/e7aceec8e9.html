<blockquote><p>In his interaction with John Cotton of New England, William Twisse argued that the heathens, who had neither access to the written law nor the gospel, would be judged according to the law of nature. He also expressed his disagreement with the Arminian concept of infant salvation:

As for that which followeth therein, I doe most willingly and freely concur with you, acknowledging that God condemns none for not believing in Christ, of whom they had not heard; nor for transgressing the Law of Moses, which they had not received; but only for sinning against the Law of nature, which was written in their hearts: For I verily believe, that where there is no Law, there is no transgression. But, I presume, you deliver this only in reference to men of ripe years, and do not concur with Arminians, in maintaining that all infants dying in their infancy are saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), pp 80-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b70c1d282f" data-kw="">
<blockquote><p>Primo Adami there was a government instituted by God immediately, of universal peace, civil, national, domestical, spiritual, corporal peace, nothing but peace, peace; yet Adam and Eve there, as Achan here, took but one bit of the excommunicated thing, that God had specially reserved, and thereby became Achans, troublers of all the peace public, so that he made himself and all the world anathema, an accursed thing thereby. After, when peace begun to be restored, and religion repaired in the Family of Seth, the sons of God offended in the execrable thing in marrying the Daughters of excommunicate Cain, and so not only disturbed, but brought ruin and destruction upon the whole World, Gen. 6. v. 2, 7.

When that great Law-giver Moses, with Laws judicial, moral and also Ceremonial, to tally divine, had settled the glory and peace of the Church, and Common-wealth of Israel, the people offending in the accursed thing of the Golden Calf, so disturbed all that notwithstanding Law and Government also, they were like to be consumed as one man and wholly extirpated, Exod. 32. Saul was a Monarch anointed of God himself, 2. Sam. 1. 15. elected by the vehement desire of all the subjects, yet offending in the execrable thing of Agag, reserving but one person which God had destinated to utter destruction, utterly ruinated his Government, and posterity. Solomon the Prince of peace, that had a Patent of peace, 1. Kings. 11. 11. and such skill in Governments as never any Monarch before him, or after him shall attain, yet by offending in the execrable thing of Chemosh and Milcom disturbed the peace public, and made such a rent in his Kingdom, as could never after be repaired.

Machiavelli himself in his Book De Repub: gives us one ground for this, whilst persuading Kings, above all things, if they mean to maintain obedience of their subjects to themselves, and peace one with another, to possess them with reverence of divine things, and fear of divine vengeance, as well as terror of human penalty: for, saith he, whosoever makes no scruples, to neglect or offend against these, will make much less, when occasion is offered, to plot sedition, to accommodate themselves to changes, to practice Treason, though to the utter overthrow of the whole Government. And surely he that is so loose conscience, and desperate, that he fears not with Achan to offend in the Babylonish Garment, though he doth thereby incur, and expose himself to the curse of the King of Heaven, hath no banks, or bonds to restrain him when occasion is offered, to ruin others, to disturb and trouble Church and Commonwealth, and to turn Traitor to the best established Government, or Governors on the Earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-fairclough.html">Samuel Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The troublers troubled, or, Achan condemned and executed. A sermon preached before sundry of the honourable House of Commons at Westminster, April 4, 1641</cite>, (London: Henry Overton, 1641), pp 6-7.</span></figcaption>

<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the [Scottish, civil] indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 139</span></figcaption>

</figure><figure class="quote" id="q-e49b6da69f" data-kw="">
<blockquote><p>Monogamy is a distinctive aspect of the Christian tradition. Polygamy existed in most ancient societies, but Christian authorities opposed the practice, in part to distinguish monogamous Christianity from other faiths. By the early modern period, polygamy was rare in Christian Europe, and it had gained a negative reputation because of its association with sexual excess and lust. During the Reformation, however, certain individuals, including Luther himself, condoned polygamy, and Lutheran doctrine was compatible with plural marriage in some ways. After an ill-fated attempt [by Anabaptists] to establish a polygamous community at Munster, however, it became much more difficult to support polygamy, as the practice was further tainted by association with religious radicalism and lustful, degenerate behavior. During the English Revolution, the downfall of censorship and the tumultuous political climate allowed some English authors to write in support of plural marriage, using both practical and religious arguments. Yet, the majority of authors condemned the practice. Plural marriage continued to be associated with pagan and barbaric culture, and accusations of polygamy were used to undermine and discredit one’s enemies. In the literature of travel and colonisation, accusations of polygamy were used to demean and vilify peoples such as Jews and Turks. The existence of polygamy in Europe’s colonies helped Christian Europeans to maintain a sense of superiority over the pagan, barbaric indigenous inhabitants and helped to establish a shared European and Christian identity. In the writings of the Reformation and the Revolution, along with the literature of travel and colonisation, polygamy became a boundary marker between Christians and non-Christians, Catholics and Protestants, radicals and non-radicals, civilised countries and barbaric countries, and England and its colonies. Polygamy’s function as a boundary marker, more than any theological reasons, was the reason why plural marriage did not gain significant support in early modern England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lisa-loughead.html">Lisa Loughead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perception of Polygamy in Early Modern England MA thesis</cite>, (Nova Scotia: Dalhousie University, 2008) 150 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“Monogamy is a distinctive aspect of the Christian tradition. Polygamy existed in most ancient societies, but Christian authorities opposed the practice, in part to distinguish monogamous Christianity from other faiths. By the early modern period, polygamy was rare in Christian Europe, and it had gained a negative reputation because of its association with sexual excess and lust. During the Reformation, however, certain individuals, including Luther himself, condoned polygamy, and Lutheran doctrine was compatible with plural marriage in some ways. After an ill-fated attempt [by Anabaptists] to establish a polygamous community at Munster, however, it became much more difficult to support polygamy, as the practice was further tainted by association with religious radicalism and lustful, degenerate behavior. During the English Revolution, the downfall of censorship and the tumultuous political climate allowed some English authors to write in support of plural marriage, using both practical and religious arguments. Yet, the majority of authors condemned the practice. Plural marriage continued to be associated with pagan and barbaric culture, and accusations of polygamy were used to undermine and discredit one’s enemies. In the literature of travel and colonisation, accusations of polygamy were used to demean and vilify peoples such as Jews and Turks. The existence of polygamy in Europe’s colonies helped Christian Europeans to maintain a sense of superiority over the pagan, barbaric indigenous inhabitants and helped to establish a shared European and Christian identity. In the writings of the Reformation and the Revolution, along with the literature of travel and colonisation, polygamy became a boundary marker between Christians and non-Christians, Catholics and Protestants, radicals and non-radicals, civilised countries and barbaric countries, and England and its colonies. Polygamy’s function as a boundary marker, more than any theological reasons, was the reason why plural marriage did not gain significant support in early modern England.”

— Lisa Loughead, The Perception of Polygamy in Early Modern England MA thesis, (Nova Scotia: Dalhousie University, 2008) 150 pp.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMonogamy+is+a+distinctive+aspect+of+the+Christian+tradition.+Polygamy+existed+in+most+ancient+societies%2C+but+Christian+authorities+opposed+the+practice%2C+in+part+to+distinguish+monogamous+Christianity+from+other+faiths.+By+the+early+modern+period%2C+polygamy+was+rare+in+Christian+Europe%2C+and+it+had+gained+a+negative+reputation+because+of+its+association+with+sexual+excess+and+lust.+During+the+Reformation%2C+however%2C+certain+individuals%2C+including+Luther+himself%2C+condoned+polygamy%2C+and+Lutheran+doctrine+was+compatible+with+plural+marriage+in+some+ways.+After+an+ill-fated+attempt+%5Bby+Anabaptists%5D+to+establish+a+polygamous+community+at+Munster%2C+however%2C+it+became+much+more+difficult+to+support+polygamy%2C+as+the+practice+was+further+tainted+by+association+with+religious+radicalism+and+lustful%2C+degenerate+behavior.+During+the+English+Revolution%2C+the+downfall+of+censorship+and+the+tumultuous+political+climate+allowed+some+English+authors+to+write+in+support+of+plural+marriage%2C+using+both+practical+and+religious+arguments.+Yet%2C+the+majority+of+authors+condemned+the+practice.+Plural+marriage+continued+to+be+associated+with+pagan+and+barbaric+culture%2C+and+accusations+of+polygamy+were+used+to+undermine+and+discredit+one%E2%80%99s+enemies.+In+the+literature+of+travel+and+colonisation%2C+accusations+of+polygamy+were+used+to+demean+and+vilify+peoples+such+as+Jews+and+Turks.+The+existence+of+polygamy+in+Europe%E2%80%99s+colonies+helped+Christian+Europeans+to+maintain+a+sense+of+superiority+over+the+pagan%2C+barbaric+indigenous+inhabitants+and+helped+to+establish+a+shared+European+and+Christian+identity.+In+the+writings+of+the+Reformation+and+the+Revolution%2C+along+with+the+literature+of+travel+and+colonisation%2C+polygamy+became+a+boundary+marker+between+Christians+and+non-Christians%2C+Catholics+and+Protestants%2C+radicals+and+non-radicals%2C+civilised+countries+and+barbaric+countries%2C+and+England+and+its+colonies.+Polygamy%E2%80%99s+function+as+a+boundary+marker%2C+more+than+any+theological+reasons%2C+was+the+reason+why+plural+marriage+did+not+gain+significant+support+in+early+modern+England.%E2%80%9D%0A%0A%E2%80%94+Lisa+Loughead%2C+The+Perception+of+Polygamy+in+Early+Modern+England+MA+thesis%2C+%28Nova+Scotia%3A+Dalhousie+University%2C+2008%29+150+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe49b6da69f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e49b6da69f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-polygamy/#:~:text=Monogamy%20is%20a%20distinctive%20aspect%20of,significant%20support%20in%20early%20modern%20England&amp;text=Monogamy%20is%20a%20distinctive%20aspect%20of%20the%20Christian&amp;text=not%20gain%20significant%20support%20in%20early%20modern%20England" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. They [the Jerusalem Church] were under a tie by due proportion, not to keep the Law of Moses and not to be circumcised by any necessity of a Divine Law, but only by permission to use these ceremonies for fear of scandal.

3. They are tied by proportion also to give no offence in things indifferent.

4. Not to reject the gentiles whom the Lord had called to his heavenly kingdom as well as the Jews.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ac344361c5" data-kw="">
<blockquote><p>III. On the statement of the question take notice: (1) acts of divine worship are twofold, some which do not differ form the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded by God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the Church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the Church has no control or power over them; the latter God has thus far left to the will of the Church as means and indifferent, so that a regard be always paid to divine truth, Christian simplicity and public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, vol. 3, 18th Topic, Question 31, section III</cite>, p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4184c61452" data-kw="">
<blockquote><p>…that which these and the like [Scripture] testimonies unanimously speak unto us, is this, that the will of God is the sole rule of his worship, and all the concernment of it, and that his authority is the sole principle and cause of the relation of any thing to his worship, in a religious manner; and consequently that He never did, nor ever will allow that the wills of his creatures should be the rule or measure of his honor or worship, nor that their authority should cause any thing to hold a new relation unto Him, or any other but what it has by the law of its creation. As this is the sum and substance of the Second Commandment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Liturgies &amp; their Imposition (London, 1662), ch. 7</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-0b0c748459" data-kw="">
<blockquote><p>This is one main principle of the doctrine we profess (against the forged superstitions of the Papists) that we undertake no work in the things which appertain unto worship concerning which we have not an express commaund of God: No man can boast of the performance of any worship unless he be wholly as it were clothed and confined within the compass of the Word.</p></blockquote>

</figure><figure class="quote" id="q-07e45058e2" data-kw="">
<blockquote><p>…there is also required, that we have Him outwardly in our bodies and external actions; and that is, when as with the outward man we serve and worship Him. The which also we owe unto God, seeing He has created and redeemed both our souls and bodies, that we should in both perform service unto Him…. the Lord require it with the other, and that with the sweet incense of the heart and mind, we offer our bodies also a living sacrifice, holy and acceptable unto Him [Rom. 12:1-2]… Our Sauior also requires, not only that we have in us the heat of spiritual graces, but that also that we cause their light to shine out before men, that they seeing our good works, may glorify our Father which is in heaven… Now this external honour is either in outward signs or actions… Of the other sort is the outward service of God, in calling upon Him, vowing unto Him, swearing by his Name, celebrating feasts to his honor, and all outward obedience to the Law, which, in respect of the person to whom they are to be performed, namely, God alone and no other, are all required in the First Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness, or a Treatise of a Christian Life... (London: Kingstone, 1622), bk. 2, ch. 6, section 7, ‘Of External Worship with our Bodies’</cite>, pp. 122-23</span></figcaption>

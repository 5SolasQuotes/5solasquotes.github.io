<blockquote><p>I appeal to the conscience of every Christian, whether we (avoiding the occasion of idolatry) tend any whit to paganism, as the Papists by their devices do, or whether we (by removing all images, and consequently the cross too) do derogate from Christ and from His passion as they do, which, having the material cross, cannot come to the knowledge and faith of The Crucified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-calfhill.html">James Calfhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to John Martiall’s ‘Treatise of the Cross’, ‘To the Reader’</cite>, p. 51</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-447a4bfa17" data-kw="">
<blockquote><p>Too high an estimation of any peculiar way of worship is apt to entice the minds of some into a hurtful confidence in these things. Having an apprehension that they alone have attained unto the right way of gospel worship and the administration of its ordinances, and that, perhaps, on such accounts as wherein they are eminently deceived, they begin first greatly to value themselves, and then to despise all others, and, if they can, to persecute them. This insensibly works them into a trust in that which they esteem so excellent, and that unto an open neglect of things of a greater weight and moment. Thus is it not unusual to see persons who are under the power of some singular opinion and practice in religion to make one thing almost their whole business, the measure of other things and persons, the rule of communion and of all sincere love;—to value and esteem themselves and others according unto their embracing or not embracing of that opinion… Wherefore, although we ought greatly to prize and to endeavour after the true order of the church of Christ, the purity of worship, and regular administration of ordinances, yet let us take heed that we prize not ourselves too much on what we have attained; for if we do so, we shall be very apt to countenance ourselves in other neglects thereby, which will certainly bring us into a spiritual sickness and declension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, (NY: Robert Carter, 1852), vol. 7, Nature &amp; Causes of Apostasy from the Gospel, ch. 12, pp. 252-53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=Too%20high%20an%20estimation%20of%20any,into%20a%20spiritual%20sickness%20and%20declension&amp;text=Too%20high%20an%20estimation%20of%20any%20peculiar%20way&amp;text=bring%20us%20into%20a%20spiritual%20sickness%20and%20declension" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9757f66d0a" data-kw="">
<blockquote><p>Here I shall only give you this caution, Take heed of taking your notions of God from sense, or merely from reason: 1. Not from sense: Spiritual beings fall under no cognisance of the external senses. None ever saw God’s shape; none ever saw his similitude; and here let me caution you, against any pictures of God, or any Person in the Godhead. We are ready in our minds to form ideas in our minds of any beings according to the representations which pictures and images make of them. It is impossible but all pictures, images or external representations of the Divine Being must be teachers of lies. It is impossible that a limner [painter] should draw the true representation of a man whom he never saw. How is it possible he should draw any representation of an invisible God, a Being which he neither ever saw nor can see? The fairest pretence is for the picture of our Saviour, who assumed our nature and was a man in all things. But all those pictures must be teachers of lies too: For Christ was God-Man, and the representation of a man is no representation of the Person of the Mediator. Does any say that upon the same argument there should be no pictures drawn, for a picture does but represent our fleshly part, the soul cannot be expressed. I answer there yet are these differences: 1. The picture of our friend is the representation of a being that we know is or was informed with a reasonable soul, so as the other essential part of the man is on course understood; but it is not so as to Christ. Though the picture of an human shape has this advantage, that we may understand under it a reasonable soul, of which every man is possessed, yet we cannot under any such shape understand the Divine Nature personally united to the human nature. 2. Again even the picture of a man, if it has no similitude of the man, is but a teacher of a lie and does but help our thoughts with false notions and conceptions. And what limner ever saw the Lord in his human shape, to draw a representation of Him? What need any pictures of Christ when every man we see is as true a representation of Him as any limner can make who never saw Him in the flesh, nor a true copy to draw Him by. I am apt to believe that this was one reason of God’s so severe prohibition of images and the likeness of anything to represent God, because He knew that those things would be of this pernicious use, to give us false notions and ideas of God: for you shall observe when you have seen the pretended picture or resemblance of a man, you will fancy him according to that representation, whether the picture be anything like the person for whom it is made, yea or no. 3. To which I might add that admitting a picture of a man or a friend be not like the person and give our fancies a false notion of him, yet in this there is no sin, no defilement, no guilt upon the soul by it; but to conceive amiss of God is a thing quite of another nature and of further danger to the soul. This has made me sometimes wonder that Luther, though he abhorred images, and showed as great a detestation of them as any other, as they are used in Popery, as they are means or objects of adoration; yet allowed the use and standing of them in Churches. Certainly it is a thing of very dangerous consequence, whether in Churches or our own private houses; for we shall find a great proneness in us to form out notions of God according to such representations; and if those representations be lies and false, such will our notions be: and if this be not a fair way to fill the soul with atheistical and blasphemous thoughts concerning God and Christ, I do not know what is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defensative Armour against Four of Satan’s most fiery Darts, viz. Temptations to atheistical and blasphemous impressions and thoughts, self-murder, despair and presumption</cite>, … (London: Alsop, 1680), Blasphemous Thoughts, ch. 5, pp. 41-44</span></figcaption>

<blockquote><p>As for the external [senses], God makes little use of three of them for this end, viz. touching, smelling and tasting, but does frequently employ the other two: for He has been presented visibly to our eyes, as well in human appearance, as to Abraham and Manoe and to some others, as in other shapes, as to Moses in the burning Bush:</p></blockquote>

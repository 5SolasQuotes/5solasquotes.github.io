<main class="wrap"><figure class="quote" id="q-c42d19426d" data-kw="">
<blockquote><p>As God before time by one free, Eternal, and constant, immanent Act, decreed the futurition of all things: so God in time, by many transient Acts, doth exactly execute the same; only what he did decree, all that he did decree, and according as he did decree.

The Decree is God willing the Futurition; i. e. The future being of all things. The external Efficiency of God, is God’s working all that he hath willed, according as he hath willed. In the Decree is God’s great design of future action. The Efficiency is the execution of that design. In the Decree is, as it were, the Counsel of God; the Efficiency is, as it were, the Hand of God, working according to the Counsel of his Will. The Efficiency and Decree answer one another, as the Birth doth the Conception, the fruit the seed, as the pattern, and tabernacle, Exod. 25.40. And the Pattern and Temple were to answer one another, 1 Chron. 28.12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i</cite>, (London: Henry Cripps and Lodowick Lloyd, 1654), pp 101-02.</span></figcaption>

<blockquote><p>Internal or real Virtue consists in an inward Temper and Disposition of Mind, which is like to God and conformable to the moral Perfections of his Nature; such as Holiness, Justice, Goodness and Truth. And this internal, divine Principle will naturally produce a Course of external Actions conformable to it, as the natural Effect and Expression of it. And the ultimate End and Design of a Person endued with this Principle, will be to act in Conformity to the divine Perfections, and to do all to the Glory of God.

… External or apparent Virtue is such an external Conduct as may seem to be the visible Effect or Expression of this inward divine Principle; but, in Reality, is not; and proceeds from some lower Motive, such as Self-Interest, Honour, Fancy, or the like. Thus a Man may devote a considerable Part of his Estate to public Uses civil and sacred, may be just and beneficent to his Neighbour, punctual to his Promises, and abstain from all bodily Excesses; and yet, in all these Things, have no Regard to God, but only to himself, to his own Interest, Reputation or Fancy.

Although the Matter of these Actions is just and right, and agreeable to the divine Law; yet, as they do not proceed from a true Principle and right End, they are not really virtuous, nor so accounted by the Searcher of Hearts. Indeed the Heathen, who had no higher Principle, generally accounted such Actions to be virtuous; but divine Revelation teaches us, that there can be no virtuous Actions without a divine Temper of Mind, in Conformity to the Perfections of God.</p></blockquote>

<blockquote><p>X. We may sometimes interchange the eudokian [good-purpose of decree] for the euarestia [good-pleasure or complacency of the revealed will], when it is spoken of those things with which God is pleased because there is in them some quality or condition which agrees with the nature of God and therefore conciliates his favor…

XI. Eurestia contradistinguished from eudokian in this connection means nothing else than the mere complacency by which God approves anything as just and holy and delights in it (and besides wills to prescribe it to the creature as his most just duty). Hence it does not properly include any decree or volition in God, but implies only the agreement of the thing with the nature of God (according to which He cannot but love what is agreeable to his holiness)… … XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>

<blockquote><p>4. The prosperity of sinners usually renders the means of grace ineffectual, that should reclaim and reform them, and consequently their destruction is remediless. The means of grace are internal or external: Internal, the motions of the Holy Spirit and the convictions and excitations of conscience: External, the ministry of the Word and the counsels of faithful friends; all which are usually made frustrated and inefficacious by the vices and lusts of the prosperous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Danger of Prosperity Discovered in Several Sermons upon Prov. 1:27</cite>, (London: Aylmer, 1685), p. 57</span></figcaption>

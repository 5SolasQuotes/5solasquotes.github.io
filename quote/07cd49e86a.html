<main class="wrap"><figure class="quote" id="q-07cd49e86a" data-kw="">
<blockquote><p>Again (in the second place), this fulfilling of the Law, or obedience towards the Law, is indeed righteousness, when it is complete; but in us it is small and impure. (For, although they have received the first-fruits of the Spirit, and the new, yea, the eternal life has begun in them, there still remains a remnant of sin and evil lust, and the Law still finds much of which it must accuse us.) Accordingly, it is not pleasing for its own sake, and is not accepted for its own sake. But although from those things which have been said above it is evident that justification signifies not only the beginning of the renewal, but the reconciliation by which also we afterwards are accepted, nevertheless it can now be seen much more clearly that the inchoate fulfilling of the Law does not justify, because it is accepted only on account of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concordia Triglotta</cite>, … (St. Louis, MO: Concordia Publishing House, 1921), Apology of the Augsburg Confession, pt. 3, sect. 40, p. 166</span></figcaption>

— Johannes Maccovius, Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy (1644) | ch. 14, ‘On Regeneration’, pp. 246-47 [translation has been emended]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C22.+Regarding+its+first+moment+regeneration+happens+instantaneously.+Theologians+are+accustomed+to+distinguish+regeneration+from+justification+in+this+respect%3A+namely%2C+that+regeneration+is+simlutaneously+and+at+once+whole%2C+whereas+justification+is+not+simultaneously+and+at+once+whole.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+Scholastic+Discourse%3A+The+Distinctions+%26+Rules+of+Theology+%26+Philosophy+%281644%29+%7C+ch.+14%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pp.+246-47+%5Btranslation+has+been+emended%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F986484f88f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/986484f88f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=22.%20Regarding%20its%20first%20moment%20regeneration,not%20simultaneously%20and%20at%20once%20whole&amp;text=22.%20Regarding%20its%20first%20moment%20regeneration%20happens%20instantaneously&amp;text=justification%20is%20not%20simultaneously%20and%20at%20once%20whole" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0ea9c90737" data-kw="">
<blockquote><p>There are four set periods of justification: First, in God’s purpose, which reaches as far as the eternal transactions between God and Christ, such as were set down in the Lamb’s book. Secondly, when Christ did in the name and stead of sinners perform that which was the matter of their justification, but in neither of these periods was the soul translated out of the state of nature into the state of grace. Thirdly, actually, at that moment when we come to own Christ as a Saviour by believing. Fourthly, when the Spirit which translates the soul out of the state of nature into the state of grace, makes it known to the soul. Others say there are five (as it were) periods or degrees of justification:

1. When the Lord passes a sentence of absolution on men at their first conversion, immediately upon their union with Christ, Acts 13:38-39.

2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10.

3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ.

4. There follows a certification, a sentence passed in the soul concerning man’s estate, 1 Jn. 5:9; Rom. 8:33.

5. Justification is never perfected till the Day of Judgment, Acts 3:19, then sentence is passed in open court before men and angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 515</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

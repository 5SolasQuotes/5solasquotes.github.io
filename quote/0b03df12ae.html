<blockquote><p>23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (Baker, 1997), ch. 27, ‘Justification’, p. 163</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e250a42f4" data-kw="">
<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts. 4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ. 5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

</figure><figure class="quote" id="q-2e9a0f1074" data-kw="">
<blockquote><p>We constantly want to justify ourselves before God, to be good enough without Christ. But God does not want us to trust in our goodness. He does not want us to make up for our past sins through present obedience. He does not want us to think that we are good enough to go to heaven by comparing ourselves to the Hitlers and Stalins of the world. Comparisons are useless when it comes to establishing righteousness before God. God crucified His one and only Son for our justification, and He wants us to trust in Him alone. When it comes to being justified, faith plus anything else is quicksand. The only ground for right standing before God is Christ Jesus grabbed ahold of by faith.</p></blockquote>

<blockquote><p>14. Some theologians at the Council of Trent–from being too superstitious, or perhaps too contentious–so disliked, or at least were so suspicious of the word ‘imputation’ (viz., of Christ’s justice), as is related [by Paul Sarpi] in the History of that Council (bk. 2, sect. Franciscani vero gratiam habitualem inde, pp. 219-20, ed. Latin, p. 157), and is known of Dominicus a Soto from his writings (Of Nature and Grace, bk. 2, ch. 20), that they wished it taken away, because the Protestants used it so familiarly, although it is nowhere met with either in Scripture or in the Fathers, and because of the inferences which the Protestants elicit from it… So also in the Fathers the expressions communication, sharing, gift, diffusion, derivation, application, copulation, and conjunction, are often found, as is well known and allowed by those who most dislike the word ‘imputation,’ although this word signifies precisely the same thing as these others. Wherefore, since the thing itself is sufficiently certain, it is fruitless to contend about words. Nay, the very word ‘imputation’ occurs in S. Bernard (Epistle 190 to Pope Innocent [or Tract on some Capital Errors of Abelard, ch. 6, sect. 15, vol. 1, p. 652c.]); ‘If one died for all, all therefore are dead, viz., that the satisfaction of one may be imputed to all; as He being one, carried the sins of all.’ (Read diligently, I pray you, the whole of that epistle), and again, ‘Death is put to flight by the death of Christ, and the justice of Christ is imputed to us.’ (Sermo ad milites Templi, ch. 11 [sect. 22, vol. 1, p. 553e.]) and this [namely, that S. Bernard makes use of the word ‘imputation’] is allowed by many Romanists: A. Vega (Of Justification, bk. 15, ch. 2, prop. 2); Bellarmine (who also confesses that ‘the justice and merits of Christ are rightly said to be imputed to us, when they are given and applied to us, as if we had ourselves satisfied God, but not so that we should formally be called and be just through the justice of Christ’; Of Justification, bk. 2, ch. 7, sect. Quarto refellitur, ch. 10, sect. Deinde et ibidem Resp. ad tertium argumentum [sect. Resp. non dicitur] et ch. 11 circa finem sect. Potest tamen.]); Suarez (Of [Divine] Grace, bk. 7, Of the Sanctification of Man, ch. 7, n. 29); Ruardus Tapper (Explicatio articulorum viginti, art. 8, Of Justification, sect. Ad quod bifariam, t. 2, pp. 25-27); Vasquez (in pt. 1 of 2, tome 2, disp. 202, ch. 6, n. 45); Stapleton (Of Justification, bk. 7, ch. 9, sect. Aliquid, and sect. Notandum); Costerus (in Enchiridion, p. 292, anno 1593, pp. 254-56), and many others. And many centuries before S. Bernard, S. Athanasius affirms that ‘it behoves us to believe from the Holy Scriptures… that the fulfillment of the law performed by the first-fruits’ (i.e. Christ) ‘is ascribed or imputed to the whole mass;’ ([Pseudo] Athanasius, Confutationes quarumdam propositionum, sect. 15. Adversus cos. qui damno afficiunt genus nostrum, eo quod negant Servatorem ex natura nostra sump*i**c primitas. Tome 2, edit. Commelini, p. 270 [tome 2, p. 580, B.]) for in the Greek it is the same word which the apostle uses in the fourth chapter of the Romans; see the passage.</p></blockquote>

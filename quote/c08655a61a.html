<main class="wrap"><figure class="quote" id="q-c08655a61a" data-kw="">
<blockquote><p>…the Father as Father, received primarily the wrong that sin did against his work of creation: For the Father being the first person in order and creation, the first transient act as (election and reprobation were the first immanent); hence this work is attributed chiefly to God the Father, in respect of our orderly apprehension: and hence man sinning then when he was only made, this is chiefly attributed to be against the Father, because his work appeared to be chiefly there; and not against the Son, for his work chiefly appears in redemption…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some Select Cases Resolved. Specially, tending to the right ordering of the heart</cite>, p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8ae778da8" data-kw="">
<blockquote><p>Before the foundation of the world, by sheer grace, according to the free good pleasure of his will, God chose in Christ to salvation a definite number of particular people out of the entire human race, which had fallen by its own fault from its original innocence into sin and ruin. Those chosen were neither better nor more deserving than the others, but lay with them in the common misery. God did this in Christ, whom he also appointed from eternity to be the mediator, the head of all those chosen, and the foundation of their salvation. And so God decreed to give to Christ those chosen for salvation, and to call and draw them effectively into Christ’s fellowship through the Word and Spirit. In other words, God decreed to grant them true faith in Christ, to justify them, to sanctify them, and finally, after powerfully preserving them in the fellowship of the Son, to glorify them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 7</span></figcaption>

</figure><figure class="quote" id="q-3256c57b2a" data-kw="">
<blockquote><p>Question 20. Did God leave all mankind to perish in the estate of sin and misery; A. God having out of his mere good pleasure, from all eternity, elected some to everlasting life… to deliver them out of an estate of sin and misery; and to bring them into an estate of salvation by a Redeemer. Q. 1. Are same persons chosen to salvation, and others left? A. Yes: God has chosen some to salvation, and passed by others; as the Scriptures speak; See Rom. 8:30… … Q. 7. What learn you from God’s election? What cause we have to admire free-grace in our choice, who were no better than others; Eph. 2:3. And were by nature children of wrath even as others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Salvation of God’s Elect &amp; of the Covenant of Grace’ on Question 20 in An Exposition of the Assembly’s Catechism in Works</cite>, (London: Baynes, 1820), vol. 6, pp. 174-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-8062fcc4ca" data-kw="">
<blockquote><p>I have followed this method in the Theses on the secret of eternal Predestination, in which I considered primarily the efficient cause of Election and Reprobation with utmost diligence and faith. However, I could not escape the foul calumnies of detractors and some unreasonable people. For when I have shown from the Gospel of Jesus Christ that the decree of eternal election must be distinguished from our eternal salvation as a cause from its effect, and that the means leading us to that eternal salvation, among which are faith in Christ and His merit, are efficient causes of eternal salvation, but not the decree of election, some have dared, prompted by weakness or perhaps ignorance combined with a malicious intent, to affirm that I have taught that we are not saved by faith in Christ and that the merit of Christ is not the cause of our eternal salvation. But I give thanks to my God, who deigns to gradually make me conformed to the image of His Son, for enduring calumnies for the sake of heavenly truth; and I persuade myself that it is Christian to be ill-spoken of when you believe rightly and teach and do well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

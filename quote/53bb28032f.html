<main class="wrap"><figure class="quote" id="q-53bb28032f" data-kw="will Spirit grace">
<blockquote><p>The will cannot change itself, nor give itself another bent; but rather the more it is resisted, the more it is irritated to crave. This would not be the case if it were free, or had a “Free-will.” But when God works in us, the will, being changed and sweetly breathed on by the Spirit of God, desires and acts, not from compulsion, but responsively, from pure willingness, inclination, and accord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, On the power of the will</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0f47e564d7" data-kw="bondage enslaved">
<blockquote><p>Whether the free will in a state of sin is so a servant of and enslaved by sin that it can do nothing but sin; or whether it still has the power to incline itself to spiritual good answering accurately to the will of God. The former we affirm; the latter we deny, against the papists, Socinians and Remonstrants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.4</span></figcaption>

</figure><figure class="quote" id="q-51711cd6b0" data-kw="">
<blockquote><p>You alone in pre-eminent distinction from all others, have entered upon the thing itself; that is, the grand turning point of the cause; and, have not wearied me with those irrelevant points about popery, purgatory, indulgences, and other like baubles, rather than causes, with which all have hitherto tried to hunt me down,—though in vain! You, and you alone saw, what was the grand hinge upon which the whole turned, and therefore you attacked the vital part at once; for which, from my heart, I thank you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, Sect. 168, p. 165</span></figcaption>

</figure><figure class="quote" id="q-85072453aa" data-kw="civil vs spiritual inability">
<blockquote><p>The question is not about civil and externally moral good. We do not deny that some strength still remains in man after the fall as to those external and civil good works; but the question is about spiritual and supernatural good: whether man in the state of sin is so corrupt that the powers of his free will as to the latter good are not only weakened, but wholly lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.4.2–3</span></figcaption>

</figure><figure class="quote" id="q-3ede70ad4e" data-kw="free-will divine term">
<blockquote><p>Free-will is plainly a divine term, and can be applicable to none but the divine Majesty only: for He alone “doth, (as the Psalm sings) what He will in Heaven and earth.” (Ps. cxxxv. 6.) Whereas, if it be ascribed unto men, it is not more properly ascribed, than the divinity of God Himself would be ascribed unto them: which would be the greatest of all sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, On the term Free-will</span></figcaption>

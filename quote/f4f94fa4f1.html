<blockquote><p>‘Whether to the King.’ It may be questioned, whom the apostle means by the word King? Such as understand the epistle to be written to the Jews, may perhaps conceive that the kings that ruled by deputation in Judea should be meant, such as were Herod and Agrippa. But in as much as the Jews were scattered through the provinces, and those provincial Jews were most in quiet: and in as much as for the reasons afore given, it is likely that the epistle was written to all Christians, both Jews and Gentiles; therefore by the King he meant Caesar.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (d. 1622; 1637), on 1 Tim., 2:13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b92d4c2781" data-kw="">
<blockquote><p>XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, (1681), pp. 47-48</span></figcaption>

<blockquote><p>Such is the state of things at this day, that men neither can, nor will, nor indeed ought to endure longer the domination of you Princes.</p></blockquote>

</figure><figure class="quote" id="q-4a048d1f58" data-kw="">
<blockquote><p>Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-hotman.html">Francis Hotman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Franco-Gallia: Or an Account of the Ancient Free State of France and most other Parts of Europe before the Loss of their Liberties</cite>, 1573 | From the Translator’s Preface:</span></figcaption>

<blockquote><p>If it be just to do, which thou through constraint hast promised, it is just also for thee to promise by oath to do it. For what we may lawfully do, the same also we may lawfully promise by an oath to do. As, if a man falling into the hands of a thief, should be required by the thief to give a piece of money for the redeeming of his life; verily he not only may, but also ought, if he be able, to perform that which the thief requires. And if this be lawfully performed unto a thief, it is lawfully also performed unto him by an oath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … tr. Henrie Parrie (Oxford, 1587), 3rd Commandment, 4. ‘Whether all oaths are to be kept’, p. 919</span></figcaption>

<main class="wrap"><figure class="quote" id="q-15a93f2e48" data-kw="">
<blockquote><p>The solution is simply this: The race is not born in its normal unfallen state. Originally, in the person of its progenitor and representative, God made man upright, in his own image. Now it is abandoned to sin and misery. This abandonment is not only the consequence, but the penal consequence of Adam’s sin committed while they were on trial in him as their representative. On this view, the race had a probation under the most favourable circumstances for ensuring a happy result. In that probation it failed, it sinned. Its abandonment to sin and misery is the penalty of that sin, reckoned and treated judicially as the sin of the race. This accounts for the present corruption of man, not by attributing it, like Mr. [George E.] Ellis, to the normal nature originally given him by his Maker, irrespective of Adam’s sin; nor, like the New School and New England theologians, to the mere sovereignty of God making this fall and ruin of the race the effect of Adam’s sin, without any imputation of that sin to them; but it makes so fearful an evil a penalty for sin committed while on trial in the person of their federal head.

Mr. Ellis follows Dr. E[dward]. Beecher in asserting that the fifth chapter of Romans teaches nothing of this sort, but only that Adam was a type of his race. All his descendants sin and die, just and only as he sinned and died. But to deny that it asserts that Adam’s sin is somehow the cause of man’s sin, is a blind shift of sheer infatuation, worse by far than the evasions he charges upon his New School brethren. He might as well say that the Westminster Confession, or that this journal, does not assert it. It is so asserted and implicated with the whole passage, that no considerable portion of those disposed to get rid of the doctrine, and ready to impeach the apostle’s inspiration for this purpose, have ventured to attempt it.

It not only asserts that sin and death came upon all men “by one man,” (Adam,) “through the offence of one,” “by one that sinned,” “by one man’s disobedience;” it also asserts that it was by virtue of judgment and condemnation therefore: “The judgment was by one to condemnation,” … and “upon all men to condemnation.” There is no escaping the plain meaning of these terms. They indicate that the condition of our race has come by way of judgment and condemnation for the sin of its head. This implies that he acted not merely for himself, but representatively. So much light, and no more, the Scripture gives us in reference to the cause of the awful fact which none can dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lyman-atwater.html">Lyman Atwater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Orthodoxy, New Divinity, and Unitarianism in Biblical Repertory and Princeton Review</cite></span></figcaption>

<blockquote><p>Question: But David grounds this redemption and blessing in the release of sins. Why then add you also the imputation of the sanctification that sticks in Christ, and his fulfilling of the law? Answer: What if I shold encounter thee with these texts: ‘Blessed are the clean in heart,’ ‘blessed are the blameless in the way,’ and such other like? wouldst thou gather here upon that the releasing of sins is excluded? I think not. So now and then sanctification is meant by the term of ‘justification’, because these two go never asunder. And why may I not make answer thus also? that sometimes there is mention made but only of the releasing of sins, not to the end to exclude all other pates that make men blessed, but because the rest are coverfly comprehended under it? And if thou wilt urge me yet further: I may also fitly answer that as the other are meant by the releasing of sins.</p></blockquote>

<blockquote><p>We must notice also the two parts of which justification consists, viz. the remission of sins, and the right or title to eternal life; these two the scripture joins together – “Christ was made under the law, to redeem them that were under the law,” that is, from the curse of it, “ that we might receive the adoption of sons,” i.e. the right to life, which flows from adoption.

So again, Paul declares that “by faith we receive remission of sins, and an inheritance among them that are sanctified,” i.e. a right or title to eternal life, (Acts xvi. 18.) These two benefits are joined together; for although they could be separated in the nature of things, so that a sinner might obtain remission of sins, and yet not be crowned with eternal glory, yet are they inseparably connected together in the covenant of grace.

The first of these benefits is set forth under different forms of expression—such as remission, sins being sometimes represented as debts—pardon, alluding to the pardon which a judge grants to a criminal —cleansing, sin being often compared to filth, in which also there is an allusion to the blood of a propitiatory sacrifice—blotting out, which expression gives us the idea of a book in which divine justice notes down all our sins in order to punish them. It is further set forth by covering sin, God being regarded as hiding our sins under the veil of his mercy, so that his justice cannot behold them; also by non-imputation, alluding to the account books of merchants or traders.

Also by reconciliation, denoting previous enmity—deliverance, denoting previous bondage—making white, (Isaiah l. 18,) an allusion, if we may believe some persons, to what happened in the case of the scape-goat, who was sent away into the wilderness with a rope of red colour, which, during his journey, miraculously became white, if God pardoned the sins of the people; but if not, remained red. The other benefit is also expressed by various terms, and particularly by that of adoption, of which we shall treat presently.

The foundation of both these benefits is not the inherent righteousness, or good works of sinners themselves; for our justification, according to David and St. Paul, is without works, (Psalm cxliii. 2; Rom. iii. 20, 28; iv. 6; Gal. ii. 16); not merely works done before grace, which are nothing but sins, but works done even after grace received. If any man had ever been justified by works, surely it would have been David, or Abraham; but they were not so justified.

Besides, if the foundation of this benefit were our own righteousness or good works, the two covenants would be confounded; whereas they are diametrically opposed to each other nor can imperfect righteousness, such as is defiled with many stains, constitute any such foundation. Now such is the character of all our righteousness, which is compared to “filthy rags,” (Isaiah Ixiv. 6.) If you lean upon it, says even one of the Popes, Adrian VI it is a mere reed, which will break, and also pierce through the hand of him that thus leans upon it. Nor can such a righteousness deserve the remission of sins, since the forgiven sinner receives the very contrary to what he has truly deserved,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 8.2, pp 364-66.</span></figcaption>

— Benedict Pictet, Christian Theology, trans. Frederick Reyroux (1696; London, 1834), 8.2, pp 364-66.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+notice+also+the+two+parts+of+which+justification+consists%2C+viz.+the+remission+of+sins%2C+and+the+right+or+title+to+eternal+life%3B+these+two+the+scripture+joins+together+%E2%80%93+%E2%80%9CChrist+was+made+under+the+law%2C+to+redeem+them+that+were+under+the+law%2C%E2%80%9D+that+is%2C+from+the+curse+of+it%2C+%E2%80%9C+that+we+might+receive+the+adoption+of+sons%2C%E2%80%9D+i.e.+the+right+to+life%2C+which+flows+from+adoption.%0A%0ASo+again%2C+Paul+declares+that+%E2%80%9Cby+faith+we+receive+remission+of+sins%2C+and+an+inheritance+among+them+that+are+sanctified%2C%E2%80%9D+i.e.+a+right+or+title+to+eternal+life%2C+%28Acts+xvi.+18.%29+These+two+benefits+are+joined+together%3B+for+although+they+could+be+separated+in+the+nature+of+things%2C+so+that+a+sinner+might+obtain+remission+of+sins%2C+and+yet+not+be+crowned+with+eternal+glory%2C+yet+are+they+inseparably+connected+together+in+the+covenant+of+grace.%0A%0AThe+first+of+these+benefits+is+set+forth+under+different+forms+of+expression%E2%80%94such+as+remission%2C+sins+being+sometimes+represented+as+debts%E2%80%94pardon%2C+alluding+to+the+pardon+which+a+judge+grants+to+a+criminal+%E2%80%94cleansing%2C+sin+being+often+compared+to+filth%2C+in+which+also+there+is+an+allusion+to+the+blood+of+a+propitiatory+sacrifice%E2%80%94blotting+out%2C+which+expression+gives+us+the+idea+of+a+book+in+which+divine+justice+notes+down+all+our+sins+in+order+to+punish+them.+It+is+further+set+forth+by+covering+sin%2C+God+being+regarded+as+hiding+our+sins+under+the+veil+of+his+mercy%2C+so+that+his+justice+cannot+behold+them%3B+also+by+non-imputation%2C+alluding+to+the+account+books+of+merchants+or+traders.%0A%0AAlso+by+reconciliation%2C+denoting+previous+enmity%E2%80%94deliverance%2C+denoting+previous+bondage%E2%80%94making+white%2C+%28Isaiah+l.+18%2C%29+an+allusion%2C+if+we+may+believe+some+persons%2C+to+what+happened+in+the+case+of+the+scape-goat%2C+who+was+sent+away+into+the+wilderness+with+a+rope+of+red+colour%2C+which%2C+during+his+journey%2C+miraculously+became+white%2C+if+God+pardoned+the+sins+of+the+people%3B+but+if+not%2C+remained+red.+The+other+benefit+is+also+expressed+by+various+terms%2C+and+particularly+by+that+of+adoption%2C+of+which+we+shall+treat+presently.%0A%0AThe+foundation+of+both+these+benefits+is+not+the+inherent+righteousness%2C+or+good+works+of+sinners+themselves%3B+for+our+justification%2C+according+to+David+and+St.+Paul%2C+is+without+works%2C+%28Psalm+cxliii.+2%3B+Rom.+iii.+20%2C+28%3B+iv.+6%3B+Gal.+ii.+16%29%3B+not+merely+works+done+before+grace%2C+which+are+nothing+but+sins%2C+but+works+done+even+after+grace+received.+If+any+man+had+ever+been+justified+by+works%2C+surely+it+would+have+been+David%2C+or+Abraham%3B+but+they+were+not+so+justified.%0A%0ABesides%2C+if+the+foundation+of+this+benefit+were+our+own+righteousness+or+good+works%2C+the+two+covenants+would+be+confounded%3B+whereas+they+are+diametrically+opposed+to+each+other+nor+can+imperfect+righteousness%2C+such+as+is+defiled+with+many+stains%2C+constitute+any+such+foundation.+Now+such+is+the+character+of+all+our+righteousness%2C+which+is+compared+to+%E2%80%9Cfilthy+rags%2C%E2%80%9D+%28Isaiah+Ixiv.+6.%29+If+you+lean+upon+it%2C+says+even+one+of+the+Popes%2C+Adrian+VI+it+is+a+mere+reed%2C+which+will+break%2C+and+also+pierce+through+the+hand+of+him+that+thus+leans+upon+it.+Nor+can+such+a+righteousness+deserve+the+remission+of+sins%2C+since+the+forgiven+sinner+receives+the+very+contrary+to+what+he+has+truly+deserved%2C%E2%80%9D%0A%0A%E2%80%94+Benedict+Pictet%2C+Christian+Theology%2C+trans.+Frederick+Reyroux+%281696%3B+London%2C+1834%29%2C+8.2%2C+pp+364-66.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0997eafc07.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0997eafc07.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/04/benedict-pictet-on-the-double-benefit-of-justification/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8976fb3c62" data-kw="">
<blockquote><p>Therefore all hypocrites and idolaters try to do the works that properly pertain to the Deity and belong completely and solely to Christ. They do not actually say with their mouths: “I am God; I am Christ.” Yet in fact they arrogate to themselves the divinity of Christ and His function. In fact, then, they do say: “I am Christ. I am the Savior—not only my own but for others as well.” Thus the monks have taught, and they have persuaded the whole world of this, that they are able to justify not only themselves with their hypocritical sanctity but also others to whom they communicate it, even though it is the proper function of Christ alone to justify the sinner. Thus the pope, by extending his divinity over the whole world, has denied and completely suppressed the work of Christ and His divinity.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6c2ab75214" data-kw="">
<blockquote><p>Now concerning baptism, baptize as follows: after you have reviewed all these things, baptize in the name of the Father and of the Son and of the Holy Spirit in running water. But if you have no running water, then baptize in some other water; and if you are not able to baptize in cold water, then do so in warm. But if you have neither, then pour water on the head three times in the name of the Father and Son and Holy Spirit. And before the baptism let the one baptizing and the who is to be baptized fast, as well as any others who are able. Also, you must instruct the one who is to be baptized to fast for one or two days beforehand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-didache.html">The Didache</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7 (early 2nd century) trans. Michael W. Holmes, The Apostolic Fathers: Greek Texts and English Translations, 3rd edn (Grand Rapids: Baker, 2007).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4c9f87ef0" data-kw="">
<blockquote><p>The prophet, in short, teaches us here what Paul has more clearly explained (Rom. 2:29), even this— that the letter is of no value before God, but that the spirit is what He requires: for Paul in these words means that the external sign is worthless, except accompanied by the reality within; for the literal circumcision mentioned by Paul is merely the external rite; in the same manner baptism with us may be called the letter, when there is no repentance and faith. But the spirit, or spiritual circumcision, is the denial of self; it is renovation, and in a word, that true conversion to God, of which the prophet speaks here. …It is yet certain that men do not bestow on themselves what God signifies by the sign of baptism; but He counsels them to seek from God the grace of his Spirit, that they might not in vain be sealed by the external rite of baptism, while destitute of its reality. When therefore the prophet bids the Israelites to take away the foreskin of their heart, it is the same as though he had said, that they were indeed liberal enough with regard to ceremonies and outward worship, but that these were empty masks unless preceded by a right disposition within.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, ch. 4, verse 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a></span></div>

osition%20within" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6d8c4fe66f" data-kw="">
<blockquote><p>The religious observance of this institution was required under a very severe penalty, Gen. 17:14. The contempt of circumcision was a contempt of the covenant; if the parents did not circumcise their children, it was at their peril, as in the case of Moses, Ex. 4:24–25. With respect to those that were not circumcised in their infancy, if, when they grew up, they did not themselves come under this ordinance, God would surely reckon with them. If they cut not off the flesh of their foreskin, God would cut them off from their people. It is a dangerous thing to make light of divine institutions, and to live in the neglect of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 17, verse 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>…use the best skill you have to instruct your children and servants, yet this is no reason to withdraw them from public instructions: nor can any man, who understands his religion, think he discharges his duty to God and the Church, merely by his private instruction of his family, when he neglects, or refuses to bring them to public instructions. 3. For he must consider, that his children and servants, who are baptized, are members of the Christian Church, and therefore ought to be subject to the instructions and discipline of it, as far as their age and capacity will permit. They do not only belong to his private care, but to the public care of the Church, who is to provide for the instruction of her children; and to deny the Church liberty to instruct her children, or not to interpose their own authority to make them submit to it, is to withdraw their children from the communion of the Church, after a solemn dedication of them to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sherlock.html">William Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Discourse of Religious Assemblies</cite>, … (London, 1681), pt. 2, ch. 5, pp. 303-4 Sherlock was an Anglican.</span></figcaption>

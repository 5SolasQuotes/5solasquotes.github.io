<main class="wrap"><figure class="quote" id="q-c017f546bb" data-kw="">
<blockquote><p>Thirdly, if thou wouldst prepare thyself for the Word, entreat God to bless it to thee: The operations of the Spirit must accompany the administration of the Word, or it will be ineffectual: It is the Spirit that quickeneth, Jn. 6.63. The fire burns naturally, and the water cools naturally; but if the fire of the Word ever burn up thy corruptions, or the water of the Word refresh thee with real consolations, it must not be by its own nature, but by a divine power.</p></blockquote>

</figure><figure class="quote" id="q-22d49744d1" data-kw="">
<blockquote><p>Question 9. Whether every will of God is fulfilled? Denied with a distinction. Answer: Concerning the will properly taken, or of good-pleasure [beneplaciti]: affirmed, Isa. 46:10. Concerning the will taken metonymically, or of command [mandati]: denied. And this opinion is insinuated by Thomas, in [Summa] pt. 1, question 19, article 6, where he disputes that every will of God is always fulfilled, together with article 11, where he distinguishes the will into [the will] of the sign and [the will] of good-pleasure. … Question 11. By what will can anyone justly will that which God does not will? Explained. Answer: We thus explain it: by a right will, which is conformable to the law and general command of God, one can will that which God does not will by the will of good-pleasure, or the hidden [will]. See Gen. 22, compared with Heb. 11:17 and 2 Sam. 7:2-3, 13. Question 12, Whether the precepts of God sometimes differ from his will? Affirmed with a distinction. Answer: In the proximate object they differ: for of the precept, or command, there can be another object—and indeed an opposite one—than [that] of the will or good-pleasure. As is manifest, Gen. 22, where the proximate object of the divine command given to Abraham was the slaying [mactatio] of Isaac; and the object of the good-pleasure, or of the divine will properly so called, was the non-slaying of the same. But although the objects of the will of command and of good-pleasure are opposed among themselves, yet the acts of command and of will are not opposed, but the former is subordinated to the latter. For God, by the will of good-pleasure, willed the command, or to command Abraham; but He did not will the thing commanded to Abraham, or the fulfillment of the commanded thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-908f580768" data-kw="">
<blockquote><p>I shall not now enquire whether these acts of Christ’s will and holy love did issue and proceed from Him per modum naturae [through the mode of nature, as Rutherford held; see below], or per modum rationis [through the mode of reason], as they speak in the Schools, or both; that is, whether they were only the natural weights and inclinations, and desires of the will and habit of charity to his own self-preservation, without any deliberation, such as is to be found in children before the use of reason; or whether they proceeded from Him out of a deliberate consideration and pondering, not so much of the now-impending evils and the fury of his Father’s wrath, as the love He bore to his own people the Jews, whose destruction and casting off He foresaw would be the consequents of his death: though Suarez seems to me to have proved the latter as well as the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-creed.html">William Creed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>paragraphs 61-73</cite>, pp. 236-43 in sect. 13 in The Refuter Refuted, or Dr. [Henry] Hammond’s Ektenesteron Defended, against the impertinent cavils of Mr. Henry Jeanes... (London: Royston, 1660), pp. 237-38</span></figcaption>

<blockquote><p>The former will [of command] is called by the [Medieval] Scholastics, on the authority, it is thought, of Hugh of St. Victor, voluntas signi, whether because it is signified by some sign, like a word, precept, interdict, etc.; or because it signifies God’s will as the effect and adjunct of it…</p></blockquote>

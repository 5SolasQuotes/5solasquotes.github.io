<blockquote><p>6. The goodness of God is seen in bearing with the infirmities of his people and accepting imperfect obedience. Though Asa had many blots in his escutcheon [a coat of arms as an emblem], yet they are over-looked, and this note set upon record by divine goodness, that his heart was perfect towards the Lord all his days: ‘But the high places were not removed, nevertheless Asa’s heart was perfect with the Lord all his days.’ (1 Kings 15:14) He takes notice of a sincere, though chequered obedience, to reward it, which could claim nothing but a slight from Him if he were extreme to mark what is done amiss. When there is not an opportunity to work, but only to will, He accepts the will, as if it had passed into work and act. He sees ‘no iniquity in Jacob,’ (Num. 23:21) i.e. He sees it not so as to cast off a respect to their persons and the acceptance of their services: His omniscience knows their sins, but his goodness does not reject their persons. He is of so good a disposition that He delights in a weak obedience of his servants, not in the imperfection but in the obedience: ‘He delights in the way of a good man,’ (Ps. 37:23) though he sometimes slips in it: He accepts a poor man’s pigeon as well as a rich man’s ox; He has a bottle for the tears and a book for the services of the upright (Ps. 56:8), as well as for the most perfect obedience of angels. He preserves their tears as if they were a rich and generous wine, as the vine-dresser does the expressions [pressed out flowings] of the grape.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682) | ‘On the Goodness of God’, pp. 656-57</span></figcaption>

<blockquote><p>Furthermore that must be observed: what kind of idolatry that is which saint Paul says may fall into a brother and yet he retain the name of ‘brother’. (1 Cor. 8, 10) This appears upon the discourse he makes in that epistle to have been only a sitting down to eat at the feast of idolaters, made in honor of their idols, without any honor done to idols by sacrifice or bodily worship, and without any conscience of that meat more than of other. Which although he prove a species of idolatry: yet was that one of the least and lightest kinds, and such as holding still the foundation of Christianity, could not without obstinacy in it, cut [him] from the church. Whereby [it] falls out that the papists, which in their idolatry raze the foundations of true religion, cannot, by that place, come into any account of the church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, (Heidelberg, 1575), ‘Of election of ministers’, p. 246</span></figcaption>

<blockquote><p>…administration of the Lord’s Supper is a more important and necessary duty than exclusion [from it], etc. or any other part of the exercise of discipline; for it is more properly and immediately the worship of God than the exercise of discipline, as may be seen in the place before quoted out of Ames, bk. 2, [Marrow of] Theology, ch. 13, n. 17-18. God is more worshipped by the administration of the sacraments than by Church censures; the sacraments are a principal worship of God; Church censures and the exercise of discipline less principal. Now it is improbable that a less principal worship of God should be a necessary antecedent to a principal worship. There is says Rada: duplex ordo naturae; alius ordo essentialis dependendentiae; alius est ordo essentialis eminentiae et perfectionis; qualis est inter excedens, &amp; excessum. Now exclusion (and we may say the like of all other acts of discipline) is not before the Lord’s Supper in regard of the order, either of essential dependency, or of essential eminency and perfection. The Lord’s Supper has not an essential dependency upon exclusion, or any other acts of discipline: and it is in ratione cultus of more essential eminency and perfection; as being more immediatly and properly the worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government… (London, 1650), p. 31 Jeanes was an English presbyterian.</span></figcaption>

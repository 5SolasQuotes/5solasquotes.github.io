<blockquote><p>To this some do answer in the evening and some in the morning. My answer is this, that the Sabbath of the New Testament amongst us is to begin in the morning, and so to continue till the next morrow, and not in the evening, till the [next] evening. The reasons be these:

1. The Sabbath is to begin when other ordinary days begin, according to the order and account of the Church wherein we live.

2. It was the practice of Christ and the apostles. For Christ (as it has been thought of ancient times) consecrated the Sabbath, in that He rose from the dead early in the morning when the first day of the week began to dawn, Mt. 28:1; and therefore it is fit that the Sabbath Day should then begin when He rose, forasmuch as it is kept in remembrance of his resurrection. The same was the practice of the apostles. For Acts 20:7, the first day of the week the Jews came together at Troas in the morning, and there Paul preached from that time till midnight, being the next morning to depart, having stayed there as is plain out of the 6th verse, seven days. In that text I note two things: First, that the night there mentioned was a part of the seventh day of Paul’s abode at Troas. For if it were not so then he had stayed at least a night longer, and so more than seven days, because he should have stayed part of another day. Secondly, that this night was a part of the Sabbath which they then kept. For the apostle keeps it in manner of a Sabbath in the exercises of piety and divine worship, and namely in preaching. Yea, further he continues there till the rest was fully ended: He communed with them till the dawning of the day, and so departed, verse 11. Besides this text, David says in his Psalm of the Sabbath that he will declare Gods loving kindness in the morning and his truth in the night, Ps. 92:2, making the night following [the morning] a part of the Sabbath. Against this doctrine it is alleged, first, that the Sabbath is to begin in the evening, because in the first [chapter] of Genesis it is said six several times, ‘the evening and the morning made’ the first day, and so the second, and third, etc. Answer: First, in that text when it is said ‘the evening and the morning made’ such and such days, by the ‘evening’ is understood [on that view] the night and by the ‘morning’ the day, and [but] the evening was the end of the day, and the morning the end of the night. This [latter] exposition is ancient, and yet in Scripture we find not one place where the evening is put for the night. Secondly, I answer that the collection from that place is of no force. For thus the reason must needs be framed: That which God did in [the] appointing of days, the same must we do in using of them. But God in appointing of days began the day at the evening. Therefore, etc. The consequent is false. For the case is otherwise in the constitution of time than it is in the use of time constituted: and there is not the same reason of things in doing as there is of the same things in being and use. Thirdly, this did not bind the Jews. For they in all likelihood began their Sabbaths in the morning. Indeed their solemn feasts, as the Passover and such like, began and were kept from evening to morning, as we may read [in] Lev. 23:5. But their ordinary Sabbath was kept from morning to morning. Whence it is that St. Matthew calls the dawning of the first day of the week the end of the Sabbath of the Jews, Mt. 28:1, and there is nothing (I take it) that can be brought to the contrary. It is objected that Moses says, Lev. 23:32, ‘From even to even shall ye celebrate your Sabbath.’ Answer: The words must be understood of the feast of reconciliation [Atonement], being the tenth day of the seventh month, which was solemnized and kept from even to even. And it is called a ‘sabbath’ because it was by special commandement appointed to be kept as the Sabbath Day, and that in two respects: First because it was to be kept holy by the Jews in humbling themselves and offering sacrifices, verse 27. Secondly, because upon that day it was not lawful to do any servile work upon pain of death, verses 25 &amp; 30. Again, it is alleged that Joseph of Arimathea could not embalm Christ by reason that the Sabbath was at hand, and this was the evening. I answer: That the Jews’ Sabbath there meant concurred with the day of their Passover, and hence it was that their Sabbath began in the evening. By this that has been said the answer… is plain, to wit, that in the New Testament the Sabbath is to begin at the morning, and so to continue to the next morning, and not as some suppose to begin at the even and continue till the next even.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘When does the Sabbath Begin?’ in Cases of Conscience</cite>, (d. 1602; Cambridge, 1606), bk. 2, ch. 16, pp. 465-68</span></figcaption>

<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>

<blockquote><p>XXV. Here, nevertheless, are excepted [to the prohibition of servile work]: … (3) the works of common honesty, because as always, so on this day above others, we ought to carry ourselves and to act honestly and decorously; (4) works of necessity, which are neither feigned nor designedly produced, but imposed upon us by providence (Lk. 14:5); not only absolute and simple, that may be called necessary only (which we can in no way be in want of), but modified and relative so that those things may be reckoned necessary not only which are required absolutely for the existence and support of life, but also those which conduce to our living better. Hence some great advantage and emolument accrues to us or our neighbor if they are done or some great disadvantage and loss if they are omitted. ‘The sabbath’ (as Christ testifies in Mk. 2:27) ‘was made for man and not man for the sabbath.’ XXVI. Therefore, we do not think that in this cessation believers are bound to Judaical precision which some (more scrupulous than is just) maintain was not revoked, so that it is lawful neither to kindle a fire, nor to cook food, nor to take up arms against an enemy, nor to prosecute a journey begun by land or sea, nor to refresh themselves with innocent relaxation of the mind and body, provided they are done out of the hours for divine worship, nor to have any diversion, however slight, to any things belonging to the advantages or emoluments of this life. For although this opinion bears on its face a beautiful appearance of piety (and undoubtedly with good intention is proposed by pious men to procure the better sanctification of this day, usually so basely profaned), still it labors under grievous disadvantages; nor can it be retained without in this way bringing back into the church and imposing anew upon the shoulders of Christians an unbearable yoke (abastakton), repugnant to Christian liberty and the gentleness of Christ and opposed to the sweetness of the covenant of grace by agitating and tormenting the consciences of men through infinite scruples and inextricable difficulties (nearly driving to desperation).</p></blockquote>

— Francis Turretin, Institutes (P&amp;R), vol. 2, 11th Topic, Q. 14, ‘The Lord’s Day…’, p. 98">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXV.+Here%2C+nevertheless%2C+are+excepted+%5Bto+the+prohibition+of+servile+work%5D%3A+%E2%80%A6+%283%29+the+works+of+common+honesty%2C+because+as+always%2C+so+on+this+day+above+others%2C+we+ought+to+carry+ourselves+and+to+act+honestly+and+decorously%3B+%284%29+works+of+necessity%2C+which+are+neither+feigned+nor+designedly+produced%2C+but+imposed+upon+us+by+providence+%28Lk.+14%3A5%29%3B+not+only+absolute+and+simple%2C+that+may+be+called+necessary+only+%28which+we+can+in+no+way+be+in+want+of%29%2C+but+modified+and+relative+so+that+those+things+may+be+reckoned+necessary+not+only+which+are+required+absolutely+for+the+existence+and+support+of+life%2C+but+also+those+which+conduce+to+our+living+better.+Hence+some+great+advantage+and+emolument+accrues+to+us+or+our+neighbor+if+they+are+done+or+some+great+disadvantage+and+loss+if+they+are+omitted.+%E2%80%98The+sabbath%E2%80%99+%28as+Christ+testifies+in+Mk.+2%3A27%29+%E2%80%98was+made+for+man+and+not+man+for+the+sabbath.%E2%80%99+XXVI.+Therefore%2C+we+do+not+think+that+in+this+cessation+believers+are+bound+to+Judaical+precision+which+some+%28more+scrupulous+than+is+just%29+maintain+was+not+revoked%2C+so+that+it+is+lawful+neither+to+kindle+a+fire%2C+nor+to+cook+food%2C+nor+to+take+up+arms+against+an+enemy%2C+nor+to+prosecute+a+journey+begun+by+land+or+sea%2C+nor+to+refresh+themselves+with+innocent+relaxation+of+the+mind+and+body%2C+provided+they+are+done+out+of+the+hours+for+divine+worship%2C+nor+to+have+any+diversion%2C+however+slight%2C+to+any+things+belonging+to+the+advantages+or+emoluments+of+this+life.+For+although+this+opinion+bears+on+its+face+a+beautiful+appearance+of+piety+%28and+undoubtedly+with+good+intention+is+proposed+by+pious+men+to+procure+the+better+sanctification+of+this+day%2C+usually+so+basely+profaned%29%2C+still+it+labors+under+grievous+disadvantages%3B+nor+can+it+be+retained+without+in+this+way+bringing+back+into+the+church+and+imposing+anew+upon+the+shoulders+of+Christians+an+unbearable+yoke+%28abastakton%29%2C+repugnant+to+Christian+liberty+and+the+gentleness+of+Christ+and+opposed+to+the+sweetness+of+the+covenant+of+grace+by+agitating+and+tormenting+the+consciences+of+men+through+infinite+scruples+and+inextricable+difficulties+%28nearly+driving+to+desperation%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+%28P%26R%29%2C+vol.+2%2C+11th+Topic%2C+Q.+14%2C+%E2%80%98The+Lord%E2%80%99s+Day%E2%80%A6%E2%80%99%2C+p.+98&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fc8db84bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fc8db84bc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=XXV.%20Here%2C%20nevertheless%2C%20are%20excepted%20%5Bto,inextricable%20difficulties%20%28nearly%20driving%20to%20desperation&amp;text=XXV.%20Here%2C%20nevertheless%2C%20are%20excepted%20%5Bto%20the%20prohibition&amp;text=scruples%20and%20inextricable%20difficulties%20%28nearly%20driving%20to%20desperation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. Labour or pains for the enjoyment of the benefit and advantage of the solemn assemblies of the church, and in them of the appointed worship of God, is so far from entrenching on the rest of this day that it belongs unto its due observance. A mere bodily rest is no part of religious worship in itself; nor does it belong unto the sanctification of this day any farther than as it is a means for the due performance of the other duties belonging to it. We have no bounds under the gospel for a Sabbath-day’s journey, provided it be for Sabbath ends. In brief, all pains or labour that our station and condition in this world, that our troubles which may befall us, or any thing else, make necessary, as that without which we cannot enjoy the solemn ends and uses of this holy day of rest, are no way inconsistent with the due observance of it. It may be the lot of one man to take so much pains and to travel so far for, and in the due celebration of the Lord’s day, as if another should do the like without his occasions and circumstances, it would be a profanation of it.</p></blockquote>

<blockquote><p>…therefore if men do, nay ought to loose the ox to the water, much more might He loose the daughter of God from her infirmity of soul and body. And He does not so much dispute what He might do, as show what everyone ought to do: For if it were a breach of the Sabbath to neglect any duty to the other creatures, than much more to withdraw our hand from our brethren, when they do stand in need of our help.</p></blockquote>

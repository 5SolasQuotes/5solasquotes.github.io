<main class="wrap"><figure class="quote" id="q-b3e9b3071f" data-kw="">
<blockquote><p>…a permissive law of God… such as a law of a bill of divorcement… The law of a bill of divorcement is a mere positive law, permitted in a particular exigent, when a husband, out of levity of heart and affection, cannot love his wife; therefore God by a law permitted him out of indulgence to put her away, that both might have a seed (the want [lack] whereof, because of the blessed Seed to be born of woman, was a reproach in Israel [in the Old Testament]), and though this was an affliction to some particular women, yet the intent of the law and the soul thereof was a public benefit to the commonwealth of Israel, of which sort of laws I judge the hard usage permitted by God to his people — in the master toward the servant — and the people of God toward the stranger, of whom they might exact usury — though not toward their brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 196</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e33149f1c9" data-kw="">
<blockquote><p>Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e50800b783" data-kw="">
<blockquote><p>I would learn of him what makes a lawful ordinance about matters of fact or things to be done? Not the will of superiors, else there shall be no unlawful ordinances (for every ordinance has the will of the ordainer). Not the lawfulness of the thing in itself which is ordained either, for then every ordinance which prescribes a thing lawful in itselfe, were it never so inexpedient in respect of supervenient circumstances, should be lawful. To a lawful ordinance, then, [is] required not only that the thing ordained be lawful in itself… [but] also that it be not inexpedient. So that a thing may be lawful in itself, yet not lawfully ordained, because the ordinance commands the doing of it; whereas there are many things lawful which ought not to be done, because they are not expedient, 1 Cor. 6:12. 3. Since it cannot be a lawful ordinance which ordains a thing inexpedient, it can not be a lawful obedience which is yielded to such an ordinance.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

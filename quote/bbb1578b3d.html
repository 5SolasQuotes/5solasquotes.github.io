<main class="wrap"><figure class="quote" id="q-bbb1578b3d" data-kw="">
<blockquote><p>93. Next it may be granted that the [Church] matter may be put under a further examination [by the Church, at the request of the Magistrate], yet upon condition, that when it is come to the revision of the former [Church] sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

<blockquote><p>…the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men…</p></blockquote>

ead it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-90e3438abf" data-kw="">
<blockquote><p>Out of all which, I conclude that no law as a law does oblige the conscience, but that which has from the matter moral equity, and not from the intention of the lawgiver, as Cajetan, Silvester, Angelus and Corduba teach, which intention must take a rule from the matter of the law, and not give a rule. Gerson, no law (says he) is a law to be called as necessary to salvation (as all good laws should be) but that which de jure divino, is according to God’s law… And therefore his [Durandus’s] mind is that all obligation of conscience in human commandments comes from God’s will and law, that is, from the just and necessary matter of the law, not from the will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Ch. 2, Question 2; p. 205</span></figcaption>

</figure><figure class="quote" id="q-1fc08e901a" data-kw="">
<blockquote><p>13. For the Spirit dictates [by illumination] both unto the Church, as well what is profitable for avoiding of scandal, as also that those things which are commanded for avoiding of scandal, are neither the worship of God, nor yet necessary to be observed without the case of scandal and contumacy, as appears by those sayings (1 Cor. 7:6, 35): ‘I speake this by permission, not by commandement. This I speak for your own commodity, not to entangle you in a snare, but that you follow that which is honest, and that you may cleave fast unto the Lord without separation.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, … (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 73-74 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>

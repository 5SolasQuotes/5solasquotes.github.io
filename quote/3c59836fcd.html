<main class="wrap"><figure class="quote" id="q-3c59836fcd" data-kw="">
<blockquote><p>Men, under the pretense of curing the defects and shortcomings, the nakedness and bareness, attaching to ecclesiastical arrangements as set before us in the New Testament, have been constantly proposing innovations and improvements in government and worship. The question is, How ought these proposals to have been received? Our answer is, There is a great general scriptural principle which shuts them all out. We refuse even to enter into the consideration of what is alleged in support of them. It is enough for us that they have no positive sanction from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation (Edinburgh, Scotland: Banner of Truth, 1989 reprint)</cite>, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26f022a668" data-kw="">
<blockquote><p>…but it [instituted worship] concerns those outward ways and means whereby God has appointed that faith, and love, and fear of Him to be exercised and expressed unto his glory. And this kind of worship, though it depend not upon the nature of God, but upon his free and arbitrary disposal, and so was of old liable unto alterations, yet God did ever strictly require in the several states and conditions that his Church has gone through in the world. And this is that, which most commonly in the Scripture is called by the name of the worship of God; as that whereby all the acceptable actings of the souls of men towards him are expressed, and the only way of owning and acknowledging Him in the world, as also of entertaining a visible intercourse with Him. This therefore He calls for, and requires indispensibly of all that draw nigh to Him, and that because He is the Lord our God, Rev. 14:6-7; Mt. 4:10; Dt. 10:12-13. For his observance hereof does He so approve of Abraham, Gen. 18:19, and sets it down as an everlasting Law unto all others that in a holy observation thereof He will be sanctified in all that draw nigh unto Him, Lev. 10:1-3. His commands also concerning it are multiplyed in the Scripture, with the approbation of all those that attend unto them. We may not think to find acceptance with God or to inherit the promises, if supposing ourselves to adhere unto Him in worship internal and natural, we neglect that which is external and of his free appointment: for besides, that we renounce thereby our inward dependance on Him also in not observing his commands, as Adam did in transgressing an institution, we become wholly useless unto all the ends of his glory in the world, which is not the way to come to an enjoyment of Him. Neither do we only express and profess our inward moral, natural worship of God hereby, by which means it becomes the principal way and instrument of faith and trust exerting themselves in our obedience, but also it is a most effectual help and assistance unto the principle of that natural worship, strengthening the habit of it, and exciting it unto all suitable actings, unto its increase and growth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God… (London: 1667) | Question 1</cite>, pp. 2-4</span></figcaption>

</figure><figure class="quote" id="q-9c0a7ab7f1" data-kw="">
<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary Upon the Three First Chapters of the First Epistle General of St. Peter (1637)</cite>, p. 420</span></figcaption>

</figure><figure class="quote" id="q-d75588582f" data-kw="">
<blockquote><p>Worship is as large as the Commandment, nay as the whole Word of God. For so it is ordinarily defined, a work commanded, done in faith, and then it must needs extend itself as far as the Commandment. And if to obey God in conscience of his Commandment, in all actions, civil and sacred, of piety, justice or mercy, be to worship Him, then to believe whatsoever the Lord has taught, relying upon the truth and credit of the Revealer, is worship also. And hence it is, that the worship of God is usually divided into immediate and mediate worship: which comprehends all duties which we owe to God or Man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam… (London: R.B., 1642), ch. 1, section 4</cite>, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>3. Stout in fundamentals of doctrine or practise, but sober and submiss in circumstantials. Foundations of faith and the unity of the Church were very dear to his [the minister John Frost’s] soul, and high in his esteem. The skeptical shakings of the one, and schismatical distractions of the other, sat as sad burdens on his spirit. With strength and much resolution would he contend for essentials of salvation: and things that must be believed, he would often press his people to hold without controversy, noting it to be the shame of Christianity, to lay the [Apostle’s] Creed open to common disputes. And very studious he was to cement differences among brethren: slow he was in censures, but free in rebukes of, and complaints over brethren’s distance. Earnestly he desired, and studiously endeavoured an union between Episcopal and presbyterial divines in things relating to the discipline of the Church; many times he has in my hearing lamented the want of discipline, and observed the animosity of both as no mean hindrance to its restitution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The People’s need of a Living Pastor</cite>, … (London: Cotes, 1657), pp. 52-53 Crofton was an English presbyterian.</span></figcaption>

<blockquote><p>Use 2: It may teach us what to judge of the Seperatists, or Brownists…

1. Because they seperate where Christ keeps fellowship, Rev. 1:18, and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? …

2. But they say that our Church consists of a mixed multitude, so was that 2 Chron. 20:13, when Jehoshaphat assembled all Judah before the Lord, there was a mixed multitude (Num. 11:4), and they did it out of fear, and yet it was a true Church, and so is ours, though there be a mixed multitude. And yet this falling off, because it is not from the main doctrine, but from the skirts, and some circumstantials, therefore they do not fall utterly from Christ, but yet it is not possible but they weaken their faith.</p></blockquote>

<blockquote><p>[Contra a civil toleration of sects:]

1. Because it cannot but open a door to all sorts of erroneous opinions.

2. It is dangerous for the State; it may breed factions and divisions between all persons of whatsoever relation—between the magistrate and the subject, the husband and the wife, the father and the son, brothers, sisters, the master and the servant—when the one is of one religion or ecclesiastical government, and the other of another, as you have experienced. The son may refuse to receive any communion with the father, and the brother with the brother, and so dissolve all natural, civil, and domestic bonds of society.

3. No State in Christendom, where there is one only religion established, will admit the public exercise of any other, or endure a schism in that which is already received. Wherefore then should it be done here?

4. If it be granted to our brethren, I cannot see how it can well be denied to other sects. If it be said that other sects differ more from us than they do, it is all one; magis et minus non mutant speciem [more or less does not change the species] in the matter of toleration. For then all must be tolerated, some more, some less. And some of our brethren grant all this argument. And if we distinguish so, you must declare and expound clearly what sects and what opinions are to be tolerated, and what not—an inextricable question, which no mortal man, apparently, is able distinctly to determine. And some may say: the less the difference is, the less need there is for a toleration to be granted to such a sect; for the less it is, the greater is the schism.

5. God in the Old Testament granted no toleration of diverse religions or disciplines; and the New Testament requires no less union among Christians than the Old among the Jews.

6. Either our brethren assent to our doctrine and are resolved likewise to assent to the discipline which (God willing) shall be established by common consent, or they do not. If they grant the first, what need they any other toleration than the rest? If the second, it should first be discussed wherein they are resolved to dissent, and afterwards considered whether it is of such importance that, in consideration thereof, they dare not in good conscience entertain communion with us.

7. They are not pressed to be actors in anything against their consciences. Therefore they need not be suitors for a toleration; or if they be, it may justly be refused.

8. It is against the nature of the communion of saints to live in sects apart, without communicating at the Lord’s Table—which very hardly will be avoided if toleration be granted.

9. Because Scripture exhorts us evermore to unity, which cannot be easily procured by a toleration of sects, which cannot but daily beget new schisms and divisions.

10. Because the difference among the members of the Church of Corinth in the time of Saint Paul was greater, and yet they communicated together; indeed, the Apostle exhorted them to mutual communion and forbearance of sects and divisions.

11. Because the opinion of our brethren resembles too much that of the Donatists, who separated themselves from other churches under pretext that they were not so holy as their own. Neither is it unlike the convents and monasteries among the Papists; for as they all profess one doctrine with the Romish Church, and yet every order has its own discipline—Saint Francis one, Saint Dominic another—and in every order one general, and in every monastery one abbot, prior, or president, so all your churches believe one doctrine together with us, and every one of your churches has one minister, as their convents have a particular abbot or prior. You only differ in this, that you have no general, or anything answering thereto, to keep you in unity and conformity. …

13. We have but one God, one Christ, and one Lord, one Spirit; we are one body; we have one faith and one baptism, whereby we enter into the Church. Wherefore shall we not have one communion, whereby to be spiritually fed, and one discipline to be ruled by?

14. If churches have disciplines or governments different in their species, then the churches must be different in their species also; for all collective bodies or consociations that are governed are differentiated by their different governments, as we see in civil government, in the constitution and distinction of states, kingdoms, and republics. Wherefore, as many diverse governments as there are in churches, so many different species of churches must we admit. I speak here of the Church considered according to her visible form. But the consequent is false, since there is but one Church. Therefore— 15. Neither Christ nor his Apostles ever granted any toleration to diverse sects and governments in the Church; wherefore then will you be suitors for that which they never granted? …

17. Besides all this, Scripture forbids all such toleration as that of Jezebel. (Rev. 2:20) There must be no such speeches among us as “I am of Paul,” “I of Apollos,” “I of Cephas” (1 Cor 1:12); nor that some are “Calvinians,” as you term us, some “Independents,” some Brownists, some Anabaptists, etc. We must all be Christ’s; we must all think and speak the same things (v. 10). Otherwise men are carnal. Neither has the Church of God a custom to be contentious. [1 Cor. 11:16] Neither does the apostle permit schisms. [1 Cor. 12:25] We must not quit our mutual meetings, as others do, and as must be done in a public toleration. They that trouble the Church must be cut off. [Gal. 5:12]

18. Such a toleration cannot but expose our churches to the calumnies of Papists, who always object to Protestants the innumerable number of their sects, whereas they pretend to be nothing but one Church.

19. From such a toleration follows all that we formerly deduced out of Independency. … 21. Neither can it but overthrow all ecclesiastical government; for a man being censured in one church may flee to another, and being again suspended in that other, from thence to another, and so scorn all the churches of God and their censures; and thus this order by necessary consequence will breed all disorder.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some Observations &amp; Annotations upon the Apologetical Narration</cite>, [of the Congregationalists of the Westminster Assembly], humbly submitted to the Honorable Houses of Parliament... (London: Meredith, 1643), ‘Annotations upon’ Steuart (1591–1654) was a Scottish presbyterian and professor of philosophy., pp. 61-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

19. From such a toleration follows all that we formerly deduced out of Independency. … 21. Neither can it but overthrow all ecclesiastical government; for a man being censured in one church may flee to another, and being again suspended in that other, from thence to another, and so scorn all the churches of God and their censures; and thus this order by necessary consequence will breed all disorder.”

— Adam Steuart, Some Observations &amp; Annotations upon the Apologetical Narration, [of the Congregationalists of the Westminster Assembly], humbly submitted to the Honorable Houses of Parliament... (London: Meredith, 1643), ‘Annotations upon’ Steuart (1591–1654) was a Scottish presbyterian and professor of philosophy., pp. 61-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BContra+a+civil+toleration+of+sects%3A%5D+1.+Because+it+cannot+but+open+a+door+to+all+sorts+of+erroneous+opinions.+2.+It+is+dangerous+for+the+State%3B+it+may+breed+factions+and+divisions+between+all+persons+of+whatsoever+relation%E2%80%94between+the+magistrate+and+the+subject%2C+the+husband+and+the+wife%2C+the+father+and+the+son%2C+brothers%2C+sisters%2C+the+master+and+the+servant%E2%80%94when+the+one+is+of+one+religion+or+ecclesiastical+government%2C+and+the+other+of+another%2C+as+you+have+experienced.+The+son+may+refuse+to+receive+any+communion+with+the+father%2C+and+the+brother+with+the+brother%2C+and+so+dissolve+all+natural%2C+civil%2C+and+domestic+bonds+of+society.+3.+No+State+in+Christendom%2C+where+there+is+one+only+religion+established%2C+will+admit+the+public+exercise+of+any+other%2C+or+endure+a+schism+in+that+which+is+already+received.+Wherefore+then+should+it+be+done+here%3F+4.+If+it+be+granted+to+our+brethren%2C+I+cannot+see+how+it+can+well+be+denied+to+other+sects.+If+it+be+said+that+other+sects+differ+more+from+us+than+they+do%2C+it+is+all+one%3B+magis+et+minus+non+mutant+speciem+%5Bmore+or+less+does+not+change+the+species%5D+in+the+matter+of+toleration.+For+then+all+must+be+tolerated%2C+some+more%2C+some+less.+And+some+of+our+brethren+grant+all+this+argument.+And+if+we+distinguish+so%2C+you+must+declare+and+expound+clearly+what+sects+and+what+opinions+are+to+be+tolerated%2C+and+what+not%E2%80%94an+inextricable+question%2C+which+no+mortal+man%2C+apparently%2C+is+able+distinctly+to+determine.+And+some+may+say%3A+the+less+the+difference+is%2C+the+less+need+there+is+for+a+toleration+to+be+granted+to+such+a+sect%3B+for+the+less+it+is%2C+the+greater+is+the+schism.+5.+God+in+the+Old+Testament+granted+no+toleration+of+diverse+religions+or+disciplines%3B+and+the+New+Testament+requires+no+less+union+among+Christians+than+the+Old+among+the+Jews.+6.+Either+our+brethren+assent+to+our+doctrine+and+are+resolved+likewise+to+assent+to+the+discipline+which+%28God+willing%29+shall+be+established+by+common+consent%2C+or+they+do+not.+If+they+grant+the+first%2C+what+need+they+any+other+toleration+than+the+rest%3F+If+the+second%2C+it+should+first+be+discussed+wherein+they+are+resolved+to+dissent%2C+and+afterwards+considered+whether+it+is+of+such+importance+that%2C+in+consideration+thereof%2C+they+dare+not+in+good+conscience+entertain+communion+with+us.+7.+They+are+not+pressed+to+be+actors+in+anything+against+their+consciences.+Therefore+they+need+not+be+suitors+for+a+toleration%3B+or+if+they+be%2C+it+may+justly+be+refused.+8.+It+is+against+the+nature+of+the+communion+of+saints+to+live+in+sects+apart%2C+without+communicating+at+the+Lord%E2%80%99s+Table%E2%80%94which+very+hardly+will+be+avoided+if+toleration+be+granted.+9.+Because+Scripture+exhorts+us+evermore+to+unity%2C+which+cannot+be+easily+procured+by+a+toleration+of+sects%2C+which+cannot+but+daily+beget+new+schisms+and+divisions.+10.+Because+the+difference+among+the+members+of+the+Church+of+Corinth+in+the+time+of+Saint+Paul+was+greater%2C+and+yet+they+communicated+together%3B+indeed%2C+the+Apostle+exhorted+them+to+mutual+communion+and+forbearance+of+sects+and+divisions.+11.+Because+the+opinion+of+our+brethren+resembles+too+much+that+of+the+Donatists%2C+who+separated+themselves+from+other+churches+under+pretext+that+they+were+not+so+holy+as+their+own.+Neither+is+it+unlike+the+convents+and+monasteries+among+the+Papists%3B+for+as+they+all+profess+one+doctrine+with+the+Romish+Church%2C+and+yet+every+order+has+its+own+discipline%E2%80%94Saint+Francis+one%2C+Saint+Dominic+another%E2%80%94and+in+every+order+one+general%2C+and+in+every+monastery+one+abbot%2C+prior%2C+or+president%2C+so+all+your+churches+believe+one+doctrine+together+with+us%2C+and+every+one+of+your+churches+has+one+minister%2C+as+their+convents+have+a+particular+abbot+or+prior.+You+only+differ+in+this%2C+that+you+have+no+general%2C+or+anything+answering+thereto%2C+to+keep+you+in+unity+and+conformity.+%E2%80%A6+13.+We+have+but+one+God%2C+one+Christ%2C+and+one+Lord%2C+one+Spirit%3B+we+are+one+body%3B+we+have+one+faith+and+one+baptism%2C+whereby+we+enter+into+the+Church.+Wherefore+shall+we+not+have+one+communion%2C+whereby+to+be+spiritually+fed%2C+and+one+discipline+to+be+ruled+by%3F+14.+If+churches+have+disciplines+or+governments+different+in+their+species%2C+then+the+churches+must+be+different+in+their+species+also%3B+for+all+collective+bodies+or+consociations+that+are+governed+are+differentiated+by+their+different+governments%2C+as+we+see+in+civil+government%2C+in+the+constitution+and+distinction+of+states%2C+kingdoms%2C+and+republics.+Wherefore%2C+as+many+diverse+governments+as+there+are+in+churches%2C+so+many+different+species+of+churches+must+we+admit.+I+speak+here+of+the+Church+considered+according+to+her+visible+form.+But+the+consequent+is+false%2C+since+there+is+but+one+Church.+Therefore%E2%80%94+15.+Neither+Christ+nor+his+Apostles+ever+granted+any+toleration+to+diverse+sects+and+governments+in+the+Church%3B+wherefore+then+will+you+be+suitors+for+that+which+they+never+granted%3F+%E2%80%A6+17.+Besides+all+this%2C+Scripture+forbids+all+such+toleration+as+that+of+Jezebel.+%28Rev.+2%3A20%29+There+must+be+no+such+speeches+among+us+as+%E2%80%9CI+am+of+Paul%2C%E2%80%9D+%E2%80%9CI+of+Apollos%2C%E2%80%9D+%E2%80%9CI+of+Cephas%E2%80%9D+%281+Cor+1%3A12%29%3B+nor+that+some+are+%E2%80%9CCalvinians%2C%E2%80%9D+as+you+term+us%2C+some+%E2%80%9CIndependents%2C%E2%80%9D+some+Brownists%2C+some+Anabaptists%2C+etc.+We+must+all+be+Christ%E2%80%99s%3B+we+must+all+think+and+speak+the+same+things+%28v.+10%29.+Otherwise+men+are+carnal.+Neither+has+the+Church+of+God+a+custom+to+be+contentious.+%5B1+Cor.+11%3A16%5D+Neither+does+the+apostle+permit+schisms.+%5B1+Cor.+12%3A25%5D+We+must+not+quit+our+mutual+meetings%2C+as+others+do%2C+and+as+must+be+done+in+a+public+toleration.+They+that+trouble+the+Church+must+be+cut+off.+%5BGal.+5%3A12%5D+18.+Such+a+toleration+cannot+but+expose+our+churches+to+the+calumnies+of+Papists%2C+who+always+object+to+Protestants+the+innumerable+number+of+their+sects%2C+whereas+they+pretend+to+be+nothing+but+one+Church.+19.+From+such+a+toleration+follows+all+that+we+formerly+deduced+out+of+Independency.+%E2%80%A6+21.+Neither+can+it+but+overthrow+all+ecclesiastical+government%3B+for+a+man+being+censured+in+one+church+may+flee+to+another%2C+and+being+again+suspended+in+that+other%2C+from+thence+to+another%2C+and+so+scorn+all+the+churches+of+God+and+their+censures%3B+and+thus+this+order+by+necessary+consequence+will+breed+all+disorder.%E2%80%9D%0A%0A%E2%80%94+Adam+Steuart%2C+Some+Observations+%26+Annotations+upon+the+Apologetical+Narration%2C+%5Bof+the+Congregationalists+of+the+Westminster+Assembly%5D%2C+humbly+submitted+to+the+Honorable+Houses+of+Parliament...+%28London%3A+Meredith%2C+1643%29%2C+%E2%80%98Annotations+upon%E2%80%99+Steuart+%281591%E2%80%931654%29+was+a+Scottish+presbyterian+and+professor+of+philosophy.%2C+pp.+61-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5e8b6e1711.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5e8b6e1711.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Contra%20a%20civil%20toleration%20of%20sects,necessary%20consequence%20will%20breed%20all%20disorder&amp;text=Contra%20a%20civil%20toleration%20of%20sects%3A%5D%201.%20Because&amp;text=order%20by%20necessary%20consequence%20will%20breed%20all%20disorder" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

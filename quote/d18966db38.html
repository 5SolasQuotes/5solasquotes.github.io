<main class="wrap"><figure class="quote" id="q-d18966db38" data-kw="">
<blockquote><p>Even though something is lacking in the purity of doctrine or of the sacraments, even though the holiness of life and the faithfulness of the ministers leaves much to be desired, one may not automatically leave the church. … in the true church much that is unsound can occur in doctrine and life without this giving people the right to separate from it …</p></blockquote>

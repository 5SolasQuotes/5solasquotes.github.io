<main class="wrap"><figure class="quote" id="q-02469c9495" data-kw="">
<blockquote><p>[John Owen:] ‘To make men members of any particular churches, their own consent is required.’ If he mean this of an explicit consent (as I suppose he does, or he says nothing) it is fully disproved above; and implicit confessed [consent is] sufficient. A man that removes his habitation (as both he and we grant, it’s free for him to do) may, by setting down in another congregation and submitting himself to all the ordinances of Christ there, with performance of all offices of love to the members of that congregation, implicitly and yet sufficiently consent[s] to be a member thereof. And on the other hand, a man may not remove his habitation from a congregation wherein he has long consented to communicate, and yet remove his consent to be a member of another, as we see too much, in this loose and wandering age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved against Dr. Owen</cite>, … (London: 1657), ch. 8, pp. 175-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>Eleventhly, [it is superstition] that he that is a member of one church may not communicate with any other but by the consent of the pastor and people of that one. Twelfthly, that he that is a member of a church may not remove his relation to another church (when his occasions and personal benefit require it and the public good of many is not hurt by it) without the consent of the pastor and people of that church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 58, p. 290</span></figcaption>

</figure><figure class="quote" id="q-71c04a633c" data-kw="">
<blockquote><p>Sixthly, the ministers are primarily ministers of the Church catholic; secondarily, of this or that particular flock or congregation: and therefore the catholic is the prime Church. And this appears by this demonstration: That Church to the which the donation of the ministry was first made, is the first subject thereof, but that was the Church catholic, therefore. For proof hereof see 1 Cor. 12:28-29, ‘God hath set some in the Church, first apostles, secondarily prophets, thirdly teachers.’ Now this Church was the Church catholic, and not any particular congregation, for it is the Church to which the Lord gave apostles. Note also from hence, that the same Church to which God gave apostles, and prophets, to the same He gave teachers also. Bishop and pastor may seem to be in respect to the particular relation to some particular place, wherein by the polity of the Church a particular minister is set, but presbyter, minister, and teacher, more general, extending to the whole Church catholic. Paul an apostle calls himself a teacher and preacher, 2 Tim. 1:11. Peter also and John the apostles call themselves presbyters, 1 Pet. 5:1-2; Ep. John 1; 3 John 1, we find also that ministers are in Scripture spoken of under a general notion. They are called ministers of the Word, Luke 1:2, and ministers of God, 2 Cor. 6:4, and ministers of Christ, 1 Cor. 4:1, and ministers of the New Testament, 2 Cor. 3:6, and ministers of the Gospel, 1 Thess. 3:2, and ministers of the Lord, Eph. 6:21, where the ministerial office is noted by the reference thereof to the author that employs them, and the subject about which they are employed, and not by the object to whom they preached; They are not called ministers of the people, but their teachers, rulers, pastors, overseers, or ministers for them, Col. 1:7. And if a minister of this or that congregation were not a minister of the Church catholic visible, then he were no minister out of his own congregation, and therefore could not preach, or administer any sacrament, as a minister, out of his own congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed</cite>, (London, 1645), pp. 32-33</span></figcaption>

</figure><figure class="quote" id="q-b869d84c47" data-kw="">
<blockquote><p>We hold all who profess faith in Christ to be members of the visible Church, though they be not members of a visible congregation, and that the seals of the Covenant [of Grace] should not be denied to them. And for [the] more full clearing of the question, let these considerations be observed: First Distinction: All believers, as believers, in foro Dei, ‘before God’ have right to the seals of the Covenant [of Grace], these to whom the Covenant and body of the Charter belongs, to these the seal belongs, but in foro Ecclesiastico [in the sight of the Church], and in an orderly Church-way, the seals are not to be conferred by the Church upon persons because they believe, but because they profess their believing: therefore the apostles never baptized pagans, but upon profession of their faith. Second Distinction: Faith in Christ truly gives right to the seals of the Covenant [of Grace], and in God’s intention and decree, called voluntas beneplaciti [will of good-pleasure], they belong only to the invisible Church; but the orderly way of the Churches’ giving the seals is because such a society is a professing or visible Church, and [the] orderly giving of the seals according to God’s approving will, called, voluntas signi et revelata [the signified and revealed will], belongs to the visible Church. Third Distinction: The Church may orderly and lawfully give the seals of the Covenant to those to whom the Covenant and promises of grace do not belong in God’s decree of election. Fourth Distinction: The Church may lawfully add to the Church visible such as God adds not to the Church invisible, as they may add Simon Magus; and the Church may lawfully cast out of the visible Church, such as Christ has not cast out of the invisible Church, as the Church may excommunicate regenerate persons for scandalous sins. Fifth Distinction: Then the regenerate-excommunicated have right to the seals of the Covenant, as they have to the Covenant, and yet the Church does lawfully debar them, hic et nunc [here and now], in such a scandalous case, from the seals of the Covenant. We hold that those who are not members of a particular congregation may lawfully be admitted to the seals of the Covenant: First, Because those to whom the promises are made, and profess the Covenant, these should be baptized. But men of approved piety are such, though they be not members of a particular parish. The proposition is Peter’s argument, Acts 2:38. Secondly, Those who are not members of a particular church may be visible professors, and so members of a visible Church. Therefore, the seals of the Covenant belong to them. Thirdly, The contrary opinion has no warrant in God’s Word. Fourthly, The apostles required no more of those whom they baptized but profession of belief, as Acts 10:47, ‘Can any forbid water that these should not be baptized, who have received the Holy Ghost, as well as we?’ Acts 8:37, ‘If thou believest with all thy heart, thou mayest be baptized:’ no more is sought of the jailor, Acts 16:31,34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 185-6 of ‘Whether the Seals of the Covenant can be Denied to Professors of Approved Piety, because they are Not Members of a Particular Visible Church, in the New Testament?’ in The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5</span></figcaption>

ovenant, and yet the Church does lawfully debar them, hic et nunc [here and now], in such a scandalous case, from the seals of the Covenant. We hold that those who are not members of a particular congregation may lawfully be admitted to the seals of the Covenant: First, Because those to whom the promises are made, and profess the Covenant, these should be baptized. But men of approved piety are such, though they be not members of a particular parish. The proposition is Peter’s argument, Acts 2:38. Secondly, Those who are not members of a particular church may be visible professors, and so members of a visible Church. Therefore, the seals of the Covenant belong to them. Thirdly, The contrary opinion has no warrant in God’s Word. Fourthly, The apostles required no more of those whom they baptized but profession of belief, as Acts 10:47, ‘Can any forbid water that these should not be baptized, who have received the Holy Ghost, as well as we?’ Acts 8:37, ‘If thou believest with all thy heart, thou mayest be baptized:’ no more is sought of the jailor, Acts 16:31,34.”

— Samuel Rutherford, pp. 185-6 of ‘Whether the Seals of the Covenant can be Denied to Professors of Approved Piety, because they are Not Members of a Particular Visible Church, in the New Testament?’ in The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+hold+all+who+profess+faith+in+Christ+to+be+members+of+the+visible+Church%2C+though+they+be+not+members+of+a+visible+congregation%2C+and+that+the+seals+of+the+Covenant+%5Bof+Grace%5D+should+not+be+denied+to+them.+And+for+%5Bthe%5D+more+full+clearing+of+the+question%2C+let+these+considerations+be+observed%3A+First+Distinction%3A+All+believers%2C+as+believers%2C+in+foro+Dei%2C+%E2%80%98before+God%E2%80%99+have+right+to+the+seals+of+the+Covenant+%5Bof+Grace%5D%2C+these+to+whom+the+Covenant+and+body+of+the+Charter+belongs%2C+to+these+the+seal+belongs%2C+but+in+foro+Ecclesiastico+%5Bin+the+sight+of+the+Church%5D%2C+and+in+an+orderly+Church-way%2C+the+seals+are+not+to+be+conferred+by+the+Church+upon+persons+because+they+believe%2C+but+because+they+profess+their+believing%3A+therefore+the+apostles+never+baptized+pagans%2C+but+upon+profession+of+their+faith.+Second+Distinction%3A+Faith+in+Christ+truly+gives+right+to+the+seals+of+the+Covenant+%5Bof+Grace%5D%2C+and+in+God%E2%80%99s+intention+and+decree%2C+called+voluntas+beneplaciti+%5Bwill+of+good-pleasure%5D%2C+they+belong+only+to+the+invisible+Church%3B+but+the+orderly+way+of+the+Churches%E2%80%99+giving+the+seals+is+because+such+a+society+is+a+professing+or+visible+Church%2C+and+%5Bthe%5D+orderly+giving+of+the+seals+according+to+God%E2%80%99s+approving+will%2C+called%2C+voluntas+signi+et+revelata+%5Bthe+signified+and+revealed+will%5D%2C+belongs+to+the+visible+Church.+Third+Distinction%3A+The+Church+may+orderly+and+lawfully+give+the+seals+of+the+Covenant+to+those+to+whom+the+Covenant+and+promises+of+grace+do+not+belong+in+God%E2%80%99s+decree+of+election.+Fourth+Distinction%3A+The+Church+may+lawfully+add+to+the+Church+visible+such+as+God+adds+not+to+the+Church+invisible%2C+as+they+may+add+Simon+Magus%3B+and+the+Church+may+lawfully+cast+out+of+the+visible+Church%2C+such+as+Christ+has+not+cast+out+of+the+invisible+Church%2C+as+the+Church+may+excommunicate+regenerate+persons+for+scandalous+sins.+Fifth+Distinction%3A+Then+the+regenerate-excommunicated+have+right+to+the+seals+of+the+Covenant%2C+as+they+have+to+the+Covenant%2C+and+yet+the+Church+does+lawfully+debar+them%2C+hic+et+nunc+%5Bhere+and+now%5D%2C+in+such+a+scandalous+case%2C+from+the+seals+of+the+Covenant.+We+hold+that+those+who+are+not+members+of+a+particular+congregation+may+lawfully+be+admitted+to+the+seals+of+the+Covenant%3A+First%2C+Because+those+to+whom+the+promises+are+made%2C+and+profess+the+Covenant%2C+these+should+be+baptized.+But+men+of+approved+piety+are+such%2C+though+they+be+not+members+of+a+particular+parish.+The+proposition+is+Peter%E2%80%99s+argument%2C+Acts+2%3A38.+Secondly%2C+Those+who+are+not+members+of+a+particular+church+may+be+visible+professors%2C+and+so+members+of+a+visible+Church.+Therefore%2C+the+seals+of+the+Covenant+belong+to+them.+Thirdly%2C+The+contrary+opinion+has+no+warrant+in+God%E2%80%99s+Word.+Fourthly%2C+The+apostles+required+no+more+of+those+whom+they+baptized+but+profession+of+belief%2C+as+Acts+10%3A47%2C+%E2%80%98Can+any+forbid+water+that+these+should+not+be+baptized%2C+who+have+received+the+Holy+Ghost%2C+as+well+as+we%3F%E2%80%99+Acts+8%3A37%2C+%E2%80%98If+thou+believest+with+all+thy+heart%2C+thou+mayest+be+baptized%3A%E2%80%99+no+more+is+sought+of+the+jailor%2C+Acts+16%3A31%2C34.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+pp.+185-6+of+%E2%80%98Whether+the+Seals+of+the+Covenant+can+be+Denied+to+Professors+of+Approved+Piety%2C+because+they+are+Not+Members+of+a+Particular+Visible+Church%2C+in+the+New+Testament%3F%E2%80%99+in+The+Due+Right+of+Presbyteries%E2%80%A6+%281644%29%2C+pt.+2%2C+ch.+4%2C+section+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb869d84c47.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b869d84c47.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=We%20hold%20all%20who%20profess%20faith,sought%20of%20the%20jailor%2C%20Acts%2016%3A31%2C34&amp;text=We%20hold%20all%20who%20profess%20faith%20in%20Christ&amp;text=more%20is%20sought%20of%20the%20jailor%2C%20Acts%2016%3A31%2C34" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…these… truths are most certainly evident out of the Scripture. All Christians in the Church of Jerusalem were admitted into Church-fellowship upon their repenting, believing and being baptized, without any other conditions, and that upon offering themselves… But it will farther more illustriously yet appear, if we consider the diverse other additions of believers, and that daily unto the Church of Jerusalem: for in the last verse of this chapter it is said that the Lord added daily unto the Church such as should be saved; here we find additions upon additions of believers, and that daily, indefinitely set down, as if they could not easily have been told, which adds no small emphasis unto the expression; and all these were admitted into Church-fellowship without any of those conditions the Independents require of all their members in these our times; for it is said the Lord added daily unto the Church such as should be saved; and therefore He did it only upon his own terms of repentance, faith and baptism.</p></blockquote>

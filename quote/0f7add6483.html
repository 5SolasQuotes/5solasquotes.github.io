<main class="wrap"><figure class="quote" id="q-0f7add6483" data-kw="">
<blockquote><p>Evan. Yea, indeed, it is impossible for any mere man in the time of this life to keep it perfectly; yea, though he be a regenerate man; for the law requireth of man that he “love the Lord with all his heart, soul, and might;” and there is not the holiest man that lives, but he is flesh as well as spirit in all parts and faculties of his soul, and therefore cannot love the Lord perfectly.

Yea, and the law forbiddeth all habitual concupiscence, not only saying, “Thou shalt not consent to lust,” but, “Thou shalt not lust:” it doth not only command the binding of lust, but forbids also the being of lust: and who in this case can say, My heart is clean?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 181.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3fd84ecb2b" data-kw="">
<blockquote><p>Forsomuch then as it appears by most substantial reasons that the corrupt lusts which remain in us after baptism are sins; now it rests that we see unto what kind or part of sins they belong. Sin may seem thus to be divided: that there is one thing, which may be forgiven, and another thing, which cannot. Transgression against the law of God, which is never forgiven, is sin against the Holy Ghost. But if sin may be forgiven, that may be two manner of ways: for either it is so forgiven as we must of necessity altogether depart from it; which we see come to pass in sore and grievous sins, which Paul says do separate us from the kingdom of God, and commonly be called mortal: and those be called small or venial sins, without the which man’s life cannot here be led. [Note in margin: 1 Cor. 6:9, or else be so forgiven, as we depart not from them; partly, through ignorance engrafted in us, and partly, by reason of the infirmity, wherewith we be infected.] [Note in margin: Lust and the first motions motions unto evil, be in their own nature mortal] Paul has put a notable difference between these sins, when he exhorts us that we should not suffer sin to reign in us. (Rom. 6:1) And of this third kind of sins the apostle complained, when he said, ‘O unhappy man that I am! Who shall deliver me from the body of this death? (Rom. 7:24)’ And of these sins do we mean, when we teach, that the works of men, notwithstanding they be godly men, be not without deadly sins; for that we do nothing without this kind of defects. And such kind of defects be deadly, because in their own nature they deserve death: for the reward of sin is death. Further also, for that so long as we carry about with us these blemishes of corruption, we cannot enjoy the life eternal: for so long are we excluded from it, until by death we have put off all corruption. Moreover, it is written; ‘Cursed be every one, which abides not in all the things which are written in the words of this law.’ And he which complains with Paul, that he does not the good which he would, does not perform all the things, which the law requires, nor is not utterly without curse: though the same, through the mercy of God, be not imputed unto him unto eternal destruction. [Note in margin: By the mercy of God they be not imputed to damnation]</p></blockquote>

</figure><figure class="quote" id="q-bd3247d398" data-kw="">
<blockquote><p>For in every little transgression of the divinely commanded law, God’s authority is set aside… [S]ince God has explained his will in the Law, every thing contrary to the Law is displeasing to Him. Will they feign that the wrath of God is so disarmed that the punishment of death will not forthwith follow upon it? He has declared … “The soul that sinneth it shall die,” (Ezek. 18:20). Again, in the passage lately quoted, “The wages of sin is death.”… [L]et the children of God remember that all sin is mortal, because it is rebellion against the will of God, and necessarily provokes his anger; and because it is a violation of the Law, against every violation of which, without exception, the judgment of God has been pronounced. The faults of the saints are indeed venial, not, however, in their own nature, but because, through the mercy of God, they obtain pardon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Institutes, II.8.59</span></figcaption>

</figure><figure class="quote" id="q-c8505ebdcc" data-kw="">
<blockquote><p>The progress in sin is therefore such… First, from the tinder comes a certain motion of titillation in the flesh toward lust, that is toward carnal concupiscence, which the sense existing in the flesh apprehends. [Second,] Through whose apprehension first the sensitive appetite conjoined to the sense is moved by a motion of pleasure about that to which the flesh tingles. Thirdly it is moved by a motion of desire to pursue that into action, which motion in the sensitive appetite mediated by the sense is apprehended by the reason of simple intelligence. Through which apprehension fourthly the will is moved by a motion of delight in delighting in the sensitive appetite; and in the fifth way by a motion into delight; and sixth by surreptitious desire for consent to pursue that into action, and here is the boundary and term of venial sin. Seventh is interpretative consent in delight, and it is the first and lowest grade of mortal sin, which is called mortal from morose delight. Eighth is true consent in delight. Ninth is consent in deed and according to Augustine in On the Sermon of the Lord on the Mount, “full sin known to God in our heart, and now if by deed it does not become known to men”. And then tenth, if the opportunity is present, follows the execution of the deed. Eleventh, from frequent execution, custom; and twelfth from custom, despair; and thirteenth, from despair, obstinacy, says Augustine in the sermon on Pharaoh’s hardening: “From a multitude of sins despair is born, and from despair hardness is generated according to that which is written: ‘The sinner, when he has come into the depths of sins, despises&#x27;”. And then fourteenth and last follows final impenitence, of which says Augustine in the sermon on blasphemy against the Holy Spirit: “Impenitence, as long as one lives in this flesh, cannot be judged as we understand persistent hardness of heart”. … First indeed in this way undoubtedly first motions are sins, both in the regenerate and in the unregenerate, because they have deformity in themselves against the rules of prudence and right reason, which deformity has the rule of vice, just as its contrary information has the rule of virtue. In this way also the said obliquity in the rule has the rule of vice, and similarly the tinder in the flesh, and this according to the manner in which virtues and vices are granted to be in the sensitive powers not by essence, but by a certain participation, as we determined in a preceding Quolibet… Secondly… And this mortal, if mortal sin be called that to which is due eternal punishment, because with sin as it is sin, eternal punishment is due… And this sin in the unregenerate should be called not original sin, but actual, and this because it is perpetrated not by an act of its own will, but by an act proper to its own flesh. … To the second that “first motions are not voluntary”, it must be said that, although not voluntary as regards the will of him in whom they are… they are however voluntary as regards the will of the first parent, as determines Augustine, bk. 3, ‘On Free Choice’, from whose will proceeded his own proper actual sin and henceforth all other original sins of others, either medially or immediately, and from them first motions, from whose will they have that they are sins both as regards blemish and as regards guilt…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-of-ghent.html">Henry of Ghent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, question 32, ‘Are First Motions Sin’ tr. by AI</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The progress in sin is therefore such… First, from the tinder comes a certain motion of titillation in the flesh toward lust, that is toward carnal concupiscence, which the sense existing in the flesh apprehends. [Second,] Through whose apprehension first the sensitive appetite conjoined to the sense is moved by a motion of pleasure about that to which the flesh tingles. Thirdly it is moved by a motion of desire to pursue that into action, which motion in the sensitive appetite mediated by the sense is apprehended by the reason of simple intelligence. Through which apprehension fourthly the will is moved by a motion of delight in delighting in the sensitive appetite; and in the fifth way by a motion into delight; and sixth by surreptitious desire for consent to pursue that into action, and here is the boundary and term of venial sin. Seventh is interpretative consent in delight, and it is the first and lowest grade of mortal sin, which is called mortal from morose delight. Eighth is true consent in delight. Ninth is consent in deed and according to Augustine in On the Sermon of the Lord on the Mount, “full sin known to God in our heart, and now if by deed it does not become known to men”. And then tenth, if the opportunity is present, follows the execution of the deed. Eleventh, from frequent execution, custom; and twelfth from custom, despair; and thirteenth, from despair, obstinacy, says Augustine in the sermon on Pharaoh’s hardening: “From a multitude of sins despair is born, and from despair hardness is generated according to that which is written: ‘The sinner, when he has come into the depths of sins, despises&#x27;”. And then fourteenth and last follows final impenitence, of which says Augustine in the sermon on blasphemy against the Holy Spirit: “Impenitence, as long as one lives in this flesh, cannot be judged as we understand persistent hardness of heart”. … First indeed in this way undoubtedly first motions are sins, both in the regenerate and in the unregenerate, because they have deformity in themselves against the rules of prudence and right reason, which deformity has the rule of vice, just as its contrary information has the rule of virtue. In this way also the said obliquity in the rule has the rule of vice, and similarly the tinder in the flesh, and this according to the manner in which virtues and vices are granted to be in the sensitive powers not by essence, but by a certain participation, as we determined in a preceding Quolibet… Secondly… And this mortal, if mortal sin be called that to which is due eternal punishment, because with sin as it is sin, eternal punishment is due… And this sin in the unregenerate should be called not original sin, but actual, and this because it is perpetrated not by an act of its own will, but by an act proper to its own flesh. … To the second that “first motions are not voluntary”, it must be said that, although not voluntary as regards the will of him in whom they are… they are however voluntary as regards the will of the first parent, as determines Augustine, bk. 3, ‘On Free Choice’, from whose will proceeded his own proper actual sin and henceforth all other original sins of others, either medially or immediately, and from them first motions, from whose will they have that they are sins both as regards blemish and as regards guilt…”

— Henry of Ghent, Other citations (work not named), question 32, ‘Are First Motions Sin’ tr. by AI">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+progress+in+sin+is+therefore+such%E2%80%A6+First%2C+from+the+tinder+comes+a+certain+motion+of+titillation+in+the+flesh+toward+lust%2C+that+is+toward+carnal+concupiscence%2C+which+the+sense+existing+in+the+flesh+apprehends.+%5BSecond%2C%5D+Through+whose+apprehension+first+the+sensitive+appetite+conjoined+to+the+sense+is+moved+by+a+motion+of+pleasure+about+that+to+which+the+flesh+tingles.+Thirdly+it+is+moved+by+a+motion+of+desire+to+pursue+that+into+action%2C+which+motion+in+the+sensitive+appetite+mediated+by+the+sense+is+apprehended+by+the+reason+of+simple+intelligence.+Through+which+apprehension+fourthly+the+will+is+moved+by+a+motion+of+delight+in+delighting+in+the+sensitive+appetite%3B+and+in+the+fifth+way+by+a+motion+into+delight%3B+and+sixth+by+surreptitious+desire+for+consent+to+pursue+that+into+action%2C+and+here+is+the+boundary+and+term+of+venial+sin.+Seventh+is+interpretative+consent+in+delight%2C+and+it+is+the+first+and+lowest+grade+of+mortal+sin%2C+which+is+called+mortal+from+morose+delight.+Eighth+is+true+consent+in+delight.+Ninth+is+consent+in+deed+and+according+to+Augustine+in+On+the+Sermon+of+the+Lord+on+the+Mount%2C+%E2%80%9Cfull+sin+known+to+God+in+our+heart%2C+and+now+if+by+deed+it+does+not+become+known+to+men%E2%80%9D.+And+then+tenth%2C+if+the+opportunity+is+present%2C+follows+the+execution+of+the+deed.+Eleventh%2C+from+frequent+execution%2C+custom%3B+and+twelfth+from+custom%2C+despair%3B+and+thirteenth%2C+from+despair%2C+obstinacy%2C+says+Augustine+in+the+sermon+on+Pharaoh%E2%80%99s+hardening%3A+%E2%80%9CFrom+a+multitude+of+sins+despair+is+born%2C+and+from+despair+hardness+is+generated+according+to+that+which+is+written%3A+%E2%80%98The+sinner%2C+when+he+has+come+into+the+depths+of+sins%2C+despises%27%E2%80%9D.+And+then+fourteenth+and+last+follows+final+impenitence%2C+of+which+says+Augustine+in+the+sermon+on+blasphemy+against+the+Holy+Spirit%3A+%E2%80%9CImpenitence%2C+as+long+as+one+lives+in+this+flesh%2C+cannot+be+judged+as+we+understand+persistent+hardness+of+heart%E2%80%9D.+%E2%80%A6+First+indeed+in+this+way+undoubtedly+first+motions+are+sins%2C+both+in+the+regenerate+and+in+the+unregenerate%2C+because+they+have+deformity+in+themselves+against+the+rules+of+prudence+and+right+reason%2C+which+deformity+has+the+rule+of+vice%2C+just+as+its+contrary+information+has+the+rule+of+virtue.+In+this+way+also+the+said+obliquity+in+the+rule+has+the+rule+of+vice%2C+and+similarly+the+tinder+in+the+flesh%2C+and+this+according+to+the+manner+in+which+virtues+and+vices+are+granted+to+be+in+the+sensitive+powers+not+by+essence%2C+but+by+a+certain+participation%2C+as+we+determined+in+a+preceding+Quolibet%E2%80%A6+Secondly%E2%80%A6+And+this+mortal%2C+if+mortal+sin+be+called+that+to+which+is+due+eternal+punishment%2C+because+with+sin+as+it+is+sin%2C+eternal+punishment+is+due%E2%80%A6+And+this+sin+in+the+unregenerate+should+be+called+not+original+sin%2C+but+actual%2C+and+this+because+it+is+perpetrated+not+by+an+act+of+its+own+will%2C+but+by+an+act+proper+to+its+own+flesh.+%E2%80%A6+To+the+second+that+%E2%80%9Cfirst+motions+are+not+voluntary%E2%80%9D%2C+it+must+be+said+that%2C+although+not+voluntary+as+regards+the+will+of+him+in+whom+they+are%E2%80%A6+they+are+however+voluntary+as+regards+the+will+of+the+first+parent%2C+as+determines+Augustine%2C+bk.+3%2C+%E2%80%98On+Free+Choice%E2%80%99%2C+from+whose+will+proceeded+his+own+proper+actual+sin+and+henceforth+all+other+original+sins+of+others%2C+either+medially+or+immediately%2C+and+from+them+first+motions%2C+from+whose+will+they+have+that+they+are+sins+both+as+regards+blemish+and+as+regards+guilt%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Henry+of+Ghent%2C+Other+citations+%28work+not+named%29%2C+question+32%2C+%E2%80%98Are+First+Motions+Sin%E2%80%99+tr.+by+AI&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc8505ebdcc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c8505ebdcc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=The%20progress%20in%20sin%20is%20therefore,regards%20blemish%20and%20as%20regards%20guilt&amp;text=The%20progress%20in%20sin%20is%20therefore%20such&amp;text=both%20as%20regards%20blemish%20and%20as%20regards%20guilt" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. It [original corruption] is called also Concupiscence. …

III. Therefore the Papists do erroneously exempt it from being a sin, reckoning it among the works of God.

By the name of Concupiscence is understood, either that natural faculty of desire which was in man, even before his fall, or that corruption which naturally adheres to it, as it is in it, in the first act, and as it inclines man only to evil.</p></blockquote>

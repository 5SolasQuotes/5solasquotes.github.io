<main class="wrap"><figure class="quote" id="q-43b893ee43" data-kw="">
<blockquote><p>And let us remember, my brothers, that we have today taken the holy Sacrament to be the cement of this peace, and the incorruptible and immortal seal of the bond of this fraternal affection. For it is not only the pledge of the mercy of God towards us, the assurance of the remission of our sins in the death of Christ, the confirmation of the truth of his promises: it is not only the mark by which we testify reciprocally, he, that he wants to have communion with us, we, that we want to have communion with him, it is still a solemn declaration, and a kind of oath that we make, that we want to have inviolable communion the ones with the others.

It is for that that we eat of one same bread, in order to protest highly that we want to be one same body: it is for that that we drink of one same cup; as if we said in the presence of God and of his holy Angels, that as we are watered of one same Spirit, we want to have only same sentiments and same movements, and as we tend towards one same end, and run in one same career, we run there of same ardour, equally and constantly, without hindering, and without interferring the ones the others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Melchisedec Represented in Four Sermons on Chapter VII. of the Epistle to the Hebrews v. 1. 2. &amp; 3</cite>, (Saumur: Isaac Desbordes, 1657), pp 38-39. (Translation generated by Grok.)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19a2e6f8a1" data-kw="">
<blockquote><p>What remains but for the blind to see, the deaf to hear, children even to perceive this abomination of the mass, which, held forth in a golden cup, has so intoxicated all the kings and nations of the earth, from the highest to the lowest; so struck them with stupor and giddiness, that, duller than the lower animals, they have placed the vessel of their salvation in this fatal vortex. Certainly Satan never employed a more powerful engine to assail and storm the kingdom of Christ.</p></blockquote>

</figure><figure class="quote" id="q-2815f4ead8" data-kw="">

</figure><figure class="quote" id="q-7dc555aaa8" data-kw="">
<blockquote><p>Now besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us, signifies veneration or reverence, sitting at table signifies familiarity and fellowship. ‘For which of you,’ says our Master, ‘having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat.’ [Lk. 17:7] All these signs have their significations from nature. And if it be said that howbeit sitting at our common-tables be a sign natural, to signify familiarity amongst us, yet nature has not given such a signification to sitting at the Lord’s Table, I answer that sitting is a natural sign of familiarity at what table soever it be used. At the heavenly table in the Kingdome of Glory familiarly is expressed and signified by sitting, Mt. 8:11, ‘Many shall come from the east and west, and shall sit down with Abraham, etc.’ Much more then at the spiritual table in the Kingdom of Grace. The difference betwixt other common tables and the Lord’s Table can infer no more but that with great humility we ought to addresse ourselves unto it: yet still we are to make use of our familiarity with Christ ut tanquam in eodem toro accumbentes, as says Chrysostom. Wherefore we do not there so look to Christ in his princely throne and glorious majesty, exalted far above all principalities and powers, as to forget that He is our loving and kind banqueter, who has admitted us to that familiar fellowship with Him, which is signified by our sitting at his table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, pp. 85-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-8414054909" data-kw="">

<main class="wrap"><figure class="quote" id="q-b59ef58488" data-kw="">
<blockquote><p>The name of Chamier (d. 1621) is one of the greatest, not only among Calvinistic divines, but in all theological literature. His Panstratiae Catholicae (1626) is the ablest work from a Calvinistic hand in in the great Roman Catholic Controversy, and takes its general rank with books like Chemnitz’s Examen and Gerhard’s Confessio Catholica. It was prepared at the request of the Synod of Larochelle. There is no difference of opinion among competent judges as to its distinguished merits, and it is justly regarded among all Calvinists as one of the highest authorities.” – Krauth, a Lutheran, p. 47 A Body of Theology, or Theological Common Places (Geneva, 1653) Bk. 4, ch. 11, ‘Of Concupiscence’, pp. 141-43 Bk. 5, ch. 18, ‘Of Concupiscence in the Regenerate’, pp. 233-36 Du Moulin, Pierre – ch. 54, ‘Of the Perfection of Righteousness, or the Fulfillment of the Law, &amp; is Concupiscence a Sin?’ in A Collection of the Theological Disputations held at Various Times in the Academy of Sedan, vol. 1 (Geneva, 1661), pp. 474-81 Du Moulin (1568-1658) Hoornbeek, Johannes – Bk. 10, ch. 23, ‘Of Concupiscence’ in Practical Theology, vol. 2 (Utrecht, 1663; 1689), pp. 607-611 Rissen, Leonard – Locus 9, ‘Of Sin’, Controversy 2, ‘Whether Concupiscence, which Remains in the Regenerate After Baptism, is Truly Sin, Worthy of Death?’ in A Sum of Didactic and Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology, so augmented &amp; Illustrated (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). . 1700’s Vitringa, Sr., Campegius – ch. 10, ‘Of Concupiscence’ in The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 2 (d. 1722), pp. 292-295 Vitringa, Sr. (1659-1722) was a professor in Franeker and a Hebraist. “…Vitringa… maintained a fairly centrist Reformed position… Vitringa and De Moor serve as codifiers and bibliographers of the earlier tradition, the former from a federalist, the latter from a nonfederalist perspective.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Panstratiae Catholicae, or a Body of the Controversies of Religion Against the Papists</cite>, vol. 3 (Man) (Geneva, 1626) | Bk. 10, ‘Of Sanctification &amp; Justification’, chs. 4-20, pp. 274-313 ToC</span></figcaption>

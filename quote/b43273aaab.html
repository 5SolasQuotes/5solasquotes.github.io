<blockquote><p>Through an examination of the history of the doctrine and its constituent features the present article advocates the reclamation of the doctrine as a necessary component for a contemporary theology of the atonement… The extra Calvinisticum is then adopted to refute contemporary theologies of a suffering God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b442d0187d" data-kw="">
<blockquote><p>Regarding laymen, suppose the Lord’s Supper is not administered in every way it ought to be (as through much of Church history). A layman ought not then to conform to and participate in such an inconvenient and actively scandalous ceremony. This may preclude one from receiving the Supper for many years or most of one’s life. Yet in the time of Hannah, were not the Israelites still bound to receive the sacrificial meals in 1 Sam. 2:12–17, though the corrupt priests had greatly marred them, adjoining the threat of physical coercion; and were not the Israelites in some measure to be blamed for withdrawing from and abhorring the offering of the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 51</span></figcaption>

</figure><figure class="quote" id="q-6225698499" data-kw="">
<blockquote><p>Regarding ministers, if one today comes to believe it is most proper, apart from necessity, to sit at a table for the Supper, or to do it with a common cup, and that’s not going to happen in the next few weeks or several months, must a minister abstain from dispensing an impure Supper (with the attendant consequences) or resign his charge to his congregation and go elsewhere? Do you have a framework in which to deal with this, while maintaining a clear and undoubting conscience? If Church officers cannot ever comply with things not fully right, regarding worship or otherwise, then officers can never remain in the Church while seeking her reform. Most all the reformers were against Gillespie’s principle as they continued in the Church (maintaining her unity) while performing practices they did not believe were fully right, while seeking to reform them to the Word, which largely occurred. That was a great good, only able to be attained through that means and our principle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 51</span></figcaption>

20that%20means%20and%20our%20principle" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8aae17ae7c" data-kw="">
<blockquote><p>The ceremonies associated with these signs are of express significance, and therefore are to be implemented as Christ has exemplified in the institution of it. Christ broke the bread, thereby signifying the breaking of his body, that is, his death. The apostle passes on to the congregation the ceremony of breaking; he refers to it as ‘the breaking of bread,’ and ‘the bread which we break’ (1 Cor. 10:16). The apostolic church did likewise, ‘…breaking bread’ (Acts 2:46); ‘…when the disciples came together to break bread’ (Acts 20:7). Therefore today the minister also must break the bread and give it as such to the communicants. The Papists and the Lutherans do this in an entirely different manner by giving a wafer to everyone without breaking it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, (RHB), vol. 2, pp. 474, 529 &amp; 532</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-8679261eb5" data-kw="">
<blockquote><p>Thirdly, it cannot be denied but that the first communicants who received from Christ [at the first Lord’s Supper] might with more ease and conveniency be placed at the table than can be now in many churches which have been accustomed to another way. But we must not bring down our rule to our conveniences; rather, bring up our conveniencies to our rule. It is no hard matter to alter pews and such like things in churches, where the present posture is inconsistent with following the pattern: and a less alteration will serve than is apprehended. Fourthly, the flux and reflux (so to speak) of several successive tables, where there is a great number to communicate, and the repeating, or pronouncing, and applying to those several tables of receivers the words, ‘Take ye, eat ye,’ which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they who so charge us ever make good what they alledge, unlesse they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection (suppose I say, there had been so many communicants) yet He had given them all at once the elements and had said but once, ‘Take ye, eat ye,’ and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not. Fifthly, our dissenting brethren of the Independent way, who dislike our several and successive tables in one congregation, as a dividing of those who ought to communicate all together (for they would have none of the communicants receive the cup [which comes after the bread] before all of the congregation who communicate have received the bread), these brethren, I say, may satisfy themselves from their own principles: For they hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example. If one of their congregations may receive the sacrament in several houses, when (by reason of numerousness) they cannot all receive it together in one house, I cannot conceive why they may not much more allow us several successive tables in the assembly when the whole cannot communicate at one table…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 220-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper &amp; of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions…</span></figcaption>

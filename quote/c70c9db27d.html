<main class="wrap"><figure class="quote" id="q-c70c9db27d" data-kw="">
<blockquote><p>Whereas they say that there is a double head of the church, one imperial, which is Christ alone, the other ministerial, which is the pope governing the whole church under Christ; I answer, this distinction robs Christ of His honor because in setting up their ministerial head, they are fain to borrow of Christ things proper unto Him, as the privilege to forgive sins properly and the power to govern the whole earth by making of laws that shall as truly bind conscience as the laws of God, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, “Of the Supremacy in Causes Ecclesiastical”</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 26.4</span></figcaption>

</figure><figure class="quote" id="q-5b5bb0e3ba" data-kw="Upon this rock">
<blockquote><p>Peter had confessed in his own name, and that of his brethren, that Christ was the Son of God (Mt. 16:16). On this rock Christ builds his Church, because it is the only foundation; as Paul says, &quot;Other foundation than this can no man lay&quot; (1 Cor. 3:11).</p></blockquote>

</figure><figure class="quote" id="q-09308723bf" data-kw="">
<blockquote><p>No sooner is such a word spoken but immediately the wicked bestial lives, the ignorance, atheisms, and horrid ends of many of them, present themselves to the thoughts of men, and a tremor comes over their hearts to hear men open their mouths with such blasphemies as to affirm that the Lord Christ did as much manifest his divinity and power in such beasts as in his own person.</p></blockquote>

</figure><figure class="quote" id="q-43f398b797" data-kw="Upon this rock">
<blockquote><p>Mt. 16:18 does not favor the primacy of Peter. First, the passage is allegorical and metaphorical, admitting of various interpretations. Assuredly, it cannot establish an ecumenical pontificate, which ought to be proved by some express passage. Second, these things are certainly said to Peter, but not about Peter. The reasons are various. (a) From the very words because Petra is expressly distinguished from Petro, both in person and in gender, as the denominating and the denominated. Yet if he had wished to indicate Peter, why did he use both? Why did he not say, “Thou art Peter and upon thee” (which would have removed all difficulty). Rather he says “and upon this rock.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.13</span></figcaption>

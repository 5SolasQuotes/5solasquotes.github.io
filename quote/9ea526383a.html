<main class="wrap"><figure class="quote" id="q-9ea526383a" data-kw="">
<blockquote><p>In order to keep the legitimate course in this matter, we must return to the word of God, in which we are furnished with the right rule of understanding. For Scripture is the school of the Holy Spirit, in which as nothing useful and necessary to be known has been omitted, so nothing is taught but what it is of importance to know. Every thing, therefore delivered in Scripture on the subject of predestination, we must beware of keeping from the faithful, lest we seem either maliciously to deprive them of the blessing of God, or to accuse and scoff at the Spirit, as having divulged what ought on any account to be suppressed. Let us, I say, allow the Christian to unlock his mind and ears to all the words of God which are addressed to him, provided he do it with this moderation--viz. that whenever the Lord shuts his sacred mouth, he also desists from inquiry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f426fefa18" data-kw="persuaded free mercy election">
<blockquote><p>We shall never feel persuaded as we ought that our salvation flows from the free mercy of God as its fountain, until we are made acquainted with his eternal election, the grace of God being illustrated by the contrast--viz. that he does not adopt all promiscuously to the hope of salvation, but gives to some what he denies to others. It is plain how greatly ignorance of this principle detracts from the glory of God, and impairs true humility. But though thus necessary to be known, Paul declares that it cannot be known unless God, throwing works entirely out of view, elect those whom he has predestined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.1</span></figcaption>

</figure><figure class="quote" id="q-31e8f5750b" data-kw="predestination curiosity forbidden">
<blockquote><p>The subject of predestination, which in itself is attended with considerable difficulty is rendered very perplexed and hence perilous by human curiosity, which cannot be restrained from wandering into forbidden paths and climbing to the clouds determined if it can that none of the secret things of God shall remain unexplored. When we see many, some of them in other respects not bad men, every where rushing into this audacity and wickedness, it is necessary to remind them of the course of duty in this matter. First, then, when they inquire into predestination, let then remember that they are penetrating into the recesses of the divine wisdom, where he who rushes forward securely and confidently, instead of satisfying his curiosity will enter in inextricable labyrinth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.1</span></figcaption>

</figure><figure class="quote" id="q-f286efb481" data-kw="">
<blockquote><p>To those who complain about this grace of an undeserved election and about the severity of a just reprobation, we reply with the words of the apostle, “Who are you, O man, to talk back to God?” (Rom. 9:20), and with the words of our Savior, “Have I no right to do what I want with my own?” (Matt. 20:15). We, however, with reverent adoration of these secret things, cry out with the apostle: “Oh, the depths of the riches both of the wisdom and the knowledge of God! How unsearchable are his judgments, and his ways beyond tracing out! For who has known the mind of the Lord? Or who has been his counselor? Or who has first given to God, that God should repay him? For from him and through him and to him are all things. To him be the glory forever! Amen” (Rom. 11:33-36).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 18</span></figcaption>

</figure><figure class="quote" id="q-6c89d40c2b" data-kw="reverence decrees humility">
<blockquote><p>Although Christian piety might readily spare this question, if men, content with the things revealed, would be content with knowing sensibly and would never strive to break into the secrets of God, for the purpose of rashly searching into his inscrutable counsels and minutely dividing his decrees (as if God was to be measured by the human rule); still the pertinacity of our adversaries has rendered it necessary in some degree.</p></blockquote>

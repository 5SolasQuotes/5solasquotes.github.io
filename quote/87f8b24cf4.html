<blockquote><p>Doctrine IV. Want of power to do more, shall not mar the acceptance of what is done from a willing mind according to power. In that case, God will accept of his people’s will for the deed. Here I shall shew,

I. In what particular cases God accepts his people’s will for the deed. II. Why he does so. III. Apply. I. I am to shew in what particular cases God accepts his people’s will for the deed.

1. Where there is a sincere will to serve him in a piece of work, requiring some external abilities which are wanting. If it be hindered only by such want, the will is accepted. The disciples would fain have watched more, but the weak body could not bear up with their mind; and Christ kindly takes notice of it; Matth. xxvi. 41, “Watch and pray, that ye enter not into temptation; the Spirit indeed is willing, but the flesh is weak.” Sometimes Satan makes a rack here to God’s children; such a duty they would do, but bodily strength will not answer, and here upon they are disquieted; but that is from Satan, and their own weakness; for God does not require that external duty from us, that we have no bodily strength for. That is a sweet word, 1 Cor. vi. 13, “The body is—for the Lord, and the Lord for the body.” Peter would fain have given to the poor man, but had it not, and it was accepted in the will, Acts iii. 6.

2. When doing the best we can through grace, our work after all is attended with many blemishes; the Lord will not reject it for these blemishes, but accepts the will to do better for the deed, Cant. v. 1. There is a broad cover of Christ’s righteousness cast over the believer’s spots, that they appear not, Cant. iv. 7; and the Lord accepts of the will to that perfection they would be at.

3. Going as far as we have access in a work, but meeting with a providential stop, the will to complete it is accepted for the deed, as if it had been fully done, as in the case of Abraham’s offering up Isaac, Heb. xi. 17. There is a great difference betwixt the stops men make in these, and those which God makes; the former argues an unwilling mind, but the latter not so.

4. Services that one really desires, and fain would perform for God, but have not opportunity; the will to them is accepted for the deed, as in the case of David’s purposing to build a house for the Lord, 2 Chron. vi. 8; and the Philippians care about supplying Paul’s wants, Philip, iv. 10. Some have opportunities of usefulness, but slight them; that is their sin; others may have a heart to be so and so useful, but they cannot have the opportunity; this God accepts.

5. Lastly, In services performed with a real desire of success for God’s honour and men’s good; the Lord accepts the good will to the success denied, as if it had succeeded according to their wish, Isa. xlix.4; 2 Cor. ii. 15. The want of success may mar their present comfort, but neither the acceptance nor reward.

II. Why does God accept such will for the deed?

1. The sincere will to a work is present, which God mainly regards. The person sincerely aims at doing such a piece of service for God, but not attaining what he really desires, his good will thereto being present before the Lord, it is accepted, as if the work had been done.

2. We have a merciful High Priest to present that will for acceptance, notwithstanding all the weaknesses, blemishes, providential hindrances, want of opportunity, and failure of success, that it may be attended with, Heb. iv. 15, 16.

3. We have a merciful Father to deal with, Psalm ciii. 13, 14, who pities the weaknesses and infirmities of his people, and graciously accepts of their upright designs to serve and honour him.

Use 1. If the Lord accepts the will for the deed in his own people, then men must answer for the ill they had a will to have done, as if they had done it, Numb. xiv. 42—45. A will and intention to do an evil action, though it be not actually done, is in God’s account the same thing with doing it, and will be resented and punished accordingly.

2. God is a gracious master to his servants, taking kindly off their hands through Christ their sincere will to his service, giving them ample testimonies of his regard in all circumstances, and be¬ stowing upon them the special comforts of his grace here, as pledges of the full reward laid up for them inglory hereafter.</p></blockquote>

<blockquote><p>Objection 2: There is much error mixed with the few truths they preach, as Popery, Arminianism, etc. There are also invective reflections, yea railings against the people of God. Answer 1: What is morally good will bear the mixture of a great deal of evil, and yet retain its goodness still: the goodness being from God, who is a greater good than Satan or sin is an evil. Answer 2: We cannot expect from men of ordinary gifts that truth be preached without the mixture of errors more or less: We know but in part, therefore are to prove all things, and hold fast that which it good, Heb. 5:14. A saint, as other creatures, though weak and newly born, has a raft of what is food suitable and what sincere. Answer 3: As for those intemperate expressions and reflections on the people of God: I confess it is sad, but were there not such against Paul and his party? (Phil. 1:15) Yet notwithstanding they are to be heard even by the same persons they enveighed against, for the truth’s sake.</p></blockquote>

<blockquote><p>In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In like manner is Rahab commended as one that by reason of her faith and works perished not with them which obeyed not, when she had received the spies peaceably. Yet if we look into the story, we shall easily discern a great deal of infirmity in that very work of love and mercy, by which she got the testimony of such a notable faith: for she bewrayed much unbelief in making a lie to preserve the spies in safety… So the angel (as is recorded in the Gospel) rebuked those good and faithful women, for that they sought the living among the dead: yet… He is risen again, as He foretold you that He would: yet herein does your uprightness appear, that you hold out still in the love and profession of Christ, even now, when He is in such disgrace and dislike… Thus we may perceive how favourable the Lord is towards his children that offend not upon set purpose and presumptuously: but through Satan’s instigation or through human frailty… This makes for the confutation of their error: 1. That think they have no calling to come to the sacrament because they see more and greater faults in themselves than they can espie, or then, indeed, there are in many other Christians… They find so much hypocrisy, so much pride, so much vain-glory and self-love… that they… begin to fear that God will in no sort accept of them, if they should come unto the table of his Son… and therefore [these things] should by no means keep them from the holy sacrament… Further, [2.] those that by reason of their infirmities will forgoe that ordinance do greatly dishonor God and lay an hard imputation upon Him, as who should say that He were such an extreme and rigorous Judge as will accept of none but of those that have attained to a great measure of perfection. Besides, [3.]… they have a calling to partake of the sacrament, as appears in this text… all such as prepared their whole hearts (that is, did their best endeauour with a true and sincere heart) to seek the Lord.”

— John Dod, Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20 | (London, 1610), 4th Sermon, pp. 125-28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+like+manner+is+Rahab+commended+as+one+that+by+reason+of+her+faith+and+works+perished+not+with+them+which+obeyed+not%2C+when+she+had+received+the+spies+peaceably.+Yet+if+we+look+into+the+story%2C+we+shall+easily+discern+a+great+deal+of+infirmity+in+that+very+work+of+love+and+mercy%2C+by+which+she+got+the+testimony+of+such+a+notable+faith%3A+for+she+bewrayed+much+unbelief+in+making+a+lie+to+preserve+the+spies+in+safety%E2%80%A6+So+the+angel+%28as+is+recorded+in+the+Gospel%29+rebuked+those+good+and+faithful+women%2C+for+that+they+sought+the+living+among+the+dead%3A+yet%E2%80%A6+He+is+risen+again%2C+as+He+foretold+you+that+He+would%3A+yet+herein+does+your+uprightness+appear%2C+that+you+hold+out+still+in+the+love+and+profession+of+Christ%2C+even+now%2C+when+He+is+in+such+disgrace+and+dislike%E2%80%A6+Thus+we+may+perceive+how+favourable+the+Lord+is+towards+his+children+that+offend+not+upon+set+purpose+and+presumptuously%3A+but+through+Satan%E2%80%99s+instigation+or+through+human+frailty%E2%80%A6+This+makes+for+the+confutation+of+their+error%3A+1.+That+think+they+have+no+calling+to+come+to+the+sacrament+because+they+see+more+and+greater+faults+in+themselves+than+they+can+espie%2C+or+then%2C+indeed%2C+there+are+in+many+other+Christians%E2%80%A6+They+find+so+much+hypocrisy%2C+so+much+pride%2C+so+much+vain-glory+and+self-love%E2%80%A6+that+they%E2%80%A6+begin+to+fear+that+God+will+in+no+sort+accept+of+them%2C+if+they+should+come+unto+the+table+of+his+Son%E2%80%A6+and+therefore+%5Bthese+things%5D+should+by+no+means+keep+them+from+the+holy+sacrament%E2%80%A6+Further%2C+%5B2.%5D+those+that+by+reason+of+their+infirmities+will+forgoe+that+ordinance+do+greatly+dishonor+God+and+lay+an+hard+imputation+upon+Him%2C+as+who+should+say+that+He+were+such+an+extreme+and+rigorous+Judge+as+will+accept+of+none+but+of+those+that+have+attained+to+a+great+measure+of+perfection.+Besides%2C+%5B3.%5D%E2%80%A6+they+have+a+calling+to+partake+of+the+sacrament%2C+as+appears+in+this+text%E2%80%A6+all+such+as+prepared+their+whole+hearts+%28that+is%2C+did+their+best+endeauour+with+a+true+and+sincere+heart%29+to+seek+the+Lord.%E2%80%9D%0A%0A%E2%80%94+John+Dod%2C+Ten+Sermons%2C+Tending+Chiefly+to+the+Fitting+of+Men+for+the+Worthy+Receiving+of+the+Lord%E2%80%99s+Supper%2C+%281634%29%2C+The+Fourth+Sermon+of+the+Lord%E2%80%99s+Supper%2C+on+2+Chron.+30%3A18-20+%7C+%28London%2C+1610%29%2C+4th+Sermon%2C+pp.+125-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ae1b34237.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ae1b34237.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=In%20like%20manner%20is%20Rahab%20commended,sincere%20heart%29%20to%20seek%20the%20Lord&amp;text=In%20like%20manner%20is%20Rahab%20commended%20as%20one&amp;text=true%20and%20sincere%20heart%29%20to%20seek%20the%20Lord" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>6. The goodness of God is seen in bearing with the infirmities of his people and accepting imperfect obedience. Though Asa had many blots in his escutcheon [a coat of arms as an emblem], yet they are over-looked, and this note set upon record by divine goodness, that his heart was perfect towards the Lord all his days: ‘But the high places were not removed, nevertheless Asa’s heart was perfect with the Lord all his days.’ (1 Kings 15:14) He takes notice of a sincere, though chequered obedience, to reward it, which could claim nothing but a slight from Him if he were extreme to mark what is done amiss. When there is not an opportunity to work, but only to will, He accepts the will, as if it had passed into work and act. He sees ‘no iniquity in Jacob,’ (Num. 23:21) i.e. He sees it not so as to cast off a respect to their persons and the acceptance of their services: His omniscience knows their sins, but his goodness does not reject their persons. He is of so good a disposition that He delights in a weak obedience of his servants, not in the imperfection but in the obedience: ‘He delights in the way of a good man,’ (Ps. 37:23) though he sometimes slips in it: He accepts a poor man’s pigeon as well as a rich man’s ox; He has a bottle for the tears and a book for the services of the upright (Ps. 56:8), as well as for the most perfect obedience of angels. He preserves their tears as if they were a rich and generous wine, as the vine-dresser does the expressions [pressed out flowings] of the grape.</p></blockquote>

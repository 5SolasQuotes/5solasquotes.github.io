<main class="wrap"><figure class="quote" id="q-c488af2c5f" data-kw="">
<blockquote><p>2. Therefore, after the majority of men asserted the opinion that natural things did not happen by chance, but by providence, because of the order which clearly appears in them, a doubt emerged among most men about the acts of man, as to whether human affairs evolved by chance, or were governed by some kind of providence or a higher ordering.

This doubt was fed especially because there is no sure order apparent in human events. For good things do not always befall the good, nor evil things the wicked. On the other hand, evil things do not always befall the good nor good things the wicked, but good and evil indifferently befall both the good and the wicked. This fact then especially moved the hearts of men to hold the opinion that human affairs are not governed by divine providence. Some said that human affairs proceed by chance, except to the extent that they are ruled by human providence and counsel; others attributed their outcome to a fatalism ruled by the heavens.

3. This idea causes a great deal of harm to mankind. For if divine providence is denied, no reverence or true fear of God will remain among men. Each man can weigh well how great will be the propensity for vice and the lack of desire for virtue which follows from this idea. For nothing so calls men back from evil things and induces them to good as much as the fear and love of God.

For this reason, the first and foremost aim of those who had pursued wisdom inspired by the spirit of God for the instruction of others was to remove this opinion from the hearts of men. So after the promulgation of the Law and the Prophets, the Book of Job occupies first place in the order of Holy Scripture, the books composed by the wisdom of the Holy Spirit for the instruction of men. The whole intention of this book is directed to this: to show that human affairs are ruled by divine providence using probable arguments.

4. The methodology used in this book is to demonstrate this proposition from the supposition that natural things are governed by divine providence. The affliction of just men is what seems especially to impugn divine providence in human affairs. For although it seems irrational and contrary to providence at first glance that good things sometimes happen to evil men, nevertheless this can be excused in one way or another by divine compassion. But that the just are afflicted without cause seems to undermine totally the foundation of providence. Thus, the varied and grave afflictions of a specific just man called Job, perfect in every virtue, are proposed as a kind of theme for the question intended for discussion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositio super Iob ad Litteram</cite>, (1263-65), Pr. 2-4.</span></figcaption>

<blockquote><p>…as the soul of man is said to be in the head or heart, so conceive of God’s being in Heaven. The soul (we know) animates the whole body of man, and by the presence of it in every member communicates life to the whole: yet by way of preeminency and excellency it is said to be in the head or heart of man, because in these two parts of man, and from thence she exercises her cheifest functions, and derives her cheifest influence.</p></blockquote>

<blockquote><p>A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63) which was called in reaction against it. Thomas de Vio, also known as Cardinal Cajetan (1469-1534), produced a major commentary on the Summa Theologiae that would have a decisive influence upon the general understanding of Aquinas’s doctrines. Cajetan’s emphasis on continuity with Aquinas’s own positions was followed by later commentators such as Dominic Banez (1528-1604), and John Poinsot (1589-1644), who would come to be known as John of St. Thomas. This contrasted with the tendency of thinkers from the new Jesuit order, such as Luis de Molina (1535-1600) and Francisco Suarez (1548-1617), to combine Aquinas’s thought with various non-Thomistic elements. These different tendencies, roughly associated with Dominicans and Jesuits respectively, gave rise to sometimes heated doctrinal disputes, the most famous being the controversy over grace, free will, and divine foreknowledge. Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009)</span></figcaption>

<blockquote><p>S. What is natural Philosophy?

M. It is the true knowledge or discourse concerning the Creation and distinction of all this whole world with the parts thereof, of the causes by which it was so wrought, and likewise of the effects which follow thereon, appertaining to the praise of God the Creator.

S. From whence do you gather this your definition?

M. Specially out of two places of holy scripture, whereof the first is the. 30. chapt. and 4. verse of the Proverbs. The other the first chapter of Genesis, in which those four points are briefly recited, unto which also that place may bee added which is in the 7. Chapter and 17. and 18. verses, where it is evidently declared, that such things be handled in this Science.

S. Is this knowledge termed by this name only, or is it called by some other also?

M. Yea truly. For out of S. Paul it may be called The knowledge of God’s works, Rom. the 1. chap. and 20. verse. Out of the Epistle to the Hebrews, The knowledge of secular things. And finally we may as fitly and conveniently call it The knowledge of things created, as natural Philosophy was so called Of the searching of Nature, if so be that the use of that name had been familiar, and received by the Greeks and Latins.

S. Why then, do you call it natural Philosophy, which is a word used by the Heathen Philosophers?

M. For two causes. The first is, for that Christians ought not to be so scrupulous, or rather superstitious, that they should be afeard to use such common words and names as the Heathen do, for so much as with them we do use and enjoy the self same Sun, air, earth, water, light, meats, and Cities. Neither doth the Scripture it self refuse that word as unseemly or monstrous, as appeareth in the 2. chapter and 3. verse to the Ephesians, and the 1. Chapter and 5. verse of the second Epistle of S. Peter.

Also the ancient and Catholic fathers in every place, do term this knowledge of things by the name of Natural Philosophy, as did Basil, Chrysostom, Ambrose, Augustine in his Enchiridion to Laurence: Natural Philosophers, saith he, are they that search the nature of things. Secondly, that for as much as this word, Nature, in the common use of the Greek tongue, is, for the most part, applied to such things as do consist, not of essence only, of which sort GOD is, but are compounded with certain accidents adjoined, such as are all the things that we behold with our eyes, and whereof this visible world consisteth: that knowledge seemeth most properly to be termed natural Philosophy, which is busied in the handling of the mixt, compounded, and material things, that it may bee distinguished from Divinity. Wherefore, Natural Philosophy, say they, is the knowledge of Material and Instrumental beginnings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wonderful workmanship of the world wherein is contained an excellent discourse of Christian natural philosophy, concerning the form, knowledge, and use of all things created: specially gathered out of the fountains of holy Scripture</cite>, trans. Thomas Twyne (London: Andrew Maunsell, 1578), unpaginated.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“S. What is natural Philosophy?

M. It is the true knowledge or discourse concerning the Creation and distinction of all this whole world with the parts thereof, of the causes by which it was so wrought, and likewise of the effects which follow thereon, appertaining to the praise of God the Creator.

S. From whence do you gather this your definition?

M. Specially out of two places of holy scripture, whereof the first is the. 30. chapt. and 4. verse of the Proverbs. The other the first chapter of Genesis, in which those four points are briefly recited, unto which also that place may bee added which is in the 7. Chapter and 17. and 18. verses, where it is evidently declared, that such things be handled in this Science.

S. Is this knowledge termed by this name only, or is it called by some other also?

M. Yea truly. For out of S. Paul it may be called The knowledge of God’s works, Rom. the 1. chap. and 20. verse. Out of the Epistle to the Hebrews, The knowledge of secular things. And finally we may as fitly and conveniently call it The knowledge of things created, as natural Philosophy was so called Of the searching of Nature, if so be that the use of that name had been familiar, and received by the Greeks and Latins.

S. Why then, do you call it natural Philosophy, which is a word used by the Heathen Philosophers?

M. For two causes. The first is, for that Christians ought not to be so scrupulous, or rather superstitious, that they should be afeard to use such common words and names as the Heathen do, for so much as with them we do use and enjoy the self same Sun, air, earth, water, light, meats, and Cities. Neither doth the Scripture it self refuse that word as unseemly or monstrous, as appeareth in the 2. chapter and 3. verse to the Ephesians, and the 1. Chapter and 5. verse of the second Epistle of S. Peter.

Also the ancient and Catholic fathers in every place, do term this knowledge of things by the name of Natural Philosophy, as did Basil, Chrysostom, Ambrose, Augustine in his Enchiridion to Laurence: Natural Philosophers, saith he, are they that search the nature of things. Secondly, that for as much as this word, Nature, in the common use of the Greek tongue, is, for the most part, applied to such things as do consist, not of essence only, of which sort GOD is, but are compounded with certain accidents adjoined, such as are all the things that we behold with our eyes, and whereof this visible world consisteth: that knowledge seemeth most properly to be termed natural Philosophy, which is busied in the handling of the mixt, compounded, and material things, that it may bee distinguished from Divinity. Wherefore, Natural Philosophy, say they, is the knowledge of Material and Instrumental beginnings.”

<blockquote><p>The supporters of this Seminary are thorough and sound Presbyterians. No uncertain note is given from the pulpits of the alumni of this institution. The directors believe that the students graduated from this Seminary will be, theologically, largely what you make them. Therefore, we believe your teaching must be dogmatic. Your philosophy and your metaphysics will be great contributions to the power of your teaching. But, after all, our theology is not based on secular philosophy or modern psychology but on the Word of God, as contained in the Holy Scriptures, — described in our Confession as the only infallible rule of faith and practice.

Therefore, we expect the students to be taught with a fire of conviction, which cannot help leaving its impression upon them, so that your teaching will not seem to be the abstract discussion of a man who has only half thought his subject through: “Ever learning, but never coming to a knowledge of the truth”. But rather that kind of teaching which presents the result of the teacher’s own labours as he builds his system of theology on the eternal truth of God, revealed by him in our infallible Scriptures.

Such a teacher translates his theological science for his students — not alone correlating great theological principles or distinguishing the Biblical and professional teaching from erroneous views; but while it will be teaching of the highest scholarship, it will gain power — constructive power — by reason of the teacher’s own experience in the application of these great truths to his own soul. This, I believe, is what makes great theological teachers. It was this that made more than one of your distinguished predecessors what they were, and it is this that produces in our ministry men who are not dabblers in theology, but constructive defenders of our Presbyterian doctrinal heritage.</p></blockquote>

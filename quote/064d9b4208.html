<main class="wrap"><figure class="quote" id="q-064d9b4208" data-kw="">
<blockquote><p>Mercy and truth are necessarily found in all God’s works, if mercy be taken to mean the removal of any kind of defect. Not every defect, however, can properly be called a misery; but only defect in a rational nature whose lot is to be happy; for misery is opposed to happiness. … Now the work of divine justice always presupposes the work of mercy; and is founded thereupon. For nothing is due to creatures, except for something pre-existing in them, or foreknown. Again, if this is due to a creature, it must be due on account of something that precedes. And since we cannot go on to infinity, we must come to something that depends only on the goodness of the divine will—which is the ultimate end… In all that follows, the power of mercy remains, and works indeed with even greater force; as the influence of the first cause is more intense than that of second causes. For this reason does God out of abundance of His goodness bestow upon creatures what is due to them more bountifully than is proportionate to their deserts: since less would suffice for preserving the order of justice than what the divine goodness confers; because between creatures and God’s goodness there can be no proportion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 21 | art. 4, Whether in every work of God there are mercy and justice, I answer that</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf0de92f98" data-kw="">
<blockquote><p>…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London: T.R. &amp; E.M., 1653), on Ps. 81:13, pp. 254-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-7176c29a50" data-kw="">
<blockquote><p>Hence likewise we may collect how really and cheerfully willing Christ is to save sinners. Certainly, He that makes such bitter lamentation over the foreseen ruins of Jerusalem, must needs have a very cordial, and unfeigned will and desire of her salvation… What a pathetic expostulation is here, which carries in it notices of vehement affections? Oh! how willing is Christ to give unto sinners the things that belong unto their peace? Yea, is He not more willing to bestow great things than small? Does not his willingness to give, infinitely exceed the sinners’ willingness to receive? Is not Christ more glad to receive poor and weary souls, than they are to come unto Him?… Is not every thing about Christ mighty drawing, alluring, and inviting?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger</cite>, (1679) 254 pp., pp. 66-67</span></figcaption>

</figure><figure class="quote" id="q-30c6bb1512" data-kw="">
<blockquote><p>Thus, gratia Dei [the grace of God] is that perfection or attribute according to which God, out of a totally gracious and unmerited love, is conceived as willing to communicate himself to his creatures. (Rijssen, Summa Theol., III.xliii) Considered as affective, as ratione actus interni in Deo [a rule of the internal act in God], grace is a propensity of the divine will–while considered as effective it is the gifts of the Spirit graciously given to us by God, either the ordinary gifts of faith, hope, and love or the extraordinary gifts bestowed upon the church for its edification. (Rijssen, Summa theol., III.xliii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 571</span></figcaption>

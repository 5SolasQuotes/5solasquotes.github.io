<blockquote><p>[T]hey have also built the high places of Baal, to burn their sons with fire for burnt offerings to Baal, which I did not command or speak, nor did it come into My mind (Jeremiah 19:5)

He at last adds, that that place was filled with the blood of innocents; for there they killed their children. And by this circumstance Jeremiah again amplifies the wickedness of the people; for they had not only despised God and his law, but also cruelly destroyed their innocent infants; and thus he proved them guilty not only of impiety and profaneness in vitiating the worship of God, but also of brutal and barbarous savageness in not sparing innocent blood.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-28e5a76b9b" data-kw="">
<blockquote><p>1. Some things are necessary by divine ordination, as magistracy; ‘Whosoever resists the power,’ says the apostle, ‘resists the ordinance of God;’ and ‘the powers that be, are ordained of God,’ Rom. 13:1-2, etc. And as magistracy, so ministry is the ordinance of God, 1 Cor. 12:28, ‘And God hath set some in the Church, first Apostles, etc.’

2. Some things are necessary by divine precept; as for example, the exercise of the power of the magistrate is not only necessary by virtue of God’s instituting and ordaining magistracy, but also by the command of God, which obliges magistrates to punish vice, to execute wrath upon them who do evil, to promove, encourage and praise that which is good; to protect their subjects in well-doing, and to preserve peace. And so ministers are under a necessity of preaching the Gospel by the command of God.

3. Some things are necessary because God has made them useful and convenient for man, and has given them to man for his use; they are in their nature convenient for man, given and designed of God for the good of man; thus meat and clothing, and houses, peace and the protection of lawful authority are necessary.

4. Some things are necessary means in order to a necessary end; and these again are necessary, either simply for attaining the end, or necessary for the better or more easy and convenient attaining of the end; as a house is necessary, not simply for hearing of the Word, but for the more convenient hearing of the Word, because it shelters the minister and people from storms, winds and scorching heat, etc. Thus the protection of lawful authority is necessary for the peaceable hearing of the Word without disturbance.

5. Some things are necessary for preventing of evil; the evil either of sin, or of affliction and calamity.

6. Some things become necessary, or the more necessary to be done, because of those who urge the forbearance of them out of some erroneous principle, or for establishing of some error. And thus Mr. Rutherford shows in the forecited treatise [the Appendix on Scandal to The Divine Right of Church Government], that to forbear the eating of swine’s-flesh before a Jew, who alleges that it is a sin, or breach of the commandment of God to do so; to forbear it now when we are fully possessed in that liberty wherewith Christ has made us free, were to harden the Jew in his Judaism, and the way to bring us again under the yoke of the Ceremonial Law.</p></blockquote>

</figure><figure class="quote" id="q-ba1677ffe2" data-kw="">
<blockquote><p>3. The government gives a legal security and establishment to gross heresy, blasphemy, and idolatry, under the notion of liberty of conscience. It would be too tedious to examine each of the State constitutions on this head. One may suffice.

We shall select that of the State of Pennsylvania. See the preamble, together with the third and twenty-sixth sections of the ninth article. Here the constitution recognizes and unalterably establishes the indefeasible right of worshipping the Almighty God in whatever way a man’s conscience may dictate; and declares that this shall for ever remain inviolate. We believe that no man has a right to worship God any other way than he himself hath prescribed in his law. We also think it criminal for a man’s conscience to approve any way repugnant to this sacred rule: and that this crime cannot legitimate another, or make an action right which God expressly condemns under pain of eternal wrath.

If conscience can legitimate what God’s law condemns, it must be paramount to the divine law, and, consequently, to the Legislator also, in having a negative over the requisitions of both the one and the other.

Were this the case, it would not only free from criminality, but would render virtuous, laudable, and praiseworthy the most damnable errors—the most horrid blasphemies and detestable abominations—if but dictated by the consciences of Pagans, Mohammedans, &amp;c. Then the Egyptians, worshipping God under the form of a snake or crocodile, would be as lawful, yea, as commendable, as doing it precisely according to the manner which he has prescribed in his word, provided, that, in both cases, conscience said Amen!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 35-6.</span></figcaption>

<blockquote><p>In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 5:28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?”

— John Calvin, Commentary on Acts, 5:28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+second+member+%5Bof+the+verse%5D+he+betrays+an+evil+conscience%2C+or%2C+at+least%2C+he+shows+that+he+handled+rather+a+private+business+than+any+public+cause%2C+for+he+complains+that+the+apostles+will+cause+the+priests+and+the+scribes+to+be+hated+for+the+death+of+Christ.+%E2%80%A6+Notwithstanding+this+is+the+principal+point+of+the+accusation%2C+that+they+did+not+obey+the+commandment+of+the+priests%E2%80%A6+But+the+chief+priest+does+not+consider+what+is+his+duty+towards+God+and+the+Church%3B+he+abuses+his+authority+tyrannously%2C+as+if+the+same+were+not+under+any+laws%2C+as+the+Pope+deals+with+us+at+this+day%3B+for+seeing+that+he+takes+to+himself+an+unbridled+authority+and+government%2C+he+fears+not+to+condemn+us+for+schismatics%2C+so+soon+as+he+sees+us+refuse+his+decrees%3B+for+he+catches+at+these+sentences%3A+%E2%80%9CHe+which+despiseth+you+despiseth+me%2C%E2%80%9D+%28Luke+10%3A16%3B%29+and+thereupon+he+concludes+that+we+will+rebel+against+God.+But+if+he+will+be+heard+as+the+ambassador+of+Christ%2C+he+must+speak+out+of+the+mouth+of+Christ.+Now%2C+forasmuch+as+he+does+manifestly+play+the+minister+of+Satan%2C+he+borrows+authority%2C+without+shame+and+color%2C+of+the+name+of+Christ%3B+yea%2C+the+very+form+of+speech+which+the+chief+priest+uses+doth+prove+how+carelessly+spiritual+tyrants+who+usurp+such+authority+and+lordship+as+is+not+subject+to+the+Word+of+God%2C+dare+grant+liberty+to+themselves+to+attempt+whatsoever+pleases+them.+With+a+commandment+%28says+he%29+have+we+commanded.+Whence+comes+such+strait+rigor%2C+save+only+because+they+think+that+all+that+must+be+received+without+exception+which+they+shall+command%3F%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Acts%2C+5%3A28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdbc05a79dd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d

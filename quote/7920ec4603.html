<blockquote><p>[3.] If parents, by refusing to comply with the desire of their children [in desiring to marry someone], plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (1731; 1814), vol. 3, pp. 522-23, commenting on Westminster’s Larger Catechism</span></figcaption>

</figure><figure class="quote" id="q-3a7a08b9ad" data-kw="">
<blockquote><p>Farther this Pigghius reasons and says that this desire which Augustine calls concupisence is a work of nature and of God: and therefore it cannot be counted sin. But we have before answered that it comes not from the grounds of nature as it was instituted by God, but of nature corrupted. For man, when he was created, was made right and (and as the scripture says) to the image of God. Wherefore that desire of things pleasant and preservative in Adam, when he was first created, was not outrageous or vehement, to be against right reason and the word of God: for, that followed afterward. Wherefore we ought not to call it the work of God (as Pigghius says) but the wickedness of sin and corruption of affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, ch. 5, p. 123 in Most Learned &amp; Fruitful Commentaries of Dr. Peter Martyr Vermilius... (d. 1562; London: 1568)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

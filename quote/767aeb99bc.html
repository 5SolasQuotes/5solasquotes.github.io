<blockquote><p>…as David, without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread [Mt. 12]; so is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity, to the good of the Church; so Thomas, Molina, Suarez (On Laws, bk. 2, ch. 15), Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-88cb5fca24" data-kw="">
<blockquote><p>Objection 5… But sin unto death is sin against the Holy Spirit, as the Master [Peter Lombard] says…. Reply to Objection 5… so also among sins it is only those sins among mortal sins that are called “sins unto death” that, as far as they themselves go, are unforgivable. Therefore, sin is called “mortal” from the first death, but “unto death” because of the second death.” (Sentences, bk. 2, dist. 43, q. 1, art. 2; the ‘Exposition of the Text’ on this Distinction confirms this) For the Reformed: ‘That the Sin unto Death is the Same as the Sin Against the Holy Spirit’. . Disagreements What it is Thomas: “to sin through malice is to sin against the Holy Ghost.” (Summa, pt. 2 of 2, q. 14, art. 1) Turretin: “We say it is a universal apostasy from true Christianity or of the truth of the Gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency.” (1.647) Turretin’s view was the dominant view of the Reformed: ‘Of the Sin Against the Holy Spirit’. . Sin unto Death: Not to be Prayed for Thomas: “‘I do not say that anyone should pray for him.’ [1 Jn. 5:16]… then it must be understood in the sense that not just anyone should pray for such a sinner, since the conversion of these kinds of sinners is, as it were, miraculous. Hence just as not just anyone should pray for miracles to be performed, except great and holy men, neither should just anyone pray for the conversion of these kinds of sinners. Even so, according to the form of the words, it is not forbidden for there to be prayer for such a person.” (Sentences, bk. 2, dist. 43, ‘Exposition of the Text’) WCF 21.4: “Prayer is to be made for things lawful,[n] and for all sorts of men living… but not for… those of whom it may be known that they have sinned the sin unto death.[q] [n] 1 John 5:14 [q] 1 John 5:16</p></blockquote>

</figure><figure class="quote" id="q-3e300985bf" data-kw="">
<blockquote><p>A distinction after some work of the mind (distinction of reason, logical distinction, mental distinction) is a lack of identity that arises from an operation of the mind, whether with or without a foundation in the thing. Such a distinction flourishes between several concepts of one and the same reality and it is acquired insofar as the mind conceives the same thing according to diverse and distinct concepts each one of which represents the whole reality, but partially and not totally. The concepts are distinct and diverse but incomplete and inclusive. This distinction is either: A. with a foundation in the thing (a distinction of reasoned reason, intentional or virtual distinction), if from the real diversity of the effect that arises from one and the same formal cause the intellect has a reason or a foundation for distinguishing diverse respects in the cause itself. So in the light of the sun, for instance, there is a distinction between the powers of heating, illumining, and liquefying; in the human intellect there is a distinction between the faculties of conceiving, judging, and reasoning. B. without a foundation in the thing (distinction purely mental, distinction of reasoning reason) if the reason for distinguishing is not found in the thing but in some being of reason, for instance the distinction between man and humanity, or between ‘man’ and ‘man’s’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, ‘On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 31</span></figcaption>

</figure><figure class="quote" id="q-8a2d08d603" data-kw="">
<blockquote><p>I do not think he [the Romanist Leiden philosopher, David Stuart] wanted to stop our theologians, whether his or ours, from dealing with any questions that can be demonstrated not just from God’s Word, the first principle, but also from the light of nature and right reason, the second principle… Our [reformed] theologians should not be excluded from dealing with these same questions, since they never set aside the sciences and arts, especially logic and metaphysics, which they intensely studied in school and at home. Nor do they, above the Papists, become dull to the use of reason and the knowledge of first philosophy out of reverence for and study of the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665)</span></figcaption>

<blockquote><p>Secondly, God put into the soul these faculties, understanding, will, sense and appetite, which are naturally carried to things that are obvious and known, and not to things that are unknown and far removed. … Fifthly, God has put into every man, for his own preservation, a love of himself, which love is naturally good; but does then begin to be morally good, when it does accord[ing] to and help forward the love of God.</p></blockquote>

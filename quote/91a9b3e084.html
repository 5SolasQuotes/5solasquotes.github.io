<main class="wrap"><figure class="quote" id="q-91a9b3e084" data-kw="">
<blockquote><p>To depart from the Church of England is a departing from the Church of God: let them consider, the Church of Corinth had many faults in it, as many as the Church of England has, and as great ones too; and yet [it] was God’s Church for their faults. St. Paul blames some there for their civil jars impetuously, they traffering them and their suits to the courts of infidels, 1 Cor. 6:7. Others for their wicked connivence and indulgence towards the incestuous, 1 Cor. 5; others for their vile profaneness in their sacred assemblies, 1 Cor. 11:32. Yea, others for heresy, 1 Cor. 15… But the example of Christ Himself writing to the seven Churches of Asia may be our best direction, charging five of them with several faults, and with crimes of a large size, yet he does call them Churches. Moreover, is not the forsaking the Church of God, a forsaking of God Himself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times</cite>, (London: Wilson, 1645), ‘Of the Brownists’ | 23. ‘Schism a great sin’, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ad it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06dba7071a" data-kw="">
<blockquote><p>5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-ward.html">Richard Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principal Duty of Parliament-Men, or, A Short &amp; Compendious Treatise Concerning the Unity &amp; Unanimity which Should be in the Members of that Honourable Assembly</cite>, (London, 1641), p. 46. Ward, a civil officer, was speaking to the English parliament.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.”

— Richard Ward, The Principal Duty of Parliament-Men, or, A Short &amp; Compendious Treatise Concerning the Unity &amp; Unanimity which Should be in the Members of that Honourable Assembly (London, 1641), p. 46. Ward, a civil officer, was speaking to the English parliament.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+Remember%2C+that+you+have+all+but+one+end+and+one+aim%2C+that+is%2C+you+are+all+of+you+elected+and+called+to+this+assembly+for+the+glory+of+your+God%2C+the+honor+of+your+king%2C+the+welfare+of+his+people%2C+the+peace+and+purity+of+the+Church%2C+the+punishing+of+offenders%2C+the+reforming+of+abuses+and+the+taking+away+of+all+polluted+and+pernicious+doctrines+and+practices+from+amongst+us.+And+then+the+remembrance+hereof+will+be+a+means+to+make+you+one.%E2%80%9D%0A%0A%E2%80%94+Richard+Ward%2C+The+Principal+Duty+of+Parliament-Men%2C+or%2C+A+Short+%26+Compendious+Treatise+Concerning+the+Unity+%26+Unanimity+which+Should+be+in+the+Members+of+that+Honourable+Assembly+%28London%2C+1641%29%2C+p.+46.+Ward%2C+a+civil+officer%2C+was+speaking+to+the+English+parliament.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06dba7071a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/06dba7071a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-peace-purity-of-the-church/#:~:text=5.%20Remember%2C%20that%20you%20have%20all,a%20means%20to%20make%20you%20one&amp;text=5.%20Remember%2C%20that%20you%20have%20all%20but%20one&amp;text=will%20be%20a%20means%20to%20make%20you%20one" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9d904176a2" data-kw="">
<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land, or delegates in a sort from them, they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sharp.html">James Sharp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Representation of the Rise, Progress &amp; State of the Present Divisions of the Church of Scotland</cite>, (London, 1657), p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-454f9c5b4b" data-kw="">
<blockquote><p>3rd Argument. If Paul do not only not command separation in the Church of Corinth, but also command and approve their meeting together in Church-communion, 1 Cor. 5:4; 11:18, 20-22; 14:23; 16:2, where there was: Schisms and contentious, 1 Cor. 1:12-13, envying and strife, 1 Cor. 3:3, incest, and incest tolerated, such as is not named amongst the gentiles, 1 Cor. 5:1, going to law with their brethren for gain before infidels, 1 Cor. 6, harlotry, vv. 15-16, eating at the idols’ table, 1 Cor. 8, keeping fellowship with devils, 1 Cor. 10:20-22, coming to the Lord’s Table drunken, 1 Cor. 11:21, eating and drinking damnation, vv. 29-30. A denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, 1 Cor. 15:35, murdering of weak souls, whom Christ had died for, 1 Cor. 8:12-13, Paul’s name despitefully traduced, 2 Cor. 10:8-9, etc. Then it is unlawful to separate from the pure worship of God, because a Church is not constituted of visible saints and a people all taught of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, pp. 141-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“3rd Argument. If Paul do not only not command separation in the Church of Corinth, but also command and approve their meeting together in Church-communion, 1 Cor. 5:4; 11:18, 20-22; 14:23; 16:2, where there was: Schisms and contentious, 1 Cor. 1:12-13, envying and strife, 1 Cor. 3:3, incest, and incest tolerated, such as is not named amongst the gentiles, 1 Cor. 5:1, going to law with their brethren for gain before infidels, 1 Cor. 6, harlotry, vv. 15-16, eating at the idols’ table, 1 Cor. 8, keeping fellowship with devils, 1 Cor. 10:20-22, coming to the Lord’s Table drunken, 1 Cor. 11:21, eating and drinking damnation, vv. 29-30. A denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, 1 Cor. 15:35, murdering of weak souls, whom Christ had died for, 1 Cor. 8:12-13, Paul’s name despitefully traduced, 2 Cor. 10:8-9, etc. Then it is unlawful to separate from the pure worship of God, because a Church is not constituted of visible saints and a people all taught of God.”

— Samuel Rutherford, A Peaceable &amp; Temperate Plea for Paul’s Presbyterie in Scotland… (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, pp. 141-42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3rd+Argument.+If+Paul+do+not+only+not+command+separation+in+the+Church+of+Corinth%2C+but+also+command+and+approve+their+meeting+together+in+Church-communion%2C+1+Cor.+5%3A4%3B+11%3A18%2C+20-22%3B+14%3A23%3B+16%3A2%2C+where+there+was%3A+Schisms+and+contentious%2C+1+Cor.+1%3A12-13%2C+envying+and+strife%2C+1+Cor.+3%3A3%2C+incest%2C+and+incest+tolerated%2C+such+as+is+not+named+amongst+the+gentiles%2C+1+Cor.+5%3A1%2C+going+to+law+with+their+brethren+for+gain+before+infidels%2C+1+Cor.+6%2C+harlotry%2C+vv.+15-16%2C+eating+at+the+idols%E2%80%99+table%2C+1+Cor.+8%2C+keeping+fellowship+with+devils%2C+1+Cor.+10%3A20-22%2C+coming+to+the+Lord%E2%80%99s+Table+drunken%2C+1+Cor.+11%3A21%2C+eating+and+drinking+damnation%2C+vv.+29-30.+A+denying+of+a+fundamental+point+of+faith%2C+the+resurrection+of+the+dead%2C+and+that+with+scoffing+at+it%2C+1+Cor.+15%3A35%2C+murdering+of+weak+souls%2C+whom+Christ+had+died+for%2C+1+Cor.+8%3A12-13%2C+Paul%E2%80%99s+name+despitefully+traduced%2C+2+Cor.+10%3A8-9%2C+etc.+Then+it+is+unlawful+to+separate+from+the+pure+worship+of+God%2C+because+a+Church+is+not+constituted+of+visible+saints+and+a+people+all+taught+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbyterie+in+Scotland%E2%80%A6+%28London%3A+Bartlet%2C+1642%29%2C+ch.+10%2C+%E2%80%98Whether+or+not+it+be+lawful+to+separate+from+a+true+Church+visible%2C+for+the+corruption+of+teachers%E2%80%A6+where+faith+is+begotten+by+the+preaching+of+professed+truth%3F%E2%80%99%2C+pp.+141-42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F454f9c5b4b.html&amp;via=5Solas" target="_bla </figure><figure class="quote" id="q-17b845c796" data-kw="">
<blockquote><p>Bucer’s thought categorized Christian theological truths (of the disputed doctrines of the day) into a hierarchy, the doctrine of justification being of high importance for the Church. As such, difficulties over other doctrines like the Lord’s Supper could be pragmatically defined and resolved so as to preserve the unity that was held in the truth of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-lugioyo.html">Brian Lugioyo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martin Bucer’s Doctrine of Justification: Reformation Theology &amp; Early Modern Irenicism</cite>, (Oxford Univ. Press, 2010) 260 pp. ToC, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

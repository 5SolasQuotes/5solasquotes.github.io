<blockquote><p>By what reasons are they [Anabaptists] confuted? (1) Because, to covenanted ones (of which number the infants of believers are no less than their parents; Acts 2:38-39; Acts 3:25; Rom. 11:16; Gen. 17:7,22) that seal of the covenant, of which they are capable, is not to be denied; Gen. 17:7,10-11. … (8) Because, the Apostle says that the infants but of one believing parent are holy, 1 Cor. 7:14, that is, are comprehended in the outward Covenant of God, and have access to the signs, and seals of God’s grace as well as they are that are born of both believing parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error (Edinburgh, 1684), ch. 28, ‘Of Baptism’, Question 3</cite>, pp. 179-180</span></figcaption>

<blockquote><p>30. But those in whom true faith is found are all and only those who are predestined to eternal life. For that faith falls to them from the decree of divine election; and therefore it is called by Paul, “the faith of God’s elect,” Tit. 1:1. Whence it happens that without it no one can be saved, nor does anyone have it who does not obtain salvation. For that assent which imitates true faith in some of the reprobate is temporary faith, about which we spoke above: and it must be distinguished from justifying and saving faith. 31. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God does not cleanse from every stain of original sin all the infants whom he admits into his heavenly kingdom, into which nothing polluted or defiled enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, He undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues. 32. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), vol. 2, ‘On Faith’</cite>, pp. 131-32 Latin</span></figcaption>

</figure><figure class="quote" id="q-e9930b92b7" data-kw="">
<blockquote><p>The sealing of God’s promises has respect either unto the faith of the Covenant [objectively], or unto the faith of them that are in the Covenant [subjectively]. In infants, the sealing of God’s promise is made properly, in respect of the faith of the Covenant, but in them that are of ripe years, in respect of their faith in the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places…, Distinction 4, in ‘Defense of the End of a Sacrament’</cite>, p. 330</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-2a58eef5f2" data-kw="">
<blockquote><p>The children of those that are indeed in the church, but, because of their unclean way of living, declare that they are not indeed of the church; if they be offered to baptism, they cannot be debarred therefrom, nor ought they. The reason is, because though the parents be wicked, yet their impiety ought not to prejudge their children which are born within the church. But if you say, only the children of the faithful are to be baptized, because those infants only are judged to be within the covenant, and they only holy; I answer, the impiety of their nearest parents is not to be considered here, but the piety of the church in which they are born;—as also their ancestors who have lived godly and holily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/girolamo-zanchi.html">Girolamo Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians, p. 226. As quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6</cite>, pp. 139-140</span></figcaption>

</figure><figure class="quote" id="q-6d8c4fe66f" data-kw="">
<blockquote><p>The religious observance of this institution was required under a very severe penalty, Gen. 17:14. The contempt of circumcision was a contempt of the covenant; if the parents did not circumcise their children, it was at their peril, as in the case of Moses, Ex. 4:24–25. With respect to those that were not circumcised in their infancy, if, when they grew up, they did not themselves come under this ordinance, God would surely reckon with them. If they cut not off the flesh of their foreskin, God would cut them off from their people. It is a dangerous thing to make light of divine institutions, and to live in the neglect of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Gen. 17, verse 14</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

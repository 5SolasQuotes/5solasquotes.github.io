<blockquote><p>Q What remedy or redemption is there against sin and death?

A. Jesus Christ the eternal Son of God, who in man’s nature suffered the death of the cross and perfectly fulfilled that Law for all them that do receive him.

Proofs.</p></blockquote>

<blockquote><p>IX. Hence the state of the question is easily elicited. (1) It is not asked with respect to the value and sufficiency of the death of Christ–whether it was in itself sufficient for the salvation of all men. For it is confessed by all that since its value is infinite, it would have been entirely sufficient for the redemption of each and every one, if God had seen fit to extend it to the whole world. And here belongs the distinction used by the fathers and retained by many divines–that Christ ‘died sufficiently for all, but efficiently for the elect only.’ For this being understood of the dignity of Christ’s death is perfectly true (although the phrase would be less accurate if referred to the will and purpose of Christ). But the question properly concerns the purpose of the Father in delivering up his own Son and the intention of Christ in dying. Did the Father appoint his Son for each and every one and, did the Son deliver himself up to death with the design and intention of substituting himself in the place of each and every one to make satisfaction and acquire salvation for the same? Or did he resolve to deliver himself up for the elect only, who were given him by the Father to be redeemed and whose head he was to be?… Hence it is sufficiently evident that it is not here treated of the revealed will (eurestias) of God only, but of his secret will (eudokias) under which the death and mission of Christ fall (as all must agree).

X. (2) The question does not concern the fruits and efficacy of Christ’s death–whether each and all will be actually made partakes of these [and hence be saved]… Our opponents acknowledge that these are to be extended to believers only. Rather the question refers to the design of God in sending his Son into the world and the purpose of Christ in his death. Were these such that Christ by substituting himself in the place of each and every one, made satisfaction and obtained the remission of sin and salvation for them all or for the elect only? They affirm the former; we affirm the latter.

XI. (3) We do not inquire whether the death of Christ gives occasion to the imparting of many blessings even to reprobates. For it is due to the death of Christ that the gospel is preached to every creature, that the gross idolatry of the heathen has been abolished from many parts of the world , that the daring impiety of men is greatly restrained by God’s word and that some often obtain many and excellent (though not saving) gifts of the Holy Spirit. All these unquestionable flow from the death of Christ, since no place would have been given for them in the church unless Christ had died. Rather the question is whether the suretyship and satisfaction of Christ were (by the counsel of God and the will of Christ himself) intended for each and every one (as they hold); or for the elect only (as we assert).</p></blockquote>

<blockquote><p>But while our inherent depravity renders every kind of work which proceeds from us vicious in the sight of God, the only thing left for our works is to recover the grace which they have not in themselves, by a gratuitous acceptance. This is done when works acknowledged to have no value in themselves borrow, and, as it were, beg their value from Christ.</p></blockquote>

</figure><figure class="quote" id="q-21ff67656a" data-kw="">
<blockquote><p>The Scottish Covenanter, Dr William Symington, has some interesting thoughts on how Genesis 3:21 points to the need for atonement for our sins. I would point out that the garments which Adam and Eve received also show us of the need for imputed righteousness, nevertheless, Dr Symington’s words are useful in terms of the subject he is dealing with:

But, unless greatly mistaken, there is good reason to believe that the practice of sacrficing was coeval with the fall of man. We know not what else to make of the circumstance of our first parents being provided with garments of the skins of animals:- ‘Unto Adam also, and to his wife, did the Lord God make COATS OF SKIN, and clothed them.’ The animals whose skins furnished this primitive clothing, must have been dead, and the question is, how came they by their death? – Were they slain on purpose, merely to furnish garments for our first parents? This, to say the least of it, is extremely improbable, when we consider that there were so many other ways by which the same end could have been accomplished, without inflicting pain on sentinent and innocent creatures. Can they be supposed to have died of themselves? This is barely possible, but not at all probable. They had just lately been created in perfection, and that in so short a time they should have died a natural death is a most violent supposition. Could they have been slain for food? This, too, is an unreasonable presumption. It does not appear that animal food was in use till after the flood. The first grant of animals for meat, which we find on record, is that given to Noah after the deluge. To man, at first, we read only of the herb of the field and the fruit of the tree yielding seed being given for meat. How, then, we repeat the question, could those animals have died whose skins were the clothing of our first parents? And the only answer that accords with reason, or with the facts of the case, is, that they were slain for sacrifices. The impossibility of satisfactorily accounting otherwise for their death, taken in conjunction with the mention made of animal sacrifices immediately afterwards, gives to this supposition the weight of the very highest presumption, if not the force of absolute demonstration. And thus are we entitled to claim for the practice of sacrificing the highest possible antiquity. The most ancient records, both sacred and profane, furnish evidence in point. The farthest back that we can carry our inquiries, even with the assistance of divine revelation, we meet with traces of the practice in question. It as as old nearly as creation: it is coeval with man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The atonement and intercession of Jesus Christ</cite>, (New York, 1863), pp 69-70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

en+for+meat.+How%2C+then%2C+we+repeat+the+question%2C+could+those+animals+have+died+whose+skins+were+the+clothing+of+our+first+parents%3F+And+the+only+answer+that+accords+with+reason%2C+or+with+the+facts+of+the+case%2C+is%2C+that+they+were+slain+for+sacrifices.+The+impossibility+of+satisfactorily+accounting+otherwise+for+their+death%2C+taken+in+conjunction+with+the+mention+made+of+animal+sacrifices+immediately+afterwards%2C+gives+to+this+supposition+the+weight+of+the+very+highest+presumption%2C+if+not+the+force+of+absolute+demonstration.+And+thus+are+we+entitled+to+claim+for+the+practice+of+sacrificing+the+highest+possible+antiquity.+The+most+ancient+records%2C+both+sacred+and+profane%2C+furnish+evidence+in+point.+The+farthest+back+that+we+can+carry+our+inquiries%2C+even+with+the+assistance+of+divine+revelation%2C+we+meet+with+traces+of+the+practice+in+question.+It+as+as+old+nearly+as+creation%3A+it+is+coeval+with+man.%E2%80%9D%0A%0A%E2%80%94+William+Symington%2C+The+atonement+and+intercession+of+Jesus+Christ%2C+%28New+York%2C+1863%29%2C+pp+69-70.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F21ff67656a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/21ff67656a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/10/11/william-symington-on-genesis-321-and-the-need-for-atonement/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

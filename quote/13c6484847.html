<main class="wrap"><figure class="quote" id="q-13c6484847" data-kw="">
<blockquote><p>Apart altogether from any positive appointment in the matter, it is the office of natural reason, when it teaches men the duty of worship, to teach them at the same time to give a certain portion of their time to the discharge of the duty.

What proportion of time is to be so employed, and when the season for the duty is to recur, are questions which natural reason may be unable distinctly to answer. But the light of nature itself dictates the necessity of setting apart a certain proportion of time for the worship of God, founded as the duty of worship is in the necessary relation subsisting between the creature and the Creator.

But while natural reason dictates the duty of employing a certain proportion of our time in the worship of God, the question of when and how often the duty is to be discharged is one that belongs to God to determine. The length of time to be set apart for the duty, and the frequency of its return, are matters like other positive provisions for it, remain for God and not for man to dictate. We believe that the precise length of time to be set apart for ordinary worship, and also the interval between the recurrence of such seasons, have been fixed by God in that septenary division of time which He instituted for man in the beginning, and in the arbitrary singling out of one whole day in seven to be a holy Sabbath unto Himself.

In the institution of the Sabbath there was an arbitrary appointment of God grafted upon a natural duty; and hence the ordinance itself partakes of the character both of a moral and of a positive duty. It is of considerable importance in the argument, to distinguish clearly what belongs to it in the one character, and what belongs to it in the other. In so far as it recognises and embodies the obligation of devoting our time, more or less in amount, and at more or less frequent intervals, to the worship of God, it is a duty which the law of nature, apart from any positive appointment, enjoins. In so far as it defines this obligation as the duty to devote one whole day in seven, and a particular day in the week as the Sabbath, to the purposes of devotion, it must be regarded as a positive institution superinduced upon a natural one.

The duty of setting apart some portion or other of our time to the worship of God, is a duty founded in the relation of a creature to his Creator, as much as the obligation of worship itself, and not to be set aside or changed any more than you could set aside or change that relation. The duty, on the other hand, of setting apart a seventh and not a sixth portion of the week, and fixing its return on the first or last day of the seven, rather than any other, is an appointment of a positive kind, determined by God on good and sufficient principles connected with the circumstances of man, but yet principles which, in so far as we know, might in other circumstances have led to another determination.

In so far as it is a moral duty, founded on the very nature of man as God’s creature, and demanding some proportion of his time to be employed in worship, it could not be altered. In so far as it is a positive duty, founded in the circumstances of man, and demanding the seventh portion of the week, and the first or last day of it to be so employed, it might, in so far as we can understand, have been different from what it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 392-94.</span></figcaption>

<blockquote><p>I respond: The Papists make ordination a sacrament, and this the material of it, the laying on of hands (see Cornelius a Lapide, Commentary in location). This opinion has been refuted, see their antagonists. The Lutherans however reckon it according to the indifferent rites (see Eckhardt in location cited); however they are seen to discover something in it mystical and necessary however often they knowingly touch upon our indifferent things on this rite. We, however varied in locations and possibly in however many churches this right is used, yet adjudge it to be merely indifferent. See Piscator, Daneus and other commentators in 1 Timothy and Acts 6 &amp; 13; and Alting in the Exegesis of the Augsburg Confession, p. 90. This right was commonly used in synagogues, schools and the polity of the Jews, from where it is seen the apostles took it, which is the opinion of Calvin in his Commentary on Acts 6 &amp; 13, and Institutes, bk. 4, ch. 3, section 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 8. ‘Questions on Some Rituals in Particular: on the Laying on of Hands, the [Holy] Kiss, Abstinence from Things Strangled &amp; Blood, the Marriage Rite, Anointing, Shaking the Feet of Dust, Love Feasts, the Rite of Covenanting &amp; of the Washing of Feet.’, pp. 460-81 3 sections | Section 1, p. 460 “Problems on rites follow, certainly not all, but only some select ones in particular that the Scripture has mentioned. Those remaining are nearly innumerable which occur in the books of the Old and New Testament or ecclesiastical writings, whether ancient, medieval, modern or recent…” | 4th Problem, ‘What is to be decided about the laying on of hands in ordination or the constituting of ministers (on which see 1 Tim. 4 &amp; 5)?’, pp. 461-66</span></figcaption>

<blockquote><p>I take the Creed called Athanasius’s (though the author is unknown) to be an excellent explication of the doctrine of the Trinity: And could wish that it were more used and learnt of all. But I am not so far to judge other men as to conclude all men certainly damned forever that are not so well skilled in that mystery as to believe every word there written.</p></blockquote>

<blockquote><p>Wheras the Rejoinder makes sitting at a table in the Lord’s Supper and kneeling at prayer to be such things as the Lord could not command, but as snares, because sometime a table may be wanting [lacking], or something to sit on, or ability to sit, and so of kneeling: this is as poor a snare to catch any man of understanding in, as one shall lightly see made. For 1. many affirmative commandments of God there are, which in extraordinary cases cannot be fullfilled and cease to bind: as praying unto and praising of God with our voice: which is no snare, to him that cannot speak.</p></blockquote>

<blockquote><p>Yea, in those confessions, those passionate psalms made for him, we find him acknowledging of sin as his own. This will appear by some passages in those psalms which are prophetically made of Christ, and utter the inward addresses of his soul unto his Father. And of all the psalms, or other prophecies of this nature, there is no one except the twenty-second, which can challenge more passages in so small a space, applied expressly unto Christ in the New Testament, than the sixty-ninth psalm. In ver. 4 we have it, ‘They hated me without a cause.’ This we find applied by Christ himself, as prophesied of himself, John xv. 25. Again, we have it ver. 9 of that psalm, ‘The zeal of thine house hath eaten me up.’

This you have in like manner, John ii. 19, applied unto Christ. Moreover, the next words of that 9th verse, ‘The reproaches of them that reproached thee are fallen upon me.’ Lo, you have them applied by Paul as expressly unto Christ, Rom. xv. 3. Again, that passage, ver. 21, ‘They gave me gall for my meat, and in my thirst they gave me vinegar to drink;’ you know both the story and the application of it by the evangelists, Matthew, Mark, and John. Then that other passage that follows, ‘Let their table be made a snare,’ you have it applied accordingly unto the Jews that crucified him, for their crucifying of him, Rom. xi. 9.

Now then, so many of these being so applied, why should not those others also be so applied? as when it is said, ver. 4, 5, ‘Then I restored that which I took not away; O God, thou knowest my foolishness, and my guiltiness is not hid from thee.’ How fitly do these words express the imputation of sin to him. It was a proverbial speech, when a man suffered innocently as to his own person, to say that ‘He restored that which he took not,’ and so Christ on the cross is brought in here speaking. For as Isaiah tells us, ‘He bore our sins;’ with Oh in the next verse of the psalm he confesseth as his own, having taken them upon him. ‘O God, thou knowest my foolishness’ (that is my sin, as foolishness it is usually taken), ‘and my sins are not hidden from thee.’ Which is plainly in other words that which the apostle says of him, 2 Cor. v., ‘He that knew no sin was made sin.’

The like you have in the fortieth psalm, ‘Sacrifice and burnt-offering thou wouldst not; Lo I come,’ &amp;c., ver. 6, 7, which how it is applied to Christ you may read in Heb. x, neither can it well be applied to any other. Yet, ver. 12, he says, ‘My iniquities take hold of me.’ He calls them his, not by perpetration, but by a voluntary assumption, and by imputation, reckoning them as his. So Isaiah liii. 6, ‘He laid on him the iniquities of us all.’ In the Hebrew it is, ‘He caused to meet in him the iniquities of us all.’ He was made the great ocean, into which the guilt of all our sins did run.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christ the Mediator</cite>, (London, 1642) in The Works of Thomas Goodwin (12 vols, Edinburgh: James Nisbet, 1861-66), 5: 183-84.</span></figcaption>

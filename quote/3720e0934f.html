<blockquote><p>I piously and gladly believe the perpetual virginity of Mary unto death (hear, impostor); yet this pertains nothing to our mystery of salvation. It suffices for us to believe what is, and is narrated by the evangelists, that our Savior was conceived by the Holy Spirit and born of the Virgin Mary.” ‘Preface’ to the New Testament to the most illustrious Prince of Condé, etc. If one who speaks thus dared to thrust his most unclean snout into Mary’s virginity, what shall I say of the great Basil, who in the homily on the Nativity of the Lord says, whether after the mystery of the incarnation the Virgin bore children or not, παρὰ ταῦτα δὲ οὐδὲν δοξάζομεν πᾶσι, it in no wise injures the business of piety. For so long as it was necessary to serve the dispensation, virginity was necessary. “But what afterwards followed,” he says, “σιωπῇ παραδοτέον τοῖς λόγῳ οὐ μυστήρια καταλείψομεν [we shall leave in silence to those who speak the mysteries which cannot be expressed in words], nor is it necessary to inquire anxiously into what pertains to the nature of this mystery.</p></blockquote>

<blockquote><p>Whether a prince or magistrate may tolerate Jews in his city or province? Three things may be considered in the Jews. First, the sect and Jewish exercise. Second, usury. Third, hatred toward Christians. All these are evil and prohibited. The question is therefore whether a prince or magistrate may permit or tolerate these evils; and what may be a legitimate cause for permitting and tolerating them? I answer through the following conclusions: First Conclusion. A magistrate may permit the rites and exercises of the Jews if a sufficient cause is present. The Pope of Rome does this, as do many princes in their provinces. The cause may be threefold. First, that through Jewish rites the Christian truth may be shadowed forth and confirmed: St. Augustine, Of the City of God, bk. 18, ch. 46 and St. Thomas in pt. 2 of 2, quest. 10, art. 11, approve this cause. Second, that Jews who practice their rites and understand from the Christians among whom they dwell that those rites were merely shadows and figures of the Christian religion may more easily be converted to the Faith of Christ. St. Thomas, in the cited place, also approves this. Third, that Christian princes or magistrates, under the pretext of permission, may receive money and other gifts from the Jews to whom they permit the exercise. This is not lawful. For public sins, by which God is offended, cannot be permitted for the sake of temporal gain alone, which is hoped for from the permission. Second Conclusion. A magistrate may permit the usuries of the Jews if a sufficient cause is present. The Pope and other Christian princes also do this. The cause may be twofold. One, to prevent a greater evil. For if, as I said above, usuries were not permitted, many thefts, robberies, oppressions of the poor and similar inconveniences would occur. Therefore, to avoid these evils, usuries may be permitted as a lesser evil. The other, that Christian princes and magistrates who permit the usuries of the Jews may be participants in the profit. This is not lawful. For it is certain that usury is prohibited by natural and divine law; and the profit that is acquired through usury is mere theft. Just as, therefore, the Jews sin against justice by receiving usurious profit, so do the Christians who are participants in that profit. They are considered to be participants, however, when they permit usuries for the purpose of being able to receive profit therefrom. This conclusion must be limited in two ways: First, that common usuries may be permitted which do not exceed the profit permitted by law and custom, but not exorbitant usuries, of which I shall speak shortly. Second, that a Christian magistrate may not receive profit from usuries on account of the mere permission of usuries: although they may receive it under another title. And indeed under a double title: First, the title of punishment; because he may punish the Jews on account of usuries; and the profit that has been unjustly acquired from usuries he may either restore to its owners or convert to public utility. Then, the title of exaction; because he may exact an annual tribute or tax from the Jews, not by reason of the permission of usuries, but by reason of the granted habitation in a Christian place. Third Conclusion. A Christian magistrate or prince cannot with a good conscience permit or leave unpunished the hatred of Jews toward Christians. Note: Hatred is twofold: The one is internal; because since it is hidden, the magistrate cannot punish it. The other is external, which breaks out into open injury. This ought to be coerced by the magistrate. We say, therefore, that such hatred, when it is exercised by Jews against Christians, can in no way be permitted or tolerated, but must be severely punished: and the prince sins gravely if he does not punish those who commit offenses. The reason is that a prince is bound by his office to punish every public injury, if he is able, so that justice may be preserved: therefore, he is also bound to punish the injury which the Jews commit against Christians. This is, indeed, manifold: First, because they exact immoderate and intolerable usury from citizens, country folk, and the poor. Whatever they exact beyond the principal is theft. Therefore, they commit intolerable theft. Second, by exacting such usury, they harm the republic or the community greatly. For a republic cannot stand or flourish when the people are oppressed and exhausted by usury. Third, besides usury, another injury is added. For whatever is for sale in the market, the Jews snatch away from the Christians by offering a higher price to the sellers than other buyers are accustomed to offer; and afterwards, which is most iniquitous, Christians are forced to pay double the price to the Jews if they wish to buy what is necessary for feeding their families. Fourth, so that they may do all these things with impunity, they distribute gifts to the officials of princes so that they may be protected by them. Fifth, from this it happens that the people, who bear such injuries with difficulty, become prone to inciting sedition, both against the Jews themselves and against their defenders and patrons. Against the Jews, indeed, because they are thieves and plunderers; against the patrons, because they are partners of thieves and plunderers. If a prince or magistrate does not prevent or punish these great evils (to say nothing of the rest), he is a participant in the crime and is bound to restitution. He can, however, prevent them in three ways. First, if he expels the Jews entirely from his province or city. Second, if he does not indeed expel them, but forces them to agriculture, or to mechanical arts, or to exercise other works; and does not allow them to live in idleness and luxury, as they now live. Third, if he deprives them of all the money and wealth which they have received through usury. Would that these things were brought into practice. You will say, if the Jews are either expelled or do not accept usury, two inconveniences will follow: First, because Christian princes in time of necessity will not have money for war. For they are accustomed to seek this from the Jews. Then, the subjects of the princes, who are in need of money, will not be able to borrow. I respond: The contrary follows: First, because once the Jews are expelled, the citizens will be able to contribute more support than the Jews are accustomed to. For whatever the Jews contribute, they receive from the citizens through unjust usury. And not only this, but also whatever is necessary for them to sustain their lives. Therefore, they take two portions from the citizens: one, which they give to the prince; the other, by which they live. Certainly, if the Jews were expelled, the citizens would be prepared to give either both portions to their prince, or at least no less than they give to the Jews. Next, the subjects of princes are in greater need of money when the Jews are present than when they are absent. For when they are present and demanding intolerable usury, they are completely drained. If they were absent, or at least did not demand such immoderate usury, the subjects would be less drained, and consequently would be in less need of money. Our Adam Contzen has written extensively on this subject in his Politics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-becanus.html">Martin Becanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Manual of Controversies of this Time (Wurzburg, 1623), bk. 5, ch. 18, ‘Is a prince or magistrate able to tolerate Jews in his city or province?’ tr. AI by The Faith Received Becanus (1563–1624) was a Dutch-born, Roman Catholic, Jesuit priest, known as a theologian and controversialist.</cite></span></figcaption>

+The+other+is+external%2C+which+breaks+out+into+open+injury.+This+ought+to+be+coerced+by+the+magistrate.+We+say%2C+therefore%2C+that+such+hatred%2C+when+it+is+exercised+by+Jews+against+Christians%2C+can+in+no+way+be+permitted+or+tolerated%2C+but+must+be+severely+punished%3A+and+the+prince+sins+gravely+if+he+does+not+punish+those+who+commit+offenses.+The+reason+is+that+a+prince+is+bound+by+his+office+to+punish+every+public+injury%2C+if+he+is+able%2C+so+that+justice+may+be+preserved%3A+therefore%2C+he+is+also+bound+to+punish+the+injury+which+the+Jews+commit+against+Christians.+This+is%2C+indeed%2C+manifold%3A+First%2C+because+they+exact+immoderate+and+intolerable+usury+from+citizens%2C+country+folk%2C+and+the+poor.+Whatever+they+exact+beyond+the+principal+is+theft.+Therefore%2C+they+commit+intolerable+theft.+Second%2C+by+exacting+such+usury%2C+they+harm+the+republic+or+the+community+greatly.+For+a+republic+cannot+stand+or+flourish+when+the+people+are+oppressed+and+exhausted+by+usury.+Third%2C+besides+usury%2C+another+injury+is+added.+For+whatever+is+for+sale+in+the+market%2C+the+Jews+snatch+away+from+the+Christians+by+offering+a+higher+price+to+the+sellers+than+other+buyers+are+accustomed+to+offer%3B+and+afterwards%2C+which+is+most+iniquitous%2C+Christians+are+forced+to+pay+double+the+price+to+the+Jews+if+they+wish+to+buy+what+is+necessary+for+feeding+their+families.+Fourth%2C+so+that+they+may+do+all+these+things+with+impunity%2C+they+distribute+gifts+to+the+officials+of+princes+so+that+they+may+be+protected+by+them.+Fifth%2C+from+this+it+happens+that+the+people%2C+who+bear+such+injuries+with+difficulty%2C+become+prone+to+inciting+sedition%2C+both+against+the+Jews+themselves+and+against+their+defenders+and+patrons.+Against+the+Jews%2C+indeed%2C+because+they+are+thieves+and+plunderers%3B+against+the+patrons%2C+because+they+are+partners+of+thieves+and+plunderers.+If+a+prince+or+magistrate+does+not+prevent+or+punish+these+great+evils+%28to+say+nothing+of+the+rest%29%2C+he+is+a+participant+in+the+crime+and+is+bound+to+restitution.+He+can%2C+however%2C+prevent+them+in+three+ways.+First%2C+if+he+expels+the+Jews+entirely+from+his+province+or+city.+Second%2C+if+he+does+not+indeed+expel+them%2C+but+forces+them+to+agriculture%2C+or+to+mechanical+arts%2C+or+to+exercise+other+works%3B+and+does+not+allow+them+to+live+in+idleness+and+luxury%2C+as+they+now+live.+Third%2C+if+he+deprives+them+of+all+the+money+and+wealth+which+they+have+received+through+usury.+Would+that+these+things+were+brought+into+practice.+You+will+say%2C+if+the+Jews+are+either+expelled+or+do+not+accept+usury%2C+two+inconveniences+will+follow%3A+First%2C+because+Christian+princes+in+time+of+necessity+will+not+have+money+for+war.+For+they+are+accustomed+to+seek+this+from+the+Jews.+Then%2C+the+subjects+of+the+princes%2C+who+are+in+need+of+money%2C+will+not+be+able+to+borrow.+I+respond%3A+The+contrary+follows%3A+First%2C+because+once+the+Jews+are+expelled%2C+the+citizens+will+be+able+to+contribute+more+support+than+the+Jews+are+accustomed+to.+For+whatever+the+Jews+contribute%2C+they+receive+from+the+citizens+through+unjust+usury.+And+not+only+this%2C+but+also+whatever+is+necessary+for+them+to+sustain+their+lives.+Therefore%2C+they+take+two+portions+from+the+citizens%3A+one%2C+which+they+give+to+the+prince%3B+the+other%2C+by+which+they+live.+Certainly%2C+if+the+Jews+were+expelled%2C+the+citizens+would+be+prepared+to+give+either+both+portions+to+their+prince%2C+or+at+least+no+less+than+they+give+to+the+Jews.+Next%2C+the+subjects+of+princes+are+in+greater+need+of+money+when+the+Jews+are+present+than+when+they+are+absent.+For+when+they+are+present+and+demanding+intolerable+usury%2C+they+are+completely+drained.+If+they+were+absent%2C+or+at+least+did+not+demand+such+immoderate+usury%2C+the+subjects+would+be+less+drained%2C+and+consequently+would+be+in+less+need+of+money.+Our+Adam+Contzen+has+written+extensively+on+this+subject+in+his+Politics.%E2%80%9D%0A%0A%E2%80%94+Martin+Becanus%2C+Manual+of+Controversies+of+this+Time+%28Wurzburg%2C+1623%29%2C+bk.+5%2C+ch.+18%2C+%E2%80%98Is+a+prince+or+magistrate+able+to+tolerate+Jews+in+his+city+or+province%3F%E2%80%99+tr.+AI+by+The+Faith+Received+Becanus+%281563%E2%80%931624%29+was+a+Dutch-born%2C+Roman+Catholic%2C+Jesuit+priest%2C+known+as+a+theologian+and+controversialist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ca8f987c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ca8f987c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Whether%20a%20prince%20or%20magistrate%20may,on%20this%20subject%20in%20his%20Politics." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].”

— Johannes Hoornbeeck, T’shuvah Yehudah, or For the Convincing &amp; Converting of the Jews (Leiden, 1655), pp. 24-25 tr. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A717.+Now+to+the+Political+Means.+I.+Nothing+is+accomplished%2C+indeed%2C+things+are+done+badly%2C+by+persecuting%2C+harassing+or+oppressing+the+Jews%2C+driving+them+away%2C+or+killing+them.+That+is+to+say%2C+those+guilty+of+Judaism+alone+%5Bshould+not+be+harassed+or+oppressed%5D.+But+those+guilty+of+other+crimes+should+be+punished+equally+with+others.+Nevertheless%2C+they+should+not+be+treated+more+harshly+for+that+reason%2C+because+they+are+Jews.+We+do+not+wish+innocent+people+to+be+constrained+merely+because+they+are+Jews+or+Saracens.+Among+the+ancient+Sicilian+laws%2C+Emperor+Frederick+established+this+in+Constitutions+of+Sicily%2C+bk.+1%2C+title+17+%26+26%3A+%E2%80%98We+cannot+allow+Jews+and+Saracens%2C+whom+the+diversity+of+the+Christian+sect+makes+hostile%2C+and+who+are+deprived+of+every+other+assistance%2C+to+be+defrauded+of+the+power+of+our+protection.%E2%80%99+Christian+converts+from+Judaism+have+noted+that+this+perverse+practice+of+treating+Jews+more+harshly+is+a+great+hindrance+to+the+conversion+of+more+people.+For+it+is+entirely+foreign+to+the+nature+of+faith+to+employ+violence+in+order+to+produce+belief.+Petrus+Alphonsus+the+Spaniard%2C+in+The+Dialogue+of+Moses+%26+Peter%3A+%E2%80%98To+imprison+and+kill%2C+until+someone+either+believes+or+pays+a+tax%2C+is+not+among+the+works+of+God%3B+nor+did+any+of+the+prophets+command+anyone+to+be+compelled+to+believe.%E2%80%99+Likewise%2C+Stephanus+Isaacus+%28to+whom%2C+together+with+his+father+Johannes+Isaacus%2C+Cardinal+and+Papal+Legate+Franciscus+de+Mendoza+had+granted+authority+to+investigate+all+the+Jews+throughout+the+three+ecclesiastical+electorates%2C+and+to+rage+against+them+with+fire+and+sword%29+rightly+said+that+this+counsel+was+unjust+and+most+wicked%2C+and+that+more+is+accomplished+through+moderation+and+kindness+than+through+cruelty+or+savagery%2C+in+his+German+Apology%2C+p.+42.+The+same+was+noted+by+%5BJohannes%5D+Pfefferkorn+%5Bd.+1523%5D+and+others.+Therefore%2C+the+better+and+more+common+opinion%2C+both+among+theologians+and+among+jurists%2C+is+that+the+Jews+should+be+tolerated%E2%80%94not+indeed+enticed%2C+but%2C+where+they+are+found%2C+not+treated+more+harshly.+Thus%3A+%E2%80%A2+Baldus%2C+vol.+1%2C+Consil%2C+315-16+%E2%80%A2+Rolandus+a+Valle%2C+vol.+3%2C+Consil%2C+25+%E2%80%A2+Alexander+of+Hales%2C+Summa%2C+pt.+2%2C+Questions+179-80+%E2%80%A2+Vincent+of+Beauvais%2C+Spec.+Doctr.%2C+bk.+10%2C+ch.+38%2C+etc.+%E2%80%A2+Johannes+Gerhard%2C+Common+Places%2C+On+the+Magistrate%2C+p.+631+%E2%80%A2+Hottinger%2C+Thesaurus+Philologicus%2C+bk.+1%2C+ch.+1%2C+section+2%2C+question+1+And+the+one+who+treated+this+matter+learnedly+and+extensively+in+a+separate+book%2C+Georgius+Theodorus%2C+Counselor+of+Hesse%2C+De+jure+et+statu+Iud%C3%A6orum+in+Republica+Christianorum+%5BOn+the+Law+and+Status+of+the+Jews+in+the+Republics+of+Christians%5D.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+T%E2%80%99shuvah+Yehudah%2C+or+For+the+Convincing+%26+Converting+of+the+Jews+%28Leiden%2C+1655%29%2C+pp.+24-25+tr.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F160288216c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/160288216c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=%C2%A717.%20Now%20to%20the%20Political%20Means.,Jews%20in%20the%20Republics%20of%20Christians%5D." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

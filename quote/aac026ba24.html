<blockquote><p>If it was the approven practice of Kings and Magistrates under the Old Testament to suppress Error, Heresy and Blasphemy, then Magistrates under the New Testament are bound to do the like. But, so it is that it was the approven practice of Kings and Magistrates under the Old Testament to suppress Error, Heresy and Blasphemy and other sins against the first Table: Therefore, Magistrates under the New Testament are bound to do the like […]</p></blockquote>

<blockquote><p>This act divided those who were already disjointed, and the debates upon the lawfulness or unlawfulness of paying the [Scottish] cess [in 1678] here imposed, were not few. Upon the one hand it was strongly urged that the payment of this cess was an active concurring with the persecutors in their bearing down of the Lord’s work in the land; and it was said it was much the same whether this was done by the sword or the purse. Upon the other side it was reasoned that since violence was both expected and used, it appeared more advisable by a piece of money to preserve themselves and their families alive, and their substance in their hands for better uses, than by an absolute refusal to give an occasion, and afford a legal pretext to the collectors’ cruelty, to destroy all and take as much as would raise and maintain two armies. It was added, that paying cess in this case was not spontaneous, but involuntary and forced, and therefore to be excused, a person in such circumstances being rather a sufferer than an actor; and though it would be certainly sinful in a merchant, to throw his goods into the sea in fair weather, yet it becomes his duty to lighten the ship that he may save his life in a storm. Some of very good parts and great piety were upon both sides of this debate, and the heats and heights among ministers, preachers, and people were not small. The banished ministers in Holland [Robert McWard &amp; John Brown of Wamphray] were warmly against paying this assessment; and such ministers here who were of the same sentiments preached against the paying of it, and some of the hearers violently pressed ministers to preach against it, while those of the other side asked how they would keep it and much more out of the soldiers’ hands? Against paying it the example of one of the primitive Christians was much urged, who having rashly demolished an idol temple, chose to suffer martyrdom before he would rebuild it. These who were for paying it, as the lesser evil of suffering, were silent till the clamor and heat was a little over and used to declare that if in their judgment they had been against paying it, they would have advised people to retire and leave the country. Some few did pay it with a declaration and chose the middle way betwixt paying it without any testimony against what was evil in it and refusing to pay at all. Among these the forementioned Quintin Dick in Dalmellington was one. And it will not be unacceptable to some of my readers to set down from his own papers his exercise and practice in this matter in his own words. ‘In the year 1678, the king, by an act of the convention of estates, did impose upon the subjects a cess to be paid, and by the act did signify the reasons for which he imposed it; and among others this is one, for levying and keeping up of forces to suppress these meetings called conventicles. The act with this qualification did beget in many a reluctance to give obedience; and amongst others, having made it my work in my place and station (as a witness to the interest of my Lord and Master Jesus Christ) to keep at distance from all manner of sinful compliance or accession to the overthrow of his work and worship in Scotland, I judged myself deeply concerned how to carry in this case: especially, when by the holy and sovereign dispensation of God, for his own holy and wise ends, He has made it the sad lot of the honest ministers and professors in Scotland at this time to be under a spirit of division and rent, to that measure, that though all were for bearing witness to one and the same cause and interest, yet they could not agree in one and the same method and way of entering their testimony. In this hour of darkness, being much perplexed how to carry without scandal and offence, I betook myself to God for protection and direction: for protection, that I might be kept from any measure of denying of Christ, or giving ground to persecutors to think or say that I had contributed any thing for the overthrow of Christ’s work: and for direction that I should not he found to stave off my trouhle upon any grounds, hut such as might he clearly war ranted from the word of God. And after much liberty in pouring out my heart to God, I was brought to weigh, that as my paying of it might be by some interpreted a scandal, and a sinful acquiescence in the magistrate’s sinful command; so upon the other hand, my refusing to pay it would be the greater scandal, being found to clash against a known command of God, of giving to all their due, tribute to whom tribute is due, custom to whom custom; and knowing that Christ Jesus, for that same very end, to evite offense, did both pay tribute Himself and commanded his followers to do it, I could see no way to refuse payment of that cess, unless I had clashed with that command of paying tribute unto Caesar. So to evite the scandal of compliance on the one hand, and disobedience to the magistrate in matter of custom on the other, I came to a determination to give in my cess to the collect of the shire of Ayr where I lived, with a protestation against the magistrate’s sinful qualification of his commands, and a full adherence unto these meetings of God’s people, called conventicles, which in the act he declared his design to bear down, as the protestation itself, signed by my hand more fully bears in a paper by itself. I had no sooner done this, but I was trysted with many sharp censures from many hands, among which this was one, that my protestation was only to evite sufferings, and could be of no weight, being protestatio contraria facto [a protestation contrary to fact]. But being truly persuaded, that it is the magsitrate’s right to impose and exact cess and custom, I could have no clearnes to state my sufferings in opposition unto so express a command of God. And as to the magistrate’s sinful qualification, having so openly declared and protested against it, I conceive the censure of this to evite suffering, is altogether groundless; seeing the enemy has subscribed with my hand before witnesses, a resolute adherence to that which they say this tends to overthrow; and if he mind to persecute upon the ground of owning conventicles, he has a fair and full occasion against me, under my hand: but if he intend to state my suffering upon refusing to pay cess to the magistrate, I have no clearness to ex pose myself, or give him ground to found my sufferings upon such a refusal. And when my subtle adversary seeks grounds to state my trouble upon my opposition to any of the commands of God, I absolutely hold it for duty to own these commands, by paying of Caesar’s due, and to obviate his subtilties by a clear protestation against sinful qualifications. So whatever has, or shall be the censure of friend or foe, this I say to the praise and glory of my God and my guide, I have met with from Him much comfort, peace of mind, and rest in my conscience: ‘Thou hast holden me by my right hand, thou shalt guide me with they counsel, and afterward receive me to glory.</p></blockquote>

nd+much+more+out+of+the+soldiers%E2%80%99+hands%3F+Against+paying+it+the+example+of+one+of+the+primitive+Christians+was+much+urged%2C+who+having+rashly+demolished+an+idol+temple%2C+chose+to+suffer+martyrdom+before+he+would+rebuild+it.+These+who+were+for+paying+it%2C+as+the+lesser+evil+of+suffering%2C+were+silent+till+the+clamor+and+heat+was+a+little+over+and+used+to+declare+that+if+in+their+judgment+they+had+been+against+paying+it%2C+they+would+have+advised+people+to+retire+and+leave+the+country.+Some+few+did+pay+it+with+a+declaration+and+chose+the+middle+way+betwixt+paying+it+without+any+testimony+against+what+was+evil+in+it+and+refusing+to+pay+at+all.+Among+these+the+forementioned+Quintin+Dick+in+Dalmellington+was+one.+And+it+will+not+be+unacceptable+to+some+of+my+readers+to+set+down+from+his+own+papers+his+exercise+and+practice+in+this+matter+in+his+own+words.+%E2%80%98In+the+year+1678%2C+the+king%2C+by+an+act+of+the+convention+of+estates%2C+did+impose+upon+the+subjects+a+cess+to+be+paid%2C+and+by+the+act+did+signify+the+reasons+for+which+he+imposed+it%3B+and+among+others+this+is+one%2C+for+levying+and+keeping+up+of+forces+to+suppress+these+meetings+called+conventicles.+The+act+with+this+qualification+did+beget+in+many+a+reluctance+to+give+obedience%3B+and+amongst+others%2C+having+made+it+my+work+in+my+place+and+station+%28as+a+witness+to+the+interest+of+my+Lord+and+Master+Jesus+Christ%29+to+keep+at+distance+from+all+manner+of+sinful+compliance+or+accession+to+the+overthrow+of+his+work+and+worship+in+Scotland%2C+I+judged+myself+deeply+concerned+how+to+carry+in+this+case%3A+especially%2C+when+by+the+holy+and+sovereign+dispensation+of+God%2C+for+his+own+holy+and+wise+ends%2C+He+has+made+it+the+sad+lot+of+the+honest+ministers+and+professors+in+Scotland+at+this+time+to+be+under+a+spirit+of+division+and+rent%2C+to+that+measure%2C+that+though+all+were+for+bearing+witness+to+one+and+the+same+cause+and+interest%2C+yet+they+could+not+agree+in+one+and+the+same+method+and+way+of+entering+their+testimony.+In+this+hour+of+darkness%2C+being+much+perplexed+how+to+carry+without+scandal+and+offence%2C+I+betook+myself+to+God+for+protection+and+direction%3A+for+protection%2C+that+I+might+be+kept+from+any+measure+of+denying+of+Christ%2C+or+giving+ground+to+persecutors+to+think+or+say+that+I+had+contributed+any+thing+for+the+overthrow+of+Christ%E2%80%99s+work%3A+and+for+direction+that+I+should+not+he+found+to+stave+off+my+trouhle+upon+any+grounds%2C+hut+such+as+might+he+clearly+war+ranted+from+the+word+of+God.+And+after+much+liberty+in+pouring+out+my+heart+to+God%2C+I+was+brought+to+weigh%2C+that+as+my+paying+of+it+might+be+by+some+interpreted+a+scandal%2C+and+a+sinful+acquiescence+in+the+magistrate%E2%80%99s+sinful+command%3B+so+upon+the+other+hand%2C+my+refusing+to+pay+it+would+be+the+greater+scandal%2C+being+found+to+clash+against+a+known+command+of+God%2C+of+giving+to+all+their+due%2C+tribute+to+whom+tribute+is+due%2C+custom+to+whom+custom%3B+and+knowing+that+Christ+Jesus%2C+for+that+same+very+end%2C+to+evite+offense%2C+did+both+pay+tribute+Himself+and+commanded+his+followers+to+do+it%2C+I+could+see+no+way+to+refuse+payment+of+that+cess%2C+unless+I+had+clashed+with+that+command+of+paying+tribute+unto+Caesar.+So+to+evite+the+scandal+of+compliance+on+the+one+hand%2C+and+disobedience+to+the+magistrate+in+matter+of+custom+on+the+other%2C+I+came+to+a+determination+to+give+in+my+cess+to+the+collect+of+the+shire+of+Ayr+where+I+lived%2C+with+a+protestation+against+the+magistrate%E2%80%99s+sinful+qualification+of+his+commands%2C+and+a+full+adherence+unto+these+meetings+of+God%E2%80%99s+people%2C+called+conventicles%2C+which+in+the+act+he+declared+his+design+to+bear+down%2C+as+the+protestation+itself%2C+signed+by+my+hand+more+fully+bears+in+a+paper+by+itself.+I+had+no+sooner+done+this%2C+but+I+was+trysted+with+many+sharp+censures+from+many+hands%2C+among+which+this+was+one%2C+that+my+protestation+was+only+to+evite+sufferings%2C+and+could+be+of+no+weight%2C+being+protestatio+contraria+facto+%5Ba+protestation+contrary+to+fact%5D.+But+being+truly+persuaded%2C+that+it+is+the+magsitrate%E2%80%99s+right+to+impose+and+exact+cess+and+custom%2C+I+could+have+no+clearnes+to+state+my+sufferings+in+opposition+unto+so+express+a+command+of+God.+And+as+to+the+magistrate%E2%80%99s+sinful+qualification%2C+having+so+openly+declared+and+protested+against+it%2C+I+conceive+the+censure+of+this+to+evite+suffering%2C+is+altogether+groundless%3B+seeing+the+enemy+has+subscribed+with+my+hand+before+witnesses%2C+a+resolute+adherence+to+that+which+they+say+this+tends+to+overthrow%3B+and+if+he+mind+to+persecute+upon+the+ground+of+owning+conventicles%2C+he+has+a+fair+and+full+occasion+against+me%2C+under+my+hand%3A+but+if+he+intend+to+state+my+suffering+upon+refusing+to+pay+cess+to+the+magistrate%2C+I+have+no+clearness+to+ex+pose+myself%2C+or+give+him+ground+to+found+my+sufferings+upon+such+a+refusal.+And+when+my+subtle+adversary+seeks+grounds+to+state+my+trouble+upon+my+opposition+to+any+of+the+commands+of+God%2C+I+absolutely+hold+it+for+duty+to+own+these+commands%2C+by+paying+of+Caesar%E2%80%99s+due%2C+and+to+obviate+his+subtilties+by+a+clear+protestation+against+sinful+qualifications.+So+whatever+has%2C+or+shall+be+the+censure+of+friend+or+foe%2C+this+I+say+to+the+praise+and+glory+of+my+God+and+my+guide%2C+I+have+met+with+from+Him+much+comfort%2C+peace+of+mind%2C+and+rest+in+my+conscience%3A+%E2%80%98Thou+hast+holden+me+by+my+right+hand%2C+thou+shalt+guide+me+with+they+counsel%2C+and+afterward+receive+me+to+glory.%E2%80%9D%0A%0A%E2%80%94+Robert+Wodrow%2C+The+History+of+the+Sufferings+of+the+Church+of+Scotland+from+the+Restoration+to+the+Revolution%2C+%281721-1722%29%2C+2.491-92&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F875742ba52.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/875742ba52.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-paying-taxes/#:~:text=This%20act%20divided%20those%20who%20were,and%20afterward%20receive%20me%20to%20glory&amp;text=This%20act%20divided%20those%20who%20were%20already%20disjointed&amp;text=they%20counsel%2C%20and%20afterward%20receive%20me%20to%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-bee4d8906f" data-kw="">
<blockquote><p>Those, though otherwise never so godly, that separate from true Churches, like Novatus and Lucifer, for a stricter course of discipline; like Donatus for some bad ones in the Church, as they supposed; like Andius for some lesser corruptions and abuses, they be schismatics. This is the judgment of ancient Churches, for which see at large, Mornay, On the Church, p. 35. But our late Separatists do divide themselves from us upon like grounds: for a more strict discipline with Novatus and Lucifer; for that good and bad are mixed together, with Donatus; and from lesser corruptions among us with Andius. Therefore are these also schismatics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical</cite>, ... (London: 1610) | 2nd Likelihood, p. 48</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8703e15634" data-kw="">
<blockquote><p>There is no doctrine objectively of absolute necessity to salvation, but the doctrine of the Baptismal Covenant which is expounded in the [Apostles’] Creed, Lord’s prayer and Decalogue. But there is much doctrinal and active means necessary to make men uUnderstand, Believe, Love and Practice this necessary Covenant doctrine. And the doctrine or articles of faith, will save none that do not understand, believe, love, and practise it, and that sincerely preferring the things revealed before all the pleasures, riches and honors of this world. A parrot shall not be a saint for saying the Creed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, pp. 85-86</span></figcaption>

<blockquote><p>The Reformed orthodox generally also note… three kinds of doctrinal error: 1. errors against a fundamental article… 2. errors around a fundamental or in indirect contradiction to it… 3. errors beyond a fundamental article (praeter fundamentum)… The third category of error does not address fundamental articles directly or indirectly but rather involves faith in problematic and curious questions… that do not arise out of the revealed Word–hay and stubble!–and that, because of their curiosity and vanity, constitute diversions from and impediments to salvation. (Rijssen, Summa, I.xiii; cf. Turretin, Inst. theol., I.xiv.9)” – Muller, PRRD (2003) 1.422-23 Hottinger, Johann Heinrich – The 8th Theological Disputation of the Gymnasium: Of the Use &amp; Abuse of the Distinction of [Theological] Places into Fundamental &amp; Non-Fundamental (Zurich, 1664) Cocceius, Johannes – ch. 7. ‘Of that which is Fundamental’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 90-97 Velthuysen, Lambert – 3. ‘Of Principles from the First Rising, or Fundamental Articles &amp; Errors’ in Theology (Fribourg, 1666), pp. 8-11 Velthuysen (1623-1685) Burman, Francis – Ch. 3. ‘Of the Foundation &amp; Fundamental Articles’ in A Synopsis of Theology… (Utrecht, 1671), vol. 2, Locus 41, ‘Of Revelation &amp; the Word under the Economy of the New Covenant’, pp. 308-317 Burman (1628-79) Pauli, Reinhold – A Compendium of Theological Disputations… Ch. 1, On the Fundamental of the Faith (Marburg 1672) Pauli (1638-1682) was a German reformed professor of theology at Marburg. Heidegger, Johann Heinrich – A Dissertation on the Foundation of Salvation, whereby the Whole Subject of Fundamental &amp; Non-Fundamental Articles &amp; Errors is Struck (Zurich, 1676) Rissen, Leonard – Locus 1, ‘Of Theology’, Controversy 3, sections 12-13, pp. 13-14 in A Sum of Didactic &amp; Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology... (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

<blockquote><p>In this work [his Commentary on Romans] Bucer was convinced that a clear exposition of the scriptures, as well as the chuch fathers and even some scholastic theologians, would lead the old church to the evangelical truth of the fundamentals of the Christian faith.</p></blockquote>

<blockquote><p>18. They separate themselves from the true Churches of Christ. The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another? This schism grows into a heresy, as a serpent grows to be a dragon. This tolerated, will ruin families, tearing them all to pieces, while the husband goes to one Church, the wife to another, the son to a third, the daughter to a fourth, and the servant to an ale-house instead of a Church. This opens a gap to abundance of profaneness, when there shall be no cohabitation, but the Church members shall be scattered up and down, some twenty, some thirty, some sixty, some one hundred miles off; who shall have the inspection, teaching and guidance of these? Master [Jeremiah] Burroughs’s argument (Irenicum, ch. 23) for gathering of churches (in my judgment) is very dilute and weak; ’tis this: Because our divines hold it lawful to gather churches out of the Church of Rome: therefore ’tis lawful to gather churches out of the Church of England, q.d. because ’tis lawful to separate from a whore, therefore, we ought to separate from an honest woman also. What more ungodly sacrilege, or manstealing can there be, than to purloin from godly ministers the firstborn of their fervent prayers, and faithful preaching, the leaven of their flocks, the encouragement of their souls, the crown of their labors, and their epistle to Heaven? If men will needs gather churches out of the world (as they phrase it) let them first plow the world, and sow it, and reap it with their own hands, and then the Lord give them a liberal harvest. He is a very hard man that will reap where he has not sown, and gather where he has not strewed, Mt. 24:25. We have no precedent in the whole Book of God to gather up one church out of the cream and quintessence of many churches, as a reverend divine of ours has well observed. (Mr. [Thomas] Blake, On the Covenant, ch. 42 [p. 288]. in ••ne. V. The [Westminster] Assembly’s Answer to the Dissenting Brethren, p. 61 at the end [p. 22 in the link])</p></blockquote>

<div class="actions"><button class="copy" data-copy="“18. They separate themselves from the true Churches of Christ. The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another? This schism grows into a heresy, as a serpent grows to be a dragon. This tolerated, will ruin families, tearing them all to pieces, while the husband goes to one Church, the wife to another, the son to a third, the daughter to a fourth, and the servant to an ale-house instead of a Church. This opens a gap to abundance of profaneness, when there shall be no cohabitation, but the Church members shall be scattered up and down, some twenty, some thirty, some sixty, some one hundred miles off; who shall have the inspection, teaching and guidance of these? Master [Jeremiah] Burroughs’s argument (Irenicum, ch. 23) for gathering of churches (in my judgment) is very dilute and weak; ’tis this: Because our divines hold it lawful to gather churches out of the Church of Rome: therefore ’tis lawful to gather churches out of the Church of England, q.d. because ’tis lawful to separate from a whore, therefore, we ought to separate from an honest woman also. What more ungodly sacrilege, or manstealing can there be, than to purloin from godly ministers the firstborn of their fervent prayers, and faithful preaching, the leaven of their flocks, the encouragement of their souls, the crown of their labors, and their epistle to Heaven? If men will needs gather churches out of the world (as they phrase it) let them first plow the world, and sow it, and reap it with their own hands, and then the Lord give them a liberal harvest. He is a very hard man that will reap where he has not sown, and gather where he has not strewed, Mt. 24:25. We have no precedent in the whole Book of God to gather up one church out of the cream and quintessence of many churches, as a reverend divine of ours has well observed. (Mr. [Thomas] Blake, On the Covenant, ch. 42 [p. 288]. in ••ne. V. The [Westminster] Assembly’s Answer to the Dissenting Brethren, p. 61 at the end [p. 22 in the link])”

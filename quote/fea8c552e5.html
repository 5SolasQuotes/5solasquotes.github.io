<main class="wrap"><figure class="quote" id="q-fea8c552e5" data-kw="">
<blockquote><p>But if your meaning be, (as I strongly suspect it is) that we must not expect to be owned by Christ, except we give up infants baptism; then, I say, it is the most uncharitable, as well as unwarrantable, and dangerous censure that ever dropt from the pen of a sober Christian. It is certainly your great evil to lay salvation itself on such a point as the proper subject of baptism, and to make it articulus stantis vel cadentis religionis [the article of the standing or falling of the church], the very basis on which the whole Christian religion, audits professors salvation must stand. I hope the rest of your brethren are more charitable than yourself; but however it be, I do openly profess, that I ever have, and still do own you, and many more of your persuasion, for my brethren in Christ, and am persuaded Christ will own you too, notwithstanding your many errors and mistakes about the lesser and lower matters of religion. Nor need your censure much to affect us, as long as we are satisfied you have neither a faculty nor commission thus solemnly to pronounce it upon us. But what is the condition upon which this dreadful sentence depends? why, it is our attendance or non-attendance to the primitive purity of the gospel-doctrine. Sir, I hope we do attend it, and, in some respects, better than some great pretenders to primitive purity, who have cast off not only the initiating sign of God’s covenant, (this did not Abraham) but also that most comfortable and ancient ordinance of singing Psalms: and what other primitive ordinance of God may be cashiered next, who can tell? We have a witness in our bosom, that the defence of Christ’s pure worship and institution hath cost us something; and as for me, were I convinced by all that you have here said, or any of your friends, that in baptizing the infants of believers, we did really depart from the primitive purity, I would renounce it, and turn Anabaptist the same day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Reverend John Flavel</cite>, vol. 6 (London; Edinburgh; Dublin: W. Baynes and Son; Waugh and Innes; M. Keene, 1820), 328.</span></figcaption>

</figure><figure class="quote" id="q-747d987750" data-kw="">
<blockquote><p>Peter also says that “baptism also doth now save us” (1 Peter 3:21). For he did not mean to intimate that our ablution and salvation are perfected by water, or that water possesses in itself the virtue of purifying, regenerating, and renewing; nor does he mean that it is the cause of salvation, but only that the knowledge and certainty of such gifts are perceived in this sacrament. This the words themselves evidently show. For Paul connects together the word of life and baptism of water, as if he had said, by the gospel the message of our ablution and sanctification is announced; by baptism this message is sealed. And Peter immediately subjoins, that that baptism is “not the putting away of the filth of the flesh, but the answer of a good conscience toward God, which is of faith.” Nay, the only purification which baptism promises is by means of the sprinkling of the blood of Christ, who is figured by water from the resemblance to cleansing and washing. Who, then, can say that we are cleansed by that water which certainly attests that the blood of Christ is our true and only laver?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.2</span></figcaption>

</figure><figure class="quote" id="q-d42412a951" data-kw="baptism of heretics">
<blockquote><p>What has been said in general of the baptism of heretics ought to be applied in particular to the baptism of the Romanists. Although we think it ought to be retained in those who come from them to us because the essentials of baptism remain with them; still we deny that it can rightly be sought or received from them, as will be proved more fully when we come to that subject. Sixteenth Question Was John’s baptism essentially the same as Christ’s baptism? We affirm against the Romanists I. Although this question appears to be less necessary in our day, when no one is baptized except with that baptism which the apostles administered; yet because it is wont to be fiercely agitated by the Romanists, we must speak briefly concerning it, in order that the truth of the orthodox doctrine concerning baptism may be the better illustrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19</span></figcaption>

<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are: 1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause. 2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism. 3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Question 2, ‘Whether or no children be received into the visible Church by Baptism’ in The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5, pp. 210-20</span></figcaption>

<main class="wrap"><figure class="quote" id="q-59aa811627" data-kw="">
<blockquote><p>The human nature of Christ being thus formed in the womb by a creating act of the Holy Spirit, was in the instant of its conception sanctified, and filled with grace according to the measure of its receptivity… And this work of sanctification, or the original infusion of all grace into the human nature of Christ, was the immediate work of the Holy Spirit; which was necessary unto Him: for let the natural faculties of the soul, the mind, will, and affections, be created pure, innocent, undefiled,— as they cannot be otherwise immediately created of God,— yet there is not enough to enable any rational creature to live to God; much less was it all that was in Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3, ch. 4, p.168</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2e7b1723a" data-kw="">
<blockquote><p>(4) The formation of the foetus in the Virgin’s womb had its stages and processes, as is usual in the formation of other foetuses and which are usually completed in the space of 9 months. It was right that Christ should be made like us in this too, namely in not being formed and born in a moment, but being completed in a matrix suited to the order and processes of nature, the operation of the H. Spirit thus accommodating its process of quickening. (5) The union of the divine nature with the human began the moment the formation of the human nature was completed, so that it would be said to have been composed of human matter and form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics, Person of Christ</cite>, section 12, p. 425</span></figcaption>

</figure><figure class="quote" id="q-8d9a53e58c" data-kw="">
<blockquote><p>Concerning the original of the soul, diverse men have diversly thought… There are three opinions touching this question: The first of those who affirm the traduction of the soul by generation, some of which so affirm because they judged it a corporeal substance, as did Tertullian. Others because they believed that one spirit might as easily proceed from another, as one fire or light be kindled by another: as Apollinarius, Nemesi•…, and diverse in the Western Churches, as St. Jerome witnesses. The second, of those who deny the natural traduction, and say that the soul is •…ion infused into bodies, organized and predisposed to receive them; of which opinion among the ancients were St. Jerome, Hilary, Ambrose, Lactantius, Theodoret, Aeneas Gaz•…us, and of the modern writers, the major part. The third is of those who do haesitare, stick between both, and dare affirme nothing certain on either side, which is the moderation of St. Augustine and Gregory the great, who affirm that this is a question incomprehensible, and unsolvable in this life. Now the only reason which caused St. Austin herein to hesitate, seems to have been the difficulty of traducing original sin from the parents to the children. For says he (writing unto St. Jerome touching the creation of the soul), ‘If this opinion do not oppugne that most fundamental faith of original sin, let it then be mine; but if it do oppugne it, let it not be thine.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Passions &amp; Faculties of the Soul of Man</cite>, (London, 1640), ch. 32, pp. 391-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

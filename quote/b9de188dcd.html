<main class="wrap"><figure class="quote" id="q-b9de188dcd" data-kw="">
<blockquote><p>For I admit not the distinction laid down by otherwise learned and pious men, that good works merit the favors which are conferred upon us in this life, whereas eternal life is the reward of faith only. … Therefore, every help to salvation bestowed upon believers, and blessedness itself, are entirely the gift of God, and yet in both the Lord testifies that he takes account of works, since to manifest the greatness of his love toward us, he thus highly honors not ourselves only, but the gifts, which he has bestowed upon us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83223a61ea" data-kw="">
<blockquote><p>There is nothing in the term reward to justify the inference that our works are the cause of salvation. First, let it be a fixed principle in our hearts, that the kingdom of heaven is not the hire of servants, but the inheritance of sons (Eph. 1:18); an inheritance obtained by those only whom the Lord has adopted as sons, and obtained for no other cause than this adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>
<div class="actions"><button class="copy" data-copy="“There is nothing in the term reward to justify the inference that our works are the cause of salvation. First, let it be a fixed principle in our hearts, that the kingdom of heaven is not the hire of servants, but the inheritance of sons (Eph. 1:18); an inheritance obtained by those only whom the Lord has adopted as sons, and obtained for no other cause than this adoption.”

</figure><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

</figure><figure class="quote" id="q-1d5aa59359" data-kw="">
<blockquote><p>There remains the last question, whether God rewards good works out of mere liberality beyond what is condign. For the common opinion of theologians constantly affirms this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.19 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-26878d10ee" data-kw="">
<blockquote><p>There follows the other part of the disputation on merit, in which we must discuss “what and how many conditions are necessary for a work to be called truly and properly meritorious of eternal happiness.” … Seven conditions in all seem to be required, three of which are granted by all, while the other four are in controversy. The first condition is that it be a good work. For evil works do indeed merit, but punishment, not reward. … The second condition is that the good work be done in obedience to God. For merit implies a relation to a reward to be received from another; hence he who merits, merits with someone. The third, that he who merits be a wayfarer. For in this life is the race and the battle; in the next, the prize and the crown. … The fourth, that the work be not only good but also free. The fifth, that he who merits be a friend of God and pleasing to him. The sixth, that a promise intervene. The seventh, that the work proceed from the virtue of charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.10 (translated from the Latin)</span></figcaption>

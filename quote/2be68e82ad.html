<main class="wrap"><figure class="quote" id="q-2be68e82ad" data-kw="">
<blockquote><p>…we recognize that our soul, formed according to the image of God, is of a spiritual, simple, invisible, and immortal nature, one endowed with intellect, will, and free choice (all of which without doubt denote perfection)…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aa1282cf42" data-kw="">
<blockquote><p>We are immediately conscious that we are free agents. The validity of this witness as regard our volitions themselves seems to be of the same weight and certitude that we have of our own cognition. Hence we are certain that something at least is contingent, namely our willing. To the extent that we can prove other actions or effects of this sort to be truly under the command or our will, to that extent is the existence of other contingent beings proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Wolter was a Scotist. | ‘On the Existence of Contingent Being’, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“We are immediately conscious that we are free agents. The validity of this witness as regard our volitions themselves seems to be of the same weight and certitude that we have of our own cognition. Hence we are certain that something at least is contingent, namely our willing. To the extent that we can prove other actions or effects of this sort to be truly under the command or our will, to that extent is the existence of other contingent beings proved.”

</figure><figure class="quote" id="q-91d458e168" data-kw="">
<blockquote><p>Be it so that God rewards the right use of natural things with an increase of natural goods, but not with the collation of supernatural ones. For this would be “to cross over into another kind” (metabainein eis to allo genos). For it is as if someone said that God promised good health to one who makes good use of honors. It is certain that the natural does not have an order of causality to the supernatural, because they are distant by a whole kind; nor can the seed of nature ever rise into the fruit of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-b0cb39299d" data-kw="">
<blockquote><p>(c) Nor is a thing necessary properly speaking unless it is produced from a necessary proximate cause, that is, such a cause that is determined by its own nature to such an effect; however, the decree of reprobation does not imply such a cause, although it does imply a certain and indeclinable futurity, which is as different from necessity as heaven from earth. [It is objected] (2) That this reprobation makes God the author of all sin, inasmuch as it predestined and necessitates the sinner to sinning. I respond: (a) It does not make it that the sinner sins necessarily, or that he does so determined by his own nature to sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3; ch. 4, section 11, Objections, p. 88</span></figcaption>

</figure><figure class="quote" id="q-8b52c7c702" data-kw="">
<blockquote><p>74. From this is plain how there is freedom in the will. For I am said ‘to see freely’ because I can freely use the visual power for seeing; so in the matter at hand, however much any cause be natural and always uniformly acting (as far as is on its own part), yet because it does not determine nor necessitate the will to willing, but the will of its own liberty can concur with it for willing or not willing and so can freely use it, therefore is it said that ‘to will and to refuse freely’ is in our power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 25th Distinction, Question: ‘Whether an act of will is caused in the will by the object moving it, or by the will moving itself’ in Ordinatio, bk. 2, dist. 15-25 tr. Peter Simpson (2025), pp. 58-71, p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“74. From this is plain how there is freedom in the will. For I am said ‘to see freely’ because I can freely use the visual power for seeing; so in the matter at hand, however much any cause be natural and always uniformly acting (as far as is on its own part), yet because it does not determine nor necessitate the will to willing, but the will of its own liberty can concur with it for willing or not willing and so can freely use it, therefore is it said that ‘to will and to refuse freely’ is in our power.”

<main class="wrap"><figure class="quote" id="q-726c721d31" data-kw="">
<blockquote><p>And although to all the apostles, after His resurrection, He gives an equal power, and says, As the Father has sent me, even so send I you: Receive the Holy Ghost: Whose soever sins you remit, they shall be remitted unto him; and whose soever sins you retain, they shall be retained; yet, that He might set forth unity, He arranged by His authority the origin of that unity, as beginning from one. Assuredly the rest of the apostles were also the same as was Peter, endowed with a like partnership both of honour and power; but the beginning proceeds from unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Unity of the Church</cite>, §4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc182cff5f" data-kw="Keys Peter">
<blockquote><p>Secondly, That authority of the keys was not committed to Peter alone, but to the rest of the apostles also. For in this place he did not give the keys, but only promised that he would give them: but afterwards, when he actually gives them (Matthew 28:18, 19; John 20:21, 22, 23), he addresses all the apostles equally. Therefore, if the pope have the authority of interpreting the scriptures, because the keys were given to Peter, then also other bishops and ministers, who were successors of the rest of the apostles, received the same authority, because the keys were given to the rest of the apostles as well as to Peter. Thirdly, Augustine says in his 124th Tractate upon John, as in many other places, that “Peter signified the universal church,” when the keys were given to him: therefore this power of the keys was given not to the pope alone, but to the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-2fb22158c4" data-kw="">
<blockquote><p>For petra (rock) is not derived from Peter, but Peter from petra; just as Christ is not called so from the Christian, but the Christian from Christ. For on this very account the Lord said, On this rock will I build my Church, because Peter had said, You are the Christ, the Son of the living God. On this rock, therefore, He said, which you have confessed, I will build my Church. For the Rock (Petra) was Christ; and on this foundation was Peter himself also built. For other foundation can no man lay than that is laid, which is Christ Jesus. The Church, therefore, which is founded in Christ received from Him the keys of the kingdom of heaven in the person of Peter, that is to say, the power of binding and loosing sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tractates on the Gospel of John</cite>, tract. 124, §5</span></figcaption>

</figure><figure class="quote" id="q-dd6fbda734" data-kw="">
<blockquote><p>It is not the case that there is one church at Rome and another in all the world beside. Gaul and Britain, Africa and Persia, India and the East worship one Christ and observe one rule of truth. If you ask for authority, the world outweighs its capital. Wherever there is a bishop, whether it be at Rome or at Engubium, whether it be at Constantinople or at Rhegium, whether it be at Alexandria or at Zoan, his dignity is one and his priesthood is one. Neither the command of wealth nor the lowliness of poverty makes him more a bishop or less a bishop. All alike are successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>

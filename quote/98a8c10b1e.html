<main class="wrap"><figure class="quote" id="q-98a8c10b1e" data-kw="">
<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, (1619), pp. 33-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffa696fb07" data-kw="">
<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>

<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>

</figure><figure class="quote" id="q-13496562b0" data-kw="">
<blockquote><p>In 1650 many ministers in the episcopal Church of England were presbyterian in outlook and sought for reform unto this end. While some progress had been made following the Westminster Assembly, the work was still very incomplete. Oliver Cromwell, the self appointed ‘Protector’ of England, arose to civil power at this time; he was an Independent as far as Church government. Hence, Independent churches were arising all around, sometimes with presbyterian ministers. The Church of England’s theology was Erastian. It did not have local church membership as we do, nor allowed for ruling elders in the churches, nor for the ecclesiastical ministry to have the right of excommunication from the Lord’s Supper. These conditions made it difficult, if at all possible, for ministers to have adequate oversight of their parish, and to adequately bar (beyond verbal warnings) scandalous, professing Christians from disgracing the Lord’s Supper. In Independent churches without ruling elders, especially in large congregations, the conditions were similar. A minister, under regular order, does not have, nor should have, of himself, the power of jurisdiction to bar persons from the Lord’s Supper. Hence, among conscientious presbyterian ministers in these situations, there was a very real question of whether they should administer the Lord’s Supper at all, especially in light of their obligation to maintain the integrity of the Supper and their attendant responsibility, in some respect, to keep persons from scandalously abusing it. Many ministers had determined in the negative, at least for the time, till further presbyterian reform could be made. Such systematic reform never occured thereafter. Henry Jeanes (1611–1662) was an English presbyterian minister that had administered the Supper, with certain qualifications, in such conditions. A group of presbyterian ministers hence asked him to write out his reasons for this, in the hopes that he might be able to shed more light on the question for them. The article above is Jeanes’s answer. It is excellent. He gives the same answer as Thomas Cartwright, an earlier father of presbyterianism (as seen here). Answering the question stated in the title of the article, of whether the Supper may be administered without ruling elders or a presbyterian church government, is quite simple: At the end of Acts 2, the apostles, who were ministers, administered the Supper to the large and growing Church in Jerusalem from house to house. Commentators, presbyterian included, nearly universally agree that they had no ruling elders, or sessions, or presbyteries. Why an affirmative answer to the question is right, though, is a much trickier thing to explicate. And this is the primary value of the article: It clearly, carefully and in a balanced fashion, according to right, detailed, classic presbyterian principles shows how these things consist with each other in their right relations, this giving us an exponentially greater understanding of the Lord’s things. See especially pp. 30-32 &amp; 34 that the Lord’s Supper is more (1) properly and immediately worship, and (2) life-giving, and is therefore of greater import and necessity than having an eldership and exercising a negative discipline so as to exclude the scandalous beyond the verbal guarding of the Table by the minister. A modern application of the question today is: Whether a minister, persuaded that weekly communion is too frequent for the adequate self-preparation of the people, in how it actually plays out, and for the elders to maintain adequate circumspection of the people’s right partaking of the Supper, and yet this church practice is not going to be reformed anytime soon, whether that minister may yet in good conscience administer the Supper in these conditions for the time? The principles discussed in the article would appear to be for the affirmative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regarding a minister administering the Lord’s Supper with a deficient frequency</cite>, Contextual notes on the work of Henry Jeanes, The Want [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“In 1650 many ministers in the episcopal Church of England were presbyterian in outlook and sought for reform unto this end. While some progress had been made following the Westminster Assembly, the work was still very incomplete. Oliver Cromwell, the self appointed ‘Protector’ of England, arose to civil power at this time; he was an Independent as far as Church government. Hence, Independent churches were arising all around, sometimes with presbyterian ministers. The Church of England’s theology was Erastian. It did not have local church membership as we do, nor allowed for ruling elders in the churches, nor for the ecclesiastical ministry to have the right of excommunication from the Lord’s Supper. These conditions made it difficult, if at all possible, for ministers to have adequate oversight of their parish, and to adequately bar (beyond verbal warnings) scandalous, professing Christians from disgracing the Lord’s Supper. In Independent churches without ruling elders, especially in large congregations, the conditions were similar. A minister, under regular order, does not have, nor should have, of himself, the power of jurisdiction to bar persons from the Lord’s Supper. Hence, among conscientious presbyterian ministers in these situations, there was a very real question of whether they should administer the Lord’s Supper at all, especially in light of their obligation to maintain the integrity of the Supper and their attendant responsibility, in some respect, to keep persons from scandalously abusing it. Many ministers had determined in the negative, at least for the time, till further presbyterian reform could be made. Such systematic reform never occured thereafter. Henry Jeanes (1611–1662) was an English presbyterian minister that had administered the Supper, with certain qualifications, in such conditions. A group of presbyterian ministers hence asked him to write out his reasons for this, in the hopes tha — Travis Fentiman, Regarding a minister administering the Lord’s Supper with a deficient frequency: | Contextual notes on the work of Henry Jeanes, The Want [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+1650+many+ministers+in+the+episcopal+Church+of+England+were+presbyterian+in+outlook+and+sought+for+reform+unto+this+end.+While+some+progress+had+been+made+following+the+Westminster+Assembly%2C+the+work+was+still+very+incomplete.+Oliver+Cromwell%2C+the+self+appointed+%E2%80%98Protector%E2%80%99+of+England%2C+arose+to+civil+power+at+this+time%3B+he+was+an+Independent+as+far+as+Church+government.+Hence%2C+Independent+churches+were+arising+all+around%2C+sometimes+with+presbyterian+ministers.+The+Church+of+England%E2%80%99s+theology+was+Erastian.+It+did+not+have+local+church+membership+as+we+do%2C+nor+allowed+for+ruling+elders+in+the+churches%2C+nor+for+the+ecclesiastical+ministry+to+have+the+right+of+excommunication+from+the+Lord%E2%80%99s+Supper.+These+conditions+made+it+difficult%2C+if+at+all+possible%2C+for+ministers+to+have+adequate+oversight+of+their+parish%2C+and+to+adequately+bar+%28beyond+verbal+warnings%29+scandalous%2C+professing+Christians+from+disgracing+the+Lord%E2%80%99s+Supper.+In+Independent+churches+without+ruling+elders%2C+especially+in+large+congregations%2C+the+conditions+were+similar.+A+minister%2C+under+regular+order%2C+does+not+have%2C+nor+should+have%2C+of+himself%2C+the+power+of+jurisdiction+to+bar+persons+from+the+Lord%E2%80%99s+Supper.+Hence%2C+among+conscientious+presbyterian+ministers+in+these+situations%2C+there+was+a+very+real+question+of+whether+they+should+administer+the+Lord%E2%80%99s+Supper+at+all%2C+especially+in+light+of+their+obligation+to+maintain+the+integrity+of+the+Supper+and+their+attendant+responsibility%2C+in+some+respect%2C+to+keep+persons+from+scandalously+abusing+it.+Many+ministers+had+determined+in+the+negative%2C+at+least+for+the+time%2C+till+further+presbyterian+reform+could+be+made.+Such+systematic+reform+never+occured+thereafter.+Henry+Jeanes+%281611%E2%80%931662%29+was+an+English+presbyterian+minister+that+had+administered+the+Supper%2C+with+certain+qualifications%2C+in+such+conditions.+A+group+of+presbyterian+ministers+hence+asked+him+to+write+out+his+reasons+for+this%2C+in+the+hopes+that+he+might+be+able+to+shed+more+light+on+the+question+for+them.+The+article+above+is+Jeanes%E2%80%99s+answer.+It+is+excellent.+He+gives+the+same+answer+as+Thomas+Cartwright%2C+an+earlier+father+of+presbyterianism+%28as+seen+here%29.+Answering+the+question+stated+in+the+title+of+the+article%2C+of+whether+the+Supper+may+be+administered+without+ruling+elders+or+a+presbyterian+church+government%2C+is+quite+simple%3A+At+the+end+of+Acts+2%2C+the+apostles%2C+who+were+ministers%2C+administered+the+Supper+to+the+large+and+growing+Church+in+Jerusalem+from+house+to+house.+Commentators%2C+presbyterian+included%2C+nearly+universally+agree+that+they+had+no+ruling+elders%2C+or+sessions%2C+or+presbyteries.+Why+an+affirmative+answer+to+the+question+is+right%2C+though%2C+is+a+much+trickier+thing+to+explicate.+And+this+is+the+primary+value+of+the+article%3A+It+clearly%2C+carefully+and+in+a+balanced+fashion%2C+according+to+right%2C+detailed%2C+classic+presbyterian+principles+shows+how+these+things+consist+with+each+other+in+their+right+relations%2C+this+giving+us+an+exponentially+greater+understanding+of+the+Lord%E2%80%99s+things.+See+especially+pp.+30-32+%26+34+that+the+Lord%E2%80%99s+Supper+is+more+%281%29+properly+and+immediately+worship%2C+and+%282%29+life-giving%2C+and+is+therefore+of+greater+import+and+necessity+than+having+an+eldership+and+exercising+a+negative+discipline+so+as+to+exclude+the+scandalous+beyond+the+verbal+guarding+of+the+Table+by+the+minister.+A+modern+application+of+the+question+today+is%3A+Whether+a+minister%2C+persuaded+that+weekly+communion+is+too+frequen

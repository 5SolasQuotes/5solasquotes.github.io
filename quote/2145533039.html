<blockquote><p>[1] If you interpret it of his divine love, the difficulty will not be great; for there is a general and common love, and a special love. With the first, God loves all his creatures, especially mankind, and amongst them those that have any strictures of his image in them more than others. But then there is a special love, and so all those are saved whom God thus loves…. Now this will easily solve the matter; there was a general love, or a liking and approbation of those moral virtues and good things which He saw in him [the rich young ruler], but not that special love which brings grace and salvation along with it.</p></blockquote>

</figure><figure class="quote" id="q-f3d1a654ef" data-kw="">
<blockquote><p>4…. but the conscience is more dull in apprehending that spiritual vengeance follows such spiritual sins as unbelief, because until there be some supernatural revelation, we are dead to the Gospel truths, and Gospel sins, but when a common grace heightens the soul to a supernatural assent, that Christ is a Teacher sent of God (Jn. 7:28; Jn. 3:2), the conviction is more strong: But because it is more supernatural, and in stead of kindly affection of love which it wants [lacks], it is mixed with hatred and anger and so degenerates into fiery indignation against the Holy Ghost, as Jn. 15:24 compared with Mt.12:15; 26:31 clears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, 1655, p. 70</span></figcaption>

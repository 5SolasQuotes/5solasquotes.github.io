<main class="wrap"><figure class="quote" id="q-dab7e8e370" data-kw="">
<blockquote><p>[T]he difference of the Law and Gospel lieth not in this, (as some do assign) that one is the instrument of grace, and the other not; (for God useth both, as I shall shew) but in this, that the holiness wrought in us by preaching of the Word of God, whether it be Law or gospel, doth not justify us; but this favour is an evangelical manner, by forgiving whatsoever is irregular in us, and communicating Christ his righteousness to us. Therefore let us not confound the Law, or Gospel, nor yet make them so contrary in their natures and effects, that where one is, the other cannot be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 196.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a92afb0f99" data-kw="">
<blockquote><p>Although it is in connection with certain discussions which have lately taken place among us regarding the Sabbath, the mode of its observance, and the grounds of its obligation, that the present course of lectures has originated, it is well to bear in mind that the Sabbath question, properly, is but one branch of a much wider question, involving many other truths, all-important, which it is the design of these lectures to illustrate and defend.

Whether God has given to man, in the Scriptures of the Old and New Testaments, a revelation of His will, which is the only infallible rule of faith and practice; whether that revelation contains, in any proper sense, a law for all men and for all times; and whether the Decalogue, as given from Sinai, and as interpreted and confirmed by our Lord, is to be regarded as a comprehensive summary of that law, still binding therefore as the rule of the Christian’s life; — such are some of the great questions at issue in the present controversy. And they are questions concerning which our opinions will necessarily, to a large extent, be modified by the views which we adopt as to the origin and obligation of the Christian’s day of weekly rest and worship.

For this reason, as well as on account of the acknowledged importance and value of the institution itself, whether considered from a religious, moral, or social point of view, the subject is one well worthy of our best attention. If a man’s way of keeping the Sabbath may be taken as a good index of his Christian character, a criterion of steadfastness or decline in personal religion — and this is on all hands confessed — by a religious teacher’s doctrine concerning the Sabbath, we may judge as to his general soundness in the faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath; The Grounds of its Obligation, and its Proper Place in Relation to Christian Life and Duty in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

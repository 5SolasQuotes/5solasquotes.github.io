<main class="wrap"><figure class="quote" id="q-ba6bacd2b4" data-kw="">
<blockquote><p>I suppose, we are agreed: 1. That God’s will is nothing but his essence denominated with respect to some good as its object. 2. And there was no object really existent from eternity but God Himself. 3. That understanding and will are not univocal terms spoken of God and of man, nor of the same formal conception. And 4. That our formal conception of understanding and will is only of them as they are in man, and not as in God; and so this to us is the prius significatum [the first signification]. 5. And therefore that God does not understand or will in our sense formaliter [formally], but only eminenter [eminently]. 6. And lastly, that mortals know not just how God’s eminent intellection and volition differ from the formal in man. All this you must grant me, or be singular and ignorant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination</cite>, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6df0d8e330" data-kw="">
<blockquote><p>1) A thing is possible because God is able to produce it. It is not, conversely, because it is possible that God is able to produce it. This is proved by God’s priority and independence. 2) Intrinsic possibility is not prior in nature to extrinsic possibility, nor is it the cause of the latter. On the contrary, since a thing can possibly be made by the truly and infinitely powerful God Himself, the source of all being, for that reason [the thing] is also intrinsically possible because the essence of God is the root and rule of all truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/melchior-leydekker.html">Melchior Leydekker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fax veritatis seu exercitationes ad nonnullas controversias quae hodie in Blegio… (Leiden: Gaesbeeck &amp; Lopex, 1677), pp. 242-46 tr. Aza Goudriaan, ch. 8, ‘Samuel Rutherford on the Divine Origin of Possibility’ in ed. Aaron C. Denlinger – Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, p. 154 Leydekker followed Rutherford on the subject.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3906a14668" data-kw="foreknowledge contingents">
<blockquote><p>Do all things fall under the knowledge of God, both singulars and future contingencies? We affirm against Socinus. He knows all things perfectly, undividedly, distinctly and immutably. Perfectly because he knows all things by himself or by his essence. Undividedly, because he knows all things intuitively and noetically, not discursively and dianoetically.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.12.1–2</span></figcaption>

</figure><figure class="quote" id="q-5605f5b4f9" data-kw="">
<blockquote><p>O you who are the framer of the lands and sky, who bid time to go forth from eternity, and, remaining stable, give all things to be moved; whom no external causes compelled to fashion the work of fluctuating matter, but the form of the highest good, inherent and without envy. You draw all things from a supernal example, yourself most beautiful, bearing a beautiful world in your mind, and forming it in a similar image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin | For just as an artisan acting outside himself looks at some exemplar, according to which he operates, and which he expresses in his work, conformably to that which is read in Ex. 25:40; Heb. 8:5, “Look that you make them after their pattern, which was showed you in the mount”: so God, beholding his own essence, the exemplar and fount of all perfections, and beholding the ideas or reasons of all things, expresses them as He pleases; which Boethius, On the Consolation of Philosophy, 3, metro 9, elegantly explains, saying:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-e53b90bc25" data-kw="">
<blockquote><p>But this negative will in God is nothing other than that act of the will by which, most perfectly willing himself, he is averse to everything adverse to him and to his glory, which is the only end of all things… He does this so thoroughly, that by most perfectly willing his own goodness, he is also most perfectly averse to whatever is adverse to him… Thus, God’s negative will is occupied with what is evil in its own nature, not only because it is adverse to the norm of acting set before it by God, but also [insofar as it has not been decreed] because it could not be directed by the power of the creatures to a truly good end… Even if an evil does not exist, or never will, God is still adverse to it, as it is inimical to his nature, since he would abolish and destroy it if it existed, just as he loves a good that will never exist, because, as it is congruent to his own goodness, if it existed he would conserve it, cherish it, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 2, bk. 2, ch. 15, section 17</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

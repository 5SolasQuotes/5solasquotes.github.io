<main class="wrap"><figure class="quote" id="q-9fbcbe7a9b" data-kw="">
<blockquote><p>Paul made himself a servant unto all, that he might gain the more, though he was free from all men (1 Cor. 9:19). They submitted themselves to all the injuries and affronts of men; to be accounted the plagues and troublers of the world, and as the scorn and off-scouring of all things, and a gazing stock to Angels and to men (1 Cor. 4:12-15; Acts 24:5). And are you better than they? If you are, you are more humble, and not more proud.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 248</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>And albeit the vocation of a pastor, his commission and instructions relating thereto, be all of a spiritual nature, and of divine original, yet their persons, estates and behavior, considered in a civil capacity, are, according to Scripture and reason, subject to the civil government.</p></blockquote>

</figure><figure class="quote" id="q-612767d253" data-kw="">
<blockquote><p>It is their [the magistrates’] duty therefore to remove all such things for which, as is before showed, the Lord sends the pestilence and other grievous diseases; they must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9): for it is greatly to be feared that there be many which never consider what are, or may be, the causes of any calamity, nor seek any means how to pacify God. The magistrates also at such times must make good laws and see them faithfully executed. They must remove all disorders whereby God has been offended, they must punish and suppress the wicked which are indeed the very botches and sores, and contagion of the commonwealth. They must as David speaks of himself ‘destroy betimes all the workers of iniquity, and cut off the wicked from the city of the Lord’ (Ps. 101:8). They must also have a diligent care to remove such things which impoverish the country, as wicked gaming, luxuriousness in meat, drink and apparel, and such like. Such [consuming] caterpillars must be looked unto before all be consumed, for then it will be too late to spare when such devourers have swallowed up all after such manner, and then must men be put to many very wicked shifts to maintain their [immoral] bravery and to feed their greedy paunch, whereof we have lamentable experience at this day. For what is the cause of such robbing and spoiling both by land and sea, and of such horrible oppression and extortion everywhere but only this, that men having been long acquainted with bravery and dainty morsels, can hardly forego it, they had rather put a thousand wicked shifts in practice, yea they had rather hazard their lives everyday than that they would abate anything of their stately port, which under a show of wealth and great substance (although but being beggars indeed) they have long maintained, and from hence has sprung all kind[s] of cousonage and devilish deceit, whereby men overreach one another daily in their bargains and contracts. In times past they had good laws, even among the heathen people, to bridle all idle expenses and such as lavished their goods willfully. It were to be wished that such laws were now in use to take away the wonderful prodigality of this time. Usurers also, brokers, badgers and hucksters, and such like locusts that eat up the poor and cause the markets to be inhaunted [infrequented] should be bridled to the end [that] the poor may have things better cheap, and to the end [that] magistrates may perform these things and all other duties that belong unto them in time of war, pestilence and famine. … …The common treasure of cities also must sometimes serve for the relieving of the poor, which thing has been done in many famous cities, etc., it were far better that it should be so employed, than as it is many times upon feasting and vain shows… These things, therefore, if magistrates carefully perform, they shall offer an acceptable sacrifice to God, as David did at this time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cupper.html">William Cupper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 341-47 of Sermon 10 in Certain Sermons Concerning God’s Late Visitation in the City of London and other parts of the land, teaching all men to make use thereof, that mean to profit by God’s fatherly chastisements… (London, 1592)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is their [the magistrates’] duty therefore to remove all such things for which, as is before showed, the Lord sends the pestilence and other grievous diseases; they must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9): for it is greatly to be feared that there be many which never consider what are, or may be, the causes of any calamity, nor seek any means how to pacify God. The magistrates also at such times must make good laws and see them faithfully executed. They must remove all disorders whereby God has been offended, they must punish and suppress the wicked which are indeed the very botches and sores, and contagion of the commonwealth. They must as David speaks of himself ‘destroy betimes all the workers of iniquity, and cut off the wicked from the city of the Lord’ (Ps. 101:8). They must also have a diligent care to remove such things which impoverish the country, as wicked gaming, luxuriousness in meat, drink and apparel, and such like. Such [consuming] caterpillars must be looked unto before all be consumed, for then it will be too late to spare when such devourers have swallowed up all after such manner, and then must men be put to many very wicked shifts to maintain their [immoral] bravery and to feed their greedy paunch, whereof we have lamentable experience at this day. For what is the cause of such robbing and spoiling both by land and sea, and of such horrible oppression and extortion everywhere but only this, that men having been long acquainted with bravery and dainty morsels, can hardly forego it, they had rather put a thousand wicked shifts in practice, yea they had rather hazard their lives everyday than that they would abate anything of their stately port, which under a show of wealth and great substance (although but being beggars indeed) they have long maintained, and from hence has sprung all kind[s] of cousonage and devilish deceit, whereby men overreach one another daily in their bargains and contracts. In times past they had good laws, even among the heathen people, to bridle all idle expenses and such as lavished their goods willfully. It were to be wished that such laws were now in use to take away the wonderful prodigality of this time. Usurers also, brokers, badgers and hucksters, and such like locusts that eat up the poor and cause the markets to be inhaunted [infrequented] should be bridled to the end [that] the poor may have things better cheap, and to the end [that] magistrates may perform these things and all other duties that belong unto them in time of war, pestilence and famine. … …The common treasure of cities also must sometimes serve for the relieving of the poor, which thing has been done in many famous cities, etc., it were far better that it should be so employed, than as it is many times upon feasting and vain shows… These things, therefore, if magistrates carefully perform, they shall offer an acceptable sacrifice to God, as David did at this time.”

— William Cupper, pp. 341-47 of Sermon 10 in Certain Sermons Concerning God’s Late Visitation in the City of London and other parts of the land, teaching all men to make use thereof, that mean to profit by God’s fatherly chastisements… (London, 1592)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+their+%5Bthe+magistrates%E2%80%99%5D+duty+therefore+to+remove+all+such+things+for+which%2C+as+is+before+showed%2C+the+Lord+sends+the+pestilence+and+other+grievous+diseases%3B+they+must+follow+the+example+of+David+in+this+place+who+humbled+himself+before+the+Lord%2C+who+prayed+for+himself+and+for+the+people%2C+and+built+an+altar+and+offered+up+sacrifice%3B+that+is%2C+they+must+maintain+God%E2%80%99s+truth+to+the+uttermost+of+their+power%3B+they+must+set+forward+the+preaching+of+the+Word%3B+they+must+with+good+Hezekiah+and+Josiah+remove+all+idolatry+and+superstition+%282+Kings+18%3A4%3B+23%3A4%29%3B+they+must+also+with+David+labor+to+find+out+the+cause+of+God%E2%80%99s+punishment%2C+and+remove+it+as+he+did+when+famine+was+in+his+land+%282+Sam.+21%3A1%2C9%29%3A+for+it+is+greatly+to+be+feared+that+there+be+many+which+never+consider+what+are%2C+or+may+be%2C+the+causes+of+any+calamity%2C+nor+seek+any+means+how+to+pacify+God.+The+magistrates+also+at+such+times+must+make+good+laws+and+see+them+faithfully+executed.+They+must+remove+all+disorders+whereby+God+has+been+offended%2C+they+must+punish+and+suppress+the+wicked+which+are+indeed+the+very+botches+and+sores%2C+and+contagion+of+the+commonwealth.+They+must+as+David+speaks+of+himself+%E2%80%98destroy+betimes+all+the+workers+of+iniquity%2C+and+cut+off+the+wicked+from+the+city+of+the+Lord%E2%80%99+%28Ps.+101%3A8%29.+They+must+also+have+a+diligent+care+to+remove+such+things+which+impoverish+the+country%2C+as+wicked+gaming%2C+luxuriousness+in+meat%2C+drink+and+apparel%2C+and+such+like.+Such+%5Bconsuming%5D+caterpillars+must+be+looked+unto+before+all+be+consumed%2C+for+then+it+will+be+too+late+to+spare+when+such+devourers+have+swallowed+up+all+after+such+manner%2C+and+then+must+men+be+put+to+many+very+wicked+shifts+to+maintain+their+%5Bimmoral%5D+bravery+and+to+feed+their+greedy+paunch%2C+whereof+we+have+lamentable+experience+at+this+day.+For+what+is+the+cause+of+such+robbing+and+spoiling+both+by+land+and+sea%2C+and+of+such+horrible+oppression+and+extortion+everywhere+but+only+this%2C+that+men+having+been+long+acquainted+with+bravery+and+dainty+morsels%2C+can+hardly+forego+it%2C+they+had+rather+put+a+thousand+wicked+shifts+in+practice%2C+yea+they+had+rather+hazard+their+lives+everyday+than+that+they+would+abate+anything+of+their+stately+port%2C+which+under+a+show+of+wealth+and+great+substance+%28although+but+being+beggars+indeed%29+they+have+long+maintained%2C+and+from+hence+has+sprung+all+kind%5Bs%5D+of+cousonage+and+devilish+deceit%2C+whereby+men+overreach+one+another+daily+in+their+bargains+and+contracts.+In+times+past+they+had+good+laws%2C+even+among+the+heathen+people%2C+to+bridle+all+idle+expenses+and+such+as+lavished+their+goods+willfully.+It+were+to+be+wished+that+such+laws+were+now+in+use+to+take+away+the+wonderful+prodigality+of+this+time.+Usurers+also%2C+brokers%2C+badgers+and+hucksters%2C+and+such+like+locusts+that+eat+up+the+poor+and+cause+the+markets+to+be+inhaunted+%5Binfrequented%5D+should+be+bridled+to+the+end+%5Bthat%5D+the+poor+may+have+things+better+cheap%2C+and+to+the+end+%5Bthat%5D+magistrates+may+perform+these+things+and+all+other+duties+that+belong+unto+them+in+time+of+war%2C+pestilence+and+famine.+%E2%80%A6+%E2%80%A6The+common+treasure+of+cities+also+must+sometimes+serve+for+the+relieving+of+the+poor%2C+which+thing+has+been+done+in+many+famous+cities%2C+etc.%2C+it+were+far+better+that+it+should+be+so+employed%2C+than+as+it+is+many+times+upon+feasting+and+vain+shows%E2%80%A6+These+things%2C+therefore%2C+if+magistrates+carefully+perform%2C+they+shall+offer+an+acceptable+sacrifice+to+God%2C+as+David+did+at+this+time.%E2%80%9D%0A%0A%E2%80%94+William+Cupper%2C+pp.+341-47+of+Sermon+10+in+Certain+Sermons+Concerning+God%E2%80%99s+Late+Visitation+in+the+City+of+London+and+other+parts+of+the+land%2C+teaching+all+men+to+make+use+thereof%2C+that+mean+to+profit+by+God%E2%80%99s+fatherly+chastisements%E2%80%A6+%28London%2C+1592%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F612767d253.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/612767d253.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=It%20is%20their%20%5Bthe%20magistrates%E2%80%99%5D%20duty,as%20David%20did%20at%20this%20time&amp;text=It%20is%20their%20%5Bthe%20magistrates%E2%80%99%5D%20duty%20therefore%20to&amp;text=to%20God%2C%20as%20David%20did%20at%20this%20time" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-59f66e110f" data-kw="">
<blockquote><p>Argument 8. Common sense and nature itself, or natural inclination (so he calls settled custom, and agreeable to nature, in respect to what is comely) dictates that it is unseemly for a woman to pray uncovered, or that a man should wear long hair, and the contrary is decent: Therefore you observe no decorum when you behave yourselves otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(London</cite>, 1659), on 1 Cor. 11, ‘The Seventh Article concerning Order &amp; Decency’ | On vv. 13-15</span></figcaption>

</figure><figure class="quote" id="q-50017bfac3" data-kw="">
<blockquote><p>…namely, forasmuch as the uncovering of the head was then a sign of power and dominion, as on the contrary now at this day those that have power over others will keep their heads covered, and they that are under others will uncover their heads before them. But in all these things, we must always have the respect to the use of divers times and countries, and what is honorable and edifying therein, 1 Cor. 14:40, Phil. 4:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dutch-annotations.html">Dutch Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dutch Annotations</cite>, 1637, on 1 Cor. 11:4</span></figcaption>

</figure><figure class="quote" id="q-98bac284a7" data-kw="">
<blockquote><p>‘with her head uncovered’. It may seem strange from whom the Corinthian women should take up this custom, since the Jewish women were not allowed to go into the streets, or into any open and public place, unveiled (Maimonides, Hilch. Ishot, ch. 24, sect. 12). It was a Jewish law, that they should go out nowhere bare-headed (Babylonian Talmud, Cethubot, fol. 72. 1): yea, it was reckoned scandalous and ignominious to do so. Hence it is said, שגלוי הראש גנאי להם, “that uncovering of the head is a reproach” to the daughters of Israel (Rabbi Solomon Jarchi on Numb. 5:19)… So that there it should seem that these Corinthians followed the examples of the heathens: but then, though it might be the custom of some nations for women to go abroad bare headed; yet at their solemnities, where and when they were admitted, for they were not everywhere and always, they used to attend with their heads veiled and covered (Alex., ab Alex. Genial. Dier., bk. 4, ch. 17)… ‘for that is even all one as if she were shaven’; to be without a veil, or some sort of covering on her head, according to the custom of the country, is the same thing as if her head was shaved;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11</cite>, v. 5</span></figcaption>

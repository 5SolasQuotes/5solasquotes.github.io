<main class="wrap"><figure class="quote" id="q-36e4c46091" data-kw="abrogation justification curse">
<blockquote><p>The question does not concern the use of the law as to justification—whether we are still bound to the law in order to acquire life. Since this is impossible after sin, in this sense it may even be said to have been abrogated: “By the deeds of the law there shall no flesh be justified” (Rom. 3:20) and “As many as are of the works of the law, are under the curse” (Gal. 3:10). Second, the question does not concern its curse because by Christ under this relation it is abrogated with respect to believers: “Christ hath redeemed us from the curse of the law, being made a curse for us” (Gal. 3:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c0ab4d26c" data-kw="priesthood changed Melchizedek">
<blockquote><p>Hence the apostle infers, “The priesthood being changed, there is made of necessity a change also of the law” (Heb. 7:12, 13). “For if,” says he, “perfection were by the Levitical priesthood, what further need was there that another priest should rise after the order of Melchizedek, and not be called after the order of Aaron?” (Heb. 7:11).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-baa8f1dc20" data-kw="">
<blockquote><p>This sin of not coming [to the throne of grace], is committed by delaying to come The call of God is, Let us come; the answer of many hearts is, Let us delay to come. Whence think you that these delays come? We have it daily to bewail before God and you, that a multitude will come together to hear, and do so day by day; yet all that can be said to them, from their childhood to their old age, never prevailed with many of them to spend one hour in serious treating at the throne of grace, with God in Christ, for the eternal salvation of their souls.

It is undeniable, that ye are but a pack of gross hypocrites, if you attend on the means of grace in the assemblies of saints, and yet have no particular personal errand to the throne of grace for your own Souls. The salvation of the soul is not carried on in a crowd. The grace of God must be particularly applied to you, and you must particularly apply it to yourselves, and yourselves to the throne of grace, if ever you be saved.

The fellowship of saints was never ordained for this end, to render personal applications to God needless; and it is grossly abused when it is so perverted. It is impossible, that a person can have any true fellowship with saints in any ordinance of God, unless he hath particular business at the throne of grace for himself. He hath indeed no true religion, whose all of religion is in company and in public.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons Concerning the Throne of Grace</cite>, (1696) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 50-51.</span></figcaption>

<blockquote><p>48. Q. When begins the Lord’s day?

A. In the morning. Act. 20.7.

When Paul came to the Church at Troas, he had a mind to spend a Lord’s day with them, though he was in great haste to depart so soon as he could. He came therefore to their assembly at the time that they came together according to their custom: but he kept them till the end of that day: (for he would not travel on the Lord’s day) and having dismissed the assembly, he departed. Now it is said, that he continued his speech till midnight (Acts 20. 7) even till break of day (ver. 11.) and then departed: which departure of his is said to be on the morrow. By this punctual expression of the time it appears that the first day of the week, the Lord’s day, ended at midnight: and that then the morrow began. Now to make a natural day which consisteth of twenty four hours, it must begin and end at the same time: for the end of one day is the beginning of another. There is not a minute betwixt them. As therefore the Lord’s day ended at midnight, so it must begin at midnight: when we count the morning to begin. Which is yet more evident by this phrase (Mat. 28.1.) In the end of the Sabbath (namely of the week before, which was the former Sabbath) as it began to dawn (namely) on the next day, which was the Lord’s day) or (as Joh. 20.1.) when it was yet dark there came divers to anoint the body of Jesus, but they found him not in the grave: he was risen before: so as Christ rose before the Sun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 24-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Divine revelation takes the dictates of sound reason for granted, and refers to them in such terms of approbation as impose it upon us as a duty to be guided by them in those cases as to which the scriptures are silent, or have merely laid down general rules.

The rites of Christian worship are of divine institution, but there are various external circumstances connected with their observance which are left to the regulation of human prudence exercised with a proper regard to decency and edification; such as the times of assembling, the order in which the several parts of worship shall be celebrated, and the length of the services.

The range of this class of objects is still more extensive in relation to the government and discipline of the church, as to which Divine wisdom saw it fit to be less minute and precise in its prescriptions. Every society, and consequently the church of Christ, the most perfect of societies, must have external bonds of union, rules of management, and, in short, all those means which are necessary to her preservation, or conducive to the ends of her erection.

The essential principles of jurisprudence, which are founded on natural laws, are common to civil and ecclesiastical society; and they dictate the observance of certain forms of process as safeguards to justice, and means of eliciting truth in dubious or controverted cases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Judgment. Delivered at the opening of the Synod of Original Seceders, Edinburgh, September, 1829 in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

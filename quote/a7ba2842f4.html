<blockquote><p>I do not, as Peter and Paul, issue commandments unto you. They were apostles; I am but a condemned man.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b3d2f9abff" data-kw="">
<blockquote><p>2. That private Christians in an extraordinary case, in a Church to be erected or that is decayed and ruined, may sometimes publicly preach the Word of God for the planting a Church when there are not such as by God’s ordinary call have received from God power to preach the Word. For the positive ritual law of God gives place to the moral law of God when necessity requires it. 3. We grant also that private Christians in some special cases, and upon a particular occasion, may sometimes speak the Word of God in public by a special calling from God: as martyrs are called to a public confession of the faith. But all this does not infer that there is an exercise of prophesy constantly and ordinarily to be observed in the Church, whereby the Word should by private Christians in the Name of Christ and with all authority be publicly preached for the edification of the Church. And therefore we maintain the negative of the question proposed, and deny that there is such an exercise to be perpetually retained in the Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, Concerning the Government of the Church of God (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’</cite>, pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. That private Christians in an extraordinary case, in a Church to be erected or that is decayed and ruined, may sometimes publicly preach the Word of God for the planting a Church when there are not such as by God’s ordinary call have received from God power to preach the Word. For the positive ritual law of God gives place to the moral law of God when necessity requires it. 3. We grant also that private Christians in some special cases, and upon a particular occasion, may sometimes speak the Word of God in public by a special calling from God: as martyrs are called to a public confession of the faith. But all this does not infer that there is an exercise of prophesy constantly and ordinarily to be observed in the Church, whereby the Word should by private Christians in the Name of Christ and with all authority be publicly preached for the edification of the Church. And therefore we maintain the negative of the question proposed, and deny that there is such an exercise to be perpetually retained in the Church of Christ.”

That%20private%20Christians%20in%20an,retained%20in%20the%20Church%20of%20Christ&amp;text=2.%20That%20private%20Christians%20in%20an%20extraordinary%20case&amp;text=be%20perpetually%20retained%20in%20the%20Church%20of%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-32882f1932" data-kw="">
<blockquote><p>The reason why it is believed, that regeneration does not usually accompany baptism, is simply because no evidences of spiritual life appear in baptized children more than in those which remain unbaptized. The education of children should proceed on the principle that they are in an unregenerate state, until evidences of piety clearly appear, in which case, they should be sedulously cherished and nurtured. These are Christ’s lambs — ” little ones, who believe in Him” whom none should offend or mislead upon the peril of a terrible punishment. But though the religious education of children should proceed on the ground that they are destitute of grace, it ought ever to be used as a means of grace. Every lesson, therefore, should be accompanied with the lifting up of the heart of the instructer to God for a blessing on the means. “Sanctify them through thy truth; thy word is truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-alexander.html">A.A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience (Philadelphia: Presbyterian Board of Publication, 1841)</cite>, pp. 26-27</span></figcaption>

</figure><figure class="quote" id="q-89c952eadc" data-kw="">
<blockquote><p>If they say that men of such erroneous principles, if they cannot be rectified, are bound to give up the ministry to others of better judgments. I answer: 1. Show me but where those men are, in so full a number as may supply the churches necessities, but so far as that I and such as I may conscionably cease without the church’s loss, and I here promise that I will joyfully give up my office whenever any such fitter man shall be called to my place. And I think the rest of my brethren will do the like. But we live in the open world, where we have opportunity to know men, as well as others: and we cannot see any such plentiful choice of able, pious men to supply all our places if we should give them up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-3257a990ce" data-kw="">
<blockquote><p>4. Mr. Hooker [a congregationalist] will not say all that were scattered, Acts 8[:4] (for they were all scattered, except the apostles, verse 1) did preach the Gospel, for there were of them women, verse 3; then some of them only preached. And if Mr. Hooker say they were not officers, Mr. Rutherford says they were officers, and that the extraordinariness of their condition supplied the want of a Church-calling, and let Mr. Hooker but attempt to bring a proof for it. 5. If nothing extraordinary was here, l […]t Mr. Hooker or any for him vindicate the place, Acts 8, from Anabaptists who allege the same place, Acts 8, to destroy the standing ordinance of the ministry: and read the judicious Tractate of the Ministers of London, of Mr. Collings.</p></blockquote>

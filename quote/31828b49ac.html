<main class="wrap"><figure class="quote" id="q-31828b49ac" data-kw="">
<blockquote><p>The very light of nature, whereby the Heathens knew a God, did let with it into their minds, some knowledge of another world, and of a double state therein; of happiness to the good, and misery to the wicked; being not able, otherwise, to reconcile the unevenness of Providence in this world, with the righteous nature of God: but alas, what was this lesser light which God left in man to rule him, in the night of Heathenish darkness, to the certainty of the Saints knowledge, which comes in by the light of Faith? first, the Christian’s Faith is grounded on the testimony of God himself, in his word.

Human Faith is, indeed the weakest, and most uncertain kind of knowledge; because mans testimony, on which it relies, is so fallible; but Divine Faith the most certain, because the testimony of God, on which its weight bears, is infallible: One, who cannot deceive, because he is truth it self; nor be deceived, because he is wisdom it self: So that, though Faith be not Reason, yet to believe what God saith is true, there is the highest reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Labour and Reward, or, A Sermon, part of which was Preached at the Funeral of the Right Honourable the Lady Mary Vere, relict of Sir Horace Vere, Baron of Tilbury, on the 10th of January, 1671, at Castle Heviningham in Essex</cite>, (London: Ralph Smith, 1672), pp 59-60.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith.html">Faith</a></span></div>

Human Faith is, indeed the weakest, and most uncertain kind of knowledge; because mans testimony, on which it relies, is so fallible; but Divine Faith the most certain, because the testimony of God, on which its weight bears, is infallible: One, who cannot deceive, because he is truth it self; nor be deceived, because he is wisdom it self: So that, though Faith be not Reason, yet to believe what God saith is true, there is the highest reason.”

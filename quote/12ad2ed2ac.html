<main class="wrap"><figure class="quote" id="q-12ad2ed2ac" data-kw="">
<blockquote><p>As touching that point whether the minister should wear it [the surplice], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, … ([Basel: Guarinus, 1577]), pt. 2, ch. 8, pp. 262-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

<blockquote><p>§40. And 1. If the surplice be imposed by the magistrate (as it was), who is a lawful governor, and that directly but as a decent habit for a minister in God’s service, I think he needlessly strained his power and sinfully made an engine to divide the Church by making such a needless law, and laying the peace of the Church upon it; But yet he meddled with nothing but was within the reach of his power in the general. Some decent habit is necessary; either the magistrate or the minister himself, or the associated pastors must determine what. I think neither magistrate nor synod should do anymore than hinder undecency: But yet if they do more, and tie all to one habit (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; he does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment, if I could not be dispensed with. Yea, though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, … (London, 1659), 5th Disputation, ch. 2, pp. 409-10</span></figcaption>

</figure><figure class="quote" id="q-ea6928ec62" data-kw="">
<blockquote><p>…whereas your surplice is arbitrarily institute[d], and imposed to signify innocency, without either real foundation or sufficient warrant, wherein, whether you do more usurp against God’s prerogative to appoint sacred and mysterious signs, and that simplicity, in which he has set forth his Gospel, or be more grossly mistaken in the event and fruit of your application, is a great question? I grant that necessity or decency have introduced many things circumstantial that are rational, and consequently upon some real antecedent ground expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures and the like, without which worship cannot be performed; But to ascribe a liberty to the Church of appointing ceremonies, having for reason of their signification, the will of the instituter, and their use only in the representation, is so manifest an impingement upon Divine authority and the sacraments thereby ordained, and has already produced such a mass of superstitious superfluity in the Romish-Church, that I much admire to find a serious person pleading for such fopperies…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 111-12</span></figcaption>

<blockquote><p>That keen and bitter controversy which was carried on in England during the reign of Elizabeth regarding the wearing of vestments had to do with the renunciation of the doctrines of a priestly office in the Church. The strict Reformers were persuaded that not even the vestments suggesting priestliness should be worn by officiating ministers. It was not such an indifferent matter as some have thought. … Very probably in England, but for Elizabeth, the priestly vestments would have been discarded. She insisted on the wearing of them. In the Marprelate Tracts they are spoken of as ‘Queen Elizabeth’s livery.’ In other churches of the Reformation the priestly vestments for the ministry were not continued. The dress of officiating ministers became distinctive, but it was not priestly. A biographer of Zwingli, with reference to Zurich, says: ‘ministers wore their ordinary dress in the pulpit, but this dress characterized by a black cloak and white ruff, was worn by others only on gala occasions, and when it passed out of (general) fashion it became the distinctive ministerial dress.’ ([Samuel Macauley] Jackson, [Huldreich Zwingli: The Reformer of German Switzerland, 1584-1531 (NY &amp; London: Knickbocker Press, 1903)] pp. 290, 291) In a short biography of Bullinger, among other matters, his custom in dress is referred to:… ([G.R.] Zimmermann, [Die Zurcher Kirche (Zurich, 1878),] p. 43) “How far from all vain adornment and official glory he was can clearly be seen from the fact that he went up into the pulpit in his civilian style of dress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-l-ainslie.html">J.L. Ainslie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 36-37 of Ch. 2, ‘The Ordinary Duties of the Reformed Ministerial Order’ in The Doctrines of Ministerial Order in the Reformed Churches of the 16th and 17th Centuries (Edinburgh: T. &amp; T. Clark, 1940)</span></figcaption>

<blockquote><p>What if we should yield to the Bishop that kneeling [to the bread and wine in the Supper] and holidays are with us applied to another service, and used with another meaning than they are with the Papists [as is often claimed with vestments]? Does that excuse our conformity with Papists in the external use of these ceremonies? If so, J. [John] Hart did rightly argue out of Pope Innocentius, that the church does not Judaize by the sacrament of unction or anointing, because it figures and works another thing in the New Testament than it did in the Old (Rainolds, Conference with Hart, ch. 8, div. 4, p. 496). Rainolds answers, that though it were so, yet is the ceremony Jewish; and mark his reason (which carries a fit proportion to our present purpose), ‘I trust’, he says, ‘you will not maintain but it were Judaism for your church to sacrifice a lamb in burnt-offering, though you did it to signify, not Christ that was to come, as the Jews did, but that Christ is come, etc. St. Peter did constrain the Gentiles to Judaize, when they were induced by his example and authority to follow the Jewish rite in choice of meat; yet neither he nor they allowed it in that meaning which it was given to the Jews in; for it was given them to betoken that holiness, and train them up into it, which Christ by his grace should bring to the faithful. And Peter knew that Christ had done this in truth, and taken away that figure, yea the whole yoke of the law of Moses; which point he taught the Gentiles also. Wherefore, although your church keeps the Jewish rites with another meaning than God ordained them for the Jews… yet this of Peter shows that the thing is Jewish, and you to Judaize to keep them. (Ibid., p. 496 [567])</p></blockquote>

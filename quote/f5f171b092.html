<blockquote><p>‘The evening,’ which is the beginning of the night, and ‘the morning’, which is the beginning of the day, are here put for the whole time of night and day, which joined together are said to make one entire day, to wit, in a large sense comprehending both night and day, which is with us the space of 24 hours…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02bf9e3817" data-kw="first day heaven earth light">
<blockquote><p>The works of the first day are reckoned as three (the heaven, the earth and light) according to the Mosaic account. God demonstrates his power in the production of all things ex nihilo by his word alone; his wisdom in their variety, order and use; his goodness in making all things very good. Thus he exercised an ordering and command which powerfully gave existence to things, and ordination which wisely directed all things and assigned to each its own use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1.3</span></figcaption>

</figure><figure class="quote" id="q-0a819d3bca" data-kw="">
<blockquote><p>A simple survey of the world should of itself suffice to attest a Divine Providence. The heavens revolve daily, and, immense as is their fabric, and inconceivable the rapidity of their revolutions, we experience no concussion — no disturbance in the harmony of their motion. The sun, though varying its course every diurnal revolution, returns annually to the same point. The planets, in all their wanderings, maintain their respective positions. How could the earth hang suspended in the air were it not upheld by God’s hand? By what means could it maintain itself unmoved, while the heavens above are in constant rapid motion, did not its Divine Maker fix and establish it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Ps.</cite>, 93:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-d76a7c7f0e" data-kw="">
<blockquote><p>Aquinas tells us that, just as God sustains and moves a creature to act through the contingency of its nature, so too does he move the creature again in grace, analogically elevating the creature to attain an end beyond the scope of its original nature. (ST i- ii q. 109, aa. 1, 6, 9) By invoking the language of movement, Aquinas chooses to describe grace not only within the linguistic but also the causal categories that mark the analogical relationship between God and the world, where creation as really related to God participates in God in a way proportioned to its nature. (ST i q. 13, a. 7) And yet the participation indicated by grace is qualitatively different and much deeper than that of nature. Unlike a natural end, the end of those infused virtues that characterize the life of the baptized is not a natural similitude of divine goodness, but is in fact God himself. (ST i- ii q. 1) All natural creaturely perfections are said of both the creature and of God, analogically: that which is “good” or “true” in a given creature is necessarily said of God as well. God is goodness, and created “good things” are a kind of participated similitude of the divine goodness. (ST i qq. 6, 13) Grace represents a furthered participation, this time in Divine nature itself. Aquinas himself says clearly that “grace is nothing except a participated similitude of divine nature.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), pp. 231-32 Lynch is a Dominican and writes in the Thomist tradition.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<main class="wrap"><figure class="quote" id="q-76d7d3bbb6" data-kw="">
<blockquote><p>There is no necessity for the common people (who are ignorant of the Hebrew and Greek) to hold the Vulgate as authentic in order to know whether they are reading the Scriptures or not. They can apprehend the truth of Scripture no less from the vernacular versions, which they read and understand, than from the Vulgate, which they do not understand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 134.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

— Francis Turretin, Institutes of elenctic theology, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 134.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+no+necessity+for+the+common+people+%28who+are+ignorant+of+the+Hebrew+and+Greek%29+to+hold+the+Vulgate+as+authentic+in+order+to+know+whether+they+are+reading+the+Scriptures+or+not.+They+can+apprehend+the+truth+of+Scripture+no+less+from+the+vernacular+versions%2C+which+they+read+and+understand%2C+than+from+the+Vulgate%2C+which+they+do+not+understand.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+elenctic+theology%2C+trans.+G.+M.+Giger%2C+ed.+J.+T.+Dennison+%281679%3B+3+vols%2C+Philipsburgh%2C+1992%29%2C+i%2C+134.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76d7d3bbb6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76d7d3bbb6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/05/19/francis-turretin-on-translation-in-the-vernacular/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f9c173098" data-kw="">
<blockquote><p>The knowledge of our religion and of the truth of things is independently manifest rather than in need of human teachers, for almost day by day it asserts itself by facts, and manifests itself brighter than the sun by the doctrine of Christ. Still, as you nevertheless desire to hear about it, Macarius, come let us as we may be able set forth a few points of the faith of Christ: able though you are to find it out from the divine oracles, but yet generously desiring to hear from others as well.

For although the sacred and inspired Scriptures are sufficient to declare the truth,—while there are other works of our blessed teachers compiled for this purpose, if he meet with which a man will gain some knowledge of the interpretation of the Scriptures, and be able to learn what he wishes to know,—still, as we have not at present in our hands the compositions of our teachers, we must communicate in writing to you what we learned from them,—the faith, namely, of Christ the Saviour; lest any should hold cheap the doctrine taught among us, or think faith in Christ unreasonable.

For this is what the Gentiles traduce and scoff at, and laugh loudly at us, insisting on the one fact of the Cross of Christ; and it is just here that one must pity their want of sense, because when they traduce the Cross of Christ they do not see that its power has filled all the world, and that by it the effects of the knowledge of God are made manifest to all.

For they would not have scoffed at such a fact, had they, too, been men who genuinely gave heed to His divine Nature. On the contrary, they in their turn would have recognised this man as Saviour of the world, and that the Cross has been not a disaster, but a healing of Creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Heathen</cite>, (c. 335), 1.1-4 in Nicene and Post-Nicene Fathers 2, 4: 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-7ca521123f" data-kw="">
<blockquote><p>Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations Divine &amp; Moral</cite>, … (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

<blockquote><p>Nor was discipline overlooked in the Covenants. This was regarded as an ordinance of God for preserving the purity of the church and for doing good to the soul that was dealt with. And here also it was the hand of the Lord that was looked for, and guidance was sought from the Word of God. The Covenanters saw clearly that there was no authority in Scripture for throwing open membership in the Church to all who chose to claim it. They saw, too, what so many of the modern sects have failed to see at the beginning of their career, but what all have been before long compelled to admit, and what many who have begun by opposing have ended by abusing – that no church can live without discipline. Errors must be extirpated, and offenders must be excluded. Ecclesiastical “malignants, incendiaries, and evil instruments” must be discovered and brought to trial. And what is it that most of all mars the good name of the church in the world now? It is not the dulness of her worship, nor the rigidity of her government, nor the sterness of her doctrine. It is the fact that so many of her members are the veriest hypocrites, and by their actions wholly belie their profession. It is the lack of discipline that most of all gives the adversary occasion to blaspheme. A wholesome, just and impartial church discipline is one of the crying needs of the present day. And the message of the Covenants is an exactly suitable message.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ramsey.html">John Ramsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The British covenants suited to present-day needs</cite>, (Belfast, 1897), pp 14-15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16e26d5ea7" data-kw="">
<blockquote><p>We see, secondly, in these verses [John 9:26-41], how cruelly and unjustly unconverted men will sometimes treat those who disagree with them. When the Pharisees could not frighten the blind man who had been cured, they expelled him from the Jewish Church. Because he manfully refused to deny the evidence of his own senses, they excommunicated him, and put him to an open shame. They cast him out “as a heathen man and a publican [tax-collector].”

The temporal injury that such treatment did to a poor Jew was very great indeed. It cut him off from the outward privileges of the Jewish Church. It made him an object of scorn and suspicion among all true Israelites. But it could do no harm to his soul. That which wicked men bind on earth is not bound in heaven. “The curse causeless shall not come.” (Prov. 26:2.)

The children of God in every age have only too frequently met with like treatment. Excommunication, persecution, and imprisonment have generally been favourite weapons with ecclesiastical tyrants. Unable, like the Pharisees, to answer arguments, they have resorted to violence and injustice. Let the child of God console himself with the thought that there is a true Church out of which no man can cast him, and a Church-membership which no earthly power can take away. He only is blessed whom Christ calls blessed; and he only is accursed whom Christ shall pronounce accursed at the last day.

We see, thirdly, in these verses, how great is the kindness and condescension of Christ. No sooner was this poor blind man cast out of the Jewish Church than Jesus finds him and speaks words of comfort. He knew full well how heavy an affliction excommunication was to an Israelite, and at once cheered him with kind words. He now revealed Himself more fully to this man than He did to any one except the Samaritan woman. In reply to the question, “Who is the Son of God?” He says plainly, “Thou hast both seen Him, and it is He that talketh with thee.”

We have here one among many beautiful illustrations of the mind of Christ. He sees all that His people go through for His sake, and feels for all, from the highest to the lowest. He keeps account of all their losses, crosses, and persecutions. “Are they not all written in His book?” (Psalm. 56:8.) He knows how to come to their hearts with consolation in their time of need, and to speak peace to them when all men seem to hate them. The time when men forsake us is often the very time when Christ draws near, saying, “Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee: yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.” (Isaiah. 41:10.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 180-81.</span></figcaption>

</figure><figure class="quote" id="q-540660b917" data-kw="">
<blockquote><p>But they are confident that they have invincible objections for excommunicating the calling of princes from the church and from all hope of salvation in citing several passages, badly misunderstood, which they imprudently turn in their favour. First of all, they cite that our Lord Jesus did not order that the woman who was caught in adultery be stoned to death, as the law of God requires. Rather He had mercy on her, saying, “Go and sin no more” (John 8:11).

Before replying, I ask but one question. They say that the ban has replaced the temporal sword in the Christian church, so much so that in place of punishing a crime by death as was formerly done, today we must punish the delinquent by depriving him of the fellowship of believers. Thus I ask them, how do they excuse Jesus Christ for what He has done? For He did not observe their rule. For He neither condemned the woman by banishing her from the fellowship of believers nor condemned her to death. Thereby we already see what poor scatterbrains they are, speaking without reason.

Now I come to the true solution that is quite easy. It is to note that these poor fools in this passage follow that exposition with which the papal priests feather their nests. For since marriage was prohibited them, they wanted as a recompense a licence to commit adultery. Thus they borrowed the wives of their neighbours. Now in order for it not to appear that adultery was such a great sin, they said that we should be under the law of grace of Jesus Christ in anything, they said adulterers should go unpunished.

These poor people, as I have said, follow them. And thus they experience what Jesus Christ said, that “if a blind man leads another, both fall into the pit” (Matt. 15:14; Luke 6:39). …

In sum, the action which our Lord Jesus took toward the adulteress is nothing other than what His servants and ministers of His Word take today toward all malefactors. For they only try to exhort them to repent and to turn around on the right road. Then they comfort their consciences by presenting them with the grace of our Lord Jesus and by assuring them of the remission of sins. They do not attempt to punish them. Such does not belong to them. But they do not stand in the way of justice doing what it must.

In summary, let us understand the office of our Lord Jesus, and we will surmount any difficulties. His office is to forgive sins and to address His Word to the consciences of sinners. To mete out corporal punishments is not His task, but He leaves these to those to whose authority it belongs and to whom the charge has been commissioned, according to what He says in another text: “Render to Caesar the things that are Caesar’s” (Matt. 22:21).</p></blockquote>

ple%2C+as+I+have+said%2C+follow+them.+And+thus+they+experience+what+Jesus+Christ+said%2C+that+%E2%80%9Cif+a+blind+man+leads+another%2C+both+fall+into+the+pit%E2%80%9D+%28Matt.+15%3A14%3B+Luke+6%3A39%29.+%E2%80%A6%0A%0AIn+sum%2C+the+action+which+our+Lord+Jesus+took+toward+the+adulteress+is+nothing+other+than+what+His+servants+and+ministers+of+His+Word+take+today+toward+all+malefactors.+For+they+only+try+to+exhort+them+to+repent+and+to+turn+around+on+the+right+road.+Then+they+comfort+their+consciences+by+presenting+them+with+the+grace+of+our+Lord+Jesus+and+by+assuring+them+of+the+remission+of+sins.+They+do+not+attempt+to+punish+them.+Such+does+not+belong+to+them.+But+they+do+not+stand+in+the+way+of+justice+doing+what+it+must.%0A%0AIn+summary%2C+let+us+understand+the+office+of+our+Lord+Jesus%2C+and+we+will+surmount+any+difficulties.+His+office+is+to+forgive+sins+and+to+address+His+Word+to+the+consciences+of+sinners.+To+mete+out+corporal+punishments+is+not+His+task%2C+but+He+leaves+these+to+those+to+whose+authority+it+belongs+and+to+whom+the+charge+has+been+commissioned%2C+according+to+what+He+says+in+another+text%3A+%E2%80%9CRender+to+Caesar+the+things+that+are+Caesar%E2%80%99s%E2%80%9D+%28Matt.+22%3A21%29.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Brief+Instruction+for+Arming+all+the+Good+Faithful+Against+the+Errors+of+the+Common+Sect+of+Anabaptists%2C+%28Geneva%2C+1544%29+in+idem%2C+Treatises+Against+the+Anabaptists+and+Against+the+Libertines%2C+trans.+and+ed.+B.+W.+Farley+%28Grand+Rapids%3A+Baker+Books%2C+1982%29%2C+pp+82-84.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F540660b917.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/540660b917.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/26/john-calvin-on-the-anabaptist-error-that-excommunication-has-replaced-civil-punishment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>

<blockquote><p>Neo-Confederate mythology would have us believe that the only people who opposed Southern slavery were Unitarians, Jacobins and infidels. Historical reality is rather different, as the American Covenanters’ debarred slaveholders. Here is an extract from the minutes of the Reformed Presbytery in 1800:

In the Fall of 1800. — A call was made on Mr. McLeod to the pastoral charge of the united congregations of the city of New York and Coldenham. Mr. McLeod demurred to the call, on the ground that there were slaveholders among the subscribers to the call. The subject of slaveholding being now before the Presbytery, it was enacted that no slaveholder should be allowed the communion of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/american-covenanters-and-the-excommunication-of-manstealers.html">American Covenanters and the excommunication of manstealers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Reformed Presbytery of America 1798 to 1809; and digest of the acts of the Reformed Presbyterian Synod 1809 to 1888 (Philadelphia, 1888), p. 3.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

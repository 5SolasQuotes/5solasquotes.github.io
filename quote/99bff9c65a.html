<blockquote><p>First, whereas you say, It suffices that it is bread and wine before consecration, by which substances we be nourished, it proves not but that in the sacrament itself the conveniency is by you taken away. For we speak not of the sacrament when it is now a sacrament, where also we affirm that the analogy must be kept. You appoint the same to be before the sacrament; and when ye come to the sacrament, you take it away, and so ye sin against the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vermigli, The Common Places</cite>, … with a Large Addition of Many Theological &amp; Necessary Discourses… (London, 1583), ‘The Disputation of the Second Day’, p. 196</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>3. Much less must we prefer them [animals] before men: We must not be cruel to men pretending to show mercy to the brute creatures. The life of a beast must go still to save or preserve the life of a man. I cannot but condemn the Turks, who set birds at liberty out of their cages, redeeming with money these captives, and yet make no conscience of chaining Christians to their galleys; as also the hypocrisy [of those] that cheat amongst the Romanists, whose clergy are forbid to hunt beasts, and yet some made Lords Inquisitors on purpose to hunt down, tear and devour the harmless sheep and lambs of Christ. Surely the good, the great, and the chief Shepherd of the flock and the Bishop of our souls will count them but little thanks for their so doing when He shall come to hold his general Visitation and to judge the world. These things notwithstanding, I dare not condemn those (if necessitated to save and defend their own lives) which in the civil wars of France cut off their horse-legs and so made themselves a breast-work of their bodies. Nor dare I judge king David for houghing his enemies’ horses, thereby to make them unserviceable for the wars, 2 Sam. 8:4. Let’s not be superstitiously afraid to use these creatures, either for food, physic or service, no nor for our honest delight and recreation. See your charter for so doing, if not implicitly given to Adam, yet expressly to Noah; and again renewed, Acts 10, under the Gospel, in the vision and voice to Peter, ‘Arise Peter, kill, and eat.’ And though ’tis said the disciples of the Nazarites may be known by their abstinence from the flesh of all living creatures, yet our Lord Jesus Christ of Nazareth, and He that in substance though not in vow and ceremony was the true Nazarite, gave his disciples no such commandment. Those who refuse altogether to eat the flesh of living creatures, when duly killed, deserve the name of Pythagoreans, followers of Pythagoras the philosopher, rather than to be called Christians or disciples of Christ our Saviour. So then, use these creatures we may, we must, without scruple for our meat; yea and we may use these creatures for our work, to plow and harrow the ground, and to carry our corn into the barn, and for any other necessary use. And although many condemn those persons who promote the generation of mules [which are a mix of species], so does Maimonides in his More Nev. p. 3, ch. 4 and our own writers on Gen. 36:24, yet we may use them lawfully; for we find them brought to Solomon, 1 Kings 10:25; 2 Chron. 9:24, and amongst the Israelites at their return from captivity, Ezra 2:66 and Neh. 7:68. And we nowhere find that ever they were commanded to put these away, though monsters in nature, as they were to put away their outlandish wives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hodges.html">Thomas Hodges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creature’s Goodness, as they came out of God’s Hands, &amp; the good man’s mercy to the brute creatures, which God has put under his feet in Two Sermons</cite>, (London, 1675), sermon 2, pp. 40-41</span></figcaption>

<blockquote><p>6. Hence follows that all actions and circumstances of their nature indifferent, must lose that indifferency and receive from God some goodness and aptness to edify before they can be the reasonable and nearest matter of any civil or ecclesiastical constitution; Because what rulers can in law and reason command, that they must will as good and apt to edify before they can bind others to will it. But neither the will of a ruler, nor the will of any other can lawfully will a thing indifferent, as it is such: For a thing indifferent, as it is such, is neither good nor evil, and the object of the will is always good. 3. Rulers command as God’s ministers for our good, Rom. 13:4. Ergo [Therefore], the means and actions enjoined for the compassing of this end must be good; for if the end be good, the means as the means must be good; Ergo, they cannot be indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), p. 648</span></figcaption>

<div class="actions"><button class="copy" data-copy="“6. Hence follows that all actions and circumstances of their nature indifferent, must lose that indifferency and receive from God some goodness and aptness to edify before they can be the reasonable and nearest matter of any civil or ecclesiastical constitution; Because what rulers can in law and reason command, that they must will as good and apt to edify before they can bind others to will it. But neither the will of a ruler, nor the will of any other can lawfully will a thing indifferent, as it is such: For a thing indifferent, as it is such, is neither good nor evil, and the object of the will is always good. 3. Rulers command as God’s ministers for our good, Rom. 13:4. Ergo [Therefore], the means and actions enjoined for the compassing of this end must be good; for if the end be good, the means as the means must be good; Ergo, they cannot be indifferent.”

<main class="wrap"><figure class="quote" id="q-a1a4b463fa" data-kw="">
<blockquote><p>And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well-qualified men for those functions and offices. For the eighth head of the First Book of Discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominat[ed] to be in election, and that their names be publicly read to the whole church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominat[ed] be noted with public infamy, he ought to be repelled: and that if any man know others of better qualities within the Church than these that be nominat[ed], they should be put in election, that the Church may have the choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 3, ch. 8, Digression 1</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-331475bd53" data-kw="">
<blockquote><p>5th Distinction: There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonical Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of Separatists are [claimed to be].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1646) | Part 2</cite>, p. 272</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-1d1a38ecd5" data-kw="">
<blockquote><p>Question: But surely the calling and promise are universal. Answer: Understand them to be indefinite (yea and that in respect of certain circumstances of which I have spoken) and thou shalt think the rightlier… Or else see, how very reason of necessity confutes that universal calling. For if ye mean it of the calling by the preaching of the Word: it is not true that all men are, or ever were, yea or ever shall be called so severally hereafter.</p></blockquote>

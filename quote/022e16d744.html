<main class="wrap"><figure class="quote" id="q-022e16d744" data-kw="">
<blockquote><p>And this Covenant is the bond of a twofold union. First, it unites us of this Kingdom among our selves, and this Kingdom with the other two. Secondly, it makes a special union of all those, who shall take it holily and sincerely throughout the three Kingdoms, with the One-most God. Weak things bound together are strong, much more then, when strong are bound up with strong; most of all, when strong are bound up with Almighty. If in this Covenant we should only join weak to weak, we might be strong. But (blessed be God) we join strong (as creatures may be accounted strong) with strong.

The strong Kingdoms of England and Ireland, with the strong Kingdom of Scotland. A threefold cord twisted of three such strong Cords will not easily, if at all, be broken. They which single (blessed be God) have yet such strength, how strong may they be when conjoined? As the Apostle writes to his Romans (c. 6. 19.) I speak after the manner of men, because of the infirmity of our flesh: So I speak now after the manner of men, concerning the strength of our flesh (outward meanes) in these Kingdoms. For as the Apostle Peter speaks in like phrase, though to another occasion, (2 Pet. 3. 9. the Lord is not slack concerning his promise, as some men count slackness. So I may say, no man, no Kingdoms are strong to any purpose, as the Lord counts strength.

And therefore I reckon this the least part of our strength, that these three strong Kingdoms will be united by this Covenant; nay, if this were all the strength which this union were like to make, I should reckon this no strength at all; wherefore know that this covenant undoubtedly is and will be a bond of union between strong and Almighty: between three strong Nations, and an Almighty God. This Covenant engages more then Man, God also is engaged; engaged (through his free grace) in his power, wisdom faithfulness, to do as good and much good, though in and of our selves unworthy of the least, unworthy of my good.

All this considered, this Covenant will be our strength, our brethren of Scotland, have (in a plentiful experience) found it so already. This Covenant (through the blessing of God upon their counsels and endeavours) hath been their Sampson’s Lock, the thing (in fight) wherein their strength lieth. And why should not we hope, that it will be ours; if we can be wise, as they, to prevent or overcome the flattering enticements of those Delilah’s, who would lull us asleep in their laps, only for an opportunity to cut or shave it off? Then indeed (which God forbid) we should be but weak, like other men, yea weaker then our selves were before this Lock was grown, having but the strength of man; God utterly departing from us, for our falseness and unfaithfulness in this Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The nature, solemnity, grounds, property, and benefits, of a sacred covenant. Together with the duties of those who enter into such a covenant. Delivered in a sermon at Westminster, at the publique convention, (ordered by the Honourable House of Commons) for the taking of the Covenant, by all such, </cite>, (London: John Rothwell, 1643), pp 25-26.</span></figcaption>

<blockquote><p>After affirming belief in the sufficiency of scripture for the doctrine and worship of the church in its First Head (“Of Doctrine”), the First Book of Discipline of the Church of Scotland (1560) called for all extra-biblical holy days to be abolished:

In which Books of Auld and New Testaments we affirm, that all things necessary for the instruction of the Kirk, and to make the man of God perfect, is contained and sufficiently expressed.

By the contrary Doctrine, we understand whatsoever men, by Laws, Counsels, or Constitutions have imposed upon the consciences of men, without the expressed commandment of God’s word; such as be [the] vows of chastity, forswearing of marriage, binding of men and women to several disguised apparels, to the superstitious observation of fasting days, difference of meat for conscience sake, prayer for the dead; and keeping of holy days of certain Sanctis commandit by man, such as be all those that the Papists have invented, as the Feasts (as they term them) of Apostles, Martyrs, Virgins, of Christmas, Circumcision, Epiphany, Purification, and other fond feasts of our Lady. Which things, because in God’s Scriptures they neither have commandment nor assurance, we judge them utterly to be abolished from this Realm; affirming farther, that the obstinate maintainers and teachers of such abominations ought not to escape the punishment of the Civil Magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>repr in The works of John Knox, ed. David Laing</cite>, (6 vols, Edinburgh, 1856), ii, 185-6.</span></figcaption>

<blockquote><p>[Daniel] Chamier (says the Rejoinder) [Panstratiae Catholicae] tome 3, bk. 20 [‘On Vows’], ch. 5 [‘In what way vows are the worship of God. Arguments of the Papists’], four times uses this distinction of worship proper and accidental. But Chamier only calls those special material acts which are conjoined with formal acts of worship, accidental parts of worship: as if a man vowed to drink no wine for a certain time, his abstaining from wine pertains to worship only by accident. So if in solemn prayer for a prince, his titles and style be rehearsed, or any special terms of honor, this pertains to prayer by accident.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[Daniel] Chamier (says the Rejoinder) [Panstratiae Catholicae] tome 3, bk. 20 [‘On Vows’], ch. 5 [‘In what way vows are the worship of God. Arguments of the Papists’], four times uses this distinction of worship proper and accidental. But Chamier only calls those special material acts which are conjoined with formal acts of worship, accidental parts of worship: as if a man vowed to drink no wine for a certain time, his abstaining from wine pertains to worship only by accident. So if in solemn prayer for a prince, his titles and style be rehearsed, or any special terms of honor, this pertains to prayer by accident.”

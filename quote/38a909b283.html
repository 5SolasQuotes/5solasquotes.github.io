<main class="wrap"><figure class="quote" id="q-38a909b283" data-kw="kingdom come">
<blockquote><p>The second petition is: that God&#x27;s Kingdom come [Matt. 6:10]. Even though it contains nothing new, it is with good reason kept separate from the first petition; for if we consider our languor in the greatest matters of all, it behooves us to extend our discussion in order to drive home something that ought to have been thoroughly known of itself. … God reigns where men, both by denial of themselves and by contempt of the world and of earthly life, pledge themselves to his righteousness in order to aspire to a heavenly life. Thus there are two parts to this Kingdom: first, that God by the power of his Spirit correct all the desires of the flesh which by squadrons war against him; second, that he shape all our thoughts in obedience to his rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/the-lords-prayer.html">The Lord&#x27;s Prayer</a> › <a href="../topics/prayer/the-lords-prayer/thy-kingdom-come.html">Thy kingdom come</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-443a86e113" data-kw="six petitions">
<blockquote><p>The reason why I do not agree with those who distinguish seven headings is that by inserting the adversative &quot;but&quot; the Evangelist seems to have meant to join those two members together. It is as if he had said: &quot;Do not allow us to be oppressed by temptation but rather bring help for our weakness, and deliver us from falling.&quot; Ancient writers of the church also agree with us, so that what has been added in seventh place in Matthew exegetically ought to be referred to the sixth petition. But even though the whole prayer is such that throughout it God&#x27;s glory is to be given chief place, still the first three petitions have been particularly assigned to God&#x27;s glory, and this alone we ought to look to in them, without consideration of what is called our own advantage. The three others are concerned with the care of ourselves, and are especially assigned to those things which we should ask for our own benefit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20</span></figcaption>

</figure><figure class="quote" id="q-38c81dd10b" data-kw="">
<blockquote><p>The first petition is that God&#x27;s name be hallowed [Matt. 6:9]; the need for it is associated with our great shame. For what is more unworthy than for God&#x27;s glory to be obscured partly by our ungratefulness, partly by our ill will, and so far as lies in our power, destroyed by our presumption and insane impudence? Though all ungodly men should break out with their sacrilegious license, the holiness of God&#x27;s name still shines. The prophet justifiably proclaims: &quot;As thy name, O God, so thy praise unto all the ends of the earth&quot; [Ps. 48:10]. For wherever God becomes known, his powers cannot fail to be manifested; might, goodness, wisdom, righteousness, mercy, truth—these should captivate us with wonderment for him, and impel us to celebrate his praise. Because, therefore, God&#x27;s holiness is so unworthily snatched from him on earth, if it is not in our power to assert it, at least we are bidden to be concerned for it in our prayers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.41</span></figcaption>

</figure><figure class="quote" id="q-21dd2b3f57" data-kw="daily bread">
<blockquote><p>By this petition we ask of God all things in general that our bodies have need to use under the elements of this world [Gal. 4:3], not only for food and clothing but also for everything God perceives to be beneficial to us, that we may eat our daily bread in peace. Briefly, by this we give ourselves over to his care, and entrust ourselves to his providence, that he may feed, nourish, and preserve us. For our most gracious Father does not disdain to take even our bodies under his safekeeping and guardianship in order to exercise our faith in these small matters, while we expect everything from him, even to a crumb of bread and a drop of water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.44</span></figcaption>

<main class="wrap"><figure class="quote" id="q-f4042b8944" data-kw="">
<blockquote><p>While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-scott-sealy.html">Charles Scott Sealy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Authority &amp; Non-Subscription</cite>, Charles S. Sealy, Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis, (Univ. of Glasgow, 2010), p. 176 quoting [John Thomson], An Overture Presented to the Reverend Synod of Dissenting Ministers, Sitting in Philadelphia, in the Month of September, 1728… (n.l., 1729), pp. 24, 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;”

— Before the Adopting Act of, Charles S. Sealy, Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), p. 176 quoting [John Thomson], An Overture Presented to the Reverend Synod of Dissenting Ministers, Sitting in Philadelphia, in the Month of September, 1728… (n.l., 1729), pp. 24, 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhile+%5BJohn%5D+Thomson+has+been+portrayed+as+a+strict+Subscriber+his+overture+%5Bin+1727%2C+which+led+to+the+Adopting+Act%5D+recognizes+a+need+to+deal+with+exceptions%2C+%E2%80%98if+any+minister+within+our+bounds+shall+take+upon+him+to+teach+or+preach+any+thing+contrary+to+any+of+the+said+Articles%2C+unless+first+he+propose+the+said+point+to+the+Presbytery+or+Synod%2C+to+be+by+them+discussed%2C+he+shall+be+censured%E2%80%99.+And+as+he+closed+the+preface%3A+%E2%80%98if+there+should+be+any+paragraphs+or+clauses+at+which+some+may+scruple%2C+there+are+rational+methods+according+to+charity+and+piety%2C+to+have+such+scruples+removed+in+a+regular+way%2C+and+it%E2%80%99s+a+pity+to+deprive+a+whole+Church+of+the+benefit+of+such+and+excellent+Confession%2C+for+the+scruples+perhaps+of+a+few%2C+or+for+a+few+scruples+about+some+particular+and+lesser+points+of+religion.%27%E2%80%9D%0A%0A%E2%80%94+Before+the+Adopting+Act+of%2C+Charles+S.+Sealy%2C+Church+Authority+%26+Non-Subscription+Controversies+in+Early+18th+Century+Presbyterianism+PhD+thesis+%28Univ.+of+Glasgow%2C+2010%29%2C+p.+176+quoting+%5BJohn+Thomson%5D%2C+An+Overture+Presented+to+the+Reverend+Synod+of+Dissenting+Ministers%2C+Sitting+in+Philadelphia%2C+in+the+Month+of+September%2C+1728%E2%80%A6+%28n.l.%2C+1729%29%2C+pp.+24%2C+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4042b8944.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4042b8944.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-co </figure><figure class="quote" id="q-73f3a162aa" data-kw="">
<blockquote><p>The principles that have been learned and our rebalancing of priorities ought to not only show us that the unifying of Christ’s Church is possible, but it is obligatory and this ought to cause us to endeavor after it… The civil allowance of the more sound protestant denominations in England [in 1690]… could only tend toward facilitating and cementing those denominations into remaining separate, entering us into modern denominationalism. To seek to reverse that trend, Phil. 3:15-16, “whereto we have already attained, let us walk by the same rule, let us mind the same thing,” will be expounded and cleared from the separatistic construction often put on it. Lastly, principles of Scripture, Westminster, the Scots and the London presbyterians for unifying the Church will be laid out and recommended, versus erecting denominational white towers. The fundamentals (at least) of Christianity will be seen to be sufficient and obligatory Scriptural doctrinal grounds for organic Church union (with all due care and prudence), as the post-apostolic early Church, many of the reformed (including the leading Scottish covenanter James Durham) and the London presbyterians taught, it being no sin, but a divine obligation for the stronger to help and be united to the weaker (though they must relinquish rights and privileges for the here now to do so). Consequently, secondary teachings and practices which do not tend to overturn the fundamentals or the power of godliness will be seen to be no grounds for division, or schism. Objections will be resolved and the reform of Christ’s one Church will be encouraged and set on its way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, 4. “White Towers &amp; Unifying Christ’s Church” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 160-89, p. 160</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-134828ed61" data-kw="">
<blockquote><p>… That this Commission may receive into ministerial communion such of the late conform ministers, as having qualified themselves according to law, shall apply personally to them, one by one, duly and orderly, and shall acknowledge, engage, and subscribe upon the end of the Confession of Faith, as follows, viz.: I… do sincerely own and declare, the above Confession of Faith, approven by former General Assemblies of this Church, and ratified by law in the year 1690, to be the confession of my faith; and that I own the doctrine therein contained to be the true doctrine which I will constantly adhere to; as likeways that I own and acknowledge Presbyterian Church government of this Church, now settled by law, by Kirk-Sessions, Presbyteries, Provincial Synods and General Assemblies, to be the only government of this Church, and that I will submit thereto, concur therewith, and never endeavour directly nor indirectly, the prejudice or subversion thereof… As also that the General Assembly require all Presbyteries and Synods, in their admitting or receiving any to ministerial communion, that they oblidge them to take and subscribe the same acknowledgment…</p></blockquote>

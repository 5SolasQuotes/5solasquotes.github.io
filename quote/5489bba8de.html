<blockquote><p>153. What is a NATIONAL COVENANT?

A National Covenant is a mutual stipulation entered into by a people and their rulers, by which, in a professed taking hold of the Covenant of Grace, they publicly pledge themselves to the performance of certain duties which they owe to God and one another.

154. Is not National Covenanting, as thus defined, a religious transaction?

Yes: it is a duty based on the Moral Law commanded and exemplified in the Word of God, and, being a solemn appeal to the justice and omniscience of Jehovah, is to be viewed as a direct act of religious worship.

155. May not a National Covenant comprehend things both civil and religious?

Yes: to unite things civil and religious is not to blend things sacred and common, as is often said. The necessity, occasionally, of embracing civil and religious objects in one bond will appear from the fact that things civil and religious are sometimes so closely connected that the one may be assailed through the other. Moreover, Scripture authorizes the connexion, as is evident from the Covenant referred to in Neh. x. 29. Here the Covenanters entered into “a curse” and “an oath” to walk in “God’s law,” and to “do all the commandments of the Lord” – both first and second table duties. We are also commanded to “fear God and honour the king.</p></blockquote>

<blockquote><p>God deals with man by way of covenant. This hath been his manner with mankind ever since there was man on the face of the earth; when God had created the first man Adam, he entered into covenant with him, which was a covenant of friendship, and gave him faculties, and ability to perform perfect, personal, and perpetual obedience; but he violating that covenant, God again entered unto another covenant called a new covenant, or covenant of reconciliation, contracted betwixt an offended God, and fallen man; these are commonly distinguished into “the covenant of works, and the covenant of grace;” and it may be worth while in a few words, to explain the difference between them, and the rather because, as Luther saith, the whole scripture, and the knowledge of theology depend upon the right distinguishing of law and gospel; and he earnestly admonisheth ministers to study the difference between the two covenants. …

1. These two covenants differ [genere] in kind, the former covenant being a covenant of friendship, between persons at amity, the infinite Creator, and Adam his perfect creature, to manifest man’s dependence on God, and try his obedience; but now the case is altered, man is fallen, and hath offended his sovereign. This second covenant is intended to conciliate and establish a new made friendship between these parties at variance; this second covenant sets all at rights between an offended God, and offending man.

2. They differ [fundaniento] in the foundation of both; as to the former, though divine decrees did define it, yet there was not such a foundation laid for the first, as there was for the second covenant, for with respect to this covenant of grace or reconciliation, it was founded upon an antecedent covenant, which divines call a covenant of redemption, or a glorious transaction betwixt the Father and the Son, from all eternity, ordering what the Son should be and do on man’s behalf, in the human nature, and what assistance and recompense he should receive from the Father; there were mutual promises before the world began, Tit. i. 2. 2 Tim. i. 9, 10. The whole gospel covenant is a glorious transcript of this blessed original.

3. They differ [prinicipio] in the principle, or moving cause, for in the former God acts as a wise and righteous governor, who did consult and contrive a way to maintain his government, and keep man in an humble subjection. In this latter, free grace and mercy principally take place, free grace was the motive in God’s heart that engaged him to re-enter into this covenant. It is true, in the former there was grace conspicuous, when God condescended to deal so familiarly with his creature, and render himself so amiable, so amicable, and approachable by so mean a creature as man, so much his inferior, yea, and promise a reward to man’s obedience, this was kindness; but free grace abounded in the latter, for it is mercy to a creature in misery, the kindness and love [or philanthropy] of God our Saviour transcendently shone forth or appeared — and its influences are shed on us abundantly, or poured out richly on lost mankind. This covenant is nothing else but a compound of love and mercy.

4. They differ [efficiente] in the efficient cause, in the management of the transaction on man’s part; in the former covenant there were two parties, though not without great disparity. Man was at first furnished with faculties and ability to enter into, and keep the covenant made with him; but now fallen man is spiritually dead, and though still he retains his faculties, yet he hath lost the rectitude of them, and ability to perform his part of the conditions; it is true the parties are still two, formally considered, yet if we consider the efficacy which secures the due performance of the terms, all lies on God’s part; who works in us the conditions, which he requires of us, as faith, repentance, and new obedience. The agent is man, the efficient cause of that agency is God’s grace; as in natural things we live and move, from God’s providence; so in spiritual things our holy actions proceed from his gracious influence: as Augustin saith, there are many good things that God doth in man, that man doth not, but there is no holy action that man doth, but God doth enable him to do it.</p></blockquote>

<blockquote><p>We find God making himself known to man (for it is about man we will keep ourselves confined) as a Lord Commander; and as he has made this creature, he will dispose of him as he sees good. He determines the place of his living; he determines his employment; he lays him under law, and gives him a just and righteous command. He made himself known to man as a threatener too: In the day that thou eatest thereof, thou shalt surely die.

Ay, but, say you, was there no promise in the first covenant? Truly the word does not say there was any: but if people will needs have it that there was a promise, it is not worthy the name of a promise, in regard of what we have in the New Testament. That promise laboured under woful disadvantages, that we are now relieved from.

1st, That promise was a promise of continuance in that happy state he was made in, but no promise of a better. There was no promise of eternal life to the first Adam, as far as we can find in the terms of it. There was no more spoken of, but a continuance in that state: and this is implied in the threatening, In the day that though eatest thereof, thou shalt die; which implies, Until the day thou eatest thereof thou shalt live. But we have a promise in the new covenant of a far better state than that we are in.

2dly, If there was any promise, it was a conditional one, a promise upon the condition of perfect obedience. There was no promise but Upon this condition, Do this, and live. Life was promised upon the condition of doing, but no promise of grace to enable a man to do it. But now we are brought under a promise, blessed be he that promiseth. Whatever is required to be done by the man that would have the blessing promised, grace to do that is promised by the promiser. Hath he required faith? He hath promised faith, and he works faith. Hath he required repentance? He promises, and gives it.

Our Lord is a Prince and a Saviour, to give repentance and remission of sins to the house of Israel. Are we required to by holy in all manner of conversation? Hath he not promised to sanctify and make us holy? Hath he not prayed for this, that we may be sanctified? I told you but just now, Christ’s prayer is as good as a promise. The best promises we have in the Bible are the promises made by the Father to the Son; and next to them, are those promises that we draw out of the Son’s prayer to the Father. So that, upon these accounts, whatever there was in the first covenant, it is not to be called a promise.

3dly, There was no mediator in the first covenant; and therefore it cannot be called a covenant of promise, like that we are now brought under. The mediator of a covenant is to see the terms kept on both parts, and to see the ground secure and safe, that the bargain may not go back on either side. This is our Lord’s undertaking, and his work. Now you see, that as soon as sin came in, grace comes in with a promise. God made himself known to Adam as his creator, commander, and threatener of just punishment to him for his disobedience.

As soon as he disobeyed, so soon is he convicted of guilt in his own conscience. As soon as ever he is arraigned before God, the womb of the promise is open; then the sluice of the promise was drawn up, and it Hath been flowing to this day. It began with a promise. Adam and Eve were to know God now under no other name, but the God that said, The seed of the woman shall bruise the serpent’s head. So it went on through all the Old Testament; that still went along by promise. The Christian’s God, I say, is a promising God.</p></blockquote>

n%E2%80%99s+God%2C+I+say%2C+is+a+promising+God.%E2%80%9D%0A%0A%E2%80%94+Robert+Traill%2C+Letter+to+the+Profession+of+Our+Faith%2C+Recommended+in+Several+Sermons+%281718%29+in+The+Works+of+Robert+Traill%2C+A.M.+Minister+of+the+Gospel+in+London+%284+vols%2C+Edinburgh%3A+J.+Ogle%2C+1810%29%2C+3%3A+39-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F264db93e88.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/264db93e88.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/28/robert-traill-on-earthly-life-as-the-reward-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-cfc49c921c" data-kw="">
<blockquote><p>True it is, that if man had persisted in the state of his created integrity, he might, after an improper manner, be said to have merited the glory which he was after to enjoy, inasmuch as he was to obtain it in the virtue of those legal operations, unto which he was, by the abilities of his own nature, without the special influence of a supernatural infused grace, fitted and disposed; though even this was not from the dignity and value of our work, but from the indulgence of Almighty God, who would set no higher price on that glory, which he proposed unto man for the object of his desires, and reward of his works.

For if we go exactly unto the first rule of justice unqualified with clemency and bounty, it could not possibly be, that God should be bound to requite our labours with eternal bliss; there being so vast a disproportion between the fruition of God, an infinite good, and any the most excellent, yet still limited operation of the creature. For as water in its own nature riseth no farther than the spring whence it first issueth; so the endeavours of nature could never have raised man, without a mixture of God’s mercy, unto a higher degree of happiness, than should have been proportionable to the quality of his work.

But now having in Adam utterly disabled ourselves to pay that small price, at which God was pleased to rate our glory; all those who are restored thereunto again, must acknowledge both it, and Christ the purchaser of it, as a free gift of Almighty God, by them so far undeserved, as he was, before the promise, unknown and unexpected. …

Even Adam in innocency could not be without an assent and firm belief, that the faithful God would perform the promise of life, made and annexed unto the covenant of works. But this faith could not be the merit of life, but the fruit and effect of merit, or rather obedience anteceding; for his performance of the law (in the right whereof he had interest unto glory) preceding, there should immediately from thence have issued, by faith, a prepossession (as it were) and pre-apprehension of that glory, which, by virtue of that legal obedience, he should have had interest unto.</p></blockquote>

<blockquote><p>The first sort of persons who are slighters of this great salvation, are those persons who go about to establish their own righteousness, and will not submit to the righteousness of Christ; (in a word) it is that sort of persons who think they may win to heaven by a Covenant of Works, and will not take the Gospels way of travelling to heaven in the Covenant of Grace. And surely there is not a person here who hath not that cursed inclination to be as little obliged to Christ (for his salvation) as he can; we would go to heaven without the way, which is Christ. And (believe me) there are many in this Congregation who go thus about to establish their own righteousness. And I shall propose six sorts of persons who fall under this first rank.

The first sort are those who trust on their own civility, and think that will carry them to heaven; those are the persons who go about to establish their own righteousness. Say they, I defy the world to say any thing to me, I was overmore an honest man and I trust therefore that I shall go to heaven; but I say to thee, (O Atheist that thou art) thou shalt never win to heaven by those means, till thou come to Christ with this, All my righteousness is like filthy rags.

The second sort are those who build their confidence upon their denial of their good Works, but yet come never this length to make use of Jesus Christ.

The third sort are those who build their confidence upon their duties; they think they will come to heaven by their good prayers, by their reading, and by their fasting, (like unto that Pharisee, Luke 18. 11.) I thank God I am not like other men; for I fast twice in the week, I pay tithes of all that I possess: But I say unto thee, thy duties will never bring thee to heaven if Christ he not the end of all thy duties, nor can you perform a duty without him.

The fourth sort of Persons who fall under this first rank of slighters of the great salvation, are those who trust on their convictions; if they have once been convinced of their sin and miserable estate, they think there is no more to do, Christ will never reject them, so they sit down and build their hope upon those convictions.

The fifth sort of persons are those who build their confidence upon their resolutions; say they, oftentimes I have resolved to be a better man than I am, therefore I think (which is the fearful delusion of many) that God will accept the will for the deed; but it had been good for many such a word had not been in the Bible; or that their cursed eyes had never read it. But know this that though thou hadst as strong resolutions as Peter, or as good wishes as Balaam’s had, if thou never labour to bring them to practice, God shall say to thee, Depart from me, I know you not: Any of you who build upon your resolutions, you will build upon a sandy foundation, these being many times a goodness but like the morning dew,

And the sixth sort of persons who fall under this first rank of slighters of the great salvation (and wherein the evil is most subtle) are those who build their salvation upon their graces; these also go about to establish their own righteousness; but I say to such, Their graces cannot be the foundation of their hope, though they may be as evidences to strengthen their hope. Now are there none here who fall under this first rank of slighters of the great salvation? or are there none here who will confess that they have gone about to establish their own righteousness?

I say to thee who wilt confess, put a rope about thy neck, and come to Christ; for he is a merciful King: I say to thee, Come to Christ with this, All my righteousness is like filthy rags; and if thou wilt come with this in sincerity, he shall say, Bring forth the white robe and put upon him. If thou canst be brought to speak that in sincerity to Christ, there shall be no more betwixt Christ and thee, but Come and clothe him with the whole robe.</p></blockquote>

heir+fasting%2C+%28like+unto+that+Pharisee%2C+Luke+18.+11.%29+I+thank+God+I+am+not+like+other+men%3B+for+I+fast+twice+in+the+week%2C+I+pay+tithes+of+all+that+I+possess%3A+But+I+say+unto+thee%2C+thy+duties+will+never+bring+thee+to+heaven+if+Christ+he+not+the+end+of+all+thy+duties%2C+nor+can+you+perform+a+duty+without+him.%0A%0AThe+fourth+sort+of+Persons+who+fall+under+this+first+rank+of+slighters+of+the+great+salvation%2C+are+those+who+trust+on+their+convictions%3B+if+they+have+once+been+convinced+of+their+sin+and+miserable+estate%2C+they+think+there+is+no+more+to+do%2C+Christ+will+never+reject+them%2C+so+they+sit+down+and+build+their+hope+upon+those+convictions.%0A%0AThe+fifth+sort+of+persons+are+those+who+build+their+confidence+upon+their+resolutions%3B+say+they%2C+oftentimes+I+have+resolved+to+be+a+better+man+than+I+am%2C+therefore+I+think+%28which+is+the+fearful+delusion+of+many%29+that+God+will+accept+the+will+for+the+deed%3B+but+it+had+been+good+for+many+such+a+word+had+not+been+in+the+Bible%3B+or+that+their+cursed+eyes+had+never+read+it.+But+know+this+that+though+thou+hadst+as+strong+resolutions+as+Peter%2C+or+as+good+wishes+as+Balaam%E2%80%99s+had%2C+if+thou+never+labour+to+bring+them+to+practice%2C+God+shall+say+to+thee%2C+Depart+from+me%2C+I+know+you+not%3A+Any+of+you+who+build+upon+your+resolutions%2C+you+will+build+upon+a+sandy+foundation%2C+these+being+many+times+a+goodness+but+like+the+morning+dew%2C%0A%0AAnd+the+sixth+sort+of+persons+who+fall+under+this+first+rank+of+slighters+of+the+great+salvation+%28and+wherein+the+evil+is+most+subtle%29+are+those+who+build+their+salvation+upon+their+graces%3B+these+also+go+about+to+establish+their+own+righteousness%3B+but+I+say+to+such%2C+Their+graces+cannot+be+the+foundation+of+their+hope%2C+though+they+may+be+as+evidences+to+strengthen+their+hope.+Now+are+there+none+here+who+fall+under+this+first+rank+of+slighters+of+the+great+salvation%3F+or+are+there+none+here+who+will+confess+that+they+have+gone+about+to+establish+their+own+righteousness%3F%0A%0AI+say+to+thee+who+wilt+confess%2C+put+a+rope+about+thy+neck%2C+and+come+to+Christ%3B+for+he+is+a+merciful+King%3A+I+say+to+thee%2C+Come+to+Christ+with+this%2C+All+my+righteousness+is+like+filthy+rags%3B+and+if+thou+wilt+come+with+this+in+sincerity%2C+he+shall+say%2C+Bring+forth+the+white+robe+and+put+upon+him.+If+thou+canst+be+brought+to+speak+that+in+sincerity+to+Christ%2C+there+shall+be+no+more+betwixt+Christ+and+thee%2C+but+Come+and+clothe+him+with+the+whole+robe.%E2%80%9D%0A%0A%E2%80%94+Andrew+Gray%2C+The+great+salvation+offered+and+tendered+first%2C+by+Christ+himself%2C+and+then+by+his+holy+apostles%2C+with+the+inevitable+destruction+of+all+that+neglect+it%3A+in+the+sermons%2C+reprinted+by+that+eminent+servant+of+Christ%2C+Mr.+Andrew+Gray%2C+formerly+Minister+of+the+Gospel+in+Glasgow%2C+%28London%3A+H.+Barnard%2C+1694%29%2C+pp+9-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6eb3a4874c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6eb3a4874c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/12/30/andrew-gray-on-those-who-slight-salvation-by-seeking-it-under-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>§124. XII. Man, therefore, by the very fact that he was made according to God’s image, has been constituted as in a covenant with God. I call this covenant or pact a firm agreement in mutual obligation because God bound Adam by oath unto loving and seeking him as his God, that is being examined also in an ardent attachment to God together with obedience throughout the examination period, performed to God’s eternal glory in him who will be revealed in beatific life. And in turn he offered to Adam the assurance of what must be expected for standing in uprightness and rectitude, and for observing the law of examination, and from him, as his God, for striving after that revelation of God’s glory in himself, and the blessing in the multiplication of his posterity with God’s image. This is already clearly evident from what has been said.

§125. XIII. In this pact, heavenly life is considered as the reward that must be reckoned according to what is owed. This is usually called merit. But what the nature of this merit would be must be considered. It is not condign. Man is able to pay nothing to God, God accepts nothing from his hands, it is not profitable or beautiful according to man’s work. Man owes everything to God. See Luke 17:10. It, therefore, remains that merit is by the covenant.</p></blockquote>

<blockquote><p>Mr. Reynolds–The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se [valuable in itself], of sufficient value to all, nay, ten thousand worlds. There are two Adams, one a fountain of misery, and the other of mercy… To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.</p></blockquote>

</figure><figure class="quote" id="q-49b66891f4" data-kw="">
<blockquote><p>This deed of gift and grant, or authentic gospel-offer is expressed in so many words, ‘For God so loved the world, that he gave his only begotten Son, that whosoever believes in Him should not perish, but have everlasting life’ (John 3:16). Where the gospel comes, this grant is published, and the ministerial offer made, and there is no exception of any of all mankind in the grant. If there was, no ministerial offer of Christ could be warrantably made to the party excepted, more than to the fallen angels; and without question, the publishing and proclaiming of heaven’s grant unto any, by way of ministerial offer, presupposes the grant, in the first place, to be made to them: otherwise, it would be of no more value than a crier’s offering of the king’s pardon to one who is not comprehended in it. This is the good old way of discovering to sinners their warrant to believe in Christ; and it does indeed bear the sufficiency of the sacrifice of Christ for all, and that Christ crucified is the ordinance of God for salvation unto all mankind, in the use-making of which only they can be saved; but not an universal atonement or redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, … with Notes by the Rev. Thomas Boston (London: Tegg, 1837), p. 106, Notes of Boston</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

n&amp;text=This%20deed%20of%20gift%20and%20grant%2C%20or%20authentic&amp;text=saved%3B%20but%20not%20an%20universal%20atonement%20or%20redemption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b2d7f4b54a" data-kw="">
<blockquote><p>52. Given the inherently diverse and manifold structure of the ordinances of civil government and the Church (not to mention their de facto material structures), in their varied subjects, authorities, objects, purposes, ends, means, adjuncts, effects, relations to each other and how they relate differently to God and Christ,† the phrases “God” and “Christ centered voting” are simplistic and unhelpful. † See ed. Fentiman, All of George Gillespie’s Writings on Christ’s Mediatorial Kingdom is the Church Only (RBO, 2014), pp. 9-10 &amp; 18-27 One can talk about “Christ centered mowing the lawn” or “plumbing,” as Christians ought to mow their lawn and do plumbing in faith to Christ and support his Church by it if possible, perhaps by mowing a church’s lawn or fixing some of their leaky pipes, but the nature, science and work of mowing the lawn and plumbing, or their immediate, nearest ends, do not center around Christ, but around mowing the lawn and plumbing. Likewise, “Christ centered voting,” or “politics,” is most directly centered around voting and politics, and “Christ centered chess” is difficult to appreciate. On the other hand, trusting Christ to save us from our sins, growing in the knowledge of Christ and worshipping Him are Christ centered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses on the Ethics of Civil Voting</cite>, (2024), ‘Christ Centered Voting’ at ‘On Voting’ (RBO)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

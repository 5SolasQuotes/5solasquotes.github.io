<main class="wrap"><figure class="quote" id="q-ec7ec52a0c" data-kw="">
<blockquote><p>A part coming to a whole does not give esse [existence] to the whole, but receives it, because it is perfected by the form of the whole. For if it remained distinct, as before, it would not receive the esse of the whole, but would either have proper esse or none. But the human nature united to the Word is not informed by the Word, but remains simply distinct. Therefore it either has no esse [denied], or [a] proper [esse of its own, affirmed].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as trans. Richard Cross, Union &amp; Communion | p. 14, from Ord. III, d. 6, q. 1, n. 26 (Vatican ed., IX, 240)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a0c02fe67f" data-kw="Communion Faith Submission">
<blockquote><p>On the part of the saints, it is their free, willing consent to receive, embrace, and submit to the Lord Jesus, as their husband, Lord, and Saviour—to abide with him, subject their souls to him, and to be ruled by him for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion with God</cite>, Part 2, ch. 3, “We Freely Embrace Him”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>

</figure><figure class="quote" id="q-6fabee8190" data-kw="">
<blockquote><p>It should be noted that assumption and hypostatic union are not the same thing. Assumption speaks of the action in the agent assuming and the passion in the patient assumed. Union implies the relationship that follows from this. To be united may be said equally of the divine and human natures in the incarnate Word; but to assume actively is said only of the Word’s divine nature, and to be assumed is said only of the human nature. It cannot be said of the Word’s divinity that it is assumed, though it can be said that it is united. Thus, assumption and hypostatic union do not have the same meaning. Assumption, considered actively and passively, is what establishes the hypostatic union as a consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dolezal.html">James Dolezal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’Neither Subtraction, Nor Addition: The Word’s Terminative Assumption of a Human Nature’ Nova et Vetera</cite>, vol. 20, no. 1 (Winter, 2022), fn. 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-e5278482a5" data-kw="Mediator">
<blockquote><p>That the saints are nearer unto Christ than angels are, as I told you before; he is so a head to men as he is not to them. Both their union and ours with God is by Christ; now, if we be more united to Christ than they are, then we are more nearly united to God too; more nearly united to Christ we are, for he is our brother, he hath our nature, he hath more of ours, he hath done more for us; we are sons by adoption in him, he is our husband. To which of all the angels was it said that Christ is their husband? Of which of all the angels is it said that Christ is their Saviour?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon X (Eph. 1:10), Obs. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-e7069eb1a8" data-kw="">
<blockquote><p>The person of the Word subsists in two natures: in one, from which he has first esse, and in another (as it were adventitious) from which he has second esse, just as if Socrates were said in some way to subsist in humanity and whiteness. But… it is not generally held that the person of Christ is composed, speaking properly of composition, that is, from act and potency (as from matter and form), or from two potentialities (such as are those things which are called by Aristotle elements that integrate a whole nature). Therefore the authoritative texts of Damascene, which speak of the person as composed, should be expounded by saying that both divine and human natures are as truly there as if they were to compose a person, but without confusion, so that there is no third thing from them, since they do not make a composition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as trans. Richard Cross, Union &amp; Communion | p. 14, from Ord. III, d. 6, q. 1, n. 26 (Vatican ed., IX, 240)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

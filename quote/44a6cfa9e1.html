<blockquote><p>…considerable inconveniences, which follow from the introduction, affectation and imposition of a ceremonial way of worship under the Gospel… 2. There is a great obstruction to edification and the salvation of souls [due to the obstructing of spiritual worship and knowing God truly: spiritually as a Spirit]: Beloved, that man understands little of the worth of a soul, that does not value the salvation of one soul, before ten thousand of those unnecessary ceremonies. Better all the organs in the world broken, all material temples leveled with the ground, all sacred garments (as they are accounted) of ministers, cast into a fire, than one soul lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660), p. 17</span></figcaption>

<blockquote><p>II. A Voluntate Dei, ‘from the will of God’. This is the other reason: ‘For the Father seeks such to worship Him.’ [Jn. 4:23] God requires such worship and worshippers. The foundation of this reason is this: The rule of worship is not mans fancy, but God’s will: Men’s fancies and wills are infinitely various, and therefore those that have gone that way, have been divided into a thousand varieties; they worship they know not what, as v. 22. Only God’s will is the stable rule: None knows the mind of God but the Spirit of God: Now this is the worship God requires in Gospel times. Argument Second: From the end [design] of worship. Look what the ends of worship are, such must the worship be: And that was the reason why the Jewish worship was so much typical, because the end of it was to represent Christ; And that end being now attained, and Christ exhibited [revealed], we must consider what were and are the further ends of worship. Now the ends are of two sorts.

1. In reference to God.

2. In reference to men. And both will show us that the worship must be spiritual.

I. In relation to God; so it is double:

      1. To please God: this is finis operis &amp; operantis too [‘the end of the work, and of working’], (if a man be sincere) Ps. 19:14, ‘Let the words of my mouth and the meditation of my heart be acceptable in thy sight.’ Now it is only spiritual worship that can please God: That man does but little consider the nature of God, that thinks God is pleased with the bowing of the knee to an altar, no, it is the bending of the heart that God respects. It is not an organ in a church, but the organ of a gracious heart, and melody in the heart that pleases God.

      2. To exalt God amongst men, to render Him glorious in the eyes of the world: Now how is that done? Do you think that it makes God glorious, when men seek to honor Him with bodily and external services? No, you cannot dishonor God more than by giving Him such a worship as begets a carnal representation of God, etc. And when God would set Himself forth in his glory, He represents Himself in a spiritual manner, and He takes them off from all corporeal thoughts and fancies: ‘God is a Spirit.’ ‘To whom will you liken Me?’ ‘You saw no shape.’ ‘God dwells not in temples made with hands.’

II. In reference to men; so the ends of worship are purely spiritual: such as these (for I can but name them) the elevation of the soul to God, and its assimilation to Him, the union of man with his Creator, the supply of the soul’s spiritual necessities, and the conduct of a sinner to glory, and all these are spiritual works, and to be done by spiritual helps, and therefore evangelical worship must be spiritual worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660), pp. 13-14 Poole was an English puritan.</span></figcaption>

line</a></div>

<blockquote><p>Lastly, God’s spirit works not with ceremonies, and so they are as the offering of swines’ blood and the slaying of a man; and so abomination to God, Isa. 66:3.

2. The Holy Spirit is merited to us by Christ, Jn. 16:14, “He shall receive of mine and show unto you”: but who can say that the grace of joy in the Holy Ghost, wrought by the droning of organs and the holiness taught by surplice, is a work of the spirit merited by Christ as our High Priest?

3. God has made no promise that He will work by ceremonies, for the Spirit works not without the Word; so then I might resist the working of the Spirit and not sin against the Word; and this is Anabaptists’ Enthusiasm: If God work not by them, they be vain and fruitless; and the idol is unlawful for this [reason], that ‘it profits not’. Also, the Spirit’s action is either natural or supernatural here: If natural, it is a natural work, and a natural spirit, and to be rejected: If supernatural, we may devise means to produce supernatural effects: men’s ceremonies can produce supernatural joy, comfort, peace, and acts of grace purchased to us by Christs merit; this is a miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 136</span></figcaption>

%E2%80%99s%20spirit%20works%20not%20with,Christs%20merit%3B%20this%20is%20a%20miracle&amp;text=Lastly%2C%20God%E2%80%99s%20spirit%20works%20not%20with%20ceremonies%2C%20and&amp;text=us%20by%20Christs%20merit%3B%20this%20is%20a%20miracle" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the temple destroyed? Is the temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the temple or the synagogue the model on which the Church of the New Testament is formed? Does the Old Testament itself point to anything but ‘the fruit of the lips’ [Heb. 13:15] as the peace-offering or thank-offering of gospel times? Is there a trace in the New Testament of any other mode of praise? For my part I am persuaded that if the organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fullness — against the substitution again, in our whole religion, of the formal for the spiritual, the symbolic for the real.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in James Gibson’s, The Public Worship of God</cite>, (1869), p. 107 Candlish was a leading minister in the Free Church of Scotland.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the temple destroyed? Is the temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the temple or the synagogue the model on which the Church of the New Testament is formed? Does the Old Testament itself point to anything but ‘the fruit of the lips’ [Heb. 13:15] as the peace-offering or thank-offering of gospel times? Is there a trace in the New Testament of any other mode of praise? For my part I am persuaded that if the organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fullness — against the substitution again, in our whole religion, of the formal for the spiritual, the symbolic for the real.”

<blockquote><p>Fifthly, some consider instruments to be a mere circumstance rather than a real element of worship, so the Church can use them or not, as it sees fit. That there are such circumstances the Westminster Confession acknowledges: “There are some circumstances concerning the worship of God . . . common to human actions and societies, which are to be ordered by the light of nature, and Christian prudence, according to the general rules of the word, which are always to be observed” (1:6). However, God did not treat instruments as mere circumstances. They had no place in Old Testament worship until He put them in it by His express command. And He has never put them into New Testament worship. Plus, to class something as a mere circumstance rather than an element of worship, it must be common to human society and necessary. Appointing a suitable time and place to meet for public worship is a circumstance of worship, because without that no gathering of people could be possible, and is done for all orderly public meetings. But singing with instruments is not necessary: it may be done, but it does not need to be done.</p></blockquote>

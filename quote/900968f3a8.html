<main class="wrap"><figure class="quote" id="q-900968f3a8" data-kw="">
<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9527c70aca" data-kw="">
<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship… (1633)</cite>, pp. 495-96</span></figcaption>

</figure><figure class="quote" id="q-926b5fe04f" data-kw="">
<blockquote><p>First, that God offers to the men of this world, helps and means, either of the knowledge of God in Nature, or of grace in Christ: and that to this end, to lead them to repentance and salvation… Thus God offered to the carnal Israelites means of grace to purge them, to turn them, Prov. 1:13, to gather them, Mt. 23:37, to convince them, Jn. 16:8-9, to draw them with cords of man and bands of love, Hos. 11:4, to dress them to bring forth good fruit, Isa. 5:4. Secondly, that the means God uses for these good ends are in some measure sufficient (if they be not hindered by men) to bring them to the attainment of these ends: for when God says Himself, He uses these means for these ends; for us to say, these means are not sufficient for these ends, seems to me to derogate from the wisdom and sufficiency of God, whose works are all of them perfect, Deut. 32:4, and so sufficient for the ends for which He wrought them. Yet God forbid I should doubt of that which our Savior tells the Jews, ‘No man can come to Christ, except the Father draw him,’ Jn. 6:44, by the same almighty power and authority whereby He sent Christ into the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s Clearing Certain Doubts Concerning Predestination... (London, 1646), 5th Doubt, Question 5</cite>, pp. 207-8</span></figcaption>

</figure><figure class="quote" id="q-1224286efb" data-kw="">
<blockquote><p>Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology (P&amp;R, 1994), vol. 2, 11th Topic, ‘On the Law of God’, Question 24, ‘What was the end and use of the ceremonial law under the Old Testament?’, section 3</cite>, p. 146</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.”

<blockquote><p>53. For just as a physician who abolishes and removes disease and restores health; a master who abolishes and takes away servitude and grants freedom to a slave; a lord who breaks and destroys a prison and releases a captive and exalts him to the highest dignity – these are not said to use force upon the sick man, the slave, or the captive. So neither does God use force upon one to whom He provides that renewing grace. And just as it is foreign to debate whether a sick man is restored to health irresistibly, a slave to liberty, a captive to dignity, so it is foreign to this matter to dispute whether God’s renewing grace operates irresistibly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-c-waser.html">Johann C. Waser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Consideration of a Theological Question: Whether the grace of God is a Force, &amp; Whether it is either Resistible or Irresistible</cite>, (fl. 1628-1667) 22 pp. tr. AI by Confetti, pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a998d1ddc8" data-kw="">
<blockquote><p>LVIII. 3. The will of God is also distinguished into that by which He wills to do or to prevent something, and which is called “the will of his good pleasure,” or rather “of his pleasure” (Ps. 115:3), and into that by which He wills something to be done, or to be omitted, by creatures endued with understanding, and which is called “the will [signi] which is signified.” The latter is revealed; the former is partly revealed, and partly hidden. (Mk. 3:35; 1 Thess. 4:3; Dt. 29:29; 1 Cor. 2:11-12) The former is efficacious, for it uses power, either [tanta] so much as cannot be resisted, or [tali] such a kind as He certainly knows nothing will withstand: (Ps. 33:9; Rom. 9::19) The latter is called “inefficacious,” and resistance is frequently made to it; yet so that, when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28) To this twofold Will is opposed the remission of the Will, which is called “Permission,” and which is also two-fold. The one, which permits something to the power of a rational creature, by not circumscribing its act with a law; and this is opposed to “the revealed Will.” The other is that by which God permits something [potentiae] to the capability and will of the creature, by not interposing an efficacious hindrance; and this is opposed to “the Will of God’s pleasure” that is efficacious. (Acts 14:16; Ps. 81:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-arminius.html">James Arminius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of James Arminius</cite>, tr. James Nichols (Auburn: Derby, Miller, Orton, 1853), vol. 1, Public Disputations, Disputation 4, ‘On the Nature of God’, pp. 453-54 Arminius was a theological professor at Leiden. He tended not to go into controversial things in his Public Disputations.</span></figcaption>

</figure><figure class="quote" id="q-d562dd76f8" data-kw="">
<blockquote><p>Whether we can Resist the Grace of God, or No? But now arises an other doubt as touching our nature as it is now fallen and corrupt, whether it can resist the grace of God and his Spirit being present, or no? (There are sundry degrees of grace of God) I think we must consider that there are, as it were, sundry degrees of the help or grace of God: for his might and abundance is sometimes so great that He wholly bows the will of man and does not only counsel, but also persuade. And when it so comes to pass, we cannot depart from the right way, but we are of God’s side and obey his sentence. Wherefore it was said unto Paul: “It is hard for thee to kick against the pricks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Judges</cite>, ch. 9, pp. 167-68</span></figcaption>

</figure><figure class="quote" id="q-37218675c8" data-kw="">
<blockquote><p>III. But they [Arminians] do unwisely prove that which is not in controversy. For we do not teach, we do not acknowledge that irresistibility which they attribute to us. This conclusion therefore does not hurt us, who do willingly confess that the Holy Ghost does not always so work in men’s hearts that He takes away all resistance… the question is, whether it may be that they may never be converted, and may finally resist the spirit of adoption. To the proving of this, the places which speaks of reprobates, which we confess do finally resist God calling, and do want the spirit of adoption, are plainly besides the purpose. Finally, these sectaries do not prove that in all these places [of Scripture] it is spoken of a final resistance, of which alone it is spoken here.</p></blockquote>

<blockquote><p>willed and intended the obedience and salvation of the angels who apostatised, inasmuch as he furnished them with gifts, fit in themselves and suitable, to perform obedience and obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | This granting of various gifts and graces to creatures is understood by Davenant with Aquinas’s doctrine of God’s providence in view. Davenant illustrates this order of providence by observing from the natural world that God has provided for us many bodily remedies that are applicable to heal us, though not infallibly ordained to heal us. In the realm of theology, Davenant explains God’s providential will in furnishing the angels, both elect and nonelect, with many gifts ordained by God to the end of the angels’ felicity, even though not every angel obtained such felicity. According to this will, God may be said to have, pp. 152-53</span></figcaption>

<main class="wrap"><figure class="quote" id="q-386ba41121" data-kw="" data-pol="">
<blockquote><p>Doth he succeed him in his personal qualifications, which were of such extraordinary advantage unto the church of God in his days, — his faith, love, holiness, light, and knowledge? You will not say so. Many of your popes, by your own confession, have been ignorant and stupid; many of them flagitiously wicked, to say no more.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>A Vindication of the Animadversions on “Fiat Lux”</cite>, ch. 8</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1494d5bc06" data-kw="" data-pol="">
<blockquote><p>Let the weathercocks spin round as much as they please, but we must have fixed points of faith. Unless we have infallibility somewhere, faith is impossible. The true faith teaches us facts which cannot be questioned. Where is faith to build if there be no rock, and nothing left us but shifting sand? As for us, we find infallibility in the Scriptures of the Old and New Testament, and our one desire is to have them opened up to our minds by the Holy Spirit.</p></blockquote>
<figcaption>— <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a>, <cite>An All Around Ministry</cite>, ch. 10, The Evils of the Present Time, pp. 310–311</figcaption>

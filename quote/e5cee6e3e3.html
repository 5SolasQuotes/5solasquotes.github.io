<main class="wrap"><figure class="quote" id="q-e5cee6e3e3" data-kw="">
<blockquote><p>We all know the intention of the end goes in the intention before the action, but not as an essential cause to make an evil action good, or [to] make an indifferent action necessary and honest: A good intention does make a good action good and better, but that a good intention (as idolators are full of good intentions) can never so season the means, as… that it can make evil to be good. Vasquez condemns the Fathers of ignorance, because they said, Propositum bonum excusat malum opus [A proposed good excuses a bad work]: so Cassianus said [that] it was lawful to lie for a good end, and Chrysostom and Ambrose said the same, as Vasquez says: see Aquinas for this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), p. 215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>Question 2. What are those things which make an action to become not voluntary. 4th Answer. Nothing at all but either absolute violence of constraint, or chance which could not be foreseen or prevented. And for such things as are done through absolute violence or mere chance, they have neither the nature of obedience or sin. As if one should be forced to offer incense or bow the knee before an idol, or should merely by chance kill another, Deut. 19:5-10. Question 3. What are we to think of those actions which are done through ignorance? 5th Answer. First, that ignorance which is in some sort a cause of the action (so that if a man knew what he did, he would not do it), if it be involuntary, both in itself and in its cause, that is, not affected nor procured, nor tolerated, does make the action merely casual and involuntary, and so excuses from sin.

6. Secondly, ignorance of the Law does never wholly excuse, because all men are bound to know the Will of God: but yet it does somewhat lessen the fault if it be not affected, 1 Tim. 1:13; John 4:41; Acts 3:17. But if it be affected, it is of itself a sin and so does not diminish, but rather increase the guilt of other sins, 2 Pet. 3:5.

7. Thirdly, an ignorance of the fact, if a man has used such diligence as he ought, does excuse him, because by such an ignorance the fact is made casual. So Jacob being deceived lay with Leah, whom he took to be Rachel, Gen. 29. But if due diligence have not been used, ignorance of the fact does not altogether excuse, although it do somewhat lessen the fault. And this seems to have been the case of Abimelech, Gen. 20:5. Question 4. What are we to judge of those actions which are done through fear? 8th Answer. First, fear does not simply make an action involuntary: but does, considering the circumstances of time and place, etc., impel a man to will this or that. As appears in that known instance of the merchant, who is induced through fear of death to throw away his merchandise into the sea. Fear therefore does never wholly excuse from sin: yea more, fear itself is oft a sin forbidden, and a cause too of most grievous sins, Mt. 10:26; Phil. 1:28; 1 Pet. 3:14; Apoc. 21:8. Although therefore, a great fear or terror, such as is wont sometimes to trouble even a man of good courage before men, be accounted for a good excuse, and is of force to make contracts done through fear void, yet before God such an excuse will not be taken. 9. Secondly, yet that sin which is committed through some strong terror, is not so grievous (if other things be alike) as that which is committed of the voluntary inclination of the will without any such fear of danger, because in fear the temptation is stronger: and such a fall, if repentance follow, does proceed not so much from malice, as from infirmity and perturbation. And this was Peter’s case when he denied Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, p. 92-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

<blockquote><p>But touching an erring conscience, the question is not whether an erroneous conscience does so tie that we must do nothing on the contrary, nor is the question whether the nearest, actually obliging rule, be conscience; the Arminians tell us [that] though the Word of God, of itself, and by itself, have power to oblige, yet it actually obliges no man except it be understood, and so is believed to be understood, after we use all possible diligence and prudence, for no man is obliged to follow the true sense of the Word against his conscience, though it be erroneous; But we think the Word of God is both the farest and nearest, and the only obliging rule, and that the ditement [judgment] of the conscience does neither bind potentially nor actually, but is a mere [in Greek], a messenger and an official relater of the will and mind to God to us, and all the obliging power is from the Word; [???] the messenger of a king and judge is not the obliging [???] that ties the subject, or the herald’s promulgation of the Law, is no obliging rule; for [the] promulgation of heralds is common both to just and to unjust laws, and certainly unjust laws from a just prince lay no band on the conscience or on the man, far less can the promulgation, as the promulgation, lay any bands on the conscience; the word of a messenger and herald is at the best but a condition, or the approximation of the obliging power to us, but all the obliging power is from the king and the judge. It is most false then, that these Libertines say that the Word does not actually oblige except it be understood, for the understanding, information and indictment of conscience does not add any actual obligation to the Word that it had not before, it only is a reporter, to carry both the Word and the actual obligation to the man; the herald promulgating the law adds no obligation, actual or potential, to the law that it had not before, only it makes an union in distance, and near application and conjunction between the actually obliging law and the understanding knowledge of the person or subject, who is obliged to keep the law; though it be true the fire cannot actually burn but as timber is cast to it, yet the fire has from its own nature both potential and actual burning, not from the act of casting the timber in the fire; Nor is this a concludent reason, ‘no man is obliged [to] follow how the true sense of the Word against his conscience, though erroneous, ergo [therefore] the erroneous conscience does oblige, or ergo, actual obligation to obedience is not from the Word, but from the conscience;’ no more than this is a good consequence: no man is obliged to obey the Law in itself, just contrary to the promulgation of an erring and mistaking herald, ergo, the mistaking herald’s promulgation gives to the Law actual obligation over the subject; for it only follows [that] we are not to do contrary to the actual indictment of an erroneous conscience, but not obliged to follow the erroneous conscience; Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience. … …an erroneous conscience must be a transgressing conscience, and it is a contradiction that a faculty sinning should oblige to obedience to the Law of God, in the same consideration, because it sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 11, ‘Of the Obliging Power of Conscience’, pp. 133-136. See the whole chapter for more.</span></figcaption>

egula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience. … …an erroneous conscience must be a transgressing conscience, and it is a contradiction that a faculty sinning should oblige to obedience to the Law of God, in the same consideration, because it sins.”

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience… (1649), ch. 11, ‘Of the Obliging Power of Conscience’, pp. 133-136. See the whole chapter for more.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+touching+an+erring+conscience%2C+the+question+is+not+whether+an+erroneous+conscience+does+so+tie+that+we+must+do+nothing+on+the+contrary%2C+nor+is+the+question+whether+the+nearest%2C+actually+obliging+rule%2C+be+conscience%3B+the+Arminians+tell+us+%5Bthat%5D+though+the+Word+of+God%2C+of+itself%2C+and+by+itself%2C+have+power+to+oblige%2C+yet+it+actually+obliges+no+man+except+it+be+understood%2C+and+so+is+believed+to+be+understood%2C+after+we+use+all+possible+diligence+and+prudence%2C+for+no+man+is+obliged+to+follow+the+true+sense+of+the+Word+against+his+conscience%2C+though+it+be+erroneous%3B+But+we+think+the+Word+of+God+is+both+the+farest+and+nearest%2C+and+the+only+obliging+rule%2C+and+that+the+ditement+%5Bjudgment%5D+of+the+conscience+does+neither+bind+potentially+nor+actually%2C+but+is+a+mere+%5Bin+Greek%5D%2C+a+messenger+and+an+official+relater+of+the+will+and+mind+to+God+to+us%2C+and+all+the+obliging+power+is+from+the+Word%3B+%5B%3F%3F%3F%5D+the+messenger+of+a+king+and+judge+is+not+the+obliging+%5B%3F%3F%3F%5D+that+ties+the+subject%2C+or+the+herald%E2%80%99s+promulgation+of+the+Law%2C+is+no+obliging+rule%3B+for+%5Bthe%5D+promulgation+of+heralds+is+common+both+to+just+and+to+unjust+laws%2C+and+certainly+unjust+laws+from+a+just+prince+lay+no+band+on+the+conscience+or+on+the+man%2C+far+less+can+the+promulgation%2C+as+the+promulgation%2C+lay+any+bands+on+the+conscience%3B+the+word+of+a+messenger+and+herald+is+at+the+best+but+a+condition%2C+or+the+approximation+of+the+obliging+power+to+us%2C+but+all+the+obliging+power+is+from+the+king+and+the+judge.+It+is+most+false+then%2C+that+these+Libertines+say+that+the+Word+does+not+actually+oblige+except+it+be+understood%2C+for+the+understanding%2C+information+and+indictment+of+conscience+does+not+add+any+actual+obligation+to+the+Word+that+it+had+not+before%2C+it+only+is+a+reporter%2C+to+carry+both+the+Word+and+the+actual+obligation+to+the+man%3B+the+herald+promulgating+the+law+adds+no+obligation%2C+actual+or+potential%2C+to+the+law+that+it+had+not+before%2C+only+it+makes+an+union+in+distance%2C+and+near+application+and+conjunction+between+the+actually+obliging+law+and+the+understanding+knowledge+of+the+person+or+subject%2C+who+is+obliged+to+keep+the+law%3B+though+it+be+true+the+fire+cannot+actually+burn+but+as+timber+is+cast+to+it%2C+yet+the+fire+has+from+its+own+nature+both+potential+and+actual+burning%2C+not+from+the+act+of+casting+the+timber+in+the+fire%3B+Nor+is+this+a+concludent+reason%2C+%E2%80%98no+man+is+obliged+%5Bto%5D+follow+how+the+true+sense+of+the+Word+against+his+conscience%2C+though+erroneous%2C+ergo+%5Btherefore%5D+the+erroneous+conscience+does+oblige%2C+or+ergo%2C+actual+obligation+to+obedience+is+not+from+the+Word%2C+but+from+the+conscience%3B%E2%80%99+no+more+than+this+is+a+good+consequence%3A+no+man+is+obliged+to+obey+the+Law+in+itself%2C+just+contrary+to+the+promulgation+of+an+erring+and+mistaking+herald%2C+ergo%2C+the+mistaking+herald%E2%80%99s+promulgation+gives+to+the+Law+actual+obligation+over+the+subject%3B+for+it+only+follows+%5Bthat%5D+we+are+not+to+do+contrary+to+the+actual+indictment+of+an+erroneous+conscience%2C+but+not+obliged+to+follow+the+erroneous+conscience%3B+Nor+are+we+obliged+to+follow+what+our+conscience+says+is+true+and+good%2C+because%2C+or+upon+this+formal+reason+and+ground%2C+that+the+conscience+says+so%2C+more+than+we+are+to+believe+and+practice+what+the+Church+or+the+conscience+of+others%2C+%5Bwho+are%5D+the+Church%2C+the+learned+and+godly%2C+say%3B+for+we+make+not+the+word+of+the+Church+the+formal+object+of+our+faith%2C+but+%E2%80%98thus+saith+the+Lord%E2%80%99+only%2C+because+the+Church+is+but+a+company+of+men+and+so+our+faith+should+depend+upon+men%2C+even+though+holy+and+speakin

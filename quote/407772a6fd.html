<blockquote><p>…’It is a public offence’ (says the Author [an opponent]) ‘that they have worshipped God according to the precepts of men, etc.’ [Rutherford’s] Answer: This is the crime of conformity which I wish were publicly repented by all which have defiled themselves with submitting to an antichristian government and the will-worship of men, yet does not this make ministers no ministers, so as they must receive ordination to the ministry of new. Peter’s fall took not away his apostleship, nor Jonah’s flying from God, nor David’s adultery made them not leave off to be prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 2, ch. 4, section 5, p. 194</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7983f8bfd" data-kw="">
<blockquote><p>Besides, there were in the first churches continued for a while certain extraordinary gifts, that had their effects visibly on the outward senses of men, and tended not immediately unto the edification of the church in their faith, but unto the conviction of others, and vindication of the authority of them by whom the gospel was preached and propagated. Such was that gift of healing the sick, which being an especial effect of the Holy-Ghost for the advantage of the Church in those days, in some places it was accompanied by anointing with oil; but this being no universal practice, and used only in the exercise of a gift extraordinary, whose use and being are long since ceased, it never was appointed nor intended to be of continuance in the Church, which is not tied by the Lord Christ to the empty signs and shadows of things whose substance is not enjoyed: besides, no spiritual grace of the Covenant was ever intimated, sealed, or exhibited by that usage of anointing with oil. The first mention of it is, Mark 6:13 where its practice is reckoned among the effects of that extraordinary power which the Lord Christ committed unto his twelve disciples on their first sending out, and is referred unto the same series of miracles which they wrought in pursuit, and by virtue thereof, they cast out many devils, and anointed with oil many that were sick, and healed them. And by what is there recorded, the subsequent mention of it, James 5:14 is to be regulated, but now unto a real evangelical institution of worship, it is required: (1.) That it be a command of Christ manifested by his Word, or example proposed unto our imitation, Mt. 28:20. (2.) That it be given and enjoined unto the whole Church with the limitation of its administration expressed in the Word, 1 Cor. 11:25. (3.) That unto the due performance of it, Gospel grace be required in them that attend unto it. (4.) That it teach, or represent, or seal, or improve some grace of the Covenant, and have a promise of acceptation annexed unto it, and whatever is thus appointed, the Church is indispensably to continue in the observation of, unto the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Short Catechism on Worship</cite>, Question #13 1667 For the fuller context, see Owen above on the holy kiss, which section immediately precedes this section.</span></figcaption>

<blockquote><p>those constitutions and ceremonies which… strive to direct the worship constituted by God with respect to circumstantial matters of places and times, for εὐταξία καὶ εὐσχημονία, ‘good order and decency’… they acknowledge [in these] something divine and something human: they are divine with respect to the foundation, insofar as God generally prescribes that all things be done in good order and decently (1 Cor. 14:40), and human with respect to the particular determination, whereby this or that is said to aim at good order and decency.</p></blockquote>

<blockquote><p>Fourthly, the flux and reflux (so to speak) of several successive [seatings of] tables [for the Lord’s Supper in one congregation], where there is a great number to communicate, and the repeating, or pronouncing and applying to those several tables of receivers, the words, ‘Take ye’, ‘eat ye’, which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ, when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they [the Independents] who so charge us [the presbyterians], ever make good what they allege, unless they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection [1 Cor. 15:6] (suppose I say, there had been so many communicants), yet He had given them all at once the elements, and had said but once, ‘Take ye, eat ye’, and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not.</p></blockquote>

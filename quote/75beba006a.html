<main class="wrap"><figure class="quote" id="q-75beba006a" data-kw="">
<blockquote><p>I had never read one Socinian, nor much of any Arminians… and I remembered two or three things in Dr. [William] Twisse (whom I most esteemed) which inclined me to moderation in the five Articles [disputed between Arminians and the Reformed]: … 4. That the ratio reatus [defining rule of guilt] in our Original Sin, is first founded in our natural propagation from Adam, and but secondarily from the positive Covenant [of Works] of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

<blockquote><p>Adam alone committed it with an actual will; but to us it is communicated through generation, in the way that which has passed can be communicated, namely, by imputation” (tome 3, bk. 5, On the Loss of Grace, ch. 17). Original sin is an inherent and native iniquity; but yet that actual and free transgression of Adam is imputed to us. For we would be held neither by any guilt nor by any iniquity contracted from it, unless that act by which Adam violated the precept of God were ascribed to us by imputation.</p></blockquote>

</figure><figure class="quote" id="q-9c343373fe" data-kw="">
<blockquote><p>II. And if anyone would exactly view the manner and circumstances of Adam’s sin, he shall find that in every man, the character, and no obscure image, of that first sin, is deeply impressed: for there is engrafted in every man curiosity and desire of knowing those things which pertain nothing to him: and also a distrustful hesitation, and doubting of the Word of God: And as Adam laid the fault upon his wife, and his wife upon the Serpent, so is it natural to every man to cover his fault with another’s fault: Also flight and trembling at the meeting of God, lying, dissembling, and a sense of indecent nakedness are in all men by nature, and are derived into posterity from that fountain; and to these things we are not taught, but made, not instructed, but infected: to these things we do not only not need a master, but contrary to the teaching of masters, and to discipline, all stayes and bars being broken, we return to them, nature being conqueror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism… (1619; London, 1620), pp. 57-73 | 10. ‘Of the propagation of the sin of Adam to his posterity, where also of the traduction of the soul and of sin itself’</cite>, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><figure class="quote" id="q-6156ddcc2e" data-kw="Author of sin The Fall Original Sin">
<blockquote><p>It is true that nature has received a mortal wound, but there is a great difference between a wound inflicted from without, and one inherent in our first condition. It is plain that this wound was inflicted by sin; and, therefore, we have no ground of complaint except against ourselves.</p></blockquote>

<blockquote><p>8. Whether this guilt depends mediately or immediately upon the first sin of Adam is debated in the schools more subtly than profitably, since in either case the same thing is maintained and asserted against the Pelagianizing party. What is certain is that the judgment of God has intervened here; and therefore this consequence of the sin of the first parents in their posterity can, in this sense, be called imputed original sin.</p></blockquote>

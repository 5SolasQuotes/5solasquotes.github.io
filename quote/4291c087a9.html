<blockquote><p>[Old School] Presbyterians and Seceders, entertaining the same views on Church Government, and the doctrines of religion, ought to be united, but the difference in their opinions and practices on Psalmody keeps up the schism, and hence it is the bone of contention between the two bodies.

But while we would rejoice to see this middle wall of partition between us and our Presbyterian brethren broken down and destroyed, we are, at the same time, extremely anxious that the whole Christian world should adopt the inspired Psalter as the matter of their praise; and we feel assured that the Church — the whole Church — must come to this at last: for we look forward with joyous anticipations to that happy day when there will be a union, not only of Presbyterians and Seceders, but of the Church universal — of Jew and Gentile — a union not only of sentiment, but also of song, for the prediction is, (Isaiah lii. 8.) “Thy watchmen shall lift up the voice; with the voice together shall they sing: for they shall see eye to eye when the Lord shall bring again Zion.”

And if “when the Lord shall bring again Zion,” there is to be a union of voice in the praise of God, that praise must be taken from David’s Psalms. The Church can never settle down upon any other book or books as the standard of praise. The Seceders, and those who coincide with them in opinion, will maintain their ground: and presently the Jews will be restored once more to Divine favour, and will come in to back the advocates of David’s Psalms, or to lead the way in defence of truth on this as well as on other subjects, with an invincible and never-dying energy — the people of God will crowd around them from every side — ten men, out of all languages of the nations, shall take hold of the skirt of the Jew, because God is with him, and God himself will lead on his band of invincibles to a glorious and everlasting triumph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter II. Psalmody – The Question in Evangelical Guardian</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c5ca2861e3" data-kw="">
<blockquote><p>I. Although from what has been said in the preceding question concerning the obscurity of the church, it is easy to answer the proposed question (for if the church can sometimes be so obscured and concealed as to the nowhere conspicuous on the earth—which our opponents themselves acknowledge concerning the times of antichrist—why can we not say that our church certainly existed, but it was latent and obscured?) Because they do not cease to press us over and over again with this question in order to prove that our church did not exist at all at that time. Since it cannot be shown where it was, it was thus a novelty and of recent origin. We must see what reply must be given to such a postulate.

II. However, here before all things it must be observed: (1) that by our church (or the Reformed Church) is not meant that which by express title and notion was distinguished from other assemblies, but which by consanguinity and profession of the same doctrine as to articles of faith and true ecclesiastical communion was the same with hours of today. (2) The true and catholic doctrine is here to be distinguished from discipline, and ceremonies from dogmas, and in the dogmas the questions and maxims of the schools; or the private opinions of doctors are are to be distinguished from the necessary articles of faith to be embraced by the common faith of the church. Again, among those things which the church prescribes, some are of divine right (which are absolutely necessary to faith and salvation, in which the essence of Christianity consists); others are of positive right (which are indeed useful, but nevertheless so that nothing prohibits their being changed and reconstructed in the progress of time).

III. Before we answer the question, however, the absurdity and unfairness of the demand must be marked. First, it supposes a false hypothesis, which is the prime error (πρωτον ψευδος) of our opponents. Once this is denied and overthrown, whatever is built upon it must necessarily fall in like manner—namely, that the true church ought always to exist in the world with perpetual splendor. Since we have in the preceding question proved this to be most false and it is evident that there are times like that of Elijah in which the church lies hidden and is withdrawn from the sight of men, in vain are we asked to show where our church was. For it could lie hidden without splendor and prominence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.10.1–3</span></figcaption>

<blockquote><p>Mr. de Cluse in his prophesy [preaching amongst the Brownists] labored to prove separation from a true Church for any corruption, obstinately stood in this doctrine, was by another in prophesying there showed to be absolutely contrary to the place, Rev. 2:24; which how unsoundly it was concluded by our teacher was then observed by many… If these things be so, and be not redressed by the 〈◊〉 of this prophesy we must (according to Mr. de Cluse’s doctrine) make a new separation. How oft do the [Brownist] Brethren except one against another’s prophesying, by which, much heart-burning and strife is kindled between them? These things being well considered, I pray you well to mind whether this new way of prophesying on the Lord’s Day can be for the edification of the Church or not.</p></blockquote>

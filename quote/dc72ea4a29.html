<main class="wrap"><figure class="quote" id="q-dc72ea4a29" data-kw="">
<blockquote><p>2. Faith makes us children, as it is the vital principle. Hab. 2:4, ‘The just shall live by faith.’ All God’s children are living, none of them are still-born; now by faith we live. As the heart is the primum vivens, the fountain of life in the body, so faith is the fountain of life in the soul. 3. Faith makes us children, as it is the uniting grace; it knits us to Christ; the other graces cannot do this; by faith we are one with Christ, and so we are akin to God; being united to the Natural Son, we become adopted sons: The kindred comes in by faith: God is the Father of Christ; faith makes us Christ’s brethren (Heb. 2:11), and so God comes to be our Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes… (London: Smith, 1660)</cite>, ch. 19, sect. 3, p. 298</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-1125fa090f" data-kw="">
<blockquote><p>Regeneration is a benefit of God, by which our corrupted nature is renewed to the image of God by the Holy Spirit, 2 Pet. 1:4; Tit. 3:5; Gal. 4:6; 2 Cor. 3:7. That same is also called sanctification, and the gift of grace. Rom. 5. Also of schoolemen it is called an infused grace. Regeneration is either begun, or perfected: the former belongs to this life, the latter to the life to come… Regeneration of the soul is that whereby the powers of the soul are renewed. Tit. 3:5; Gal. 4:6.</p></blockquote>

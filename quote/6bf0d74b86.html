<main class="wrap"><figure class="quote" id="q-6bf0d74b86" data-kw="">
<blockquote><p>In an article on the Sabbath Alliance, the Free Church Magazine, edited by William M. Hetherington, warned that Sabbath-desecration would lead to the oppression of the working classes as they would no longer be guaranteed a day’s rest from their labours. This extract is therefore useful for reminding us that the first and second tables of the law cannot really be separated. Those who force their employees to work on the Lord’s Day are not loving their neighbours, and so their Sabbath-breaking is not only a sin against God but also a sin against their fellow-man:

We are delighted to hear that there is an active-movement began amongst the working classes on the subject. They have, of course, the most manifest interest in the protection of the Lord’s-day. It secures to them, by divine and human right, fifty-two whole days of rest out of the three hundred and sixty-five. Take these away from them, and they are reduced to the position of the veriest slaves, nay, to a position more degraded than that of any slaves in the world, and that without one farthing of compensation; for it is clear that they would get precisely the same wages for working six. But if the present course is unresisted, all labouring people will soon lose their Sabbaths. Railway officials are first employed, and already they feel the intolerable hardship. But why not also masons and labourers (as had already been the case in some parts of England), if the contractor has a piece of work to finish? The post-office officials at present work on Sabbath; but why not the bakers, as in London? Why not the carpenters? Why not the millers, as at Canonmills? In a word, there is no point to halt at, if the authority of the divine law is disregarded, and nothing will do but a determined combination to put down all public forms of Sabbath desecration. We rejoice, therefore, to find the working people taking up the question, and we shall be happy to record, from time to time, and to promote in every way, the success of this noble enterprise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/free-church-magazine.html">Free Church Magazine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Alliance’ in Free Church Magazine</cite>, iv, no. 47 (Nov. 1847), pp 337-8.</span></figcaption>

</figure><figure class="quote" id="q-a3d2ba703a" data-kw="">
<blockquote><p>We are especially to meditate upon and celebrate the work of redemption. We are especially joyfully to remember the resurrection of Christ, because that was Christ finishing the work of redemption; that was the day wherein he rested and was refreshed after he had endured those extreme labours that he underwent for our perishing souls. This was the day of the gladness of Christ’s heart. It was the day of his deliverance from the chains of death, and of our deliverance; for we are delivered in him who is our head. He, as it were, rose with his elect; he is the “firstfruits”; those that are Christ’s will follow [1 Corinthians 15:20, 1 Corinthians 15:23]. Christ, when he rose, was justified as a public person, and we are justified in him. This is the day of our deliverance out of Egypt.

We should therefore meditate on this with joy. We should have a sympathy with Christ in his joy. He was refreshed on this day; we should be refreshed, as those whose hearts are united with his. When Christ rejoices, it becomes all his church everywhere to rejoice. We are to say of this day, “this is the day that the Lord hath made” [Psalms 118:24].

But we are not only to commemorate the resurrection, but the whole work of redemption, of which this was the finishing. We keep the day on which the work [was] finished, because ’tis in remembrance of the whole work. We should on this day contemplate the wonderful love and {work of redemption}, and our remembrance of these things should be accompanied with suitable exercises of soul with respect to them. When we call to mind Christ’s love, it should be with the exercise of mutual love. When we commemorate this work, it should be with faith in the Savior. And we should praise God and the Lamb for this work, for his glory and his love manifested in it, in our private and public prayers, in talking of God’s wondrous works and singing divine songs.

Hence ’tis proper that Christ’s disciples should choose this day to come together to break bread, to celebrate the ordinance [of the] Lord’s Supper (Acts 20:7), because ’tis an ordinance instituted in remembrance of the work of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17, ed. Mark Valeri (New Haven CN: Yale University Press, 2000), pp 249-50.</span></figcaption>

</figure><figure class="quote" id="q-404369d6ed" data-kw="">
<blockquote><p>And truly this argument of theirs seems to me very preposterous, as if they meant to tie two extremes together without a medium. For who with reason can affirm: Because a man is not of the woman, but the woman of the man, etc. Therefore ought a woman to wear a veil or a hood on her head, by an argument fetched from the moral Law of their creation? Truly I have often heard that the whole Law of God was to be known by the discourse of reason, and was called moral… But whoever could from the dictate of reason know that a woman, because she was made of man and for man, ought therefore to wear a veil or hood on her head, especially in the Church? That she is therefore inferior to her husband, and that therefore she ought to be subject unto him, is not abhorrent from the discourse of reason; and because she is for that cause subject to her husband, reason dictates she ought to acknowledge it, but by what means or sign she should do it in the Church or elsewhere, custom seems only to have taught, especially in Christian churches, as the apostle intimates in this place. For we read not of any such custom in the Old Testament. Rebecca truly might (which they instance for an example), when she came near to Isaac, Gen. 24:65, take a veil and cover herself, as well for modesty as for reverence. But Judah thought Thamar to be an harlot because she covered herself with a veil, Gen. 38:14-15. So that from the beginning the covering of a veil was no certain sign of subjection…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And truly this argument of theirs seems to me very preposterous, as if they meant to tie two extremes together without a medium. For who with reason can affirm: Because a man is not of the woman, but the woman of the man, etc. Therefore ought a woman to wear a veil or a hood on her head, by an argument fetched from the moral Law of their creation? Truly I have often heard that the whole Law of God was to be known by the discourse of reason, and was called moral… But whoever could from the dictate of reason know that a woman, because she was made of man and for man, ought therefore to wear a veil or hood on her head, especially in the Church? That she is therefore inferior to her husband, and that therefore she ought to be subject unto him, is not abhorrent from the discourse of reason; and because she is for that cause subject to her husband, reason dictates she ought to acknowledge it, but by what means or sign she should do it in the Church or elsewhere, custom seems only to have taught, especially in Christian churches, as the apostle intimates in this place. For we read not of any such custom in the Old Testament. Rebecca truly might (which they instance for an example), when she came near to Isaac, Gen. 24:65, take a veil and cover herself, as well for modesty as for reverence. But Judah thought Thamar to be an harlot because she covered herself with a veil, Gen. 38:14-15. So that from the beginning the covering of a veil was no certain sign of subjection…”

— Norton Knatchbull, Annotations upon Some Difficult Texts in all the Books of the New Testament, (Cambridge, 1693), on 1 Cor. 11:10, pp. 196-200 Knatchbull (1602–1685) was an English politician who sat in the House of Commons at various times between 1640 and 1679.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+truly+this+argument+of+theirs+seems+to+me+very+preposterous%2C+as+if+they+meant+to+tie+two+extremes+together+without+a+medium.+For+who+with+reason+can+affirm%3A+Because+a+man+is+not+of+the+woman%2C+but+the+woman+of+the+man%2C+etc.+Therefore+ought+a+woman+to+wear+a+veil+or+a+hood+on+her+head%2C+by+an+argument+fetched+from+the+moral+Law+of+their+creation%3F+Truly+I+have+often+heard+that+the+whole+Law+of+God+was+to+be+known+by+the+discourse+of+reason%2C+and+was+called+moral%E2%80%A6+But+whoever+could+from+the+dictate+of+reason+know+that+a+woman%2C+because+she+was+made+of+man+and+for+man%2C+ought+therefore+to+wear+a+veil+or+hood+on+her+head%2C+especially+in+the+Church%3F+That+she+is+therefore+inferior+to+her+husband%2C+and+that+therefore+she+ought+to+be+subject+unto+him%2C+is+not+abhorrent+from+the+discourse+of+reason%3B+and+because+she+is+for+that+cause+subject+to+her+husband%2C+reason+dictates+she+ought+to+acknowledge+it%2C+but+by+what+means+or+sign+she+should+do+it+in+the+Church+or+elsewhere%2C+custom+seems+only+to+have+taught%2C+especially+in+Christian+churches%2C+as+the+apostle+intimates+in+this+place.+For+we+read+not+of+any+such+custom+in+the+Old+Testament.+Rebecca+truly+might+%28which+they+instance+for+an+example%29%2C+when+she+came+near+to+Isaac%2C+Gen.+24%3A65%2C+take+a+veil+and+cover+herself%2C+as+well+for+modesty+as+for+reverence.+But+Judah+thought+Thamar+to+be+an+harlot+because+she+covered+herself+with+a+veil%2C+Gen.+38%3A14-15.+So+that+from+the+beginning+the+covering+of+a+veil+was+no+certain+sign+of+subjection%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Norton+Knatchbull%2C+Annotations+upon+Some+Difficult+Texts+in+all+the+Book <blockquote><p>Because there is a difference betwixt carrying the colors [banner or flag] in an army tali modo [in such a way] as all the army at once may see the colors, and the carrying of the colors. Yet the colors are a note-visible of such an army: so there is a difference betwixt preaching the Word, simpliciter, and preaching the Word, tali modo, ‘in such a way’ in one material house only. And therefore it is necessary that government which concerns many Churches consociated, be in its exercise hic &amp; nunc [here and now], larger than preaching of the Word in its exercise, hic &amp; nunc: which cannot be done but to a multitude which convenes epi to auto, ‘to the same material place’. And we see an act of government, Acts 15, by confession of our [Independent] Brethren, belonging to diverse consociated Churches and performed by them, and yet these cannot ordinarily meet to one and the same place in all their members for hearing of the Word.</p></blockquote>

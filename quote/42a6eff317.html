<main class="wrap"><figure class="quote" id="q-42a6eff317" data-kw="">
<blockquote><p>The gesture of imposition of hands other reformed Kirks, and ours also, have omitted [in praying for youth being admitted to the Table]: because it was a rite indifferent: for it was but an indicant sign of the person admitted: and because it has been, and is still abused to make up a bastard sacrament, the sacrament of confirmation, which we have condemned, not only in the [Scottish] Confession of Faith, but also in the [2nd] Confession of Helvetia approved in the general assembly [of the Church of Scotland] holden at Edinburgh, anno 1566.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly... ([Leiden, 1619]), pp. 87-95 | ‘Of Confirmation’</cite>, p. 89</span></figcaption>

</figure><figure class="quote" id="q-976347990e" data-kw="">
<blockquote><p>And as touching this blessing of children and imposition of hands upon them, it is peculiar unto our Savior Christ: used neither by his disciples, nor his apostles, either before or after his ascension. Whereunto makes that the children being brought, that He should pray over them, He did not pray for them, but blessed them, that is to say commended them to be blessed, thereby to shew his divine power. These being also yet infants, and in their swaddling clothes, as by the Word which the Evangelist uses, and as by our Savior Christs taking them into his arms, does appear; being also in all likelihood unbaptized. Last of all, their confirmation is a notable derogation unto the holy sacrament of baptism, not alone in that it presumes the sealing of that which was sealed sufficiently by it: but also in that both by asseveration of words; and by specialty of the minister that gives it, it is even preferred unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Mt. 19, section 9, quoted in George Gillespie, English-Popish Ceremonies (1637), pt. 3, ch. 6</cite>, p. 95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/number-of-the-sacraments.html">Number of the Sacraments</a></span></div>

</figure><figure class="quote" id="q-808ef0ea50" data-kw="">
<blockquote><p>Imposition of hands used in so diverse actions, civil and religious, was no sacrament… it was only a simple rite and sign of limitation or restraint, specifying or setting forth the party on whom we desire God to pour his blessing: that is, it was only an indicant [indicator] and demonstrative sign of the person on whom the blessing was poured, and not a significant or declarative sign of the blessing or grace itself bestowed… The confession of Wirtemburg has these words, ‘Of a temporal and personal fact of the apostles, a general and perpetual sacrament cannot be ordained in the Kirk without a special command of God.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly... ([Leiden, 1619]), pp. 87-95 | ‘Of Confirmation’</cite>, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/number-of-the-sacraments.html">Number of the Sacraments</a></span></div>

</figure><figure class="quote" id="q-78847cd3b3" data-kw="">
<blockquote><p>confirmatio: confirmation; a rite of the church viewed by the medieval doctors and by the Roman Catholic Church as a sacrament, but denied sacramental status by the Reformers and the Protestant scholastics on the ground that it does not rest on a command of God (see sacramentum). Nevertheless, both the Lutheran and Reformed orthodox view confirmatio, rightly conceived and performed, as a useful and edifying support of piety. Children baptized in infancy should receive formal instruction in the faith when they have reached an age of discretion. After this instruction they may come publicly before the bishop or pastor in order to make a profession of faith and receive the support of the church’s prayers and of the nonsuperstitious laying-on of hands. Such a rite coincides with the teaching of Scripture and the ancient custom of the Church. Since, moreover, it is an act of piety and edification and not a sacrament or means of grace, the Protestant scholastics note that it is in no way a completion of baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Greek &amp; Latin Theological Terms</cite></span></figcaption>

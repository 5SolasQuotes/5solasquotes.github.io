<main class="wrap"><figure class="quote" id="q-5fdcc71030" data-kw="">
<blockquote><p>We further confess and acknowledge, that such persons as are placed in authority are to be loved, honored, feared, and holden in most reverend estimation, because they are the lieutenants of God, in whose session God Himself does sit and judge. And further, we affirm that whosoever deny unto them their aid, counsel and comfort, while the princes vigilantly travail in the executing of their office, that the same men deny their help, support and counsel to God, who, by the presence of his lieutenant, craves it of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>The Church in Christ’s days was a most perverse Church; the rulers perverted the Law, denied that hatred and rash anger was a sin, or that heart-adultery was a sin; polluted the worship with will-worship; the priesthood was kept by moien. Caiaphas was high priest that year, but Christ by practice and precept forbade to separate from this Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-87ef79049c" data-kw="">
<blockquote><p>When these two unhappy principles were first invented and practised, whereof Mr. Hamilton was chief, viz. that ‘Every difference of judgment in our national controversies is a ground of separation;’ and that ‘There is no way of keeping up and managing a testimony, but by separation,’ which has a direct tendency to dissolve the unity of all churches, break all Christian societies, and ruin the whole frame of the good old cause of Presbyterianism, which was faithfully and with soul-abhorrence witnessed against at the very first out-breaking thereof by blest [Robert] M‘Ward, both privily and publickly in his writings against the same, of which I formerly gave some account.</p></blockquote>

</figure><figure class="quote" id="q-1af501b990" data-kw="">
<blockquote><p>2. As we desire not presbyterial government to be reproached for such judging, so neither are prelatical acts of synods for debarring from the holy ministry men of an holy and unblameable conversation, and for the grace of God in them, and their knowledge and utterance, able and fit to preach the Gospel, upon this account, because they are unpeaceable and hold up debates, that is, because they will not be satisfied with the public resolutions for taking into places in the Church, Parliament, Army, Committee of Estates, all the malignant party in the land, or will not promise silence in their matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658) | Epistle to the Reader</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4f8771bc75" data-kw="">
<blockquote><p>Worshipping Christ in a crucifix is naught in its own nature, abominable, idolatrous, condemned in God’s law, Exod. xx. 4, &amp;c. And therefore, be it done with ever so great devotion and good meaning, with ever so much popish daubing or goodly pretence whatsoever, it is still cursed and damnable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>General Directions for a Comfortable Walking with God</cite>, (1626; Ligonier PA: Soli Deo Gloria, 1991), p. 173.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d14eeca9bd" data-kw="">
<blockquote><p>Now that a man who adores before the painted or graven image of Christ, though he profess that he intends his whole adoration to Christ, and that he places the image before him only to represent Christ, and to stir up his mind to worship Christ, does nevertheless commit idolatry, I trust none of our Opposites will deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-99dfff926c" data-kw="">
<blockquote><p>Therefore, in forbidding us to have strange gods, he means that we are not to transfer to another what belongs to him. Even though there are innumerable things that we owe to God, yet they may be conveniently grouped in four headings: (1) adoration (to which is added as an appendix, spiritual obedience of the conscience), (2) trust, (3) invocation, (4) thanksgiving.… As the Lord suffers nothing of these to be transferred to another, so he commands that all be rendered wholly to himself.… And it will not be enough to abstain from a strange god.… If we are content, therefore, with one God, let us remember what was said before: that we are to drive away all invented gods and are not to rend asunder the worship that the one God claims for himself. For it is unlawful to take away even a particle from his glory; rather, all things proper to him must remain with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>

</figure><figure class="quote" id="q-51cebe7f05" data-kw="">
<blockquote><p>Concerning the humanity of our blessed Savior, that being a creature he might be depicted, I mean it was naturally capable of it: it was the great instrument of many actions, it conversed with mankind above thirty years together, it was the subject of great changes, and the matter of a long story, and the conduit of many excellent instructions, and therefore might without all question be described as well as Caesar’s or Meletius, Marc Anthony or the kings of the gentiles. It might be done: and the question being here only of the making or having of it, abstractedly from all other appendages or collateral considerations, I need say no more of it under this title; but that it is neither impious nor unreasonable of itself to have or to make the picture or image of Christ’s humanity, or rather of his human body. For against this there is neither reason nor religion; and if it be made accidentally unlawful, that is not of present consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 334</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-78167023f5" data-kw="Mary">

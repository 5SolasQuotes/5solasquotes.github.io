<main class="wrap"><figure class="quote" id="q-a17a5aad48" data-kw="">
<blockquote><p>Now he could not mean to contradict himself in saying, “The doers of the law shall be justified,” as if their justification came through their works, and not through grace; since he declares that a man is justified freely by His grace without the works of the law, intending by the term “freely” nothing else than that works do not precede justification. For in another passage he expressly says, “If by grace, then is it no more of works; otherwise grace is no longer grace.” But the statement that “the doers of the law shall be justified” must be so understood, as that we may know that they are not otherwise doers of the law, unless they be justified, so that justification does not subsequently accrue to them as doers of the law, but justification precedes them as doers of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De spiritu et littera, 26.45; “A Treatise on the Spirit and the Letter,” in Saint Augustin: Anti-Pelagian Writings, ed. Philip Schaff, trans. Peter Holmes, NPNF 5.102.</cite></span></figcaption>

</figure><figure class="quote" id="q-9422a48ce2" data-kw="">
<blockquote><p>But let us leave the philosophers aside. The law itself, which contains the most perfect rule of life, could not, as we said, confer righteousness. Not that there was anything lacking in the law; Moses declared that he set before the people good and evil, life and death. But because of the corruption of our nature, the law was not enough to insure righteousness. Even as Paul taught (Rom. 8:3), the defect was in our flesh, not in the law. When the law speaks, nature drives us in the opposite direction, and our desires break out with the greater force, like untamed wild elephants, against God’s command. Thus the law works wrath rather than righteousness. The law holds all guilty, and by exposing sin takes away from men every excuse. Therefore we must seek another way to righteousness: the way which is in Christ, whom the law itself set forth as its fulfillment. The righteousness of the law said, Who does these commandments, shall live in them (Lev. 18:5). But none did them. Therefore there had to be another righteousness; one that Paul taught, from Moses himself: The word is near, in your mouth and in your heart; this is the word of faith which we preach (Rom. 10:8). It is this doctrine that justifies us—not the bare doctrine, but because it offers us the fruit of Christ’s death, by which our sins are forgiven and we are reconciled to God. For if by faith we grasp this gift, we are counted as righteous before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>trans. Joseph Haroutunian and Louise Pettibone Smith (Philadelphia: Westminster Press, 1958), 156.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

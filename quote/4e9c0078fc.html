<blockquote><p>23. In the words just recited, observe these four assertions of Cyril of Alexandria:

1. The flesh of Christ in the participants of the Eucharist is life-giving. (For those who approach unworthily do not partake of the flesh of Christ.)

2. This occurs not by the virtue of the flesh, as it is flesh, but by the virtue of the Deity with which this flesh is united in hypostasis. And the preservation of us and the wondrous effects related to the flesh are to be attributed to the glory of the Deity.

3. For the accomplishment of these things, the bodily presence of the flesh is neither required nor desired.

4. Christ, by the power of His Deity, accomplishes these things, being present with us through His ineffable Deity even though He has departed from us in the flesh.

24. Indeed, the power of Deity accomplishes that we can hold onto Him even when absent, by imitating faith in heaven. We partake of Him when absent by believing, as Augustine teaches. And even when absent in the flesh, He spiritually nourishes us with that same flesh, and His flesh becomes for us life-giving bread, as Cyril teaches here. For this spiritual nourishment is the operation of Deity and is not the least part of that preservation and those miraculous works, which Cyril says should be attributed not to the bodily presence of the flesh but to the glory of the Deity. Therefore, elsewhere, Cyril says the same: just as (he says) the root sends its quality to the branches, so the only-begotten Son of God, by giving the Spirit, bestows the affinity of the Father and His own nature (so to speak) on the saints connected to Him by faith and sanctity, nourishing them with piety and all kinds of virtue. He calls the Father the Farmer so that this might not seem to be the work of the Son alone, but rather a marvelous work of the entire Trinity. Therefore, He nourishes us with piety and faith through the Son in the Spirit, and the Farmer does the work, looking after and nurturing, and reducing everything to virtue, also through the Son in the Spirit. In my judgment, we understand this more correctly. Nor is this from the Father, nor that from the Son, nor both separated from the Spirit. For all things are from the Father through the Son in the Spirit. Neither will the Father be separated from cultivating us, nor will the Son be estranged from His care. Therefore, Christ holds the place of the vine, and we, hanging from it, draw the power and grace of the Spirit for our nourishment and spiritual fruit. This is what Cyril says in book 10 of the Gospel of John, chapter 13. Namely, as the Lord speaks in John, chapter 6, ‘It is the Spirit that gives life; the flesh is of no avail.’ The flesh of Christ is not life-giving from itself but by the power of the Deity dwelling corporeally within it. It is substantially life, and from itself, it gives life. He gave to the body in which He dwells the power of giving life, not by the confusion of the two natures in Christ or the operation of natural properties but by the hypostatic union of natures. So that the flesh of the Word becomes life-giving, for it is the flesh of God; and being spiritually united to this flesh, we are connected to God, and thus, being already connected to Him, we are infallibly given life: as Cyril teaches in book 4 of his Commentary on the Gospel of John, chapter 14, and the following chapters until the end of chapter 25, and in book 1, chapter 21. And the operation of Deity is so powerful that it unites us to His flesh by its consenting will, nourishes us, and allows us to draw from His fullness. Therefore, for the salutary eating of the flesh of Christ, the bodily presence of the flesh is not required with the one partaking, as we explained a little earlier from the same Cyril.

25. However, ignorantly or dishonestly, Bellarmine (in Book 2, On the Eucharist, chapter 25) abuses certain words of Cyril, attributing to them a meaning entirely alien to Cyril’s own mind, as if they favored transubstantiation and the bodily eating of the flesh of Christ. He first cites certain words from a letter of Cyril to Nestorius, intending to convey that Cyril meant nothing other than that the flesh of Christ, of which we are participants in the mysteries, is not common flesh, the mere flesh of a man or a sanctified man (as Nestorius deliriously claimed), but the proper flesh of the Word Himself. Read that letter of Cyril that contains twelve anathemas, and you will find nothing else there, not even in those very words that Bellarmine excerpts. Having discussed this at length, he promises us clearer passages from Cyril and adduces some from Cyril’s books on the Gospel of John, from which he draws three arguments.</p></blockquote>

<blockquote><p>In the eighth century, Carolingian theologians at the Abbey of Corbie [France], Paschasius Radbertus (ca. 790-ca. 860) and Ratramnus (d. ca. 868) each wrote treatises on the Lord’s Supper. Both were titled ‘On the Body and Blood of the Lord’. They first debated what is ‘true’ and what is a ‘figure’ in the Lord’s Supper. Radbertus argued that the sign becomes the thing signified. In response, Ratramnus argued that if the sign becomes the thing signified, then we have no sacrament since Christ is received by faith, not sight; we would have no need of faith. If we have no faith, we have no Christ and no salvation. In the early sixteenth century, that debate was renewed by the Reformed and Lutheran theologians, with Lutherans republishing Radbertus and the Reformed, Ratramnus.” – ‘Foreward’, p. ix in Theodore Beza, A Clear &amp; Simple Treatise on the Lord’s Supper (RHB, 2016) Some other 9th century theologians who denied that Christ’s body and blood were materially eaten in the Eucharist during the Carolingian Eucharistic Controversy were: Gottschalk of Orbais, Alcuin of York &amp; Florus Magister. The same men were involved in a controversy over predestination. Generally speaking, the Carolingian theologians had a high view of predestination and took a spiritual view of the Lord’s Supper. Ratramnus took the central role in the Eucharistic controversy; Gottschalk took the central role in the predestinarian controversy. . . Post-Reformation Anthology of Heppe, Heinrich – ch. 26, ‘The Lord’s Supper’ in Reformed Dogmatics ed. Ernst Bizer, tr. G.T. Thomson (1861; Wipf &amp; Stock, 2007), pp. 627-57 Heppe (1820–1879) was a German reformed theologian. . . 1500’s Works Melanchthon, Philip ch. 27. ‘On Participation in the Table of the Lord’ in The Loci Communes of Philip Melanchthon… tr. Charles L. Hill (1521; Boston: Meador Publishing, 1944), pp. 258-60 Though Melanchthon (1497–1560) was a Lutheran, this work of his was the first ‘systematic theology’ of the Reformation, and, as it was very influential on reformed systematic theologies following shortly thereafter. Article 10, Of the Holy Supper in The Apology of the Augsburg Confession tr: F. Bente &amp; W. H. T. Dau (1531) ch. 22. ‘Of the Supper of Christ the Lord’ in Melanchthon on Christian Doctrine, Loci Communes, 1555 tr. Clyde L. Manschreck (1555; NY: Oxford Univ. Press, 1965), pp. 217-23 Zwingli, Ulrich – ‘The Eucharist’ in Commentary on True &amp; False Religion eds. Jackson &amp; Heller (1525; Labyrinth Press, 1981), pp. 198-253 Bucer, Martin – ‘On the Eucharist, and first the defense of Mr. Luther, then of those [the Reformed] whom the adversary makes out to be Berengarians’ in A Defense against the Catholic Principle… tr. Michael McFadden (Strasbourg, Rihel, 1536), pp. 41-62 Calvin, John ch. 29. ‘The Supper of the Lord’ in Instruction in Faith (1537) tr. Paul T. Fuhrman (Philadelphia: Westminster Press, 1949), pp. 70-72 Short Treatise on the Lord’s Supper (1541) in Tracts 2.163-198 Martin Klauber: “Joachim Westphal (1510-1574) represented the so-called true or Gnesio-Lutheran movement that attempted to preserve the purity of Luther’s thought against the alleged compromises of the Philippists, those who followed the lead of Philip Melancthon. As the superintendent of the state church in Hamburg, Westphal was well positioned to enter the fray of theological disputes… For the Gnesio-Lutherans the issue of Christ’s physical presence in the Lord’s Supper was of paramount importance. The formula borrowed from Luther was that the body and blood of Christ are truly and substantially present ‘in, with and under’ the consecrated elements. Those who partake, believers and unbelievers alike, receive the true body and blood of Christ Himself… This so called [sacramental] union is often referred to as ‘consubstantiation’, although Luther did not use the term… Calvin[‘s]… view [was] that although Christ is not present physically in the bread and in the wine, He is present spiritually. The sacrament would not, therefore, be an empty sign. Calvin followed Augustine closely… If, as the Lutherans believed, Christ is physically present… both believers and unbelievers who participate in the Eucharist partake of the body and blood of Christ… Calvin argued, by contrast, that only believers truly partake of the body and blood of the Lord. He posited this position in the Institutes as well as in his Petit traicte de la saincte cene (1541).” – ‘Introduction’ in Beza, Clear &amp; Simple Treatise on the Lord’s Supper A Treatise on the Sacraments of Baptism &amp; the Lord’s Supper (Edinburgh, 1837) 190 pp. no ToC 12. ‘Of the Lord’s Supper’ in Institutes of the Christian Religion: 1541 French Edition tr. Elsie A. McKee (1541; Eerdmans, 2009), pp. 546-84 ‘On [2] Excommunication, [3-4]Separation, the Lord’s Supper &amp; [5] Pastors’ in A Short Instruction for to Arm All Good Christian People against the Pestiferous Errors of the Common Sect of Anabaptists (London: Daye, 1549), no page numbers ‘Mutual Consent in Regard to the Sacraments Between the Ministers of the Church of Zurich &amp; John Calvin’ (1554) in Tracts 2:199-244 Defense of the Sound &amp; Orthodox Doctrine of the Sacraments (1555) Klauber: “Seizing on the publication of the Consensus [Tigurinus of Zurich and Geneva, 1549], Westphal began to criticize it publicly, which initiated the so-called second sacramental war between the Lutherans and the Reformed… Westphal initially composed three treatises [in 1552, 1553 &amp; 1555] critical of the Consensus… Westphal spared no words in his attack on his ‘godless’ opponents and their ‘satanic blasphemies.’… Calvin did not become aware of Westphal’s criticism until 1554, when Bullinger brought it to his attention. He was otherwise occupied with a host of issues including the Servetus affair, but he told Bullinger that he would respond. He did so in 1555, although he believed that Westphal’s Farrago was a ‘light-weight book’ and not worthy of a personal response… But Calvin decided to take the matter upon himself in his Defense of the Sound and Orthodox Doctrine of the Sacraments… and the literary war was on… He did not mention Westphal by name, hoping for peace with the Lutherans, especially since he had garnered Melanchthon’s support.” – Ibid. ‘Second Defense of the Sacraments in Answer to the Calumnies of Joachim Westphal’ (1556) in Tracts 2:245-345 Klauber: “Westphal responded [to Calvin’s Defense of the Sound and Orthodox Doctrine of the Sacraments, 1555] with his Just Defense Against the False Accusations of a Certain Sacramentarian… Calvin responded in 1556 with his Second Defense… This work was much more vituperative and personal than the first, and Calvin denied that he had made the sacrament an empty sign, saying that he was in agreement with the [Lutheran] Augsburg Confession [Article X, 1530]. Although he asserted his admiration of Zwingli, Calvin made it clear that there were significant distinctions between their views of Christ’s presence in the Lord’s Supper.” – Ibid. Last Admonition to Joachim Westphal (1557) in Tracts 2:346 Klauber: “Westphal in turn responded [to Calvin’s Second Defense…] in 1557 with his Confession of Faith on the Sacrament of the Eucharist… Calvin then answered in 1557 with The Last Admonition of John Calvin to Joachim Westphal Who if He Heeds It Not Must Henceforth Be Treated in the Way Which Paul Prescribed for Obstinate Heretics… Any real attempt at accord was lost when Calvin accused Westphal of stupidity and impudence. It would have to be left to Calvin’s colleagues, such as Beza, to attempt to repair the rupture. In true form Westphal responded in 1558 with two works, including his Defense of the Lord’s Supper against the Errors and Calumnies of John Calvin. This is a lengthy volume covering a host of topics including infant baptism, private absolution, and festival days, but the Eucharist figures by far the most prominently…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In the eighth century, Carolingian theologians at the Abbey of Corbie [France], Paschasius Radbertus (ca. 790-ca. 860) and Ratramnus (d. ca. 868) each wrote treatises on the Lord’s Supper. Both were titled ‘On the Body and Blood of the Lord’. They first debated what is ‘true’ and what is a ‘figure’ in the Lord’s Supper. Radbertus argued that the sign becomes the thing signified. In response, Ratramnus argued that if the sign becomes the thing signified, then we have no sacrament since Christ is received by faith, not sight; we would have no need of faith. If we have no faith, we have no Christ and no salvation. In the early sixteenth century, that debate was renewed by the Reformed and Lutheran theologians, with Lutherans republishing Radbertus and the Reformed, Ratramnus.” – ‘Foreward’, p. ix in Theodore Beza, A Clear &amp; Simple Treatise on the Lord’s Supper (RHB, 2016) Some other 9th century theologians who denied that Christ’s body and blood were materially eaten in the Eucharist during the Carolingian Eucharistic Controversy were: Gottschalk of Orbais, Alcuin of York &amp; Florus Magister. The same men were involved in a controversy over predestination. Generally speaking, the Carolingian theologians had a high view of predestination and took a spiritual view of the Lord’s Supper. Ratramnus took the central role in the Eucharistic controversy; Gottschalk took the central role in the predestinarian controversy. . . Post-Reformation Anthology of Heppe, Heinrich – ch. 26, ‘The Lord’s Supper’ in Reformed Dogmatics ed. Ernst Bizer, tr. G.T. Thomson (1861; Wipf &amp; Stock, 2007), pp. 627-57 Heppe (1820–1879) was a German reformed theologian. . . 1500’s Works Melanchthon, Philip ch. 27. ‘On Participation in the Table of the Lord’ in The Loci Communes of Philip Melanchthon… tr. Charles L. Hill (1521; Boston: Meador Publishing, 1944), pp. 258-60 Though Melanchthon (1497–1560) was a Lutheran, this work of his was the first ‘systematic theology’ of the Reformation, and, as it was very influential on reformed systematic theologies following shortly thereafter. Article 10, Of the Holy Supper in The Apology of the Augsburg Confession tr: F. Bente &amp; W. H. T. Dau (1531) ch. 22. ‘Of the Supper of Christ the Lord’ in Melanchthon on Christian Doctrine, Loci Communes, 1555 tr. Clyde L. Manschreck (1555; NY: Oxford Univ. Press, 1965), pp. 217-23 Zwingli, Ulrich – ‘The Eucharist’ in Commentary on True &amp; False Religion eds. Jackson &amp; Heller (1525; Labyrinth Press, 1981), pp. 198-253 Bucer, Martin – ‘On the Eucharist, and first the defense of Mr. Luther, then of those [the Reformed] whom the adversary makes out to be Berengarians’ in A Defense against the Catholic Principle… tr. Michael McFadden (Strasbourg, Rihel, 1536), pp. 41-62 Calvin, John ch. 29. ‘The Supper of the Lord’ in Instruction in Faith (1537) tr. Paul T. Fuhrman (Philadelphia: Westminster Press, 1949), pp. 70-72 Short Treatise on the Lord’s Supper (1541) in Tracts 2.163-198 Martin Klauber: “Joachim Westphal (1510-1574) represented the so-called true or Gnesio-Lutheran movement that attempted to preserve the purity of Luther’s thought against the alleged compromises of the Philippists, those who followed the lead of Philip Melancthon. As the superintendent of the state church in Hamburg, Westphal was well positioned to enter the fray of theological disputes… For the Gnesio-Lutherans the issue of Christ’s physical presence in the Lord’s Supper was of paramount importance. The formula borrowed from Luther was that the body and blood of Christ are truly and substantially present ‘in, with and under’ the consecrated elements. Those who partake, believers and unbelievers alike, receive the true body and blood of Christ Himself… This so called [sacramental] union is often referred to as ‘consubstantiation’, although Luther did not use the term… Calvin[‘s]… view [was] that although Christ is not present physically in the bread and in the wine, He is present spiritually. The sacrament would not, therefore, be an empty sign. Calvin followed Augustine closely… If, as the Lutherans believed, Christ is physically present… both believers and unbelievers who participate in the Eucharist partake of the body and blood of Christ… Calvin argued, by contrast, that only believers truly partake of the body and blood of the Lord. He posited this position in the Institutes as well as in his Petit traicte de la saincte cene (1541).” – ‘Introduction’ in Beza, Clear &amp; Simple Treatise on the Lord’s Supper A Treatise on the Sacraments of Baptism &amp; the Lord’s Supper (Edinburgh, 1837) 190 pp. no ToC 12. ‘Of the Lord’s Supper’ in Institutes of the Christian Religion: 1541 French Edition tr. Elsie A. McKee (1541; Eerdmans, 2009), pp. 546-84 ‘On [2] Excommunication, [3-4]Separation, the Lord’s Supper &amp; [5] Pastors’ in A Short Instruction for to Arm All Good Christian People against the Pestiferous Errors of the Common Sect of Anabaptists (London: Daye, 1549), no page numbers ‘Mutual Consent in Regard to the Sacraments Between the Ministers of the Church of Zurich &amp; John Calvin’ (1554) in Tracts 2:199-244 Defense of the Sound &amp; Orthodox Doctrine of the Sacraments (1555) Klauber: “Seizing on the publication of the Consensus [Tigurinus of Zurich and Geneva, 1549], Westphal began to criticize it publicly, which initiated the so-called second sacramental war between the Lutherans and the Reformed… Westphal initially composed three treatises [in 1552, 1553 &amp; 1555] critical of the Consensus… Westphal spared no words in his attack on his ‘godless’ opponents and their ‘satanic blasphemies.’… Calvin did not become aware of Westphal’s criticism until 1554, when Bullinger brought it to his attention. He was otherwise occupied with a host of issues including the Servetus affair, but he told Bullinger that he would respond. He did so in 1555, although he believed that Westphal’s Farrago was a ‘light-weight book’ and not worthy of a personal response… But Calvin decided to take the matter upon himself in his Defense of the Sound and Orthodox Doctrine of the Sacraments… and the literary war was on… He did not mention Westphal by name, hoping for peace with the Lutherans, especially since he had garnered Melanchthon’s support.” – Ibid. ‘Second Defense of the Sacraments in Answer to the Calumnies of Joachim Westphal’ (1556) in Tracts 2:245-345 Klauber: “Westphal responded [to Calvin’s Defense of the Sound and Orthodox Doctrine of the Sacraments, 1555] with his Just Defense Against the False Accusations of a Certain Sacramentarian… Calvin responded in 1556 with his Second Defense… This work was much more vituperative and personal than the first, and Calvin denied that he had made the sacrament an empty sign, saying that he was in agreement with the [Lutheran] Augsburg Confession [Article X, 1530]. Although he asserted his admiration of Zwingli, Calvin made it clear that there were significant distinctions between their views of Christ’s presence in the Lord’s Supper.” – Ibid. Last Admonition to Joachim Westphal (1557) in Tracts 2:346 Klauber: “Westphal in turn responded [to Calvin’s Second Defense…] in 1557 with his Confession of Faith on the Sacrament of the Eucharist… Calvin then answered in 1557 with The Last Admonition of John Calvin to Joachim Westphal Who if He Heeds It Not Must Henceforth Be Treated in the Way Which Paul Prescribed for Obstinate Heretics… Any real attempt at accord was lost when Calvin accused Westphal of stupidity and impudence. It would have to be left to Calvin’s colleagues, such as Beza, to attempt to repair the rupture. In true form Westphal responded in 1558 with two works, including his Defense of the Lord’s Supper against the Errors and Calumnies of John Calvin. This is a lengthy volume covering a host of topics including infant baptism, private absolution, and festival days, but the Eucharist figures by far the most prominently…”

— Ratramnus, The Book of Bertram the Priest: Concerning the Body and Blood of Christ in the Sacrament † c. 868 96 pp. | Dr. R. Scott Clark:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+eighth+century%2C+Carolingian+theologians+at+the+Abbey+of+Corbie+%5BFrance%5D%2C+Paschasius+Radbertus+%28ca.+790-ca.+860%29+and+Ratramnus+%28d.+ca.+868%29+each+wrote+treatises+on+the+Lord%E2%80%99s+Supper.+Both+were+titled+%E2%80%98On+the+Body+and+Blood+of+the+Lord%E2%80%99.+They+first+debated+what+is+%E2%80%98true%E2%80%99+and+what+is+a+%E2%80%98figure%E2%80%99+in+the+Lord%E2%80%99s+Supper.+Radbertus+argued+that+the+sign+becomes+the+thing+signified.+In+response%2C+Ratramnus+argued+that+if+the+sign+becomes+the+thing+signified%2C+then+we+have+no+sacrament+since+Christ+is+received+by+faith%2C+not+sight%3B+we+would+have+no+need+of+faith.+If+we+have+no+faith%2C+we+have+no+Christ+and+no+salvation.+In+the+early+sixteenth+century%2C+that+debate+was+renewed+by+the+Reformed+and+Lutheran+theologians%2C+with+Lutherans+republishing+Radbertus+and+the+Reformed%2C+Ratramnus.%E2%80%9D+%E2%80%93+%E2%80%98Foreward%E2%80%99%2C+p.+ix+in+Theodore+Beza%2C+A+Clear+%26+Simple+Treatise+on+the+Lord%E2%80%99s+Supper+%28RHB%2C+2016%29+Some+other+9th+century+theologians+who+denied+that+Christ%E2%80%99s+body+and+blood+were+materially+eaten+in+the+Eucharist+during+the+Carolingian+Eucharistic+Controversy+were%3A+Gottschalk+of+Orbais%2C+Alcuin+of+York+%26+Florus+Magister.+The+same+men+were+involved+in+a+controversy+over+predestination.+Generally+speaking%2C+the+Carolingian+theologians+had+a+high+view+of+predestination+and+took+a+spiritual+view+of+the+Lord%E2%80%99s+Supper.+Ratramnus+took+the+central+role+in+the+Eucharistic+controversy%3B+Gottschalk+took+the+central+role+in+the+predestinarian+controversy.+.+.+Post-Reformation+Anthology+of+Heppe%2C+Heinrich+%E2%80%93+ch.+26%2C+%E2%80%98The+Lord%E2%80%99s+Supper%E2%80%99+in+Reformed+Dogmatics+ed.+Ernst+Bizer%2C+tr.+G.T.+Thomson+%281861%3B+Wipf+%26+Stock%2C+2007%29%2C+pp.+627-57+Heppe+%281820%E2%80%931879%29+was+a+German+reformed+theologian.+.+.+1500%E2%80%99s+Works+Melanchthon%2C+Philip+ch.+27.+%E2%80%98On+Participation+in+the+Table+of+the+Lord%E2%80%99+in+The+Loci+Communes+of+Philip+Melanchthon%E2%80%A6+tr.+Charles+L.+Hill+%281521%3B+Boston%3A+Meador+Publishing%2C+1944%29%2C+pp.+258-60+Though+Melanchthon+%281497%E2%80%931560%29+was+a+Lutheran%2C+this+work+of+his+was+the+first+%E2%80%98systematic+theology%E2%80%99+of+the+Reformation%2C+and%2C+as+it+was+very+influential+on+reformed+systematic+theologies+following+shortly+thereafter.+Article+10%2C+Of+the+Holy+Supper+in+The+Apology+of+the+Augsburg+Confession+tr%3A+F.+Bente+%26+W.+H.+T.+Dau+%281531%29+ch.+22.+%E2%80%98Of+the+Supper+of+Christ+the+Lord%E2%80%99+in+Melanchthon+on+Christian+Doctrine%2C+Loci+Communes%2C+1555+tr.+Clyde+L.+Manschreck+%281555%3B+NY%3A+Oxford+Univ.+Press%2C+1965%29%2C+pp.+217-23+Zwingli%2C+Ulrich+%E2%80%93+%E2%80%98The+Eucharist%E2%80%99+in+Commentary+on+True+%26+False+Religion+eds.+Jackson+%26+Heller+%281525%3B+Labyrinth+Press%2C+1981%29%2C+pp.+198-253+Bucer%2C+Martin+%E2%80%93+%E2%80%98On+the+Eucharist%2C+and+first+the+defense+of+Mr.+Luther%2C+then+of+those+%5Bthe+Reformed%5D+whom+the+adversary+makes+out+to+be+Berengarians%E2%80%99+in+A+Defense+against+the+Catholic+Principle%E2%80%A6+tr.+Michael+McFadden+%28Strasbourg%2C+Rihel%2C+1536%29%2C+pp.+41-62+Calvin%2C+John+ch.+29.+%E2%80%98The+Supper+of+the+Lord%E2%80%99+in+Instruction+in+Faith+%281537%29+tr.+Paul+T.+Fuhrman+%28Philadelphia%3A+Westminster+Press%2C+1949%29%2C+pp.+70-72+Short+Treatise+on+the+Lord%E2%80%99s+Supper+%281541%29+in+Tracts+2.163-198+Martin+Klauber%3A+%E2%80%9CJoachim+Westphal+%281510-1574%29+represented+the+so-called+true+or+Gnesio-Lutheran+movement+that+attempted+to+preserve+the+purity+of+Luther%E2%80%99s+thought+against+the+alleged+compromises+of+the+Philippists%2C+those+who+followed+the+lead+of+Philip+Melancthon.+As+the+superintendent+of+the+state+church+in+Hamburg%2C+Westphal+was+well+positioned+to+enter+the+fray+of+theological+disputes%E2%80%A6+For+the+Gnesio-Lutherans+the+issue+of+Christ%E2%80%99s+physical+presence+in+the+Lord%E2%80%99s+Supper+was+of+paramount+importance.+The+formula+borrowed+from+Luther+was+that+the+body+and+blood+of+Christ+are+truly+and+substantially+present+%E2%80%98in%2C+with+and+under%E2%80%99+the+consecrated+elements.+Those+who+partake%2C+believers+and+unbelievers+alike%2C+receive+the+true+body+and+blood+of+Christ+Himself%E2%80%A6+This+so+called+%5Bsacramental%5D+union+is+often+referred+to+as+%E2%80%98consubstantiation%E2%80%99%2C+although+Luther+did+not+use+the+term%E2%80%A6+Calvin%5B%E2%80%98s%5D%E2%80%A6+view+%5Bwas%5D+that+although+Christ+is+not+present+physically+in+the+bread+and+in+the+wine%2C+He+is+present+spiritually.+The+sacrament+would+not%2C+therefore%2C+be+an+empty+sign.+Calvin+followed+Augustine+closely%E2%80%A6+If%2C+as+the+Lutherans+believed%2C+Christ+is+physically+present%E2%80%A6+both+believers+and+unbelievers+who+participate+in+the+Eucharist+partake+of+the+body+and+blood+of+Christ%E2%80%A6+Calvin+argued%2C+by+contrast%2C+that+only+believers+truly+partake+of+the+body+and+blood+of+the+Lord.+He+posited+this+position+in+the+Institutes+as+well+as+in+his+Petit+traicte+de+la+saincte+cene+%281541%29.%E2%80%9D+%E2%80%93+%E2%80%98Introduction%E2%80%99+in+Beza%2C+Clear+%26+Simple+Treatise+on+the+Lord%E2%80%99s+Supper+A+Treatise+on+the+Sacraments+of+Baptism+%26+the+Lord%E2%80%99s+Supper+%28Edinburgh%2C+1837%29+190+pp.+no+ToC+12.+%E2%80%98Of+the+Lord%E2%80%99s+Supper%E2%80%99+in+Institutes+of+the+Christian+Religion%3A+1541+French+Edition+tr.+Elsie+A.+McKee+%281541%3B+Eerdmans%2C+2009%29%2C+pp.+546-84+%E2%80%98On+%5B2%5D+Excommunication%2C+%5B3-4%5DSeparation%2C+the+Lord%E2%80%99s+Supper+%26+%5B5%5D+Pastors%E2%80%99+in+A+Short+Instruction+for+to+Arm+All+Good+Christian+People+against+the+Pestiferous+Errors+of+the+Common+Sect+of+Anabaptists+%28London%3A+Daye%2C+1549%29%2C+no+page+numbers+%E2%80%98Mutual+Consent+in+Regard+to+the+Sacraments+Between+the+Ministers+of+the+Church+of+Zurich+%26+John+Calvin%E2%80%99+%281554%29+in+Tracts+2%3A199-244+Defense+of+the+Sound+%26+Orthodox+Doctrine+of+the+Sacraments+%281555%29+Klauber%3A+%E2%80%9CSeizing+on+the+publication+of+the+Consensus+%5BTigurinus+of+Zurich+and+Geneva%2C+1549%5D%2C+Westphal+began+to+criticize+it+publicly%2C+which+initiated+the+so-called+second+sacramental+war+between+the+Lutherans+and+the+Reformed%E2%80%A6+Westphal+initially+composed+three+treatises+%5Bin+1552%2C+1553+%26+1555%5D+critical+of+the+Consensus%E2%80%A6+Westphal+spared+no+words+in+his+attack+on+his+%E2%80%98godless%E2%80%99+opponents+and+their+%E2%80%98satanic+blasphemies.%E2%80%99%E2%80%A6+Calvin+did+not+become+aware+of+Westphal%E2%80%99s+criticism+until+1554%2C+when+Bullinger+brought+it+to+his+attention.+He+was+otherwise+occupied+with+a+host+of+issues+including+the+Servetus+affair%2C+but+he+told+Bullinger+that+he+would+respond.+He+did+so+in+1555%2C+although+he+believed+that+Westphal%E2%80%99s+Farrago+was+a+%E2%80%98light-weight+book%E2%80%99+and+not+worthy+of+a+personal+response%E2%80%A6+But+Calvin+decided+to+take+the+matter+upon+himself+in+his+Defense+of+the+Sound+and+Orthodox+Doctrine+of+the+Sacraments%E2%80%A6+and+the+literary+war+was+on%E2%80%A6+He+did+not+mention+Westphal+by+name%2C+hoping+for+peace+with+the+Lutherans%2C+especially+since+he+had+garnered+Melanchthon%E2%80%99s+support.%E2%80%9D+%E2%80%93+Ibid.+%E2%80%98Second+Defense+of+the+Sacraments+in+Answer+to+the+Calumnies+of+Joachim+Westphal%E2%80%99+%281556%29+in+Tracts+2%3A245-345+Klauber%3A+%E2%80%9CWestphal+responded+%5Bto+Calvin%E2%80%99s+Defense+of+the+Sound+and+Orthodox+Doctrine+of+the+Sacraments%2C+1555%5D+with+his+Just+Defense+Against+the+False+Accusations+of+a+Certain+Sacramentarian%E2%80%A6+Calvin+responded+in+1556+with+his+Second+Defense%E2%80%A6+This+work+was+much+more+vituperative+and+personal+than+the+first%2C+and+Calvin+denied+that+he+had+made+the+sacrament+an+empty+sign%2C+saying+that+he+was+in+agreement+with+the+%5BLutheran%5D+Augsburg+Confession+%5BArticle+X%2C+1530%5D.+Although+he+asserted+his+admiration+of+Zwingli%2C+Calvin+made+it+clear+that+there+were+significant+distinctions+between+their+views+of+Christ%E2%80%99s+presence+in+the+Lord%E2%80%99s+Supper.%E2%80%9D+%E2%80%93+Ibid.+Last+Admonition+to+Joachim+Westphal+%281557%29+in+Tracts+2%3A346+Klauber%3A+%E2%80%9CWestphal+in+turn+responded+%5Bto+Calvin%E2%80%99s+Second+Defense%E2%80%A6%5D+in+1557+with+his+Confession+of+Faith+on+the+Sacrament+of+the+Eucharist%E2%80%A6+Calvin+then+answered+in+1557+with+The+Last+Admonition+of+John+Calvin+to+Joachim+Westphal+Who+if+He+Heeds+It+Not+Must+Henceforth+Be+Treated+in+the+Way+Which+Paul+Prescribed+for+Obstinate+Heretics%E2%80%A6+Any+real+attempt+at+accord+was+lost+when+Calvin+accused+Westphal+of+stupidity+and+impudence.+It+would+have+to+be+left+to+Calvin%E2%80%99s+colleagues%2C+such+as+Beza%2C+to+attempt+to+repair+the+rupture.+In+true+form+Westphal+responded+in+1558+with+two+works%2C+including+his+Defense+of+the+Lord%E2%80%99s+Supper+against+the+Errors+and+Calumnies+of+John+Calvin.+This+is+a+lengthy+volume+covering+a+host+of+topics+including+infant+baptism%2C+private+absolution%2C+and+festival+days%2C+but+the+Eucharist+figures+by+far+the+most+prominently%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Ratramnus%2C+The+Book+of+Bertram+the+Priest%3A+Concerning+the+Body+and+Blood+of+Christ+in+the+Sacrament+%E2%80%A0+c.+868+96+pp.+%7C+Dr.+R.+Scott+Clark%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa633cd4f23.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a633cd4f23.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=In%20the%20eighth%20century%2C%20Carolingian%20theologians,figures%20by%20far%20the%20most%20prominently&amp;text=In%20the%20eighth%20century%2C%20Carolingian%20theologians%20at%20the&amp;text=the%20Eucharist%20figures%20by%20far%20the%20most%20prominently" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Paul says [in 1 Cor. 11:20] that in this way it is not the Lord’s supper that is partaken of — not that a single abuse altogether set aside the sacred institution of Christ, and reduced it to nothing, but that they polluted the sacrament by observing it in a wrong way. For we are accustomed to say, in common conversation, that a thing is not done at all, if it is not done aright. Now this was no trivial abuse, as we shall afterwards see. If you understand the words is not as meaning, is not allowable, the meaning will amount to the same thing… he condemns that profane admixture, which had nothing in it akin to the Lord’s Supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, verse 20</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Paul says [in 1 Cor. 11:20] that in this way it is not the Lord’s supper that is partaken of — not that a single abuse altogether set aside the sacred institution of Christ, and reduced it to nothing, but that they polluted the sacrament by observing it in a wrong way. For we are accustomed to say, in common conversation, that a thing is not done at all, if it is not done aright. Now this was no trivial abuse, as we shall afterwards see. If you understand the words is not as meaning, is not allowable, the meaning will amount to the same thing… he condemns that profane admixture, which had nothing in it akin to the Lord’s Supper.”

— John Calvin, Commentary on 1 Cor. 11, verse 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPaul+says+%5Bin+1+Cor.+11%3A20%5D+that+in+this+way+it+is+not+the+Lord%E2%80%99s+supper+that+is+partaken+of+%E2%80%94+not+that+a+single+abuse+altogether+set+aside+the+sacred+institution+of+Christ%2C+and+reduced+it+to+nothing%2C+but+that+they+polluted+the+sacrament+by+observing+it+in+a+wrong+way.+For+we+are+accustomed+to+say%2C+in+common+conversation%2C+that+a+thing+is+not+done+at+all%2C+if+it+is+not+done+aright.+Now+this+was+no+trivial+abuse%2C+as+we+shall+afterwards+see.+If+you+understand+the+words+is+not+as+meaning%2C+is+not+allowable%2C+the+meaning+will+amount+to+the+same+thing%E2%80%A6+he+condemns+that+profane+admixture%2C+which+had+nothing+in+it+akin+to+the+Lord%E2%80%99s+Supper.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+1+Cor.+11%2C+verse+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29576b744b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29576b744b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/#:~:text=Paul%20says%20%5Bin%201%20Cor.%2011%3A20,it%20akin%20to%20the%20Lord%E2%80%99s%20Supper&amp;text=Paul%20says%20%5Bin%201%20Cor.%2011%3A20%5D%20that%20in&amp;text=nothing%20in%20it%20akin%20to%20the%20Lord%E2%80%99s%20Supper" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-19d9bdc409" data-kw="">
<blockquote><p>…he takes from this ground that when two duties commanded of God do meet in one practice, so as we can not do them both, in this case we must performe the greatter duty and neglect the lesser. Now, whereas he says when two duties do meet, etc., he means not that both may be duties at once, for then a man shall be so straitened that he must needs commit a sin, in that he must needs omit one of the duties. But (as he explains himself) he calls them duties being considered apart: as to hear a sermon at the Church on the Sabbath, and to tend a sick person ready to die at home at the same time; both are duties being considered apart, but meeting together in our practice at one time, there is but one duty, because the lesser work binds not for that present.</p></blockquote>

</figure><figure class="quote" id="q-98a8c10b1e" data-kw="">
<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c1a1f211d5" data-kw="">
<blockquote><p>But Magistrates as Magistrates hold forth in their Law-abstinence from those same sins of adultery, incest, murder; But: 1. Not to the consciences of their subjects, but to the outer man as members of the commonwealth. 2. Not under the pain of eternal wrath and condemnation, before the judge of quick and dead: Magistrates as Magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if Magistrates do persuade the equity of abstinence from adultery, incest, murder, in their statutes, or acts of parliament, from the Word of God, from the sixth and seventh command of the Decalogue, from the judgement and eternal punishment that follows these sins, they so persuade not as magistrates, but as divines, and as godly and Christian men… 3. Magistrates as Magistrates hold forth in their Law, abstinence from these sins, not as the ambassadors of Christ, craving subjection of conscience and divine-faith to those charges, but only external obedience: for though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience; nor is he in Christ’s stead to lay divine bands on the conscience, to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order, and as the Creator, and Founder, and another of human societies and of Peace, to exact external obedience, and to lay bands on your hands not to shed innocent blood, and on your body not to defile it with adultery, or incest, nor to violate the chastity of your brother… when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 550-51</span></figcaption>

<blockquote><p>2. Elections of governors would be performed as in the sight of God, and, in my weak apprehension, the person coming nearest to God’s judge, fearing God, hating covetousness, and to Moses’ king (Deut. 17), one who shall read in the book of the law; and it would seem now that gracious morals are to us instead of God’s immediate designation. 3. The genuine and intrinsical end of making kings is not simply governing, but governing the best way, in peace, honesty, and godliness (1 Tim. 2), therefore, these are to be made kings who may most expeditely procure this end. Neither is it my purpose to make him no king who is not a gracious man, only here I compare title with title.</p></blockquote>

</figure><figure class="quote" id="q-1c349bc864" data-kw="">
<blockquote><p>1. There is a subjection in respect of natural being, as the effect to the cause; so, though Adam had never sinned, this morality of the Fifth Command should have stood in vigor, that the son by nature, without any positive law, should have been subject to the father, because from him he has his being, as from a second cause. But I doubt if the relation of a father, as a father, does necessarily infer a royal or kingly authority of the father over the son; or by nature’s law, that the father has a power of life and death over, or above, his children, and the reasons I give are: (1) Because power of life and death is by a positive law, presupposing sin and the fall of man [Gen. 9:5-6]; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt [Gen. 4:14-15]. (2) I judge that the power royal, and the fatherly power of a father over his children, shall be found to be different; and the one is founded on the law of nature, the other, to wit, royal power, on a mere positive law. 2. The degree or order of subjection natural is a subjection in respect of gifts or age. So Aristotle (1 polit., chp. 3) says, “that some are by nature servants.” His meaning is good — that some gifts of nature, as wisdom natural, or aptitude to govern, has made some men of gold, fitter to command, and some of iron and clay, fitter to be servants and slaves… It is possible Plato had a good meaning (Dialogue 3, Of Laws) who made six orders here. “1. That fathers command their sons; 2. The noble the ignoble; 3. The elder the younger; 4. The masters the servants; 5. The stronger the weaker; 6. The wise the ignorant.” Aquinas (22, q. 57, article 3), Driedo (de libert. Christ, bk. 1, p. 8), following Aristotle (polit. bk. 7, ch. 14) hold, though man had never sinned there should have been a sort of dominion of the more gifted and wiser above the less wise and weaker; not antecedent from nature properly, but consequent, for the utility and good of the weaker, in so far as it is good for the weaker to be guided by the stronger, which cannot be denied to have some ground in nature.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. There is a subjection in respect of natural being, as the effect to the cause; so, though Adam had never sinned, this morality of the Fifth Command should have stood in vigor, that the son by nature, without any positive law, should have been subject to the father, because from him he has his being, as from a second cause. But I doubt if the relation of a father, as a father, does necessarily infer a royal or kingly authority of the father over the son; or by nature’s law, that the father has a power of life and death over, or above, his children, and the reasons I give are: (1) Because power of life and death is by a positive law, presupposing sin and the fall of man [Gen. 9:5-6]; and if Adam, standing in innocency, could lawfully kill his son, though the son should be a malefactor, without any positive law of God, I much doubt [Gen. 4:14-15]. (2) I judge that the power royal, and the fatherly power of a father over his children, shall be found to be different; and the one is founded on the law of nature, the other, to wit, royal power, on a mere positive law. 2. The degree or order of subjection natural is a subjection in respect of gifts or age. So Aristotle (1 polit., chp. 3) says, “that some are by nature servants.” His meaning is good — that some gifts of nature, as wisdom natural, or aptitude to govern, has made some men of gold, fitter to command, and some of iron and clay, fitter to be servants and slaves… It is possible Plato had a good meaning (Dialogue 3, Of Laws) who made six orders here. “1. That fathers command their sons; 2. The noble the ignoble; 3. The elder the younger; 4. The masters the servants; 5. The stronger the weaker; 6. The wise the ignorant.” Aquinas (22, q. 57, article 3), Driedo (de libert. Christ, bk. 1, p. 8), following Aristotle (polit. bk. 7, ch. 14) hold, though man had never sinned there should have been a sort of dominion of the more gifted and wiser above the less wise and weaker; not antecedent from nature properly, but consequent, for the utility and good of the weaker, in so far as it is good for the weaker to be guided by the stronger, which cannot be denied to have some ground in nature.”

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843) | question 13, p. 50 rt col">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+There+is+a+subjection+in+respect+of+natural+being%2C+as+the+effect+to+the+cause%3B+so%2C+though+Adam+had+never+sinned%2C+this+morality+of+the+Fifth+Command+should+have+stood+in+vigor%2C+that+the+son+by+nature%2C+without+any+positive+law%2C+should+have+been+subject+to+the+father%2C+because+from+him+he+has+his+being%2C+as+from+a+second+cause.+But+I+doubt+if+the+relation+of+a+father%2C+as+a+father%2C+does+necessarily+infer+a+royal+or+kingly+authority+of+the+father+over+the+son%3B+or+by+nature%E2%80%99s+law%2C+that+the+father+has+a+power+of+life+and+death+over%2C+or+above%2C+his+children%2C+and+the+reasons+I+give+are%3A+%281%29+Because+power+of+life+and+death+is+by+a+positive+law%2C+presupposing+sin+and+the+fall+of+man+%5BGen.+9%3A5-6%5D%3B+and+if+Adam%2C+standing+in+innocency%2C+could+lawfully+kill+his+son%2C+though+the+son+should+be+a+malefactor%2C+without+any+positive+law+of+God%2C+I+much+doubt+%5BGen.+4%3A14-15%5D.+%282%29+I+judge+that+the+power+royal%2C+and+the+fatherly+power+of+a+father+over+his+children%2C+shall+be+found+to+be+different%3B+and+the+one+is+founded+on+the+law+of+nature%2C+the+other%2C+to+wit%2C+royal+power%2C+on+a+mere+positive+law.+2.+The+degree+or+order+of+subjection+natural+is+a+subjection+in+respect+of+gifts+or+age.+So+Aristotle+%281+polit.%2C+chp.+3%29+says%2C+%E2%80%9Cthat+some+are+by+nature+servants.%E2%80%9D+His+meaning+is+good+%E2%80%94+that+some+gifts+of+nature%2C+as+wisdom+natural%2C+or+aptitude+to+govern%2C+has+made+some+men+of+gold%2C+fitter+to+command%2C+and+some+of+iron+and+clay%2C+fitter+to+be+servants+and+slaves%E2%80%A6+It+is+possible+Plato+had+a+good+meaning+%28Dialogue+3%2C+Of+Laws%29+who+made+six+orders+here.+%E2%80%9C1.+That+fathers+command+their+sons%3B+2.+The+noble+the+ignoble%3B+3.+The+elder+the+younger%3B+4.+The+masters+the+servants%3B+5.+The+stronger+the+w

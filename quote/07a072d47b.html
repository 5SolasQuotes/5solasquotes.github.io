<blockquote><p>We assert that the eternal law is above the nature of all other laws (as we just now said). For when we call the eternal law the immutable concept and form of reason, we demonstrate that it is pure, unadulterated act, just as God is a simple actuality on whom, as the universal principle, entirely all things depend. Moreover, when we say that that form of reason has been conceived by God and in God for the common good, we manifestly distinguish the eternal law of God from the rest of the reason of the divine wisdom that acts and occupies itself with created things. For the reason of that divine wisdom, which is prominent in acting, moving, and sustaining created things, is occupied with all things all the time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity (Sources in Early Modern Economics, Ethics, and Law) (CLP Academic, 2015), thesis 2</cite>, p. 42</span></figcaption>

<blockquote><p>Objection V: God will not the death of a sinner, but rather that he repent and live, Eze. 18:23. Answer. Augustine in his 1st book to Simplicius, 2nd question, answers this question. You must, says he, distinguish betwixt man, as he is born man, and man as he is a sinner. For God is not delighted with the destruction of man, as he is man, but as he is a sinner: neither will He simply the death of any as he is a sinner, or as it is the ruin and destruction of his creature: but in that, by the detestation and revenge of sin with eternal death, his glory is exceedingly advanced. God therefore will the death of a sinner, but as it is a punishment, that is, as it is a means to declare and set out his divine justice: and therefore it is an untruth for a man to say that God would have none condemned. For whereas men are once condemned, it must be either with God’s will, or without it: if without it, then the will of God must needs suffer violence, the which to affirm is great impiety: if with his will, God must needs change his sentence before set down, but we must not presume to say so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chain: or The Description of Theology containing the order of the causes of salvation and damnation, according to God’s Word (Cambridge, 1600), ch. 54, ‘Concerning a New Devised Doctrine of Predestination, taught by some New and Late [Arminian] Divines’, the 1st Error, the Confutation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

bb9826.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/755fbb9826.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=Objection%20V%3A%20God%20will%20not%20the,must%20not%20presume%20to%20say%20so&amp;text=Objection%20V%3A%20God%20will%20not%20the%20death%20of&amp;text=but%20we%20must%20not%20presume%20to%20say%20so" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</cite></span></figcaption>

<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed… (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</cite></span></figcaption>

</figure><figure class="quote" id="q-3f80f93133" data-kw="">
<blockquote><p>Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature, or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature. (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved, as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 13</span></figcaption>

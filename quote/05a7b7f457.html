</figure><figure class="quote" id="q-1ae5a421f4" data-kw="Rule of faith">
<blockquote><p>For unless scripture be a whole and perfect rule, it cannot be a rule at all; because there ought to be the exactest agreement between the rule and the thing to which it is applied. If, therefore, our faith be longer or broader than the scripture, then the scripture is not its rule; because a rule should be adequate to the thing measured by it.</p></blockquote>

</figure><figure class="quote" id="q-27d31d575f" data-kw="">
<blockquote><p>In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General</cite>, pp. 14-15</span></figcaption>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0ee2106606" data-kw="Vincent of Lerins">
<blockquote><p>Vincentius Lirinensis, an ancient author in whose book the papists have great confidence, speaks thus: c. 41, “The canon of scripture alone is self-sufficient for all.” Still more plainly, c. 2: “The canon of scripture alone is sufficient, and more than sufficient for all things.” I do not see how he could have spoken more plainly: he says that the canon of scripture is sufficient, and more than sufficient; sufficient for all things, and sufficient alone.</p></blockquote>

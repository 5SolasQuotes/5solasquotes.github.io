<blockquote><p>It is the never-failing characteristic of true religion, to prompt its professor, in imitation of the great apostle of the Gentiles, forgetting the things that are behind, to press forward towards the prize of his high and heavenly calling; and to be continually advancing in his Christian course, and never to be satisfied with his actual attainments, but to be striving to root out every remaining corruption, and to perfect every Christian grace, that he may bring every thought and feeling into the obedience of Christ;—to live more habitually under the influence of that divine Spirit, of which Christians are said, in Scripture, to be the temples;—and to feel more constantly and more powerfully the life and force of this blessed principle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilberforce.html">William Wilberforce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay (1823) to John Witherspoon, Treatises on Justification and Regeneration</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aea56bc91a" data-kw="">
<blockquote><p>Fourthly, they [Justification and Sanctification] are both equally imputed unto us through the righteousness of Christ. Therefore says St. Paul to the Corinthians, ‘To them that are sanctified in Christ Jesus,’ (1 Cor. 1:2) and to the Hebrews, it is said we are ‘sanctified by the blood of the Covenant.’ (Heb. 10:29) So that no less are we sanctified than justified by Christ’s death and merits, and the imputation of them. But on the other side, they are distinct in some formalities, such as these may be, for first, the immediate cause of our sanctification is in holy Scripture imputed to the operation and influence of the Holy Spirit, as our Justification is more properly attributed to Christ the mediator between God and man: As appears from St. Paul’s words to the Thessalonians, ‘But we are bound to give thanks always for you brethren beloved of the Lord, because God has from the beginning chosen you to salvation, through sanctification of the Spirit, and belief of the truth.’ (2 Thess. 2:13) And St. Peter, ‘Elect according to the foreknowledge of God the Father and Sanctification of the Spirit unto obedience.’ (1 Pet. 1:2)… For not only is a sinner by the Spirit of regeneration and sanctification purged from the old leaven of sin and malice, but he becomes a new lump, and unleavened (1 Cor. 5:7); and whereas he has ‘yielded his members as instruments of unrighteousness unto sin, he does yield himself unto God,’ (Rom. 6:13) as those that are alive from the dead. And old things are done away in him, and all things become new.’ (2 Cor. 5:17) And ‘whosoever is (thus) born of God; does not commit sin, for his seed remains in him, and he cannot sin because he is born of God.’ (1 Jn. 3:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17, pp. 62-63</span></figcaption>

</figure><figure class="quote" id="q-a733512508" data-kw="">
<blockquote><p>God is omnipotent, or God can do all things. That, things which imply a contradiction: as namely, for the same thing to be, and not to be; and impossibilities, as namely, for a man not to be a reasonable creature, and the like: fall not under the compass of omnipotency, is not from any defect (it is indeed from the perfection) of power in God; but from the impossibility of the things… So likewise that God cannot sin, lie, or deny Himself, is not from defect, but from the eminency of his power and absolute perfection, whence He is uncapable of being touched with any imperfection. … Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. Eminential continency and virtual continency (that is, for one thing to be contained in another eminently, as the excellency of the creature is in the Creator; or virtually, as all things saleable are in money, Eccl. 10:9) are not the same: the first is proper to the Creator, the second is found in the creature. The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 19-20</span></figcaption>

<blockquote><p>XVIII. Baptism indeed promises us the submersion of our Pharaoh and the mortification of sin, yet not so that it is no more or does not trouble us, but only that it does not overcome us, on account of Christ who, by His blood, prevents its power from condemning, and by his Spirit, restrains it from dominating. This is not so that men may sleep securely in their sins, but only that they may not waver and lose heart, who are tickled and pricked by their flesh.</p></blockquote>

<blockquote><p>21. The effects of justification, or its necessary consequences, are:

1. Actual adoption, Eph. I.5.

2. Peace of conscience, Rom. V.1.

3. Love, Luke VII.47; and other spiritual charismata [gifts] of that kind, which the Spirit of adoption works in the hearts of the justified. For justification is to be conjoined with sanctification by an inseparable and perpetual bond, yet not to be confounded with it; and to those for whom Christ has been made δικαιοσύνη [dikaiosynē, righteousness], to them He has also been made ἁγιασμός [hagiasmos, sanctification], 1 Cor. I.30.

4. Life and glory, Rom. VIII.30.</p></blockquote>

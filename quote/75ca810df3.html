<main class="wrap"><figure class="quote" id="q-75ca810df3" data-kw="">
<blockquote><p>But after the Lord had ascended to heaven, the personal call, except in case of Paul, who was one born out of due time, was not the passport of any man either to the ministry or apostleship. Men were no more put into office by the living voice of the Lord Jesus. The departure of the Master, and the vacancy left in the list of Apostles by the death of Judas, gave opportunity for bringing into opera­tion a new principle. The first chapter of the Acts of the Apostles brings the whole case before us. Let us specially examine the passage—Acts i. 13-26—that we may have full possession of the facts.

It appears that, in the interval between the Ascension and the Day of Pentecost, the dis­ciples met for prayer and supplication in an upper room of the city of Jerusalem. The mother and brethren of Jesus were present, as were also the eleven Apostles. Taken together, they numbered one hundred and twenty in all. Peter rose and addressed the company. He reminded them of the vacancy in the apostleship. Judas, who betrayed the Master, was dead, and the office that he forfeited by his transgression must be conferred upon another. He states the necessary qualifications of him who was to be the successor of Judas. He must be one who had intercourse with the 11 from the commencement of Christ’s ministry to the close. He states the duties of the new apostle; he was to be with the others a witness of Christ’s resurrection. Such was the case that Peter put before the men and brethren, met together in that upper room of Jerusalem. We then rend in verse 23 — “THEY APPOINTED TWO, Joseph called Barsabas, who was surnamed Justus, and Matthias.”

In consequence of this double choice, it became necessary to decide which should be regarded as the true apostle; which, after prayer, was done by casting lots. But let it be particularly observed that, while Peter explained the necessary qualifications, and the peculiar duties of the office, the appointment of the person did not rest with Peter, but with the men and brethren to whom the address of Peter was directed. Farther, it is not to be forgotten that the office to which Matthias succeeded is, in the 20th verse, termed a Bishopric, and how it is said in the 25th verse, he had “to take part of this ministry and apostleship.” The men and brethren, at the instigation of Peter, exercised the right of appointing a man to a bishopric—that is, to the office of a bishop, and to take part in the ministry. In the Apostolic Church, the people appointed Matthias to be a minister —a bishop—an apostle.

The case recorded in Acts xiv. 23, is to the same effect, though, from a mistranslation, the force of it is lost upon the English reader. The authorized version represents the two Apostles, Barnabas and Paul, as ordaining elders in every church; whereas the true meaning of the word in the original is “to elect by a show of hands”—a fact now admitted by the best expositors. We must not allow a faulty translation to rob us of the testimony of Scripture to an important fact—namely, that the elders of the New Testament Church were appointed to office by the popular vote.</p></blockquote>

<blockquote><p>Christ was said to be God’s servant, partly as he subjected himself to the condition of man, and because he lived among men in a needy, servile, and abject state of life, not like a prince, but a servant, which is the lowest form of rational creatures. And it is expressed by ‘taking the form of a servant’ upon him, Phil. 2:7. Angels are called sons, and man a servant; ‘The sons of God shouted for joy,’ Job 38:7. In the family of heaven they were to God as servants.

And partly as he was a choice instrument for the executing of God’s decrees. Those that are taken into any degree of subserviency to God’s counsels have this badge of honour put upon them, to be God’s servants, as Nebuchadnezzar is called God’s servant, Jer. 27:6. Now, because Christ submitted himself to the office of the mediatorship, and so to a subserviency to God’s decrees, he is called a servant: Isa. 13:1, ‘Behold my servant, whom I uphold;’ Isa. 49:3, ‘Thou art my servant.’

And this being an instrument of God’s decrees, is called service, because whosoever is employed in it is to sequester himself for the uses of God, and to divest himself of all self-respect, and like a servant to be at the command of another, and wholly to give up himself to the profit and benefit of his Master. So Christ, not aiming at himself, accomplished the work of God to God’s glory and the salvation of man. And—

Partly as he subjected himself to the law of God and the covenant of works, which was a covenant of servants. A servant expects his hire as the reward of his work, and therefore the state of the gospel is called a state of sonship: Gal. 4:5, ‘To redeem them that were under the law, that they might receive the adoption of sons.’ So in the 1st verse of that chapter, ‘The heir, as long as he is a child, differeth nothing from a servant;’ that is, those that are under the covenant of grace did very little differ from those that are under the covenant of works, in the time of the church’s infancy and ceremonial dispensation, because it was a ministry of condemnation.

Everywhere the covenant of works is made as the covenant of an hireling, and implieth bondage and service. And therefore Christ, because he submitted himself to such a covenant, and seeing he was to be judged of God according to all extremity and rigour, things were carried between God and Christ in a way of justice, and our grace and glory were due to him. So that in all these respects Christ was God’s servant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 442-43.</span></figcaption>

<blockquote><p>He adds, secondly, the extent of this subjection and obedience, even to all things: which is not to be understood of all things absolutely, and without exception, Acts 5:29, but all things lawful, godly, honest, and which are not forbidden in the word of God, even though they cross the humor of the wives, and argue little discretion in the husband who commands them. Numb. 5:1-15, etc.; for nothing is excepted here but what is contrary to that subjection which is due to Him who has commanded this subjection of wives to their husbands, as Paul comments upon an expression like to this, 1 Cor. 15:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians</cite>, … (London: T. Ward, 1841) | on Eph. 5:24, p. 243</span></figcaption>

<div class="actions"><button class="copy" data-copy="“He adds, secondly, the extent of this subjection and obedience, even to all things: which is not to be understood of all things absolutely, and without exception, Acts 5:29, but all things lawful, godly, honest, and which are not forbidden in the word of God, even though they cross the humor of the wives, and argue little discretion in the husband who commands them. Numb. 5:1-15, etc.; for nothing is excepted here but what is contrary to that subjection which is due to Him who has commanded this subjection of wives to their husbands, as Paul comments upon an expression like to this, 1 Cor. 15:27.”

</figure><figure class="quote" id="q-31fa497d99" data-kw="Councils contradict councils">
<blockquote><p>Nor is there any ground for whispering to me, that when councils are at variance, one or other of them is not a lawful council. For how shall we ascertain this? Just, if I mistake not, by judging from Scripture that the decrees are not orthodox. For this alone is the sure law of discrimination.</p></blockquote>

</figure><figure class="quote" id="q-29cdd5804e" data-kw="">
<blockquote><p>28. We have, therefore, a most excellent and sure mark to distinguish… the legitimate observances of the Church, if we remember that one of two things, or both together, are always intended, viz., that in the sacred assembly of the faithful, all things may be done decently, and with becoming dignity, and that human society may be maintained. In order by certain bonds, as It were, of moderation and humanity… since nothing here is sought but the maintenance of charity by a common office… 30. …the whole sum of righteousness, and all the parts of divine worship, and everything necessary to salvation, the Lord has faithfully comprehended, and clearly unfolded, in his sacred oracles, so that in them He alone is the only Master to be heard. But as in external discipline and ceremonies [he used as an example bowing in prayer], he has not been pleased to prescribe every particular that we ought to observe, (he foresaw that this depended on the nature of the times, and that one form would not suit all ages, in them we must have recourse to the general rules which he has given, employing them to test whatever the necessity of the Church may require to be enjoined for order and decency. Lastly, as he has not delivered any express command, because things of this nature are not necessary to salvation, and, for the edification of the Church, should be accommodated to the varying circumstances of each age and nation, it will be proper, as the interest of the Church may require, to change and abrogate the old, as well as to introduce new forms. I confess, indeed, that we are not to innovate rashly or incessantly, or for trivial causes. Charity is the best judge of what tends to hurt or to edify: if we allow her to be guide, all things will be safe. 31. Things which have been appointed according to this rule, it is the duty of the Christian people to observe with a free conscience indeed, and without superstition, but also with a pious and ready inclination to obey…</p></blockquote>

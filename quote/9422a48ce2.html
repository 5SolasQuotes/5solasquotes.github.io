<main class="wrap"><figure class="quote" id="q-9422a48ce2" data-kw="">
<blockquote><p>But let us leave the philosophers aside. The law itself, which contains the most perfect rule of life, could not, as we said, confer righteousness. Not that there was anything lacking in the law; Moses declared that he set before the people good and evil, life and death. But because of the corruption of our nature, the law was not enough to insure righteousness. Even as Paul taught (Rom. 8:3), the defect was in our flesh, not in the law. When the law speaks, nature drives us in the opposite direction, and our desires break out with the greater force, like untamed wild elephants, against God’s command. Thus the law works wrath rather than righteousness. The law holds all guilty, and by exposing sin takes away from men every excuse. Therefore we must seek another way to righteousness: the way which is in Christ, whom the law itself set forth as its fulfillment. The righteousness of the law said, Who does these commandments, shall live in them (Lev. 18:5). But none did them. Therefore there had to be another righteousness; one that Paul taught, from Moses himself: The word is near, in your mouth and in your heart; this is the word of faith which we preach (Rom. 10:8). It is this doctrine that justifies us—not the bare doctrine, but because it offers us the fruit of Christ’s death, by which our sins are forgiven and we are reconciled to God. For if by faith we grasp this gift, we are counted as righteous before God.</p></blockquote>

<blockquote><p>Although our justification will be fully declared on the last day (our good works also being brought forward as the sign and proof its truth, Matt 25:34–40), still falsely would anyone maintain from this a twofold gospel justification—one from faith in this life (which is the first); the other (and second) from works on the day of judgment (as some hold, agreeing too much with the Romanists on this point) . . . Thus it is nothing else than an adjudicatory sentence of the possession of the kingdom of heaven from the right given before through justification. And if works are then brought forward, they are not adduced as the foundation of a new justification to be obtained then, but as signs, marks, and effects of our true faith and of our justification solely by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, 3 vol. (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 2:687.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-c5cb3f9194" data-kw="">
<blockquote><p>Two things are seen in Christ which are necessary to our justification: the one is death; the other, resurrection from the dead, etc. [Rom. 4:25] It was fitting that by his death the sins of the world should be expiated, etc. while by his resurrection from the dead, it pleased the same goodness of God to grant the Holy Ghost, through whom the gospel might be believed, and the justice that was lost by the sin of the first Adam might be restored. The apostle has expressed both parts in these words, ‘Who was delivered on account of our sins, etc. [and was raised again for our justification]’ [Rom. 4:25] In his death therefore is found satisfaction for sin; in his resurrection the gift of the Holy Ghost, by which our justification to life is effected…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-borrhaus.html">Martin Borrhaus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 Borrhaus (1499–1564) was a professor of philosophy and Old Testament at Basel in the reformed tradition. | On Gen. 15:4, pp. 161-62</span></figcaption>

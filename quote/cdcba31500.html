<main class="wrap"><figure class="quote" id="q-cdcba31500" data-kw="">
<blockquote><p>Q. 23. Is it lawful, as some plead, to have images or pictures in churches, though not for worship, yet for instruction, and raising the affections? No; because God has expressly prohibited not only the worshipping but the MAKING of any image whatever on a religious account; and the setting them up in churches, cannot but have a natural tendency to beget a sacred veneration for them; and therefore ought to be abstained from, as having at least an “appearance of evil,” Isa. 45:9-18; 1 Thess. 5:22. Q. 24. May they not be placed in churches for beauty and ornament? No; the proper ornament of churches is the sound preaching of the gospel, and the pure dispensation of the sacraments, and other ordinances of divine institution. Q. 25. Were not the images of the cherubims placed in the tabernacle and temple, by the command of God himself? Yes; but out of all hazard of any abuse, being placed in the holy of holies, where none of the people ever came: they were instituted by God Himself, which images are not; and they belonged to the typical and ceremonial worship, which is now quite abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher.html">James Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism Explained</cite>, (1753)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>

<blockquote><p>mere hieroglyphics, to represent the constant tender love and watchfulness of God over the ark of his covenant and the people that kept it, and had nothing of the nature of images in them.” (Works 14.446) Durham seems even more uncomfortable over the problem posed by the cherubim. He would like to ban representations of angels altogether, but he hesitates to take too firm a stand: ‘From this ground also it would seem, that painting of angels might be condemned, as a thing impossible, they being spirits which no corporeal thing can represent, beside that the representing of them has some hazard with it: and for those cherubims that were made by God’s direction under the Old Testament, they were rather some emblem of the nature and service of angels, as being full of zeal, and always (as it were) upon wing read to obey God’s will, than any likeness of themselves.’ (Law Unsealed, pp. 68–69) The bronze serpent made by Moses is clearly a happier example. The worship of this “Nehushtan” by later generations demonstrates how easily even lawful images may be abused. (Cf. ibid., p. 69; Boston, Works 2.151; Watson, Body of Divinity, pp. 388-89)</p></blockquote>

<blockquote><p>4…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures.</p></blockquote>

</figure><figure class="quote" id="q-4ba4f7ef7f" data-kw="">
<blockquote><p>The creature is limited by the circumstance of time, by which it has its being measured out as it were by parcels, past, present and to come; it had beginning, has succession and may have an end. The most glorious angel, as well as a worm, is thus limited by time; once he was not, then he began to be; that which is past is gone, and that which is to come is not yet, and he has but a little time present. But God’s essence had no beginning, has no succession, can have no end. We cannot say of it properly: It was or shall be; but alone It is, Ex. 3:14; Jn. 8:58. He has his whole being at once; not some after, some by parcels, one following another, Gen. 21:13 and 23:33; Ps. 90:2, 24; Isa. 57:15. Eternity is the continual existence and duration of the divine essence. The creatures being is a flux or perpetual flowing from one moment to another. God is a being above time, has his being measured by time, but is wholly eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: A.M., 1654), bk. 2, ch. 4, That God is infinite, omnipresent, eternal, pp. 148-49</span></figcaption>

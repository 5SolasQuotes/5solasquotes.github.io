<main class="wrap"><figure class="quote" id="q-1926b08cf8" data-kw="">
<blockquote><p>I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658)</cite>, pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c39a02a1ae" data-kw="">
<blockquote><p>2. Public peace in all the commandments of superiors, in so far as can be without sin, obliges the conscience, as Heb. 12:14, ‘Follow peace with all men and godliness;’ Ps. 34:14, ‘Seek peace and follow after it;’ Rom. 12:18. 3. Subjection to the censures of rulers by suffering patiently is an obligation lying upon all private persons, 1 Pet. 2:20, ‘But if when ye do well and suffer for it, ye take it patiently, this is acceptable to God;’ Rom. 13:2, ‘Whosoever therefore resisteth the power, resisteth the ordinance of God.’ 4. Nothing in non-obeying unwarrantable commandments must be done that redounds to the discredit of the ruler or the hurting of his majesty and honor, 1 Pet. 2:17, ‘Honor the king;’ Eccl. 10:20, ‘Curse not the king: for even when we deny subjection or obedience-objective to that which they command, yet owe we obedience official, and all due respect and reverence to the person and eminent place of the ruler, as Acts 7:2, Steven calls them, Men, brethren and fathers, Acts. 7:51, and yet ‘stiffnecked resisters of the Holy Ghost.’</p></blockquote>

</figure><figure class="quote" id="q-9428c2fa7a" data-kw="">
<blockquote><p>For in the Old Testament there are many rules, directions and examples, as a pillar of fire to guide the Churches now by (as that Rom. 15:4 shows) namely those examples and rules of moral and common equity, else the Church of God should loose now many a good ground, for many practices… Now if you [Independents] will use the Old Testament in some examples and commands, as you do (though here you forget to mention it), then grounds out of the Old Testament (in matters not ceremonial and judicial proper to the Jews’ policy, nation and times) but in things of moral and common equity will justify other practices…</p></blockquote>

</figure><figure class="quote" id="q-afd1f73699" data-kw="">
<blockquote><p>Of the forensic laws of Moses, those are perpetual which are of common right, or which have something moral. However, those have been abrogated which are of particular right, that is, such laws as were specially for the Mosaic constitution, and which have something ceremonial attached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-heinrich-alsted.html">Johannes Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Encyclopedia, vol. 4</cite>, p. 1599 trans. Adam Brink</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-dda84bdd5e" data-kw="">
<blockquote><p>4. Let it be remembered that those things we call morally good, [are those] which agree to right reason: those morally evill, which disagree from right reason: and those indifferent, which include nothing belonging to the order of reason, and so are neither consonant unto nor dissonant from the same. [The following shows that no rational action, and hence thing commanded, is simply indifferent, but must be good or bad to some degree, and hence to be done or not done; and if it is bad in any degree, it cannot be absolutely required.] 5. When we speak of the indifferency of an individual action, it may be conceived two ways, either absolute et sine respectu ad aliud [absolute and without respect to another], or, comparate et cum respectu ad aliud [comparatively and with respect to another]. In the free-will offrings, if so be a man offered according as God had blessed and prospered his estate, it was indifferent to offer either a bullock or a sheep, or a goat; but if he choosed to offer any of them, his action of offering could not be indifferent, but either good or evil. When we speak of the indifferency of an action comparate [comparatively], the sense is only this, that it is neither better not worse than another action, and that there is no reason to make us choose to do it more than another thing. But when we speak of the indifferency of an action, considered absolutely and by itself, the simple meaning is whether it be either good or evil, and whether the doing of the same must needs be either sin or evil doing.</p></blockquote>

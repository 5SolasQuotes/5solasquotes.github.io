<main class="wrap"><figure class="quote" id="q-4d004e833f" data-kw="">
<blockquote><p>Q. Is not this [Fourth] Commandment Ceremonial?

A. No: First, if it were so, then the Moral Law should consist but of nine words, or Commandments, which is contrary to God’s word.

Secondly, this Commandment (amongst the rest) was written by the finger of God, whereas no part of the Ceremonial Law was.

Thirdly, it (as well as the other) was written in Tables of stone; to signify the continuance of this Commandment, as well as the rest. Fourthly, it was before any shadow or Ceremony of the Law, yea, before Christ was promised, whom all Ceremonies of the Law have respect unto.

Q. But it sometime shadowed our Eternal Rest, and is therefore Ceremonial.

A. That followeth not: for the ceremonial representation of our Eternal Rest, came after the Commandment of the Rest, and therefore is accessory and accidental; for which cause the time of correction, and of abolishment of ceremonies being come, that use may well fall away, and yet the Commandment remain, it being not of the substance of the Commandment.

Q. Have you yet any further reason, to confirm the perpetuity of the Rest of the seventh day?

A. Our Saviour Christ willing his followers, which should live about 40 years after his ascension, to pray that their flight might not be upon the Sabbath, to the end that they might not be hindered in the service of God; doth thereby sufficiently declare, that he held not this Commandment in the account of a ceremony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 110-11.</span></figcaption>

</figure><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-a033a868f3" data-kw="">
<blockquote><p>Now, such were the innovations of the late hierarchists. In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, 8:28.</span></figcaption>

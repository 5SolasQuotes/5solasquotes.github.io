<blockquote><p>We shall now have a full definition of faith if we say that it is a firm and sure knowledge of the divine favor toward us, founded on the truth of a free promise in Christ, and revealed to our minds, and sealed on our hearts, by the Holy Spirit.</p></blockquote>

</figure><figure class="quote" id="q-813dbd0f21" data-kw="">
<blockquote><p>Why is faith the means of justification? Simply because it is the action of union with Jesus Christ. Faith is our coming to Him, our trusting Him, our resting in Him. The moment we are united to Him, we are immediately endowed with all that He has secured for us. We are immediately justified before we have done a single good deed, because we are His and He is God’s. Just as a very poor woman is a very poor woman until the very moment that she marries a wealthy man. But at the moment that she becomes his wife, she becomes a wealthy woman. It is by means of her acceptance that she becomes a wealthy woman, but her acceptance does not make her a wealthy woman; it is her husband’s wealth that makes her so. So faith does not justify; Christ justifies. But faith is the act of union with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

<blockquote><p>Q. 4. How do you divide the knowledge of God?

A. Among other ways, in a searching (Heb. 11:6) and an effective (1 John 3:23) manner, in a natural and a revealed manner (Matt. 16:17).

Q. 5. Is there a naturally created and a received knowledge of God in man?

A. The created knowledge is undoubtedly clear to the ungodly (Rom. 1:19; Rom. 2:14) and from the common agreement of all people. The received [knowledge] is evident in three ways: (1) from observing myself and all creatures (Ps. 19:2; Job 12:9); (2) more clearly from God’s Word; and (3) from the light of grace (Gen. 15:1).

Q. 6. Is the knowledge from nature opposed to that revealed in God’s Word?

A. No, because light cannot be opposed to light, nor truth against truth, since they are grounded in the God of truth. Therefore, they are called pure milk and belong to true religion (1 Peter 2:2; Rom. 12:1).

Q. 7. Is the knowledge of God from nature sufficient unto salvation?

A. Even though it is necessary and useful, it is not sufficient for man’s salvation, because it cannot teach Christ’s imputed righteousness (John 14:6; Matt. 16:17; Phil. 3:9) and true faith (Heb. 11:6; Rom. 10:17).

Q. 8. What is the revealed knowledge of God?

A. That which is obtained through God’s extraordinary revelation, through dreams (Gen. 37:5), visions (Ex. 3:2), appearances (Dan. 9:21), and God’s speaking (Num. 12:8); through ordinary proclamation of the Word (Rom. 10:14); and through the light received from the Holy Spirit (Ps. 119:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-schortinghuis.html">Wilhelmus Schortinghuis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essential Truths in the Heart of a Christian</cite>, trans. Harry Boonstra and Gerrit W. Sheeres, ed. James A. De Jong (1738; Grand Rapids MI: Reformation Heritage Books, 2009), pp 31-32.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5fd75eefd" data-kw="">
<blockquote><p>An extreme opinion on this subject has been held by some Christians, to the effect that no true and certain knowledge of God can be derived by man, in his present condition, from the light of nature in the entire absence of a supernatural revelation; that we are altogether dependent upon such a revelation for any certain knowledge that God exists, as well as for all knowledge of his nature and his purposes. This opinion is disproved: (a.) By the direct testimony of Scripture. Rom. 1:20–24; 2:14, 15. (b.) By the fact that many conclusive arguments for the existence of a great first Cause, who is at the same time an intelligent personal Spirit and righteous moral Governor, have been drawn by a strict induction from the facts of nature alone, as they lie open to the natural understanding. The fact that this argument remains unanswerable shows that the process by which the conclusions are drawn from purely natural sources is legitimate. (c.) All nations, however destitute of a supernatural revelation they may have been, have yet possessed some knowledge of a God. And in the case of the most enlightened of the heathen, natural religion has given birth to a considerable natural theology. We must, however, distinguish between that knowledge of the divine character which may be obtained by men from the works of nature and providence in the exercise of their natural powers alone, without any suggestions or assistance derived from a supernatural revelation—as is illustrated in theological writings of some most eminent of the heathen who lived before Christ—and that knowledge which men in this age, under the clear light of a supernatural revelation, are competent to deduce from a study of nature. The natural theology of the modern rationalists demonstrably owes all its special excellences to that Christian revelation it is intended to supersede.</p></blockquote>

<blockquote><p>I here consider Francis Turretin’s approach to Natural Theology through an analysis of his response to Five important questions. First of all, what, according to Turretin, Natural Theology is and isn’t (as well as the contents of Natural Theology). Secondly, whether humans (fallen or regenerated) are able to engage in Natural Theology, and how. Thirdly, the relationship between Natural theology and the articles of faith. Fourthly, the uses and limitations of natural theology. Fifthly, the effect of Natural Theology.</p></blockquote>

<blockquote><p>From the sixteenth century until the beginning of the twentieth, no Reformed theologian I know of denied the validity of natural theology derived from natural revelation. The strong antipathy in our day to theology based on unaided human speculation has brought in its wake a widespread and wholesale rejection of all natural theology.

This departure, in part a reaction against Enlightenment rationalism, is a departure from historic Reformed theology and from biblical theology. Both Roman Catholicism and historic Reformed theology embraced natural theology gleaned from natural revelation. The reason for this substantial agreement is because the Bible, which both sides regarded as a special revelation, clearly teaches that, in addition to God’s revelation of himself in Scripture, there is also the sphere of divine revelation found in nature.

Classical theology made an acute distinction between special revelation and general revelation. The two kinds of revelation are distinguished by the terms special and general because of the difference in content-scope and in the audience of each. Special revelation is special because it provides specific information about God that cannot be found in nature. Nature does not teach us God’s plan for salvation; Scripture does. We learn many more specifics about the character and activity of God from Scripture than we can ever glean from creation.

The Bible is also called special revelation because the information contained in it is unknown by people who have never read the Bible or had it proclaimed to them. General revelation is general because it reveals general truths about God and because its audience is universal. Every person is exposed to some degree to God’s revelation in creation.</p></blockquote>

<blockquote><p>The infinite God cannot be fully known by any of His creatures, but that there is a knowledge of Him within the reach of His creatures of mankind, is apparent from the very constitution of their nature, as well as from the relation in which they stand to Him.

That knowledge reveals to them His spirituality and His glory, as well as His providential care, that “they may seek Him, if haply they may feel after Him and find Him, though He is not far from every one of us.”

This view of the divine nature is furnished by observation of the works of God, and is also the dictate of our own consciousness, which tells us that we are not self-made and selfsustained, but that we are the children of a divine Father and the subjects of His supreme rule.

The Atheist denies the truth that there is a God; and the Pantheist affirms that there is nothing else but God. Both of these errors are renounced by enlightened reason. It refuses to be blind to the great fact of the divine existence. It also rejects the notion that this God is merely an infinite substance — a vague immensity. There is one living and true God, but in Him all being is not absorbed. He is in all; but everything is not God.</p></blockquote>

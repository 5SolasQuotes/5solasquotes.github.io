<main class="wrap"><figure class="quote" id="q-968ee9543b" data-kw="">
<blockquote><p>Any positives not warranted by some special word of God shall be additions to the Word of God: But these are expressly forbidden, Dt. 4:2; 12:32; Prov. 30:6; Rev. 22:18-19. To this Formalists [Anglicans, etc.] answer: 1. They have a general commandment of God, though not a special. Answer: So have all the unwritten traditions of Papists; hear the Church, she is Magistra fidei [Teacher of the Faith]; so does the Papist Horantius answer Calvin, that the Spirit of God has given a general and universal knowledge of mysteries of Faith and ceremonies belonging to religion, but many particulars are to be received by tradition from the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) Westminster divine | Introduction, section 4, pp. 51-2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f100654c4" data-kw="">
<blockquote><p>…notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canticles, or Song of Songs, Opened &amp; Explained</cite>, … (London, 1642), ch. 2, pp. 60-61</span></figcaption>

</figure><figure class="quote" id="q-72d522d913" data-kw="">
<blockquote><p>Concerning worshipping or honoring (which two terms are both one)… Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like… God has created us and made us unto his own likeness; and our Saviour Christ has bought us with his blood. And therefore are we God’s possession, of duty and right; and Christ’s servants only, to wait on his will and pleasure, and ought therefore to move neither hand nor foot, nor any other member, either heart or mind, otherwise than He has appointed. God is honoured in his own person, when we receive all things, both good and bad, at his hand; and love his law with all our hearts; and believe, hope, and long for all that He promises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57</span></figcaption>

v>

<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law.

11. The end of the First Commandement is that God among his people will bear rule ouer all, and wholly enjoy his authority. And to the end that this may come to pass, He commands all impiety, and all false opinions concerning God to be far from us: and in like sort, He enjoins Himself to be worshipped and adored of us in the true practice of godliness.

12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded and Disputed in the University of Geneva, by certain Students of Divinity there, under Mr. Theodore Beza and Mr. Anthony Faius</cite>, (London: 1591), ch. 29, pp. 67-68</span></figcaption>

</figure><figure class="quote" id="q-12bc9a21f6" data-kw="">
<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), ‘The Distribution of Theology’</span></figcaption>

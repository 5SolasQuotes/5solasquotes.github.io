<main class="wrap"><figure class="quote" id="q-1f13590bfd" data-kw="">
<blockquote><p>Now if a minister give the sacrament [of the Supper] unto known unworthy persons, that are not such juridically [by Church courts], there is not hereby any transgression of the rule of Christ in regard of the sacrament itself, which notwithstanding this may fully and entirely be administred according to the command of Christ. But there will follow a transgression of the rule of Christ hereby, in respect of the effect of the sacrament, and consequently the dispositions and qualifications required in receivers to make the sacrament effectual: but this is not a fault chargeable upon the minister if he do his best to prevent it.</p></blockquote>

<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VI &amp; VIII, pp. 35-37</span></figcaption>

</figure><figure class="quote" id="q-d59228e329" data-kw="">
<blockquote><p>…in hearing the Gospel? for therein we receive spiritually the body and blood of Christ, and that as truly and really as in the sacrament. Whereupon the Archbishop of Armagh [James Ussher] shows that the spiritual and inward feeding upon the body and blood of Christ is to be found out of the Sacrament, and that diverse of the Fathers do apply the sixth [chapter] of John to the hearing of the Word also, as Clemens Alexandrinus, Origen, Eusebius Caesariensis and others. Basilius Magnus likewise teaches plainly that we eat the flesh of Christ in his Word and Doctrine. This I am sure no man dare deny.</p></blockquote>

</figure><figure class="quote" id="q-7dc555aaa8" data-kw="">
<blockquote><p>Now besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us, signifies veneration or reverence, sitting at table signifies familiarity and fellowship. ‘For which of you,’ says our Master, ‘having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat.’ [Lk. 17:7] All these signs have their significations from nature. And if it be said that howbeit sitting at our common-tables be a sign natural, to signify familiarity amongst us, yet nature has not given such a signification to sitting at the Lord’s Table, I answer that sitting is a natural sign of familiarity at what table soever it be used. At the heavenly table in the Kingdome of Glory familiarly is expressed and signified by sitting, Mt. 8:11, ‘Many shall come from the east and west, and shall sit down with Abraham, etc.’ Much more then at the spiritual table in the Kingdom of Grace. The difference betwixt other common tables and the Lord’s Table can infer no more but that with great humility we ought to addresse ourselves unto it: yet still we are to make use of our familiarity with Christ ut tanquam in eodem toro accumbentes, as says Chrysostom. Wherefore we do not there so look to Christ in his princely throne and glorious majesty, exalted far above all principalities and powers, as to forget that He is our loving and kind banqueter, who has admitted us to that familiar fellowship with Him, which is signified by our sitting at his table.</p></blockquote>

— George Gillespie, English-Popish Ceremonies (1637), pt. 3, ch. 5, pp. 85-86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+besides+the+sacred+signs+of+God%E2%80%99s+own+institution%2C+we+know+that+natural+signs+have+also+place+in+divine+worship%3B+thus+kneeling+in+time+of+prayer+signifies+the+submission+of+our+hearts+and+minds%2C+the+lifting+up+of+our+eyes+and+hands+signifies+the+elevation+of+our+affections%2C+the+renting+of+the+garments+signified+the+renting+of+the+heart+by+sorrow%2C+standing+with+a+religious+respect+to+that+which+is+before+us%2C+signifies+veneration+or+reverence%2C+sitting+at+table+signifies+familiarity+and+fellowship.+%E2%80%98For+which+of+you%2C%E2%80%99+says+our+Master%2C+%E2%80%98having+a+servant+plowing+or+feeding+cattle%2C+will+say+unto+him+by+and+by%2C+when+he+is+come+from+the+field%2C+go+and+sit+down+to+meat.%E2%80%99+%5BLk.+17%3A7%5D+All+these+signs+have+their+significations+from+nature.+And+if+it+be+said+that+howbeit+sitting+at+our+common-tables+be+a+sign+natural%2C+to+signify+familiarity+amongst+us%2C+yet+nature+has+not+given+such+a+signification+to+sitting+at+the+Lord%E2%80%99s+Table%2C+I+answer+that+sitting+is+a+natural+sign+of+familiarity+at+what+table+soever+it+be+used.+At+the+heavenly+table+in+the+Kingdome+of+Glory+familiarly+is+expressed+and+signified+by+sitting%2C+Mt.+8%3A11%2C+%E2%80%98Many+shall+come+from+the+east+and+west%2C+and+shall+sit+down+with+Abraham%2C+etc.%E2%80%99+Much+more+then+at+the+spiritual+table+in+the+Kingdom+of+Grace.+The+difference+betwixt+other+common+tables+and+the+Lord%E2%80%99s+Table+can+infer+no+more+but+that+with+great+humility+we+ought+to+addresse+ourselves+unto+it%3A+yet+still+we+are+to+make+use+of+our+familiarity+with+Christ+ut+tanquam+in+eodem+toro+accumbentes%2C+as+says+Chrysostom.+Wherefore+we+do+not+there+so+look+to+Christ+in+his+princely+throne+and+glorious+majesty%2C+exalted+far+above+all+principalities+and+powers%2C+as+to+forget+that+He+is+our+loving+and+kin

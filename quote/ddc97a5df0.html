<main class="wrap"><figure class="quote" id="q-ddc97a5df0" data-kw="">
<blockquote><p>Concerning penitence, which embraces in itself the fear of God, and almost all other acts, there occur (as we have shown before) very many passages in Scripture, in which it is set forth as a necessary means through which to obtain pardon of sins, or (what in fact is the same thing) as a condition under which God (ultimately of his own gratuitous promise) forgives sin. Who will deny that these in some sense have the nature of a cause, except he who is more pleased with the pugnacity of disputing, and the desire of cavilling, than with the love of the truth? How often is forgiveness of sins described in Scripture as the effect or fruit of penitence? (Isa. 1:16-19; 56:4-12; Jer. 18:7-8; Joel 2:12-14; Jonah 3:10, etc.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-758c05857d" data-kw="">
<blockquote><p>Because repentance from sin is frequently in the holy Scripture made a condition going before remission and a cause without which we shall not have it, it so orders its exhortations that it may drive us to true repentance and true sanctity that so we may obtain remission. So the prophets, John Baptist, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses Salmuriensis</cite>, vol. 2, Disputation on Satisfaction, p. 63 as trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 338</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“Because repentance from sin is frequently in the holy Scripture made a condition going before remission and a cause without which we shall not have it, it so orders its exhortations that it may drive us to true repentance and true sanctity that so we may obtain remission. So the prophets, John Baptist, etc.”

— Moses Amyrauld, Theses Salmuriensis, vol. 2, Disputation on Satisfaction, p. 63 as trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 338">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause+repentance+from+sin+is+frequently+in+the+holy+Scripture+made+a+condition+going+before+remission+and+a+cause+without+which+we+shall+not+have+it%2C+it+so+orders+its+exhortations+that+it+may+drive+us+to+true+repentance+and+true+sanctity+that+so+we+may+obtain+remission.+So+the+prophets%2C+John+Baptist%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Moses+Amyrauld%2C+Theses+Salmuriensis%2C+vol.+2%2C+Disputation+on+Satisfaction%2C+p.+63+as+trans.+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+1655%29%2C+ch.+10%2C+sect.+3%2C+p.+338&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F758c05857d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/758c05857d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=Because%20repentance%20from%20sin%20is%20frequently,So%20the%20prophets%2C%20John%20Baptist%2C%20etc&amp;text=Because%20repentance%20from%20sin%20is%20frequently%20in%20the&amp;text=obtain%20remission.%20So%20the%20prophets%2C%20John%20Baptist%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b2f5dcfd25" data-kw="">
<blockquote><p>There is a great difference between vocation and justification. Vocation precedes, justification follows. Justification praesupponit aliquid [presupposes something], viz. faith and repentance; Effectual Calling ponit haec, non autem praesupponit [posits this, but does not presuppose it]. (Conference between Cameron and Tilen)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 512</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“There is a great difference between vocation and justification. Vocation precedes, justification follows. Justification praesupponit aliquid [presupposes something], viz. faith and repentance; Effectual Calling ponit haec, non autem praesupponit [posits this, but does not presuppose it]. (Conference between Cameron and Tilen)”

</figure><figure class="quote" id="q-5b7beba402" data-kw="">
<blockquote><p>As for repentance and new obedience; there is as much difference between them and faith, in regard of its peculiar office, in this latter [New] Covenant; so much more between them and works in the former [Old Covenant]. 1. Between them and faith, in the point of justification, or the discharge of a sinner from the guilt of his sins; for that, howsoever they are both required as conditions to be necessarily performed by all those that expect life, or pardon of sin, and salvation by Christ; yet neither of them comes in, as having any hand in the business of our justification, or discharge of us from the guilt of our sin; because that neither do they cast ought in toward the discharge of our debt, nor have they any peculiar act in the application of, or special relation unto, that whereby our debt is discharged. Whereas our faith, though it afford not the least mite of itself toward the making up of that price wherewith our debt is to be discharged, yet it is that whereby we receive Jesus Christ (Jn. 1:12) and in Him and with Him the price by Him paid for us, and whereby we trust to Him and rely upon Him for the discharge of our debt by the merit of his sufferings: in regard whereof it is called, as ‘faith on Christ’ (Acts 20:21; 26:18), so more specially, on his blood. (Rom. 3:25)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shadows without Substance</cite>, Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“As for repentance and new obedience; there is as much difference between them and faith, in regard of its peculiar office, in this latter [New] Covenant; so much more between them and works in the former [Old Covenant]. 1. Between them and faith, in the point of justification, or the discharge of a sinner from the guilt of his sins; for that, howsoever they are both required as conditions to be necessarily performed by all those that expect life, or pardon of sin, and salvation by Christ; yet neither of them comes in, as having any hand in the business of our justification, or discharge of us from the guilt of our sin; because that neither do they cast ought in toward the discharge of our debt, nor have they any peculiar act in the application of, or special relation unto, that whereby our debt is discharged. Whereas our faith, though it afford not the least mite of itself toward the making up of that price wherewith our debt is to be discharged, yet it is that whereby we receive Jesus Christ (Jn. 1:12) and in Him and with Him the price by Him paid for us, and whereby we trust to Him and rely upon Him for the discharge of our debt by the merit of his sufferings: in regard whereof it is called, as ‘faith on Christ’ (Acts 20:21; 26:18), so more specially, on his blood. (Rom. 3:25)”

</figure><figure class="quote" id="q-59214cadd3" data-kw="">
<blockquote><p>1. Justification is an action, by which God makes an ungodly man righteous, according to the good pleasure of his will, and without any merit of his own for salvation… 9. Therefore, although it is said figuratively, yet fittingly and truly, we say that we are justified by faith alone, comparing it with works and merits, and not by the works of the law, but by faith freely in our Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction: On Justification by Faith in Theological Theses for Exercises in Public Disputations in the Famous Academy at Leiden</cite>, (1584) at ReformedOrthodoxy.org The relevance here is Junius defining the issue as one of merit and saying that Justification by faith is a figurative expression.</span></figcaption>

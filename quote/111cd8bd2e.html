<main class="wrap"><figure class="quote" id="q-111cd8bd2e" data-kw="">
<blockquote><p>Why he [Christ] offered up himself by the eternal Spirit. O great! Even by his eternal Godhead; a valuable sacrifice indeed! They [mercy and justice] meet together in him, as a propitiation, Rom. 3.25. Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness, &amp;c. Behold him righteous in shewing mercy; here is the atonement, the propitiation, that very word which the Septuagint calls the mercy-seat in the old testament; and it is the word that the poor publican made use of, when he was seeking mercy, saying, God be merciful to me a sinner. He remembered this mercy-seat and propitiation. It is not simple mercy that he sought, but mercy through a propitiation; he looked to the blood of atonement, to the sacrificed lamb of God, saying, Give me mercy for this; by that solemn propitiation be thou propitious to me.

Here it is, that mercy and justice meet together. They meet together in him, as a ransom, Job 33.24. Deliver his soul from going down to the pit; I have found a ransom. In a word they have met together, and kissed one another in a crucified Christ, whose death was the payment of our debt, the punishment of our sin, the price of our redemption, and a purchase of our life, liberty and eternal salvation. Here is the meeting-place then of these glorious perfections of God; here is the person in whom they centre, that they may be all glorified to the highest: Mercy, truth, righteousness and peace, all are pleased. Mercy is gratified, and constitutes him to be the mercy-seat; truth is satisfied, and centers in him as the way, the truth and the life; righteousness is contented, and declares him to be the Lord our righteousness; peace is pacified, &amp; proclaims him to be the prince of peace.

Yea, not only are all the members of the meeting pleased and satisfied for themselves, in the advancement of their own particular interest, but they are infinitely well pleased in each other, and that the interests of their seemingly opposite parties are advanced, as well as their own particular claims: Mercy is pleased that truth hath got all its demands, and truth is pleased that mercy hath got all her desire, and righteousness is pleased that peace is proclaimed, and peace is pleased that righteousness is honoured. Mercy and peace rejoice that they are magnified to the infinite glory of truth and righteousness, and truth and righteousness rejoice that they are glorified to the infinite pleasure of mercy and peace: and hence they not only meet together, but kiss one another.</p></blockquote>

<blockquote><p>Objection #6: “And for this cause He is the Mediator of the New Testament, that by means of death, for the redemption of the transgressions that were under the first testament, they which are called might receive the promise of eternal inheritance” (Heb. 9:15). Here the apostle shows that those sins which had been committed during the Old Testament were first atoned for by the death of Christ; that is, at the time when Christ died. If they were then first atoned for, they were not previously atoned for, but constituted an outstanding debt charged to the account of believers who did not have the forgiveness of sins; their sins were only bypassed. Answer: (1) We state once more that Scripture does not differentiate between paresis and aphesis, or between forgiving and overlooking something. God’s righteousness does not permit the one any more than the other. If He can bypass sin by overlooking it, He can also forgive sin—yes, to forgive and to bypass are one and the same thing. If the sins of the Old Testament believers had not been atoned for because the actual satisfaction had not yet been made, then Old Testament believers would have had no forgiveness whatsoever. No matter how one wishes to express this, they would then have lived and died in an entirely unreconciled state, and consequently would have gone lost. Since they were saved, however, they were therefore also reconciled, and thus their sins had been forgiven them. (2) We must make a distinction between the act by which the atonement was merited and the efficacy of this act. The act by which the atonement was merited occurred only once; it was accomplished at the time of Christ’s suffering. In the Old Testament the act of atonement had not been performed as yet. Christ had not yet come into the flesh, and had neither suffered nor died. This is a known fact, admitted by everyone. However, the efficacy of the act of atonement does not only pertain to the New Testament and to sins which had not occurred but would be committed. Rather, it also pertains retroactively to the sins of Old Testament believers since the time of Adam. One will have to admit that the bearing with and the bypassing of sin the Old Testament occurred by virtue of the efficacy of this act, and that believers by reason of this atoning act have been saved. This means that Christ’s atoning act was already efficacious several thousand years prior to its actual occurrence. If it was efficacious unto the overlooking of sin and unto salvation, it was efficacious unto atonement and forgiveness. (3) The text itself shows that Old Testament believers did have the atonement and forgiveness. It states very clearly that the death of Christ was for the redemption of the transgression of those who were under the first testament. Believers were therefore partakers of this redemption in the Old Testament. Or is it true that Old Testament believers first received redemption at the time of the death of Christ? Did those who were called not receive the promise of eternal inheritance until Christ’s death; and did they only then enter heaven? Were they, prior to Christ’s death, imprisoned in limbus patrum, a fabrication of popery? Did Christ only remove them from there after His death? Indeed not! They have received the promise of eternal inheritance already after their death. They have entered heaven—as the opposing party admits and acknowledges—by reason of the redemption of their transgressions through the death of the Mediator, who is here declared to be the cause of their receiving their inheritance. To have been in heaven and enjoyed a complete salvation while yet being unreconciled; to have enjoyed perfect communion with God for several thousand years, and not to have received redemption until thereafter—consequently to have obtained the forgiveness of sins while in heaven—is altogether contradictory. (4) That Christ is called the Mediator of the New Testament is of no support to the opposing party, for they themselves admit that Christ was also Surety and Mediator during the Old Testament era. The covenant of grace is one and the same covenant since Adam and will continue unchanged until Christ returns unto judgment. This testament is called “new” relative to its administration. Upon the coming of the Mediator, who is the embodiment of the shadows, the entire ceremonial worship ceases, and the more excellent administration of this Mediator begins—and thus He is called the Mediator of the New Testament.</p></blockquote>

0%99s+suffering.+In+the+Old+Testament+the+act+of+atonement+had+not+been+performed+as+yet.+Christ+had+not+yet+come+into+the+flesh%2C+and+had+neither+suffered+nor+died.+This+is+a+known+fact%2C+admitted+by+everyone.+However%2C+the+efficacy+of+the+act+of+atonement+does+not+only+pertain+to+the+New+Testament+and+to+sins+which+had+not+occurred+but+would+be+committed.+Rather%2C+it+also+pertains+retroactively+to+the+sins+of+Old+Testament+believers+since+the+time+of+Adam.+One+will+have+to+admit+that+the+bearing+with+and+the+bypassing+of+sin+the+Old+Testament+occurred+by+virtue+of+the+efficacy+of+this+act%2C+and+that+believers+by+reason+of+this+atoning+act+have+been+saved.+This+means+that+Christ%E2%80%99s+atoning+act+was+already+efficacious+several+thousand+years+prior+to+its+actual+occurrence.+If+it+was+efficacious+unto+the+overlooking+of+sin+and+unto+salvation%2C+it+was+efficacious+unto+atonement+and+forgiveness.+%283%29+The+text+itself+shows+that+Old+Testament+believers+did+have+the+atonement+and+forgiveness.+It+states+very+clearly+that+the+death+of+Christ+was+for+the+redemption+of+the+transgression+of+those+who+were+under+the+first+testament.+Believers+were+therefore+partakers+of+this+redemption+in+the+Old+Testament.+Or+is+it+true+that+Old+Testament+believers+first+received+redemption+at+the+time+of+the+death+of+Christ%3F+Did+those+who+were+called+not+receive+the+promise+of+eternal+inheritance+until+Christ%E2%80%99s+death%3B+and+did+they+only+then+enter+heaven%3F+Were+they%2C+prior+to+Christ%E2%80%99s+death%2C+imprisoned+in+limbus+patrum%2C+a+fabrication+of+popery%3F+Did+Christ+only+remove+them+from+there+after+His+death%3F+Indeed+not%21+They+have+received+the+promise+of+eternal+inheritance+already+after+their+death.+They+have+entered+heaven%E2%80%94as+the+opposing+party+admits+and+acknowledges%E2%80%94by+reason+of+the+redemption+of+their+transgressions+through+the+death+of+the+Mediator%2C+who+is+here+declared+to+be+the+cause+of+their+receiving+their+inheritance.+To+have+been+in+heaven+and+enjoyed+a+complete+salvation+while+yet+being+unreconciled%3B+to+have+enjoyed+perfect+communion+with+God+for+several+thousand+years%2C+and+not+to+have+received+redemption+until+thereafter%E2%80%94consequently+to+have+obtained+the+forgiveness+of+sins+while+in+heaven%E2%80%94is+altogether+contradictory.+%284%29+That+Christ+is+called+the+Mediator+of+the+New+Testament+is+of+no+support+to+the+opposing+party%2C+for+they+themselves+admit+that+Christ+was+also+Surety+and+Mediator+during+the+Old+Testament+era.+The+covenant+of+grace+is+one+and+the+same+covenant+since+Adam+and+will+continue+unchanged+until+Christ+returns+unto+judgment.+This+testament+is+called+%E2%80%9Cnew%E2%80%9D+relative+to+its+administration.+Upon+the+coming+of+the+Mediator%2C+who+is+the+embodiment+of+the+shadows%2C+the+entire+ceremonial+worship+ceases%2C+and+the+more+excellent+administration+of+this+Mediator+begins%E2%80%94and+thus+He+is+called+the+Mediator+of+the+New+Testament.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+The+Christian%E2%80%99s+Reasonable+Service%2C+ed.+Joel+R.+Beeke%2C+trans.+Bartel+Elshout%2C+vol.+4+%28Grand+Rapids%3A+Reformation+Heritage+Books%2C+1995%29%2C+471%E2%80%9372.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F48a561d715.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/48a561d715.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/08/brakel-vs-the-limbus-patrum/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>For the Kind, we must beware how we put the New Creature in the room of Christ: it is not so available as our blessed Lord Jesus is, who is the only Foundation, on which the Church is built, 1 Cor. 3.10. And able to save to the uttermost, Heb. 7.25. No Creature must be set up in competition with him, for there’s no Salvation in any other, Acts 4.12.

And herein I am afraid the Quakers are guilty of a gross Heresy, who call us from a Christ without us, to a Christ within us: yea, it hath been a dispute in the Plantation, called Pennsylvania, whether we must believe only in a Christ within us, or a Christ both within and without us, and it was carried mostly in the former Sense: But let no man be drawn from placing his entire confidence in Christ the Son of God, both God and Man in one Person, who suffered Death on the Cross, to make atonement for Sinners, and now sits on the right hand of God to make intercession for us.

2. If by a Christ within, they mean that called Light within, either Free will or Natural Conscience, or a power to help our selves without special Grace, its an exploded Error, and it’s to be feared, the Jesuits deliver their Popish stuff out of these men’s Mouths with refined Language. 3. If by Christ within, be meant Christ’s Person in the Believer, that he is Christed or Goded, ’tis blasphemy. 4. If by this expression, Christ within us, the hope of glory, Col. 1.27. or Christ dwelling in our hearts by faith, Eph. 3.17.</p></blockquote>

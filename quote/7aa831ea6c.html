<main class="wrap"><figure class="quote" id="q-7aa831ea6c" data-kw="">
<blockquote><p>The person of Christ, is one, because Christ is one… There are two natures in the person of Christ, the divine, and the humane nature. Therefore Jesus Christ is true God, and true man in one person. Rom. 1:3-4; and 9:5; 1 John 4:2; 1 Tim. 3:16; Col. 2:9; Heb. 2:14,16; John 1:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion… (London, 1595), ‘…Now Concerning the Gospel’</cite>, p. 64</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c953dba82" data-kw="">
<blockquote><p>This accusation [of incoherency against classical theism] is plausible so long as one is compelled to hold either that the divine Word subtracted something from Himself in assuming a human nature or added something to Himself. But contrary to widespread recent opinion, subtraction and addition are not the only options. Thomas Aquinas, among others, repudiates both these approaches, expounding instead a doctrine of terminative assumption. Termination eludes the liabilities of subtraction and addition by requiring neither privation of being nor passive potency in the divine Word in order to account for his becoming man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dolezal.html">James Dolezal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’Neither Subtraction, Nor Addition: The Word’s Terminative Assumption of a Human Nature’ Nova et Vetera, vol. 20, no. 1 (Winter, 2022) 23 pp.</cite></span></figcaption>

</figure><figure class="quote" id="q-41015c7b52" data-kw="">
<blockquote><p>It is diverse and another thing, not to have beginning, and to subsist by a beginning: to die, and not to be able to suffer: yet, as they are both proper unto Christ, so are they both common, not unto him, but in Him. For if we say, common unto Him: we must needs be urged and driven, to give and show some other, with whom the same should be common unto Him: which necessity of instance, cannot but incline to the impious opinion of Nestorius. We therefore better and more catholically say, it is common in Him and not to Him: and so we say better, it is proper to Him, and not in Him. Therefore it is proper to Him to die, by the nature of his flesh, which is mortal: and it is proper to Him, not to die, by the nature of the Word, which cannot die.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion… (Cambridge, 1599) | ‘An Appendix to the Eleventh chapter, ‘Of Christ the Redeemer, or of the Person of Christ”</cite>, p. 354</span></figcaption>

<blockquote><p>Systematic Theology – embracing the development into an all-embracing and self-consistent system of contents of that Revelation, and its subsequent elucidation and defence. …

10. What is embraced under the head of Systematic Theology[?]

As the name imports, Systematic Theology has for its object the gathering all that the Scriptures teach as to what we are to believe and to do, and the presenting all the elements of this teaching in a symmetrical system. The human mind must seek unity in all its knowledge. God’s truth is one, and all the contents of all revelations natural and supernatural must constitute one self-contained system, each part organically related to every other.

The method of construction is inductive. It rests upon the results of Exegesis for its foundation. Passages of Scripture ascertained and interpreted are its data. These when rightly interpreted reveal their own relations and place in the system of which the Person and work of Christ is the centre. And as the contents of revelation stand intimately related to all the other departments of human knowledge, the work of Systematic Theology necessarily involves the demonstration and illustration of the harmony of all revealed truth with all valid science, material and psychological, with all true speculative philosophy, and with all true moral philosophy and practical philanthropy.

It includes — (1.) The construction of all the contents of revelation into a complete system of faith and duties. (2.) The history of this process as it has prevailed in the Church during the past. (3.) Polemics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York: Robert Carter and Brothers, 1879), pp 17, 22.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e59b32ddfd" data-kw="">
<blockquote><p>Metaphysics is defined as the science of being qua [as] being… Metaphysics can, therefore, be described as the first real speculative science. It is a science because it is a body of demonstrated truths about a single formal object… Insofar as it is a science, metaphysics differs from sacred theology because the latter is not a science in the strict Aristotelian sense for its principles are not evident but revealed. Metaphysics is a real science, as is plain from its definition. For being signifies the same as thing or what actually exists or is at least capable of such existence. Therefore metaphysical notions are first intentions, or concepts that are predicated immediately of things themselves. So metaphysics differs from the logical sciences which deal with second intentions, that is, with concepts that are predicated immediately of other concepts or of beings of reason. Metaphysics indeed is the first or supreme real science, and so differs from other less universal real things, as physics, cosmology, psychology; for it does not just consider one or other part of reality, as these sciences do, but with the totality of things. Therefore, by reason of its material object, metaphysics is equivalent to all the real sciences taken together. Further, it is first by reason of its formal object; for the other sciences consider real things in some narrower respect, as physics considers things as changeable, cosmology things as bodily, etc. But metaphysics considers them precisely as they are real. Hence other real sciences, as cosmology, philosophy of man, presuppose metaphysics and use its conclusions as their principles. But metaphysics does not use the conclusions of any other real science, physics or natural philosophy, as principles. Metaphysics is a speculative and not practical science, because it does not tend toward any other operation but speculation. Hence it differs from ethics, which is practical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Intro, pp. 7-8</span></figcaption>

<blockquote><p>Furthermore, it seems that to proceed against the cruelty of tyrants is an action to be undertaken not through the private presumption of a few, but rather by public authority. If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power. It must not be thought that such a multitude is acting unfaithfully in deposing the tyrant, even though it had previously subjected itself to him in perpetuity, because he himself has deserved that the covenant with his subjects should not be kept, since, in ruling the multitude, he did not act faithfully as the office of a king demands.

Thus did the Romans, who had accepted Tarquin the Proud as their king, cast him out from the kingship on account of his tyranny and the tyranny of his sons; and they set up in their place a lesser power: namely, the consular power. Similarly Domitian, who had succeeded those most moderate emperors, Vespasian, his father, and Titus, his brother, was slain by the Roman senate when he exercised tyranny, and all his wicked deeds were justly, and profitably, declared null and void by a decree of the senate. Thus it came about that Blessed John the Evangelist, the beloved disciple of God, who had been exiled to the island of Patmos by that very Domitian, was sent back to Ephesus by a decree of the senate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 6.</span></figcaption>

<blockquote><p>A distinction after some work of the mind (distinction of reason, logical distinction, mental distinction) is a lack of identity that arises from an operation of the mind, whether with or without a foundation in the thing. Such a distinction flourishes between several concepts of one and the same reality and it is acquired insofar as the mind conceives the same thing according to diverse and distinct concepts each one of which represents the whole reality, but partially and not totally. The concepts are distinct and diverse but incomplete and inclusive. This distinction is either: A. with a foundation in the thing (a distinction of reasoned reason, intentional or virtual distinction), if from the real diversity of the effect that arises from one and the same formal cause the intellect has a reason or a foundation for distinguishing diverse respects in the cause itself. So in the light of the sun, for instance, there is a distinction between the powers of heating, illumining, and liquefying; in the human intellect there is a distinction between the faculties of conceiving, judging, and reasoning. B. without a foundation in the thing (distinction purely mental, distinction of reasoning reason) if the reason for distinguishing is not found in the thing but in some being of reason, for instance the distinction between man and humanity, or between ‘man’ and ‘man’s’.</p></blockquote>

<blockquote><p>Thus, intellect and reason may not be considered as a basis for, as a rule to go by, or as a touchstone, in determining whether that which God reveals in His Word is truth. We believe this solely … because God declares it to be so. Reason must surrender itself to the Word; the Word must never surrender itself to reason. Reason is to Scripture what Hagar was to Sarah; it is the servant and not the master.</p></blockquote>

</figure><figure class="quote" id="q-b0ab03280e" data-kw="">
<blockquote><p>…the Canon law prohibiting to depart or swerve from the rules and discipline of the Roman Church, yet excepts discretionem justitiae [the discretion of righteousness], and so permits to do otherwise than the Church prescribes, if it be done cum discretione justitiae [with the discretion of righteousness]. The [Romaninst] Schoolmen also give liberty to a private man of proving the statutes of the Church, and neglecting the same, if he see cause for doing so, Si causa fit evidens, per se ipsum licite potest homo, statuti observantiam praeterire. If any be not able to examine and try all such things, debebant omnes posse, Dei jussu: deficiunt ergo sua culpa [all being able to keep the command of God, therefore they default by their own fault], says Pareus. Si recte probandi facultate destitui nos sentimus, ab eodem spiritu qui per prophetas suos loquitur petenda est, says Calvin. We will not then call any man Rabbi, nor jurare in verba magistri [swear on the words of a magistrate], nor yet be Pythagorean disciples to the Church herself, but we will believe her and obey her insofar only as she is the pillar and ground of truth.</p></blockquote>

0pillar%20and%20ground%20of%20truth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dcc315b710" data-kw="">
<blockquote><p>But may one say, if the decrees of a Synod concerning matters of faith or worship, may and ought to be examined by the sure rule of the Word of God, and only to be received when they do agree therewith; and if also the constitutions of a Synod in external circumstances do not bind, except ex aeque et bono [out of equity and good], and propter regula mandandi causas [due to commanding according to just causes]: or, as divines speak, in casu scandali &amp; contemptus [in the case of scandal and contempt], and not for the mere will or authority of a synod… as our divines maintain and prove against Papists. … Our divines, by those their tenets, mean not to open a door to disobedience and contempt of the ordinances of a synod, but only to oppugne the Popish error concerning the binding power of ecclesiastical laws, by the sole will and naked authority of the law-maker, and that Christian people ought not to seek any further reason or motive of obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, … (Edinburgh, 1641), pp. 152-3</span></figcaption>

f%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6649a5160f" data-kw="">
<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in:

1. Propounding and expounding God’s laws.

2. In executing them and defending them from the violence of men.

3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>

</figure><figure class="quote" id="q-69ab1882fd" data-kw="">
<blockquote><p>But it will be objected, That all the ministers of Scotland, who entered before the year 1649, should by this means be condemned as intruders, entering without a lawful call. Answer: Though patronages cannot but be condemned as sinful, and tending to ruin the Church, and to defraud her of much advantage, yet such as entered that way, before the year 1649, cannot altogether be condemned; partly, because then the evil of it was not seen and perceived; partly, because that evil had not been reformed, and there was no other way of entry practiced, or practicable by law; and so, though they might groan under that burden, yet they could not get it helped.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

</figure><figure class="quote" id="q-102ae20223" data-kw="">
<blockquote><p>Usually we find the weakest spirits are most violent, there being nothing of judgment to counterbalance affliction. Men are all flame and rage. Liquors, when they run low, and are upon the dregs, they grow more tart and sour: So ’tis usually with the dregs of men; for, when they are weak and run low in parts, their opposition is most troublesome. What ado in the ministry have we with young heady professors, that have more heat than light?</p></blockquote>

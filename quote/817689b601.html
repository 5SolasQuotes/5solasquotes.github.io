<main class="wrap"><figure class="quote" id="q-817689b601" data-kw="">
<blockquote><p>I had sometimes served heartily a volunteer in the military, to suppress the mad attempts of the enemies to the Revolution, headed and commanded by one Graham of Claverhouse, who sought to overthrow the Revolution footing, and restore the abdicate King James. I was a hearty Revolutioner, and a great adorer of God’s goodness to these lands, in sending that great man, King William, to overthrow our enemies and redeem us from slavery. …

But alas, alas ! before that project was ripe, I met with some, who otherwise were good men, but they had stated a separation from church and state, after the Revolution, … I at last was overcome with their arguments, joined with them, in the inadvertent simplicity of my heart, and being influenced with a zeal not altogether according to knowledge, I continued embarked in communion with them for some time, which laid a foundation for a train of many after trials to me; for I quickly found that I was out of the frying-pan into the heart of the fire : for, though I saw great reason for these grievances on the government side, yet, amongst the dissenters, I found many grievances, some of which were intolerable unto me, and are as follows.-

Their criticising upon and censuring of all others who are not exactly of their judgment in every punctilio, grievously aggravating their faults, and often fixing some, where there is none; yea, seldom sparing one another, even where they are one in judgment; their making the terms of their communion straiter than what God allows in his word. They will allow no masters of families to be of their communion who pay any taxes to the present government, making no difference betwixt this legal and the former illegal and tyrannical government. They will allow no children nor servants to be in their communion who obey their parents and masters in doing any service to those in public trust in the government.

They will allow none to hear any of the present ministry, even though transiently, to be in their communion. They spend the most part of their precious time in arguing and praying against the sins and defections of the public, neglecting to watch the heart; and here, to my shame, I was greatly guilty of this, among others. We spent much of our precious time in framing arguments to debate with others, greatly neglecting to be distinctly acquainted with the principles of the Christian religion, and to be savingly acquainted with the inward and serious part of real godliness.

They would publish a declaration, disowning the authority of the great King William, and against the validity of the present church communion; and when I earnestly besought, with much entreaty, that every article of that declaration might be reasoned, they would not allow it upon which, I protested against it, for myself, and for all that would adhere unto me: for I thought and said, that since God, of his infinite goodness, had so wonderfully, graciously, and mercifully wrought such a great deliverance for us, and redressed so many of our former intolerable grievances, by sending in that great and famous instrument King William, that it was a despising of many valuable mercies, because we got not all we would and should have had; and that it was a reflecting dishonour on God, and on his worthy instrument, and was a sign of great ingratitude and unthankfulness in us, to refuse allegiance and obedience to King William and his government, he ruling under God, in the execution of the ancient law of this kingdom, for the preservation of our privileges sacred and civil; I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon any thing amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things according to the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or, Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters. Written by Himself</cite>, (Edinburgh: William Oliphant, 1827), pp 233-37.</span></figcaption>

<blockquote><p>There are several cases in which separation from the Church of England is sinful, as:

1. If any separate as the Papists do, because they are against sound doctrine or any good that is in the Church.

2. If any renounce communion with all the parish-churches under the name of the Church of England.

3. If any renounce communion with the Church of England as it is a Christian kingdom, headed by one Christian protestant king.

4. If they renounce communion with the Church of England as it is called one from the association or concord of its pastors or Church governors.

5. If any renounce communion with faulty bishops or worship, or discipline, simply and absolutely, and not only secundum quid [according to what; that is in a qualified manner], and so forsake the good that is in them for the sake of the evil. In a word, 1. all that separate for a wrong cause, 2. or further than they separate from Christ, or than Christ would have them separate, do sin. 2. But they that renounce any corruption as such, and the Church no further than secundum quid [according to that], as it is faulty, do well: For we must so renounce the faults of all Churches and Christians in the world (and our own first), but not the Churches and Christians for any tolerable faults, so that we commit no sin ourselves, which they impose as the condition of their communion.</p></blockquote>

<blockquote><p>…the decision of a Convention of Estates, or Parliament, in June to levy a ‘cess’, or tax, for the express purpose of raising additional troops to suppress the field-meetings. To Hamilton in particular, opposition to this tax became a test of orthodoxy, on a par with opposition to the indulgence. There is considerable evidence that in the summer and autumn of 1678 both he and Kersland sought to influence the younger field-preachers to adopt an increasingly militant tone in their preaching, and to condemn both those who payed the ‘cess’ and the ministers who had accepted the Indulgence. It is also clear that during this period both Hamilton and Kersland became increasingly associated with Richard Cameron… Throughout the 1670’s it had been customary for the leading field-preachers, such as John Welsh, to be accompanied by armed bodyguards as they moved around the country. This was seen as a necessary precaution for their own safety… Having attached himself to Cameron, Hamilton concluded that Cameron too should enjoy the same protection. He therefore gathered a body of men… whom he engaged to accompany Cameron around the country… Hamilton himself assumed the command of this group. A show of military order was observed, though neither Hamilton himself, nor, it apprears, any of those whom he led, had any military experience. However, it satisfied Hamilton’s fondness for demonstration and for display, and it was, of course, fully consistent with the militant approach which he advocated.</p></blockquote>

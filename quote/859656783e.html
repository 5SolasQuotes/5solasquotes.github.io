<main class="wrap"><figure class="quote" id="q-859656783e" data-kw="">
<blockquote><p>[On the words ‘through Jesus Christ’] This also let us always remember, that the whole benefit conferred by Christ pertains to this, that we abound in the gift of justice, living uprightly and orderly, adorned with every virtue, i.e., restored to the image of God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c5cb3f9194" data-kw="">
<blockquote><p>Two things are seen in Christ which are necessary to our justification: the one is death; the other, resurrection from the dead, etc. [Rom. 4:25] It was fitting that by his death the sins of the world should be expiated, etc. while by his resurrection from the dead, it pleased the same goodness of God to grant the Holy Ghost, through whom the gospel might be believed, and the justice that was lost by the sin of the first Adam might be restored. The apostle has expressed both parts in these words, ‘Who was delivered on account of our sins, etc. [and was raised again for our justification]’ [Rom. 4:25] In his death therefore is found satisfaction for sin; in his resurrection the gift of the Holy Ghost, by which our justification to life is effected…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-borrhaus.html">Martin Borrhaus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 Borrhaus (1499–1564) was a professor of philosophy and Old Testament at Basel in the reformed tradition. | On Gen. 15:4, pp. 161-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>5. The change, of course, has no degrees and is completed at one moment and in only one act. Yet, in manifestation, consciousness and effects, it has many degrees; therein lie justification and adoption.</p></blockquote>

</figure><figure class="quote" id="q-2160b66eb0" data-kw="">
<blockquote><p>To be justified by faith, which is the first and vital justification, James has interpreted as being called a friend of God, that is, with sins forgiven, to be reconciled with God and to be received by Him into grace and friendship, who before was an enemy of God and a son of wrath. But to be justified by works, he taught is the same as to receive from God, on account of good works, which Abraham and Rahab received from Him, that is, approbation, praise and remuneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans</cite>, … to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | Let the kind reader, I beseech him, compare this our opinion with that which is extant in the other Colloquy of Ratisbon, where that great light of the Church, Martin Bucer, speaks thus on the passage of James (p. 302):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“To be justified by faith, which is the first and vital justification, James has interpreted as being called a friend of God, that is, with sins forgiven, to be reconciled with God and to be received by Him into grace and friendship, who before was an enemy of God and a son of wrath. But to be justified by works, he taught is the same as to receive from God, on account of good works, which Abraham and Rahab received from Him, that is, approbation, praise and remuneration.”

</figure><figure class="quote" id="q-bb0fcd2aac" data-kw="">
<blockquote><p>6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’, p. 687</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.”

— Zacharias Ursinus, The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’, p. 687">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6th+Objection%3A+The+Messiah+brings+everlasting+justice+and+righteousness.+Imputed+righteousness+is+not+eternal.+Therefore+we+are+not+thereby+justified.+Answer%3A+It+is+said+that+Christ%E2%80%99s+righteousness+shall+be+an+everlasting+righteousness%3B+but+after+a+diverse+manner.+For+in+the+life+to+come+we+shall+be+just+after+another+manner+than+in+this+life.+For+although+we+shall+then+be+just+by+the+same+righteousness%2C+even+by+the+righteousness+of+Christ+imputed+unto+us%3A+yet+with+this+shall+also+the+legal+justice+and+righteousness+be+continued%2C+so+that+then+also+by+the+legal+righteousness+we+shall+be+perfectly+just%2C+because+now+only+we+are%2C+as+concerning+that%2C+but+in+part+and+beginning+just.+Each+justice%2C+both+the+justice+of+the+Law%2C+and+the+justice+of+the+Gospel%2C+is+eternal%2C+by+continuation%3A+And+the+justice+and+righteousness+of+the+Gospel%2C+that+is%2C+the+justice+of+Christ+imputed+unto+us%2C+is+eternal+by+continuation+of+the+imputation%3A+The+justice+of+the+Law+is+eternal+by+continuation+of+good+works%2C+even+as+it+is+continued+by+good+works%2C+first%2C+and+beginning+in+this+life%2C+until+at+length+after+this+life+it+be+perfected%2C+and+become+perfect%2C+and+so+continue+to+all+eternity.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+%E2%80%98Of+Justification%E2%80%99%2C+7.+%E2%80%98Why+Christ%E2%80%99s+satisfaction+is+made+ours+by+faith+only%E2%80%99%2C+%E2%80%98Objections+against+this+Doctrine+of+Justification%E2%80%99%2C+p.+687&amp;url=https%3A%2F%2F5solasquotes.git

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</span></figcaption>

</figure><figure class="quote" id="q-0c70f018ea" data-kw="">
<blockquote><p>Beware of division yourselves, and give your help to recover, in all tenderness, these that have withdrawn, and encourage them not in their way. I’m persuaded that if they were not so much countenanced and encouraged by these that are hearers, the number of such would not be so great as it is. Let not that itching ear get place with you, so as to run away to their meetings whenever you have opportunity, and so to cast yourselves into a snare, and to do what in you lies to strengthen the division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-091418bc31" data-kw="">
<blockquote><p>Sixthly, as things are yet with us [congregationalist churches], there is no such great reason of that outcry there is amongst us against gathering of churches [out of other churches] as so great a dividing practice as many seem to make it. How can this practice be so very offensive when almost all of you [non-Independents] think it lawful for a man for any commodiousness to remove from that church of which now he is, to join with another, sobeit he will remove his dwelling?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London, 1653), ch. 23, p. 164</span></figcaption>

</figure><figure class="quote" id="q-a66813c47e" data-kw="">
<blockquote><p>There were schisms and contentions, envying and strife, incest and incest tolerated, such as is not named amongst the gentiles; going to law with their brethren for gain before infidels, harlotry, eating at the idol’s table, keeping fellowship with devils, coming to the Lord’s table drunken, eating and drinking damnation, a denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, murdering of weak souls whom Christ had died for, Paul’s name despitefully traduced.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d147138f5c" data-kw="">
<blockquote><p>Now, also after that miracle took place, we do not read that the bones of Elisha were taken out of the tomb, elevated to a high place, carried about; they were not set forth to be kissed, touched, viewed; they were not honored with candles, not adorned with silk, not adored with invocation for the purpose of obtaining help, not set forth for a special cult. Neither was a pilgrimage instituted to these bones for the purpose of there seeking the grace and power of God; indulgences were not promised; these relics were not laid on the sick and on the dead; people did not swear by them; faith and hope were not placed in them, etc. We read absolutely no such thing in Scripture about the relics of Elisha, also after that outstanding and amazing miracle through his bones had taken place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, First Topic (Relics of the Saints), Sec. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/relics.html">Relics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-5b26d3fb42" data-kw="Mary Idolatry">
<blockquote><p>More than this cannot be sought at the hands of God or Christ. The Virgin Mary is to her worshippers what Christ is to us. She is the object of all religious affections; the ground of confidence; and the source whence all the blessings of salvation are expected and sought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3 (Mariolatry)</span></figcaption>

</figure><figure class="quote" id="q-d1ef8a740a" data-kw="">

</figure><figure class="quote" id="q-3e46fbc951" data-kw="">
<blockquote><p>The first trial of the faith of the new converts was the definition of the dogma of the Immaculate Conception, in 1852, when a doctrine was declared to be the universal ancient tradition of the Church, on which eminent divines had notoriously held different opinions, so much so, that this diversity had been accounted for by Bishop Milner and other controversialists by the assertion that neither Scripture nor tradition contained anything on the subject.</p></blockquote>

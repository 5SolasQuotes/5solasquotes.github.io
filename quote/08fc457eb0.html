<main class="wrap"><figure class="quote" id="q-08fc457eb0" data-kw="">
<blockquote><p>A man that is really holy will be holy among the holy, and he will be holy among the unholy. If you look upon him among unholy friends, unholy children, and unholy servants, you shall find him holy; if you look upon him among unholy neighbours, you shall find him holy; and if you look upon him among unholy buyers and sellers, you shall find him holy; if you take him at his table, you shall find him holy; if you take him in his shop, in his commerce, you shall find him holy; if you take him in his family, you shall find him holy; if you take him in his closet, you shall find him holy; if you take him in his journeyings, you shall find him holy; or if you take him in his recreations, you shall find him holy. True holiness is like that famous Queen Elizabeth, Semper eadem, always the same.

The philosopher’s good man is … four square. Cast him where you will, like a die, he falls always sure and square. So cast a holy man where you will, and into what company you will, yet still he falls sure and square for holiness. True holiness is a part of the divine nature; it is of such a heavenly complexion, that it will never alter. If the times should be so sad and bad that holy persons should not be able to hold fast their estates, their liberties, their trades, their lives, their religion, yet they will still hold fast their holiness.

A holy Christian is like gold. Now cast gold into the fire, or into the water; cast it upon the dunghill, or into the pleasant garden; cast it among the poor or among the rich, among the religious or among the licentious; yet still it is gold, still it retains its purity and excellency: so cast a holy Christian, a golden Christian, into what condition you will, and into what company you will, yet still he will retain his purity, his sanctity; yea, the worse the times are, the more a holy man studies holiness, and prefers holiness, and prizes holiness, and practises holiness, that he may keep up the credit of holiness, and the credit of a holy God, and the credit of his holy profession in the world.

But now such as have only a show of holiness, an appearance of holiness, these will be religious among the religious, and vicious among the vicious, Isa. ix. 17. They will be righteous among the righteous, and licentious among the licentious; they will be as the company is amongst which they are cast. With the good they will be good, and with the bad they will be bad; with the zealous they will be zealous, and with the superstitious they will be superstitious; and with the lukewarm they will be lukewarm, &amp;c. They are for all times and tides; they are for any turn that will serve their turn; for any mode that will bring pleasure or profit to them; they are like Alcibiades, of whom it was said that he was omnium horarum homo, a man for all times; for he could swagger it at Athens, and take any pains at Thebes; he could live most sparingly at Lacidæmon, and bib among the Thracians, and hunt among the Persians.

So these men can accommodate themselves to the times, and comply with them, whatever they be. With Proteus they will transform themselves into all shapes; as the times change, so will they; what the times favour, that they will favour; what the times commend, that they will commend; and what the times cry up and admire, that they will cry up and admire; and what the times frown upon and condemn, that they will frown upon and condemn. Look, as curious and well-drawn pictures seem to turn their eyes every way, and to smile upon every one that looks upon them; so these can turn with the times; they can look as the times look, and smile as the times smile; they can say with the times, and sail with the times. Sometimes they can act one part, and sometimes another part, as the times require.

If the times require a large profession, they can make it; if the times require a rigid spirit against such as cannot comply with the times, they can act it; if the times bespeak them to leave their religion at the church door, they can leave it, &amp;c. If the times call upon them to worship God according to the prescriptions of men, they can do it. Oh, but give me a man that is really holy, and he will be holy though the times should be never so unholy; yea, the more licentious the times are, the more gracious he will labour to be.</p></blockquote>

<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>

<blockquote><p>We must observe the sabbath as holy time; holy, yet not by constitution, not essentially holy, as Christ is holy; nor inherently, as the saints are holy; but holy by institution, by sanction, relatively holy. “The Lord blessed the sabbath-day, and hallowed it;” [Exod. xx. 11;] that is, he set it apart for holy uses: “Keep the sabbath-day to sanctify it.” (Deut. v. 12.) Nothing but holy things must be done in this holy time, – praying, reading, hearing, singing of psalms, &amp;c., (as Psalm xcii., which is both a precept and platform for sabbath sanctification,) meditation, rejoicing in God, and thanksgiving, as you may read at large.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-0af9684ee6" data-kw="">
<blockquote><p>GOD has created all things according to His will and purpose (Proverbs 16:4). Hence all things should be directed toward God and be at His service. Anything made is indeed intended to be useful to its maker. Yet a pot cannot by itself help the potter to understand and to speak. Hence, just as objects which man manufactures cannot help man to be man—that is, to exercise his thought and word—so all creatures, not having a character comparable to that of God, cannot help their Creator in divine things. Nothing can help God to be God. Nothing can keep Him from acting as God. …

God, however, does not need man’s services, because in Himself and by Himself He has and is everything. Being almighty, He can very well do without man. He neither needs nor asks man to help His divine being, which is beyond man’s knowledge and comprehension. God’s reason for creating us and all creatures is to make His goodness known. He willed that whatever thing exists through His goodness should recognize it and rejoice over it. This is why we His creatures may and should be of service to Him in the administration of His goodness. Namely, each creature, together with its endowments and gifts from God, should serve all others in view of the good of all creatures, to the end that everywhere this praise to God may resound: The Lord is good in all things, and His liberality is over all His works (Psalm 145:9). And thus, as this same Psalm says, we will speak forth the celebration of His great goodness and joyously proclaim His righteousness (Verse 7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instruction in Christian Love</cite>, trans. Paul T. Fuhrmann (1523; Richmond VA: John Knox Press, 1952), pp 21, 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

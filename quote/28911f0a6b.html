<blockquote><p>[T]he Antinomian is to be abominated, that derogates from the value and validity of the Law: and contends, that it is to all purposes extinct unto believers, even so much as to its perceptive and regulating power … But this is a most pestilent doctrine, which plucks down the fence of the Law, and opens a gap for all manner of licentiousness and libertinism to rush upon the Christian world; for seeing the Moral Law is no other than the Law of Nature written upon man’s heart at the first, some positives only being superadded; upon the same account as we are men, upon the same we owe obedience to the dictates of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 22.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39e7fe088d" data-kw="">
<blockquote><p>1. That God’s universal law of nature requires of us perfect obedience, on pain of eternal death if we perform it not.

2. We all sinned, and so were liable to that death.

3. Christ became the mediator, and stepped between us and the full execution, and took the penalty upon Himself, and became a sacrifice to offended justice, and a ransom for the sinners.

4. Upon this he acquired novum jus dominii [a new lordly right] and novum jus imperii [a new commanding right] over all men, being now the sovereign of the world as redeemer, as superadded to the former dominion and sovereignty which the Father, Son, and Holy Ghost had as Creator.

5. As Christ the anointed and sovereign redeemer, He made legem remediantem [a law that remedies], an act of oblivion [in granting free pardon of sins], a new law, viz. a law of grace; thereby granting free pardon, justification, adoption, and right to glory to all that will sincerely repent and believe in him, and peremptorily concluding those to everlasting death that will not.

6. This repenting and believing is nothing but assenting so heartily to the truth of the Gospel, as thereupon to accept the Lord Jesus Christ and life in Him, as He is offered, viz. as a pardoner by grateful consent and confidence, as good to us, by love; as sovereign, by giving up ourselves to Him for guidance, and to take Him for the physician of our souls, to rest on Him, and apply his sharpest plasters, and take his bitterest medicines, and which are most ungrateful to flesh and blood (and not to believe that the cure is done already); and, as a free gift, we must accept this grace, with confession of our own utter undeserving, and our desert of eternal wrath, and therefore with repentance to the glory of Him that freely saves us; and lastly, as He is the purchaser, giver, and conductor to the unseen everlasting glory, which is the great end for which we do receive Him; without respect to which end, faith were no saving faith.

7. Remission and justification by Christ’s satisfaction and merit, being given us by a new law, which has its precepts and penalty, we are obliged by this law to perform these conditions, and shall be judged by this law whether we have performed them or no. In which judgment, he that is accused not to have performed them, i.e. to be an unbeliever and rebel against the Lord redeemer, must plead his own actual performance, and deny the accusation. And therefore that performance is the justitia causae, ‘the righteousness of that his cause’, and of his person so far.

8. In respect to this personal new covenant righteousness, the Scripture does many times call men righteous; yea even in the description of the judgment, Mt. 25.

9. As this new law is but lex particularis remedians, properly subordinate to the law of nature, so this personal righteousness is not our justitia universalis, but a particular righteousness, subordinate to the righteousness of the Lord Jesus.

10. There being therefore a twofold justification or righteousness, principal and subordinate—one which answers the law of nature, the other which answers the false charge of not performing the condition of the law of grace; one in Christ’s satisfaction and merit, the other in our faith and repentance; one consisting in the pardon of all our sin and the right to impunity and the kingdom, the other in our having the true condition of pardon and right —it follows that when the question is of justification in the first sense, and of the matter (as we call it) of that justification, i.e. the thing for which we are justified meritoriously, we must then conclude that it is only Christ’s righteousness that is our justification or our righteousness, and that faith or repentance is not the least part of it. But if the question be only of the mere subordinate righteousness and justification, then we must say that our own faith and repentance, and not Christ’s satisfaction, is that righteousness; for it is a debasing of Christ’s righteousness to bring it so low, and it is no other exalting of faith than God has in his covenant exalted it, to raise it so high as to be thus subordinate to Christ’s righteousness, that it may become ours.

11. In regard of the first great justification of a sinner, consisting in remission of sin (constitutive) and sentential absolving him from guilt, faith or any work of man is but the condition sine qua non, and not the least part of that righteousness (as is said). But in regard of that subordinate justification, which is but a means to the former, faith and repentance are our righteousness itself; so that faith is first in order of nature but a condition, but secondarily, when the case at judgment is whether we have performed that condition or not, then consequentially it is our subordinate particular righteousness.

12. No man can perform this condition without God’s special grace.

13. It was the intent and absolute will, yea and undertaking, of Christ dying, to cause all the elect of God infallibly to perform this condition.</p></blockquote>

<blockquote><p>The Antinomians made a very Early Appearance, I see, among the Depravers and Subverters of the Faith once delivered unto the Saints. There are indeed very few New Errors broached in our Later-Days; the most of them, which now disturb the Churches of the Faithful, are only from I scarce know what Enchantments, raising the Ghosts of such as were Dead and Damn’d many Ages ago.

The Impious, and Mischievous Men, against whom the Inspired Writer is now Engaged, have their Impiety here declared. First, The Ungodly Men stand charged with Filthiness. They were, that I may use the most agreeable Term, which the French Translation Leads me to, A very Dissolute Generation. I take notice by the way, that the Greek Term, here used for, Lasciviousness, or Wantonness, is derived from the Name of the Town Selga; a Place infamous for such Dissolute Practices. It makes me wish, that no Town of ours, may in our Days, have any Vice abounding in it, so as with a lasting Infamy to derive a Name unto it. I am loathe here to Explain my self too particularly!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace defended. A censure on the ungodliness, by which the glorious grace of God, is too commonly abused. A sermon preached on the twenty fifth day of December, 1712. Containing some seasonable admonitions of piety. And concluded, with a brief dissertation on that case, whether the penitent thief on</cite>, (Boston: Samuel Gerrish, 1712), pp 2-3.</span></figcaption>

— Cotton Mather, Grace defended. A censure on the ungodliness, by which the glorious grace of God, is too commonly abused. A sermon preached on the twenty fifth day of December, 1712. Containing some seasonable admonitions of piety. And concluded, with a brief dissertation on that case, whether the penitent thief on, (Boston: Samuel Gerrish, 1712), pp 2-3.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Antinomians+made+a+very+Early+Appearance%2C+I+see%2C+among+the+Depravers+and+Subverters+of+the+Faith+once+delivered+unto+the+Saints.+There+are+indeed+very+few+New+Errors+broached+in+our+Later-Days%3B+the+most+of+them%2C+which+now+disturb+the+Churches+of+the+Faithful%2C+are+only+from+I+scarce+know+what+Enchantments%2C+raising+the+Ghosts+of+such+as+were+Dead+and+Damn%E2%80%99d+many+Ages+ago.%0A%0AThe+Impious%2C+and+Mischievous+Men%2C+against+whom+the+Inspired+Writer+is+now+Engaged%2C+have+their+Impiety+here+declared.+First%2C+The+Ungodly+Men+stand+charged+with+Filthiness.+They+were%2C+that+I+may+use+the+most+agreeable+Term%2C+which+the+French+Translation+Leads+me+to%2C+A+very+Dissolute+Generation.+I+take+notice+by+the+way%2C+that+the+Greek+Term%2C+here+used+for%2C+Lasciviousness%2C+or+Wantonness%2C+is+derived+from+the+Name+of+the+Town+Selga%3B+a+Place+infamous+for+such+Dissolute+Practices.+It+makes+me+wish%2C+that+no+Town+of+ours%2C+may+in+our+Days%2C+have+any+Vice+abounding+in+it%2C+so+as+with+a+lasting+Infamy+to+derive+a+Name+unto+it.+I+am+loathe+here+to+Explain+my+self+too+particularly%21%E2%80%9D%0A%0A%E2%80%94+Cotton+Mather%2C+Grace+defended.+A+censure+on+the+ungodliness%2C+by+which+the+glorious+grace+of+God%2C+is+too+commonly+abused.+A+sermon+preached+on+the+twenty+fifth+day+of+December%2C+1712.+Containing+some+seasonable+admonitions+of+piety.+And+concluded%2C+with+a+brief+dissertation+on+that+case%2C+whether+the+penitent+thief+on%2C+%28Boston%3A+Samuel+Gerrish%2C+1712%29%2C+pp+2-3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F691f2912ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/691f2912ce.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/17/cotton-mather-on-the-ancient-error-of-antinomianism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The chief English writers of the 17th century who have been charged as favoring Antinomianism, besides Crisp, are Richardson, Saltmarsh, Hussey, Eaton, Town, etc.’ These were answered by Gataker, Witsius, Bull, Ridgely, and especially by Baxter and Williams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/short-overview.html">McClintock &amp; Strong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cyclopedia of Biblical, Theological, and Ecclesiastical Literature</cite>, ‘Antinomianism’</span></figcaption>

</figure><figure class="quote" id="q-23748f47af" data-kw="">
<blockquote><p>In 1534 Philip Melancthon, perhaps in conjunction with lectures on Colossians delivered around the same time, produced a third edition of the Scholia. In it for the first time, he increased the number of functions, or uses, of the law from two to three… …It involved the persistent emphasis on the necessity of good works… …The notion that the law has uses or functions is a peculiarly Protestant concept with origins deep within Martin Luther’s theology. Gerhard Ebeling has demonstrated how the distinction between law and gospel and Luther’s insistence that God works on human beings through the Word resulted in Luther developing a twofold use of the Law… …Definitions of two uses of the law first appeared in an exposition of the epistle lesson for New Year’s Day; this sermon was published in 1522 as part of Luther’s Weihnachtspostil and seen through the presses by Melancthon. … Luther never saw a need to increase the uses of the law above two and thus create a separate use for believers… For Luther, the human being encountered the law in the two realms of human existence: coram Deo [before the presence of God] and coram hominibus [before the presence of men]. Thus, there was never any need for more than two uses of the law. In his theology the law never had an independent existence that demanded definition, but it was always a part of the human encounter with God. The 1527 and 1528 Scholia were the first publications in which Melancthon explicitly defined two functions of the law… …in 1534 Melancthon altered this section [of his Scholia on Col. 2:17] to read: “…God gave the law for these three reasons: to coerce the flesh and to terrify or humble. The third reason pertains to the righteous, that they may practice obedience.”… …The conscience, made good by God’s gracious declaration, must by necessity use the law to please God. No wonder Melancthon’s theology now needed a third use of the law! … For what reasons did this shift occur in Melancthon’s theology? As Rolf Schafer and others have pointed out, Melancthon’s focus on the law and its third use actually had its roots in his earliest published theology… But the very fact that Melancthon somehow felt constrained to change these earlier comments to reflect even more clearly his developing position suggests that something must have happened in the meantime. A crucial factor is the memory of Melancthon’s encounter with John Agricola. There is little doubt that Agricola’s denigration of the Decalogue–itself a reaction to Melancthon’s theology–caused Melancthon to strengthen his defense of the role of the law in the Christian’s life… … There was no question, too, that some of the changes in the Scholia–one thinks particularly of the third use of the law–were refined by Melancthon in his second edition of the Loci [Common Places] and in turn employed by a young French exile, John Calvin, in the first edition of his Institutes of the Christian Religion [1536].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-wengert.html">Timothy Wengert</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Law &amp; Gospel</cite>, [Repentance] (1997), Ch. 6, ‘Justifying Good Work: The Origins of the Concept of the Third Use of the Law (1534)’, pp. 177, 185, 191-3, 195-6, 200, 206</span></figcaption>

80%9C%E2%80%A6God+gave+the+law+for+these+three+reasons%3A+to+coerce+the+flesh+and+to+terrify+or+humble.+The+third+reason+pertains+to+the+righteous%2C+that+they+may+practice+obedience.%E2%80%9D%E2%80%A6+%E2%80%A6The+conscience%2C+made+good+by+God%E2%80%99s+gracious+declaration%2C+must+by+necessity+use+the+law+to+please+God.+No+wonder+Melancthon%E2%80%99s+theology+now+needed+a+third+use+of+the+law%21+%E2%80%A6+For+what+reasons+did+this+shift+occur+in+Melancthon%E2%80%99s+theology%3F+As+Rolf+Schafer+and+others+have+pointed+out%2C+Melancthon%E2%80%99s+focus+on+the+law+and+its+third+use+actually+had+its+roots+in+his+earliest+published+theology%E2%80%A6+But+the+very+fact+that+Melancthon+somehow+felt+constrained+to+change+these+earlier+comments+to+reflect+even+more+clearly+his+developing+position+suggests+that+something+must+have+happened+in+the+meantime.+A+crucial+factor+is+the+memory+of+Melancthon%E2%80%99s+encounter+with+John+Agricola.+There+is+little+doubt+that+Agricola%E2%80%99s+denigration+of+the+Decalogue%E2%80%93itself+a+reaction+to+Melancthon%E2%80%99s+theology%E2%80%93caused+Melancthon+to+strengthen+his+defense+of+the+role+of+the+law+in+the+Christian%E2%80%99s+life%E2%80%A6+%E2%80%A6+There+was+no+question%2C+too%2C+that+some+of+the+changes+in+the+Scholia%E2%80%93one+thinks+particularly+of+the+third+use+of+the+law%E2%80%93were+refined+by+Melancthon+in+his+second+edition+of+the+Loci+%5BCommon+Places%5D+and+in+turn+employed+by+a+young+French+exile%2C+John+Calvin%2C+in+the+first+edition+of+his+Institutes+of+the+Christian+Religion+%5B1536%5D.%E2%80%9D%0A%0A%E2%80%94+Timothy+Wengert%2C+Law+%26+Gospel%2C+%5BRepentance%5D+%281997%29%2C+Ch.+6%2C+%E2%80%98Justifying+Good+Work%3A+The+Origins+of+the+Concept+of+the+Third+Use+of+the+Law+%281534%29%E2%80%99%2C+pp.+177%2C+185%2C+191-3%2C+195-6%2C+200%2C+206&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23748f47af.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23748f47af

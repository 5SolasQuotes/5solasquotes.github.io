<main class="wrap"><figure class="quote" id="q-8786e7c59c" data-kw="sanctification renovation image">
<blockquote><p>Rather, it is used strictly for a real and internal renovation of man by which God delivers the man planted in Christ by faith and justified (by the ministry of the word and the efficacy of the Spirit) more and more from his native depravity and transforms him into his own image. Thus with separation from the world and sin and consecration to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.1.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1762391914" data-kw="">
<blockquote><p>It is our Duty. In his Example we have a taste of his Spirit; I am not of the World, saith Christ; and we should imitate Christ as dear Children, Ephes. 5.1. They that love to live in delight and pleasures, are but Christians in Name. If we had no other Reason to contemn the vanity of the World, than the Life of Christ, this were enough. Who was wisest, Christ, or you? Who can make the better choice, Christ or you? Who is in an Error, Christ or you? Christ chose a poor Life, and you affect Greatness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon the Seventeenth Chapter of St. John</cite>, Sermon 25, in A Second Volume of Sermons (London, 1684), p. 225</span></figcaption>

</figure><figure class="quote" id="q-0bc84a0fa8" data-kw="">
<blockquote><p>The great question is, What constitutes a Christian? It is being so constrained by a sense of the love of our divine Lord to us, that we consecrate our lives to him. Hence, faith in his divinity, faith in his love, faith in his having died for us, is the principle or source of the Christian life. And this is the only form in which true religion can now exist. That is, the only true religion now possible is, the worship, love, and service of the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:14</span></figcaption>

</figure><figure class="quote" id="q-acc274196c" data-kw="Sanctification Holy Spirit">
<blockquote><p>True sanctification is the result of the soul&#x27;s union with the holy Jesus, the first and immediate receptacle of the sanctifying Spirit; out of whose fullness, his members do, by virtue of their union with him, receive sanctifying influences. The other is the mere product of the man&#x27;s own spirit, which, whatever it has, or seems to have, of the matter of true holiness—yet does not arise from the supernatural principles, nor to the high aims and ends thereof: for, as it comes from self, so it runs out into the dead sea of self again; and lies as wide of true holiness, as nature does of grace. They who have this species of holiness, are like common boatmen, who serve themselves with their own oars: whereas the ship bound for Immanuel&#x27;s land, sails by the blowings of the divine Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” V. Benefits: Sanctification</span></figcaption>

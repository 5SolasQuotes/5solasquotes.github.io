<blockquote><p>Believers are perfectly and irreversibly justified, and therefore, though their iniquities deserve eternal wrath, yet they can no more make them actually liable to that wrath. It is the peculiar privilege of believers only, who are already justified and so set forever beyond the reach of condemnation, to be under the law in the hand of Christ. But were a threatening of eternal death annexed to the law as a rule in His hand, every time that the believer transgressed this law it would lay him anew under condemnation, and as he every moment falls short of perfection in his obedience, he must inevitably be every moment under condemnation to eternal wrath. But instead of this, he always continues in a state of justification and “shall not come into condemnation” (John 5:24). “Whom [God] did predestinate, them he also called: and whom he called, them he also justified: and whom he justified, them he also glorified.… Who shall lay any thing to the charge of God’s elect? It is God that justifieth. Who is he that condemneth?” (Rom. 8:30, 33–34). “Their sins and their iniquities will I remember no more” (Heb. 8:12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>4. Therefore, if we look merely to the Law, the result must be despondency, confusion, and despair, seeing that by it we are all cursed and condemned, while we are kept far away from the blessedness which it holds forth to its observers. Is the Lord, then, you will ask, only sporting with us? Is it not the next thing to mockery, to hold out the hope of happiness, to invite and exhort us to it, to declare that it is set before us, while all the while the entrance to it is precluded and quite shut up? I answer, although the promises, insofar as they are conditional, depend on a perfect obedience of the Law, which is nowhere to be found, they have not, however, been given in vain. For when we have learned that the promises would be fruitless and unavailing, did not God accept us of his free goodness, without any view to our works, and when, having so learned, we, by faith, embrace the goodness thus offered in the gospel, the promises, with all their annexed conditions, are fully accomplished. For God, while bestowing all things upon us freely, crowns his goodness by not disdaining our imperfect obedience; forgiving its deficiencies, accepting it as if it were complete, and so bestowing upon us the full amount of what the Law has promised. But as this point will be more fully discussed in treating of justification by faith, we shall not follow it further at present.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845) Note Calvin speaking of repentance as a “condition” for the forgiveness of sins in vol. 2, bk. 3, ch. 3, sect. 20, p. 174., vol. 1, bk. 2, ch. 7, sect. 4, p. 410</span></figcaption>

<blockquote><p>The Pauline doctrine of justification by faith alone, which we have just treated at considerable length, is, as we have seen, the very foundation of Christian liberty. It makes our standing with God dependent not at upon what we have done, but altogether upon what God has done. If our salvation depended upon what we have done, then, according to Paul we should still be bondslaves; we should still be endeavouring feverishly to keep God’s law so well that at the end we might possibly win His favour. It would be a hopeless endeavour because of the deadly guilt of sin; we should be like debtors endeavouring to pay, but in the very effort getting deeper and deeper into debt. But as it is, in accordance with the gospel, God has granted us His favour as an absolutely free gift; He has brought us in right relation to Himself not on the basis of any merit of ours, but altogether on the basis of the merit of Christ. Great is the guilt of our sins; but Christ took it all upon Himself not on the basis of any merit of ours, but altogether on the basis of the merit of Christ. Great is the guilt of our sins; but Christ took it all upon Himself when he died for us on Calvary. We do not need, then, to make ourselves good before we become God’s children; but we can come to God just as we are, all laden with our sins, and be quite certain that the guilt of sin will be removed and that we shall be received. When God looks upon us, to receive us or to cast us off, it is not we that He regards but our great Advocate, Christ Jesus the Lord. Such is the glorious certainty of the gospel. The salvation of the Christian is certain because it depends altogether upon God; if it depended in slightest measure upon us, the certainty of it would be gone. Hence appears the vital importance of the great Reformation doctrine of justification by faith alone; that doctrine is at the very centre of Christianity. It means that acceptance with God is not something that we earn; it is not something that is subject to the wretched uncertainties of human endeavour; but it is a free gift of God. It may seem strange that we should be received by the holy God as His children; but God has chosen to receive us; it has been done on His responsibility not ours; He has a right to receive whom He will into His presence; and in the mystery of His grace He has chosen to receive us. That central doctrine of the Christian faith is really presupposed in the whole New Testament; but it is made particularly plain the Epistles of Paul.</p></blockquote>

<blockquote><p>29. Furthermore, we do not say that the Gospel and the New Testament demand no condition at all, for the condition of faith and new obedience (which is everywhere impressed on us) is demanded. But God provides these conditions freely, and their imperfect quality forms no hinderance to salvation (which flows from another source), so long as they are genuine.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-777bd5c2e9" data-kw="">
<blockquote><p>He [God] so sanctified this Sabbath worship that he ordered those who had violated it to be cut off from the people and stoned (Ex. 31:14-15; and 35:2). And this deservedly, for we live by faith in God (cf. Hab. 2:4). But this matter has need of much serious restoration because Satan and our flesh never cease to weaken it. Since now our God in his singular charity toward us sanctified only one of seven days for the grounding of our faith and hence of our eternal life, and blessed that day that religious services held on it might effectively work toward our salvation, whoever would not be eager to sanctify that day to glorify his Lord God and the attainment of his own salvation (especially since God has conceded six days for our business and labors in order to sustain our present life for his glory) would surely show himself as a lost despiser of so admirable a blessing of God on us and entirely unworthy of living among the people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The Library of Christian Classics: Melanchthon and Bucer (Philadelphia, 1969), pp 250-51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67eabd7baa" data-kw="">
<blockquote><p>In the next place, let me charge you to hold fast the old doctrine of the Church of England about the sanctity and right observance of the Sabbath Day. I name this point because our old English Sunday appears to me to be in great danger. We live in perilous times. Partly from the spread of infidelity, that old enemy of the Lord’s Day; partly from the morbid love of liberty, and letting every one do as he likes; partly from the exaggerated love of pleasure which marks this age; partly from the facilities afforded by railways for Sabbath travelling, of which our fathers knew nothing, and got on well enough without them; partly from one cause and partly from another, the devil is just now getting more help in his campaign against the Lord’s Day than he has done since the Reformation.

You may see what I mean in the persistent attempts frequently made to throw open places of amusement, aquariums, libraries, theatres, museums, picture galleries, and the like, under the plausible pretence of ‘affording recreation to the working-classes’! All such attempts, I maintain, ought to be firmly and vigilantly resisted. They are the first steps towards a Continental Sunday, and a general flood of Sabbath desecration, Sunday shop-opening, and Sunday delivery of letters in London. I would not have you give way to such attempts. ‘No surrender!’ should be our cry. Let us fight to the last plank for the old English Sunday. Give up the outworks, and the citadel will soon fall.

That laymen of high position and education, noblemen, philosophers, and scientific lecturers, should assist the attempt to break down the standard of Sunday observance, is matter for deep regret. I can only suppose that they do it in ignorance. If they would only study hearts and consciences and death-bed feelings half as much as they study political economy, or stones and plants and beasts and geology and astronomy and light and chemistry and the secrets of earth and air and sea, I believe they would not act as they do. I pity and pray for them. ‘They know not what they do.’

But how any clergyman holding office in the Church of England, and reading the Fourth Commandment every Sunday to his congregation, can lend his aid to movements which must infallibly prevent the Sabbath being kept holy, if they succeed, is one of those mysteries of the nineteenth century which pass my understanding. I am amazed, pained, troubled, grieved, and astonished. The good that the best clergyman does at his very best in a fallen world is small. But he that expects to do good by introducing a Continental Sunday into his parish, exhibits, in my judgment, however excellent his intentions, great ignorance of human nature. He is cutting off his right hand, and destroying his own usefulness.

Whatever may be the bad habits of the working-classes in large parishes, they will never be cured by organizing modes of breaking the Fourth Commandment. We should call that statesman a poor lawgiver who sanctioned petty larceny in order to prevent burglary; and I call that clergyman an unwise man, who, in order to stop drunkenness and its concomitants, is prepared to throw overboard the Sabbath Day. Surely to sacrifice one commandment in order to prevent the breach of another, is neither Christianity nor common-sense. It is, in my opinion, ‘doing evil that good may come.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hold Fast. The Fourth Triennial Charge to the Diocese of Liverpool, November 4, 1890 in Charges and Addresses</cite></span></figcaption>

</figure><figure class="quote" id="q-e503c8d926" data-kw="">
<blockquote><p>That the ceremonies are a great hindrance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about. The heathenish priests labored, per varietatem ceremoniarum, rem in pretio retinere [for a variety of ceremonies, a thing of great value to be retained]. The use for which Papists appoint their ceremonies is, ut externam quandam Majestatem sensibus obijciant [that they may cast a certain external majesty before the senses]: And so are the ceremonies urged upon us thought to conciliate reverence and due regard to divine worship, and to stir up devotion. In the meanwhile it is not considered that mentes humanae mirifice capiuntur &amp; fascinantur, ceremoniarum splendore &amp; pompa [human hearts are wonderfully captivated and fascinated by the splendor and pomp of ceremonies]. Videmus siquidem, says Bucer, vulgus delectari actionibus scanicis, &amp; multis uti signis. Chemnitius marks of the cumulating of ceremonies in the ancient Church, that it drew to this, ut tandem in theatricum ferme apparatum ceremonia illa abierint [that so at last by ceremonies they may go wholly prepared to the theater]. Musculus reprehends bishops for departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple. The policy, then, which is most simple and single, and least lustered with the pomp and bravery of ceremonies, cannot but be most expedient for edification. The king’s daughter is most like herselfe when she is all glorious within (Ps. 45:13), not without, and the Kingdom of God appears best what it is, when it comes not with observation (Lk. 17:20-21): But superstition (says [John] Cameron, Popish Prejudices, ch. 10), the mother of ceremonies, is lavish and prodigal; spiritual whoredom as it is, it has this common with the bodily: both of them must have their paintings, their trinkets, their invenglements. Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external. In the second commandment are forbidden omnes Ritus, qui a spirituali Dei cultu discrepant (Calvin, Commentary Ex. 20:5). ‘The Kingdom of God is within you’, says Christ. (Lk. 17:21)</p></blockquote>

ing%E2%80%99s+daughter+is+most+like+herselfe+when+she+is+all+glorious+within+%28Ps.+45%3A13%29%2C+not+without%2C+and+the+Kingdom+of+God+appears+best+what+it+is%2C+when+it+comes+not+with+observation+%28Lk.+17%3A20-21%29%3A+But+superstition+%28says+%5BJohn%5D+Cameron%2C+Popish+Prejudices%2C+ch.+10%29%2C+the+mother+of+ceremonies%2C+is+lavish+and+prodigal%3B+spiritual+whoredom+as+it+is%2C+it+has+this+common+with+the+bodily%3A+both+of+them+must+have+their+paintings%2C+their+trinkets%2C+their+invenglements.+Secondly%2C+the+Ceremonies+are+impediments+to+the+inward+and+spiritual+worship%2C+because+they+are+fleshly+and+external.+In+the+second+commandment+are+forbidden+omnes+Ritus%2C+qui+a+spirituali+Dei+cultu+discrepant+%28Calvin%2C+Commentary+Ex.+20%3A5%29.+%E2%80%98The+Kingdom+of+God+is+within+you%E2%80%99%2C+says+Christ.+%28Lk.+17%3A21%29%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%E2%80%A6+%28Edinburgh%2C+1637%29%2C+2nd+Part%2C+ch.+4%2C+%E2%80%98That+the+Ceremonies+are+Inexpedient+Because+they+Hinder+Edification%E2%80%99%2C+pp.+19-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe503c8d926.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e503c8d926.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=That%20the%20ceremonies%20are%20a%20great,within%20you%E2%80%99%2C%20says%20Christ.%20%28Lk.%2017%3A21&amp;text=That%20the%20ceremonies%20are%20a%20great%20hindrance%20to&amp;text=God%20is%20within%20you%E2%80%99%2C%20says%20Christ.%20%28Lk.%2017%3A21" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…when I consider the proper end for which churches are erected, it appears to me more unbecoming their sacredness than I well can tell, to admit any other images than those living symbols which the Lord has consecrated by His own word: I mean Baptism and the Lord’s Supper, with the other ceremonies. By these our eyes ought to be more steadily fixed, and more vividly impressed, than to require the aid of any images which the wit of man may devise. Such, then, is the incomparable blessing of images—a blessing, the want [lack] of which, if we believe the Papists, cannot possibly be compensated!</p></blockquote>

</figure><figure class="quote" id="q-6250c7f226" data-kw="">
<blockquote><p>The reason of this assertion [by opponents] is given to be this, that a bodily gesture being necessary, God not determining man upon any one, leaves him at plain liberty. Answer: Whether we be left at plain liberty in all things which being in the general necessary, and are not particularly determined in God’s Word; it shall be treated of elsewhere in this Dispute. In the meantime, whatsoever liberty God leaves man in bodily gestures, he leaves him no liberty of an unlawful and idolatrous gesture, such as kneeling in the instant of receiving a sacrament, when not only we have the outward sign purposely before us, and our minds and senses fastened upon it, for discerning the signification thereof and the analogy betwixt it and the thing signified, but also look upon it as an image of Christ or as a vicarious sign standing there in Christ’s stead. The indifferency of such a gesture in such a mediate worship should have been proved before such a rule (as this here given us for a reason) had been applied to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72-73</span></figcaption>

<blockquote><p>…communion in affection is, whereby all the servants of God are like affected to God, to Christ, to their own sins, and each to other. They are all of one nature and heart alike disposed though they be not acquainted nor have any external fellowship in the flesh.</p></blockquote>

</figure><figure class="quote" id="q-91353cdc8a" data-kw="">
<blockquote><p>…the love we feel for Christ our head should flow forth to all our fellow-members of his holy body; and his love to us make them dear to us for his sake… We should delight to meditate on the many members of Christ’s elect body with whom we are joined, though they are scattered throughout the world. Our hearts should make voyages and journeys of discovery after them; and, remembering that they may be in affliction, and must be in temptation, we should pray for them and delight to hold them in the embraces of our faith. Is it not a most pleasant thought, that, from whatever spot on earth a Christian prays, his prayers go up to the one heart of Christ, and there meet with our prayers and the prayers of all other Christians; and so when blessings for each of us are sent, they all flow out from the same fountain of infinite love!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geroge-w-bethune.html">Geroge W. Bethune</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Lectures on the Heidelberg Catechism (NY, 1864/1866), vol. 2</cite>, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-cf0f47a498" data-kw="">
<blockquote><p>Another ground of love among friends, is societas periculi, et 〈◊〉, when men partake of the same danger or deliverance, as captives under the Turk delivered by the same ransom. This ground of love we have, who being all in danger of hell and become captives of Satan, are delivered by the same ransom, by Christ. This makes friendship and causes love in men that never saw one another before. 3. Now for proximus, it is defined ab use, of the use and benefit that one has by another. God has not given to any man such gifts, but that he needs the gifts of his brother. God has not given all his gifts to any one, and therefore there is none but has need of another: and therefore 〈◊〉 et utilitas, use and utility, are the grounds of propinquity, and make men become proximi, neighbors. 4. Lastly, there is 〈◊〉 instituti; both amongst 〈◊〉, friends and neighbors, all do tendere ad idem, tend to one and the same end; that is, to be partakers of the blessedness, which the angels of God enjoy: for this is institutum 〈◊〉, et proximi 〈◊〉, et amici, et nostrum omnium, the end and scope of my brother, neighbor, friend, and myself, and of all of us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments (d. 1626; 1675), 5th Commandment</cite>, p. 315</span></figcaption>

</figure><figure class="quote" id="q-c4d6e226ea" data-kw="">
<blockquote><p>So then in this article [of the Creed] we confess that all the faithful dispersed throughout the whole compass of the earth, and they also that at this time live in Heaven, as many, I say, as are already saved, or shall even until the very end of the world be born to be saved, are one body, having gotten fellowship and participation with God and a mutual communion among themselves.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6a79d93e3f" data-kw="">
<blockquote><p>Whether all being is rightly divided into finite and infinite, or created and uncreated, or whether indeed a third thing is given that is neither created nor yet God, so it may be ideas or the sephirot of the Jews, or a light that some construct, inaccessible, or an empyrean heaven? The prior is affirmed, the latter denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I. ‘Of God’ in Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 1, tract 2, 1. Whether there may be a God?, Controversies of the 2nd Kind</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether all being is rightly divided into finite and infinite, or created and uncreated, or whether indeed a third thing is given that is neither created nor yet God, so it may be ideas or the sephirot of the Jews, or a light that some construct, inaccessible, or an empyrean heaven? The prior is affirmed, the latter denied.”

— Gisbertus Voetius, I. ‘Of God’ in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 1, tract 2, 1. Whether there may be a God?, Controversies of the 2nd Kind">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+all+being+is+rightly+divided+into+finite+and+infinite%2C+or+created+and+uncreated%2C+or+whether+indeed+a+third+thing+is+given+that+is+neither+created+nor+yet+God%2C+so+it+may+be+ideas+or+the+sephirot+of+the+Jews%2C+or+a+light+that+some+construct%2C+inaccessible%2C+or+an+empyrean+heaven%3F+The+prior+is+affirmed%2C+the+latter+denied.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+I.+%E2%80%98Of+God%E2%80%99+in+Syllabus+of+Theological+Problems+%28Utrecht%2C+1643%29%2C+pt.+1%2C+section+1%2C+tract+2%2C+1.+Whether+there+may+be+a+God%3F%2C+Controversies+of+the+2nd+Kind&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a79d93e3f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a79d93e3f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infinity-of-god/#:~:text=Whether%20all%20being%20is%20rightly%20divided,prior%20is%20affirmed%2C%20the%20latter%20denied&amp;text=Whether%20all%20being%20is%20rightly%20divided%20into%20finite&amp;text=heaven%3F%20The%20prior%20is%20affirmed%2C%20the%20latter%20denied" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c258ff2198" data-kw="">
<blockquote><p>Sufficiently therefore the threefold way is explained in which we concede Christ as He is man, reigns everywhere with the Father: and in the first place [in primis], in his elect. First, indeed, by the virture, power and wisdom of his deity and divine nature. Next, by his Spirit and the gifts and effects of his Spirit. Lastly, by the fellowship even of his body and blood produced through the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 6. ‘Of the Immensity &amp; Infinity of God’ in Of the Nature of God, or of the Divine Attributes (Heidelberg, 1577), bk. 2, pp. 108-68 | Q. 4, Whether it is of God alone to be everywhere, or whether such may be competent even to some creature 127 | That it is proper to God that his essence be everywhere and in all things be present; thus this is able to be competent to no creature 128 1 Cor. 12:12; Jer. 33:1 | IV. In which things Christ reigns everywhere; it is able to be said He is everywhere even in those things 156 Heb. 1:3; Ps. 33:9; 2 Pet. 1:3; Rom. 8:9; Jn. 16:7; Acts 1:8; Ps. 2:9; Rev. 2:12; 1 Pet. 1:3; 1 Cor. 12:13; Jn. 16:14 Epilogue: in what ways He reigns everywhere 158</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-63da9bcc6a" data-kw="">
<blockquote><p>A second reason to believe humans cannot grasp infinity is that the concept must contain an infinite number of sub-concepts, which is too many for our finite minds. A counter to this reason is to defend the psychological claim that if a person succeeds in thinking about infinity, it does not follow that the person needs to have an actually infinite number of ideas in mind at one time… Here is a simple argument that we can: If we understand negation and have the concept of finite, then the concept of infinite is merely the concept of not-finite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/internet-encyclopedia-of-philosophy.html">Internet Encyclopedia of Philosophy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Infinite’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-1d645518a7" data-kw="">
<blockquote><p>Infiniteness is God of universal, unlimited and incomprehensible perfection, Job 11:8-9; 1 Tim. 6:16. His understanding is infinite, Ps. 147:5. What is there said of one attribute, is true of all. God receives not his being of any, but has it of himself: yea, He is his own being, therefore illimited; for there is none to limit Him. God wills Himself freely, yet necessarily; that which acts necessarily, acts with all its might. God therefore having all perfection in his own power, cannot deny any to Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-e983214fe0" data-kw="infinity greatness">
<blockquote><p>The infinity of God follows his simplicity and is equally diffused through the other attributes of God, and by it the divine nature is conceived as free from all limit in imperfection: as to essence (by incomprehensibility) and as to duration (by eternity) and as to circumscription, in reference to place (by immensity).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.8.1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-39136277e2" data-kw="">
<blockquote><p>XIX. The glory of his Person may be considered, partly in reference to the divine nature; partly, to the human. The former is nothing else than a most illustrious assertion, vindication, and display of the Divine majesty of Christ, reflected from the glory of the human nature. During his abode on the earth, the Son of God had so concealed his glory under the vail of his humbled flesh, that only a few faint rays, despised by the generality of spectators, appeared. But now, in his glorified humanity, he shines forth like the sun, having, by his bright and exalted lustre, dispelled the clouds of his obscure and debased condition; and declares, in a striking and glorious manner, that the Son of man is the Son of God, and truly God. This was the matter of his request in the following solemn prayer: “And now, O Father, glorify thou me with thine own self, with the glory which I had with thee, before the world was.” That is, “Gloriously declare that I am thine eternal and only-begotten Son:”—which the Father has done chiefly by setting him at his right hand, as the place of the highest dignity and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser, vol. 2 (London: Khull, Blackie &amp; Co., 1823), 252.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1a9897dd11" data-kw="">
<blockquote><p>As we said above, so now we repeat, that the divine generation must not be compared to the nature of men, nor the Son considered to be part of God, nor the generation to imply any passion whatever; God is not as man; for men beget passibly, having a transitive nature, which waits for periods by reason of its weakness. But with God this cannot be; for He is not composed of parts, but being impassible and simple, He is impassibly and indivisibly Father of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Four Discourses against the Arians,” in St. Athanasius</cite>, ed. Philip Schaff and Henry Wace, trans. John Henry Newman and Archibald T. Robertson, vol. 4, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literat</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

— Athanasius, “Four Discourses against the Arians,” in St. Athanasius: Select Works and Letters, ed. Philip Schaff and Henry Wace, trans. John Henry Newman and Archibald T. Robertson, vol. 4, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literat">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+we+said+above%2C+so+now+we+repeat%2C+that+the+divine+generation+must+not+be+compared+to+the+nature+of+men%2C+nor+the+Son+considered+to+be+part+of+God%2C+nor+the+generation+to+imply+any+passion+whatever%3B+God+is+not+as+man%3B+for+men+beget+passibly%2C+having+a+transitive+nature%2C+which+waits+for+periods+by+reason+of+its+weakness.+But+with+God+this+cannot+be%3B+for+He+is+not+composed+of+parts%2C+but+being+impassible+and+simple%2C+He+is+impassibly+and+indivisibly+Father+of+the+Son.%E2%80%9D%0A%0A%E2%80%94+Athanasius%2C+%E2%80%9CFour+Discourses+against+the+Arians%2C%E2%80%9D+in+St.+Athanasius%3A+Select+Works+and+Letters%2C+ed.+Philip+Schaff+and+Henry+Wace%2C+trans.+John+Henry+Newman+and+Archibald+T.+Robertson%2C+vol.+4%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+Second+Series+%28New+York%3A+Christian+Literat&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1a9897dd11.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1a9897dd11.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/06/athanasius-on-eternal-generation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-30699b1440" data-kw="procession Spirit">
<blockquote><p>As generation (gennēsis) is ascribed to the Son, so procession (ekporeusis) is ascribed to the Holy Spirit—taking the word … strictly (inasmuch as it denotes an emanation from the Father and the Son, distinct from the generation of the Son).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.1</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 3.31.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs%20generation%20%28genn%C4%93sis%29%20is%20ascribed%20to%20the%20Son%2C%20so%20procession%20%28ekporeusis%29%20is%20ascribed%20to%20the%20Holy%20Spirit%E2%80%94taking%20the%20word%20%E2%80%A6%20strictly%20%28inasmuch%20as%20it%20denotes%20an%20emanation%20from%20the%20Father%20and%20the%20Son%2C%20distinct%20from%20the%20generation%20of%20the%20Son%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.31.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F30699b1440.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/30699b1440.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-1021da70d5" data-kw="">
<blockquote><p>The Scriptures teach that there is essentially but one God, and, therefore, that the essence both of the Son and Spirit is unbegotten; but inasmuch as the Father is first in order, and of himself begat his own Wisdom, he, as we lately observed, is justly regarded as the principle and fountain of all the Godhead. Thus God, taken indefinitely, is unbegotten, and the Father, in respect of his person, is unbegotten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.25</span></figcaption>

</figure><figure class="quote" id="q-d403a142c2" data-kw="">
<blockquote><p>The Word is that through which the Holy Spirit commences and confirms faith in us, and for this reason, should go before the sacraments. The sacraments are means through which the Holy Spirit confirms faith already called into exercise, and for this reason ought to follow the Word. The reason of this difference is that the sacraments do not exert any influence unless they be understood. There is no desire for that which is unknown. There must, therefore, necessarily be some explanation of the sacraments out of the Word before they are observed. The case is different, however, in regard to the infants of the church: for in them the Holy Spirit neither begins, nor confirms faith by means of the Word; but by an inward working; and that because they are also included in the covenant and promise of God, being born in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, following his commentary on Q&amp;A #7, 352 (on Heidelberg 67)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

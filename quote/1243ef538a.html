<main class="wrap"><figure class="quote" id="q-1243ef538a" data-kw="">
<blockquote><p>A mean or medium, as it is such, is less than the end, though the thing materially that is a mean may be more excellent. Every mean, as a mean, under that reduplication, has all its goodness and excellency in relation to the end; yet an angel that is a mean (or medium) and a ministering spirit, ordained of God for an heir of life eternal (Heb. 1:13) considered materially, is more excellent than a man (Ps. 8:5; Heb. 2:6-8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 77 rt col bot</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8de93cabef" data-kw="">
<blockquote><p>Whether will these [Separatist] men allow one Christian to sing a psalm alone by himself, methinks the texts and examples mentioned, together with Jam. 5:13… are so plain as no rational man can deny it; But if one may, then the Church may. There is no act of worship which any member of the Church is bound to perform, but the Church is bound to perform; but on the contrary it is not true that what worship the Church does perform, a member of Church can, or may; For instance for the first part, meditation needs no organ of the body, and therefore I leave that. But does a member of the Church pray, so does the whole Church: does he read the Scriptures? so they are read in the Church; does he fast and pray? so does the Church; does he sing a psalm? so does the Church; But it is not true on the contrary, as appears in the sacraments, preaching, discipline, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Separation Examined: or, a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are Weighed &amp; Found too Light</cite>, … (London: 1652), pp. 35-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9bc4e2cbaa" data-kw="">
<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law. 11. The end of the First Commandement… He enjoins Himself to be worshipped and adored of us in the true practice of godliness. 12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded and Disputed in the University of Geneva, by certain Students of Divinity there, under Mr. Theodore Beza and Mr. Anthony Faius</cite>, (London: 1591), ch. 29, pp. 67-68</span></figcaption>

</figure><figure class="quote" id="q-ce3bd4927e" data-kw="">
<blockquote><p>9. There is a general warrant in Scripture for worship and moral actions, twofold: either when the major proposition is only in Scripture, and the assumption [minor premise] is the will of men, or when both the proposition and assumption are warranted by Scripture: the former warrant I think not sufficient, and therefore the latter is necessary to prove the thing lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) Westminster divine, p. 102</span></figcaption>

</figure><figure class="quote" id="q-2ea2a6b47a" data-kw="">
<blockquote><p>Also when it [‘worship’] expresses the Greek word sebomai; as Acts 18:13, ‘to worship God contrary to the law;’ and Acts 18:7, ‘Justus a worshipper of God.’ And so both it and the Greek answer to the Hebrew jaré [יָרֵא], which properly signifies to fear or reverence, as Mt. 15:9, ‘in vaine they worship Me;’ for that which in Hebrew is, ‘their fear towards me,’ Isa. 29:13. So Job and Jonah, as the Hebrew says, ‘feared,’ as the Greek [Septuagint] translates, ‘worshipped God.’ Also when it interprets the Greek word threskeuo, as Col. 2:18, ‘the worshipping of angels;’ and verse 23, ‘in will-worship’ or voluntary religion. Thus worship is largely used for the fear and service of God, or any religious action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Holy Scriptures, Worship &amp; Ministery, used in the Christian Churches Separated from Antichrist</cite>, ... (Amsterdam: Thorp, 1609), ‘Of Worship’, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

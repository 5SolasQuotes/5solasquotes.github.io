<main class="wrap"><figure class="quote" id="q-32484f2f45" data-kw="">
<blockquote><p>The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 564-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-36cb0103bc" data-kw="">
<blockquote><p>1. As love stands opposed to hatred and wrath, and enmity. Considering man as God’s creature, he was not hated of God; God hates not the work of his own hand; but considering him as a lapsed creature, as degenerated into the plant of a strange vine, after that God had created him a generous, noble plant… How suitable to us now is it to have a Savior? That is love, and who has loves, considering the aversion in the holy Divine Being from mankind as rebellious seed, a seed of evil-doers? Who could have suited us to have become a Savior unto us, but one who had a kind propension and inclination to us, inclining Him to the great work of man’s redemption and reconciliation to God, especially also considering that there could be no remission of sins without blood…</p></blockquote>

</figure><figure class="quote" id="q-9250e3080a" data-kw="">
<blockquote><p>We are told, then, that because the kingdom of God is near we must be converted and believe the gospel. We have already explained, though rather briefly, what is meant by ‘the kingdom of God.’ It means that God has chosen to reveal Himself to men from whom He was formerly estranged, and who were more or less cut off from Him. We have all been banished from the heavenly life by Adam’s sin and fall. God therefore sends his only Son and, as it were, with outstretched arms asks us to turn back to Him, for He is willing to receive us. Although we have strayed and are lost because of our demerits, He still wills to show us mercy. Because the kingdom of God is near, our Lord Jesus Christ urges men to repentance and faith. Notice first of all that nothing should move or inflame us to yield to God more than his offer of infinite grace and goodness. When Paul, for example, seeks to pierce men’s stony hearts and to soften their hardness and obduracy, he appeals to ‘the bowels of God’s mercy’ (Phil. 2:1). In speaking thus, he is really saying: ‘Will you now continue in our madness? Must you be worse than the devils? And when God comes to you, displaying his mercy and opening his heart to welcome you as his own children—when he gives you his own Son, will you be so unfeeling as not to be softened or inflamed by love for his grace? Will you not allow Him to lead you, and will you not delight in the goodness He shows you?’ It is in just this way that Jesus Christ urges men to repentance and faith. But on what does he base his appeal? On the fact that God wishes to draw near to those from whom He was once estranged. God, therefore, in receiving us in mercy, sets his goodness before us without waiting for us to seek Him out; he forestalls us with such exceptional grace that we cannot grasp even a hundredth part of it. Since He is so kindly disposed toward us, we should be rightly and deeply touched, to the very core of thought and feeling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Gospel of God</cite>, (Mt. 4:12, 17; Mk. 1:14–15; Lk. 3:19–20; 4:14–15)” in In the Power of the Spirit: Sermons on Matthew, Mark &amp; Luke, tr. Robert White (Banner of Truth, 2024), pp. 154–55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-e2aa4918d7" data-kw="">
<blockquote><p>2. [About the word “righteousness“:] It cannot be denied but that in many places its used for that propensity in God whereby from his hatred to sin He punishes wicked men; and thus it must be here [in Ps. 11:7], as the context evidences. Thus it is evidently used 2 Chron. 12:6; Rom. 2:5. Therefore in the next place, righteousness attributed to God signifies in the general that rectitude and purity in God’s nature, whereby He is free from all sin and hates all iniquity. And then more particularly that attribute in God whereby He does punish ungodly men:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654) | sect. 1, Sermon 1, Demonstrations of God’s Righteousness; The Kinds of it, and in what sense its attributed unto God, p. 3</span></figcaption>

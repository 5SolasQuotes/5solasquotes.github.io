<main class="wrap"><figure class="quote" id="q-0c2f5df2d3" data-kw="">
<blockquote><p>If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will</cite>, (Cambridge, 1601), p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>I. Although the will in God is only one and most simple, by which He comprehends all things by a single and most simple act that He sees and understands all things at one glance, yet because it is occupied differently about various objects, it thus happens that in our manner of conception, it may be apprehended as manifold (not in itself and intrinsically on the part of the act of willing, but extrinsically and objectively on the part of the things willed). … XVIII. There cannot be contrariety between these two wills because they do not will and nill the same thing in the same manner and respect… … XIX. Although God may be said to will the salvation of all by the will of sign and to nill it by the beneplacit will, yet there is no contradiction here….</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0af89f62e1" data-kw="veracity faithfulness">
<blockquote><p>God is not a man, that he should lie; neither the son of man, that he should repent; hath he said, and shall he not do it? Or hath he spoken, and shall he not make it good? (Num. 23:19). The immutability of the divine will and counsel is often asserted: “My counsel shall stand, and I will do all my pleasure” (Is. 46:10). His faithfulness to his promises cannot fail, because his veracity is essential to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.11.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/truth-and-faithfulness.html">Truth and Faithfulness</a> › <a href="../topics/attributes-of-god/truth-and-faithfulness/veracity.html">Veracity</a></span><span class="t"><a href="../topics/attributes-of-god/truth-and-faithfulness.html">Truth and Faithfulness</a> › <a href="../topics/attributes-of-god/truth-and-faithfulness/fidelity-to-promises.html">Fidelity to promises</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d47c0917fd" data-kw="">
<blockquote><p>In the first place I say that the deity which the Papists worship, under that highest and most glorious name of God, is imaginary and fictitious. For it is agreed among all that the true God is supremely and perfectly just and merciful. But neither is that justice perfect which rests in human satisfactions, nor is that mercy perfect which only supplies what is lacking to the merits of men. Let the Papists go, then, and boast that they worship the true God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>

</figure><figure class="quote" id="q-6362f71400" data-kw="omnipresence essence">
<blockquote><p>Is God immense and omnipresent as to essence? We affirm against Socinus and Vorstius. The question does not concern the presence of power and operation which is called energetic; for the adversaries do not deny this. Rather the question concerns the presence of nature, called essential, which they do not admit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.9.1–2</span></figcaption>

</figure><figure class="quote" id="q-e983214fe0" data-kw="infinity greatness">
<blockquote><p>The infinity of God follows his simplicity and is equally diffused through the other attributes of God, and by it the divine nature is conceived as free from all limit in imperfection: as to essence (by incomprehensibility) and as to duration (by eternity) and as to circumscription, in reference to place (by immensity).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8e7d1e6c6f" data-kw="">
<blockquote><p>…The belief of the disciples in the resurrection, according to the New Testament, was due simply to the fact of the resurrection. Those disciples came to believe that Jesus had risen from the dead for the simple reason that Jesus had risen from the dead. He had risen from the dead; and they had not only seen his tomb. empty but had seen him alive after his death on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Person of Jesus</cite>, (Philadelphia: Westminster Seminary Press, 2017), 89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection.html">Resurrection</a></span></div>
<div class="actions"><button class="copy" data-copy="“…The belief of the disciples in the resurrection, according to the New Testament, was due simply to the fact of the resurrection. Those disciples came to believe that Jesus had risen from the dead for the simple reason that Jesus had risen from the dead. He had risen from the dead; and they had not only seen his tomb. empty but had seen him alive after his death on the cross.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-654e99d971" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, on 15:54</span></figcaption>

</figure><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 7, ch. 4 (Of the Resurrection of the Body)</span></figcaption>

</figure><figure class="quote" id="q-bde91c87e8" data-kw="">
<blockquote><p>The wicked shall be raised by the power of Christ as a just Judge. The divine power that shut them up in the grave as in a prison, will bring them out, in order to their receiving the last sentence, to enter into the prison of hell. But the godly shall be raised by virtue of the Spirit of Christ, that bond of union betwixt Christ and those blessed bodies; so that it shall be to them as a pleasant awakening out of sleep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, Of Benefits at the Resurrection (Heb. 11:35)</span></figcaption>

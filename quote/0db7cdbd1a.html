<main class="wrap"><figure class="quote" id="q-0db7cdbd1a" data-kw="">
<blockquote><p>As, David, Daniel, Esay [Isaiah], Jeremy, and others, Whereof we have special examples in the Psalms, where we see that God’s children having to do with God, do so often look upon their sins, and so humble themselves therewith, that thereby afterwards they come to receive in their hearts a filial faith, fear, and obedience. His P. Excell: did know that our spiritual enemy, which we bear about us, was overcome, and that death had lost her sting, and hell her victory.

This enemy, Sin, we do overcome: First, by true repentance, and do hate him as our deadliest enemy; Secondly, when we by true faith, cast them upon the shoulders of that unspotted Lamb Jesus Christ, who can only bear them, &amp; carry them away; &amp; thirdly, when on the contrary we become lovers of righteousness, and whatsoever is acceptable unto the Lord. These three particulars may every one find that is any thing experienced in holiness, that the Holy Ghost hath in a special manner wrought in this Prince. His Excell: knowing that there is but one way to heaven for the greatest potentate, and the meanest subject, hath not flattered himself, nor sought to justify his sins, but hath, as one of the least of God’s servants, with an humble heart and unfeigned repentance, confessed them before the Lord, and hath, in true faith taken his refuge only to Jesus Christ, in whom his soul found rest. And thereunto he so often declared his hearty desire, to serve the Lord better then he confessed to have done, as the Lord’s great benefits unto him did require.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-bogerman.html">Johannes Bogerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The godly and Christian decease of the illustrious and high-borne Prince, Mauritius of Nassau, Prince of Orange, of happy memory. For the comfort and edification of all true Christians</cite>, (London: Nathanael Newbery, 1625), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion.html">Repentance and Conversion</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3834d7be46" data-kw="">
<blockquote><p>I do no less heartily thank, then worthily commend in the Lord, all you that are present, who, according to your accustomed manner, are so willingly and joyfully gathered together, induced hereunto, not through any vain delight of fond novelty, but of a serious, and studious zeal of godliness, not as gazers of frivolous fantastical fables, but as willing witnesses of this great and inestimable benefit of almighty God.

Lastly, I do from the bottom of my heart rejoice in the behalf of this person, for whose cause we are as now met here together, who being transported from out the uttermost parts of Barbary into England, and conversant amongst us, by the space of six whole years, renouncing now at the last the natural contumacy of his native country, doth with so earnest bent affection of voluntary will, cheerfully desire to become a member of Jesus Christ, and to be made partaker of his holy congregation through faith, and Baptism.

And withal I most humbly beseech Almighty God, that he will not only vouchsafe his gracious increase to this glorious work begun with this Israelite stranger, but also to allure the whole remnant of the circumcised Race, by this his example, to be desirous of the same communion: So that at the length, all nations, as well Jews, as Gentiles, embracing the faith, and Sacraments of Christ Jesus, acknowledging one Shepherd, united together in one sheepfold, may with one voice, one soul, and one general agreement, glorify the only begotten son our saviour Jesus Christ, &amp; be glorified again of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>

<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) L <blockquote><p>3rd Exception: They [Papists] say, we are indeed to believe our salvation on God’s part: but we must needs doubt in regard of ourselves: because the promises of remission of sins are given upon condition of man’s faith and repentance. Now we cannot (say they) be assured that we have true faith and repentance, because we may lie in secret sins, and so want that indeed which we suppose ourselves to have. Answer: I say again, he that does truly repent and believe, does by God’s grace know that he does repent and believe: for else Paul would never have said, ‘Prove yourselves whether you be in the faith or not:’ and the same apostle says, 2 Cor. 12, ‘We have not received the spirit of the world, but the Spirit which is of God, that we might know the things which are given of God:’ which things are not only life everlasting, but justification, sanctification, and such like. And as for secret sins, they cannot make our repentance void: for he that truly repents of his known sins, repents also of such as be unknown, and receives the pardon of them all. God requires not an express or special repentance of unknown sins; but accepts it as sufficient, if we repent of them generally: as David says, Ps. 19. ‘Who knows the errors of this life: forgive me my secret sins.’ And whereas they add that faith and repentance must be sufficient, I answer that the sufficiency of our faith and repentance stands in the truth and not in the measure or perfection thereof; and the truth of both where they are, is certainly discerned.</p></blockquote>

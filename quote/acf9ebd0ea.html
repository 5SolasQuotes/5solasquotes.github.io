<main class="wrap"><figure class="quote" id="q-acf9ebd0ea" data-kw="">
<blockquote><p>After a lapse of the dark ages, during which all active speculation slumbered, the great Thomas Aquinas, an Italian by birth, A.D. 1224, and a monk of the order of St. Dominic, Doctor Angelicus, advocated with consummate ability the Augustinian system of theology in that cumbrous and artificial manner which characterized the Schoolmen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York, 1879), p. 99.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-439c4aef4d" data-kw="">
<blockquote><p>XIII… And a little later: “As the soul is in the body, so Christians are in the world.” The soul, although dispersed throughout all the members of the body, is nonetheless present in it; likewise, Christians, though they dwell in the world, are not of the world. The invisible soul is established as if in a garrison within the visible body; similarly, Christians are recognized while they sojourn in the world, but their divine worship is invisible. And a little later: Although the soul is enclosed in the body, it still preserves the body; likewise, although Christians are detained in the world as if in custody, they also preserve the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-c824c4fe32" data-kw="">
<blockquote><p>…I will summarize it all in a word: philosophy behaved toward theology in the schools, at least of the fathers, like an ally; in the training schools of the Scholastics, like a schoolmistress; in the hallowed chairs of Reformed universities, like a maidservant. If anyone begrudges philosophy that post, I think such a man truly has treated theology badly, philosophy worse, and the church worst of all.</p></blockquote>

</figure><figure class="quote" id="q-5ca9afba63" data-kw="">

<main class="wrap"><figure class="quote" id="q-9e4593f875" data-kw="">
<blockquote><p>What Augustine so strikingly formulated concerning the relation of the two historic economies of the history of redemption: “Novum Testamentum in Vetere latet, Vetus in Novo patet” [The New Testament hides in the old, the Old reveals itself in the New] permits of application to the subject in hand. Here also there was a “new” and an “old,” but the substance was the same, not different in principle, and thus it came about that the one could be used to interpret the other. Revelation could make use of the preëstablished harmony which it had itself laid at the basis of its scheme.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Pauline Eschatology (Princeton, NJ: Geerhardus Vos, 1930), 43.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b00ef7ddc" data-kw="">
<blockquote><p>Since true believers are already irrevocably interested in the covenant of grace, in the righteousness of Christ, and in the favor of God; and since they have in Christ and on the ground of His righteousness imputed to them a complete security against eternal death and a full title to eternal life, the law as the law of Christ has no sanction of judicial rewards or punishments. It has no promise of eternal life or threatening of eternal death annexed to it. The form of the covenant of works, indeed, is eternally binding on all who live and die under that violated covenant, but because Christ, as last Adam, has answered all the demands of it for believers, they are delivered from the law in that form (Rom. 7:4–6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 35.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-d29ae1160a" data-kw="">
<blockquote><p>The second thing to be gathered is that the fathers before Christ, ever since the Fall of Adam, and Christians in the times of the Gospel, did live under the same Covenant for substance, but not for manner of administration, which is most clear by evident testimonies of holy Scripture, and by the very form of the Covenant, which was one before and after the coming of Christ. The same God that calls us, called them to the hope of eternal life: they were endued with the same Spirit, and lived by the same faith. Their sacraments, for substance and signification, agree with ours; and they expected an inheritance everlasting and undefiled. Religion for substance was ever one and unchangeable, and such as were truly religious walked in the same way, and waited for the same heavenly inheritance and everlasting crown of glory. The Church before Christ may be considered as an heir, or as an infant, according to the substance of the covenant, or according to the manner of administration. In the first respect the Church is under the Covenant or promise, and her people are called a free and willing people, an heir of heavenly and spiritual blessings. In the latter respect she is under the Covenant, in respect of the different administration, and her people are called a servile people in comparison, an heir under tutors and governors, not differing from a servant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645)</cite>, ch. 3, ‘Of the Covenant of Grace in General’; p. 27</span></figcaption>

</figure><figure class="quote" id="q-6b9fdcb41c" data-kw="">
<blockquote><p>His sorrows and mourning upon the account of the obstinacy and unbelief of sinners, speaks the vehemency of his desire after union with them… The Redeemer’s tears wept over obstinate Jerusalem, spake the zeal and fervency of his affection to their salvation; how loth Christ is to give up sinners. What a mournful voice is that in John 5:40, “And you will not come unto me, that you might have life.” How fain [desirous] would I give you life? but you would rather die than come unto Me for it. What can Christ do more to express his willingness? All the sorrows that ever touched the heart of Christ from men, were upon this account, that they would not yield to his calls and invitations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Flavel, 6 vols. (d. 1691; London: Baynes &amp; Son, 1820) | vol. 4, England’s Duty Under the Present Gospel: Eleven Sermons on Revelation 3:20 (1689), Sermon 6, “Jesus Christ an Earnest Suitor for Union and Communion with the Souls of Sinners”</cite>, p. 117</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-c201986fef" data-kw="">
<blockquote><p>I believe it is the duty of every minister of Christ plainly and faithfully to preach the gospel to all who will hear it; and as I believe the inability of men to do spiritually good things to be wholly of the moral, and therefore of the criminal kind and that it is their duty to love the Lord Jesus Christ and trust in Him for salvation, though they do not; I therefore believe free and solemn and solemn addresses, invitations, calls, and warnings to them to be not only consistent, but directly adapted, as means, in the hand of the Spirit of God, to bring them to Christ. I consider it as part of my duty which I could not omit without being guilty of the blood of souls.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a046484a06" data-kw="">
<blockquote><p>Consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31ccf53a7e" data-kw="">
<blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

<blockquote><p>The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins, and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification is an excellent gift of God … yet we deny it to be the thing, which makes us of sinners to become righteous or just before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Doctrine Touching the Justification of a Sinner</cite></span></figcaption>

</figure><figure class="quote" id="q-9def8be007" data-kw="">
<blockquote><p>To be justified means more than to be declared “not guilty.” It actually means to be declared righteous before God. It means God has imputed or charged the guilt of our sin to His Son, Jesus Christ, and has imputed or credited Christ’s righteousness to us.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-de85ec286c" data-kw="">
<blockquote><p>In like sort we may imagine time before the world; for who doubts but that it was possible that time should have been sooner than it was and wh•s it is now about six thousand years since the world began; so if it had pleased God, it might have been 10 thousand. But do not you infer here hence that we do imagine infinite time preceding the world; for that is not held to be possible as finite time is.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53b2323259" data-kw="">
<blockquote><p>The philosophers, among whom was Aristotle, because being devoid of revelation, they could not reach to the first man, thought of an infinite subordination of men, and at the same time, of the eternity of the world. Democritus is reported to have stated that men crawled forth from the earth like maggots. Epicurus said that man was a composite of the fortuitous confluence of atoms, and in addition that they arose from the earth like fungi, and are daily animated by the certain position of the stars. Paracelsus [d. 1541], besides the human posterity of Adam, numbered four other non-Adamic races of men, and assigned them to each of the elements…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Do All Men Owe their Origin to the One Adam?’ in Theoretical-Practical Theology</cite>, (RHB), vol. 3, ch. 9, section 13</span></figcaption>

</figure><figure class="quote" id="q-f53017dc80" data-kw="">
<blockquote><p>Although Christ is to be adored wherever He is present, it does not follow that everything in which He is present is to be adored. Christ dwells in all believers and yet believers are not to be adored with Christ… We are not bound to adore God with an external adoration wherever He is present; but only where He is present with rays of his glorious majesty and where He wishes to be adored. Otherwise as God is in all creatures (in stones, in trees and in animals), He would have to be adored in them. Thus we are commanded to adore God in the heavens, where He manifests Himself gloriously. The Israelites were bound to adore Him at the ark, which was teh symbol of his presence…. The essential and internal glory of God (which consists in the eminence of his perfections) differs from the accidental and external glory (which is placed in some sensible, miraculous and extraordinary effect; as was seen in the bush, the ark and other like symbols of God’s presence). Although the internal and essential glory is the foundation of external adoration, still it does not bind to the exercise of actual adoration unless it is connected with the external glory (i.e., with some miraculous and extraordinary effect which makes an impression on the senses). Otherwise, as God is everywhere with his essential glory and in all his creatures, He would have to be adored there (which is absurd). … The distinctions between the absolute, ultimate, intransitive, direct and formal worship (which is exhibited to Christ in the Eucharist); and the transitive, indirect, relative, and concomitant worship (given to the species of the Eucharist), cannot remove the crime of idolatry. (1) They are unknown to the Scriptures, which recognize no religious worship excepting one alone, which is absolute and direct…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3:545-46</span></figcaption>

</figure><figure class="quote" id="q-e899841436" data-kw="">
<blockquote><p>The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-c2d545bb95" data-kw="">
<blockquote><p>God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bde90d2692" data-kw="">
<blockquote><p>In the Roman, yea in prelatical Churches there are scarce any footsteps at all of the offices of preaching presbyters and deacons as they were instituted by the apostles. The apostles ordained presbyters to preach the Word, to minister the sacraments, to govern the Church and to make use of the keyes. But the Popish and prelatical presbyters have not the power of the keys, nor the power of Church government, for it is proper to their prelates; as for the other two, they are common to their deacons, for they also do preach and baptize… As touching deacons, they were ordained by the apostles for collecting receiving, keeping and distributing of ecclesiastical goods, for maintaining of ministers, schools, churches, the sick, stranger, and poor. The Popish and prelatical deacons have no such office, but an office which the apostles never appointed to them, for they had no preaching nor baptizing deacons. Philip preached [Acts 8:5, 12] and baptized [Acts 8:12-13, 38], not as a deacon [Acts 6:5], but as an evangelist, Acts 21:8. Besides, at the time of his preaching and baptizing, he could not have exercised the office of his deaconship by reason of the persecution, which scattered rich and poore and all, Acts 8:1. That which Stephen [a deacon, Acts 6:5] did, Acts 7, was no more then every believer was bound to do when he is called to give a testimony to the truth and to give a reason of his faith and practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders…. (Edinburgh: Bryson, 1641), ch. 11</cite>, pp. 79-80</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-160069d067" data-kw="">
<blockquote><p>Paul gives rules and directions to Timothy (1 Tim. 5:1,19 and Titus 2) as to pastors, not as to believers, concerning the manner of receiving [Church] complaints, nor is there in Scripture precept, promise or practice of believers to receive complaints, we are surer than our Brethren [the congregationalists]; and it’s safer to expound this [phrase], ‘Tell the Church’ [Mt. 18:17], that is, ‘Tell Timothy and the Elders’ than, ‘Tell the church, that is, tell any member of the church at Corinth,’ i.e. tell any woman or servant [your formal complaint], for they are as essentially members as Timothy or any of the Elders, [Point] 2. and [these laypersons] must join their consent to censures because members must hear the scandals because they must tacitly consent before censures be dispensed; it follows not [however] that members must be told [of such formal complaints as an authoritative court, in the sense of Mt. 18:17], for [only] the tacit consent of women [to such Church censures of others] is requisite, for they may be scandalized or edified by the good or evil dispensing of censures as well as men.</p></blockquote>

l%20gives%20rules%20and%20directions%20to,of%20censures%20as%20well%20as%20men." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aa5003c42f" data-kw="">
<blockquote><p>How much more unbeseeming and disorderly were it in the Church (which Nicolaides himself, even where he disputes against the necessity of ordination, Refut: tract: de missione minister, ch. 10, p. 113, acknowledges to be more perfect than any politic republic in the world) for any man to assume to himself power and authority which is not given him, or which he has a non habente potestatem [‘from not having the power’], or to intrude himself into any public administration unto which he is not appointed. It was justly complained of as a great disorder under the prelates that midwives were permitted to baptize upon pretence of a case of necessity, yea that deacons were permitted to baptize, because the administration of baptism does neither belong to deacons nor to private persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions… (Edinburgh: Lithgow, 1649)</cite>, ch. 3, p. 36</span></figcaption>

<blockquote><p>Elders help the pastors in governing, but labor not in the Word and doctrine, 1 Tim 5:17, and yet visit the sick, oversee the ways and manners of the people, and so rule with diligence, Rom. 12:8; 1 Cor. 12:28, and judge with pastors and doctors, Matt 18:18-20.</p></blockquote>

</figure><figure class="quote" id="q-4855f5d7d2" data-kw="">
<blockquote><p>For if we be bound to hold out our left cheek to strangers which will smite us on the right cheek: how much more ought we to suffer an extreme and unkind husband? But yet I mean not that a man should beat his wife; God forbid that, for that is the greatest shame that can be, not so much to her that is beaten, as to him that does the deed. But if by such fortune thou chancest upon such an husband, take it not too heavily, but suppose thou, that thereby is laid up no small reward hereafter, and in this lifetime no small commendation to thee, if thou canst be quiet. But yet to you that be men, thus I speak: Let there be none so grievous fault to compel you to beat your wives. But what say I, your wives? no, it is not to be born with that an honest man should lay hands on his maid servant to beat her. Wherefore if it be a great shame for a man to beat his bondservant, much more [of a] rebuke it is to lay violent hands upon his freewoman. And this thing may be well understood by the laws which the Panims have made, which does discharge her any longer to dwell with such an husband, as unworthy to have any further company with her that does smite her. For it is an extreme point, thus so vilely to entreat her like a slave, that is fellow to thee of thy life, and so joined unto thee before time in the necessary matters of thy living. And therefore a man may well liken such a man (if he may be called a man, rather then a wild beast) to a killer of his father or his mother. And whereas we be commanded to forsake our father and mother, for our wife’s sake, and yet thereby do work them none injury, but do fulfill the Law of God… Who can worthily express the inconvenience that is to see what weepings and walings be made in the open streets when neighbors run together to the house of so unruly an husband, as to a Bedlem man, who goes about to overturn all that he has at home? Who would not think that it were better for such a man to wish the ground to open, and swallow him in, than once ever after to be seen in the market?… Understand that God has given thee children with her, and art made a father, and by such reason appease thyself. Doest thou not see the husbandmen what diligence they use to till that ground which once they have taken to farm, though it be never so full of faults? As for an example, though it be dry, though it brings forth weeds, though the soil cannot bear too much wet, yet he tills it, and so wins fruit thereof… But thou peradventure wilt say that she is a wrathful woman, a drunkard, and beastly, without wit and reason. For this cause bewail her the more. Chase not in anger, but pray unto Almighty God. Let her be admonished and helped with good counsel, and do thou thy best endevor, that she may be delivered of all these affections. But if thou shouldest beat her, thou shalt increase her evil affections: For frowardness and sharpness is not amended with frowardness, but with softness and gentleness. Furthermore, consider what reward thou shalt have at God’s hand: For where thou mightest beat her, and yet, for the respect of the fear of God, thou wilt abstain and bear patiently her great offences, the rather in respect of that Law which forbids that a man should cast out his wife what fault soever she be made the combred with, thou shalt have a very great reward, and before the receit of that reward, thou shalt feel many commodities. For by this meanes she shall bee more obedient, and thou for her sake shalt be made the more meek.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For if we be bound to hold out our left cheek to strangers which will smite us on the right cheek: how much more ought we to suffer an extreme and unkind husband? But yet I mean not that a man should beat his wife; God forbid that, for that is the greatest shame that can be, not so much to her that is beaten, as to him that does the deed. But if by such fortune thou chancest upon such an husband, take it not too heavily, but suppose thou, that thereby is laid up no small reward hereafter, and in this lifetime no small commendation to thee, if thou canst be quiet. But yet to you that be men, thus I speak: Let there be none so grievous fault to compel you to beat your wives. But what say I, your wives? no, it is not to be born with that an honest man should lay hands on his maid servant to beat her. Wherefore if it be a great shame for a man to beat his bondservant, much more [of a] rebuke it is to lay violent hands upon his freewoman. And this thing may be well understood by the laws which the Panims have made, which does discharge her any longer to dwell with such an husband, as unworthy to have any further company with her that does smite her. For it is an extreme point, thus so vilely to entreat her like a slave, that is fellow to thee of thy life, and so joined unto thee before time in the necessary matters of thy living. And therefore a man may well liken such a man (if he may be called a man, rather then a wild beast) to a killer of his father or his mother. And whereas we be commanded to forsake our father and mother, for our wife’s sake, and yet thereby do work them none injury, but do fulfill the Law of God… Who can worthily express the inconvenience that is to see what weepings and walings be made in the open streets when neighbors run together to the house of so unruly an husband, as to a Bedlem man, who goes about to overturn all that he has at home? Who would not think that it were better for such a man to wish the ground to open, and swallow him in, than once ever after to be seen in the market?… Understand that God has given thee children with her, and art made a father, and by such reason appease thyself. Doest thou not see the husbandmen what diligence they use to till that ground which once they have taken to farm, though it be never so full of faults? As for an example, though it be dry, though it brings forth weeds, though the soil cannot bear too much wet, yet he tills it, and so wins fruit thereof… But thou peradventure wilt say that she is a wrathful woman, a drunkard, and beastly, without wit and reason. For this cause bewail her the more. Chase not in anger, but pray unto Almighty God. Let her be admonished and helped with good counsel, and do thou thy best endevor, that she may be delivered of all these affections. But if thou shouldest beat her, thou shalt increase her evil affections: For frowardness and sharpness is not amended with frowardness, but with softness and gentleness. Furthermore, consider what reward thou shalt have at God’s hand: For where thou mightest beat her, and yet, for the respect of the fear of God, thou wilt abstain and bear patiently her great offences, the rather in respect of that Law which forbids that a man should cast out his wife what fault soever she be made the combred with, thou shalt have a very great reward, and before the receit of that reward, thou shalt feel many commodities. For by this meanes she shall bee more obedient, and thou for her sake shalt be made the more meek.”

— No, Anglican Church | Second Book of Homilies, 18. ‘An Homiliy of the State of Matrimony’ in The Two Books of Homilies Appointed to be Read in Churches (Oxford, 1859), pp. 510-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+if+we+be+bound+to+hold+out+our+left+cheek+to+strangers+which+will+smite+us+on+the+right+cheek%3A+how+much+more+ought+we+to+suffer+an+extreme+and+unkind+husband%3F+But+yet+I+mean+not+that+a+man+should+beat+his+wife%3B+God+forbid+that%2C+for+that+is+the+greatest+shame+that+can+be%2C+not+so+much+to+her+that+is+beaten%2C+as+to+him+that+does+the+deed.+But+if+by+such+fortune+thou+chancest+upon+such+an+husband%2C+take+it+not+too+heavily%2C+but+suppose+thou%2C+that+thereby+is+laid+up+no+small+reward+hereafter%2C+and+in+this+lifetime+no+small+commendation+to+thee%2C+if+thou+canst+be+quiet.+But+yet+to+you+that+be+men%2C+thus+I+speak%3A+Let+there+be+none+so+grievous+fault+to+compel+you+to+beat+your+wives.+But+what+say+I%2C+your+wives%3F+no%2C+it+is+not+to+be+born+with+that+an+honest+man+should+lay+hands+on+his+maid+servant+to+beat+her.+Wherefore+if+it+be+a+great+shame+for+a+man+to+beat+his+bondservant%2C+much+more+%5Bof+a%5D+rebuke+it+is+to+lay+violent+hands+upon+his+freewoman.+And+this+thing+may+be+well+understood+by+the+laws+which+the+Panims+have+made%2C+which+does+discharge+her+any+longer+to+dwell+with+such+an+husband%2C+as+unworthy+to+have+any+further+company+with+her+that+does+smite+her.+For+it+is+an+extreme+point%2C+thus+so+vilely+to+entreat+her+like+a+slave%2C+that+is+fellow+to+thee+of+thy+life%2C+and+so+joined+unto+thee+before+time+in+the+necessary+matters+of+thy+living.+And+therefore+a+man+may+well+liken+such+a+man+%28if+he+may+be+called+a+man%2C+rather+then+a+wild+beast%29+to+a+killer+of+his+father+or+his+mother.+And+whereas+we+be+commanded+to+forsake+our+father+and+mother%2C+for+our+wife%E2%80%99s+sake%2C+and+yet+thereby+do+work+them+none+injury%2C+but+do+fulfill+the+Law+of+God%E2%80%A6+Who+can+worthily+express+the+inconvenience+that+is+to+see+what+weepings+and+walings+be+made+in+the+open+streets+when+neighbors+run+together+to+the+house+of+so+unruly+an+husband%2C+as+to+a+Bedlem+man%2C+who+goes+about+to+overturn+all+that+he+has+at+home%3F+Who+would+not+think+that+it+were+better+for+such+a+man+to+wish+the+ground+to+open%2C+and+swallow+him+in%2C+than+once+ever+after+to+be+seen+in+the+market%3F%E2%80%A6+Understand+that+God+has+given+thee+children+with+her%2C+and+art+made+a+father%2C+and+by+such+reason+appease+thyself.+Doest+thou+not+see+the+husbandmen+what+diligence+they+use+to+till+that+ground+which+once+they+have+taken+to+farm%2C+though+it+be+never+so+full+of+faults%3F+As+for+an+example%2C+though+it+be+dry%2C+though+it+brings+forth+weeds%2C+though+the+soil+cannot+bear+too+much+wet%2C+yet+he+tills+it%2C+and+so+wins+fruit+thereof%E2%80%A6+But+thou+peradventure+wilt+say+that+she+is+a+wrathful+woman%2C+a+drunkard%2C+and+beastly%2C+without+wit+and+reason.+For+this+cause+bewail+her+the+more.+Chase+not+in+anger%2C+but+pray+unto+Almighty+God.+Let+her+be+admonished+and+helped+with+good+counsel%2C+and+do+thou+thy+best+endevor%2C+that+she+may+be+delivered+of+all+these+affections.+But+if+thou+shouldest+beat+her%2C+thou+shalt+increase+her+evil+affections%3A+For+frowardness+and+sharpness+is+not+amended+with+frowardness%2C+but+with+softness+and+gentleness.+Furthermore%2C+consider+what+reward+thou+shalt+have+at+God%E2%80%99s+hand%3A+For+where+thou+mightest+beat+her%2C+and+yet%2C+for+the+respect+of+the+fear+of+God%2C+thou+wilt+abstain+and+bear+patiently+her+great+offences%2C+the+rather+in+respect+of+that+Law+which+forbids+that+a+man+should+cast+out+his+wife+what+fault+soever+she+be+made+the+combred+with%2C+thou+shalt+have+a+very+great+reward%2C+and+before+the+receit+of+that+reward%2C+thou+shalt+feel+many+commodities.+For+by+this+meanes+she+shall+bee+more+obedient%2C+and+thou+for+her+sake+shalt+be+made+the+more+meek.%E2%80%9D%0A%0A%E2%80%94+No%2C+Anglican+Church+%7C+Second+Book+of+Homilies%2C+18.+%E2%80%98An+Homiliy+of+the+State+of+Matrimony%E2%80%99+in+The+Two+Books+of+Homilies+Appointed+to+be+Read+in+Churches+%28Oxford%2C+1859%29%2C+pp.+510-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4855f5d7d2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4855f5d7d2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ladies/#:~:text=For%20if%20we%20be%20bound%20to,shalt%20be%20made%20the%20more%20meek." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

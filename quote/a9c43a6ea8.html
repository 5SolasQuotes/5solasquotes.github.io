<main class="wrap"><figure class="quote" id="q-a9c43a6ea8" data-kw="">
<blockquote><p>201. There is in the very essence of the natural power or faculty, besides the vis vel virtus agendi [power or virtue of acting], a certain natural inclination to some things, which is inseparable from it, from which the [Medieval] Schoolmen say even of the will that it is quaedam natura, et pondus animae [a certain nature and gravitation of the soul]. So the soul is inclined or propense (and not only able) to activity as such, to intellection as such, to volition as such; and objectively to truth as such, and to natural good and felicity as such. And there is an inclination of the soul, which is not essential and inseparable, but is much under the power of the will, and may be got and lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ricahrd-baxter.html">Ricahrd Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology, Plain, Pure, Peaceable</cite>, ... (London: White, 1675), sect. 10, ‘Of Natural &amp; Moral Power as Foreseen’, pp. 36-37</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e66cffaa36" data-kw="">
<blockquote><p>Whether the distinction of sin into mortal and venial is able to be tolerated? This distinction is inept. Indeed, all sins merit eternal death; and if it may happen to be remitted, the sins of all the regenerate are of the sort that that is not from the nature of the sin, but out of the grace of God whereby we are embraced in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-Eckhard</cite>, ch. 10, On Sin, p. 657, Question 6 in Joannes Maccovius Redivivus… (Amsterdam, 1659)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-83c0e1cb6b" data-kw="">
<blockquote><p>1. Because in a question of law all ignorance is moral and culpably evil to any who undertakes actions upon conscience of obedience to others; for to all within the visible Church the Word of God is exactly perfect for faith and manners, and everyone is obliged to know all conclusions of law that are determinable by God’s Word. 2. Every one in his actions is to do out of a plerophory, and a full persuasion, of heart, that what he does pleases God, Rom. 14:14, ‘I know and am persuaded by the Lord Jesus that nothing is unclean of itself.’ 3. We are to do nothing but what is lawful and what in our consciences we are persuaded is lawful, and are to know what is sin and what is no sin… because every one is obliged to know morally what concerns his conscience, that he be not guilty before God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644) | pt. 1, ch. 3, Section 3, Question 4, pp. 41-49</span></figcaption>

</figure><figure class="quote" id="q-56cfa7cd20" data-kw="Holiness">
<blockquote><p>Since the precept about not coveting is general, it ought to be extended to all depraved and inordinate concupiscence, original and habitual as well as actual—whether this is determinate and voluntary or still indeterminate and only titillating. This is true in order that the perfect purity and holiness of the lawgiver may be noted (which will suffer not even the smallest taint of depraved concupiscence in man, but demands righteousness and holiness of every kind).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.21.3</span></figcaption>

</figure><figure class="quote" id="q-b2e530e092" data-kw="">
<blockquote><p>If he take vincible, as opposed to invincible ignorance, he Popishly then says that the Scripture offers to us many things whereof we may be invincibly ignorant. Now invincible ignorance, Protestants acknowledge only in matters of fact, or of gospel-truths never so much as in the letter revealed, as heathens may be invincibly ignorant of Christ, and their ignorance not be sinful, as John 15:22, and Jacob was invincibly ignorant in lying with Leah instead of Rachel. There can be no such vincibleness, or invincibleness, in an heretic that hears the Gospel, for whoever hear the Gospel and yet remain ignorant, their ignorance is not invincible, Nulla est invincibilis ignorantia juris [Nothing is invincible ignorance in law].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), p. 343</span></figcaption>

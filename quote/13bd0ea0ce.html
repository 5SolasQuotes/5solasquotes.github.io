<main class="wrap"><figure class="quote" id="q-13bd0ea0ce" data-kw="">
<blockquote><p>The controversy was renewed not long after in another form, in consequence of the position taken by George Major, also a pupil of Luther and Melancthon, and for some years professor of theology and preacher at Wittenberg. He was accused of objecting to the proposition “we are saved by faith alone” and of teaching that good works were also necessary to salvation. This was understood as tantamount to saying that good works are necessary to justification. Major, indeed, denied the justice of this charge. He said he did not teach that good works were necessary as being meritorious, but simply as the necessary fruits of faith and part of our obedience to Christ; nevertheless, he maintained that no one could be saved without good works. How then can infants be saved? And how can this unconditional necessity of good works be consistent with Paul’s doctrine that we are justified by faith without works? Whom God justifies He glorifies. Justification secures salvation; and, therefore, if faith alone, or faith without works, secures justification, it secures salvation. It is very evident that this was a dispute about words. Major admitted that the sinner was in a state of salvation the moment he believed, but held that if his faith did not produce good works it was not a saving faith. In his sermon “On the Conversion of Paul,” he said: “As thou art now justified by faith alone, and hast become a child of God, and since Christ and the Holy Ghost through that faith dwell in thy heart, so are good works necessary, not to obtain salvation (which thou already hast as a matter of grace, without works, through faith alone on the Lord Jesus Christ), but to hold fast your salvation, that it be not lost, and also because if thou dost not produce good works, it is an evidence that thy faith is false and dead, a mere pretence or opinion.” …. The “Form of Concord,” in which this and other controversies in the Lutheran Church were finally adjusted, took the true ground on this subject, midway between the two extreme views. It rejects the unqualified proposition that good works are necessary to salvation, as men may be saved who have no opportunity to testify to their faith by their works. On the other hand, it utterly condemns the unwarrantable declaration that good works are hurtful to salvation; which it pronounces to be pernicious and full of scandal. It teaches that “Fides vera nunquam sola est, quin caritatem et spem semper secum habeat.” The same doctrine was clearly taught in the Lutheran Symbols from the beginning, so that the charge made by Romanists, that Protestants divorced morality from religion, was without foundation, either in their doctrine or practice…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 3.239–241.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7677c611c5" data-kw="">
<blockquote><p>Even now, however, the proper apple of discord was only the doctrine of the Supper. The party of Flacius was of one mind on the question of predestination with those who subsequently were denominated the ‘Reformed’; and the Flacians employed predestination as a weapon to fight against the Melanchthonians, who long maintained themselves in the electorate of Saxony [which was dominated by the strict Lutherans]. Nor till a later time, during the strife about Crypto-Calvinism, did this electorate succeed in detaching itself from the moderate party in the empire. In a word, about the time of the origin of the Formula of Concord between 1570-1580, there were only two different parties; the one consisting of people who would let themselves be reasoned with on the doctrine of the Supper; and the other of such as would hear no reason on the subject. Those who were weary of the vexatious strifes, as Hesse, Anhalt and other States of the empire, joined the party led by the inhabitants of the [reformed] Palatinate, and, finally, did not accept the Formula of Concord [1570/1580]. The others shut themselves off, and formed a body that took for its shibboleth the unaltered Confession of Augsburg. It was after the Formula of Concord that the evangelicals [in Germany] clearly separated into two churches; that is, one part went its own ways and abandoned the other, which then, by rejecting the Formula of Concord but retaining the Confession of Augsburg, was gradually consolidated in the empire into churches which for the first time testified by a great historical act at Dort that they belonged to the Reformed Church, that meanwhile had arisen outside of Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 423</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

<blockquote><p>By this answer Christ declared that he did not deliver any other rule of life than that which had formerly been delivered in the law of the Lord. Thus he both bore testimony to the divine law, that it was a doctrine of perfect righteousness, and at the same time met the calumnious charge of seeming, by some new rule of life, to incite the people to revolt from the law. The young man, who was not ill-disposed, but was puffed up with vain confidence, answers that he had observed all the precepts of the law from his youth. It is absolutely certain that he was immeasurably distant from the goal which he boasted of having reached. Had his boast been true, he would have wanted nothing of absolute perfection. For it has been demonstrated above, that the law contains in it a perfect righteousness. This is even obvious from the fact, that the observance of it is called the way to eternal life. To show him how little progress he had made in that righteousness which he too boldly answered that he had fulfilled, it was right to bring before him his besetting sin. Now, while he abounded in riches, he had his heart set upon them. Therefore, because he did not feel this secret wound, it is probed by Christ — “Go,” says he, “and sell that thou hast.” Had he been as good a keeper of the law as he supposed, he would not have gone away sorrowful on hearing these words. For he who loves God with his whole heart, not only regards everything which wars with his love as dross, but hates it as destruction (Philippians 3:8). Therefore, when Christ orders a rich miser to leave all that he has, it is the same as if he had ordered the ambitious to renounce all his honors, the voluptuous all his luxuries, the unchaste all the instruments of his lust. Thus consciences, which are not reached by any general admonition, are to be recalled to a particular feeling of their particular sin. In vain, therefore, do they wrest that special case to a general interpretation, as if Christ had decided that the perfection of man consists in the abandonment of his goods, since he intended nothing more by the expression than to bring a youth who was out of measure satisfied with himself to feel his sore, and so understand that he was still at a great distance from that perfect obedience of the law which he falsely ascribed to himself: I admit that this passage was ill understood by some of the Fathers; and hence arose an affectation of voluntary poverty, those only being thought blest who abandoned all earthly goods, and in a state of destitution devoted themselves to Christ. But I am confident that, after my exposition, no good and reasonable man will have any dubiety here as to the mind of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.13.13 (on Matthew 19:21, “Go, sell you have, and give it to the poor”)</span></figcaption>

struments+of+his+lust.+Thus+consciences%2C+which+are+not+reached+by+any+general+admonition%2C+are+to+be+recalled+to+a+particular+feeling+of+their+particular+sin.+In+vain%2C+therefore%2C+do+they+wrest+that+special+case+to+a+general+interpretation%2C+as+if+Christ+had+decided+that+the+perfection+of+man+consists+in+the+abandonment+of+his+goods%2C+since+he+intended+nothing+more+by+the+expression+than+to+bring+a+youth+who+was+out+of+measure+satisfied+with+himself+to+feel+his+sore%2C+and+so+understand+that+he+was+still+at+a+great+distance+from+that+perfect+obedience+of+the+law+which+he+falsely+ascribed+to+himself%3A+I+admit+that+this+passage+was+ill+understood+by+some+of+the+Fathers%3B+and+hence+arose+an+affectation+of+voluntary+poverty%2C+those+only+being+thought+blest+who+abandoned+all+earthly+goods%2C+and+in+a+state+of+destitution+devoted+themselves+to+Christ.+But+I+am+confident+that%2C+after+my+exposition%2C+no+good+and+reasonable+man+will+have+any+dubiety+here+as+to+the+mind+of+Christ.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes%2C+4.13.13+%28on+Matthew+19%3A21%2C+%E2%80%9CGo%2C+sell+you+have%2C+and+give+it+to+the+poor%E2%80%9D%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd31275897e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d31275897e.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/03/was-calvin-a-lutheran/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>His argument is undone in distinguishes between cleansing efficiently and meritoriously; the blood of Christ truly cleanses us meritoriously, not efficiently.</p></blockquote>

k">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-15daafd0f6" data-kw="">
<blockquote><p>A circle of German Lutheran, Reformed and Union theologians began meeting under the auspices of the Evangelical Church in Germany (EKD) in 1947 to discuss their historic differences over Eucharistie doctrine. Ten years later, these discussions yielded the “Arnoldshain Theses on the Lord’s Supper” (Amholdshainer Abendmahlsthesen), which, in eight carefully crafted theses, proposed a consensus acceptable to all three traditions. They did this in part by placing greater emphasis on describing the effects of the Eucharist than on defining precisely the way in which Christ could be present in the Supper… Because the sacrament is a “means of salvation” and not an end in itself, the precise mode of Christ’s presence will always be secondary to its effect… …the Leuenberg Agreement of 1973… The outcome allowed Reformed, Lutheran, and Union churches throughout Europe and later from other parts of the world to pronounce their past mutual condemnations to be no longer applicable, declare fellowship with one another, and aim at greater institutional cooperation… Leuenberg’s conceptual content remains remarkably thin. The sections on the Eucharist, Christology and Predestination… barely touch on the theological issues themselves. In that sense, Leuenberg is less interesting for its theological content than for the power of what it declares as a speech act: it “pronounces” church fellowship and exhorts its signatories…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-g-appold.html">Kenneth G. Appold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Lutheran-Reformed Relations: A Brief Historical</cite>, p. 60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

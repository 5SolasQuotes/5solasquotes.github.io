<main class="wrap"><figure class="quote" id="q-05a9db4dae" data-kw="">
<blockquote><p>A threefold love of God is commonly held; or rather there are three degrees of one and the same love. First, there is the love of benevolence by which God willed good to the creature from eternity; second, the love of beneficence by which he does good to the creature in time according to his good will; third, the love of complacency by which he delights himself in the creature on account of the rays of his image seen in them. The two former precede every act of the creature; the latter follows (not as an effect its cause, but as a consequent its antecedent).

By the love of benevolence, he loved us before we were; by the love of beneficence, he loves us as we are; and by the love of complacency, he loves us when we are (viz., renewed after his image). By the first he elects us; by the second, he redeems and sanctifies us; but by the third he gratuitously rewards us as holy and just. John 3:16 refers to the first; Ephesians 5:25 and Revelation 1:5 to the second; Isaiah 62:3 and Hebrews 11:6 to the third.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 3.20.5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e92233f43" data-kw="">
<blockquote><p>The object of divine love is God. God is good, and good is amiable. God is all good: there is none good but one, that is God. God is essentially good, goodness in the abstract; he is infinitely excellent, he is all perfection. In this one attribute all the rest of the attributes of God are included, and this in each of them.

However the Scriptures, speaking to our capacities, describe God and his glorious attributes in several and distinct notions, yet in each one all are included; each one is infinite, and infinite perfection is essentially all perfection. God is originally good, the fountain and pattern of all that moral good which is in his creatures; he is bountiful and gracious, ready to do them good; and he is the felicitating end, or the final blessedness of the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven Opened; or, A Brief and Plain Discovery of the Riches of God’s Covenant of Grace</cite>, (1665; New York: American Tract Society, 1838), p. 172.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-59d0d3adbc" data-kw="">
<blockquote><p>As all the modifications of goodness above mentioned are found even in our dilapidated nature, and commend themselves to our moral approbation, we know they must exist in God without measure and without end. In him they are infinite, eternal, and immutable.</p></blockquote>

</figure><figure class="quote" id="q-ec775f75de" data-kw="">
<blockquote><p>Some people take shelter in a notion of universal love. They say, ‘God loves everyone, and therefore everything will turn out all right in the end for me.’ But there’s a very solemn verse in the Bible, ‘Jacob have I loved, but Esau have I hated’ (Romans 9:13). I’m not saying that there’s anyone in the room of mercy who should come to the conclusion that God has hated them. Satan may be saying to some anxious soul, ‘There’s no hope for you because God has hated you.’ No one in the room of mercy, no one under the sound of the gospel, no one anxious about their soul, has any reason to come to that conclusion. And may God give grace to resist coming to that conclusion in a way that would prevent a person from seeking the Lord and seeking his mercy.

But what we can say is that you have no reason to believe the Lord has loved you until you’re found embraced in that love in the person of Christ. We cannot take it for granted. We cannot say God loves everyone. ‘I have loved thee’ is something very particular, something very personal, and we cannot rest until it becomes particular and personal to ourselves. The love of God is a very particular, distinguishing, personal thing toward a sinner, so that a person has to make sure they have a reason for believing it with regard to themselves.

And one other thing about this love of God toward the sinner — he says it’s everlasting. It had no beginning. With God, everlasting things have no beginning. God is the everlasting God. ‘From everlasting to everlasting, thou art God’ (Psalm 90: 2). There was no beginning to God. We can’t really grasp that. That’s something beyond our understanding— someone who has no beginning. We can understand in a measure something having no end — we know that that’s true of us. People try to blot out the idea of eternity, the idea of living beyond this world. But anyone who’s heard the gospel — and even anyone who hasn’t — when they listen to the underground noises in their own consciences and souls, they have this feeling — this fear, perhaps, this anxiety — that there’s no end. Yes, there was a beginning, but there’s no end. We can grasp that. But we can’t grasp the concept of ‘no beginning’.

And yet, God had no beginning. And God’s love ‘for thee’ — for the child of God, for the sinner saved by grace — had no beginning either. It wasn’t that there came a time in the experience of God when he began to love — no, God has loved eternally. Everlasting love. And that love is never withdrawn. It has never been removed from its objects. Even when he chastens them, even when he hides himself from them, even when they fear that the Lord has forgotten to be gracious and that he has shut up his tender mercies in his wrath — even then, this love is everlasting, it doesn’t change. It’s never withdrawn from its objects. And it has no end. It’ll never come to an end. Its consequences, its effects, will never come to an end. ‘I have loved thee with an everlasting love.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-m-cartwright.html">Hugh M. Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>With An Everlasting Love: Selected Sermons of Rev Hugh M. Cartwright</cite>, ed. Robert Dickie (Stornoway: Reformation Press, Kindle edition, 2015), pp 16-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

beginning+to+God.+We+can%E2%80%99t+really+grasp+that.+That%E2%80%99s+something+beyond+our+understanding%E2%80%94+someone+who+has+no+beginning.+We+can+understand+in+a+measure+something+having+no+end+%E2%80%94+we+know+that+that%E2%80%99s+true+of+us.+People+try+to+blot+out+the+idea+of+eternity%2C+the+idea+of+living+beyond+this+world.+But+anyone+who%E2%80%99s+heard+the+gospel+%E2%80%94+and+even+anyone+who+hasn%E2%80%99t+%E2%80%94+when+they+listen+to+the+underground+noises+in+their+own+consciences+and+souls%2C+they+have+this+feeling+%E2%80%94+this+fear%2C+perhaps%2C+this+anxiety+%E2%80%94+that+there%E2%80%99s+no+end.+Yes%2C+there+was+a+beginning%2C+but+there%E2%80%99s+no+end.+We+can+grasp+that.+But+we+can%E2%80%99t+grasp+the+concept+of+%E2%80%98no+beginning%E2%80%99.%0A%0AAnd+yet%2C+God+had+no+beginning.+And+God%E2%80%99s+love+%E2%80%98for+thee%E2%80%99+%E2%80%94+for+the+child+of+God%2C+for+the+sinner+saved+by+grace+%E2%80%94+had+no+beginning+either.+It+wasn%E2%80%99t+that+there+came+a+time+in+the+experience+of+God+when+he+began+to+love+%E2%80%94+no%2C+God+has+loved+eternally.+Everlasting+love.+And+that+love+is+never+withdrawn.+It+has+never+been+removed+from+its+objects.+Even+when+he+chastens+them%2C+even+when+he+hides+himself+from+them%2C+even+when+they+fear+that+the+Lord+has+forgotten+to+be+gracious+and+that+he+has+shut+up+his+tender+mercies+in+his+wrath+%E2%80%94+even+then%2C+this+love+is+everlasting%2C+it+doesn%E2%80%99t+change.+It%E2%80%99s+never+withdrawn+from+its+objects.+And+it+has+no+end.+It%E2%80%99ll+never+come+to+an+end.+Its+consequences%2C+its+effects%2C+will+never+come+to+an+end.+%E2%80%98I+have+loved+thee+with+an+everlasting+love.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Hugh+M.+Cartwright%2C+With+An+Everlasting+Love%3A+Selected+Sermons+of+Rev+Hugh+M.+Cartwright%2C+ed.+Robert+Dickie+%28Stornoway%3A+Reformation+Press%2C+Kindle+edition%2C+2015%29%2C+pp+16-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec775f75de.html&amp;via=5Solas" target="_blank" rel="

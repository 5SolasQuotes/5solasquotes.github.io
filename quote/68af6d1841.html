<main class="wrap"><figure class="quote" id="q-68af6d1841" data-kw="">
<blockquote><p>Hence it appears what we ought to think of Damascene his opinion, who divides the will of God into his precedent and consequent will… And indeed this distinction in itself is to be allowed, but that is not a very fit example [of it] which he has set down or alleged concerning his precedent will.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f0ad7c7ae" data-kw="">
<blockquote><p>The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny [though the Reformed affirm] the contrast between a universally offered salvation revealed in the voluntas signi [the will of sign, or revealed will] and a secret elective will in the voluntas beneplaciti. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker, 1985), voluntas Dei, pp. 332-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-3b2234aaeb" data-kw="">
<blockquote><p>II. The one of these wills is called the antecedent will, the other is called the consequent, not because that will goes before this, for in this sense, this distinction may be admitted, because there is a certain order among the purposes of God: Thus his will of creating man was in order before his will of feeding or clothing him. But with [John] Damascene and [James] Arminius…</p></blockquote>

</figure><figure class="quote" id="q-65547cb8c6" data-kw="">
<blockquote><p>These sensual atheists, then turning the grace of God into wantoness and giving over themselves to the following of their lusts, securely derided and scoffed at any directions of holiness or denunciations of judgments which opposed them in their ungodly courses as vain and contemptible fables: … 4. It makes all the means of grace ineffectual; scorners will not be bettered: ‘Rebuke a scorner, and he will hate thee;’ the strength of this sin makes all the helps of holiness to be but weak; they all slide off, as water from an oiled post. A scorner, is (as it were) a brazen wall, which beats back all the arrows of reprehension. Mocking argues obduratenesse in sin; It extinguishes light natural and opposes light spiritual.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ecf583bfbe" data-kw="">
<blockquote><p>[Richard Hooker, an Anglican, said:] ‘Now we can nowhere find by reading Scripture anything for the baptizing of infants, or a remedy for women to be cured of original sin in the Old Testament in lieu of circumcision; we find no warrant for the Feast of Dedication in the Law of Moses, nor for the days of puring observed by the Jews, nor for images, invocation of saints, prayer for the dead, the perpetual virginity of the virgin Mary, and many such doctrines which the Church believes.’ But we [Rutherford &amp; the Scottish reformed] answer, because these vain doctrines (we except the baptizing of infants, warranted by Scripture) are not in Scripture, they are the vain and sapless doctrines of men, and will-worship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (London, 1646), Introduction, section 2, pp. 22-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-61a2efa655" data-kw="Mary Queen of Heaven Mediator">
<blockquote><p>Except for those honorary titles which belong to God the Lord and to our only Saviour, one may give her the highest and most glorious titles. … But that we do not name her a Goddess, a Mediator between God and men, an all-knowing and almighty Queen of Heaven, a Gate of the Heavenly Paradise, a Redeemer, a Reconciler of the human race, and more suchlike honorary titles which were raised by men, comes solely therefrom, that suchlike honorary titles are adverse to the honour of God and of Our Saviour.</p></blockquote>

</figure><figure class="quote" id="q-abe8210703" data-kw="">
<blockquote><p>In that James is called our Lord’s brother [in Gal. 1:19] three things may be demanded: One, which James this was? Answer: It was James the son of Alpheus: for he lived 14 years after this, Gal. 2:9, whereas James the son of Zebedeus lived not so long, because he was put to death by Herod. The second thing is, how James should be the Lord’s brother? Answer: In scripture, children of the same womb, are brethren: men of the same blood are brethren; as Abram and Lot, Gen. 13:8. Men of the same country are brethren, thus Saul’s countrymen are called his brethren, 1 Chron. 12:2. And James is called our Lord’s brother, not because he was of the same womb, but because he was of the same blood or kindred: for Elie had two daughters, Mary, espoused to Joseph, and Mary Cleophas, who afterward was married to Alpheus, of whom came James here mentioned. James therefore was the cousin-german [first-cousin] of Christ. Therefore Helvideus failed when he went about to infringe the perpetual virginity of the virgin Mary out of this place, as if she had more sons beside Christ. The third thing is, what benefit James had by being the Lord’s brother? Answer: He is here called the Lord’s brother only, for distinction’s sake in respect of the other James the son of Zebedeus…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition, upon the Five First Chapters of the Epistle to the Galatians</cite>, … (Cambridge, 1604), ch. 1, pp. 61-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

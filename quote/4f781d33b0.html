</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79bff9e05f" data-kw="">
<blockquote><p>4. I perceive he [Gillespie’s opponent] would say that the scandal of non-conformity is a greater scandal than the scandal of conformity; He is bold to object [that] where one is offended with our practise of kneeling, twenty, I may say ten thousand, are offended with your refusal. O adventurous arithmetique! O huge hyperbole! O desultorious declamation! O roving rhetoric! O prodigal paradox! Yet I reply: 1. Though sundry (yet not ten thousand for one) are displeased by our refusal, who can show us that any are thereby scandalized, that is, made worse and induced to ruin? …

5. We know many are grieved and displeased with our non-conformity, yet that every one who is grieved is not by and by scandalized, the Bishop of Winchester [an opponent] teaches as well as we. ‘Many times’ says he, ‘men are grieved with that which is for their good, and earnestly set on that which is not expedient for them.’ But in good earnest, what do they mean who say they are scandalized or made worse by our non-conformity? For neither do we make them condemn our lawful deed as unlawful, nor yet do we animate them by our example to do that which in their consciences they judge unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 52-3</span></figcaption>

</figure><figure class="quote" id="q-46637a5233" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing… …

X. A scandal is passive and taken by the scandalized, without the fault of the doer, only in this case: cum factum unius est alteri occasio peccandi, prater intentionem facientis, et conditionem facti (Ames, Of Conscience, bk. 5, ch. 11, q. 3); so that to the making of the doer blameless is not only required that he intend not his brother’s fall, but also that the deed be neither evil in itself, nor yet done inordinately and with apperance of evil.

XI. The scandal not to be cared for is only in necessary things, such as the hearing of the Word, prayer, etc., from which we may not abstain, though all the world should be offended at us: In these I say, and these only, Scandalum quod oritur ex rebus per s•… bonis et necessariis, non licet evitare, etc. at rerum legittimarum sed non necessariarum disparest ratio, etc., says a great Formalist (Cameron, Praelectiones on Mt. 18:7, Of Scandal).

XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious… … Christ’s not caring for the scandal of the Pharisees is also objected to prove that if the thing be lawful or indifferent, we are not to care for the offence of the malicious. But Parker answers well (Of the Cross, pt. 2, p. 57): ‘The scandal there not cared for is when the Pharisees are offended at his abstaining from their washings and his preaching of true doctrine, both of which were necessary duties for Him to do. And when He defends his healing on sabbaths (Lk. 13:15) and his disciples plucking corns (Mt. 12:7), upon this reason, they are duties of necessity and charity, He plainly insinuates there is no defence for deeds unnecessary when the malicious are scandalized. When the thing was indifferent, does He not forgoe his liberty for to please them, as when He payed tribute lest he should offend them (Mt. 17:27), although he know they were malicious.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, pp. 32-34</span></figcaption>

<blockquote><p>62. The duties of justice are prior and of more binding obligation than those of charity (or love).

63. Therefore, we have a greater obligation to pay our debts than to give away anything of our own. And he who offends another has a greater obligation to seek reconciliation than he who is offended.</p></blockquote>

</figure><figure class="quote" id="q-c81f8ffed3" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book you left with me, I find not myself in my understanding thereby convinced of the necessity or lawfulness of conforming unto, or complying with an unjust prevailing power further than I was before persuaded. It might be lawful or necessary so to do: viz. as I paying taxes and submitting to some other things (in themselves not unlawful) by 〈1 page missing〉 3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek] (to the force), but not acknowledge the [Greek] (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right, title; or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide [with good faith] presume the oppressed power (to whom my obedience is justly due), if he perfectly knew the present condition I am in together with the exigence and necessity of the present case and all of circumstances thereof, would give his willing consent to such my conformity and compliance. So that upon the whole matter and in short, I conceive I may so far submit unto the impositions or comply with the persons of a prevailing usurped power unjustly commanding things not in themselves unlawful, or make use of their power to protect one from other’s injuries, as I may submit unto, comply with or make use of a highway thief or robber when I am fallen into his hands and lie at his mercy. As for Mr. Ascham ‘s discourse, though it be handsomely framed, yet all the strength of it (to my seeming) lie’s upon two principles, which (if he would speak out) would be in plain English these:

1. That self-preservation is the first and chiefest obligation in the world, to which all other bonds and relations (at least between man and man) must give place.

2. That no oath, at least no imposed oath, at what terms soever expressed, binds the taker further than he intended to bind himself thereby; and, it is presumed, that no man intended to bind himself to the prejudice of his own safety. [These are] Two dangerous and desperate principles which evidently tend: 1. to the taking away of all Christian fortitude and suffering in a righteous cause; 2. to the encouraging of daring and ambitious spirits to attempt continual innovations, with this confidence, that if they can by any ways (how unjust soever) possess themselves of the supreme power, they ought to be submitted unto; 3. to the obstructing unto the oppressed party all possible ways and means, without a miracle, of ever recovering that just right of which he shall have been unjustly dispossessed; and (to omit further instancing) 4. to the bringing in of atheism with the contempt of God and all religion, whilst every man, by making his own preservation the measure of all his duties and actions, makes himself thereby his own idol.</p></blockquote>

<blockquote><p>After the Restoration of the English monarchy in the person of Charles II in 1660, the new king and his first Parliament declared the anniversary of the beheading of his father Charles I (January 30, 1649) a religious holiday with a special commemoration in the Book of Common Prayer, naming the late monarch a saint and martyr. This holiday was not generally celebrated in Massachusetts until the emergence of several Anglican churches there in the early eighteenth century. In 1750, Jonathan Mayhew, the twenty-nine-year old pastor of the West (Congregational) Church in Boston, took occasion to dispute the first Charles’ credentials to saintship, martyrdom, and even his kingship as well. Mayhew’s Discourse is an extremely interesting bridge between the radical Puritan past and the American Revolutionary future. His sermon contains the language, rhetoric, symbolism, typology, and religious and philosophical arguments that would be used extensively in the agitation for American independence twenty-five years later. Mayhew (1720-1766) would subsequently take a leading role in the resistance to the Stamp Act of 1765, and his sermons and writings had an enormous impact on the evolution of New England Puritanism into American republican ideology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-mayhew.html">Jonathan Mayhew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning Unlimited Submission &amp; Non-Resistance to the Higher Powers</cite>, (1750) 55 pp. Mayhew was liberal both in his religion and politics. This famous sermon was credited by John Adams with being greatly influential in leading to the commencement of the War of American Independence. | The University of Nebraska abstract:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“After the Restoration of the English monarchy in the person of Charles II in 1660, the new king and his first Parliament declared the anniversary of the beheading of his father Charles I (January 30, 1649) a religious holiday with a special commemoration in the Book of Common Prayer, naming the late monarch a saint and martyr. This holiday was not generally celebrated in Massachusetts until the emergence of several Anglican churches there in the early eighteenth century. In 1750, Jonathan Mayhew, the twenty-nine-year old pastor of the West (Congregational) Church in Boston, took occasion to dispute the first Charles’ credentials to saintship, martyrdom, and even his kingship as well. Mayhew’s Discourse is an extremely interesting bridge between the radical Puritan past and the American Revolutionary future. His sermon contains the language, rhetoric, symbolism, typology, and religious and philosophical arguments that would be used extensively in the agitation for American independence twenty-five years later. Mayhew (1720-1766) would subsequently take a leading role in the resistance to the Stamp Act of 1765, and his sermons and writings had an enormous impact on the evolution of New England Puritanism into American republican ideology.”

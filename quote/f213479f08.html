<main class="wrap"><figure class="quote" id="q-f213479f08" data-kw="">
<blockquote><p>But for Christians, I advise you, in reading the prophets and apostles concerning Christ and his sufferings, to make use of this as a key to open up all, as a light that enlightens all — That all the sufferings of Christ were laid on him, and endured by him, and presented unto God, as he did represent his guilty people; otherwise justice could not exact on him, nor his people be saved by them. See how Christ expresseth this in the celebration and institution of his last supper. He taketh, blesseth, breaketh, and giveth bread, and calls it, my body given for you. Likewise also the cup after supper, saying, “This cup is the new testament in my blood, which is shed for you,” Luke xxii. 19, 20.

I do not mind the antichristian synagogue, (for a church it is not, but in an usurped name, or in a vain notion,) who have abused and perverted these plain and easy words, more than devils or men did ever pervert any words of God or man before; and have, upon that abuse of them, set up the grossest idol that ever a heathen worshipped; for such as worship sun, and moon, and the host of heaven, have God’s glorious workmanship before their eyes; yea, the Egyptians’ garden and herb gods are preferable greatly to a bit of paste, kneaded and baked by a baker in his oven, conjured into a pitiful godhead by the mumbling of a priest, and first worshipped, and then swallowed down as other food, by the besotted people. Nothing less than the dreadful wrath of God can be in men’s believing this lie, that the man’s reason and all his senses militate against, 2 Thess. ii. 10—12.

But many that are not infected with this strong delusion, understand no more by Christ’s words in this sacred ordinance, than that the bread and wine, so used as Christ appointed, do signify the sufferings unto death of our Lord Jesus Christ, cruelly handled by wicked men, and severely dealt with by the justice of God; but the cause and end of his death, they mind not. This Christ puts us in mind of, in these words: “For you, and for your sins, and for the remission of them; you, and your sins, are the cause of my death: and my death is the cause of your forgiveness.” Christians, if you keep out that word, for you; if your faith do not echo to Christ’s for you, with your for me, I assure you, that the bread and wine on the Lord’s table, and the same food on your own table, will be of equal signification, as to soul-nourishment; and that is, none at all.</p></blockquote>

<blockquote><p>Andrew Willet criticised Richard Hooker for what he perceived as the latter’s undermining of the seriousness of the error of transubstantiation:

The Church of England pronounceth, that The Transubstantiation of the bread and wine in the Eucharist, can not be proved by the sacred Scripture, but is against plain words of Scripture, overturneth the nature of the sacrament, &amp; hath give occasion of many superstitions.

And for this cause our Reverend Fathers call it: A monstrous &amp; blasphemous doctrine: bringing in doubt the truth of Christ’s body. Contrary to Christ’s words, saying: It is expedient that I go away, Joh. 16. 7. and to that of Peter: Whom the heavens must contain until the time that all things be restored, Act. 3. 21. disagreeing from the articles of faith, He ascended into heaven, sitteth at the right hand of God the Father, &amp;c. making void the institution of Christ, which is to continue till he come, &amp;c. casting holy things to profane, as whoremongers, murderers, &amp;c. mise and dogs to receive the true real body of Christ. causing most cruel eating of man’s flesh, and many monstrous miracles: accidents without subjects: the body of Christ without his qualities and true manner of a body: nourishing the Marcionist to believe the phantastical body of Christ, and Eutychians confounding the two natures of Christ, and therefore they which affirm transubstantiation are indeed right Sacramentaries and Capernaites.

In regard whereof we intreat you Mai. Hoo[ker]. to make a fit construction of your words, were you say: Sith we all agree that by the sacrament, Christ doth really and truly in us perform his promise: why do we vainly trouble our selves with so fierce contentions. whether by consubstantiation or else by transubstantiation the sacrament it self be first possessed with Christ or no: a thing which no way can either further or hinder us howsoever it stand, because our participation of Christ in the Sacrament, dependeth on the cooperation of his omnipotent power, which maketh it his body and blood unto us, whether with change or without alteration of the element, such as they imagine, we need not greatly to care nor inquire after. In all which words you seem to make light of the doctrine of transubstantiation, as a matter not to be stood upon or to be contended for, cared for or enquired into:

Which maketh us to marvel how our Church and Reverend Fathers have all this time passed, been deceived. What should cause them to affirm it to be a thing contrary to the plain words of scripture, overturning the nature of the Sacrament, to call it monstrous doctrine: why so many reverend Fathers, as Crammer, Ridley, Hooper, Latimer, Rogers, Bradford, &amp;c. have given their lives in witness against it, if it bee a thing that neither furthereth nor hindreth, a thing not to be cared for, nor enquired after? And here we pray you ingeniously to shew whether your meaning be to bring that side into credit by softening the odiousness of their heresy, and our side into suspicion of peevishness, for standing upon trifles; which the rather we desire to be resolved in, because else where you call the enemies to Transubstantiation Sacramentaries, and labour to shew a certain ubiquity of Christ’s manhood and of his body, and of his soul, which seemeth to us that you would give a gentle construction of Popish opinions, and privily rob the truth of our English creed of her due estimation.

If you call our Reverend Fathers Sacramentaries for oppugning transubst. and they again call the maintainers of it right Sacramentaries and Capernaites (if you have given as good testimony of faithfulness as they) whom shall wee believe? are you not contradictory: and may we think you can favour that side; your words do beat down; shew us then we pray you how such great favours do not prejudice the doctrine of the church of England, or not condemn those millions of learned divines and blessed Martyrs of extreme folly, who have died for the same; and that God should reveal to you only that it was for that which neither furthered nor hurteth?

Lastly instruct us whether the institution of the Sacrament by Christ, saying: this is my body: do this in remembrance of me, be not the true and right making of it Christ’s body and blood unto us: and upon what ground of Scripture it may be proved, that the cooperation of his omnipotent power doeth make it his body and blood unto us, and in what sense: And whether such phrases do not help the Popish argument of God’s power which they commonly use to approve their transubstantiation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 33-35.</span></figcaption>

ard+whereof+we+intreat+you+Mai.+Hoo%5Bker%5D.+to+make+a+fit+construction+of+your+words%2C+were+you+say%3A+Sith+we+all+agree+that+by+the+sacrament%2C+Christ+doth+really+and+truly+in+us+perform+his+promise%3A+why+do+we+vainly+trouble+our+selves+with+so+fierce+contentions.+whether+by+consubstantiation+or+else+by+transubstantiation+the+sacrament+it+self+be+first+possessed+with+Christ+or+no%3A+a+thing+which+no+way+can+either+further+or+hinder+us+howsoever+it+stand%2C+because+our+participation+of+Christ+in+the+Sacrament%2C+dependeth+on+the+cooperation+of+his+omnipotent+power%2C+which+maketh+it+his+body+and+blood+unto+us%2C+whether+with+change+or+without+alteration+of+the+element%2C+such+as+they+imagine%2C+we+need+not+greatly+to+care+nor+inquire+after.+In+all+which+words+you+seem+to+make+light+of+the+doctrine+of+transubstantiation%2C+as+a+matter+not+to+be+stood+upon+or+to+be+contended+for%2C+cared+for+or+enquired+into%3A%0A%0AWhich+maketh+us+to+marvel+how+our+Church+and+Reverend+Fathers+have+all+this+time+passed%2C+been+deceived.+What+should+cause+them+to+affirm+it+to+be+a+thing+contrary+to+the+plain+words+of+scripture%2C+overturning+the+nature+of+the+Sacrament%2C+to+call+it+monstrous+doctrine%3A+why+so+many+reverend+Fathers%2C+as+Crammer%2C+Ridley%2C+Hooper%2C+Latimer%2C+Rogers%2C+Bradford%2C+%26c.+have+given+their+lives+in+witness+against+it%2C+if+it+bee+a+thing+that+neither+furthereth+nor+hindreth%2C+a+thing+not+to+be+cared+for%2C+nor+enquired+after%3F+And+here+we+pray+you+ingeniously+to+shew+whether+your+meaning+be+to+bring+that+side+into+credit+by+softening+the+odiousness+of+their+heresy%2C+and+our+side+into+suspicion+of+peevishness%2C+for+standing+upon+trifles%3B+which+the+rather+we+desire+to+be+resolved+in%2C+because+else+where+you+call+the+enemies+to+Transubstantiation+Sacramentaries%2C+and+labour+to+shew+a+certain+ubiquity+of+Christ%E2%80%99s+manhood+and+of+his+body%2C+and+of+his+soul%2C+which+seemeth+to+us+that+you+would+give+a+gentle+construction+of+Popish+opini <blockquote><p>[T]hat we might, at this spiritual altar, see Christ (as it were) crucified before our eyes, cling unto his cross, and grasp it in our arms, suck in his blood, and with it salvation; put in our hands, with Thomas, not out of diffidence, but out of faith, into his side, and fasten our tongues in his sacred wounds; that being all over died with his blood, we may use boldness, and approach to the throne of grace, lifting up unto Heaven, in faith and confidence of acceptance, those eyes and hands which have seen and handled him, opening wide that mouth which hath received him, and crying aloud with that tongue which, having tasted the bread of life, hath from thence both strength and arguments for prayer to move God for mercy.

This then is a singular benefit of this Sacrament, the often repetition and celebration whereof, is (as it were) the renewing, or rather the confirming with more and more seals our patent of life; that by so many things, in the smallest whereof it is impossible for God to lie, we might have strong consolation, who have our refuge to lay hold on him, who in these holy mysteries is set before us: for the Sacrament is not only a sign to represent, but a seal to exhibit that which it represents.

In the sign we see, in the seal we receive, him; in the sign we have the image, in the seal the benefit, of Christ’s body: for the nature of a sign is to discover and represent that which in itself is obscure or absent, as words are called signs and symbols of our invisible thoughts: but the property of a seal is to ratify and to establish that which might otherwise be ineffectual: for which cause, some have called the Sacrament by the name of ‘a ring,’ which men use in sealing those writings, unto which they annex their trust and credit. And as the Sacrament is a sign and seal from God to us, representing and exhibiting his benefits, so should it be a sign and seal from us to God; a sign to separate us from sinners, a seal to oblige us to all performances of faith and thankfulness on our part required.</p></blockquote>

<blockquote><p>In the case of the Eucharist, you blame us for attempting to confine the Lord of the universe, and his divine and spiritual power, (which is perfectly free and infinite,) within the corners of a corporeal nature with its circumscribed boundaries. What end, pray, will there be to calumny? We have always distinctly testified, that not only the divine power of Christ, but his essence also, is diffused over all, and defined by no limits, and yet you hesitate not to upbraid us with confining it within the corners of corporeal nature! How so? Because we are unwilling with you to chain down his body to earthly elements. But had you any regard for sincerity, assuredly you are not ignorant how great a difference there is between the two things – between removing the local presence of Christ’s body from bread, and circumscribing his spiritual power within bodily limits.

Nor ought you to charge our doctrine with novelty, since it was always held by the Church an acknowledged point. But as this subject alone would extend to a volume, in order that both of us may escape so toilsome a discussion, the better course will be for you to read Augustine’s Epistle to Dardanus, where you will find how one and the same Christ more than fills heaven and earth with the vastness of his divinity, and yet is not everywhere diffused in respect of his humanity.

We loudly proclaim the communion of flesh and blood, which is exhibited to believers in the Supper; and we distinctly show that that flesh is truly meat, and that blood truly drink — that the soul, not contented with an imaginary conception, enjoys them in very truth. That presence of Christ, by which we are ingrafted in him, we by no means exclude from the Supper, nor shroud in darkness, though we hold that there must be no local limitation, that the glorious body of Christ must not be degraded to earthly elements; that there must be no fiction of transubstantiating the bread into Christ, and afterwards worshipping it as Christ. We explain the dignity and end of this solemn rite in the loftiest terms which we can employ, and then declare how great the advantages which we derive from it.

Almost all these things are neglected by you. For, overlooking the divine beneficence which is here bestowed upon us, overlooking the legitimate use of so great a benefit, (the topics on which it were becoming most especially to dwell,) you count it enough that the people gaze stupidly at the visible sign, without any understanding of the spiritual mystery. In condemning your gross dogma of transubstantiation, and declaring that stupid adoration which detains the minds of men among the elements, and permits them not to rise to Christ, to be perverse and impious, we have not acted without the concurrence of the ancient Church, under whose shadow you endeavour in vain to hide the very vile superstitions to which you are here addicted.</p></blockquote>

.+That+presence+of+Christ%2C+by+which+we+are+ingrafted+in+him%2C+we+by+no+means+exclude+from+the+Supper%2C+nor+shroud+in+darkness%2C+though+we+hold+that+there+must+be+no+local+limitation%2C+that+the+glorious+body+of+Christ+must+not+be+degraded+to+earthly+elements%3B+that+there+must+be+no+fiction+of+transubstantiating+the+bread+into+Christ%2C+and+afterwards+worshipping+it+as+Christ.+We+explain+the+dignity+and+end+of+this+solemn+rite+in+the+loftiest+terms+which+we+can+employ%2C+and+then+declare+how+great+the+advantages+which+we+derive+from+it.%0A%0AAlmost+all+these+things+are+neglected+by+you.+For%2C+overlooking+the+divine+beneficence+which+is+here+bestowed+upon+us%2C+overlooking+the+legitimate+use+of+so+great+a+benefit%2C+%28the+topics+on+which+it+were+becoming+most+especially+to+dwell%2C%29+you+count+it+enough+that+the+people+gaze+stupidly+at+the+visible+sign%2C+without+any+understanding+of+the+spiritual+mystery.+In+condemning+your+gross+dogma+of+transubstantiation%2C+and+declaring+that+stupid+adoration+which+detains+the+minds+of+men+among+the+elements%2C+and+permits+them+not+to+rise+to+Christ%2C+to+be+perverse+and+impious%2C+we+have+not+acted+without+the+concurrence+of+the+ancient+Church%2C+under+whose+shadow+you+endeavour+in+vain+to+hide+the+very+vile+superstitions+to+which+you+are+here+addicted.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Letter+to+Cardinal+Sadolet%E2%80%99s+Letter+%281539%29+in+Tracts+and+Letters+relating+to+the+Reformation%2C+trans+and+ed.+Henry+Beveridge+%287+vols%2C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+1%3A+45-46.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c73bdb7b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c73bdb7b0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/08/john-calvin-on-eucharist-and-christology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

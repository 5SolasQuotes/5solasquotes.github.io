<main class="wrap"><figure class="quote" id="q-162e363767" data-kw="">
<blockquote><p>And I exhort you to do nothing out of strife, but according to the doctrine of Christ. When I heard some saying, If I do not find it in the ancient Scriptures, I will not believe the Gospel; on my saying to them, ‘It is written,’ they answered me, ‘That remains to be proved.’ But to me Jesus Christ is in the place of all that is ancient: His cross, and death, and resurrection, and the faith which is by Him, are undefiled monuments of antiquity;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ignatius-of-antioch.html">Ignatius of Antioch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle of Ignatius to the Philadelphians</cite>, ch. 8 in ANF 1.84</span></figcaption>

</figure><figure class="quote" id="q-25881b937a" data-kw="">
<blockquote><p>But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true; but that all the letters of bishops which have been written, or are being written, since the closing of the canon, are liable to be refuted if there be anything contained in them which strays from the truth, either by the discourse of some one who happens to be wiser in the matter than themselves, or by the weightier authority and more learned experience of other bishops, by the authority of Councils</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Baptism, Against the Donatists, bk. 2, ch. 3, §4</span></figcaption>

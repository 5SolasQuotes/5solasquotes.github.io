<main class="wrap"><figure class="quote" id="q-bcb0b77408" data-kw="">
<blockquote><p>I deny not but a private Christian may dislike the corruptions that are allowed and practiced by a whole Church, he may refuse to subscribe or yield his consent unto them, he may by prayer and all other good means seek the reformation of them: but that any one private Christian or some few several assemblies [such as, of the Separatists] wherein also there are some learned men may account all the churches that are in an whole nation to be either as heathens (that is, such as are destitute of the Word and sacraments and service of God) or as publicans (that is, such as with whom they may not lawfully communicate and join in the said service of God), that do I utterly deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England, wherein is handled this Question: Whether it be to be separated from, or joined unto. Which is discussed in Two Letters, the one</cite>, [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 5, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“I deny not but a private Christian may dislike the corruptions that are allowed and practiced by a whole Church, he may refuse to subscribe or yield his consent unto them, he may by prayer and all other good means seek the reformation of them: but that any one private Christian or some few several assemblies [such as, of the Separatists] wherein also there are some learned men may account all the churches that are in an whole nation to be either as heathens (that is, such as are destitute of the Word and sacraments and service of God) or as publicans (that is, such as with whom they may not lawfully communicate and join in the said service of God), that do I utterly deny.”

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c003f2e045" data-kw="">
<blockquote><p>Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), p. 284</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!”

— John Howe, ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), p. 284">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAgain%2C+your+subjoined+text+of+Scripture+%5Bto+your+book%5D%2C+%E2%80%98If+the+Lord+be+God%2C+follow+Him%3B+but+if+Baal%E2%80%99%E2%80%94for+what+purpose+was+it+set+there%3F+What%3F+to+signify+that+the+God+of+the+dissenters+and+of+the+Established+Church+differ+as+the+living+God+and+Baal%3F%E2%80%A6+It+was+uncharitable.+Uncharitable%3F+That+is+a+trifle+in+comparison%3B+it+was+profane+and+most+impious+wit%3A+yet+you+are+mighty+fond+of+the+conceit+and+we+have+it+over+and+over+in+the+book+that+the+conformists+and+dissenters+serve+two+Gods%E2%80%94as+the+one+of+them+is+miscalled%E2%80%94and+have+two+religions%21%E2%80%A6+and%2C+for+aught+appears+you+intend%2C+in+most+of+them+%5Bestablished+churches%5D%2C+you+blaspheme+as+a+senseless+idol%E2%80%94rebuke%2C+and+forgive+you%21%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+%E2%80%98Some+Consideration+of+a+Preface+to+an+Inquiry+Concerning+the+Occasional+Conformity+of+Dissenters%2C+etc.%E2%80%99+in+The+Works+of+John+Howe%2C+vol.+5%2C+Containing+the+Treatises%3A+On+Divine+Prescience+and+the+Trinity%E2%80%A6+%28d.+1705%3B+Religious+Tract+Society%2C+1863%29%2C+p.+284&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc003f2e045.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c003f2e045.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Again%2C%20your%20subjoined%20text%20of%20Scripture,a%20senseless%20idol%E2%80%94rebuke%2C%20and%20forgive%20you&amp;text=Again%2C%20your%20subjoined%20text%20of%20Scripture%20%5Bto%20your&amp;text=blaspheme%20as%20a%20senseless%20idol%E2%80%94rebuke%2C%20and%20forgive%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-261ebe3604" data-kw="">
<blockquote><p>III. They [nonconformists] thought not the imposition of it [the Anglican Service-Book] a reason sufficient to prove it unlawful for them to use it, were there no more [issues with it].</p></blockquote>

</figure><figure class="quote" id="q-cbced76d48" data-kw="">
<blockquote><p>11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship. 12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 15</span></figcaption>

<blockquote><p>The secession of those good people from the idolatry erected by Jeroboam to worship at Jerusalem is allowed, 2 Chron. 11:16. The negative separation, or the not communicating in the worship of Baal, not so much as by knees or lips of those seven thousand in Israel, is liked of by the Lord, 1 Kings 19:18… The flying of God’s people out of Babylon [Rev. 18:4], where idolatry is maintained by force of tyranny is called for and required.</p></blockquote>

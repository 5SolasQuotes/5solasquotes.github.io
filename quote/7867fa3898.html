<blockquote><p>…if Timorcus [who argued the continuing obligation of the covenants] (p. 37) may be believed (and he seems tender in the matter of others) there is no contradiction between the canonical oath and the [Solemn League and] Covenant [1643]; he maintains that the [Scottish] ministers who of old [in the early-1600’s] took the canonical oath, did not swear the contradictory thereto when they took the [Solemn League and] Covenant: whence it will follow necessarily that they who have taken the Covenant do not contradict that oath, if they should take the oath of canonical obedience:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-honyman.html">Andrew Honyman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seasonable Case of Submission to the Church-Government as now Re-established by Law, briefly stated and determined by a Lover of the Peace of this Church &amp; Kingdom</cite>, (Edinburgh: Tyler, 1662), p. 15</span></figcaption>

<blockquote><p>…for the key of knowledge and the power of pastoral preaching is given, uni subjective, non unitati nisi objective, ‘to one man as to the subject,’ and to the Church, for her salvation and good, as for the end and object; and the pastor being once ordained a pastor, may use these keys, quoad specificationem, independently, for he may preach mercy and wrath, not waiting the Church’s suffrages. Et potestas clavium quoad jurisdictionem data est ecclesiae et subjective et objective, et data est non uni, sed unitati: ‘but the power of the keys,’ in censures, for binding and loosing ‘is given to no one mortal man, but to the Church, both as to the subject, and the object.’ I mean the ministerial Church; and not one man pastor, Pope, or prelate may use the keys; the Church has them and can only validly use them.</p></blockquote>

<blockquote><p>4. They that distinguish between the key of order and the key of jurisdiction do without question allow the former to the presbyters. Now the key of order (as rightly understood, as Spalatensis has largely opened it) comprehends all that power whereby we do immediately work on the conscience, and so is exercised in foro interno, and not directly in externo. Now that which we have agreed on [in Baxter’s Association] is only so much as belongs to order, or to a presbyter as the ambassador of Christ and [as] his watchman over the souls of those people; and it is to be no further effectual than they conscientiously submit to it, voluntarily, without external force. It is but our preaching and applying God’s Word to the consciences of the hearers.</p></blockquote>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c2e86419c9" data-kw="">
<blockquote><p>…his [John Robinson’s] answer is that no parish assemblies [under patrons and bishops] have power of right to choose their ministers. Whereas on the contrary it is most evident that every congregation of Christians has right unto this thing from Christ Himself so inseparably annexed unto it that no external oppression by others or abuse of their own can possibly deprive them of this right, so long as they remain a Christian assembly or congregation. Suppose they be in external bondage, and that in some sense spiritual, yet no matter of fact can take away right, while they abide such as Christ has given that right unto. The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed. Even so stands the matter betwixt minister and people in England, they agreeing or contracting betwixt themselves have right one in other: but external legal power or liberty they must receive from others. Another example also I would have considered: the emperor sometime was so subiect unto the pope that he had not liberty of emperial rule until he received his crown from Rome: yet was the emperor then no proper part of the papacy, nor did he take his right from the pope, neither did those that submitted unto him therein communicate with the pope’s authority. So is this in hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

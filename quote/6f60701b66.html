<blockquote><p>VI. The end of the Covenant [of Grace] is the same that is of the general vocation, God’s glory, and the salvation of the Elect.

VII. The subject or object of this proffered Covenant, are all that be called; but properly the Elect only.

This Covenant is proffered to all that are called, but the Elect only enjoy the Promises of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 171.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-dcfca4e84c" data-kw="">
<blockquote><p>The Covenant which God makes with man is a sure Covenant. Hence called a Covenant of Salt, Numb. 18. 19. Because Salt preserves from perishing and putrefaction. The Covenant of God with man about temporal things is called a Covenant of Salt, and a Covenant for ever, 2 Chron. 15. 3.

For though his Covenant about temporal things (as all temporals must) hath an end of termination, yet it hath no end of corruption; time will conclude it, but time cannot violate it. But as for his Covenant about eternal things, that, like eternity knows not only no end of corruption, but none of termination.

Although my House (saith gasping David) be not so with God, yet be hath made with me an everlasting Covenant, ordered in all things and sure: for this is all my salvation and all my desire, although he make it not to grow, 2 Sam. 23. 5. And what is it that makes the Covenant of God with man thus sure? Sure not only in it self, but (as the Apostle speaks) to all the seed, Rom 5. 16. Is it not this, because it hath a strong foundation, a double, impregnable foundation? First, his own free grace. Secondly, the blood of Christ; which is therefore also called, the blood of the Covenant, Heb. 10. 29. Because of all this, this All, which hath an infinity in it, The Lord God hath made with us a sure Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The nature, solemnity, grounds, property, and benefits, of a sacred covenant. Together with the duties of those who enter into such a covenant. Delivered in a sermon at Westminster, at the publique convention, (ordered by the Honourable House of Commons) for the taking of the Covenant, by all such, </cite>, (London: John Rothwell, 1643), p. 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-91f042dc54" data-kw="">
<blockquote><p>Question 13. But how may it appear that He is willing to receive me? Answer: Make trial of Him thyself. If thou didst but know his heart to poor sinners, you would not question it. Believe what He says in the gospel; there thou shalt find that He is a willing Savior; for therein thou hast: First, his most serious invitations, Mt. 11:28, “Come unto Me, ye that are weary and heavy laden.” Isa. 55:1, “Ho! every one that thirsteth come ye to the waters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Flavel</cite>, 6 vols. (d. 1691; London: Baynes &amp; Son, 1820) | vol. 5, “A Sober Consideration of the Sin of Drunkenness”, p. 337</span></figcaption>

<main class="wrap"><figure class="quote" id="q-21faa12eaf" data-kw="">
<blockquote><p>And should any one offer to prove that any one of these adopted sons of God may become apostate and perish, he is rather to be derided by all, than refuted by any one; for they undoubtedly shall reign with Christ, whom God Himself has of His own good will predestined to the kingdom. If any one of those should perish, God would be either overcome or deceived; neither of which things is possible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Regeneration and the Final Perseverance of the Saints. A Letter to Dr. Samuel Ward</cite>, trans. Josiah Allport (1650; London: William MacIntosh, 1864), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a></span></div>

</figure><figure class="quote" id="q-0a4da4af43" data-kw="">
<blockquote><p>A debate arose among Reformed divines in the 1620s and 30s, particularly in England, over the issue of baptismal regeneration. A variety of interpretations of passages like Titus 3:5 and 1 Peter 3:21 were proposed and there was debate over how to interpret Augustine and even Calvin on this issue. In the past it was thought that this debate arose in response to Anabaptist arguments against the propriety of infant baptism. Jay Colier, however, has convincingly argued in his recent book, that the debate was actually set off by the Synod of Dort, specifically the canon affirming the perseverance of all the saints. Prior to Dort, Reformed confessions did not explicitly affirm the doctrine of perseverance, allowing some variation in how the doctrine was taught, though no one outright denied it… In affirming and codifying the absolute perseverance of every saint, however, the Synod of Dort and its canons gave a greater sense of urgency to the issue, removing any gray area that would permit a general sort of regeneration for non-elect infants that might be lost when a child reaches maturity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eric-parker.html">Eric Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Debating Baptismal Regeneration: Johannes Maccovius’</cite>, (2018)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a></span></div>

</div>
</figure><figure class="quote" id="q-75e47352c7" data-kw="">
<blockquote><p>As far as God is concerned it is immutable; on the part of the creature, it is contingent or mutable, although it never will be changed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Regeneration &amp; the Final Perseverance of the Saints. A letter of</cite>, … Davenant… to Dr. Samuel Ward… tr. J. Allport (d. 1641; London: Macintosh, 1864), pt. 2, Proposition 5 | “5. When we teach the perseverance of the saints in a state of justification once obtained, we do not deny that the quality, or exercise of the faithful or righteous man is mutable or may be lost, by reason of the subject matter; but we affirm that the special love of God does not permit, that he who by believing in Christ shall have been justified and adopted as a son of God, by losing that faith and holiness should cease to be a child of God and perish for ever. | And in this sense, Fathers, Schoolmen, and our own Divines, nay, the Sacred Scriptures themselves, hold it impossible, that any of the elect children of God, justified and adopted, should ever fail of salvation. Henry of Ghent has explained this matter very well, where he is enquiring whether Paul might not have been killed before his conversion (Quodlibetica). The sum of it is that “the effect of predestination may be hindered, although not upon the ground that it was predestined.” Or, in this way:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a></span></div>

</figure><figure class="quote" id="q-9078428041" data-kw="">
<blockquote><p>While one may find a confession like the Irish Articles (1615) explicitly stating perseverance of all those who are regenerate and have true faith (Art. 38), many Reformed confessions, like the First Helvetic Confession (1536), simply don’t address the topic. Similarly, doctrinal standards like the Belgic Confession (1561) and the Heidelberg Catechism (1563), which many people find conducive to the perseverance of the saints, never clearly state it. And while the tenth chapter of the Second Helvetic Confession (1566) may be suggestive of perseverance of the saints when it identifies those engrafted in Christ by faith with the elect, it does not come out and say that those with true faith cannot lose it. Other confessions, like the Thirty-Nine Articles (1563), speak of the elect attaining everlasting felicity (Art. 17) without ever specifying that everyone with saving faith is elect. This path was even followed by the French Confession (1559) and the Confession of La Rochelle (1571), which were highly influenced by Calvin and the Reformers in Geneva. But the fact that so many Reformed confessions did not require adherence to the perseverance of the saints does not mean that the doctrine was not prominent. To the contrary, the fact that the confessions did not deny it allowed the doctrine to flourish among the Reformed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-t-collier.html">Jay T. Collier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Debating Perseverance</cite>, (Oxford, 2018) 207 pp. ToC, pp. 11-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a></span></div>

<main class="wrap"><figure class="quote" id="q-b7047fe5cf" data-kw="">
<blockquote><p>We confess that afflictions are of their own nature evil: howbeit we say, that unto the godly and unto the elect of God, of whom we here speak, they are by the clemency of God, made good and profitable, For unto them all things work unto good. For neither do they suffer these things to their hurt, but to their triumph. And these things are like unto the red sea, wherein Pharaoh was drowned, but Israel was saved: for in the wicked they stir up desperation, but in the godly a most assured hope. They are instruments, whereby in us is shewed forth the goodness and might of God, both in comforting us, and also in erecting us.

They are occasions of most excellent good things. The power of God is in our infirmity made perfect. By these things as by a fatherly chastisement are corrected our daily falls: haughtiness and pride is kept under: the flesh and wantonness is restrained: our old man is brought to corruption, but our inward man is renewed, sluggishness and slothfulness is shaken of, the confession of faith is wrong out, the imbecility of our strengths is uncovered: and we are provoked more fervently to pray and to implore the favour of God, and daily the better understand the perverseness of our own nature.

Farther by afflictions we are made like unto Christ. For it behoved Christ to suffer, and so to obtain his kingdom, &amp; we also ought to follow the self same steps. For the kingdom of God suffereth violence: and narrow is the way which leadeth to life. But even as he after the obedience of the crosse was exalted, and had given unto him a name above all names: so also if we shall suffer together with him, we shall reign also together with him, and it is a sweet thing also unto a lover to suffer for the thing that he loveth. Hereby also we accustom our selves to patience, that being become as hard as the adamant stone, when we are smitten we shall rather be weary, then once break. For these are as it were exercises in the body of a man: by which is confirmed health, and strengths are gotten, rather then that by them they are taken away or weakened. Wherefore the godly do upon good consideration rejoice in afflictions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romanes wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Ep</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 99.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bda3c051e8" data-kw="">

<blockquote><p>If by the word cross, we understand the sufferings which the son of God endured, both in soul and body, as Esay 55. verse 3. Being filled with sorrows, and full of heaviness in soul, even to the death, as having drunk the cup of God’s anger, whereon he cried, My God, my god, why hast thou forsaken me? it is most certain, that such sufferings exceed representation. For our sense cannot comprehend them: but by faith we understand, that they were infinite and unspeakable. Therefore we say in our Creed, that we believe Christ Jesus did suffer, that he was crucified, dead, and buried, that he descended into hell: all these then being unspeakable, must needs be likewise irrepresentable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief treatise of the virtue of the cross and the true manner how to honour it</cite>, trans. Anthony Munday (London: Edward White, 1599), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-feaede9d94" data-kw="">
<blockquote><p>A holy, a prudent silence under affliction doth not exclude and shut out a sense and feeling of our afflictions. Ps. xxxix. 9, though he ‘was dumb, and laid his hand upon his mouth,’ yet he was very sensible of his affliction: verses 10, 11, ‘Remove thy stroke away from me, I am consumed by the blow of thine hand. When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man is vanity.’ He is sensible of his pain as well as of his sin; and having prayed off his sin in the former verses, he labours here to pray off his pain. Diseases, aches, sicknesses, pains, they are all the daughters of sin, and he that is not sensible of them as the births and products of sin, doth but add to his sin and provoke the Lord to add to his sufferings, Isa. xxvi. 9-11.

No man shall ever be charged by God for feeling his burden, if he neither fret nor faint under it. Grace doth not destroy nature, but rather perfect it. Grace is of a noble offspring; it neither turneth men into stocks nor to stoics. The more grace, the more sensible of the tokens, frowns, blows, and lashes of a displeased Father. Though Calvin, under his greatest pains, was never heard to mutter nor murmur, yet he was heard often to say, ‘How long, Lord, how long?’ A religious commander being shot in battle, when the wound was searched, and the bullet cut out, some standing by, pitying his pain, he replied, Though I groan, yet I bless God I do not grumble. God allows his people to groan, though not to grumble. It is a God-provoking sin to be stupid and senseless under the afflicting hand of God. God will heat that man’s furnace of affliction sevenfold hotter, who is in the furnace but feels it not …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 306-07.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-415f3c2dd3" data-kw="">
<blockquote><p>The red area cg25 is the sadness center of the brain and it’s red hot. The “cold” or “underactive” blue areas are concerned with drive, motivation, decision making, etc… the PET scans at the moment are prohibitively expensive for most… However, such tests will accelerate the improvement of medications.</p></blockquote>

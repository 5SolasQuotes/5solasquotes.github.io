</figure><figure class="quote" id="q-246d713917" data-kw="">
<blockquote><p>Then the minister continues, saying: Be mindful that God our savior wills all people to come to the knowledge of the truth through the only mediator, Jesus Christ, who handed himself over as a ransom for many. God also wills for us to join in many prayers, that we should arrive at the unity of faith and knowledge of the Son of God, our redeemer. Therefore we ask the Lord to grant faith to this little one, that the external baptism should take place internally through the Holy Spirit in [by means of?] the salvific water. Therefore, pray in this way: Almighty, eternal God, who through the flood, in accordance with your severe but just judgment, condemned the unbelieving world and saved, on the grounds of your immense mercy, faithful Noah’s eight; you who submerged hardened Pharaoh with all his people in the Red Sea, but then led your people Israel across with dry feet, a prefiguring of baptism — We beseech you through your immense mercy that you would deign to look mercifully upon your servant, [name], and kindle in his heart the light of faith, so as to be grafted into your Son, buried together with him in death, and also raised into a new life, in which he would eagerly follow your son in bearing his cross daily and cling to him in true faith, firm hope, and ardent love, so that for your sake, he could boldly despise this life, which is nothing other than death, and on the last day present himself fearlessly at the universal judgment of your Son. Through our Lord Jesus Christ, your Son, who lives and reigns with you in the unity of the Holy Spirit, God throughout all ages. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-lavater.html">Ludwig Lavater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rites &amp; Institutions of the Zurich Church (1559)</cite></span></figcaption>

6d713917.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/246d713917.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Then%20the%20minister%20continues%2C%20saying%3A,Spirit%2C%20God%20throughout%20all%20ages.%20Amen." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d4a248405c" data-kw="">
<blockquote><p>‘Tis one thing to dispute of the absolute sovereign power of God, and what are the truths, without the belief whereof ’tis absolutely, and altogether impossible that one can be saved: Which question (I doubt) is hardly determinable by Scripture, nor do I know what edification there is in the canvassing of it; sure I am ’tis a question much abused. ‘Tis another thing to dispute what are these truths, which in a Church where the Gospel is truly preached, all and every one (come to years of knowledge and discretion) and having means and occasions to learn, are bound to know (and according to the revealed will and ordinary dispensation of God) must learn, as they desire or expect to have a true fellowship with Christ in the sacrament of the Lord’s Supper, or to be accepted of God, and saved eternally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions... (Edinburgh, 1649), ch. 9. ‘What is Meant in Scripture by the Word ‘Heresies’…’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-9e6ca3df15" data-kw="">
<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Infants are members of the Church of Christ; and, therefore, to be baptized.’, pp. 303-304 in The Doctrine of the Two Sacraments in Works, vol. 2 ed. Quick (Philadelphia, 1874)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

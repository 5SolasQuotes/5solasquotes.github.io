<main class="wrap"><figure class="quote" id="q-3a2e559560" data-kw="believer obedience not punishment">
<blockquote><p>In the state of grace, it binds the believer only to obedience, not to punishment because there is no condemnation to those who are in Christ (Rom. 8:1), whose transgressions are forgiven (Ps. 32:1). Rather the question concerns the state of sin—whether in it the sinner is bound to both (which we assert). First, from the twofold condition of sinful man, who is both a creature and a sinful creature. As a creature, he owes to God obedience forever and never can be discharged from it. As a sinner, he owes punishment.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01aff859f5" data-kw="law uses schoolmaster">
<blockquote><p>As the doctrine concerning the law of God properly belongs to the theologian, so it has a multiple use in theology. (1) For the direction of life—as a perfect rule of God’s right over man and of man’s duty towards God. (2) For a knowledge of sin (Rom. 3:20). (3) For preparation for grace—in which sense it is called “a schoolmaster unto Christ,” Gal. 3:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.1.1</span></figcaption>

</figure><figure class="quote" id="q-900bb6b6ed" data-kw="third use rule of life">
<blockquote><p>It not only antecedently prepares the elect man for Christ, but consequently also directs him already renewed through Christ in the ways of the Lord; serving him as a standard and rule of the most perfect life, to which he knows he is called by Christ and which he ought diligently to pursue (1 Tim. 1:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.11</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 11.22.11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt%20not%20only%20antecedently%20prepares%20the%20elect%20man%20for%20Christ%2C%20but%20consequently%20also%20directs%20him%20already%20renewed%20through%20Christ%20in%20the%20ways%20of%20the%20Lord%3B%20serving%20him%20as%20a%20standard%20and%20rule%20of%20the%20most%20perfect%20life%2C%20to%20which%20he%20knows%20he%20is%20called%20by%20Christ%20and%20which%20he%20ought%20diligently%20to%20pursue%20%281%20Tim.%201%3A5%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2011.22.11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F900bb6b6ed.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/900bb6b6ed.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ffaa63822b" data-kw="civil pedagogical conviction restraint">
<blockquote><p>In the destitute state of sin, the use of the law cannot be “justification” because it was weak in the flesh. It is not said to have been given for life, but “because of transgressions” (Gal. 3:19). Still there is a threefold use of the law. (a) For conviction, when it brings man to a knowledge of sin and convinces him of his guilt—“by the law is the knowledge of sin” (Rom. 3:20). Thus it is like a mirror in which we see our blemishes. (b) For restraint, restraining and checking men by its commands and threatenings, so that they who feel no regard for justice and rectitude unless compelled (while they hear its direful sanctions) may be restrained at least by the fear of punishment. In this respect, Paul says “the law is not made for a righteous man, but for lawless and disobedient, for the ungodly and for sinners” (1 Tim. 1:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.9</span></figcaption>

</figure><figure class="quote" id="q-f9e83fa791" data-kw="schoolmaster lead to Christ">
<blockquote><p>In the restored state of grace, it has a varied use with respect to the elect, both before and after their conversions. Antecedently, it serves (a) to convince and humble man so that (his own misery and weakness being felt) he despairs of himself and renounces confidence in his own righteousness and merit and rests upon the mercy of God alone. (b) To lead men to Christ, not indeed primarily and by itself (because the law does not know Christ), but by the accident of grace, inasmuch as it impels man (cast down and despairing of his own strength) to seek the remedy of saving grace. Under this relation, it is called by Paul “a schoolmaster” unto Christ (Gal. 3:24) and Christ is called “the end of the law” (Rom. 10:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.10</span></figcaption>

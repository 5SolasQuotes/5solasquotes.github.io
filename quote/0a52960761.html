<main class="wrap"><figure class="quote" id="q-0a52960761" data-kw="">
<blockquote><p>The second defect which he [an opponent] wishes supplied is that the temporary ruling elders may be made perpetual and for life… This I assent unto providing he admit a distinction betwixt the office itself, and the exercise of the same. The office of a ruling elder ought to be for his life no less than the pastors; yet must we not condemn those Churches which dispense with the intermission of their actual attendance for a certain space, and permit them to exercise their office by course, as the Levites did of old, whose example himself here takes for a pattern.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of Scotland… (Edinburgh, 1641), pt, 1 | Postscript</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

</figure><figure class="quote" id="q-64901dc3fb" data-kw="">
<blockquote><p>I have also proven before that human laws do not bind to obedience but only in this case, when the things which they prescribe do agree and serve to those things which God’s Law prescribes: so that as human laws they bind not, neither have they any force to bind, but only by participation with God’s Law.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4a3df5f2e3" data-kw="">
<blockquote><p>The materials of worship, as linen, clothes, habits, gestures may be in their physical consideration indifferent, but as applied by formalists, they cannot be indifferent, for in their use, kneeling appropriated to sacramental bread, linen appropriated to the body of a priest, while he officiates, cannot be but religious or profane.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646) | Appendix on Scandal</cite>, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-395f676083" data-kw="">
<blockquote><p>I will address the following three questions: (1) To what extent would male head-covering ideology in Greek and Roman cultures be at loggerheads with the text of 1 Cor 11:4? (2) To what extent would wearing a veil for a man create tensions of shame and conflict in the church in Roman Corinth? And (3) what is the specific issue regarding male sartorial practice? I will first address the controversial and long-standing issue of whether the verse refers to veils, long hair, or both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preston-t-massey.html">Preston T. Massey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Long Hair as a Glory &amp; as a Covering: Removing an Ambiguity from 1 Cor 11:15’ Novum Testamentum, vol. 53, Fasc. 1 (2011), pp. 52-72</cite>, p. 503</span></figcaption>

</figure><figure class="quote" id="q-d01a75c6aa" data-kw="">
<blockquote><p>The testimonies of Cyprian, Ambrose, Augustine, are easily answered, in a few words: They speak not of mystical rites, or significant ceremonies, but of some civil external usages gotten into worship; different in diverse places; as Socrates [the early Church, ecclesiastical historian] tells us of many, in his time, as in observation of Easter or Lent: in receiving the Lord’s Supper at evening or morning, standing or sitting, etc. Such an usage in Reformed Churches, is, that somewhere the ministers preach with heads covered, otherwhere, bare-headed, and many the like: In such things, those ancients advise to conform to the usages of the places where they come: but surely, would never have wise people to comply in things inexpediently sinful, in worship, in any place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-bagshaw.html">Edward Bagshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The XXIV Cases concerning things Indifferent in Religious Worship Considered… (London, 1663), The Grand Case Considered, I. Touching Things Inexpedient</cite>, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

e</a></div>
</figure><figure class="quote" id="q-bfbcffb020" data-kw="">
<blockquote><p>We are accustomed to testify without hesitation that this reverence–even if it principally resides in the attitude of the heart of a person who, with a certain righteous dread, regards God as present with Him, a heavenly banquet as present, and the angels as present–nevertheless is also present in the external elements [signis]. I mean things like kneeling during common prayers, an uncovered head, and properly greeting those from whose hand we receive the mysteries–in a word, in our whole deportment and demeanor. And anyone who behaved differently would not leave without a severe rebuke.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper (RHB, 2016)</cite>, p. 113</span></figcaption>

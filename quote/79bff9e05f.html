<main class="wrap"><figure class="quote" id="q-79bff9e05f" data-kw="">
<blockquote><p>4. I perceive he [Gillespie’s opponent] would say that the scandal of non-conformity is a greater scandal than the scandal of conformity; He is bold to object [that] where one is offended with our practise of kneeling, twenty, I may say ten thousand, are offended with your refusal. O adventurous arithmetique! O huge hyperbole! O desultorious declamation! O roving rhetoric! O prodigal paradox! Yet I reply: 1. Though sundry (yet not ten thousand for one) are displeased by our refusal, who can show us that any are thereby scandalized, that is, made worse and induced to ruin? …

5. We know many are grieved and displeased with our non-conformity, yet that every one who is grieved is not by and by scandalized, the Bishop of Winchester [an opponent] teaches as well as we. ‘Many times’ says he, ‘men are grieved with that which is for their good, and earnestly set on that which is not expedient for them.’ But in good earnest, what do they mean who say they are scandalized or made worse by our non-conformity? For neither do we make them condemn our lawful deed as unlawful, nor yet do we animate them by our example to do that which in their consciences they judge unlawful.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb73bf2c7a" data-kw="">
<blockquote><p>We are not here to understand by scandal, a thing actually displeasing the party offended; nor is it always to be judged by the matter, seeing offense in lawful matter may be taken where it is not given, as in that eating and drinking mentioned, Rom. 14, or in taking wages for preaching the gospel, 1 Cor. 9. Neither is it the pleasing of men that does always edify them, nor the displeasing of them that does stumble or scandalize them; but scandal is something accompanying word or deed with such circumstances as makes that word or deed inductive to sin, or impeditive of the spiritual life, or comfort of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland</cite>, … (1709), bk. 4, Title 1, ‘Of Scandals &amp; Church-Discipline in General…’, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-dd6eb3c3f5" data-kw="">
<blockquote><p>Lastly, there is difference in the faulty carriage of the persons: and that on both parts; especially on ours. For though our non-conforming brethren condemn us [conformists] with much liberty of speech and spirit, having yet less reason for it than the weak Romans had [in ch. 14] (for the strong among them might have forborn some things for the weak’s sake; and it would well have become them for the avoiding of scandal so to have done; which we cannot do without greater scandal in the open contempt of lawful authority…</p></blockquote>

</figure><figure class="quote" id="q-96301fde29" data-kw="">
<blockquote><p>But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 54-55</span></figcaption>

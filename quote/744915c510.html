<blockquote><p>But now comes a greater question: If by justification our sins be forgiven us, what sins are forgiven I pray? sins past, or sins to come? We are taught that in the instant of justification all our sins past and to come are remitted; which is in my mind an unsound doctrine: for if we look narrowly into it, we shall find that in propriety of speech, remission of sins has relation to that which is past; it’s said therefore, Rom. 3:25: ‘Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past through the forbearance of God.’ And remission of sins has relation to those that are past, as appears by inevitable reason; for what is remission of sins, but sin covered? Now can a thing be covered before it be? ‘Blot out mine iniquities,’ etc. says David; can a thing be blotted out before it’s written? This is the thing [that] makes the Pope so ridiculous, that he will forgive sins for the time before they are committed; but what, do we get nothing for the time to come? Yes, yes, when the sin is past, by faith we have a new access unto God; and having risen by repentance, we get a new act, not of universal justification, but of a particular justification, from this and that particular sin. But if there be forgiveness of sins past already, and I know that I am justified, and my sins remitted: may I now pray for forgiveness of sins past? The Papists say it is active infidelity, and as absurd as to pray to God to create the world anew, or incarnate his Son again. But there is no conversion where there is no praying; and there is need of praying for the remission of sins past, and against sin for the time to come, as I shall show next time; as also consider whether there be any interruption of the act of justification by falling into great sins. There’s no man has a mind more against quirks and quillets than I; yet for the opening of these things, and staying and settling the mind, and clearing the understanding, give me leave the next time to clear these things unto you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 15th Sermon, on Rom. 5:1, pp. 402-3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3bba617e92" data-kw="">
<blockquote><p>It is said, Christ is our righteousness, because He satisfied the Father for us, and that satisfaction, when He justifies us, is given and communicated to us in such a way that it can be said to be our satisfaction and righteousness. For even if we are truly and rightly called and are righteous by inherent righteousness, yet we do not satisfy God for our sins and eternal punishment by it. But that inherent righteousness comes with the remission of sin and eternal punishment, the effect of Christ’s satisfaction, which is conferred and applied to us in justification. And in this way it would not be absurd if someone said that the merits of Christ are imputed to us, when they are given and applied to us, as if we ourselves satisfied God; provided that it is not denied that there is in us also an inherent righteousness, which is true and absolute righteousness, which is not liable to punishment but to glory.</p></blockquote>

</figure><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>

<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.

4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ.

5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ.

5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.”

+truly+recognize+that+they+have+received+the+remission+of+sins+and+reconciliation+on+account+of+the+merits+of+Christ%2C+through+the+free+%5Bgratuita%5D+goodness+of+God%2C+and+cry+out+to+God%3A+Abba+Father%E2%80%99.+But+this+happens+to+no+one+unless+also+at+the+same+time+love+is+infused+%5Binfundatur%5D+which+heals+the+will+so+that+the+healed+will+may+begin+to+fulfil+the+law%2C+just+as+Saint+Augustine+said+%5BOf+the+Spirit+%26+Letter%2C+ch.+9%2C15%5D.+So+living+faith+is+that+which+both+appropriates+mercy+in+Christ%2C+believing+that+the+righteousness+which+is+in+Christ+is+freely+imputed+to+it%2C+and+at+the+same+time+receives+the+promise+of+the+Holy+Spirit+and+love.+Therefore+the+faith+that+truly+justifies+is+that+faith+which+is+effectual+through+love+%5BGal.+5%3A6%5D.+Nevertheless+it+remains+true+that+it+is+by+this+faith+that+we+are+justified+%28i.e.+accepted+and+reconciled+to+God%29+inasmuch+as+it+appropriates+the+mercy+and+righteousness+which+is+imputed+to+us+on+account+of+Christ+and+his+merit%2C+not+on+account+of+the+worthiness+or+perfection+of+the+righteousness+imparted+%5Bcommunicatae%5D+to+us+in+Christ.+5.+Although+the+one+who+is+justified+receives+righteousness+and+through+Christ+also+has+inherent+%5Brighteousness%5D%2C+as+the+apostle+says+%5B1+Cor.+6%3A11%5D%3A+%E2%80%98you+are+washed%2C+you+are+sanctified%2C+you+are+justified%2C+etc.%E2%80%99+%28which+is+why+the+holy+fathers+made+use+of+%5Bthe+term%5D+%E2%80%98to+be+justified%E2%80%99+even+to+mean+%E2%80%98to+receive+inherent+righteousness%E2%80%99%29%2C+nevertheless%2C+the+faithful+soul+depends+not+on+this%2C+but+only+on+the+righteousness+of+Christ+given+to+us+as+a+gift%2C+without+which+there+is+and+can+be+no+righteousness+at+all.+And+so+by+faith+in+Christ+we+are+justified+or+reckoned+to+be+righteous%2C+that+is+we+are+accepted+through+his+merits+and+not+on+account+of+our+own+worthiness+or+works.+And+on+account+of+the+righteousness+inherent+in+us+we+are+said+to+be+righteous%2C+because+the+works+which+we+perform+are+righteous%2C+according+to+the+saying+of+John+%5B1+John+3%3A7%5D%3A+%E2%80%98whoever+who+does+what+is+right+is+righteous%E2%80%99.+%E2%80%A6+10.+Now+those+who+say+that+we+are+justified+by+faith+alone+should+at+the+same+time+teach+the+doctrine+of+repentance%2C+of+the+fear+of+God%2C+of+the+judgement+of+God+and+of+good+works%2C+so+that+all+the+chief+points+of+the+preaching+may+remain+firm%2C+as+Christ+said%3A+%E2%80%98preaching+repentance+and+the+remission+of+sins+in+my+name%E2%80%99+%5BLuke+24%3A47%5D.+And+that+is+to+prevent+this+way+of+speaking+%5Bi.e.+sola+fide%5D+from+being+understood+other+than+has+been+previously+mentioned.%E2%80%9D%0A%0A%E2%80%94+Colloquy+of+Regensburg%2C+Regensburg+Agreement%2C+Article+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e250a42f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e250a42f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=3.%20Likewise%2C%20it%20is%20quite%20clear,other%20than%20has%20been%20previously%20mentioned&amp;text=3.%20Likewise%2C%20it%20is%20quite%20clear%20that%20adults&amp;text=being%20understood%20other%20than%20has%20been%20previously%20mentioned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Although the Covenanters opposed “detestable neutrality” in the cause of God and truth, they were not legalistic in their precision. For instance, although they believed in the regulative principle of worship, to the point that they would have died rather than partake in human inventions, they did not quarrel about matters of a circumstantial nature. Indeed, we should keep in mind that, far from being reactionary obscurantists, they accepted a new confession of faith, a new directory for worship, and a new psalter (the products of an assembly of divines held in England; although this did not involve radical doctrinal change). Their maturity contrasts favourably with the fanaticism of some nowadays who will go to war over matters such as psalm-versions or even the tunes which psalms are sung to (such people evidently do not understand the distinction between an element and a circumstance, which is key to understanding the regulative principle). Samuel Rutherford has very strong words to say against those who engage in such legalism:

These are the right precisians who contend for substance, for God, for heaven, for the purity of the gospel. And certainly God is not a thing indifferent, and excellent Jesus Christ is no circumstance; but those who are damnable precisians who contend for feathers and things indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached to the honourable House of Commons at their late solemn fast, Wednesday, January 31, 1643/44 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish commissioners to the Westminster Assembly of divines</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-77aab1002f" data-kw="">
<blockquote><p>Reflection is also needful to preserve the sabbath disposition and blessing. First, this consists in reflecting upon how the day was spent publicly and privately, and upon the sins which one has committed; that is, laxity, listlessness, lack of spirituality, and the failure to abhor these. Confess this with sorrow before the Lord, and seek forgiveness through Christ.

Secondly, it consists in reflecting upon the good we have performed on this day, upon the upright objective to hallow the sabbath, and the efforts to do everything in such a manner as is pleasing to God. It furthermore consists in reflecting upon the blessings, refreshments, comforts, illumination, and quickening we enjoyed from the Spirit of the Lord. One must acknowledge this and rejoice in this, even if it were ever so little. Even if the insatiable desire of our soul has not been satisfied, we should yet thank the Lord for the good we received.

Thirdly, it consists in the acknowledgement of God‘s goodness to His church in giving her the sabbath, enabling her to gather publicly and conduct all her public worship services, and for the privilege to enjoy a holy rest.

Fourthly, it consists in yearning and longing for the rest which remains for the people of God (Heb 4:9), in rejoicing in this hope, in forgetting those things which are behind, and reaching forth unto those things which are before, pressing toward the mark for the prize of the high calling of God in Christ Jesus. Blessed is he who thus begins, observes, and ends the sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 146-47.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>6. Not everything in what is called a worship service must be worship.¹ The material presence of things or actions do not therein make them formally worship (2 Chron. 6:13; 20:21-23; Neh. 8:4; Acts 20:7-11). While generally speaking a church ought to keep within ‘Principles for the Use of Indifferent Things in Worship’, as that is what is found in the Word, yet, again, there is no necessary rule that all worship must be continuous. ¹ See historic reformed writers affirm: ‘Not Everything in what is called a Worship Service must be Worship’. The Reformed in the Post-Reformation sometimes held a monetary offering to be indifferent and able to be prudently done in the worship service,¹ even in the Church of Scotland.² The Westminster Assembly on a fast day filled with worship took a collection for maimed soldiers at the end.³ Westminster, allowing for the view and practice expressed, said in her Directory for the Public Worship of God, ‘Celebration of the Communion’: “The collection for the poor is so to be ordered, that no part of the public worship be thereby hindered.” The same might be said for children’s church. ¹ At the Reformation the collection of money (and possibly other things) was frequently moved from being with the offering of the Mass to after the Lord’s Supper, and was designated for the poor. On the continent it was often done as a part of the service, either at the dismissal, or just before: Hughes O. Old, The Patristic Roots of Reformed Worship (Zurich: Theologischer Verlag Zurich, 1975), pp. 28, 46, 49, 53-54, 63, 184, 310. In the Anglican Church it was done at the Lord’s Supper; see the reform made by Cranmer, illustrating his thought, in Horton Davies, Worship &amp; Theology in England: from Cranmer to Hooker, 1534-1603 (Princeton University Press, 1973), p. 188. Even a paradigmatic separatist congregation in Amsterdam, pastored by an English puritan turned separatist, had a similar practice: Ibid, p. 339. The partially conforming puritan, Nicholas Bownd, though against a collection in the service due to disturbances, yet testifies of the practice in his context: Bownd, Sabbathum Veteris et Novi Testamenti: or The True Doctrine of the Sabbath, ed. Chris Coldwell (Naphtali Press &amp; Reformation Heritage Books, 2015), pp. 353-55. The presbyterian and independent ministers’ request to the Anglican Church at the Savoy Conference (1661) shows what was happening and is consistent with pragmatic reasons: that the “Collection for the poor may be better made at or a little before the departing of the communicants.” The Grand Debate between the most reverend Bishops &amp; the Presbyterian Divines appointed by His Sacred Majesty as Commissioners for the Review &amp; Alteration of the Book of Common Prayer... (London, 1661), ‘Exceptions’, p. 15 ² William McMillan documents the collection often being taken when coming to sit at the Lord’s Table, or while there: The Worship of the Scottish Reformed Church, 1550-1638... (London: Clarke, 1931) ch. 18, pp. 220-21; Frederick W. McNally, The Westminster Directory, its Origin &amp; Significance, PhD diss. (University of Edinburgh, 1958), pp. 325-27 ³ John Lightfoot, Journal of the Proceedings of the Assembly of Divines, John R. Pitman (London: 1824) in The Whole Works of John Lightfoot, vol. 13, Oct. 17, 1643, p. 19 Thomas Cartwright (d. 1603) was a father of presbyterianism and puritanism in the late-1500’s and a partial-conformist to the Anglican Church government and worship. Over things he did not agree with therein, the chief political advisor to Queen Elizabeth was appealed to by Edward Dering (d. 1576), another presbyterian partial-conformist, to exhort Cartwright “to use Christian liberty and to bear with the time[s].”¹ That is, if something is not impious or of itself immoral (such as children’s church is not), with sufficient justification it may be done as part of one’s liberty in Christian life, though it be in a worship service and may be considered as worship by others. See this puritan principle of partial conformity soundly theologically set forth and defended.² ¹ Peter Lake, Moderate Puritans &amp; the Elizabethean Church (Cambridge University Press, 1982), p. 19 ² See Fentiman’s quote under ‘Not Everything in what is called a Worship Service must be Worship’, the book by English, Partially Conforming Puritans, A Refutation of the Errors of Separatists (1644; RBO, 2025) and the page at large, ‘On Occasional &amp; Principled Partial Conformity without Sin, or Moderate Puritanism’.</p></blockquote>

er+Verlag+Zurich%2C+1975%29%2C+pp.+28%2C+46%2C+49%2C+53-54%2C+63%2C+184%2C+310.+In+the+Anglican+Church+it+was+done+at+the+Lord%E2%80%99s+Supper%3B+see+the+reform+made+by+Cranmer%2C+illustrating+his+thought%2C+in+Horton+Davies%2C+Worship+%26+Theology+in+England%3A+from+Cranmer+to+Hooker%2C+1534-1603+%28Princeton+University+Press%2C+1973%29%2C+p.+188.+Even+a+paradigmatic+separatist+congregation+in+Amsterdam%2C+pastored+by+an+English+puritan+turned+separatist%2C+had+a+similar+practice%3A+Ibid%2C+p.+339.+The+partially+conforming+puritan%2C+Nicholas+Bownd%2C+though+against+a+collection+in+the+service+due+to+disturbances%2C+yet+testifies+of+the+practice+in+his+context%3A+Bownd%2C+Sabbathum+Veteris+et+Novi+Testamenti%3A+or+The+True+Doctrine+of+the+Sabbath%2C+ed.+Chris+Coldwell+%28Naphtali+Press+%26+Reformation+Heritage+Books%2C+2015%29%2C+pp.+353-55.+The+presbyterian+and+independent+ministers%E2%80%99+request+to+the+Anglican+Church+at+the+Savoy+Conference+%281661%29+shows+what+was+happening+and+is+consistent+with+pragmatic+reasons%3A+that+the+%E2%80%9CCollection+for+the+poor+may+be+better+made+at+or+a+little+before+the+departing+of+the+communicants.%E2%80%9D+The+Grand+Debate+between+the+most+reverend+Bishops+%26+the+Presbyterian+Divines+appointed+by+His+Sacred+Majesty+as+Commissioners+for+the+Review+%26+Alteration+of+the+Book+of+Common+Prayer...+%28London%2C+1661%29%2C+%E2%80%98Exceptions%E2%80%99%2C+p.+15+%C2%B2+William+McMillan+documents+the+collection+often+being+taken+when+coming+to+sit+at+the+Lord%E2%80%99s+Table%2C+or+while+there%3A+The+Worship+of+the+Scottish+Reformed+Church%2C+1550-1638...+%28London%3A+Clarke%2C+1931%29+ch.+18%2C+pp.+220-21%3B+Frederick+W.+McNally%2C+The+Westminster+Directory%2C+its+Origin+%26+Significance%2C+PhD+diss.+%28University+of+Edinburgh%2C+1958%29%2C+pp.+325-27+%C2%B3+John+Lightfoot%2C+Journal+of+the+Proceedings+of+the+Assembly+of+Divines%2C+John+R.+Pitman+%28London%3A+1824%29+in+The+Whole+Works+of+John+Lightfoot%2C+vol.+13%2C+Oct.+17%2C+1643%2C+p.+19+Thomas+Cartwright+%28d.+1603%29+was+a+father+of+presbyterianism+and+puritanism+in+the+late-1500%E2%80%99s+and+a+partial-conformist+to+the+Anglican+Church+government+and+worship.+Over+things+he+did+not+agree+with+therein%2C+the+chief+political+advisor+to+Queen+Elizabeth+was+appealed+to+by+Edward+Dering+%28d.+1576%29%2C+another+presbyterian+partial-conformist%2C+to+exhort+Cartwright+%E2%80%9Cto+use+Christian+liberty+and+to+bear+with+the+time%5Bs%5D.%E2%80%9D%C2%B9+That+is%2C+if+something+is+not+impious+or+of+itself+immoral+%28such+as+children%E2%80%99s+church+is+not%29%2C+with+sufficient+justification+it+may+be+done+as+part+of+one%E2%80%99s+liberty+in+Christian+life%2C+though+it+be+in+a+worship+service+and+may+be+considered+as+worship+by+others.+See+this+puritan+principle+of+partial+conformity+soundly+theologically+set+forth+and+defended.%C2%B2+%C2%B9+Peter+Lake%2C+Moderate+Puritans+%26+the+Elizabethean+Church+%28Cambridge+University+Press%2C+1982%29%2C+p.+19+%C2%B2+See+Fentiman%E2%80%99s+quote+under+%E2%80%98Not+Everything+in+what+is+called+a+Worship+Service+must+be+Worship%E2%80%99%2C+the+book+by+English%2C+Partially+Conforming+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281644%3B+RBO%2C+2025%29+and+the+page+at+large%2C+%E2%80%98On+Occasional+%26+Principled+Partial+Conformity+without+Sin%2C+or+Moderate+Puritanism%E2%80%99.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%98There+is+No+Divine+Obligation+for+Infants+or+Young+Children+to+Regularly+attend+an+Adult+Worship+Service%E2%80%99%2C+%28RBO%2C+2026%29%2C+pt.+3%2C+%E2%80%98Alternatives+to+Children+attending+the+Whole+Adult+Worship+Service%E2%80%99%2C+2.+%E2%80%98Children%E2%80%99s+Church+in+Service%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F907e64c486.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/907e64c486.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes <blockquote><p>Verse 30. ‘When they had sung a hymn,’ etc. A hymn is a verse sung for the praise of God. Their opinion doth not seem to be vain who think that the apostles at that time sung a great hymn which consists of six Psalms: 113, 114, 115, 116, 117, and 118. The Hebrews certainly sing this song in the night of the Passover after the lamb is eaten. Paulus Burgensis thinks that the Apostles rehearsed this hymn, according to the custom of the Jews, after the Passover, and that this place is to be understood of that, which is very probable, for since in other things it is manifest that Christ with his apostles observed the rite of the Jews in eating the Passover, it is not unlikely that He might follow them in this also. Grotius saith, learned men think that the hymns were sung by Christ which were wont to be sung at the Passover, as the 114, and those that follow, but he seems to be of another opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, (London: 1650) | on Mt., 26:30</span></figcaption>

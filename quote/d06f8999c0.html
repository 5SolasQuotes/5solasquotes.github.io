<main class="wrap"><figure class="quote" id="q-d06f8999c0" data-kw="">
<blockquote><p>For faith, termed special mercy, naturally precedes justification in a repentant sinner, as seen in the tax collector who first pleads for mercy through faith; ‘God, be merciful to me a sinner,’ meaning, he trusts he will receive forgiveness of sins. This faith also accompanies justification; during the act of justification, he trusts that his sins are forgiven. Furthermore, it follows justification; for, justified, he descends to his house with the same confidence that his sins have been forgiven. Hence, he later infers that the special object of justifying faith is the promise of the Gospel about the future, present, and past, to each one, to me, to you, to him, believing in the Son, through faith in His blood, sins will be, are being, and have been forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses put forth at Various Times at the Academy of Sedan, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXVII. Similar views are seen in Paraeus. He states:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80e387daa6" data-kw="">

</figure><figure class="quote" id="q-52fef15a39" data-kw="">
<blockquote><p>Yet is it as clear as the light at noon-day, that whosoever shall deny faith in Christ to be a condition appointed by God to be performed on man’s part for the obtaining of justification, shall have all Jews, pagans and Mahumetans concurring therein with him, as in a point naturally flowing and necessarily following from what they hold.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Anthony Wotton, Mr. Anthony Wotton’s Defence against Mr. George Walker’s Charge... (Cambridge: Daniel, 1641), ‘The Issue’ (1641)</cite>, pp. 54-55 See also p. 36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-26c617e229" data-kw="">
<blockquote><p>VII. He calls both [kinds of people] in earnest [serio] and without any deceit. Concerning the elect there is no doubt. As to the reprobate, although they are not called ‘according to his purpose,’ or to salvation, nevertheless they are called in earnest, and salvation is offered them on condition of faith. Nor are they mocked because they have been deprived of the grace of believing. Rather, because they destroyed the original grace of their own accord, and also, by their evil passion, despised the means of grace, God therefore has the right to demand faith from them and uses it no less justly than do other creditors, so that their mouths are closed, they are without excuse, and the justice of God is upheld. Therefore, He does not call them to mock them, but in order to declare and reveal his justice. VIII. Therefore, common calling is not the basis for any conclusion regarding election, both because common calling is extended to both the reprobate and the elect, and because it is subject to the condition of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965)</cite>, ch. 20, sect. 7–8, pp. 116-17 Latin: conditione</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

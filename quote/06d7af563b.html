</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3476ba8153" data-kw="">
<blockquote><p>Though God by his grace must change the perverse disposition of men’s wills before they will make a gracious choice, yet it is most certain that the teachings, commands, exhortations and reproofs of God are directed to the will of man: And that the promises and threatnings, mercies and judgements are used to move and change the will: And that in the tenor of his laws and covenants, Christ has set life and death before men and put their happiness in their own choice; and that no man shall have better or worse than he made choice of: that is, none shall be either happy or miserable but as they did choose or refuse the causes of happiness or misery. And the reason of this is, because natural-free-will was part of the natural-image of God on Adam; and it is as natural to a man to be a free-agent as to be reasonable. And God will govern man as man agreeably to his nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 15, pp. 109-10</span></figcaption>

</figure><figure class="quote" id="q-a4c588ba16" data-kw="">
<blockquote><p>Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-hampton.html">Stephen Hampton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1. ‘Free Choice’ in ‘Sin, Grace &amp; Free Choice in Post-Reformation Reformed Theology’ in Lehner, Muller &amp; Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016), pp. 229-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

+necessity+%E2%80%98hypothetical+necessity%E2%80%99+or+the+%E2%80%98necessity+of+consequence%E2%80%99+%28Maresius+1646-48%2C+2%3A15%29%E2%80%A6+Maresius+is+seeking+to+preserve+the+fundamental+contingency+of+human+action%E2%80%A6+that+choice+is+only+necessary%2C+given+the+divine+decree%E2%80%93it+is+not+inherently+or+absolutely+necessary%E2%80%A6+for+as+Maresius+underlines%2C+%E2%80%98such+is+the+faculty+of+the+human+will+that%2C+by+its+intrinsic+constitution+and+nature%2C+it+is+equally+apt+to+choose+an+act+plainly+contrary+to+the+one+it+actually+chooses%E2%80%99+%28Maresius+1646-48%2C+2%3A15%29.%E2%80%9D%0A%0A%E2%80%94+Stephen+Hampton%2C+1.+%E2%80%98Free+Choice%E2%80%99+in+%E2%80%98Sin%2C+Grace+%26+Free+Choice+in+Post-Reformation+Reformed+Theology%E2%80%99+in+Lehner%2C+Muller+%26+Roeber%2C+The+Oxford+Handbook+of+Early+Modern+Theology%2C+1600-1800+%28Oxford%2C+2016%29%2C+pp.+229-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4c588ba16.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4c588ba16.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=insists%2C%20the%20Reformed%20believe%20that%20the,it%20actually%20chooses%E2%80%99%20%28Maresius%201646%2D48%2C%202%3A15&amp;text=insists%2C%20the%20Reformed%20believe%20that%20the%20power%20of&amp;text=the%20one%20it%20actually%20chooses%E2%80%99%20%28Maresius%201646%2D48%2C%202%3A15" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7d5bc10676" data-kw="">
<blockquote><p>…the Reformed customarily distinguish on the one side a fourfold good with which a person can be occupied in his choice, namely: (1) natural good, walking, reasoning; (2) moral good, the exercise of some sort of civil virtue; (3) ecclesiastical good, to which sort belong the duties of external divine worship; and (4) a spiritual and saving good, which accompanies salvation (Heb. 6:9)… With these things posited, they determine that… In the state of grace, through regeneration he recovers the strength lost by sin for doing spiritual and saving good, yet with some sort of a surviving inclination to evil… in the state of sin [being unconverted], to him is present some sort of strength toward natural, moral, and ecclesiastical good, but absolutely none for spiritual and saving good.</p></blockquote>

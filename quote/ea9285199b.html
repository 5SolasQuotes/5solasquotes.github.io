<blockquote><p>Put such books into people’s hands as plead best the cause of love and peace. Among others, get men to read these: Bishop Ussher’s Sermon on Eph. 4:13 at Wansted before King James [‘A Brief Declaration of the Universality of the Church of Christ’, 1624 / 1629], Bishop Hall’s [sermon, ‘The True] Peacemaker’ [1624]: Mr. Jeremiah Burroughs’s of Heart-Divisions, and Mr. Stillingfleet’s Irenicon, and all Mr. [John] Durie’s.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5cb0ccd1ba" data-kw="">
<blockquote><p>…Calvin protested [to the French king] “in truth before God” that Geneva has “never attempted to send persons into your kingdom.” Explaining matters further, the letter declared: “that never with our knowledge and permission has someone gone from here to preach except one individual who was requested from us for the city of London… So then, the Genevan ministers say they encouraged some people to exercise their gifts everywhere. There is, however, the clear implication that was all they did. The explanation would appear to wish to persuade the king that what he has heard of as Geneva sending ministers into his kingdom is actually a simple case of free preachers and godly men wandering of their own free will into the king’s territory… The answers to both concerns are, according to Calvin and Beza’s own Augustinian understanding of lying, plainly speech contra mentem. They did send preachers into France and they were involved in dissensions of precisely the kind about which the king was asking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 98</span></figcaption>

<blockquote><p>There be two happy things (worthy Reader), as one says, ‘The one is not to err, the other is to escape from the power of error.’ (Cassian, De incarnatione, bk. 1, ch. 4) Time’s womb brings forth many truths, though truth be not a debtor to time, because time puts new robes on old Truth; but truth is God’s debtor and owes her being to Him only. It is a great evil under the sun and the sickness of man’s vanity that the name of holy men should be a web to make garments of for new opinions, but the errors of holy men have no whiteness, nor holiness from men. And it is a wrong that men’s praise should be truth’s prejudice, and men’s gain, truth’s loss. Yet I shall heartily desire that men herein observe the art of deep providence, for the Creator commands darkness to bring forth her birth of light, and God does so over-awe, with a wise super-dominion, men’s errors, that contrary to nature’s way, from collision of opinions, results truth; and disputes, as stricken flint, cast fire for light, God raising out of the dust and ashes of errors a new living truth. What mistakes, errors, or heresies have been anent Church government, that vigilant and never slumbering wisdom of providence has thence made to appear the sound doctrine of God’s Kingdom. So here Satan shapes and God sews and makes the garment. Error is but dregs, by the artifice of all compassing Providence, from whence are distilled strong and cordial waters. And what Antichrist has conceived for a hierarchy and human ceremonies, has put Christ in his two witnesses in Britain to advocate for the truth and native simplicity of his own Kingdom. But I heartily desire not to appear as an adversary to the holy, reverend and learned [congregationalist] Brethren who are sufferers for the truth, for there be wide marches betwixt striving and disputing. Why should we strive? for we be brethren, the sons of one father, the born citizens of one mother Jerusalem. To dispute is not to contend. We strive as we are carnal, we dispute as we are men, we war from our lusts, we dispute from diversity of starlight and daylight. Weakness is not wickedness, a roving of wit must not be deemed a rebellion of will, a broken engine may part with a dead child and yet be a mother of many healthy children. And while our reverend and dear Brethren, fleeing the coast of Egypt and Babylon’s wicked borders, aim to shore upon truth, wind may deceive good sailors; natural land-motions (as when heavy bodies move downward toward their own (clay country) are upon a straight line. But sea-motions of sailing are not by right lines, but rather by sea-circles. We often argue and dispute as we sail. Where grace and weight of Scripture make motion, we walk in a right line toward God. But where opinion, a messenger only sent to spy the Land of lies and truth, usurps to conduct us, what marvel then we go about truth rather than lodge with truth. And Christ his Kingdom, scepter, glory, Babylon’s fall, be the material object of opinions, on both sides; and yet the Word of God has a right lith [joint], that cannot suffer division. In God’s matters there be not as in grammar the positive and comparative degrees: there are not here truth, and more true, and most true. Truth is in an indivisible line, which has no latitude and cannot admit of splitting. And therefore we may make use of the Philosopher’s word, amicus Socrates, amicus Plato, sed magis amica veritas [Socrates a friend, Plato a friend, but most of all, truth is a friend]. Though Peter and Paul be our beloved friends, yet the truth is a dearer friend: The sons of Babylon make outcries of divisions and diversity of religions amongst us, but every opinion is not a new religion. … But I leave off, and beg from the Reader candor and ingenuous and fair dealing; from Formalists, men in the way to Babylon, I may wish this, I cannot hope it. Farewell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644) | ‘To the Reader’</span></figcaption>

+the+truth+is+a+dearer+friend%3A+The+sons+of+Babylon+make+outcries+of+divisions+and+diversity+of+religions+amongst+us%2C+but+every+opinion+is+not+a+new+religion.+%E2%80%A6+But+I+leave+off%2C+and+beg+from+the+Reader+candor+and+ingenuous+and+fair+dealing%3B+from+Formalists%2C+men+in+the+way+to+Babylon%2C+I+may+wish+this%2C+I+cannot+hope+it.+Farewell.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries...+%28London%2C+1644%29+%7C+%E2%80%98To+the+Reader%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F51018e08f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51018e08f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-truth/#:~:text=There%20be%20two%20happy%20things%20%28worthy,this%2C%20I%20cannot%20hope%20it.%20Farewell&amp;text=There%20be%20two%20happy%20things%20%28worthy%20Reader%29%2C%20as&amp;text=may%20wish%20this%2C%20I%20cannot%20hope%20it.%20Farewell" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

<blockquote><p>§1. Question 1: Must I always do as I would be done by? Or has this rule any exceptions? Answer: The rule intends no more but that your just self-denial and love to others be duly exercised in your dealings with all. And:

1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them.

2. It supposes that the matter be to be varied according to your various conditions. A parent that justly desires his child to obey him, is not bound therefore to obey his child; nor the prince to obey his subjects; nor the master to do all the work for his servants, which he would have his servants do for him. But you must deal by another as you would (regularly) have them deal by you, if you were in their case, and they in yours. And on these terms it is a rule of righteousness.</p></blockquote>

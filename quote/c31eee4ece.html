<main class="wrap"><figure class="quote" id="q-c31eee4ece" data-kw="">
<blockquote><p>…to say [as the opponent does], that the Word teaches the Church to abstain from blood (Acts 15), is a part of the perfection of the Scripture, and yet the Scripture teaches that abstinence from blood, not as an eternal and unalterable Law, for we are not now tied to abstain from blood, therefore the Scripture may make the man of God perfect in some works that are alterable and changeable: This (I say) is no answer, for saying that God should now make abstinence from blood and things strangled indifferent (Acts 15), as He made them in that interval of time when the [Levitical] ceremonies were mortal [alive] but not deadly and unlawful, as is clear in that Paul circumcised Timothy (Acts 16:1-3), that rite being then indifferent; and yet he writes in another case when the Gospel is now fully promulgated, that to be circumcised makes a man a debtor in conscience to keep the whole Law of Moses, and so to abstain from eating of blood and things strangled must be a falling from the grace of Christ and an apostasy from the Gospel (Gal. 5:1-7). The like I say of observing of days (Rom. 14:5-6) which were indifferent and [yet] in another case (Gal. 4:9-10; Col. 2:16-17) [were] deadly, unlawful and not necessary. So the matter (Acts 15), which in the case of scandalizing the weak, is abstinence from things indifferent, say ‘that they are indifferent’ binds as a perpetual law to the end of the world, and binds us this same very day (Rom. 14:20) in the morality of it, as abstinence from murdering one for whom Christ died, (Rom. 14:15; 1 Cor. 8:12-13; 1 Cor. 10:26-28). And upon the ground laid by prelates, which is most false and untrue, to wit, that many positive things in Church government, such as are [by] prelates deemed to be warranted by apostolic, though not by Divine, right: ceremonies and crossing, kneeling to bread, altars, surplice, rochet, corner-cap, yea, and circumcision, a passover lamb, and all the Jewish ceremonies, though with another spirit and intention than to shadow forth Christ to come in the flesh, [are] imagined to be indifferent and alterable things, we hold that all these are to be abstained from as eating of blood and things strangled of old were. If you say they are as indifferent as blood and some meats were in the case (Acts 15; Rom. 14; 1 Cor. 8; 1 Cor. 10), its a most false principle as we shall hear, and therefore the Scripture, if it make the man of God perfect to every good work, as the apostle says, it must teach us to abstain from all these as scandalous [things], and must set down as perfect and particular directions for Church-Government as Paul does (Rom. 14) set down a particular platform, how we shall eschew murder for scandalizing our brethren in the use of things indifferent, is spiritual murder (Rom. 14:15,20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (1646), Introduction</cite>, p. 8-9</span></figcaption>

<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>

<blockquote><p>Yet we must remember, that this restriction [against eating blood] was part of the old law. Wherefore, what Tertullian relates, that in his time it was unlawful among Christians to taste the blood of cattle, savours of superstition. For the apostles, in commanding the Gentiles to observe this rite, for a short time, did not intend to inject a scruple into their consciences, but only to prevent the liberty which was otherwise sacred, from proving an occasion of offense to the ignorant and the weak.</p></blockquote>

<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse, wherein is Proved that Prelatical Jurisdiction is Not of Divine Institution, but forbidden by Christ Himself (1640), ch. 7. Prynne was a prominent Erastian.</cite></span></figcaption>

<blockquote><p>§18. Of a child’s carriage in case a parent provide an unfit mate or none at all. … 2nd Question, “What if the parent be negligent, and in due time provide no fit match? May not the child provide one for himself? Answer: A parent’s negligence is not a sufficient pretext to make a child [wholly] cast off that subiection which he owes to his parent. Yet I deny not but that a child knowing where a fit match is to be had, may make known as much to his parent (as Sampson did) and crave both his consent and help thereunto, Judg. 14:2. And if his parent give no ear to his humble suit, he may use the mediation of his kindred or other friends. Yea if necessity require that the child be married, and his parent add wilfulness to negligence, and will not be moved at all, neither by the humble suit of his child, nor by the earnest solicitation of any friends, means may be made to the Magistrate (who is in God’s place over the parent as well as over the child, and ought to afford relief unto the child) and what the Magistrate does in that case is as good a warrant to the child as if the parent had done it. The like means may be used if a parent be an idolater, heretic, or atheist, and will not yield that his child be married to any but to one of his own profession and disposition.</p></blockquote>

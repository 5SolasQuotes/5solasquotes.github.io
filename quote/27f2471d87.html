<blockquote><p>Theology is not only intelligible and meaningful, but also discursive. For it employs many arguments for the convincing of opponents, and from its principles, prior, and indemonstrable in themselves, it either draws out conclusions for proving the truth, or solutions for refuting the fallacious objections of sophists. Mt. 22:32-33; 1 Cor. 15:20-22.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-23cb3ef646" data-kw="">
<blockquote><p>A guiding presupposition [of Matthew Barrett’s The Reformation as Renewal] is that the intellectual life of the second half of the thirteenth century was ‘characterized by a Thomistic atmosphere’ and that the later medieval theologians progressively fell away from the classical positions affirmed by Aquinas. Indeed, according to Barrett it was this degeneration away from Thomism in the later middle ages that was a significant catalyst for the Reformation. As soon as this presupposition is outlined, however, it is possible to see that Barrett’s account has, at the very best, an outdated view of later medieval thought. This kind of ‘decline’ narrative has not been maintained by experts in the thought of the period for many years, despite its persistence among historians whose direct acquaintance with scholastic texts ends with the death of Aquinas. The reason is that, outside the Dominican order (and, for that matter, inside it too at least until the middle of the fifteenth century), there never was a ‘Thomistic atmosphere.’ Why it was ever believed that there was one is not clear to me. But it is true to say that we do not pervasively find the kind of narrative Barrett reproduces until after Leo XIII’s Aeterni patris of 1879, and it is hard to avoid the conclusion that this encyclical itself had something to do with bringing about the anachronistic centering of Aquinas in our medieval intellectual history. This was no doubt an unintended consequence of Leo’s action, since it is clear enough that Leo’s motivation had to do with an appraisal of Aquinas’s intellectual weight, not of his influence on later medieval theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Accidental Reformation?’ in Hanover Review</cite>, 3.1 (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-33dc49d682" data-kw="">
<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>

<blockquote><p>This paper highlights a set of objections on natural theology addressed by Descartes and Voetius to each other. It shows and expands the common ground Descartes and Voetius held within natural theology. It argues that their contrasting views revolved mainly around the limits of natural theology. For Voetius, natural theology is extrinsically limited by the revealed God, the external principle of faith. For Descartes, metaphysics or natural theology is intrinsically limited by the incomprehensible idea of the Infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vadana-mihai-dragos.html">Vadana Mihai-Dragos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Voetius on the Innate Knowledge of God &amp; the Limits of Natural Theology’ in Annals of the University of Bucharest, Philosophy Series</cite>, vol. LXV, no. 2 (2016), pp. 37-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>13. Reason is employed on both sides, as an instrument, not a judge or norm. So that neither are they to be listened to who defer to it more than is fair in theological matters, and demand the things of faith from its scales, who are the Socinians; nor those who pointlessly begrudge its use in theological argumentation and forming consequences, which the Verronian Papists do, and some Lutherans.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6fa97c7f89" data-kw="">
<blockquote><p>This is the grand quarrel, the Socinians deny Christ to be God, that so they may deny that the blood of Christ did fully satisfy for our sins: these errors strike directly at the Covenant of Grace, which is the foundation of all our comfort, and if once we undermine the foundation, and reject the principles of Christianity, it is then an easy matter to be an Atheist: for if the Protestant religion be deserted, there is nothing in any other religion to keep a man back from being an Atheist; for Popery, to speak strictly, is Antichristianism, and I have said enough of Socinianism; Judaism, and Turkism, are too near of kin to Socinianism: let any man that doubts of this truth, read Doctor Calovius his Decas Dissertationum, Vedelius de Deo Synagogae, and he may receive satisfaction without reading others. And for the Arminian Atheism, I refer you to Vedelius his book, de Arcanis Arminian.

Anabaptists are justly complained of, but from whence did they suck their poison (I mean the Anabaptists of the last edition, (the men so much complained of) but from the Arminians, Socinians and Papists? from the Arminians they received their doctrine about the Fall and Free-will of man; are they not pure Armininians in that great point of Predestination? they oppose the Reformed Churches in their doctrine about original sin, the Socinians have taught them to deny that Infants are conceived and born in sin, and this is the true reason why they deny Baptism to infants, though I know they urge many other reasons to colour the business: no man need to wonder that Baptism of Infants is neglected by all those who deny original sin, Pelagius of old, about the year 420 said that it was a vain thing to imagine, that the sins of infants were washed away by Baptism, because they have no sin at all, and therefore Heaven was set open to them.

The Anabaptists in the conference at Franckendale, maintained that Infants were born without original sin, nay without the least spot of sin, and therefore there was no need of their being washed in the Laver of Regeneration. The Socinians tell us that Original sin is a mere fable, a fancy. They that can go no farther then English, may read a book of Free-will, Predestination, the first transgression; subscribed in the Epistle or Preface after this manner, Your brethren the Anabaptists falsely so called.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, growth, and danger of Socinianism together with a plain discovery of a desperate design of corrupting the Protestant religion, whereby it appears that the religion which hath been so violently contended for (by the Archbishop of Canterbury and his adherents) is not the true pure Protestant</cite>, (London: Samuel Gellibrand, 1643), pp 50-51.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79ef1e72af" data-kw="">
<blockquote><p>Paul in the 6. chap to the Rom. saith: That therefore we must not abide in sin, because we are now dead unto it. And that thing he proveth by Baptism. For whatsoever we be (saith he) that are baptised in Christ Jesus, we are baptised in his death, to this end that we should die unto sin: and that our old man should be crucified, and the body of sin abolished. And for as much as children are baptised, even thereby we have a testimony that there is sin in them. For otherwise the nature of Baptism, as it is there described of Paul, should not consist. The same reason hath he also in his epistle to the Colossians, where he saith, that we are Circumcised with circumcision not made with hands, in making clean the sinful body of the flesh, being buried together with Christ in Baptism.

He compareth Baptism with Circumcision: &amp; saith, that they which are baptised, are made clean from the body of sin. Neither is it to be doubted, but that they which are baptised, are baptised into the remission of sins. And assuredly the circumcision, which in the old law was given unto Children, was correspondent unto our Baptism. And as touching circumcision, it is written, The soul whose flesh of the foreskin is not circumcised the eighth day, let it die the death. Wherefore seeing children have need of the sacrament of regeneration, it followeth of necessity, that they are borne subject unto sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romans wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Epi</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 119.</span></figcaption>

<blockquote><p>Every faithful Christian who has been baptized may have this benefit from baptism as long as he lives: that as by his engrafting into Christ he is one with Him and therefore sees that while Christ lives he must and will live also, so thus having perpetual union and fellowship with Christ, the believer draws strength from the vine, so that he may live the Christian life.

If Christ then has the power of renewing him – which is signified and sealed by baptism (namely, the power of Christ’s death mortifying sin and the virtue of His resurrection in raising him up to a new life) – is not baptism throughout his life, as often as he seriously considers it, a powerful means to help him forward in a Christian life?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-rogers.html">Richard Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holy Helps for a Godly Life</cite>, ed. Brian G. Hedges (1603; Grand Rapids, MI: Reformation Heritage Books, 2018), p. 17.</span></figcaption>

</figure><figure class="quote" id="q-b066cda5ea" data-kw="">
<blockquote><p>But since before baptism was instituted God’s people had circumcision instead, let us examine how these two signs differ from each other, and in what respects they are alike. From this will appear the anagogic relationship of the one to the other. When the Lord commands Abraham to observe circumcision, he previously states that he will be God to him and his descendants [Gen. 17:7, 10], adding that he possesses the abundance and sufficiency of all things [Gen. 17:1, 6, 8]. This he does in order that Abraham may regard His hand as the source of every good. The promise of eternal life is contained in these words as Christ interprets them, drawing an argument from them for the immortality and resurrection of believers. For Christ says, “He is not the God of the dead but of the living” [Luke 20:38; Matt. 22:32]. Paul also, therefore, when he shows to the Ephesians out of what destruction the Lord has delivered them, from the fact that they had not been admitted into the covenant of circumcision infers that they were without Christ, without God, without hope, strangers to the testaments of promise [Eph. 2:12]—all of which the covenant itself contained. But the first access to God, the first entry into immortal life, is the forgiveness of sins. Accordingly, this corresponds to the promise of baptism that we shall be cleansed. Afterward, the Lord covenants with Abraham that he should walk before him in uprightness and innocence of heart [Gen. 17:1]. This applies to mortification, or regeneration.1 And lest anyone be in doubt, Moses more clearly explains elsewhere, when exhorting the Israelite people to circumcise the foreskin of their heart for the Lord [Deut. 10:16], that circumcision is the sign of mortification; on this account Israel has been chosen as the people of God out of all the nations of the earth [Deut. 10:15]. As God, when he adopts the posterity of Abraham as his people, commands them to be circumcised, so Moses declares that they ought to be circumcised in heart, explaining the true meaning of this carnal circumcision [Deut. 30:6]. Again, that no man should strive after it by his own strength, Moses teaches that it is a work of God’s grace. All these things are so often reiterated by the prophets that there is no need to heap up here the many texts, as they occur repeatedly [Jer. 4:4; Ezek. 16:30]. We have, therefore, a spiritual promise given to the patriarchs in circumcision such as is given us in baptism, since it represented for them forgiveness of sins and mortification of flesh. Moreover, as we have taught that Christ is the foundation of baptism, in whom both of these reside, so it is also evident that he is the foundation of circumcision. For he is promised to Abraham, and in him the blessing of all nations [Gen. 12:2–3]. To seal this grace, the sign of circumcision is added.</p></blockquote>

 Moses declares that they ought to be circumcised in heart, explaining the true meaning of this carnal circumcision [Deut. 30:6]. Again, that no man should strive after it by his own strength, Moses teaches that it is a work of God’s grace. All these things are so often reiterated by the prophets that there is no need to heap up here the many texts, as they occur repeatedly [Jer. 4:4; Ezek. 16:30]. We have, therefore, a spiritual promise given to the patriarchs in circumcision such as is given us in baptism, since it represented for them forgiveness of sins and mortification of flesh. Moreover, as we have taught that Christ is the foundation of baptism, in whom both of these reside, so it is also evident that he is the foundation of circumcision. For he is promised to Abraham, and in him the blessing of all nations [Gen. 12:2–3]. To seal this grace, the sign of circumcision is added.”

— John Calvin, Institutes of the Christian Religion, (Battles edition), 4.16.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+since+before+baptism+was+instituted+God%E2%80%99s+people+had+circumcision+instead%2C+let+us+examine+how+these+two+signs+differ+from+each+other%2C+and+in+what+respects+they+are+alike.+From+this+will+appear+the+anagogic+relationship+of+the+one+to+the+other.+When+the+Lord+commands+Abraham+to+observe+circumcision%2C+he+previously+states+that+he+will+be+God+to+him+and+his+descendants+%5BGen.+17%3A7%2C+10%5D%2C+adding+that+he+possesses+the+abundance+and+sufficiency+of+all+things+%5BGen.+17%3A1%2C+6%2C+8%5D.+This+he+does+in+order+that+Abraham+may+regard+His+hand+as+the+source+of+every+good.+The+promise+of+eternal+life+is+contained+in+these+words+as+Christ+interprets+them%2C+drawing+an+argument+from+them+for+the+immortality+and+resurrection+of+believers.+For+Christ+says%2C+%E2%80%9CHe+is+not+the+God+of+the+dead+but+of+the+living%E2%80%9D+%5BLuke+20%3A38%3B+Matt.+22%3A32%5D.+Paul+also%2C+therefore%2C+when+he+shows+to+the+Ephesians+out+of+what+destruction+the+Lord+has+delivered+them%2C+from+the+fact+that+they+had+not+been+admitted+into+the+covenant+of+circumcision+infers+that+they+were+without+Christ%2C+without+God%2C+without+hope%2C+strangers+to+the+testaments+of+promise+%5BEph.+2%3A12%5D%E2%80%94all+of+which+the+covenant+itself+contained.+But+the+first+access+to+God%2C+the+first+entry+into+immortal+life%2C+is+the+forgiveness+of+sins.+Accordingly%2C+this+corresponds+to+the+promise+of+baptism+that+we+shall+be+cleansed.+Afterward%2C+the+Lord+covenants+with+Abraham+that+he+should+walk+before+him+in+uprightness+and+innocence+of+heart+%5BGen.+17%3A1%5D.+This+applies+to+mortification%2C+or+regeneration.1+And+lest+anyone+be+in+doubt%2C+Moses+more+clearly+explains+elsewhere%2C+when+exhorting+the+Israelite+people+to+circumcise+the+foreskin+of+their+heart+for+the+Lord+%5BDeut.+10%3A16%5D%2C+that+circumcision+is+the+sign+of+mortification%3B+on+this+account+Israel+has+been+chosen+as+the+people+of+God+out+of+all+the+nations+of+the+earth+%5BDeut.+10%3A15%5D.+As+God%2C+when+he+adopts+the+posterity+of+Abraham+as+his+people%2C+commands+them+to+be+circumcised%2C+so+Moses+declares+that+they+ought+to+be+circumcised+in+heart%2C+explaining+the+true+meaning+of+this+carnal+circumcision+%5BDeut.+30%3A6%5D.+Again%2C+that+no+man+should+strive+after+it+by+his+own+strength%2C+Moses+teaches+that+it+is+a+work+of+God%E2%80%99s+grace.+All+these+things+are+so+often+reiterated+by+the+prophets+that+there+is+no+need+to+heap+up+here+the+many+texts%2C+as+they+occur+repeatedly+%5BJer.+4%3A4%3B+Ezek.+16%3A30%5D.+We+have%2C+therefore%2C+a+spiritual+promise+given+to+the+patriarchs+in+circumcision+such+as+is+given+us+in+baptism%2C+since+it+represented+for+them+forgiveness+of+sins+and+mortification+of+flesh.+Moreover%2C+as+we+have+taught+that+Christ+is+the+foundation+of+baptism%2C+in+whom+both+of+these+reside%2C+so+it+is+also+evident+that+he+is+the+foundation+of+circumcision.+For+he+is+promised+to+Abraham%2C+and+in+him+the+blessing+of+all+nations+%5BGen.+12%3A2%E2%80%933%5D.+To+seal+this+grace%2C+the+sign+of+circumcision+is+added.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+%28Battles+edition%29%2C+4.16.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb066cda5ea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b066cda5ea.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/01/calvin-circumcision-was-spiritual-and-substantially-identical-to-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Also strangers of approved piety, may be capable of Church rebukes, which are Church censures… …now Paul and the faithful at Corinth are not estranged from those of approved piety of other congregations: he took care to edify and rebuke them, and so are all the saints to edify, censure and rebuke one another…. The banished servants of God, who suffer for the Truth, or transient members, who because their calling is ordinarily trafficking, and so not consistent with a membership in a settled congregation, are they (I say) without [1 Cor. 5:13], not to be edified by the censures of the Church, but left to the immediate judgement of God? This is contrary to God’s Word, and an insolent interpretation…</p></blockquote>

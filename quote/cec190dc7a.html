<blockquote><p>Since, then, in the Articles of the Faith, which contain a summary of the gospel, Christ the King Himself offers to us that kingdom of His; and since He effectually confederates us to Himself through faith by the power of His Spirit so that He might rule in us, let us briefly explain what faith is. Once we know the will of God, faith is to assent to Him in the whole of His Word as one who is true and omnipotent. It is thus to give Him glory and not to give consideration to anything in ourselves or other creatures that appears contrary to His Word. The primary goal of faith is to look in this Word at the promise of the gospel, the promise that the Father truly presents Himself to us in Christ and through the Holy Spirit graciously justifies those engrafted into Christ, sanctifies us more and more, and preserves us by that same power by which Christ was raised from the dead and had all things subjected to Him. This is so that the hope of eternal life that is grounded in this truth and power might be most certain (p. 16 This article concerning Christ’s person — which consists of two natures, human and divine, joined together in an eternal personal union while the properties of each nature are preserved forever — contains the foundation and basis of the royal priesthood of Christ, and consequently of the eternal covenant between God and humanity. Human happiness is to be united with God, the source of all good (1 John 1[:3]). By contrast, the greatest unhappiness is to be separated from God. Humanity, however, had separated itself from God through sin and had entered into a covenant with the devil. In the same way, therefore, that there was a certain person through whom sin entered the world, and death through sin, and who thus became the cause and, as it were, foundation of the defection from God and of the covenant with the devil, so also there ought to be a certain person designated by God as the foundation and cause of an indestructible union with God, the source of all happiness (p. 67). Moreover, the human Christ could not be a Savior by His power unless the divine nature were joined to Him in the unity of His person, from which, as from the Father at the same time, the Holy Spirit proceeds, who leads us into possession of Christ, engrafts us into Christ, and regenerates us unto eternal life (1 Cor. 15:21, 45; Rom. 8:8–9). Indeed, so that those who have once truly been engrafted into Christ by the Holy Spirit can never again be cut off from eternal life, the λογον Himself — the eternal Son of God, consubstantial with the Father, namely, the very fountain of life, in which there was life from the beginning (John 1[:4]) — must dwell σωματκως, that is, personally, in His assumed human nature for all eternity (p.72). Our entering into covenant and reconciliation with God required that both of these natures in the Mediator be true and intact, with their properties preserved. In the same way, since the covenant and union must last for all eternity, so that even after the resurrection our true flesh and bones might enjoy happiness (Phil. 3[:21]), it is also necessary in the foundation, namely, in the Mediator, upon whom the task of saving us forever was placed, that tremaintact forever — body and soul, flesh and bones. (p. 73) Vivification, therefore, is the second fruit of the resurrection of Christ because Christ Himself, who is always living, is our life through faith, and because, by the power that we draw from Christ our Head, we arise in this life to newness of life through the Spirit of faith. This is so that by living pure and holy lives, we might wholly consecrate ourselves to the will of God. That is what the apostle teaches in Colossians 3[:1–2]: “If then you were raised with Christ, seek those things which are above, where Christ is, sitting at the right hand of God. Set your mind on things above, not on things on the earth.” That is also why he says in Romans 6[:4–5] that we were engrafted into the likeness of Christ’s death so that, as participants in His resurrection, we might walk in newness of life. With these words he is not only offering the resurrection of Christ as an example for us to imitate; he is also, and especially, teaching that this is brought about in us by the power of Christ’s resurrection so that we are able to rise again to a new life (p. 97) Third, the ascension is the progression and continuation of His righteousness. This is primarily because He could not ascend into heaven, into that great glory, in His own body accursed in our sins, unless He had been fully justified for our sins and faith (Heb. 1:7) (p. 104). The second fruit is that by His ascension Christ makes us to sit with Him in heavenly places (Eph. 2[:6]), so that we do not simply anticipate heaven in mere hope but already possess it in Christ our Head and Brother. This is because after full expiation for our sins had been made, the Pledge, in the earthly and bodily form that He received from us, now possesses heaven on our behalf. It is also because we possess a spiritual and heavenly pledge received, in turn, from Him, namely, the Spirit of Christ dwelling in us. So we are engrafted into Him by the power of the Holy Spirit through faith in the promise of the gospel (p. 105). His operations are many and diverse. First, He is given so that He might bear witness in our hearts to the love of the Father (Gal. 4[:6]) and illumine the eyes of our minds with the knowledge of Christ. Thus, He engrafts me into Christ through faith, as a branch into the vine, and makes me a partaker of Christ and all His benefits (John 15[:1ff.]). The union with Christ and His benefits that the Holy Spirit brings about in us is powerfully expressed in Scripture when it says that the Holy Spirit sprinkles us with the blood of Christ (1 Peter 1[:2]), makes us “members of Christ” (1 Cor. 6[:15]), feeds us with Christ (John 6[:50–58]), gives us Christ to drink (1 Cor. 10[:4, 16]; 12),1 and builds us on Christ (Eph. 2[:20]). Here the office and purpose of the Holy Spirit given to us is shown, namely, that through faith the Spirit might unite us to Christ as closely as possible and might achieve similar results in both members and Head, seeing as it is the same Spirit, the same life and glory (Rom. 8[:1–26]) (p. 124). The communion of saints signifies first that outward fellowship by which members of the visible church are called into one body of people through the ministry of the teaching of the prophets and apostles, and through the sacraments. It also signifies that inward union by which those whom the Lord has forever chosen to be a part of this visible assembly, that is, those who truly believe, are united by the same Spirit with the Father, His Son Jesus Christ, and with each other (p. 131-132) I believe that whatever is and is called sin — whether it be original sin the form of that transgression in Adam’s loins and the consequent corruption that I carry around in the flesh, or actual sin the form of the wicked thoughts, words, and deeds that arise out of original sin — I believe, I say, that through faith, by which I am and remain engrafted into Christ, all of that is forgiven me by the gracious goodness of God. God does this in such a way that He erases all memory of both guilt and punishment, just as if I had never sinned or had no sin. Therefore, I trust that already now I am blessed (p. 133-134). For those of us who are truly engrafted into Christ through faith begin to possess—in addition to that benefit of forgiveness with which the image of Satan is covthe restoration of the image of God… (p. 134-35)</p></blockquote>

certain+person+through+whom+sin+entered+the+world%2C+and+death+through+sin%2C+and+who+thus+became+the+cause+and%2C+as+it+were%2C+foundation+of+the+defection+from+God+and+of+the+covenant+with+the+devil%2C+so+also+there+ought+to+be+a+certain+person+designated+by+God+as+the+foundation+and+cause+of+an+indestructible+union+with+God%2C+the+source+of+all+happiness+%28p.+67%29.+Moreover%2C+the+human+Christ+could+not+be+a+Savior+by+His+power+unless+the+divine+nature+were+joined+to+Him+in+the+unity+of+His+person%2C+from+which%2C+as+from+the+Father+at+the+same+time%2C+the+Holy+Spirit+proceeds%2C+who+leads+us+into+possession+of+Christ%2C+engrafts+us+into+Christ%2C+and+regenerates+us+unto+eternal+life+%281+Cor.+15%3A21%2C+45%3B+Rom.+8%3A8%E2%80%939%29.+Indeed%2C+so+that+those+who+have+once+truly+been+engrafted+into+Christ+by+the+Holy+Spirit+can+never+again+be+cut+off+from+eternal+life%2C+the+%CE%BB%CE%BF%CE%B3%CE%BF%CE%BD+Himself+%E2%80%94+the+eternal+Son+of+God%2C+consubstantial+with+the+Father%2C+namely%2C+the+very+fountain+of+life%2C+in+which+there+was+life+from+the+beginning+%28John+1%5B%3A4%5D%29+%E2%80%94+must+dwell+%CF%83%CF%89%CE%BC%CE%B1%CF%84%CE%BA%CF%89%CF%82%2C+that+is%2C+personally%2C+in+His+assumed+human+nature+for+all+eternity+%28p.72%29.+Our+entering+into+covenant+and+reconciliation+with+God+required+that+both+of+these+natures+in+the+Mediator+be+true+and+intact%2C+with+their+properties+preserved.+In+the+same+way%2C+since+the+covenant+and+union+must+last+for+all+eternity%2C+so+that+even+after+the+resurrection+our+true+flesh+and+bones+might+enjoy+happiness+%28Phil.+3%5B%3A21%5D%29%2C+it+is+also+necessary+in+the+foundation%2C+namely%2C+in+the+Mediator%2C+upon+whom+the+task+of+saving+us+forever+was+placed%2C+that+tremaintact+forever+%E2%80%94+body+and+soul%2C+flesh+and+bones.+%28p.+73%29+Vivification%2C+therefore%2C+is+the+second+fruit+of+the+resurrection+of+Christ+because+Christ+Himself%2C+who+is+always+living%2C+is+our+life+through+faith%2C+and+because%2C+by+the+power+that+we+draw+from+Christ+our+Head%2C+we+arise+in+this+life+to+newness+of+life+through+the+Spirit+of+faith.+This+is+so+that+by+living+pure+and+holy+lives%2C+we+might+wholly+consecrate+ourselves+to+the+will+of+God.+That+is+what+the+apostle+teaches+in+Colossians+3%5B%3A1%E2%80%932%5D%3A+%E2%80%9CIf+then+you+were+raised+with+Christ%2C+seek+those+things+which+are+above%2C+where+Christ+is%2C+sitting+at+the+right+hand+of+God.+Set+your+mind+on+things+above%2C+not+on+things+on+the+earth.%E2%80%9D+That+is+also+why+he+says+in+Romans+6%5B%3A4%E2%80%935%5D+that+we+were+engrafted+into+the+likeness+of+Christ%E2%80%99s+death+so+that%2C+as+participants+in+His+resurrection%2C+we+might+walk+in+newness+of+life.+With+these+words+he+is+not+only+offering+the+resurrection+of+Christ+as+an+example+for+us+to+imitate%3B+he+is+also%2C+and+especially%2C+teaching+that+this+is+brought+about+in+us+by+the+power+of+Christ%E2%80%99s+resurrection+so+that+we+are+able+to+rise+again+to+a+new+life+%28p.+97%29+Third%2C+the+ascension+is+the+progression+and+continuation+of+His+righteousness.+This+is+primarily+because+He+could+not+ascend+into+heaven%2C+into+that+great+glory%2C+in+His+own+body+accursed+in+our+sins%2C+unless+He+had+been+fully+justified+for+our+sins+and+faith+%28Heb.+1%3A7%29+%28p.+104%29.+The+second+fruit+is+that+by+His+ascension+Christ+makes+us+to+sit+with+Him+in+heavenly+places+%28Eph.+2%5B%3A6%5D%29%2C+so+that+we+do+not+simply+anticipate+heaven+in+mere+hope+but+already+possess+it+in+Christ+our+Head+and+Brother.+This+is+because+after+full+expiation+for+our+sins+had+been+made%2C+the+Pledge%2C+in+the+earthly+and+bodily+form+that+He+received+from+us%2C+now+possesses+heaven+on+our+behalf.+It+is+also+because+we+possess+a+spiritual+and+heavenly+pledge+received%2C+in+turn%2C+from+Him%2C+namely%2C+the+Spirit+of+Christ+dwelling+in+us.+So+we+are+engrafted+into+Him+by+the+power+of+the+Holy+Spirit+through+faith+in+the+promise+of+the+gospel+%28p.+105%29.+His+operations+are+many+and+diverse.+First%2C+He+is+given+so+that+He+might+bear+witness+in+our+hearts+to+the+love+of+the+Father+%28Gal.+4%5B%3A6%5D%29+and+illumine+the+eyes+of+our+minds+with+the+knowledge+of+Christ.+Thus%2C+He+engrafts+me+into+Christ+through+faith%2C+as+a+branch+into+the+vine%2C+and+makes+me+a+partaker+of+Christ+and+all+His+benefits+%28John+15%5B%3A1ff.%5D%29.+The+union+with+Christ+and+His+benefits+that+the+Holy+Spirit+brings+about+in+us+is+powerfully+expressed+in+Scripture+when+it+says+that+the+Holy+Spirit+sprinkles+us+with+the+blood+of+Christ+%281+Peter+1%5B%3A2%5D%29%2C+makes+us+%E2%80%9Cmembers+of+Christ%E2%80%9D+%281+Cor.+6%5B%3A15%5D%29%2C+feeds+us+with+Christ+%28John+6%5B%3A50%E2%80%9358%5D%29%2C+gives+us+Christ+to+drink+%281+Cor.+10%5B%3A4%2C+16%5D%3B+12%29%2C1+and+builds+us+on+Christ+%28Eph.+2%5B%3A20%5D%29.+Here+the+office+and+purpose+of+the+Holy+Spirit+given+to+us+is+shown%2C+namely%2C+that+through+faith+the+Spirit+might+unite+us+to+Christ+as+closely+as+possible+and+might+achieve+similar+results+in+both+members+and+Head%2C+seeing+as+it+is+the+same+Spirit%2C+the+same+life+and+glory+%28Rom.+8%5B%3A1%E2%80%9326%5D%29+%28p.+124%29.+The+communion+of+saints+signifies+first+that+outward+fellowship+by+which+members+of+the+visible+church+are+called+into+one+body+of+people+through+the+ministry+of+the+teaching+of+the+prophets+and+apostles%2C+and+through+the+sacraments.+It+also+signifies+that+inward+union+by+which+those+whom+the+Lord+has+forever+chosen+to+be+a+part+of+this+visible+assembly%2C+that+is%2C+those+who+truly+believe%2C+are+united+by+the+same+Spirit+with+the+Father%2C+His+Son+Jesus+Christ%2C+and+with+each+other+%28p.+131-132%29+I+believe+that+whatever+is+and+is+called+sin+%E2%80%94+whether+it+be+original+sin+the+form+of+that+transgression+in+Adam%E2%80%99s+loins+and+the+consequent+corruption+that+I+carry+around+in+the+flesh%2C+or+actual+sin+the+form+of+the+wicked+thoughts%2C+words%2C+and+deeds+that+arise+out+of+original+sin+%E2%80%94+I+believe%2C+I+say%2C+that+through+faith%2C+by+which+I+am+and+remain+engrafted+into+Christ%2C+all+of+that+is+forgiven+me+by+the+gracious+goodness+of+God.+God+does+this+in+such+a+way+that+He+erases+all+memory+of+both+guilt+and+punishment%2C+just+as+if+I+had+never+sinned+or+had+no+sin.+Therefore%2C+I+trust+that+already+now+I+am+blessed+%28p.+133-134%29.+For+those+of+us+who+are+truly+engrafted+into+Christ+through+faith+begin+to+possess%E2%80%94in+addition+to+that+benefit+of+forgiveness+with+which+the+image+of+Satan+is+covthe+restoration+of+the+image+of+God%E2%80%A6+%28p.+134-35%29%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+An+Exposition+of+the+Apostles%E2%80%99+Creed%2C+trans.+Lyle+Bierma%2C+Classic+Reformed+Theology%2C+vol.+2%2C+ed.+R.+Scott+Clark+%28Grand+Rapids%3A+Reformation+Heritage+Books%2C+2009%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcec190dc7a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cec190dc7a.html">Permalink</a><a class="src" href="https://heidelblog.net/2010/05/union-with-christ-in-caspar-olevianus-exposition-of-the-apostles-creed/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The orthodox therefore define the unio mystica as the spiritual conjunction (conjunctio spiritualis) of the Triune God with the believer in and following justification. It is a substantial and graciously effective indwelling. In relation to the ordo salutis (q.v.), or order of salvation, the Protestant scholastics distinguish the initial unitio (q.v.), or uniting, of the unio mystica, which is the basis for the imputation of Christ’s righteousness to the believer and which corresponds with the adoption (adoptio) of the believer, and the ongoing unio, or union, of the unio mystica, which continues concurrent with sanctification throughout the life of the believer…</p></blockquote>

</figure><figure class="quote" id="q-4dff76414d" data-kw="">
<blockquote><p>A threefold being is usually distinguished: of essence, of existence, and of subsistence… Therefore, concerning this being of existence, the present question is whether in Christ there is one existence of the divine nature and another of the human nature, or rather there is only a single being of existence, namely the uncreated existence of the Word itself, by which the assumed humanity is also said to exist… In this controversy there are two opposed opinions. The first is common in the school of Thomists, denying that in the humanity of Christ there is any created existence, and affirming that by union it was assumed not only to the subsistence of the Word but also to existence… And so the Thomists commonly teach in the cited place: Cajetan, Capreolus, Ferrara, Medina, Cabrera, Alvarez, and other notable followers of the same school. The opposed opinion is common outside the school of St. Thomas, affirming that the assumed humanity has its own created existence by which it exists. For although it was assumed to the subsistence of the Word, nevertheless [it was] not [assumed] to [his] existence. So Scotus holds (Ordinatio 3, d. 6, q. 1), St. Bonaventure (Sent. 3, d. 5, a. 3, q. 3), and the Scotists commonly follow, and all the more recent [theologians], some of whom strive to benignly interpret St. Thomas and draw him into this opinion as well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartolomeo-mastrius.html">Bartolomeo Mastrius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, bk. 3, Of the Incarnation of the Lord (d. 1673), Disputation 1 tr. by AI by OmegaPoint99 | quest. 6, ‘Whether the human nature in Christ has its own existence, or rather exists by the existence of the Word’ 140 | art. 1, Resolution of the question 141 art. 2, The foundations of the opposing opinion are overthrown 152-58, pp. 140-41</span></figcaption>

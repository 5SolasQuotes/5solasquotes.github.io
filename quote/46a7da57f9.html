<main class="wrap"><figure class="quote" id="q-46a7da57f9" data-kw="">
<blockquote><p>Wisdom is God understanding all things intelligible by his essence, 1 Tim. 1:17; Acts 15:18; 1 Jn. 3:20. God comprehending his own essence sees all things, because all possibilities, futuritions and beings, that is, all things that might have been, shall be or actually be, are eminently contained in the divine essence. Whence, by the way it may appear that the divine essence as willing the futurition of things, is that increated idea of all things: which God comprehending, understands the creature better in Himself than it is to be understood in itself. God seeing Himself, sees all things, without exemption of any; always, without intermission; perfectly, without defect: at once, without succession. He is all eye, yet without an eye: all memory, yet without a memory. God understands all things by his essence; angels are thought to understand by an infused habit of the species or images of things concreated with their nature. Men understand by the species or images of things abstracted and received from their objects. Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11): Angels by reason of the quickness and strength of their understanding apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London, 1654), ch. 1, Of the Divine Essence, pp. 16-17</span></figcaption>

<blockquote><p>potentia absoluta: absolute power; the omnipotence of God limited only be the law of noncontradiction. According to his potentia absoluta, God can effect all possibility, constrained only by his own nature. Things which are by nature evil and either impossible or noncompossible things (like square circles) fall outside of the realm of God’s power. The term emphasizes the transcendence and omnipotence of God by setting God even above and beyond the laws he has ordained for the operation of his universe…</p></blockquote>

</figure><figure class="quote" id="q-121e5da622" data-kw="">
<blockquote><p>Indeed, God is the idea of all things, both created and to be created, as He manifests His simple and perfect essence in them, though not equally or in the same degree. Just as this essence shines more brightly in animate beings than in inanimate ones, so it is most perfectly reflected in man. While other creatures were given only a trace or shadow of His being, in which His eternal power and divine nature can be read (ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης), as Romans 1:20 states, man was endowed with His image, reflecting His most perfect nature, and with faculties and qualities that are somewhat shared with God but not with other creatures. This is why, concerning man’s creation, it is said that not merely a general notion of God was involved, but a deliberate consultation and agreement of the entire Holy Trinity, as Genesis 1:27 indicates. I. …the phrases “man created in the image of God” and “the image of God in man” essentially mean the same thing. The former suggests that the Divine Essence, which knows the nature of man as a species that can be expressed or imitated, serves as the model or objective image. The latter indicates something consequent to that model, which will be called the subjective image, in which the Creator willed His glory to be seen as in a mirror, as Calvin states in his Institutes (Book 2, Chapter 12, Sections 5-6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653)</span></figcaption>

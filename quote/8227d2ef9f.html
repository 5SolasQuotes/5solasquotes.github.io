<main class="wrap"><figure class="quote" id="q-8227d2ef9f" data-kw="">
<blockquote><p>To join to the public confession some notable promise which may raise sinners to the hope of pardon and reconciliation, there is none among us who does not acknowledge it to be most useful. And indeed from the beginning I wished to introduce this practice; but when certain persons feared that offence might arise from the novelty, I was too ready to yield. Thus the matter was let go. Yet now it would not be seasonable to make any change in this respect; because, before the confession has been finished, a great part of the people begin to rise. Hence we the more earnestly desire, while it is still in your power, that your people be accustomed to both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’ (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3bd4952534" data-kw="">
<blockquote><p>But how can we imagine that many thousands [of Jerusalem Christians] could in one meeting communicate at one Table in the Lord’s Supper, and that ordinarily? 1. What voice could reach to so many thousands, as they did grow unto?… 3. Can we believe that seeing congregational meetings of fewer, and that in private houses, was less obnoxious to the indignation of authority, than meeting in the Temple, as is most evident, Acts 4:1-2; and seeing [that] the apostles had liberty to meet, Acts 5:26, [can we believe] that they would draw the first mold of the Christian visible-Church after the pattern of a convention [i.e. all gathering unto one place] most unfit, yea impossible for attaining the intended end, to wit, edification, especially not being compelled thereunto by an extrinsical necessity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 1</cite>, p. 428</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-08bff57bc3" data-kw="">
<blockquote><p>…they [the apostolic Church] practiced all the ordinances directed, though they had no written directory¹ in a formal contexture or frame: for prayers, preaching, praising, sacraments and censures never Church wanted [lacked] in some one order or other, though we cannot say that the apostolic Church had this same very order and form: But a liturgy which is a commanded, imposed, stinted form, in such words and no other, is another thing than a directory, as an unlawful thing is different from a lawful: [¹ While Rutherford is speaking of directories in general, yet this section may have some reference to Westminster’s Directory for the Public Worship of God, as the Church of Scotland had adopted it in 1645, a year before this book of Rutherford’s was published.] 2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal, in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture, as was the [Anglican] Service-Book; and the pastor or people in these are not properly moral agents, nor do we press that Scripture should regulate men in these.</p></blockquote>

</figure><figure class="quote" id="q-8012375907" data-kw="">

</figure><figure class="quote" id="q-88b845d9e3" data-kw="">
<blockquote><p>…for God has commanded his ministers to bless his people (Num. 6:22-27), which by just analogy belongs to the ministers of the gospel; neither is there any ground for making herein a difference between them and the minister of the Law, but we must conceive the commandment to tie both alike to the blessing of God’s people… And if we farther consider, that the duty of blessing was performed by the minister of the Lord (Heb. 7:6), even before the Law of Moses, we are yet more confirmed to think, that the blessing of the people was not commanded in the Law as a thing peculiar and proper to the Levitical priesthood, but as a moral and perpetual duty belonging to the Lord’s ministers forever.</p></blockquote>

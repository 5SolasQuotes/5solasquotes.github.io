<main class="wrap"><figure class="quote" id="q-d7a60a1cd6" data-kw="">
<blockquote><p>And this leads me to observe, as the second thing of which the text [Isaiah 21:11], as now used, may remind and assure us, that however discouraging the aspect of things may, in many points, appear — “the morning cometh” — a day of unprecedented brilliancy and joy, when the kingdom and dominion, under the whole heaven, shall be given to the Son of Man; and when, emancipated from the strife and turmoil of incessant wars, and enjoying and exhibiting a foretaste and emblem of the heavenly state, the rest of Zion shall be glorious.

Yes, the Lord’s watchmen, not once or dubiously, but explicitly, and a thousand times, have proclaimed that such a “morning cometh”‘ — the morning of that millennial day when there shall be nothing to hurt nor to destroy in all God’s holy mountain, and when the earth shall be full of the knowledge of the glory of the Lord, as the waters cover the sea.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Examining the Signs of the Times (Preached at the Opening of the Synod of Glasgow and Ayr, October 1844.) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“And this leads me to observe, as the second thing of which the text [Isaiah 21:11], as now used, may remind and assure us, that however discouraging the aspect of things may, in many points, appear — “the morning cometh” — a day of unprecedented brilliancy and joy, when the kingdom and dominion, under the whole heaven, shall be given to the Son of Man; and when, emancipated from the strife and turmoil of incessant wars, and enjoying and exhibiting a foretaste and emblem of the heavenly state, the rest of Zion shall be glorious.

Yes, the Lord’s watchmen, not once or dubiously, but explicitly, and a thousand times, have proclaimed that such a “morning cometh”‘ — the morning of that millennial day when there shall be nothing to hurt nor to destroy in all God’s holy mountain, and when the earth shall be full of the knowledge of the glory of the Lord, as the waters cover the sea.”

— Robert Buchanan, The Duty of Examining the Signs of the Times (Preached at the Opening of the Synod of Glasgow and Ayr, October 1844.) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+this+leads+me+to+observe%2C+as+the+second+thing+of+which+the+text+%5BIsaiah+21%3A11%5D%2C+as+now+used%2C+may+remind+and+assure+us%2C+that+however+discouraging+the+aspect+of+things+may%2C+in+many+points%2C+appear+%E2%80%94+%E2%80%9Cthe+morning+cometh%E2%80%9D+%E2%80%94+a+day+of+unprecedented+brilliancy+and+joy%2C+when+the+kingdom+and+dominion%2C+under+the+whole+heaven%2C+shall+be+given+to+the+Son+of+Man%3B+and+when%2C+emancipated+from+the+strife+and+turmoil+of+incessant+wars%2C+and+enjoying+and+exhibiting+a+foretaste+and+emblem+of+the+heavenly+state%2C+the+rest+of+Zion+shall+be+glorious.%0A%0AYes%2C+the+Lord%E2%80%99s+watchmen%2C+not+once+or+dubiously%2C+but+explicitly%2C+and+a+thousand+times%2C+have+proclaimed+that+such+a+%E2%80%9Cmorning+cometh%E2%80%9D%E2%80%98+%E2%80%94+the+morning+of+that+millennial+day+when+there+shall+be+nothing+to+hurt+nor+to+destroy+in+all+God%E2%80%99s+holy+mountain%2C+and+when+the+earth+shall+be+full+of+the+knowledge+of+the+glory+of+the+Lord%2C+as+the+waters+cover+the+sea.%E2%80%9D%0A%0A%E2%80%94+Robert+Buchanan%2C+The+Duty+of+Examining+the+Signs+of+the+Times+%28Preached+at+the+Opening+of+the+Synod+of+Glasgow+and+Ayr%2C+October+1844.%29+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd7a60a1cd6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d7a60a1cd6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/16/robert-buchanan-on-the-millennial-morning/" rel="noopener" target="_blank">Read it online · <blockquote><p>And amonge these thinges whiche ought to have the principal place, as touching this spiritual worshipping, is obedience: wherof we read that it is better than sacrifices. Neither had God a regard in a manner to any other thing in the whole law and rites of ceremonies than to have men truly subject and obedient unto Him.</p></blockquote>

</figure><figure class="quote" id="q-79ece82320" data-kw="">
<blockquote><p>God is not only a spirit or spiritual substance, but He is every way infinite and has sufficiency of all perfection in Himself. And therfore He takes no delight in any good thing that the creature can communicate to Him: but his delight is in the communication of his own goodness to us, and in all such duties whereby we conform ourselves to Him and magnify his goodness. Thus Paul, Acts 17:25, that ‘God needs nothing,’ and therefore He is not worshipped with anything made by the hands of man. And the Lord says by the Psalmist (Ps. 50; 8; 14) that He does not principally respect our gifts and our sacrifices, because all things are his, but He respects praise and thanksgiving.</p></blockquote>

<blockquote><p>Our rest on Earth should bear some proportion to our rest in Heaven. Our rest in Heaven shall not only be a cessation from labour, but from all sensual vain pleasure, from all worldly discourse, a continual pleasure in beholding and enjoying God. If we would keep a Sabbath perfectly, certainly, (abating what is necessary for our selves or others, for the sustentation of our bodies, and the preservation both of our selves and other creatures) we should allow our selves no more labour than we shall have in Heaven, no other pleasure than the Angels and Saints of God have there, all whose pleasure is in the contemplation and enjoyment of God. Oh that we could thus sanctify Sabbaths!</p></blockquote>

</figure><figure class="quote" id="q-cefd8913c0" data-kw="">
<blockquote><p>4. Although political Cunning is to be acknowledged in established Paganism and Mohammadanism, it is impossible for true Christianity to owe its origin to the deceits of Politicians: for nothing is more adverse to the pride of impious Politicians, desiring to govern all things according to their pleasure, than that precept in Acts 5:29, Πειθαρχεῖν δεῖ Θεῷ μᾶλλον ἢ ἀνθρώποις, we ought to obey God rather than men, and in Luke 12:4, 5, λέγω δὲ ὑμῖν τοῖς φίλοις μου, Μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα, καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι. Ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ἐξουσίαν ἔχοντα ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε, And I say unto you my friends, Be not afraid of them that kill the body, and after that have no more that they can do: But I will forewarn you whom ye shall fear: Fear Him, which after He hath killed hath power to cast into hell; yea, I say unto you, Fear Him.

Indeed, unless this Religion came from God Himself, truly Existing, it would have been exterminated a long time ago by the power of Politicians, frequently persecuting and being eager to annihilate Christians: which is the pious observation, suited to our use, of the Eminent NIEUWENTYT, Cosmotheoria, chapter XXI, § 43, pages 490, 491. 5. The opinion of Hobbes, insofar as he traces the Worship and veneration of God from the fear of a superior Power only, is exceedingly injurious to God, inasmuch as he, depriving Him of the natural right of requiring worship, and actually turning it into Tyranny, also destroys the true character of Religion, which men, only when compelled by force and fear, will observe; indeed which they will easily abjure again, thinking that God according to His own right is able to punish even His pious worshippers, indeed actually to dispense evils to good men: see VAN DE WYNPERSSE, in his Dissertatione de Libertinismo, pages 32-35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 11, p. 106.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

Indeed, unless this Religion came from God Himself, truly Existing, it would have been exterminated a long time ago by the power of Politicians, frequently persecuting and being eager to annihilate Christians: which is the pious observation, suited to our use, of the Eminent NIEUWENTYT, Cosmotheoria, chapter XXI, § 43, pages 490, 491. 5. The opinion of Hobbes, insofar as he traces the Worship and veneration of God from the fear of a superior Power only, is exceedingly injurious to God, inasmuch as he, depriving Him of the natural right of requiring worship, and actually turning it into Tyranny, also destroys the true character of Religion, which men, only when compelled by force and fear, will observe; indeed which they will easily abjure again, thinking that God according to His own right is able to punish even His pious worshippers, indeed actually to dispense evils to good men: see VAN DE WYNPERSSE, in his Dissertatione de Libertinismo, pages 32-35.”

— Bernardinus de Moor, Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 11, p. 106.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+Although+political+Cunning+is+to+be+acknowledged+in+established+Paganism+and+Mohammadanism%2C+it+is+impossible+for+true+Christianity+to+owe+its+origin+to+the+deceits+of+Politicians%3A+for+nothing+is+more+adverse+to+the+pride+of+impious+Politicians%2C+desiring+to+govern+all+things+according+to+their+pleasure%2C+than+that+precept+in+Acts+5%3A29%2C+%CE%A0%CE%B5%CE%B9%CE%B8%CE%B1%CF%81%CF%87%CE%B5%E1%BF%96%CE%BD+%CE%B4%CE%B5%E1%BF%96+%CE%98%CE%B5%E1%BF%B7+%CE%BC%E1%BE%B6%CE%BB%CE%BB%CE%BF%CE%BD+%E1%BC%A2+%E1%BC%80%CE%BD%CE%B8%CF%81%E1%BD%BD%CF%80%CE%BF%CE%B9%CF%82%2C+we+ought+to+obey+God+rather+than+men%2C+and+in+Luke+12%3A4%2C+5%2C+%CE%BB%E1%BD%B3%CE%B3%CF%89+%CE%B4%E1%BD%B2+%E1%BD%91%CE%BC%E1%BF%96%CE%BD+%CF%84%CE%BF%E1%BF%96%CF%82+%CF%86%E1%BD%B7%CE%BB%CE%BF%CE%B9%CF%82+%CE%BC%CE%BF%CF%85%2C+%CE%9C%E1%BD%B4+%CF%86%CE%BF%CE%B2%CE%B7%CE%B8%E1%BF%86%CF%84%CE%B5+%E1%BC%80%CF%80%E1%BD%B8+%CF%84%E1%BF%B6%CE%BD+%E1%BC%80%CF%80%CE%BF%CE%BA%CF%84%CE%B5%CE%B9%CE%BD%E1%BD%B9%CE%BD%CF%84%CF%89%CE%BD+%CF%84%E1%BD%B8+%CF%83%E1%BF%B6%CE%BC%CE%B1%2C+%CE%BA%CE%B1%E1%BD%B6+%CE%BC%CE%B5%CF%84%E1%BD%B0+%CF%84%CE%B1%E1%BF%A6%CF%84%CE%B1+%CE%BC%E1%BD%B4+%E1%BC%90%CF%87%E1%BD%B9%CE%BD%CF%84%CF%89%CE%BD+%CF%80%CE%B5%CF%81%CE%B9%CF%83%CF%83%E1%BD%B9%CF%84%CE%B5%CF%81%E1%BD%B9%CE%BD+%CF%84%CE%B9+%CF%80%CE%BF%CE%B9%E1%BF%86%CF%83%CE%B1%CE%B9.+%E1%BD%99%CF%80%CE%BF%CE%B4%CE%B5%E1%BD%B7%CE%BE%CF%89+%CE%B4%E1%BD%B2+%E1%BD%91%CE%BC%E1%BF%96%CE%BD+%CF%84%E1%BD%B7%CE%BD%CE%B1+%CF%86%CE%BF%CE%B2%CE%B7%CE%B8%E1%BF%86%CF%84%CE%B5%C2%B7+%CF%86%CE%BF%CE%B2%E1%BD%B5%CE%B8%CE%B7%CF%84%CE%B5+%CF%84%E1%BD%B8%CE%BD+%CE%BC%CE%B5%CF%84%E1%BD%B0+%

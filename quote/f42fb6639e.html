<main class="wrap"><figure class="quote" id="q-f42fb6639e" data-kw="">
<blockquote><p>5th Consideration. I see not but we may separate from the Lord’s Supper where bread is adored, and from baptism where the sign of the cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the word and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: Griffin, 1644), ch. 4, sect. 5, Question 3, In what cases it is lawful to separate from a Church?, p. 254</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b777aa18b" data-kw="">
<blockquote><p>Minister: …But is there any minister or Church that has no open faults in ministry and worship? Lawyer: They mean not small infirmities, such as weak, faulty expressions, methods, disorders, dullness, etc. but gross, intolerable faults. Minister: So then you are come to what I hold; I profess that if I see or hear any such blasphemy, idolatry, heresy or malignity as renders the worship abhorred of God, I will abhor it and avoid it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 226-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-b150bf6217" data-kw="">
<blockquote><p>While the people with fear and joy see God lighting his own fire, fire from heaven, the two sons of Aaron, in a careless presumption, will be serving Him with a common flame; as if He might not have leave to choose the forms of his own worship. If this had been done some ages after, when the memory of the original of this heavenly fire had been worn out, it might have been excused with ignorance; but now, when God had newly sent his fire from above, newly commanded the continuance of it, either to let it go out, or, while it still flamed, to fetch profane coals to God’s altar, could savour of no less than presumption and sacrilege. … Speed of death is not always a judgment: suddenness, as it is ever justly suspicable, so then certainly argues anger, when it finds us in an act of sin. Leisure of repentance is an argument of favor. When God gives a man law, it implies that He would not have judgment surprise him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments</cite>, (1614; London: 1868), bk. 6, Contemplation 2, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-4f0321b442" data-kw="">
<blockquote><p>For, 2. This would be acceptable to God. This ‘willing’ mind is accepted (2 Cor. 8:12), when accompanied with sincere endeavors. When men purpose that which is good, and endeavour according to their ability to perform also, God will accept of what they have, or can do, and not reject them for what they have not, and what is not in their power to do: and this is true as to other things besides the work of charity… It is accepted, indeed, where there is a performance as far as we are able, and when providence hinders the performance, as in David’s case concerning building a house for the Lord, 2 Sam. 7:1-29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-mayo.html">Daniel Mayo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Henry’s Commentary, on 2 Corinthians, ch. 8, vv. 7-15 Mayo, an English puritan, was the continuator of 2 Corinthians after Henry died, using Henry’s outlines.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

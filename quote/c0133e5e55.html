<main class="wrap"><figure class="quote" id="q-c0133e5e55" data-kw="">
<blockquote><p>They went down into the water. Here we see the rite used among the men of old time in baptism; for they put all the body into the water. Now the use is this, that the minister doth only sprinkle the body or the head. But we ought not to stand so much about such a small difference of a ceremony, that we should therefore divide the Church, or trouble the same with brawls. We ought rather to fight even an hundred times to death for the ceremony itself of baptism, inasmuch as it was delivered us by Christ that we should suffer the same to be taken from us.

But forasmuch as we have as well a testimony of our washing, as of newness of life, in the figure of water; forasmuch as Christ representeth unto us his blood in the water as in a glass, that we may get our cleanness thence; forasmuch as he teacheth that we are fashioned again by his Spirit, that being dead to sin, we may live to righteousness; it is certain that we want nothing which maketh to the substance of baptism.

Wherefore the Church did grant liberty to herself, since the beginning, to change the rites somewhat, excepting this substance. For some dipped them thrice, some but once. Wherefore there is no case why we should be so straitlaced in matters which are of no such weight; so that external pomp do no whit pollute the simple institution of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 364-65.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

las" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0133e5e55.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/08/20/john-calvin-on-the-substance-and-accidents-of-the-mode-of-baptism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d42b4d3e8" data-kw="">
<blockquote><p>There is a great difference between those infants born to parents in the covenant and those not born in the covenant … children of believers dying in infancy ought to be reckoned elect since they are graciously taken away by God from this life before they have violated the conditions of the covenant … children of unbelievers born outside the church of God, ought to be left to the judgment of God.</p></blockquote>

— Johannes Polyander, Acta Synodi Nationalis … Dordrecht habitae Anno MCXVII et MDCXIX (Dordrecht, 1620), part 3, pp 10-11. Quoted in Daniel R. Hyde, Grace Worth Fighting For: Recapturing the Vision of God’s Grace in the Canons of Dort (The Davenant Press, Kindle Edition, 2019), p. 122.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+great+difference+between+those+infants+born+to+parents+in+the+covenant+and+those+not+born+in+the+covenant+%E2%80%A6+children+of+believers+dying+in+infancy+ought+to+be+reckoned+elect+since+they+are+graciously+taken+away+by+God+from+this+life+before+they+have+violated+the+conditions+of+the+covenant+%E2%80%A6+children+of+unbelievers+born+outside+the+church+of+God%2C+ought+to+be+left+to+the+judgment+of+God.%E2%80%9D%0A%0A%E2%80%94+Johannes+Polyander%2C+Acta+Synodi+Nationalis+%E2%80%A6+Dordrecht+habitae+Anno+MCXVII+et+MDCXIX+%28Dordrecht%2C+1620%29%2C+part+3%2C+pp+10-11.+Quoted+in+Daniel+R.+Hyde%2C+Grace+Worth+Fighting+For%3A+Recapturing+the+Vision+of+God%E2%80%99s+Grace+in+the+Canons+of+Dort+%28The+Davenant+Press%2C+Kindle+Edition%2C+2019%29%2C+p.+122.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d42b4d3e8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d42b4d3e8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/05/johannes-polyander-anthonius-thysius-and-antonius-walaeus-on-the-salvation-of-believers-children-dying-in-infancy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-655a1793c9" data-kw="">
<blockquote><p>Then, because to whomsoever the promise appertains, to them also belongs the sign, as therefore baptism is bestowed upon infants, is likewise the Supper of the Lord to be administered unto them? Certain of the fathers have thought so, as Cyprian (Sermon 5, De Lapsis [Of Falls]) and Augustine (Lib. de Eccle. dogmat., ch. 52), being moved by these words, Jn. 6:53, ‘Except ye shall eat the flesh of the son of man, and drink his blood, you shall have no life in you.’ But we deny the consequent. For this place speaks not of a sacramental eating, but of a spiritual eating, or of faith, by which the faithful are quickened, which are annexed unto Christ, who offered his body and shed his blood for us. And by this means the flesh of Christ is made unto us meat indeed, and his blood drink indeed. Secondly, that to whomsoever the promise appertains, to them also belongs the sign, is true, but according to the divine determination, appropriated to every sacrament: to wit, so that the sacrament of ingrafting be bestowed as well upon infants as those of years, but upon male children only, and that not before the eighth day, in the old Testament: but in the new, both to the male and female without any prefixed time. But the sacrament of nourishment to them of years only, and that for a certain peculiar end, and the diversity of the circumstance of the action. So the Eucharist hath his proper end, that the death of the Lord should be declared in the public congregation in the using thereof. It is also commanded, that everyone which comes to the Lord’s Supper should examine himself: yea and peculiar actions belong to the external rite, to wit, to eat and to drink, which are not fit for little children. So under the Old Testament circumcision was appointed for infants but the Passover to them only which by reason of their age were able to ask of the signification thereof. Hereupon came those vulgar verses: ‘Ebrius, infamis, erroneus, atque furentes, Cum pueris, Domini non debent sumere corpus.’ ‘To drunkards and thin-famous sort, to men misled and mad: To children, Christ’s body to give, it were an action bad.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’, pp. 720-1</span></figcaption>

</figure><figure class="quote" id="q-e4c1b32671" data-kw="">
<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-van-hoeke.html">Peter van Hoeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’</cite>, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth, p. 33.</span></figcaption>

<blockquote><p>…appeared to make this position [of the NT Church practicing infant baptism] impregnable. It was expounded in brilliant style; in it Jeremias utilized everything known to exist in the sources, as well as in more recent literature, and he summarized all the arguments that have been brought into play up to the present.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joachim-jeremias.html">Joachim Jeremias</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism in the First Four Centuries</cite>, trans. David Cairns (Philadelphia: The Westminster Press, 1962) 110 pp. ToC | In Aland’s preface, he says that Jeremias’s work:</span></figcaption>

<blockquote><p>A being is considered as possible, or as actual. When it is considered as possible, it is said to have an essence or nature; such were all things before their creation; When it is considered as actual, then it is said to have existence also; such are all things which are created, and God himself the Creator. Essence, therefore, is but the very nature of any being, whether it be actually existing or not… There is but one Being which includes existence in the very essence of it, and that is God, who therefore actually exists by natural and eternal necessity; but the actual existence of every creature is very distinct from its essence, for it may be, or may not be, as God pleases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-watts.html">Isaac Watts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logic</cite>, 1.2.1. cf. Aquinas, Of Being.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Part of Heider’s project is to argue that Suárez was in fact a moderate realist, despite widespread characterizations of him, both by his immediate successors and by recent scholars, as essentially a nominalist. Such characterizations gain strength from Suárez’s own statement that he perhaps differed from the nominalists only modo loquendi (97). Heider, however, argues that it makes more sense to regard Suárez as a moderate realist, of broadly the same stripe as Poinsot, Mastri, and Belluto. It is not always entirely clear, though, wherein Heider disagrees with other commentators. Do they offer substantively different interpretations of Suárez, or are they using different taxonomies, with more or less strict usages of the term “nominalist?” In particular, it is worth noting that, if the crude, but widely used, division between realism and nominalism is employed, moderate realism is a species of nominalism, rather than the realism its name suggests. The great strength of this book is Heider’s masterful, detailed examination of three representative accounts from sixteenth- and seventeenth-century Scholasticism. Suárez offers an original blend of Thomist, Scotist, and nominalist elements; Poinsot’s account is more purely ad mentem Thomi, while Mastri and Belluto take an approach ad mentem Scoti. Of course, there were other streams of thought in the period, but Heider reasonably takes these to be the most important ones… Heider rightly presents Suárez as the first Scholastic of a venerable early modern tradition, rather than as the last schoolman. The present volume decisively dismantles the latter characterization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-heider.html">Daniel Heider</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universals in Second Scholasticism</cite>, (1548–1617), João Poinsot O.P. (1589–1644) and Bartolomeo Mastri da Meldola O.F.M. Conv. (1602–1673)/Bonaventura Belluto O.F.M. Conv. (1600–1676) (Amsterdam: John Benjamins Publishing Company, 2014) 344 pp. | See this review by Sydney Penner. Penner:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-c0b13f9fa1" data-kw="">
<blockquote><p>This paper highlights a set of objections on natural theology addressed by Descartes and Voetius to each other. It shows and expands the common ground Descartes and Voetius held within natural theology. It argues that their contrasting views revolved mainly around the limits of natural theology. For Voetius, natural theology is extrinsically limited by the revealed God, the external principle of faith. For Descartes, metaphysics or natural theology is intrinsically limited by the incomprehensible idea of the Infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vadana-mihai-dragos.html">Vadana Mihai-Dragos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Voetius on the Innate Knowledge of God &amp; the Limits of Natural Theology’ in Annals of the University of Bucharest, Philosophy Series</cite>, vol. LXV, no. 2 (2016), pp. 37-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Treatments of the history of and various schools of thought within Thomism can be found in: Romanus Cessario, A Short History of Thomism (Catholic University of America Press, 2003); Helen James John, The Thomist Spectrum (Fordham University Press, 1966); Fergus Kerr, After Aquinas: Versions of Thomism (Blackwell, 2002); Ralph M. McInerny, Thomism in an Age of Renewal (University of Notre Dame Press, 1968); and Brian J. Shanley, The Thomist Tradition (Kluwer, 2002). Useful collections of essays can be found in: Victor Brezik, ed., One Hundred Years of Thomism: Aeterni Patris and Afterwards, A Symposium (Center for Thomistic Studies, 1981); Deal W. Hudson and Dennis Wm. Moran, eds., The Future of Thomism (American Maritain Association, 1992); and the series Thomistic Papers published by the Center for Thomistic Studies at the University of St. Thomas in Houston, Texas. Jacques Maritain, St. Thomas Aquinas (Meridian Books, 1958) contains a useful collection of papal statements on the significance of Aquinas for Roman Catholic thought. Gerald A. McCool has developed a controversial interpretation of the recent history of Thomism in a series of books; see his Nineteenth-Century Scholasticism: The Search for a Unitary Method (Fordham University Press, 1989); From Unity to Pluralism: The Internal Evolution of Thomism (Fordham University Press, 1989); and The Neo-Thomists (Marquette University Press, 1994). His interpretation is debated in John F. X. Knasas, ed., Thomistic Papers VI (Center for Thomistic Studies, 1994). The Neo-Scholastic approach to Aquinas is summarized in Reginald Garrigou-Lagrange, Reality: A Synthesis of Thomistic Thought (B. Herder Co., 1950; reprinted by Ex Fontibus Co., 2006). A recent treatment of Garrigou-Lagrange’s thought is Richard Peddicord, The Sacred Monster of Thomism: An Introduction to the Life and Legacy of Reginald Garrigou-Lagrange, O. P. (St. Augustine’s Press, 2005). Presentations of existential Thomism can be found in Etienne Gilson, Being and Some Philosophers (Pontifical Institute of Medieval Studies, 1952) and Jacques Maritain, Existence and the Existent (Vintage Books, 1966). John F. X. Knasas, Being and Some Twentieth-Century Thomists (Fordham University Press, 2003) is a recent defense and Ralph McInerny, Praeambula Fidei: Thomism and the God of the Philosophers (Catholic University of America Press, 2006) a recent critique. Two recent introductions to Laval/River Forest Thomism are The Writings of Charles De Koninck, Volume 1, edited and translated by Ralph McInerny (University of Notre Dame Press, 2008) and Benedict M. Ashley, The Way toward Wisdom: An Interdisciplinary and Intercultural Introduction to Metaphysics (University of Notre Dame Press, 2006). For transcendental Thomism, see Joseph Donceel, ed., A Marechal Reader (Herder and Herder, 1970). For Lublin Thomism, see Rocco Buttiglione, Karol Wojtyla: The Thought of the Man Who Became Pope John Paul II (Eerdmans, 1997). For analytical Thomism, see the chapter on Aquinas in G. E. M. Anscombe and P. T. Geach, Three Philosophers (Basil Blackwell, 1961); John Haldane, ed., Mind, Metaphysics, and Value in the Thomistic and Analytical Traditions (University of Notre Dame Press, 2002); The Monist, Vol. 80, No. 4 (1997), a special issue on Analytical Thomism edited by Haldane; and Craig Paterson and Matthew S. Pugh, eds., Analytical Thomism: Traditions in Dialogue (Ashgate, 2006).</p></blockquote>

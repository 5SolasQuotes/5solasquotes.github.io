<main class="wrap"><figure class="quote" id="q-a483e5ffc8" data-kw="">
<blockquote><p>We think, therefore, that congruous merit is founded rather in some dignity of the work than in a promise. For the promises by which God promises pardon to penitents are not such as those by which he promises a crown of glory to those who work well. For the latter contain a true pact, which God makes with man as with a laborer about wages to be paid; but the former do not properly contain a pact about wages to be paid, but an assertion of a thing certainly to come, so that a man may be made secure of obtaining pardon if he repents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 1, ch. 21 (translated from the Latin)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f475c5af3" data-kw="">
<blockquote><p>Moreover, sure reason persuades that no one (Christ excepted), however just and holy, can merit grace de condigno for others. For there exists no pact, no promise concerning the merit of another&#x27;s salvation; and Christ alone, as head of the whole Church, had that grace by which he might merit grace and glory for all the members. … But just as it is certain that one cannot merit grace for another ex condigno, so there is no doubt that this can be done ex congruo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.21 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-d975b1fe9f" data-kw="">
<blockquote><p>Absolutely, man cannot exact anything from God, since all things are his; yet, given his will and pact, by which he wills not to require our works of us gratis but to render a reward according to the proportion of the works, we can truly exact the reward from him: just as a slave cannot absolutely ask any reward of his master, since all that the slave acquires he acquires for his master; yet if it please the master to give him his works as his own, and to promise a reward for them as though they were not owed to him, he will by right ask a reward for his works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-0fde6beadf" data-kw="">
<blockquote><p>Concerning restoration after a fall, and perseverance to the end, the opinion of theologians is agreed that these do not fall under merit de condigno. … This argument does indeed prove that restoration cannot be a reward to be rendered out of justice. For he who has lost all his merits, how can he demand a reward out of justice? But it does not prove that it is not fitting that God, of his clemency, should look upon the preceding good works, and in view of them have mercy on him who has fallen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.22 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-289bf00ef4" data-kw="">
<blockquote><p>By his good works the just man may merit for himself many graces and favours, not, however, by right and justice (de condigno), but only congruously (de congruo). Most theologians incline to the opinion that the grace of final perseverance is among the objects of congruous merit, which grace, as has been shown above, is not and cannot be merited condignly.</p></blockquote>

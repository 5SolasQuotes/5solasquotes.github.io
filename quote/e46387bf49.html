<main class="wrap"><figure class="quote" id="q-e46387bf49" data-kw="">
<blockquote><p>…for as the love of Christ, our prayers, humility, are not formally sins, but only concomitantly, in regard that sin adheres to them, as muddy water is not formally clay and mud, but in mixture it’s clay and muddy, so our faith is concomitantly sinful; both because often it’s weak, and so wanting [lacking] many degrees and mixed with sin, deserves a curse, as well as works of sanctification, but it apprehends Christ and righteousness in Him and so it bottoms our assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>(2) To evince to you the greatness and horridness of that sin [of not delighting in God]. Suffer yourselves therefore to be reasoned with to this purpose; and consider, first, that you have somewhat of delectation in your natures, that is, you have the power naturally inherent in you of taking delight in one thing or other… Therefore herein an act is not enjoined you which is incompetent to your natures, or simply impossible to you… …Yea, when you look into your disaffected hearts and find that you not only do not delight in God, but you cannot, and not for the want of the natural power, but a right inclination, should you not with astonishment bethink yourselves, every one for himself, ‘What is this that has befallen me? I am convinced this is the best good, every way most worthy of my highest delight and love, and yet my heart savors it not!&#x27;</p></blockquote>

</figure><figure class="quote" id="q-fd151550ce" data-kw="">
<blockquote><p>Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories… Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’ (2022) at Public Discourse</cite></span></figcaption>

</figure><figure class="quote" id="q-7e9ce0bb64" data-kw="">
<blockquote><p>The language of synchronic contingency [something can be contingent in different ways at the same time, and that alternatives can be contingent possibilities at the same time]… What makes the language interesting is its application to the particular case of the concurrent willing of two rational beings [God and a human person] involved in the actualization of one effect–a case in which both of the beings could will otherwise, but given that both wills taken together are the necessary and sufficient conditions for the actualization of the effect, both must be understood as freely concurrring to a single effect. That is interesting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Will &amp; Human Choice: Freedom, Contingency &amp; Necessity in Early Modern Reformed Thought Excerpt</cite>, pp. 314-315</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-40d2bfc068" data-kw="">
<blockquote><p>Man, by making bad use of free will, destroyed both himself and it. For just as he who kills himself, does not live by killing himself, nor can he resuscitate himself when he has killed himself: so, when sin was committed by a free will, with sin being the victor, free will also was lost. For by whom a man is overcome, to this one also is he addicted as a servant: whence he will not be free for doing justly, unless, being freed from sin, he has begun to be a servant of justice. But from where will this liberty be for a man who is addicted and sold, unless He redeem him, whose is that voice: ‘If the Son shall make you free, you shall be free indeed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Barthold Holtzfus, ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, sect. 9, pp. 23-24 Latin | Enchiridion to Laurentius, ch. 30</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

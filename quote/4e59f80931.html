<main class="wrap"><figure class="quote" id="q-4e59f80931" data-kw="">
<blockquote><p>And for that gesture of stretching out and lifting up hands in prayer (see Ezra 9:5; Ps. 44:20 &amp; 63:4 &amp; 141:2; 1 Tim. 2.8, which was also the preacher of those who were in much sorrow, Jer. 4:31), it is an exercise of the body, witnessing much earnestness and resignation to God, as depending only upon Him. And so it implies that our whole man (even the outward man, whereof the hands are a part, as well as the inward) should be employed in prayer; that we should be fervent and earnest in prayer, not setting about it as a work in the by; that in prayer we should resign and give up ourselves to God, to be at his disposal, without murmuring or disputing; and that we should have all out hope and expectation fixed upon Him in our prayers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Book of Job… (London, 1669) | on Job</cite>, 11:13-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe03b67d34" data-kw="">
<blockquote><p>But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded, but if I do esteem it a matter of religious necessity to God-ward, to pray in such a place rather than such, and conceive that my prayers shall be more effectual for my good there rather than elsewhere, not having any such warrant from God, I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity (1654), Second Commandment</cite>, p. 772</span></figcaption>

</figure><figure class="quote" id="q-e8e8486529" data-kw="">
<blockquote><p>The Dr. holds him upon kneeling in receiving the sacramental elements, and denies that it is scandalous or any way inductive to spiritual ruin. But (if he will) he may consider that the ruder sort who can not distinguish betwixt worshipping the bread and worshipping before the bread, nor discern how to make Christ the passive object of that worship and the bread the active, and how to worship Christ in the bread, and make the worship relative from the bread to Christ; are by his example induced to bread-worship, when they perceive bowing down before the consecrated bread in the very same form and fashion wherein Papists are seen to worship it, but can not conceive the nice distinctions which he and his companions use to purge their kneeling in that act from idolatry. As for others who have more knowledge, they are also induced to ruin, being animated by his example to do that which their consciences do condemn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637) | pt. 2</cite>, ch. 9; p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-6faeb11a13" data-kw="">
<blockquote><p>…all natural ceremonies, such as: bowing of the body before superiors, embracing of those who are dear unto us, lifting up the hands and eyes to heaven in ordinary worship, which nature itself does teach all nations to observe without any institution, though not without some government of counsel, nor without such variety, as nature itself is subject unto…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in Worship… (1633)</cite>, p. 27</span></figcaption>

</figure><figure class="quote" id="q-087cf1b950" data-kw="">
<blockquote><p>Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words… With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship, in Three Parts in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Parkhurst, 1684), pt. 3, section 6</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

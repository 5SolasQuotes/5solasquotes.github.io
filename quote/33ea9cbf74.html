<main class="wrap"><figure class="quote" id="q-33ea9cbf74" data-kw="">
<blockquote><p>Hence, also, we see the error of those who, in comparing the Law with the Gospel, represent it merely as a comparison between the merit of works, and the gratuitous imputation of righteousness. This is indeed a contrast not at all to be rejected. For Paul often means by the term “law” the rule of righteous living by which God requires of us what is his own, giving us no hope of life unless we completely obey him, and adding on the other hand a curse if we deviate even in the slightest degree. This Paul does when he contends that we pleasing to God through grace and accounted righteous through his pardon, because nowhere is found that observance of the law for which the reward has been promised. Paul therefore justly makes contraries of the righteousness of the law and that of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, 2.9.4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0097125d6" data-kw="">
<blockquote><p>For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.’ If it was ‘by Promise,’ then it was ‘by faith,’ for faith only receives the Promise; if it was by the Law, then it was by works, for works only fulfil the Law. True, the Law was afterwards added to the Promise, but not to disannul or to supersede it; on the contrary, it was itself a dispensation of the covenant of grace, for it was proclaimed in the name of the ‘God of Abraham, and Isaac, and Jacob;’ and if it republished in all their rigour the original terms of the covenant of works, it was only ‘because of transgressions, till the seed should come to whom the Promise was made.’ It was for conviction of sin, for ‘the Law worketh wrath,’ and is a ‘ministration of death;’ but, as such, it was ‘our schoolmaster to bring us unto Christ, that we might be justified by faith.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture (Edinburgh: T&amp;T Clark, 1867), 52–53.</cite></span></figcaption>

</figure><figure class="quote" id="q-01aff859f5" data-kw="law uses schoolmaster">
<blockquote><p>As the doctrine concerning the law of God properly belongs to the theologian, so it has a multiple use in theology. (1) For the direction of life—as a perfect rule of God’s right over man and of man’s duty towards God. (2) For a knowledge of sin (Rom. 3:20). (3) For preparation for grace—in which sense it is called “a schoolmaster unto Christ,” Gal. 3:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.1.1</span></figcaption>

</figure><figure class="quote" id="q-07640ab15d" data-kw="">
<blockquote><p>Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.</p></blockquote>

</figure><figure class="quote" id="q-773bd4c750" data-kw="sixth commandment homicide">
<blockquote><p>Because various cases can occur in which homicide can either be lawful or unlawful and to be condemned, hence arises the question—What is prohibited in the sixth precept, “Thou shalt not kill,” and what is not? First negatively, judicial homicide is not prohibited. Are the rights of war and punishment contained under this commandment? Are suicide and duelling prohibited? The former we deny; the latter we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.16.1–2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-316d2c3264" data-kw="">
<blockquote><p>The varied and resplendid riches which are contained it this treasury it is no easy matter to express in words; so much so, that I well know that whatever I shall be able to say will be far from approaching the excellence of the subject. But as it is better to give to my readers some taste, however small, of the wonderful advantages they will derive from the study of this book, than to be entirely silent on the point, I may be permitted briefly to advert to a matter, the greatness of which does not admit of being fully unfolded. I have been accustomed to call this book, I think not inappropriately, “An Anatomy of all the Parts of the Soul;” for there is not an emotion of which any one can be conscious that is not here represented as in a mirror.

Or rather, the Holy Spirit has here drawn to the life all the griefs, sorrows, fears, doubts, hopes, cares, perplexities, in short, all the distracting emotions with which the minds of men are wont to be agitated. The other parts of Scripture contain the commandments which God enjoined his servants to announce to us. But here the prophets themselves, seeing they are exhibited to us as speaking to God, and laying open all their inmost thoughts and affections, call, or rather draw, each of us to the examination of himself in particulars in order that none of the many infirmities to which we are subject, and of the many vices with which we abound, may remain concealed.

It is certainly a rare and singular advantage, when all lurking places are discovered, and the heart is brought into the light, purged from that most baneful infection, hypocrisy. In short, as calling upon God is one of the principal means of securing our safety, and as a better and more unerring rule for guiding us in this exercise cannot be found elsewhere than in The Psalms, it follows, that in proportion to the proficiency which a man shall have attained in understanding them, will be his knowledge of the most important part of celestial doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: xxxvi-vii.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fd42635e2c" data-kw="">
<blockquote><p>It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolize the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal Chronicles attribute its introduction to Pope Vitalian. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore they do wrong that mumble foolishly before God the canonical hours as if superstitious chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13). But to say seven times “glory to God” means that we worship God constantly in Spirit and in truth because seven times means many times — without end (Matt 18; Luke 17; Jerome, Augustine, and Hillary on these passages).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-reformed-churches.html">Hungarian Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hungarian Confessio Catholica</cite>, (1562) in Reformed Confessions of the 16th and 17th Centuries in English Translation, ed. James T. Dennison, Jr., 4 vol. (Grand Rapids: Reformation Heritage Books), 2.565–66.</span></figcaption>

<blockquote><p>Writing to Queen Elizabeth I of England, Peter Martyr reminded her that it was the duty of the civil magistrate to put the advance of Christ’s kingdom before all other things:

For it behoveth that you restore again in this place the holy Gospel of Christ, which through injury of the times and importunity of the adversaries, hath lien some years past neglected, I will not say trodden under foot. This if you shall perform, all things shall happen prosperously unto you, no less than they did unto most godly king David. For it be said unto every Christian man, that he should first seek the kingdom of God, then other things should easily be supplied, shall we not think that the same is commanded unto kings? Certes, if it be commanded all men to worship God most sincerely, kings are not exempted from the precept: nay rather the greater estate they bear amongst men, the more are they bound to that law of God.</p></blockquote>

<blockquote><p>IN the blessed Life of our Saviour we read once and again of his going into the Synagogues, to attend the public Worship of God on the Sabbath days. Luke 4.6. As his Custom was he went into the Synagogue on the Sabbath day. This he did to teach and require us to keep the Sabbath as he did. He has given us this Example that we should follow his steps. So he served and worshiped God, fulfilling all Righteousness, and so must we. He came not to destroy the Law and the Prophets, but to fulfil them. Had he put an end to the Sacred weekly Sabbath, it had destroyed the Law and the Prophets with a witness.

But Christ fulfilled this Law, and kept many a Sabbath to the glory of God in a perfect manner, so as no mere man, nor all the Holy men of God together, ever did or can do. He has taught us how to Sabbatise; how to spend our Sabbaths in the solemn Assemblies, and in works of piety and mercy. Many a high Exercise of devotion, and many a good work of charity, did he upon the Sabbath-day. He fill’d up the Holy time with work, and the work with Spirit. For these very works of God like goodness he was sometimes reproached as a breaker of the Sabbath; but it turned to the confusion of his ignorant and superstitious, if not hypocritical and malicious Accusers. As in Mark 3. Init. He sanctified and honoured the Sabbath by his divine Sermons, and by his miracles of mercy on that blessed day. He made it a Day of his Blessing to men, both on temporal and spiritual accounts. Luk. 13.10, 17.

He kept that blessed Law for his Elect, which Believers themselves keep so poorly and imperfectly.—He also taught his Disciples and followers to observe and keep the Sabbath-day, Indeed some of the superstitious Pharisees did sometimes tax the Disciples with taking undue liberties on the Holy Sabbath. But what was it? they plucked an ear of corn and eat of it as they passed thro’ a field. They were hungry and it was but a proper and needed taste, and an ordinary hasty bit, for their support and refreshment in the services of the day.

The Women also that followed our Lord Jesus, and ministered unto him, were strict Sabbatizers: Luk. 23. ult. They rested on the Sabbath day according to the Commandment. Tho’ they were preparing spices for the dead body of their dear Saviour, yet they laid by the holy care and labour of love till the Sabbath was over. Verily God’s Sabbaths did they keep; even as if the words of my Text were then in their remembrance, and they considered that as the holy work of the Tabernacle was to give place to the holy Rest of God’s day, so their pious ministering to that sacred Temple of the Deity, our Lord’s Body.—And that was the last Seventh day Sabbath which the Disciples kept.

For early in the morning of the next day, being the first day of the week these Women came unto the Sepulchre, bringing the Spices which they had prepared; and they found not the Body of Jesus, but had a vision of Angels who told them of his resurrection from the dead.— And that same day the Lord himself appeared several times to one and another of his Followers; to Mary Magdalene, to the two disciples on their way to Emmaus, to Simon, and to the ten together in the Evening: when he blessed them, breathed on ’em, and gave them their Commission.

That day seven night, being again the first day of the week, the Lord appeared again unto them, Thomas being then present, and shewed them his hands and his feet.— Now by the Resurrection of Christ on the first day of the week, and by his repeated visits to them on this day, the Inspired Apostles (under the infallible Conduct of the Holy Ghost) from thenceforth held their solemn Meetings, their holy Convocations, on this day of the seven, and called it the Lord’s-Day.— On this first day of the week, the Disciples were all with one accord in one place, assembled as on their holy Sabbath, when suddenly there appeared the cloven Tongues of fire and sat upon them, and they were all filled with the Holy Ghost; and spake in every language the wonderful works of God; the proper service of the Sabbath day.

That this day of Pentecost was the first day of the week is easily computed and proved. The day after the Passover was the first day of the feast of unleavened bread; (see Lev. 23.5, 6.) which was as a Sabbath to the Jews; They were to have an holy Convocation on it, and to do no servile work thereon. On the next day was the Offering of the first-fruits unto the Lord: And from this day, (the next but one after the Passover) they were ordered to count fifty days, or seven weeks complete; and then was the feast of Pentecost, so called from the fiftieth day.

Now see how these things were all fulfilled in the Dying and Resurrection of our Lord Jesus, and in the pouring out of the Spirit on the day of Pentecost.— Our blessed Lord Jesus was slain at the Passover, which fell that year on a fryday: Then was the Lamb of God offered, Christ our Passover sacrificed for us.— That Evening therefore was the preparation, as it is called John 19.31. scil. the preparation both for the weekly Sabbath, and also for the Feast of unleavened bread; which made that Sabbath a high day. The Jews therefore were earnest with Pilate to have the Bodies taken down early from the Cross. This whole Sabbath our Lord’s Body lay in the grave.

And the next morning early, being the first day of the week, the next day but one after the Passover, the day of the offering of the first-fruits unto the Lord, he rose from the dead, and became the first-fruits of them that sleep. Now compute just seven weeks from this day of our Lord’s Resurrection, and the first day of the eighth week, even the fiftieth day, was the day of Pentecost; when the Spirit, (the promise of the Father) was poured out from the ascended Jesus upon his Apostles, as they were assembled together for his solemn Worship.</p></blockquote>

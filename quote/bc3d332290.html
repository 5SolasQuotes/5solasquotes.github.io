<main class="wrap"><figure class="quote" id="q-bc3d332290" data-kw="">
<blockquote><p>2. To behave ourselves as those that do expect this help, not tempting God, not grieving the angels; We should take heed how we carry ourselves in regard of this honorable attendance; our sins and vanity offends them, as it does God… Angels are pure and holy creatures that still abode in the truth; pride, lust, and vanity is very offensive to them, especially impurities and undecencies in God’s worship, about which they have a special attendance; therefore the apostle bids the women to cover their heads because of the angels, 1 Cor. 11:10, their fashion being to come into the congregation with loose dishevelled locks, he minds them of the presence of the angels: We may use a like argument to women to cover their naked breasts, now their immodesty is grown so impudent as to out-face the ordinances of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Notes on the Epistle of Jude</cite>, … (London, 1658), verse 9, Question &amp; Answer 4, pp. 371-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4122de5616" data-kw="">
<blockquote><p>…for when the Word determines not, conscience (though misinformed) casts the balance to the side which it judges to be necessary; As for instance, if a man think it a sin to hear the Word with the head uncovered, he is oblidged to cover his head, and contrarily; For conscience there casts the balance: but when the thing is unlawful on the matter, it may bind him up, while it remains in an error, so as he cannot without sin counteract its dictate; but it never oblidges him to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven upon Earth, in the Serene Tranquillity &amp; Calm Composure, in the Sweet Peace &amp; Solid Joy of a Good Conscience</cite>, ... (Edinburgh, 1685), sermon 2, on Acts 24:16, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-cdc29cae6a" data-kw="">
<blockquote><p>8th Practice. In some parish-churches where the sectaries are put in, they have put down all singing of psalms… and will not suffer the parishes to enjoy any singing of psalms; and in other places, they begin to put down all prayer in the public assemblies, and to say there must be only discoursing and preaching; and in places where they cannot prevail to shut out singing of psalms, they in a contemptuous manner clap on their hats in the time of singing of psalms, and having been pulled off, put them on again; yea in prayer also many of them keep on hats.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or a Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time, Vented &amp; Acted in England in these Four Last Years</cite>, … (London, 1646), Catalogue, ‘Some Passages in the Prayers of the Sectaries’, pp. 56-57. See also the Third Part, New &amp; Further Discovery, ‘A Passage sent in a letter dated June 16, 1646…’, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

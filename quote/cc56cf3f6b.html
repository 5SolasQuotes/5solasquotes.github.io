<main class="wrap"><figure class="quote" id="q-cc56cf3f6b" data-kw="">
<blockquote><p>And the covenants of God with men are of two sorts:

1. Legal, when upon condition of present and continued obedience to all his precepts, He promises life eternal.

2. Evangelical, when upon condition of repentance, faith and newness of life, He promises forgiveness of sins, and eternal life through Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Foundation of Religion long since collected by that Judicious and Elegant man, Mr. Henry Ainsworth</cite>, ed. Samuel White, The Orthodox Foundation of Religion long since collected by that judicious and elegant man, Mr. Henry Ainsworth (London: Sparke, 1641), pt. 2, Mystery of Piety, p. 75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“And the covenants of God with men are of two sorts:

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80078c0f33" data-kw="">
<blockquote><p>1. From what has been said above, it must now be clear, that all whom, from the beginning of the world, God adopted as his peculiar people, were taken into covenant with him on the same conditions, and under the same bond of doctrine, as ourselves; but as it is of no small importance to establish this point, I will here add it by way of appendix, and show, since the Fathers were partakers with us in the same inheritance, and hoped for a common salvation through the grace of the same Mediator…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 1, bk. 2, ch. 10, sect. 1, p. 501</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><figure class="quote" id="q-bfdf633058" data-kw="">
<blockquote><p>Question: But why is God pleased to promise to give unto his people in Covenant spiritual blessings as well as temporal? … …Spiritual blessings are necessary for them in relation unto that eternal life… Heb. 12:13… Lo, here is a necessity of holiness and regeneration for salvation, and they are congruous, and fitting us for salvation, or eternal life… It is meet to enjoy grace before we come to enjoy glory; it is meet to have a conformity to Christ on his cross before we come to have a conformity to Christ in his crown, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed in the Everlasting Covenant</cite>, ... (London, 1660), pt. 2, ch. 1, p. 337</span></figcaption>

</figure><figure class="quote" id="q-cfae9ab62b" data-kw="">
<blockquote><p>And this is clear by all covenants in the Word of God: even the covenant between God and man is in like manner mutual — “I will be your God, and ye shall be my people.” The covenant is so mutual, that if the people break the covenant, God is loosed from his part of the covenant, Zech. 11:10. The covenant gives to the believer ‘a sort of action of law,’ and jus quoddam, to plead with God in respect of his fidelity to stand to that covenant that binds him by reason of his fidelity, Isa. 43:26; 63:16; Dan. 9:4-5;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><figure class="quote" id="q-7ad3f7ddc9" data-kw="">
<blockquote><p>712. It has also been said that God invites the sinner to the possession of these goods under the condition of faith which we described in chapter 14. This is the proposition of the covenant of grace.

713. But we have warned that God does not weigh this condition as being brought about by the sinner’s own power. Indeed, the sinner is a slave to sin, and inept to any spiritual good on his own.</p></blockquote>

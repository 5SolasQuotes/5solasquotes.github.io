<main class="wrap"><figure class="quote" id="q-db2c23d041" data-kw="">
<blockquote><p>It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good and not to hurt them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’</cite>, pp. 208-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-12a977f408" data-kw="">
<blockquote><p>Yet know and consider that God’s power in thus abandoning all mankind for their sin in Adam is far inferior to that power He showed in cruciating his own Son, his most innocent and holy Son, in making his soul an offering for our sin. And that God has power, not only to annihilate the holiest (which is without all question), but to inflict upon him any pain. Medina is bold to profess, Ex concordi omnium theologorum sententia [according to the harmonious judgment of all theologians]; And Vasques the Jesuit acknowledges as much, though herein, they say, He should not cary himself as Judex [a Judge], but as Dominus vitae et mortis [the Lord of life and death].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort and Arles, Reduced to the Practice… (Amsterdam: Thorp, 1631), pt. 1, 1st section</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

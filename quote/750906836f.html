<blockquote><p>The law of nature is the rule of good and evil, inscribed by God on man’s conscience, even at his creation, and therefore binding upon him by divine authority. That such a law was connate with, and as it were implanted in the man, appears from the reliques, which, like the ruins of some noble building, are still extant in every man; namely, from those common notions, by which the heathens themselves distinguished right from wrong, and by which “they were a law to themselves, which shews the work of the law written in their hearts, their conscience bearing witness,” Rom. ii. 14, 15. From which we gather, that all these things were complete in man, when newly formed after the image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank (1677; 2 vols, London, 1822), i, p. 60, 1.3.2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec3ab1befd" data-kw="">
<blockquote><p>§6. The reasons of this are obvious and clear. Even because it is the office of the governors to determine of such circumstances: It is the pastor’s office to guide and oversee the flock. And so the determining of time and place of worship (that’s undetermined) belongs to his office: and the choice of the subject on which he shall preach, the leading them in prayer and praise, and choice of versions, translations and other ordinary helps in his work. And therefore when he determines these, he is but in his own way and does but his own work: and therefore he is therein the judge, if the case be controvertible. If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied. We are sure that God has commanded us to obey them that are over us in the Lord (1 Thess. 5:12; Heb. 13:7, 17, etc.), and therefore a certain duty may not be forborn upon uncertain conjectures, or upon every miscarriage in them that we owe it to. This would unchurch all Churches (as they are political societies). For if pastors be taken down, and the work of pastors, the Church is taken down; and if government and obedience be taken down, then pastors and their work is taken down, which will be the fruit of this disorder.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659) | ch. 12, ‘It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded’, pp. 461-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-9ce12e49f8" data-kw="">
<blockquote><p>The political law is what determines the duties of the governing officials and the subjects of the Israelite nation by means of certain civil regulations. It lends authority to them through the corporal punishment of those who rebel, in keeping with the norm of the Decalogue’s two tables, and in particular the second one.

The foremost use of this political law is that by the precise keeping of the precepts of the moral and ceremonial laws, justice might thrive in conjunction with piety especially among the Jews. Even to the present day governing officials and their subjects one and all are obliged to obey those precepts in this political law that belong to the universal law; however, the ones that belong to the particular Jewish [political] law have become obsolete along with the Mosaic system of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-polyander.html">Johannes Polyander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, trans. Riemer A. Faber, eds. William Den Boer and Riemer A. Faber (1625; 2 vols, Landrum SC: Davenant Press, 2023), 18.49-51, i, pp 188-89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Question 8: May a guilty person plead not guilty, or deny the fact? Answer: Common use is the interpreter of words: If the common use of those words does make their public sense a lie, it may not be done. But if the forensic [legal] common use of the denial is taken to signify no more but this, ‘Let him that accuses me, prove it’ [then]: I am not bound to accuse my self, or, in foro [in court] I am not guilty till it be proved, then it is lawful to plead ‘not-guilty’ and deny the fact, except in cases wherein you are bound to an open confession, or in which the scandal will do more hurt than the denial will do good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>3. The goodness or badness of a human action may be considered two ways, viz. either in actu signato [in the signified act] and quo ad speciem [as to the species], or in actu exercito [in the exercised act] and quo ad individuum [as to the individual thing]. For an action is said to be specificated by its object and individuated by its circumstances. So that when an action is good or evill in respect of the object of it, then it is called good or evil quo ad speciem. When it is good or evil in respect of the circumstances of it, then it is said to be good or evil quo ad individuum. … 6. Every thing which is indifferent in the nature of it is not by-and-by indifferent in the use of it. But the use of a thing-indifferent ought evermore to be either choosed or refused, followed or forsaken, according to these three rules delivered to us in God’s Word: 1. the rule of piety, 2. the rule of charity, 3. the rule of purity. … We may not for the commandment of men transgress the rule of piety by doing any thing which is not for God’s glory and ordered according to his will; neither ought any of us to obey men except for the Lord’s sake and as the servants of Christ, doing the will of God, which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ and as if Christ commanded it]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity, but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly, may we obey men so as to break the law of purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information… … 2. As for those actions which proceed from the deliberation of reason, howbeit many of them be indifferent quo ad speciem, yet none of them is, nor can be indifferent quo ad individuum. The reason of this difference and distinction is because every action has its species or kind from the object; and a human moral action has its species or kind from the object referred to the original of human actions, which is reason. Whereupon it comes that if the object of the action include something that agrees to the order of reason, it shall be a good action according to it’s kind: for example, to give alms to an indigent man. But if it include something that is repugnant to the order of reason, it shall be an evil action according to its kind, as to steal or take away another man’s goods. Now sometimes it happens that the object of an action does not include something that belongs to the order of reason, as to lift a straw from the ground, to go to the field etc. such actions are indifferent, according to their kind. But we must pronounce far otherwise of them, when we speak of them quo ad individuum, because as they are individuated by their circumstances, so in their individual being they have their goodness or badness from the same circumstances, as has been showed. So that no such action as is deliberated upon can be indifferent quo ad individuum; because oportet [it is needful] says Thomas, quod quilibet individualis actus habeat aliquam circumstantiam, per quam trahetur ad bonum, vel malum, ad minus ex parte intentionis finis [every individual act has some circumstance, through which it is drawn to the good or bad, to a lesser degree, from the part of the intention of the end].</p></blockquote>

action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information… … 2. As for those actions which proceed from the deliberation of reason, howbeit many of them be indifferent quo ad speciem, yet none of them is, nor can be indifferent quo ad individuum. The reason of this difference and distinction is because every action has its species or kind from the object; and a human moral action has its species or kind from the object referred to the original of human actions, which is reason. Whereupon it comes that if the object of the action include something that agrees to the order of reason, it shall be a good action according to it’s kind: for example, to give alms to an indigent man. But if it include something that is repugnant to the order of reason, it shall be an evil action according to its kind, as to steal or take away another man’s goods. Now sometimes it happens that the object of an action does not include something that belongs to the order of reason, as to lift a straw from the ground, to go to the field etc. such actions are indifferent, according to their kind. But we must pronounce far otherwise of them, when we speak of them quo ad individuum, because as they are individuated by their circumstances, so in their individual being they have their goodness or badness from the same circumstances, as has been showed. So that no such action as is deliberated upon can be indifferent quo ad individuum; because oportet [it is needful] says Thomas, quod quilibet individualis actus habeat aliquam circumstantiam, per quam trahetur ad bonum, vel malum, ad minus ex parte intentionis finis [every individual act has some circumstance, through which it is drawn to the good or bad, to a lesser degree, from the part of the intention of the end].”

— George Gillespie, English Popish Ceremonies, ([1637]), pt. 4, ch. 3, pp. 7-8 &amp; 11-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+The+goodness+or+badness+of+a+human+action+may+be+considered+two+ways%2C+viz.+either+in+actu+signato+%5Bin+the+signified+act%5D+and+quo+ad+speciem+%5Bas+to+the+species%5D%2C+or+in+actu+exercito+%5Bin+the+exercised+act%5D+and+quo+ad+individuum+%5Bas+to+the+individual+thing%5D.+For+an+action+is+said+to+be+specificated+by+its+object+and+individuated+by+its+circumstances.+So+that+when+an+action+is+good+or+evill+in+respect+of+the+object+of+it%2C+then+it+is+called+good+or+evil+quo+ad+speciem.+When+it+is+good+or+evil+in+respect+of+the+circumstances+of+it%2C+then+it+is+said+to+be+good+or+evil+quo+ad+individuum.+%E2%80%A6+6.+Every+thing+which+is+indifferent+in+the+nature+of+it+is+not+by-and-by+indifferent+in+the+use+of+it.+But+the+use+of+a+thing-indifferent+ought+evermore+to+be+either+choosed+or+refused%2C+followed+or+forsaken%2C+according+to+these+three+rules+delivered+to+us+in+God%E2%80%99s+Word%3A+1.+the+rule+of+piety%2C+2.+the+rule+of+charity%2C+3.+the+rule+of+purity.+%E2%80%A6+We+may+not+for+the+commandment+of+men+transgress+the+rule+of+piety+by+doing+any+thing+which+is+not+for+God%E2%80%99s+glory+and+ordered+according+to+his+will%3B+neither+ought+any+of+us+to+obey+men+except+for+the+Lord%E2%80%99s+sake+and+as+the+servants+of+Christ%2C+doing+the+will+of+God%2C+which+teaches+us+the+manner+how+we+ought+to+obey+men%2C+namely%2C+propter+Christum+et+sicut+Christus+praecipit+%5Bfor+Christ+and+as+if+Christ+commanded+it%5D.+For+if+we+should+know+no+more+but+the+will+of+man+for+that+which+we+do%2C+then+we+should+be+the+servants+of+men%2C+not+the+servants+of+Christ.+Neither+yet+may+we+for+any+human+ordinance+break+the+rule+of+charity%2C+but+whatsoever+either+would+weaken+or+not+edify+our+brother%2C+be+it+never+so+lawful%2C+never+so+profitable+to+ourselves%2C+never+so+powerfully+by+earthly+authority+enjoined%2C+Christians%2C+who+are+not+born+unto+themselves+but+unto+Christ%2C+unto+his+Church+and+unto+the+fellow+members%2C+must+not+dare+to+meddle+with+it.+Nor+lastly%2C+may+we+obey+men+so+as+to+break+the+law+of+purity%2C+and+perform+any+action+with+a+doubtful+conscience%2C+that+is%2C+whereof+either+the+Word+has+not%2C+or+we+out+of+it+have+no+warrant%3A+in+which+case+tender+consciences+must+be+tendered+rather+than+be+racked+by+authority%3A+for+be+the+things+in+themselves+never+so+lawful%2C+etc.%2C+they+are+utterly+unlawful+to+me+without+such+information%E2%80%A6+%E2%80%A6+2.+As+for+those+actions+which+proceed+from+the+deliberation+of+reason%2C+howbeit+many+of+them+be+indifferent+quo+ad+speciem%2C+yet+none+of+them+is%2C+nor+can+be+indifferent+quo+ad+individuum.+The+reason+of+this+difference+and+distinction+is+because+every+action+has+its+species+or+kind+from+the+object%3B+and+a+human+moral+action+has+its+species+or+kind+from+the+object+referred+to+the+original+of+human+actions%2C+which+is+reason.+Whereupon+it+comes+that+if+the+object+of+the+action+include+something+that+agrees+to+the+order+of+reason%2C+it+shall+be+a+good+action+according+to+it%E2%80%99s+kind%3A+for+example%2C+to+give+alms+to+an+indigent+man.+But+if+it+include+something+that+is+repugnant+to+the+order+of+reason%2C+it+shall+be+an+evil+action+according+to+its+kind%2C+as+to+steal+or+take+away+another+man%E2%80%99s+goods.+Now+sometimes+it+happens+that+the+object+of+an+action+does+not+include+something+that+belongs+to+the+order+of+reason%2C+as+to+lift+a+straw+from+the+ground%2C+to+go+to+the+field+etc.+such+actions+are+indifferent%2C+according+to+their+kind.+But+we+must+pronounce+far+otherwise+of+them%2C+when+we+speak+of+them+quo+ad+individuum%2C+because+as+they+are+individuated+by+their+circumstances%2C+so+in+their+individual+being+they+have+their+goodness+or+badness+from+the+same+circumstances%2C+as+has+been+showed.+So+that+no+such+action+as+is+deliberated+upon+can+be+indifferent+quo+ad+individuum%3B+because+oportet+%5Bit+is+needful%5D+says+Thomas%2C+quod+quilibet+individualis+actus+habeat+aliquam+circumstantiam%2C+per+quam+trahetur+ad+bonum%2C+vel+malum%2C+ad+minus+ex+parte+intentionis+finis+%5Bevery+individual+act+has+some+circumstance%2C+through+which+it+is+drawn+to+the+good+or+bad%2C+to+a+lesser+degree%2C+from+the+part+of+the+intention+of+the+end%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%28%5B1637%5D%29%2C+pt.+4%2C+ch.+3%2C+pp.+7-8+%26+11-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1edd077b99.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1edd077b99.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=3.%20The%20goodness%20or%20badness%20of,of%20the%20intention%20of%20the%20end&amp;text=3.%20The%20goodness%20or%20badness%20of%20a%20human&amp;text=the%20part%20of%20the%20intention%20of%20the%20end" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-c0ec2b77c9" data-kw="">
<blockquote><p>Now, what is faith but a believing, a trusting, or relying act of the soul? What, then, must it rely upon or trust in? Not in itself; that is, without Scripture; not in its works, they are inferior to itself; besides, this is the way to make even the works of faith the mediator between God and the soul, and so by them thrust Christ out of doors; therefore it must trust in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification by an Imputed Righteousness</cite></span></figcaption>

<blockquote><p>That God cannot but prove efficient when those means are used for the salvation of men which he himself hath ordained for that purpose. Although, therefore, the preaching of the Gospel by men weak, despised, defiled by sin, may seem an insignificant means to the attainment of human salvation; yet, since it is the ordinance and will of God, it will prove most effectual: for the foolishness of God is wiser than men, and the weakness of God is stronger than man, 1 Cor. i. 25. There will be no need therefore to expect either an angel from heaven, or extraordinary visions and divine revelations; we have only to hearken to apostolic doctrine, and it will be the power of God to salvation to all that believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 9.</span></figcaption>

<blockquote><p>Northampton, May 18, 1742.

My dear Friend,

I am fully satisfied by the account your father has given me, that you have lately gone out of the way of your duty, and done that which did not belong to you, in exhorting a public congregation. I know you to be a person of good judgment and discretion, and therefore can with the greater confidence put it to you to consider with yourself what you can reasonably judge would be the consequence, if I and all other ministers should approve and publicly justify such things as laymen’s taking it upon them to exhort after this manner? If one may, why may not another? And if there be no certain limits or bounds, but every one that pleases may have liberty, alas! what should we soon come to? If God had not seen it necessary that such things should have certain limits and bounds, he never would have appointed a certain particular order of men to that work and office, to be set apart to it in so solemn a manner, in the name of God: the Head of the church is wiser than we, and knew how to regulate things in his church.

’Tis no argument that such things are right, that they do a great deal of good for the present, and within a narrow sphere; when, at the same time, if we look on them in the utmost extent of their consequences, and on the long run of events, they do ten times as much hurt as good. Appearing events are not our rule, but the law and the testimony. We ought to be vigilant and circumspect, and look on every side, and, as far as we can, to the further end of things. God may if he pleases, in his sovereign providence, turn that which is most wrong to do a great deal of good for the present; for he does what he pleases. I hope you will consider the matter, and for the future avoid doing thus.

You ought to do what good you can, by private, brotherly, humble admonitions and counsels; but ’tis too much for you to exhort public congregations, or solemnly to set yourself, by a set speech, to counsel a room full of people, unless it be children, or those that are much your inferiors, or to speak to any in an authoritative way. Such things have done a vast deal of mischief in the country, and have hindered the work of God exceedingly. Mr. [Gilbert] Tennent has lately wrote a letter to one of the ministers of New- England, earnestly to dissuade from such things.

Your temptations are exceeding great: you had need to have the prudence and humility of ten men. If you are kept humble and prudent, you may be a great blessing in this part of the land, otherwise you may do as much hurt in a few weeks as you can do good in four years. You might be under great advantage by your prudence to prevent those irregularities and disorders in your parts, that prevail and greatly hinder the work of God in other parts of the country; but by such things as these you will weaken your own hands, and fill the country with nothing but vain and fruitless and pernicious disputes. Persons when very full of a great sense of things are greatly exposed; for then they long to do something, and to do something extraordinary; and then is the devil’s time to keep them upon their heads, if they be not uncommonly circumspect and self-diffident.

I hope these lines will be taken in good part, from your assured friend,

Jonathan Edwards.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Anon., 18 May 1742 in Edwards A. Park, ‘What can be done for augmenting the number of Christian ministers?’, Bibliotheca Sacra, 28, no. 109 (January 1871), pp 95-96.</cite></span></figcaption>

<blockquote><p>The rules here shall be:

A. Controversies shall not be shall not be sought out without necessity, because of the loss of time.

B. Yet, on the other hand, when there is an imminent danger to the church from these controversies, and thus your hearers must be equipped, controversies shall not be neglected.

C. Those controversies that have been buried shall not be exhumed, and those that are unknown shall not be made known, lest in refuting them we teach them.

D. We should not employ any arguments and solutions except solid ones, suitable for bringing a man to conviction, willing or not.

E. We should not be excessively labourious in this business, so that practice is not suspended or excluded.

F. Let us exert ourselves so that even the elenctic part, however much it can be done, is handled in a practical manner, that is, so that it is made manifest that the emphasis and power of the truth to be defended and the falsehood to be refuted is either to promote or to hinder piety, as well as eternal salvation.</p></blockquote>

<blockquote><p>15… As for the differences which arose about the public resolutions [in the late-1640’s], they made a division indeed in the Church, but no schism, at lest in worship (of which we speak), but only in government, except by accident in some places where presbyteries divided themselves, whereupon followed opposite ordinations, which brought in division among the people, some adhering to one minister, some to another. But I never heard that any held it unlawful to hear ministers on either side, though comparatively they judged it duty rather to hear others. By the way I wish the question about hearing of curates had never come a greater length. See below. However (as dogs, they say, gars swine ‘gree (make to agree)) by the reintroduction of prelacy [in 1661] this difference was buried, as fire under ashes.” Ministers, who had before been putting and thrusting at one another, being, by this, put all an one condition, that is, thrust all out together [in 1662, for 30% of the ministry], except those who complied with Prelacy [or rather a relatively low form of episcopacy]. These, and others whom the prelates and tey put in, occupying the room of pastors, debates arose among presbyterians, ministers and others, anent the lawfulness or unlawfulness, duty or sin of hearing them. Some pleading compliance in hearing, to prove it sinful; some pleading separation in withdrawing to prove hearing to be duty: Some pleading soundness in doctrine to prove it lawful and duty to hear, some pleading corruption in government to prove it unlawful and sinful. And though these different pleadings, accompanied with different practices, in hearing or not hearing curates, as they were called, made no schism among presbyterians. In regard, ministers, who heard and who heard not, preached sometimes privately; and people of either practice heard any of them indifferently. Yet, in these debates, some laid down principles, which, if followed out, would oblige them to hear none that were not of their mind or way, in all matters whether of judgment or practice, which were too much improven afterward. (See Dr. [Gilbert] Rule’s Rational Defence of Non-Conformity, and Mene Tekel)</p></blockquote>

<blockquote><p>…a minister of the gospel may often preach the law to his hearers and yet not deserve to be called a legal preacher. He cannot preach the gospel faithfully and successfully unless he preaches the law in subservience to it. If he is a faithful and able minister of the New Testament, he will preach the law as a covenant of works and will press it on the consciences of secure sinners and self-righteous formalists. He will denounce the tremendous curse of it on those who continue under it and who rely securely on their own works for a title to eternal life in order to tear away every pillow of carnal security on which they repose themselves and to show them the vanity of every lying refuge. In proportion also as he is faithful, he will preach the law as a rule of life to them who believe. He will press on them the spiritual performance of every duty and a holy abhorrence of every sin. He will exhort them to perform all their duties from evangelical principles in a holy manner and to holy ends. Now if he preach the law in that manner, no man will be disposed to fix the odious character of a legal preacher on him but one who either is grossly ignorant or is an enemy both of the law and of the gospel.</p></blockquote>

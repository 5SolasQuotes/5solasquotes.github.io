<main class="wrap"><figure class="quote" id="q-181c0d1f0b" data-kw="">
<blockquote><p>If these be the invariable fruits of a well-directed Sabbath observance, is not this institute inseparably bound up with the general well-being and prosperity of nations? Can any community undervalue and neglect it with impunity? Must not its desecration, especially that systematic desecration which is enforced by the authority of a nation, in the shape of Sabbath mails, and Sabbath travelling, and Sabbath recreations, and, in some kingdoms, of national assemblages, processions, and ceremonials on this day — must not such authoritative desecration, sooner or later, by disparaging divine authority, perverting individual conscience, and diminishing facilities for religious instruction, deteriorate the moral feelings and principles of a people, weaken their convictions of duty, and thus directly injure the character and happiness of a nation?

Can the good of a people be promoted by rendering them less intelligent, less religious, and less moral, than they might otherwise have been? Can that kingdom enjoy substantial prosperity, the mass of whose population are retained within the bounds of an outward decency and morality, merely by the conventional restraints of society, and not by deep and honest convictions of duty? And how are these salutary convictions to exist apart from a well-grounded knowledge of God, and an intelligent acquaintance with the principles of Christian doctrine and morals? How are the mass of a community to acquire this religious knowledge, which is the only stable foundation of a holy life, if there be no Sabbath cessation from daily toil, no Sabbath assemblies, no Sabbath instruction in and out of the church; and if there be, for the rising generation, no Sabbath training at home, and no early familiarity with the soul-stirring and life-giving themes of religion?

The history of nations amply confirms these views of the national value of the Sabbath. Look where we may, we find them corroborated in the progress and advancement of the Sabbath-honouring and Sabbath-keeping communities, and in the partial and unstable progress of those that profane and abuse this day. The scale of national prosperity, whether in the Old World or in the New, may be graduated by the degree of respect and reverence for the Sabbath which is prevalent in each state. In the Old World, let Britain be contrasted with Spain; or in the New, let the United States be contrasted with Mexico or any of the South American republics — and the result will amply confirm the truth of these observations.

And even in distinct portions of the same state, a similar connection is obvious. The contrast between Scotland and Ireland, between Holland and Belgium when united, and between the Northern and Southern States of the North American Republic, still more emphatically evinces (let it be explained as it may) how closely allied Sabbath-keeping is with the prosperity, and Sabbath profanation with the limited progress and partial development, of a community.</p></blockquote>

<blockquote><p>10. Ye observe days. He adduces as an instance one description of “elements,” the observance of days. No condemnation is here given to the observance of dates in the arrangements of civil society. The order of nature out of which this arises, is fixed and constant. How are months and years computed, but by the revolution of the sun and moon? What distinguishes summer from winter, or spring from harvest, but the appointment of God, — an appointment which was promised to continue to the end of the world? (Genesis 8:22.) The civil observation of days contributes not only to agriculture and to matters of politics, and ordinary life, but is even extended to the government of the church. Of what nature, then, was the observation which Paul reproves? It was that which would bind the conscience, by religious considerations, as if it were necessary to the worship of God, and which, as he expresses it in the Epistle to the Romans, would make a distinction between one day and another. (Romans 14:5.)

When certain days are represented as holy in themselves, when one day is distinguished from another on religious grounds, when holy days are reckoned a part of divine worship, then days are improperly observed. The Jewish Sabbath, new moons, and other festivals, were earnestly pressed by the false apostles, because they had been appointed by the law. When we, in the present age, intake a distinction of days, we do not represent them as necessary, and thus lay a snare for the conscience; we do not reckon one day to be more holy than another; we do not make days to be the same thing with religion and the worship of God; but merely attend to the preservation of order and harmony. The observance of days among us is a free service, and void of all superstition.

11. Lest I have bestowed upon you labour in vain. The expression is harsh, and must have filled the Galatians with alarm; for what hope was left to them, if Paul’s labour had been in vain? Some have expressed astonishment that Paul should be so powerfully affected by the observance of days, as almost to designate it a subversion of the whole gospel. But if we carefully weigh the whole, we shall see that there was just reason; and that the false apostles not only attempted to lay the yoke of Jewish bondage on the neck of the church, but filled their minds with wicked superstitions. To bring back Christianity to Judaism, was in itself no light evil; but far more serious mischief was done, when, in opposition to the grace of Christ, they set up holidays as meritorious performances, and pretended that this mode of worship would propitiate the divine favour. When such doctrines were received, the worship of God was corrupted, the grace of Christ made void, and the freedom of conscience oppressed.

Do we wonder that Paul should be afraid that he had laboured in vain, that the gospel would henceforth be of no service? And since that very description of impiety is now supported by Popery, what sort of Christ or what sort of gospel does it retain? So far as respects the binding of consciences, they enforce the observance of days with not less severity than was done by Moses. They consider holidays, not less than the false apostles did, to be a part of the worship of God, and even connect with them the diabolical notion of merit. The Papists must therefore be held equally censurable with the false apostles; and with this addition in aggravation, that, while the former proposed to keep those days which had been appointed by the law of God, the latter enjoin days, rashly stamped with their own seal, to be observed as most holy.</p></blockquote>

</figure><figure class="quote" id="q-d2a2c448ec" data-kw="">
<blockquote><p>Repentance is an inward sorrowing, and continual mourning of the heart and conscience for sin joined with faith and both inward, and outward amendment: Inward I say in changing the thoughts and affections of the heart: and outward in changing the words, and works from evil to good. This repentance no doubt was in David, who when he was covertly reproved by the prophet Nathan, and his sins laid before his eyes, did not stubbornly defend them, and so justle against God: nor yet secretly excuse them, and daube them over, but cried out in the bitterness of his heart: I have sinned, and thereupon made the 51. Psalm.

A Psalm indeed full of dolour and heaviness: Wherein the Prophet bewaileth his falls, lamenteth his sins, and prayeth even for a new heart, and a new spirit, new thoughts, new affections, new purposes of amendment of life. So that in David we may see an inward sorrowing, a lasting grief (as the book of Psalms doth every where declare, which layeth him out as it were in an Anatomy) yea, and great reformation, both in inward, &amp; outward sins. Here therefore behold what is Repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-dent.html">Arthur Dent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of repentance. A very godly and profitable Sermon, preached at Lee in Essex, by Arthur Dent, Minister of God’s word. And published at the request of sundry Godly and well disposed persons. 1581. the 7. of March</cite>, (London: John Harison, 1582), unpaginated.</span></figcaption>

<blockquote><p>You also wrote me concerning some supposed image of Christ, which image you wished me to send you. Now what kind of thing is this that you call the image of Christ? I do not know what impelled you to request that an image of Our Saviour should be delineated. What sort of image of Christ are you seeking? Is it the true and unalterable one which bears His essential characteristics, or the one which He took up for our sake when He assumed the form of a servant? . . . Granted, He has two forms, even I do not think that your request has to do with His divine form. . . . Surely then, you are seeking His image as a servant, that of the flesh which He put on for our sake. But that, too, we have been taught, was mingled with the glory of His divinity so that the mortal part was swallowed up by Life. Indeed, it is not surprising that after His ascent to heaven He should have appeared as such, when, while He—the God, Logos—was yet living among men, He changed the form of the servant, and indicating in advance to a chosen band of His disciples the aspect of His Kingdom, He showed on the mount that nature which surpasses the human one—when His face shone like the sun and His garments like light. Who, then, would be able to represent by means of dead colors and inanimate delineations (skiagraphiai) the glistening, flashing radiance of such dignity and glory, when even His superhuman disciples could not bear to behold Him in this guise and fell on their faces, thus admitting that they could not withstand the sight? If, therefore, His incarnate form possessed such power at the time, altered as it was by the divinity dwelling within Him, what need I say of the time when He put off mortality and washed off corruption, when He changed the form of the servant into the glory of the Lord God. . . ? … How can one paint an image of so wondrous and unattainable a form—if the term ‘form’ is at all applicable to the divine and spiritual essence—unless, like the unbelieving pagans, one is to represent things that bear no possible resemblance to anything. . . ? For they, too, make such idols when they wish to mould the likeness of what they consider to be a god or, as they might say, one of the heroes or anything else of the kind, yet are unable even to approach a resemblance, and so delineate and represent some strange human shapes. Surely, even you will agree that such practices are not lawful for us. But if you mean to ask of me the image, not of His form transformed into that of God, but that of the mortal flesh before its transformation, can it be that you have forgotten that passage in which God lays down the law that no likeness should be made either of what is in heaven or what is in the earth beneath? Have you ever heard anything of the kind either yourself in church or from another person? Are not such things banished and excluded from churches all over the world, and is it not common knowledge that such practices are not permitted to us alone? Once— I do not know how—a woman brought me in her hands a picture of two men in the guise of philosophers and let fall the statement that they were Paul and the Saviour—I have no means of saying where she had had this from or learned such a thing. With the view that neither she nor others might be given offence, I took it away from her and kept it in my house, as I thought it improper that such things ever be exhibited to others, lest we appear, like idol worshippers, to carry our God around in an image. I note that Paul instructs all of us not to cling any more to things of the flesh; for, he says, though we have known Christ after the flesh, yet now henceforth know we Him no more. It is said that Simon the sorcerer is worshipped by godless heretics painted in lifeless material. I have also seen myself the man who bears the name of madness57 [painted] on an image and escorted by Manichees. To us, however, such things are forbidden. For in confessing the Lord God, Our Saviour, we make ready to see Him as God, and we ourselves cleanse our hearts that we may see Him after we have been cleansed. . .</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eusebius-of-caesarea.html">Eusebius of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of the Byzantine Empire 312-1453</cite>, (1972, rep. 1986),p. 16-18. Source: Patrologia Graeca 20, 1545 f.</span></figcaption>

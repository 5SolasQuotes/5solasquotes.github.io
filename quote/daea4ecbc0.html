<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them? Now, by the same reasons are our holy-days to be condemned as taking away Christian liberty; and so that which the apostle says, does militate as well against them as against any other holy-days: for whereas it might be thought that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places except our opposites will say that they esteem their festival days holier than other days, and that they observe the Jewish festivities, neither of which they do aknowledge; and if they did, yet they must consider that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks. … The apostle comports with the observation of days in the weak Jews, who understood not the fullness of the Christian liberty, especially, since those days having had the honor to be once appointed by God Himself, were to be honorably buried: but the same apostle reproves the Galatians who had attained to this liberty, and had once left off the observation of days. … Now for confutation of this forged exposition of those places of the apostle… The [Romanist] Rhemists affirm that the apostle condemns only Jewish days [in Col. 2 &amp; Gal. 4], but not Christian days, and that we do falsely interpret his words against their holy-days. [Thomas] Cartwright answers them that if Paul condemned the observing of feasts which God Himself instituted, then much more does He condemn the observation of feasts of man’s devising… for he [Paul] condemnes that observation of days which had crept into the Church of Galatia, which was not Jewish nor typical, seeing the Galatians, believing that Christ was already come, could not keep them as figures of his coming, as the Jews did, but rather as memorials that He was already come, says Cartwright.</p></blockquote>

<blockquote><p>5. It is one question whether a day may be set apart for commemoration of some mystery of our religion, by men, and as a part of God’s worship. And another whether such days may be set apart for worshipping God merely as a piece of good order and policy. The first the Papists are for: the other most of our prelatists own, though some of them differ little from the Papists in this matter.

6. The question is not whether a day may be set apart occasionally for religious worship: that is, when any special providence gives occasion for fasting and humiliation or for thanksgiving and rejoicing: seeing in that case there is a special providential call to that solemn work: but whether a day may be set apart to be observed constantly and as it recurs every year. The one makes a difference between that day of the year and other days and exempts it altogether and constantly from civil use, the other does not so; the one makes a difference among days, the other makes the difference only in the works or dispensations of God which occasion such work on that day and not on another. All that the Church does in the one case, is, whereas the present providence calls to the work, as it is expressed, Isa. 22:12. The Church only determines the circumstance of time, which must be done: in the other, the Church determines more than a necessary circumstance, viz. that there shall be such a solemnity, which the Lord has not enjoined; neither do we doubt, but that the Church may appoint recurrent days for solemn worship, to wit, while the present providence that calls to such work continues. Weekly or monthly fasts may be appointed under a lasting calamity or threatening.</p></blockquote>

<blockquote><p>5. By their fruits shall we know them; look whether they give so much liberty to others and take so much to themselves upon their holy days for staying from the public worship and attending wordly business, as they do at the diets of weekly and ordinary preaching: yet they would make the simple believe that their holy days are only appointed to be kept as those ordinary times set apart for divine service on the week-days. Nay, moreover, let it be observed, whether or not they keep the festival days more carefully, and urge the keeping of them more earnestly than the Lord’s own day. Those prelates that will not abase themselves to preach upon ordinary Sabbaths, think the high holy days worthy of their sermons. They have been also often seen to travel upon the Lord’s Day, whereas they hold it religion to travel upon a holy day. And whereas they can digest the common profanation of the Lord’s Day and not challenge it, they cannot away with the not observing of their festivities.</p></blockquote>

<blockquote><p>Concerning the distinction or difference of days, we say that it is a beastly superstition to esteem one day more holy than another, or to think that abstaining from work were a thing of itself that pleases God. Notwithstanding among the seven days we observe and keep one, according to the commandment of God, for to bestow it to hear the Word of God in the congregation, and principally to dedicate and give ourselves to learn and understand our duties towards God, and towards our neighbors. Thus we spend the Sunday. And concerning other festival days, we have put away as many as is possible for us: knowing the abuse that has come thereby, and the little need that Christendom has of them. Yet nevertheless, because there be certain days dedicated to the mysteries of our redemption, we use the Christian liberty, and have respect to that which either may hurt, or serve to the edification of the Church, according to the circumstance of time, place, and persons.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Concerning the distinction or difference of days, we say that it is a beastly superstition to esteem one day more holy than another, or to think that abstaining from work were a thing of itself that pleases God. Notwithstanding among the seven days we observe and keep one, according to the commandment of God, for to bestow it to hear the Word of God in the congregation, and principally to dedicate and give ourselves to learn and understand our duties towards God, and towards our neighbors. Thus we spend the Sunday. And concerning other festival days, we have put away as many as is possible for us: knowing the abuse that has come thereby, and the little need that Christendom has of them. Yet nevertheless, because there be certain days dedicated to the mysteries of our redemption, we use the Christian liberty, and have respect to that which either may hurt, or serve to the edification of the Church, according to the circumstance of time, place, and persons.”

— Theodore Beza, A Brief &amp; Pithy Sum of the Christian Faith made in Form of a Confession (London, 1562), ch. 5, 39. Of marriage, of fasting and of the difference of days and meats, pp. 119-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+the+distinction+or+difference+of+days%2C+we+say+that+it+is+a+beastly+superstition+to+esteem+one+day+more+holy+than+another%2C+or+to+think+that+abstaining+from+work+were+a+thing+of+itself+that+pleases+God.+Notwithstanding+among+the+seven+days+we+observe+and+keep+one%2C+according+to+the+commandment+of+God%2C+for+to+bestow+it+to+hear+the+Word+of+God+in+the+congregation%2C+and+principally+to+dedicate+and+give+ourselves+to+learn+and+understand+our+duties+towards+God%2C+and+towards+our+neighbors.+Thus+we+spend+the+Sunday.+And+concerning+other+festival+days%2C+we+have+put+away+as+many+as+is+possible+for+us%3A+knowing+the+abuse+that+has+come+thereby%2C+and+the+little+need+that+Christendom+has+of+them.+Yet+nevertheless%2C+because+there+be+certain+days+dedicated+to+the+mysteries+of+our+redemption%2C+we+use+the+Christian+liberty%2C+and+have+respect+to+that+which+either+may+hurt%2C+or+serve+to+the+edification+of+the+Church%2C+according+to+the+circumstance+of+time%2C+place%2C+and+persons.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Brief+%26+Pithy+Sum+of+the+Christian+Faith+made+in+Form+of+a+Confession+%28London%2C+1562%29%2C+ch.+5%2C+39.+Of+marriage%2C+of+fasting+and+of+the+difference+of+days+and+meats%2C+pp.+119-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa14e2c5337.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a14e2c5337.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christian-living/religious-holidays/#:~:text=Concerning%20the%20distinction%20or%20difference%20of,circumstance%20of%20time%2C%20place%2C%20and%20persons&amp;text=Concerning%20the%20distinction%20or%20difference%20of%20days%2C%20we&amp;text=to%20the%20circumstance%20of%20time%2C%20place%2C%20and%20persons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I would to God that every [so-called] Holy-day whatsoever beside the Lord’s Day, were abolished. That zeal which brought them in, was without all warrant of the Word, and merely followed corrupt reason, forsooth to drive out the Holy days of the Pagans, as one nail drives out another. Those Holy days, have been so tainted with superstition that I wonder we tremble not at their very names.</p></blockquote>

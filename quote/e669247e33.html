</figure><figure class="quote" id="q-84a6e98317" data-kw="">
<blockquote><p>Such works (that obtain a reward) are not only those of condign merit, but also: (1) the execution of a donation or almsgiving that is entirely gratuitous, which a poor man, humbly and faithfully waiting for it, does not render void by contempt or ingratitude; (2) the execution of a promise which is made not only under the condition of accepting and not despising the gift (a condition which no donation is so free as not to include), but also of a certain work besides—on which account it is in some sense meritorious, even though there may perhaps be no equality or commutation between this work and the promised reward; as, for example, if a father promises a jewel to his son who takes bitter medicine. Yet this is not a purely gratuitous donation, since the thing does not begin to be owed as soon as the promise is accepted, but when the condition has been fulfilled; nor is it properly merit of condignity, since the one acting benefits himself rather than gives something to another for which he ought to receive an equal price. But it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children to whom God has promised rewards, we admit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-crocius.html">Ludovicus Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma, bk. 4, ch. 18, pp. 1130-31, as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 369-70, trans. ChatGPT-5 Crocius (1586 – 1653 or 1655) was a German reformed minister, a delegate at the Synod of Dort and a professor of theology and philosophy in Bremen.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Such works (that obtain a reward) are not only those of condign merit, but also: (1) the execution of a donation or almsgiving that is entirely gratuitous, which a poor man, humbly and faithfully waiting for it, does not render void by contempt or ingratitude; (2) the execution of a promise which is made not only under the condition of accepting and not despising the gift (a condition which no donation is so free as not to include), but also of a certain work besides—on which account it is in some sense meritorious, even though there may perhaps be no equality or commutation between this work and the promised reward; as, for example, if a father promises a jewel to his son who takes bitter medicine. Yet this is not a purely gratuitous donation, since the thing does not begin to be owed as soon as the promise is accepted, but when the condition has been fulfilled; nor is it properly merit of condignity, since the one acting benefits himself rather than gives something to another for which he ought to receive an equal price. But it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children to whom God has promised rewards, we admit.”

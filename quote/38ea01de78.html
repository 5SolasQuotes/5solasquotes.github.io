</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e453359e8" data-kw="">
<blockquote><p>Wherefore we suffer not ourselves, in controversies about religion, or matters of faith, to be pressed with the bare testimonies of Fathers, or Decrees of Councils; much less with received customs, or with the multitude of men being of one judgment, or with prescription of long time. Therefore, in controversies of religion, or matters of faith, we cannot admit any other judge than God himself, pronouncing by the holy Scriptures, what is true, what is false, what is to be followed, or what to be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-eb26639659" data-kw="">
<blockquote><p>As to one thing there was no doubt, viz., that whoever should be allowed to sit and give their opinion, all of them, some ensnared by ambition, others blinded by avarice, others inflamed with rage, would be mortal enemies to sound doctrine, and being bound together in secret conspiracy to establish the tyranny of the Pope, would exert themselves to destroy the kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Preface to the Pious Reader</span></figcaption>

</figure><figure class="quote" id="q-c89569f066" data-kw="councils can err">
<blockquote><p>The question does not simply concern the invisible church of the elect or the universality of believers, whether it can err in the foundation (which our doctrine concerning the perseverance of the saints sufficiently proves is slanderously charged upon us), but whether it is to be said to be so infallible as to be exposed to no error (which we deny). The question is not properly of the collective visible church of believers, but especially of the representative church in councils and of the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.2</span></figcaption>

</figure><figure class="quote" id="q-67509949cf" data-kw="Councils under Scripture">
<blockquote><p>The weightiest controversies have been determined and settled in councils, but not by the absolute authority of the council itself, but by the judgment and authority of scripture in the council. Pious bishops never assembled to define a point themselves by their own authority, but by that of scripture. Therefore all religious councils have ascribed the supreme decision to the scriptures. … Since, then, councils, whenever they are good and pious, follow the scriptures, it is manifest that the supreme authority of judging belongs to the scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 6</span></figcaption>

<blockquote><p>3. This goodness is communicative. [There is] None so communicatively good as God. As the notion of God includes goodness, so the notion of goodness includes diffusiveness; without goodness He would cease to be a Deity, and without diffusiveness He would cease to be Good. The being good is necessary to the being God: For goodness is nothing else in the notion of it, but a strong inclination to do good; either to find or make an object wherein to exercise itself according to the propension of its own nature; and it is an inclination of communicating itself not for its own interest, but the good of the object it pitches upon. Thus God is good by nature and his nature is not without activity; He acts conveniently to his own nature. Ps. 119:68, ‘Thou art good and dost good.’ And nothing accrues to Him by the communications of Himself to others, since his blessedness was as great before the frame of any creature as ever it was since the erecting of the world; so that the goodness of Christ Himself increases not the luster of his happiness: Ps. 16:2, ‘My goodness extends not to Thee.’ He is not of a niggardly and envious nature; He is too rich to have any cause to envy, and too good to have any will to envy: He is as liberal as he is rich, according to the capacity of the object about which his goodness is exercised. The divine goodness being the supreme goodness, is goodness in the highest degree of activity; Not an idle, enclosed, pent up goodness, as a spring shut up or a fountain sealed, bubbling up within itself, but bubbling out of itself. A fountain of gardens to water every part of his creation; He is an ointment poured forth (Cant. 1:5). Nothing spreads itself more than oil and takes up a larger space, wheresoever it drops. It may be no less said of the goodness of God, as it is of the fulness of Christ, Eph. 1:23, ‘He fills all in all‘: He fills rational creatures with understanding, sensitive nature with vigor and motion, the whole world with beauty and sweetness. Every taste, every touch of a creature is a taste and touch of divine goodness. Divine goodness offers itself in one spark in this creature, in another spark in the other creature, and altogether make up a goodness inconceivable by any creature. The whole mass and extracted spirit of it is infinitely short of the goodness of the divine nature, imperfect shadows of that goodness which is in Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, p. 588</span></figcaption>

</figure><figure class="quote" id="q-cdcac0f5d7" data-kw="">
<blockquote><p>When love is attributed to God in Scripture, it does not mean a passion or an affect, for God is dispassionate [ἀπαθής], the freest, the most blissful, the most blessed, the most perfect. Nothing slavish happens to Him, nothing lowly, and finally nothing that indicates any imperfection. But God’s love denotes three completely, perfect things: eternal benevolence, actual beneficence, and actual delight in the thing loved. For he who loves something is well-disposed towards it, does it whatever good he is capable of, and delights in it. These three things are found in the love of God. Now this love is first the love of God in Himself, and then towards his creatures. For God loves Himself and above all things: the Father: the Son and the Holy Spirit; the Son: the Father and the Holy Spirit, and the Holy Spirit: the Father and the Son. God’s love for his creatures is first general and then special. That general love is the one by which He fully embraces all things created by Him, blesses them, and preserves and sustains them. In this way there is no one, no man, and no devil either, who can say that He is not loved by God. The special love is that by which alone He leads the elect to eternal life, as He acknowledges them to be his own children in Christ: this passage [Mal. 1:2] here must be understood from this special love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Analysis of the Book of the Prophet Malachi</cite>, (Basil: Waldkirch, 1597), p. 10 tr. Damianus Cathedralulus (Domke), “Reading the Book of Malachi with Polanus #2,” A Bear to be Loved: Thoughts on Zacharias Ursinus and Amandus Polanus (blog), March 18, 2023</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>6. For the ground and warrant of Christ’s willingness to save and draw sinners, do but consider: 1. The words of the text, ‘I will draw all men to Me;’ it is as if He would say, ‘I will baulk no nation, nor any man upon a national respect;’ the first covenant to the Jews suffered a mighty exception: What is God, the God of the Jews only? Have all the nations of the earth done with their part of heaven and salvation, but only the narrow trinket and bit of the earth in poor little Judea? This made the Gospel despised and liable to sad and heavy calumnies. Christ must have narrow bowels, and must be ebb, short, and thin in free grace if the matter be so. Nay but, Christ has mercy for all men: ‘I will draw all men,’ that is, multitudes of Jews and gentiles: for that Christ draws all and every one without exception, and that by his death, is against Scripture and experience; but He has an ‘all’ that he draws: Tit. 2:11, ‘The grace of God has appeared to all men [Greek]; what grace? the teaching grace of God that teaches us to wait for the blessed hope and the appearance of the glory and of our Savior Jesus Christ: sure, this must bee the preached Gospel; now the Gospel by Scripture experience, [and by] consent of Arminians, never appeared, in the least sound, to all and every son of Adam; then Christ must have another ‘all,’ a fair and numerous multitude whom He saves and draws, and this says He, had a good will to save all, and that his elect ones believe… 2. Christ is willing to take away all heart-exceptions of unbelief from men, as… Eze. 33, The people slandered the Lord, He delighted so to have the people pine away in their iniquities, that He would punish them for no fault, but the children’s teeth should be set on edge for the sins of the father and the grapes that they eat not themselves. The Lord answers that calumny, Eze. 18, ‘And here, as I live, I delight not so (so as you slanderously, and blasphemously say) in the death of a sinner, by my life, I desire you may repent and live, nor have I pleasure to punish innocent men, for no sin at all.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: J.D., 1647), pt. 3, pp. 445-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“6. For the ground and warrant of Christ’s willingness to save and draw sinners, do but consider: 1. The words of the text, ‘I will draw all men to Me;’ it is as if He would say, ‘I will baulk no nation, nor any man upon a national respect;’ the first covenant to the Jews suffered a mighty exception: What is God, the God of the Jews only? Have all the nations of the earth done with their part of heaven and salvation, but only the narrow trinket and bit of the earth in poor little Judea? This made the Gospel despised and liable to sad and heavy calumnies. Christ must have narrow bowels, and must be ebb, short, and thin in free grace if the matter be so. Nay but, Christ has mercy for all men: ‘I will draw all men,’ that is, multitudes of Jews and gentiles: for that Christ draws all and every one without exception, and that by his death, is against Scripture and experience; but He has an ‘all’ that he draws: Tit. 2:11, ‘The grace of God has appeared to all men [Greek]; what grace? the teaching grace of God that teaches us to wait for the blessed hope and the appearance of the glory and of our Savior Jesus Christ: sure, this must bee the preached Gospel; now the Gospel by Scripture experience, [and by] consent of Arminians, never appeared, in the least sound, to all and every son of Adam; then Christ must have another ‘all,’ a fair and numerous multitude whom He saves and draws, and this says He, had a good will to save all, and that his elect ones believe… 2. Christ is willing to take away all heart-exceptions of unbelief from men, as… Eze. 33, The people slandered the Lord, He delighted so to have the people pine away in their iniquities, that He would punish them for no fault, but the children’s teeth should be set on edge for the sins of the father and the grapes that they eat not themselves. The Lord answers that calumny, Eze. 18, ‘And here, as I live, I delight not so (so as you slanderously, and blasphemously say) in the death of a sinner, by my life, I desire you may repent and live, nor have I pleasure to punish innocent men, for no sin at all.&#x27;”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself… (London: J.D., 1647), pt. 3, pp. 445-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+For+the+ground+and+warrant+of+Christ%E2%80%99s+willingness+to+save+and+draw+sinners%2C+do+but+consider%3A+1.+The+words+of+the+text%2C+%E2%80%98I+will+draw+all+men+to+Me%3B%E2%80%99+it+is+as+if+He+would+say%2C+%E2%80%98I+will+baulk+no+nation%2C+nor+any+man+upon+a+national+respect%3B%E2%80%99+the+first+covenant+to+the+Jews+suffered+a+mighty+exception%3A+What+is+God%2C+the+God+of+the+Jews+only%3F+Have+all+the+nations+of+the+earth+done+with+their+part+of+heaven+and+salvation%2C+but+only+the+narrow+trinket+and+bit+of+the+earth+in+poor+little+Judea%3F+This+made+the+Gospel+despised+and+liable+to+sad+and+heavy+calumnies.+Christ+must+have+narrow+bowels%2C+and+must+be+ebb%2C+short%2C+and+thin+in+free+grace+if+the+matter+be+so.+Nay+but%2C+Christ+has+mercy+for+all+men%3A+%E2%80%98I+will+draw+all+men%2C%E2%80%99+that+is%2C+multitudes+of+Jews+and+gentiles%3A+for+that+Christ+draws+all+and+every+one+without+exception%2C+and+that+by+his+death%2C+is+against+Scripture+and+experience%3B+but+He+has+an+%E2%80%98all%E2%80%99+that+he+draws%3A+Tit.+2%3A11%2C+%E2%80%98The+grace+of+God+has+appeared+to+all+men+%5BGreek%5D%3B+what+grace%3F+the+teaching+grace+of+God+that+teaches+us+to+wait+for+the+blessed+hope+and+the+appearance+of+the+glory+and+of+our+Savior+Jesus+Christ%3A+sure%2C+this+must+bee+the+preached+Gospel%3B+now+the+Gospel+by+Scripture+experience%2C+%5Band+by%5D+consent+of+Arminians%2C+never+appeared%2C+in+the+least+sound%2C+to+all+and+every+son+of+Adam%3B+then+Christ+must+have+another+%E2%80%98all%2C%E2%80%99+a+fair+and+numerous+multitude+whom+He+saves+and+draws%2C+and+this+says+He%2C+had+a+good+will+to+save+all%2C+and+that+his+elect+ones+believe%E2%80%A6+2.+Christ+is+willing+to+take+away+all+heart-exceptions+of+unbelief+from+men%2C+as%E2%80%A6+Eze.+33%2C+The+people+slandered+the+Lord%2C+He+delighted+so+to+have+the+people+pine+away+in+their+iniquities%2C+that+He+would+punish+them+for+no+fault%2C+but+the+children%E2%80%99s+teeth+should+be+set+on+edge+for+the+sins+of+the+father+and+the+grapes+that+they+eat+not+themselves.+The+Lord+answers+that+calumny%2C+Eze.+18%2C+%E2%80%98And+here%2C+as+I+live%2C+I+delight+not+so+%28so+as+you+slanderously%2C+and+blasphemously+say%29+in+the+death+of+a+sinner%2C+by+my+life%2C+I+desire+you+may+repent+and+live%2C+nor+have+I+pleasure+to+punish+innocent+men%2C+for+no+sin+at+all.%27%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%E2%80%A6+%28London%3A+J.D.%2C+1647%29%2C+pt.+3%2C+pp.+445-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9ab762637.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9ab762637.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=6.%20For%20the%20ground%20and%20warrant,men%2C%20for%20no%20sin%20at%20all&amp;text=6.%20For%20the%20ground%20and%20warrant%20of%20Christ%E2%80%99s&amp;text=punish%20innocent%20men%2C%20for%20no%20sin%20at%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

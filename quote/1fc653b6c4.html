<main class="wrap"><figure class="quote" id="q-1fc653b6c4" data-kw="">
<blockquote><p>Pastor Kevin DeYoung did not venture outside the bounds of Reformed orthodoxy when he taught that good works are necessary for salvation as a means. The Puritans and the Westminster Standards teach the same view.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-patrick-ramsey.html">D. Patrick Ramsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In Defense of a Faithful Minister</cite>, [Kevin DeYoung]’ (2019) 6 paragraphs at A Place for Truth</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Pastor Kevin DeYoung did not venture outside the bounds of Reformed orthodoxy when he taught that good works are necessary for salvation as a means. The Puritans and the Westminster Standards teach the same view.”

<blockquote><p>just as the other acts signified under faith, as it were materially and by synecdoche, are not of themselves and directly ordered to the properly effecting of friendship with God and salvation, but either to faith (to which they in some way contribute), or at least to the not-losing of friendship with God or salvation; so neither do they properly and directly justify or save. They are useful, however, insofar as by them we exclude and avoid sins and ingratitude, which would altogether be the true cause of losing righteousness and salvation—such a cause as they are accustomed to refer to as a removing or prohibiting cause, and among causes per accidens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-bergius.html">Conrad Bergius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praexi Cathol. Divin. Canon., Dissertation 7</cite>, pp. 986-87 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-245cbc81d0" data-kw="">
<blockquote><p>Of what then does our Lord in this place [Mt. 25:35,42] say that the god works of the holy are the cause; for they are added with the causal conjunction ‘for I was an hungered.’ etc.? They are the cause of the full attainment to and enjoyment of this kingdom, not of the right to it… God therefore makes the good works of those who are His, causes both of increasing and daily perfecting their salvation, and at length of fully enjoying it also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa</cite>, … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531., p. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Of what then does our Lord in this place [Mt. 25:35,42] say that the god works of the holy are the cause; for they are added with the causal conjunction ‘for I was an hungered.’ etc.? They are the cause of the full attainment to and enjoyment of this kingdom, not of the right to it… God therefore makes the good works of those who are His, causes both of increasing and daily perfecting their salvation, and at length of fully enjoying it also.”

<blockquote><p>God rewards them as a just Judge:

1. Because He has promised to reward his children’s obedience, though imperfect;

2. And it is Just that he should keep his promises.</p></blockquote>

</figure><figure class="quote" id="q-bae3caf166" data-kw="">
<blockquote><p>6. That we may escape temporal and eternal punishment. ‘Every tree that bringeth not forth good fruit is hewn down and cast into the fire.’ ‘If ye live after the flesh ye shall die.’ ‘Thou with rebukes dost correct man for iniquity.’ (Mt. 7:19; Rom. 8:13; Ps. 39:11)

7. That we may obtain from God those temporal and spiritual rewards, which, according to the divine promise, accompany good works both in this and in a future life. ‘Godliness is profitable unto all things, having promise of the life that now is, and of that which is to come.’ (1 Tim. 4:8) And if God did not desire that the hope of reward, and the fear of punishment should be moving causes of good works, He would not use them as arguments in the promises and threatenings which He addresses unto us in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Why Good Works are to be Done, or why they are Necessary?’ being section 5 of Question 91 of the Heidelberg Catechism in The Commentary of Zacharias Ursinus on the Heidelberg Catechism</cite>, (Cincinnati, 1851), pp. 482-485 d. 1583 | Ursinus (1534-1583) includes in his exposition:, p. 484</span></figcaption>

<main class="wrap"><figure class="quote" id="q-95d94da83a" data-kw="">
<blockquote><p>Josiah … did not only restore the religion, but did further destroy all monuments of idolatry which of long time had remained … not only in Judah, but also in Bethel where Jeroboam had erected his idolatry. Yea, he further proceeded and did kill the priests of the high places who were idolaters and had deceived the people; he did kill them, I say, and did burn their bones upon their own altars, and so returned to Jerusalem. This reformation made Josiah, and for the same obtained this testimony of the Holy Ghost, that neither before him neither after him was there any such king who returned to God with his whole soul and with all his strength according to all the law of Moses.

Of which histories it is evident that the reformation of religion in all points, together with the punishment of false teachers, doth appertain to the power of the civil magistrate. For what God required of them, His justice must require of others having the like charge and authority; what He did approve in them, He cannot but approve in all others who with like zeal and sincerity do enterprise to purge the Lord’s temple and sanctuary. What God required to them, it is before declared, to wit, that most diligently they should observe His law, statutes and ceremonies.

[…] And therefore of necessity it is speedily ye provide for reformation or else ye declare yourselves not only void of love towards your subjects, but also to live without care of your own salvation, yea, without all fear and true reverence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The appellation of John Knox from the cruel and most injust sentence pronounced against him by the false bishops and clergy of Scotland, with his supplication and exhortation to the nobility, estates and commonality of the same realm</cite>, (Geneva, 1558) in idem, On rebellion, ed. R. A. Mason (Cambridge, 1994), pp 90-1.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a093f4336" data-kw="">
<blockquote><p>We are aware, that many are strongly prepossessed against the Reformation cause, on account of the doctrine of the Reformers, respecting the Magistrate’s authority relative to religious matters, and its application in carrying on that work; as if both that doctrine, and its application to practical purposes, were inconsistent with the freedom, spirituality, and independence of the kingdom of Christ. Our limits will not admit of our entering at large upon the subject, but it must not be entirely overlooked, since intimately connected with the defence, both of the Westminster Confession, and the conduct of our Reformers.

In entering upon the question, we would call the attention of our readers to the following preliminary remarks. First, When the compilers of the Westminster Confession speak of the authority of the Magistrate about the Church, he is not to be understood in his individual capacity, but as at the head of the administration of the nation over which he presides. The power pleaded for, is the power of the nation, as exercised by the Magistrate. Nor does the expression, “the Magistrate,” in the Confession, and the writings of divines on this subject, mean exclusively the person at the head of the executive government, such as the king, but it is a general name for all possessing civil authority, in their respective places, legislative or executive.

Secondly, The Confession assigns to the Magistrate no power over the Church, or in things sacred. The power assigned to him, is not a lordly supremacy over the Church. The Confession expressly asserts the sole headship of Christ over the Church, his spiritual kingdom: chap. 25, sect. 6, “There is no other head of the Church, but the Lord Jesus Christ.” Neither is it a ministerial authority in the Church. He must not interfere with her internal government: chap. 30, sect. 1, “The Lord Jesus, as King and Head of his Church, hath therein appointed a government in the hand of Church officers, distinct from the Civil Magistrate.” Sect. 2, “To these officers, the keys of the kingdom of heaven are committed.”

He must not, as a Magistrate, sustain himself a public judge of true or false religion, or dictate to his subjects in matters purely religious: chap. 31, sect. 3, “It belongeth to Synods, and Councils, ministerially to determine matters of faith, and cases of conscience, to set down rules for the better ordering of the public worship of God, and government of the Church,” &amp;c. “Moreover, he must not take upon himself the administration of any of her ordinances of worship.” Chap. 23, sect. 3, “The Civil Magistrate must not assume to himself the administration of the word and sacraments, or the power of the keys of the kingdom of heaven.”

Now, since the authority of the Magistrate is thus limited by the compilers of the Confession themselves, the power they assign to him cannot be a power over the Church, or in things sacred. It must therefore be, simply, a right to employ the influence of his station about the Church, for promoting her interests. But it is the duty of every man to exert the influence of his station in life for that end; and if God has made it his duty, he must also have given him a right to discharge that duty. Why then deny to civil rulers the right of casting the influence of their station into the scale of religion?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-stevenson.html">George Stevenson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea for the Covenanted Reformation in Britain and Ireland</cite>, (3rd edn, Edinburgh: W. P. Kennedy, 1844), pp 8-10.</span></figcaption>

<blockquote><p>5. An appellation is one thing, and the complaint of an oppressed man is another thing; or a provocation to a competent judge is one thing, and the refugium, the refuge and fleeing of an oppressed man to a higher power is another thing; if the Church err and fail against the Law of Christ in the matter, and decree the man to be a heretic, who is none, and that to be heresy which is truth, the oppressed man in a constituted Church may have his refuge to the godly Magistrate and complain, but he cannot appeal, for an appellation is from an erring judge to an higher judge, in eadem serie, in the same nature and kind of judicatures… but a complaint may be made to the Magistrate; if the Church fail in their judging, the Magistrate is to command the Church to judge it over again, but the Magistrate cannot judge it himself; as there is a complaint made to the Magistrate that the printer has not drawn the image exactly, according to the samplar: the Magistrate judges not of the art of the painter, nor can the Magistrate as the Magistrate draw the image himself; But the Magistrate may judge of the painter’s breach of promise who did the action to draw it exactly according to the samplar, and has not kept faith to the man who pays him wages; and therefore the Magistrate may either punish his moral error, his breach of promise, not his error of art (the faculty or company of painters must judge of that) or then command the painter to paint the same image again, according as the painter convenanted. But it may be objected, ‘You then make the Magistrate to meddle no more with matters of faith and preaching truth or falsehood, and giving out Ecclesiastical rules in Church government, as Acts 15, then he meddles with painting according to the principles of art; now painting according to art belongs not at all to the conscience of the Magistrate, but sound preaching, right ruling in God’s house, belongs in a far nearer relation to the conscience of the godly Magistrate.’ I Answer: As touching the formal judging Ecclesiastically… it no more belongs to him as a Magistrate… But in another consideration, as [the] sound or unsound dispensing of Word and Sacraments, as right or unjust ruling in the house of God, may more or less hurt or benefit the souls of men, which he is to care for indirectly, in ordine ad penas vel premia civilia et corporalia [in the order of civil and corporal penalties or rewards], it belongs more to the Magistrate to take care of the Church, of religion, of preaching and governing God’s House, than any painting or arts in the earth. Again, the Church proceeding in these things that are against common justice in all judicatures, no less then in the Church, as to condemn the party never heard, or not convinced [convicted] either by confession, or under two sufficient witnesses, or to do manifest injustice in the manner of proceeding, leaves a clear place to the wronged party, by the Law of Nature, if not to appeal, yet to flee and have re-course to the Christian Magistrate, who is Parens Patrie, the father of the Commonwealth. … 7. …Or, 2. the godly Magistrate would command that the Church would impartially proceed to right an oppressed man, as Cabeljavius says [Pieter Cabeljauw, c.1608-1668, who was reformed] (De Lib. Eccles., ch. 9, pp. 134-35) . Or, 3. when there is no synods to be had, then as [Jacob] Triglandius says well from Beza, the Christian Magistrate may provide fit means of relieving the oppressed. (Trigland, De Civili &amp; Ecclesiastic. Potest., ch. 20, pp. 420-21)</p></blockquote>

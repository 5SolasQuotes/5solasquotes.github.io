<main class="wrap"><figure class="quote" id="q-9c4921d723" data-kw="">
<blockquote><p>Thus must we conceiue of the catholick Church as of one entire body, made up by the collection and aggregation of all the faithful unto the unity thereof: from which union there arises unto every one of them such a relation to and a dependance upon the Church-catholic as parts use to have in respect of their whole. Whereupon it follows that neither particular persons, nor particular Churches are to work as several divided bodies by themselves (which is the ground of all schism), but are to teach and to be taught, and to do all other Christian duties, as parts conjoined unto the whole, and members of the same commonwealth or corporation… Which makes strongly as well against the new Separatists, as the old Donatists: who either hold it a thing not much material, so they profess the faith of Christ, whether they do it in the catholic communion or out of it; or else (which is worse) dote so much upon the perfection of their own part that they refuse to join in fellowship with the rest of the body of Christians, as if they themselues were the only people of God and all wisdom must live and die with them and their generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration of the Universality of the Church of Christ &amp; the Unity of the Catholic Faith… (London, 1629)</cite>, p. 7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-096963ca8c" data-kw="">
<blockquote><p>In this context researchers differentiate the colloquies on inaugurating reform in the early years of the Reformation (which were to prepare for the secular government’s decision to introduce new teaching and ecclesiastical practice or to legitimize such a decision) from the later religious dialogues that ideally aimed at a convergence of two religious parties. Contemporaries hardly noticed this difference… Despite all the parallels with the medieval process of disputation, sixteenth-century religious colloquies differed from the academic model at essential points… The representatives of the Reformation decisively rejected the syllogism of Scholasticism as a relevant structure for argumentation for determining theological truth and untruth. A hermeneutic based upon and drawn from Holy Scripture was to govern the establishing of the truth, not arguments based on major and minor premises.</p></blockquote>

r%20premises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>18. They separate themselves from the true Churches of Christ. The Pharises were rigid separatists and quarrelled with Christ because He would not separate, but was a friend to publicans and sinners, Lk. 15:27-28. They pretend they abhor a mixed company, and yet they revile and fly from real saints. They are all for gathering churches out of churches, which is the very way to destroy churches. How do we destroy houses but by pulling one stone and one piece from another? This schism grows into a heresy, as a serpent grows to be a dragon. This tolerated, will ruin families, tearing them all to pieces, while the husband goes to one Church, the wife to another, the son to a third, the daughter to a fourth, and the servant to an ale-house instead of a Church. This opens a gap to abundance of profaneness, when there shall be no cohabitation, but the Church members shall be scattered up and down, some twenty, some thirty, some sixty, some one hundred miles off; who shall have the inspection, teaching and guidance of these? Master [Jeremiah] Burroughs’s argument (Irenicum, ch. 23) for gathering of churches (in my judgment) is very dilute and weak; ’tis this: Because our divines hold it lawful to gather churches out of the Church of Rome: therefore ’tis lawful to gather churches out of the Church of England, q.d. because ’tis lawful to separate from a whore, therefore, we ought to separate from an honest woman also. What more ungodly sacrilege, or manstealing can there be, than to purloin from godly ministers the firstborn of their fervent prayers, and faithful preaching, the leaven of their flocks, the encouragement of their souls, the crown of their labors, and their epistle to Heaven? If men will needs gather churches out of the world (as they phrase it) let them first plow the world, and sow it, and reap it with their own hands, and then the Lord give them a liberal harvest. He is a very hard man that will reap where he has not sown, and gather where he has not strewed, Mt. 24:25. We have no precedent in the whole Book of God to gather up one church out of the cream and quintessence of many churches, as a reverend divine of ours has well observed. (Mr. [Thomas] Blake, On the Covenant, ch. 42 [p. 288]. in ••ne. V. The [Westminster] Assembly’s Answer to the Dissenting Brethren, p. 61 at the end [p. 22 in the link])</p></blockquote>

<blockquote><p>On the Reformed side, the concept of fundamental articles appears as early as 1593 in the irenic or ecumenical theology of Francis Junius–as a response to the question of agreement between the Reformed side and the Lutherans despite significant theological differences: Junius argued that the ‘fundamentals’ or ‘fundamental articles’ are those teachings without which the Christian faith cannot be present–among which is the doctrine of God, the immutable object of faith. (Eirenicum, I, Opuscula, p. 440)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peace Token [Eirenicum], pt. 1, pp. 440-442 (1593) in Select Smaller Theological Works ed. Abraham Kuyper (Amsterdam, 1882)</cite></span></figcaption>

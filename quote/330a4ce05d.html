<main class="wrap"><figure class="quote" id="q-330a4ce05d" data-kw="">
<blockquote><p>Mr. Hooker [a congregationalist]: ‘It’s a staple rule, no man by nature has an ecclesiastical power over another by constraint; one comes a Christian convert from China, to a country or city where many churches are, none of them can, by the rule of the Gospel, compel him to join with one more than another. He may freely choose what is most suitable to his heart, and may be most to promote his spiritual edification.’ [Rutherford’s] Answer: …The man comes from China acknowledging God in all his ways, as Abraham left his country (Gen. 12); if he be an idolater, they should not lodge him (2 Jn. 10); he comes not as indifferent to be married [the analogy used by congregationalists for joining] to this or this church, or to none at all; as a man sins not if he marry none at all (1 Cor. 7). But if he be a professor that joins to no Church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage, but both parties are under a command to confess Christ before men; and its a selfish thing to make a man’s own heart the judge and determiner of his membership, and not the churches led by the rule of the Word: and so the Church is obliged to receive him, and he is obliged to join a member, according to Cant. 1:7-8; Mt. 10:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658), Book 3, ch. 1</cite>, p. 282-3</span></figcaption>

olasquotes.github.io%2Fquote%2F330a4ce05d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/330a4ce05d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=Mr.%20Hooker%20%5Ba%20congregationalist%5D%3A%20%E2%80%98It%E2%80%99s%20a,according%20to%20Cant.%201%3A7%2D8%3B%20Mt.%2010%3A32&amp;text=Mr.%20Hooker%20%5Ba%20congregationalist%5D%3A%20%E2%80%98It%E2%80%99s%20a%20staple%20rule&amp;text=a%20member%2C%20according%20to%20Cant.%201%3A7%2D8%3B%20Mt.%2010%3A32" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f44fc0ca5" data-kw="">
<blockquote><p>As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 18, ‘Understand well the necessity of your Communion with all the Universal Church, and wherein it consists, and how far to be preferred before your Communion with any particular Church’</cite>, pp. 115-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>…that such who were known to be godly might not come to the sacrament of the Lord’s Supper, unless they were members of some particular congregation, and so, in their partaking with you, they must yield that grand Brownistical principle, the foundation of other errors among the Separatists, namely, that sacraments belong not to visible believers, but as they are members of some particular congregation… And let me entreat you, in your reply you [will] give to this answer, to give me a Scripture to prove that all men who come to the Lord’s Supper must profess their membership and their retaining to such a particular congregation: I profess myself of another judgement, and cast the glove to any of you five, or to you all; That it is lawful for the ministers of Christ to receive such whom they know to be godly to the Lord’s Supper, though they be not members of a particular church, and to receive those who are members without any [of them] professing themselves to be so: Suppose some godly merchants or marriners, who all their days travel and never stay long in any one place, yet in all places where they come, desire to join in the ordinances, ought not such to be received? The standing rule of coming to the Lord’s Supper will be found to be faith and godliness shown forth, rather than the formality of membership: …so I find Mr. Batchelour (one of you) writing from Rotterdam of your churches, that they will not keep back the sacrament from any of the godly of such churches in England, as Mr. Goodwin’s and Mr. Calamy’s are (always provided that their own pastors do consent unto it). Now the godly who are gone into Holland, and especially to New-England, not finding any such word in Scripture of bringing a ticket from their ministers, and so coming into those countries without it, may be long kept from the sacrament of the Lord’s Supper till they either go [back] into England and fetch it, or till they send for it over, and have a return back of the consent of their own pastors (which may be, was the reason, that though you offered to receive into the Communion of the Lord’s Supper some godly that came to visit you in your exile, yet for want of bringing their pastor’s consent unto it, returned into England without partaking in the Lord’s Supper with you). Which (by the way) will be a good warning for all that henceforth go over into Holland or New-England, to carry their minister’s consents over with them, lest otherwise they be not admitted to the Lord’s Supper…</p></blockquote>

</figure><figure class="quote" id="q-cc2bc892b1" data-kw="">
<blockquote><p>Sacraments are holy signs and seals of the covenant of grace, immediately instituted by God, to represent Christ and his benefits, and to confirm our interest in him; as also, to put a visible difference between those that belong unto the church and the rest of the world; and solemnly to engage them to the service of God in Christ, according to his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession of Faith 1646 | 27.1 ‘Of the Sacraments’</cite></span></figcaption>

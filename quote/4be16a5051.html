<main class="wrap"><figure class="quote" id="q-4be16a5051" data-kw="">
<blockquote><p>I answer that, The will is a rational appetite. Now every appetite is only of something good. The reason of this is that the appetite is nothing else than an inclination of a person desirous of a thing towards that thing. Now every inclination is to something like and suitable to the thing inclined. Since, therefore, everything, inasmuch as it is being and substance, is a good, it must needs be that every inclination is to something good. And hence it is that the Philosopher says (Ethic. i, 1) that the good is that which all desire. But it must be noted that, since every inclination results from a form, the natural appetite results from a form existing in the nature of things: while the sensitive appetite, as also the intellective or rational appetite, which we call the will, follows from an apprehended form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 of 2 | quest. 8, art. 1, Whether the will is of good only?</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7176c29a50" data-kw="">
<blockquote><p>Hence likewise we may collect how really and cheerfully willing Christ is to save sinners. Certainly, He that makes such bitter lamentation over the foreseen ruins of Jerusalem, must needs have a very cordial, and unfeigned will and desire of her salvation… What a pathetic expostulation is here, which carries in it notices of vehement affections? Oh! how willing is Christ to give unto sinners the things that belong unto their peace? Yea, is He not more willing to bestow great things than small? Does not his willingness to give, infinitely exceed the sinners’ willingness to receive? Is not Christ more glad to receive poor and weary souls, than they are to come unto Him?… Is not every thing about Christ mighty drawing, alluring, and inviting?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger (1679) 254 pp.</cite>, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

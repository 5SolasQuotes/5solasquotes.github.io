<blockquote><p>9. That it is infallible by reason of God’s intention and the event, and irresistible and invincible by reason of the mode and efficacy of operating. For although man according to his innate depravity can do nothing but resist in the divided sense, yet actually he does not resist nor can he resist in the composite sense, when the Holy Spirit regenerating removes resistibility by impressing a new principle of spiritual life. 10. Therefore no voluntary or involuntary of man has place in this first moment, because no human action intervenes, but it is the action of God alone. So that the will conducts itself neutrally and purely passively with respect to the new principle, here willing or not willing nothing. Yet regeneration could be called voluntary as to man by extrinsic denomination from the consequent effect, or by a certain extrinsic respect, on account of the subsequent (not indeed antecedent or simultaneous) consent of the will, or new and regenerate volition, by which, excited by second grace in the second moment, man himself begins to will the spiritual goods offered through calling according to the new will divinely impressed, and according as the Holy Spirit made him willing from unwilling, and works in him τὸ θέλειν [to thelein, the willing] and to accomplish. 11. Finally, that it is difficult if you look to nature and flesh, yet easy if you look to τὸ κράτος τῆς ἰσχύος [to kratos tēs ischuos, the might of the power] divine, Mt. 19:23–26, compared with Eph. 1:19; Prov. 21:1; Rom. 11:23. Hence omnipotent facility and easy omnipotence are attributed to God regenerating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>The manner of conversion is to us unsearchable, both because we are ignorant of the nature of the immortal soul, and because much more are we ignorant of the manner of God’s working upon that immortal spirit. As for the resistibility or irresistibility of grace, we know that the power of God is almighty, and cannot be resisted by any created strength, if He please to exercise it to the full, or in some high measure: But if God give power to the creature, or work by that created power given, it may be resisted by a contrary created power: And so grace or the power of conversion, as a created thing in man, may be so given as to be resisted by the will of man. And both the understanding of man, will and does, either deny or doubt of divine truths represented to the soul; and the will will wrangle, oppose and reject or not sincerely affect and submit unto the divine commands, and promises. And hence, the many conflicts not only in conversion, but after we are converted. As for necessitation of the will in this work of divine calling, it’s certain and granted of all that the illumination of the understanding may be necessary so far as the soul in respect of the same is only passive, though in the apprehension and judgement concerning the truths represented by the Word it be active. Besides, God may give an active power to the will, and it may be passive in receiving of it, and also necessitated to an act of complacency in general, so that it necessarily may approve by a general approbation of the justice and equity of the command, and the excellency of the good promised… Yet notwithstanding this necessary and natural act of complacency, that act of the will, which Buridan calls acceptatio ad prosecutionem may be, and is free. I pass by the philosophical speculations concerning the nature of the will, which few know, concerning the natural and necessary acts thereof, and also concerning those that are free; and what the natural liberty of the will is, and in what acts, and in respect of what acts, it is free. Concerning the positive acts velle and nolle, and the negative, non velle, non nolle, and concerning the liberty of contradiction and specification; It’s far more profitable for all such as are so blessed as to live in the Church and enjoy the means of conversion diligently to use the means and exercise that power which God has given them, and also earnestly and constantly pray for the regenerating Spirit, which God has promised to them that seek Him in an orderly way. For upon this done, regeneration will follow; and by the divine and spiritual power given them, together with God’s special assistance, and concurrence, after all necessary preparations, they shall freely determine and the will shall wholly and most willingly submit to God-Redeemer, which is the ultimate product of divine vocation, the parts whereof are the outward Word, and the inward power of the Spirit which go together, according to the promise of the Gospel, and make up the essence of it… And we cannot find in Scripture that God denies his Spirit to such as hear his Word till they give God cause either by their neglect or perversness, or apostasy from that degree of grace they have received to withdraw the same. By all this we understand that Christ finds his subjects, to whom God has given Him a right, to be enemies, and He enlarges as He begins his Kingdom by a kind of spiritual conquest, dashing in pieces all such as will not submit, and are bound to submit, with his iron rod and irresistible strength, reducing the rest unto subjection, after some time of standing out… And this publication of his laws is accompanied with a wonderful power of his Spirit whereby together with the Word of the Kingdom, He pierces the minds of men and breaks their stony hearts in sunder, as an hammer does a rock: In this respect the Lord says, ‘Is not my Word like as a fire, and like an hammer that breaks the rock asunder, Jer. 23:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lawson.html">George Lawson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theo-Politica, or, A Body of Divinity Containing the Rules of the Special Government of God</cite>, … (London: Streater, 1659), pt. 2, ch. 4, pp. 113-14</span></figcaption>

— George Lawson, Theo-Politica, or a Body of Divinity… (London: Streater, 1659), pt. 2, ch. 4, pp. 113-14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+manner+of+conversion+is+to+us+unsearchable%2C+both+because+we+are+ignorant+of+the+nature+of+the+immortal+soul%2C+and+because+much+more+are+we+ignorant+of+the+manner+of+God%E2%80%99s+working+upon+that+immortal+spirit.+As+for+the+resistibility+or+irresistibility+of+grace%2C+we+know+that+the+power+of+God+is+almighty%2C+and+cannot+be+resisted+by+any+created+strength%2C+if+He+please+to+exercise+it+to+the+full%2C+or+in+some+high+measure%3A+But+if+God+give+power+to+the+creature%2C+or+work+by+that+created+power+given%2C+it+may+be+resisted+by+a+contrary+created+power%3A+And+so+grace+or+the+power+of+conversion%2C+as+a+created+thing+in+man%2C+may+be+so+given+as+to+be+resisted+by+the+will+of+man.+And+both+the+understanding+of+man%2C+will+and+does%2C+either+deny+or+doubt+of+divine+truths+represented+to+the+soul%3B+and+the+will+will+wrangle%2C+oppose+and+reject+or+not+sincerely+affect+and+submit+unto+the+divine+commands%2C+and+promises.+And+hence%2C+the+many+conflicts+not+only+in+conversion%2C+but+after+we+are+converted.+As+for+necessitation+of+the+will+in+this+work+of+divine+calling%2C+it%E2%80%99s+certain+and+granted+of+all+that+the+illumination+of+the+understanding+may+be+necessary+so+far+as+the+soul+in+respect+of+the+same+is+only+passive%2C+though+in+the+apprehension+and+judgement+concerning+the+truths+represented+by+the+Word+it+be+active.+Besides%2C+God+may+give+an+active+power+to+the+will%2C+and+it+may+be+passive+in+receiving+of+it%2C+and+also+necessitated+to+an+act+of+complacency+in+general%2C+so+that+it+necessarily+may+approve+by+a+general+approbation+of+the+justice+and+equity+of+the+command%2C+and+the+excellency+of+the+good+promised%E2%80%A6+Yet+notwithstanding+this+necessary+and+natural+act+of+complacency%2C+that+act+of+the+will%2C+which+Buridan+calls+acceptatio+ad+prosecutionem+may+be%2C+and+is+free.+I+pass+by+the+philosophical+speculations+concerning+the+nature+of+the+will%2C+which+few+know%2C+concerning+the+natural+and+necessary+acts+thereof%2C+and+also+concerning+those+that+are+free%3B+and+what+the+natural+liberty+of+the+will+is%2C+and+in+what+acts%2C+and+in+respect+of+what+acts%2C+it+is+free.+Concerning+the+positive+acts+velle+and+nolle%2C+and+the+negative%2C+non+velle%2C+non+nolle%2C+and+concerning+the+liberty+of+contradiction+and+specification%3B+It%E2%80%99s+far+more+profitable+for+all+such+as+are+so+blessed+as+to+live+in+the+Church+and+enjoy+the+means+of+conversion+diligently+to+use+the+means+and+exercise+that+power+which+God+has+given+them%2C+and+also+earnestly+and+constantly+pray+for+the+regenerating+Spirit%2C+which+God+has+promised+to+them+that+seek+Him+in+an+orderly+way.+For+upon+this+done%2C+regeneration+will+follow%3B+and+by+the+divine+and+spiritual+power+given+them%2C+together+with+God%E2%80%99s+special+assistance%2C+and+concurrence%2C+after+all+necessary+preparations%2C+they+shall+freely+determine+and+the+will+shall+wholly+and+most+willingly+submit+to+God-Redeemer%2C+which+is+the+ultimate+product+of+divine+vocation%2C+the+parts+whereof+are+the+outward+Word%2C+and+the+inward+power+of+the+Spirit+which+go+together%2C+according+to+the+promise+of+the+Gospel%2C+and+make+up+the+essence+of+it%E2%80%A6+And+we+cannot+find+in+Scripture+that+God+denies+his+Spirit+to+such+as+hear+his+Word+till+they+give+God+cause+either+by+their+neglect+or+perversness%2C+or+apostasy+from+that+degree+of+grace+they+have+received+to+withdraw+the+same.+By+all+this+we+understand+that+Christ+finds+his+subjects%2C+to+whom+God+has+given+Him+a+right%2C+to+be+enemies%2C+and+He+enlarges+as+He+begins+his+Kingdom+by+a+kind+of+spiritual+conquest%2C+dashing+in+pieces+all+such+as+will+not+submit%2C+and+are+bound+to+submit%2C+with+his+iron+rod+and+irresistible+strength%2C+reducing+the+rest+unto+subjection%2C+after+some+time+of+standing+out%E2%80%A6+And+this+publication+of+his+laws+is+accompanied+with+a+wonderful+power+of+his+Spirit+whereby+together+with+the+Word+of+the+Kingdom%2C+He+pierces+the+minds+of+men+and+breaks+their+stony+hearts+in+sunder%2C+as+an+hammer+does+a+rock%3A+In+this+respect+the+Lord+says%2C+%E2%80%98Is+not+my+Word+like+as+a+fire%2C+and+like+an+hammer+that+breaks+the+rock+asunder%2C+Jer.+23%3A29.%E2%80%9D%0A%0A%E2%80%94+George+Lawson%2C+Theo-Politica%2C+or+a+Body+of+Divinity%E2%80%A6+%28London%3A+Streater%2C+1659%29%2C+pt.+2%2C+ch.+4%2C+pp.+113-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F721d85a7a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/721d85a7a2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=The%20manner%20of%20conversion%20is%20to,breaks%20the%20rock%20asunder%2C%20Jer.%2023%3A29&amp;text=The%20manner%20of%20conversion%20is%20to%20us%20unsearchable&amp;text=hammer%20that%20breaks%20the%20rock%20asunder%2C%20Jer.%2023%3A29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

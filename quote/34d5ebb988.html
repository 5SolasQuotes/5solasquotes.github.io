<blockquote><p>[I]t is called an holy rest, the rest of the holy Sabbath, and the commandment expressly saith, Remember to keep it holy. Now an holy rest certainly stands distinguished from a rest merely natural, when our bodies cease from action, and worldly labour, 2. A rest that is profane. By which I understand not only a sinful rest, unlawful on any day; but a rest from recreations, and pastimes, lawful enough on other days.

We read not in the old Law of any toleration for sports on the Sabbath, we read on the contrary that it was to be an holy rest, kept holy, &amp;c. To which sports cannot contribute: It seems unreasonable to think that labour should be forbidden, in order to our more serious and solemn service of God, and yet sports should be allowed, which every way as much distract, and unfit the Soul for acts of solemn worship. But the prophets are best interpreters of the Law.

Now the prophet Isaiah, Isa. 58.13. expounding this Law saith, If thou turn away thy foot from the Sabbath, from doing thy pleasure on my holy-day, and call the Sabbath a delight, the holy of the Lord, honourable, and shalt honour him, not doing thine own ways, nor finding thy own pleasure, nor speaking thy own words: Then shalt thou delight thy self in the Lord, and I will cause thee to ride upon the high places of the Earth, and feed thee with the heritage of Jacob thy father, for the mouth of the Lord hath spoken it. There is a precept v. 13. and a promise annexed to the due observance of that precept v. 14. The precept is directive for the sanctification of the Sabbath, which is called the Sabbath, the Lord’s holy day. The end of the Sabbath for which God instituted it, and which every one ought in the observation of it to aim at; and shalt honour him, the honouring and glorifying of God, that is the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), pp 99-100.</span></figcaption>

<blockquote><p>The sins which are prohibited can be enumerated as follows: First, we sin when we do not, with joyous approbation, set the sabbath apart from the other days, and when we fail to acknowledge that this day has been set apart by God by virtue of His example and command, having appointed it to be a day of rest, refreshment, and glorification of God. This sin consists in disobedience and a despising of privileges.

Secondly, we sin when we make a workday out of this day — if we occupy ourselves with the work of our profession; that is, to be engaged as brewers, bakers, laundry men, cooks, tailors, and shoemakers. Furthermore, we sin if, in order to finish remaining work, we then bring work home, even if it is toward noon. This also applies to barbers, those who load and unload ships, those who labour upon ferries, luggage porters, and garbage men; it pertains to all the labour whereby one earns a living. To this also belong miscellaneous activities which one postpones to the day of rest or does on this day to be prepared for the next day; such as mending, washing of children, to either prepare wash, send it to the laundry, or receive it at home, writing out bills, and going shopping — in one word, all that by which one gains money and time. On this day God wants universal cessation of activity upon the entire face of the earth. This is evident from the commandment itself.

Thirdly, we sin when we transform this day into a market day. This pertains to buying and selling by merchants, store owners, sellers of fruit, vendors of all sorts of edible material, sellers of fish, etc. (cf. Neh 13:15-16, 19-21).

Fourthly, we sin when we make this day into a day of worldly pleasure. The sabbath is a delight — however, a delighting in the Lord. It is a dreadful desecration of this day, however, when we abuse it by delighting ourselves in worldly things and in the lusts of the flesh. This pertains to sailing, horse-riding, fishing, bird-hunting, playing tennis, playing ball, or to the entertaining of one’s self with such things that are lawful at the appropriate time and place, in the appropriate company, and with the appropriate objective. This pertains even more to games of chance, playing cards, and playing with dice (cf. Isa 58:13-14). However, strolling in the fields or in gardens (be it alone or with others) does not belong to the forbidden sins, if we do so for the purpose of observing the works of God, to glorify Him thereby, and to be refreshed according to soul and body. Even if the world does this in a sinful manner, this cannot prevent the believer from doing it in a spiritual manner.

Fifthly, we sin when we make this day into a day of sin, attiring ourselves with all manner of hideous, worldly garb, and even daring to come thus to church and thereby before God‘s countenance. This pertains to drinking in bars and inns, where one can hear the violin, the vain chatter and jeering of drunkards, and the playing of drums. This pertains to having cold buffets in one’s yard, elaborate meals in the home, and being engaged in all manner of foolish talk and gossip. This pertains to going courting — as young men and women are accustomed to do in many villages. In one word, we sin if we spend this day in all manner of looseness and licentiousness. Such sins are double in measure — yes, they provoke God in an extraordinary manner.

Sixthly, we sin by making this a day of idleness, spending the entire day in a lazy and slothful manner, sleeping the major part of the morning. Having nothing to do, one can then catch up on sleep. Thus, there are many who sleep away the morning service, eat during the afternoon service, and walk away the evening service. Even if one has attended the worship services once or twice, he may possibly have slept there or have been occupied with other thoughts, and thus derived no more benefit from this than a donkey would. Such persons nevertheless imagine that they have spent the sabbath well, for they have rested and have been to church.

Seventhly, we sin when we reject and speak against the sabbath; draw others away from hallowing this day and give them liberty to do so; ridicule those who conscientiously hallow the sabbath according to God‘s command, railing at them by calling them ignorant, hair-splitters, and hypocrites (how abominable!); are unwilling to hallow the sabbath ourselves; draw others away from doing so; and mock with those who sanctify this day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 143-45.</span></figcaption>

<blockquote><p>We content our selves with the intercession, sacrifice, and monarchy of J[esus] Christ, and can join to Him neither Saints, nor Priests, nor the Pope in any of those three qualities, which the Scripture of the New Testament attributes to none but Him alone. We deem His blood sufficient for the purgation of our souls, having never learnt that either S. Paul, or any other Saint was crucified for us; nor, That after this life the Saints shall enter into any other place, but only one of repose and rest.

After Baptism and the Lord’s Supper we desire no other Sacraments; not having heard in His Word, that he hath obliged us necessarily to go to the ear of any Priest to receive his absolution, or to the hand of any Bishop to have his chrism. We dare not adore the bread which we break, nor the cup which we bless; because all confess, That it is not permitted us to adore any but God only. We can neither invocate creatures, since we have in the Scripture neither commandment nor example for it; nor prostrate our selves before images, since we have express commands therein against it.

We scruple at making any thing an Article of our Faith, which we have not heard in the Word of God; be he an Apostle or an Angel that evangelizeth. So that since we find nothing in the Scripture of abstinence from meats, distinction of times, and other Roman ceremonies, nor of the Limbus of infants, or purgatory; we cannot yet be persuaded that it is necessary for us to believe them.</p></blockquote>

</figure><figure class="quote" id="q-4d004e833f" data-kw="">
<blockquote><p>Q. Is not this [Fourth] Commandment Ceremonial?

A. No: First, if it were so, then the Moral Law should consist but of nine words, or Commandments, which is contrary to God’s word.

Secondly, this Commandment (amongst the rest) was written by the finger of God, whereas no part of the Ceremonial Law was.

Thirdly, it (as well as the other) was written in Tables of stone; to signify the continuance of this Commandment, as well as the rest. Fourthly, it was before any shadow or Ceremony of the Law, yea, before Christ was promised, whom all Ceremonies of the Law have respect unto.

Q. But it sometime shadowed our Eternal Rest, and is therefore Ceremonial.

A. That followeth not: for the ceremonial representation of our Eternal Rest, came after the Commandment of the Rest, and therefore is accessory and accidental; for which cause the time of correction, and of abolishment of ceremonies being come, that use may well fall away, and yet the Commandment remain, it being not of the substance of the Commandment.

Q. Have you yet any further reason, to confirm the perpetuity of the Rest of the seventh day?

A. Our Saviour Christ willing his followers, which should live about 40 years after his ascension, to pray that their flight might not be upon the Sabbath, to the end that they might not be hindered in the service of God; doth thereby sufficiently declare, that he held not this Commandment in the account of a ceremony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 110-11.</span></figcaption>

<blockquote><p>47. The rest of the day is to be spent in pious activity. Formerly there was an offering peculiar to the sabbath, but the continued or daily offering with its drink offering was not to be omitted, Num. 28:10.

48. Public worship, which is to be celebrated most solemnly, necessarily requires Scripture reading, meditation, prayer, holy discourse, and contemplation of the works of God wherein we may be more open to public worship and worship may become truly effective in us.</p></blockquote>

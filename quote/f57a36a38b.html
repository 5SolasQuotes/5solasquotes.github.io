<blockquote><p>Therefore impute your unfruitfulness to your unwatchfulness and your unbelief, and impute your want of full assurance unto an evil heart of unbelief, helped by Satan to act against the glorious free grace of God: and charge not these things to the want of sincerity in your closing with Christ.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c73d67f29" data-kw="">
<blockquote><p>This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 10</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.”

</figure><figure class="quote" id="q-9ea85d7a6b" data-kw="">
<blockquote><p>[Christians] look away from themselves to Christ. They believe that God has loved them from eternity past. They believe that the payment of Christ on the cross for sins was for them. They find Christ irresistible, and following Him the greatest privilege of all. They have faith in Christ and what He has done for them. They trust Christ, looking outside of themselves to Him alone.</p></blockquote>

</figure><figure class="quote" id="q-acc6479fcb" data-kw="">
<blockquote><p>Calling is made (Romans 8:30) the middle link of the golden chain of salvation. It is placed between predestination and glorification; and if we have this middle link fast, we are sure of the two other ends of the chain.</p></blockquote>

</figure><figure class="quote" id="q-11ff0d4a49" data-kw="">
<blockquote><p>This infallible assurance does not so belong to the essence of faith, but that a true believer may wait long, and struggle with many difficulties before he be partaker of it; yet being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of means, attain thereunto: and therefore it is the duty of every one to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Spirit, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.3</span></figcaption>

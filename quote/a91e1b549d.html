<main class="wrap"><figure class="quote" id="q-a91e1b549d" data-kw="">
<blockquote><p>Scripture does not say or indicate that she later lost her virginity… … The form of expression used by Matthew is the common idiom, as if I were to say, “Pharaoh believed not Moses, until he was drowned in the Red Sea.” Here it does not follow that Pharaoh believed later, after he had drowned; on the contrary, it means that he never did believe. Similarly when Matthew [1:25] says that Joseph did not know Mary carnally until she had brought forth her son, it does not follow that he knew her subsequently; on the contrary, it means that he never did know her. Again, the Red Sea overwhelmed Pharaoh before he got across. Here too it does not follow that Pharaoh got across later, after the Red Sea had overwhelmed him, but rather that he did not get across at all. In like manner, when Matthew [1:18] says, “She was found to be with child before they came together,” it does not follow that Mary subsequently lay with Joseph, but rather that she did not lie with him. Elsewhere in Scripture the same manner of speech is employed. Psalm 110[:1] reads, “God says to my Lord: ‘Sit at my right hand, till I make your enemies your footstool.’ ” Here it does not follow that Christ does not continue to sit there after his enemies are placed beneath his feet. Again, in Genesis 28[:15], “I will not leave you until I have done all that of which I have spoken to you.” Here God did not leave him after the fulfillment had taken place. Again, in Isaiah 42[:4], “He shall not be sad, nor troublesome, till he has established justice in the earth.” There are many more similar expressions, so that this babble of Helvidius is without justification; in addition, he has neither noticed nor paid any attention to either Scripture or the common idiom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>That Jesus Christ was Born a Jew</cite>, (1523) in LW 45.206, 212-213</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-336b61687d" data-kw="">
<blockquote><p>As Zwingli’s successor, Heinrich Bullinger (1504-1575) consolidated the reform of Zurich. Nevertheless, he is more positively disposed toward Marian doctrine and piety. His ‘Sermon on Mary,’ after defending Mary’s perpetual virginity… This is not to say that the sermon is a wholesale endorsement of Marian developments to the sixteenth century, for it also regards the immaculate conception and the bodily assumption as open questions… Bullinger also inveighs against her invocation and rejects the understanding of Mary as mistress of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Affirmation of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Heinrich Bullinger | Perry, Tim, Mary for Evangelicals: Toward an Understanding of the Mother of Our Lord (IVP Academic, 2006), p. 218</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-cfbccf335c" data-kw="">
<blockquote><p>Therefore, we maintain that the blessed Virgin is not to be worshiped, not to be invoked as a mediator or mother of graces; we do not want to place our trust in her, offer sacrifices in her name, celebrate festivals in her honor, erect images of her, or honor her through any such cult!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Virgin Mary, p. 13</span></figcaption>

<blockquote><p>These Calamities have not come upon us without Warnings. We were long ago apprised of the ambitious Schemes of our Enemies, and their Motions to carry them into Execution: And had we taken timely Measures, they might have been crushed, before they could arrive at such a formidable Height. But how have we generally behaved in such a critical Time; Alas! our Country has been sunk in a deep Sleep: A stupid Security has unmanned the Inhabitants: They could not realize a Danger at the Distance of 2 or 300 Miles: They would not be persuaded, that even French Papists could seriously design us an Injury: And hence little or nothing has been done for the Defence of our Country in Time, except by the Compulsion of Authority.

And now, when the Cloud thickens over our Heads, and alarms every thoughtful Mind with its near Approach, Multitudes, I am afraid, are still dissolved in careless Security, or enervated with an effeminate, cowardly Spirit. When the melancholy News first reached us concerning the Fate of our Army, then we saw how natural it is for the Presumptuous to fall into the opposite Extreme of unmanly Despondence and Consternation; and how little Men could do in such a Panic for their own Defence.

We have also suffered our poor Fellow-Subjects in the Frontier Counties to fall a helpless Prey to Blood-thirsty Savages, without affording them proper Assistance, which as Members of the same Body Politic, they had a Right to expect. They might as well have continued in a State of Nature, as be united in Society, if in such an Article of extreme Danger, they are left to shift for themselves. The bloody Barbarians have exercised on some of them the most unnatural and leisurely Tortures; and others they have butchered in their Beds, or in some unguarded Hour.

Can human Nature bear the Horror of the Sight! See yonder! the hairy Scalps, clotted with Gore! the mangled Limbs! the ript-up Women! the Heart and Bowels, still palpitating with Life, smoking on the Ground! See the Savages swilling their Blood, and imbibing a more outrageous Fury with the inhuman Draught! Sure these are not Men; they are not Beasts of Prey; they are something worse; they must be infernal Furies in human Shape. And have we tamely looked on, and suffered them to exercise these hellish Barbarities upon our Fellow-Men, our Fellow-Subjects, our Brethren? Alas! with what Horror must we look upon ourselves, as being little better than Accessories to their Blood?

And shall these Ravages go on unchecked? Shall Virginia incur the Guilt and the everlasting Shame, of tamely exchanging her Liberty, her Religion, and her All, for arbitrary Gallic Power, and for Popish Slavery, Tyranny and Massacre? Alas! are there none of her Children, that enjoyed all the Blessings of her Peace, that will espouse her Cause, and befriend her now in the Time of her Danger? Are Britons utterly degenerated by so short a Remove from their Mother-Country?

Is the Spirit of Patriotism entirely extinguished among us? And must I give thee up for lost, O my Country, and all that is included in that important Word? Must I look upon thee as a conquered, enslaved Province of France, and the Range of Indian Savages? My Heart breaks at the Thought. And must ye, our unhappy Brethren in our Frontiers, must ye stand the single Barriers of a ravaged Country, unassisted, unbefriended, unpitied? Alas! must I draw these shocking Conclusions?

No; I am agreeably checked by the happy, encouraging Prospect now before me. Is it a pleasing Dream? Or do I really see a Number of brave Men, without the Compulsion of Authority, without the Prospect of Gain, voluntarily associated in a Company, to march over horrendous Rocks and Mountains, into an hideous Wilderness, to succour their helpless Fellow-Subjects, and guard their Country?

Yes, Gentlemen, I see you here upon this Design; and were you all united to my Heart by the most endearing Ties of Nature, or Friendship, I could not wish to see you engaged in a nobler Cause; and whatever the Fondness of Passion might carry me to, I am sure my Judgment would never suffer me to persuade you to desert it. You all generously put your Lives in your Hands; and sundry of you have nobly disengaged yourselves from the strong and tender Ties that twine about the Heart of a Father, or a Husband, to confine you at home in inglorious Ease, and sneaking Retirement from Danger, when your Country calls for your Assistance.

While I have you before me, I have high Thoughts of a Virginian; and I entertain the pleasing Hope that my Country will yet emerge out of her Distress, and flourish with her usual Blessings. I am gratefully sensible of the unmerited Honour you have done me, in making Choice of me to address you upon so singular and important an Occasion: And I am sure I bring with me a Heart ardent to serve you and my Country, though I am affraid my Inability, and the Hurry of my Preparations, may give you Reason to repent your Choice. I cannot begin my Address to you with more proper Words than those of a great General, which I have read to you: Be of good Courage, and play the Men, for your People, and for the Cities of your God; and the Lord do what seemeth him good.</p></blockquote>

<blockquote><p>The mentioning of these two duties meeting together at one time in our practise does not intend that they do both of them bind the conscience at the same instant, but they are called duties as they are considered apart; being both works are commanded of God in two several commandments: Which two works being duties considered apart, do sometimes offer themselves to our practise at one instant; As to hear a sermon at the church on the Sabbsth, and to tend a sick person ready to die at home at the same time, both are duties being considered apart, but meeting together, and offering themselves to our practise at one time, there is indeed but one duty, because both cannot be performed in one instant; In which case the greater work is the duty, the lesser binds not for that present…</p></blockquote>

<blockquote><p>5. That it is not to be doubted but the counsels of the [Westminster] Assembly of Divines and the care of the Parliament will be not only to reform and set up religion throughout the nation, but will concur to preserve whatever shall appear to be the rights of particular congregations, according to the Word, and to bear with such whose consciences cannot in all things conform to the public rule, so far as the Word of God would have them borne withal.</p></blockquote>

<blockquote><p>But touching an erring conscience, the question is not whether an erroneous conscience does so tie that we must do nothing on the contrary, nor is the question whether the nearest, actually obliging rule, be conscience; the Arminians tell us [that] though the Word of God, of itself, and by itself, have power to oblige, yet it actually obliges no man except it be understood, and so is believed to be understood, after we use all possible diligence and prudence, for no man is obliged to follow the true sense of the Word against his conscience, though it be erroneous; But we think the Word of God is both the farest and nearest, and the only obliging rule, and that the ditement [judgment] of the conscience does neither bind potentially nor actually, but is a mere [in Greek], a messenger and an official relater of the will and mind to God to us, and all the obliging power is from the Word; [???] the messenger of a king and judge is not the obliging [???] that ties the subject, or the herald’s promulgation of the Law, is no obliging rule; for [the] promulgation of heralds is common both to just and to unjust laws, and certainly unjust laws from a just prince lay no band on the conscience or on the man, far less can the promulgation, as the promulgation, lay any bands on the conscience; the word of a messenger and herald is at the best but a condition, or the approximation of the obliging power to us, but all the obliging power is from the king and the judge. It is most false then, that these Libertines say that the Word does not actually oblige except it be understood, for the understanding, information and indictment of conscience does not add any actual obligation to the Word that it had not before, it only is a reporter, to carry both the Word and the actual obligation to the man; the herald promulgating the law adds no obligation, actual or potential, to the law that it had not before, only it makes an union in distance, and near application and conjunction between the actually obliging law and the understanding knowledge of the person or subject, who is obliged to keep the law; though it be true the fire cannot actually burn but as timber is cast to it, yet the fire has from its own nature both potential and actual burning, not from the act of casting the timber in the fire; Nor is this a concludent reason, ‘no man is obliged [to] follow how the true sense of the Word against his conscience, though erroneous, ergo [therefore] the erroneous conscience does oblige, or ergo, actual obligation to obedience is not from the Word, but from the conscience;’ no more than this is a good consequence: no man is obliged to obey the Law in itself, just contrary to the promulgation of an erring and mistaking herald, ergo, the mistaking herald’s promulgation gives to the Law actual obligation over the subject; for it only follows [that] we are not to do contrary to the actual indictment of an erroneous conscience, but not obliged to follow the erroneous conscience; Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience. … …an erroneous conscience must be a transgressing conscience, and it is a contradiction that a faculty sinning should oblige to obedience to the Law of God, in the same consideration, because it sins.</p></blockquote>

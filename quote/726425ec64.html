<main class="wrap"><figure class="quote" id="q-726425ec64" data-kw="">
<blockquote><p>The promise, accepted by the parents in faith, also includes their children to a thousand generations… If it is objected that not all of them who are born of believing parents are elect, seeing that God did not choose all the children of Abraham and Issac, we do not lack an answer. Though we do not deny that this is the case, still we say that this hidden judgment must be left to God and that normally, by virtue of the promise, all who have been born of believing parents, or if one of the parents believe, are sanctified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of the Christian Faith</cite>, 4.48 as quoted in ‘The Doctrine of the Covenant in Reformed Theology’, p. 263 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980) Kraut, p. 26-27 has another translation of this passage, though gives the reference as De Spirit. Sac., IV, 29, which we are not able to find.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“The promise, accepted by the parents in faith, also includes their children to a thousand generations… If it is objected that not all of them who are born of believing parents are elect, seeing that God did not choose all the children of Abraham and Issac, we do not lack an answer. Though we do not deny that this is the case, still we say that this hidden judgment must be left to God and that normally, by virtue of the promise, all who have been born of believing parents, or if one of the parents believe, are sanctified.”

— Theodore Beza, Confession of the Christian Faith, 4.48 as quoted in ‘The Doctrine of the Covenant in Reformed Theology’, p. 263 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980) Kraut, p. 26-27 has another translation of this passage, though gives the reference as De Spirit. Sac., IV, 29, which we are not able to find.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+promise%2C+accepted+by+the+parents+in+faith%2C+also+includes+their+children+to+a+thousand+generations%E2%80%A6+If+it+is+objected+that+not+all+of+them+who+are+born+of+believing+parents+are+elect%2C+seeing+that+God+did+not+choose+all+the+children+of+Abraham+and+Issac%2C+we+do+not+lack+an+answer.+Though+we+do+not+deny+that+this+is+the+case%2C+still+we+say+that+this+hidden+judgment+must+be+left+to+God+and+that+normally%2C+by+virtue+of+the+promise%2C+all+who+have+been+born+of+believing+parents%2C+or+if+one+of+the+parents+believe%2C+are+sanctified.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Confession+of+the+Christian+Faith%2C+4.48+as+quoted+in+%E2%80%98The+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%99%2C+p.+263+in+Redemptive+History+and+Biblical+Interpretation%3A+The+Shorter+Writings+of+Geerhardus+Vos+ed.+Gaffin+%28P%26R%2C+1980%29+Kraut%2C+p.+26-27+has+another+translation+of+this+passage%2C+though+gives+the+reference+as+De+Spirit.+Sac.%2C+IV%2C+29%2C+which+we+are+not+able+to+find.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F726425ec64.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/726425ec64.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-salvation-of-infants-in-without-the-church/#:~:text=The%20promise%2C%20accepted%20by%20the%20parents,of%20the%20parents%20believe%2C%20are%20sanctified&amp;text=The%20promise%2C%20accepted%20by%20the%20parents%20in%20faith&amp;text=if%20one%20of%20the%20parents%20believe%2C%2 </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c8169f3d76" data-kw="">
<blockquote><p>All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Exercitations</cite>, 37.1,18-19 as translated in Charles P. Krauth, Infant Baptism and Infant Salvation in the Calvinistic system. A Review of Dr. Hodge’s Theology (Philadelphia: Lutheran Books Store, 1874), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.”

n-of-infants-in-without-the-church/#:~:text=All%20infants%20of%20Christians%2C%20even%20before,the%20elect%20alone%2C%20which%20baptism%20seals&amp;text=All%20infants%20of%20Christians%2C%20even%20before%20baptism%20are&amp;text=prerogative%20of%20the%20elect%20alone%2C%20which%20baptism%20seals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-ad50bae669" data-kw="">
<blockquote><p>Even in early times circumcision also conferred upon the circumcised among the non-elect a privilege above the non-circumcised. To them were entrusted the oracles of God, Rom. 3:1-2.–By a like reasoning there is a common grace and favor of God, which all baptized persons possess, even the non-elect, viz., initiation and ingrafting into the outward body of the Church, in virtue of which even though perishing they have a right to the name of huieis basileias [sons of the kingdom] and enjoy the outward privileges of God’s covenanted.–But this is the mere courtyard, shell and surface of baptism. … As for adults, outward baptism does not seal inward grace for all of them, but for those alone who bear in their hearts a faith the reverse of feigned and confess it in words. Nor yet for the children of believing parents one and all, but only for the elect is baptism the sign of regeneration and universal spiritual grace. Although it is right and godly in the case of individual children of the kind to have good hopes of the judgment in love, in the case of them all it is not so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Theology</cite>, 25.49-50 as translated in Heppe, Reformed Dogmatics ed. Bizer, trans. Thompson (1950; rep. Wipf &amp; Stock, 2007), pp. 622-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

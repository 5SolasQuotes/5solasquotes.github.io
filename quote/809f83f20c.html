<main class="wrap"><figure class="quote" id="q-809f83f20c" data-kw="">
<blockquote><p>…they repeatedly go wrong through their deluded notion that the thing ought always to precede the sign in order of time… in infant baptism nothing more of present effectiveness must be required than to confirm and ratify the covenant made with them by the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes 4.16.21</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c8169f3d76" data-kw="">
<blockquote><p>All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marc-frederic-wendelin.html">Marc Frederic Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Exercitations, 37.1,18-19 as translated in Charles P. Krauth, Infant Baptism and Infant Salvation in the Calvinistic system. A Review of Dr. Hodge’s Theology (Philadelphia: Lutheran Books Store, 1874)</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.”

— Marc Frederic Wendelin, Theological Exercitations, 37.1,18-19 as translated in Charles P. Krauth, Infant Baptism and Infant Salvation in the Calvinistic system. A Review of Dr. Hodge’s Theology (Philadelphia: Lutheran Books Store, 1874), p. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+infants+of+Christians%2C+even+before+baptism+are+holy%2C+with+a+federal+and+external+holiness%2C+on+account+of+which+they+ought+to+be+reputed+a+part+of+the+visible+Church+and+people+of+God%2C+and+as+federates+be+admitted+to+the+seal+of+the+Covenant.+Some+infants+of+Christians%2C+even+before+Baptism%2C+nay+even+in+their+mother%E2%80%99s+womb%2C+not+indeed+by+nature%2C+but+by+grace%2C+are+holy+with+an+internal+sanctity%2C+and+these+infants+are+believers+and+regenerate%E2%80%A6+The+internal+sanctity+is+not+necessarily+conjoined+with+the+federal%2C+but+in+many+infants+and+adults+is+separated+from+it.+This+we+learn+from+the+event%3B+for+those+who+were+once+sanctified+never+wholly+lose+their+sanctity.+%E2%80%A6+There+is+no+need+here+of+inferences+or+citations%2C+to+convince+me.+Of+my+own+accord%2C+and+freely+and+expressly+I+confess%2C+with+%5BZacharias%5D+Ursinus+and+our+other+teachers%2C+that+not+all+who+are+baptized%2C+whether+adults+or+infants%2C+become+participants+of+the+grace+of+Christ%2C+for+the+election+of+God+is+most+free%3A+it+is+therefore+a+prerogative+of+the+elect+alone%2C+which+baptism+seals.%E2%80%9D%0A%0A%E2%80%94+Marc+Frederic+Wendelin%2C+Theological+Exercitations%2C+37.1%2C18-19+as+translated+in+Charles+P.+Krauth%2C+Infant+Baptism+and+Infant+Salvation+in+the+Calvinistic+system.+A+Review+of+Dr.+Hodge%E2%80%99s+Theology+%28Philadelphia%3A+Lutheran+Books+Store%2C+1874%29%2C+p.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc8169f3d76.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c8169f3d76.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-salvation-of-infants-in-without-the-church/#:~:text=All%20infants%20of%20Christians%2C%20even%20before,the%20elect%20alone%2C%20which%20baptism%20seals&amp;text=All%20infants%20of%20Christians%2C%20even%20before%20baptism%20are&amp;text=prerogative%20of%20the%20elect%20alone%2C%20which%20baptism%20seals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-db514445aa" data-kw="">
<blockquote><p>Our continual answer to the Anabaptists, when they appeal to the lack of faith in infants against infant baptism, is that the Holy Spirit works regeneration and the inclination to faith and obedience to God in them in a manner appropriate to their age, always with it understood that we leave the free mercy and heavenly election unbound and unpenetrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sudhoff, Olevianus und Ursinus, pp. 633 ff. as quoted in Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’, p. 265 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our continual answer to the Anabaptists, when they appeal to the lack of faith in infants against infant baptism, is that the Holy Spirit works regeneration and the inclination to faith and obedience to God in them in a manner appropriate to their age, always with it understood that we leave the free mercy and heavenly election unbound and unpenetrated.”

— Zacharias Ursinus, Sudhoff, Olevianus und Ursinus, pp. 633 ff. as quoted in Geerhardus Vos, ‘The Doctrine of the Covenant in Reformed Theology’, p. 265 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+continual+answer+to+the+Anabaptists%2C+when+they+appeal+to+the+lack+of+faith+in+infants+against+infant+baptism%2C+is+that+the+Holy+Spirit+works+regeneration+and+the+inclination+to+faith+and+obedience+to+God+in+them+in+a+manner+appropriate+to+their+age%2C+always+with+it+understood+that+we+leave+the+free+mercy+and+heavenly+election+unbound+and+unpenetrated.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+Sudhoff%2C+Olevianus+und+Ursinus%2C+pp.+633+ff.+as+quoted+in+Geerhardus+Vos%2C+%E2%80%98The+Doctrine+of+the+Covenant+in+Reformed+Theology%E2%80%99%2C+p.+265+in+Redemptive+History+and+Biblical+Interpretation%3A+The+Shorter+Writings+of+Geerhardus+Vos+ed.+Gaffin+%28P%26R%2C+1980%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb514445aa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db514445aa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-salvation-of-infants-in-without-the-church/#:~:text=Our%20continual%20answer%20to%20the%20Anabaptists,and%20heavenly%20election%20unbound%20and%20unpenetrated&amp;text=Our%20continual%20answer%20to%20the%20Anabaptists%2C%20when%20they&amp;text=free%20mercy%20and%20heavenly%20election%20unbound%20and%20unpenetrated" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1ea38796bf" data-kw="">
<blockquote><p>The Holy Spirit exercises his power in the elect alone… the other who are condemned and not elect, being left… The adoption is offered in circumcision, to all who are circumcised; but the elect alone receive it, whose eyes God has opened, that they may see and be saved. The rest, to whom God hath not vouchsafed this grace, are left to his righteous judgement, and yet God remains true. The same takes place in Baptism, which many thousand infants receive, who yet are never regenerated, but perish forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Colloquy of Mt. Belligart, which was held in 1586 (Tubingen, 1587), ‘On Baptism’, p. 479. The translation is from Kraut, p. 26; see there for a fuller account of the exchange with the Lutheran Jacob Andrea, who held otherwise.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Holy Spirit exercises his power in the elect alone… the other who are condemned and not elect, being left… The adoption is offered in circumcision, to all who are circumcised; but the elect alone receive it, whose eyes God has opened, that they may see and be saved. The rest, to whom God hath not vouchsafed this grace, are left to his righteous judgement, and yet God remains true. The same takes place in Baptism, which many thousand infants receive, who yet are never regenerated, but perish forever.”

</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

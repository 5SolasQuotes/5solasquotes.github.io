<main class="wrap"><figure class="quote" id="q-f50dc5bd73" data-kw="">
<blockquote><p>The law of the Lord. Here the second part of the psalm commences. After having shown that the creatures, although they do not speak, nevertheless serve as instructors to all mankind, and teach all men so clearly that there is a God, as to render them inexcusable, the Psalmist now turns towards the Jews, to whom God had communicated a fuller knowledge of himself by means of his word. While the heavens bear witness concerning God, their testimony does not lead men so far as that thereby they learn truly to fear him, and acquire a well-grounded knowledge of him; it serves only to render them inexcusable. It is doubtless true, that if we were not very dull and stupid, the signatures and proofs of Deity which are to be found on the theatre of the world, are abundant enough to incite us to acknowledge and reverence God; but as, although surrounded with so clear a light, we are nevertheless blind, this splendid representation of the glory of God, without the aid of the word, would profit us nothing, although it should be to us as a loud and distinct proclamation sounding in our ears.

Accordingly, God vouchsafes to those whom he has determined to call to salvation special grace, just as in ancient times, while he gave to all men without exception evidences of his existence in his works, he communicated to the children of Abraham alone his Law, thereby to furnish them with a more certain and intimate knowledge of his majesty. Whence it follows, that the Jews are bound by a double tie to serve God. As the Gentiles, to whom God has spoken only by the dumb creatures, have no excuse for their ignorance, how much less is their stupidity to be endured who neglect to hear the voice which proceeds from his own sacred mouth? The end, therefore, which David here has in view, is to excite the Jews, whom God had bound to himself by a more sacred bond, to yield obedience to him with a more prompt and cheerful affection.

Farther, under the term law, he not only means the rule of living righteously, or the Ten Commandments, but he also comprehends the covenant by which God had distinguished that people from the rest of the world, and the whole doctrine of Moses, the parts of which he afterwards enumerates under the terms testimonies, statutes, and other names. These titles and commendations by which he exalts the dignity and excellence of the Law would not agree with the Ten Commandments alone, unless there were, at the same time, joined to them a free adoption and the promises which depend upon it; and, in short, the whole body of doctrine of which true religion and godliness consists.

As to the Hebrew words which are here used, I will not spend much time in endeavouring very exactly to give the particular signification of each of them, because it is easy to gather from other passages, that they are sometimes confounded or used indifferently. עדות, eduth, which we render testimony, is generally taken for the covenant, in which God, on the one hand, promised to the children of Abraham that he would be their God, and on the other required faith and obedience on their part. It, therefore, denotes the mutual covenant entered into between God and his ancient people. The word פקודים, pikkudim, which I have followed others in translating statutes, is restricted by some to ceremonies, but improperly in my judgment: for I find that it is every where taken generally for ordinances and edicts. The word מצוה, mitsvah, which follows immediately after, and which we translate commandment, has almost the same signification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 317-18.</span></figcaption>

<blockquote><p>If we pass to the New Testament, we shall there also find this Argument used. From the Fabrick of the World St. Paul proves to the Men of Lystra, that there is a God, a Living God, in Contra distinction to the Gentile Gods, or Idols rather. From the making of Heaven and Earth, the Sea and all things that are therein, he argues the Existence of an All-sufficient and Self-subsistent Being, Acts 14.15.

And again, Rom. 1.20. The invisible things of God from (i. e. ever since) the Creation of the World are clearly seen, being understood by the things that are made, even his eternal Power and Godhead, even those Invisible things are clearly manifested by those Visible Works that he hath wrought. Or perhaps the meaning … may be from the Consideration of the Creation, from this alone the invisible things of the Deity, viz. his Power, Wisdom and Bounty are seen and proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A demonstration of the existence and providence of God, from the contemplation of the visible structure of the greater and the lesser world in two parts, the first shewing the excellent contrivance of the heavens, earth, sea, &amp;c., the second the wonderful formation of the body of man</cite>, (London: Jonathan Robinson and John Wyat, 1696), 1.12, pp 252-53.</span></figcaption>

<blockquote><p>But, are not the knowledge of God and the principles, like the common sentences, imprinted in the nature of man, even though it is so corrupted?

They obviously are, though they are like the ruins of a magnificent building. Most importantly I say that this [saving] faith does not consist of natural knowledge, but it is necessary to add that which God particularly revealed to the world through the Prophets &amp; Apostles, which flesh and blood could never deduce. This final point must be noted, that in which we find the special difference between faith and natural knowledge, that is, that each believer particularly applies to himself the promise of eternal life, whose testimony the Scriptures call certainty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Questions et r</cite>, éponses Chrestiennes (Eustace Vignon, 1584), 38-39. Translated in David Haines, Without Excuse: Scripture, Reason, and Presuppositional Apologetics (Lincoln NE: The Davenant Press, Kindle Edition, 2020), pp 225-26.</span></figcaption>

<blockquote><p>nature; a term having three primary meanings in scholastic theology and in Protestant orthodox usage: (1) essence; (2) a particular kind or species of essence in its actual existence; (3) the entire physical universe and its phenomenon… In the third sense, natura simply refers to the order of nature and is used in such terms as lex naturalis (q.v.), natural law, or theologia naturalis (q.v.), natural theology–the law implicit in the order of the phenomenal world and the knowledge of God obtainable from examination of the physical universe.</p></blockquote>

<blockquote><p>Even though the natural knowledge of God is not salvific, it nevertheless serves a purpose and is useful for the following reasons:

(1) It teaches that God exists; that He is an invisible, spiritual Being; is infinite; is the first cause of all things; in His Being is infinitely exalted above all that exists; and is holy, omnipotent, good and just.

(2) It teaches that God is the cause of all things (also of him who meditates about God), and thus is sovereign Lord over all. It teaches that by His influence He upholds, governs, and directs all things according to His will, so that no one can stay His hand or say, “What doest Thou?”

(3) It teaches that every human being is obligated to Him with an irrevocable obligation to do His will as expressed in His law, which is revealed to him by virtue of the light of nature.

(4) By this man can view his sin and guilt against the background of God’s justice.

(5) It promotes the maintenance of human society.</p></blockquote>

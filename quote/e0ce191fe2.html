<blockquote><p>Let the question be asked, Why is the possession of all saving blessings connected with faith, and with faith alone? It is easy, at once, to dismiss all answers to this question which would imply that there is anything like a plea of merit, or a qualification of worthiness, in faith.

It is, doubtless, in itself an excellent grace, most honouring and acceptable to God and his beloved Son, as well as most becoming and ennobling to him who exercises it. It is, moreover, the source of all excellence, working by love, and assimilating its possessor to God himself; for, by “the exceeding great and precious promises” which faith receives, we “are made partakers of the divine nature.”

But to represent it as saving or justifying, on account of its own excellency or the virtue that goes out of it, is to build again the covenant of works — making the good quality of faith, or its good fruits, our real title to the divine favour and eternal life, instead of the perfect obedience which the law requires. In this view, the dispensation of grace, brought in through the mediation of Christ, consists simply in a relaxation of the terms of the old natural and original method of acceptance — not in the establishment of a method of acceptance entirely new.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross of Christ; The Call of God; Saving Faith: An Inquiry into the Completeness and Extent of the Atonement. With especial reference to the Universal Offer of the Gospel, and the Universal Obligation to Believe</cite>, (2nd edn, Edinburgh: John Johnstone, 1845), p. 59.</span></figcaption>

<blockquote><p>VI. Episcopius, and with him the Remonstrants, deny that a covenant of nature was made with Adam (“Institutiones theologica,” 2.1 in Opera theologica [1678], p. 23); but it can be proved. (1) There are granted the essential parties of a covenant, God and man. God, who as the Creator of man, must also be his governor and from this, his legislator, and because good in his own nature, the rewarder also of those who seek him (Heb. 11:6), so that he would not only give him a law for his direction, but also hold forth a reward to him for keeping it (although bound by no right to that). Man who, because a creature, must also wholly depend upon God and, because upright, could keep the inscribed law, and because rational, ought not otherwise than in a rational manner (i.e., by the intellect and will) be governed, both by the prescription of a law, the promise of rewards and the threatening of punishment. Also since he was created after the image of divine holiness, he ought to have been led to a communion of that happiness also which is the inseparable attendant of holiness.

VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12).

VIII. Third, the passage in Hos. 6:7 seems not obscurely to intimate this: the Israelites are said to have “transgressed the covenant like Adam” (hmh k’dhm ‘bhrv bhryth). For although these words may also be explained of the inconstancy of men (that they may be said to have transgressed the covenant as men are wont to do, who are naturally false and fickle, and often deceive expectation), still nothing prevents their being referred also to Adam (that they may be said to have violated the covenant like Adam, their first parent, who miserably broke the covenant contracted with him by God). A similar locution occurs in Job 31:33: “If I covered,” says he, “my transgressions as Adam [k’dhm].” Here is a manifest reference to the fact of Adam’s endeavoring to excuse and hide his sin (Gen. 3:12).</p></blockquote>

<blockquote><p>XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.</p></blockquote>

</figure><figure class="quote" id="q-07fc90e93b" data-kw="">
<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promises to men some good, and requires of them again, that they perform those things which he commands. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promises men eternal life. And that is twofold: the covenant of works or the covenant of grace. The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, and also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2. 17. The repetition of the covenant of works is made by God, Exod. 19. 5. Deut. 5. 2. 1. King. 8. 21. Heb. 8. 9. and that chiefly for four causes. That God by all means might stir up men to perform obedience. That every mouth might be stopped, and all the world might be made subject to the condemnation of God for not performing perfect obedience. Rom. 3. 19. That he might manifest mans sin, and naughtiness. Rom. 3. 19. 20. and 7. 7. 8. 9. 10. 11. That he might thrust us forward to seek to be restored in the covenant of grace. Gal. 3. 22. and 5. 23.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“God’s covenant is a bargain which God hath made with men, in which God promises to men some good, and requires of them again, that they perform those things which he commands. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promises men eternal life. And that is twofold: the covenant of works or the covenant of grace. The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, and also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2. 17. The repetition of the covenant of works is made by God, Exod. 19. 5. Deut. 5. 2. 1. King. 8. 21. Heb. 8. 9. and that chiefly for four causes. That God by all means might stir up men to perform obedience. That every mouth might be stopped, and all the world might be made subject to the condemnation of God for not performing perfect obedience. Rom. 3. 19. That he might manifest mans sin, and naughtiness. Rom. 3. 19. 20. and 7. 7. 8. 9. 10. 11. That he might thrust us forward to seek to be restored in the covenant of grace. Gal. 3. 22. and 5. 23.”

— Amandus Polanus, Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions, trans. E. W. (London, 1595), 87–88. [Spelling modernized]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod%E2%80%99s+covenant+is+a+bargain+which+God+hath+made+with+men%2C+in+which+God+promises+to+men+some+good%2C+and+requires+of+them+again%2C+that+they+perform+those+things+which+he+commands.+And+that+covenant+is+either+eternal+or+temporal.+The+eternal+covenant+is+a+covenant+in+which+God+promises+men+eternal+life.+And+that+is+twofold%3A+the+covenant+of+works+or+the+covenant+of+grace.+The+covenant+of+works%2C+is+a+bargain+of+God+made+with+men+concerning+eternal+life%2C+to+which+is+both+a+condition+of+perfect+obedience+adjoined%2C+to+be+performed+by+man%2C+and+also+a+threatening+of+eternal+death+if+he+shall+not+perform+perfect+obedience.+Gen.+2.+17.+The+repetition+of+the+covenant+of+works+is+made+by+God%2C+Exod.+19.+5.+Deut.+5.+2.+1.+King.+8.+21.+Heb.+8.+9.+and+that+chiefly+for+four+causes.+That+God+by+all+means+might+stir+up+men+to+perform+obedience.+That+every+mouth+might+be+stopped%2C+and+all+the+world+might+be+made+subject+to+the+condemnation+of+God+for+not+performing+perfect+obedience.+Rom.+3.+19.+That+he+might+manifest+mans+sin%2C+and+naughtiness.+Rom.+3.+19.+20.+and+7.+7.+8.+9.+10.+11.+That+he+might+thrust+us+forward+to+seek+to+be+restored+in+the+covenant+of+grace.+Gal.+3.+22.+and+5.+23.%E2%80%9D%0A%0A%E2%80%94+Amandus+Polanus%2C+Substance+of+Christian+Religion+Soundly+set+forth+in+Two+Books%2C+by+Definitions+%26+Partitions%2C+trans.+E.+W.+%28London%2C+1595%29%2C+87%E2%80%9388.+%5BSpelling+modernized%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F07fc90e93b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/07fc90e93b.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/polanus-on-the-covenant-of-works-with-adam-and-israel/" rel="noopener" ta <blockquote><p>I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall.

II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise.

III. They had a double use.

      1. That man’s obedience might be tried, by using of the one, and abstaining from the other.

      2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy.

IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification.

V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event.

VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2a618b3f0c" data-kw="">
<blockquote><p>In all things submit yourself to be a child of God so that you reproach not His Sonship. He has not adopted you by His wonderful mercy. In all you do be sure to consider and act as one who is aware that God is always with you and by your side. Take heed, then, not only to your external senses but also to your most secret imaginations of thought so that none will possess you with lust or other sinful desires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of God and Spiritual Friendship</cite>, ed. James M. Houston (Basingstoke: Pickering &amp; Inglis, 1983), p. 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95ac26add9" data-kw="">
<blockquote><p>1. The wicked, God’s adversaries, are in some way his own; and that ownness works patience. The Lord is a piece of a Father to them also. For He is: A common Father by office to all; A special Father by adoption to saints; A singular Father by nature to Christ. A Prince, besides his particular relation to his children, is Pater patriae [a father of fathers], Pater familias [a father of the family], and is good to all, though with a difference: So here.

2. Though Christ has purchased a peculiar people to Himself, to the purpose of salvation, yet others taste of this his goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-harris.html">Robert Harris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached to the honorable House of Commons assembled in Parliament, at a public fast, May 25</cite>, 1642 (London: for John Bartlet, 1642), p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>

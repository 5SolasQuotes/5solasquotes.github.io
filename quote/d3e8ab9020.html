<blockquote><p>2. Though a Church retain the fundamentals, yet if we be forced to avow and believe as truth, doctrines everting the foundation of faith, against the article of one God; if we must worship as many Gods as there be [Roman mass] hosts, if Christ’s Kingly, Priestly and Prophetical office be overturned, as we were forced in Popery to do, we are to separate from the Church in that case.</p></blockquote>

<blockquote><p>The purest churches under heaven are subject to mixture and error; and some have so degenerated as to become no churches of Christ, but synagogues of Satan; nevertheless Christ always has had, and ever shall have a kingdom in this world, to the end thereof, of such as believe in him, and make profession of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 26.3</span></figcaption>

</figure><figure class="quote" id="q-c422225f03" data-kw="">
<blockquote><p>But the question yet remains from from whence had these before them their calling? Our divines tilen, Bucan, professors Leiden, Wallaeus, distinguish here three things: 1. Something in the calling of our reformers was from God: so authoritatively, they were called of god, the ministry being of god. 2. The Christian Church lying under Popery, called, designed, and ordained the men to be Pastors; so their calling according to the substance of the act was from God, and the Roman Church as a Chriftian Church. 3. There was corruption in the way and manner of their vocation, as the Antichristian ceremonies, and an oath to maintain the doctrine of the Church of Rome, not only as a Christian Church, but also as Romish; if any of them did swear to defend the corruptions of the church, this latter was taken away by God’s illumination of their minds: A called minister swears to defend the truth, and this truth of this Church; but aye under the notion of truth; and if he see it be error he still holds the substance of his oath, in as far as it is obligatory and ties him in conscience. It is objected: An Antichristian Church cannot ordain Christian ministers; rome was then an Antichristian Church; therefore. Answer: That which is wholly, as touching its whole essence Antichristian, cannot ordain Christian ministers: True, a dead man cannot beget a living barne [child]: the Roman Church was not wholly Antichristian, but kept some of Christ’s truth. that which is Antichristian in part only, may ordain ministers, who have the true essence of a ministerial calling…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 10, p. 125</span></figcaption>

</figure><figure class="quote" id="q-e87513c4ae" data-kw="">
<blockquote><p>III. The Church of Rome can be regarded under a twofold view (schesi): either as it is Christian, with regard to the profession of Christianity and of gospel truth which it retains; or papal, with regard to subjection to the pope, and corruptions and capital errors (in faith as well as in morals) which she has mingled with and built upon those truths besides and contrary to the Word of God. We can speak of it in different ways. In the former respect, we do not deny that there is some truth in it; but in the latter (under which it is regarded here) we deny that it can be called Christian and apostolic, but Antichristian and apostate. In this sense, we confess that it can still improperly and relatively be called a Christian church in a threefold respect. First, with respect to the people of God or the elect still remaining in it, who are ordered to come out of her, even at the time of the destruction of Babylon (Rev. 18:4). (2) With respect to external form or certain ruins of a scattered church, in which its traces are seen to this day, both with respect to the Word of God and the preaching of it (which, although corrupted, still remain in her); and with respect to the administration of the sacraments and especially of baptism, which is still preserved entire in her as to substance. (3) With respect to Christian and evangelical truths concerning the one and triune God, Christ the God-man (theanthropo) Mediator, his incarnation, death and resurrection and other heads of doctrine by which she is distinguished from assemblies of pagans and infidels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, 18th Topic, Q. 14, ‘Can the Church of Rome of Today be Called a True Church of Christ? We Deny Against the Romanists.’, pp. 121-37, p. 121</span></figcaption>

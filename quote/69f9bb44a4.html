<main class="wrap"><figure class="quote" id="q-69f9bb44a4" data-kw="">
<blockquote><p>Touching the time of God’s worship, it was the seventh day from the beginning of the creation, the Sabbath day. And here we must note, that the keeping of the Sabbath is moral. Some indeed do plead that it is but a ceremony; yet falsely: for it was ordained before the fall of man, at which time Ceremonies signifying sanctification had no place. Nay mark further: Adam in his innocency was not clogged with sin as we are; and yet then he had a set Sabbath to worship God his creator: and therefore much more need hath every one of us a Sabbath day, wherein we may sever our selves from the works of our callings, and the works of sin, to the worship of God in the exercise of religion, and godly meditation of our creation.

This point must be learned of us, for when no occasion is offered of business, then men will formally seem to keep the Sabbath: but if there come occasion of breaking the Sabbath, as traffic, gaming, and vain shows, then Sabbath farewell, men will have their pleasures, let them worship God that will. But let us remember in the fear of God, that whosoever continueth in the breach of this law being moral, God will no less pour forth his punishments upon them, then for the breach of any other commandment: the consideration whereof, must move every man to a reverent sanctifying of the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 238.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-773bd4c750" data-kw="sixth commandment homicide">
<blockquote><p>Because various cases can occur in which homicide can either be lawful or unlawful and to be condemned, hence arises the question—What is prohibited in the sixth precept, “Thou shalt not kill,” and what is not? First negatively, judicial homicide is not prohibited. Are the rights of war and punishment contained under this commandment? Are suicide and duelling prohibited? The former we deny; the latter we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.16.1–2</span></figcaption>

</figure><figure class="quote" id="q-8063f6df32" data-kw="">
<blockquote><p>Ignorance of the difference between the law and the gospel promotes also, in a great degree, the strength and influence of a self-righteous temper. When a man is driven to acts of obedience by the dread of God’s wrath revealed in the law and not drawn to them by the belief of His love revealed in the gospel; when he fears God because of His power and justice and not because of His goodness; when he regards God more as an avenging judge than as a compassionate friend and father; and when he contemplates God rather as terrible in majesty than as infinite in grace and mercy, he shows that he is under the dominion, or at least under the prevalence, of a legal spirit. If he builds his faith of the pardon of sin, of the favor of God, and of eternal life on any graces that he supposes are implanted in him or on any duties that are performed by him, he is evidently under the power of a self-righteous temper. He shows that he is under the influence of this hateful temper by grounding his hope and his comfort on conditions performed by himself and not on the gracious and absolute promises of the gospel. In a word, when his hope of divine mercy is raised by the liveliness of his frame in duties and not by discoveries of the freeness and riches of redeeming grace offered to him in the gospel; or when he expects eternal life not as the gift of God through Jesus Christ but as a recompense from God for his own obedience and suffering, he plainly shows that he is under the power of a legal spirit. Now, if he is ignorant of the leading distinctions between the law and the gospel, this ignorance will strengthen his legal propensity and confirm him in his resolution to seek justification partly, if not wholly, by the works of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 129–30.</span></figcaption>

</figure><figure class="quote" id="q-16203e5303" data-kw="">
<blockquote><p>Q. What is the third rule?

A. When the Law forbiddeth or commandeth any thing, it forbiddeth and commandeth all means, occasions, and provocations thereunton.

Q. What is the fourth rule?

A. Whatsoever the Law commands, it forbids the contrary; whatsoever it forbids, it commandeth the contrary. […]

Q. Why are all the Commandments (except two) set down negatively?

A. Because the Negative bindeth more strongly: for the Negative precept bindeth always, and to all moments of time; the Affirmative bindeth always, but not to all moments of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 88.</span></figcaption>

</figure><figure class="quote" id="q-ba4b257802" data-kw="">
<blockquote><p>34 The Law is the doctrine of works: Therefore it manifesteth unto us the corruption of our nature; it terrifieth us, and prescribeth unto us the rule of well-doing.

35 The Gospel is the doctrine of faith: which pointeth at Christ our Mediator, who hath made satisfaction for our sins, and raiseth up the conscience of man.

36 The practice of the Law and the Gospel consisteth in true Repentance.

37 Whereunto there is required Contrition, to be wrought in us by the Law; and Faith, by the Gospel.

38 Faith apprehendeth the Righteousness of Christ offered in the word of the Gospel: by which man, after Contrition wrought in him by the void of the Law, is justified before God, and beginneth to be renewed by the receiving of the Holy Ghost.

39 For by faith our hearts are purified. Acts 15.9.

40 Therefore the fruits of true Repentance are good works.

41 For, Faith worketh by Love. Gal. 5.6. And Christ giveth unto us not only his righteousness, but also his Holy Spirit, which beginneth to renew our nature, and bridle in us the concupiscences of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Doctrine</cite>, trans. Ralph Winterton (Cambridge: Roger Daniel, 1640), unpaginated.</span></figcaption>

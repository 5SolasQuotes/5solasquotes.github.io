<main class="wrap"><figure class="quote" id="q-fc8bb9f4db" data-kw="">
<blockquote><p>4. The sin of receiving and spreading false reports of others upon hearsay, is now so common among those that do profess sobriety and religion, that all men should take heed of it in all company, as they would do of the plague in an infectious time: And now it is so notorious that false news and slanders of others are so common, neither good men’s words, nor common fame, will allow you (or excuse you) to believe or report any evil of another, till you are able to prove that it is your duty: But all Christians should join in lamenting and reproving this common uncharitable sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 430</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-7a04b1b8b5" data-kw="">
<blockquote><p>By the diatactic [Teaching] power a Synod may institute, restore, or change, according to the condition and exigence of the Church, the external circumstances in the worship of God, and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion, it is fit that National Synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratorke power, but being always tied to follow the rules foresaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, … (Edinburgh, 1641), p. 150-1</span></figcaption>

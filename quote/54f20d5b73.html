<blockquote><p>But, ye’ll say, they explain themselves and say [that] though faith is the condition of salvation, yet they are not saved because of it as a work, but only a condition. But to this I say, I cannot think of any intelligible meaning of the word “work” in divinity, but something to be done as a condition; what Adam was to do was a work no otherwise. Talking thus, whether it be truly or falsely, is doubtless the foundation of Arminianism and neonomianism, and tends very much to make men value themselves for their own righteousness. …

But it seems to me, all this confusion arises from the wrong distinction men make between the covenant of grace and the covenant of redemption. It seems to me to be true, that as the first covenant was made with the first Adam, so the second covenant was made with the second Adam; as the first covenant was made with the seed of the first Adam no otherwise than as it was made with them in him, so the second covenant is not made with the seed of the second Adam any otherwise than as it was made with them in him. It was not one covenant that was made with Adam, and another, that he had nothing to do with, that was made with his seed; so neither was it one covenant that was made with Christ, and another, that Christ had nothing to do with, with believers. But then, in all respects wherein Adam was a common head and representative of men, so Christ is a common head and representative of believers; as Adam was only the first created of men, so Christ is eldest brother of believers.

As the condition of the first covenant was Adam’s standing, so the condition of the second covenant is Christ’s standing. Christ has performed the condition of the new covenant. There is nothing more to be done; all is done already. We have nothing to do, upon the account of which we are to be saved; we are to do nothing but only to receive Christ and what he has done already. Salvation is not offered to us upon any condition, but freely and for nothing. We are to do nothing for it, we are only to take it. This taking and receiving is faith. It is not said, “If you will do so and so you may have salvation, you may have the water of life,” but “Come and take it; whosoever will, let him come” [Revelation 22:17].

It is very improper to say that a covenant is made with men any otherwise than in Christ, for there is vast difference between a free offer and a covenant. The covenant was made with Christ, and in him with his mystical body; and the condition of this covenant is Christ’s perfect obedience and sufferings. And that [covenant] that is made to men is a free offer; that which is commonly called the covenant of grace is only Christ’s open and free offer of life, whereby he holds it out in his hand to sinners and offers it without any condition. Faith can’t be called the condition of receiving, for it is the receiving itself; Christ holds out and believers receive. There was no covenant made, or agreement upon something that must be done, before they might receive. ‘Tis true, those that don’t believe are not saved, and all that do believe are saved: that is, all that do receive Christ and salvation, they receive it; and all that will not receive salvation, never do receive it and never have it. But faith, or the reception of it, is not the condition of receiving of it. It is not proper, when a man holds out his gift to a beggar that he may take it without any manner of preliminary conditions, [to say] that he makes a covenant with the beggar. No more proper is it to say, that Christ’s holding forth life in his hand to us that we may receive it, is making a covenant with us.

But I must confess after all, that if men will call this free offer and exhibition a covenant, they may; and if they will call the receiving of life the “condition” of receiving of life, they are at their liberty. But I believe it is much the more hard to think right, for speaking so wrong. Christ and his church are one in law; that is, they are one in respect of the covenant. By Christ’s performing the condition of the covenant, the condition is as if it were performed by them. If you divide Christ and the church in covenant, and say that one covenant is made with one and another with the other, you make them two in law. This making faith a condition of life fills the mind with innumerable difficulties about faith and works and how to distinguish them, tends to make us apt to depend on our own righteousness, tends to lead men into neonomianism, and gives the principal force to their arguments. Whereas, if we would leave off distinguishing the covenant of grace and the covenant of redemption, we should leave all these matters plain and unperplexed.</p></blockquote>

<blockquote><p>Congregation, recognize the truth expounded here in its essence and commended for the profit of your souls. This truth that was sealed by Jesus’ suffering and death can free us from the evil of sin through the power of the Spirit. Oh, that your hearts would desire to see, to use prudently, and to profit from that which concerns your eternal salvation. These few pages are a treasure that contains everything that is able to satisfy you eternally. Learn here to know the God of gods and how through worship to be affected by the Holy Word; here learn how truly to pray to the Triune God—Father, Son, and Holy Spirit—exalting His being, honouring His name, recognizing His glories.

Wisely and holily, He accomplishes what He eternally decrees concerning creation and providence. He displays His service and gives His laws to reasonable creatures that they might know what leads them to true virtue. Behold here the first man, glorious in covenant with God, then sadly falling into sin and guilt and slavery to Satan. Behold how he was plunged into death, swept into the abyss by a thousand evils. Note God’s Son, moved to compassion, fulfilling God’s righteousness, displaying pity in the covenant of peace, our Mediator.

Note His sweet-sounding names, His natures, His offices, and how He brought redemption for our endangered souls. Observe that God’s Son in both His low and His exalted estates obtained God’s sweet honeycombs, medicine for our souls. He called His child, gave her new life, faith, salvation, righteousness, and holiness. And by godly living, praying, and watching, she is made a participant in full assurance by Him when He uses baptism and the Lord’s Supper as seals for heart and mouth. He shows His love and strengthens His partner in their holy covenant.

Behold mankind, which shall surely die and be raised again to receive its judgment on the last day. Then the ungodly will receive eternal woe, but God’s people, chosen for salvation, will be jubilant. Oh! What a holy outcome for Jesus’ followers, gathered here on earth and guided by heaven’s Word and Spirit. They will taste this salvation for all eternity, and after their struggle they will come to the eternal, blessed, joyful feast. Oh, come and see, savour the truth—so blessed in its radiance and clarity for those who see it with the Spirit’s help. Beg for light, that you may find life in the treasury of exalted truth, the rock on which God’s people build.</p></blockquote>

<blockquote><p>The thing promised, is the knowledge of God: “They shall all know me.” No duty is more frequently commanded than this is, nor any grace more frequently promised. ... for it is the foundation of all other duties of obedience, and of all communion with God in them.</p></blockquote>

</figure><figure class="quote" id="q-1cd715af93" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are:

I. Real and passive, or received, union with Christ, and ingrafting into the new covenant, and thus communion of all goods in Christ.

II. Passive reconciliation and justification (as they call it), or rather internal, in us—from which is distinguished external or active justification, which is concerning us. Furthermore, this necessary distinction [between active and passive justification] has been illustrated above all others, and clearly and solidly defended by Dr. [Johannes] Maccovius in his Theological Collection, pt. 4, Disputation 9, compared with pt. 3, Disputation 16, and his particular syllabus of disputations on Justification. And we in the Problems on Justification shall vindicate it ἐν παρόδῳ [en parodō, in passing] from certain objections. There is no reason therefore to pursue it here at greater length. Only I add these three things for the sake of younger students:

      1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.

      2. That active justification is distinguished from the decree of justification, as the execution of a decree from the decree, and the emanating action of God from the immanent. Just as the decree of creation must necessarily be distinguished from creation itself.

      3. That the same was accomplished fundamentally and κατ’ ἐπαγγελίαν [kat’ epangelian, according to promise] in the first institution, contracting, and promulgation of the new covenant, Gen. 3 [v. 15]; consummatively in the cross and resurrection of Christ, Rom. 8:32–33; 2 Cor. 5:18–19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 447 ff. Latin at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-470635d08b" data-kw="">
<blockquote><p>The work of the Incarnation of the Son of God, and the Redemption of the World by him, was such, that one main end of making this goodly frame of Heaven and Earth was, that it might be the stage upon which that Work should be acted. A work wherein not only all man’s happiness lies, and whence it flows; but wherein all God’s Attributes are glorified to the highest; and for which the Church Triumphant shall think Eternity short enough to praise God. Of this Work (I say) the sum is given in one word, Immanuel, God is with us.

And plain Reason may demonstrate that it must needs be so. What is glory, but the shining out of excellency? What is happiness but the fruition of the greatest good? Now there is no Excellency that shines out in anything, like to that which beams out from God in the Covenant of grace to his people. There is no good that any people can enjoy like the fruition of God in that Covenant. It is true, God manifests himself to all the Nations in the World (in him they live, and move, and have their being:) yet it is as in a dark Cloud, they grope after him, and cannot feel him, but in the covenant of grace men behold him with open face, like the Sun shining in his strength, as through a Mirror: Such a Mirror as the Prince of Orange had, that would shew the Sun in his full bigness and beauty. Thus God shines in the Covenant of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached before the Honourable House of Commons, now assembled in Parliament, at their public fast, November 17. 1640</cite>, (London: Samuel Man, 1641), pp 9-10.</span></figcaption>

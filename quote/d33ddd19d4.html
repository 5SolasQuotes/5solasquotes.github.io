<main class="wrap"><figure class="quote" id="q-d33ddd19d4" data-kw="">
<blockquote><p>Amyraut, however, builds on Calvin’s argument and, indeed, claims to be interpreting and clarifying it by arguing two mercies and two wills in God where Calvin did not; in fact where Calvin had specifically stated that the will of God is one and simple, albeit with distinctions that can be observed in its revelation. Where Calvin resolved the issue of the universal call and particular election by simply declaring a resolution in the fact that, as promised, the repentant are saved, Amyraut indicated a double divine intentionality… Even if Amyraut had added, as he would do at the Synod of Alençon, that his language of two decrees was by rational distinction and intended “without any succession of Thought, or Order of Priority and Posteriority” in God, his exegesis still would differ from Calvin’s in its postulation of two divine mercies and two intentions. The exegesis of the particular text, therefore, does not fully support those who appeal to it in order to interpret Amyraut as a precise follower of Calvin… Amyraut offered his own conclusion, modifying and supplementing Calvin’s argument with a concept of two wills in God—a scholastic distinction not found in Calvin’s reading of the text and related, probably, to Amyraut’s own training under John Cameron.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Tale of Two Wills: Calvin &amp; Amyraut on Ezekiel 18:23’ in Calvin Theological Journal 44</cite>, (2009): 211-25, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-a7cdc96c37" data-kw="">
<blockquote><p>‘Who has made us fit.’ Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (Jn. 10), for his Church only (Eph. 1), not for the world (Jn. 17). And therefore when the Scripture says Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the elect: for all, that is, for the elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the gentiles also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (1617), on Col. 1:12, p. 99</span></figcaption>

<blockquote><p>…For I am of no other mind than Prosper [in the early Church] was: Habet populus Dei plenitudinem suam, et quamvis magna pars hominum salvantis gratiam aut repellat aut negligat, in electis tamen et praescitis atque ab omni generalitate discretis, specialis quaedam censetur universitas, ut de toto mundo, totus mundus liberatus, et de omnibus hominibus, omnes homines videantur assumpti. [“The people of God possess their own fullness; and although a great part of mankind either rejects or neglects saving grace, yet in the elect and foreknown, and those distinguished from the whole generality [of mankind], there is reckoned a certain special universality, so that, from the whole world, the whole world may be said to have been liberated, and from among all men, all men may appear to have been taken up.”] That Christ died for his apostles, for his sheep, for his friends, for his Church, may make peradventure against those who make all men to have a share alike in the death of our Savior: but I profess myself to hold fully with him who said: Etsi Christus pro omnibus mortuus est, tamen specialiter pro nobis passus est, quia pro Ecclesia passus est. [“Although Christ died for all, yet He suffered especially for us, because He suffered for the Church.”] Yea, and in my former writing I did directly conclude, that as in one respect Christ might have been said to die for all, so in another respect truly said not to have died for all; and my belief is, that the principal end of the Lord’s death, was, ‘that He might gather together in one the children of God scattered abroad,’ and, that for their sakes He did specially sanctify Himself, that they ‘also might be sanctified through the truth.’ And therefore it may be well concluded that Christ in a special manner died for these; but to infer from hence, that in no manner of respect He died for any others, is but a very weak collection, especially the respect by me expressed being so reasonable, that no sober mind advisedly considering thereof can justly make question of it, viz. That the Lamb of God offering Himself a sacrifice for the sins of the world, intended by giving satisfaction to God’s justice to make the nature of man which He assumed, a fit subject for mercy, and to prepare a sovereign medicine that should not only be a sufficient cure for the sins of the whole world, but also should be laid open to all, and denied to none, that indeed do take the benefit thereof: for he is much deceived that thinks a preaching of a bare sufficiency is able to yield sufficient ground of comfort to a distressed soul, without giving a further way to it, and opening a further passage.</p></blockquote>

ng so reasonable, that no sober mind advisedly considering thereof can justly make question of it, viz. That the Lamb of God offering Himself a sacrifice for the sins of the world, intended by giving satisfaction to God’s justice to make the nature of man which He assumed, a fit subject for mercy, and to prepare a sovereign medicine that should not only be a sufficient cure for the sins of the whole world, but also should be laid open to all, and denied to none, that indeed do take the benefit thereof: for he is much deceived that thinks a preaching of a bare sufficiency is able to yield sufficient ground of comfort to a distressed soul, without giving a further way to it, and opening a further passage.”

+one+the+children+of+God+scattered+abroad%2C%E2%80%99+and%2C+that+for+their+sakes+He+did+specially+sanctify+Himself%2C+that+they+%E2%80%98also+might+be+sanctified+through+the+truth.%E2%80%99+And+therefore+it+may+be+well+concluded+that+Christ+in+a+special+manner+died+for+these%3B+but+to+infer+from+hence%2C+that+in+no+manner+of+respect+He+died+for+any+others%2C+is+but+a+very+weak+collection%2C+especially+the+respect+by+me+expressed+being+so+reasonable%2C+that+no+sober+mind+advisedly+considering+thereof+can+justly+make+question+of+it%2C+viz.+That+the+Lamb+of+God+offering+Himself+a+sacrifice+for+the+sins+of+the+world%2C+intended+by+giving+satisfaction+to+God%E2%80%99s+justice+to+make+the+nature+of+man+which+He+assumed%2C+a+fit+subject+for+mercy%2C+and+to+prepare+a+sovereign+medicine+that+should+not+only+be+a+sufficient+cure+for+the+sins+of+the+whole+world%2C+but+also+should+be+laid+open+to+all%2C+and+denied+to+none%2C+that+indeed+do+take+the+benefit+thereof%3A+for+he+is+much+deceived+that+thinks+a+preaching+of+a+bare+sufficiency+is+able+to+yield+sufficient+ground+of+comfort+to+a+distressed+soul%2C+without+giving+a+further+way+to+it%2C+and+opening+a+further+passage.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+The+Whole+Works+of+the+Most+Rev.+James+Ussher%E2%80%A6+17+vols.+%28Dublin%3A+Hodges+%26+Smith%2C+1864%29%2C+vol.+12+%7C+%E2%80%98An+Answer+of+the+Archbishop+of+Armagh+to+some+Exceptions+taken+against+his+aforesaid+Letter%E2%80%99%2C+pp.+562-71%2C+pp.+567-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F033263c571.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/033263c571.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=For%20I%20am%20of%20no%20other,it%2C%20and%20opening%20a%20further%20passage&amp;text=For%20I%20am%20of%20no%20other%20mind%20than&amp;text=way%20to%20it%2C%20and%20opening%20a%20further%20passage" rel="noopener" target="_blank">Read it

<main class="wrap"><figure class="quote" id="q-9b5a77a158" data-kw="">
<blockquote><p>That they [Romanists] seek not his glory, but their own, it may appear unto any man which thoroughly considereth of their doctrine. First they will not acknowledge that poverty and nakedness, those filthy garments of corruption and sin wherein Adam hath wrapped his posterity; But in the pride of their hearts, they dissemble it, diminish it, and make light of it. For although they deny not but that man’s nature is corrupted, yet mark how they pair and lessen this corruption. The Prophet David doeth term it wickedness, and sin: but they make it only an inclination unto sinning.

The Lord himself doth witness that by it all the imaginations of the thoughts of man’s heart are only evil: they restrain it to the inferior part of the soul, and make it only a mother of some grosser desires. The blessed Apostle prayed, groaned, and wept against it, as a thing which made him altogether weary of his life: But after Baptism, they make no more account of those inward rebellious motions against the spirit, than they do of the beating of a man’s pulse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec99119f19" data-kw="Depravity">

</figure><figure class="quote" id="q-524512ad69" data-kw="">
<blockquote><p>The doctrine of the equality of sins, however, the Stoics alone dared to maintain in opposition to the unanimous sentiments of mankind: an absurd tenet, which in writing against Jovinianus you have most clearly refuted from the Holy Scriptures. In that most delightful and noble dissertation you have made it abundantly plain that it has not been the doctrine of our authors, or rather of the Truth Himself, who has spoken through them, that all sins are equal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter</cite>, 167.2,4</span></figcaption>

</figure><figure class="quote" id="q-48d4512d52" data-kw="">
<blockquote><p>IV. God is no wise the author, or instigator of sin, Psal. 5.5. Ps. 45.8. For God is not only just, but also justice it self: And it is as impossible that he who is Justice it self should sin, or be the author of sin, as that whiteness should black the wall, or heat make one cold. … And yet it is certain, that he can do nothing that is contrary to his own Nature. God cannot lie, because he is truth it self. God cannot sin, because he is perfect righteousness it self. These speeches, that sin is committed either by God’s procuring or furthering, are altogether to be rooted out of divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 3.4, pp 6-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

</figure><figure class="quote" id="q-3c8c15e343" data-kw="wages curse">
<blockquote><p>The reasons are: (1) “The wages of sin is death” (Rom. 6:23) and “the soul that sinneth, it shall die” (Ezk. 18:20). These deal not with any sin in particular, but with sin in general. Thus either venial sin is not sin or it deserves death and so is not venial. Second, the terrible formula of the law proves this: “Cursed be he that confirmeth not all the words of this law to do them” (Dt. 27:26; Gal. 3:10). If every deviation from the law deserves a curse and every sin is illegality, no sin can be granted (even the smallest) which does not bring upon it the curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.7-8</span></figcaption>

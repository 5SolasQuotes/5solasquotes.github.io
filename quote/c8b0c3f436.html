</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e9436ec60" data-kw="">
<blockquote><p>By the worship of God inquired after [in this treatise], not that which is natural or moral, which is required in the First Commandment is intended. Such is our faith and confidence in Him, our fear of Him, our subjection of soul and conscience unto Him as the great Soveraign Lord, first cause, last end, Judge and Rewarder of all men; the Law whereof was originally written in the heart of man, and has been variously improved and directed by new revelations and institutions. And this worship is called natural upon a double account. First, because it depends on the nature of God, a due perception and understanding whereof makes all this worship indispensibly necessary: for none can know God but it is his duty to glorify Him as God, that is, to believe in Him, love Him, trust Him, and call upon Him, which all are therefore cursed that do not, Ps. 79:6; 2 Thess. 1:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God… (London: 1667) | Question 1</cite>, pp. 1-2</span></figcaption>

</figure><figure class="quote" id="q-647983ef1f" data-kw="">
<blockquote><p>This invented or will-worship [Col. 2:23], Cultus arbitrarius, has two specious things in it, as the apostle says: 1. The first is a kind of wisdom, and carries with it a trim show thereof: when a man shall be thought so wise as that he is able to devise and invent a worship for God, especially when men consider not what God has already prescribed, whereby their rites prove contrary to what He has appointed, and so they will be wiser than God. … Although, all will-worship, [Greek], be taken in an evil sense by many, upon the vulgar exposition of that place in Col. 2:23, yet that there may be some voluntary or free worship acceptable to God, though not specially commanded, provided it be not corruptive of or contrary to any right or worship commanded by Him, but subservient or agreeable thereto, is the judgement of learned divines; For under the law they had their voluntary and free-will offerings, besides those commanded by God, and though things were more particularly prescribed in the Levitical worship than now under the Gospel, the Church being then in its childhood, and confined to one nation, and the Spirit not then so plentifully given as now since the ascension of Christ, yet even then the Church prescribed diverse things in God’s worship not specially commanded, as in fasts and festival days, as that of the dedication of the Temple, approved by Christ’s own observance, Jn. 10, and sundry other things, all which were never taxed as unlawful, unless the worship appointed by God Himself were thereby corrupted or neglected, and so the continual practice of the Christian Church has been to prescribe and order several things in God’s worship, which no peaceable and holy men ever found fault with, provided, that they were agreeable to those general rules of moral worship required by God and no ways repugnant to those rites by Him appointed, but rather subservient to them, and contained nothing either impious and forbidden, or vain and ridiculous; nor the observance of them preferred before the commandments of God, or made equal to them; but a difference observed between things of immediate divine institution and those of ecclesiastical institution: To add to God’s institution anything as from God is forbidden, Dt. 12:32, but to add something for the more decent and orderly performance of what God has appointed, and to observe the same as an ecclesiastical institution, is nowhere forbidden, but rather commanded in all those texts that require us to hear the Church [Mt. 18] and to give obedience to her; and to observe this is also to obey God, who has given his Church power to ordain such things: And that that place in Col. 2:23, condemns not all voluntary or free worship no more than it does humility and chastening, or keeping under the body which are joined therewith, but rather that it makes for it has been lately proved by judicious and learned divines; and by one in a full tract upon this subject of will-worship; for the apostle there condemning certain Jewish and Pythagorean observances about touching, tasting, etc. says, verse 23, that they had a show of wisdom, if due cautions were observed, viz. if they were freely and voluntarily undertaken, not as necessary to salvation, and without rejecting what God had made, and if they were used in humility or modesty not condemning others which used them not, and if they sought thereby only to keep under the flesh. The contrary to all which those Pythagoreans and Jews practiced. By which exposition, which I take to be the most true, it is plain that the apostle is so far from condemning all voluntary or will-worship, that he rather approves and commends it, and condemns their forbearance of meats and other things because it was not freely or voluntarily undertaken, but as a thing necessary to salvation, etc. See [Hugo] Grotius in Col. 2:23, Et votum pro pace, pp. 100-103, and [Andrew] Rivet, Apologeticus, pp. 109-10, etc. Dr. [Henry] Hammond, Of Will-Worship. See also our reverend author in his sermon on Mt. 6:16, p. 124, etc. and on 1 Cor. 11:16.</p></blockquote>

2C+which+I+take+to+be+the+most+true%2C+it+is+plain+that+the+apostle+is+so+far+from+condemning+all+voluntary+or+will-worship%2C+that+he+rather+approves+and+commends+it%2C+and+condemns+their+forbearance+of+meats+and+other+things+because+it+was+not+freely+or+voluntarily+undertaken%2C+but+as+a+thing+necessary+to+salvation%2C+etc.+See+%5BHugo%5D+Grotius+in+Col.+2%3A23%2C+Et+votum+pro+pace%2C+pp.+100-103%2C+and+%5BAndrew%5D+Rivet%2C+Apologeticus%2C+pp.+109-10%2C+etc.+Dr.+%5BHenry%5D+Hammond%2C+Of+Will-Worship.+See+also+our+reverend+author+in+his+sermon+on+Mt.+6%3A16%2C+p.+124%2C+etc.+and+on+1+Cor.+11%3A16.%E2%80%9D%0A%0A%E2%80%94+Andrewes+Lancelot%2C+The+Moral+Law+Expounded%3A+Largely%2C+Learnedly%2C+Orthodoxly%E2%80%A6+upon+the+Ten+Commandments%E2%80%A6+%28d.+1626%3B+London%3A+Sparke%2C+1642%29%2C+On+the+Ten+Commandments%2C+2nd+Commandment%2C+ch.+1%2C+pp.+194-95+See%2C+p.+196+for+more.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F647983ef1f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/647983ef1f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=This%20invented%20or%20will%2Dworship%20%5BCol.%202%3A23,etc.%20and%20on%201%20Cor.%2011%3A16&amp;text=This%20invented%20or%20will%2Dworship%20%5BCol.%202%3A23%5D%2C%20Cultus%20arbitrarius&amp;text=p.%20124%2C%20etc.%20and%20on%201%20Cor.%2011%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3750c533ad" data-kw="">
<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God… (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’</cite>, pp. 64-65</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.”

— John Owen, A Brief Instruction in the Worship of God… (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’, pp. 64-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Papists+say+indeed+that+all+additions+corrupting+the+worship+of+God+are+forbidden%2C+but+such+as+further+adorn+and+preserve+it+are+not+so%2C+which+implies+a+contradiction%2C+for+whereas+every+addition+is+principally+a+corruption+because+it+is+an+addition%2C+under+which+notion+it+is+forbidden+%28and+that+in+the+worship+of+God+which+is+forbidden%2C+is+a+corruption+of+it%29%2C+there+can+be+no+such+preserving%2C+adorning+addition%2C+unless+we+will+allow+a+preserving+and+adorning+corruption.+Neither+is+it+of+more+force+which+is+pleaded+by+them+that+the+additions+which+they+make+belong+not+unto+the+substance+of+the+worship+of+God%2C+but+unto+the+circumstances+of+it%2C+for+every+circumstance+observed+religiously%2C+or+to+be+observed+in+the+worship+of+God%2C+is+of+the+substance+of+it%2C+as+were+all+those+ceremonious+observances+of+the+%5BMosaic%5D+Law+which+had+the+same+respect+in+the+prohibitions+of+adding+with+the+most+weighty+things+whatsoever.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Brief+Instruction+in+the+Worship+of+God%E2%80%A6+%28London%3A+1667%29%2C+Question+14%2C+%E2%80%98May+not+the+Church+find+out+and+appoint+to+be+observed+such+religious+rites%2C+as+being+adjoined+unto+the+celebration+of+God%E2%80%99s+instituted+worship%2C+may+farther+the+devotion+of+the+worshippers+and+render+the+worship+itself+in+its+performance+more+decent%2C+beautiful+and+orderly%E2%80%A6%3F%E2%80%99%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3750c533ad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a

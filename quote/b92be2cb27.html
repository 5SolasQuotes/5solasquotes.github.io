<main class="wrap"><figure class="quote" id="q-b92be2cb27" data-kw="">
<blockquote><p>Verse 39. But I say unto you, resist not evil: but whosoever shall strike thee on thy right cheek, turn to him the other also.

In this and the three next verses, Christ confutes the false interpretation of this law. The sum of his answer stands in two points; the first is an inhibition, resist not evil, which is explained by three examples in the words following. The second, is a commandment to requite good for evil, vers. 42.

For the first, by evil is meant, the injury or wrong that is done to man; or more properly, the evil one, that is, the evil man that doth the wrong. Resist not] that is, rise not against the evil one, to requite like for like, according to the injury he hath done unto thee; so much the word signifieth.

Now Christ forbiddeth not resisting by a lawful defence, but by way of private revenge; for he speaketh to his Disciples, and to private men, saying, I say unto you which hear, (as Saint Luke hath it, Ch. 6. 27.) Yet further to clear this interpretation, we must know, the Scripture mentioneth two kinds of revenge, Public, and Private: Public revenge, is when the Magistrate according to justice, and the law of God, punisheth an evil person, that wrongeth his brother.

Private revenge, is when those that are no Magistrates, will revenge themselves on such as doe them wrong. The public revenge is allowed by Saint Paul, calling the Magistrate, God’s minister, for the executing of revenge upon evil doers. Private revenge, is forbidden by the same Apostle, Revenge not thy self. Now by this doctrine it is plain, that our Saviour Christ here forbidding revenge, meaneth not public, but private revenge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), p. 176.</span></figcaption>

<blockquote><p>2. The first [way in which a man may be guilty of scandal] is, when a man does something before another man, which is in itself evil, unlawful and sinful, in which case, neither the intention of him that does it, nor the event, as to him that sees it done, is of any consideration; For it matters not whether the doer had an intention to draw the other into sin thereby, or not: neither does it matter whether the other were thereby induced to commit sin or not: the matter or substance of the action being evil, and done before others, is sufficient to render the doer guilty of having given scandal, though he had neither any intention himself so to do, nor were any person actually scandalized thereby; because whatsoever is in itself, and in its own nature evil, is also of itself and in its own nature scandalous and of evil example. Thus did Hophni and Phineas, the sons of Eli, give scandal by their wretched profaneness and greediness about the sacrifices of the Lord, and their vile and shameless abusing the women, 1 Sam. 2:17,22. And so did David also give great scandal in the matter of Uriah, 2 Sam. 12:14. Here the rule is, Do nothing that is evil, for fear of giving scandal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Case 4, ‘of Scandal’ in Nine Cases of Conscience Occasionally Determined</cite>, pp. 76-77 of Case 4, ‘of Scandal’ in Nine Cases of Conscience Occasionally Determined (London, 1678)</span></figcaption>

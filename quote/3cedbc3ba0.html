</figure><figure class="quote" id="q-738fce26aa" data-kw="">
<blockquote><p>The problem with EFS is not Arianism, but the fact that it entails tritheism. Advocates of EFS are… replacing terms like ‘unbegotten’ and ‘begotten’ with the ideas ‘authority’ and ‘submission’… EFS is more in the line of what might be called polytheistic homoiousianism, whereby the Father and the Son have distinct natures, but each is still eternally divine… Because Chalcedonian Christology insists that Jesus has two natures but only one hypostasis, dyothelitism [the orthodox doctrine that Christ has a divine will and a distinct human will] as a development of Chalcedonian Christology necessitates the recognition that a will must be a property of nature [and not the Person] in order for there to be two wills in Christ. To posit such terms as ‘obedience’ and ‘submission’ that imply a distinction of wills between the Father and the Son while affirming dyothelite Christology entails a distinction of natures between the Father and Son (and Spirit) resulting in tritheism… After this historical account, a word study of the term ‘submission’ will demonstrate that the term clearly implies an activity of the will yielding to another will and should therefore be rejected as an eternal property of a divine hypostasis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/butner-jr-d-glenn.html">D. Glenn Butner Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Eternal Functional Subordination and the Problem of the Divine Will’ 19</cite>, pp. in JETS 58/1 (2015) 131–49 The article is also here., p. 132-3</span></figcaption>

<blockquote><p>71. Fourthly, they [Romanists] accuse us of blasphemy against the Son of God, for denying (as they say) that He is Deus ex Deo, God of God: against the doctrine of the Nicene Creed; and this they call the atheism of Calvin and Beza: a palpable slander: for neither Calvin nor Beza did ever imagine, much less utter the same in that sense which they lay to their charges: for let [Robert] Bellarmine their sworn adversary speak for them: ‘Calvin and Beza teach’ (says he) ‘that the Son is of Himself in respect of his essence, but not in respect of his Person, and they seem to say that the essence of the Deity in Christ is not begotten, but is of itself: which opinion’ (says he) ‘I see not why it may not be called Catholic.’ Here Bellarmine tells us truly what their opinion was, and does acknowledge it to be a true catholic doctrine: and yet in the same chapter he contemns Calvin for his manner of speaking of it and of intolerable sauciness for finding fault with the harshness of the phrase used by the Nicene Council, ‘God of God: Light of light’. Mark (I pray you) his absurdity, it is catholic, and yet it may not be spoken: it is true, and yet it is to be blamed. May not a catholic doctrine be spoken then? or must the truth be smothered? This is such an inconsequence as neither reason nor religion can any ways bear withal: and for his saucy dealing with the Nicene Council, all that ever he says is, that it is durum dictum, ‘a hard phrase’: yet so that he confesses it may receive a good and commodious interpretation if it be understood in the concrete, that Christ who is God, is of the Father that is God: the word being taken personally, and not in the abstract; as if the essence of the Deity of the Son should be from the Father, which is entirely subsisting, in, of, and by its own eternal, incomprehensible, and most glorious nature: and this without question was the true intendement of the Council; for else it had not confuted, but favored the blasphemous heresy of Arius, against whom it was assembled, which Calvin and Beza do not anyways cross, but onely bring unto it a fit and fauourable exposition. Thus we have Bellarmine, Calvin’s and Beza’s patron in this doctrine, though full ill against his will: and not only him, but Ribera and Gregory de Valentia, two other no mean Rabbies, both which do conclude that: ‘the Son as He is a Person, is of another; but as He is a simple ens [being], is not of another: and that the essence does not beget the essence, but the Father the Son;’ so that either they are slanderers of the truth, or their catholic doctrines may be atheism and blasphemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beard.html">Thomas Beard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retractive from the Romish Religion</cite>, … (London, 1616), Motive 12, pp. 469-70</span></figcaption>

nd+not+in+the+abstract%3B+as+if+the+essence+of+the+Deity+of+the+Son+should+be+from+the+Father%2C+which+is+entirely+subsisting%2C+in%2C+of%2C+and+by+its+own+eternal%2C+incomprehensible%2C+and+most+glorious+nature%3A+and+this+without+question+was+the+true+intendement+of+the+Council%3B+for+else+it+had+not+confuted%2C+but+favored+the+blasphemous+heresy+of+Arius%2C+against+whom+it+was+assembled%2C+which+Calvin+and+Beza+do+not+anyways+cross%2C+but+onely+bring+unto+it+a+fit+and+fauourable+exposition.+Thus+we+have+Bellarmine%2C+Calvin%E2%80%99s+and+Beza%E2%80%99s+patron+in+this+doctrine%2C+though+full+ill+against+his+will%3A+and+not+only+him%2C+but+Ribera+and+Gregory+de+Valentia%2C+two+other+no+mean+Rabbies%2C+both+which+do+conclude+that%3A+%E2%80%98the+Son+as+He+is+a+Person%2C+is+of+another%3B+but+as+He+is+a+simple+ens+%5Bbeing%5D%2C+is+not+of+another%3A+and+that+the+essence+does+not+beget+the+essence%2C+but+the+Father+the+Son%3B%E2%80%99+so+that+either+they+are+slanderers+of+the+truth%2C+or+their+catholic+doctrines+may+be+atheism+and+blasphemy.%E2%80%9D%0A%0A%E2%80%94+Thomas+Beard%2C+A+Retractive+from+the+Romish+Religion%E2%80%A6+%28London%2C+1616%29%2C+Motive+12%2C+pp.+469-70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff48151ccb9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f48151ccb9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=71.%20Fourthly%2C%20they%20%5BRomanists%5D%20accuse%20us,doctrines%20may%20be%20atheism%20and%20blasphemy&amp;text=71.%20Fourthly%2C%20they%20%5BRomanists%5D%20accuse%20us%20of%20blasphemy&amp;text=their%20catholic%20doctrines%20may%20be%20atheism%20and%20blasphemy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The will of God as to the peculiar actings on the Father in this matter [the eternal Trinitarian covenant] is the will of the Father, and the will of God with regard unto the peculiar acts of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son. And in this respect the covenant whereof we treat differs from a pure decree; for from these distinct actions of the will of God in the Father and the Son there does arise a new habitude or relation which is not natural or necessary unto them, but freely taken on them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The will of God as to the peculiar actings on the Father in this matter [the eternal Trinitarian covenant] is the will of the Father, and the will of God with regard unto the peculiar acts of the Son is the will of the Son; not by a distinction of sundry wills, but by the distinct application of the same will unto its distinct acts in the persons of the Father and the Son. And in this respect the covenant whereof we treat differs from a pure decree; for from these distinct actions of the will of God in the Father and the Son there does arise a new habitude or relation which is not natural or necessary unto them, but freely taken on them.”

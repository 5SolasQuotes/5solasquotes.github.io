<main class="wrap"><figure class="quote" id="q-17a3f4588b" data-kw="">
<blockquote><p>Our rest on Earth should bear some proportion to our rest in Heaven. Our rest in Heaven shall not only be a cessation from labour, but from all sensual vain pleasure, from all worldly discourse, a continual pleasure in beholding and enjoying God. If we would keep a Sabbath perfectly, certainly, (abating what is necessary for our selves or others, for the sustentation of our bodies, and the preservation both of our selves and other creatures) we should allow our selves no more labour than we shall have in Heaven, no other pleasure than the Angels and Saints of God have there, all whose pleasure is in the contemplation and enjoyment of God. Oh that we could thus sanctify Sabbaths!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A modest plea for the Lord’s Day or rather the sum of the plea made by divines for the Lord’s Day as the Christian Sabbath, against those who contend for the old Sabbath of the seventh day, in order from the creation</cite>, (London, 1669), p. 111.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Section 7. Third part of liberty, viz., the free rise of things indifferent. The knowledge of this part necessary to remove despair and superstition. Superstition described… The third part of this liberty is that we are not bound before God to any observance of external things which are in themselves indifferent, (“adiafora”) but that we are now at full liberty either to use or omit them. The knowledge of this liberty is very necessary to us; where it is wanting our consciences will have no rest, there will be no end of superstition. In the present day many think us absurd in raising a question as to the free eating of flesh, the free use of dress and holidays, and similar frivolous trifles, as they think them; but they are of more importance than is commonly supposed. For when once the conscience is entangled in the net, it enters a long and inextricable labyrinth, from which it is afterwards most difficult to escape. When a man begins to doubt whether it is lawful for him to use linen for sheets, shirts, napkins, and handkerchiefs, he will not long be secure as to hemp, and will at last have doubts as to tow; for he will revolve in his mind whether he cannot sup without napkins, or dispense with handkerchiefs. Should he deem a daintier food unlawful, he will afterwards feel uneasy for using loafbread and common eatables, because he will think that his body might possibly be supported on a still meaner food. If he hesitates as to a more genial wine, he will scarcely drink the worst with a good conscience; at last he will not dare to touch water if more than usually sweet and pure. In fine, he will come to this, that he will deem it criminal to trample on a straw lying in his way. For it is no trivial dispute that is here commenced, the point in debate being, whether the use of this thing or that is in accordance with the divine will, which ought to take precedence of all our acts and counsels. Here some must by despair be hurried into an abyss, while others, despising God and casting off his fear, will not be able to make a way for themselves without ruin. When men are involved in such doubts whatever be the direction in which they turn, every thing they see must offend their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.10.7</span></figcaption>

</figure><figure class="quote" id="q-bdb1b8ad85" data-kw="">
<blockquote><p>Latin songs, as well as organs (first introduced into the churches by Pope Vitellianus about 665) are for the most part abolished in the churches of this land. Not that use of the Latin language or of music is rejected of itself and the youth are rightly allowed these in their place, as in the schools and at home in their houses. But it is more profitable and more edifying when in the public assemblies, the prayer, singing, and the whole of the service of worship is performed in a known and intelligible language so that the common man is able to retain something from it, and to say Amen. And this has the apostle Paul commanded the Corinthians in their assemblies (1 Cor. 14), who otherwise highly extols tongues and the variety of languages. So also the superfluous and unbeneficial costs expended on organs are much better directed to other necessary causes in the maintenance of churches and schools.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-nassau-confession.html">The Nassau Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(1578) in James T. Dennison Jr</cite>, ed. Reformed Confessions of the 16th and 17th Centuries in English Translation: 1523–1693, vol. 3 (Grand Rapids, MI: Reformation Heritage Books, 2008–14), 515.</span></figcaption>

</figure><figure class="quote" id="q-97cd29bf36" data-kw="">
<blockquote><p>From this passage let us learn, that we ought to contemplate the providence of God in such a manner as to ascribe to his almighty power the praise which it deserves for righteous government. Although the rectitude by which God regulates his judgments is not always apparent or made visible to us, still it is never lawful to separate his wisdom and justice from his power. But as the Scriptures very frequently state and clearly explain the reason why God does this or that, we ought carefully to examine the cause of his works.

That invention which the Schoolmen have introduced, about the absolute power of God, is shocking blasphemy. It is all one as if they said that God is a tyrant who resolves to do what he pleases, not by justice, but through caprice. Their schools are full of such blasphemies, and are not unlike the heathens, who said that God sports with human affairs. But in the school of Christ we are taught that the justice of God shines brightly in his works, of whatever kind they are, “that every mouth may be stopped,” (Romans 3:19,) and that glory may be ascribed to him alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 152.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“From this passage let us learn, that we ought to contemplate the providence of God in such a manner as to ascribe to his almighty power the praise which it deserves for righteous government. Although the rectitude by which God regulates his judgments is not always apparent or made visible to us, still it is never lawful to separate his wisdom and justice from his power. But as the Scriptures very frequently state and clearly explain the reason why God does this or that, we ought carefully to examine the cause of his works.

That invention which the Schoolmen have introduced, about the absolute power of God, is shocking blasphemy. It is all one as if they said that God is a tyrant who resolves to do what he pleases, not by justice, but through caprice. Their schools are full of such blasphemies, and are not unlike the heathens, who said that God sports with human affairs. But in the school of Christ we are taught that the justice of God shines brightly in his works, of whatever kind they are, “that every mouth may be stopped,” (Romans 3:19,) and that glory may be ascribed to him alone.”

— John Calvin, Commentary on the Book of the Prophet Isaiah: Volume Second, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 152.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+this+passage+let+us+learn%2C+that+we+ought+to+contemplate+the+providence+of+God+in+such+a+manner+as+to+ascribe+to+his+almighty+power+the+praise+which+it+deserves+for+righteous+government.+Although+the+rectitude+by+which+God+regulates+his+judgments+is+not+always+apparent+or+made+visible+to+us%2C+still+it+is+never+lawful+to+separate+his+wisdom+and+justice+from+his+power.+But+as+the+Scriptures+very+frequently+state+and+clearly+explain+the+reason+why+God+does+this+or+that%2C+we+ought+carefully+to+examine+the+cause+of+his+works.%0A%0AThat+invention+which+the+Schoolmen+have+introduced%2C+about+the+absolute+power+of+God%2C+is+shocking+blasphemy.+It+is+all+one+as+if+they+said+that+God+is+a+tyrant+who+resolves+to+do+what+he+pleases%2C+not+by+justice%2C+but+through+caprice.+Their+schools+are+full+of+such+blasphemies%2C+and+are+not+unlike+the+heathens%2C+who+said+that+God+sports+with+human+affairs.+But+in+the+school+of+Christ+we+are+taught+that+the+justice+of+God+shines+brightly+in+his+works%2C+of+whatever+kind+they+are%2C+%E2%80%9Cthat+every+mouth+may+be+stopped%2C%E2%80%9D+%28Romans+3%3A19%2C%29+and+that+glory+may+be+ascribed+to+him+alone.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+the+Prophet+Isaiah%3A+Volume+Second%2C+trans.+William+Pringle+%28Geneva%2C+1551%29+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+vii%2C+152.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97cd29bf36.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97cd29bf36.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/12/07/john-calvin-on-the-shocking-blasphemy-of-absolute-lawless-power/" rel="n

<blockquote><p>4. The old covenant is abrogated as to the yoke of Mosaical policy. — We have nothing to do with the judicial laws of the Jews, any farther than they are moral, or of a moral equity: “The law and the prophets were until John.” (Lk. 16:16) “The priesthood being changed, there is made of necessity a change also of the law.” (Heb. 7:12)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9251b8fa2a" data-kw="">
<blockquote><p>Assertion 2: That the king only has the power of war and raising armies must be but a positive civil law. For: 1. By divine right, if the inferior judges have the sword given to them of God, then have they also power of war and raising armies. 2. …as therefore the king cannot take from one particular man the power of the sword for natural self-preservation, because it is the birthright of life, neither can the king take from a community and kingdom a power of rising in arms for their own defense… 3. Because no king, no civil power can take away nature’s birthright of self-defense from any man or a community of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644; Edinburgh: Ogle, 1843), p. 184 rt col</span></figcaption>

<blockquote><p>3. The goodness or badness of a human action may be considered two ways, viz. either in actu signato [in the signified act] and quo ad speciem [as to the species], or in actu exercito [in the exercised act] and quo ad individuum [as to the individual thing]. For an action is said to be specificated by its object and individuated by its circumstances. So that when an action is good or evill in respect of the object of it, then it is called good or evil quo ad speciem. When it is good or evil in respect of the circumstances of it, then it is said to be good or evil quo ad individuum. … 6. Every thing which is indifferent in the nature of it is not by-and-by indifferent in the use of it. But the use of a thing-indifferent ought evermore to be either choosed or refused, followed or forsaken, according to these three rules delivered to us in God’s Word: 1. the rule of piety, 2. the rule of charity, 3. the rule of purity. … We may not for the commandment of men transgress the rule of piety by doing any thing which is not for God’s glory and ordered according to his will; neither ought any of us to obey men except for the Lord’s sake and as the servants of Christ, doing the will of God, which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ and as if Christ commanded it]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity, but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly, may we obey men so as to break the law of purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information… … 2. As for those actions which proceed from the deliberation of reason, howbeit many of them be indifferent quo ad speciem, yet none of them is, nor can be indifferent quo ad individuum. The reason of this difference and distinction is because every action has its species or kind from the object; and a human moral action has its species or kind from the object referred to the original of human actions, which is reason. Whereupon it comes that if the object of the action include something that agrees to the order of reason, it shall be a good action according to it’s kind: for example, to give alms to an indigent man. But if it include something that is repugnant to the order of reason, it shall be an evil action according to its kind, as to steal or take away another man’s goods. Now sometimes it happens that the object of an action does not include something that belongs to the order of reason, as to lift a straw from the ground, to go to the field etc. such actions are indifferent, according to their kind. But we must pronounce far otherwise of them, when we speak of them quo ad individuum, because as they are individuated by their circumstances, so in their individual being they have their goodness or badness from the same circumstances, as has been showed. So that no such action as is deliberated upon can be indifferent quo ad individuum; because oportet [it is needful] says Thomas, quod quilibet individualis actus habeat aliquam circumstantiam, per quam trahetur ad bonum, vel malum, ad minus ex parte intentionis finis [every individual act has some circumstance, through which it is drawn to the good or bad, to a lesser degree, from the part of the intention of the end].</p></blockquote>

</figure><figure class="quote" id="q-384ac9342b" data-kw="">
<blockquote><p>32. They [presbyterians] hold (I believe with warrant of God’s Word) if the king refuse to reform religion, the inferior judges, and assembly of godly pastors and other church-officers may reform; if the king will not kiss the Son, and do his duty in purging the House of the Lord, may not Elijah and the people do their duty and cast out Baal’s priests [1 Kings 18:19-24, 30, 37-40]. Reformation of religion is a personal act that belongs to all, even to any one private person according to his place.

33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17).

34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.</p></blockquote>

33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17).

34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.”

"noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There are two sorts of laws whereby God requires the obedience of his rational creatures, which are commonly called moral and positive… Positive laws are taken to be such as have no reason for them in themselves – nothing of the matter of them is taken from the things themselves commanded – but do depend merely and solely on the sovereign will and pleasure of God. Such were the laws and institutions of the sacrifices of old; and such are those which concern the sacraments and other things of the like nature under the New Testament. Moral laws are such as have the reasons of them taken from the nature of the things themselves required in them; for they are good from their respect to the nature of God himself, and from that nature and order of all things which he hath placed in creation. So that this sort of laws is but declarative of the absolute goodness of what they do require; the other is constitutive of it, as unto some certain ends. Laws positive, as they are occasionally given, so they are esteemed alterable at pleasure. Being fixed by mere will and prerogative, without respect to any thing that should make them necessary antecedent to their giving, they may by the same authority at any time be taken away and abolished.</p></blockquote>

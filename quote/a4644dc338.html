<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, p. 114</span></figcaption>

</figure><figure class="quote" id="q-0a31a40610" data-kw="">
<blockquote><p>…and that in our name He took unto Himself possession of the heavenly inheritance: ‘and sits at the right hand of God’ (Eph. 1:20), that is, has taken to Himself power over all things in heaven and in earth: So that, in asmuch as He is our Mediator and is man, He has obtained of his Father the second place: is appointed head of the Church, as well which is in heaven, as which is on earth: that from Him, and even from his flesh, is conveyed by his Holy Spirit, whatsoever pertains to the quickening and to the spiritual life of us, to all those, which as members are fastened unto Him their head. And therefore we acknowledge, believe and confess that in Christ alone is placed our whole salvation, redemption, justice, favor of God and eternal life: according to that saying, ‘Who of God is made unto us wisdom and righteousness, and sanctification and redemption’ (1 Cor. 1:30): Also, ‘He is our peace’: Also, ‘Jehouah our righteousness’, ‘in Him we have redemption by his blood, forgiveness of sins’: Also, ‘It pleased the Father that in Him all fullness should dwell’: Also, ‘Life is in his Son’ (Eph. 2:14; Jer. 23:6; Eph. 1:7; Col. 1:19; 1 Jn. 5:11). And therefore we know that the promise concerning redemption, which was made unto the first man, did receive accomplishment in this other man Jesus Christ: so that whosoever will be made partaker of it, he must needs be joined to his head Christ and be made a member of Him. For we have redemption and salvation not only by Him, as a Mediator, but also in Him, as our head. This is our faith concerning Christ the redeemer, his person, natures, and office, and the salvation of mankind fulfilled and laid up in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, pp. 71-72 of ch. 11, section 15 in H. Zanchius his Confession of Christian Religion… (Cambridge, 1599)</span></figcaption>

</figure><figure class="quote" id="q-ed50f0f0ca" data-kw="">
<blockquote><p>Objection: If Christ as God-man be Mediator, then the divine nature subsisting in the relation of the Son, received the Office of Mediator, and consequently something may be added to God, but nothing can be added to God because He is perfection itself? Answer: The divine nature received not the office as considered in itself, but in respect of its voluntary dispensation, as accepting of subsistence with the human nature, i.e. Christ received and sustained the Office of Mediatour, not as God alone, nor as man alone, but as God-man: the divine nature in respect of its voluntary dispensation: the human nature properly. To the divine nature there is not anything added, only a relation: but to the human nature there is added a real change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clarke.html">Samuel Clarke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla Theologiæ, or, The Marrow of Divinity contained in Sundry Questions &amp; Cases of Conscience</cite>, (London, 1659), ch. 29, ‘Questions &amp; Cases of Conscience about Christ’, p. 294</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

<main class="wrap"><figure class="quote" id="q-7ac7d44bca" data-kw="">
<blockquote><p>This extract from Thomas Houston is relevant to much of the raving fanaticism surrounding debates about health-care in the United States. On the one hand, it condemns the liberals who want to provide health-care for the poor, but who say nothing against and even actively promote the murder of the unborn. Conversely, it condemns the conservatives who prefer a few lousy tax-dollars to the lives and well-being of other people. They even take this to the point of condoning the iniquitous health-insurance industry, which allows greedy men to oppress others in a lust for profit. (I am not saying that taxes should not eventually be lower, but they should be reduced via abolishing standing armies and other state-funded evil. Another practical step would be to ensure that people are receiving just wages, so that they can fairly contribute to the common good. Moreover, the best way to ultimately reduce the tax-rate is for the nation to observe the first table of the law. This will result in increased prosperity, so that social services can be provided at much lower expense than at present. Ultimately, however, the plans of the liberals and conservatives will be brought to nothing, as they are both at enmity with Christ. See Deuteronomy 28, Psalm 2.) Neither the liberal or conservative viewpoints bears any resemblance to our Reformed orthodoxy. Instead, Dr Houston sets forth a more biblical and compassionate viewpoint:

Christians are everywhere awakening to a consciousness that the spirit of our holy religion is eminently practical, and that it has yet to reap some of its noblest triumphs, in removing the evils, moral and physical, that afflict the population of Christian countries, and banishing all that is inhuman from the earth. The value of human life is felt and acknowledged, wherever pure and undefiled religion prevails, and all proper means, often at great expense, are employed to defend and preserve it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The races: the evils connected with horse-racing and the steeple-chase and their demoralizing effects</cite>, (1853) in Works doctrinal and practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh, 1876), iv, 370.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-080fdcf6c5" data-kw="">
<blockquote><p>It was framed and concluded by the representatives of kingdoms in concurrence with those of the Church; it was sworn by them in their public capacity; at their call and by their authority, it was afterwards sworn by the body of all the people in their different ranks and orders; and finally it was ratified and pronounced valid by laws both civil and ecclesiastical. The public faith was thus plighted by all the organs through which a nation is accustomed to express its mind and will. Nothing was wanting to complete the national tie, and to render it permanent; unless it should be maintained that absolute unanimity is necessary, and that a society cannot contract lawful engagements to God or man, as long as there are individuals who oppose and are dissentient. Sanctions less sacred, and pledges less numerous would have given another nation, or even an individual, a perfect right to demand from Britain the fulfillment of any treaty or contract; and shall not God – who was not only a witness, but a principal party, and whose honor and interests were immediately concerned in this transaction – have a like claim? Or shall we “break the covenant and escape? [Ezekiel 17:15]</p></blockquote>

<blockquote><p>Next, after a thousand years of repose and silence in the Church, the third was developed (Soteriology) through the labors of Luther and Calvin, proclaiming salvation as by grace through faith, leaving the fourth, Ecclesiology, yet to be developed. Do not the providences of God toward the American Church in freeing her from the civil domination which, by violence or seduction, silenced the martyr-voice of her Scotch mother when she would testify for Christ’s crown and covenant, and in placing the Church here in a position (for the first time, perhaps, since the apostles) to actualize fully and without hindrance her true nature and functions as a spiritual commonwealth—do not all seem to indicate that the time has fully come for the final development of the visible Church as a governmental power on earth, yet a kingdom not of this world, a people not reckoned among the nations?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ea539688e4" data-kw="">
<blockquote><p>Because there is no precept, example, or approved ground in sacred Scripture for the observation of that day in honour of Christ’s birth, if any such be, let him that can shew it, and I will embrace it, and recant my error at Paul’s-crosse, or the Exchange, but it is an human invention, and a mere tradition of men, and was devised, and the religious observation of it, and other holy days were imposed and commanded merely and only by man without any ground and warrant from Christ, therefore they that will honour Christ, (as all ought to do) must not observe it or them, being without Christ’s direction.

It is an honour peculiar to Jesus Christ, to prescribe times, days and worships, and an high entrenching on his Sovereign Authority and Kingly office, to prescribe days and times, therefore what Christ our Lord and Master doth not command, or allow warrant to do, we may not do, we may not observe days or times without his appointment and warrant, but punctually (as near as we can) keep to his command, Deut. 5. 32, 33. Jerem. 7. 22 Isaiah 1. 12. Therefore Dr. Fulk speaking of the sign of crosse in baptism saith, It cannot be a memorial of Christ’s, because Christ commanded it not, and so may I say of this, and all other the like holy days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-mocket.html">Thomas Mocket</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christmas, The Christian’s grand feast: Its original, growth, and observation, also of Easter, Whitsontide, and other holy days modestly discussed and determined. Also the beginning of the year, and other things observable</cite>, (London: Richard Wodenoth, 1650), pp 17-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7ba0c7d85" data-kw="">
<blockquote><p>Tilen sets out the expediency of holy-days for imprinting in the minds of people the sense and knowledge of the benefits of redemption. Answer:

1. There is no mean so good for this purpose as catechizing and preaching, out of season and in season.

2. What could he say unto them who have attained his end without his mean? I find people better instructed and made more sensible of those benefits where the feasts are not kept, than where they are.

3. Think they their people sufficiently instructed in the grounds of religion when they hear of the nativity, passion, etc. What course will they take for instructing them in other principles of faith? Why do they not keep one way, and institute a holy-day for every particular head of catechism? But Bishop Lindsey thinks yet to let us see a greater expediency for observing holy-days. Certainely says he, nothing is so powerful to abolish profaneness and to root out superstition of men’s hearts, as the exercise of divine worship in preaching, praying and thanksgiving, chiefly then when the superstitious conceits of merit and necessity are most pregnant in the heads of people, as doubtless they are when the set times of solemnities return; for then it is meet to lance the oposterne when it is ripe. Answer: This is a very bad cure and is not only to heal the wound of the people slightly [Jer. 6:14], but to make it the more inveterate and festered. I might object that little or nothing is preached or spoken by him and his companions at the revolution of those festivities against the superstitious keeping of them; but though they should speake as much as can be against this superstition, their lancing being in word only, and not in deed, the recidivation will prove worse than the disease. The best lancing of the oposterne were not to observe them at all, or to preach against them, which are tried to work this effect more powerfully than the bishop’s cure has done: for all know, that there is none so free of this superstition as those who observe not the holy-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 2, ‘Against those of our Opposites who plead for the Ceremonies as things Expedient’, pp. 13-14</span></figcaption>

</figure><figure class="quote" id="q-6851cdc0bb" data-kw="">
<blockquote><p>But to celebrate solemnly the day of a man’s birth, it has been a custom of all nations: and in my judgment, it is not done amiss, so that there be used a godly modesty. Surely it is a notable gift that we may be reckoned among the number of God’s creatures. And who doubts, but that it is well done, to give thanks unto God for it, and in thanksgiving to testify the joyfulness of mind by an outward token of some modest banket? The use of honest pleasures is such, as they have always godliness joined with them.</p></blockquote>

<blockquote><p>[B]ut we may say of the observation of holy days, as our Saviour in another case, from the beginning it was not so. The truth is, that holy days, Monkery, Nunnery, solitary life, Images, praying for the dead, prayer to Saints departed and Angels as Mediators, were brought in by the factors for Antichrist, yet with such specious pretences, and seeming devotion and holiness, that even many good men were strangely deceived by them, till it was too late to withstand them. But by those Christmas sports, carnal pleasures and delights, God hath in those few holy days been more dishonoured, the devil better served, evil men more hardened in their wickedness, and good men more grieved, and more souls sent head-long to hell, than on any other day, yea, than on all the rest of the year beside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-mocket.html">Thomas Mocket</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christmas, The Christian’s grand feast: Its original, growth, and observation, also of Easter, Whitsontide, and other holy days modestly discussed and determined. Also the beginning of the year, and other things observable</cite>, (London: Richard Wodenoth, 1650), p. 9.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[B]ut we may say of the observation of holy days, as our Saviour in another case, from the beginning it was not so. The truth is, that holy days, Monkery, Nunnery, solitary life, Images, praying for the dead, prayer to Saints departed and Angels as Mediators, were brought in by the factors for Antichrist, yet with such specious pretences, and seeming devotion and holiness, that even many good men were strangely deceived by them, till it was too late to withstand them. But by those Christmas sports, carnal pleasures and delights, God hath in those few holy days been more dishonoured, the devil better served, evil men more hardened in their wickedness, and good men more grieved, and more souls sent head-long to hell, than on any other day, yea, than on all the rest of the year beside.”

— Thomas Mocket, Christmas, The Christian’s grand feast: Its original, growth, and observation, also of Easter, Whitsontide, and other holy days modestly discussed and determined. Also the beginning of the year, and other things observable, (London: Richard Wodenoth, 1650), p. 9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BB%5Dut+we+may+say+of+the+observation+of+holy+days%2C+as+our+Saviour+in+another+case%2C+from+the+beginning+it+was+not+so.+The+truth+is%2C+that+holy+days%2C+Monkery%2C+Nunnery%2C+solitary+life%2C+Images%2C+praying+for+the+dead%2C+prayer+to+Saints+departed+and+Angels+as+Mediators%2C+were+brought+in+by+the+factors+for+Antichrist%2C+yet+with+such+specious+pretences%2C+and+seeming+devotion+and+holiness%2C+that+even+many+good+men+were+strangely+deceived+by+them%2C+till+it+was+too+late+to+withstand+them.+But+by+those+Christmas+sports%2C+carnal+pleasures+and+delights%2C+God+hath+in+those+few+holy+days+been+more+dishonoured%2C+the+devil+better+served%2C+evil+men+more+hardened+in+their+wickedness%2C+and+good+men+more+grieved%2C+and+more+souls+sent+head-long+to+hell%2C+than+on+any+other+day%2C+yea%2C+than+on+all+the+rest+of+the+year+beside.%E2%80%9D%0A%0A%E2%80%94+Thomas+Mocket%2C+Christmas%2C+The+Christian%E2%80%99s+grand+feast%3A+Its+original%2C+growth%2C+and+observation%2C+also+of+Easter%2C+Whitsontide%2C+and+other+holy+days+modestly+discussed+and+determined.+Also+the+beginning+of+the+year%2C+and+other+things+observable%2C+%28London%3A+Richard+Wodenoth%2C+1650%29%2C+p.+9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7550e17b06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7550e17b06.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/04/07/thomas-mocket-on-holy-days-as-the-work-of-antichrist/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-506762ccac" data-kw="">
<blockquote><p>As the godly consideration of predestination and our election in Christ, is full of sweet, pleasant, and unspeakable comfort to godly persons, and such as feel in themselves the working of the Spirit of Christ, mortifying the works of the flesh, and their earthly members, and drawing up their mind to high and heavenly things, as well because it doth greatly establish and confirm their faith of eternal salvation to be enjoyed through Christ, as because it doth fervently kindle their love towards God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef2c0c632" data-kw="">
<blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 12</span></figcaption>

</figure><figure class="quote" id="q-da5636a070" data-kw="">
<blockquote><p>That Christ Jesus by His death did bring forth salvation and reconciliation only for the elect (John 15:13; Rom. 8:32–34; 5:11; 3:25), which were those which God the Father gave Him (Job 17:2; 6; 37); and that the gospel which is to be preached to all men as the ground of faith, is, that Jesus is the Christ, the Son of the ever-blessed God…</p></blockquote>

</figure><figure class="quote" id="q-68e1533d1d" data-kw="">
<blockquote><p>The doctrine of the high mystery of predestination is to be handled with special prudence and care, that men attending the will of God revealed in His Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election; so shall this doctrine afford matter of praise, reverence, and admiration of God, and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 3.7</span></figcaption>

</figure><figure class="quote" id="q-b096402687" data-kw="">
<blockquote><p>Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful…</p></blockquote>

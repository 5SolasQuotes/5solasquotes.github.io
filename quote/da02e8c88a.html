<main class="wrap"><figure class="quote" id="q-da02e8c88a" data-kw="">
<blockquote><p>4. Newness of being is essential to it [created being], or of its notion…

5. As also assiduous dependence on the First Being and containment or inexistence in it. But its being in God is threefold: eminent, ideal, intelligible. In that way it is in his power as in an efficient cause, conserving and governing: in that [ideal way] in the idea as in an exemplary cause: in this [intelligible way] in knowledge as in the knower, the most beautiful Himself bearing the beautiful world in mind, etc., Boethius sings. And divinely the apostle, Acts 17: ‘In Him we live, and move, and are:’ and, τοῦ γὰρ καὶ γένος ἐσμέν, as the apostle [cites] there from Aratus. [This is] Against Durandus and those of whom Augustine makes mention, bk. 5, On the Literal Meaning of Genesis, who denied concourse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, pt. 2, On Creation, pt. 2, p. 118, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e60a53b20b" data-kw="">
<blockquote><p>Even though Calvin, Ames, and the authors of the Westminster Standards, with few exceptions, if any, undoubtedly understood the days to be ordinary days, there is no ground for supposing that they intended to exclude any and all other views, in particular the view that the days may be longer. Such views are outside their purview; their concern, in fact, moves in the opposite direction, against the instantaneous view that denies any length. This point bears emphasizing within the context of the current debate about the days of Genesis. To establish that the Standards mandate the six 24 hour days view requires more than demonstrating that the Divines, perhaps even to a man, held that the days were ordinary days. To demonstrate that of itself establishes nothing. What needs also to be shown, which we believe cannot be shown, is that they intended to exclude the views that the days are longer in some respect or that they represent a literary framework.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-theological-seminary-east-faculty.html">Westminster Theological Seminary, East, Faculty</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Theological Seminary &amp; the Days of Creation</cite>, (1999), p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b3534ad0fd" data-kw="">
<blockquote><p>Creation is the action of God, whereby out of nothing He brought forth nature itself and all things in nature, both substances and accidents, in and with the substances, and finished them in the space of six days, both to his own glory and the salvation of the elect… Or thus, creation is a transient or external action of God, whereby in the beginning He made the world by a mere command out of his own free will in six days’ space to the glory of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 225</span></figcaption>

<main class="wrap"><figure class="quote" id="q-549075f962" data-kw="">
<blockquote><p>Josephus, Of the Jewish War, bk. 7, ch. 24, writes that there is a river in Palestine, which passes between two cities… which river is admirable for an extraordinary singularity: namely, that having entertained his violent and swift course for the space of six days, on the seventh it remains dry: which being past, it runs as before; and therefore is called the river of the Sabbath:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-swan.html">John Swan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Speculum mundi: or a Glass Representing the Face of the World</cite>, … (Cambridge, 1635), ch. 6, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9add80416" data-kw="">
<blockquote><p>God could have created them all at once, but He made them in the space of six days,¹ that He might show… ¹ That opinion of Augustine, that God made all things in a moment and distributed them into days because of our better understanding, is exploded by all. Although Creation was done in a moment, in respect of the particular bodies severally considered, yet in respect of all, it was not perfected in an instant, but in the space of six days; which spaces of days, note not a temporal succession of the same, but the order of diverse works. Some allege [against this the singular word ‘day’ in] Gen. 2:4, but it is not unusual in the Scripture to comprehend many days under the name of one. See Aquinas, [Summa] pt. 1, quest. 74, art. 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 229</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

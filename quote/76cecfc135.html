<blockquote><p>(1) It is extremely dangerous. Heresies and errors by this means, may, and often have been very insensibly introduced into churches, congregations or families. (2) There is no need of it. The Holy Ghost hath, in the Psalms of David, and other scriptural songs, furnished us with such a rich collection of gospel doctrines and precious promises – an extensive fund of solid experiences – an exhaustless mine of gospel grace and truth – an endless variety to suit every state or condition, in which either our own soul, or the church of Christ, can be upon earth. These were framed by him who searcheth the hearts, and knows the deep things of God; and hence must be better adapted to the case of souls or societies, than any private composition whatever. (3) Though the Holy Ghost never saw meet to leave us a liturgy of prayers; yet from the poetical compositions thereof, it is plain he intended these psalms and songs for a standing form of praise in the church. It is certain they were used in this manner under the Old Testament. The Holy Ghost hath, under the New, plainly directed us to the use hereof, Col. iii. 16. Eph. v. 19. The PSALMS, HYMNS, and SPIRITUAL SONGS, there recommended are plainly the same with the MIZMOREM, TEHILLIM, and SHIRIM, mentioned in the Hebrew titles of David’s Psalms, iii. iv. v. &amp;c. cxlv. cxx. – cxxxiv.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David, in metre: allowed by the authority of the General Assembly of the Church of Scotland, and of the Presbyterian Churches in</cite>, America. With notes exhibiting the connexion, explaining the sense, and for directing and animating devotion (Pittsburgh, 1812), iv-v.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4842eb8ff8" data-kw="">
<blockquote><p>That it is an ancient and excellent ordinance of God, that in his worship and service we should sing psalms, even David’s Psalms, and that we should sing them in that manner as may be most unto edification. Observe the proof of this doctrine, as I shall propound it unto you distinctly in three points: … Thirdly, the Psalms that God’s people did use to sing in the worship of God were most usually David’s Psalms, and those that are accounted among his: and that even at such times when there were prophets in the Church that had extraordinary gifts, and were inspired by the Holy Ghost, yet the Church did not usually sing any other than David’s Psalms: This we shall see in the days of Hezekiah, 2 Chron. 29:30. Hezekiah the King, and the princes commanded the Levites to sing praise to the Lord, with the words of David, and of Asaph the Seer. The like we may see in Ezra’s time, Ezra 3:10. They set the priests in their apparel with trumpets; and the Levites the sons of Asaph with cymbals to praise the Lord with those songs (as Tremelius rendreth it) that David the King of Israel did deliver; and the Psalm they sung was, Ps. 136, as appeareth by the 11th verse. And this may also further appear by that which we read, Neh. 12:46. To which purpose it is worthy the observing that though there were many of God’s holy servants that made songs, and psalms beside David, as Deborah, Jud. 5:1, and Anna, the mother of Samuel, 1 Sam. 2:1, and Solomon, Cant. 1:1, and Mary the blessed Virgin, Lk. 1:46, such as might be used, yet were none of them committed to the musicians to be publicly sung in the temple, but these of David only. In which respect he (by an excellency) is called the sweet Psalmist of Israel, 2 Sam. 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 152 Lectures upon Psalm 51… (London, 1635), Lecture 1, p. 4-5 This section is occasioned upon the title of Ps. 51, that it is a psalm of David ‘to the chief musician’.</span></figcaption>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>

</figure><figure class="quote" id="q-be5edc98fb" data-kw="">
<blockquote><p>The Christian Reformed Church holds it as one of its distinctive principles that the psalms are to be used in public worship as the chief manual of praise. There is divine authority for this use of the psalms, as shown by 1 Chron. 16:4, 7; II Chron. 29:30; Ps. 105:2; 95:1, 2 and Neh. 12:24. Our Lord and his apostles used them to praise God. The “hymn” of Matt. 26:30 and Mark 14;26 refers to Psalms 113 to 118, the great “Hallel” of the Passover celebration. The hymns, songs, and psalms of Eph. 15:19 and Col. 3:16 evidently to not refer to N. T. compositions but to the O.T. Psalms which in the Greek version bear the titles given above. The psalms meet the great requirements of praise, exalting God in His being and work and continuing confessions of our unworthiness, our faith, our gratitude, our needs. In depth of spirituality the psalms excel the hymns. “In the psalms we hear the abiding, eternal fundamental note of the pious heart resounding.” [G. M. Ophoff, Church Right—ed.]….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-beets.html">Henry Beets</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Historical and Explanatory Introduction,” in The Psalter, Doctrinal Standards, Liturgy, And Church Order of the Christian Reformed Church in America</cite>, (Grand Rapids: William B. Eerdmans Publishing Co., 1926).</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Christian Reformed Church holds it as one of its distinctive principles that the psalms are to be used in public worship as the chief manual of praise. There is divine authority for this use of the psalms, as shown by 1 Chron. 16:4, 7; II Chron. 29:30; Ps. 105:2; 95:1, 2 and Neh. 12:24. Our Lord and his apostles used them to praise God. The “hymn” of Matt. 26:30 and Mark 14;26 refers to Psalms 113 to 118, the great “Hallel” of the Passover celebration. The hymns, songs, and psalms of Eph. 15:19 and Col. 3:16 evidently to not refer to N. T. compositions but to the O.T. Psalms which in the Greek version bear the titles given above. The psalms meet the great requirements of praise, exalting God in His being and work and continuing confessions of our unworthiness, our faith, our gratitude, our needs. In depth of spirituality the psalms excel the hymns. “In the psalms we hear the abiding, eternal fundamental note of the pious heart resounding.” [G. M. Ophoff, Church Right—ed.]….”

— Henry Beets, “Historical and Explanatory Introduction,” in The Psalter, Doctrinal Standards, Liturgy, And Church Order of the Christian Reformed Church in America, (Grand Rapids: William B. Eerdmans Publishing Co., 1926).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Christian+Reformed+Church+holds+it+as+one+of+its+distinctive+principles+that+the+psalms+are+to+be+used+in+public+worship+as+the+chief+manual+of+praise.+There+is+divine+authority+for+this+use+of+the+psalms%2C+as+shown+by+1+Chron.+16%3A4%2C+7%3B+II+Chron.+29%3A30%3B+Ps.+105%3A2%3B+95%3A1%2C+2+and+Neh.+12%3A24.+Our+Lord+and+his+apostles+used+them+to+praise+God.+The+%E2%80%9Chymn%E2%80%9D+of+Matt.+26%3A30+and+Mark+14%3B26+refers+to+Psalms+113+to+118%2C+the+great+%E2%80%9CHallel%E2%80%9D+of+the+Passover+celebration.+The+hymns%2C+songs%2C+and+psalms+of+Eph.+15%3A19+and+Col.+3%3A16+evidently+to+not+refer+to+N.+T.+compositions+but+to+the+O.T.+Psalms+which+in+the+Greek+version+bear+the+titles+given+above.+The+psalms+meet+the+great+requirements+of+praise%2C+exalting+God+in+His+being+and+work+and+continuing+confessions+of+our+unworthiness%2C+our+faith%2C+our+gratitude%2C+our+needs.+In+depth+of+spirituality+the+psalms+excel+the+hymns.+%E2%80%9CIn+the+psalms+we+hear+the+abiding%2C+eternal+fundamental+note+of+the+pious+heart+resounding.%E2%80%9D+%5BG.+M.+Ophoff%2C+Church+Right%E2%80%94ed.%5D%E2%80%A6.%E2%80%9D%0A%0A%E2%80%94+Henry+Beets%2C+%E2%80%9CHistorical+and+Explanatory+Introduction%2C%E2%80%9D+in+The+Psalter%2C+Doctrinal+Standards%2C+Liturgy%2C+And+Church+Order+of+the+Christian+Reformed+Church+in+America%2C+%28Grand+Rapids%3A+William+B.+Eerdmans+Publishing+Co.%2C+1926%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbe5edc98fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/be5edc98fb.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/09/in-depth-of-spirituality-the-psalms-excel-the-hymns/" rel="noo

<blockquote><p>But the barriers against revolution, in all enlightened communities, are too strong to be thrown down. In the hour when reasonable and patient-minded men realize not only the fact that revolution is always, and only, the mode of a minority, that its issue is never a stable peace, and that its method is always a ruthless cruelty, it will be abandoned.

In the day when men realize that a new social order, if it is to come, must “grow,” and be registered in laws and ordinances, it will be cast out of men’s minds. The first blow in a revolutionary assault has always roused the people to the defence of parliamentary institutions.

But beyond that, the witness of history is decisively a condemnation against swift, sudden, and violent revolution. The blaze of the French Revolution of 1798 has not yet faded from the heavens. The chaos which followed the events in France of 1848 taught even Marx a lesson which he never quite forgot. The creation of the Russian Soviet, with its inhuman cruelties and tyrannical enactments, has shed an intense light on the methods of violence.

English-speaking people continue to believe in parliamentary government on a democratic basis. As Kautsky has said the final distinction lies between a democracy and a dictatorship. The class war, with its goal of a dictatorship, is seen to be the broad road to impoverishment, enslavement, and tyranny and there can be no peace in industry, even no stable industry at all, until the passions which surge behind the class war have been purged out of men’s hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-macallum-clow.html">William Macallum Clow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Marxian Socialism in Princeton Theological Review</cite></span></figcaption>

<blockquote><p>Since, therefore, the name of Father is a sacred one, and is transferred to men by the peculiar goodness of God, the dishonoring of parents redounds to the dishonor of God Himself, nor can any one despise his father without being guilty of an offense against God, (sacrilegium.) If any should object that there are many ungodly and wicked fathers whom their children cannot regard with honor without destroying the distinction between good and evil, the reply is easy, that the perpetual law of nature is not subverted by the sins of men; and therefore, however unworthy of honor a father may be, that he still retains, inasmuch as he is a father, his right over his children, provided it does not in anywise derogate from the judgment of God; for it is too absurd to think of absolving under any pretext the sins which are condemned by His Law; nay, it would be a base profanation to misuse the name of father for the covering of sins. In condemning, therefore, the vices of a father, a truly pious son will subscribe to God’s Law; and still, whatsoever he may be, will acknowledge that he is to be honored, as being the father given him by God. Paul is a faithful interpreter of this Commandment, where he bids “children obey their parents.” (&lt;490601&gt; Ephesians 6:1; &lt;510320&gt; Colossians 3:20.) Honor, therefore, comprises subjection; so that he who shakes off the yoke of his father, and does not allow himself to be governed by his authority, is justly said to despise his father; and it will more clearly appear from other passages, that those who are not obedient to their parents are deemed to despise them. Still, the power of a father is so limited as that God, on whom all relationships depend, should have the rule over fathers as well as children; for parents govern their children only under the supreme authority of God. Paul, therefore, does not simply exhort children to obey their parents, but adds the restriction, “in the Lord;” whereby he indicates that, if a father enjoins anything unrighteous, obedience is freely to be denied him. Immoderate strictness, moroseness, and even cruelty must be born, so long as a mortal man, by wickedly demanding what is not lawful, does not endeavor to rob God of His right. In a word, the Law so subjects children to their parents, as that God’s right may remain uninfringed. …The natural sense itself dictates to us that we should obey rulers. If servants obey not their masters, the society of the human race is subverted altogether. It is not, therefore, the least essential part of righteousness that the people should willingly submit themselves to the command of magistrates, and that servants should obey their masters; and, consequently, it would be very absurd if it were omitted in the Law of God. In this commandment, then, as in the others, God by synecdoche embraces, under a specific rule, a general principle, viz., that lawful commands should obtain due reverence from us. But that all things should not be distinctly expressed, first of all brevity itself readily accounts for; and, besides, another reason is to be noticed, i.e. that God designedly used a homely style in addressing a rude people, because He saw its expediency. If He had said generally, that all superiors were to be obeyed, since, pride is natural to all, it would not have been easy to incline the greater part of men to pay submission to a few. Nay, since subjection is naturally disagreeable, many would have kicked against it. God, therefore, propounds a specific kind of subjection, which it would have been gross barbarism to refuse, that thus, their ferocity being gradually subdued, He might accustom men to bear the yoke. Hence the exhortations are derived, that people should “honor the king;” that “every soul should be subject unto the higher powers;” that “servants should obey their masters, even the froward and morose.” (Proverbs 24:21; 1 Peter 2:13; Romans 13:1; Ephesians 6:5; 1 Peter 2:14, 18.) …It is a signal exaltation of magistrates, that God should not only count them in the place of parents, but present them to us dignified by His own name; whence also it clearly appears that they are not to be obeyed only from fear of punishment, “but also for conscience sake,” (Romans 13:5) and to be reverently honored, lest God should be despised in them. If any should object, that it would be wrong to praise the vices of those whom we perceive to abuse their power; the answer is easy, that although judges are to be borne with even if they be not the best, f13 still that the honor with which they are invested, is not a covering for vice. Nor does God command us to applaud their faults, but that the people should rather deplore them in silent sorrow, than raise disturbances in a licentious and seditious spirit, and so subvert political government.</p></blockquote>

<blockquote><p>But their [the Brownists’] great tenet about the magistrate is this, that no prince nor State on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either Church or State; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the laws of God set down in Scripture; (Bar. Dis., p. 84. “I am persuaded, that the magistrate ought not to make permanent law of that the Lord has left in our liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London: 1645), pp. 31 &amp; 49-50</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But their [the Brownists’] great tenet about the magistrate is this, that no prince nor State on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either Church or State; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the laws of God set down in Scripture; (Bar. Dis., p. 84. “I am persuaded, that the magistrate ought not to make permanent law of that the Lord has left in our liberty.”

<blockquote><p>7. They [civil magistrates] might and ought to give their countenance unto, and join their authority with, such ecclesiastic statutes, overtures, or means, as Church-judicatories or officers might be about to make use of for this end in their places; and this can be no more prejudice to liberty, to countenance with their authority the ordinance of discipline, than to confirm by their authority the ordinance of preaching the Gospel. … 9. In recovering a people, in a reeling and staggering time, a magistrate may engage them to formerly received truth, and interpose his authority for this end, as is recorded of Josiah, 2 Chron. 34:31-33. Also, 10. He may and ought to remove all false worships, and endure no corrupt preaching, or writing, or meetings for that end, or administrating of corrupted sacraments, or any ordinance other than what is allowed; for, Josiah did cause the people stand to the Covenant that was made, and having removed all idolatrous worship, he made Israel to serve the Lord, that is, he made them abandon corrupt worship, and wait on pure ordinances, as keeping of the sabbaths, offering of sacrifices, etc. and that according to the manner prescribed by the Lord. Neither was it a wronging of their liberty, to do so, because:

1. It was the preservation of their liberty, to keep them from the abominable bondage of these evils.

2. It was their duty to abstain from these, and to follow the ordinances purely, and the magistrate may well put people to that.

3. It is one thing by force to keep folks from dishonouring God in a corrupt religion, (as Josiah did) another to force them to a religion; the one belongs to the ordering of the outward man, the other to the inward.

4. He might order them to keep the ordinances, and in going about them to keep the rule, because that is but a constraining of them to the means whereby religion works, and a making them, as it were, to give God a hearing, leaving their yielding and consenting to Him, when they have heard Him, to their own wills, which cannot be forced; yet it is reason that when God comes by His ordinances to treat with a people, that a magistrate should so far respect His glory and their good as to interpose His authority to make them hear.

5. Also, there is a difference between the constraining of a circumcised or baptized people, to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized, which were not formerly engaged; because, actual members of a Church have not even that liberty as others have, to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements, and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things, and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>

<blockquote><p>Their [Israel’s] Political Constitution was Monarchical, Aristocratical, and Democratical: and therefore most prudently and perfectly composed. 1. Monarchical, In that God would still have it Governed by One, as Supreme; viz. First by Moses, then by Joshua, then by Judges, then by Kings, then by Princes and Governors after the Captivity: The raising up and erecting of which Supreme Rulers, God reserved still to himself as Supreme over all.

2. Aristocratical. In that seventy chief, wise, understanding, and known men among their tribes were as Princes set over them as assistants to the Supreme Governor, Moses, &amp;c. 3. Democratical, In that these chief Heads were chosen by the people themselves out of every Tribe. This was the form of their Polity; the best form, and most excellently composed, for preventing of Anarchy, Popular Confusions and Divisions, Arbitrariness, and Tyranny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery and Marrow of the Bible: God’s Covenants with Man</cite>, (London: George Calvert, 1657), 3.4.1.2.3, p. 674.</span></figcaption>

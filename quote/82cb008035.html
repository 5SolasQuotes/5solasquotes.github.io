<main class="wrap"><figure class="quote" id="q-82cb008035" data-kw="">
<blockquote><p>The Church has the Sabbath from Christ, the Son over his own house – even the Son of man, who is Lord also of the Sabbath. And by divine right she can demand all civil liberty which the nature of the case requires, to secure for her the actual enjoyment of this boon, to prevent this gift from her Lord being either nullified or impaired.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43d87fcc7d" data-kw="">
<blockquote><p>I should be too tedious if I should stand to reckon up the manifold mercies that God hath bestowed on this our land, beyond all the world besides, our peace, and plenty, with the Gospel of Christ, our many, and great deliverances… God hath delivered us from the Spanish invasion, and the Gun-powder treason, and hath placed us in a wealthy land. ‘Be ye therefore filled with the Spirit’ (saith our prophet David) ‘speaking to yourselves in Psalms, and Hymns, and spiritual songs’: and here I might speak of the godly care of our Church, which hath ordained singing of Psalms, both before, and after sermon, and indeed are very fitting to be sung in order, for the better stirring up of our affections. And here I have a just cause to task them of the Separation, who will not admit of any set form of prayer, for that (as they say) is cursing of the Spirit; but why then should we have a set form of singing? For my part it shall ever have my allowance and I think that these their ex tempore prayers sounds as harshly in the ears of heaven, as diverse Psalms sung together in several tunes would in ours.</p></blockquote>

</figure><figure class="quote" id="q-27468f2c41" data-kw="">
<blockquote><p>But let us weigh the force of this argument; This is after the commandments and doctrines of men: therefore, it is not one of the things necessary to salvation, or to the worship of God, or for the acquiring of righteousness and holiness; for the following reasons:

1. Because God retains to himself alone this honour of appointing what he will have directly and immediately to pertain to Religion and his worship. Ye shall not do every man whatsoever is right in his own eyes: but what thing soever shall be commanded yon of the Lord, observe to do it; thou shalt not add thereto, nor diminish from it; Deut. xii. 8, 32. Hence that remark of Christ, Matth. xv. 9, In vain ye worship me, teaching the doctrines and commandments of men.

2. Because if these commandments of men pertained to the worship of God as parts of it, it would follow that the worship of God might be abrogated by human authority: for all these decrees may be either taken away or changed by the authority of those by whom they were ordained from the beginning: but that men have this power over the worship of God is most absurd.

3. Because if it be conceded that the observance of human decrees is a necessary part of worship or holiness in itself; it would thence follow, that God may be worshipped in ways not only different, but plainly contrary to one another, according to the will of men. For these human commandments are not only different, but sometimes opposed to each other. … From these things it is clearly evident, that the commands and traditions of men are not to be obtruded upon the Church under the notion of worship and righteousness, because they are the commandments of men and not of God.

Hence we derive the following Instructions :

1. That alone immediately and properly concerns Religion and the worship of God, which hath the testimony of the Divine will. It so behoves us to worship God in the way in which he himself has prescribed that he is to be worshipped, Augustine, lib. 1. De consensu Evang. cap. 18.

2. They who would have religion, righteousness, and holiness to consist in observing their commands and traditions, arrogate that to themselves, and their inventions, which is peculiar to God and the Divine commands. Men as men, speaking concerning God, are not worthy of credit; Clemens Alexandrinus, Strom. 6.

3. Since salvation and righteousness is not placed in the commands of men, they grievously err who so multiply these burdens of human traditions as thereby to hinder Christians in the exercises of true righteousness and godliness: For, it commonly happens, that when a thing is paid where it is not due, it is neglected where it is due, Tertull. De pœnit. This Christ himself complained of, that the people of God were drawn away from the observance of the Divine commands, whilst they were entirely employed upon the traditions of the Pharisees, Matth. xv. 6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 527-29.</span></figcaption>

</figure><figure class="quote" id="q-ff031f039a" data-kw="">
<blockquote><p>DEFEND THE LORD’S DAY. – Lift up a calm, undaunted testimony against all the profanations of the Lord’s day. Use all your influence, whether as a statesman, a magistrate, a master, a father, or a friend, both publicly and privately, to defend the entire Lord’s day. This duty is laid upon you in the Fourth Commandment.

Never see the Sabbath broken without reproving the breaker of it. Even worldly men, with all their pride and contempt for us, cannot endure to be convicted of Sabbath-breaking. Always remember God and the Bible are on your side, and that you will soon see these men cursing their own sin and folly when too late.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I Love the Lord’s Day</cite>, (1841) in Andrew A. Bonar (ed.), Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee (Edinburgh: Oliphant Anderson &amp; Ferrier, 1892), p. 599.</span></figcaption>

<blockquote><p>It is proper to observe the contrast between that dark and feeble kind of knowledge which the fathers enjoyed under the law, and the fullness which shines forth to us in the gospel. Though God deigned to bestow on his ancient people the light of heavenly doctrine, yet he made himself more familiarly known through Christ, as we are told; “No man hath seen God at any time; the only-begotten Son, who is in the bosom of the Father, hath declared him.” (John 1:18.) The Prophet now extols that certainty which the Son of God brought to us by his coming, when he “sheweth to us the Father.” (John 14:9.)

Yet, while we excel the ancient people in this respect, that the reconciliation obtained through Christ makes God, as it were, more gracious to us, there is no other way in which God can be known but through Christ, who is “the pattern and image of his substance.” (Hebrews 1:3.) “He who knoweth not the Son, knoweth not the Father.” (John 14:7.) Though Jews, Mahometans, and other infidels, boast that they worship God, the creator of heaven and earth, yet they worship an imaginary God. However obstinate they may be, they follow doubtful and uncertain opinions instead of the truth; they grope in the dark, and worship their own imagination instead of God. In short, apart from Christ, all religion is deceitful and transitory, and every kind of worship ought to be abhorred and boldly condemned.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is proper to observe the contrast between that dark and feeble kind of knowledge which the fathers enjoyed under the law, and the fullness which shines forth to us in the gospel. Though God deigned to bestow on his ancient people the light of heavenly doctrine, yet he made himself more familiarly known through Christ, as we are told; “No man hath seen God at any time; the only-begotten Son, who is in the bosom of the Father, hath declared him.” (John 1:18.) The Prophet now extols that certainty which the Son of God brought to us by his coming, when he “sheweth to us the Father.” (John 14:9.)

Yet, while we excel the ancient people in this respect, that the reconciliation obtained through Christ makes God, as it were, more gracious to us, there is no other way in which God can be known but through Christ, who is “the pattern and image of his substance.” (Hebrews 1:3.) “He who knoweth not the Son, knoweth not the Father.” (John 14:7.) Though Jews, Mahometans, and other infidels, boast that they worship God, the creator of heaven and earth, yet they worship an imaginary God. However obstinate they may be, they follow doubtful and uncertain opinions instead of the truth; they grope in the dark, and worship their own imagination instead of God. In short, apart from Christ, all religion is deceitful and transitory, and every kind of worship ought to be abhorred and boldly condemned.”

— John Calvin, Commentary on the Book of the Prophet Isaiah: Volume Second, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 201.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+proper+to+observe+the+contrast+between+that+dark+and+feeble+kind+of+knowledge+which+the+fathers+enjoyed+under+the+law%2C+and+the+fullness+which+shines+forth+to+us+in+the+gospel.+Though+God+deigned+to+bestow+on+his+ancient+people+the+light+of+heavenly+doctrine%2C+yet+he+made+himself+more+familiarly+known+through+Christ%2C+as+we+are+told%3B+%E2%80%9CNo+man+hath+seen+God+at+any+time%3B+the+only-begotten+Son%2C+who+is+in+the+bosom+of+the+Father%2C+hath+declared+him.%E2%80%9D+%28John+1%3A18.%29+The+Prophet+now+extols+that+certainty+which+the+Son+of+God+brought+to+us+by+his+coming%2C+when+he+%E2%80%9Csheweth+to+us+the+Father.%E2%80%9D+%28John+14%3A9.%29%0A%0AYet%2C+while+we+excel+the+ancient+people+in+this+respect%2C+that+the+reconciliation+obtained+through+Christ+makes+God%2C+as+it+were%2C+more+gracious+to+us%2C+there+is+no+other+way+in+which+God+can+be+known+but+through+Christ%2C+who+is+%E2%80%9Cthe+pattern+and+image+of+his+substance.%E2%80%9D+%28Hebrews+1%3A3.%29+%E2%80%9CHe+who+knoweth+not+the+Son%2C+knoweth+not+the+Father.%E2%80%9D+%28John+14%3A7.%29+Though+Jews%2C+Mahometans%2C+and+other+infidels%2C+boast+that+they+worship+God%2C+the+creator+of+heaven+and+earth%2C+yet+they+worship+an+imaginary+God.+However+obstinate+they+may+be%2C+they+follow+doubtful+and+uncertain+opinions+instead+of+the+truth%3B+they+grope+in+the+dark%2C+and+worship+their+own+imagination+instead+of+God.+In+short%2C+apart+from+Christ%2C+all+religion+is+deceitful+and+transitory%2C+and+every+kind+of+worship+ought+to+be+abhorred+and+boldly+condemned.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+the+Prophet+Isaiah%3A+Volume+Second%2C+trans.+William+Pringle+%28Geneva%2C+1551%29+in+Calvin%E2%80%99s+Commentaries+%2822+vo

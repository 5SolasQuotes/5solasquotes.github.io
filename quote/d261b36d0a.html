<blockquote><p>242. Of the use of Amen being added to a Speech … 1. Three duties especially are required of him that utters the speech whereunto ‘Amen’ is added. … 2. To speak audibly, so as they which are to say Amen, may hear what is said. The Levites under the Law were expressly enjoined to speak to the people with a loud voice. Accordingly the Levites that were the mouth of the people to God, and prayed in their presence, cried with a loud voice unto the Lord their God. Be a prayer made as intelligibly as may be, if it be not heard of them that are present, they cannot with assent, desire, and say Amen.</p></blockquote>

<blockquote><p>Virtually all of the orthodox systems cite a wide variety of texts–dicta probantia [proving texts]–which are intended for use, not crassly as proof texts for citation without exegesis, but as points of reference to the long-established results of the church’s exegetical tradition. The dicta probantia or proving texts serve not to circumvent study of the text but to indicate received interpretation leading from exegesis to doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD (2003) 1.426</cite></span></figcaption>

</figure><figure class="quote" id="q-ce2e126e9d" data-kw="">
<blockquote><p>The famousest divines in the Church of God, even Luther, Zwingli, Melancthon, Calvin, Perkins, Sibbes and abundance of nonconformists of greatest name in England did ordinarily use a form of prayer of their own before their sermons in the pulpit, and some of them in their families too. Now these men did it not through idleness or through temporizing, but because some of them found it best for the people to have oft the same words: and some of them found such a weakness of memory that they judged it the best improvement of their own gifts. Now besides the first composure of these prayers (which perhaps was done 20 years before) none of these men did use their own gifts, any more than if they had used a form composed by another. For the memory and utterance is the same of both. … And in some ordinances as baptism and the Lord’s Supper, etc. the same things must be daily prayed for: And he that thinks he must not frequently speak the same things, will quite corrupt the ordinance of Christ. And he that will imagine that he must have always new words will at last have new things or worse than nothing. If then it be meet to use often the same words, why may not a weak minister use the better words of others when he has none merely of his own that are so fit? Nay is it not the duty of such to do it? Every man is bound to do God’s service in the best manner that he can: ‘Cursed be the deceiver that hath a better in his flock, and bringeth that which is corrupt.’ But to utter prayers and praise to God in a full, methodical and congruous manner, and in words suitable to the majesty of the worship of God, is better (to the people and to the honor of religion) than to do it in a more confused, disorderly, broken manner, with barrenness and incongruity of speech. But this l […]st is the best that many honest ministers can do by their own gifts, when they may do it in the former better manner, by making use of the words and gifts of others. Therefore it is a duty for such men so far to use others’ gifts of inventing words before their own. And among us there is no man forbidden in the pulpit to use his own gifts to the utmost and pray without any set form of his own or other men’s. And I would at last desire any of the objectors but to name that text of Scripture which directly or indirectly commands every minister to use his gift of inventing words and method, or his gift of extemporary prayer, every time that he prays to God: Or which forbids to use the gifts of others though better than his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 32</cite>, pp. 183-85</span></figcaption>

</figure><figure class="quote" id="q-904755a747" data-kw="">
<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (London, 1649)</cite>, pp. 372-3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.”

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience… (London, 1649), pp. 372-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+17%3A+But+the+particulars+of+your+%5BWestminster%5D+Directory+of+worship+are+not+in+Scripture%2C+how+then+can+the+magistrate+punish+for+not+following+the+Directory%3F+Answer%3A+That+there+should+be+prayers%2C+preaching%2C+reading%2C+praising+of+God%2C+sacraments+in+the+public+worship%2C+is+evident+by+the+Scripture%2C+but+for+the+ordering+of+these+worships+secundum+prius+%26+posterius+%5Baccording+to+what+is+first+and+that+which+follows%5D+the+words+of+prayer+%28so+they+be+according+to+the+pattern+of+sound+doctrine%29+the+Preface+of+the+Directory+is+clear%2C+that+no+man+is+therein+to+be+compelled%2C+though+to+transgress+the+Holy+Ghost%E2%80%99s+express+order+in+the+celebration+of+the+Lord%E2%80%99s+Supper+and+to+break+bread+and+eat+first%2C+and+that+before+any+of+the+words+of+institution+be+mentioned%2C+or+any+blessing+of+the+elements%2C+must+be+a+manifest+breach+of+the+directory+of+Jesus+Christ+which+sure+holds+forth+to+us+a+twofold+ordering+of+acts+of+worship%2C+one+divine%2C+which+we+must+peremptorily+follow%2C+another+prudential+and+human+in+circumstances+which+concern+both+the+worship+of+God+and+civil+assemblies%2C+as+time%2C+place%2C+persons%2C+etc.+and+in+the+latter+we+are+no+further+to+be+commanded+in+point+of+uniformity+than+the+general+rules+of+the+Word+lead+us%3B+and+compulsion%2C+where+God+has+no+compelling+commandment+going+before+in+an+exact+uniformity%2C+we+utterly+disclaim%2C+nor+can+men%2C+or+Church%2C+or+all+the+assemblies+on+earth+make+laws+in+matters+of+God%E2%80%99s+worship+where+the+Supreme+Lawgiver+has+made+none%2C+and+the+Preface+of+the+Directory+is+so+clear+in+this+that+we+trust+we+shall+quickly+agree+with+the+godly+and+sound+in+judgment+in+this.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%E2%

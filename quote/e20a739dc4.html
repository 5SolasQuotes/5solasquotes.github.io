<main class="wrap"><figure class="quote" id="q-e20a739dc4" data-kw="augustine">
<blockquote><p>Yet it is a doctrine of the highest importance to the surer perception of the misery of man and the necessity and efficacy of saving grace. Thus it is deservedly placed among the primary doctrines of the Christian religion. II. Original sin is sometimes used more broadly to embrace imputed and inherent sin, into which as two parts it is said to be resolvable (thus it is taken by Ursinus, Zanchius and others).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

<main class="wrap"><figure class="quote" id="q-e0f0a3bda1" data-kw="">
<blockquote><p>And as to the unity or onliness rather of this being (or of the God-head) the deduction thereof seems plain and easy from what hath been already proved; that is from the absolute perfection thereof. For though some do toil themselves much about this matter; and others plainly conclude that it is not to be proved at all in a rational way, but only by divine revelation. Yet I conceive, they that follow the method (having proved some necessary self-subsisting being, the root and original spring of all Being and perfection actual and possible; which is as plain as any thing can be) of deducing from thence the absolute all comprehending perfection of such necessary being will find their work as good as done.

For nothing seems more evident than that there cannot be two (much less more) such Beings. Inasmuch as one comprehends in it self all being and perfection; for there can be but one all, without which is nothing. So that, one such being supposed, another can have nothing remaining to it. Yea so far is it therefore, if we suppose one infinite and absolutely perfect being, that there can be another independent thereon (and of a depending infinity we need not say more than we have, which if any such could be, cannot possibly be a distinct God) that there cannot be the minutest finite thing imaginable, which that supposed infinity doth not comprehend, or that can stand apart from it, on any distinct basis of its own. And that this matter may be left, as plain as we can make it; supposing it already most evident.

That there is actually existing an absolute entire fulness of Wisdom, Power, so of all other perfection.

That absolute entire fulness of perfection is infinite.

That this infinite perfection must have its primary seat somewhere.

That its primary original seat can be no where but in necessary self-subsisting Being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The living temple, or, A designed improvement of that notion that a good man is the temple of God</cite>, (London: John Starkey, 1675), pp 176-77.</span></figcaption>

<blockquote><p>7th Problem: Whether unregenerate or regenerate man sanctifies himself, or actively concurs to it? I respond: concerning the former, negatively; concerning the latter, affirmatively, if indeed sanctification in the moment and in the second act is understood, that is, its excitation and ἐνέργεια [energeia, energy/activity], or continuation. And thus the sayings 2 Cor. 7:1; 1 Jn. 3:3 are to be understood.</p></blockquote>

</figure><figure class="quote" id="q-9ca33d955c" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: …

IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience, concerning which we treat in the Ascetics, or in the treatise On the Exercise of Piety. Now the proper character of this new practice of holiness is perfection or integrity, which consists in this:

      1. That they do not sin totally and entirely, because of the resistance and reaction of the spirit, Rom. 7:17–20; Gal. 5:17.

      2. That consequently there is always some restraint, and they feel their sin with remorse and grief after they have sinned, 2 Sam. 24:10.

      3. That sin is not their daily and ordinary and professed practice, 1 Jn. 3:6, 8–9, and thus they are not and are not properly called sinners, workers of iniquity, impious, unjust; but on the contrary servants of God, pious, righteous, etc.

      4. That their merciful and most wise Father takes occasion from their fall or perpetually adhering infirmities to excite and bring them to perfection of faith, repentance, custody, excitation, and practice of conscience. Concerning which we have treated in our treatise against Tilenus written in Dutch, and in the Disputation on the Uses of Sin Per Accidens.

      5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely.

      6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16.

      7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.

V. Inchoate blessedness or glorification, which comprehends joy, peace, living hope, liberty, and all goods and privileges of the sons of God, 1 Pet. 1:3, 6–8; Rom. 8:1–2, throughout; 2 Cor. 3:17–18. Compare Ames’s Medulla, bk. 1, ch. 30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>3. Though we must not conceive of God as of a human or corporeal shape, yet we cannot think of God without some reflection upon our own being. We cannot conceive Him to be an intelligent being, but we must make some comparison between him and our own understanding nature, to come to a knowledge of him. Since we are enclosed in bodies, we apprehend nothing but what comes in by sense, and what we in some sort measure by sensible objects. And in the consideration of those things, which we desire to abstract from sense, we are fain to make use of the assistances of sense and visible things: And therefore when we frame the highest notion, there will be some similitude of some corporeal thing in our fancy; and though we would spiritualize our thoughts, and aim at a more abstracted and raised understanding, yet there will be some dregs of matter sticking to our conceptions; yet we still judge by argument and reasoning, what the thing is we think of under those material images. A corporeal image will follow us, as the shadow does the body: While we are in the body, and surrounded with fleshly matter, we cannot think of things without some help from corporeal representations: Something of sense will interpose itself in our purest conceptions of spiritual things; for the faculties which serve for contemplation, are either corporeal, as the sense and fancy, or so allied to them that nothing passes into them but by the organs of the body; so that there is a natural inclination to figure nothing but under a corporeal notion, till by an attentive application of the mind and reason to the object thought upon, we separate that which is bodily from that which is spiritual, and by degrees ascend to that true notion of that we think upon, and would have a due conception of in our mind. Therefore God tempers the declaration of Himself to our weakness, and the condition of our natures. He condescends to our littleness and narrowness, when he declares himself by the similitude of bodily members. As the light of the sun is tempered, and diffuses itself to our sense through the air and vapors, that our weak eyes may not be too much dazzled with it: Without it we could not know or judge of the sun, because we could have no use of our sense, which we must have before we can judge of it in our understanding: So we are not able to conceive of spiritual beings in the purity of their own nature, without such a temperament, and such shadows to usher them into our minds. And therefore we find the Spirit of God accommodates himself to our contracted and teddered capacities, and uses such expressions of God, as are suited to us in this state of flesh wherein we are: And therefore because we cannot apprehend God in the simplicity of his own Being, and his undivided essence, he draws the representations of Himself from several Creatures and several actions of those creatures: As sometimes he is said to be angry, to walk, to sit, to fly; not that we should rest in such conceptions of Him, but take our rise from this foundation, and such perfections in the creatures, to mount up to a knowledge of God’s nature by those several steps, and conceive of him by those divided excellencies, because we cannot conceive of him in the purity of his own essence. We cannot possibly think or speak of God, unless we transfer the names of created perfections to Him; yet we are to conceive of them in a higher manner when we apply them to the Divine Nature, than when we consider them in the several creatures formally, exceeding those perfections and excellencies which are in the creature, and in a more excellent manner: as one says, “Though we cannot comprehend God without the help of such resemblances, yet we may without making an image of Him; so that inability of ours excuses those apprehensions of Him from any way offending against his Divine Nature.” These are not notions so much suited to the nature of God as the weakness of man: They are helps to our meditations, but ought not to be formal conceptions of Him. We may assist ourselves in our apprehensions of Him, by considering the subtilty and spirituality of air; and considering the members of a body, without thinking him to be air, or to have any corporeal member. Our reason tells us, that whatsoever is a body, is limited and bounded; and the notion of infiniteness and bodiliness, cannot agree and consist together: And therefore what is offered by our fancy should be purified by our reason.</p></blockquote>

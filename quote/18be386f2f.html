<blockquote><p>Yea the fallible church may determine infallible points. This is a principle that Libertines proceed upon, that men who are not infallible may err, and therefore can hold forth to others no infallible truth, which is most false, for prophets and apostles, Nathan, Samuel, David, Peter, being deserted of the immediately inspiring Spirit, did err, as well as the Church and pastors now deserted of the ordinary Spirit can and do err. For ‘all men’, prophets and apostles, ‘are liars’, Rom. 3, yet they may and do carry infallible truth to others; a blind man may hold a candle to others.

3. By this reason [of the Libertines] pastors can preach nothing certain in fundamentals [which is absurd], though faith come by hearing and faith is of a certain and determinate fixed truth of God, more permanent than heaven or earth; Why? because by this reason pastors in preaching fundamentals are not infallible.

4. Nor is this a good reason: It is believed the Church may err in synods, ergo [therefore], it does err and determines nothing that is infallible and certain in synods; no more than this is a good consequence: David may sin in praying, ergo, he does sin in praying: a potentia ad actum non valet consequentia [a consequence from potential to an act is not valid].</p></blockquote>

<blockquote><p>We see then how that the tithes which were contained in the law were especially for the people of Israel. And yet notwithstanding the tithes were very common amongst the Heathen, even for kings, princes and noblemen. We see likewise by profane histories, that they were also exacted, and that in some countries they exacted more than in other some… But be as be may, this word ‘Tithe’, or ‘Tenth’, has been a common and ordinary amongst all nations. And all Princes and great men as I have already said, sithens [since] the Gospel was received, have bestowed part of the tithes towards the maintenance of the Ministers of the word, as is very great reason, according to the saying of Saint Paul, “That they which ministered at the Altar in the old Testament were maintained, that they which at this day sacrifice unto God after a more excellent manner,” (1 Cor. 9:9-13) that is, which win souls unto Him, to make of them sacrifices unto his majesty, that they should also be as well provided for and maintained: and although God has not qualified how nor by what manner of revenue they should be maintained, yet is there a law for it. Now then, sith [since] God has been known through the preaching of the Gospel, a Christian order and law has been made for the giving and bestowing of one part of tithes [as opposed to other uses, such as giving to the poor, etc.]. And herein we may see the deceit of the Pope and of his shavelings [def: contemptuous epithet for a tonsured ecclesiastic, i.e. monk]: for, when they handle the law of tithes in their Canons, they take it as if it were transferred to them after that Jesus Christ had put an end unto the priesthood of Levi. All these are very leasings [lies], falsifying the holy scripture, and wickedly corrupting the same. For we see to the contrary, as has been before showed, that it is long ago sithence [since], that it was not known what the paying of tithes was by virtue of the law of Moses, and they were always paid either to the Emperor, or to some other particular great men. But now sith [since] the thing has been so ordained (so therein be no abuse, and to make men believe contrary to all truth, that it came from the holy scripture: but to be taken for a politic law). Let us hold that rule which Saint Paul sets down: to wit, “That we must not [muzzle] the mouth of the ox when he travels to feed us”: and therefore it stands with a far greater reason, that they which preach the doctrine of the gospel, ordained in so excellent an estate, should not be abridged and deprived of their maintenance, but be very well waged. Now as I have already said, when tithes and such like are bestowed unto a good use: we must not so straightly look into the matter, as to ask the cause of why it is so, as many fantastical fellows will, who at this day could be contented to turn the whole world upside down saying, O, it is no time now to pay tithes, for seeing the thing has been so long abused, it is no reason it should any longer continue. Then must we by their laying scrape out all: for they think that Christianity consists in changing the color of the sun and the moon. But if there be anything that is to be amended, as I have said, as if the Papists have brought in any false opinion, let that be utterly abolished. But in the meanwhile, let us hold unto all good ordinance: to wit, let the tithes and all such things that are for the maintenance of the poor, and the Ministers: let these things be reduced to their lawful use, and let not unsatiable wide gullets devour all. Let them not consume them upon their superfluities, in pomps, drunkeness, and other dissolutions: but let them know, that these are holy goods, which ought to be reserved for the use of the Church, as well for the maintenance of the poor as I have already said, as also for the feeding of those which serve God and his people.</p></blockquote>

</figure><figure class="quote" id="q-39eac37d0e" data-kw="">
<blockquote><p>That he [Paul] did not propose this his practice [of not receiving money from the Christians in Ephesus in Acts 20:33-35] as a precept or precedent law or rule to all ministers, for he had not power to deprive them of what God had given them (Lev. 27:32; Mt. 10:10; Lk. 11:42; Prov. 3:9,10; Mal. 3:9,10). Tithes were paid by Abraham to Melchisedeck long before the Levitical Law: So that there must be a moral equity in this reciprocal duty both before the Law, under the Law, and after the Law under the Gospel. And though Paul did thus in a juncture and case of necessity because of their present poverty (had they been able, more shame would it have been to them to let him labor) and because false teachers were watching all advantages against him, yet does he himself often assert his own privilege (1 Cor. 9:14; Gal. 6:6) and Christ’s words (he urges) might be collected out of Lk. 6:38 and 16:9, etc. yea, the very terms might be spoken by Christ, for all He spake is not writ (Jn. 20:30).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That he [Paul] did not propose this his practice [of not receiving money from the Christians in Ephesus in Acts 20:33-35] as a precept or precedent law or rule to all ministers, for he had not power to deprive them of what God had given them (Lev. 27:32; Mt. 10:10; Lk. 11:42; Prov. 3:9,10; Mal. 3:9,10). Tithes were paid by Abraham to Melchisedeck long before the Levitical Law: So that there must be a moral equity in this reciprocal duty both before the Law, under the Law, and after the Law under the Gospel. And though Paul did thus in a juncture and case of necessity because of their present poverty (had they been able, more shame would it have been to them to let him labor) and because false teachers were watching all advantages against him, yet does he himself often assert his own privilege (1 Cor. 9:14; Gal. 6:6) and Christ’s words (he urges) might be collected out of Lk. 6:38 and 16:9, etc. yea, the very terms might be spoken by Christ, for all He spake is not writ (Jn. 20:30).”

<blockquote><p>Their [the Independents’] second objection is this, say they, the Holy Ghost says expressly that they did meet all ‘at one place’ [Acts 2:1]… and that the whole mutlitude did come ‘together’, as for instance, Acts 2:1, it is said, ‘They were all with one accord in one place’, and in the same chapter, verse 46, ‘They continuing daily with one accord in the Temple, etc.’ And it is also said, Acts 6:2, ‘then the twelve called the multitude of disciples unto them, etc.’ And verse 5, ‘And the saying pleased the whole multitude.’ Now to take off this exception which seems to be the most plausible of their objections: First consider what we spoke from the Scripture of their number, and what thousands were in this Church: and let any reasonable man conceive how it could be possible that all those should meet in one place; and therefore that meeting in one place must be taken in another sense: It’s observed by the learned that the word here turned, ‘meeting together in one place’, epi to auto [Acts 2:1] does not always signify a meeting together in one room, but the agreeing of the affection and judgment in one thing: And for the clearing of this they cite Acts 4:25-26, ‘Why did the heathen rage, and the people imagine vain things? The kings of the earth stood up, and the rulers were gathered together against the Lord, etc.’ Now it is the same word that is there turned, ‘in one place,’ which is here turned, ‘gathered together’, and certainly no place of Scripture will prove that Herod, Pontius Pilate, Jew and Gentile did meet in one place to consult about the death of Christ, but only they agreed in one judgment and hearty affection about it… …[Acts 2] verse 46, ‘They continuing daily with one accord in the Temple.’… it is only mentioned [that] they came to the Temple to hear the Word, but not that they were all of one congregation, partaking of all ordinances in one place; for it is said afterwards, ‘They break bread from house to house’, meaning the sacrament of the Lord’s Supper, which they did partake of from house to house in their particular congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors Toleration, Erastianism</cite>, Toleration, Erastianism, Independency &amp; Separtation, Delivered in Sermons on 1 Jn. 4:1, (1652), section 4, pp. 156-58</span></figcaption>

<blockquote><p>…for if we speak of a constant rule, as now we must do, when apostles are removed, if the Church of believers be a visible Church, having the Keys and using them, even to admit officers [as in Congregationalism], and to excommunicate them, they: 1. Dispense censures and govern, who have no call to carry on censures and government, by preaching the Word, or exhorting and praying, for there are no officers as yet, etc.</p></blockquote>

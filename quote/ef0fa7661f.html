<main class="wrap"><figure class="quote" id="q-ef0fa7661f" data-kw="">
<blockquote><p>2. The civil corporation may: [1.] limit the major [an official] in regard of time, for a year and no longer; 2. they may make him half a tyrant, a dictator and absolute, or give him less power, that he shall rule none but with the consent of 12 assessors; but the people may not make him a pastor for a year and then lay him aside for no fault as a major is unofficed; nor may they limit him so as he shall not preach in season and out of season but by the consent of 12 men. 3. The corporation may erect itself in a kingdom or commonwealth and may create consuls, dictators, praetors, tribunos plebis, etc. as may most serve for the safety and peace of this State; but the Church may bring in no new officers but those appointed by Christ; nor may they alter the government, and metamorphose it into another than that which is according to the pattern showed in the mount.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Thomas Hooker</cite>, p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-765006402a" data-kw="">
<blockquote><p>XXVII. Self-interest, self-Government and family-government are all antecedent to publick government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation… (London: 1684), ch. 4</cite>, p. 26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-2e5d8328ba" data-kw="">
<blockquote><p>It [magistracy] is an ordinance of men, not effectively, as if it were an invention and a dream of men; but subjectively, because exercised by man. Objectively, and [Greek, telikos], for the good of men, and for the external man’s peace and safety especially; whereas church -officers are for the spiritual good of men’s souls. And Durandus says well (Book on the Origin of Right), “Civil power according to its institution is of God, and according to its acquisition and way of use is of man.” And we may thus far call the forms of magistrates ‘a human ordinance’ [2 Pet. 2]—that some magistrates are ordained to care for men’s lives and matters criminal, of life and death, and some for men’s lands and estates; some for commodities by sea, and some by land; and are thus called magistrates according to these determinations or human ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex (Edinburgh: Ogle &amp; Boyd, 1843)</cite>, p. 6 (lt col top)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-a9c679b4da" data-kw="">

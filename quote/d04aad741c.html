<main class="wrap"><figure class="quote" id="q-d04aad741c" data-kw="">
<blockquote><p>At length, it was attempted by the horrible blasphemies of Michael Servetus, not a man, but a monster of all wickedness, in reference to the adorable mystery of the holy Trinity. This most abandoned man, although often warned, did not cease disgorging the most pestiferous poison among the common people, which he had already scattered for many years in the celebrated places of Europe. At length being thrown into prison and persevering in his diabolical obstinacy, he suffered the most just punishment of execrable impiety in the year 1553.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, p. xxxv.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-939396c332" data-kw="Infallibility of the church">
<blockquote><p>When they deny that the Church can err, their end and meaning are to this effect: Since the Church is governed by the Spirit of God, she can walk safely without the word; in whatever direction she moves, she cannot think or speak anything but the truth, and hence, if she determines anything without or beside the word of God, it must be regarded in no other light than if it were a divine oracle. If we grant the first point--viz. that the Church cannot err in things necessary to salvation--our meaning is, that she cannot err, because she has altogether discarded her own wisdom, and submits to the teaching of the Holy Spirit through the word of God. Here then is the difference. They place the authority of the Church without the word of God; we annex it to the word, and allow it not to be separated from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><figure class="quote" id="q-07e9f8db5b" data-kw="">
<blockquote><p>The Mormon degradation and defamation of the notion of God marks it as no development of Christianity, but a most foul and blasphemous apostasy. … Christianity teaches that man was created by God. It teaches the doctrine of ex nihilo creation. Mormonism teaches the eternity of matter, and regards the souls of men as a part of that eternal matter. Christianity teaches that mankind fell in Adam, our ancestral head, from an estate of holiness. Mormonism teaches that souls in an imperfect state were embodied as a necessary stage in their progress toward perfection. Christianity teaches the moral helplessness of man and the need of divine grace in order to salvation. Mormonism teaches that man can do everything necessary to salvation once the eldest son of the Michael, who became Adam, has died in the race’s behalf. Mormonism looks forward to a heaven of sensuality much like that of Mohammed. Christianity looks forward to a heaven in which fleshly appetites have no scope. Mormonism is no development of Christianity. It is another gospel than that which Paul preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cary-johnson.html">Thomas Cary Johnson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mormonism in Presbyterian Quarterly</cite></span></figcaption>

</figure><figure class="quote" id="q-e792054384" data-kw="">
<blockquote><p>How vast the fellowship! With the saints of all ages in the past! With the saints of all ages in the future! With the church eternal in glory! How comforting! We are not alone in our work, in our trials, in our hopes! Millions uncounted have been working for us, praying for us, rejoicing over us! Millions uncounted of hearts are now beating in unison with ours! Millions uncounted are to follow us, for whom we are even now transmitting the riches of grace.</p></blockquote>

</figure><figure class="quote" id="q-c66ef8314d" data-kw="">
<blockquote><p>As another, though a merely supplementary argument, it may be stated, that, just as all the texts of scripture which bear upon the spiritual independence of the Church have a direct application to this subject also, so all the texts that have been cited in support of Non-intrusion may be adduced with equal propriety as irreconcilable with Patronage, even in its most restricted form. Had it been intended in the Church that such a high and responsible power as is implied in the nomination of a minister should be lodged in a peculiar class of the members of the Church, we should certainly have expected to find some directions specially addressed to them, to guide them in the exercise of it. And the fact that we find no such directions, affords at least a presumption that it was not designed they should possess the power. The presumption becomes stronger, and amounts almost to certainty, when we actually find in the Bible such directions addressed, not indeed to a select few, but to the whole body of the disciples.

There is a strong implied argument against any system of nomination, and much more against Patronage, contained in the exhortation, “Beloved, believe not every spirit, but try the spirits whether they be of God;” or in the following, “Beware of false prophets.” The mere fact, indeed, that every exhortation on such a subject is addressed to the whole body of believers, implies that they were all to be possessed of equal privileges, in the matter of a Minister’s settlement. They are spoken to as occupying the same ground, as having the same standing in the Church, and possessing an equal voice in the trial of the spirits. They are enjoined to the discharge of a solemn duty, in a matter in which all have an equal interest; and it is manifestly anti scriptural that an equality, either of right or of obligation, should be created, where it was plainly intended none such should exist.

Besides, from the connexion in which the above passages stand, and the declared purpose for which such injunctions were given to the disciples, it is sufficiently clear that the ordinance of Christ for keeping false prophets out of the Church, is by giving the trial of them to the body of disciples, on whom this duty and responsibility is laid. It is common enough to hear a great deal said about the unfitness of the Christian people, on the one hand, to choose their own ministers, and on the other, about the obvious advantage likely to result from the nomination being lodged in the hands of those who are of superior rank and learning, and the remedy which the Church courts have in their own hands against any possible evil, by a more rigid examination and trial.

Now, without attempting to deny that a godly and intelligent Patron, and a faithful Presbytery, may do much to keep out of the Church wolves in sheep’s clothing, it would be well at the same time to remember, that the great check suggested by Him who is the fountain of all wisdom, is the trial by the disciples. Where this is restrained from its full and free exercise, or altogether prevented, the barrier which Christ has thrown around his flock is impaired or destroyed, and we cannot expect that they shall be kept safe in any other way. By devices of mere human wisdom the Church was never yet defended or prospered, and the only security we have, is to follow implicitly the counsels of the Great Shepherd. He has given it in charge to His people to try the spirits, to guard against false prophets, and it becomes us to beware how, in the smallest degree, we interfere with the divine arrangement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

in+a+matter+in+which+all+have+an+equal+interest%3B+and+it+is+manifestly+anti+scriptural+that+an+equality%2C+either+of+right+or+of+obligation%2C+should+be+created%2C+where+it+was+plainly+intended+none+such+should+exist.%0A%0ABesides%2C+from+the+connexion+in+which+the+above+passages+stand%2C+and+the+declared+purpose+for+which+such+injunctions+were+given+to+the+disciples%2C+it+is+sufficiently+clear+that+the+ordinance+of+Christ+for+keeping+false+prophets+out+of+the+Church%2C+is+by+giving+the+trial+of+them+to+the+body+of+disciples%2C+on+whom+this+duty+and+responsibility+is+laid.+It+is+common+enough+to+hear+a+great+deal+said+about+the+unfitness+of+the+Christian+people%2C+on+the+one+hand%2C+to+choose+their+own+ministers%2C+and+on+the+other%2C+about+the+obvious+advantage+likely+to+result+from+the+nomination+being+lodged+in+the+hands+of+those+who+are+of+superior+rank+and+learning%2C+and+the+remedy+which+the+Church+courts+have+in+their+own+hands+against+any+possible+evil%2C+by+a+more+rigid+examination+and+trial.%0A%0ANow%2C+without+attempting+to+deny+that+a+godly+and+intelligent+Patron%2C+and+a+faithful+Presbytery%2C+may+do+much+to+keep+out+of+the+Church+wolves+in+sheep%E2%80%99s+clothing%2C+it+would+be+well+at+the+same+time+to+remember%2C+that+the+great+check+suggested+by+Him+who+is+the+fountain+of+all+wisdom%2C+is+the+trial+by+the+disciples.+Where+this+is+restrained+from+its+full+and+free+exercise%2C+or+altogether+prevented%2C+the+barrier+which+Christ+has+thrown+around+his+flock+is+impaired+or+destroyed%2C+and+we+cannot+expect+that+they+shall+be+kept+safe+in+any+other+way.+By+devices+of+mere+human+wisdom+the+Church+was+never+yet+defended+or+prospered%2C+and+the+only+security+we+have%2C+is+to+follow+implicitly+the+counsels+of+the+Great+Shepherd.+He+has+given+it+in+charge+to+His+people+to+try+the+spirits%2C+to+guard+against+false+prophets%2C+and+it+becomes+us+to+beware+how%2C+in+the+smallest+degree%2C+we+interfere+with+the+divine+arrangement.%E2%80%9D%0A%0A%E2%80%94+William+W

<main class="wrap"><figure class="quote" id="q-7540fcb622" data-kw="">
<blockquote><p>…if [1 Cor. 11:2 speaks] of indifferent ceremonies, it is still farther from touching us. For these may be changed, provided only the reason and end be preserved; nor are they necessary, as is plain from the place before us. For the apostle speaks of that modesty which women ought to observe in the congregation, and of that decency also which is required in men when they frequent religious meetings and assemblies. He desires men to pray with uncovered, women with covered heads: which injunctions are not of a perpetual obligation; for they are not now observed even by the papists themselves, so as to make it plain that all churches are not bound to the same ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, (1588; Cambridge: Parker Society, 1849), p. 549</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>[Durell:] ‘In all Reformed churches men use to enter into the places of public worship with their hats off.’ This is a most notorious — nothing being more usual in some Reformed churches than to pass through and through the places of worship, never stirring their hats: But if he would have the saying understood of men’s putting off their hats when they enter into the place of public worship, whilst the congregation is worshipping, then must this speech be placed where it is already placed, among the gentleman’s impertinencies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus vapulans</cite>, [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662., pp. 82-83</span></figcaption>

</figure><figure class="quote" id="q-09959d9512" data-kw="">
<blockquote><p>V. 3. But I] a new precept or renewed by the apostle, concerning common civility for habit [wearing of garments] namely that women in public assemblies of the church should be covered, and men should have their heads uncovered by reason that in those places and times, the covered head was sign of subjection and an uncovered head contrary wise of liberty; and command wherefore that they might keep in the church that degree amongst sexes which God had established, they were to observe such signs and marks thereof as were used by the common consent of nations. See Gen. 20:16 and 24:65… … V. 10. To have power] as who should say to go forth in public in a modest and civil manner for this necessity of women’s covering the head took place but only out of doors, and not within doors. And if they went abroad without a vail they were reputed as debauched women, like run away servants or soldiers that have not their master’s or captain’s pass…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-diodati.html">John Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pious Annotations upon the Holy Bible</cite>, ... (1643), on 1 Cor. 11</span></figcaption>

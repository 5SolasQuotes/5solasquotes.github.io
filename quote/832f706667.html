<main class="wrap"><figure class="quote" id="q-832f706667" data-kw="">
<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: … 140. This has been lately practiced in London among some of the Sectaries, that love-feasts, or feasts of love (with which the Lord’s Supper is to be administered also) is a perpetual ordinance of Christ, at which only Church-members are to be present, and to partake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna</cite>, (London, 1646), pp. 15, 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>…but the imposing of synods is conditional, not absolute as Libertines suppose [of the presbyterians]; for after synods impose, if believers after trying and due examining, shall find that truly and really the decrees are beside or contrary to the word of truth, the imposing neither is a just imposing, nor any imposing at all. For neither prophet, nor apostle, nor angel from heaven [Gal. 1:8], nor Church can lay commands upon men imposing or binding under pain of censures to that which is unsound and false or unjust or wicked; and if people shall find their decrees truly to be so after trial, they have power to reject them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, p. 41</span></figcaption>

<blockquote><p>I respond: It was a common rite, in species and form, from custom or practice then and there received; it was accustomed to be used as a sign of love, friendship, familiarity, even of subjection, etc. On this rite: the Philology &amp; Antiquary of [John de] Pineda [1558–1637, a Jesuit] on Job 31:27 has informed. Out of theologians other than Pineda: Aretius, pt. 3, [Jean de] Lorinus [1559-1634, a Jesuit] and [Andrew] Rivet on Ps. 2; and Lorinus in the same has cited Joseph Stephanus in the Tractate on Kissing the Feet of the Pontiff.”, p. 466 Gyongyosi, Paul – Kisses of Love &amp; Hate, on Song 1:2 &amp; 6:3 &amp; Prov. 27:6; a Dissertation on the Holy Kiss (Rom. 16:17) &amp; its Opposite, the Kiss of Jude (Lk. 22:48) &amp; of the Mysteries of them Illustrated by the Sacred Scriptures, by Christ the Lord of Love, Grace &amp; Eternal Wrath… (Frankfurt, 1738) 18 pp. Gyongyosi (1668-1743) was a German reformed professor of theology at Frankfurt, Germany. . Lutheran Willemer, Johann Helvicus – Out of the Words of Ps. 2:12, ‘Kiss the Son’, Against Some of the Borne Distortions of the Jews (Wittenburg, 1704) 35 pp. Mayer, Johann Friedrich – A Tract on Kissing the Feet of the Roman Pointiff 2nd ed. (Leipzig, 1714) Mayer (1650-1712) was a German, Lutheran professor of theology at Wittenberg, Kiel and Greifswald. . . On Foot Washing &amp; Shaking the Dust Off of One’s Feet Bible Verses Dust of the Feet Isa. 49:23 “And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with their face toward the earth, and lick up the dust of thy feet;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, Section 2, ‘We come now to the rite of the kiss (Rom. 16:16; 1 Cor. 16:20; 2 Cor. 13:12; 1 Thess. 5:26; 1 Pet. 5:14), of which it is queried, whether it may be a mystical or sacred rite, and have been by divine law imposed?’ in ch. 8. ‘Questions on Some Rituals in Particular…’ in Ecclesiastical Politics, vol. 1 (Amsterdam, 1663-1676), Pt 1, Bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’, ch. 1, ‘Of Formularies, or Liturgies’, pp. 466-471</span></figcaption>

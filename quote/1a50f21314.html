<main class="wrap"><figure class="quote" id="q-1a50f21314" data-kw="">
<blockquote><p>God’s manner is to suffer a great deal of sin to remain in his people here: he could if it pleased him purge it out all at once, but he suffers it to be otherwise, for many great ends; as to magnify his power in preserving the seed of grace, notwithstanding all that opposition which is made by Satan and their own corruption, so to carry on the work of sanctification in such a manner as that they shall stand in continual need of justification and pardon, and among other ends this is not the least to try the faith of his people, and exercise that: there be none of the people of God but are attended with a great deal of sin: so was Noah, Jacob, Asa, Jehoshaphat, and Paul, Rom. 7.23 I see another law in my members, warring against the law of my mind, and bringing me into captivity to the law of sin that is in my members: and that shews that God can love those that have a great deal of sin in them, and that he can pardon them, his suffering of it to be in his own, evidences the sufficiency of grace to pardon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The safety of appearing at the day of judgement, in the righteousness of Christ: opened and applied</cite>, (Boston MA: Samuel Phillips, 1687), p. 323.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa0c0168f5" data-kw="">
<blockquote><p>It is asked, moreover, whether or not we seek forgiveness of sins—that is, the first aspect of justification—from God on a daily basis? And if so, how can we say that justification is completed once and for all in this life? I respond that when we pray for the remission of sins, we are not praying for that benefit as if it were not already given to us. Rather, we are praying for the increase of our faith, and for the application of that benefit which is ours through faith and faith’s increase.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-9a507d44d8" data-kw="">
<blockquote><p>If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-12c8948707" data-kw="">
<blockquote><p>I remember that Staupitz used to say: “More than a thousand times I have vowed to God that I would improve, but I have never performed what I have vowed. Hereafter I shall not make such vows, because I know perfectly well that I shall not live up to them. Unless God is gracious and merciful to me for the sake of Christ and grants me a blessed final hour when the time comes for me to depart this miserable life, I shall not be able to stand before Him with all my vows and good works.” This despair is not only truthful but is godly and holy. Whoever wants to be saved must make this confession with his mouth and with his heart. The saints do not rely on their own righteousness; they sing with David (Ps. 143:2): “Enter not into judgment with Thy servant, for no man living is justified before Thee”; and (Ps. 130:3): “If Thou, O Lord, shouldst mark iniquities, Lord, who could stand?” Therefore they gaze at Christ, their Propitiator, who gave His life for their sins. And if there is any remnant of sin their flesh, they know that this is not imputed to them but is pardoned by forgiveness. Meanwhile they battle by the Spirit against the flesh. This does not mean that they do not feel its desires at all; it means that they do not gratify them. Even though they feel their flesh raging and rebelling against the Spirit and feel themselves falling into sins and living in them, they do not become downcast on that account or immediately suppose that their way of life, their social station, and the works they have done in accordance with their calling are displeasing to God. No, they fortify themselves with their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 27: Lectures on Galatians, 1535, Chapters 5-6; 1519, Chapters 1-6, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 27 (Saint Louis: Concordia Publishing House, 1999), 73–74.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-fc723ab2ff" data-kw="">
<blockquote><p>But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 30, on Lk. 7:47, p. 268</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<main class="wrap"><figure class="quote" id="q-6fafdf9a87" data-kw="">
<blockquote><p>Why is the redemption or reconciliation of humanity with God presented to us in the form of a covenant, indeed a covenant of grace? A: God compares the means of our salvation to a covenant, indeed an eternal covenant, so that we might be certain and assured that a lasting, eternal peace and friendship between God and us has been made through the sacrifice of His son. After a bitter quarrel, the disputants have peace of mind first and foremost when they commit and bind themselves to each other with a promise and sworn oath that on such-and-such a matter they want peace. God acts in the same way toward us: in order that we might have rest and peace in our consciences, God was willing out of His great goodness and grace, to bind himself to us, His enemies, with His promise and His oath. He promised that He would have his only begotten Son become human and die for us, and that through the sacrifice of his Son He would establish a lasting reconciliation and eternal peace….He would be our God and bless us, that is, forgive our sins and impart to us the Holy Spirit and eternal life—and all this without any merit on our part. All we would have to do is accept the Son—promised and sent—by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation: An Aid to Interpreting the Heidelberg Catechism</cite>, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>There is in God a universal or common love by which he is inclined to do good to every creature, and so then also to man (Ps. 36:6; 1 Tim. 4:10), by external and common benefits (Ps. 17:14), and there is also a special, saving love by which he dispenses the benefits that accompany salvation, which have an unbreakable connection with salvation (Heb. 6:9).</p></blockquote>

</figure><figure class="quote" id="q-150a6f8afd" data-kw="">
<blockquote><p>The nature and use of the law (which goes before the covenant of grace) having been unfolded, we must now treat of the covenant itself. Since it is of the greatest importance in theology (being as it were the center and bond of all religion, consisting in the communion of God with man and embracing in its compass all the benefits of God towards man and his duties towards God), our highest interest lies in rightly knowing and observing it. Hence the discussion of it demands peculiar accuracy (akribeian), that the truth may be confirmed against the errors by which Satan has endeavored in almost every age to obscure and corrupt this saving doctrine.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

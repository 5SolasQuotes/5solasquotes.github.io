<blockquote><p>For it is impossible for those who were once enlightened, and have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come, If they shall fall away, to renew them again unto repentance</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d58b909713" data-kw="">
<blockquote><p>Goodness is the very opposite of harshness, cruelty, gruffness, severity, mercilessness–all of which are far removed from God. How unbecoming it is to have such thoughts about God! Such sinful emotions are found in man. The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17) . In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout (Soli Deo Gloria, 1992), 1:122-23</span></figcaption>

<blockquote><p>And accordingly we distinguish of the effects of God’s love in respect whereof He is said to love his creature. For they may be considered either in respect of life temporal, or of life spiritual, or of life eternal. The first effects of love, as touching life temporal, God communicates to all that have life; thus He is said to save both man and beast, and the eyes of all are said to wait upon Him; He hears the cry of ravens; the sparrows fall not to the ground without the providence divine; The very lions roaring after their prey, do seek their meat at [from] God. Thus He may be said to be as the Savior, so the lover of all men; but especially of them that believe, to wit, both in respect of the comforts of life spiritual, and the joys of life eternal which He affords unto them…</p></blockquote>

<blockquote><p>Q. What difference is there betwixt the combat which is to be found in the temporary [believer], and that which is proper to the regenerate? A. Besides the remainders of God’s image, the temporary believer is endued with the common graces of the Spirit, for substance not counterfeit, though ineffectual to sanctification. He is illightened with the knowledge of divine mysteries grounded upon the Scripture, which is not altogether idle and ineffectual: He is drawn to believe in some sort and with confidence to receive the Word of the Kingdom both as true and good. He may reform himself in such sort, that it may be said Satan is cast out of him: and all this not in hypocrisy or for fear of punishment, but freely and according to the Word of grace, whereby he is moved to affect things that are above. From whence follows a combat in him far greater and of another nature than that betwixt reason and appetite, conscience and affection, or the relics of God’s image with the power of sin; even of the common graces of the Spirit with the power of corruption repressed, not mortified or killed. But the graces of the Spirit are not soundly planted, the Word of the Kingdom is not kindly received into the heart so as to rule with universal sovereignty, and to season throughout the powers of the soul. Temporary Christians make some account of God’s favor and the joys of heaven in an inferior place: but their desire of happiness is subordinate to the things of this world; in particular estimation, which is joined with choice of heart, they prefer their special delights before Christ, and will rather leave Him than leave the world, if the one of necessity must be parted with. Wherefore the will of the best unregenerate man, is still in captivity under the dominion of sin, and his heart of an earthly temper, though it be somewhat changed by the superficial receipt of the Word of Life, which it tastes, but digests not. In which respect the motions of the unregenerate in the ways of godliness may be said to be dead and accidental; because the soul is not enlivened by the Spirit of grace: but the motion of the regenerate is lively and natural, proceeding from the Spirit of grace that dwells in them, whereby they are quickened in the inner man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Power of Godliness both Doctrinally &amp; Practically handled</cite>, … (London: Miller, 1657), ch. 3, p. 299</span></figcaption>

— John Ball, The Power of Godliness both Doctrinally &amp; Practically handled… (London: Miller, 1657), ch. 3, p. 299">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+What+difference+is+there+betwixt+the+combat+which+is+to+be+found+in+the+temporary+%5Bbeliever%5D%2C+and+that+which+is+proper+to+the+regenerate%3F+A.+Besides+the+remainders+of+God%E2%80%99s+image%2C+the+temporary+believer+is+endued+with+the+common+graces+of+the+Spirit%2C+for+substance+not+counterfeit%2C+though+ineffectual+to+sanctification.+He+is+illightened+with+the+knowledge+of+divine+mysteries+grounded+upon+the+Scripture%2C+which+is+not+altogether+idle+and+ineffectual%3A+He+is+drawn+to+believe+in+some+sort+and+with+confidence+to+receive+the+Word+of+the+Kingdom+both+as+true+and+good.+He+may+reform+himself+in+such+sort%2C+that+it+may+be+said+Satan+is+cast+out+of+him%3A+and+all+this+not+in+hypocrisy+or+for+fear+of+punishment%2C+but+freely+and+according+to+the+Word+of+grace%2C+whereby+he+is+moved+to+affect+things+that+are+above.+From+whence+follows+a+combat+in+him+far+greater+and+of+another+nature+than+that+betwixt+reason+and+appetite%2C+conscience+and+affection%2C+or+the+relics+of+God%E2%80%99s+image+with+the+power+of+sin%3B+even+of+the+common+graces+of+the+Spirit+with+the+power+of+corruption+repressed%2C+not+mortified+or+killed.+But+the+graces+of+the+Spirit+are+not+soundly+planted%2C+the+Word+of+the+Kingdom+is+not+kindly+received+into+the+heart+so+as+to+rule+with+universal+sovereignty%2C+and+to+season+throughout+the+powers+of+the+soul.+Temporary+Christians+make+some+account+of+God%E2%80%99s+favor+and+the+joys+of+heaven+in+an+inferior+place%3A+but+their+desire+of+happiness+is+subordinate+to+the+things+of+this+world%3B+in+particular+estimation%2C+which+is+joined+with+choice+of+heart%2C+they+prefer+their+special+delights+before+Christ%2C+and+will+rather+leave+Him+than+leave+the+world%2C+if+the+one+of+necessity+must+be+parted+with.+Wherefore+the+will+of+the+best+unregenerate+ <blockquote><p>Had not Christ interposed to satisfy the justice of God, man upon his sin had been actually bound over to punishment, as well as the fallen angels were upon theirs, and been fettered in chains as strong as those spirits feel. The reason why man was not hurled into the same deplorable condition upon his sin, as they were, is Christ’s promise of taking our nature, and not theirs. Had God designed Christ’s taking their nature, the same patience had been exercised towards them, and the same offers would have been made to them, as are made to us. In regard of the fruits of his patience, Christ is said to buy the wickedest apostates from him: 2 Peter 2:1, ‘Denying the Lord that bought them;’ such were bought by Him as ‘bring upon themselves just destruction, and whose damnation slumbers not,’ ver. 3; He purchased the continuance of their lives, and the stay of their execution, that offers of grace might be made to them.</p></blockquote>

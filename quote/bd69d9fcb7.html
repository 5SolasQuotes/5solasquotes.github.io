</figure><figure class="quote" id="q-3820906d0c" data-kw="">
<blockquote><p>The doctrine hence arising is this, that so long as we labor to keep the substance of God’s worship, though we fail in some circumstances thereof, He will be merciful to us. If we embrace the substance thereof willingly, and fail in the circumstances unwillingly, God will never lay it to out charge. Examples will prove this more fully unto us: ‘Ye have heard of the patience of God’ (says the apostle James) ‘and ye know what end God made with him.’ (James 5:11; Job 3)… there was in him a great deal of passion and distemper: and that he held out but very weakly in a great part of the conflict… yet because he held out in the substance of godliness, in the midst of all his woes and miseries… and in the end acknowledged his fault and desired to lay his hand upon his mouth: because (I say) these good things were found in him, God passes by his infirmities and takes notice of his patience, with high commendation thereof… For the Lord in his wisdom considered that it was not through any stubbornness, or rebellious disposition that he brake out in that manner…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, pp. 122-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The doctrine hence arising is this, that so long as we labor to keep the substance of God’s worship, though we fail in some circumstances thereof, He will be merciful to us. If we embrace the substance thereof willingly, and fail in the circumstances unwillingly, God will never lay it to out charge. Examples will prove this more fully unto us: ‘Ye have heard of the patience of God’ (says the apostle James) ‘and ye know what end God made with him.’ (James 5:11; Job 3)… there was in him a great deal of passion and distemper: and that he held out but very weakly in a great part of the conflict… yet because he held out in the substance of godliness, in the midst of all his woes and miseries… and in the end acknowledged his fault and desired to lay his hand upon his mouth: because (I say) these good things were found in him, God passes by his infirmities and takes notice of his patience, with high commendation thereof… For the Lord in his wisdom considered that it was not through any stubbornness, or rebellious disposition that he brake out in that manner…”

ce%20arising%20is%20this,he%20brake%20out%20in%20that%20manner&amp;text=The%20doctrine%20hence%20arising%20is%20this%2C%20that%20so&amp;text=disposition%20that%20he%20brake%20out%20in%20that%20manner" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-586297a35a" data-kw="">
<blockquote><p>Yea I dare not say that their [Anglican] by-offices, viz. baptism itself, notwithstanding their kind of godfathers and crossing, do frustrate the sacrament to the capable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, p. 227</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

— Richard Baxter, The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, p. 227">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYea+I+dare+not+say+that+their+%5BAnglican%5D+by-offices%2C+viz.+baptism+itself%2C+notwithstanding+their+kind+of+godfathers+and+crossing%2C+do+frustrate+the+sacrament+to+the+capable.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued+%281683%3B+London%3A+Parkhurst%2C+1689%29%2C+ch.+58%2C+%E2%80%98Whether+Communion+with+so+Faulty+a+Church+be+Lawful%E2%80%99%2C+p.+227&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F586297a35a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/586297a35a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Yea%20I%20dare%20not%20say%20that,frustrate%20the%20sacrament%20to%20the%20capable&amp;text=Yea%20I%20dare%20not%20say%20that%20their%20%5BAnglican&amp;text=crossing%2C%20do%20frustrate%20the%20sacrament%20to%20the%20capable" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-30fb86e05a" data-kw="">
<blockquote><p>Section 5. Note that things not determined of God [for public worship] and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous. A superior may not institute a superfluous thing that is not simply evil, though sometimes the inferior may lawfully obey therein; or to speak more properly, [the inferior may] lawfully do the thing to avoid inconvenience, or to testify respect to the superior, though in that particular he has no lawful power to command. Note also, that of things necessary in genere, the superior may not lawfully determine for such species, as, though not simply evil, may have a tendency to evil or be evil in the consequence, when he may determine that which will not be evil in the consequence. Yet the inferior may obey, or rather observe the thing commanded, when the evil consequence of non-observance will be greater than the evil consequence of observance. Section 6. If superiors command that which is above their sphere to command [for public worship], namely, things not necessary in genere [by its kind], yet if they be not simply evil, subjects may¹ do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be.² In this case it is not formal obedience,³ but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet</cite>, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Thomas Parkhurst, 1684), pt. 3 Corbet (d. 1680) was an English, congregationalist puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

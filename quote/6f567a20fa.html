<main class="wrap"><figure class="quote" id="q-6f567a20fa" data-kw="Sovereignty" data-pol="">
<blockquote><p>Here, speculative theologian, the discussion is not about the will of good pleasure, of which it is written, &#x27;Whatsoever the Lord pleased, that did he in heaven and in earth,&#x27; and that &#x27;no one can resist his will.&#x27; That is plain, because we see that not all men come to the knowledge of the truth. Rather, the discussion is about the will of sign, by which God sets before all men the precepts of salvation and the doctrine of the Gospel. It is charged against those who refuse to come to the knowledge of the truth and refuse to be saved, of which it is written, &#x27;How often would I have gathered thy children, and ye would not.&#x27;</p></blockquote><p class="mnote">Marginal note: “God wills all men to be saved by the will of sign, not by the will of good pleasure.”</p>
<figcaption>— <a href="../authors/thomas-de-vio-cajetan.html">Thomas de Vio Cajetan</a>, <cite>In omnes D. Pauli et aliorum Apostolorum Epistolas Commentarii</cite>, on 1 Tim. 2:4 (Opera omnia, vol. 5, p. 295, col. 1)</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/decree.html">The Decree</a><a class="tag" href="../topics/god/sovereignty.html">Sovereignty</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1db2bdaf10" data-kw="Author of sin|Permission" data-pol="">
<blockquote><p>The decree which is the cause of the futurition of sin is nevertheless neither its physical cause (by the infusion of evil) nor its ethical cause (by the approbation of it). So although sin necessarily follows the decree, it cannot be said to flow from the decree. The decree does not flow into the thing, nor is it effective of evil, but only permissive and directive.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 4.4.10</figcaption>

</figure><figure class="quote" id="q-9a59ff59bd" data-kw="Reprobation|Author of sin|Justice" data-pol="">

</figure><figure class="quote" id="q-90b2694bf6" data-kw="Sovereignty|Satan" data-pol="">
<blockquote><p>The Lord God omnipotent reigneth. His government is exercised over inanimate matter, over the brute beasts, over the children of men, over angels good and evil, and over Satan himself. No revolving world, no shining of star, no storm, no creature moves, no actions of men, no errands of angels, no deeds of Devil—nothing in all the vast universe can come to pass otherwise than God has eternally purposed. Here is a foundation of faith. Here is a resting place for the intellect. Here is an anchor for the soul, both sure and steadfast. It is not blind fate, unbridled evil, man or Devil, but the Lord Almighty who is ruling the world, ruling it according to His own good pleasure and for His own eternal glory.</p></blockquote>
<figcaption>— <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>The Sovereignty of God</cite>, ch. 3, “Sovereignty of God in Administration”</figcaption>

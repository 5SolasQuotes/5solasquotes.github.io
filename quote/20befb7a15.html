<main class="wrap"><figure class="quote" id="q-20befb7a15" data-kw="">
<blockquote><p>The actions performed by our royal Mediator flow from a double principle in this single Person, because this person does consist of two natures, and each nature performs its proper work; the divine nature does what is divine, and the human nature what is human; and therefore though the Person be but one, and the effect one, yet there are two different actions of two different natures united in one Person for producing of one and the same glorious effect, and we are to give to each nature what is properly due unto it. … Finally the Kingdom which is administered by our royal Mediator God-man, in a glorious way is but a dispensatory kingdom, not his natural kingdom, an inferior and temporary kingdom, not his sovereign, essential, eternal kingdom; and therefore even in the very administration of it our Mediator God-man, is in respect of order, and that gracious dispensation unto which He condescended for our salvation, employed in a kind of subordinate way… This dispensatory kingdom is administred principally by the Godhead, instrumentally by the manhood, absolutely and perfectly by the Person of Christ acting in a divine way as God, and human way as man, that the properties of each nature may be reserved as peculiar to each, even whilst He does mediate, reign and judge, according to both; and therefore divine honor is still reserved as proper and peculiar to the divine nature of our Mediator, who is God-man in one person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite>, … (London, 1650), pp. 347-9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-37fc0c2ee2" data-kw="">
<blockquote><p>3. Yet we must not imagine any such active power in God, which is a diverse thing from his essence.

4. For God in his own most simple essence is such, whatsoever He be: just, good, or almighty.

5. And although there be indeed but one only power in God: yet for the diverse respects wherein He is considered, it may be said (not impiously) to be manifold.

6. For it is one respect when it is considered as God works always in Himself in understanding, willing, loving: and another respect when we behold it as God has wrought outwardly or without himself in creating the world: and as He evermore works in governing the same: and as He could work innumerable things, if He would.

7. Therefore as the actions of God are not unfittly distinguished into abiding actions and passing: so the power of God may not unjustly be called twofold, one, wherein He ever from all eternity did work and does work in himself: the other, wherein He did not only make, rules, and works all things in time without Himself: but also can bring to pass infinite things, which He never will do.

8. Whereupon it is also that the same is usually divided into actual power, which works whatsoever He will: and into absolute power, whereby he can also do infinite things which He will not: because otherwise He could not be said to be simply omnipotent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, Of the Eternal Omnipotency of One True God, year 1575 in H. Zanchius his Confession of Christian Religion… (1599), pp. 377-78</span></figcaption>

<blockquote><p>V. Our sponsor (as stated) is Christ Jesus, the only-begotten Son of God and himself God blessed forever, according to both natures. The principle which [acts] is indeed his person; the principle by which [he acts] is his nature, both human and divine. Hence there was entirely a communion in the work, but a distinction of power and mode in the operating natures. The passion formally belonged to the human nature; its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. by AI by Onku (Utrecht, 1650) Latin</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b59e97c5ff" data-kw="">
<blockquote><p>It has been maintained that the [Westminster] Assembly formulated at least one section so as to allow for an Amyraldian doctrine of the atonement. The Minutes of the Assembly give no support to this contention. There are three principles enunciated in the [Westminster] Confession that exclude the Amyraldian view. The first is that redemption has been purchased for the elect. ‘The Lord Jesus, by His perfect obedience, and sacrifice of Himself… purchased, not only reconciliation, but an everlasting inheritance in the kingdom of heaven, for all those whom the Father hath given unto him’ (8:5). The second is that impetration and application are coextensive. ‘To all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same’ (8:8). This excludes any form of universal atonement. The redemption purchased includes, as the preceding quotation implies, the purchase of an everlasting inheritance, and this is therefore said to be communicated to all for whom redemption was purchased. If all were included then all would be the partakers of the everlasting inheritance in the kingdom of heaven, a position clearly denied in the Confession elsewhere. The third principle is the exclusiveness of redemption. ‘Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only’ (3:4). In the preceding sentence the elect are said to have been ‘redeemed by Christ’; now it is said that they alone are redeemed. Other lines of argument could be elicited from the Confession to show that it allowed for no form of universal atonement, not even the hypothetical universalism propounded on the floor of the Assembly. But the foregoing principles are sufficient to show that the particularism in terms of which the whole doctrine of salvation is constructed is not sacrificed at the point of the atonement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings of John Murray</cite>, (Edinburgh: Banner, 1982), vol. 4, pp. 255-256</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20247a2682" data-kw="">
<blockquote><p>What language, then, could affirm more explicitly than that here employed, that the atonement of Christ is specific and limited — that it is neither universal nor indefinite, but restricted to the elect, who shall be saved from wrath through him. The sacrifice of Christ derived infinite value from the dignity of his person; it must, therefore, have been intrinsically sufficient to expiate the sins of the whole human race had it been so intended; but, in the designation of the Father, and in the intention of Christ himself, it was limited to a definite number, who shall ultimately obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Journal of Reformed Theology</cite>, vol. 6, issue 1 (Jan., 2012), pp. 24-34 Ref | Abstract: “This paper defends the received account—that the Westminster Assembly maintained that all salvific actions of God are particular in intention—against a revisionist argument that it allowed that some salvific actions of God may be universal in intention.”</span></figcaption>

<blockquote><p>…the natural sense of the clause is clearly that no one of the transactions here brought together is to be affirmed of the non-elect. And this impression is increased by the broader context, not to speak of the parallel passages in 8.3 and 5. It might seem somewhat more to the point, possibly, to recall that in this section the language is so ordered as to seem to deal with the actual ordo salutis rather than directly with the ordo decretorum. It is asserted that the ordo salutis is the result of the decreeing of the means by which the elect are brought to glory. But what is subsequently asserted is that none but the elect are (actually) redeemed by Christ, effectually called, etc…</p></blockquote>

0called%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…For I am of no other mind than Prosper [in the early Church] was: Habet populus Dei plenitudinem suam, et quamvis magna pars hominum salvantis gratiam aut repellat aut negligat, in electis tamen et praescitis atque ab omni generalitate discretis, specialis quaedam censetur universitas, ut de toto mundo, totus mundus liberatus, et de omnibus hominibus, omnes homines videantur assumpti. [“The people of God possess their own fullness; and although a great part of mankind either rejects or neglects saving grace, yet in the elect and foreknown, and those distinguished from the whole generality [of mankind], there is reckoned a certain special universality, so that, from the whole world, the whole world may be said to have been liberated, and from among all men, all men may appear to have been taken up.”] That Christ died for his apostles, for his sheep, for his friends, for his Church, may make peradventure against those who make all men to have a share alike in the death of our Savior: but I profess myself to hold fully with him who said: Etsi Christus pro omnibus mortuus est, tamen specialiter pro nobis passus est, quia pro Ecclesia passus est. [“Although Christ died for all, yet He suffered especially for us, because He suffered for the Church.”] Yea, and in my former writing I did directly conclude, that as in one respect Christ might have been said to die for all, so in another respect truly said not to have died for all; and my belief is, that the principal end of the Lord’s death, was, ‘that He might gather together in one the children of God scattered abroad,’ and, that for their sakes He did specially sanctify Himself, that they ‘also might be sanctified through the truth.’ And therefore it may be well concluded that Christ in a special manner died for these; but to infer from hence, that in no manner of respect He died for any others, is but a very weak collection, especially the respect by me expressed being so reasonable, that no sober mind advisedly considering thereof can justly make question of it, viz. That the Lamb of God offering Himself a sacrifice for the sins of the world, intended by giving satisfaction to God’s justice to make the nature of man which He assumed, a fit subject for mercy, and to prepare a sovereign medicine that should not only be a sufficient cure for the sins of the whole world, but also should be laid open to all, and denied to none, that indeed do take the benefit thereof: for he is much deceived that thinks a preaching of a bare sufficiency is able to yield sufficient ground of comfort to a distressed soul, without giving a further way to it, and opening a further passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, pp. 567-68</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…For I am of no other mind than Prosper [in the early Church] was: Habet populus Dei plenitudinem suam, et quamvis magna pars hominum salvantis gratiam aut repellat aut negligat, in electis tamen et praescitis atque ab omni generalitate discretis, specialis quaedam censetur universitas, ut de toto mundo, totus mundus liberatus, et de omnibus hominibus, omnes homines videantur assumpti. [“The people of God possess their own fullness; and although a great part of mankind either rejects or neglects saving grace, yet in the elect and foreknown, and those distinguished from the whole generality [of mankind], there is reckoned a certain special universality, so that, from the whole world, the whole world may be said to have been liberated, and from among all men, all men may appear to have been taken up.”] That Christ died for his apostles, for his sheep, for his friends, for his Church, may make peradventure against those who make all men to have a share alike in the death of our Savior: but I profess myself to hold fully with him who said: Etsi Christus pro omnibus mortuus est, tamen specialiter pro nobis passus est, quia pro Ecclesia passus est. [“Although Christ died for all, yet He suffered especially for us, because He suffered for the Church.”] Yea, and in my former writing I did directly conclude, that as in one respect Christ might have been said to die for all, so in another respect truly said not to have died for all; and my belief is, that the principal end of the Lord’s death, was, ‘that He might gather together in one the children of God scattered abroad,’ and, that for their sakes He did specially sanctify Himself, that they ‘also might be sanctified through the truth.’ And therefore it may be well concluded that Christ in a special manner died for these; but to infer from hence, that in no manner of respect He died for any others, is but a very weak collection, especially the respect by me expressed being so reasonable, that no sober mind advisedly considering thereof can justly make question of it, viz. That the Lamb of God offering Himself a sacrifice for the sins of the world, intended by giving satisfaction to God’s justice to make the nature of man which He assumed, a fit subject for mercy, and to prepare a sovereign medicine that should not only be a sufficient cure for the sins of the whole world, but also should be laid open to all, and denied to none, that indeed do take the benefit thereof: for he is much deceived that thinks a preaching of a bare sufficiency is able to yield sufficient ground of comfort to a distressed soul, without giving a further way to it, and opening a further passage.”

— James Ussher, The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, pp. 567-68">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6For+I+am+of+no+other+mind+than+Prosper+%5Bin+the+early+Church%5D+was%3A+Habet+populus+Dei+plenitudinem+suam%2C+et+quamvis+magna+pars+hominum+salvantis+gratiam+aut+repellat+aut+negligat%2C+in+electis+tamen+et+praescitis+atque+ab+omni+generalitate+discretis%2C+specialis+quaedam+censetur+universitas%2C+ut+de+toto+mundo%2C+totus+mundus+liberatus%2C+et+de+omnibus+hominibus%2C+omnes+homines+videantur+assumpti.+%5B%E2%80%9CThe+people+of+God+possess+their+own+fullness%3B+and+although+a+great+part+of+mankind+either+rejects+or+neglects+saving+grace%2C+yet+in+the+elect+and+foreknown%2C+and+those+distinguished+from+the+whole+generality+%5Bof+mankind%5D%2C+there+is+reckoned+a+certain+special+universality%2C+so+that%2C+from+the+whole+world%2C+the+whole+world+may+be+said+to+have+been+liberated%2C+and+from+among+all+men%2C+all+men+may+appear+to+have+been+taken+up.%E2%80%9D%5D+That+Christ+died+for+his+apostles%2C+for+his+sheep%2C+for+his+friends%2C+for+his+Church%2C+may+make+peradventure+against+those+who+make+all+men+to+have+a+share+alike+in+the+death+of+our+Savior%3A+but+I+profess+myself+to+hold+fully+with+him+who+said%3A+Etsi+Christus+pro+omnibus+mortuus+est%2C+tamen+specialiter+pro+nobis+passus+est%2C+quia+pro+Ecclesia+passus+est.+%5B%E2%80%9CAlthough+Christ+died+for+all%2C+yet+He+suffered+especially+for+us%2C+because+He+suffered+for+the+Church.%E2%80%9D%5D+Yea%2C+and+in+my+former+writing+I+did+directly+conclude%2C+that+as+in+one+respect+Christ+might+have+been+said+to+die+for+all%2C+so+in+another+respect+truly+said+not+to+have+died+for+all%3B+and+my+belief+is%2C+that+the+principal+end+of+the+Lord%E2%80%99s+death%2C+was%2C+%E2%80%98that+He+might+gather+together+in+one+the+children+of+God+scattered+abroad%2C%E2%80%99+and%2C+that+for+their+sakes+He+did+specially+sanctify+Himself%2C+that+they+%E2%80%98also+might+be+sanctified+through+the+truth.%E2%80%99+And+therefore+it+may+be+well+concluded+that+Christ+in+a+special+manner+died+for+these%3B+but+to+infer+from+hence%2C+that+in+no+manner+of+respect+He+died+for+any+others%2C+is+but+a+very+weak+collection%2C+especially+the+respect+by+me+expressed+being+so+reasonable%2C+that+no+sober+mind+advisedly+considering+thereof+can+justly+make+question+of+it%2C+viz.+That+the+Lamb+of+God+offering+Himself+a+sacrifice+for+the+sins+of+the+world%2C+intended+by+giving+satisfaction+to+God%E2%80%99s+justice+to+make+the+nature+of+man+which+He+assumed%2C+a+fit+subject+for+mercy%2C+and+to+prepare+a+sovereign+medicine+that+should+not+only+be+a+sufficient+cure+for+the+sins+of+the+whole+world%2C+but+also+should+be+laid+open+to+all%2C+and+denied+to+none%2C+that+indeed+do+take+the+benefit+thereof%3A+for+he+is+much+deceived+that+thinks+a+preaching+of+a+bare+sufficiency+is+able+to+yield+sufficient+ground+of+comfort+to+a+distressed+soul%2C+without+giving+a+further+way+to+it%2C+and+opening+a+further+passage.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+The+Whole+Works+of+the+Most+Rev.+James+Ussher%E2%80%A6+17+vols.+%28Dublin%3A+Hodges+%26+Smith%2C+1864%29%2C+vol.+12+%7C+%E2%80%98An+Answer+of+the+Archbishop+of+Armagh+to+some+Exceptions+taken+against+his+aforesaid+Letter%E2%80%99%2C+pp.+562-71%2C+pp.+567-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F033263c571.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/033263c571.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=For%20I%20am%20of%20no%20other,it%2C%20and%20opening%20a%20further%20passage&amp;text=For%20I%20am%20of%20no%20other%20mind%20than&amp;text=way%20to%20it%2C%20and%20opening%20a%20further%20passage" rel="noopener" target="_blank">Read it

<main class="wrap"><figure class="quote" id="q-19f84a4aaa" data-kw="">
<blockquote><p>That repentance and faith are both essential to the attainment of eternal life. Though this has speculatively, it has not practically, been assented to by many professing Christians. Some have attached a high importance to repentance, but have at the same time almost entirely overlooked the necessity of faith. They think that if a man refrain from vicious habits, and be humane, charitable, just, and sober, he has attained the great end of all religion — he is a good man, and therefore must be held to be a good Christian; and they not unfrequently look upon and speak of those who attach a special importance to faith in Christ, as enthusiasts and visionaries, and sometimes go the length of representing them as favouring the doctrine that man may sin that grace may abound.

Others, again, have attached a high importance to faith in Christ; but at the same time have forgotten the equally high importance which belongs to repentance. They think that if a man believe the gospel, and entertain a zealous attachment to a sound creed, he must be a true Christian; and they not unfrequently look on those who insist on the necessity of repentance and good works as persons destitute of evangelical views, ignorant of the truth, attached to legal doctrine, and going about to establish their own righteousness.

Both these classes of persons proceed on erroneous principles — on partial views of the subject. The Holy Scriptures, from which alone we derive our knowledge of it, do not authorize them to give any such preference to the one grace or to the other, and far less to indulge in mutual, uncandid animadversions. A very slight acquaintance with the Scriptures may make any candid man perceive that both are equally essential, though not in the same sense.

A man without repentance, which is the principle or seed of holiness, is dead in trespasses and sins, and therefore incapable of enjoying heaven. And a man without faith, which is the uniting bond with the Saviour, is under condemnation, and has no title to the enjoyment of heaven. A well-informed Christian knows that that is truth. An experienced Christian feels that it is truth. He is not more assured that without holiness no man shall see the Lord, than that to be saved he must believe in the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-aird-thomson.html">William Aird Thomson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Testifying Repentance Toward God, and Faith Toward our Lord Jesus Christ, to the Faithful Preaching of the Gospel in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17afc6fb4a" data-kw="">
<blockquote><p>Repentance is a detestation of wicked life, and a turn to the better. Whence the parts of repentance are two: withdrawal from evil, and approach to the good, Psalm 34:14, depart from evil, and do good. It is evident that this repentance, insofar as it is saving conversion to God, that is, Sanctification begun or continued, pertains to the Gospel: (1.) Because it is an effect of evangelical doctrine. (2.) Because the baptism of repentance, which John preached, Mk. 1:4, is not a sacrament of the Law, but of the Gospel. (3.) Because the Gospel alone works that sorrow that is according to God, 2 Cor. 7:10. But the Law works wrath, Rom. 4:15. (4.) Because it immediately flows from the remission of sins, insofar as the Gospel is the preaching of the remission of sins and of repentance, Mk. 6:12.</p></blockquote>

</figure><figure class="quote" id="q-346770f521" data-kw="">
<blockquote><p>The beginning of hungering and thirsting after righteousness lies in the birth of conviction of sin. In fact the presence of this element in it is what distinguishes true, deep repentance from every kind of superficial regret for the secondary consequences of sin. True repentance strips sin of all that is accidental.

It resembles an inner chamber where no one and nothing else is admitted except God and the sinner and his sin. Into that chamber all the great penitents like David and Paul and Augustine and Luther have entered, and each one in the bitter anguish of his soul has borrowed the words of the psalmist: ‘Against thee, thee only have I sinned, and done this evil in thy sight, that thou mightest be justified when thou speakest, and be clear when thou judgest.’ A repentant sinner acquits God and condemns himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace and Glory: Sermons Preached in the Chapel of Princeton Theological Seminary</cite>, (1922; Edinburgh: Banner of Truth, 1994), p. 37.</span></figcaption>

<blockquote><p>How then can his repentance atone for his iniquities, or entitle him to the favour of God and to the happiness of heaven? How can that evangelical repentance, which he is incapable of exercising till after his sins be all forgiven on the ground of an infinite atonement imputed to him, make atonement for them? How can that true repentance, which he cannot exercise until in justification he be already entitled to eternal life, entitle him to eternal life? Does not the consummate righteousness of Jesus Christ, imputed for justification, entitle the believer fully to it? What need is there, then, that his repentance should entitle him? How can that exercise of repentance which is the consequence of pardon, afford a previous title to pardon? or that which is a part of eternal life be a ground of right to eternal life?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Repentance</cite>, (pp. 103–04). Monergism Books. Kindle Edition.</span></figcaption>

</figure><figure class="quote" id="q-c6d2361ad7" data-kw="">
<blockquote><p>There are two sorts of persons who will find it harder to repent than others:

1. Such as have sat a great while under the droppings of God’s ordinances, but grow no better. The earth which drinketh in the rain, yet beareth thorns and briars, is nigh unto cursing (Heb. 6.8). The metal which hath lain long in the fire, but is not melted and refined, there is little hope of it. When God hath sent his ministers one after another, exhorting and persuading men to leave their sins, but they settle upon the lees of formality, and can sit and sleep under a sermon; it will be hard for these ever to be brought to repentance; they may fear lest Christ should say to them as once to the fig-tree, Never fruit grow on thee more.

2. They will find it harder to repent, who have sinned frequently against the convictions of the Word, the checks of conscience, and the motions of the Spirit. Conscience has stood as the angel, with a flaming sword in its hand; it has said, ‘Do not this great evil;’ but sinners regard not the voice of conscience, but march on resolvedly under the Devil’s colors: these will not find it easy to repent (Job 24.13). They are of those that rebel against the light. It is one thing to sin for want of light, and another thing to sin against light. Here the unpardonable sin takes its rise; first men sin against the light of conscience, and so proceed gradually to the despighting the Spirit of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Repentance, Useful for These Times</cite>, (London: Printed by R.W. for Thomas Parkhurst, 1668), pp. 77-78</span></figcaption>

1. Such as have sat a great while under the droppings of God’s ordinances, but grow no better. The earth which drinketh in the rain, yet beareth thorns and briars, is nigh unto cursing (Heb. 6.8). The metal which hath lain long in the fire, but is not melted and refined, there is little hope of it. When God hath sent his ministers one after another, exhorting and persuading men to leave their sins, but they settle upon the lees of formality, and can sit and sleep under a sermon; it will be hard for these ever to be brought to repentance; they may fear lest Christ should say to them as once to the fig-tree, Never fruit grow on thee more.

2. They will find it harder to repent, who have sinned frequently against the convictions of the Word, the checks of conscience, and the motions of the Spirit. Conscience has stood as the angel, with a flaming sword in its hand; it has said, ‘Do not this great evil;’ but sinners regard not the voice of conscience, but march on resolvedly under the Devil’s colors: these will not find it easy to repent (Job 24.13). They are of those that rebel against the light. It is one thing to sin for want of light, and another thing to sin against light. Here the unpardonable sin takes its rise; first men sin against the light of conscience, and so proceed gradually to the despighting the Spirit of grace.”

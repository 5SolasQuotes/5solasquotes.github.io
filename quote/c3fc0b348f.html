<main class="wrap"><figure class="quote" id="q-c3fc0b348f" data-kw="">
<blockquote><p>Among other arguments, they say that matter is ingenerable [i.e., cannot arise from nothing]. But who among Christians could accept this? They insist that Aristotle proves it. But Scripture clearly shows that God made the heavens without any change to himself. Even if creation commenced with the beginning of the world, still the creation itself caused no change in God. What God decreed at some point within himself, this he began at some time to carry out. Not that God himself had a new operation, but that the things he had previously decreed within himself began to exist by his own will, for he had that purpose from eternity. Moreover [the idea] that there is any ungenerated motion is also rejected by us. He who is the originator of heaven and of earth is also the originator of motion and time. Besides, we do not make God liable to time or created things. As he is incorporeal, so he is above all things. It is suitable for Christians to think worthily about God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Genesis</cite>, trans. Mickey Mattox, Reformation Texts with Translation, no. 13 (1531; Milwaukee WI: Marquette University Press, 2013), p. 55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>The time of their [the devils’] standing in their primitive state is conceived to be very short; for their creation (though the Socinians hold it was long before) must fall within the compass of six days, for in that space the Scripture tells us God made heaven and earth, and all things therein: and therefore within the space of six days He created the angels also. Some refer their creation to the first day’s work, others to the fourth day: and it’s probably thought that Adam’s continuance in innocency was not much above one day, and yet even then there were fallen Angels to tempt him: so that their glorious and blessed state could not, according to the computation, last above six or seven days, such a speedy issue did God make with them upon their very first sin…</p></blockquote>

</figure><figure class="quote" id="q-042f495e37" data-kw="">
<blockquote><p>Q. What are the general things considered in all this matter of Creation?

A. First, the Creator of all these things, which is God the Father, the Son, and the holy Ghost.

Secondly, his omnipotencie, that he made all by his word, that is, by his only will, who calleth things that are not, as though they were.

Thirdly, that he made not all at once, and in a moment, but in six days.

Q. Why did he make them in six days, which could have perfected all in a moment?

A. First, that we might thereby more easily conceive, that the world was not made confusedly, or by chance, but orderly, and by counsel.

Secondly, that all men from the beginning of the world, to the end thereof, might have, in God himself, an example of labouring in their vocations, six days in this life, and retiring the seventh.</p></blockquote>

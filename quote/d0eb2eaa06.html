<main class="wrap"><figure class="quote" id="q-d0eb2eaa06" data-kw="">
<blockquote><p>It seemeth his care was to keep up those Universities, which others would ruin: which made Grotius pronounce many Christians to be worse than the Philistines; for they 1 Sam. 10. 5. would let the company of Prophets alone, even where they kept Garrison: it hath been not from the good will of these men, but from the favour of God, and our Governors, that in the midst of wars we have enjoyed the like safety and protection. However, seeing the Philosophers of old were wont to dispute in the Temple of Peace, till it was demolished, and Intellectus being in quiet. Such a Temple is a Student’s best sanctuary. Pray we for the Peace of the State, for in it we shall have peace, and not be given up to the fury of those whose little Learning serveth them only to the declaim against what they want [lack] …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thanatoktasia. Or,</cite>, Death Disarmed: And the Grave Swallowed up in Victory. A Sermon Preached at St Mary’s in Cambridge, Decem. 22. 1652. At the Publick Funerals of Dr. Hill, Late Master of Trinity Colledge in that University (London: J. Rothwell, 1654), pp 55-56.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6de9a84be" data-kw="">

<blockquote><p>…the command to sing psalms in the name of the Lord was obeyed by everyone in every place: for the command to sing psalms is in force in all Churches which exist among the nations, not only for the Greeks but also for the Barbarians; and further, throughout the whole world, in towns and villages and in the fields also, in short, in the whole Church, the people of Christ, who are gathered from all nations, sing to the one God, whom the prophets foretold, hymns and psalms with a loud voice, so that the voice of the psalm-singers is heard by those standing outside.</p></blockquote>

</figure><figure class="quote" id="q-950e8982db" data-kw="">
<blockquote><p>While they [the Jews] had the tenth of their goods consecrated, these [Christians] on the other hand who have received freedom [from the Mosaic Law] assign all that they have to the uses of the Lord, cheerfully and freely giving them, and not in lesser portions only, as becomes men professing the hope of greater things.’ . . Start Here: Articles &amp; Book Articles Smyth, Thomas – The Parsimony of Professing Christians being Note A to The Rule &amp; Measure of Christian Charity in Works, vol. 7 American, southern presbyterian. Parsimony means an extreme unwillingness to spend money. Peck, Thomas – Moral Obligation of the Tithe (1890) in Miscellanies, vol. 1, pp. 146-57 Peck was an American, southern presbyterian.. He argues that while natural and Biblical principles morally obligate us to return a portion of our income to the service of the Lord, this does not obligate an exact amount of, or at least, 10% in the New Testament era. While this article is very valuable, yet throughout it Peck argues for Voluntaryism, which is contrary to the Establishment Principle of the Reformation.. This aspect of Peck’s article is not recommended. Balfour, William – The Establishment Principle Defended, pp. 126-34 (1873) Balfour was a minister in the Free Church of Scotland.. He here defends from Scripture the Reformation’s view of the Establishment Principle with regards to tithing. Balfour is here arguing against the Voluntary position of the Scottish United Presbyterian Church, with which Church the Free Church was considering union with in his time. The teaching of Scripture is clear. . Book Croteau, David – A Biblical &amp; Theological Analysis of Tithing: Toward a Theology of Giving in the New Covenant Era PhD dissertation (2005) 339 pp. Croteau brings out numerous, enlightening Biblical insights.. His historical survey on pp. 6-68 is very helpful, especially in documenting the tithing renewal that occurred in America during the late-1800’s and following.. Indispensable for further digging into the subject, especially for his citations of literature on the subject. . . Dictionary &amp; Encyclopedia Articles on the Biblical tithes 1800’s Smith, William – ‘Tithe’ in Dr. William Smith’s Dictionary of the Bible, Comprising its Antiquities, Biography, Geography &amp; Natural History, vol. 4 ed. H.B. Hackett &amp; Ezra Abbot (1871) ** ed. McClintock &amp; Strong – ‘Tithe’ in Cyclopedia of Biblical, Theological and Ecclesiastical Literature (1880) Davis, John D. – ‘Tithe’ in A Dictionary of the Bible (1898) . 1900’s Jewish Encyclopedia – ‘Tithe’ (1901-1906) ed. Orr, James – ‘Tithe’ in International Standard Bible Encyclopedia (1915 / 1939) . . Articles Theological &amp; Political 1500’s Bullinger, Henry – Tenth Sermon, pp. 486-500 in the Fifth Decade of The Decades 1550’s Bullinger (1504–1575) was a Swiss reformer, the successor of Zwingli as the head of the Zurich Church. ** Ursinus, Zacharias – p. 570 (bottom) of ‘The Fourth Commandment’ in Commentary on the Heidelberg Catechism trans. Williard, 3rd American ed. (1851) Ursinus (1534–1583) was a prominent German Reformed theologian. ** Vermigli, Peter Martyr – Pt. 4, ch. 13, ‘Of a Magistrate, &amp; of the Difference between Civil &amp; Ecclesiastical Power’, section 18-32 in Common Places (1583), pp. 235-45 Quote: “First we must understand that tithes in the old time pertained unto ceremonies, and that as well in Melchisedek as in the Levites: Because in either priesthood they were referred unto Christ, and either priesthood was in very deed a figure of Christ… But what signified the tenths in either priesthood? Truly they signified nothing else but that it behoved the old fathers to acknowledge that whatsoever they had came from Christ. By that ceremony, the people worshipped Christ Himself… Boniface says: “We receive the tithes of all laymen.” Ye take them indeed, but now that Christ is come, the paying of tithes is no more a ceremony as it was before the coming of Christ when by tithes men worshipped Christ which was to come in the flesh, and confessed that they ought unto Him, both themselves, and all that they had. After the very which manner they paid the first fruits of all that they had. Nevertheless our men in these days receive tithes: but by what law? Truly not by the ceremonial law, but by a moral Law: since it is requisite that the minister should be sustained by the people: (Mt. 10:10) For the laborer is worthy of his reward: And he which serves the Gospel ought to live by it. So then, whether stipends be paid unto ministers out of lands or out of houses, either in ready money or in tithes, it makes no matter so that they be not maintained dishonestly, but honestly. Indeed these rewards in some places do retain the old manner of tithes. Howbeit in many places they are not called tithes, but stipends or wages. And doubtless they be rather rewards which are due to the labors of ministers than tithes.</p></blockquote>

e%3A+%E2%80%9CFirst+we+must+understand+that+tithes+in+the+old+time+pertained+unto+ceremonies%2C+and+that+as+well+in+Melchisedek+as+in+the+Levites%3A+Because+in+either+priesthood+they+were+referred+unto+Christ%2C+and+either+priesthood+was+in+very+deed+a+figure+of+Christ%E2%80%A6+But+what+signified+the+tenths+in+either+priesthood%3F+Truly+they+signified+nothing+else+but+that+it+behoved+the+old+fathers+to+acknowledge+that+whatsoever+they+had+came+from+Christ.+By+that+ceremony%2C+the+people+worshipped+Christ+Himself%E2%80%A6+Boniface+says%3A+%E2%80%9CWe+receive+the+tithes+of+all+laymen.%E2%80%9D+Ye+take+them+indeed%2C+but+now+that+Christ+is+come%2C+the+paying+of+tithes+is+no+more+a+ceremony+as+it+was+before+the+coming+of+Christ+when+by+tithes+men+worshipped+Christ+which+was+to+come+in+the+flesh%2C+and+confessed+that+they+ought+unto+Him%2C+both+themselves%2C+and+all+that+they+had.+After+the+very+which+manner+they+paid+the+first+fruits+of+all+that+they+had.+Nevertheless+our+men+in+these+days+receive+tithes%3A+but+by+what+law%3F+Truly+not+by+the+ceremonial+law%2C+but+by+a+moral+Law%3A+since+it+is+requisite+that+the+minister+should+be+sustained+by+the+people%3A+%28Mt.+10%3A10%29+For+the+laborer+is+worthy+of+his+reward%3A+And+he+which+serves+the+Gospel+ought+to+live+by+it.+So+then%2C+whether+stipends+be+paid+unto+ministers+out+of+lands+or+out+of+houses%2C+either+in+ready+money+or+in+tithes%2C+it+makes+no+matter+so+that+they+be+not+maintained+dishonestly%2C+but+honestly.+Indeed+these+rewards+in+some+places+do+retain+the+old+manner+of+tithes.+Howbeit+in+many+places+they+are+not+called+tithes%2C+but+stipends+or+wages.+And+doubtless+they+be+rather+rewards+which+are+due+to+the+labors+of+ministers+than+tithes.%E2%80%9D%0A%0A%E2%80%94+Reformed+Books+Online%2C+Editorial+note%2C+%28Mk.+10%3A29-30%29.+Lord+increase+our+faith%21+and+may+we+be+like+the+Christians+of+the+Early+Church+whom+Irenaeus+spoke+of+%28Her.%2C+iv.2%29%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F950e8982db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/950e8982db.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings#:~:text=While%20they%20%5Bthe%20Jews%5D%20had%20the,the%20labors%20of%20ministers%20than%20tithes&amp;text=While%20they%20%5Bthe%20Jews%5D%20had%20the%20tenth%20of&amp;text=due%20to%20the%20labors%20of%20ministers%20than%20tithes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We believe that these Holy Scriptures fully contain the will of God, and that whatsoever man ought to believe unto salvation, is sufficiently taught therein. For since the whole manner of worship which God requires of us is written in them at large, it is unlawful for any one, though an Apostle, to teach otherwise than we are now taught in the Holy Scriptures; nay, though it were an angel from, heaven, as the Apostle Paul saith. For since it is forbidden to add unto or take away any thing from the Word of God, it doth thereby evidently appear that the doctrine thereof is most perfect and complete in al respects. Neither may we compare any writings of men, though ever so holy, with those divine Scriptures; nor ought we to compare custom, or the great multitude, or antiquity, or succession of times or persons, or councils, decrees, or statutes, with the truth of God, for the truth is above all: for all men are of themselves liars, and more vain than vanity itself. Therefore we reject with all our hearts whatsoever doth not agree with this infallible rule, which the Apostles have taught us, saying, Try the spirits whether they are of God; likewise, If there come any unto you, and bring not this doctrine, receive him not into your house.</p></blockquote>

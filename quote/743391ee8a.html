<main class="wrap"><figure class="quote" id="q-743391ee8a" data-kw="">
<blockquote><p>Is not the whole land before thee? separate thyself, I pray thee, from me: if thou wilt take the left hand, then I will go to the right; or if thou depart to the right hand, then I will go to the left. And Lot lifted up his eyes, and beheld all the plain of Jordan, that it was well watered every where, before the Lord destroyed Sodom and Gomorrah, even as the garden of the Lord, like the land of Egypt, as thou comest unto Zoar. Then Lot chose him all the plain of Jordan;</p></blockquote>

<blockquote><p>3rd Caution. One and the same commandment in some things binds the conscience more straitly, and in doing some other things less: Gal. 6:10, ‘Do good to all men, but specially them that be of the household of faith.’ Hence it arises that though all sins be mortal and deserve eternal death, yet all are not equal, but some more grievous than others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, ... (Cambridge, 1596), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-072a7423b2" data-kw="">
<blockquote><p>One may object: (1) But is not a minister leading responsive readings inducing others to do what is wrong, which is prohibited by God’s Law (WLC #99.5–8)? Besides what has been said, to put it in a bit different way: Given that the impurities in responsive readings do not so corrupt the reading of the Word as to make the hurt more than the benefit, overturning the profit and substance of the ordinance itself, so God graciously receives this worship from sincere Christians. Leading weaker brothers in substantially good and Biblical worship as their consciences will bear (Rom. 14:5), especially given public order, is to direct them to their duty, which WLC #99.5–8 also obliges us to; and the moral necessity to do the greater good ordained of God, though mixed with impurities (without morally approving them), is greater than to abstain from that substantial and greater good because of its impurities. This is not to do “what God forbids,” which “is at no time to be done,” because this is precisely what “He commands” and “is always our duty” (WLC #99.5). If one does not agree, but believes it is sinful to ever personally perform, or direct others to do good things with impurities, inconvenience, an association of evil or that which another person could take scandal at, welcome to Separatism. Our puritan authors’ Scriptural Refutation of it will be instructive to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

asquotes.github.io%2Fquote%2F072a7423b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/072a7423b2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=One%20may%20object%3A%20%281%29%20But%20is,it%20will%20be%20instructive%20to%20you&amp;text=One%20may%20object%3A%20%281%29%20But%20is%20not%20a&amp;text=Refutation%20of%20it%20will%20be%20instructive%20to%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c5e83ac39d" data-kw="">
<blockquote><p>The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member… Much more must the temporal commodity of single men give place to the churches’ welfare (which will not stand with disorder)… If you plead inconveniencies to them: Remember then it is no matter of conscience, but of worldly commodity: and may not I set the general good of the churches against any man’s commodity?</p></blockquote>

<blockquote><p>But if in a froward tergiversation [change of position], the fornicator begin to reply that he also is scandalized and provoked to go on in his fornication obstinately, by the pastor’s rebuking him for so light a matter, and that the pastor’s reproof to him has appearance of evil, as much as his fornication has to the pastor: Albeit here it may be answered that the pastor’s reproof is not done inordinate [inordinately], neither has any appearance of evil, except in the fornicator’s perverse interpretation, yet for stopping the fornicator’s mouth as well more forcibly as more quickly, the pastor rejoinds that if any scandal follow upon his reproof, it is not to be regarded, because the thing is necessary and that because fornication being a great sin, he may not but reprove it. So, albeit our argument of scandal [against the ceremonies] holds out against the ceremonies considered by themselves, without making mention of the unlawfulness of them in themselves: albeit also when the scandal of non-conformity (if there be any such) is compared with the scandal of conformity, we say truly, that this has appearance of evil in its own condition, and that has none, except in the false interpretation of those who glory in gainsaying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 43</span></figcaption>

<blockquote><p>the constant and earnest wish of all good men for these hundred years past… that the Protestant Churches which differ one from another about some points of religion, laying aside or at least moderating on both sides their over-tenacious adhering to their own opinions, may now at length be united and made up into one body… we [the reformed and Lutherans] are not at variance about any fundamental point of Christian religion, or such wherein men may not safely be of either opinion without hazarding their salvation… we make no doubt but every man would then readily wish for this much-desired communion, which none ever shunned or refused but out of a kind of religion and conscience, conceiving it unlawful to entertain a communion with any that are not of the same belief and opinion with themselves: so soon as men on both sides shall be wrought off from this superstitious conceit, they will gladly run and rush (as it were) into one another’s arms and embraces… how foul and scandalous a thing, how hurtful to both sides, how dangerous and pernicious to the whole Christian world this Schism is which has hitherto divided and distracted us… seeing we confess that whatsoever is of necessity for salvation to be believed or done by us, it is all clearly and plainly laid down in this Gospel, what hinders why we may not jointly confirm and ratify those articles wherein we both agree? and for those other points about which we differ, we may express them in such words and phrases as the sacred Scriptures afford us…</p></blockquote>

</figure><figure class="quote" id="q-cf3a92e9a9" data-kw="">
<blockquote><p>Much has been made by historians of the Scots ‘forcing’ their austere brand of religion upon their English brethren. However, it is clear that Scottish commissioners were aware their role was limited to advising only and that the construction of the Church rested with English members of the Assembly. Indeed, the Westminster Assembly did invite the Scottish commissioners to become full members of the Assembly, an invitation which the Scots declined, thereby recognising and respecting England’s right to define its own church government… The Scots fully encouraged the English to set up a Classical Presbytery based on English tradition and encouraged compromise [or rather a principled accommodation to the Independents]. In response to [the Independent] Philip Nye’s sharp accusation that the Scots had ‘given’ the Assembly a whole system of church government, the Scottish members responded that ‘we were well content the Assembly should take their own order, and not tie themselves to ours.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kirsteen-m-mackenzie.html">Kirsteen M. MacKenzie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League &amp; Covenant of the Three Kingdoms &amp; the Cromwellian Union</cite>, 1643-1663 (Routledge, 2018), ch. 1, pp. 37-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

%20tie%20themselves%20to%20ours" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-37625135af" data-kw="">
<blockquote><p>My mind being thus many years immersed in studies of this nature, and I having also long wearied myself in searching what fathers and schoolmen have said of such things before us, and my genius abhorring confusion and equivocals, I came by many years longer study to perceive that most of the doctrinal controversies among Protestants (that I say not in the Christian world) are far more about equivocal words than matter; and it wounded my soul to perceive what work both tyrannical and unskillful, disputing clergymen had made these thirteen hundred years in the world! And experience since the year 1643 till this year, 1675, has loudly called to me to repent of my own prejudices, sidings and censurings of causes and persons not understood, and of all the miscarriages of my ministry and life, which have been thereby caused; and to make it my chief work to call men that are within my hearing to more peaceable thoughts, affections and practices: And my endeavours have not been in vain, in that the ministers of the country where I lived, were very many of such a peaceable temper (though since cast out [at the Great Ejection, 1662]), (and a great number more through the land by God’s grace (rather than any endeavors of mine) are so minded). But the sons of the coal were exasperated the more against me, and accounted him to be against every man that called all men to love and peace, and was for no man as in a contrary way. And now looking daily in this posture, when God calls me hence (summoned by an incurable disease to hasten all that ever I will do in this world) being uncapable of prevailing with the present Church disturbers, I do apply myself to posterity, leaving them the sad warning of their ancestors’ distractions, as a pillar of salt, and acquainting them what I have found to be the cause of our calamities, and therein they will find the cure themselves. II. I Have oft taken the boldness (constrainedly) to say that I doubt not but the contentions of the clergy have done far more hurt to the Christian world than the most bloody wars of princes. … 13. No man is sufficiently apprehensive of the greatness of the curse in the confusion of tongues [Gen. 10]: whereby as we can preach but to few nations in the world, so we cannot intelligibly converse with one another. All words (being arbitrary signs) are ambiguous; And few disputers have the jealousy and skill which is necessary to discuss equivocations, and to agree of the meaning of all their terms before they use them in disputing: And so taking verbal differences for material, does keep up most of the wretched academical and theological wars of the world. 14. And nothing here undoes all the world in point of wisdom, so much as over-hasty judging or prefidence: It is natural to almost all to fasten presently upon the first appearances and to be confident before they have half tried: In cases where seven and seven years serious study is necessary to a thorough digested knowledge, every novice will presently conclude as if he were sure. And then as everyone is apt to be confident, so to be tenacious; every error leading on more, and the reputation of the person being concerned in it, mutability being a shame: And so it becomes a very difficult thing to unlearn the errors once learned; as white paper is easier [to be] written on than that which is written on before. 15. And then no man knows his own error (else it were no error), nor knows what another man’s perceptions are, nor what any other man knows more than he. 16…. And by all these means almost all are of the opinion of the country where they live, or of those that they most reverence, or which are most for their interest; and boldly condemn the rest not understood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

— Richard Baxter, Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMy+mind+being+thus+many+years+immersed+in+studies+of+this+nature%2C+and+I+having+also+long+wearied+myself+in+searching+what+fathers+and+schoolmen+have+said+of+such+things+before+us%2C+and+my+genius+abhorring+confusion+and+equivocals%2C+I+came+by+many+years+longer+study+to+perceive+that+most+of+the+doctrinal+controversies+among+Protestants+%28that+I+say+not+in+the+Christian+world%29+are+far+more+about+equivocal+words+than+matter%3B+and+it+wounded+my+soul+to+perceive+what+work+both+tyrannical+and+unskillful%2C+disputing+clergymen+had+made+these+thirteen+hundred+years+in+the+world%21+And+experience+since+the+year+1643+till+this+year%2C+1675%2C+has+loudly+called+to+me+to+repent+of+my+own+prejudices%2C+sidings+and+censurings+of+causes+and+persons+not+understood%2C+and+of+all+the+miscarriages+of+my+ministry+and+life%2C+which+have+been+thereby+caused%3B+and+to+make+it+my+chief+work+to+call+men+that+are+within+my+hearing+to+more+peaceable+thoughts%2C+affections+and+practices%3A+And+my+endeavours+have+not+been+in+vain%2C+in+that+the+ministers+of+the+country+where+I+lived%2C+were+very+many+of+such+a+peaceable+temper+%28though+since+cast+out+%5Bat+the+Great+Ejection%2C+1662%5D%29%2C+%28and+a+great+number+more+through+the+land+by+God%E2%80%99s+grace+%28rather+than+any+endeavors+of+mine%29+are+so+minded%29.+But+the+sons+of+the+coal+were+exasperated+the+more+against+me%2C+and+accounted+him+to+be+against+every+man+that+called+all+men+to+love+and+peace%2C+and+was+for+no+man+as+in+a+contrary+way.+And+now+looking+daily+in+this+posture%2C+when+God+calls+me+hence+%28summoned+by+an+incurable+disease+to+hasten+all+that+ever+I+will+do+in+this+world%29+being+uncapable+of+prevailing+with+the+present+Church+disturbers%2C+I+do+apply+myself+to+posterity%2C+leaving+them+the+sad+warning+of+their+ancestors%E2%80%99+distractions%2C+as+a+pillar+of+salt%2C+and+acquainting+them+what+I+have+found+to+be+the+cause+of+our+calamities%2C+and+therein+they+will+find+the+cure+themselves.+II.+I+Have+oft+taken+the+boldness+%28constrainedly%29+to+say+that+I+doubt+not+but+the+contentions+of+the+clergy+have+done+far+more+hurt+to+the+Christian+world+than+the+most+bloody+wars+of+princes.+%E2%80%A6+13.+No+man+is+sufficiently+apprehensive+of+the+greatness+of+the+curse+in+the+confusion+of+tongues+%5BGen.+10%5D%3A+whereby+as+we+can+preach+but+to+few+nations+in+the+world%2C+so+we+cannot+intelligibly+converse+with+one+another.+All+words+%28being+arbitrary+signs%29+are+ambiguous%3B+And+few+disputers+have+the+jealousy+and+skill+which+is+necessary+to+discuss+equivocations%2C+and+to+agree+of+the+meaning+of+all+their+terms+before+they+use+them+in+disputing%3A+And+so+taking+verbal+differences+for+material%2C+does+keep+up+most+of+the+wretched+academical+and+theological+wars+of+the+world.+14.+And+nothing+here+undoes+all+the+world+in+point+of+wisdom%2C+so+much+as+over-hasty+judging+or+prefidence%3A+It+is+natural+to+almost+all+to+fasten+presently+upon+the+first+appearances+and+to+be+confident+before+they+have+half+tried%3A+In+cases+where+seven+and+seven+years+serious+study+is+necessary+to+a+thorough+digested+knowledge%2C+every+novice+will+presently+conclude+as+if+he+were+sure.+And+then+as+everyone+is+apt+to+be+confident%2C+so+to+be+tenacious%3B+every+error+leading+on+more%2C+and+the+reputation+of+the+person+being+concerned+in+it%2C+mutability+being+a+shame%3A+And+so+it+becomes+a+very+difficult+thing+to+unlearn+the+errors+once+learned%3B+as+white+paper+is+easier+%5Bto+be%5D+written+on+than+that+which+is+written+on+before.+15.+And+then+no+man+knows+his+own+error+%28else+it+were+no+error%29%2C+nor+knows+what+another+man%E2%80%99s+perceptions+are%2C+nor+what+any+other+man+knows+more+than+he.+16%E2%80%A6.+And+by+all+these+means+almost+all+are+of+the+opinion+of+the+country+where+they+live%2C+or+of+those+that+they+most+revere <blockquote><p>He speaks there of Jesus Christ the Righteous: the Son of God, who is here in my text likewise made the object of this knowledge. ‘Thou art Christ the Son of the living God,’ [Mt. 16] is by Christ Himself made the rock upon which the whole Church is builded, ‘And other foundation’ (says St. Paul) ‘can no man lay than that is laid, which is Jesus Christ.’ Not that we should think that there were no other fundamental doctrine to be acknowledged but this alone (for the articles of the Holy Ghost, forgiveness of sins, resurrection of the dead, eternal judgement, and such like other have their place also in the foundation), but because this is the most special object of faith, and the primary foundation of all the other.</p></blockquote>

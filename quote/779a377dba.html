<main class="wrap"><figure class="quote" id="q-779a377dba" data-kw="">
<blockquote><p>Iconoclasm, the debate about the legitimacy of religious art that began in Byzantium around 720 and continued for nearly one hundred and twenty years… The authors have worked together to provide a comprehensive overview of the visual, written and other materials… they challenge many traditional assumptions about iconoclasm and set the period firmly in its broader political, cultural and social-economic context.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/general.html">General</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brubaker, Leslie &amp; John Haldon – Byzantium in the Iconoclast Era, c. 680-850: A History Ref</cite>, (Cambridge University Press, 2015) 944 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7c1e66dfa" data-kw="">
<blockquote><p>The papists and Lutherans do not have anything to argue for their images, except what we recently rejected in §IX, namely, that God quite often appeared in the Old Testament under certain forms, even human ones. The reply is easy: He never appeared for the purpose that He might be portrayed; indeed, that is what, throughout Scripture, he has forbidden as strictly as possible…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Todd Rester &amp; Michael Spangler (RHB) | section 11, vol. 1, bk. 2, ch. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-8994f6114d" data-kw="">
<blockquote><p>As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, (Edinburgh, 1894), pp. 193-94 Also reprinted by Banner of Truth. Rutherford is here quoting from some other public document, possibly from the Latin of David Calderwood’s Altar of Damascus, p. 595. | Letter 91, to Robert Gordon of Knockbrex</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-214740dbc7" data-kw="">
<blockquote><p>…we must conclude that the florilegium of the Council of 815 does not advance beyond the iconoclastic theology of the earlier period… its authors made no original contributions, and merely re-used materials or repeated arguments current among the iconoclasts of 754. The most that can be said is that the iconoclasts of 815 added 12 (or 28) patristic references to the florilegium of 754, none of which, however, can be regarded as constituting an innovation or substantial addition to the iconoclastic armory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers</cite>, vol. 8 (1954), pp. 153-60, p. 159</span></figcaption>

<blockquote><p>That she was framed of such ministers and ruling elders as had, for the most part, their consciences sadly stained with sinful oaths (at least with one or more of them), such as: (1) The National Declaration, (2) The Oath of Allegiance and Supremacy, (3) The Bond of Peace, to live peaceably, (4) The Bond of Regularity, (5) Some Bonds and Oaths for Peaceableness and Orderliness, (6) The Oath of Inquisition, or Super-inquirendis, (7) The abominable Test, (8) The Oath of Abjuration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

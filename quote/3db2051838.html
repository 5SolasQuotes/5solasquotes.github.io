<blockquote><p>Vers. 4. Wherefore my Brethren, ye also are become dead to the Law by the Body of Christ, that ye should be married to another, even to him who is raised from the dead, that we should bring forth fruit unto God.

The Apodosis of the comparison, to this manner; So you that were espoused formerly to the Law by a Covenant of Works, Christ being dead for you, that he might satisfy the Law, Justice, and the Covenant of Works in our name, you are judicially dead to the Law, in the body of Christ (for the Law, or Covenant of Works hath slain Christ, and you in him) and by consequence you are delivered from the matrimonial Covenant of the Law; so that without the breach of Justice you may enter into a new Covenant of Grace, with Christ, being raised from the dead.

To this end he shews, that the purpose of marriage being disannulled, betwixt the Law of Works and us, not that we should live as we list, but being raised from a state of death, by the Resurrection of Christ, that we should be espoused to another Husband, viz. to him which is raised from the dead, i. e. to Christ, who rose from the dead, and hath raised us with himself to newness of life, and hath espoused us to himself, according to the Covenant of Grace, that being married unto Christ, we might bring forth fruits of obedience to the glory of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f6824abdd" data-kw="">
<blockquote><p>In calling him LORD, he regards him as the God of the covenant; not so much of a covenant of works; for believers are in truth not under the law, but under grace. Yea, as a God in the covenant of works, there is nothing to excite or attract unto confession, nor unto hope of forgiveness, for all the Lord’s virtues are armed against the sinner, so that He can keep no company with the workers of iniquity. But rather, a covenant of grace, which on account of its firmness and lasting immutability is called good, a covenant of salt, and the sure mercies of David. Herein God Himself, laying aside His wrath, letting mercy and peace go before His face, reveals the sceptre of mercy to sinful rebels, and assures all those who flee unto His mercy in the Mediator, of forgiveness of all sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), p. 52.</span></figcaption>

</figure><figure class="quote" id="q-4b7c17ab77" data-kw="merit">
<blockquote><p>The natural covenant is not so called because it conferred nothing above nature and condition (which man had from creation), but because it depended on the powers of nature and the obedience which according to them he ought to render. Nor, if a proportion is not granted between the prescribed duty and the blessing of heavenly life, does it follow that such a promise cannot have a place. It is gratuitously and falsely supposed that the promises of God are regulated according to the proportion of our merit. On the contrary, they depend upon God’s will and goodness.</p></blockquote>

</figure><figure class="quote" id="q-c0a8461753" data-kw="">
<blockquote><p>Firstly, when we reflect upon God with whom man has to do, He is the just Judge of all the earth, the thrice-holy God, standing with the unregenerate sinner in the relationship of the covenant of works; in the which all His attributes and perfections are armed against the sinner, and His sword is unsheathed to do away with him; his tears and sighs, reformation of life and seeking of God, can in no way suffice Him; His justice must be satisfied before He can show friendship with the sinner; but neither angels nor men can satisfy it; it is Immanuel alone who has done it, but none has a part in Him without faith. Hence God being just, men cannot please Him without faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), xviii.</span></figcaption>

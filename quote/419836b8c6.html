<main class="wrap"><figure class="quote" id="q-419836b8c6" data-kw="">
<blockquote><p>To a reader, therefore, that is lately entered, we think forty marks, or more or less, as the parishioners and reader can agree, sufficient: providing that he teach the children of the parish, which he must do, besides the reading of the common prayers, and books of the New and Old Testaments. If from reading he begins to exhort, and explain the scriptures, then ought his stipend to be augmented; till finally he comes to the honour of a minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Book of Discipline</cite>, Scottish First Book of Discipline</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee7f641456" data-kw="">
<blockquote><p>Because there is a difference betwixt carrying the colors [banner or flag] in an army tali modo [in such a way] as all the army at once may see the colors, and the carrying of the colors. Yet the colors are a note-visible of such an army: so there is a difference betwixt preaching the Word, simpliciter, and preaching the Word, tali modo, ‘in such a way’ in one material house only. And therefore it is necessary that government which concerns many Churches consociated, be in its exercise hic &amp; nunc [here and now], larger than preaching of the Word in its exercise, hic &amp; nunc: which cannot be done but to a multitude which convenes epi to auto, ‘to the same material place’. And we see an act of government, Acts 15, by confession of our [Independent] Brethren, belonging to diverse consociated Churches and performed by them, and yet these cannot ordinarily meet to one and the same place in all their members for hearing of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 303-304</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-497ecc260a" data-kw="">
<blockquote><p>Secondly, Paul requires the elders of the Church of Ephesus to take heed unto and to oversee the whole flock, which did consist of more than did or could then meet together ordinarily into one place for the worship of God, as appears by the Church in the house of Aquila and Priscilla (which was one, but not the only one church assembly at Ephesus) by the great and wonderfull increase of the Gospel at Ephesus… Peter also writing to the churches of the strangers in several provinces, calls them the ‘flock’, not ‘flocks’, and commends unto the elders the feeding and oversight of that flock… No doubt they had the administration of the Word and sacraments partitive, or severally. Nor do I deny but they had a partitive several government: but there was also an union or association of them under one common government, which did denominate them to be one visible, ecclesiastical flock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, ... (1646), bk. 2, ch. 9, p. 298</span></figcaption>

</figure><figure class="quote" id="q-52be45d224" data-kw="">
<blockquote><p>2nd Quaere: Seeing hence it follows [on congregationalist terms] that single believers are to pray publicly, and exhort publicly, and authoritatively convince gainsayers at the ordination and deprivation of pastors, if they may not also publicly preach and administer the sacrament? I answer: If you give to single believers one pastoral act, you may with the like weight of reason give to them all.</p></blockquote>

</figure><figure class="quote" id="q-7fe33e6083" data-kw="">
<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (1641), p. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44993ee873" data-kw="against implicit faith">
<blockquote><p>This is “implicit faith” (which they say suffices for the salvation of the laity if they believe what the church believes, although they may not know what the church believes, or what it ought to believe, or what church is to be believed). This is called “the faith of Carbonarius” because being asked what he believed, he answered, “What the church believes.” Again being asked what the church believed, he said, “What I believe.” The design of the Romanists is to keep the people in ignorance that the yoke of traditions and of all kinds of errors and superstitions may the more easily be placed upon them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.3–4</span></figcaption>

</figure><figure class="quote" id="q-73b14e759d" data-kw="">
<blockquote><p>For men to give blind obedience unto the commands of superiors, though it pretend to humility and devout submission of mind, yet it is not real humility, but a prostituting of our souls and consciences to the wills of men; So this humility or submissive disposition, which was their second pretence, has but a shew of wisdom in it, and is not real.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Philippians &amp; Colossians (Edinburgh: Higgins, 1656), Col. 2, verse 23, ‘Which things have indeed a show of wisdom in will-worship and humility, and neglecting of the body, not in any honor to the satisfying of the flesh’</cite>, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-9b1e48f8bd" data-kw="">
<blockquote><p>This imposing [of Church courts] takes not away judicious believing [by individuals]… If imposing were a commanding that we receive absolutely what they say, be it good, or ill, without examining [whether] the argument were concludent, as God himself requires Abraham to kill his son, Abraham was without examination to give absolute obedience, and this proves God to be Lord of the conscience, for knowing his Word to be his Word, we are not to examine it by the Scripture or Law of Nature, because if we know who speaks, we are not to examine what is spoken. But though we know who speaks among creatures, be it a prophet, an apostle, an angel, yet must we examine both who speaks and what is spoken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649), ch. 2</cite>, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-1ca7c1b386" data-kw="">

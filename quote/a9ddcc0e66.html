<blockquote><p>Say that the decision of the synod be agreeable to the Word: the Lord lays on the coaction [coercion] to all, to believe and accordingly profess the truth, and that by a synod, as Christ says, ‘he that heareth you heareth Me’: so the coaction, such as it is, must come principally from God, instrumentally from the synod; but it flows from both by accident [that is, it does not occur necessarily], and through men’s abuse, who receive not the truth in love, but for fear of shame, lest they should by the godly go for perverters of souls, Acts 15, that they do hypocritically profess what they ought sincerely to believe and profess; may we not say many men of corrupt minds believed circumcision to be necessary, and yet for fear of the apostles’ censure that they should be judged troublers of souls, liars and false teachers, as they are judged to be, Acts 15:24, would dissemble?… For there be but two ways of working on the mind to drive men to be of another opinion, one by fear either of shame, reproach or censures civil or ecclesiastical, another by mere teaching and instructing.</p></blockquote>

cclesiastical%2C%20another%20by%20mere%20teaching%20and%20instructing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8eff3a887a" data-kw="">
<blockquote><p>Answer:

1. We owe to equals, to Mahomet, conditional and cautionary faith and obedience; thus, I believe what Mahomet says, so he speak God’s Word; yea, so Samaritans who worshipped they knew not what (Jn. 4:26) gave faith to their teachers in a blind way, so they speak according to God’s Word.

2. It follows in no sort, if rulers are only to be obeyed when they bring God’s Word, that then they are no more to be obeyed than equals and inferiors, because there is a double obedience, one of conscience, and [one] objective, coming from the thing commanded; And in respect of this, the Word has no less authority, and does no less challenge obedience of conscience, and objective, when my equal speaks it in a private way, yea, when I write it in my muse, than when a pastor speaks it by public authority; For we teach against Papists that the Word borrows no authority from men, nor is it with certainty of faith to be received as the Word of man, but as indeed the Word of God, as the Scripture says:

1. There is another obedience-official, which is also obedience of conscience, because the Fifth Commandment enjoins it. Yet not obedience of conscience coming from the particular [positive aspect] commanded in human laws, as human; so I owe obedience of subjection, and submission of affection, of fear, love, honor, respect, by virtue of the Fifth Commandment to rulers when they command according to God’s Word, and this I owe not to equals or inferiors; and so it follows not that the power of rulers and synods is titular, because they must warrant their mandates from the Word… But 3. That I owe no more objective subjection of conscience to this, ‘Thou shalt not murder’, ‘Believe in Jesus Christ,’ when rulers and pastors command them, than when I read them in God’s Word… …whether public or private person, adds not any intrinsical authority to the Word, for then the Word should be more or less God’s Word, as the bearers were public, or private, more or less worthy. As God’s Word spoken by Amos, a prophet, should not be a word of such intrinsical authority as spoken by Moses, both a prince and a prophet. 4. …and there is reason that synods and pastors, should rather promulgate God’s laws than the people:

1. Because God has given to them by office, the key of knowledge.

2. Because by office they are watchmen, and so have authority of office to hear the Law at God’s mouth, and in synods to give directories or canons according to that Word, which people have not, and that their canons must be according to God’s Word, is said in the Word, Neh. 10:32, “Also we made ordinances for us… (v. 34) as it is written in the law of the Lord.</p></blockquote>

<blockquote><p>Fourth, there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, vol. 1, Edinburgh, 1868, p. 243</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Fourth, there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.”

— James Bannerman, The Church of Christ, vol. 1, Edinburgh, 1868, p. 243">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFourth%2C+there+is+yet+another+concession+which+it+is+necessary+to+make+in+regard+to+this+matter%2C+and+which+it+is+of+some+importance+to+note%3B+and+it+is+this%2C+that+the+mere+resistance+to+authority+as+authority+alone%2C+ought+not+to+be+made+a+ground+for+Church+censure+or+punishment%2C+when+there+is+no+moral+or+spiritual+offence+connected+with+the+resistance.+Of+course+resistance+to+authority%2C+even+when+that+authority+is+put+forth%2C+as+it+sometimes+may+and+must+be%2C+in+enforcing+a+thing+indifferent%2C+may+yet+be+associated+with+moral+guilt+on+the+part+of+those+who+indulge+in+it.+Such+resistance+may+arise+out+of+feelings+of+hatred+to+all+restraint%2C+or+opposition+of+a+malignant+kind+to+all+authority%3B+it+may+become+contumacy%2C+and+as+such+involve+moral+blame.+But+until+resistance+to+authority+becomes+in+one+way+or+other+morally+wrong%2C+when+the+consent+of+the+members+to+the+act+or+deed+of+the+rulers+is+withheld+from+no+cause+in+itself+sinful%2C+such+want+of+consent+or+concurrence+ought+to+be+dealt+with+on+the+principle+of+forbearance+in+things+indifferent%2C+and+not+be+visited+with+censure+or+penalty+of+an+ecclesiastical+kind.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%2C+vol.+1%2C+Edinburgh%2C+1868%2C+p.+243&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcbecbbb5dc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cbecbbb5dc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-guilt-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=Fourth%2C%20there%20is%20yet%20another%20concession,or%20penalty%20of%20an%20ecclesiastical%20kind&amp;text=Fourth%2C%20there%20is%20yet%20another%20concession%20which%20it&amp;text=with%20censure%20or%20penalty%20of%20an%20ecclesiastical%20kind" rel="noopener" target="_b

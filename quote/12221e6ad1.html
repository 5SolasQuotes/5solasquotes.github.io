<main class="wrap"><figure class="quote" id="q-12221e6ad1" data-kw="">
<blockquote><p>2. The law-fear upon a believer is conditional, and not absolute, as he fears hell and falling away, jure, as his deserving, if God should enter in judgment with him, and if he were not in Christ. But he is obliged to a Gospel-faith which lays hold on Christ, righteousness, and deliverance from condemnation; and if Christ and interest in Him be hid from him, and nothing on but law-fear, that is a trial, not a duty of law-fear. (So the faith of Joseph and Mary, that Christ their son shall be great, shall sit in the throne of David his father and shall reign over the house of Jacob forever, Lk. 1:32-33, did well consist with that holy and obediential fear of fleeing into Egypt, for fear that Herod should murdher that hopeful young King in his cradle, Mt. 2) But there is a godly law-fear, or a Gospel-law-fear, which is a godly horror conditional for that which is never to be inflicted, but yet according to deserving may be inflicted; and this is the terror of the Lord, which breeds Gospel persuasion, 2 Cor. 5:11, and so may well stand with Gospel-faith and assurance of deliverance from falling away and of being stablished and confirmed to the end. As a child in the father’s arm threatened to be cast over a sharp rock in the sea, may have horror and fear and cry out for fear, and yet believe so his father’s compassion as he will not through him in the sea, because the threatening is ordained not to be exercised, but that the child may so much the more thrust his arms about his father’s neck.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh: Anderson, 1655), pt. 1, ch. 27, p. 218</span></figcaption>

</figure><figure class="quote" id="q-62ee3c0aac" data-kw="">
<blockquote><p>Yea a conditional covenant agreed unto and accepted, is a covenant, if we shall (as in reason we ought) distinguish between a covenant, in its essence and nature, and a covenant broken or fulfilled. A covenant or threatening is a covenant and threatening obliging Adam, if it shall be agreed unto by silence, as Adam accepted the threatening, Gen. 2:17, by silence; and professors within the visible church, by their professing of the doctrine of the Gospel or covenant of grace, their receiving of the seals and professed hearing of the word, are under the covenant of grace, and engage themselves to obey commands, promises, threatenings; and therefore promises are as properly made to them, Acts 2:39, as commands, and threatenings, exhortations, invitations, and Gospel requests are made to them. But though the Anabaptists ignorantly confound the promise and the thing promised, the covenant and benefits covenanted: the promise is to you, and so are the commands and threatenings, whether ye believe or not; the command is to you, and lays an obligation on you, whether ye obey or obey not, and the threatenings are to you, whether ye transgress or transgress not. It is true indeed, the promise, that is, the blessing promised, righteousness and eternal life, is not given to you until ye first believe.</p></blockquote>

</figure><figure class="quote" id="q-54ffb40b2d" data-kw="">
<blockquote><p>Now these members combining themselves into one body as they are such, do make or rather are actually a true visible church, one integral body, not continued but by aggregation… Further, this integral body for the well-being of it in exercising those operations which belong unto it and whereunto it serves, must become as we say organical, having members of diverse ranks, some as head, mouth and eyes, the pastor, teachers, and elders, some as hands, the deacons and helpers: whereupon arises another relation and form of accidental perfection, in state of government: which is complete or incomplete, freely exercising the power granted by Christ to his church, or else restrained or defective therein.</p></blockquote>

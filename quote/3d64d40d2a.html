<main class="wrap"><figure class="quote" id="q-3d64d40d2a" data-kw="">
<blockquote><p>As the Head of his Church, Christ is its source of spiritual influence. In him, for the use of his Church, the Spirit dwells in immeasurable degree. For the “Father giveth not the Spirit by measure unto his Son.” It has thus pleased the Father, that in him all fulness should dwell; and the conclusion is clear — Out of his fulness may we all receive, even grace upon grace. Oh, it was no scanty supply of the Spirit Christ ensured for his Church. There is no risk of soon draining this fountain dry. Believe it, it is inexhaustible. Hither may you repair, and drink of the water of life as largely as your finite capacities will admit of, and yet leave it undiminished.

Mark well, for it is important, the encouragement afforded us by the death of Christ to expect free and full communications of the Holy Spirit. Had Christ not died, the Spirit could in no degree — not even in the smallest —have been sent forth to enlighten, and sanctify, and save; for the justice of God, unpropitiated and unappeased, would have stood immoveably in the way of this. But now Christ having died, and justice being satisfied, and every obstacle on God’s part removed, what hinders that the Spirit be now shed forth through Christ, and that not grudgingly and sparingly, but cheerfully and abundantly?

It is now not merely consistent with the Divine character that the Spirit may be obtained. The glory of the Divine character requires that what Christ died for be accomplished — that what he purchased be bestowed. To imagine that Christ has obtained by his death only a small measure of spiritual influence for the Church, is virtually to detract from the merit and efficacy of his death. To go to God with doubting, confused, straitened desires for the Spirit, is virtually to deny that the Spirit is the purchase of Christ for his Church, and to insinuate that something yet remains to be done to entitle us to receive him, at least so fully as we need.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-l-r-foote.html">Alexander L. R. Foote</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of the Lord not Straitened in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e568ece11d" data-kw="">
<blockquote><p>Christ, as God the Son, is of one substance, power, and eternity with God the Holy Spirit. Christ also, as the Son of man, had the Spirit bestowed on him without measure. His human nature was formed, in body and soul, and sanctified from the first, by the special operation of the Spirit. He was anointed with the immeasurable plenitude of the Spirit. By the light of the Spirit, the Man Christ Jesus thought all his thoughts; by the grace of the Spirit, willed all his purposes; by the strength of the Spirit wrought all his works; till finally he, “through the eternal Spirit, offered himself without spot to God,” thereafter rising from the dead by the Spirit of holiness, and ascending to pour out that Spirit of truth and consolations which he had promised so graciously to his disciples. In his Godhead, our Lord is one with the Spirit; and as man, – by the Spirit he was what he was.

When Christ, therefore, sends his Spirit, not to speak of himself, but to take of what is Christ’s and show it unto us; to create us again in Christ and like Christ; to dwell in us as in a living temple, as ourselves living spirits to which he has given a new and Christ-like life; – can we fail to see that there is something here which in no respect falls short even of the great marvel of our text, “Christ living in us?” Christ, the eternal Son, liveth in us, when the Spirit liveth in us; for the Spirit and the Son with the Father are inseparable in their joint possession of the all-fulness of the Godhead. And Christ, as God-man, the Son of man, the very Christ that tabernacled with men upon the earth, liveth in us, when the Spirit living in us confines himself to revealing Christ as the God-man, whose glory his disciples saw in human flesh, as the glory of the Only-begotten of the Father, full of grace and truth.

It is as the agent and ambassador of the God-man that the Spirit is given in the Church; it is the God-man whom the Spirit reveals and glorifies in the Church; it is within the limits of what he himself revealed and wrought in the God-man that he restricts himself in working in the Church or body of the faithful. He lives in them as he lived in him. He works to reveal in them progressively the truth which he implanted and developed in unclouded spiritual splendour in the mind of the Man Christ Jesus; to establish in them progressively the grace with which he replenished the heart of the Man Christ Jesus; – to conform them, in a word, to the “Firstborn of many brethren.” And how then can his in-dwelling, in-working, in-living in them be other than most adequately expressed by the doctrine that “Christ liveth in them?”

Christ, by his Spirit, liveth in them. By his Spirit he quickens them to new and spiritual life; and by his Spirit he takes possession of them as his living temple. As a living temple, he always regards them and acts in them. Their faculties as living men-alive from the dead-he animates and controls. Whatever in their thoughts, affections, purposes, actions, is opposed to his own, he sets himself to suppress; and the faculties themselves he undertakes to sanctify, – to form, and mould, and guide into harmony with his own. Nay; their whole character, their very natures, as living men, – spiritually living, he works by his Spirit to assimilate unto his own.

So far as this work advances, the very thoughts that he thinks they think; the affections he entertains they entertain; the purposes of his mind are theirs also; his work is their work; his nature theirs. And up to the limit to which this blessed result has in its onward progress been achieved, how can a better, a briefer, a more perfect expression be found for it, than to say that, to this extent, “Christ liveth in them?” It is, then, literally, profoundly true that Christ liveth in his people. He liveth in them by his Spirit which he hath given them.</p></blockquote>

</figure><figure class="quote" id="q-bc59f70763" data-kw="">
<blockquote><p>See hence the true spring of reformation in a church or land, and the true spring also of defection and backsliding. Why, when the Spirit of the Lord erects the kingdom of God within, especially in the hearts of magistrates or ministers, men of power and influence; then reformation work goes on apace, men then put to their hands heartily to the building up of Zion; every one then is ready to lend a lift to help up with the Head-stone of the corner. But when the kingdom of God is not within, men lose heart and hand to the work of the Lord, and fall a-work to daub with carnal wisdom and policy, which quite spoils and mars the building, instead of furthering it. What was it that made parliaments, and assemblies, and people of all ranks go so clean to work about the year 1638, and the year that followed it, to advance a work of reformation, and to engage themselves by solemn covenant to maintain it? And what makes the work go on so slowly now? Why, if folk, especially men of influence and power, had the kingdom of God within them, which, alas is much wanting now-a-days, otherwise there would not be so much daubing with untempered mortar as there is. O Sirs, if ever ye would see the Lord’s work thrive again in the land, pray that the foundation of the work by setting up his kingdom in the heart of kings, nobles, gentry, ministers, elders, and all ranks of people in the land; and then the hearts of the children will be turned to their fathers, and we may expect to see the church of Christ in this land, “looking forth as the morning, fair as the moon, clear as the sun, and terrible as an army with banners,” Cant. vi. 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fourth sermon on Luke 17:21 in The works of Ebenezer Erskine</cite></span></figcaption>

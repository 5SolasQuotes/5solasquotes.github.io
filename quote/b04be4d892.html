<main class="wrap"><figure class="quote" id="q-b04be4d892" data-kw="">
<blockquote><p>The will of God is this, that he alone should be the teacher. And I intend to be taught by him and not by men, that is, in respect of doctrine: for in respect of sin and disobedience I will be subject to all. For it is not for us to sit in judgment on Scripture and divine truth, but to let God do his work in and through it, for it is something which we can learn only of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Clarity and Certainty of the Word of God</cite>, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6165730314" data-kw="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

</figure><figure class="quote" id="q-da71c1ee94" data-kw="">
<blockquote><p>That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ch. 1, §§ 9–10</span></figcaption>

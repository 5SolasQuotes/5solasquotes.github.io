<main class="wrap"><figure class="quote" id="q-fb228d71e6" data-kw="">
<blockquote><p>That the tender of the gospel to the conversion of sinners, is absolutely free (John 3:14–15; 1:12; Isa. 55:1; John 7:37), no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the law, or preceding ministry of the law, but only and alone the naked soul, as a sinner and ungodly to receive Christ (1 Tim. 1:15; Rom. 4:5; 5:8), as crucified, dead, and buried, and risen again, being made a prince and a Savior for such sinners (Acts 5:30–31; 2:36; 1 Cor. 1:22–24).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a> › <a href="../topics/the-covenant-of-grace/the-gospel-offer/free-offer.html">Free offer</a></span><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying and Drawing Sinners to Himself</cite>, London, 1647, p. 532</span></figcaption>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

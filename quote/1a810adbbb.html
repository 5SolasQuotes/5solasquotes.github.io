<main class="wrap"><figure class="quote" id="q-1a810adbbb" data-kw="">
<blockquote><p>Finally Bavinck comes to the controversial topic of women voting for office bearers in the church. He begins this discussion with an overview of where things stand: he notes that there are many churches in America, Australia, Denmark, Norway, Iceland, and Switzerland where women vote. He points out that it was discussed and defended in the Netherlands as early as 1898 by Abraham Kuyper, as well as by pastors A.D.C Kok and C. Lindeboom. Bavinck notes that the issue did not seem to be a pressing one in the Netherlands of his day. Unlike in other countries, men were actively involved in Dutch church life and there didn’t seem to be any desire to have women voting for office bearers. He writes that, with such indifference, it would be foolish to press the issue. However, he notes that if we discuss it in principle, “there is little ground to condemn it.” Bavinck argues that women are equal members of the church with men. They have just as much an interest in having good office bearers as the men do. Because of their nature as women, they tend to actually have quite a great deal of interest in religious matters. Moreover, there are large numbers of widows, women married to “religiously indifferent men,” or women married to men who belong to another church. Without being able to vote, such women are all stripped of the opportunity to have an influence on church life. Bavinck strengthens his argument by noting that while women under the authority of their husbands in the home, as church members they receive the same benefits and should receive the same rights. He notes that young male communicant members who still live with their parents are subordinate to those parents, but yet they have the right to vote. This is unfair. Bavinck says the injustice becomes worse because women are allowed to raise objections to the election of an office bearer – yet they cannot vote. Then he notes that the vote in the church is not an exercise of power. The congregation only points out its preferences for office bearers; the consistory is responsible to call and appoint. He maintains that there is only one objection with any weight: if women can vote in the church, it will not be long before the church will be forced to have women standing as candidates. In other words, women’s voting will lead to women’s ordination. But Bavinck notes that this is an argument from fear. It is an argument that often persuades fearful minds concerned about novelties in the church. However, he points out, if the Scriptures are so strong that women may not serve as office bearers, then we have nothing to fear. The clarity of the Bible should prevent any such development. He then points out that it’s not unusual for people to be able to vote and not be able to stand as a candidate. One does not follow from the other. The requirements for eligibility to vote are often different from the eligibility requirements to stand as a candidate. In the Dutch situation of his time, a public servant, clergyman or teacher was not allowed to be a candidate in a city council election. Writes Bavinck, “Thus eligibility to any office in Scripture is bound by certain requirements, 1 Timothy 3; but no such limits are placed on the power to vote.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wes Bredenhof, ‘Herman Bavinck on Women in the Church’</cite>, (2021)</span></figcaption>

</figure><figure class="quote" id="q-10d875f233" data-kw="">
<blockquote><p>If Paul is not referring to the wives of elders and deacons, and is not referring to women deacons in the same office as men deacons, then… The most logical and natural alternative would be to regard ‘women’ as referring to the servant-widow class that assists the deacons by ministering to the needs of women. [Hendricksen:] ‘… he regards these women as the deacons’ assistants in helping the poor and needy, etc. These are women who render auxiliary service, performing ministries for which women are better adapted…’… The interpretation of 1 Timothy 3:11 as referring to ‘women’ who assist the deacons who belong to the order of widows described in 1 Timothy 5:9ff. is also exegetically superior to the ‘women in the same office’ view when the broader contextual matters are considered.</p></blockquote>

<blockquote><p>Because bishop and presbyter are everywhere in Scripture taken for one and the same (so that the difference is only in the name, not in the thing—bishop, with regard to his office and function; presbyter, with regard to his age and dignity), the same characters and the same functions are ascribed to both.</p></blockquote>

</figure><figure class="quote" id="q-acd0b817f0" data-kw="">
<blockquote><p>Nor are women, sons, servants, debarred from voicing in election because it is a Church-power, for it is no power of jurisdiction. For: 1. Their tacit [understood or implied without being stated] voices and consents are not excluded, because they must try the spirits, and not upon trust and fide implicita [implicit faith] believe every teacher more than men, or believe as the Church believes, more than their husbands, nor must they take doctrines as truth upon their husband’s word; nor are women so excluded from speaking in the Church as [that] they may upon no occasion: confess their faith, 2. profess vocally repentance, 3. depose as witnesses, [or] 4. accuse the guilty before the binding Church. 4. Nor may a [civil] corporation cast out a major [an official] by an authoritative power such as binding and loosing is, Mt. 18 [that is, the power by which they do it is not of the same kind as ecclesiastical power]. 5. We seek a warrant why the votes of women in choosing their pastors must more be included in the votes of the male than their being essential parts of the redeemed Church is included in the males, or their confessing publicly that Jesus is the Christ, as many women martyrs and sons and servants have gloriously done; and yet their confession of Christ to the death must be personal, and not included in the confession of husband or parents, as Mt. 10:32.</p></blockquote>

— Samuel Rutherford, A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658), p. 257">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNor+are+women%2C+sons%2C+servants%2C+debarred+from+voicing+in+election+because+it+is+a+Church-power%2C+for+it+is+no+power+of+jurisdiction.+For%3A+1.+Their+tacit+%5Bunderstood+or+implied+without+being+stated%5D+voices+and+consents+are+not+excluded%2C+because+they+must+try+the+spirits%2C+and+not+upon+trust+and+fide+implicita+%5Bimplicit+faith%5D+believe+every+teacher+more+than+men%2C+or+believe+as+the+Church+believes%2C+more+than+their+husbands%2C+nor+must+they+take+doctrines+as+truth+upon+their+husband%E2%80%99s+word%3B+nor+are+women+so+excluded+from+speaking+in+the+Church+as+%5Bthat%5D+they+may+upon+no+occasion%3A+confess+their+faith%2C+2.+profess+vocally+repentance%2C+3.+depose+as+witnesses%2C+%5Bor%5D+4.+accuse+the+guilty+before+the+binding+Church.+4.+Nor+may+a+%5Bcivil%5D+corporation+cast+out+a+major+%5Ban+official%5D+by+an+authoritative+power+such+as+binding+and+loosing+is%2C+Mt.+18+%5Bthat+is%2C+the+power+by+which+they+do+it+is+not+of+the+same+kind+as+ecclesiastical+power%5D.+5.+We+seek+a+warrant+why+the+votes+of+women+in+choosing+their+pastors+must+more+be+included+in+the+votes+of+the+male+than+their+being+essential+parts+of+the+redeemed+Church+is+included+in+the+males%2C+or+their+confessing+publicly+that+Jesus+is+the+Christ%2C+as+many+women+martyrs+and+sons+and+servants+have+gloriously+done%3B+and+yet+their+confession+of+Christ+to+the+death+must+be+personal%2C+and+not+included+in+the+confession+of+husband+or+parents%2C+as+Mt.+10%3A32.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church+Discipline+Penned+by+Mr.+Thomas+Hooker%E2%80%A6+%28London%2C+1658%29%2C+p.+257&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facd0b817f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../q

<main class="wrap"><figure class="quote" id="q-da5932d3cd" data-kw="">
<blockquote><p>And 1. as to the [Lutheran] dogma of [the] ubiquity [of Christ’s human nature], I plainly think that the opinion of certain most learned theologians should be acceded to, I mean the most learned [Jerome] Zanchi, and our most famous theologians [Richard] Hooker and [Richard] Field, who having diligently weighed the arguments agitated hither and thither in this controversy, think that the German theologians who are and were assertors of ubiquity, although they use unaccustomed, hard, doubtful, and indeed dangerous forms of speaking, yet never thought that the body of Christ, according to its natural being, is immense, infinite, uncircumscribed, illocal; but only according to its personal being, inasmuch as no place can be given where the body of Christ is not personally united to the word. For since the human nature of Christ is a created nature, it is necessary that it be finite. And since that nature of itself has no existence, but being assumed by the Word to the very subsistence of the Word, it cannot be denied that it has an infinite subsistence, and subsists in an incomprehensible and unlimited manner, and consequently everywhere. It can also be added what the most famous Hooker observed, that the humanity of Christ can be said to be present everywhere not only on account of the inseparable conjunction with the Word, but also according to the universal cooperation with the Word, and from both of these arises the infinite and perpetual efficacy of the immolated body of Christ, which is infinitely applicable to subject bodies, that is, to true believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Determinations, ‘The Reformed Churches do not Dissent in the Fundamentals of the Faith’ in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2739734a58" data-kw="">
<blockquote><p>Christ was not simply man, but a man, not simply human nature, but a human being. But this man, this human being, had a personal subsistance in a divine person.</p></blockquote>

</figure><figure class="quote" id="q-c7dd641c04" data-kw="">
<blockquote><p>How then was the human nature taken? Surely, it was so taken into unity of the same person, that yet it is not made the very person: but rather exists in the person, is born and sustained of the person, and ever depends wholly upon the same.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

— Jerome Zanchi, H. Zanchius his Confession of Christian Religion… (Cambridge, 1599) | Observations of the Same Zanchius upon his Own Confession, 12th Aphorism, p. 286">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHow+then+was+the+human+nature+taken%3F+Surely%2C+it+was+so+taken+into+unity+of+the+same+person%2C+that+yet+it+is+not+made+the+very+person%3A+but+rather+exists+in+the+person%2C+is+born+and+sustained+of+the+person%2C+and+ever+depends+wholly+upon+the+same.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+H.+Zanchius+his+Confession+of+Christian+Religion%E2%80%A6+%28Cambridge%2C+1599%29+%7C+Observations+of+the+Same+Zanchius+upon+his+Own+Confession%2C+12th+Aphorism%2C+p.+286&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7dd641c04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7dd641c04.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=How%20then%20was%20the%20human%20nature,ever%20depends%20wholly%20upon%20the%20same&amp;text=How%20then%20was%20the%20human%20nature%20taken%3F%20Surely&amp;text=person%2C%20and%20ever%20depends%20wholly%20upon%20the%20same" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d69043c73c" data-kw="">
<blockquote><p>The humanity taken up into the personality of the Logos is, then, not a personal man but human nature without personal subsistence, yet thought of in its full spirit-body essentiality and individuality. This is why in the incarnation of the Logos it was not a new third thing that arose by the union of the divine and human natures. It was the human finite mode of being that was added to the eternal and infinite mode of being of the Logos, by the human nature being taken up into His personal subsistence. The Logos thus exists alike without and within the humanity of Christ. The Logos is still pre-existent, the Trinity is still complete. Christ’s human nature had hypostatic subsistence only by its being taken up into the hypostasis of the Logos. …For the truth of the human nature is to be measured ‘by its matter, form and essential attributes’, and not ‘by its personality’. Christ’s humanity is therefore to be regarded as a man not suppositaliter but specifically.–Maresius (IX, 23) expresses himself in exactly similar terms. Hence Christ’s humanity is of course an individuum, an exposition of human nature in individual form. It has real existence only in the person of the Logos, not in itself.–Zanchius (De incarnat. Filii Dei, p. 152ff.): ‘As a most perfect entity existent per se [through itself] the person of the Son of God drew to itself a rather imperfect entity, lacking any subsistence of its own to make it self-existent.’ The moment therefore ‘the Son of God assumed a true body with a true human soul, together with all the essential and natural attributes of both, and the defects as well, he is not therefore to be said to have assumed either a persona or an huphistamenon [a susbsisting person], but–a nature en atomo, i.e. existing in a fixed individuum, which however has never existed anywhere of itself except in the assumer.’ [so Zanchi] Keckermann 315: ‘(Christ’s human nature is) an individuum distinct from the divine nature, though not a distinct person. Concerning this thought we must first of all think accurately that person differs from nature, and so an individuum from a person, yet so that the human nature is not a person, but is meanwhile an individuum, or as the Logicians say, a first substance. But some one may say: Every substantial individuum subsists per se; if therefore considered by itself Christ’s human nature is an individuum, it therefore subsists per se. Answer: Subsistence per se is sometimes opposed to what subsists in something else, and so human nature generally subsists per se, because it is a substance and not an accident, the property of which is to exist in something else. But if subsistence per se means the same as separate subsistence, outside the union and support of a second things, then it is false to say that the human nature subsists per se. It is sustained by the Logos to which it is united, so that apart from it it could not exist for a moment.’ So it must be said (Alsted 517) that: ‘He assumed not a person but a nature, and it considered as an individuum. The reason for the former statement is that Christ’s human nature never subsisted per se but has always been an instrument enupostaton en to logo.’ So the Incarnation is not to be regarded as though by union of two different essences a new third one had arisen, but in such wise that the human mode of being was added to the eternal mode of the Logos by the assumption of the human nature into its personality without altering the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, (Wipf &amp; Stock), ‘The Mediator of the Covenant of Grace’, section 7, pp. 416-18. Heppe was in the 1800’s.</span></figcaption>

herefore+to+be+said+to+have+assumed+either+a+persona+or+an+huphistamenon+%5Ba+susbsisting+person%5D%2C+but%E2%80%93a+nature+en+atomo%2C+i.e.+existing+in+a+fixed+individuum%2C+which+however+has+never+existed+anywhere+of+itself+except+in+the+assumer.%E2%80%99+%5Bso+Zanchi%5D+Keckermann+315%3A+%E2%80%98%28Christ%E2%80%99s+human+nature+is%29+an+individuum+distinct+from+the+divine+nature%2C+though+not+a+distinct+person.+Concerning+this+thought+we+must+first+of+all+think+accurately+that+person+differs+from+nature%2C+and+so+an+individuum+from+a+person%2C+yet+so+that+the+human+nature+is+not+a+person%2C+but+is+meanwhile+an+individuum%2C+or+as+the+Logicians+say%2C+a+first+substance.+But+some+one+may+say%3A+Every+substantial+individuum+subsists+per+se%3B+if+therefore+considered+by+itself+Christ%E2%80%99s+human+nature+is+an+individuum%2C+it+therefore+subsists+per+se.+Answer%3A+Subsistence+per+se+is+sometimes+opposed+to+what+subsists+in+something+else%2C+and+so+human+nature+generally+subsists+per+se%2C+because+it+is+a+substance+and+not+an+accident%2C+the+property+of+which+is+to+exist+in+something+else.+But+if+subsistence+per+se+means+the+same+as+separate+subsistence%2C+outside+the+union+and+support+of+a+second+things%2C+then+it+is+false+to+say+that+the+human+nature+subsists+per+se.+It+is+sustained+by+the+Logos+to+which+it+is+united%2C+so+that+apart+from+it+it+could+not+exist+for+a+moment.%E2%80%99+So+it+must+be+said+%28Alsted+517%29+that%3A+%E2%80%98He+assumed+not+a+person+but+a+nature%2C+and+it+considered+as+an+individuum.+The+reason+for+the+former+statement+is+that+Christ%E2%80%99s+human+nature+never+subsisted+per+se+but+has+always+been+an+instrument+enupostaton+en+to+logo.%E2%80%99+So+the+Incarnation+is+not+to+be+regarded+as+though+by+union+of+two+different+essences+a+new+third+one+had+arisen%2C+but+in+such+wise+that+the+human+mode+of+being+was+added+to+the+eternal+mode+of+the+Logos+by+the+assumption+of+the+human+nature+into+its+personality+without+altering+the+latter.%E2%80% <blockquote><p>§V. This Son was made man. The divine person assumed a human nature, lacking its own personality (persona), not a divine nature assuming a human nature or person, nor a person assuming a person. Therefore, Christ remains only one person, a divine one (1 Tim. 3:16). … §VII. This union is not a conjunction of parts, like soul and body, but an assumption of the human nature into unity with the person without change, confusion, division, or separation.</p></blockquote>

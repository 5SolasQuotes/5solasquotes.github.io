<blockquote><p>Objection [of Papists]: But the minister may mistake the matter [in assuring a person of salvation]. Answer: True, if he speak absolutely, but if he speak upon condition of faith and true repentance he may thereupon assure a man of salvation: he may say, ‘Believe thou and repent truly, and thou shalt be saved.’ If a king should publish and make known that whosoever of such a city shall come and do such a thing, shall be thus or thus rewarded, and give charge to some to make it known to that city, shall we say that any having authority to publish the king’s pleasure, does mistake the matter in so doing, or that any of that place, to whom it should be said, go thou and do that which the king has appointed, and he thereupon going, and doing the thing appointed, does presume to take on him to know more than he ought touching the king’s pleasure? Surely no.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, (London: Griffin, 1615), on Col. 2:18, p. 704</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66582792bd" data-kw="">
<blockquote><p>The second head is the will of God, who will have us justified with the alone condition of faith. The Adversary [Bellarmine] answers that it contradicts the Scripture, which lays down also the condition of repentance. Answer:

1. Repentance is the condition of faith and of the person justified, but not properly of justification.

2. It is one thing to treat of the condition of justification, but another thing of the cause and instrument thereof: for a condition notes a consequent, or effect: but a cause, the antecedent or efficient.</p></blockquote>

<blockquote><p>III. What is the cause that among the dogmatic and practical writers so many ἐναντιοφανῆ [enantiophane, apparent contradictions] occur concerning the consequent dependence, order, and succession of acts and effects of regeneration? Response: Partly that the mode of regeneration is so hidden, and many things escape us, according to that passage John 3:8; partly that the following distinctions are either not expressly observed by all, or are not applied by the reader. They are:

      1. The question concerning the order, succession, and consequent dependence of habits or first acts among themselves is one thing; and the question concerning their order and dependence compared with second acts is another. So in turn the question concerning the dependence, succession, and order of second acts among themselves is one thing; and the question concerning their order compared with first acts is another.

      2. Again, the question concerning the succession, priority, and posteriority of second acts in themselves is one thing; and the question concerning the succession of the same καθ’ ἡμᾶς [kath’ hēmas, according to us], or in our sense, is another. So, for example, the second act of faith, which really precedes the second acts of true grief according to God, of desire for grace, and other such motions of repentance, is in our sense and καθ’ ἡμᾶς regarded as posterior, and thus is mostly placed by the Practical writers. The reason is that those initial acts of faith (which may be called first and primary, unformed, incomplete motions) are so obscure and insensible that they are not perceived or regarded as acts of faith in that haste, in those ὠδῖνες [ōdines, birth pangs] of spiritual birth—although those now completely converted in the second act, and more and more often by the renewed practice of repentance and faith, reading back through the traces and recalling to memory that whole change of the right hand of the Most High, seem to themselves with some mental and as it were twilight evidence and diminished perspicacity to see and observe in that disturbance and commotion the mode, order, leading, and discordant concord of those affections and acts (of hope and despair, joy and grief, fear and confidence, accusation and apology, credulity and doubt, etc., 2 Corinthians 7:11; Romans 7:8–9), and their mutual dependence, promotion, impulse, and excitation—which, however, then when those things were happening they could not distinctly see or judge with certain and resolved knowledge. Not otherwise than a man, thinking back after a disease or its paroxysm, better judges concerning the state of the disease and its various affections and concomitants. But that Practical writers do not count or scarcely count those unformed, incomplete, and insensible motions of faith (which precede, accompany, and follow the acts of grief, desire, etc., and ἀχωρίστως [achōristōs, inseparably] intermingle themselves with them) among the acts of faith is not surprising. For it happens to them nearly as to physicists, who do not reckon insensible motion or impulse among motions. In the same way astronomers call the solstice the progress of the sun insensible to us. Finally, the question concerning the order of first or second acts in nature, or as to essence, is one thing; and the question concerning their order in time, or as to existence, is another. We think these distinctions have their use for explaining and reconciling many things in this matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-00de4c06dd" data-kw="">
<blockquote><p>And what needs it also that we should speak of the power of prayer, by which we, with the publican, and all other pious persons, do humbly beg from God pardon of our sins, in order to obtain the same, having been so taught by our Savior Himself, ‘Forgive us our sins,’ or of that of other previous acts–since the matter is clearer than the noon-day sun. Nor does this interfere with our being justified gratis, as the Scripture teaches, for in these we put nothing at all of merit, any more than in faith itself… Amandus Polanus, a writer rigid in other respects, yet compelled by the force of truth, lays down this thesis, as the universal opinion of all Protestants, and very agreeable to the teaching of the Fathers. ‘By repentance, confession, prayers, and tears, proceeding from faith, we obtain forgiveness of sins, but we do not, properly speaking, merit it; and therefore we obtain forgiveness of sins, not by the merit of our penitence and prayer, but by the mercy and benignity of God.’ (Catholic Symphony, ch. 27, On the Remission of Sins, p. 951 ff., thesis 2) Which thesis, after a sufficiently sound elucidation, he confirms by some very clear testimonies of the Fathers, to which we could add numberless others, were not the thing itself most clear and certain. Would that all Protestants constantly professed this opinion, thus enunciated by Polanus: for there would remain scarce any matter for controversy regarding this article among the more right-thinking of both sides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 31</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And what needs it also that we should speak of the power of prayer, by which we, with the publican, and all other pious persons, do humbly beg from God pardon of our sins, in order to obtain the same, having been so taught by our Savior Himself, ‘Forgive us our sins,’ or of that of other previous acts–since the matter is clearer than the noon-day sun. Nor does this interfere with our being justified gratis, as the Scripture teaches, for in these we put nothing at all of merit, any more than in faith itself… Amandus Polanus, a writer rigid in other respects, yet compelled by the force of truth, lays down this thesis, as the universal opinion of all Protestants, and very agreeable to the teaching of the Fathers. ‘By repentance, confession, prayers, and tears, proceeding from faith, we obtain forgiveness of sins, but we do not, properly speaking, merit it; and therefore we obtain forgiveness of sins, not by the merit of our penitence and prayer, but by the mercy and benignity of God.’ (Catholic Symphony, ch. 27, On the Remission of Sins, p. 951 ff., thesis 2) Which thesis, after a sufficiently sound elucidation, he confirms by some very clear testimonies of the Fathers, to which we could add numberless others, were not the thing itself most clear and certain. Would that all Protestants constantly professed this opinion, thus enunciated by Polanus: for there would remain scarce any matter for controversy regarding this article among the more right-thinking of both sides.”

— William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+what+needs+it+also+that+we+should+speak+of+the+power+of+prayer%2C+by+which+we%2C+with+the+publican%2C+and+all+other+pious+persons%2C+do+humbly+beg+from+God+pardon+of+our+sins%2C+in+order+to+obtain+the+same%2C+having+been+so+taught+by+our+Savior+Himself%2C+%E2%80%98Forgive+us+our+sins%2C%E2%80%99+or+of+that+of+other+previous+acts%E2%80%93since+the+matter+is+clearer+than+the+noon-day+sun.+Nor+does+this+interfere+with+our+being+justified+gratis%2C+as+the+Scripture+teaches%2C+for+in+these+we+put+nothing+at+all+of+merit%2C+any+more+than+in+faith+itself%E2%80%A6+Amandus+Polanus%2C+a+writer+rigid+in+other+respects%2C+yet+compelled+by+the+force+of+truth%2C+lays+down+this+thesis%2C+as+the+universal+opinion+of+all+Protestants%2C+and+very+agreeable+to+the+teaching+of+the+Fathers.+%E2%80%98By+repentance%2C+confession%2C+prayers%2C+and+tears%2C+proceeding+from+faith%2C+we+obtain+forgiveness+of+sins%2C+but+we+do+not%2C+properly+speaking%2C+merit+it%3B+and+therefore+we+obtain+forgiveness+of+sins%2C+not+by+the+merit+of+our+penitence+and+prayer%2C+but+by+the+mercy+and+benignity+of+God.%E2%80%99+%28Catholic+Symphony%2C+ch.+27%2C+On+the+Remission+of+Sins%2C+p.+951+ff.%2C+thesis+2%29+Which+thesis%2C+after+a+sufficiently+sound+elucidation%2C+he+confirms+by+some+very+clear+testimonies+of+the+Fathers%2C+to+which+we+could+add+numberless+others%2C+were+not+the+thing+itself+most+clear+and+certain.+Would+that+all+Protestants+constantly+professed+this+opinion%2C+thus+enunciated+by+Polanus%3A+for+there+would+remain+scarce+any+matter+for+controversy+regarding+this+article+among+the+more+right-thinking+of+both+sides.%E2%80%9D%0A%0A%E2%80%94+William+Forbes%2C+Considerationes+Modestae+et+Pacificae+Controversiarum+de+Justificatione...+4th+ed.+%28d.+1634%3

<main class="wrap"><figure class="quote" id="q-b0723d8425" data-kw="">
<blockquote><p>V. 3… this being the first violation of the law newly given, and committed by those who should have been the strictest observers and assertors of it, did deserve a very severe punishment.” … V. 12… Moses repeats and reinforces the former command… partly to encourage them to go on in their holy services and not to be dejected for the late severity, as if God would no more accept them or their sacrifices. … V. 16. ‘The goat of the sin-offering,’… which he [Moses] inquired into more than into the other sacrifices, because a mistake there was easy and probable, because that matter might seem something doubtful, by reason of two laws concerning it seemingly contrary, the one Lev. 4:21, where it is to be burned, the other Lev. 6:26, where it was to be eaten. But they are thus reconciled: It was to be burnt when the blood of this sacrifice was brought into the holy place, Lev. 4:16, 17; and when that was not done, which Aaron this first time could not do, for the reason expressed in Lev. 10:18, it was to be eaten, and here lay their mistake… he spares Aaron at this time, as overwhelmed with sorrow, and because the rebuking of him before his sons might have exposed him to some contempt. … V.

19. ‘This day have they offered;’ they have done the substance of the thing though they have mistaken this one circumstance. ‘Such things have befallen me;’ whereby, having been oppressed with grief, and almost bereft of my reason, it is not strange nor unpardonable if I have mistaken. ‘Should it have been accepted?’ because it was not to be eaten with sorrow, but with rejoicing and thanksgiving, as appears from Dt. 12:7; Dt. 26:14; Hos. 9:4; and I thought it fitter to burn it, as I did other sacred relics, than to profane it by eating it unworthily. V.

20. He [Moses] rested satisfied with his answer, either because he thought it reasonable, seeing the letter of the law ofttimes yields to necessities or great accidents, 2 Chron. 30:18; Mt. 12:3,Mt. 12:4; or at least because the things alleged were mitigations of his fault, and he would not add affliction to the afflicted, but rather defer the debate of it to a fitter opportunity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations, on Lev</cite>, 10</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad2710556d" data-kw="">
<blockquote><p>This may move us to embrace integrity and sincerity, because the Lord so highly esteems it, that He accepts of our obedience as perfect which springs from it, though it be stained with much corruption, and joined with many imperfections. …those are said to have been perfect before God who in simplicity and uprightness of heart laboured after perfection, and served God in sincerity and truth, as Noah, Abraham, Job, David, Asa, Zachary and Elizabeth, though they had many corruptions and imperfections which in the Scriptures are recorded of them… And therefore David uses his sincerity in praying, as an argument to persuade the Lord to give him audience: ‘Give ear’ (says he) ‘unto my prayers, which go not out of feigned lips.’ (Ps. 17:1) And Hezekiah’s integrity of life, as a reason to move Him for the repealing of the sentence of death and prolonging of his days. ‘Remember now, O Lord,’ (says he) ‘I beseech thee, how I have walked before thee in truth, and with a perfect heart, etc.’ (Isa. 29:13)</p></blockquote>

<blockquote><p>My being present and hearing of a Conformist [minister is] no approbation of the evil of his conformity, and so no occasional or transient relation is raised thereby. Approbation is an act of the mind or heart; It is not showed to him or others by me until it be expressed outwardly by my words or gestures, which I have not in this case any occasion to do, his evil being done elsewhere and formerly, and not in our presence that now hear him.</p></blockquote>

</figure><figure class="quote" id="q-c706a32821" data-kw="">
<blockquote><p>…administration of the Lord’s Supper is a more important and necessary duty than exclusion [from it], etc. or any other part of the exercise of discipline; for it is more properly and immediately the worship of God than the exercise of discipline, as may be seen in the place before quoted out of Ames, bk. 2, [Marrow of] Theology, ch. 13, n. 17-18. God is more worshipped by the administration of the sacraments than by Church censures; the sacraments are a principal worship of God; Church censures and the exercise of discipline less principal. Now it is improbable that a less principal worship of God should be a necessary antecedent to a principal worship. There is says Rada: duplex ordo naturae; alius ordo essentialis dependendentiae; alius est ordo essentialis eminentiae et perfectionis; qualis est inter excedens, &amp; excessum. Now exclusion (and we may say the like of all other acts of discipline) is not before the Lord’s Supper in regard of the order, either of essential dependency, or of essential eminency and perfection. The Lord’s Supper has not an essential dependency upon exclusion, or any other acts of discipline: and it is in ratione cultus of more essential eminency and perfection; as being more immediatly and properly the worship of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…administration of the Lord’s Supper is a more important and necessary duty than exclusion [from it], etc. or any other part of the exercise of discipline; for it is more properly and immediately the worship of God than the exercise of discipline, as may be seen in the place before quoted out of Ames, bk. 2, [Marrow of] Theology, ch. 13, n. 17-18. God is more worshipped by the administration of the sacraments than by Church censures; the sacraments are a principal worship of God; Church censures and the exercise of discipline less principal. Now it is improbable that a less principal worship of God should be a necessary antecedent to a principal worship. There is says Rada: duplex ordo naturae; alius ordo essentialis dependendentiae; alius est ordo essentialis eminentiae et perfectionis; qualis est inter excedens, &amp; excessum. Now exclusion (and we may say the like of all other acts of discipline) is not before the Lord’s Supper in regard of the order, either of essential dependency, or of essential eminency and perfection. The Lord’s Supper has not an essential dependency upon exclusion, or any other acts of discipline: and it is in ratione cultus of more essential eminency and perfection; as being more immediatly and properly the worship of God.”

<main class="wrap"><figure class="quote" id="q-79d09268e6" data-kw="">
<blockquote><p>Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity: but they are not the cause of, but only a precedent qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the Covenant of Grace, by condition we understand whatsoever is required on our part, as precedent, concomitant or subsequent to justification: repentance, faith and obedience are all conditions; but if by condition we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, pp. 20-21</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-60465e26a0" data-kw="">
<blockquote><p>The applying work of Christ’s merit is that solemn part of his mediation, for the sake whereof He forsook the earth, and was exalted… and sits at the right hand of God his Father, that by his intercession always made for his Church, He might apply to all the members the power of this satisfaction, that it might work faith in those that want it, and confirm it in those that have it. Therefore He is called advocate, that the Church may enjoy the fruit of his death continually. And as the ends hereof are many, to wit… keep them in his love, to cover their daily offences, and continue their justification and acceptance…</p></blockquote>

</figure><figure class="quote" id="q-d46ead5565" data-kw="">
<blockquote><p>When the world was lost by the one sin of Adam, the grace of Christ has not only abolished this sin and the death which it introduced, but also has at the same time taken away those endless sins… and brought as many as are of Christ into full justification; so that God has now not only forgiven them the sins both of Adam and of themselves, etc., but has at the same time given his Spirit of solid and perfect justice, to conform us to the image of the First-begotten. ‘Justification’ here occurs, which, as it is opposed to ‘condemnation,’ so it signifies properly that justification by which God absolves from all sins those that are Christ’s… and because he means a full justification, the perfect bestowal of justice is also contained in this justification; for it [justification] will then at length be consummated when along with sin, the last enemy, death, shall also have been destroyed, and the saints shall have been filled with every fruit of justice.</p></blockquote>

<blockquote><p>22. Regarding its first moment regeneration happens instantaneously. Theologians are accustomed to distinguish regeneration from justification in this respect: namely, that regeneration is simlutaneously and at once whole, whereas justification is not simultaneously and at once whole.</p></blockquote>

</figure><figure class="quote" id="q-11aa9bd530" data-kw="">
<blockquote><p>Indeed the works that follow our justification although they proceed from the Spirit of God who has taken possession of the hearts of those justified, are nevertheless of themselves unclean, because they are performed in a heart that is still impure. For justification has just begun and is not completed. We have received the first fruits of the Spirit (Rom. 8:23) but not yet the ‘titles’.¹ We are still waiting with groaning as Paul says in Rom. 8:23, for the redemption of our body. ¹ In order to understand this and the following assertions, the reader must bear in mind that Melanchthon understands ‘justificatio’ in the Augustinian sense. In a preliminary draft of the Loci called ‘Theologica Institutio’ he describes it not as a new relation to God but as the actual possession of true ‘justitia’ quae et constans esset et ex animo bearet nos.’ Thus ‘justificatio’ and ‘sanctificatio’ fall in fundamentally together. Later this notion gradually receded into the background. cf. Herrlinger: Theologie Melanchthons S. 6 ff….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Loci Communes of Philip Melanchthon… 1st ed., ed. and trans. Charles L. Hill (1521; Boston: Meador Publishing, 1944) | Locus 17, On Justification &amp; Faith</cite>, pp. 196-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“Indeed the works that follow our justification although they proceed from the Spirit of God who has taken possession of the hearts of those justified, are nevertheless of themselves unclean, because they are performed in a heart that is still impure. For justification has just begun and is not completed. We have received the first fruits of the Spirit (Rom. 8:23) but not yet the ‘titles’.¹ We are still waiting with groaning as Paul says in Rom. 8:23, for the redemption of our body. ¹ In order to understand this and the following assertions, the reader must bear in mind that Melanchthon understands ‘justificatio’ in the Augustinian sense. In a preliminary draft of the Loci called ‘Theologica Institutio’ he describes it not as a new relation to God but as the actual possession of true ‘justitia’ quae et constans esset et ex animo bearet nos.’ Thus ‘justificatio’ and ‘sanctificatio’ fall in fundamentally together. Later this notion gradually receded into the background. cf. Herrlinger: Theologie Melanchthons S. 6 ff….”

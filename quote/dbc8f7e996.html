<blockquote><p>When answering the objection that Christian magistrates were not bound to enforce the Old Testament’s laws against idolatry because they were not Jews, John Knox pointed out that the commandments given under Moses remained valid for civil rulers in the new covenant era:

For it is a thing more certain that whatsoever God required of the civil magistrate in Israel or Judah concerning the observation of true religion during the time of the Law, the same doth he require of lawful magistrates professing Christ Jesus in the time of the Gospel, as the Holy Ghost hath taught us by the mouth of David, saying (Psalm 2): ‘Be learned, you that judge the earth, kiss the Son, lest that the Lord wax angry and that ye perish from the way.’ This admonition did not extend to the judges under the Law only, but doth also include such as be promoted to honours in the time of the Gospel, when Christ Jesus doth reign and fight in His spiritual kingdom, whose enemies in that Psalm be most sharply taxed, their fury expressed and vanity mocked. And then are kings and judges, who think themselves free from all law and obedience, commanded to repent their former blind rage, and judges are charged to be learned. And last are all commanded to serve the Eternal in fear, to rejoice before Him in trembling, to kiss the Son, that is, to give unto Him most humble obedience. Whereof it is evident that the rulers, magistrates and judges now in Christ’s kingdom are no less bound to obedience unto God than were those under the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The appellation of John Knox from the cruel and most injust sentence pronounced against him by the false bishops and clergy of Scotland, with his supplication and exhortation to the nobility, estates and commonality of the same realm</cite>, (Geneva, 1558) in idem, On rebellion, ed. R. A. Mason (Cambridge, 1994), pp 91-2.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-faa507451d" data-kw="">
<blockquote><p>As they have done and suffered much for vindicating and maintaining the liberty of their Religion, that what belongeth unto God may be rendered unto God; So do they desire, that according to the rule of righteousness, each man have his own, and above all men, That the things which are Caesar’s be rendered unto him, and to give him that which is God’s were a wronging both of God and Caesar. They have ever been willing to taxes and to pay subsidies above that which they were able. They join with the inward reverence of their hearts, external honour and obedience in all things lawful.

They pour forth their prayers to God in private and public, for all blessings spiritual and temporal upon his Royal Person and Government, and upon his Progeny; and for the same blessings upon the Queen’s Majesty, especially that God by his Spirit would give unto her the knowledge and love of the truth. They long for her conversion as an happiness to herself, and a means of great happiness to the King, to their Children, and to all their Subjects.

And, that the Lord may answer their prayers, they think it incumbent to the Church of England, nor can any bond whatsoever oblige them to the contrary, to use the best and most powerful means, and would most willingly in all humility, love and respect, join their endeavours for that blessed end. And as they thus present their best desires and prayers, so are they ready to sacrifice their lives to God for his Majesty’s good, and in their hearts are grieved that their loyalty, which they account their no small glory, should have been called in question.

Neither is this all. But moreover they do acknowledge that his Majesty, as supreme Magistrate, hath not only charge over the Common-wealth, but doth watch and hath inspection over the Church and Church matters, but in a civil way. Vos Episcopi in Ecclesia (saith Constantine) Ego extra Ecclesiam Episcopus à Deo constitutus sum. And therefore that he is, by his high calling and place, Custos utrius{que} tabulae, to command the precepts of the first table as well as of the second table to be obeyed: That he is Vindex Religionis by his sword, as the Spirit of God in Scripture is Iudex, and the Church is Index: That he hath power to turn the constitutions of the Church into Laws, and to confirm them by the civil sanction in Parliament: That he may constrain all his subjects to do duty in matters of religion, and may punish the transgressors: That when debates arise about Religion, he hath power to call the Assemblies of the Church, to be present and civilly preside in them, and to examine their constitutions, that he may discern of them both as a Christian caring for his own soul, and as supreme Magistrate watching over his people: and that he may do all things which can prove him to be a kind and careful nursing Father.

They account all that is vomited out to the contrary, [as, that they liked Anarchy better then Monarchy, and that they would turn a Kingdom into a democracy,] to be but the fictions and calumnies of the malicious enemies of God and his truth; not unlike the lies which were devised against the Christians of old: their consciences, their words, writings, and actions, even then when the world did put the worst constructions upon them, were witnesses of the integrity of their hearts.

They do still hold that there can be no antipathy betwixt one ordinance of God and another. By him Princes do reign, and he hath also appointed the Officers and Government of his own house. They do desire nothing more then that the Son of God may reign, and that with and under the Son of God, the King may command, and they, as good subjects to Christ and the King, may obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The government and order of the Church of Scotland</cite>, (Edinburgh, 1641), pp 65-68.</span></figcaption>

</figure><figure class="quote" id="q-107971dcfd" data-kw="">
<blockquote><p>Wherefore not undeservedly does [Martin] Bucer in his Pastoral complain of those magistrates who neither care for nor procure the salvation of the peoples subject to them, holding them only as cattle for gain, and as often happens, devouring rather than feeding them, although kings and princes are also called pastors of peoples in profane and sacred letters.

Likewise do those magistrates sin and deserve most grave reprehension who after they have subdued new dominions by arms or other means take first thoughts for appointing quaestors and exactors themselves, but in no way labour to seek men fit for instructing them in religion or for appointing them to instruct, and are little solicitous what their subjects believe, provided they pay annual tributes and annual burdens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossain.html">Daniel Tossain</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evangelical Pastor</cite>, (Heidelberg, 1603), pp 95-96. (Translated by Grok.)</span></figcaption>

<blockquote><p>…look what is the largest extent of the prince’s power and privilege in matters belonging unto God’s worship, which either God’s Word, or the judgment of sound divines does allow to him, none shall be found more willingly obsequious [readily obedient] to his commandments than we.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 12</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…look what is the largest extent of the prince’s power and privilege in matters belonging unto God’s worship, which either God’s Word, or the judgment of sound divines does allow to him, none shall be found more willingly obsequious [readily obedient] to his commandments than we.”

<blockquote><p>But Magistrates as Magistrates hold forth in their Law-abstinence from those same sins of adultery, incest, murder; But:

1. Not to the consciences of their subjects, but to the outer man as members of the commonwealth.

2. Not under the pain of eternal wrath and condemnation, before the judge of quick and dead: Magistrates as Magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if Magistrates do persuade the equity of abstinence from adultery, incest, murder, in their statutes, or acts of parliament, from the Word of God, from the sixth and seventh command of the Decalogue, from the judgement and eternal punishment that follows these sins, they so persuade not as magistrates, but as divines, and as godly and Christian men…

3. Magistrates as Magistrates hold forth in their Law, abstinence from these sins, not as the ambassadors of Christ, craving subjection of conscience and divine-faith to those charges, but only external obedience: for though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience; nor is he in Christ’s stead to lay divine bands on the conscience, to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order, and as the Creator, and Founder, and another of human societies and of Peace, to exact external obedience, and to lay bands on your hands not to shed innocent blood, and on your body not to defile it with adultery, or incest, nor to violate the chastity of your brother… when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>

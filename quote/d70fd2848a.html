</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b07a0e66a" data-kw="">
<blockquote><p>And not only Peter but also all the apostles, by making this confession—which they would soon proclaim in the midst of the world—laid the foundation of the church of Christ. Accordingly, figuratively speaking, along with Peter they were all of them the rock on which Christ built his church; or, in another application of the same image, Christ is the rock that the apostles by their preaching laid as the foundation of the church (Acts 4:11; Rom. 9:33; 1 Cor. 3:10–11; Eph. 2:20; 1 Pet. 2:5–6; Rev. 21:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><figure class="quote" id="q-569df882a1" data-kw="">
<blockquote><p>Whether Christ was a king when He began to be Mediator? It is affirmed. Whether He was a king when He traversed in the earth? It is affirmed. Whether Christ obtained to the king of the Jews by a hereditary, temporal right? It is affirmed with a distinction. Whether He was finally made king at the time He ascended into Heaven? It is denied contra the Socinians. Whether there is a twofold kingly power in Christ? It is affirmed. Whether the kingdom of Christ the Mediator, or the economic kingdom, will be subordinated to the kingdom of the Father, or the natural kingdom of God? It is affirmed. Whether kings of this world are subordinated to the kingdom of Christ? It is distinguished. Whether He is a king according to both natures? It is affirmed. … Whether it is a spiritual kingdom of Christ, or rather worldly? The former is affirmed. Whether Christ’s kingdom is rightly distinguished between internal and external, and these two are separated after the departing of Christ out of the earth? The former is affirmed, the latter denied. … Whether Christ’s kingdom is universal and through the whole world? It is affirmed. Whether it extends to all creatures? It is affirmed. … Whether the kingdom of Christ will endure in eternity? It is affirmed with a distinction. What is to be said about the millenary reign of Christ and the error of the Chiliasts? It is explained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2, tract 2 Abbr. | 4. Of the Kingship of Christ . Of Christ the Judge</cite></span></figcaption>

</figure><figure class="quote" id="q-dfa428a757" data-kw="">
<blockquote><p>Christ’s flesh, that is, his humanity, should not be worshipped, since it is not Deity, that is, God. Nothing should be worshipped which is not God. This honor is proper to God alone, as it is written: You will worship the Lord your God and serve Him only (Matthew 4[:10]). We do not deny that the man Christ is to be worshipped, but we do not concede that the humanity of Christ should be worshipped in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586 ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017)</cite>, p. 419</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-0c475215e2" data-kw="">
<blockquote><p>This Person is the common beginning of those actions, which the Greek Fathers have called divinely humane: for the actions of Christ are not only, some humane, some divine: but also some of common operation, which Christ effects; both as he is Man-God by Nature, and as he is Mediator by dispensation: his Natures are the beginnings of Natural Actions; but his person is the beginning, both of common and particular actions, according to both natures: wherefore every working of Christ, in respect of his person, is in number one; in respect of his Natures, is in kind, two-fold: One in number, because he is one effectual Worker: and one absolute Perfection. In kind two-fold, because there is one Divine, of the God-head, and another humane, of the man-hood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity… (London, 1610), ‘Of the Person of Christ’, Part Confirmative, ch. 6</cite>, pp. 156-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

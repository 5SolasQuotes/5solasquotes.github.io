<blockquote><p>Simplicity is God, one mere and perfect act without all composition. God calls his name, ‘I am,’ Ex. 3:14, that is, mere essence, wherein is nothing past, nor to come. Because spirits are immixed in respect of bodies, to show that He is not compounded, He says He is a Spirit, Jn. 4:24. When we say that God is a mere and perfect act, the meaning is that God is a cause without any cause, a being that is not from any being; not compounded of an act, by which He is, and possibility, by which He might not have been or may not be: of whom it never could, nor can be said that anything was to be in Him, which was not; or cannot be, that is. That God is a pure and simple act without all composition is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings. Because God is a Being of absolute necessity (Deus est ens necesse esse [God is necessary being]. Smising, Of the One God, tract 2, disp. 2, n. 49): Composition implies either that there must be more beings of absolute necessity, or that there is something in God that may not be. Composition supposes succession, i.e. something past or to come in God; contrary to his name, ‘I am’. Nay it supposes that not-being is not repugnant to the nature of God: Where there is composition, there may be dissolution; dissolution is the way to not-being. It much helps us in the contemplation of the simplicity of God to look upon it as opposed to composition, all the ways whereof the learned have referred to these seven heads. Composition is either of 1. Parts, which are bounded by quantity; as a body having one part upon another.

2. Matter and form; as a man of body and soul: these two compositions are only found in corporeal things.

3. General and special nature: as every species, whose common nature is to be found in some other thing, where the special nature is not; as a living creature and a man. 4.A subject and an accident; as every created substance: There are no accidents in God: He is wise, holy, just, essentially: there is not a substance and a quality in Him. When God is said only to have immortality, 1 Tim. 6:16, it is to be understood by way of eminency; He so has it as none has besides Him: He has it originally, not derivatively and by participation.

5. An act and a possibility-objective that is to be, if the thing looked at as yet is not in being; or [a possibility-]passive that is not to be (though that not-being never shall be), if the thing be looked at as in actual being: this composition holds concerning angels.

6. A person and nature; as Christ, compounded of the divine Person and human nature; which yet is not properly composition of parts, but of number.

7. Being and individuation; that is, that by which we have such a particular being, as humanity and Peter. Objection: Where there is a plurality, there is not simplicity: But in the divine nature there is a plurality: therefore. Answer: The objection holds where there is a plurality of essences, beings or things, but not where there is only a plurality of subsistences. In the divine nature, though there be a Trinity, therefore a plurality of subsistences or Persons, yet there is but one essence: In the Trinity there is distinction, but not composition. Objection 2. The attribute of simplicity concludes that all the attributes are God Himself, and consequently that there is no inequality amongst them: yet we read that his tender mercies are over all his works; so, as it may seem, mercy exceeds the other attributes. Answer: The meaning is that his mercy is over, that is, upon all his works, not that God’s mercy exceeds all his other attributes, as if one attribute were greater than another: for all the attributes of God are equal, not one higher or greater than another, because they are all God Himself. From the simplicity of God it follows:

1. That whatsoever is in God, is God.

2. Whatsoever God wills He willed from eternity and always wills.

3. Whatsoever God wills, He wills simply, absolutely and independently.

4. God is justice, wisdom, love, etc. essentially: although He be said to have them eminently, yet He has them not derivatively.</p></blockquote>

<blockquote><p>Immutability is God without any alteration in respect of being, will or any accidents, Ps. 102:27-28; Mal. 3:6; Jam. 1:17, ‘With whom is no variableness, nor shadow of turning.’ Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: The liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed forever, though the creature had never been. Objection 2: God’s will in his decree and his will in the command are often contrary one unto another; therefore He is not immutable. Answer: No such thing. The decree determines what shall be; the command shows what ought to be. God’s willing the futurition of the betraying of Christ by Judas, and yet willing it to be Judas’s duty not to betray Christ, have not the least appearance of two wills in God. Objection 3: God sometime[s] promises and performs not: threatens and executes not; therefore He may seem not to be immutable. Answer: Such promises and threatnings are to be understood conditionally, not absolutely. See Jer. 18:7, 10. Objection 4: God in Scripture is often said to repent; He that repents is not immutable. Answer: Such speeches, though spoken after the manner of men for the help of our understanding, yet are to be understood as becomes the nature of God. God is therefore said to repent because He does as men do when they repent, that is, He changes his deeds: yet without any change of his will. Nay, those changes of his deeds are the executions of his unchangeable will.</p></blockquote>

omes the nature of God. God is therefore said to repent because He does as men do when they repent, that is, He changes his deeds: yet without any change of his will. Nay, those changes of his deeds are the executions of his unchangeable will.”

t+absolutely.+See+Jer.+18%3A7%2C+10.+Objection+4%3A+God+in+Scripture+is+often+said+to+repent%3B+He+that+repents+is+not+immutable.+Answer%3A+Such+speeches%2C+though+spoken+after+the+manner+of+men+for+the+help+of+our+understanding%2C+yet+are+to+be+understood+as+becomes+the+nature+of+God.+God+is+therefore+said+to+repent+because+He+does+as+men+do+when+they+repent%2C+that+is%2C+He+changes+his+deeds%3A+yet+without+any+change+of+his+will.+Nay%2C+those+changes+of+his+deeds+are+the+executions+of+his+unchangeable+will.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+8-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9b187c441.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9b187c441.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-changelessness-or-immutability-of-god/#:~:text=Immutability%20is%20God%20without%20any%20alteration,the%20executions%20of%20his%20unchangeable%20will&amp;text=Immutability%20is%20God%20without%20any%20alteration%20in%20respect&amp;text=deeds%20are%20the%20executions%20of%20his%20unchangeable%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency¹ [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. ¹ [See also ‘On Obediential Potency’.] The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]

42. Act and potency as constitutive principles involve imperfection insofar as they are mutually perfectible in themselves; for only the imperfect is perfectible.

43. Potential being considered in itself is not simply real, that is, does not really exist, save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason [that which only exists in a mind]; for the idea of a possible quiddity [what-ness or essence] involves the relation of non-repugnance to existence, while the others do not.

44. Therefore that which is a potential being cannot have the reason for its existence in itself but in its cause; so the potential is the causable.

45. If something is a potential being, something else is actual. Potential being does not in fact exist; therefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause.

46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency.

47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).]</p></blockquote>

<main class="wrap"><figure class="quote" id="q-60ede33560" data-kw="">
<blockquote><p>Besides this, your servants should be the most thoroughly honest, and circumspect, and modest, and as serviceable to you as possible. And see that you instruct and teach them in true doctrine with all the patience and charity of Christ; but if they despise and light esteem your instruction…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ad6c74ffd" data-kw="">
<blockquote><p>This presbytery consisting of more pastors is the first ruling and governing Church, having power of the keys in all points of discipline within themselves; They have intensively power of the keys in all points, and equal power, intensive [intensively] with greater synods and assemblies, because ordination of pastors by them, 1 Tim. 4:14, is as valid in the point of Church discipline as the decrees made in the great council convented at Jerusalem, Acts 15:21-22, etc. But provincial synods and national assemblies have greater power than the presbyteries extensive [extensively]; because they have power as a great body to exercise discipline that concerns the whole congregations of all the nation, which power is not in inferior elderships.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (London, 1642), ch. 13, pp. 188-99</span></figcaption>

</figure><figure class="quote" id="q-0fe3801e91" data-kw="">
<blockquote><p>I. Doctrine. The foundation whereupon our faith in Christ does stay, are the revelations sent of God to the godly, or the Church. For by this means were taught and instructed the shepherds, Simeon, Anna, Zacharias, Elizabeth and many other more inflamed with the Holy Ghost, which all confessed and testified that Jesus is the promised Messiah and Savior of our souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Preaching</cite>, … (d. 1564; London: East, 1577), p. 86</span></figcaption>

</figure><figure class="quote" id="q-e6eff1dad0" data-kw="">
<blockquote><p>I will rather turn in a different direction, and let all the godly see how abominable the impiety of those men is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Preface to the Pious Reader</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I will rather turn in a different direction, and let all the godly see how abominable the impiety of those men is.”

— John Calvin, Acts of the Council of Trent with the Antidote, Preface to the Pious Reader">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+will+rather+turn+in+a+different+direction%2C+and+let+all+the+godly+see+how+abominable+the+impiety+of+those+men+is.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Acts+of+the+Council+of+Trent+with+the+Antidote%2C+Preface+to+the+Pious+Reader&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe6eff1dad0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e6eff1dad0.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-a495b14ff1" data-kw="">
<blockquote><p>Article 1… the Sieur de la Milletiere… a fellow who would not submit himself unto their judgment and authority, and who has told the world that for these two last years he had no other intention than to incorporate himself into the communion of the Church of Rome, and to form a party against all the Reformed Churches, impugning with might and main the common confessions of all Protestants, perpetually accusing them of contemning the Catholic, that is, his Romish Church, and of schism from it, and propounding to them for the Rule of their Faith the Acts and Canons of the Council of Trent… But the said de la Milletiere having given it under his own hand in writing that he would submit himself unto the judgment of this synod; when as the commissioners, whom he himself had nominated, brought in their report… the Synod did once more refuse him, especially, because that he had fully opened his intentions, and in formal words declared that by that writing subscribed with his own hand, he never promised to submit his doctrine, but himself and person to the judgment of the Assembly; who taking, as in truth they could not but take this distinction, such an one as it was, in any other sense than a notorious scorn of their just and charitable endeavours for his eternal welfare; They told him plainly, that neither they nor any of their commissioners would waste a moment more of their precious time about him, and adjured him… to give Glory unto God, and to relinquish his most impious designs; and added farther, that they did as the National Synod of Alanson had done before them, declare, that for diverse years past he was not to be reputed a member of our Reformed Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick, Synodicon (London, 1692), 3rd National Synod of Charenton, ch. 15, pp. 476-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

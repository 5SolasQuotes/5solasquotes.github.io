<main class="wrap"><figure class="quote" id="q-c15fab5765" data-kw="">
<blockquote><p>Surely we have ever judged the primitive Church of Christ&#x27;s time, of the Apostles and of the holy fathers, to be the Catholic Church; neither make we doubt to name it, &quot;Noah&#x27;s ark, Christ&#x27;s spouse, the pillar and upholder of all truth;&quot; nor yet to fix therein the whole mean of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-55d2775d85" data-kw="Spirit and Word">
<blockquote><p>We may now easily infer how erroneously our opponents act in vaunting of the Holy Spirit, for no other end than to give the credit of his name to strange doctrines, extraneous to the word of God, whereas he himself desires to be inseparably connected with the word of God; and Christ declares the same thing of him, when he promises him to the Church. And so indeed it is. The soberness which our Lord once prescribed to his Church, he wishes to be perpetually observed. He forbade that anything should be added to his word, and that anything should be taken from it. This is the inviolable decree of God and the Holy Spirit, a decree which our opponents endeavour to annul when they pretend that the Church is guided by the Spirit without the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><figure class="quote" id="q-a2863a5000" data-kw="Judge of controversies">
<blockquote><p>It is not necessary that there should be in the church any external infallible judge by whom controversies of faith may be solved. It suffices for believers, for the tranquility and rest of their consciences, that there is an interior or divine definitive judgment (namely, of Christ and the Holy Spirit speaking in the Scriptures). An external human judgment, infallible and definitive in the church, is neither necessary nor possible. Controversies do not belong to external order but to the mental judgment for which a judge is necessary to enlighten the mind and sanctify the will (which an external and human judge cannot do because he has no power over the conscience).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.23</span></figcaption>

</figure><figure class="quote" id="q-d931506157" data-kw="Infallibility of the church">
<blockquote><p>For if the church ought to be infallible, the Holy Spirit would undoubtedly somewhere have told believers of it, as of a thing of the greatest importance to confirm the faith of the pious and to guard them against all seductions. Otherwise he would appear to have been wanting in a thing the most necessary of all and which it was of the greatest moment for the church to know. But nowhere is mention made of this privilege having been given to any certain church; for it will be shown hereafter that the many passages adduced by our opponents to prove this thing do not prove it. So far from its being said that this was granted to the Roman church (as ought to have been said by all means, if any such thing belonged to it), on the contrary Paul earnestly admonishes it of the danger of defection and of their impending fall: “Because of unbelief they were broken off, and thou standest by faith. Be not highminded, but fear: For if God spared not the natural branches, take heed lest he also spare not thee” (Rom. 11:20, 21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.10</span></figcaption>

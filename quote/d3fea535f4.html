<main class="wrap"><figure class="quote" id="q-d3fea535f4" data-kw="">
<blockquote><p>Whether God is able to hate sin and will its existence? It is asked whether that distinction is frivolous by which we teach God to hate sin, and yet to will its existence? So says that Arminian against Perkins (p. 701). We deny:

1. Because for God to hate sin is not for God to intend that sin would never exist, as it is false that God decreed that the crucifixion of the Savior, the selling of Joseph, the carrying off of his people into captivity by the Assyrians and Chaldeans, the defecting of the ten tribes from the family of David and the spoiling of Job by the Sabeans, would not exist.

2. Because sin in itself is a disgraceful evil and an object of the displeasing and disapproving will [of God]. But truly for sin to exist is a useful good, conducing to the glory of God; and all good existing in time is from God, from the eternal decree.

3. Because in the explication of our distinction, Arminius falsely imputes to us that we teach that God wills and approves sin existing and that God does not hate sin existing. For God hates sin and hates the existence of sin in the genus of a disgraceful thing, and yet He decrees to permit that it would exist under the genus of a useful thing.

4. [William] Twisse rightly says, Marcus Cato[1] willed Carthage [an enemy city] to exist inasmuch as it was a grindstone and material exercising youth of Roman virtue, and yet he willed against it, i.e. to hate Carthage. I further add that Peter rightly willed that Christ would spare Himself, that He would not be killed by ungodly foes; and yet Christ wills against this, rightly declaring him to be of Satan; notwithstanding, Peter was bound to hate that occasion as it was sin (Mt. 16:21-23). [1] Marcus Cato the elder (234-149 B.C.) was a Roman soldier, senator and historian known for his opposition to Hellenization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, p. 233-234, as trans. in Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter trans. Charles Johnson &amp; Travis Fentiman (1668 / 2019), pp. 68-69</span></figcaption>

</figure><figure class="quote" id="q-326c2c60d2" data-kw="">
<blockquote><p>1. But suppose a person has wronged another in his estate, and the party wronged be dead, what shall he do in this case? Let him restore his ill-gotten goods to that man’s heirs and successors. Question: But what if none of them be living? Answer: Let him restore to God; that is, let him put his unjust gain into God’s treasury by relieving the poor.

2. But what if the party who did the wrong be dead? Then they who are his heirs ought to make restitution. Mark what I say: if there be any who have estates left them, and they knew that the parties who left their estates did defraud others, and died with that guilt upon them, then the heirs or executors who possess those estates are bound in conscience to make restitution, else they entail the curse of God upon their family.

3. But if a man has wronged another, and he be not able to restore, what shall he do in this case? Let him deeply humble himself before God, promising to the party wronged (if the Lord make him able) full satisfaction, and God will accept of the will for the deed.</p></blockquote>

</figure><figure class="quote" id="q-8e97531428" data-kw="">
<blockquote><p>This was it, which is here said to be according to the law: and that the judicial, ceremonial and moral law: 1. By the judicial law the Levites had not their portion in Canaan for their inheritance, as other tribes had: therefore in lieu thereof, by the said law they had the tenth of the rest of the people. 2. The holy services which they performed to the Lord for the people were ceremonial. Therefore the recompence given was by a like law. 3. The general equity that they who communicate unto us spiritual matters should partake of our temporals, and that they who are set apart wholly to attend God’s service should live upon that service, is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, vol. 2, p. 108, section 40, ‘Of the law of paying tithes,’ on Heb. 7:5-7 Gouge (d. 1653) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-732494c5d0" data-kw="">
<blockquote><p>I take the Creed called Athanasius’s (though the author is unknown) to be an excellent explication of the doctrine of the Trinity: And could wish that it were more used and learnt of all. But I am not so far to judge other men as to conclude all men certainly damned forever that are not so well skilled in that mystery as to believe every word there written.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-9ace4a6900" data-kw="">
<blockquote><p>Further, this power of the keys… The key of the ministry of the Word is set down and established by Christ, Mt. 16:19, ‘I will give unto thee the keys of the kingdom of heaven,’ etc. This ministry of the Word is a key, because it opens and shuts heaven; this it does… Secondly: by applying the promises of the Gospel and the threatening of the Law: For when in the ministry of the Word the promises of remission of sins and life everlasting, are applied to believers that repent, then the kingdom of heaven is opened; and when as in the same ministry of the Word, the curses of the law are denounced against impenitent sinners, then is the kingdom of heaven shut. Yet touching the ministry of the Word, this distinction must be remembered; that otherwhiles the church is certain of the faith and repentance of some men, or some congregation; and then they may pronounce remission of sins absolutely. But otherwhiles they are uncertain of their faith and repentance, or of their impenitency; and then they must accordingly remit or retain men’s sins, that is, conditionally; pronouncing the remission of sins to all that repent: and denouncing damnation to all that repent not. And thus is the word to be publicly handled in God’s Church at this day, because our congregations are mixed companies, consisting of some that repent and believe, and of others that do not truly repent nor believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation</cite>, … (London: Islip, 1606), 3rd Chapter, p. 180</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

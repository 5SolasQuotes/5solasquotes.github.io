<main class="wrap"><figure class="quote" id="q-132cff52f5" data-kw="">
<blockquote><p>First, then, the difference betwixt the Old and New Testament dispensations, with regard to extent, is deserving of marked attention. The former was greatly restricted; it was almost exclusively confined to one people; and to this limitation the members of the church had been long accustomed. The new dispensation, again, was possessed of an opposite character; it was distinguished by a universal extension of its privileges; it threw down the middle wall of partition by which the Jews were kept separate from the other nations of the earth, broadly maintained that there was no difference between the Jew and the Gentile, and opened its arms to Greek and Jew, Barbarian and Scythian, bond and free. But the previous state of things had given rise to deep-seated prejudice in favour of exclusive privilege, which it was no easy matter to uproot. […]

They were Jews, and were manifestly reluctant to descend to a common level with others, in regard to the enjoyment of religious privilege; a miracle was even required to be wrought to convince an apostle that God is no respector [sic] of persons, and to carry home to him the lesson, “What God hath cleansed, that call not thou common.” If such narrow views were entertained by those who had the best opportunities of correct information, we need not wonder at the bigoted prejudices of others. The preaching of the Gospel to the Gentiles awakened the jealously of the Jews, and to such a length did they carry their opposition, that they even persecuted the preachers, “forbidding them to speak to the Gentiles, that they might be saved.” […]

Considering such a state of things, it is surely not difficult to account for the use of terms of extensive import, in speaking of the blessings of the new economy. To mark the contrast, the strongest language that could be employed because necessary. In these circumstances, we can conceive of nothing more natural than to use the phrases all men, all the world, &amp;c., to denote men in general, without regard to national distinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The atonement and intercession of Jesus Christ</cite>, (New York, 1863), pp 214-16.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ae744ad4b" data-kw="">
<blockquote><p>And we must also add that whatever be their original and constitution, if all their governors were as the apostles, yet have they no power but what is for edification, and not for destruction; If they do or shall appoint and impose on men what tends unto the destruction of their souls, and not unto their edification, as it is fallen out in the Church of Rome; not only particular churches, but every individual believer is warranted to withdraw from their communion… Let none mistake themselves herein, believers are not made for churches, but churches are appointed for believers. Their edification, their guidance and direction in the profession of the faith and performance of divine worship in assemblies according to the mind of God, is their use and end; without which they are of no signification. The end of Christ in the constitution of his churches, was not the molding of his disciples into such ecclesiastical shapes, as might be subservient unto the power, interest, advantages and dignity of them that may in any season come to be over them; but to constitute a way and order of giving such officers unto them, as might be in all things useful and subservient unto their edification; as is expresly affirmed, Eph. 4:11-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Vindication of the Non-Conformists from the Charge of Schism</cite>, … (1680), p. 18</span></figcaption>

</figure><figure class="quote" id="q-e9beb1bcea" data-kw="">
<blockquote><p>Discussions by Robert L. Dabney, D.D. , LL.D., Professor of Moral Philosophy in the University of Texas and for many years Professor of Theology in Union Theological Seminary in Virginia. Edited by C. R. Vaughan, D.D., Pastor of the Presbyterian Church of New Providence, Va. Vol. ii: Evangelical. 8vo, pp. iv, 684. (Richmond, Va.: Presbyterian Committee of Publication, 1891.) The editing of the second volume of Dr. Dabney’s occasional papers, presents many of the same faults which were pointed out in our notice of the first volume (PRESBYTERIAN AND REFORMED REVIEW, Vol. ii, p. 714.)

The principle of arrangement of the papers is generally, but not invariably, chronological; the indication of the time and occasion which produced each paper is common but not constant. Above all we are at a loss to understand on what ground the papers of this volume are classed under the general head of “Evangelical.” Most of them are on matters of ecclesiastical arrangement and action, and some of them are (although of ecclesiastical origin) distinctly secular in spirit and tone.

The intellect is constantly stimulated by Dr. Dabney’s writing, and the mind instructed. There is a literary grace attending much of his writing which is truly delightful. We always rejoice to have such a champion “on our side”—as we have in many of the papers of this volume, as, e.g., those on the “Public Preaching of Women,” “Theories of the Eldership,” and the like. But it must be admitted that sometimes a strength of language invades his writing which offends against good taste, and that sometimes a depth of prejudice veils his vision which leads him into views and expressions scarcely “evangelical.</p></blockquote>

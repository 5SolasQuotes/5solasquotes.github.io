<main class="wrap"><figure class="quote" id="q-d31aac66d3" data-kw="">
<blockquote><p>There are many who consider the use of instruments as merely an aid to singing. If Christians are commanded to sing in worship, what is wrong with using an instrument to assist the voice in carrying the tune? After all, it is argued, without an instrument to assist, many would not be able to sing the tunes properly. In other words, instruments have become a necessary aid to the practice of a Scriptural element of worship, as if congregational singing is impossible or impractical without mechanical help. Looking at it this way, some argue that instruments are a circumstance to worship, not an element regulated by Scripture, much like the building, what pulpit is used, and other things common to any kind of meeting. Even if instrumental music could be considered as an aid to worship, the Lord still strictly controls what aids are allowed in His worship. The Israelites, in their zeal to offer to the Lord true worship, nevertheless committed idolatry when they forged the golden calf at Sinai to magnify the great power of God. They weren’t blind pagans; they intended to worship the God of Israel, not some pagan deity. But in their desire for an aid to worship, they sinned and instead provoked the wrath of God. To them the golden calf was an aid to worship that they thought the Lord would have allowed, but to the Lord it was an unauthorized aid that He abhorred. In matters of worship, both reason and the will of man is a fatal guide. We would do well to remember the words of Solomon in Prov. 16:25, “There is a way that seemeth right unto a man, but the end thereof are the ways of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brad-freeman.html">Brad Freeman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Freeman is a Presbyterian Reformed Church minister. Why Not Instruments In Worship?, V. A Common Reason Answered</cite></span></figcaption>

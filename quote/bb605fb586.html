<main class="wrap"><figure class="quote" id="q-bb605fb586" data-kw="">
<blockquote><p>By a ‘ceremony’ I understand an external rite in or about the worship of God. By ‘significant ceremonies’ I understand rites in divine worship signifying some material point of religion. There is no controversy about those outward actions that by nature or general custom signify the reverence of the mind, as kneeling and lifting up our eyes and hands to Heaven in token of devotion to the God of Heaven, and being uncovered in prayer, etc. But the question is of those that signify merely by the force of authoritative institution or private arbitrary intention. Such significant things, though they may have some natural aptitude to signify such and such points of religion, yet they do not actually signify, but [only signify] as arbitrarily designed thereunto. It is generally received that significant ceremonies in taking an oath may lawfully be used, and that not only such as naturally signify, as lifting up the hand towards Heaven, but such also as signify by institution, as laying the hand on a book or kissing the book. Now though the end of an oath may be a civil thing, as the ending of a controversy, yet the formal of it is divine worship. And the aforesaid ceremonies are expressive of the very external part of it, and they actually signify by force of institution. Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words. The Christians heretofore, being among infidels, might lawfully have the figure of the cross somewhere visible about them to show that they were Christians. For the meaning was no more than if they had said, “We are Christians.” But it may be replied this was no act of divine worship, but an indicant or speaking sign towards men. With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution. And if instituted signs of devotion in general be lawful, I see not why signs of some special part of devotion, or mystery in religion, should be unlawful. I am more confident of the warrantableness of rites and ceremonies of worship that are used only instead of so many words pronounced, than of those that are added to words for their more solemn ratification, as seals are to a writing or federal signs to a verbal contract. Nevertheless, the forementioned ceremonies of swearing seem added to the words of the oath for more solemn ratification; and it alters not the case whether the words be read by him that administers or pronounced by him that takes the oath, for either way they are his words that takes the oath. Likewise I have more confidence of the warrantableness of those significant ceremonies that are of private arbitrary intention than of those that are of authoritative institution; also of those that are used occasionally and pro hic et nunc [for here and now], than of those that are used statedly. Furthermore I apprehend that significant ceremonies of divine worship are more apt to degenerate into superstition; and if they be multiplied, that religion is therewith loaded as with unprofitable luggage; and that it is a form of religion rather Mosaic than evangelical, wherein spiritual worship is most regarded. I think also that significant ceremonies are not necessary in genere, as those things are which are left to the determination of human authority, and so not to be instituted and imposed in the ordinary divine service. I apprehend that our Lord Christ has instituted all those stated ordinances of positive worship that are necessary to the Church universal, and therefore that more of the same nature are not to be devised by men. If any significant ceremonies be indeed necessary for some parts of the catholic Church in respect of time and place, there seems to me a fairer plea for their institution in those times and places; but the controverted ceremonies among us seem to be necessary for the whole Church in every age, if at all necessary. Significant ceremonies of the same nature and reason with those perpetual ordinances that Christ has instituted for the universal Church may not be instituted by man, and particularly such as are made symbols of the Covenant of Grace and Christianity. In matters doubted among sober Christians, superiors should take heed of strict imposing, and thereby wresting the consciences of their subjects and overstraining them to a compliance with them, in derogation to God’s authority in their consciences. If superiors command that which is above their sphere to command, namely, things not necessary in genere, yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>

<blockquote><p>Now the King Himself, the Lord who reigns in this external policy [of the Church], must be the only Lawgiver, James 4:12; Isa. 33:22. There can be no rabbis or doctors on earth who as little kings can make laws under Him, Mt. 23:8-10. Yea, not apostles, who can teach how the worship should externally be ordered, but what they receive of the King of the Church, 1 Cor. 11:23; Acts 15:13-18, how the house should be governed, Heb. 3:1-2; 4:5. Yea, nothing [is] more reasonable than that whatsoever is commanded by the God of Heaven, should be done in and for the house of the God of Heaven under the pain of his wrath, Ezra 7:23; 1. That there should be officers in a Kingdom, and laws to govern the subjects, beside the will of the prince or judges of the Land, or that the members of a family, or soldiers in an army should be governed by any rule, custom or law, beside[s] or without the will of the Master of the House, and of the general and commanders, is all one, as if subjects, families and soldiers should be ruled and governed by their own will and wisdom, and not by their king, judges, masters and commanders; For the question is upon this undeniable supposition, that Christ is the only Head and King of his Church, and so the Head and King of Prelates (if they be of the body) and of the rulers, guides and pastors of the Church, which are to be governed and ruled by certain laws, no less than the people, whether or no this representative Church of rulers, being subjects and members of the Head and King of the Church, are to be ruled by the wisdom, laws and commandments of this King, the Lord Jesus; or if they have granted to them a vast arbitrary power to govern both themselves and the people, by adding positive mandates of arbitrary commanders, such as Prelates are (in the mind of those who think they have no patent of any divine-right) and of surplice, crossing, kneeling for reverence to wood, to bread and wine.</p></blockquote>

eople%2C+by+adding+positive+mandates+of+arbitrary+commanders%2C+such+as+Prelates+are+%28in+the+mind+of+those+who+think+they+have+no+patent+of+any+divine-right%29+and+of+surplice%2C+crossing%2C+kneeling+for+reverence+to+wood%2C+to+bread+and+wine.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29+%7C+Intro%2C+Section+2%2C+pp.+17-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a9882326f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a9882326f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=Now%20the%20King%20Himself%2C%20the%20Lord,to%20wood%2C%20to%20bread%20and%20wine&amp;text=Now%20the%20King%20Himself%2C%20the%20Lord%20who%20reigns&amp;text=for%20reverence%20to%20wood%2C%20to%20bread%20and%20wine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>When we measure the goodness or the badness of a human action, we must not only measure it by the object and the end, but by all the circumstances which accompany it. Fed. Morellus upon those words of Seneca, Refert quid, cui, quando, quare, ubi, etc. says that without those circumstances of things, persons, times, places, facti ratio non constat [it does not consist with reason of fact]. Circumstances sometimes constituunt rerum earum quae aguntur speciem [establish those things which direct the species], say our divines, meaning that circumstances do make an action good or bad. Humani actus [a human action] say the Schoolmen, non solum ex objectis, verum ex circumstantiis boni vel mali esse dicuntur. It is not every mans part, (says one of our opposites) to judge de circumstantia, quae reddit actionem vel bonam vel malam. Some circumstances says another of them, are intrinsical and essential to actions, and specially making up their nature. The principal circumstances which here we speak of, are comprehended in this versicle: ‘Quis, Quid, Ubi, Quibus auxiliis, Cur, Quomodo, Quando.’ [‘Who, what, where, by what means, why, what way, when.’]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ([1637]), pt. 4, ch. 3, pp. 6-7</span></figcaption>

<blockquote><p>In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 5:28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

bc05a79dd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=In%20the%20second%20member%20%5Bof%20the,without%20exception%20which%20they%20shall%20command&amp;text=In%20the%20second%20member%20%5Bof%20the%20verse%5D%20he&amp;text=be%20received%20without%20exception%20which%20they%20shall%20command" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. Much less must we prefer them [animals] before men: We must not be cruel to men pretending to show mercy to the brute creatures. The life of a beast must go still to save or preserve the life of a man. I cannot but condemn the Turks, who set birds at liberty out of their cages, redeeming with money these captives, and yet make no conscience of chaining Christians to their galleys; as also the hypocrisy [of those] that cheat amongst the Romanists, whose clergy are forbid to hunt beasts, and yet some made Lords Inquisitors on purpose to hunt down, tear and devour the harmless sheep and lambs of Christ. Surely the good, the great, and the chief Shepherd of the flock and the Bishop of our souls will count them but little thanks for their so doing when He shall come to hold his general Visitation and to judge the world. These things notwithstanding, I dare not condemn those (if necessitated to save and defend their own lives) which in the civil wars of France cut off their horse-legs and so made themselves a breast-work of their bodies. Nor dare I judge king David for houghing his enemies’ horses, thereby to make them unserviceable for the wars, 2 Sam. 8:4. Let’s not be superstitiously afraid to use these creatures, either for food, physic or service, no nor for our honest delight and recreation. See your charter for so doing, if not implicitly given to Adam, yet expressly to Noah; and again renewed, Acts 10, under the Gospel, in the vision and voice to Peter, ‘Arise Peter, kill, and eat.’ And though ’tis said the disciples of the Nazarites may be known by their abstinence from the flesh of all living creatures, yet our Lord Jesus Christ of Nazareth, and He that in substance though not in vow and ceremony was the true Nazarite, gave his disciples no such commandment. Those who refuse altogether to eat the flesh of living creatures, when duly killed, deserve the name of Pythagoreans, followers of Pythagoras the philosopher, rather than to be called Christians or disciples of Christ our Saviour. So then, use these creatures we may, we must, without scruple for our meat; yea and we may use these creatures for our work, to plow and harrow the ground, and to carry our corn into the barn, and for any other necessary use. And although many condemn those persons who promote the generation of mules [which are a mix of species], so does Maimonides in his More Nev. p. 3, ch. 4 and our own writers on Gen. 36:24, yet we may use them lawfully; for we find them brought to Solomon, 1 Kings 10:25; 2 Chron. 9:24, and amongst the Israelites at their return from captivity, Ezra 2:66 and Neh. 7:68. And we nowhere find that ever they were commanded to put these away, though monsters in nature, as they were to put away their outlandish wives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hodges.html">Thomas Hodges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creature’s Goodness, as they came out of God’s Hands, &amp; the good man’s mercy to the brute creatures, which God has put under his feet in Two Sermons</cite>, (London, 1675), sermon 2, pp. 40-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

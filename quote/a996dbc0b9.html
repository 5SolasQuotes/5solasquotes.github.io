<blockquote><p>The celebration of the Sabbath stands in two things:

Rest.

Sanctification.

The Rest of the day is appointed in regard of the Sanctification chiefly, being of it self nothing acceptable to God; for a mere rest, that is, a cessation from doing work if it be not referred to an holy end, and joined with a holy use, is idleness, and so rather a sin then a duty, and therefore he saith, Remember the day of rest to sanctify it, Exod. 20. 8. see Deut. 5. 12. Ezek. 28. 12. shewing that the rest must have reference to the sanctification.

About which rest it will be needful to shew,

From labours first.

All labours or works are of two sorts, some religious, tending to the service of God, these are not understood here, as not being our works but God’s, and therefore they are not forbidden. Some are civil or natural, tending to the commodity of this present life, such as are specially the labours of our ordinary callings, buying, selling, travelling, pleading, making any handy-work, or the like. Now all these are here forbidden, yet not simply but with limitation. For

1. Works of mercy may be done on the Lord’s day without sin, and might ever, for mercy must take the upper hand of all external acts of Religion, as being more essentially and intrinsically good then any of them, hence Christ saith, It is lawful to do good on the Sabbath day, meaning by good works works of mercy, and so he justifieth the pulling of an Ox or an Ass out of a ditch upon the Sabbath day, and himself did cure those diseased people which came unto him on the Sabbath day; so that if either man or beast be in distress, it is lawful to work, labour, and take pains for their help, succour and relief; and this prohibition must be understood not to reach to such things, and therefore the lawfulness of doing them cannot impeach the perpetuity of this Commandment.

2. Works of necessity may be done, such I mean as are requisite for the preventing of imminent danger, as Elijah did flee for his life divers days, whereof some must needs fall out on the Sabbath; and in the time of war men may fight on the Sabbath-day, and so they may quench a fire if it happen, or the like, or stop an inundation of the Sea, or prevent any other like imminent peril which cannot be prevented without labouring presently.

3. Works needful for the comfortable passing of the Sabbath, as dressing of moderate food, and the like, may be done on the Sabbath-day; for seeing Christ allows us to lead the Ox to the water, and requireth not to fetch in water for him over night, he alloweth us to dress meat, and requireth not to dress it over night. For the order in the Law of not kindling a fire pertained alone to the business of the Tabernacle, and that order of dressing what they would dress on the sixth day, pertained alone to the matter of Manna. And for this we have Christ’s clear example, who being invited went to a feast on the Sabbath-day, which he might not have done if it had been unlawful to dress meat and drink on the Lord’s day, for a feast sure was not kept without some preparation of warm meat. This example of Christ we have Luke 14. 1, 8, 12. which verses compared make it apparent that it was a feast whereto he was bidden amongst divers others.

So then all labours and businesses except in these three cases are unlawful, for mercy, necessity, and present needful comfort. And not alone the labour of the hand about these things, but also the labour of the tongue and of the heart, in speaking and thinking of these businesses out of the cases excepted, is condemned, as the Prophet Isaiah doth plainly shew, commanding to sanctify the Sabbath to the Lord, not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words; our own words must be forborne, and our own pleasure, and consequently our own thoughts, for indeed words and thoughts of worldly businesses are as opposite to the sanctifying of the Sabbath as works, seeing the soul can no better be employed in holy exercises if it give it self to them, then if the whole body were so bestowed. So the true keeping of the Sabbath requireth the turning of hand, tongue and heart from our own ways, and thoughts, and words, that is, such as concern our own worldly matters and affairs.</p></blockquote>

<blockquote><p>BY Formality. Where the Worship of God is set up, Men don’t readily lose the form, but it is a frequent thing to lose the power of Godliness. It is an easy thing to carry on Praying, to attend Public Worship, and to attend duties of Religion on the Sabbath: this may be done, though their hearts are violently set upon the World, and they be under great prevailings of evil affections: but it is very cross to nature to mortify corruptions, and to exercise themselves in self-denial; give their hearts to God, and to be rejoicing in the righteousness of Christ. Many times People that retain the name of living lose the life of Religion, Rev. 3.1. People are wont to grow lukewarm, Rev. 3.15. The spirit of Religion doth decay by degrees.</p></blockquote>

<blockquote><p>Every art has its basic ingredients. Grammar has the alphabet. Geometry has a few simple illustrations. These basics are important to know, but they are not the whole story. Likewise the elements of the world are not the finished product, but only those things out of which the rest are put together. Similarly, righteousness has its basic elements, its own alphabet. This elementary ABC level of righteousness has its place, in the law of Moses.

But perfect righteousness is that which is found in Christ by faith. When Christ is known by faith, relapsing into a search for righteousness by observing the feasts of the law is nothing other than if someone who was a most learned professor and master of arts should lapse back into learning the alphabet. Who would not be astonished at such stupidity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Explicatio Epistolae Pauli ad Galatas</cite>, (Frankfurt, 1546). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 145.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Every art has its basic ingredients. Grammar has the alphabet. Geometry has a few simple illustrations. These basics are important to know, but they are not the whole story. Likewise the elements of the world are not the finished product, but only those things out of which the rest are put together. Similarly, righteousness has its basic elements, its own alphabet. This elementary ABC level of righteousness has its place, in the law of Moses.

But perfect righteousness is that which is found in Christ by faith. When Christ is known by faith, relapsing into a search for righteousness by observing the feasts of the law is nothing other than if someone who was a most learned professor and master of arts should lapse back into learning the alphabet. Who would not be astonished at such stupidity?”

— Johannes Brenz, Explicatio Epistolae Pauli ad Galatas, (Frankfurt, 1546). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 145.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvery+art+has+its+basic+ingredients.+Grammar+has+the+alphabet.+Geometry+has+a+few+simple+illustrations.+These+basics+are+important+to+know%2C+but+they+are+not+the+whole+story.+Likewise+the+elements+of+the+world+are+not+the+finished+product%2C+but+only+those+things+out+of+which+the+rest+are+put+together.+Similarly%2C+righteousness+has+its+basic+elements%2C+its+own+alphabet.+This+elementary+ABC+level+of+righteousness+has+its+place%2C+in+the+law+of+Moses.%0A%0ABut+perfect+righteousness+is+that+which+is+found+in+Christ+by+faith.+When+Christ+is+known+by+faith%2C+relapsing+into+a+search+for+righteousness+by+observing+the+feasts+of+the+law+is+nothing+other+than+if+someone+who+was+a+most+learned+professor+and+master+of+arts+should+lapse+back+into+learning+the+alphabet.+Who+would+not+be+astonished+at+such+stupidity%3F%E2%80%9D%0A%0A%E2%80%94+Johannes+Brenz%2C+Explicatio+Epistolae+Pauli+ad+Galatas%2C+%28Frankfurt%2C+1546%29.+Quoted+in+Gerald+L.+Bray%2C+Timothy+F.+George%2C+Scott+M.+Manetsch+%28eds%29%2C+Reformation+Commentary+on+Scripture+X%3A+Galatians%2C+Ephesians+%28Downers+Grove+IL%3A+IVP+Academic%2C+2011%29%2C+p.+145.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4939dbe389.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4939dbe389.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/12/06/johannes-brenz-on-the-folly-of-reverting-to-the-mosaic-ceremonies/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-76a94a8e0b" data-kw="">
<blockquote><p>The women’s preparation, verse 20, ‘And Miriam the prophetess the sister of Aaron, took a timbrel in her hand, and all the women went out after her with timbrels and dances’… Question. Is this practice now imitable in the Church? Answer: No, for:

1. This was done by a prophetical and extraordinary instinct.

2. It was a service suitable to that legal constitution at that time.

3. The Gospel only requires spiritual sacrifices of praise and singing.</p></blockquote>

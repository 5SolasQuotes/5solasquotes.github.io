<blockquote><p>(2)… Although God wills some things voluntas signi [will of sign, or the revealed will], like the repentance of the reprobate, the faith of Judas, the non-slaying of Christ, which He nevertheless anything but decreed by voluntas beneplaciti [will of good-pleasure, or decree] as things that would never happen; and He wills some things voluntas beneplaciti, which He can anything but will voluntate signi, like the selling of Joseph or the slaying of Christ. (3) But these wills are not contrary, because they are not concerned with the same things, nor is their connection and reference the same. The object of the beneplacitum [good-pleasure of decree] is an existent eventuating [causing to become an event] in the nature of things, which is to have or not to have an actual existence, be it a good or a bad existent [existence], consonant or not with the voluntas signi. But the object of the voluntas signi is approval of the morally good and honorable or disapproval of the unjust and wicked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 5, ‘The Attributes of God’, section 25 in Reformed Dogmatics, ed. Bizer (1950; Wipf &amp; Stock, 2007), pp. 85-88</cite>, p. 87</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e02eae89de" data-kw="">
<blockquote><p>The will of God is one, since it is the very essence of God. Yet sometimes it is spoken of as many, as in the words of Ps. 110:2: ‘Great are the works of the Lord, sought out according to all His wills.’ Therefore sometimes the sign must be taken for the will… Some things are said of God in their strict sense; others by metaphor, as appears from what has been said before (q. 13, art. 3). When certain human passions are predicated of the Godhead metaphorically, this is done because of a likeness in the effect. Hence a thing that is in us a sign of some passion, is signified metaphorically in God under the name of that passion… In the same way, what is usually with us an expression of will, is sometimes metaphorically called will in God; just as when anyone lays down a precept, it is a sign that he wishes that precept obeyed. Hence a divine precept is sometimes called by metaphor the will of God, as in the words: ‘Thy will be done on earth, as it is in heaven’ (Matt 6:10)… Therefore in God there are distinguished will in its proper sense, and will as attributed to Him by metaphor. Will in its proper sense is called the will of good pleasure; and will metaphorically taken is the will of expression [signi], inasmuch as the sign itself of will is called will… Expressions [signa] of will are called divine wills, not as being signs that God wills anything; but because what in us is the usual expression [signa] of our will, is called the divine will in God. Thus punishment is not a sign that there is anger in God; but it is called anger in Him, from the fact that it is an expression [signum] of anger in ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, q. 19, art. 11</cite></span></figcaption>

<blockquote><p>These sensual atheists, then turning the grace of God into wantoness and giving over themselves to the following of their lusts, securely derided and scoffed at any directions of holiness or denunciations of judgments which opposed them in their ungodly courses as vain and contemptible fables: … 4. It makes all the means of grace ineffectual; scorners will not be bettered: ‘Rebuke a scorner, and he will hate thee;’ the strength of this sin makes all the helps of holiness to be but weak; they all slide off, as water from an oiled post. A scorner, is (as it were) a brazen wall, which beats back all the arrows of reprehension. Mocking argues obduratenesse in sin; It extinguishes light natural and opposes light spiritual.</p></blockquote>

<blockquote><p>(2) In this Sinai-Covenant Jesus Christ is frequently tendered unto Israel, and that in variety of notions and considerations as has been abundantly manifested: The Tabernacle, the veil, the ark, the mercy-seat over the ark, the high priest with his consecration, garments, office, etc. the sacrifices of all sorts, the altar of incense, the altar of burnt-offering, etc. they all typed out and tendered Christ to Israel. Consequently true faith in Christ must herein be necessarily implied and required of Israel for discerning Christ in these mysteries, for apprehending and applying Him unto themselves for righteousness and salvation accordingly. For without such faith to apprehend and apply Christ, all these manifestations of Christ to Israel had been vain, useless and ineffectual.</p></blockquote>

<blockquote><p>38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’ 39. Therefore there is no cause properly so called to be given of God’s will. 40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself. 41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another. 42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature. 43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed. 44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’ 45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity... (d. 1633; London: Griffin, 1642), bk. 1, ch. 7, Of the Decree &amp; Counsel of God</cite>, pp. 32-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’ 39. Therefore there is no cause properly so called to be given of God’s will. 40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself. 41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another. 42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature. 43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed. 44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’ 45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…”

— William Ames, The Marrow of Sacred Divinity... (d. 1633; London: Griffin, 1642), bk. 1, ch. 7, Of the Decree &amp; Counsel of God, pp. 32-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C38.+Hence+the+will+of+God+is+the+first+cause+of+things.+Rev.+4%3A11%2C+%E2%80%98By+thy+will+they+are%2C+and+were+created.%E2%80%99+But+the+will+of+God%2C+as+it+wills+to+work+outwardly%2C+does+not+presuppose+the+goodness+of+the+object%2C+but+by+willing+does+make+the+object.+James+1%3A18%2C+%E2%80%98Because+He+would%2C+He+begat+us.%E2%80%99+Rom.+9%3A18%2C+%E2%80%98He+hath+mercy+on+whom+He+will.%E2%80%99+39.+Therefore+there+is+no+cause+properly+so+called+to+be+given+of+God%E2%80%99s+will.+40.+Hence+it+is+rightly+said+that+God+does+will+one+thing+to+exist+for+another%3A+but+not+that+that+one+thing+is+a+proper+cause+whereby+the+will+of+God+is+inwardly+moved+to+appoint+that+other+thing.+So+God+would+that+the+sun+and+stars+should+exist%2C+for+the+generation%2C+conservation+and+corruption+of+things+below%3A+yet+the+sun+and+stars+are+not+a+cause+why+God+would+that+those+things+should+be+generated%2C+conserved+and+corrupted.+And+so+it+is+in+all+things+out+of+God%2C+which+indeed+among+themselves+are+causes+and+effects%2C+even+as+they+depend+upon+the+divine+will%2C+but+there+is+no+cause+of+God%E2%80%99s+will+out+of+itself.+41.+Also+the+willing+of+one+thing+in+God+is+not+properly+a+cause+effecting+that+He+will+another+thing+in+Himself%2C+because+the+efficiency+of+a+cause+upon+an+effect%2C+and+dependance+of+the+effect+upon+a+cause%2C+cannot+be+in+the+will+of+God%2C+which+is+God+Himself%2C+truly+and+simply+willing+all+things+together+and+at+once%2C+with+one+only+act%3B+yet+it+is+true+that+the+Schoolmen+say+that+a+passive+attingency+of+the+divine+will+in+respect+of+one+thing+is+a+cause+of+a+passive+attingency+in+respect+of+another%3A+and+so+in+this+sense+it+is+truly+and+piously+said+that+God+wills+some+one+thing+because+He+wills+another.+42.+Therefore+although+He+wills+many+things+which+will+not+follow+but+upon+some+antecedent+act+of+the+creature%2C+yet+the+very+act+of+willing+in+God+does+not+properly+depend+as+a+consequent+thing+upon+the+act+of+the+creature.+Neither+is+it+lawful+under+the+appellation+of+an+%E2%80%98antecedent+will%E2%80%99+to+give+unto+God+that+imperfect+will+which+is+called+velleitas%2C+a+%E2%80%98woulding%E2%80%99+in+the+schools.+For+it+does+not+agree+to+an+omniscient%2C+omnipotent+and+infinitely%2C+blessed+Nature.+43.+Wherefore+that+opinion+which+determines+that+God+does+will+something+antecedently+to+the+act+of+the+creature%2C+which+same+thing+afterwards+He+wills+not+towards+them%2C+but+wills+another+thing%2C+is+not+to+be+admitted%3A+because+it+makes+the+will+of+God+mutable+and+depending+upon+the+act+of+the+creature%2C+so+that+as+often+as+the+act+of+the+creature+is+changed%2C+so+often+also+it+is+changed.+44.+By+that+opinion+also%2C+that+form+of+speech+prescribed+in+the+Word+of+God+wherein+we+commit+ourselves+and+all+ours+to+God%2C+as+%E2%80%98I+will+do+this+or+that+if+God+will%2C%E2%80%99+%5BJm.+4%3A15%5D+should+not+be+used+in+all+things%2C+but+%5Brather%2C+it+is+by+that+opinion%5D+turned+contrarily%2C+%E2%80%98God+will+do+this+or+that%2C+if+man+will.%E2%80%99+45.+This+will+determines+of+all+things%2C+greatest%2C+least%2C+contingent%2C+necessary%2C+free%2C+without+exception%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Sacred+Divinity...+%28d.+1633%3B+London%3A+Griffin%2C+1642%29%2C+bk.+1%2C+ch.+7%2C+Of+the+Decree+%26+Counsel+of+God%2C+pp.+32-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F821a5bc8f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/821a5bc8f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=38.%20Hence%20the%20will%20of%20God,least%2C%20contingent%2C%20necessary%2C%20free%2C%20without%20exception&amp;text=38.%20Hence%20the%20will%20of

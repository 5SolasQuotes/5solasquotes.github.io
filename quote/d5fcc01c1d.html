<main class="wrap"><figure class="quote" id="q-d5fcc01c1d" data-kw="">
<blockquote><p>Dr. [Henry] Cooke is the greatest man who has sprung as yet from the Scoto-Irish race. Forty years ago he was the most conspicuous figure in Ulster; no other man in the province had rendered such eminent service to the community; no other whose pulpit and platform oratory had produced so powerful an effect; no other who, by name and character, was so well known to every class of Ulsterman.

But time makes havoc of the fame even of the greatest and the best. Twenty years are not yet complete since he was laid to rest in the quiet cemetery of Malone; and already a generation has grown up to manhood who never heard and never saw him, while the middle aged only knew him in his decline. It is only the oldest of us who saw and heard him in the maturity of his splendid powers.

It has been thought wise to take advantage of the centenary of his birth to recall the main events of his history, to recount the services that he rendered to the Church and country, and to remind you of the principles associated with his name. You do not believe in canonization or in saints’ days; neither do I. But we cannot be “followers of them who by faith and patience are now inheriting the promises” except we know what they did that was worthy of being followed; and one day in a hundred years, and only two hours of that day, are not too much to devote to the subject.

The centenary of a man’s birth is more suitable for observance than the centenary of his death. Entrance on life is more pleasant to think of than departure from it; the generation who knew him are not yet altogether gone; and it is not impossible that before all impression of him has faded from the memory of the living some aspect of his character which has escaped the notice of his biographer may be caught up and preserved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/londonderry-sentinel.html">Londonderry Sentinel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Londonderry Sentinel</cite>, 10 May 1888.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a49e58b9f9" data-kw="">
<blockquote><p>The fourth commandment is this: Remember that thou keep holy the Sabbath day. Six days shalt thou labour and doe all that thou hast to do. But the seventh day is the Sabbath of the Lord thy God, in it thou shalt doe no manner of work, thou nor thy son, nor thy daughter, thy manservant, nor thy maidservant, the cattle nor the stranger that is within thy gates. For in six days the Lord made heaven and earth, the sea and all that in them is, and rested the seventh day, wherefore the Lord blessed the Sabbath day, and hallowed it.

The sanctification of the Sabbath day is the appointing of an holy day to the public worship of God: or else it is to bestow a day in holy works and exercises. There are four parts of the sanctification of the Sabbath the handling of God’s word, the using of the Sacraments public calling on God by prayer, and the exercising of the works of mercy.

God for two causes would have a certain time appointed for the ministry of the Church.

Now we are not bound to the seventh day: for Christ by his coming hath abolished the ceremonies of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal pointes whereof are contain</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 57-58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-bcd8e05fc5" data-kw="">
<blockquote><p>Read and do, read and practise what you read, or else all your reading will do you no good. He that hath a good book in his hand, but not a lesson of it in his heart or life, is like that ass that carrieth burdens, and feeds upon thistles. In divine account, a man knows no more than he doth. Profession without practice will but make a man twice told a child of darkness …

There is no fear of knowing too much, though there is much fear in practising too little; the most doing man shall be the most knowing man; the mightiest man in practice will in the end prove the mightiest man in Scripture, John vii. 16, 17, Ps. cxix. 98-100. … The true reason why many read so much and profit so little is, because they do not apply and bring home what they read to their own souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 291-92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Now because lots may say to cards what Naomi said to Boaz, ‘They are near unto us, and of our affinity,’ something also of the use of them. It were no great harm if there were no other cards used than those of clothiers about wool and of mariners in the ship. But as for cards to play with, let us not wholly condemn them, lest lacing our consciences too straight we make them to grow awry on the wrong side. Such recreations are lawful if we use them as Jonathan tasted the honey, putting forth the end of his rod he touched a little of it, and his eyes were cleared. But let us take heed of a surfeit into which those do fall who either play out of covetousness, or for more than their estates can bear, or constantly and continually; all their meat is sauce, all the days in their almanac play-days, though few holy-days. The Creation lasted but a week, but these men’s recreations all the days of their lives; such using of lawful exercises is altogether unlawful.</p></blockquote>

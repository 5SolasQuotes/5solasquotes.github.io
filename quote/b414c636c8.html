<main class="wrap"><figure class="quote" id="q-b414c636c8" data-kw="">
<blockquote><p>Shall it be said that sin does not displease God; that He has no will against sin; it is not repugnant to his will? Yes; it is to his revealed will, to his law. But is that an untrue revelation? His law is not his will itself, but the signum [sign], the discovery of his will. Now, is it an insignificant sign? A sign that signifies nothing? Or to which there belongs no correspondent significatum [signification]? –nothing that is signified by it? Is that which is signified (for sure no one will say it signifies nothing) his real will, yea or no? Who can deny it? That will, then (and a most calm, sedate, impassionate will it must be understood to be), sin and consequently the consequent miseries of his creatures, are repugnant unto. … Therefore, it seems out of question, that the holy God does constantly and perpetually, in a true sense, will universal obedience, and the consequent felicity of all his creatures capable thereof; i.e. He does will it with simple complacency, as what were highly grateful to Him, simply considered by itself. Who can doubt, but that purity, holiness, blessedness, wheresoever they were to be beheld among his creatures, would be a pleasing and delightful spectacle to Him, being most agreeable to the perfect excellency, purity, and benignity of his own nature, and that their deformity and misery must be consequently unpleasing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, Appendix, “How God is said to Will the Salvation of them that Perish”</cite>, pp. 386-8</span></figcaption>

ener">Share on X</a><a class="perma" href="../quote/b414c636c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=Shall%20it%20be%20said%20that%20sin,and%20misery%20must%20be%20consequently%20unpleasing&amp;text=Shall%20it%20be%20said%20that%20sin%20does%20not&amp;text=their%20deformity%20and%20misery%20must%20be%20consequently%20unpleasing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The third question. Whether the will of God be simply one, or divers; and if divers, which they be. … Secondly it is diverse in respect of diverse sorts of manners by which he seems to will those things which he will. For he wills good after one sort even for himself, evil after another, and for another respect then for itself, to wit, for the good may come of it: that is called his good will; for this his permissive will, or voluntary permission. Again he wills some things simply, as to create the world, save the elect, send his Son, &amp;c., others he wills conditionally, as if all men will be saved they must keep the commandments; or believe in Christ: and so some do interpret that place, “God would have all men to be saved.” His absolute will, say some, is ever done, his conditional will is not, but when the condition is performed: and therefore both these wills have divers names amongst divines. The first is called voluntas beneplaciti, the will of his good pleasure, because it simply so pleases God that this or that shall be done, which is properly his will: the other is called voluntas signi, the will of sign: because that precepts and promises with condition observing them, are signs that God will do so, though always and in all things he simply will not that which he commands, or promises: as we may see both in Abraham and Pharaoh. He commanded Abraham to kill his son, and it was a sign he would have had him done so, because he commanded: yet God would not that he should do it, for he forbad him, and he did it not: and this was the will of his good pleasure. He commanded Pharaoh to let Israel go: but he would not have him do so, for he hardened his heart lest he should let them depart: yet his commandment was a sign of his will, but such as one as Ludovieus Vives says, is improperly called his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Live Everlasting: or the True Knowledge of One Iehova, Three Elohim and Jesus Immanuel: Collected Out of the Best Modern Divines, and compiled into one volume by Robert Hill ([Cambridge:] Legat, 1601), pp. 250-53 This work is largely a translation and abridgement of Zanchi’s De natura Dei.</cite></span></figcaption>

</figure><figure class="quote" id="q-e33d02e0fa" data-kw="">
<blockquote><p>For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end [such as salvation in the gospel call] is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>

.%2013%3A9&amp;text=For%20God%20properly%20intends%20no%20end%20of%20his&amp;text=your%20destruction%20is%20out%20of%20yourself%2C%20Hos.%2013%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26)… Neither will it salve the business, to say, there is a voluntas signi [will of sign] in all this; for what is voluntas signi, if it be not signum voluntatis [asign of the will]? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart? When God makes his great gospel supper, and says, ‘Come, for all things are ready;’ he is not, he cannot be like him with the evil eye, who says, Eat and drink, but his heart is not with thee, (Prov.xxiii.6.7.) No, God’s heart goes along with every offer of grace; he never calls, but in a serious manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Edward Polhill (1622-1694) on Matthew 23:37’ in “The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill (Morgan, PA.: Soli Deo Gloria Publications, 1998)</cite>, pp. 208-10</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26)… Neither will it salve the business, to say, there is a voluntas signi [will of sign] in all this; for what is voluntas signi, if it be not signum voluntatis [asign of the will]? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart? When God makes his great gospel supper, and says, ‘Come, for all things are ready;’ he is not, he cannot be like him with the evil eye, who says, Eat and drink, but his heart is not with thee, (Prov.xxiii.6.7.) No, God’s heart goes along with every offer of grace; he never calls, but in a serious manner.”

— Edward Polhill, ‘Edward Polhill (1622-1694) on Matthew 23:37’ in “The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill (Morgan, PA.: Soli Deo Gloria Publications, 1998), pp. 208-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+God+by+a+virtual+or+ordinative+will+does+will+the+turning+and+salvation+of+all+men+within+the+bosom+of+the+church%3B+for+they+have+Jesus+Christ+set+before+their+eyes%2C+and+what+was+the+true+end+of+Christ%E2%80%99s+coming%2C+but+to+turn+every+one+from+his+iniquities%2C+%28Acts+3%3A26%29%E2%80%A6+Neither+will+it+salve+the+business%2C+to+say%2C+there+is+a+voluntas+signi+%5Bwill+of+sign%5D+in+all+this%3B+for+what+is+voluntas+signi%2C+if+it+be+not+signum+voluntatis+%5Basign+of+the+will%5D%3F+If+it+be+only+an+outward+sign+or+appearance%2C+and+there+be+no+counterpane+or+prototype+thereof%2C+within+the+divine+will%2C+how+is+it+a+true+sign%3F+which+way+could+it+be+breathed+out+from+God%E2%80%99s+heart%3F+When+God+makes+his+great+gospel+supper%2C+and+says%2C+%E2%80%98Come%2C+for+all+things+are+ready%3B%E2%80%99+he+is+not%2C+he+cannot+be+like+him+with+the+evil+eye%2C+who+says%2C+Eat+and+drink%2C+but+his+heart+is+not+with+thee%2C+%28Prov.xxiii.6.7.%29+No%2C+God%E2%80%99s+heart+goes+along+with+every+offer+of+grace%3B+he+never+calls%2C+but+in+a+serious+manner.%E2%80%9D%0A%0A%E2%80%94+Edward+Polhill%2C+%E2%80%98Edward+Polhill+%281622-1694%29+on+Matthew+23%3A37%E2%80%99+in+%E2%80%9CThe+Divine+Will+Considered+in+its+Eternal+Decrees%E2%80%9D+in+The+Works+of+Edward+Polhill+%28Morgan%2C+PA.%3A+Soli+Deo+Gloria+Publications%2C+1998%29%2C+pp.+208-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4033150b6b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4033150b6b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=1.%20God%20by%20a%20virtual%20or,calls%2C%20but%20in%20a%20serious%20manner&amp; <blockquote><p>53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will. 54. There are five signs included in that old verse: He instructs, forbids, permits, counsels, and fuliflls. Because counseling coincides with instruction, it would have been better to have substituted: He promises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology (1997), bk. 1, ch. 7</cite>, p. 100</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5cfce8853c" data-kw="">
<blockquote><p>The Sabbath is a commemorative institution; designed to be a monument against Atheism, and to afford time for the creature to meditate on the works, and adore the character of the great Creator. How venerable is the Sabbath, considered simply as an institution that has existed since the dawn of time! How many convulsions has it survived!

The fall came and shook the blossoms of the tree of life, and withered all the hues of Eden, – the flood came and swept away the men and the monuments of the preceding eras: since then, the tide of time has effaced the impressions made upon the world, as the ocean waves obliterate the prints upon the sand; empires have risen and fallen — cities been built and destroyed — civil codes enacted and repealed — systems of philosophy been popular and perished — the institutions of Numa, and the laws of Lycurgus exist only in history — the hieroglyphics of Egyptian wisdom are worn out — the days of Thor, Saturn, and Woden are no more sacred; — even the divinely appointed economy of Judah is terminated – the Urim and Thummim are departed — the mantle of prophecy, and the robe of priesthood, have descended upon no successor; but notwithstanding all these changes, the Sabbath still exists, and still is the “Holy of the Lord and honourable.”

Time is the mighty spoiler of every thing frivolous, and the infallible detector of fraud. The Sabbath being time tried, and time warranted, has the testimony of experience to its value, and a guarantee that it will not be subverted, by the ephemeral opposition of modern infidelity. It is possible, that institutions con genial to some of the master feelings of the human mind, when sanctioned by law, and shielded by power, may survive many a century, and still be of the “earth earthy.”

The observance of Sabbath is not congenial to the natural feelings of the heart; much opposition has been made to it in the world; yet it has weathered all the storms and withstood all the changes of time. Is not its preservation then a proof that the Sabbath is divine? the gates of hell have not prevailed against it, because it was appointed by the wisdom, and is defended by the power of God. Such an institution demands our reverence, were it for nothing else than its age. Ye worshippers of antiquity! Ye fond adorers of the times and things of old! Behold in the Sabbath, an institution older than all the monuments of antiquity, at the sight of which, your eyes brighten and your hearts swell! Here is a relict of Paradise: on it, lavish a portion of your veneration, and for once you may be both rational and pious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), pp 7-9.</span></figcaption>

<blockquote><p>Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.</p></blockquote>

<blockquote><p>As the authority of the Law and the priesthood is the same, Christ became not only a priest, but also a Lawgiver; so that the right of Aaron, as well as of Moses, was transferred to him. The sum of the whole is, that the ministry of Moses was no less temporary than that of Aaron; and hence both were annulled by the coming of Christ, for the one could not stand without the other. By the word Law, we understand what peculiarly belonged to Moses; for the Law contains the rule of life, and the gratuitous covenant of life; and in it we find everywhere many remarkable sentences by which we are instructed as to faith, and as to the fear of God. None of these were abolished by Christ, but only that part which regarded the ancient priesthood.

For Christ is here compared with Moses; whatever then they had in common, is not to be taken to the account, but only the things in which they differ. They in common offer God’s mercy to us, prescribe the rule of a holy and godly life, teach us the true worship of God, and exhort us to exercise faith and patience, and all the duties of godliness. But Moses was different from Christ in this respect, that while the love of the Gospel was not as yet made known, he kept the people under veils, set forth the knowledge of Christ by types and shadows, and, in short, accommodated himself to the capacity of ignorant people, and did not rise higher than to puerile elements. We must then remember, that the Law is that part of the ministration which Moses had as peculiarly his own, and different from that of Christ. That law, as it was subordinate to the ancient priesthood, was abolished when the priesthood was abolished. And Christ, being made a priest, was invested also with the authority of a legislator, that he might be the teacher and interpreter of the new covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p. 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, p. 167.</span></figcaption>

<blockquote><p>The Jews in their time provoked justly the vengeance of God, for that partly they abused his holy temple with the detestable idolatry of the heathen, and superstitious vanities of their own inventions, contrary to God’s commandment; partly they resorted unto it as hypocrites, spotted, imbrued, and foully defiled with all kind of wickedness and sinful life; partly many of them passed little upon the holy temple, and forced not whether they came thither or no.

And have not the Christians of late days, and even in our days also, in like manner provoked the displeasure and indignation of Almighty God, partly, because they have profaned and defiled their churches with heathenish and Jewish abuses, with images and idols, with numbers of altars too superstitiously and intolerably abused, with gross abusing and filthy corrupting of the Lord’s holy Supper, the blessed Sacrament of his Body and Blood, with an infinite number of toys and trifles of their own devices, to make a goodly outward shew, and to deface the homely, simple, and sincere religion of Christ Jesus? Partly, they resort to the church like hypocrites, full of all iniquity and sinful life, having a vain and a dangerous fancy and persuasion, that if they come to the church, besprinkle them with holy water, hear a mass, and be blessed with the chalice, though they understand not one word of the whole service, nor feel one motion of repentance in their hearts, all is well, all is sure.

Fie upon such mocking and blaspheming of God’s holy ordinance. Churches were made for another purpose, that is, to resort thither and to serve God truly, there to learn his blessed will, there to call upon his mighty Name, there to use the holy Sacraments, there to travail how to be in charity with thy neighbour, there to have thy poor and needy neighbour in remembrance, from thence to depart better and more godly than thou earnest thither.

Finally, God’s vengeance hath been and is daily provoked, because much wicked people pass nothing to resort to the church, either for that they are so sore blinded, that they understand nothing of God and godliness, and care not with devilish example to offend their neighbours; or else for that they see the church altogether scoured of such gay gazing sights as their gross fantasy was greatly delighted with, because they see the false religion abandoned and the true restored, which seemeth an unsavoury thing to their unsavoury taste; as may appear by this, that a woman said to her neighbour, Alas, gossip, what shall we now do at church, since all the saints are taken away, since all the goodly sights we were wont to have are gone, since we cannot hear the like piping, singing, chanting, and playing upon the organs, that we could before?

But, dearly beloved, we ought greatly to rejoice and give God thanks, that our churches are delivered of all those things which displeased God so sore, and filthily defiled his holy house and his place of prayer; for the which he hath justly destroyed many nations; according to the saying of St. Paul, If any man defile the temple of God, God will him destroy. And this ought we greatly to praise God for, that such superstitious and idolatrous manners as were utterly naught and defaced God’s glory are utterly abolished, as they most justly deserved, and yet those things that either God was honoured with or his people edified are decently retained, and in our churches comely practised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewell.html">John Jewell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Homily on the Place and Time of Prayer. Second Part in Thomas Cranmer and John Jewell, The Two Books of Homilies Appointed to be Read in Churches</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Jews in their time provoked justly the vengeance of God, for that partly they abused his holy temple with the detestable idolatry of the heathen, and superstitious vanities of their own inventions, contrary to God’s commandment; partly they resorted unto it as hypocrites, spotted, imbrued, and foully defiled with all kind of wickedness and sinful life; partly many of them passed little upon the holy temple, and forced not whether they came thither or no.

And have not the Christians of late days, and even in our days also, in like manner provoked the displeasure and indignation of Almighty God, partly, because they have profaned and defiled their churches with heathenish and Jewish abuses, with images and idols, with numbers of altars too superstitiously and intolerably abused, with gross abusing and filthy corrupting of the Lord’s holy Supper, the blessed Sacrament of his Body and Blood, with an infinite number of toys and trifles of their own devices, to make a goodly outward shew, and to deface the homely, simple, and sincere religion of Christ Jesus? Partly, they resort to the church like hypocrites, full of all iniquity and sinful life, having a vain and a dangerous fancy and persuasion, that if they come to the church, besprinkle them with holy water, hear a mass, and be blessed with the chalice, though they understand not one word of the whole service, nor feel one motion of repentance in their hearts, all is well, all is sure.

Fie upon such mocking and blaspheming of God’s holy ordinance. Churches were made for another purpose, that is, to resort thither and to serve God truly, there to learn his blessed will, there to call upon his mighty Name, there to use the holy Sacraments, there to travail how to be in charity with thy neighbour, there to have thy poor and needy neighbour in remembrance, from thence to depart better and more godly than thou earnest thither.

Finally, God’s vengeance hath been and is daily provoked, because much wicked people pass nothing to resort to the church, either for that they are so sore blinded, that they understand nothing of God and godliness, and care not with devilish example to offend their neighbours; or else for that they see the church altogether scoured of such gay gazing sights as their gross fantasy was greatly delighted with, because they see the false religion abandoned and the true restored, which seemeth an unsavoury thing to their unsavoury taste; as may appear by this, that a woman said to her neighbour, Alas, gossip, what shall we now do at church, since all the saints are taken away, since all the goodly sights we were wont to have are gone, since we cannot hear the like piping, singing, chanting, and playing upon the organs, that we could before?

But, dearly beloved, we ought greatly to rejoice and give God thanks, that our churches are delivered of all those things which displeased God so sore, and filthily defiled his holy house and his place of prayer; for the which he hath justly destroyed many nations; according to the saying of St. Paul, If any man defile the temple of God, God will him destroy. And this ought we greatly to praise God for, that such superstitious and idolatrous manners as were utterly naught and defaced God’s glory are utterly abolished, as they most justly deserved, and yet those things that either God was honoured with or his people edified are decently retained, and in our churches comely practised.”

— John Jewell, An Homily on the Place and Time of Prayer. Second Part in Thomas Cranmer and John Jewell, The Two Books of Homilies Appointed to be Read in Churches">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Jews+in+their+time+provoked+justly+the+vengeance+of+God%2C+for+that+partly+they+abused+his+holy+temple+with+the+detestable+idolatry+of+the+heathen%2C+and+superstitious+vanities+of+their+own+inventions%2C+contrary+to+God%E2%80%99s+commandment%3B+partly+they+resorted+unto+it+as+hypocrites%2C+spotted%2C+imbrued%2C+and+foully+defiled+with+all+kind+of+wickedness+and+sinful+life%3B+partly+many+of+them+passed+little+upon+the+holy+temple%2C+and+forced+not+whether+they+came+thither+or+no.%0A%0AAnd+have+not+the+Christians+of+late+days%2C+and+even+in+our+days+also%2C+in+like+manner+provoked+the+displeasure+and+indignation+of+Almighty+God%2C+partly%2C+because+they+have+profaned+and+defiled+their+churches+with+heathenish+and+Jewish+abuses%2C+with+images+and+idols%2C+with+numbers+of+altars+too+superstitiously+and+intolerably+abused%2C+with+gross+abusing+and+filthy+corrupting+of+the+Lord%E2%80%99s+holy+Supper%2C+the+blessed+Sacrament+of+his+Body+and+Blood%2C+with+an+infinite+number+of+toys+and+trifles+of+their+own+devices%2C+to+make+a+goodly+outward+shew%2C+and+to+deface+the+homely%2C+simple%2C+and+sincere+religion+of+Christ+Jesus%3F+Partly%2C+they+resort+to+the+church+like+hypocrites%2C+full+of+all+iniquity+and+sinful+life%2C+having+a+vain+and+a+dangerous+fancy+and+persuasion%2C+that+if+they+come+to+the+church%2C+besprinkle+them+with+holy+water%2C+hear+a+mass%2C+and+be+blessed+with+the+chalice%2C+though+they+understand+not+one+word+of+the+whole+service%2C+nor+feel+one+motion+of+repentance+in+their+hearts%2C+all+is+well%2C+all+is+sure.%0A%0AFie+upon+such+mocking+and+blaspheming+of+God%E2%80%99s+holy+ordinance.+Churches+were+made+for+another+purpose%2C+that+is%2C+to+resort+thither+and+to+serve+God+truly%2C+there+to+learn+his+blessed+will%2C+there+to+call+upon+his+mighty+Name%2C+there+to+use+the+holy+Sacraments%2C+there+to+travail+how+to+be+in+charity+with+thy+neighbour%2C+there+to+have+thy+poor+and+needy+neighbour+in+remembrance%2C+from+thence+to+depart+better+and+more+godly+than+thou+earnest+thither.%0A%0AFinally%2C+God%E2%80%99s+vengeance+hath+been+and+is+daily+provoked%2C+because+much+wicked+people+pass+nothing+to+resort+to+the+church%2C+either+for+that+they+are+so+sore+blinded%2C+that+they+understand+nothing+of+God+and+godliness%2C+and+care+not+with+devilish+example+to+offend+their+neighbours%3B+or+else+for+that+they+see+the+church+altogether+scoured+of+such+gay+gazing+sights+as+their+gross+fantasy+was+greatly+delighted+with%2C+because+they+see+the+false+religion+abandoned+and+the+true+restored%2C+which+seemeth+an+unsavoury+thing+to+their+unsavoury+taste%3B+as+may+appear+by+this%2C+that+a+woman+said+to+her+neighbour%2C+Alas%2C+gossip%2C+what+shall+we+now+do+at+church%2C+since+all+the+saints+are+taken+away%2C+since+all+the+goodly+sights+we+were+wont+to+have+are+gone%2C+since+we+cannot+hear+the+like+piping%2C+singing%2C+chanting%2C+and+playing+upon+the+organs%2C+that+we+could+before%3F%0A%0ABut%2C+dearly+beloved%2C+we+ought+greatly+to+rejoice+and+give+God+thanks%2C+that+our+churches+are+delivered+of+all+those+things+which+displeased+God+so+sore%2C+and+filthily+defiled+his+holy+house+and+his+place+of+prayer%3B+for+the+which+he+hath+justly+destroyed+many+nations%3B+according+to+the+saying+of+St.+Paul%2C+If+any+man+defile+the+temple+of+God%2C+God+will+him+destroy.+And+this+ought+we+greatly+to+praise+God+for%2C+that+such+superstitious+and+idolatrous+manners+as+were+utterly+naught+and+defaced+God%E2%80%99s+glory+are+utterly+abolished%2C+as+they+most+justly+deserved%2C+and+yet+those+things+that+either+God+was+honoured+with+or+his+people+edified+are+decently+retained%2C+and+in+our+churches+comely+practised.%E2%80%9D%0A%0A%E2%80%94+John+Jewell%2C+An+Homily+on+the+Place+and+Time+of+Prayer.+Second+Part+in+Thomas+Cranmer+and+John+Jewell%2C+The+Two+Books+of+Homilies+Appointed+to+be+Read+in+Churches&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0aa3c32a4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f0aa3c32a4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/18/the-second-book-of-homilies-on-the-abolition-of-jewish-superstitions/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.</p></blockquote>

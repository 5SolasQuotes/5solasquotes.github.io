<main class="wrap"><figure class="quote" id="q-e59b32ddfd" data-kw="">
<blockquote><p>Metaphysics is defined as the science of being qua [as] being… Metaphysics can, therefore, be described as the first real speculative science. It is a science because it is a body of demonstrated truths about a single formal object… Insofar as it is a science, metaphysics differs from sacred theology because the latter is not a science in the strict Aristotelian sense for its principles are not evident but revealed. Metaphysics is a real science, as is plain from its definition. For being signifies the same as thing or what actually exists or is at least capable of such existence. Therefore metaphysical notions are first intentions, or concepts that are predicated immediately of things themselves. So metaphysics differs from the logical sciences which deal with second intentions, that is, with concepts that are predicated immediately of other concepts or of beings of reason. Metaphysics indeed is the first or supreme real science, and so differs from other less universal real things, as physics, cosmology, psychology; for it does not just consider one or other part of reality, as these sciences do, but with the totality of things. Therefore, by reason of its material object, metaphysics is equivalent to all the real sciences taken together. Further, it is first by reason of its formal object; for the other sciences consider real things in some narrower respect, as physics considers things as changeable, cosmology things as bodily, etc. But metaphysics considers them precisely as they are real. Hence other real sciences, as cosmology, philosophy of man, presuppose metaphysics and use its conclusions as their principles. But metaphysics does not use the conclusions of any other real science, physics or natural philosophy, as principles. Metaphysics is a speculative and not practical science, because it does not tend toward any other operation but speculation. Hence it differs from ethics, which is practical.</p></blockquote>

<blockquote><p>In this scholastic theology is to be praised: 1. the simple and concise kind of language; 2. the accurate and dialectical method; 3. the use or support of philosophy and natural disciplines. They are to be blamed, however, out of themselves, even the defenders of it, by: 1. the obnoxious doctrine of the papacy unto tyranny; and hence it is false in many ways; 2. the multitude of philosophical things; 3. the curiosity of vain inquiries [or topics]; 4. the confusion itself of things, arising out of an ignorance of languages; 5. obscurity and barbarities.</p></blockquote>

</figure><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665; 2024) at Translationes Lyncei</span></figcaption>

</figure><figure class="quote" id="q-00fdb6afba" data-kw="">
<blockquote><p>We call principles those things which are known per se by the light of nature, which are known immediately, and which are unmoved or immutable, such that from them at last definite knowledge arises. From these principles the faculty of reason deduces fixed processes, like rivulets from springs. It compares the principles of nature with the truth of reality or separates them from one another. It joins causes with effects and from these forms conclusions. It decides which things are common and which unique. Finally, it so orders everything that it acquires knowledge of all those things which the reason of a person can trace down and follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’, p. 146</span></figcaption>

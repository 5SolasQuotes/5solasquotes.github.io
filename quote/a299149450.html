<main class="wrap"><figure class="quote" id="q-a299149450" data-kw="">
<blockquote><p>God is said to be powerful, because he can do more then he will: he could of stones have raised children to Abraham, but he would not; and when our blessed Lord was apprehended, he tells Peter, that he could have obtained of his Father, more then twelve legions of Angels to help him, but he would not: He can do more then he will, but he will not do all that he can.

It meets with those that deny this to God: Plinius Secundus [Pliny the Elder] saith, God is not Almighty, because he cannot lie nor deceive: Ludovicus Vives [Juan Luis Vives] wonders at this, saying, I admire that a man so wise should cavil at God’s power; but Saint Augustine answers him well, and saith, therefore is God omnipotent, because he cannot he nor deceive, for these argue impotency.

Secondly, it confutes others, who say God is not so powerful as the Scripture makes him to be, because he cannot make a thing to be against its nature, as to bee, and not to be: to whom I answer, things which in their nature are simply impossible (with reverence be it spoken) God cannot do; but all other things, though impossible to created nature, God can do; therefore this vain objection doth not disparage God’s power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/josiah-shute.html">Josiah Shute</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Cordials: Delivered in ten sermons, upon part of the ninth and tenth chapters of Ezra, in a time of visitation. By that godly and faithful preacher of God’s Word, Josiah Shute, B.D. and late rector of Mary Woolnoth’s in Lumbard-Street London</cite>, (London: Robert Bostock, 1644), pp 60-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f8c9185866" data-kw="">
<blockquote><p>…the perfection which is conceived as primary [to God] among others, serving as the reason and root of all attributes in our analogical [knowledge of God]. Since we know God by concepts that are intrinsically different, a question arises about the order that obtains among these intrinsically different concepts, and, in particular, which of these concepts corresponds to that absolute perfection in God which holds first place and is the source of all His other perfections. This is what we mean when we speak of the formal constituent of the metaphysical essence of God. To put it simply, we want to know which attribute a) is the ‘primary’ attribute, as well as the source and root of all other divine attributes, and b) that by which God is distinguished from creatures. There are many positions on this, but here, I will only present a few of them.

1. According to Neo-Platonists, goodness is what constitutes the metaphysical essence of God.

2. According to the Nominalists, the metaphysical essence of God consists in the sum-total of all perfections.

3. According to Scotus and his followers, Infinity is what constitutes His metaphysical essence.

4. According to some a number of Thomists, subsistent intellection is the constituent of God’s essence. Gonet and Billuart held this position.

5. Finally, according to St. Thomas, his followers and the majority of Scholastics, ens a se [“being from itself”] or aseity is the formal constituent of the divine essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Formal Constituent of the Divine Nature’</cite>, (2024)</span></figcaption>

<blockquote><p>I. Although the will in God is only one and most simple, by which He comprehends all things by a single and most simple act that He sees and understands all things at one glance, yet because it is occupied differently about various objects, it thus happens that in our manner of conception, it may be apprehended as manifold (not in itself and intrinsically on the part of the act of willing, but extrinsically and objectively on the part of the things willed). … XVIII. There cannot be contrariety between these two wills because they do not will and nill the same thing in the same manner and respect… … XIX. Although God may be said to will the salvation of all by the will of sign and to nill it by the beneplacit will, yet there is no contradiction here….</p></blockquote>

</figure><figure class="quote" id="q-95fb5874b7" data-kw="">
<blockquote><p>The more principal Relative Attributes are in number seven:

1. Creation.

2. Providence.

3. Lordship.

4. Benignity.

5. Mercy.

6. Redemption.

7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 10-11</span></figcaption>

ation%3A+that+is%2C+such+a+relation+as+infers+a+change+in+it.+Relative+Attributes+add+a+new+predication+or+title+to%2C+but+cause+no+real+mutation+or+change+in+God%3A+as+concerning+the+creature%2C+they+both+add+a+new+predication+to+it+and+cause+a+real+mutation+in+it.+In+all+Relative+Attributes+there+are+considerable+%28but+especially+in+Creation%2C+Providence+and+Redemption%29+an+eternal+immanent+act%2C+whereby+God+wills+such+a+thing+to+be%3B+and+a+transient+temporal+act%2C+whereby+He+works+the+thing+according+to+his+will.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%2C+%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+Of+the+Divine+Essence%2C+pp.+10-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95fb5874b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/95fb5874b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-affections-of-god/#:~:text=The%20more%20principal%20Relative%20Attributes%20are,the%20thing%20according%20to%20his%20will&amp;text=The%20more%20principal%20Relative%20Attributes%20are%20in%20number&amp;text=He%20works%20the%20thing%20according%20to%20his%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>God is Actus Purus, which is to say that He is eternally all that He can be. Potentiality is a trait of creatures, not God. The concept of Actus Purus was first articulated by Aristotle in his argument for the unmoved mover, and through its history, the church has considered this notion a valid articulation of the absolute perfection and preeminence of God over all things. This paper, then, explores the exegetical footing of Actus Purus. It also will seek to understand its implications for systematic theology. Careful exegesis will demonstrate that the doctrine of pure actuality is deducible from Scripture by good and necessary consequence. It is an instrument that helps to sound the unbounded perfection of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-quinones.html">Alan Quinones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Toward the Worship of God as Actus Purus‘ The Masters Seminary Journal 31/2</cite>, (Fall 2020), pp. 213–30</span></figcaption>

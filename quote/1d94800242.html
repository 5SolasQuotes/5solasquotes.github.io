<main class="wrap"><figure class="quote" id="q-1d94800242" data-kw="">
<blockquote><p>What we believe, reduces it self to two Heads: First, That the Persons of the Trinity are really distinct from one another: the Father is not the Son, and the Holy Spirit is neither the Father nor the Son. The other, That neither of these Persons is really distinguished from the Divine Essence which they possess:

That the Father is God, the Son God, and the Holy Ghost God; and what is more, That the Father, Son and Holy Ghost are but one God, possessing only one Divinity; so that the Divinity of the Father is the same with that of the Son; and that of the Father and the Son is not different from that of the Holy Ghost. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six conferences concerning the Eucharist wherein is shewed, that the doctrine of transubstantiation overthrows the proofs of Christian religion</cite>, trans. Thomas Tenison (London: Richard Chiswell 1687), p. 97.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-511b61b6e4" data-kw="">
<blockquote><p>That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-father.html">The Father</a></span></div>

</figure><figure class="quote" id="q-1a9897dd11" data-kw="">
<blockquote><p>As we said above, so now we repeat, that the divine generation must not be compared to the nature of men, nor the Son considered to be part of God, nor the generation to imply any passion whatever; God is not as man; for men beget passibly, having a transitive nature, which waits for periods by reason of its weakness. But with God this cannot be; for He is not composed of parts, but being impassible and simple, He is impassibly and indivisibly Father of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Four Discourses against the Arians,” in St. Athanasius</cite>, ed. Philip Schaff and Henry Wace, trans. John Henry Newman and Archibald T. Robertson, vol. 4, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literat</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

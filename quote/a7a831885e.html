<main class="wrap"><figure class="quote" id="q-a7a831885e" data-kw="">
<blockquote><p>…That three things are recorded as created, namely, the heaven, the water, and the earth; and these three received their form from the three days’ work of distinction, so that heaven was formed on the first day; on the second day the waters were separated; and on the third day, the earth was divided into sea and dry land. So also is it in the work of adornment; on the first day of this work, which is the fourth of creation, are produced the lights, to adorn the heaven by their movements; on the second day, which is the fifth, birds and fishes are called into being, to make beautiful the intermediate element, for they move in air and water, which are here taken as one; while on the third day, which is the sixth, animals are brought forth, to move upon the earth and adorn it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica, pt. 3, a Treatise on the Incarnation</cite>, 1a 70.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-584645b8ad" data-kw="">
<blockquote><p>We come now to the principle of substance. It is thus formulated: ‘That which exists as the subject of existence is substance, and is distinct form its accidents or modes.’ Thus in everyday speech we call gold or silver a substance. This principle is derived from the principle of identity, because that which exists as subject of existence is one and the same beneath all its multiple phenomena, permanent or successive. The idea of substance is thus seen to be a mere determination of the idea of being. Inversely, being is now conceived explicitly as substantial. Hence the conclusion: The principle of substance is simply a determination of the principle of identity: accidents then find their raison d’etre in the substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (n.p., 1946), ch. 4, ‘Intelligible Being &amp; First Principles’, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-577c12eebf" data-kw="">
<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of God</cite>, bk. 11, ch. 26 in NPNF1 2.220</span></figcaption>

<blockquote><p>3. The reasons which are usually brought forward by the assertors of forms [of things] must first be thoroughly known, then clearly and solidly solved. To this end some one of the more recent physical or metaphysical disputators should be read accurately by the juniors, such as [Francis] Suarez, [Benedict] Pererius, [Jacob] Revius, [Francisco de] Toledo, the [Jesuit] Conimbricenses, the [Spanish] Complutenses [at Alcala], [Rodrigo de] Arriaga, [Francisco de] Mendoza, etc. Out of all these Suarez most fully and most subtly pleads this cause. … Furthermore on the difficulties and manifold disquisition of the philosophers, so that they may explain the mode of origin of forms, consult besides Basson, bk. 3, loc. cit., especially Sennert, Hypomnem. physicor. 1. ch. 3; Suarez, Metaphysical Disputations, 15.</p></blockquote>

<blockquote><p>Thomas Aquinas begins Summa Theologicae Part III with reflections on the Incarnation of Christ… This section of the Summa reinvigorated Chalcedonian Christology in the West… Aquinas repeatedly affirms that Christ remains omnipresent according to his divine nature even while taking to himself a finite and circumscribed human nature, what will come to be known as the extra Calvinisticum in later centuries. Christ’s presence extra carnem, beyond the flesh, in no way separates the person of Christ but rather secures his presence with the Church.” (K.J. Drake, ‘Beyond the Flesh’) . Christ’s Human Nature: an Individual Thing Aquinas: “…although this human nature [of Christ] is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agreements.html">Agreements</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Extra Calvinisticum</cite></span></figcaption>

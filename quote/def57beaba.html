<main class="wrap"><figure class="quote" id="q-def57beaba" data-kw="">
<blockquote><p>Some promoters of singing hymns may differ with the [OPC] majority and minority reports, alleging that perhaps the phrase “singing of psalms” in the Westminster Confession of Faith may not mean that only psalms are to be employed in public worship. Some Presbyterians have argued that the term ‘psalms,’ being a lower case ‘p’ might refer to psalms and hymns. In the original 1648 edition of the Westminster Directory for the Publick Worship of God, the upper case ‘P’ in the term ‘Psalms’ was consistently used;¹ but regardless of which edition is used with consistent upper or lower case, it will make no difference to the true intent of the writers and signers of the Westminster Standards. The following Westminster documents consistently speak of singing psalms, with no mention of hymns: Westminster Confession of Faith (ch. XXI, sec. V), Westminster Form of Presbyterial Church Government (Of the Ordinances in a particular Congregation), and the Westminster Directory for the Publick Worship of God (Of the Sanctification of the Lord’s Day, Of Singing of Psalms). Acknowledging historic Presbyterian familiarity with the Synod of Dordrecht Church Order (1618-19) and the distinction made between psalms and hymns, in all fairness to legislative intent interpretation, the ‘psalms’ or ‘Psalms’ in the Westminster Standards must be biblical psalms of praise. ¹ The Westminster Standards, An Original Facsimile (Audubon, New Jersey: Old Paths Publications, 1997) In the later editions of the Westminster Standards, biblical psalms of praise, were commonly referred to as ‘psalms.’ In the reading of the Scriptures, in The Westminster Directory for the Publick Worship of God, it references exposition of the portion of Scripture read: “let it not be done until the whole chapter of psalm be ended” (Of Public Reading of the Holy Scriptures). Regarding public preaching, it speaks of some ‘text of scripture’; it further orders the use of “some chapter, a psalm, or book of the holy scripture” (Of the Preaching of the Word). In the Directory for the Publick Worship of God, there are parallel and coordinate directives to read or sing a ‘psalm,’ but no directive to sing a hymn. We find this same employment of the term ‘psalm’ or ‘psalms’ in the Authorised King James Version to refer to the Book of Psalms (see Luke 24:44). The London or Baptist Confession of Faith (1689) deliberately altered section V, of the chapter, Of Religious Worship and the Sabbath Day, to read “psalms, hymns, and spiritual songs.” The Baptists understood the legislative intent meaning of the Westminster Confession of Faith to be psalms only, as Ephesians 5:19 and Colossians 3:16 are used as proof-texts for the “singing of psalms with grace in the heart” (West. Con. ch. XXI, sec. V). The Baptists, therefore, decidedly rejected the historic Westminster Presbyterian interpretation of Ephesians 5:19 and Colossians 3:16. The 17th century Westminster Presbyterians interpreted, “psalms, hymns, and spiritual songs” (Eph. 5:19; Col. 3:16) to the Book of Psalms.</p></blockquote>

<blockquote><p>There are three main ends of Psalms: … 3. That all men might learn by heart the principles of religion, the Psalms (as Rivet saith) being a compendium of Scripture, affording all points necessary for doctrine and duty. Col. 3:16, ‘Let the word of Christ dwell in you richly in all wisdom; teaching, and admonishing one another in Psalms, and Hymns, and Spiritual Songs,’ etc. From which words follow also these Conclusions: 1. That Scripture psalms (even David’s Psalms, called in Hebrew by the name of Psalms, and Hymns, and Spiritual Songs) and no other, should be used in the Church; for no other are the word of Christ, and consequently cannot have that certainty, purity, authority and sufficiency that the Scripture psalms have.</p></blockquote>

<blockquote><p>Add unto this, that whereas in praying we are to speak only unto God, it is otherwise in singing, where we are taught to ‘speak unto ourselves in psalms’, and ‘to teach, and admonish ourselves in psalms, and hymns, and spiritual songs’ (Eph. 5:19; Col. 3:16). What greater difference? In prayers we speak only to God: in psalms to our selves mutually, or one to another…</p></blockquote>

</figure><figure class="quote" id="q-6fa6991128" data-kw="">
<blockquote><p>First, the Scripture will inform us that singing of Psalms is a necessary and profitable duty:

1. A necessary duty, because God requires it, Eph. 5:17-19. It is the will of God that (on the one side) Christians should not be drunk with wine; and, on the other side, be filled with the Spirit, speaking to themselves in Psalms, etc. (Col. 3:16; Beza (in location) shows that the three Greek words that are translated Psalms, Hymns, and Songs, are the same that are used by the Septuagint to render the Hebrew words, which are the Titles of diverse Psalms, which we call the Psalms of David) [We have not been able to find this reference in Beza’s NT Commentary] It is the Spirit of God that saith to the afflicted, ‘Pray’; and to the merry, ‘Sing psalms‘, Jam. 5:13.

2. And a profitable duty, because the Spirit of God declares unto us the benefit of it, prescribing that the Word of God should dwell in us richly, and then adding further, ‘teaching and admonishing one another in psalms’, etc. Now it’s true, that teaching and admonishing may be referred either to the Word of God going before, or to psalms and hymns following after; but, it comes all to one, if the psalms, hymns, and songs spoken of there, be such as are recorded in Scripture, for then they are a part of the Word of God: and so the intent of the apostle may be to show that of every part of the Word of God, and in particular of the psalms and songs thereof (the rejoicing part) use is to be made for our edification; thereby something may be added to our light in a teaching way, and to our life and vigor in piety in an admonishing way. Secondly, the Scripture gives excellent rules also for singing, that it may be a profitable duty; As that it be, 1. With understanding, Ps. 47:7; 1 Cor. 14:14-15.

2. With the heart and affection; not without the voice: but the meaning is, that we should not please and content our selves with the outward sound without an inward sense.

3. With grace in the heart, Col. 3:16, that is, (as I conceive), with a godly and gracious frame of heart inwardly, (according as the matter of the Psalm is), showing itself in a graceful and dexterous demeanor in that duty outwardly (as in a comely and reverent gesture, a decent tune and tone)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-thomas.html">William Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preservative of Piety in a Quiet Reasoning for those duties of religion, that are the means and helps appointed of God for the preserving and promoting of godliness</cite>, … (London, 1662), Pt. 2, Ch. 4, ‘Of Singing of Psalms, and namely, in Families’, pp. 195-6. Thomas was a rector in the Anglican Church.</span></figcaption>

2. And a profitable duty, because the Spirit of God declares unto us the benefit of it, prescribing that the Word of God should dwell in us richly, and then adding further, ‘teaching and admonishing one another in psalms’, etc. Now it’s true, that teaching and admonishing may be referred either to the Word of God going before, or to psalms and hymns following after; but, it comes all to one, if the psalms, hymns, and songs spoken of there, be such as are recorded in Scripture, for then they are a part of the Word of God: and so the intent of the apostle may be to show that of every part of the Word of God, and in particular of the psalms and songs thereof (the rejoicing part) use is to be made for our edification; thereby something may be added to our light in a teaching way, and to our life and vigor in piety in an admonishing way. Secondly, the Scripture gives excellent rules also for singing, that it may be a profitable duty; As that it be, 1. With understanding, Ps. 47:7; 1 Cor. 14:14-15.

2. With the heart and affection; not without the voice: but the meaning is, that we should not please and content our selves with the outward sound without an inward sense.

3. With grace in the heart, Col. 3:16, that is, (as I conceive), with a godly and gracious frame of heart inwardly, (according as the matter of the Psalm is), showing itself in a graceful and dexterous demeanor in that duty outwardly (as in a comely and reverent gesture, a decent tune and tone)…”

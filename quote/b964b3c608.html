<main class="wrap"><figure class="quote" id="q-b964b3c608" data-kw="">
<blockquote><p>2. Repentance is the same thing as special effectual calling; So we 〈◊〉[take] not ‘calling’ in the most narrow sense of all: for the bare act of faith: only this difference there is: 1. The word ‘repentance’ does specially denote our motion from the terminus a quo [end from which], even that sinful state from which we turn, and which we repent of: yet including essentially also the state to which we turn. Whereas the word ‘vocation’ does principally express the state to which we are called. 2. Also the word ‘repentance’ does principally respect our turning to God from whom we fell: But the word ‘vocation’ does as much or more respect our coming to Christ the Mediator as the way to the Father. There is a twofold repentance: 1. One is our turning from a state of sin and misery, such as the unconverted are in, and this is it that we mean now as the same with conversion from the same state. 2. There is also a particular repentance, which is a turning from a particular sin, and this must be daily renewed while we live. Repentance signifies and contains two things: The first is a hearty sorrow that ever we sinned; The second is a change of the mind from that sin to God. Indeed the former is but part of the later: The changed mind is changed in this part, and manifests its change in a special manner, by remorse for former sins: Though all remorse is not from such a change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 7-8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f8dab1808" data-kw="">
<blockquote><p>Therefore, good works do not entirely lose their salutary force by any grave sin. Let it be that they are mortified for a time. Let it be that their force and efficacy of leading to life is blunted, let it be that it is intercepted, let it be that it is suspended; yet it is not taken away, not extinguished, not abolished, not to die; but with the arrival of a new act of penitence and of trust in Christ our propitiator, they are finally revived, because the interposition of the grave sin is removed, they recover their former vigor and do not cease to exercise their force of leading to life, until all who are truly penitent are crowned, redeemed with a diadem of unfading glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-220fd0f8ce" data-kw="">
<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-alexander.html">A.A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-8236c961f6" data-kw="">

</figure><figure class="quote" id="q-37c89f6727" data-kw="">
<blockquote><p>However, such [good] works, through a new supervening sin, are said to be mortified, when they are impeded from their own proper effect and operation. For as a living thing through death loses the operation of life, so things are said by analogy to be mortified, when they are impeded from their own proper effect or operation. But the effect of good works which emanate from faith and grace, by divine ordinance and pact, is to lead to eternal life. This effect, however, is cut off when a grave sin intervenes, by which, as I might say, the said good works are mortified; and they are deprived of their own proper effect and operation of leading to life, so much so that the force of these, while the guilt of that sin lasts, is suspended. We say, however, that these very works, mortified by grave sin, are revived by penitence and recover their former vigor and virtue of leading to life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192</span></figcaption>

<div class="actions"><button class="copy" data-copy="“However, such [good] works, through a new supervening sin, are said to be mortified, when they are impeded from their own proper effect and operation. For as a living thing through death loses the operation of life, so things are said by analogy to be mortified, when they are impeded from their own proper effect or operation. But the effect of good works which emanate from faith and grace, by divine ordinance and pact, is to lead to eternal life. This effect, however, is cut off when a grave sin intervenes, by which, as I might say, the said good works are mortified; and they are deprived of their own proper effect and operation of leading to life, so much so that the force of these, while the guilt of that sin lasts, is suspended. We say, however, that these very works, mortified by grave sin, are revived by penitence and recover their former vigor and virtue of leading to life.”

— Samuel Ward, ‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+such+%5Bgood%5D+works%2C+through+a+new+supervening+sin%2C+are+said+to+be+mortified%2C+when+they+are+impeded+from+their+own+proper+effect+and+operation.+For+as+a+living+thing+through+death+loses+the+operation+of+life%2C+so+things+are+said+by+analogy+to+be+mortified%2C+when+they+are+impeded+from+their+own+proper+effect+or+operation.+But+the+effect+of+good+works+which+emanate+from+faith+and+grace%2C+by+divine+ordinance+and+pact%2C+is+to+lead+to+eternal+life.+This+effect%2C+however%2C+is+cut+off+when+a+grave+sin+intervenes%2C+by+which%2C+as+I+might+say%2C+the+said+good+works+are+mortified%3B+and+they+are+deprived+of+their+own+proper+effect+and+operation+of+leading+to+life%2C+so+much+so+that+the+force+of+these%2C+while+the+guilt+of+that+sin+lasts%2C+is+suspended.+We+say%2C+however%2C+that+these+very+works%2C+mortified+by+grave+sin%2C+are+revived+by+penitence+and+recover+their+former+vigor+and+virtue+of+leading+to+life.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98Good+Works+Mortified+by+Sin+are+Revived+by+Penitence%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%E2%80%A6+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+189-94%2C+p.+192&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F37c89f6727.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/37c89f6727.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/repentance#:~:text=However%2C%20such%20%5Bgood%5D%20works%2C%20through%20a,and%20virtue%20of%20leading%20to%20life&amp;text=However%2C%20such%20%5Bgood%5D%20works%2C%20through%20a%20new%20supervening&amp;text=former%20vigor%20and%20virtue%20of%20leading%20to%20life" rel="noopener" target="_blank

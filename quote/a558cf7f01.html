<main class="wrap"><figure class="quote" id="q-a558cf7f01" data-kw="">
<blockquote><p>Consider the doleful tragedy which he acted from first to last; meditate on his incarnation. For the Son of God to become the Son of man; for him that lived from all eternity to be born in time; for him that thundereth in the clouds to cry in the cradle; for him that created all things to become a creature, — is a greater suffering than if all the men and angels in this and the other world were crowded into an atom, or turned into nothing. This was the first and greatest step of his humiliation.

Consider the manner of his birth: he was born, not of some great princes, but of mean and indigent parents; not in a royal palace, but in a place where beggars and beasts are entertained — a stable; he was no sooner born but sought after to be butchered. He fled for his life in his very swaddling-clouts, and was an early martyr indeed.

When he grew up, though he was of ability to have swayed the sceptre of all the empires in the world, to have instructed the greatest potentates and counsellors in the mysteries of wisdom and knowledge; though to him Adam and Solomon, yea, and angels themselves, were fools, yet he lived privately with his supposed father many years, and suffered his deity to be hid, as light in a dark lantern, near thirty years, save that once it darted a little out, when at twelve years of age he disputed and confuted the great Rabbis of the Jews, Luke ii. 46.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 193.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d97c9296fc" data-kw="">
<blockquote><p>It is written (Ps. 16:10): “Nor wilt Thou suffer Thy holy one to see corruption”: and [John the] Damascene (De Fide Orth. iii) expounds this of the corruption which comes of dissolving into elements…. …It was not fitting for Christ’s body to putrefy, or in any way be reduced to dust… Christ’s death ought not to come from weakness of nature, lest it might not be believed to be voluntary: and therefore He willed to die, not from sickness, but from suffering inflicted on Him, to which He gave Himself up willingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, (3) ‘Whether His body was decomposed in the tomb? [No]’ in Question 51, Of Christ’s Burial (4 Articles)</span></figcaption>

</figure><figure class="quote" id="q-b402491f0d" data-kw="">
<blockquote><p>I will speak distinctly… how to understand his being forsaken of God, which is not to be understood: 1. As if the union of the Godhead with the human nature had been dissolved, but so as it might still be compatible, and rightly stand with it. For it was not a forsaking in respect of the essence of the Godhead, but of his presence, and so in a way of sense. The Godhead was not separated, though the operation of comfort from the Godhead were sequestered. The union hypostatical continued still with his soul, now filled with the sorrows of death, as well as it did with his body when He lay in the grave. And so as although his body was united to the fountain of life, yet it might die in respect of a natural life: so his soul, although the hypostatical union continued, might yet want [lack] comfort, which is life.</p></blockquote>

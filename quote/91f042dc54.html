<blockquote><p>Question 13. But how may it appear that He is willing to receive me? Answer: Make trial of Him thyself. If thou didst but know his heart to poor sinners, you would not question it. Believe what He says in the gospel; there thou shalt find that He is a willing Savior; for therein thou hast: First, his most serious invitations, Mt. 11:28, “Come unto Me, ye that are weary and heavy laden.” Isa. 55:1, “Ho! every one that thirsteth come ye to the waters.</p></blockquote>

<blockquote><p>When love is attributed to God in Scripture, it does not mean a passion or an affect, for God is dispassionate [ἀπαθής], the freest, the most blissful, the most blessed, the most perfect. Nothing slavish happens to Him, nothing lowly, and finally nothing that indicates any imperfection. But God’s love denotes three completely, perfect things: eternal benevolence, actual beneficence, and actual delight in the thing loved. For he who loves something is well-disposed towards it, does it whatever good he is capable of, and delights in it. These three things are found in the love of God. Now this love is first the love of God in Himself, and then towards his creatures. For God loves Himself and above all things: the Father: the Son and the Holy Spirit; the Son: the Father and the Holy Spirit, and the Holy Spirit: the Father and the Son. God’s love for his creatures is first general and then special. That general love is the one by which He fully embraces all things created by Him, blesses them, and preserves and sustains them. In this way there is no one, no man, and no devil either, who can say that He is not loved by God. The special love is that by which alone He leads the elect to eternal life, as He acknowledges them to be his own children in Christ: this passage [Mal. 1:2] here must be understood from this special love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Analysis of the Book of the Prophet Malachi</cite>, (Basil: Waldkirch, 1597), p. 10 tr. Damianus Cathedralulus (Domke), “Reading the Book of Malachi with Polanus #2,” A Bear to be Loved: Thoughts on Zacharias Ursinus and Amandus Polanus (blog), March 18, 2023</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-ba65e7d881" data-kw="">
<blockquote><p>The sum of this study of these passages in Matthew and Luke [6:35-36] is simply this, that presupposed in God’s gifts bestowed upon the ungodly there is in God a disposition of love, kindness, mercifulness, and that the actual gifts and the blessing accruing therefrom for the ungodly must not be abstracted from the lovingkindness of which they are the expression. And, of course, we must not think of this lovingkindness as conditioned upon a penitent attitude in the recipients. The lovingkindness rather is exercised towards them in their ungodly state and is expressed in the favours they enjoy. What bearing this may have upon the grace of God manifested in the free offer of the gospel to all without distinction remains to be seen. But we are hereby given a disclosure of goodness in the heart of God and of the relation there is between gifts bestowed and the lovingkindness from which they flow. And there is indicated to us something respecting God’s love or benevolence that we might not or could not entertain if we concentrated our thought simply on the divine decree of reprobation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’ | Matthew, 5:44–48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>2. God’s common providence towards mankind teaches us that God is inclined to mercy and is willing to be reconciled, that he is not implacable… By these things, it plainly appears that God hasn’t utterly forsaken the world of mankind as to any favor or merciful regards. This was the witness which God gave all mankind, and even the heathen, that had direct revelation of his disposition to a reconciliation. Acts 14:16–17, ‘Who in times past suffered all nations to walk in their own ways. Nevertheless He left not Himself without witness, in that He did good, and gave us rain from heaven, and fruitful seasons, filling our hearts with food and gladness.&#x27;</p></blockquote>

<blockquote><p>7. From these things it is plain that God, when He pursues with a hatred of displeasure an elect person whom He previously loved with a love of complacency, is not changed, even though perhaps the act of complacency, considered as it adds a respect of reason to such an object, is now in no way in Him. For: First, when such an act is removed, God is not physically and really changed, because nothing departs from Him beyond a mere respect of reason, as Suárez and Vázquez demonstrate by irrefutable arguments in the places cited. Secondly, neither is He changed morally, because He does not change his purpose, but on the contrary, remains [steadfast] in his purpose, or rather in his natural inclination, by which from eternity He was, now is, and always will be, inclined to love virtue and to detest vices or sins. He also remains [steadfast] in his purpose of leading those whom He chose and justified to eternal glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Venial &amp; Mortal Sin (1633; 1649), pt. 1, sect. 6, ‘God can love those whom He previously hated, and hate those whom He previously loved, without any change, whether physical or moral, in his will’ tr. Michael Lynch Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="“7. From these things it is plain that God, when He pursues with a hatred of displeasure an elect person whom He previously loved with a love of complacency, is not changed, even though perhaps the act of complacency, considered as it adds a respect of reason to such an object, is now in no way in Him. For: First, when such an act is removed, God is not physically and really changed, because nothing departs from Him beyond a mere respect of reason, as Suárez and Vázquez demonstrate by irrefutable arguments in the places cited. Secondly, neither is He changed morally, because He does not change his purpose, but on the contrary, remains [steadfast] in his purpose, or rather in his natural inclination, by which from eternity He was, now is, and always will be, inclined to love virtue and to detest vices or sins. He also remains [steadfast] in his purpose of leading those whom He chose and justified to eternal glory.”

— Robert Baron, On Venial &amp; Mortal Sin (1633; 1649), pt. 1, sect. 6, ‘God can love those whom He previously hated, and hate those whom He previously loved, without any change, whether physical or moral, in his will’ tr. Michael Lynch Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+From+these+things+it+is+plain+that+God%2C+when+He+pursues+with+a+hatred+of+displeasure+an+elect+person+whom+He+previously+loved+with+a+love+of+complacency%2C+is+not+changed%2C+even+though+perhaps+the+act+of+complacency%2C+considered+as+it+adds+a+respect+of+reason+to+such+an+object%2C+is+now+in+no+way+in+Him.+For%3A+First%2C+when+such+an+act+is+removed%2C+God+is+not+physically+and+really+changed%2C+because+nothing+departs+from+Him+beyond+a+mere+respect+of+reason%2C+as+Su%C3%A1rez+and+V%C3%A1zquez+demonstrate+by+irrefutable+arguments+in+the+places+cited.+Secondly%2C+neither+is+He+changed+morally%2C+because+He+does+not+change+his+purpose%2C+but+on+the+contrary%2C+remains+%5Bsteadfast%5D+in+his+purpose%2C+or+rather+in+his+natural+inclination%2C+by+which+from+eternity+He+was%2C+now+is%2C+and+always+will+be%2C+inclined+to+love+virtue+and+to+detest+vices+or+sins.+He+also+remains+%5Bsteadfast%5D+in+his+purpose+of+leading+those+whom+He+chose+and+justified+to+eternal+glory.%E2%80%9D%0A%0A%E2%80%94+Robert+Baron%2C+On+Venial+%26+Mortal+Sin+%281633%3B+1649%29%2C+pt.+1%2C+sect.+6%2C+%E2%80%98God+can+love+those+whom+He+previously+hated%2C+and+hate+those+whom+He+previously+loved%2C+without+any+change%2C+whether+physical+or+moral%2C+in+his+will%E2%80%99+tr.+Michael+Lynch+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffdc9092a55.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fdc9092a55.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=7.%20From%20these%20things%20it%20is,chose%20and%20justified%20to%20eternal%20glory&amp;tex

<blockquote><p>[1.] In order to engage us to this charity, which would issue in an unity of measures, let us consider what melancholy consequences may ensue upon our divisions, if they be not happily removed. ‘Tis notour, they have been fatal to all societies, have tumbled down flourishing monarchies, and laid magnificent cities into ashes; they have rent Churches into pieces, and knocked religion on the head. 2. The enemies of our Zion, whose projects have been baffled of Heaven, and their counsels infatuated of God, will have this piece of satisfaction left them, to rejoice when they see us disagree among ourselves, and be pleased with the agreeable thoughts that we are about to accomplish ourselves what they designed for us.</p></blockquote>

</figure><figure class="quote" id="q-5fdcc71030" data-kw="">
<blockquote><p>We further confess and acknowledge, that such persons as are placed in authority are to be loved, honored, feared, and holden in most reverend estimation, because they are the lieutenants of God, in whose session God Himself does sit and judge. And further, we affirm that whosoever deny unto them their aid, counsel and comfort, while the princes vigilantly travail in the executing of their office, that the same men deny their help, support and counsel to God, who, by the presence of his lieutenant, craves it of them.</p></blockquote>

</figure><figure class="quote" id="q-e16d53b188" data-kw="">
<blockquote><p>Testimonies for the Lord are necessary, lovely and singularly useful, when according to the rule: But, when these prescribed bounds are exceeded, and our misguided zeal for a pretended respect to the Lord’s honor hurries to a taxing the commissions of his choicest ambassadors, and trampling such as are eminently beautified with Christ’s image, who can tell how far this gangrene may reach? My heart trembles at the mischiefs which any one unsound and unsafe position does lead to, especially in matters of this nature; and have often admired the judicious observe of a great man, against whom our friends, especially the more exercised, are not much, if at all, prejudiced, viz. ‘He that sheds man’s blood, by man shall his blood be shed; but whoso sheds the blood of Churches, his blood shall be shed by the Lord.’ (These are said to be the words of Mr. Shepherd.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

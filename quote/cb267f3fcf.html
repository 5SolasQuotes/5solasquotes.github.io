<main class="wrap"><figure class="quote" id="q-cb267f3fcf" data-kw="">
<blockquote><p>But Translations according to the import of the words and sense of the text, are as much the Word of God, as the Text in the original … Which follows, the Translation of the words in Meetre, if it have the full sense of the words, is as much the Word of God, as if it were translated in prose, or ordinary sentence for reading; for it is not the way or method, but the sense and meaning of the words, that is the Word of God. So that I may as well say when I sing in such a composition, it is as much the Word of God as when I read the same words in the Bible, only they are orderly disposed for that action. None must by this reason, pretend to know the Word of God in reading or expounding but he that knows the Hebrew, and Greek; and that must be also in the first perfect copy, immediately transcribed from inspired understandings …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of These Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), p. 204.</span></figcaption>

</figure><figure class="quote" id="q-1b98dd77e9" data-kw="">
<blockquote><p>Hymns of human composition are used so commonly now in public worship by Presbyterian churches that it is difficult to believe that the practice is not a hundred years old, and that in some of the churches it is of very recent date. On the supposition that it is good and dutiful and wise to sing such hymns in worship, it is equally difficult to account for the neglect of the churches at the time of the Reformation, and for generations afterwards. What could have so blinded the reformers as to make them reject hymns and sing the Psalms alone? How could the Westminster Divines, in framing their Confession of Faith and Directory for Worship, have been so unanimous in the blunder that the service of praise is to consist of the “Singing of Psalms?” And apart from the aspect of duty, how could the Presbyterian churches, for about a hundred and fifty or two hundred years after the Westminster Assembly, have been so insensible to the power of hymns as an attractive addition to their public services? We cannot by any means understand how it was that, if it was dutiful to use hymns in worship, the reformers did not discover the Scriptural warrant for the duty, especially as hymns had been used for centuries by the Church of Rome. Nor can we understand how they rejected the hymns and used the Psalms alone, unless on the supposition that they believed the use of hymns to be part of the will-worship of Rome.

If they were wrong on this point, then Rome and our modern Presbyterian churches are right. In that case, the Puritans and Covenanters were fanatics, and Romanists were truly enlightened. And most of our Presbyterian churches of the present day were fanatical too, and did not become truly enlightened and liberal till they got hack to the Romish practice! The Free Church of Scotland, for example, which existed for nearly forty years without an authorized hymn-book must have been so far an heir to Puritanic and Covenanting fanaticism till the year of grace 1882, when it went back beyond the time of the Presbyterian Reformation to find a nobler inheritance in the Romish practice of singing uninspired hymns in worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

<blockquote><p>47. Yet because the lifting up of the heart to God is together required, Simul &amp; consequenter, and going along with the thing that is sung, and it is also the end of that meditation; therefore we are said to sing in our heart to the Lord, Col. 3:16, and psalms that are sung have the consideration of prayers.

48. But because this religious melody hath the respect of prayers, therefore it is not so fit that the Decalogue, and other such like, which do not partake the nature of prayer, be turned into meter and be sung instead of psalms. … 53. But in the melody of singing, because it tendeth to our mutual edification, attention, and stirring up of pious affections among us one toward another, Col. 3:16, therefore all do join their voices together, 1. Chron. 16:35; Mk. 14:26.</p></blockquote>

<blockquote><p>But the practice of this devotion [a psalmody] I derived from a higher precedent [and not just the Early Church], even of Christ and his apostles: for before the passion, immediately they sung a Psalm, saith the Scripture, hymno dicto, saith the vulgar Latin, ‘having recited or said a Psalm’. But however, it was part of David’s Psalter that was sung, it was the great Allelujah, as the Jews called it, beginning at the 113 psalm, to the 119 exclusively, part of that was sung… Against the example of Christ, if we confront the practice of Antichrist, nothing can be said greater in commendation of this manner of devotion: for B. Hippolytus, in his oration of the end of the world, saith that in the days of Antichrist, Psalmorum decantatio cessabit, they shall then no more use the singing or saying of the Psalms; which when I had observed. without any further deliberation I fixed upon the Psalter as the best weapon against him whose coming we have great reason to believe is not far off, so great preparation is making for him. From the example of Christ this grew to be a practice apostolical, and their devotion came exactly home to the likeness of the design of this very Book: they turned the Psalms into prayers. Thus it was said of Paul and Silas, Acts 16, ‘they prayed a Psalm’, so it is in the Greek… I only add this, that since according to the instruction of our blessed Savior, God is to be worshipped in Spirit and in truth, no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in Psalms and Hymns, and spiritual Songs, and the spirit of truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-vaughan.html">Robert Vaughan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects According to the Matter of Each Psalm</cite>, (Oxford, 1644), The Preface, no page number. This psalter only contains the 150 psalms.</span></figcaption>

— Robert Vaughan, The Psalter of David with Titles and Collects According to the Matter of Each Psalm, (Oxford, 1644), The Preface, no page number. This psalter only contains the 150 psalms.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+practice+of+this+devotion+%5Ba+psalmody%5D+I+derived+from+a+higher+precedent+%5Band+not+just+the+Early+Church%5D%2C+even+of+Christ+and+his+apostles%3A+for+before+the+passion%2C+immediately+they+sung+a+Psalm%2C+saith+the+Scripture%2C+hymno+dicto%2C+saith+the+vulgar+Latin%2C+%E2%80%98having+recited+or+said+a+Psalm%E2%80%99.+But+however%2C+it+was+part+of+David%E2%80%99s+Psalter+that+was+sung%2C+it+was+the+great+Allelujah%2C+as+the+Jews+called+it%2C+beginning+at+the+113+psalm%2C+to+the+119+exclusively%2C+part+of+that+was+sung%E2%80%A6+Against+the+example+of+Christ%2C+if+we+confront+the+practice+of+Antichrist%2C+nothing+can+be+said+greater+in+commendation+of+this+manner+of+devotion%3A+for+B.+Hippolytus%2C+in+his+oration+of+the+end+of+the+world%2C+saith+that+in+the+days+of+Antichrist%2C+Psalmorum+decantatio+cessabit%2C+they+shall+then+no+more+use+the+singing+or+saying+of+the+Psalms%3B+which+when+I+had+observed.+without+any+further+deliberation+I+fixed+upon+the+Psalter+as+the+best+weapon+against+him+whose+coming+we+have+great+reason+to+believe+is+not+far+off%2C+so+great+preparation+is+making+for+him.+From+the+example+of+Christ+this+grew+to+be+a+practice+apostolical%2C+and+their+devotion+came+exactly+home+to+the+likeness+of+the+design+of+this+very+Book%3A+they+turned+the+Psalms+into+prayers.+Thus+it+was+said+of+Paul+and+Silas%2C+Acts+16%2C+%E2%80%98they+prayed+a+Psalm%E2%80%99%2C+so+it+is+in+the+Greek%E2%80%A6+I+only+add+this%2C+that+since+according+to+the+instruction+of+our+blessed+Savior%2C+God+is+to+be+worshipped+in+Spirit+and+in+truth%2C+no+worshipping+can+be+more+true%2C+or+more+spiritual+than+the+Psalter+said+with+a+pure+mind+and+a+hearty+devotion.+For+David+was+God%E2%80%99s+instrument+to+the+Chu

<main class="wrap"><figure class="quote" id="q-f90d1e491e" data-kw="">
<blockquote><p>What meaneth that joy that the faithful find in their hearts, accompanying the benefits that cometh from Him, but that the Lord giveth His benefits cheerfully? for if the LORD gave thee them not cheerfully, but in anger and wrath, and threw them to thee as to a reprobate, thou wouldest never have joy in the receiving of them. There is not such a thing, as a reprobate can have joy in the giver, or ever have his mouth open with true thanksgiving to the Lord to say once, I thank thee: Why? Because the Lord giveth him not His benefits in love, but in anger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), p. 270.</span></figcaption>

<blockquote><p>In several sorts of controversies and cases you must prefer several sorts of guides or judges: It is a grand pernicious error to think that the same men’s judgments must be most followed in every case. And it is of grand importance to know how to value and vary our guides, as the cases vary. And for the most part every man is more to be regarded in his own way of study and profession than wiser men in other matters of other studies and professions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Direction 42, ‘Your belief of the necessary articles of faith, must be made your own, and not taken merely upon the authority of any: And in all points of belief or practice which are of necessity to salvation, you must ever keep company with the universal Church: for it were not the Church if it erred in these: And in matters of peace and concord the greater part must be your guide; In matters of human obedience, your governors must be your guides: And in matters of high and difficult speculation, the judgment of one man of extraordinary understanding and clearness is to be preferred before both the rulers and the major vote’ in The Cure of Church Divisions, Direction 42, ‘Your belief of the necessary articles of faith, must be made your own, and not taken merely upon the authority of any: And in all points of belief or practice which are of necessity to salvation, you must ever keep company with the universal Church: for it were not the Church if it erred in these: And in matters of peace and concord the greater part must be your guide; In matters of human obedience, your governors must be your guides: And in matters of high and difficult speculation, the judgment of one man of extraordinary understanding and clearness is to be preferred before both the rulers and the major vote’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 216-18, p. 216</span></figcaption>

20other%20studies%20and%20professions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1ec541e6ce" data-kw="">
<blockquote><p>Now from gymnastic art those sports will have to be proposed to youth which, besides what they contribute to the health and preservation of the body and the production of graceful movements, also render men fit and ready for military service and the advantageous use of arms. Young men should therefore exercise themselves in running, jumping, wrestling, horseback riding, the handling of all arms and weapons which are used for open and hand-to-hand combat, the arrangement of battle formations, the positioning of camp, and mock battle (Plato, Laws, VII, 803c, 813d-e). To these, nobles may add the exercise of hunting. These exercises which pertain to military science ought to be so constituted and conducted in such a serious manner that they approximate as much as possible the actual operations of war, as Plato has said (Plato, Laws VII, 824 a-c)… according to the words of the psalm: ‘It is God who girds me with strength for war and prepares my path’ (Ps. 18:32). In charge of these sports, as of the kind previously mentioned, there should always be men singularly experienced in the field involved, men of universal wisdom most zealous for all piety and virtue, who are admired and therefore have the authority and power to relate and to adapt all youthful sport to a zeal for and practice of the virtues, which is the one goal of all sports among Christians; for we have been created for the praise of God…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<main class="wrap"><figure class="quote" id="q-c420b444e9" data-kw="">
<blockquote><p>In the sixteenth century, the narrowest views of politics and of popular education everywhere prevailed, even in Reformed countries. All political power was lodged, and was everywhere deemed to be rightly lodged, in the hands of princes, and all liberal knowledge was regarded as the prerogative of the few, and was withheld from the many.

The rights and interests of the masses were almost wholly ignored in the governmental and educational economy of nations; the champions of popular rights and education were extremely few; and the men who attained to enlightened views on such questions may justly claim to be regarded by the men of this present age as having been enlightened indeed — lights shining in a dark place — heralds and precursors of the politics and economics of the nineteenth century.

On questions of political principle and right, the views of [John] Knox and [George] Buchanan are before the world, and can be compared with the opinions which prevailed in their own and subsequent times. They contended for the principle of limited monarchy, and the supremacy of law; the prince, they urged, had his duties as well as his rights, and the people their rights as well as their duties. In opposition to the long-descended tradition of the divine and indefeasible right of princes, they held the principle (if they were not, indeed, the very first to put it forward) of a mutual compact between prince and people, as lying at the foundation of the political order and relations of society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lorimer.html">Peter Lorimer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Learning and Enlightened Views of the Scottish Reformers in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

<blockquote><p>What is the Theft of Persons?

It is a heinous sin punished by the Law of God with death: (Exod. 21. 16. Deut. 24. 7.) being so much worse than the theft of goods, as the persons of men are better than they. Mat. 6. 25. And this is committed by such as steal men or children, to sell them for slaves; and by lustful or covetous wooers, who steal men’s daughters to make them their wives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: or, The Sum and Substance of Christian Religion</cite>, ed. Michael Nevarr (1648; Herndon VA: Solid Ground Christian Books, 2007), p. 266.</span></figcaption>

</figure><figure class="quote" id="q-7ef7844b3b" data-kw="">
<blockquote><p>But as for us, we have been taught that to expose newly-born children is the part of wicked men; and this we have been taught lest we should do any one an injury, and lest we should sin against God, first, because we see that almost all so exposed (not only the girls, but also the males) are brought up to prostitution. … And there are some who prostitute even their own children and wives, and some are openly mutilated for the purpose of sodomy; and they refer these mysteries to the mother of the gods, and along with each of those whom you esteem gods there is painted a serpent, a great symbol and mystery.</p></blockquote>

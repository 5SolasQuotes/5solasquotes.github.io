<main class="wrap"><figure class="quote" id="q-561a1afab7" data-kw="">
<blockquote><p>Let all baptized children, from the hour of their receiving the seal of God’s covenant, be recorded and recognized as infant disciples. Let the officers of the church, as well as their parents according to the flesh, ever regard them with a watchful and affectionate eye. Let Christian instruction, Christian restraint, and Christian warning, entreaty and prayer ever attend them, from the mother’s lap to the infant school, and from the infant school to the seminary, whatever it may be, for more mature instruction.

Let them be early taught to reverence and read the word of God, and to treasure up select portions of it in their memories. Let appropriate catechisms, and other sound compends of Christian truth, be put into their hands, and by incessant repetition and inculcation be impressed upon their minds. Let a school or schools, according to its extent, be established in each church, placed under the immediate instruction of exemplary, orthodox, and pious teachers, carefully superintended by the pastor, and visited as often as practicable by all the officers of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism Scriptural and Reasonable: And Baptism by Sprinkling or Affusion the Most Suitable and Edifying Mode: In Four Discourses</cite>, (Philadelphia: Joseph Whetman, 1835), p. 63.</span></figcaption>

</figure><figure class="quote" id="q-dcc315b710" data-kw="">
<blockquote><p>But may one say, if the decrees of a Synod concerning matters of faith or worship, may and ought to be examined by the sure rule of the Word of God, and only to be received when they do agree therewith; and if also the constitutions of a Synod in external circumstances do not bind, except ex aeque et bono [out of equity and good], and propter regula mandandi causas [due to commanding according to just causes]: or, as divines speak, in casu scandali &amp; contemptus [in the case of scandal and contempt], and not for the mere will or authority of a synod… as our divines maintain and prove against Papists. … Our divines, by those their tenets, mean not to open a door to disobedience and contempt of the ordinances of a synod, but only to oppugne the Popish error concerning the binding power of ecclesiastical laws, by the sole will and naked authority of the law-maker, and that Christian people ought not to seek any further reason or motive of obedience.</p></blockquote>

ve%20of%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e7e99a44e4" data-kw="">
<blockquote><p>It might be very expedient, upon the principles of Christian prudence, that, where it can be accomplished, every pastor of a large congregation should still have assistant ministers; and some presidents among the pastors of different congregations, when they are meeting about any public business, is what common sense dictates in such circumstances: and if instead of a chair-man chosen for that particular time and occasion, some person, of experienced, approved fidelity and ability, should be appointed to exercise some stated over-fight over a few of the neighbouring congregations, it might perhaps be attended with such consequences, as would render such a sort of discipline not only tolerable, but eligible.

Something of this kind was projected in archbishop Usher’s plan for the reduction of episcopacy, by which he would have moderated it in such a manner, as to have brought it very near the presbyterian government of the Scotch church; the weekly parochial vestry answering to their church-session; the monthly synod, to be held by the Chorepiscopi, answering to their presbyteries; the diocesan synod to their provincial, and the national to their general assembly. The meeting of the dean and chapter, practised in the church of England, is but a faint shadow of the second, the ecclesiastical court of the third, and the convocation of the fourth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-doddridge.html">Philip Doddridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Lectures on the Principal Subjects in Pneumatology, Ethics, and Divinity</cite>, (London: J. Buckland, 1763), Proposition CL, Scholium 3, p. 522.</span></figcaption>

<blockquote><p>Not that our Lord by this intended to confirm all sentences of excommunication, or to patronize any cheat or hypocrisy in any, to gain an absolution, or restoration to the church. But only, as to the first, to assure stubborn and impenitent sinners that he would ratify what his church did, according to the rule He had given them to act by… If therefore any be cast out of any church for professing or standing to any truth of the gospel, or because he will not do what is sinful, we must not understand them bound in heaven, though they be bound on earth, nor have any such excommunications any terror in them. How forcible are right words! But these arguings, what do they reprove? The church is not by this text made infallible, nor is the holy God by it engaged to defend their errors.</p></blockquote>

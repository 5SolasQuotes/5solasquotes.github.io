<main class="wrap"><figure class="quote" id="q-636b608490" data-kw="">
<blockquote><p>The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 1, bk. 1, ch. 11, section 3, pp. 122-23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1dcbad45a" data-kw="">
<blockquote><p>3. Place XV. Third, the place of their existing, which they occupy not only by reason of their operating, but by coexistence; nor by circumscription, as if they were bounded extrinsically, like bodies; nor by repletion, or infinite coexistence; but by delimitation,18 whereby on account of the finitude of their essence, they are so restricted to this place that they may not be in a different one.19 Thus it is said that in one man there was a legion (Luke 8:30). 18. definitio, cf. §XXVIII, below 19. …non sola operandi ratione, sed per coexistentiam; nec per circumscriptionem…; nec per repletionem…; sed per definitionem…. Cf. Roelf T. te Velde, Paths Beyond Tracing Out: The Connection of Method and Content in the Doctrine of God, Examined in Reformed Orthodoxy, Karl Barth, and the Utrecht School (Delft: Uitgeverij Eburon, 2010), 139. 4. Motion XVI. Accordingly, fourth, a local motion by which they pass from place to place (Gen. 28:12), which although it is most rapid, since no medium resists it, from which they are compared to wind and fire (Ps. 104:4), and the seraphim are said to be winged (Ezek. 1:6), and like lightning (Luke 10:18), yet it occurs not in a moment, but successively.</p></blockquote>

<blockquote><p>God only is properly and absolutely eternal: Angels and men’s souls are said to be eternal, à posteriori, or à parte post, God à priori et à posteriori, ex parte ante et post, since He has neither beginning, succession, nor end.</p></blockquote>

</figure><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/guardian-angels.html">Guardian angels</a></span></div>

</figure><figure class="quote" id="q-9f2a62812d" data-kw="">
<blockquote><p>Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 7-8</span></figcaption>

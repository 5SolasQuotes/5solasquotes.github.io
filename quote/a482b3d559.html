<main class="wrap"><figure class="quote" id="q-a482b3d559" data-kw="">
<blockquote><p>William H. Goold, the editor of John Owen’s works, wrote the following concerning the battles waged by Augustine of Hippo and Gottschalk of Orbais on behalf of sovereign grace during the Patristic and medieval eras. Obviously, we would not stand over every historical judgement that he makes in this extract:

The relation of man to his Creator has engaged the attention of earnest and thoughtful minds, from the days of the patriarch of Uz to the most recent controversies of modern times. The entrance of sin into the world has vastly complicated this relationship; so that, considered in its various bearings, it involves some of the most difficult problems with which the human intellect has ever attempted to grapple. The extent to which the intellect itself has been weakened and beclouded by the corruption of our nature, renders us the less able to penetrate into the deep mysteries of human duty and destiny.

Whether man sins now as essentially affected with the taint of the first sin, and involved in the responsibilities of the first sinner, or sins wholly on his own account and by his own free act, under the bias of no connection with Adam, except what connection obtains between example on the one hand and imitation on the other? whether, on the supposition of a scheme of saving grace, grace is simply divine and external aid to the will of man, already operating freely in the direction of what is good, and so establishing a meritorious claim upon God for the bestowal of such aid, or a supernatural influence creating in man the very liberty itself to will and to do what is good? and whether, in the latter view of divine grace, as bestowed in divine sovereignty, and therefore according to a divine purpose, it can be reconciled with human responsibility? — are the questions which produced the sharp encounter of keen and conflicting wits between Pelagius and Augustine of old.

Towards the middle of the ninth century, these questions again assumed distinctive prominence in the history of theological speculation. Gottschalc, a monk of Orbais, distinguished himself by his advocacy of the doctrines of Augustine. It was the doctrine of predestination chiefly on which he insisted; and the controversy in his hands assumed this peculiar modification, that not merely the application of gracious influence, but the reference of the atonement, was exhibited as under the limit and regulation of the divine sovereignty and purpose. Not that in this respect he was at variance with Augustine, but the point seems to have been specially and formally mooted in the discussions of this age.

His view of predestination embraced an element which may be reckoned an advance on the Augustinian doctrine; for according to him, predestination was twofold, comprehending the punishment of the reprobate as well as the salvation of the elect; but while he held the predestination of men to the punishment of their sin, he was far from holding, as his opponents alleged, that they were predestinated to the commission of sin. Council warred with council in the case of Gottschalc. Gottschalc himself expiated by a death in prison his audacious anticipation of the rights of private judgment and free inquiry in a dark age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-h-goold.html">William H. Goold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory note to John Owen, ΘΕΟΜΑΧΙΑ ΑΥΤΕΞΟΥΣΙΑΣΤΙΚΗ</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-239dfe3a91" data-kw="">
<blockquote><p>Now, to be justified is to be freed from the guilt of sin, or to have all our sins pardoned, and to have a righteousness wherewith to appear before God, so as to be accepted with him, and a right to the heavenly inheritance. Every believer hath other designs also, wherein he is equally concerned with this,—as, namely, the renovation of his nature, the sanctification of his person, and ability to live unto God in all holy obedience; but the things before mentioned are all that he aimeth at or designeth in his applications unto Christ, or his receiving of him unto justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, The Works of John Owen, 5:115.</span></figcaption>

</figure><figure class="quote" id="q-580c562499" data-kw="">
<blockquote><p>We hold against Antinomians that we are never justified till we believe. They say from eternity we were justified; or from the time that the Messiah died, all sins were finished, and we justified, or from our birth. But justification in God’s decree and purpose from eternity, is no more justification then Creation, sanctification, glorification, the crucifying of Christ, and all things that fall out in time; for all these were in the eternal purpose of God.

2. In justification, our sins are, in their guilt, fully done away, as a thick cloud, cast in the bottom of the sea, remembered no more, sought for, and not found; if all this was done from eternity, believers were never sinners, never children of wrath, really, as Paul saith; never dead in sins, never enemies to God, or ungodly; they were only such in a mental consideration. 3. It is true, God loved his chosen ones from eternity to salvation; and from that love, sent his Son to die, to wash, justify, and sanctify them; but this is not their justification, but a fruit of justification in time. When our time is the time of love, and we are dying in our own blood, he washeth us. 4. We behoved to believe from eternity, for we are justified by Faith.

5. All the justified have a real union and interest in Christ, to live by faith, and wait on God in all their troubles by faith; but though their be an union of love in God’s mind from eternity, between the elect and God, yet a complete union between us and Christ, without the Spirit, and without any faith, though it be boldly asserted by Familists, is against the Scripture: for then might wee be born again, and not receive Christ by faith, contrary to the Scripture; and be united to Christ, as branches to the Vine-tree, and not abide in Christ, have Christ dwelling in our heart, and not by faith, contrary to Paul; so might Christ live in us, and we eat and drink him as the true Manna, have the Son, and yet want faith, contrary to the Scriptures. All which, or most of them, prove that we were not justified, when Christ died on the cross.

6. All that are justified, are unseparably sanctified and called, and the blessing of justification hath with it, the receiving of the promise of the Spirit, through faith, and peace with God, through the Lord Jesus Christ, access by faith into grace, whereby we stand, rejoicing in the hope of the glory of God, glorying in tribulation, patience, experience, hope; but many for whom Christ died have none of these, till they be justified by Faith; the distinction of justification in, or before God, or to our own sense by faith, will not help this; for the Scripture no where speaketh of justification, but by faith only; the meritorious price of our justification is paid on the Crosse, but that is not justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.18, pp 19-20.</span></figcaption>

ure%3B+and+be+united+to+Christ%2C+as+branches+to+the+Vine-tree%2C+and+not+abide+in+Christ%2C+have+Christ+dwelling+in+our+heart%2C+and+not+by+faith%2C+contrary+to+Paul%3B+so+might+Christ+live+in+us%2C+and+we+eat+and+drink+him+as+the+true+Manna%2C+have+the+Son%2C+and+yet+want+faith%2C+contrary+to+the+Scriptures.+All+which%2C+or+most+of+them%2C+prove+that+we+were+not+justified%2C+when+Christ+died+on+the+cross.%0A%0A6.+All+that+are+justified%2C+are+unseparably+sanctified+and+called%2C+and+the+blessing+of+justification+hath+with+it%2C+the+receiving+of+the+promise+of+the+Spirit%2C+through+faith%2C+and+peace+with+God%2C+through+the+Lord+Jesus+Christ%2C+access+by+faith+into+grace%2C+whereby+we+stand%2C+rejoicing+in+the+hope+of+the+glory+of+God%2C+glorying+in+tribulation%2C+patience%2C+experience%2C+hope%3B+but+many+for+whom+Christ+died+have+none+of+these%2C+till+they+be+justified+by+Faith%3B+the+distinction+of+justification+in%2C+or+before+God%2C+or+to+our+own+sense+by+faith%2C+will+not+help+this%3B+for+the+Scripture+no+where+speaketh+of+justification%2C+but+by+faith+only%3B+the+meritorious+price+of+our+justification+is+paid+on+the+Crosse%2C+but+that+is+not+justification.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+survey+of+the+spiritual+antichrist%2C+%28London%3A+Andrew+Crooke%2C+1648%29%2C+Part+2.18%2C+pp+19-20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F580c562499.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/580c562499.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/30/samuel-rutherford-against-eternal-justification/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law, unless they should fall into such sins as should ipso facto, forfeit their justified estate, and transfer them from the Covenant of Grace, into the Covenant of Works, which we believe that God in his Faithfulness will preserve them from. And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. Still there abides the true nature of sin in every inconformity unto, or transgression of the Law in justified persons, which stands in need of daily actual pardon. For there is no man that lives and sins not, and if we say that we have no sin, we do but deceive our selves. None are more sensible of the guilt of sin, none are more troubled for it, none are more earnest in supplications for the pardon of it, than justified persons. For this is the effect of the sacrifice of Christ applied unto the souls of believers, as the apostle declares, Heb. 10:1-4, 10, 14, that it does take away conscience condemning the sinner for sin with respect unto the curse of the Law; but it does not take away conscience condemning sin in the sinner, which on all considerations of God and themselves, of the Law and the gospel, requires repentance on the part of the sinner, and actual pardon on the part of God. … …Now the first act of God in the imputation of righteousness cannot be repeated. And the actual pardon of sin after justification is an effect and consequent of that imputation of righteousness. If any man sin, there is a propitiation… Wherefore unto this actual pardon there is nothing required but the application of that righteousness which is the cause of it, and this is done by faith only. … What it is that, when a justified person is guilty of sin (as guilty he is more or less every day) and his conscience is pressed with a sense thereof, as that only thing which can endanger or intercept his justified estate, his favor with God, and title unto glory, he betakes himself unto, or ought so to do, for the continuance of his state, and pardon of his sins, what he pleads unto that purpose, and what is available thereunto…. And is it not of faith alone, which is that grace whereby they apply themselves unto the mercy or grace of God through the mediation of Christ? It is true that faith herein, works and acts itself in and by godly sorrow, repentance, humiliation, self-judging, and abhorrency, fervency in prayer and supplications with an humble waiting for an answer of peace from God, with engagements unto renewed obedience. But it is faith alone that makes applications unto grace in the blood of Christ for the continuation of our justified estate… The Scripture expressly does declare this to be the only way of the continuation of our justification, 1 Jn. 2:1-2, ‘These things write I unto you that you sin not. And if any man sin we have an advocate with the Father, Jesus Christ the Righteous; and he is the propitiation for our sins.’ It is required of those that are justified that they sin not; it is their duty not to sin; but yet it is not so required of them as that if in anything they fail of their duty they should immediately lose the privilege of their justification. Wherefore on a supposition of sin, if any man sin, (as there is no man that lives and sins not) what way is prescribed for such persons to take, what are they to apply themselves unto, that their sin may be pardoned, and their acceptance with God continued; that is, for the continuation of their justification? The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that He has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, He is the object of our faith in our absolute justification, and so He is as unto the continuation of it. So our whole progress in our justified estate in all the degrees of it is ascribed unto faith alone.</p></blockquote>

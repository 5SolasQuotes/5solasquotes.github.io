<main class="wrap"><figure class="quote" id="q-2936ce0eda" data-kw="">
<blockquote><p>Objection 13: The Lord forbids Judah going to Gilgal or to Bethel, Hos. 4:15-16. Answer: The meaning is plain, and the words express that they were not to go thither to offend and play the harlot in joining to idols, vv. 15-17. This I grant is to be done in no place, but deny any such thing to be done in the hearing [of established churches] by me pleaded for. The Scriptures everywhere forbid the going or coming to such places, or persons, as in or by which some evil is done, to wit, for the doing of anything evil or unlawful in, or with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Lawfulness of Hearing the Public Ministers in the Church of England (d. 1625; 1634) in The Lawfulness of Hearing the Public Ministers of the Church of England Proved, by Mr. Philip Nye &amp; Mr. John Robinson… (London, 1683), p. 27 Robinson (d. 1625) was a leading minister of the English separatists, which settled in Amsterdam.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

rmed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a63c0c2f96" data-kw="">
<blockquote><p>Q. 154. What are the outward means whereby Christ communicates to us the benefits of his mediation? A. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation.[l] [l] Matt. 28:19,20. Acts 2:42,46,47. Q. 155. How is the word made effectual to salvation? A. The Spirit of God maketh the reading, but especially the preaching of the word, an effectual means of enlightening,[m] convincing, and humbling sinners;[n] of driving them out of themselves, and drawing them unto Christ;[o] of conforming them to his image,[p] and subduing them to his will;[q] of strengthening them against temptations and corruptions;[r] of building them up in grace,[s] and establishing their hearts in holiness and comfort through faith unto salvation.[t] [m] Neh. 8:8. Acts 26:18. Ps. 19:8. [n] 1 Cor. 14:24,25. 2 Chron. 34:18,19,26-28. [o] Acts 2:37,41. Acts 8:27-39. [p] 2 Cor. 3:18. [q] 2 Cor. 10:4-6. Rom. 6:17. [r] Matt. 4:4,7,10. Eph. 6:16,17. Ps. 19:11. 1 Cor. 10:11. [s] Acts 20:32. 2 Tim. 3:15-17. [t] Rom. 16:25. 1 Thess. 3:2,10,11,13. Rom. 15:4. Rom. 10:13-17. Rom. 1:16.</p></blockquote>

</figure><figure class="quote" id="q-5989afda40" data-kw="">
<blockquote><p>But grant there were some corruptions added which men should put merit and holiness in to worship God by… is therefore all the worship false? Is good meat mixed with ill meat, false meat? or good, corrupted? This false distinction of true and false against us will not stand.</p></blockquote>

</figure><figure class="quote" id="q-f9282d5ef8" data-kw="">
<blockquote><p>We hold it as unlawful (as themselves) outwardly and but in appearance to join with idolaters in their idolatry; and yet we see not warrant why every particular act, that in a large sense is idolatrous, adjoined to God’s true worship, we should forbear our presence, as the true worship itself: Or that our presence for the true worship’s sake alone should in respect of some point of false worship thereunto annexed be… the submitting our bodies to a strange worship, especially when we are not particular actors in it, but only present, beholding it with grief and suffering it in others for the true worship’s sake, unto which it is adjoind. If this should be held unlawful then can no man present himself with a good conscience at any public worship of God wheresoever, because… he can have no assurance but that some errors in matter or form will be committed.</p></blockquote>

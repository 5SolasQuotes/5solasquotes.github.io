<main class="wrap"><figure class="quote" id="q-038fc680a3" data-kw="">
<blockquote><p>For the whole man, as Maldonatus not badly reasons, is said to be born of flesh and to be wholly flesh, although the soul, the other part of him, is neither born of flesh, nor is flesh because he is born of blood and of the will of the flesh, and of the will of man [Jn. 1:13], that is in a carnal and human manner, by which manner those who are born, are born sinners, that is, carnal. And the soul itself, although a spiritual substance, when stained with sin, is carnal. On the contrary, the flesh, when it is free from sin, and joined to God, is called ‘spirit’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic</cite>, (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’, p. 3 trans. AI</span></figcaption>

</figure><figure class="quote" id="q-805e51c3a0" data-kw="">
<blockquote><p>We therefore come to show the properties of this righteousness and holiness that was thus fixed in Adam’s heart:

1. It’s called original, to difference it from actual holiness; as we call it ‘original sin’, to distinguish it from actual: and therefore the learned call it original, partly in regard of itself, because it was the first righteousness; partly because of Adam, who had it as soon as he was created. As the schools say of original sin, Quam primum originatur homo, originatur itidem peccatum; so we may of Adam in his righteousness, In ortu virtus, as the father said, In ortu vitium est: and partly in regard of his posterity, for it should have been propagated to them.

2. Another property of this righteousness is that it is universal, comprehending the rectitude of all the parts and faculties of the soul: so that Adam was, for his soul, as Absalom is said to be comely for his body, from the head to the foot no blemish at all: so that this was not a perfection in one part only, but all over; as our corruption makes us, as he said of the martyr wounded in many places, totum vulnus.

3. It was harmonious: there was not only rectitude in every part, but a sweet correspondency one with the other; there was no rebellion or fight between the inferiour appetite and the understanding. Therefore some learned men say, This righteousness is not to be conceived as an aggregation of several habits, but as an inward rectitude of all faculties: Even as the exact temperament of the body is not from any superadded habit, but from the natural constitution of the parts.

4. This righteousness and holiness, it was a perfection due to Adam, supposing the end to which God made him. If God required obedience of Adam to keep the law, and happinesse thereupon, it was due not by way of merit, but condecency to God’s goodness, to furnish him with abilities to perform it; as the soul of Adam was a due to him, supposing the end for which God made him. Indeed, now it’s of grace to us, and in a far different consideration made ours, because we lost it. Lastly, this was to be a propagated righteousness; for, as it is to be proved hereafter, God did all this in a way of covenant with Adam, as a public person: And howsoever every thing that Adam did personally was not made ours, (we did not eat in his eating, nor drink in his drinking, we did not dress the garden in his dressing of it) yet that which he did federally, as one in convenant with God, that is made ours; so his sin and misery is made ours, then his righteousness and happiness: As it is now, By one man sin entred into the world, and death by sin; so then it would have been by one man righteousness, and life by righteousness. Questions to be made:

1. Whether this righteousness was natural to Adam, or no? Howsoever some have thought this a mere contention of words, and therefore if they were well explained, there would be no great difference; yet the Papists make this a foundation for other great errors: for, grant this righteousness to be supernatural to Adam, as it is to us, then:

1. It will follow that all the motions rising in the appetite against reason, are from the constitution of our nature; and so no more sin than hunger and thirst is.

2. That freewill is still in us, and that we have lost nothing but that which is merely superadded to us. Or they compare this righteousness Adam had, sometimes to an antidote, which preserves against the deadly effect of poison: sometimes to a bridle, that rules the horse; so that they suppose man’s nature would of itself rebel, but only this was given to Adam to check it: sometimes to Sampson’s hair, whereby he had supernatural strength, but when that was cut off, he had only natural: So that by this doctrine, man, now fallen, should be weaker than he was, but not corrupted. Therefore we must necessarily conclude that this righteousness was natural to him; not indeed flowing from the principles of nature, for so it was of God, but it was a perfection suitable or connatural to him; it was not above him, as it is now in us. As a blind man that was made to see, though the manner was supernatural, yet to see was a natural perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis</cite>, … (London: Young, 1647), Lecture 12, pp. 119-20</span></figcaption>

d+made+him.+If+God+required+obedience+of+Adam+to+keep+the+law%2C+and+happinesse+thereupon%2C+it+was+due+not+by+way+of+merit%2C+but+condecency+to+God%E2%80%99s+goodness%2C+to+furnish+him+with+abilities+to+perform+it%3B+as+the+soul+of+Adam+was+a+due+to+him%2C+supposing+the+end+for+which+God+made+him.+Indeed%2C+now+it%E2%80%99s+of+grace+to+us%2C+and+in+a+far+different+consideration+made+ours%2C+because+we+lost+it.+Lastly%2C+this+was+to+be+a+propagated+righteousness%3B+for%2C+as+it+is+to+be+proved+hereafter%2C+God+did+all+this+in+a+way+of+covenant+with+Adam%2C+as+a+public+person%3A+And+howsoever+every+thing+that+Adam+did+personally+was+not+made+ours%2C+%28we+did+not+eat+in+his+eating%2C+nor+drink+in+his+drinking%2C+we+did+not+dress+the+garden+in+his+dressing+of+it%29+yet+that+which+he+did+federally%2C+as+one+in+convenant+with+God%2C+that+is+made+ours%3B+so+his+sin+and+misery+is+made+ours%2C+then+his+righteousness+and+happiness%3A+As+it+is+now%2C+By+one+man+sin+entred+into+the+world%2C+and+death+by+sin%3B+so+then+it+would+have+been+by+one+man+righteousness%2C+and+life+by+righteousness.+Questions+to+be+made%3A+1.+Whether+this+righteousness+was+natural+to+Adam%2C+or+no%3F+Howsoever+some+have+thought+this+a+mere+contention+of+words%2C+and+therefore+if+they+were+well+explained%2C+there+would+be+no+great+difference%3B+yet+the+Papists+make+this+a+foundation+for+other+great+errors%3A+for%2C+grant+this+righteousness+to+be+supernatural+to+Adam%2C+as+it+is+to+us%2C+then%3A+1.+It+will+follow+that+all+the+motions+rising+in+the+appetite+against+reason%2C+are+from+the+constitution+of+our+nature%3B+and+so+no+more+sin+than+hunger+and+thirst+is.+2.+That+freewill+is+still+in+us%2C+and+that+we+have+lost+nothing+but+that+which+is+merely+superadded+to+us.+Or+they+compare+this+righteousness+Adam+had%2C+sometimes+to+an+antidote%2C+which+preserves+against+the+deadly+effect+of+poison%3A+sometimes+to+a+bridle%2C+that+rules+the+horse%3B+so+that+they+suppose+man%E2%80%99s+nature+would+of+itself+rebel%2C+but+only+this+was+given+to+Adam+to+check+it%3A+sometimes+to+Sampson%E2%80%99s+hair%2C+whereby+he+had+supernatural+strength%2C+but+when+that+was+cut+off%2C+he+had+only+natural%3A+So+that+by+this+doctrine%2C+man%2C+now+fallen%2C+should+be+weaker+than+he+was%2C+but+not+corrupted.+Therefore+we+must+necessarily+conclude+that+this+righteousness+was+natural+to+him%3B+not+indeed+flowing+from+the+principles+of+nature%2C+for+so+it+was+of+God%2C+but+it+was+a+perfection+suitable+or+connatural+to+him%3B+it+was+not+above+him%2C+as+it+is+now+in+us.+As+a+blind+man+that+was+made+to+see%2C+though+the+manner+was+supernatural%2C+yet+to+see+was+a+natural+perfection.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+Vindiciae+legis%2C+or+a+Vindication+of+the+Moral+Law+%26+the+Covenants%2C+%E2%80%A6+%28London%3A+Young%2C+1647%29%2C+Lecture+12%2C+pp.+119-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F805e51c3a0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/805e51c3a0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=We%20therefore%20come%20to%20show%20the,to%20see%20was%20a%20natural%20perfection&amp;text=We%20therefore%20come%20to%20show%20the%20properties%20of&amp;text=supernatural%2C%20yet%20to%20see%20was%20a%20natural%20perfection" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

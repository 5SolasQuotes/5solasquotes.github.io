<main class="wrap"><figure class="quote" id="q-dcb2570075" data-kw="">
<blockquote><p>…there shall be a General Court for the Jurisdiction, which shall consist of the Governor, Deputy Governor and all the Magistrates within the Jurisdiction… which General Court shall, with all care and diligence provide for the maintenance of the purity of religion, and suppress the contrary, according to their best light from the word of God, and all wholesome and sound advice which shall be given by the elders and churches in the jurisdiction, so far as may concern their civil power to deal therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/colony-of-new-haven.html">Colony of New Haven</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Government of New Haven Colony</cite>, 1643 (Thorpe, 1.528)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8abda43efa" data-kw="">
<blockquote><p>…princes, and all who hold the office of magistracy, are here reminded of their duty. It is not enough, if, by giving to every one what is due, they restrain all acts of violence, and maintain peace; but they must likewise endeavor to promote religion, and to regulate morals by wholesome discipline. The exhortation of David (Psalm 2:12) to “kiss the Son,” and the prophecy of Isaiah, that they shall be nursing — fathers of the Church, (Isaiah 49:23) are not without meaning; and, therefore, they have no right to flatter themselves, if they neglect to lend their assistance to maintain the worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon on the Duty of Civil Rulers to Enforce and Defend the True Religion and True Godliness in their Realms by drawing out the sword against all Heretics and others who trouble the Church</cite>, …’ on 1 Tim. 2:1-2 (d. 1564; 1579)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“…princes, and all who hold the office of magistracy, are here reminded of their duty. It is not enough, if, by giving to every one what is due, they restrain all acts of violence, and maintain peace; but they must likewise endeavor to promote religion, and to regulate morals by wholesome discipline. The exhortation of David (Psalm 2:12) to “kiss the Son,” and the prophecy of Isaiah, that they shall be nursing — fathers of the Church, (Isaiah 49:23) are not without meaning; and, therefore, they have no right to flatter themselves, if they neglect to lend their assistance to maintain the worship of God.”

— John Calvin, ‘A Sermon on the Duty of Civil Rulers to Enforce and Defend the True Religion and True Godliness in their Realms by drawing out the sword against all Heretics and others who trouble the Church…’ on 1 Tim. 2:1-2 (d. 1564; 1579)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6princes%2C+and+all+who+hold+the+office+of+magistracy%2C+are+here+reminded+of+their+duty.+It+is+not+enough%2C+if%2C+by+giving+to+every+one+what+is+due%2C+they+restrain+all+acts+of+violence%2C+and+maintain+peace%3B+but+they+must+likewise+endeavor+to+promote+religion%2C+and+to+regulate+morals+by+wholesome+discipline.+The+exhortation+of+David+%28Psalm+2%3A12%29+to+%E2%80%9Ckiss+the+Son%2C%E2%80%9D+and+the+prophecy+of+Isaiah%2C+that+they+shall+be+nursing+%E2%80%94+fathers+of+the+Church%2C+%28Isaiah+49%3A23%29+are+not+without+meaning%3B+and%2C+therefore%2C+they+have+no+right+to+flatter+themselves%2C+if+they+neglect+to+lend+their+assistance+to+maintain+the+worship+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%98A+Sermon+on+the+Duty+of+Civil+Rulers+to+Enforce+and+Defend+the+True+Religion+and+True+Godliness+in+their+Realms+by+drawing+out+the+sword+against+all+Heretics+and+others+who+trouble+the+Church%E2%80%A6%E2%80%99+on+1+Tim.+2%3A1-2+%28d.+1564%3B+1579%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8abda43efa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8abda43efa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=princes%2C%20and%20all%20who%20hold%20the,to%20maintain%20the%20worship%20of%20God&amp;text=princes%2C%20and%20all%20who%20hold%20the%20office%20of&amp;text=their%20assistance%20to%20maintain%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-af834b5bd2" data-kw="">
<blockquote><p>Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labor in it more diligently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, (1550)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labor in it more diligently.”

</figure><figure class="quote" id="q-c3eaebbd60" data-kw="">
<blockquote><p>The magistrates look to peace and civil order; tis well done; and tis their duty, yet not the principal, and they do commonly fail in this, that they use not the sword for this end, to urge men to the keeping of the commandments of the First Table, to a practice of pure religion and to the keeping of the Sabbath day. This is the main duty of the magistrate, who bears the sword especially for the good of men’s souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Callings in Works</cite>, vol. 1, p. 764</span></figcaption>

</figure><figure class="quote" id="q-14fbae3b80" data-kw="">
<blockquote><p>The Admonition annexed to the Queen’s Injunctions. The Queen’s Majesty being informed that in certain places of this realm, sundry of her native subjects, being called to ecclesiastical ministry in the Church, be by sinister persuasion and perverse construction induced to find some scruple in the form of an oath which by an act of the last parliament is prescribed to be required of diverse persons, for the recognition of their allegiance to her Majesty, which certainly neither was ever meant, ne by any equity of words or good sense, can be thereof gathered: Would that all her loving subjects should understand that nothing was, is, or shall be meant or intended by the same oath, to have any other duty, allegiance, or bond required by the same oath than was acknowledged to be due to the most noble kings of famous memory, king Henry VIII, her Majesty’s father, or king Edward VI, her Majesty’s brother. And further her Majesty forbids all manner her subjects to give ear or credit to such perverse and malicious persons which most sinisterly and maliciously labor to notify to her loving subjects how by the words of the said oath, it may be collected the kings or queens of this realm, possessors of the crown, may challenge authority and power of ministry of divine offices in the Church, wherein her said subjects be much abused by such evil disposed persons. For certainly her Majesty neither does, ne ever will challenge any other authority than that was challenged and lately used by the said noble kings of famous memory, king Henry VIII, and king Edward VI, which is and was of ancient time due to the imperial crown of this realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Consideration of the Oath of the King’s Supremacy</cite>, … (London: Hills, 1660) 27 pp., pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<main class="wrap"><figure class="quote" id="q-68a9e053ef" data-kw="">
<blockquote><p>The Magistrate hinders ignorance and losing ships by tempests not by professing and teaching sciences and arts in academies in his own person, nor by steering ships, and guiding them himself to their ports, for so [then] a magistrate as a magistrate should be a schoolmaster, a professor of arts and sciences in the universities, and a pilot or shipmaster, which were a confounding of all callings; but by procuring that there should be universities and professors of arts and sciences, and by providing honorable stipends and wages for them, and procuring that in the commonwealth there should be sailers who are skilled in shipping: and so does the magistrate by his office take care that the Word, sacraments and discipline, be dispensed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646)</cite>, p. 543</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46ea3c98db" data-kw="">
<blockquote><p>3. Magistrates as magistrates hold forth in their Law abstinence from these sins [of adultery, incest, murder, etc.], not as the ambassadors of Christ, craving subjection of conscience and divine faith to those charges, but only external obedience: For though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience, nor is he in Christ’s stead to lay divine bands on the conscience to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order and as the Creator, and Founder, and another of human societies and of peace, to exact external obedience and to lay bands on your hands, not to shed innocent blood, and on your body not to defile it with adultery or incest, nor to violate the chastity of your brother; Hence it is evident that the adversaries are far out who would have ministers who do hold forth commands that lay hold on the conscience and crave faith and soul-submission under the pain of eternal wrath, to do and act as the deputies and vicars of those who have nothing to do with the conscience [such as prelates who simultaneously held civil offices], and have neither office nor authority to crave soul submission or to threaten or inflict any punishment but such as is circumscribed within the limits of time and which the body of clay is capable of; yea, when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, pp. 550-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-d12d08ef13" data-kw="">
<blockquote><p>Thirdly, that Prophesy, 2 Pet. 2:18, ‘They allure by the lusts of the flesh, through much wantonness,’ etc. is fulfilled in the Papacy, which permits pubic stews, I might say, allows, because who keep those houses, do therefore pay a pension to the Pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Romish Fisher Caught and Held in his Own Net (1638), ‘Dr. Featly’s Reply’</cite>, p. 83 Westminster divine</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-9e57d95fbe" data-kw="">
<blockquote><p>…a Puritan was a man supremely concerned about conscience… The concern which was really supreme in the minds and hearts of the people called Puritans was a concern about God—a concern to know Him truly, and serve Him rightly, and so to glorify Him and to enjoy Him. But, just because this was so, they were in fact very deeply concerned about conscience, for they held that conscience was the mental organ in men through which God brought His Word to bear on them. Nothing, therefore, in their estimation, was more important for any man than that his conscience should be enlightened, instructed, purged, and kept clean. To them, there could be no real spiritual understanding, or any genuine godliness, except as men exposed and enslaved their consciences to God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-i-packer.html">J. I. Packer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Puritan Conscience’ in Puritan Papers, Vol. Two: 1960-1962 (P&amp;R, 2001)</cite>, pp. 237-257</span></figcaption>

</figure><figure class="quote" id="q-07ff5cfcf8" data-kw="">
<blockquote><p>…what would he say of those Scottish protestants imprisoned in the Castle of Scherisburgh in France, who being commanded by the captain to come to the mass, answered that to do anything that was against their conscience they would not, neither for him nor yet for the king (History of the Church of Scotland, bk. 1, p. 181)? If he approve this answer of theirs, he must allow us to say that we will do nothing which is against our consciences. We submit ourselves and all which we have to the king and to inferior governors we render all due subjection, which we owe to them. But no mortal man has domination over our consciences, which are subject to one only Lawgiver and ruled by his Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies… (1637), pt. 3, ch. 4</cite>, p. 49</span></figcaption>

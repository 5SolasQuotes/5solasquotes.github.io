</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc860b657c" data-kw="">
<blockquote><p>If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes, not to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on Gal. 2, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/article-of-a-standing-or-falling-church.html">The Article of a Standing or Falling Church</a> › <a href="../topics/justification/article-of-a-standing-or-falling-church/the-dividing-line-with-rome.html">The dividing line with Rome</a></span><span class="t"><a href="../topics/justification/roman-justification.html">Roman Justification</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes, not to the whole world.”

— Martin Luther, Commentary on Galatians, on Gal. 2, p. 43">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+the+Pope+would+concede+that+God+alone+by+His+grace+through+Christ+justifies+sinners%2C+we+would+carry+him+in+our+arms%2C+we+would+kiss+his+feet.+But+since+we+cannot+obtain+this+concession%2C+we+will+give+in+to+nobody%2C+not+to+all+the+angels+in+heaven%2C+not+to+Peter%2C+not+to+Paul%2C+not+to+a+hundred+emperors%2C+not+to+a+thousand+popes%2C+not+to+the+whole+world.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+on+Gal.+2%2C+p.+43&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc860b657c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc860b657c.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c793e92df6" data-kw="">
<blockquote><p>This claim, as it rests upon the authority of the Pope, is utterly unscriptural, because the Pope is not known to Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, p. 99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“This claim, as it rests upon the authority of the Pope, is utterly unscriptural, because the Pope is not known to Scripture.”

— A. A. Hodge, Outlines of Theology, p. 99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+claim%2C+as+it+rests+upon+the+authority+of+the+Pope%2C+is+utterly+unscriptural%2C+because+the+Pope+is+not+known+to+Scripture.%E2%80%9D%0A%0A%E2%80%94+A.+A.+Hodge%2C+Outlines+of+Theology%2C+p.+99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc793e92df6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c793e92df6.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.”

— John Calvin, Institutes of the Christian Religion, 4.7.24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CShall+we+recognise+the+Apostolic+See+where+we+see+nothing+but+horrible+apostasy%3F+Shall+he+be+the+vicar+of+Christ+who%2C+by+his+furious+efforts+in+persecuting+the+Gospel%2C+plainly+declares+himself+to+be+Antichrist%3F+Shall+he+be+the+successor+of+Peter+who+goes+about+with+fire+and+sword+demolishing+everything+that+Peter+built%3F+Shall+he+be+the+Head+of+the+Church+who%2C+after+dissevering+the+Church+from+Christ%2C+her+only+true+Head%2C+tears+and+lacerates+her+members%3F+Rome%2C+indeed%2C+was+once+the+mother+of+all+the+churches%2C+but+since+she+began+to+be+the+seat+of+Antichrist+she+ceased+to+be+what+she+was.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.7.24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd5daca24a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd5daca24a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-bffd5fb0a7" data-kw="">
<blockquote><p>Thus, when the Pope usurps the triple office of Christ, he destroys Christ’s gospel by his own traditions, also destroying Christ’s redemption by his own indulgences, purgatory, masses, and rewards; all this while verbally professing Jesus to be the Christ. Notwithstanding his profession, he must be regarded as having denied Christ, together with the Father, by his very deeds and works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 58</span></figcaption>

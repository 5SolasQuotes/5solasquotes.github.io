<main class="wrap"><figure class="quote" id="q-502fe444b3" data-kw="">
<blockquote><p>If at this day we should take a survey of the several professions of Christianity that have any large spread in any part of the world (as of the religion of the Roman and the Reformed Churches in our quarters, of the Egyptians and Ethiopians in the South, of the Grecians and other Christians in the Eastern parts) and should put-by the points wherein they differ one from another, and gather into one body the rest of the articles wherein they do all generally agree, we should find that in those propositions which without all controversy are universally received in the whole Christian world, so much truth is contained, as being joined with holy obedience, may be sufficient to bring a man unto everlasting salvation. Neither have we cause to doubt, but that as many as do walk according to this rule (neither overthrowing that which they have builded by superinducing any damnable heresies thereupon, nor otherwise vitiating their holy faith with a lewd and wicked conversation), peace shall be upon them and mercy, and upon the Israel of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Opinions of Certain Reverend &amp; Learned Divines concerning the Fundamental Points of the True Protestant Religion, &amp; the Right Government of Reformed Churches</cite>, ([Oxford] Downes, 1643), ‘The Judgment of… Lord Archbishop of Armagh, delivered in a Sermon of his preached before King James at Wansted, June 20th, 1624’, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>Thus the divine will is also called that which God wants done [voluntas signi], because it signifies what is acceptable to god; what He wants done by us. It is called ‘consequent’ because it follows that eternal antecedent; ‘conditional’ because the commandments, prohibitions, warnings, and promises of God all have a condition of obedience or disobedience attached to them. Finally it is called ‘revealed,’ because it is always explained in the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in</cite>, ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 3, (3), proposition 2, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

— Johannes Wollebius, Compendium of Christian Doctrine, pt. 1 in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 3, (3), proposition 2, p. 48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+the+divine+will+is+also+called+that+which+God+wants+done+%5Bvoluntas+signi%5D%2C+because+it+signifies+what+is+acceptable+to+god%3B+what+He+wants+done+by+us.+It+is+called+%E2%80%98consequent%E2%80%99+because+it+follows+that+eternal+antecedent%3B+%E2%80%98conditional%E2%80%99+because+the+commandments%2C+prohibitions%2C+warnings%2C+and+promises+of+God+all+have+a+condition+of+obedience+or+disobedience+attached+to+them.+Finally+it+is+called+%E2%80%98revealed%2C%E2%80%99+because+it+is+always+explained+in+the+word+of+God.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Doctrine%2C+pt.+1+in+ed.+John+Beardslee%2C+Reformed+Dogmatics%3A+J.+Wollebius%2C+G.+Voetius+%26+F.+Turretin+%28Oxford+Univ.+Press%2C+1965%29%2C+ch.+3%2C+%283%29%2C+proposition+2%2C+p.+48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca9e52e604.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca9e52e604.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=Thus%20the%20divine%20will%20is%20also,explained%20in%20the%20word%20of%20God&amp;text=Thus%20the%20divine%20will%20is%20also%20called%20that&amp;text=is%20always%20explained%20in%20the%20word%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cada49892a" data-kw="">
<blockquote><p>There are sundry cogent arguments which are taken from external considerations of the Scripture, that evince it on rational grounds to be from God. All these are motives of credibility, or effectual persuasives to account and esteem it to be the word of God. And although they neither are, nor is it possible they ever should be, the ground and reason whereon we believe it so to be with faith divine and supernateral; yet are they necessary unto the confirmation of our faith herein against temptations, oppositions, and objections. These arguments have been pleaded by many and that usefully, and therefore it is not needful for me to insist upon them. And they are the same for the substance of them in ancient and modern writers, however managed by some with more learning, dexterity, and force of reasoning than by others. …although we plead that no man can believe the Scriptures to be the word of God with faith divine, supernatural, and infallible, but upon its own internal divine evidence and efficacy, yet we allow and make use of all those external arguments of its sacred truth and divine original which are pleaded by others, ascribing unto them as much weight and cogency as they can do, acknowledging the persuasion which they beget and effect: to be as firm as they can pretend it to be: Only we do not judge them to contain the whole of the evidence which we have for faith to rest in, or to be resolved into; yea not that at all, which renders it divine, supernatural and infallible. The rational arguments we say which are, or may be used in this matter, with the human testimonies whereby they are corroborated, may and ought to be made use of and insisted on; and it is but vainly pretended that their use is superseded by our other assertions; as though where faith is required, all the subservient use of reason were absolutely discarded, and our faith thereby rendered irrational; and the assent unto the divine original and authority of the Scriptures, which the mind ought to give upon them, we grant to be of as high a nature as is pretended to be, namely, a moral certainty. Moreover, the conclusion which unprejudiced reason will make upon these arguments, is more firm, better grounded, and more pleadable, than that which is built merely on the sole authority of any church whatever…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 28-30 of The Reason of Faith... (Glasgow, 1801), ch. 3, ‘Sundry convincing external Arguments for Divine Revelation’ also in Works, vol. 4</span></figcaption>

<blockquote><p>Thus, before the act of justification, I mean by nature, not by time, our faith or confidence has this proposition about the future as its object, ‘to me believing, sins will be forgiven.’ In the act of justification, this is about the present, ‘sins are being forgiven to me;’ after the act of justification, this is about the past, ‘sins have been forgiven to me.&#x27;</p></blockquote>

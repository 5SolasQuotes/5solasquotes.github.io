<blockquote><p>It is often assumed that American slavery was wholly the fault of those living in the Southern states of the union; this assumption is crudely reductionist. Indeed, we find Albert Barnes, a New School Presbyterian theologian, arguing that public opinion in the North was often more proslavery than that in the South:

[…] I have been led to apprehend that there are many there [in the South] who, in this respect, are much in advance of many at the North, and that among these are many who exhibit a degree of candour which we do not always find in those portions of our country in which slavery does not exist. There is a hesitancy at the North in speaking of it as an evil; a desire to apologize for it, and even to defend it as a scripture institution, which by no means meets the convictions of the great body of men in the South, and for which they do not thank us. They regard slavery as an unmixed evil – as the direct calamity of their portion of the republic. They consider it to be contrary to the spirit of the Bible. They look upon it as a curse in the midst of which they were born; as an evil entailed upon them without their consent, and which they desire above all things to get rid of. They remember with little gratitude the laws and cupidity of the mother country [Britain] by which it was imposed on them, and the Northern ships by which the inhabitants of Africa were conveyed to their shores; and they little thank the professors in Theological Seminaries, and the pastors of the churches, and the editors of papers, and the ecclesiastical bodies at the North, who labour to convince the world that it is not an evil, and that it is one of the designs and tendencies of Christianity to rivet the curse on them for ever. Such men ask for no defence of slavery from the North. […] There have been more published defences of slavery from the Bible at the North, than there have been from the South.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/albert-barnes.html">Albert Barnes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An inquiry into the scriptural views of slavery</cite>, (Philadelphia, 1846), pp 9-10.</span></figcaption>

<blockquote><p>Of three kinds of liberty, and how servitude is agreeable to the Law of Nature. But here it will further be demanded, whether servitude be agreeable to the Law of nature, and how it comes to pass, that the Lord suffered the Israelites being a free people, to be servants one unto another. For the deciding of this doubt, there is a threefold kind of liberty to be considered, a natural liberty, civil, and spiritual.

1. The natural liberty I call that, wherein Adam was created, being subdued to no bondage, neither spiritual of sin, nor corporal in any outward subjection to any creature: but as he had a freedom of will, and was made Lord of his affections within, that he needed not to have sinned, unless he would himself: so he had the dominion of the creatures given unto him. This original liberty of nature considered, servitude and bondage was brought in as a punishment of sin, and so is not simply, and of itself agreeable to the Law of nature.

2. But now since Adam’s fall, there is another kind of civil liberty, and civil servitude opposite unto it. Civil liberty is defined to be a natural faculty, for every man to do as himself likes. . . unless one be hindered by force or in right; for that is no true liberty for a man against right, to do what him likes . . . Now this servitude simply accords not with nature, as the Apostle says, If yet thou mayest be free, use it rather, 1 Cor. 7.21. showing that every one by nature desires liberty and freedom. But after a sort this servitude is agreeable to nature, not simply, or of itself, but as other punishments are said to be natural, as tending to the maintenance of society among men which is properly natural. And if it be objected, why since all men are fallen in Adam, and so brought into subjection, why all likewise become not servants: the answer is, that two things must be considered in this our corrupt state: the one is the Law of corruption, brought in by sin, the other the goodness of God: that although all men are subject by sin to the same bondage and corruption, yet the goodness of God qualifies that slavish condition of nature, as that some do enjoy an outward liberty and freedom: like as in the inward faculties of the soul, the Lord gives unto some more light of understanding, dexterity of wit, profoundness of judgement, and other natural gifts, than unto others.

3. The spiritual liberty is wrought in us by grace in Christ, which is from the subjection of sin, and malediction of the Law; that our conscience is no more terrified with slavish fear, but we are at peace with God: and beside, by this spiritual liberty, the faithful have restored unto them the dominion over all creatures: that though not in external possession, yet in a spiritual right, all things are theirs, whether the world, life, death, things present or things to come, 1 Cor. 3.22. and all things work to the best, to those that love God, Rom. 8.28. So these may very well stand together, external servitude, and spiritual freedom: it is possible for one to bee a freeman to God, and yet a servant in the world, and another to be a bondman to sin, and yet free in the world: for there are divers objects of these two kinds of liberty and bondage; the outward freedom respects this life and state, the free use of riches, and pleasures of this life: the spiritual and internal freedom hath set before it the salvation of the soul, the favor of God, and life eternal. Christian religion then overthrows not the diversity of degrees among men: But as Christ, though he were by his spiritual right, free from all taxes and impositions, yet lest he should offend, payed poll money, Matt. 17. so Christians, though they are made free by faith in the Son, yet for the maintenance of peace and love, and avoiding of offence, in disturbing the temporal State, they are bound as well as others, to be subject unto the powers of this world[.]</p></blockquote>

<blockquote><p>Messiah’s subjects are his, because by his spirit and power he forms them anew; fitting them now for his service here, and for the full enjoyment of heaven hereafter. To rescue men from external slavery, yet to leave their slavish habits and propensities in full force, would not greatly ameliorate their condition nor render them proper subjects of a free state. Christ does more than this for his people, and thereby his right to their persons and services is strengthened and confirmed. “Behold,” says he, “I make all things new,” and through his creative energy new light shines into the understanding, and new affections are kindled in the heart—new principles are implanted in the mind, and new hopes gladden the soul—new desires influence the will, and new actions characterise the life—old things pass away, and all things become new.

All this is effected by his blessed spirit. “Lo,” said Jesus, when about to leave this scene of suffering and of sorrow, “Lo I am with you always, even to the end of the world.” The disciples to whom this promise was made, continued not long upon earth, and we now behold him with the eye of flesh no more. Yet is he still present with his people. Yea he will never leave nor forsake them. Soon was his promise fulfilled, and the Comforter, sent from on high, took up his abode in the hearts of his people. They thus become temples of the Holy Ghost, in which he delights to dwell, and will for ever be glorified; they are members of that body of which Christ is at once the sovereign and head, and one spirit animates the whole.

If slight benefits conferred, or trivial changes of character produced, furnish claims of gratitude or of submission, what must be due from Messiah’s subjects to their Lord, who makes them new creatures, and fits them for the society of angels, and the spirits of just men made perfect? In consequence of this, whatever their previous character or conduct may have been, they now perceive that Christ is indeed a King; they cordially submit to him as their king; and, by cheerfully submitting themselves to him as his subjects, they confirm his right to their persons and services, they secure their own felicity in time and for ever, and they verify the prediction of our text, “Thy people shall be willing.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Messiah’s subjects are his, because by his spirit and power he forms them anew; fitting them now for his service here, and for the full enjoyment of heaven hereafter. To rescue men from external slavery, yet to leave their slavish habits and propensities in full force, would not greatly ameliorate their condition nor render them proper subjects of a free state. Christ does more than this for his people, and thereby his right to their persons and services is strengthened and confirmed. “Behold,” says he, “I make all things new,” and through his creative energy new light shines into the understanding, and new affections are kindled in the heart—new principles are implanted in the mind, and new hopes gladden the soul—new desires influence the will, and new actions characterise the life—old things pass away, and all things become new.

All this is effected by his blessed spirit. “Lo,” said Jesus, when about to leave this scene of suffering and of sorrow, “Lo I am with you always, even to the end of the world.” The disciples to whom this promise was made, continued not long upon earth, and we now behold him with the eye of flesh no more. Yet is he still present with his people. Yea he will never leave nor forsake them. Soon was his promise fulfilled, and the Comforter, sent from on high, took up his abode in the hearts of his people. They thus become temples of the Holy Ghost, in which he delights to dwell, and will for ever be glorified; they are members of that body of which Christ is at once the sovereign and head, and one spirit animates the whole.

If slight benefits conferred, or trivial changes of character produced, furnish claims of gratitude or of submission, what must be due from Messiah’s subjects to their Lord, who makes them new creatures, and fits them for the society of angels, and the spirits of just men made perfect? In consequence of this, whatever their previous character or conduct may have been, they now perceive that Christ is indeed a King; they cordially submit to him as their king; and, by cheerfully submitting themselves to him as his subjects, they confirm his right to their persons and services, they secure their own felicity in time and for ever, and they verify the prediction of our text, “Thy people shall be willing.”

— Christopher Greig, Christ Subdues a People to Himself in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMessiah%E2%80%99s+subjects+are+his%2C+because+by+his+spirit+and+power+he+forms+them+anew%3B+fitting+them+now+for+his+service+here%2C+and+for+the+full+enjoyment+of+heaven+hereafter.+To+rescue+men+from+external+slavery%2C+yet+to+leave+their+slavish+habits+and+propensities+in+full+force%2C+would+not+greatly+ameliorate+their+condition+nor+render+them+proper+subjects+of+a+free+state.+Christ+does+more+than+this+for+his+people%2C+and+thereby+his+right+to+their+persons+and+services+is+strengthened+and+confirmed.+%E2%80%9CBehold%2C%E2%80%9D+says+he%2C+%E2%80%9CI+make+all+things+new%2C%E2%80%9D+and+through+his+creative+energy+new+light+shines+into+the+understanding%2C+and+new+affections+are+kindled+in+the+heart%E2%80%94new+principles+are+implanted+in+the+mind%2C+and+new+hopes+gladden+the+soul%E2%80%94new+desires+influence+the+will%2C+and+new+actions+characterise+the+life%E2%80%94old+things+pass+away%2C+and+all+things+become+new.%0A%0AAll+this+is+effected+by+his+blessed+spirit.+%E2%80%9CLo%2C%E2%80%9D+said+Jesus%2C+when+about+to+leave+this+scene+of+suffering+and+of+sorrow%2C+%E2%80%9CLo+I+am+with+you+always%2C+even+to+the+end+of+the+world.%E2%80%9D+The+disciples+to+whom+this+promise+was+made%2C+continued+not+long+upon+earth%2C+and+we+now+behold+him+with+the+eye+of+flesh+no+more.+Yet+is+he+still+present+with+his+people.+Yea+he+will+never+leave+nor+forsake+them.+Soon+was+his+promise+fulfilled%2C+and+the+Comforter%2C+sent+from+on+high%2C+took+up+his+abode+in+the+hearts+of+his+people.+They+thus+become+temples+of+the+Holy+Ghost%2C+in+which+he+delights+to+dwell%2C+and+will+for+ever+be+glorified%3B+they+are+members+of+that+body+of+which+Christ+is+at+once+the+sovereign+and+head%2C+and+one+spirit+animates+the+whole.%0A%0AIf+slight+benefits+conferred%2C+or+trivial+changes+of+character+produced%2C+furnish+claims+of+gratitude+or+of+submission%2C+what+must+be+due+from+Messiah%E2%80%99s+subjects+to+their+Lord%2C+who+makes+them+new+creatures%2C+and+fits+them+for+the+society+of+angels%2C+and+the+spirits+of+just+men+made+perfect%3F+In+consequence+of+this%2C+whatever+their+previous+character+or+conduct+may+have+been%2C+they+now+perceive+that+Christ+is+indeed+a+King%3B+they+cordially+submit+to+him+as+their+king%3B+and%2C+by+cheerfully+submitting+themselves+to+him+as+his+subjects%2C+they+confirm+his+right+to+their+persons+and+services%2C+they+secure+their+own+felicity+in+time+and+for+ever%2C+and+they+verify+the+prediction+of+our+text%2C+%E2%80%9CThy+people+shall+be+willing.%E2%80%9D%0A%0A%E2%80%94+Christopher+Greig%2C+Christ+Subdues+a+People+to+Himself+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9829994895.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9829994895.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/05/19/christopher-greig-christ-redeems-us-from-sins-slavery-and-slavish-habits/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>But it is a question of more moment: How God promises a reward to these sons of Jonadab [who are Rechabites] for obeying the command of their [fore-]father [to dwell in tents and not drink wine], and whether they had sinned if they had not obeyed this command of Jonadab; which brings in another question: Whether parents have a power to oblige their children in matters which God has left at liberty? To which I answer:

1. God might reward these Rechabites for their reverence and obedience to Jonadab their father, though these were not strictly, by the Divine law, obliged thus far to have obeyed him; as He rewarded David for his thoughts in his heart to build him a house, though it was not God’s will that He should do it; so as God’s promise of the reward does not prove their obedience in this particular to have been their duty. Admit that it remained still a matter of liberty, yet the general honour and reverence they testified might be rewarded by God.

2. Unquestionably parents have not a power to determine children in all things as to which God has left them a liberty, for then they have a power to make their children slaves, and to take away all their natural liberty. To marry or not, and to this or that person, is [a] matter of liberty. Parents cannot in this case determine their children; Bethuel, Gen. 24:58, asks Rebekah if she would go with Abraham’s servant before he would send her.

3. In matters of civil concernment they have a far greater power than in matters of religion. All souls are God’s, and conscience can be under no other dominion than that of God.

4. In civil things parents have a great power, during the nonage of children, and after also in matters which concern their parents’ good, as to command them to assist them, to help to supply their necessities, etc.

5. Parents being set over children, and instead of God to them, as it is their duty to advise their children to the best of their ability for their good; so it is the duty of children to receive their advice, and not to depart from it, unless they see circumstances so mistaken by parents, or so altered by the providence of God, as they may reasonably judge their parents, had these known or foreseen it, would not have so advised. But that parents have an absolute power to determine children in all things as to which God has not forbidden them, and that children by the law of God are obliged to an obedience to all such commands, however they may see their parents mistaken, or God by his providence may have altered circumstances, I see no reason to conclude. Jonadab had prudently advised his sons as before mentioned; they were things they might do, and which by experience they found not hurtful to them, but of great profit and advantage, and that with reference to all the ends of man’s life: herein they yield obedience, and pay a reverence to their parent; this pleases God, He promises to reward them with the continuance of their family, according to what He had said, Ex. 20:12, in the Fifth Commandment, which the apostle calls the first commandment with promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, v. 19</span></figcaption>

<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach… nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>

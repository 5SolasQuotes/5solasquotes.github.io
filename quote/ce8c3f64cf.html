<main class="wrap"><figure class="quote" id="q-ce8c3f64cf" data-kw="">
<blockquote><p>IV. Liberty is fourfold: (1) the liberty of independence which belongs to God as the first being; this is opposed to the necessity of dependence which belongs to all creatures. (2) Liberty from coaction by which man acts spontaneously and with freedom; this is opposed to the necessity of coaction seen in those who act through force. (3) Rational liberty from brute and physical necessity by which man acts from choice (ek proaireseōs) and not by a brute instinct and blind impulse; this is opposed to the physical necessity of inanimates and brutes. (4) Liberty from slavery by which man is subject to the yoke of no slavery, either of sin or of misery; this is opposed to the necessity of slavery in sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.4 (p. 570).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7f8ab653f" data-kw="">
<blockquote><p>Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.</p></blockquote>

<blockquote><p>Nevertheless, it [death as a penalty] is not just any impotence, but a spiritual impotence. For in spiritual death, man retains his natural power of understanding, willing, and operating, though he becomes devoid of spiritual power. Furthermore, it is a spiritual impotence not for every kind of good, natural, civil, and moral, but for spiritual and saving good, good that accompanies salvation (Heb. 6:9), at least that he might do it spiritually (1 Cor. 2:14).</p></blockquote>

<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2e33359a3e" data-kw="">
<blockquote><p>That God visits the good works of the godly with reward, and to former adds new and ampler grace, we deny not. But whosoever asserts that works have the effect of increasing justification, understands neither what is the meaning of justification nor its cause. That we are regarded as righteous when we are accepted by God, has already been proved. From this acceptance, too, works derive whatever grace they had.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on canon 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span></div>

</figure><figure class="quote" id="q-da668ac3be" data-kw="">
<blockquote><p>The formal cause, they say, is the justice of God; not that justice, whereby he himself is just; but that which he communicateth unto us, whereby we truly both are counted just, and also are so indeed. By which words they understand the renewing of a man now regenerate, and his new forming by grace and the holy Ghost. The which things, that they are done in a man already justified, we deny not: but that justification consisteth therein, we cannot grant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places</cite>, Part 3, ch. 4: Of Justification, § 46</span></figcaption>

</figure><figure class="quote" id="q-5faeed28d1" data-kw="">
<blockquote><p>This righteousness is not inherent in us but is given by God and received by faith alone.</p></blockquote>

</figure><figure class="quote" id="q-16ec124bdb" data-kw="">
<blockquote><p>The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)</span></figcaption>

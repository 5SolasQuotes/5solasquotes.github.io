<blockquote><p>All other unions are dissoluble: a man may be plucked from his dwelling-house and lands, or they from him, though he have never so good a title to them; may be removed from his dearest friends, the husband from the wife, if not by other accidents in their lifetime, yet sure by death, the great dissolver of all those unions, and of that straitest one, of the soul with the body; but it can do nothing against this union [with Christ], but, on the contrary, perfects it.</p></blockquote>

<blockquote><p>I lighted upon a passage in [the Romanist] Becanus (Sum. Theol. tome 5, ch. 7, question 3, p. 119) , that merits a little stay and consideration. Besides that grant above mentioned, which the Orthodox make unto the Lutherans, he gratifies them farther, and yields unto them that the divine attributes are communicated unto the humanity, not only in the Person of the Word, but also in the very humanity itself: Howbeit, not proximè, immediately, and formally, but only mediately, consequently, and identically; for only the subsistence of the Word is communicated proximè, immediately, and formally unto the humanity in itself, and by it the humanity does nextly, immediately, and formally subsist. But because that subsistence is really the same with the divine essence and attributes, therefore the divine essence and attributes are communicated consequently and identically unto the humanity, not that the humanity is omnipotent, omniscient, and omnipresent by them, but that it subsists by them, as they are really one and the same thing with the subsistence of the Word. A hint he had of this conceit it seems from Gregory De Valentia: For unto him he refers the reader, and the words which he relates unto are as follows: ‘Agnoscimus &amp; subsistentiam, &amp; etiam divinitatem at{que} perfectionem omnem verbi, naturae humanae communicatam esse uno quodam modo maximè reali, ut scilicet in personâ verbi subsistat, primariò quidem per ipsam verbi subsistentiam seu personalitatem, secundariò autem per Divinitatem etiam &amp; perfectiones ejus, quae ab eâ subsistentia re non differunt’ (tome 4, question 2, punct. 3, section 3, p. 131). ‘We acknowledge that both the subsistence and also divinity, and every perfection of the Word, is communicated unto the human nature after one way or manner, that is most real: to wit, that it subsists in the person of the Word primarily, by the subsistence, or personality itself of the word, secondarily by the divinity also, and perfections thereof, which do not differ really from the subsistence.’ Thus you see, that both of them make no bones to affirm that the subsistence, or personality of the Word, is communicated unto the manhood of Christ, so that it denominates it to subsist properly in, or by the Person of the Word. For confutation of this their opinion, I shall at present allege but two arguments out of [Robert] Baron against it (Philos. Theol. Exercit., pt. 1, article 12, pp. 55-56).

1. If the manhood of Christ subsist any manner of way, then it is a person, or suppositum: for what is subsistence here, but suppositality, and therefore it, and suppositum are reciprocated.

2. To exist in another person, and to subsist, are opposite manners of existence; for to subsist isesse per se, &amp; extra aliud omne suppositum. But the manhood of Christ does exist in the Person of the Word, and therefore it cannot be said to subsist. If these men would have consulted their own Suarez, he would have rectified this their mistake, and have told them, how that usual saying, ‘The humanity of Christ subsists in the Person of the Word,’ is to be qualified, to wit, in regard of its termination unto, and sustentation by the subsistence of the Word. For having propounded this objection, ‘Dices, humanitas Christi non subsistit proprie, quia non est in se, sed in alio,’ he frames hereunto this answer: ‘Respondetur, non subsistere, tanquam id quod subsistit: sed proprie verbum in illa subsistit, &amp; illa dicitur in verbo subsistere, quia illius subsistentia terminatur, &amp; quasi sustentatur.’ (on 3rd pt. of Thomas, tome 1, disputation 8, section 3, p. 231)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity</cite>, … (Oxford, 1656) Jeanes (1611-1662) was an English, clergyman and puritan minister., pp. 134-6</span></figcaption>

<blockquote><p>That is not the essential righteousness of God, as Andreas Osiander contended … And it is not partly composed of Christ’s righteousness and partly of ours, which the sophists invent, whom Calvin refutes in the same chapter. But it is only by the righteousness of Jesus Christ, our Mediator and Savior, as the apostle Paul teaches and confirms in Romans 5:12 and following.</p></blockquote>

<blockquote><p>The exaltation of the assumed nature to the highest and unspeakable dignity, is that honour, which the person of the son of God hath communicated to the nature assumed, so that he hath exalted it above all Angels &amp; men, whom he surpasseth, and excelleth by most far and unspeakable degrees. Heb. 14. Mat. 28.18. John. 17.2. Phil. 2.9. Ephes. 1.20.22.

That exaltation consisteth chiefly in these three points.

1. In the personal union with the word: because the human nature is assumed into the unity of the person of Gods son: so that it is the proper flesh of the eternal son of God, Heb. 2.16.

2. In the gifts, because it hath the fullness of all the gifts of the holy spirit, which can be in a creature, that is to say, it hath not only some gifts, as the rest of the Saints, who have them according to measure: but all gifts, not only in number, but even in the most excellent degree. John. 3.34. Those gifts given to the humanity of Christ, are created qualities: because his humanity is created. That truly is adorned with most excellent, and incomprehensible gifts, but such as do not overthrow and destroy the same.

3. In the fellowship of the office, both of the mediator between God and the believers, and also of the head of the Church, and of the Judge of the whole world. Mat. 28.18. Phil. 2.9. Ephesians. 1.20.22, Psal. 110.1.1. Timot. 2.5. 1. John. 2.12. Heb. 7.25.26.27. and 8.1. and 9.24.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-34f0945870" data-kw="">
<blockquote><p>Being deeply impressed with the sense of the dismal effects and fatal consequences of division and alienation of mind and affection among the Lord’s servants, and of the indispensable necessity of mutual harmony in the Lord among the ambassadors of the Gospel of peace; and being much weighted with the present situation this Church is now in on many accounts, it was no small satisfaction to us to understand that our worthy and dear Brethren, whom we judge in charity have acted according to their light and conscience in taking the said oath, do evidence such brotherly regard to us, and such tenderness to the peace and welfare of this Church, in expressing their readiness to contribute their best endeavors for removing all differences among such as fear the Lord in this Church, in addressing the government for our relief, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity… (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, b. ‘Review of a Decision that Appeals cannot lie except in Judicial Cases’</cite>, p. 489</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>But if Peter withdraw or separate from the Gentiles for fear of offending the Jewish Christians, and Barnabas be led away with the dissimulation, Paul must oppose it to their faces: And I that have seen what the Spirit of division has done, and read that God never blessed unnecessary separation, will imitate Paul. And if this world be uncurable, the Lord prepare me for that world where love and unity have no enemies.</p></blockquote>

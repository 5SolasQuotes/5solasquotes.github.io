<main class="wrap"><figure class="quote" id="q-a18097d2ea" data-kw="government creator">
<blockquote><p>God hath an indisputable and peculiar right to the government of the world. None indeed that acknowledge a God, did or can question God’s right. He is the creator, and therefore is the sovereign Lord and Ruler. The world is his family, and, as a master, he hath an undoubted right to govern his own family.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on Divine Providence</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-90b2694bf6" data-kw="Sovereignty Satan">
<blockquote><p>The Lord God omnipotent reigneth. His government is exercised over inanimate matter, over the brute beasts, over the children of men, over angels good and evil, and over Satan himself. No revolving world, no shining of star, no storm, no creature moves, no actions of men, no errands of angels, no deeds of Devil—nothing in all the vast universe can come to pass otherwise than God has eternally purposed. Here is a foundation of faith. Here is a resting place for the intellect. Here is an anchor for the soul, both sure and steadfast. It is not blind fate, unbridled evil, man or Devil, but the Lord Almighty who is ruling the world, ruling it according to His own good pleasure and for His own eternal glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sovereignty of God</cite>, ch. 3, “Sovereignty of God in Administration”</span></figcaption>

</figure><figure class="quote" id="q-d2615bf758" data-kw="">
<blockquote><p>But men are his especial care. He provides the food of their bodies, and in a peculiar way watches and rules over their souls and lives. This he does with respect to the wicked as well as the good. His care extends to individuals, to families, to nations, and throughout the world. It appears not in great events only, but in those exceeding small, even to the numbering of the hairs of each one&#x27;s head.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-petigru-boyce.html">James Petigru Boyce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abstract of Systematic Theology</cite>, ch. XXI, “Providence,” §I.5</span></figcaption>

</figure><figure class="quote" id="q-2a288f1832" data-kw="government particular concourse">
<blockquote><p>Is providence occupied only in the conservation and sustentation of things; or also in their government through which God himself acts and efficaciously concurs with them by a concourse not general and indifferent, but particular, specific and immediate? We deny the former and affirm the latter, against the Jesuits, Socinians and Remonstrants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.4</span></figcaption>

</figure><figure class="quote" id="q-c3a4da0f42" data-kw="providence wisdom">
<blockquote><p>That there is a Providence. The wisdom of God would not be so perspicuous, were there not a providence in the world. It is eminent in the creation, but more illustrious in the government of the creatures. A musician discovers more skill in the touching an instrument, and ordering the strings, to sound what notes he pleaseth, than he doth in the first framing and making of it. All God’s providences are but his touch of the strings of this great instrument of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on Divine Providence</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9aa4368dc7" data-kw="">
<blockquote><p>And therefore, lastly, in answer to diverse places of the ancients which are produced to confirm the modern sense of justification by faith alone, I answer in a word: That it is true, their words seem to attest so much, but their meaning was plainly no more than this: That faith many times does justify without works, that is, any outward manifestation of their faith, by such fruits: but never without inward acts of repentance and charity distinct from this special faith: nor without such a devotion to good works, which wants nothing but opportunity to exert them; which is by an extraordinary clemency and grace of God, accepted for the thing itself. This appears by the example by them given, to manifest their meaning, of the thief on the cross; who was so justified and saved by faith alone, without good works answerable thereunto, because his sudden faith was prevented by sudden death. Nevertheless, that his faith was so much alone as to exclude repentance, and such graces as were compatible to one in his condition, from a proportionable concurrence to that effect, is nowhere said, nor intended by any of the fathers whose judgment is of account in the Church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 20</cite>, p. 76</span></figcaption>

e · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80072c86da" data-kw="">
<blockquote><p>For a condition does suspend that whereof it is a condition from existence, until it be accomplished… But it is not yet proved, nor ever will be, that whatever is required in them that are to be justified, is a condition whereon their justification is immediately suspended. We allow that alone to be a condition of justification which has an influence of causality thereunto, though it be but the causality of an instrument. This we ascribe unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith… (London: Boulter, 1677)</cite>, p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<blockquote><p>Wherefore the Gospel dispossesses all unbelievers of Christ’s benefits, not only by a flat exclusion, but also by positive virtue of that condition of faith and repentance, by which He promises expressly or covertly his benefits unto men, and which it appears is never found in the reprobate, that is, such as do persist, and will still persist in their impiety.</p></blockquote>

</figure><figure class="quote" id="q-3b2ffcfa31" data-kw="">
<blockquote><p>Whether some movement of free choice and faith is required? It is affirmed with a distinction. Whether a movement of free choice contra sin? It is disintinguished. Whether the remission of sins is to number the premises and prerequisites of justification? It is denied. Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished. … Whether it [justification] precedes repentance? It is distinguished. … Whether and in what way the law and penitence are able to be said to concur unto our justification? It is explained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>9. ‘Justification’, Of Justification in General in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2, tract 3 Abbr.</cite></span></figcaption>

eformed Books Online</a></div>
</figure><figure class="quote" id="q-e00340263b" data-kw="">
<blockquote><p>And here the doubt touching the precedency of faith and repentance may be easily determined. For if faith be taken largely or generally for a belief of the promise, if we repent and receive it, then faith is before repentance: for there can be no turning without hope of pardon, nor coming home by hearty sorrow, without some expectation of mercy [see WCF 15.2 &amp; WSC 87]. Thus the exhortations run, ‘Turn unto the Lord, for He is merciful and gracious.’ ‘Repent, for the Kingdom of God is at hand.’ But if faith be taken more strictly, for that faith or belief whereby we receive, embrace, or rest upon the promise of God in Christ Jesus for pardon and forgiveness, then repentance goes before pardon: for no remission is promised to be enjoyed but upon condition of repentance… If repentance be necessary to justification, of necessity it must go before justifying faith; because faith and justification are immediately coupled together. It is impossible to come unto Christ without repentance… Coming unto Christ is a lively motion of the soul, wherein arising from sin, it draws nigh or approaches unto Christ, that in Him it might be satisfied. The motion is one, but the points are two. For in drawing nigh unto Christ, the soul arises from sin: which may be called repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2nd pt., ch. 5, p. 349 of A Treatise of the Covenant of Grace (London, 1645)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

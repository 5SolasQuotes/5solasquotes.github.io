<main class="wrap"><figure class="quote" id="q-ea02c3cad9" data-kw="">
<blockquote><p>There is a necessity of baptism in respect of Gods ordinance, which bindeth us to administer it: but we affirm not such a necessitatem medii, that all they should be absolutely excluded from the Kingdom of Heaven, who die without baptism, as many infants do. That uncharitable opinion we leave to the maintainers thereof, we have no warrant so to judge: and therefore we say, that not the bare privation, but the contempt of the Sacrament condemneth; of which Infants cannot be guilty.

So that if you clearly mean a necessitate medii in respect of the external ministry of man, your proposition is not true, nor owned by us: but if you mean a necessity in respect of our duty in baptizing infants, or their spiritual baptism by regeneration, we so far consent; but then we cannot excuse your medium for an homonomia, which concludeth not an absolute exclusion of all persons unbaptized; is apparently false, in the example of the penitent thief, saved but not baptized, and in charity to be concluded so, in elect children dying before they are baptized …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anabaptism Routed: Or, A Survey of the Controverted Points</cite>, (London: Thomas Johnson, 1655), p. 6.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ed806c3ce" data-kw="">
<blockquote><p>The earliest known example of a Catechetical work is the “Teaching of the Twelve Apostles,” which Athanasius names among the “books not included in the Canon, but appointed by the Fathers to be read by those who are just recently coming to us, and wish to be instructed in the word of godliness (κατηχεῖσθαι τὸν τῆς εὐσεβείας λόγον).” This use of the Didache for the instruction of recent converts from Paganism agrees with its original purpose as stated in the longer title, “Teaching of the Lord through the Twelve Apostles for the Gentiles.” The first six chapters are evidently adapted for those who need elementary instruction, more particularly for Catechumens of Gentile descent, as distinct from Jewish candidates for Baptisms. The remaining chapters of the Didaché relate chiefly to the administration of Baptism, to Prayer, Fasting, and the services of the Lord’s Day, and to the celebration of the Agape and Eucharist. This same division of subjects is observed in the two classes of S. Cyril’s Catechetical Lectures: the first class, including the Procatechesis, consists of XIX Lectures addressed to candidates for Baptism, and these are followed by five “Mystagogic” Lectures, so called as being explanations of the Sacramental Mysteries to the newly-baptized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-hamilton-gifford.html">Edward Hamilton Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Catechetical Lectures of S. Cyril</cite>, ed. Philip Schaff and Henry Wace, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), xii.</span></figcaption>

<blockquote><p>Objection [from a baptist]: The sanctification of the wife is but a civil sanctification in that place, i.e. she is sanctified to his use, that he ought not to put her away. Again, the holiness there spoken of is a fruit of that sanctification of the wife, whereof it will follow, that seeing [as] the effect cannot be greater then the cause, the cause cannot produce a greater effect than itself, the cause being only a civil sanctification, the holiness of the children must be the same; thus argues Thomas Collier. Answer 1: The question [in the text] was, Whether the believer were polluted by his unbelieving wife? The apostle says, ‘No’, quia pluris est pietas unius ad sanctificandum conjugium,quàm alterius impietas ad inquinandum, i.e. the faith of the believer is of greater force to sanctify their present cohabitation, than the unbelief of the other to pollute it. This he proves from a greater effect and fruit of the husband’s faith, viz. the holiness of the children born of such a husband by such a woman. The children are holy, not only civilly, as being born of lawful wedlock, but federally as being severed from all children of unbelievers by special prerogative, holy to the Lord, consecrated unto Him, whereas by nature they were aliens and unclean; according to that of Paul, Rom. 11:16, ‘if the root be holy, so are the branches.’ The faith of the believing party sanctifies the unbelieving wife to bear not only a lawful, but a holy seed; yea, it sanctifies the children and severs them from the common condition of other children, which are profane and unclean without the Church, without God in the world.

2. Note that the holiness of the child received from one of the parents believing is more than the sanctification of the wife by her believing husband, because such a wife is not taken into Covenant with her husband, but the child is; and therefore the apostle says not that such as is the sanctification of the wife, such is the holiness of the child: But thus, Such as is the holiness of the believing party, such is the child’s holiness in respect of Church-membership; and so the faith of the believing husband is the cause of both these effects, viz. That his coupling with his wife is not impure, and also that his children are holy: And this latter [is] an evidence of the former. And thus the holiness of the child is a sign of the mother’s sanctification to holy cohabitation, and an effect of the father’s faith by virtue of God’s Covenant. To have said, ‘That their children were lawful’, was no more than to have said, ‘That their marriage was lawful’, which was not the question; But to say, that the children of their lawful marriage were holy, this did infer not only the lawfulness of their marriage but the sanctified use: As Mr Baily has well observed, Of Anabaptism, p. 138.

3. Lastly, If by holy, be only meant a civil holiness, then on the contray, by ‘unclean’, must be meant a civil uncleanness. But when Paul says (else were your children unclean) his intent is not to make them all as an unclean birth and impure offspring, which were born at Corinth of unbelieving parents, but to show that they are not comprehended within God’s Covenant: And so when he says ‘but now are they holy’, he notes some preeminence of the children of Christians above the heathens’ children: Though in civil respects, in respect of a lawful birth, both sorts of children were equal, yet that civil holiness being common to both, there is a preeminence of the Christian’s child above the heathen’s. The child of an infidel at Corinth is today unclean and the next day holy in case his parents turn Christians; And what’s the reason of this so sudden alteration? It must needs be in regard of the Covenant into which the party now believing is taken with his children, his unbelieving neighbor with his children still remaining unclean: Hence I conclude with Calvin, in location, Seeing our children are exempted from the common condition of lost mankind, and admitted into God’s Church and family, Cur eos a signo arceamus? upon what reason can we drive them from the sign of their admittance?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for our Public Ministery &amp; Infant-Baptism, written Some Years Ago</cite>, … (London, 1652), pp. 42-44</span></figcaption>

— William Lyford, An Apology for our Public Ministery &amp; Infant-Baptism, written Some Years Ago, … (London, 1652), pp. 42-44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection+%5Bfrom+a+baptist%5D%3A+The+sanctification+of+the+wife+is+but+a+civil+sanctification+in+that+place%2C+i.e.+she+is+sanctified+to+his+use%2C+that+he+ought+not+to+put+her+away.+Again%2C+the+holiness+there+spoken+of+is+a+fruit+of+that+sanctification+of+the+wife%2C+whereof+it+will+follow%2C+that+seeing+%5Bas%5D+the+effect+cannot+be+greater+then+the+cause%2C+the+cause+cannot+produce+a+greater+effect+than+itself%2C+the+cause+being+only+a+civil+sanctification%2C+the+holiness+of+the+children+must+be+the+same%3B+thus+argues+Thomas+Collier.+Answer+1%3A+The+question+%5Bin+the+text%5D+was%2C+Whether+the+believer+were+polluted+by+his+unbelieving+wife%3F+The+apostle+says%2C+%E2%80%98No%E2%80%99%2C+quia+pluris+est+pietas+unius+ad+sanctificandum+conjugium%2Cqu%C3%A0m+alterius+impietas+ad+inquinandum%2C+i.e.+the+faith+of+the+believer+is+of+greater+force+to+sanctify+their+present+cohabitation%2C+than+the+unbelief+of+the+other+to+pollute+it.+This+he+proves+from+a+greater+effect+and+fruit+of+the+husband%E2%80%99s+faith%2C+viz.+the+holiness+of+the+children+born+of+such+a+husband+by+such+a+woman.+The+children+are+holy%2C+not+only+civilly%2C+as+being+born+of+lawful+wedlock%2C+but+federally+as+being+severed+from+all+children+of+unbelievers+by+special+prerogative%2C+holy+to+the+Lord%2C+consecrated+unto+Him%2C+whereas+by+nature+they+were+aliens+and+unclean%3B+according+to+that+of+Paul%2C+Rom.+11%3A16%2C+%E2%80%98if+the+root+be+holy%2C+so+are+the+branches.%E2%80%99+The+faith+of+the+believing+party+sanctifies+the+unbelieving+wife+to+bear+not+only+a+lawful%2C+but+a+holy+seed%3B+yea%2C+it+sanctifies+the+children+and+severs+them+from+the+common+condition+of+other+children%2C+which+are+profane+and+unclean+without+the+Church%2C+without+God+in+the+world.+2.+Note+that+the+holiness+of+the+child+received+from+one+of+the+parents+believing+is+more+than+the+sanctification+of+the+wife+by+her+believing+husband%2C+because+such+a+wife+is+not+taken+into+Covenant+with+her+husband%2C+but+the+child+is%3B+and+therefore+the+apostle+says+not+that+such+as+is+the+sanctification+of+the+wife%2C+such+is+the+holiness+of+the+child%3A+But+thus%2C+Such+as+is+the+holiness+of+the+believing+party%2C+such+is+the+child%E2%80%99s+holiness+in+respect+of+Church-membership%3B+and+so+the+faith+of+the+believing+husband+is+the+cause+of+both+these+effects%2C+viz.+That+his+coupling+with+his+wife+is+not+impure%2C+and+also+that+his+children+are+holy%3A+And+this+latter+%5Bis%5D+an+evidence+of+the+former.+And+thus+the+holiness+of+the+child+is+a+sign+of+the+mother%E2%80%99s+sanctification+to+holy+cohabitation%2C+and+an+effect+of+the+father%E2%80%99s+faith+by+virtue+of+God%E2%80%99s+Covenant.+To+have+said%2C+%E2%80%98That+their+children+were+lawful%E2%80%99%2C+was+no+more+than+to+have+said%2C+%E2%80%98That+their+marriage+was+lawful%E2%80%99%2C+which+was+not+the+question%3B+But+to+say%2C+that+the+children+of+their+lawful+marriage+were+holy%2C+this+did+infer+not+only+the+lawfulness+of+their+marriage+but+the+sanctified+use%3A+As+Mr+Baily+has+well+observed%2C+Of+Anabaptism%2C+p.+138.+3.+Lastly%2C+If+by+holy%2C+be+only+meant+a+civil+holiness%2C+then+on+the+contray%2C+by+%E2%80%98unclean%E2%80%99%2C+must+be+meant+a+civil+uncleanness.+But+when+Paul+says+%28else+were+your+children+unclean%29+his+intent+is+not+to+make+them+all+as+an+unclean+birth+and+impure+offspring%2C+which+were+born+at+Corinth+of+unbelieving+parents%2C+but+to+show+that+they+are+not+comprehended+within+God%E2%80%99s+Covenant%3A+And+so+when+he+says+%E2%80%98but+now+are+they+holy%E2%80%99%2C+he+notes+some+preeminence+of+the+children+of+Christians+above+the+heathens%E2%80%99+children%3A+Though+in+civil+respects%2C+in+respect+of+a+lawful+birth%2C+both+sorts+of+children+were+equal%2C+yet+that+civil+holiness+being+common+to+both%2C+there+is+a+preeminence+of+the+Christian%E2%80%99s+child+above+the+heathen%E2%80%99s.+The+child+of+an+infidel+at+Corinth+is+today+unclean+and+the+next+day+holy+in+case+his+parents+turn+Christians%3B+And+what%E2%80%99s+the+reason+of+this+so+sudden+alteration%3F+It+must+needs+be+in+regard+of+the+Covenant+into+which+the+party+now+believing+is+taken+with+his+children%2C+his+unbelieving+neighbor+with+his+children+still+remaining+unclean%3A+Hence+I+conclude+with+Calvin%2C+in+location%2C+Seeing+our+children+are+exempted+from+the+common+condition+of+lost+mankind%2C+and+admitted+into+God%E2%80%99s+Church+and+family%2C+Cur+eos+a+signo+arceamus%3F+upon+what+reason+can+we+drive+them+from+the+sign+of+their+admittance%3F%E2%80%9D%0A%0A%E2%80%94+William+Lyford%2C+An+Apology+for+our+Public+Ministery+%26+Infant-Baptism%2C+written+Some+Years+Ago%2C+%E2%80%A6+%28London%2C+1652%29%2C+pp.+42-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8511263fc1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8511263fc1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Objection%20%5Bfrom%20a%20baptist%5D%3A%20The%20sanctification,from%20the%20sign%20of%20their%20admittance&amp;text=Objection%20%5Bfrom%20a%20baptist%5D%3A%20The%20sanctification%20of%20the&amp;text=drive%20them%20from%20the%20sign%20of%20their%20admittance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VI. To no purpose is the reply: (1) “Hence it would follow that the Lord’s Supper should also be administered to infants because the thing signified belongs to them.” Although the same thing is signified in both, still there is a difference in the manner of signifying. In the Supper, the grace of Christ is sealed by way of solid food, which infants are not capable of receiving; but in baptism, it is signified by way of the washing of regeneration, which they are (Jn. 3:5). Again, the Supper demands a twofold condition: a preceding in examination; a concomitant in a commemoration of the death of Christ, both of which presuppose the use of reason. Neither is required in baptism; thus formerly the Passover was distinguished from circumcision—that the latter was administered to infants and the former to adults alone. (2) “It is added that infants are not capacious of the grace of regeneration, nor of the other blessings of the covenant which are accustomed to be conferred by the Spirit through the word.” But it is gratuitously supposed that they are not capacious of the blessing of the covenant. For who denies that they are capacious of the remission of sins and of Christ’s redemption, and of the other benefits which depend upon the covenant into which infants are received? Who can doubt that baptism (with respect to these) is able to be a distinctive sign (introducing into the visible church) and a seal both of the divine truth in the federal promises and of our obligation to mutual duty? For if they are not capable of obligation in the present, they can be in the future. As to regeneration, however, why should infants not be capable of regeneration as they are of sin (unless we say that guilt has more power than grace)? And as they are rational (although they do not put forth an act of reason), what hinders them from being called holy and believers by the Holy Spirit given to them, although they cannot as yet exert an act of faith?</p></blockquote>

<blockquote><p>The fifth argument taken of the end [design] of baptism, to wit, because that they which are baptized, are baptized for dead, that is to say, that they may have a remedy against death because that baptism is a token of regeneration. They that are baptized [are baptized] to this end and purpose, that death may be put out in them, or, to rise again from the death, whereof baptism is a seal.</p></blockquote>

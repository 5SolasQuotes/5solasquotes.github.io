<main class="wrap"><figure class="quote" id="q-a0d05a0c15" data-kw="">
<blockquote><p>22. How is the true Theology generally divided? Ans. Into Archetype and Ectype.

23. What is the Archetypal Theology? Ans. It is divine truth as known to God, and which he has denied to make known to man. Matt. xi. 27; 1 Cor. ii. 7.

24. What is the Ectypal Theology? Ans. It is Theology as known to created intelligences by divine revelation.

25. Is not the Theology, or doctrine of God, the same under both divisions? Ans. Yes: the distinction refers only to the subjects of the Theology, or the knowledge of it.

26. What then is the difference between the Archetypal and Ectypal Theology? Ans. The doctrine being the same, the knowledge of it in God is perfect and original, therefore called Arche typal; in man it is imperfect and derived, and therefore called Ectypal.

27. Can it be true Theology among men, if it be not derived from the revelation which God decreed to make? Ans. No; 1 Cor. ii. 7–14.

28. How is the Ectypal Theology divided? Ans. Into the Theology of Union, of Vision, and of the race, or of travellers.

29. Whether is this a division of Theology, (the doctrine) or of the subjects in whom the knowledge resides? Ans. It is not a distinction properly of Theology, but of modes of knowledge, and of the subjects or persons in whom it is found.

30. What is the subject or recipient of the Theology of Union? Ans. Christ in his human nature.

31. Is this knowledge of Theology residing in Christ’s human nature, or as possessed by the human nature, infinite, or Archetypal, as it is in God? Ans. No: it is necessarily finite and derived.

32. But does it not, in his human nature, excel the knowledge of all men, glorified saints, and holy angels? Ans. Yes.

33. How does this appear? Ans. (1.) On account of the peculiar relation of the human nature of Christ to the person of the Son—a personal union. (2.) The peculiar communion which consequently occurs between the two natures in the person of Christ. (3.) On account of the supply of the Spirit to Christ’s human nature, fitting it for its work and office; Psa. xlv. 7, “anointed with the oil of gladness above thy fellows,” John iii. 34, “God giveth not the Spirit by measure unto him,” that is most abundantly.

34. Might not Christ’s knowledge, in his human nature, be called the Theology of Unction? Ans. Yes; since given by the Spirit’s unction; but this unction belongs to all believers; 1 John iii. 20; only it is in Christ in a more excellent degree, and absolutely infallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), pp 18-19.</span></figcaption>

<blockquote><p>20. Then he shows the greatness of Christ’s power when he says, whom he has appointed heir of all things; for as it says: and if a son, an heir also through God (Gal 4:7).

But in Christ are two natures, namely, the divine and the human: insofar as he is the natural Son, he is not an appointed heir, but he is so naturally; but inasmuch as he is man, he has become the Son of God: concerning his Son who was made to him of the seed of David (Rom 1:3). Indeed, as a man, he has been appointed heir of all things, just as he has become a true son of the Father: all power is given to me in heaven and in earth (Matt 28:18), and it extends to every creature that he has taken under his rule. It extends, therefore, not only to one type of man, but to all, i.e., both Jews and gentiles: ask of me and I will give you the gentiles for your inheritance (Ps 2:8).</p></blockquote>

<blockquote><p>Quest. 1. Should not any science, divine or human, have an appropriate name? Ans. Yes.

2. What is this ordinary name of that science which treats of divine things? Ans. Theology.

3. From what is this name derived? Ans. From the Greek words Theou, God, and Logos, a word, or discourse.

4. Why is this science called Theology? Ans. As it treats of God—a word or discourse about God as the object. Also as it is revealed by God, or is his word.

5. Does not the name Theology, as it is used by Christians, include both these ideas? Ans. Yes. Its leading idea is a discourse or treatise about God; but it is a treatise drawn from his own word.</p></blockquote>

<blockquote><p>IV. But when God is set forth as the object of theology, he is not to be regarded simply as God in himself (for thus he is incomprehensible to us), but as revealed and as he has been pleased to manifest himself to us in his word, so that divine revelation is the formal relation which comes to be considered in this object.

Nor is he to be considered exclusively under the relation of deity (according to the opinion of Thomas Aquinas and many Scholastics after him, for in this manner the knowledge of him could not be saving but deadly to sinners), but as he is our God (i.e., covenanted in Christ as he has revealed himself to us in his word not only as the object of knowledge, but also of worship). True religion (which theology teaches) consists of these two things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian and Reformed, 1992), 1.5.4.</span></figcaption>

<blockquote><p>A being is considered as possible, or as actual. When it is considered as possible, it is said to have an essence or nature; such were all things before their creation; When it is considered as actual, then it is said to have existence also; such are all things which are created, and God himself the Creator. Essence, therefore, is but the very nature of any being, whether it be actually existing or not… There is but one Being which includes existence in the very essence of it, and that is God, who therefore actually exists by natural and eternal necessity; but the actual existence of every creature is very distinct from its essence, for it may be, or may not be, as God pleases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-watts.html">Isaac Watts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logic</cite>, 1.2.1. cf. Aquinas, Of Being.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b1459964db" data-kw="">
<blockquote><p>When casuists, as God requires, call attention to small evils and bind consciences to the avoiding of them (following Mt. 5:19), they do not overlook the big ones, but fight against them the more strongly. That this ought to be done, and the other not left undone, is the Saviour’s teaching (Mt. 23:13). But if by minor details is understood the adiaphora or actions that are lawful, we would agree that practical theology has committed a great sin in pressing such a matter, whenever it has done so.

(3) It is a calumny to say that minutiae [“minor matters”] have been made into major cases of conscience by Reformed theologians (who are called Calvinists, Puritans, etc.). They arouse greater or lesser scruples, analogically according to the degree of the sin. Thus, for instance, they raise more serious scruples about fornication and adultery than about dancing and the stage; about murder and duels than about mere words or fist fights. But they do arouse scruples about both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectae Disputationes Theologicae</cite>, (1648-69) in Reformed Dogmatics, ed. and trans. John W. Beardslee III (New York: Oxford University Press, 1965), pp 277-78.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c19b347d3b" data-kw="">
<blockquote><p>The admission of ministers to their offices must consist in consent of the people and kirk whereto they shall be appointed, and in approbation of the learned ministers appointed for their examination. … Other ceremony than the public approbation of the people, and declaration of the chief minister, that the person there presented is appointed to serve that kirk, we cannot approve; for albeit the apostles used the imposition of hands, yet seeing the miracle is ceased, the using of the ceremony we judge is not necessary.</p></blockquote>

</figure><figure class="quote" id="q-6c6f893d51" data-kw="">
<blockquote><p>3. And He has described the persons that he will have to be the officers by their requisite qualifications [e.g. 1 Tim. 3]. All this is done in his laws already.

4. There is nothing therefore left to be done but to determine which are the individual persons that are fittest according to God’s description. This God Himself also will do, but has not tied himself to one way in doing it: In general, some sign of God’s will that this is the man must be had; At first in calling the apostles his own immediate nomination was the sign. Now the most notable sign is the most eminent unquestionable qualification of the person, which when God confers so notably or discernably, that man must be taken as chosen by God, and they that reject him do sin: These qualifications lie both in abilities, willingness, conveniency of habitation or other externals and interest in the people; and if God bow their minds to consent, there is the fuller signification of his will; yet lest any by intrusion should abuse the Church, God has made the pastors and overseers judges of men’s fitness, or the ordinary discerners of it, for the guidance of the Church in their consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 82-83</span></figcaption>

<blockquote><p>29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter.

30. Universal calling to salvation neither was, nor is, nor will be.

31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>

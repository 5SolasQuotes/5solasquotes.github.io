<main class="wrap"><figure class="quote" id="q-656c77625b" data-kw="">
<blockquote><p>…the natural sense of the clause is clearly that no one of the transactions here brought together is to be affirmed of the non-elect. And this impression is increased by the broader context, not to speak of the parallel passages in 8.3 and 5. It might seem somewhat more to the point, possibly, to recall that in this section the language is so ordered as to seem to deal with the actual ordo salutis rather than directly with the ordo decretorum. It is asserted that the ordo salutis is the result of the decreeing of the means by which the elect are brought to glory. But what is subsequently asserted is that none but the elect are (actually) redeemed by Christ, effectually called, etc…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly and Its Work’ in The Works of Benjamin B. Warfield</cite>, 6:142 &amp; 143), examining the historical debate surrounding WCF 3.6, “Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only:”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb0ca35f61" data-kw="">
<blockquote><p>When [Amyraldianism] urges that the Bible teaches that both by divine decree and in history Christ’s death, represented by it as unrestricted regarding its referents, was intended to save all men without exception (the doctrine of universal atonement), Amyraldianism must necessarily join forces with Arminian universalism which… shares this aspect of its vision and turn away altogether from a real substitutionary atonement…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-reymond.html">Robert L. Reymond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A New Systematic Theology of the Christian Faith</cite>, (Nashville, TN: Thomas Nelson, 1998), p. 478; The italics are Reymond’s.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-9268f81703" data-kw="">
<blockquote><p>In fact it seems much more accurate to say that Amyraut was the real Reformed “scholastic,” and “Reformed Thomas Aquinas,” the balancer, the synthesizer, the creator of new categories, and structures. And Reformed orthodoxy, with its insistence on limited redemption, was actually a primitive throwback to the rigorous and markedly non-rationalistic particularism of Augustine and Gottschalk. Under whatever label, John Calvin, as a limited redemptionist, belongs historically with Augustine, Gottschalk, Bucer, Beza and Reformed orthodoxy–not with Amyraut.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-rainbow.html">Jonathan Rainbow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Will of God and the Cross</cite>, (Allison Park, PA: Pickwick Publications, 1990), p. 62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-dbe4dc9a76" data-kw="">
<blockquote><p>Objection 4. The fathers which believed aright do affirm that Christ redeemed all and the whole world. Answer: Whereas they write that Christ redeemed all men and the world, their meaning is that He did it according unto sufficiency and the common cause and common nature of all, which Christ did take upon Him: and not effectually on God’s part. This very thing does Prosper (Resp. ad object. vin. 1, obj.) make plain: ‘All men’ (says he): ‘are rightly said to be redeemed in respect of the one nature of all and the one cause of all, which our Lord did truly take upon Him: and yet all are not delivered from captivity: The propriety of redemption without doubt belongs unto them for whom the prince of the world is sent abroad:—whose death was not so bestowed for mankind as that it should also pertain unto the redemption of them who were not to be regenerated.’ And again he says (Ad Capit. Gall., ch. 9): ‘Our Savior may fitly be said to be crucified for the redemption of all the world, both in respect that He truly took upon Him the nature of man, and also in respect of the common or general perdition in the first man: and yet He may be said to be crucified only for those unto whom his death was available.’ Moreover the fathers speak of the universality and of the world of believers. So says he that is the author of The Calling of the Gentiles: ‘The people of God’ (says he, bk. 1) ‘have their fulness?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606) | 4th Crimination, pp. 105-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

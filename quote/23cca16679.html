<main class="wrap"><figure class="quote" id="q-23cca16679" data-kw="">
<blockquote><p>Even as David also does expound the blessedness of that man, to whom the Lord imputes righteousness without works, saying: ‘Blessed are they whose iniquities are forgiven, and whose sins are covered’.” [Rom. 4:7] What could be more plainly spoken than this? For he does evidently expound justification by sanctification, and sanctification by remission of sins. Furthermore, what else is sanctification but the adoption whereby we are received into the grace and number of the sons of God? What is he therefore that sees not, that in this treatise of St. Paul justification is taken for adoption? especially, since in the very same fourth chapter to the Romans he goes about to prove that an inheritance is due to faith, whereunto also he does attribute justification. By all this it is made manifest that the question of justification contains nothing else but the manner and reason of sanctification; that is to say, whereby and how men have their sins forgiven, and are received into the grace and number of the sons of God, and, being justified, are made heirs of the kingdom of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades (Cambridge: Parker Society, 1849), vol. 1, 1st Decade, Sermon 6 | For in the fourth to the Romans [verse 7] the same apostle expounds justification by sanctification [beatificationem], and sanctification by the remission of sins. For in treating of faith, whereby we are justified, or which God imputes to us for righteousness without works, he says:</cite>, pp. 104-6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8328b45870" data-kw="Second justification">
<blockquote><p>There is no controversy between us and the sounder Schoolmen as to the beginning of justification. They admit that the sinner, freely delivered from condemnation, obtains justification, and that by forgiveness of sins; but under the term justification they comprehend the renovation by which the Spirit forms us anew to the obedience of the Law; and in describing the righteousness of the regenerate man, maintain that being once reconciled to God by means of Christ, he is afterwards deemed righteous by his good works, and is accepted in consideration of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.11</span></figcaption>

</figure><figure class="quote" id="q-24b7213a9e" data-kw="">
<blockquote><p>Ye have heard, dearly beloved, that true faith is the justification of the church or faithful of God; that it is, I say, the forgiveness of all sins, a receiving into the grace of God, a taking by adoption into the number of the sons of God, an assured and blessed sanctification [beatificationem],¹ and finally, the well-spring of all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades (Cambridge: Parker Society, 1849), vol. 1, 1st Decade, Sermon 6</cite>, p. 121</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-0ea9c90737" data-kw="">
<blockquote><p>There are four set periods of justification: First, in God’s purpose, which reaches as far as the eternal transactions between God and Christ, such as were set down in the Lamb’s book. Secondly, when Christ did in the name and stead of sinners perform that which was the matter of their justification, but in neither of these periods was the soul translated out of the state of nature into the state of grace. Thirdly, actually, at that moment when we come to own Christ as a Saviour by believing. Fourthly, when the Spirit which translates the soul out of the state of nature into the state of grace, makes it known to the soul. Others say there are five (as it were) periods or degrees of justification: 1. When the Lord passes a sentence of absolution on men at their first conversion, immediately upon their union with Christ, Acts 13:38-39. 2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ. 4. There follows a certification, a sentence passed in the soul concerning man’s estate, 1 Jn. 5:9; Rom. 8:33. 5. Justification is never perfected till the Day of Judgment, Acts 3:19, then sentence is passed in open court before men and angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, A.M., 1654), bk. 7, ch. 6. Of Justification</cite>, p. 515</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-c5cb3f9194" data-kw="">
<blockquote><p>Two things are seen in Christ which are necessary to our justification: the one is death; the other, resurrection from the dead, etc. [Rom. 4:25] It was fitting that by his death the sins of the world should be expiated, etc. while by his resurrection from the dead, it pleased the same goodness of God to grant the Holy Ghost, through whom the gospel might be believed, and the justice that was lost by the sin of the first Adam might be restored. The apostle has expressed both parts in these words, ‘Who was delivered on account of our sins, etc. [and was raised again for our justification]’ [Rom. 4:25] In his death therefore is found satisfaction for sin; in his resurrection the gift of the Holy Ghost, by which our justification to life is effected…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-borrhaus.html">Martin Borrhaus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in William Forbes, Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 4, pp. 157-59 Borrhaus (1499–1564) was a professor of philosophy and Old Testament at Basel in the reformed tradition. | On Gen. 15:4</cite>, pp. 161-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

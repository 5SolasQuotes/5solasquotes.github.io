<main class="wrap"><figure class="quote" id="q-f69f614611" data-kw="">
<blockquote><p>The Polish Reformer, John à Lasco stated in a book dedicated to King Sigismond of Poland that the English monarch, Edward VI, when granting permission for foreign Reformed churches within his realm, also desired the further reformation of the English Church:

When I was called by that king [Edward VI.] and when certain laws of the country stood in the way, so that the public rites of divine worship used under Popery could not immediately be purged out (which the king himself desired); and when I was earnest for the foreign churches, it was at length his pleasure, that the public rites of the English churches should be reformed by degrees, as far as could be got done by the laws of the country; but that strangers, who were not strictly bound to these laws in this matter, should have churches granted unto them, in which they should freely regulate all things wholly according to apostolical doctrine and practice, without any regard to the rites of the country; that by this means the English churches also might be excited to embrace the apostolical purity, by the unanimous consent of all the states of the kingdom.

Of this project, the king himself, from his great piety, was both the chief author and the defender. For, although it was almost universally acceptable to the king’s council, and the archbishop of Canterbury promoted it with all his might, there were not wanting some who took it ill, and would have opposed it, had not his majesty checked them by his authority and the reasons which he adduced for the design. …

The care of our church was committed to us chiefly with this view, that in the ministration thereof, we should follow the rule of the divine word and apostolical observance, rather than any rites of other churches. In fine, we were admonished both by the king himself, and his chief nobility, to use this great liberty granted to us in our ministry, rightly and faithfully, not to please men, but for the glory of God, by promoting the reformation of his worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-a-lasco.html">John à Lasco</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Ordinatione Ecclesiarum peregrinarum in Anglia</cite>, p. 649. Quoted in Thomas McCrie, The Life of John Knox: Containing Illustrations of the History of the Reformation in Scotland, ed. Andrew Crichton (London: Henry G. Bohn, 1854), p. 359.</span></figcaption>

<blockquote><p>By the diatactic [Teaching] power a Synod may institute, restore, or change, according to the condition and exigence of the Church, the external circumstances in the worship of God, and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion, it is fit that National Synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratorke power, but being always tied to follow the rules foresaid.</p></blockquote>

<blockquote><p>1. Liberty is that natural power which man has of his own person, whence a free man is said to be suae potestatis, ‘in his own power’, and it is defined in the law to be a natural faculty to do that which every man pleases, unless he be hindered by law or force. … 5. Though liberty be the most precious right, yet it is not absolute, but limited; First, by the Will of God, and our obediential obligations to Him, and to men by his ordinance; and so though man has power of his own person, yet has he no power of his own life, or his members, to dispose of them at his pleasure, either by taking away of his life or amputation, or hurting of any member by himself, or by giving power to any other so to do, unless it be necessary for preserving the whole, but he is naturally obliged to God to maintain his life: So likewise men may be restrained, or constrained by others, without encroachment upon the law of liberty, in the pursuance of other obediential obligations; as a husband has power to restrain his wife, from her liberty of going where she will, and may keep her within the bounds of conjugal society; so may parents restrain their children, and also constrain them to the performance of moral duties, and that without any engagement or law; we may also without any injury, restrain a furious person, or one who is inferring violence to himself, in his life or limbs, because this is not against any act of his lawful liberty, and is done as a duty in us of love and mercy: But in matters of utility and profit, where the natural liberty is not hemmed in with an obligation, there, unless by his own delinquence or consent, man cannot justly be restrained, much less constrained upon pretense of his utility or profit; for liberty, as far preferable to profit, and in the matter of utility, every man is left to his own choice, and cannot without injury to God and Man, be hindered to do what he pleases, or be compelled to do what he pleases not, in things wherein he is free, 6. Liberty may be diminished or taken away by our delinquence in the way of punishment, for seeing it is a right in our own power; as goods and debts may be forfaulted by our delinquence, so may our liberty, in whole or in part. 7. Thirdly, our engagements do commonly import a diminution of our personal liberty, but much more, of that natural liberty of things without us; whence it is that the law allows personal execution or restraint, and incarceration of the debitor’s person, until he do all the deeds that are in his power for the satisfaction of his Creditor. …

9. Fifthly, liberty is wholly taken off by bondage, slavery or servitude, which is diametrically opposite to liberty; for as liberty is that power by which men are sui juris [in his own power], so by servitude they became alieni juris, ‘in the power of another’…

10. Bondage was introduced by the law of nations, and it is among the positive laws of nations, settled by common consuetude [custom], and it took first place in these who were taken in war, who being under the power of their enemies’ sword, did lose their liberty in lieu [in place] of their life [instead of being killed]; such also were these who sold their liberty and gave it up, and were content to be perpetual slaves, as were the Jewish bondmen, whose ears were pierced with an aul [Ex. 21], as the solemnity of their perpetual and willing servitude, the offspring of servants remained in their servile condition…

11. Bondage, though contrair to the nature of liberty, yet it is lawful; liberty being a right alienable, and in our disposal, so that the natural law constitutes us free, but puts no necessity on us, so to continue; and therefore servitude is both approven in the Old Testament; and in the New, it is cleared against that obvious objection, that being made free by Christ, we should not become the servants of men, to which the Apostle answers, ‘Art thou called, being a servant (or slave)? continue so, for nevertheless thou art Christ’s freeman’ [1 Cor. 7]: But yet Christian lenity and mercy, has almost taken away bondage, except amongst the Spaniards, Portugals [who were Romanist] and other Christian nations bordering upon the Turks [Muslims], where, because the Turks do extremely exercise slavery, especially upon Christians, their neighbors do the like, that they may have slaves to exchange with slaves: little of slavery remains elsewhere among Christians, except the ascriptitii [naturalized foreigners], who are not absolutely slaves… but in Scotland there is no such thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland</cite>, ... (Edinburgh, 1681), Title 2, ‘Of Liberty’, p. 21</span></figcaption>

+of+his+utility+or+profit%3B+for+liberty%2C+as+far+preferable+to+profit%2C+and+in+the+matter+of+utility%2C+every+man+is+left+to+his+own+choice%2C+and+cannot+without+injury+to+God+and+Man%2C+be+hindered+to+do+what+he+pleases%2C+or+be+compelled+to+do+what+he+pleases+not%2C+in+things+wherein+he+is+free%2C+6.+Liberty+may+be+diminished+or+taken+away+by+our+delinquence+in+the+way+of+punishment%2C+for+seeing+it+is+a+right+in+our+own+power%3B+as+goods+and+debts+may+be+forfaulted+by+our+delinquence%2C+so+may+our+liberty%2C+in+whole+or+in+part.+7.+Thirdly%2C+our+engagements+do+commonly+import+a+diminution+of+our+personal+liberty%2C+but+much+more%2C+of+that+natural+liberty+of+things+without+us%3B+whence+it+is+that+the+law+allows+personal+execution+or+restraint%2C+and+incarceration+of+the+debitor%E2%80%99s+person%2C+until+he+do+all+the+deeds+that+are+in+his+power+for+the+satisfaction+of+his+Creditor.+%E2%80%A6%0A%0A9.+Fifthly%2C+liberty+is+wholly+taken+off+by+bondage%2C+slavery+or+servitude%2C+which+is+diametrically+opposite+to+liberty%3B+for+as+liberty+is+that+power+by+which+men+are+sui+juris+%5Bin+his+own+power%5D%2C+so+by+servitude+they+became+alieni+juris%2C+%E2%80%98in+the+power+of+another%E2%80%99%E2%80%A6%0A%0A10.+Bondage+was+introduced+by+the+law+of+nations%2C+and+it+is+among+the+positive+laws+of+nations%2C+settled+by+common+consuetude+%5Bcustom%5D%2C+and+it+took+first+place+in+these+who+were+taken+in+war%2C+who+being+under+the+power+of+their+enemies%E2%80%99+sword%2C+did+lose+their+liberty+in+lieu+%5Bin+place%5D+of+their+life+%5Binstead+of+being+killed%5D%3B+such+also+were+these+who+sold+their+liberty+and+gave+it+up%2C+and+were+content+to+be+perpetual+slaves%2C+as+were+the+Jewish+bondmen%2C+whose+ears+were+pierced+with+an+aul+%5BEx.+21%5D%2C+as+the+solemnity+of+their+perpetual+and+willing+servitude%2C+the+offspring+of+servants+remained+in+their+servile+condition%E2%80%A6%0A%0A11.+Bondage%2C+though+contrair+to+the+nature+of+liberty%2C+yet+it+is+lawful%3B+liberty+being+a+right+alienable%2C+and+in+our+disposal%2C+so+that+the+natural+law+constitutes+us+free%2C+but+puts+no+necessity+on+us%2C+so+to+continue%3B+and+therefore+servitude+is+both+approven+in+the+Old+Testament%3B+and+in+the+New%2C+it+is+cleared+against+that+obvious+objection%2C+that+being+made+free+by+Christ%2C+we+should+not+become+the+servants+of+men%2C+to+which+the+Apostle+answers%2C+%E2%80%98Art+thou+called%2C+being+a+servant+%28or+slave%29%3F+continue+so%2C+for+nevertheless+thou+art+Christ%E2%80%99s+freeman%E2%80%99+%5B1+Cor.+7%5D%3A+But+yet+Christian+lenity+and+mercy%2C+has+almost+taken+away+bondage%2C+except+amongst+the+Spaniards%2C+Portugals+%5Bwho+were+Romanist%5D+and+other+Christian+nations+bordering+upon+the+Turks+%5BMuslims%5D%2C+where%2C+because+the+Turks+do+extremely+exercise+slavery%2C+especially+upon+Christians%2C+their+neighbors+do+the+like%2C+that+they+may+have+slaves+to+exchange+with+slaves%3A+little+of+slavery+remains+elsewhere+among+Christians%2C+except+the+ascriptitii+%5Bnaturalized+foreigners%5D%2C+who+are+not+absolutely+slaves%E2%80%A6+but+in+Scotland+there+is+no+such+thing.%E2%80%9D%0A%0A%E2%80%94+James+Dalrymple%2C+The+Institutions+of+the+Law+of+Scotland%2C+...+%28Edinburgh%2C+1681%29%2C+Title+2%2C+%E2%80%98Of+Liberty%E2%80%99%2C+p.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ad5e62da7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ad5e62da7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/slavery/#:~:text=1.%20Liberty%20is%20that%20natural%20power,Scotland%20there%20is%20no%20such%20thing&amp;text=1.%20Liberty%20is%20that%20natural%20power%20which%20man&amp;text=but%20in%20Scotland%20there%20is%20no%20such%20thing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

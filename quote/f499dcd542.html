<main class="wrap"><figure class="quote" id="q-f499dcd542" data-kw="">
<blockquote><p>In the midst of the debates within the Free Church of Scotland surrounding a potential union with the United Presbyterians (Voluntaries), Horatius Bonar argued against any compromise of the Free Kirk’s position on church-state relations:

EDINBURGH FREE CHURCH PRESBYTERY.

THE UNION QUESTION. …

Dr [Horatius] BONAR brought forward the following overture, of which he had given notice:-

Whereas the prosecution of the negotiations for union on their present footing threatens to issue in the compromise of the distinctive principles of this Church, and is already producing most serious internal dissensions, it is humbly overtured by the Free Presbytery of Edinburgh to the ensuing General Assembly that said negotiations be discontinued, the Assembly at the same time recommending the cultivation of brotherly intercourse and co-operation in every work of faith and labour of love in which the negotiating Churches can consistently with their principles unite.

Dr Bonar, in supporting the overture, maintained that, while union among Presbyterian Churches was eminently desirable, it was absolutely-essential that the Free Church should maintain her distinctive principles. He held that the United Presbyterian Church had not made the slightest concession of their principles, while the Free Church had done so, and this it was which had led to the present crisis. He proceeded at great length to expound the distinctive principles of the Free Church, dwelling mainly upon the relation of the Church and the State.

He contended that the question of the relation of the Civil Magistrate to the Church had not been an open question in the past history of the Church; and that, if they were to found a new Church leaving that an open question, they would stand alone in the face of the Churches in Christendom – they would be proclaiming, not merely that they had altered their creed, but that the Churches of the Reformation were wrong. … He protested against the proposal to leave any of the distinctive principles of the Church as open questions, maintaining that, if such a proposal were carried out, the questions would be open, but the mouths of the members of the Church would be shut, and their hands would be tied. …

Dr Bonar concluded, amidst loud applause, by expressing his desire for conciliation with the members of other Churches, though he could not agree to any proposal for union on a footing which would involve any compromise of the distinctive principles of the Free Church. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-scotsman.html">The Scotsman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scotsman</cite>, 27 February 1868.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-32e0e41645" data-kw="">
<blockquote><p>The chief priest layeth two crimes to the charge of the apostles, for he accuseth them of contumacy or stubbornness, because they obeyed not the decree of the council. In the second member he betrayeth an evil conscience, or, at least, he showeth that he handled rather a private business than any public cause, for he complaineth that the apostles will cause the priests and the scribes to be hated for the death of Christ.

Behold, therefore, what that is which nettleth them, because they fear the revenge and punishment of wicked murder. He pretendeth, at the first, doctrine; but we may gather out of the end that he was not so careful for doctrine. In the mean season, he accuseth the apostles of sedition; for he taketh that for a thing which all men, for the most part, did grant, that Christ was put to death justly.

Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests. It was an heinous offence not to obey the chief priest; how much more heinous was it, then, to despise the whole order? But the chief priest doth not consider what is his duty towards God and the Church; he abuseth his authority tyrannously, as if the same were not under any laws, as the Pope dealeth with us at this day; for seeing that he taketh to himself an unbridled authority and government, he feareth not to condemn us for schismatics, so soon as he seeth us refuse his decrees; for he catcheth at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludeth that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ.

Now, forasmuch as he doth manifestly play the minister of Satan, he borroweth authority, without shame and colour, of the name of Christ; yea, the very form of speech which the chief priest useth doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the word of God, dare grant liberty to themselves to attempt whatsoever pleaseth them. With a commandment (saith he) have we commanded. Whence cometh such strait rigour, save only because they think that all that must be received without exception which they shall command?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 212-14.</span></figcaption>

</figure><figure class="quote" id="q-9e6ae97590" data-kw="">
<blockquote><p>Of the promises it is evident, that to lawful powers is given the sword for punishment of malefactors, for maintenance of innocents, and for the profit and utility of their subjects. Now let us consider, whether the reformation of religion fallen in decay, and punishment of false teachers, do pertain to the Civil Magistrate and Nobility of any realm. I am not ignorant that Satan of old time, for maintenance of his darkness, has obtained of the blind world two chief points: Former, he has persuaded to Princes, Rulers, and Magistrates, that the feeding of Christ’s flock appertains nothing to their charge, but that it is rejected [i.e., devolved] upon the bishops and estate ecclesiastical: and secondarily, that the reformation of religion, be it never so corrupt, and the punishment of such as be sworn soldiers in their kingdom, are exempted from all civil power [per Romanism, for the clergy], and are reserved to themselves and to their own cognition. But that no offender can justly be exempted from punishment, and that the ordering and reformation of religion, with the instruction of subjects, does especially pertain to the Civil Magistrate, shall God’s perfect ordinance, his plain Word, and the facts and examples of those that of God are highly praised, most evidently declare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Appellation, to the Nobility and Estates of Scotland</cite>, …’ (1558)</span></figcaption>

<blockquote><p>9th Assertion…. 1. As the object of that high [civil] office is merely and purely civil and positive, relating only to a civil end, of peace: as in importing or exporting of goods, of wool, wax, moneys for the good of the commonwealth, the crying up or crying down of the value of coined gold or silver, the making of laws merely civil; as not to carry armor in the night [which is threatening] in such a city: so in war, commanders, captains and colonels are magistrates to order the battle, lay stratagems… the parliaments’ power in disposing of fowling, fishing, hunting, eating of flesh, or not eating at such a time: all these, as the Word of God does not particularly warrant the one side more than the other, are merely civil and positive. It is sure the magistrate has a supremacy, and an independency above the Church or ministers of the Gospel in all these; and as these prescind [are detached] from all morality of the First and Second Table [in that they are not inherently moral or immoral of themselves]… In this consideration that learned and grave divine Dr. Andrew Rivet says well (in Decalog., ch. 5, p. 204) that as we believe a man well skilled in his own art, so that his judgement is a supreme rule; so the supreme authority of the magistrate to us in things positive is a rule; for indeed it cannot be denied but there be arcana imperis, secrets of State that are not to be communicated to pastors or to any, in which the [civil] rulers have a supremacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), pp. 558-59</span></figcaption>

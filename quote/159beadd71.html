<main class="wrap"><figure class="quote" id="q-159beadd71" data-kw="">
<blockquote><p>Is Christ altogether lovely; so lovely to us, and so beloved of God the Father? Let us then upon his obedience and righteousness; build upon it, that God cannot refuse that righteousness whose whole subject is altogether lovely. Let us come clothed in the garments of our Elder Brother, and then doubt not of acceptance; for it is in Christ that he loves us. In this well-beloved Son it is that God is well pleased with us. If we put on Christ’s righteousness, we put on God’s righteousness; and then how can God hate us? No more than he hates his own Son. Nay, he loves us, and that with the same love wherewith he loves him; for he loves whole Christ mystical, Head and members (John 17:23). Let this strengthen our faith, that if Christ be so altogether lovely in himself and to the Father, then we may comfortably come before the Father, clothed with the garments of him our Elder Brother, and so rest ourselves on the acceptation of his mediation, that is so beloved a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), p. 293.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-84000ed0ed" data-kw="">
<blockquote><p>Although the law as a rule of duty to believers requires perfect obedience from them, yet it admits of God’s accepting their sincere obedience performed in faith, though it is imperfect. It admits of His accepting this obedience not indeed as any part of their justifying righteousness, not as the foundation of His acceptance of their persons as righteous, but as the fruit and evidence of their being vitally united to His beloved Son as Jehovah their Righteousness, and of their being already accepted in Him (Eph. 1:6; Heb. 13:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 34–35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-4530eb6855" data-kw="">
<blockquote><p>In the law-court of God, then, the justification of man as sinner is the judgment of God whereby He pronounces righteous the person who is unholy and of himself a sinner subject to God’s wrath. He does so out of his own mere grace and mercy, for the sake of the perfect obedience and righteousness of Christ that was offered on our behalf and that is received by faith. That is, He pardons the sinner from sin and the curse, and imputes to him the righteousness of his Son and so awards to him life eternal, for the salvation of the believing person and the glory of the merciful and just God. Nearly every part of this definition is included by the apostle in Romans 3:24–26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacobus-arnoldi-ditsius.html">Jacobus Arnoldi Ditsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(1599–1662) in Synopsis of a Purer Theology: Latin Text and English Translation</cite>, 2.307</span></figcaption>

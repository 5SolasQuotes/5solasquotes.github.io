<main class="wrap"><figure class="quote" id="q-9259aeb632" data-kw="">
<blockquote><p>The second is theoretical assent (assensus), by which we receive as true and divine what we know. … The assent of faith indeed has firmness and certainty because founded upon the divine and infallible word; but not evidence because it is founded upon testimony, not reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06a25dc631" data-kw="">
<blockquote><p>Christian faith, therefore, is personal reliance upon Christ for salvation because of belief of God&#x27;s testimony as to our sinful and ruined condition, and as to what Christ has assuredly done to save us. It is based, therefore, upon the knowledge of this testimony as given by our own consciences and the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-petigru-boyce.html">James Petigru Boyce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abstract of Systematic Theology</cite>, ch. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>

</figure><figure class="quote" id="q-209fbb2df4" data-kw="">
<blockquote><p>To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span></div>

</figure><figure class="quote" id="q-c23310058e" data-kw="">
<blockquote><p>The next thing necessary is, that what the mind has imbibed be transferred into the heart. The word is not received in faith when it merely flutters in the brain, but when it has taken deep root in the heart, and become an invincible bulwark to withstand and repel all the assaults of temptation. But if the illumination of the Spirit is the true source of understanding in the intellect, much more manifest is his agency in the confirmation of the heart; inasmuch as there is more distrust in the heart than blindness in the mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.2.36</span></figcaption>

</figure><figure class="quote" id="q-c1abb94772" data-kw="">
<blockquote><p>To this knowledge must be joined assent, which is the second act of faith, whereby a person receives and acknowledges as truths, those things which he knows, &quot;receiving the testimony of God, and thus setting to his seal that God is true,&quot; John 3:33. This assent is principally founded on the infallible veracity of God, who testifies of himself and of his Son, 1 John 5:9, 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, 3.7.11</span></figcaption>

<main class="wrap"><figure class="quote" id="q-32347e0ecd" data-kw="">
<blockquote><p>Canon XIII: As Christ was elected from eternity the Head, the Leader and Lord of all who, in time, are saved by his grace, so also, in time, he was made Guarantor of the New Covenant only for those who, by the eternal election, were given to him as his own people, his seed and inheritance. For according to the determinate counsel of the Father and his own intention, he encountered dreadful death instead of the elect alone, and restored only these into the bosom of the Father’s grace, and these only he reconciled to God, the offended Father, and delivered from the curse of the law.

For our Jesus saves his people from their sins (Matt 1:21), who gave his life a ransom for many sheep (Matt 20:24, 28; John 10:15), his own, who hear his voice (John 10:27-28), and he intercedes for these only, as a divinely appointed Priest, arid not for the world (John 17:9). Accordingly in expiatory sacrifice, they are regarded as having died with him and as being justified from sin (2 Cor 5:12): and thus, with the counsel of the Father who gave to Christ none but the elect to be redeemed, and also with the working of the Holy Spirit, who sanctifies and seals unto a living hope of eternal life none but the elect. The will of Christ who died so agrees and amicably conspires in perfect harmony, that the sphere of the Father’s election, the Son’s redemption. And the Spirit’s sanctification are one and the same.

Canon XIV: This very thing further appears in this also, that Christ provided the means of salvation for those in whose place he died, especially the regenerating Spirit and the heavenly gift of faith, as well as salvation itself, and actually confers these upon, them. For the Scriptures testify that Christ, the Lord, came to say, the lost sheep of the house of Israel (Matt 15:24), and sends the, same Holy Spirit, the source of regeneration, as his own (John 16:7 8): that among the better promises of the New Covenant of which he was made Mediator and Guarantor this one is pre-eminent, that he will inscribe his law, the law of faith, in the hearts of his people (Heb 8:10); that whatsoever the Father has given to Christ will come to him, by faith, surely; and finally, that we are chosen in Christ to be his children, holy and blameless (Eph. 1:4-5); but our being God’s holy children proceeds only from faith and the Spirit of regeneration. …

Canon XVI: Since all these things are entirely so, we can hardly approve the opposite doctrine of those who affirm that of his own intention and counsel and that of the Father who sent him, Christ died for each and every one upon the condition, that they believe. [We also cannot affirm the teaching] that he obtained for all a salvation, which, nevertheless, is not applied to all, and by his death merited a salvation and faith for no one individually but only removed the obstacle of divine justice, and acquired for the Father the liberty of entering into a new covenant of grace with all men. Finally, they so separate the active and passive righteousness of Christ, as to assert that he claims his active righteousness as his own, but gives and imputes only his passive righteousness to the elect. All these opinions, and all that are like these, are contrary to the plain Scriptures and the glory of Christ, who is Author and Finisher of our faith and salvation; they make his cross of none effect, and under the appearance of exalting his merit, they, in reality diminish it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-james-t-dennison.html">James T. Dennison Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th and 17th Centuries in English Translation</cite>, (Grand Rapids MI: Reformation Heritage Books, 2014), 4: 524-25.</span></figcaption>

</figure><figure class="quote" id="q-b5af0f9625" data-kw="">
<blockquote><p>It is true that Calvin has intimated more than once his con- viction, that the position laid down by some of the schoolmen, viz. that Christ died ” sufficienter pro omnibus, efficaciter pro electis,” is sound and orthodox in some sense. But then he has never, so far as we remember or have seen proved, explained precisely in what sense he held it, and there is a sense in which the advocates of particular redemption can consistently admit and adopt it.† † When the subject of the extent of the atonement came to be more fully and exactly discussed, orthodox Calvinists generally objected to adopt this scholastic position, on the ground that it seemed to imply an ascription to Christ of a, purpose or intention of dying in some sense for all men. For this reason they usually declined to adopt it as it stood, or they proposed to alter it into this form, — Christ’s death was sufficient for all, efficacious for the elect. By this change in the position, the question was made to turn, not on what Christ did, but on what His death was; and thus the appearance of ascribing to Him personally a purpose or intention of dying, in some sense, for all men, was removed.</p></blockquote>

<blockquote><p>It was also required that our Mediator should be both God and man. God, that he might have free access to the Father; man, that we might have access to him. God, in order to know all the secret things of the Father that were to be revealed; man, that he might declare them to us: God, that he might sanctify us by his Spirit; man, that he might shew us the way to heaven by his example: God, that he might satisfy divine justice, and overcome sin, death, and the devil; man, that he might offer himself as a sacrifice: God, that he might stamp the highest value on his sufferings; man, that he might be capable of suffering.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-039d0d1ff8" data-kw="">
<blockquote><p>But all Church-power and authority is bounded by the Word of God, and is for edification only; And therefore all the subjection that is due thereunto, is in the Lord only; and when we are thus subject, the power and authority is sufficiently acknowledged and preserved. But, say our [Resolutioner] Brethren, without this [absolute, necessary, passive] submission [to erroneous Church decisions] which they plead for, our established judicatories would be nothing but consultative meetings. But this we also deny, because what is resolved and determined by Kirk-judicatories in a right way, does not only bind by virtue of the intrinsic lawfulness thereof, it being for matter God’s Word, and by virtue of the reverence that is due to the gifts and endowments of brethren and friends counselling right things, which is all that can be attributed to a consultative meeting, but also by virtue of a positive law of God, by which He has commanded us to hear the Church, and those that sit in Moses’ chair, and to be subject in the Lord to Church-Governors, to whom He has given a ministerial and official authority and power to assemble in His Name in the respective courts appointed by Himself for governing His House according to the rule of His Word; And therefore as they have authority or a superiority of jurisdiction, which no consultative meeting has; So whosoever resists their power, when put forth to edification, and not to destruction, does not only sin by despising that Word of God which is the matter of their decree, and by despising the gifts and graces of their brethren that are exercised in holding forth light unto them, but does also sin by resisting the ordinance of God: a Kirk-judicatory modeled according to the pattern showed in the mount, and clothed with authority from Jesus Christ, and proceeding according to the Law and to the Testimony, to which they ought to be subject, God having commanded us so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (1658)</cite>, pp. 46-47</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef0d9d52f8" data-kw="">
<blockquote><p>We acknowledge not what Navarrus and Gregory say, that excommunication, whether just or unjust, is to be feared, for the curse causlessly does not fall. The sentence is either given out: [1.] a jure, vel ab homine, by the Law, or the persons. Secondly, it is either just or unjust. Thirdly, and that three ways: exanimo, [out of] good or ill zeal; secondly, ex causa, [out of] a just or unjust cause; thirdly, ex ordine [out of order], when order of law is kept. An unjust sentence is either valid or null. That which is invalid is either invalid through defect of the good mind of the excommunicators, and this is not essential to the excommunication’s validity. That which is invalid this way only, ligat, ‘it binds’ in foro exteriore [in the external court]. But that which is unjust through want [lack] of a just cause, it only binds from external communion; but because God’s ordinances are to be measured from their own nature, and the general intention of the catholic Church, and not from abuses and particular intentions of such excommunicators: therefore they do not exclude from the general Church-desires. The fourth Council of Carthage, as also Gerson says, an unjust sentence neminem gravare debet, ‘should affright no man’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1, ‘Of the Addition of Members to the Church’</cite>, pp. 279-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

t-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=We%20acknowledge%20not%20what%20Navarrus%20and,gravare%20debet%2C%20%E2%80%98should%20affright%20no%20man&amp;text=We%20acknowledge%20not%20what%20Navarrus%20and%20Gregory%20say&amp;text=sentence%20neminem%20gravare%20debet%2C%20%E2%80%98should%20affright%20no%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-525562fed7" data-kw="">
<blockquote><p>Question 2. Is A Magistrate Held Responsible To Render Account Of All His Laws To His Subjects? And How Far Are They To Presume Such Laws To Be Just? After this foundation has been laid we would also inquire into certain other questions which would appear to be germane to this discourse that the consciences of many may be satisfied. First the question is raised whether the magistrate is held to render account of all his laws to any man soever so as to offer proof that they be fair and in accordance with the precepts of religion. I answer that he is not so held; nay more, that it is fair that all virtuous subjects should regard their lords in the light of virtue and should not presume of suspect anything unjust concerning them; nay, that it is not becoming that men in private station should inquire over curiously even concerning doubtful matters beyond their comprehension or station in life. If, however, the conscience of some be at a loss, they can and are even under an obligation to examine (albeit discreetly and in a peaceful manner) what elements of reason and justice are to be found in the command by which they are bidden or forbidden to do something; for the word of the apostle abides: “whatsoever is not of faith (that is while the conscience is in doubt whether that is being done justly or not) is sin”. But if what is commanded is openly sinful or unjust, then indeed that which has been said above applies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers Over Their Subjects &amp; the Duty Of Subjects Towards Their Rulers (1574)</cite></span></figcaption>

25562fed7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-the-mere-will-determination-judgment-or-saying-so-of-authorities-is-in-insufficient-ground-of-faith-obedience-that-authorities-are-never-to-act-or-require-something-without-a-naturally-mo/#:~:text=Question%202.%20Is%20A%20Magistrate%20Held,which%20has%20been%20said%20above%20applies&amp;text=Question%202.%20Is%20A%20Magistrate%20Held%20Responsible%20To&amp;text=indeed%20that%20which%20has%20been%20said%20above%20applies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-67509949cf" data-kw="Councils under Scripture">
<blockquote><p>The weightiest controversies have been determined and settled in councils, but not by the absolute authority of the council itself, but by the judgment and authority of scripture in the council. Pious bishops never assembled to define a point themselves by their own authority, but by that of scripture. Therefore all religious councils have ascribed the supreme decision to the scriptures. … Since, then, councils, whenever they are good and pious, follow the scriptures, it is manifest that the supreme authority of judging belongs to the scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 6</span></figcaption>

<blockquote><p>…it were much more tolerable if men would plead for the necessity of the things which it seems good unto them to command, and on that ground to command their observance, than granting them [to be] not necessary in themselves, to make them necessary to be observed merely by virtue of their commands, for reasons which they say satisfy themselves but come short of giving satisfaction to them from whom obedience is required. For whereas the will of man can be no way influenced unto obedience, but by mere acknowledged sovereignty, or conviction of reason in and from the things themselves, commands in about things wherein they own not that the commanders have an absolute sovereignty (as God has in all things, the civil, supreme magistrate in things civil that are good and lawful), nor can they find the reasons of the things, themselves cogent, are a yoke which God has not designed the sons of men to bear.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…it were much more tolerable if men would plead for the necessity of the things which it seems good unto them to command, and on that ground to command their observance, than granting them [to be] not necessary in themselves, to make them necessary to be observed merely by virtue of their commands, for reasons which they say satisfy themselves but come short of giving satisfaction to them from whom obedience is required. For whereas the will of man can be no way influenced unto obedience, but by mere acknowledged sovereignty, or conviction of reason in and from the things themselves, commands in about things wherein they own not that the commanders have an absolute sovereignty (as God has in all things, the civil, supreme magistrate in things civil that are good and lawful), nor can they find the reasons of the things, themselves cogent, are a yoke which God has not designed the sons of men to bear.”

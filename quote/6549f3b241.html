<main class="wrap"><figure class="quote" id="q-6549f3b241" data-kw="">
<blockquote><p>There is now no national membership in the Church of Christ, limited to one hereditary family or favored race; but in the fellowship of one faith and one spirit, all, of whatever tribe or tongue or nation, are one with Christ, and one with each other. The narrow barriers of former economy have been thrown down; and in the gift of the Spirit to all believers, and in the fellowship of the Spirit coextensive with all, there is laid the foundation of a Church, no longer confined to one nation as before under the law, but worldwide and universal… Earthly and outward causes of separation are overborne and controlled by this higher principle of unity. Separation in race or tongue is no separation to be accounted of among the followers of Christ, who are joined together in that one Spirit. Distance on the earth is no distance to be regarded between those who are partakers together of the same Holy Ghost. Local churches or societies, divided in place and outward worship, become merged in the oneness of a higher fellowship. Separated in the outward act of worship, they are joined in the communion of the same Spirit. The assemblies of Christians in every quarter of the globe, who worship God in sincerity and truth, are one in such a sense as their distance from one another admits of; and they must all be regarded as branches of the universal Church of Christ throughout the world, the great community of believers, separated by distance and kindred and tongue, who cannot meet together in the body, but who really meet together in the Spirit. The invisible Church of Christ on earth is local, but it is also catholic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ... (Edinburgh: T&amp;T Clark, 1868), vol. 1, pt. 1, ‘Nature of the Church’, ch. 4, ‘The Church in its Twofold Character as Catholic &amp; Local’</cite>, pp. 43-44</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-761439a811" data-kw="">
<blockquote><p>Also this word ‘communion’ is very evident and comfortable. For first, the meaning thereof is, that betwixt God and us there is a communion, that is, a fellowship and participation, and so, consequently, a parting betwixt us of all good and heavenly things. And then also we understand, that we are fellows and partakers with all the saints that are living either in heaven or on earth: for we are members of them under one head, Christ. For the apostle John says: “That which we have seen and heard we declare unto you, that ye also may have fellowship with us, and that your fellowship may be with the Father, and his Son Jesus Christ… …What can be more delightful to our ears than to hear that all the saints, as well in heaven as in earth, are our brethren, and that we again are members, partners, and fellows with them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-ebc8cf72cc" data-kw="">
<blockquote><p>They sympathize with the condition of all distressed saints, wherever they are, and thereby hold communion with all saints in the world, all Churches of Christ throughout the universe. And from this compassion and love it is, that they feel an ineffable pleasure and satisfaction in their souls whenever they understand and hear of, or behold the success of the family of God, the prosperity of his people, and the spreading of his kingdom in the world. … Those that hold communion with God and his Son Jesus Christ… do necessarily maintain a Communion and Society with those that are the children of God, and the members of Jesus Christ… …When Peter was cast into prison, ‘Prayer was made without ceasing of the Church unto God for him,’ Acts 12:5. There is a continual stock of prayers, a common bank, whereby a constant traffic and exchange is kept up among the saints. This is called by the apostle, ‘supplication for all saints,’ Eph. 6:18, whereby they are ever partaking of the benefit of the petitions and addresses that are put up to the Divine Majesty throughout the whole world. And accordingly the fellowship of all Christians dispersed over the whole earth is preserved.</p></blockquote>

<blockquote><p>…the love we feel for Christ our head should flow forth to all our fellow-members of his holy body; and his love to us make them dear to us for his sake… We should delight to meditate on the many members of Christ’s elect body with whom we are joined, though they are scattered throughout the world. Our hearts should make voyages and journeys of discovery after them; and, remembering that they may be in affliction, and must be in temptation, we should pray for them and delight to hold them in the embraces of our faith. Is it not a most pleasant thought, that, from whatever spot on earth a Christian prays, his prayers go up to the one heart of Christ, and there meet with our prayers and the prayers of all other Christians; and so when blessings for each of us are sent, they all flow out from the same fountain of infinite love!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geroge-w-bethune.html">Geroge W. Bethune</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Lectures on the Heidelberg Catechism (NY, 1864/1866), vol. 2</cite>, p. 74</span></figcaption>

</figure><figure class="quote" id="q-e6de303444" data-kw="">
<blockquote><p>For hence we may reason thus: I am indeed a member of the catholic Church of God, and therefore though my own prayers be weak, yet my comfort is this, I know that I am partaker of all the good prayers of all the people of God dispersed over the face of the whole earth, my fellow members, and of all the blessings which God bestows on them. This will make us in all our troubles to say with Elisha, ‘Fear not, for they that be with us are more than they that be with them.’… And surely though there were no other reason, yet this were sufficient to move a man to embrace Christian religion, considering that being a member of the Church he has part in all the prayers of the saints through the world, and of the blessings of God that come thereby… The communion of the living with the dead stands in two things: the one is, that the saints departed in the Church Triumphant do in general pray for the Church Militant upon earth, desiring the final deliverance of all their fellow members from all their miseries. And therefore in the Apocalypse they cry on this manner, ‘How long Lord holy and true! doest not Thou judge and avenge our blood on them that dwell on the earth. (Rev. 6:10) I say in general, because they pray not for the particular conditions and persons of men upon earth, considering they neither know, nor see, nor hear us: neither can they tell what things are done upon earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles… (London, 1595)</cite>, pp. 511-12</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For hence we may reason thus: I am indeed a member of the catholic Church of God, and therefore though my own prayers be weak, yet my comfort is this, I know that I am partaker of all the good prayers of all the people of God dispersed over the face of the whole earth, my fellow members, and of all the blessings which God bestows on them. This will make us in all our troubles to say with Elisha, ‘Fear not, for they that be with us are more than they that be with them.’… And surely though there were no other reason, yet this were sufficient to move a man to embrace Christian religion, considering that being a member of the Church he has part in all the prayers of the saints through the world, and of the blessings of God that come thereby… The communion of the living with the dead stands in two things: the one is, that the saints departed in the Church Triumphant do in general pray for the Church Militant upon earth, desiring the final deliverance of all their fellow members from all their miseries. And therefore in the Apocalypse they cry on this manner, ‘How long Lord holy and true! doest not Thou judge and avenge our blood on them that dwell on the earth. (Rev. 6:10) I say in general, because they pray not for the particular conditions and persons of men upon earth, considering they neither know, nor see, nor hear us: neither can they tell what things are done upon earth.”

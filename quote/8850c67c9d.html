<main class="wrap"><figure class="quote" id="q-8850c67c9d" data-kw="">
<blockquote><p>As Calvin and the church in Geneva sang the Apostle’s Creed and yet did not sing man-made hymns (multitudes of which were current in that era, being widely sung by the Lutherans), it is evident that they considered the Creed to be a different element of worship than singing praise to God. Calvin was very familiar, as his writings show, with creeds and the nature of them. Calvin in Geneva evidently thought that it was permissible to sing one’s confession of their faith before God in public worship and yet not to sing man-made praise to God (the two being different). This distinction is confirmed to have been well understood in that general era in that the Synod of Dort (1618), while approving of singing the Creed for the Dutch Church (whose worship practice was very similar to that of Geneva’s), yet condemned singing man-made hymns:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvin &amp; the Origin of Reformed Psalmody’ in Songs of Zion</cite>, pp. 179-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10c07668ac" data-kw="">
<blockquote><p>47. Yet because the lifting up of the heart to God is together required, Simul &amp; consequenter, and going along with the thing that is sung, and it is also the end of that meditation; therefore we are said to sing in our heart to the Lord, Col. 3:16, and psalms that are sung have the consideration of prayers.

48. But because this religious melody hath the respect of prayers, therefore it is not so fit that the Decalogue, and other such like, which do not partake the nature of prayer, be turned into meter and be sung instead of psalms. … 53. But in the melody of singing, because it tendeth to our mutual edification, attention, and stirring up of pious affections among us one toward another, Col. 3:16, therefore all do join their voices together, 1. Chron. 16:35; Mk. 14:26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, (London: 1642), Book 2, ch. 9, ‘Of Prayer’, p. 284</span></figcaption>

</figure><figure class="quote" id="q-36b994a00c" data-kw="">
<blockquote><p>These thanksgivings [the NT ‘evangelical hymns’, or Bible songs, such as the song of Mary, Simeon, etc.] were made by occasion of certain particular benefits, and are no more to be used for ordinary Prayers than the Ave Maria [Hail Mary, used by Papists]. So that both for this cause, and the other before alledged of the Psalms, it is not convenient to make ordinary Prayers of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Polity</cite>, As quoted in Richard Hooker, Book 5 (1597), section 40 in Works (London, 1676). Hooker gives as the reference: Cartwright, Book 3, p. 208., p. 241, margin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-cf8c0a17d5" data-kw="">
<blockquote><p>The heart is the thing He chiefly calls for, expects, and eyes in all our performances… When we pray unto Him, praise Him, sing Psalms (2 Chron. 7:14; Isa. 26:9; Ps. 9:1; Col. 3:16; 1 Chron. 30:19), let’s do it with the heart. When we read or hear his Word, receive the Sacrament, or celebrate any other ordinance; let’s do it with the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wilson.html">John Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cultus Evangelicus</cite>, (London, 1667), pp. 78-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-b579acfb7d" data-kw="">
<blockquote><p>‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects according to the matter of each Psalm</cite>, (London, 1647) ‘The Preface’, no page number. Taylor (1613–1667) was a conformed cleric in the Church of England who advocated for very liturgical worship. The Preface is very good, at length, with regard to the psalms. Some of the references to ‘hymns’ refer to the psalms themselves. Taylor held to predominant psalmody.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

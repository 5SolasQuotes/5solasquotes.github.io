<main class="wrap"><figure class="quote" id="q-e850c375ba" data-kw="">
<blockquote><p>I. It belongs to the duty of the supreme magistrate, the governor or shepherd of the people, in any nation, being acquainted with the mind of God, to take care that the truth of the gospel be preached to all the people of that nation, according to the way appointed, either ordinary or extraordinary.

I make no doubt but God will quickly reject them from their power who, knowing their Master’s will, are negligent herein.

[2.] As he is to declare it, so he is to protect it from all violence whatever. Jesus Christ is the great king of nations, as well as the holy king of saints. His gospel hath a right to be preached in every nation, and to every creature under heaven. Whoever forbids or hinders the free passage of it, is not only sinful and impious towards God, but also injurious towards men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Toleration; and the Duty of the Magistrate about Religion in William H. Goold (ed.), The Works of John Owen</cite></span></figcaption>

<blockquote><p>Love means protecting the defenseless. God teaches that life is his gift. He commands us to preserve not only our own lives but also the lives of others, and he has appointed government authorities in part for this purpose by means of just defense (e.g., Prov. 24:11). As I pointed out in my article, military forces established by God’s appointed authorities are legitimate. Nowhere in Scripture does God command soldiers who are Christians to give up being soldiers. Yet, the issue you raise seems to be related more to the question of Christians serving in the military, since Christians are called to love their enemies. First, as I pointed out in the article, nowhere in Scripture does God command soldiers who are Christians to give up being soldiers—in fact, on a few occasions our Lord commends them. If serving in the military is antithetical to being a Christian, surely Christ Jesus would not have commended them. But how can the two be reconciled? How can loving one’s enemies be reconciled with being a soldier with the mission to kill an enemy? It is loving to protect and defend the defenseless, and it is also loving to protect a wicked person from killing others. As far as the command to love one’s enemies, it would be unloving to show favor toward an evil enemy against the defenseless by failing to protect those who do not have the means to protect themselves. Love also means coming to the aid of others. In other words, under the rule to love one’s enemies, would it be loving to permit an enemy to murder a defenseless person? It would not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“How Do Christians In the Military Love Their Enemies and Do Good To Them?” Beautiful Christian Life</cite>, (May 18, 2021)</span></figcaption>

</figure><figure class="quote" id="q-8d10411dfb" data-kw="">
<blockquote><p>The greatest without comparison, and most admirable work which the hand of God hath brought to pass upon earth in these later Ages, is, the Reformation of Religion from Antichristian pollution and tyranny: No other could have been expected from the Prince of Darkness, but extreme opposition to this so high a prejudice to his Kingdom: Incredible is the help which this unclean spirit hath made to Antichrist his chief servant, for the upholding of his tottering Throne. How many Princes and States hath he stirred up to persecute with Fire and Sword, to the cruellest deaths, the innocent Witnesses of the Truth? How many learned Divines hath he bewitched with his Enchantments, to spend their spirits and time in maintaining by Word and Writings the grossest abominations of that Romish Idol?

But the chief Artifice whereby this crafty Serpent hath most impeded the progress of the Gospel, and kept the Triple-Crown upon the Pope’s head, is his powerful working in the midst of the Children of Light: So cunningly hath he insinuated himself into the counsels and actions not only of the Children of this world, but of the Sons of Sion themselves, that by their hands, more then any other, he hath laid in the way of Christ’s running Chariot scandals insuperable, impediments irremovable, by any human might, till the Lord from heaven put them out of the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>

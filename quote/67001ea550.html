<blockquote><p>We respond: it is further asked whether it be of a Scriptural or ecclesiastical use, or an ancient or new use.” 5 conclusions are given. 2nd Problem, ‘Whether the Old Testament Church from Moses to Ezra began to use and maintained liturgies?’, p. 361 3rd Problem, ‘Whether a liturgy from Ezra and the men of the great Synagogue (that consistory or Sanheidren, as it is termed in the Hebrew, beit deenu) was established, having been prescribed to the people of God, and was publicly used till Christ?’, p. 363 3 conclusions are given on p. 364. 4th Problem, ‘Whether forms &amp; litugies were established in the apostolic Church from the apostles to that Church, such that they have been prescribed to all succeeding churches?’, p. 364 3 conclusions. 5th Problem, ‘Whether a universal liturgy ought to be formed and written, and imposed on all the Churches throughout the whole globe?’, p. 365 3 reasons are given. 6th Problem, ‘Whether one provincial or national liturgy ought to be established, and introduced into all of its consociating churches?’, p. 367 4 conclusions. 7th Problem, ‘Whether liturgies in the national language, whatever is commonly used to write, ought to be taken up in the churches?’, p. 368 8th Problem, ‘Whether a liturgy in Churches already settled, from their first gathering or its introduction at the Reformation, may be changed?, p. 369 1 conclusion. 9th Problem, ‘What is the Gregorian or Roman service (named after Gregory VII) and what is the Mozarabic, or Gothic, and in what place were they used, or are used in the Roman Church?’, p. 370 [No 10th Problem] 11th Problem, ‘How far it is better for a populace having been accustomed to the Roman liturgies and rites from the Papacy to the Reformation, to carry them over, if they had been so engaged initially by the reformers, having purged and yet retained the Missal, Breviary and other liturgical books and rites?’, pp. 372-4 ch. 3, ‘Of Rituals or Ecclesiastical Ceremonies’, pp. 374-384 This chapter is on the general introductory principles of the nature and properties of ceremonies, including (1) their name, (2) their nature and definition, (3) division and (4) opposites. Under (1) Voet also briefly discusses adiaphora on p. 375. Under (2) Voet gives numerous principles and distinctions as to worship (and its kinds) in general (p. 375) before delineating distinctions about ceremonies in general (p. 376). p. 375, Voet distinguishes the following distinctions about worship: It is either natural or instituted. Natural is internal; instituted may be both internal and external. External is either alone or social, or private or public. Public worship is performed by the Church. p. 376, Ceremonies are either divine or human. Divine ceremonies have been immediately instituted by God; therefore their observance is necessary. Divine ceremonies are either political or ecclesiastical. Political are either general and perpetual, observance of natural decorum, or particular, as ceremonies of the judicial law of Moses. Ecclesiastical are sacred, mystical and religious, either of the Old Testament (before or after Moses) or of the New Testament. A human ceremony “which is observed in the practice of men, is called free. It is either civil or ecclesiastical. Civil is some external formality or a mode to be done between men, practiced by law or custom. These things are twofold: Either by a natural reason or necessity supporting, and therefore contributing to the essence or well being of something, such as a natural decorum or many aspects in the instruction of civil manners; or they are received by men as merely arbitrary and instituted. And such free ceremonies are either well-grounded or tolerated, or will be hissed at as vain, inept and rediculous as they may be seen openly in courts, halls, schools, barracks, colleges…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 2, ‘Some Questions on Liturgies &amp; Liturgical Actions Determined’, pp. 360-374 “We come now to the problems, which are either of sacred [Scriptural] history and are didactic, or of Church history.” | 1st Problem, ‘Whether ‘liturgy’ may designate a sacrifice properly so-called, it even being propitiating, or be a rule or order to be accomplished as like a sacrifice?’, p. 360</span></figcaption>

<blockquote><p>Whether both the symbols of bread and wine are to be administered? It is affirmed. Whether usual and truly ordinary bread [is to be used]? It is affirmed. … What in place of wine ought to be administered where wine may not be had? What is analogous. Of what kind [is to be administered to] those that abstain from the supper? The same [as the previous answer]. Whether water ought to be mixed with the wine? It is denied.</p></blockquote>

<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.”

— Robert MacWard, The True Non-Conformist… (1671), 3rd Dialogue, pp. 117-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6you+%5BGilbert+Burnet%5D+boldly+attempt+to+make+even+the+very+sacraments+arbitrary+by+asking+why+we+use+not+washing+of+feet%2C+since+there+is+no+sacrament+set+down+more+punctually+in+Scripture%3F+And+when+your+non-conformist+%5Bin+your+book%5D+retorts+that+you+are+under+the+same+obligation+%28which+retortion+may+be+pertinently+made+to+most+of+your+objections%29%2C+you+tell+him+that+you+have+a+clear+answer%2C+that+in+these+externals+God+intended+no+perpetual+obligation%2C+and+therefore+in+them+you+follow+the+practice+of+the+catholic+Church%E2%80%A6+As+for+this+your+lax+acceptation+of+a+professed+indifferency+in+externals%2C+what+part+of+the+Christian+religion+or+worship+may+it+not+corrupt+or+subvert%3F+And+seing+it+does+tolerate+and+allow+the+not+practising+of+the+washing+of+feet+to+you%2C+as+well+founded+In+Scripture+as+either+of+the+sacraments%2C+would+it+not+in+a+just+parity+of+reason+dispense+with+and+forego+these+also%3F+This+is+indeed+doctrine+so+damnable%2C+that+I+hope+it+shall+never+need+an+antidote%3B+and+therefore+I+return+to+examine+your+third+or+eight+sacrament+%28I+know+not+which%2C+for+all+are+but+external%29+of+washing+of+feet.+And+you+say+that+it+has+in+Scripture+of+element%2C+water%2C+the+action%2C+washing+the+feet%2C+the+institution%2C+%E2%80%98as+I+have+done+so+do+ye%E2%80%99+and+%E2%80%98ye+ought+to+wash+one+another%E2%80%99s+feet%E2%80%99%2C+and+the+spiritual+use+of+it%2C+humility%3A+Whence+you+conclude%3A+%E2%80%98Why+do+ye+not+therefore+use+this+rite%3F%E2%80%99+To+which+last+point%2C+it+is%2C+that+waving+any+further+discourse+about+the+nature+and+requisites+of+a+sacrament%2C+whereof%2C+notwithstanding+your+parrallel+description+of+this+washing%2C+yet+I+perceive+you+are+loathe+to+apply+the+name%2C+I+shall+direct+my+answere%2C+viz.%3A+That+this+washing+is+not+to+be+used%2C+because+though+our+Lord+did+practice+this+lowly+act+of+condescendence+as+eminently+expressive+of+that+humility+whereunto+He+would+have+his+disciples+instructed%2C+yet+neither+is+it+in+itself+of+the+nature+of+a+sacramental+sign%2C+whereof+all+the+significancie+is+from+the+institution%2C+and+virtue+in+the+exhibition+of+the+thing+signified%2C+which+you+cunningly+omit+to+mention%3B+Nor+does+Christ+perform+it+by+way+of+institution%2C+for+repetition%2C+but+by+way+of+example%2C+for+imitation%2C+as+is+manifest+from+the+text%2C+John+13%3A4%2C+etc.+where+we+find+that+our+Lord+does+first+wash+his+disciples%E2%80%99+feet+before+He+told+them+what+He+was+a+doing%3B+and+then+having+done+the+act%2C+not+simply+significant+by+his+appointment%2C+but+of+itself+as+the+effect+expressing+the+greatest+humility+as+its+cause%2C+He+teaches+them+not+a+%5B%E2%80%A6%5Do+%5B%E2%80%A6%5Demne+reiteration%2C+but+the+use+in+these+words%2C+%E2%80%98If+I+your+Lord+and+Master+have+washed+your+feet%2C+ye+also+ought+to+wash+on+another%E2%80%99s+feet%E2%80%99%3A+%E2%80%98If+I+have+been+among+you+as+He+that+serves%2C+so+ought+ye+to+serve+one+another%2C+for+I+have+given+you+an+example+that+ye+should+do+as+I+have+done+to+you.%E2%80%99+I+have+not+showed+you+humility+in+a+figure+to+be+repeated+for+your+remembrance%2C+but+by+a+solid+practice+taught+you+the+like+performance%3A+so+that+to+turn+this+pattern+unto+a+rite+is+in+effect+as+far+from+our+Lord%E2%80%99s+purpose+as+the+instruction+of+plain+examples+is+preferable+to+that+of+mystic+representations%3A+Which+exposition+is+so+true+and+sound%2C+that+as+this+fancy+of+yours+was+never+owned+by+the+Church+of+Christ%2C+so%2C+it+is+most+certain%2C+that+where+it+has+been+followed+%28I+mean+by+the+Pope%29+and+this+action+has+been+used+as+a+rite%2C+it+has+only+been+made+a+color+to+the+most+prodigious+and+superlative+pride+that+ever+the+sun+beheld%3A+and+thus+I+hope+all+men+may+see+that+the+not+using+of+this+washing%2C+never+again+used+for+anything+we+read%2C+by+way+of+sacrament+or+ceremony%2C+either+by+our+Lord+or+his+apostles+and+Churches%2C+is+neither+a+deformity+in+us+from+the+Scripture%2C+nor+an+argument+for+your+irreligious+laxness+in+things+you+call+externals.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+The+True+Non-Conformist%E2%80%A6+%281671%29%2C+3rd+Dialogue%2C+pp.+117-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd99a1c389.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd99a1c389.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=you%20%5BGilbert%20Burnet%5D%20boldly%20attempt%20to,laxness%20in%20things%20you%20call%20externals&amp;text=you%20%5BGilbert%20Burnet%5D%20boldly%20attempt%20to%20make%20even&amp;text=your%20irreligious%20laxness%20in%20things%20you%20call%20externals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-729868d934" data-kw="">
<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>

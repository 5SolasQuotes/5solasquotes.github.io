<main class="wrap"><figure class="quote" id="q-8b80c52ba5" data-kw="">
<blockquote><p>Doctrine Two. We may consider Christ’s sufferings and death in the fruits of it, either as they respect common favors, and mercies, common gifts, and means of grace, which are not peculiar and saving, but common to believers with others, being bestowed upon professors in the visible Church; or as they are peculiar and saving, such as faith, justification, adoption, etc. Now when we say that Christ’s sufferings and death are a price for the sins of his people, we exclude not the reprobate simply from temporal and common favors and mercies that come by his death; they may have, and actually have, common gifts and works of the Spirit, the means of grace, which are some way effects and fruits of the same covenant. But we say, that the reprobate partake not of saving mercy and that Christ’s death is a satisfaction only for the elect, and that none others get pardon of sin, faith, repentance, etc. by it, but they only; it was intended for none others. And this we clear and confirm from, and by, these following grounds and arguments, which we will shortly hint at.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Crucified: Seventy-Two Sermons on Isaiah</cite>, (Dallas, TX: Naphtali Press, 2001), pp. 343-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>The second sort of divines (Contra-Remonstrants) [that is, those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>

</figure><figure class="quote" id="q-e0e9e3932e" data-kw="">
<blockquote><p>Those that care not to please God, yet care for the outward favors of God [such as Esau], and are ready to murmur if they want [lack] them; as if God were bound to them and they [were] free. And yet so merciful is God, that He has second blessings for those that love Him not, and gives them all they care for. That one blessing of special love is for none but Israel; but those of common kindness are for them that can sell their birthright. This blessing was more than Esau could be worthy of…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments</cite>, (d. 1656; Old Paths Gospel Press), vol. 1, p. 23</span></figcaption>

<blockquote><p>The Word must be preached to all without exception; the Gospel must be offered to converted and unconverted. Some object to this as if it would make the offer of grace too general. But the Lord Jesus has commanded it. ‘Many are called, but few are chosen.’ (Matt. 22:14; 20:16) ‘Go ye therefore, and teach all nations, baptizing them in the Name of the Father, and of the Son, and of the Holy Ghost.’ (Matt. 28:19) ‘Go ye into all the world, and preach the Gospel to every creature.’ (Mark 16:15) … Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 2, p. 369</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>II… On the contrary, the latter [temporary faith] depends upon common grace which bestows even on the reprobate certain blessings: not only external and temporal, but also spiritual and initial gifts (although not saving) as a testification of a certain general love and to increase their guilt on the supposition of their contumacy.</p></blockquote>

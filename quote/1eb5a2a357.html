<main class="wrap"><figure class="quote" id="q-1eb5a2a357" data-kw="">
<blockquote><p>But the reformation was not complete; the high places were not all taken away, though many of them were, 2 Chron. 15:3, 5. Those in the cities were removed, but not those in the cities of Judah, but not those in the cities of Israel which were reduced to the house of David; or those that were used in the service of false gods, but not those that were used in the service of the God of Israel. These he connived at, and yet his heart was perfect. There may be defects in some particular duties where yet the heart, in the man, is upright with God. Sincerity is something less than sinless perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible</cite>, on 2 Chron. 15, vv. 8-19</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cd7397674" data-kw="">
<blockquote><p>That which hinders the Church’s edification by the ruler’s fault, it may be the people’s duty to obey for a greater good. For instance, it is less edifying to use our old singing psalms than a better version. And yet for concord, if the ruler appoint them, the people must use them because concord with that imperfection is better than to sing everyone a several better version or diverse versions at once. So a faulty translation of Scripture, a weak sermon, an inconvenient hour and place, when concord is necessary and cannot be had in the more edifying circumstances, it must be had in the best way we can. If the sheriff appoint an unfit time and place to meet to choose parliament-men, it’s a duty to comply rather than not to meet at all. Every evil so far excludes good, and yet we must not renounce communion in all good where men mix any evil lest we also give over all good ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 68</span></figcaption>

<blockquote><p>for undoubtedly the Lord will not send them empty away; their labor shall not be lost, nor their hope be disappointed: but they shall certainly have good success according to their expectation: I. Because they have done what they could for their part. 2. Hezekiah’s prayer stands in as good force yet still, as it did at that time when it was made… …and therefore coming thus affected and prepared, they cannot miss of the promised blessing.</p></blockquote>

<blockquote><p>It is one thing to deny total communion, and another to separate but secundum quid [according to that] for some act or part; And that is either a great and necessary part or some small or indifferent thing or ceremony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, pp. 38-39</span></figcaption>

— Richard Baxter, The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6, pp. 38-39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+one+thing+to+deny+total+communion%2C+and+another+to+separate+but+secundum+quid+%5Baccording+to+that%5D+for+some+act+or+part%3B+And+that+is+either+a+great+and+necessary+part+or+some+small+or+indifferent+thing+or+ceremony.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Nonconformists%E2%80%99+Plea+for+Peace%2C+or+an+Account+of+their+Judgment+in+Certain+Things+in+which+they+are+Misunderstood%E2%80%A6+%28London%2C+1679%29%2C+sect.+6%2C+pp.+38-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa90a40a18e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a90a40a18e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=It%20is%20one%20thing%20to%20deny,small%20or%20indifferent%20thing%20or%20ceremony&amp;text=It%20is%20one%20thing%20to%20deny%20total%20communion&amp;text=or%20some%20small%20or%20indifferent%20thing%20or%20ceremony" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cb64ce6484" data-kw="">
<blockquote><p>Objection: But this case is unlike to that of liturgies. Answer: The Scripture is God’s own Word: A mistranslation makes that to be his Word that is not; which sure is a tenderer matter than in what words we speak our own minds to God. Sure [it is that] a depravation of Scripture is more [of a depravavation] than [that of] a ceremony: Were liturgies such an alteration of God’s own words, you would more plausibly accuse them. One that said, ‘God said this’ or that, which He said not, was worse than one that spake his own words indecently to God. To say, ‘This is God’s Word,’ which is not, is indeed adding to it [Prov. 30:6]; but so it is not to speak words as our own. How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence. But yet a word more: Question 1: Do you think that the Pharisees and scribes had so much of the gift of extemporary prayer that they could, and did use to make long prayers, as if it were by the spirit-extempore? Say so and you will disgrace the doctors’ arguments that lay so much on this manner of praying [by forms]. No doubt but it was forms and liturgies that they used; yet when Christ condemns them for praying in the streets to be seen and using long prayer for a pretence to devour widows’ houses:

2. Did Christ speak one word against them as forms or liturgies? Did He want [lack] zeal or knowledge?

3. Had they not been good in themselves, what cloak could they have made for so great evil?

4. Did Christ or his apostles ever forbear [abstain from] the synagogues for the sake of these long liturgies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Bad Translation &amp; Bad Liturgy</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

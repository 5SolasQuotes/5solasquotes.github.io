<main class="wrap"><figure class="quote" id="q-e9f097d1e8" data-kw="">
<blockquote><p>Then also, that we be no less undoubtedly persuaded of the wonderful love of God towards us, surmounting the love of all creatures, who has so loved the world that He has given his only begotten Son that all that believe in Him should not perish, but have everlasting life, Jn. 3.</p></blockquote>

<blockquote><p>After these common mercies, I say, whereof the reprobate are often partakers, he opens the treasure of his rich mercies, which are kept in Christ Jesus for his Elect. Such as willingly delight not in blindness may clearly see that the Holy Ghost makes a plain difference betwixt the graces and mercies which are common to all, and that sovereign mercy which is immutably reserved to the chosen children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Knox</cite>, ed. David Laing (Wodrow Society, 1856), vol. 5, On Predestination, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-8b80c52ba5" data-kw="">
<blockquote><p>Doctrine Two. We may consider Christ’s sufferings and death in the fruits of it, either as they respect common favors, and mercies, common gifts, and means of grace, which are not peculiar and saving, but common to believers with others, being bestowed upon professors in the visible Church; or as they are peculiar and saving, such as faith, justification, adoption, etc. Now when we say that Christ’s sufferings and death are a price for the sins of his people, we exclude not the reprobate simply from temporal and common favors and mercies that come by his death; they may have, and actually have, common gifts and works of the Spirit, the means of grace, which are some way effects and fruits of the same covenant. But we say, that the reprobate partake not of saving mercy and that Christ’s death is a satisfaction only for the elect, and that none others get pardon of sin, faith, repentance, etc. by it, but they only; it was intended for none others. And this we clear and confirm from, and by, these following grounds and arguments, which we will shortly hint at.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Crucified: The Marrow of the Gospel in 72 Sermons on Isaiah 53</cite>, (Dallas, TX: Naphtali Press, 2001), pp. 343-44</span></figcaption>

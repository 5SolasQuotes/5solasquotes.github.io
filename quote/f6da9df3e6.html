<main class="wrap"><figure class="quote" id="q-f6da9df3e6" data-kw="">
<blockquote><p>For the merits of Christ’s obedience to the covenant of works he hath freed his people from the guilt of their disobedience to that covenant of works he was made under the Law to redeem them that are under the Law, Gal. 4:4, 5. now the obedience of Christ to the covenant of works was two-fold; First, his active obedience to that covenant who did perform it without any spot of sin, he saith of his obedience to his Father, I do always those things that please him, John 8:29. he finished the work that his Father gave him to do, John 17:4. and saith his Father, this is my beloved son in whom I am well pleased, Mat. 3:15. thus hath the perfect obedience of Jesus Christ satisfied for all the disobedience of his people to the covenant of works.

Secondly, The other part of Christ’s obedience was passive, he suffered the penalty due unto us for our disobedience to that covenant, though he were a son, yet learned he obedience by the things which he suffered, and being made perfect he became the author of salvation to all them that obey him, Heb. 5:8,9; 2:10. it behoved Christ to suffer and to rise from the dead the third day, Luke 24:26, 46. Christ hath once suffered for sins, the Just for the unjust, that he might bring us to God, I Pet. 3:18. he that knew no sin, neither was guile found in his mouth, who when he suffered he threatened not, but committed himself to him that judgeth righteously, I Pet. 2:25. he alone trod the winepress of his Father’s wrath, and there was none with him, Isa. 63:3. he cried out the pains of hell gat hold of him, and he cried out, My God, my God, why hast thou forsaken me, now the dignity of his person being both God and Man in one Christ, his humanity suffering but a short time made his obedience so meritorious, to free us from that guilt and penalty that is due unto us for our breach of that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two solemn covenants made between God and man: viz. the covenant of works and the covenant of grace</cite>, (London: Thomas Banks, 1647), p. 5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5ce83c846f" data-kw="federal head">
<blockquote><p>Man must be viewed under a double relation—either as just or as the first. In the former respect, he had the power to perform the prescribed duty. In the latter, Adam in a certain manner included the whole human race, which was to spring from him, both as the root and the seminal principle from whom the whole human race was to descend; and as a public person and representative head, because he represented all men who were to spring naturally from him. Hence that covenant pertained not only to Adam, but to all his posterity in him.</p></blockquote>

</figure><figure class="quote" id="q-bfc56d2b66" data-kw="">
<blockquote><p>The names of the two covenants, one of works and one of grace, may be misleading. The names may give the idea that the original covenant lacks any element of grace. That God creates us and gives us the gift of life is already an act of grace. God was under no obligation to create anyone. Once created, we had no claim on God to enter into a covenant with us. God’s promise of life on the condition of obedience has its origin in his grace. Even in the covenant of works the reward promised for obedience is de pactio.

The reward is given, not because the works themselves, due to their intrinsic value, impose an obligation on God to reward them, but because God in his grace offered such a reward as part of an agreement. Theoretically God could have justly and righteously imposed an obligation on his creatures to obey his law without any promise of reward whatsoever. It is the creature’s intrinsic duty to obey his Creator, with or without the prospect of reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-c-sproul.html">R. C. Sproul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Reformed Theology? Understanding the Basics</cite>, (1997; Grand Rapids MI: Baker Books, Kindle Edition, 2016), p. 131.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

</figure><figure class="quote" id="q-79a18339a4" data-kw="">
<blockquote><p>Once more, are true believers delivered from the commanding, condemning, and irritating power of the law as a covenant? Let them then, amid all their trials and all their conflicts with spiritual enemies, be of good comfort. Oh, let them rejoice exceedingly in that almighty, compassionate, dear Redeemer who, in His love and pity, has redeemed them from the dominion and curse of the broken law (Gal. 3:13). You, O believer, have become dead to the law by the body of Christ and are married to another husband, even to Him who is raised from the dead, that you may bring forth fruit unto God (Rom. 7:4). You are dead to the law of works; nevertheless, you live. You live to God as your own God, your covenant God, and you serve Him in newness of spirit. In union with your living Redeemer, who loved you and gave Himself for you, you live a life of justification, and consequently, it is your privilege as well as your duty to live a life of sanctification and consolation. Being justified by faith, you have peace with God through our Lord Jesus Christ and, in some measure, peace of conscience. If then the law as a covenant of works should at any time enter your conscience again and require perfect obedience from you as the ground of your title to eternal life, saying, “This do, and thou shalt live” (Luke 10:28), present to it, in the hand of faith, the perfect obedience of your divine Surety in answer to that demand. And as often as the law in your conscience repeats the high demand, renew your application of His consummate obedience and trust firmly that it was performed for you in order to entitle you to eternal life. The righteous law, magnified and made honorable by that meritorious obedience, will, in proportion as you do so, cease to disturb the peace of your conscience. The spotless obedience of the second Adam is, as was observed above, the only obedience that you should present to the law as a covenant of works; and your own personal obedience is the only obedience that you ought to exhibit to it as a rule of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 223–24.</span></figcaption>

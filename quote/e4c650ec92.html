<main class="wrap"><figure class="quote" id="q-e4c650ec92" data-kw="">
<blockquote><p>1. Tell them that you love them, aren’t ashamed of them, and that this is something that you have had to overcome. Tell them they can do the same. 2. Tell them that porn is bad for them spiritually, physically, and relationally. And then explain how. 3. Tell them that you are going to set up ‘speed bumps’ to help them when they’re tempted but it comes down to their desire to live with integrity. Those speed bumps are: a. Filters (on devices &amp; internet protocol) b. Screens only in shared spaces c. Weekly check-ups: ‘Have you looked at porn of any form this week?’ 4. Ask them to identify the a) the times that are most tempted and b) the things that seem to trigger the desire to look at porn. 5. Show them ways to deal with stress that are productive: bible reading, prayer, running, pushups, developing a skill, etc. 6. Remind them again that you love them, porn makes you weak, and living a lie is hell. Let them know that you won’t look down on them if they stumble and they need to let you know so you can conquer together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pastor-michael-foster.html">Pastor Michael Foster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An answer over social media to someone asking for advice regarding a pre-teen with a porn addiction:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Being, insofar as it is knowable, is true. Being, insofar as it is desirable, is good. And Being, insofar as it is pleasurable, is beauty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/norman-geisler.html">Norman Geisler</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God &amp; Creation</cite>, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“Being, insofar as it is knowable, is true. Being, insofar as it is desirable, is good. And Being, insofar as it is pleasurable, is beauty.”

— Norman Geisler, God &amp; Creation, p. 239">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBeing%2C+insofar+as+it+is+knowable%2C+is+true.+Being%2C+insofar+as+it+is+desirable%2C+is+good.+And+Being%2C+insofar+as+it+is+pleasurable%2C+is+beauty.%E2%80%9D%0A%0A%E2%80%94+Norman+Geisler%2C+God+%26+Creation%2C+p.+239&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F86031e873b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/86031e873b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-beauty/#:~:text=Being%2C%20insofar%20as%20it%20is%20knowable%2C,as%20it%20is%20pleasurable%2C%20is%20beauty." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b88afc4031" data-kw="">
<blockquote><p>The beautiful is the same as the good, and they differ in aspect only. For since good is what all seek, the notion of good is that which calms the desire; while the notion of the beautiful is that which calms the desire, by being seen or known. Consequently those senses chiefly regard the beautiful, which are the most cognitive, viz., sight and hearing, as ministering to reason; for we speak of beautiful sights and beautiful sounds. But in reference to the other objects of the other senses, we do not use the expression beautiful, for we do not speak of beautiful tastes, and beautiful odors. Thus it is evident that beauty adds to goodness a relation to the cognitive faculty: so that good means that which simply pleases the appetite; while the beautiful is something pleasant to apprehend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 of pt. 2, q. 27, art. 1, reply to obj. 3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw (London: Simmons, 1671), ‘To those Readers…’</cite>, p. 6</span></figcaption>

</figure><figure class="quote" id="q-bfa045621c" data-kw="">
<blockquote><p>It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good and not to hurt them. And the Devil, who is the Destroyer, so he may but do men hurt, will be content to make use even of truth to do it; though usually he only pretends truth to cover his lies: And this angel of Light has his ministers of light and righteousness, who are known by their fruits; whilst the pretenses of light and righteousness are used to Satan’s ends and not to Christ’s, to hurt and destroy and to hinder Christ’s Kingdom, and not to save and to do good: as the wolf is known by his bloody jaws, even in his sheep’s clothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’</cite>, pp. 208-9</span></figcaption>

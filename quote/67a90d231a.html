<main class="wrap"><figure class="quote" id="q-67a90d231a" data-kw="">
<blockquote><p>The Scriptures warrant us to look forward to a period when it [the church] shall resume the appearance of a united and peaceful community. Then shall it be fulfilled as it is written: “The earth shall be full of the knowledge of the Lord, as the waters cover the sea.” [Isaiah 11:9; Habakkuk 2:14] “The Lord shall be King over all the earth; in that day shall there be one Lord, and His name one.” [Zechariah 14:9] But before this consummation can be attained there must be some agreement as to the proper form of ecclesiastical government. And doubtless the Church shall then, in all its arrangements, be a model of symmetry and beauty. There will be no provision made for useless drones or meretricious ornamentations; but all will be taught to look for life and sustentation to the Head; all will be prepared, in some way, to conduce to the promulgation of His glory; all will be encouraged to endeavour to promote the general well-being; and thus all will be builded together for an habitation of God through the Spirit. The framework of the Church throughout will reveal the hand of Him who is excellent in counsel and wonderful in working.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-d-killen.html">W. D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>framework of the church. A treatise on church government</cite>, (Edinburgh, 1890), pp 4-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c2e86419c9" data-kw="">
<blockquote><p>…his [John Robinson’s] answer is that no parish assemblies [under patrons and bishops] have power of right to choose their ministers. Whereas on the contrary it is most evident that every congregation of Christians has right unto this thing from Christ Himself so inseparably annexed unto it that no external oppression by others or abuse of their own can possibly deprive them of this right, so long as they remain a Christian assembly or congregation. Suppose they be in external bondage, and that in some sense spiritual, yet no matter of fact can take away right, while they abide such as Christ has given that right unto. The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed. Even so stands the matter betwixt minister and people in England, they agreeing or contracting betwixt themselves have right one in other: but external legal power or liberty they must receive from others. Another example also I would have considered: the emperor sometime was so subiect unto the pope that he had not liberty of emperial rule until he received his crown from Rome: yet was the emperor then no proper part of the papacy, nor did he take his right from the pope, neither did those that submitted unto him therein communicate with the pope’s authority. So is this in hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>2. A representative Church may be thought a number sent by a community and elected to give laws absolutely tying, as if believers should say, ‘We resign our faith and conscience to you, to hold good whatever you determine without repeal or trial;’ that is blind faith; that we disclaim: all our rulers’ acts in our assemblies do bind, 1. conditionally, if they be lawful and convenient, 2. matters to be enacted are first to be referred to the congregations and elderships of particular congregations before they be enacted.</p></blockquote>

<blockquote><p>The third consideration is that there is some footsteps of this identity of bishop and presbyter in the most corrupt writtings of the most impure schoolmen: which may appear in these three: 1. In that, generally, episcopacy is holden to be no distinct order from presbytery; and that presbytery, or priesthood (as they speak) is the highest order in all their hierarchy. And this is current as the doctrine of Lombardus the Master of Sentences, Hugo, Aquinas, Thomas Waldensis, and generally of all the Thomists at least. And though they seem to make bishops to be of a more eminent degree, yet by Estius and some others alleged by him, this is not thought sufficient to distinguish one office from another.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-72e8445630" data-kw="keep faith lawful oaths">
<blockquote><p>First, to keep faith is an act of truth, justice and fidelity. He that keeps faith does what he says, the characteristic of truth. He does what he has promised and to which he is bound, the characteristic of fidelity. He restores to another what is his due according to the promise, the characteristic of justice. Second, it is lawful to swear faith to infidels, therefore also to keep faith with them as appears from the examples of Abraham making a covenant with Abimelech (Gen. 21:23, 24), of Isaac (Gen. 26:26), of Jacob (Gen. 31:53), of the spies with Rahab (Jos. 6:22), of the Israelites with the Gibeonites (Jos. 9:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.11.9–10</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9 / on invocation</span></figcaption>

</figure><figure class="quote" id="q-00feb2e9e7" data-kw="against will-worship">
<blockquote><p>This would be to approve of will worship (ethelothrēskeias, which he elsewhere condemns); but in the second, for that which is founded on reason and is exercised by reason. That is, Paul uses that which is spiritual and inward, not carnal and outward, by antithesis to the Levitical and Old Testament ceremonial service which was carnal in the offering up of beasts; whereas God now no more requires brutes, but rational and spiritual sacrifices, as Peter calls them (1 Pet. 2:5).</p></blockquote>

</figure><figure class="quote" id="q-ffe939c855" data-kw="">
<blockquote><p>Q. What are the sins forbidden in the first commandment? A. The sins forbidden in the first commandment, are, Atheism, in denying or not having a God; Idolatry, in having or worshipping more gods than one, or any with or instead of the true God; the not having and avouching him for God, and our God; the omission or neglect of any thing due to him, required in this commandment; ignorance, forgetfulness, misapprehensions, false opinions, unworthy and wicked thoughts of him; … selflove, selfseeking, and all other inordinate and immoderate setting of our mind, will, or affections upon other things, and taking them off from him in whole or in part; … distrust … trusting in lawful means; carnal delights and joys; … ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves, or any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite>, Q. 105</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ecf7db324f" data-kw="">
<blockquote><p>At this day the Mahometans (or Turks) speak to their superiors covered, and so are covered also in their religious performances. The custom with us in these western parts is quite otherwise; the uncovering of the head is a sign or token of subjection: hence ministers pray and preach with their heads uncovered, to denote their subjection to God and Christ: but yet this custom is not uniform, for in France the Reformed ministers preach with their heads covered; as they pray uncovered, to express their reverence and subjection to God, so they preach covered, as representing Christ, the great Teacher, from whom they derive, and whom they represent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53ba2a652c" data-kw="">
<blockquote><p>The custom in these parts [in France] is, to put off the hat, when in public acts the king is named: Moreover the Protestants [Anglicans] in England do ordain that men put off their hats at sermons when they hear the name of Jesus. In like manner all countries haue their customs: that which is ridiculous and superstitious in one place, is held and esteemed comely and religious in another. The most expedient way would be, instead of calling one another idolaters and heretics, to exhort one another charitably to do all to edification, to avoid the appearance of evil and excess, and not to scandalize the infidels and unbelievers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/morton-eudes.html">Morton Eudes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Traditions</cite>, … (London, 1609), Question 42, Annotation Eudes was a Romanist., p. 217</span></figcaption>

</figure><figure class="quote" id="q-796f070775" data-kw="">
<blockquote><p>…because there is no moral goodness imaginable, but it must have its essential form and being from a law or word of God; therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God: For circumstances clothed with religious positive goodness, such as are the Sabbath day, the Holy of Holiest, the Temple; these are not mere circumstances, but worship itself: So a religious habit, as an ephod or a surplice, is not a mere circumstance, or a mere habit, but a worship, or such a part or limb of worship as must be warranted by the Word of truth, else it is nothing but a will-device and a forgery, and so to be rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, p. 6</span></figcaption>

</figure><figure class="quote" id="q-7ebfafd06a" data-kw="">
<blockquote><p>The evangelical ceremonies [in the NT] are either natural or instituted. The natural either common or proper. The common natural ceremonies of religion, are such as are equally used in civil and in religious matters, as bowing the knee, uncovering the head, and some other things which respect that civil order, reverence, and decency, which ought to be observed in the external (and especially in the public) worship of God. The proper are such as are not used but in the matters of religion. The instituted ceremonies of the Gospel strictly and properly taken in contradistinction to natural, and which are designed to be of perpetual use, are only the two Sacraments… yet in a large sense even natural ceremonies, and matters of real decency and order, that is such things as are ex natura rei, pro hic et nunc [from the nature of the thing, here and now], necessary hereunto, and acceptable in the worship of God, are instituted too, i.e. commanded either implicitly or explicitly; for nothing offered by man, especially in worship, which is not in obedience to God, by virtue of some command, is honorable or acceptable to God; but what God has commanded, He has thereby instituted. So then, the matter in hand will fall under the notion of a common, natural ceremony of religion, pertaining to the decency or reverence of God’s worship in the public assemblies of his saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered</cite>, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative. (London: Maxwell, 1682) 56 pp. ToC, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-fa459e7ca9" data-kw="">
<blockquote><p>But their [the Independents’] main difference from all the Reformed, and greatest consonancy with the Brownists [separatist Independents], is in this, that as they teach all outward signs of worship in the time of the celebration to be idolatry [such as the societal customs the Scots practiced], and hereupon declare the necessity of all men who will follow the example of the first communicants, to keep on their hats all the time of this holy action; so likewise the Independents begin to teach their disciples; For however at Amsterdam this day the named doctrine be not fully practiced, the men there covering their heads in the time of the celebration, but every one uncovering, during the time of their own personal participation of the elements, yet we are now taught at London that covering is most requisite at the time of participation. That this act is a rite significant to the communicants of their table-honor and fellowship with Christ, also that the minister in all his celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, [who are] sitting covered when they eat of their Father’s meat.† † I have heard some of their chief men discourse publicly enough to this purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645) | ch. 6, ‘An Enumeration of the Common Tenets of the Independents’, pp. 122 &amp; 149</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“But their [the Independents’] main difference from all the Reformed, and greatest consonancy with the Brownists [separatist Independents], is in this, that as they teach all outward signs of worship in the time of the celebration to be idolatry [such as the societal customs the Scots practiced], and hereupon declare the necessity of all men who will follow the example of the first communicants, to keep on their hats all the time of this holy action; so likewise the Independents begin to teach their disciples; For however at Amsterdam this day the named doctrine be not fully practiced, the men there covering their heads in the time of the celebration, but every one uncovering, during the time of their own personal participation of the elements, yet we are now taught at London that covering is most requisite at the time of participation. That this act is a rite significant to the communicants of their table-honor and fellowship with Christ, also that the minister in all his celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, [who are] sitting covered when they eat of their Father’s meat.† † I have heard some of their chief men discourse publicly enough to this purpose.”

— Robert Baillie, A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, especially of the Independents, are Drawn together in one Map (London, 1645) | ch. 6, ‘An Enumeration of the Common Tenets of the Independents’, pp. 122 &amp; 149">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+their+%5Bthe+Independents%E2%80%99%5D+main+difference+from+all+the+Reformed%2C+and+greatest+consonancy+with+the+Brownists+%5Bseparatist+Independents%5D%2C+is+in+this%2C+that+as+they+teach+all+outward+signs+of+worship+in+the+time+of+the+celebration+to+be+idolatry+%5Bsuch+as+the+societal+customs+the+Scots+practiced%5D%2C+and+hereupon+declare+the+necessity+of+all+men+who+will+follow+the+example+of+the+first+communicants%2C+to+keep+on+their+hats+all+the+time+of+this+holy+action%3B+so+likewise+the+Independents+begin+to+teach+their+disciples%3B+For+however+at+Amsterdam+this+day+the+named+doctrine+be+not+fully+practiced%2C+the+men+there+covering+their+heads+in+the+time+of+the+celebration%2C+but+every+one+uncovering%2C+during+the+time+of+their+own+personal+participation+of+the+elements%2C+yet+we+are+now+taught+at+London+that+covering+is+most+requisite+at+the+time+of+participation.+That+this+act+is+a+rite+significant+to+the+communicants+of+their+table-honor+and+fellowship+with+Christ%2C+also+that+the+minister+in+all+his+celebration+must+be+uncovered%2C+and+that+in+sign+of+his+service+to+the+communicants+as+the+Lord%E2%80%99s+much+honored+children%2C+%5Bwho+are%5D+sitting+covered+when+they+eat+of+their+Father%E2%80%99s+meat.%E2%80%A0+%E2%80%A0+I+have+heard+some+of+their+chief+men+discourse+publicly+enough+to+this+purpose.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+A+Dissuasive+from+the+Errors+of+the+Time%2C+wherein+the+Tenets+of+the+Principal+Sects%2C+especially+of+the+Independents%2C+are+Drawn+together+in+one+Map+%28London%2C+1645%29+%7C+ch.+6%2C+%E2%80%98An+Enumeration+of+the+Common+Tenets+of+the+Independents%E2%80%99%2C+pp.+122+%26+1

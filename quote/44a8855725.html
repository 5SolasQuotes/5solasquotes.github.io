<main class="wrap"><figure class="quote" id="q-44a8855725" data-kw="">
<blockquote><p>Here there is a memorable example by which we are taught how easy it is for people who have been correctly instructed to fall into absurd and dangerous errors, unless they are diligent and tireless in watching out for the tricks of Satan. Human beings all seem to get easily bored with the same routine, and because they are always wanting something new they find it hard to stick to one thing for any length of time.

Examples of this particular failing are frequent, both in things that pertain to the salvation of souls and in external matters related to our situation in this life. Satan misuses the weaknesses of our nature and seizes every opportunity to cause dissension in both church and state, by which he leads the wretched to their destruction. It is this that brings about changes in the state which, because they are dangerous, almost always produce some great evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2d0e533d6" data-kw="">
<blockquote><p>This difference between the Law and the Gospel is the height of knowledge in Christendom. Every person and all persons who assume or glory in the name of Christian should know and be able to state this difference. If this ability is lacking, one cannot tell a Christian from a heathen or a Jew; of such supreme importance is this differentiation. This is why St. Paul so strongly insists on a clean-cut and proper differentiating of these two doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon on Galatians”</cite>, (New Years, 1532) on Galatians 3:23–24. Source: WA 36.25 transl. in Ewald M. Plass, What Luther Says (Concordia Publishing House: St Louis, 1959), 2.732.</span></figcaption>

</figure><figure class="quote" id="q-70327c335b" data-kw="">
<blockquote><p>…Russell, who was present, says: ‘After the skirmish, Robert Hamilton slaughtered one of the prisoners in cold blood, and seems to have regretted all his life that five more did not share the same fate. In his letter of self-vindication to the Anti-Popish, Anti-Prelatic, Anti-Erastian, Anti-Sectarian, True Presbyterian Remnant of the Church of Scotland (1684), he says: ‘as for that accusation they bring against me, of killing that poor man (as they call him) at Drumclog, I may easily guess that my accusers cannot but be some of the house of Saul, or Shimei, or some such, risen again to espouse that poor Gentleman (Saul) his quarrel against honest Samuel, by his offering to kill that poor man Agag, after the King’s given him quarter. [The obligation to kill Agag stemmed from a direct and unique command of God, Dt. 25:17-19, on par with the special command to kill all the Canaanites, which was unique to Israel in entering Canaan and typological in its severity, not something of general or common equity.] But I being called to the command that day, gave out the word, ‘that no quarter should be given,’ and returning from pursuing Claverhouse, one or two of these fellows were standing in the midst of a company of our friends, and some were debating for quarter and others against it. None could blame me to decide the controversy, and I bless God for it to this day.’ He next mentions that five more got quarter, without his knowledge, and adds, ‘which I reckoned among the first steppings aside that I feared the Lord would not honour us to do much for Him,’ and he thanks God that since ever he set his face to his work, he would neither give nor take favour from his enemies. Mr. Wilson says: ‘Some without Mr. Hamilton’s knowledge, and directly contrary to his express command, gave five of these bloody enemies quarter, and then let them go. This greatly grieved Mr. Hamilton, when he saw some of Babel’s brats spared after the Lord had delivered them into their hands, that they might have dashed them against the stones — Psalms 137:9.’ In support of these principles, he quotes certain texts of scripture, as ‘Cursed be he who doeth the work of the Lord deceitfully.’ ‘Cursed be he who keepeth back his hand from blood.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-aiton.html">William Aiton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A History of the Rencounter at Drumclog, and Battle at Bothwell Bridge</cite>, (Hamilton: Borthwick, 1821), pp. 57-58</span></figcaption>

</figure><figure class="quote" id="q-3d9f8b8c3a" data-kw="">
<blockquote><p>O Arian, the right inheritor to Lucifer, that would exalt his seat, and be like to the highest; whose fall shall be like, where the sin is equal. If God did highly allow the minister of Ephesus, for that he could in no wise abide such as said they were apostles, and were not in deed, how may any lay uncharitableness unto me, which for the love of my sweet Christ do abhor all fantastical Arians, in such sort as all men ought to do that love the Son of God unfeignedly? …

Was there ever heretic so bold and impudent as the Arian is, that durst take from the Son of God the glory which he had with the Father from the beginning? If Christ be the beginning and ending of all things (as he testifieth himself to St John), how may he be but a creature, like unto others? Who may dissemble such blasphemy that hath any spark of the Spirit of God? Who may hear with patience the right ways of the Lord perverted by these devilish holy Arians, and hold his peace?

A lively faith is not dumb, but is always ready to resist the gainsayers, as David saith, “I have believed, and therefore I have spoken.” Speak then, you that have tongues to praise and confess against these Arians; exalt your voice like a trumpet, that the simple people may beware of their Pharisaical venom, and be not deceived, as now many are unawares of simplicity. Suffer them not to pass by you unpointed at: yea, if they be so stout that they will not cease to speak against God our Saviour and Christ, (as they are all new baptized enemies thereto,) refrain not to spit at such inordinate swine as are not ashamed to tread under their feet the precious godhead of our Saviour Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-philpot.html">John Philpot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology for Spitting upon an Arian</cite>, (n.d.) in Robert Eden (ed.), The Examinations and Writings of John Philpot, B.C.L., Archdeacon of Winchester: Martyr, 1555 (Cambridge: The University Press, 1842), pp 300-01.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

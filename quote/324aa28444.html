<blockquote><p>Sanctification is a work of the triune God, but is ascribed more particularly to the Holy Spirit in Scripture, Rom. 8:11; 15:16; 1 Pet. 1:2. It is particularly important in our day, with its emphasis on the necessity of approaching the study of theology anthropologically and its one-sided call to service in the kingdom of God, to stress the fact that God, and not man, is the author of sanctification. Especially in view of the Activism that is such a characteristic feature of American religious life, and which glorifies the work of man rather than the grace of God, it is necessary to stress the fact over and over again that sanctification is the fruit of justification, that the former is simply impossible without the latter, and that both are the fruits of the grace of God in the redemption of sinners. Though man is privileged to co-operate with the Spirit of God, he can do this only in virtue of the strength which the Spirit imparts to him from day to day. The spiritual development of man is not a human achievement, but a work of divine grace. Man deserves no credit whatsoever for that which he contributes to it instrumentally. In so far as sanctification takes place in the subconscious life, it is effected by the immediate operation of the Holy Spirit. But as a work in the conscious life of believers it is wrought, by several means, which the Holy Spirit employs.</p></blockquote>

<blockquote><p>XVIII. Baptism indeed promises us the submersion of our Pharaoh and the mortification of sin, yet not so that it is no more or does not trouble us, but only that it does not overcome us, on account of Christ who, by His blood, prevents its power from condemning, and by his Spirit, restrains it from dominating. This is not so that men may sleep securely in their sins, but only that they may not waver and lose heart, who are tickled and pricked by their flesh.</p></blockquote>

<blockquote><p>Controversy XI: Can the justified men fulfill God’s law? Orthodox Position: None of the justified can perfectly keep God’s law, as Scripture teaches (Romans 8; Galatians 3), experience, and the Church Fathers. The perfection of the righteous, mentioned in Matthew 5:48 and Genesis 6:9, 17:1, Philippians 3:15, consists in the imputation of Christ’s justice and in sincerity and uprightness, which consist in acknowledging one’s own imperfection and firmly resolving to obey all of God’s commandments. [Romanist] Position of [Robert] Bellarmine: The justified men can keep God’s law, not by the forces of free will, but by the aid of God’s grace, that is, by the spirit of faith and charity infused in justification. The reasons are: 1. Christ’s yoke is easy, and His commandments are not burdensome (Matthew 11; 1 John 5). 2. God gives us His Spirit, who makes us walk in His ways (Ezekiel 36). That is why the apostle says in Philippians 4:13 that he can do all things. 3. The elect are endowed with charity (John 13, 15; 1 John 3, 4). Charity is the fulfillment of the law (John 14; Romans 13). 4. We read about many saints who kept God’s commandments blamelessly and were perfect and truly righteous (Genesis 6, 17; 1 Samuel 14, 15; 2 Samuel 23; Luke 1). 5. God is not like a tyrant who demands impossible tributes from His friends. Therefore, the Church Fathers teach that no one is obligated to do the impossible. 6. Christ died so that the justice of the law might be fulfilled in us (Romans 8:4). 7. Man can do more than is commanded (Matthew 19:21). [The Reformed] Censure: 1.2. God’s commandments are not only possible but also easy for the elect, not by their own strength but by God’s grace. Furthermore, the defects found in their works are graciously forgiven by God. 3.4. Perfection of parts and sincerity are attributed to the elect, not absolute and supreme perfection, which is called perfection of degrees. Though the elect love God, the mode of this love in this life is imperfect. 5. Not every obligation to do the impossible is unjust, especially when one has incurred a debt by one’s own fault. Moreover, God requires from His own what is possible through Christ. 6. The substance of God’s law is fulfilled in us when we are justified in Christ according to the perfect formula of the law. 7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

 God, the mode of this love in this life is imperfect. 5. Not every obligation to do the impossible is unjust, especially when one has incurred a debt by one’s own fault. Moreover, God requires from His own what is possible through Christ. 6. The substance of God’s law is fulfilled in us when we are justified in Christ according to the perfect formula of the law. 7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.”

+do+more+than+is+commanded+%28Matthew+19%3A21%29.+%5BThe+Reformed%5D+Censure%3A+1.2.+God%E2%80%99s+commandments+are+not+only+possible+but+also+easy+for+the+elect%2C+not+by+their+own+strength+but+by+God%E2%80%99s+grace.+Furthermore%2C+the+defects+found+in+their+works+are+graciously+forgiven+by+God.+3.4.+Perfection+of+parts+and+sincerity+are+attributed+to+the+elect%2C+not+absolute+and+supreme+perfection%2C+which+is+called+perfection+of+degrees.+Though+the+elect+love+God%2C+the+mode+of+this+love+in+this+life+is+imperfect.+5.+Not+every+obligation+to+do+the+impossible+is+unjust%2C+especially+when+one+has+incurred+a+debt+by+one%E2%80%99s+own+fault.+Moreover%2C+God+requires+from+His+own+what+is+possible+through+Christ.+6.+The+substance+of+God%E2%80%99s+law+is+fulfilled+in+us+when+we+are+justified+in+Christ+according+to+the+perfect+formula+of+the+law.+7.+The+conditional+is+not+categorical.+Christ+is+not+saying+here+what+the+arrogant+young+man+could+do+but+refuting+him+for+his+false+hope+of+justice.+Moreover%2C+it+is+true+that+there+are+works+of+supererogation%2C+but+in+Christ.+.+Controversy+XII%3A+Are+the+good+works+of+the+justified+truly+pure%3F+Orthodox+Position%3A+The+good+works+of+the+justified%2C+considered+in+themselves%2C+are+wrapped+in+many+defects+and+are+therefore+not+absolutely+pure+but+only+relatively%2C+considering+the+justified+person%2C+who+is+pure+in+Christ.+Scripture+teaches+this+%28Psalm+130%3B+Romans+7%3B+1+Corinthians+13%3B+James+3%29.+Experience+also+confirms+this%2C+as+we+experience+various+temptations+in+thoughts%2C+words%2C+and+deeds.+The+Church+Fathers%2C+like+Bernard%2C+also+approve+this%3A+%E2%80%9CIf+there+is+any+justice+in+us%2C+it+is+humble%2C+perhaps+upright%2C+but+not+pure.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alsted%2C+%E2%80%98On+Justification+%26+Good+Works+in+General%E2%80%99+in+Theologia+polemica%2C+exhibens+praecipuas+huius+aeui+in+religionis+negotio+controuersias+sex+in+partes+tributa+studio+%28d.+1638%29+at+Nosferatu%E2%80%99s+Substack+%

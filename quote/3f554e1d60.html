<main class="wrap"><figure class="quote" id="q-3f554e1d60" data-kw="">
<blockquote><p>That it is possible that the sadness, sorrow, mid grief of those particular saints that thou hast thine eye upon may arise from the natural temper and constitution of their bodies. Many saints are often cast into a melancholy mould; for though grace changes the disposition of the soul, yet it alters not the constitution of the body.

Now there is no greater enemy to holy joy and gladness than melancholy, for this pestilent humour will raise such strange passions and imaginations, it will raise such groundless griefs, and fears, and frights, and such senseless surmises and jealousies, as will easily damp a Christian’s joy, and mightily vex, perplex, trouble, and turmoil, daunt, and discourage a Christian’s spirit.

A melancholy constitution is Satan’s anvil, upon which he forms many black, dark, and dismal temptations, which do exceedingly tend to the keeping down of divine consolation from rising high in the soul. This black, dark, dusky humour disturbs both soul and body; it tempts Satan to tempt the soul, and it unables the soul to resist the temptation; yea, it prepares the soul to hearken to the temptation, and to close and fall in with the temptation, as the experiences of all melancholy Christians can testify.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 260.</span></figcaption>

<blockquote><p>9. [Maxwell’s accusation of presbyterians is false:] That the king must submit his sceptre to the presbytery. The king’s sceptre is his royal office, which is not subject to any judicature, no more than any lawful ordinance of Christ; but if the king, as a man, blaspheme God, murder the innocent, advance belly-gods (such as our prelates for the most part were) above the Lord’s inheritance, the ministers of Christ are to say, ‘The king troubles Israel, and they have the keys to open and shut heaven to, and upon the king, if he can offend.’ … 21. It is false that presbyteries usurp both swords because they censure sins which the civil magistrate should censure and punish. Elijah might be said then to mix himself with the civil business of the kingdom, because he prophesied against idolaters’ killing of the Lord’s prophets; which crime the civil magistrate was to punish. But the truth is, the assembly of Glasgow, 1637, condemned the prelates because they, being pastors, would be also lords of parliament, of session, of secret council, of exchequer, judges, barons, and in their lawless high commission, would fine, imprison, and use the sword. … 29. It is a lie that our General Assembly may repeal [civil] laws, command and expect performance of the king, or then excommunicate, subject to them, force and compel king, judges and all, to submit to them. They may not force the conscience of the poorest beggar, nor is any Assembly infallible, nor can it lay bounds upon the souls of judges, which they are to obey with blind obedience — their power is ministerial, subordinate to Christ’s law; and what civil laws parliaments make against God’s Word, they may authoritatively declare them to be unlawful, as though the emperor (Acts 15) had commanded fornication and eating of blood. Might not the Assembly forbid these in the synod?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. xxii-xxiii</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Mortifications [donations] given to religious uses by a positive law may be recalled by a more divine and stronger law of nature, such as this, ‘I will have mercy and not sacrifice.’ Suppose David, of his own proper heritage, had given the showbread to the priests; yet, when David and his men are famishing, he may take it back from them against their will. Suppose Christ had bought the ears of corn and dedicated them to the altar; yet might He and his disciples eat them in their hunger [Mt. 15:5-6]. The vessels of silver, dedicated to the church, may be taken and bestowed on wounded soldiers.</p></blockquote>

<blockquote><p>33. That, as it is the duty of every man to worship God in such a manner as he thinks most acceptable to Him; all persons, professing the Christian religion, are equally entitled to protection in their religions liberty… the Legislature may, in their discretion, lay a general and equal tax, for the support of the Christian religion… And all acts of Assembly, lately passed, for collecting monies for building or repairing particular churches or chapels of ease, shall continue in force, and be executed… …and every encumbent of the church of England, who has remained in his parish, and performed his duty, shall be entitled to receive the provision and support established by the act, entitled ‘An act for the support of the clergy of the church of England, in this Province,’… …

35. That no other test or qualification ought to be required on admission to any office of trust or profit, than such oath of support and fidelity to this State, and such such oath of office, as shall be directed by this Convention, or the Legislature of this State, and a declaration of a belief in the Christian religion.

36. That the manner of administering an oath to any person, ought to be such, as those of the religious persuasion, profession, or denomination, of which such person is one, generally esteem the most effectual confirmation, by the attestation of the Divine Being…</p></blockquote>

<blockquote><p>Upon perusal of Mr. Ascham’s book… I find not myself in my understanding convinced thereby of the necessity of lawfulness of conforming unto or complying with an unjust prevailing power, further than I was before persuaded it might be lawful or necessary so to do: viz. paying taxes and submitting to some other things (in themselves not unlawful) by them imposed or required, such as I had a lawful liberty to have done in the same manner, though they had not been so command; and seem to me in the conjuncture of present circumstances prudentially necessary to preserve myself or my neighbor from the injuries of those that would be willing to make use of my non-submission to mine or his ruin. So as it be done with these cautions:

1. Without any violation either of duty to God, or of any other just obligation that lies upon me by oath, law, or otherwise.

2. Only in the case of necessity otherwise not to be avoided.

3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek:] dunamis (to the force), but not acknowledge the [Greek:] exousia (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right title, or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide presume, that the oppressed power, to whom my obedience is justly due, if he perfectly knew the present condition I am in, together with the exigence and necessity of the present case, and of all the circumstances thereof, would give his willing consent to such conformity or compliance. So that upon the whole matter and in short, I conceive I may so far submit to the impositions or comply with the persons of a prevailing usurped power, unjustly commanding things in themselves not unlawful, or make use of that power to protect me from others’ injuries, as I may submit unto, comply with, or make use of an highway thief or robber, when I am fallen into his hands and lie at his mecy.</p></blockquote>

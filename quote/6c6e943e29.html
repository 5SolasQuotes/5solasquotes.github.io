<blockquote><p>God is not as man, that he should repent; He is said to repent, because he doth that which men do when they repent. I will repent, That is, I will turn my judgements into mercies. God doth sometimes will a change, but he never changeth his will. God from all eternity decreed to be served in the old Testament with types and figures, and in the New-Testament, in spirit and truth. Here was a will of a change, but no change in God’s will.

When God is said to repent, the change is in us, not in God. As when the Sun softneth the wax, and hardeneth the clay; here is a different act of the Sun; but the change ariseth from the different object, not from the Sun. So God from all eternity decrees to punish the impenitent, and to bless the penitent. And when a Nation by God’s Almighty grace becomes penitent, God turns his punishments into blessings; but the change is in the Nation, not in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s looking-glass presented in a sermon preached before the Honourable House of Commons at their late solemn fast, December 22, 1641</cite>, (London: Chr. Meredith, 1642), p. 23.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19f84a4aaa" data-kw="">
<blockquote><p>That repentance and faith are both essential to the attainment of eternal life. Though this has speculatively, it has not practically, been assented to by many professing Christians. Some have attached a high importance to repentance, but have at the same time almost entirely overlooked the necessity of faith. They think that if a man refrain from vicious habits, and be humane, charitable, just, and sober, he has attained the great end of all religion — he is a good man, and therefore must be held to be a good Christian; and they not unfrequently look upon and speak of those who attach a special importance to faith in Christ, as enthusiasts and visionaries, and sometimes go the length of representing them as favouring the doctrine that man may sin that grace may abound.

Others, again, have attached a high importance to faith in Christ; but at the same time have forgotten the equally high importance which belongs to repentance. They think that if a man believe the gospel, and entertain a zealous attachment to a sound creed, he must be a true Christian; and they not unfrequently look on those who insist on the necessity of repentance and good works as persons destitute of evangelical views, ignorant of the truth, attached to legal doctrine, and going about to establish their own righteousness.

Both these classes of persons proceed on erroneous principles — on partial views of the subject. The Holy Scriptures, from which alone we derive our knowledge of it, do not authorize them to give any such preference to the one grace or to the other, and far less to indulge in mutual, uncandid animadversions. A very slight acquaintance with the Scriptures may make any candid man perceive that both are equally essential, though not in the same sense.

A man without repentance, which is the principle or seed of holiness, is dead in trespasses and sins, and therefore incapable of enjoying heaven. And a man without faith, which is the uniting bond with the Saviour, is under condemnation, and has no title to the enjoyment of heaven. A well-informed Christian knows that that is truth. An experienced Christian feels that it is truth. He is not more assured that without holiness no man shall see the Lord, than that to be saved he must believe in the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-aird-thomson.html">William Aird Thomson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Testifying Repentance Toward God, and Faith Toward our Lord Jesus Christ, to the Faithful Preaching of the Gospel in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-f72063ba88" data-kw="">
<blockquote><p>The Prophets in the old Testament exhorting the rebellious Jews unto Repentance, use commonly an Hebrew verb which signifieth turn ye, or return ye &amp; come back again, by the which Metaphor is meant, that like as a man that is strayed far out of his way, must turn quite back again the contrary way: So those that have strayed from the ways of Godliness, to the way of sin, must come back again, as fast as ever they went forward, &amp; altogether change the course of their life: so that Repentance is an earnest turning unto God with all our heart, soul, and mind.

Saint John Baptist, and the Apostles in the New Testament exhorting unto Repentance, use a Greek word which signifieth a changing of the mind afterward, or afterwit, so that those which through their folly &amp; want of former wit, have slipped into the deep pit, and dangerous gulf of sin, when they come to themselves, &amp; have recovered their wits, will be wise afterward, &amp; take heed they never come there again according to the Proverb: The burnt child will take heed of the Fire.

By this time I hope you see what is repentance. It is not every sorrow, but sorrow for sin, not for some sin, but for all sin, not for an hour, but for ever, not for a day, but continually, not for a week, but as long as we live. Some think every sorrow is repentance: but so should worldlings repent. Some think every little pant for sin is repentance: so should Pharaoh repent. Some think all weeping and lamenting for sin is repentance: so should Esau, Judas &amp; Cain, repent. Some think every little humbling of our selves is repentance: but so should Ahab repent. Some think that good words, and good purposes is Repentance: but so should every sick man repent. Some think the reformation of words and deeds, is Repentance: but so should civil men repent. Some think that cry God mercy is repentance: and so should every fool repent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-dent.html">Arthur Dent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon of repentance. A very godly and profitable Sermon, preached at Lee in Essex, by Arthur Dent, Minister of God’s word. And published at the request of sundry Godly and well disposed persons. 1581. the 7. of March</cite>, (London: John Harison, 1582), unpaginated.</span></figcaption>

<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) L <blockquote><p>…the acknowledging of sins does not of itself obtain grace or forgiveness of sins, even as the bare acknowledging of a disease is not the remedy for the same: for even damned men also do acknowledge their sins, and yet are not therefore healed. The acknowledging of sin is a certain preparative unto faith, as the acknowledging of a disease does minister occasion to think upon a remedy. To this at this present we add that not the very fear of God, how sincere soever it be, not the very sorrow conceived for our sins, how great soever it be, nor the very humiliation, how submiss soever it be, do of themselves make us acceptable to God: but rather that they prepare an entrance and make a way for us unto the knowledge of Christ, and so consequently do lead us to Christ Himself being incarnate and crucified for us and our redemption, and lay us upon Christ alone, by Him to be quickened and purely cleansed.</p></blockquote>

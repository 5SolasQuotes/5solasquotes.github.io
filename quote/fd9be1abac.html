<blockquote><p>It was no marvel therefore, although Chrysostom and others did fall sometimes into the commendation of the monkish and hermetic life. But their hermits and monks are so unlike the pope’s creatures… 1. For first… 4. Fourthly, there was permitted unto them care of wives, of family, and private possession, so that the same were moderate and not against the care of the soul: contrary to your laws, which thrust upon them the vow of wilful poverty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confutation of the Rhemists’ Notes, Glosses &amp; Annotations on the New Testament… (d. 1603; [Leiden] 1618), on Mt. 3:1</cite>, pp. 9-11</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ad5e62da7" data-kw="">
<blockquote><p>1. Liberty is that natural power which man has of his own person, whence a free man is said to be suae potestatis, ‘in his own power’, and it is defined in the law to be a natural faculty to do that which every man pleases, unless he be hindered by law or force. … 5. Though liberty be the most precious right, yet it is not absolute, but limited; First, by the Will of God, and our obediential obligations to Him, and to men by his ordinance; and so though man has power of his own person, yet has he no power of his own life, or his members, to dispose of them at his pleasure, either by taking away of his life or amputation, or hurting of any member by himself, or by giving power to any other so to do, unless it be necessary for preserving the whole, but he is naturally obliged to God to maintain his life: So likewise men may be restrained, or constrained by others, without encroachment upon the law of liberty, in the pursuance of other obediential obligations; as a husband has power to restrain his wife, from her liberty of going where she will, and may keep her within the bounds of conjugal society; so may parents restrain their children, and also constrain them to the performance of moral duties, and that without any engagement or law; we may also without any injury, restrain a furious person, or one who is inferring violence to himself, in his life or limbs, because this is not against any act of his lawful liberty, and is done as a duty in us of love and mercy: But in matters of utility and profit, where the natural liberty is not hemmed in with an obligation, there, unless by his own delinquence or consent, man cannot justly be restrained, much less constrained upon pretense of his utility or profit; for liberty, as far preferable to profit, and in the matter of utility, every man is left to his own choice, and cannot without injury to God and Man, be hindered to do what he pleases, or be compelled to do what he pleases not, in things wherein he is free, 6. Liberty may be diminished or taken away by our delinquence in the way of punishment, for seeing it is a right in our own power; as goods and debts may be forfaulted by our delinquence, so may our liberty, in whole or in part. 7. Thirdly, our engagements do commonly import a diminution of our personal liberty, but much more, of that natural liberty of things without us; whence it is that the law allows personal execution or restraint, and incarceration of the debitor’s person, until he do all the deeds that are in his power for the satisfaction of his Creditor. … 9. Fifthly, liberty is wholly taken off by bondage, slavery or servitude, which is diametrically opposite to liberty; for as liberty is that power by which men are sui juris [in his own power], so by servitude they became alieni juris, ‘in the power of another’… 10. Bondage was introduced by the law of nations, and it is among the positive laws of nations, settled by common consuetude [custom], and it took first place in these who were taken in war, who being under the power of their enemies’ sword, did lose their liberty in lieu [in place] of their life [instead of being killed]; such also were these who sold their liberty and gave it up, and were content to be perpetual slaves, as were the Jewish bondmen, whose ears were pierced with an aul [Ex. 21], as the solemnity of their perpetual and willing servitude, the offspring of servants remained in their servile condition… 11. Bondage, though contrair to the nature of liberty, yet it is lawful; liberty being a right alienable, and in our disposal, so that the natural law constitutes us free, but puts no necessity on us, so to continue; and therefore servitude is both approven in the Old Testament; and in the New, it is cleared against that obvious objection, that being made free by Christ, we should not become the servants of men, to which the Apostle answers, ‘Art thou called, being a servant (or slave)? continue so, for nevertheless thou art Christ’s freeman’ [1 Cor. 7]: But yet Christian lenity and mercy, has almost taken away bondage, except amongst the Spaniards, Portugals [who were Romanist] and other Christian nations bordering upon the Turks [Muslims], where, because the Turks do extremely exercise slavery, especially upon Christians, their neighbors do the like, that they may have slaves to exchange with slaves: little of slavery remains elsewhere among Christians, except the ascriptitii [naturalized foreigners], who are not absolutely slaves… but in Scotland there is no such thing.</p></blockquote>

<blockquote><p>Of three kinds of liberty, and how servitude is agreeable to the Law of Nature. But here it will further be demanded, whether servitude be agreeable to the Law of nature, and how it comes to pass, that the Lord suffered the Israelites being a free people, to be servants one unto another. For the deciding of this doubt, there is a threefold kind of liberty to be considered, a natural liberty, civil, and spiritual. 1. The natural liberty I call that, wherein Adam was created, being subdued to no bondage, neither spiritual of sin, nor corporal in any outward subjection to any creature: but as he had a freedom of will, and was made Lord of his affections within, that he needed not to have sinned, unless he would himself: so he had the dominion of the creatures given unto him. This original liberty of nature considered, servitude and bondage was brought in as a punishment of sin, and so is not simply, and of itself agreeable to the Law of nature. 2. But now since Adam’s fall, there is another kind of civil liberty, and civil servitude opposite unto it. Civil liberty is defined to be a natural faculty, for every man to do as himself likes. . . unless one be hindered by force or in right; for that is no true liberty for a man against right, to do what him likes . . . Now this servitude simply accords not with nature, as the Apostle says, If yet thou mayest be free, use it rather, 1 Cor. 7.21. showing that every one by nature desires liberty and freedom. But after a sort this servitude is agreeable to nature, not simply, or of itself, but as other punishments are said to be natural, as tending to the maintenance of society among men which is properly natural. And if it be objected, why since all men are fallen in Adam, and so brought into subjection, why all likewise become not servants: the answer is, that two things must be considered in this our corrupt state: the one is the Law of corruption, brought in by sin, the other the goodness of God: that although all men are subject by sin to the same bondage and corruption, yet the goodness of God qualifies that slavish condition of nature, as that some do enjoy an outward liberty and freedom: like as in the inward faculties of the soul, the Lord gives unto some more light of understanding, dexterity of wit, profoundness of judgement, and other natural gifts, than unto others. 3. The spiritual liberty is wrought in us by grace in Christ, which is from the subjection of sin, and malediction of the Law; that our conscience is no more terrified with slavish fear, but we are at peace with God: and beside, by this spiritual liberty, the faithful have restored unto them the dominion over all creatures: that though not in external possession, yet in a spiritual right, all things are theirs, whether the world, life, death, things present or things to come, 1 Cor. 3.22. and all things work to the best, to those that love God, Rom. 8.28. So these may very well stand together, external servitude, and spiritual freedom: it is possible for one to bee a freeman to God, and yet a servant in the world, and another to be a bondman to sin, and yet free in the world: for there are divers objects of these two kinds of liberty and bondage; the outward freedom respects this life and state, the free use of riches, and pleasures of this life: the spiritual and internal freedom hath set before it the salvation of the soul, the favor of God, and life eternal. Christian religion then overthrows not the diversity of degrees among men: But as Christ, though he were by his spiritual right, free from all taxes and impositions, yet lest he should offend, payed poll money, Matt. 17. so Christians, though they are made free by faith in the Son, yet for the maintenance of peace and love, and avoiding of offence, in disturbing the temporal State, they are bound as well as others, to be subject unto the powers of this world[.]</p></blockquote>

ther the goodness of God: that although all men are subject by sin to the same bondage and corruption, yet the goodness of God qualifies that slavish condition of nature, as that some do enjoy an outward liberty and freedom: like as in the inward faculties of the soul, the Lord gives unto some more light of understanding, dexterity of wit, profoundness of judgement, and other natural gifts, than unto others. 3. The spiritual liberty is wrought in us by grace in Christ, which is from the subjection of sin, and malediction of the Law; that our conscience is no more terrified with slavish fear, but we are at peace with God: and beside, by this spiritual liberty, the faithful have restored unto them the dominion over all creatures: that though not in external possession, yet in a spiritual right, all things are theirs, whether the world, life, death, things present or things to come, 1 Cor. 3.22. and all things work to the best, to those that love God, Rom. 8.28. So these may very well stand together, external servitude, and spiritual freedom: it is possible for one to bee a freeman to God, and yet a servant in the world, and another to be a bondman to sin, and yet free in the world: for there are divers objects of these two kinds of liberty and bondage; the outward freedom respects this life and state, the free use of riches, and pleasures of this life: the spiritual and internal freedom hath set before it the salvation of the soul, the favor of God, and life eternal. Christian religion then overthrows not the diversity of degrees among men: But as Christ, though he were by his spiritual right, free from all taxes and impositions, yet lest he should offend, payed poll money, Matt. 17. so Christians, though they are made free by faith in the Son, yet for the maintenance of peace and love, and avoiding of offence, in disturbing the temporal State, they are bound as well as others, to be subject unto the powers of this world[.]”

— Andrew Willet, Hexapla in Genesin &amp; Exodum… (London, 1633), on Ex. 21, Question 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+three+kinds+of+liberty%2C+and+how+servitude+is+agreeable+to+the+Law+of+Nature.+But+here+it+will+further+be+demanded%2C+whether+servitude+be+agreeable+to+the+Law+of+nature%2C+and+how+it+comes+to+pass%2C+that+the+Lord+suffered+the+Israelites+being+a+free+people%2C+to+be+servants+one+unto+another.+For+the+deciding+of+this+doubt%2C+there+is+a+threefold+kind+of+liberty+to+be+considered%2C+a+natural+liberty%2C+civil%2C+and+spiritual.+1.+The+natural+liberty+I+call+that%2C+wherein+Adam+was+created%2C+being+subdued+to+no+bondage%2C+neither+spiritual+of+sin%2C+nor+corporal+in+any+outward+subjection+to+any+creature%3A+but+as+he+had+a+freedom+of+will%2C+and+was+made+Lord+of+his+affections+within%2C+that+he+needed+not+to+have+sinned%2C+unless+he+would+himself%3A+so+he+had+the+dominion+of+the+creatures+given+unto+him.+This+original+liberty+of+nature+considered%2C+servitude+and+bondage+was+brought+in+as+a+punishment+of+sin%2C+and+so+is+not+simply%2C+and+of+itself+agreeable+to+the+Law+of+nature.+2.+But+now+since+Adam%E2%80%99s+fall%2C+there+is+another+kind+of+civil+liberty%2C+and+civil+servitude+opposite+unto+it.+Civil+liberty+is+defined+to+be+a+natural+faculty%2C+for+every+man+to+do+as+himself+likes.+.+.+unless+one+be+hindered+by+force+or+in+right%3B+for+that+is+no+true+liberty+for+a+man+against+right%2C+to+do+what+him+likes+.+.+.+Now+this+servitude+simply+accords+not+with+nature%2C+as+the+Apostle+says%2C+If+yet+thou+mayest+be+free%2C+use+it+rather%2C+1+Cor.+7.21.+showing+that+every+one+by+nature+desires+liberty+and+freedom.+But+after+a+sort+this+servitude+is+agreeable+to+nature%2C+not+simply%2C+or+of+itself%2C+but+as+other+punishments+are+said+to+be+natural%2C+as+tending+to+the+maintenance+of+society+among+men+which+is+properly+natural.+And+if+it+be+objected%2C+why+since+all+men+are+fallen+in+Adam%2C+and+so+brought+into+subjection%2C+why+all+likewise+become+not+servants%3A+the+answer+is%2C+that+two+things+must+be+considered+in+this+our+corrupt+state%3A+the+one+is+the+Law+of+corruption%2C+brought+in+by+sin%2C+the+other+the+goodness+of+God%3A+that+although+all+men+are+subject+by+sin+to+the+same+bondage+and+corruption%2C+yet+the+goodness+of+God+qualifies+that+slavish+condition+of+nature%2C+as+that+some+do+enjoy+an+outward+liberty+and+freedom%3A+like+as+in+the+inward+faculties+of+the+soul%2C+the+Lord+gives+unto+some+more+light+of+understanding%2C+dexterity+of+wit%2C+profoundness+of+judgement%2C+and+other+natural+gifts%2C+than+unto+others.+3.+The+spiritual+liberty+is+wrought+in+us+by+grace+in+Christ%2C+which+is+from+the+subjection+of+sin%2C+and+malediction+of+the+Law%3B+that+our+conscience+is+no+more+terrified+with+slavish+fear%2C+but+we+are+at+peace+with+God%3A+and+beside%2C+by+this+spiritual+liberty%2C+the+faithful+have+restored+unto+them+the+dominion+over+all+creatures%3A+that+though+not+in+external+possession%2C+yet+in+a+spiritual+right%2C+all+things+are+theirs%2C+whether+the+world%2C+life%2C+death%2C+things+present+or+things+to+come%2C+1+Cor.+3.22.+and+all+things+work+to+the+best%2C+to+those+that+love+God%2C+Rom.+8.28.+So+these+may+very+well+stand+together%2C+external+servitude%2C+and+spiritual+freedom%3A+it+is+possible+for+one+to+bee+a+freeman+to+God%2C+and+yet+a+servant+in+the+world%2C+and+another+to+be+a+bondman+to+sin%2C+and+yet+free+in+the+world%3A+for+there+are+divers+objects+of+these+two+kinds+of+liberty+and+bondage%3B+the+outward+freedom+respects+this+life+and+state%2C+the+free+use+of+riches%2C+and+pleasures+of+this+life%3A+the+spiritual+and+internal+freedom+hath+set+before+it+the+salvation+of+the+soul%2C+the+favor+of+God%2C+and+life+eternal.+Christian+religion+then+overthrows+not+the+diversity+of+degrees+among+men%3A+But+as+Christ%2C+though+he+were+by+his+spiritual+right%2C+free+from+all+taxes+and+impositions%2C+yet+lest+he+should+offend%2C+payed+poll+money%2C+Matt.+17.+so+Christians%2C+though+they+are+made+free+by+faith+in+the+Son%2C+yet+for+the+maintenance+of+peace+and+love%2C+and+avoiding+of+offence%2C+in+disturbing+the+temporal+State%2C+they+are+bound+as+well+as+others%2C+to+be+subject+unto+the+powers+of+this+world%5B.%5D%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+Hexapla+in+Genesin+%26+Exodum%E2%80%A6+%28London%2C+1633%29%2C+on+Ex.+21%2C+Question+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F692c5a2f69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/692c5a2f69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/slavery/#:~:text=Of%20three%20kinds%20of%20liberty%2C%20and,unto%20the%20powers%20of%20this%20world%5B.%5D" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is agreed on by divines that servitude is a penal fruit of sin, and against nature. Institutt. de jure personarum, Sect. 1, and F. de statu hominum. I. libertas; because all men are born by nature of equal condition. … But to be a master, and to have a masterly and lordly power over slaves and servants is to make use of servants for the owner’s bener fit, not for the good of the slave (I. 2, de leg, I. Servus de servit. expert. Dance polit. I. 1, Tolossan. de Rep. I. 1, c. 1, n. 15, 16), therefore are servants bought and sold as goods (jure belli. F, de statu hominum I. et servorum). 2… not to be under a master as slaves are, is a blessing, seeing freedom is a blessing of God (John 8:33; Ex. 21:2, 26-27; Dt. 15:12); so he that kills Goliath (1 Sam. 17:25), his father’s house shall be free in Israel (Jer. 34:9; Acts 22:28; 1 Cor. 9:19; Gal, 4:26, 31)… 3. Subjects are called the servants of the king (1 Sam. 15:2; 2 Chron. 13:7; 1 Kings 12:7; Ex. 10:1-2; Ex. 9:20) but they are not slaves, because (Dt. 17:20) they are his brethren: “That the king’s heart be not lifted up against his brethren;” and his sons; (Isa. 49:23) and the Lord gave his people a king as a blessing, (1 Kings 10:9; Hos. 1:11; Isa. 1:26; Jer. 17:25), “and brought them out of the house of bondage,” (Ex. 20:2) as out of a place of misery… 4. The master might in some cases sell the servant for money, yea for his own gain he might do it (Neh. 5:8; Eccl. 2:7; 1 Kings 2:32; Gen. 9:25; Gen. 26:14; 2 Kings 4:1; Gen. 20:14, and might give away his servants; and the servants were the proper goods and riches of the master (Eccl. 2:7; Gen. 30:43; Gen. 20:14; Job 1:3, 15); but the king may not sell his kingdom or subjects, or give them away for money…</p></blockquote>

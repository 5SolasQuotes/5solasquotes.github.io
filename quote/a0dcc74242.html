<main class="wrap"><figure class="quote" id="q-a0dcc74242" data-kw="">
<blockquote><p>[Amyraldianism] was designed to take a middle ground between Augustinianism and Arminianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, p. 322</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“[Amyraldianism] was designed to take a middle ground between Augustinianism and Arminianism.”

— Charles Hodge, Systematic Theology, vol. 2, p. 322">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BAmyraldianism%5D+was+designed+to+take+a+middle+ground+between+Augustinianism+and+Arminianism.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+2%2C+p.+322&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa0dcc74242.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a0dcc74242.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Amyraldianism%5D%20was%20designed%20to%20take%20a%20middle%20ground%20between%20Augustinianism%20and%20Arminianism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-744bc248cd" data-kw="">
<blockquote><p>The truth is, we deny that Christ died for all, in as much as he died not to procure the grace of faith and regeneration for all, but only for Gods elect; and consequently neither shall any but God’s elect have any such interest in Christ’s death, as to obtain thereby pardon of sin and salvation, for Arminians themselves confess that this is the portion only of believers. But seeing pardon of sin and salvation are benefits merited by Christ, not to be conferred absolutely but conditionally, to wit, upon condition of faith; we may be bold to say that Christ in some sense died for all and every one, that is, he died to procure remission of sins and salvation unto all and every one in case they believe; and as this is true, so may we well say, and the Council of Dort might well say, that every one who hears the Gospel is bound to believe that Christ died for him in this sense, namely, to obtain salvation for him in case he believe. But what think Arminians; are we bound to believe that Christ died for us in such a sense, as to purchase faith and regeneration for us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice</cite>, … (Amsterdam, 1631), 3rd Part | 3rd Section, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-a225b91a4d" data-kw="">
<blockquote><p>For the finding out of this middle course… the former [satisfaction of Christ] was once done for all, the other [application thereof] is still in doing: the former brings with it sufficiency, abundant to discharge the whole debt; the other adds to it efficacy. The satisfaction of Christ only makes the sins of mankind fit for pardon, which without it could not well be; the injury done to God’s majesty being so great, that it could not stand with his honour to put it up without amends made. The particular application makes the sins of those to whom that mercy is vouchsafed to be actually pardoned… Hence, we infer against the first extremity, that by the virtue of this blessed oblation, God is made placable unto our nature (which He never will be unto the angelical nature offending) but not actually appeased with any, until He has received his Son, and put on the Lord Jesus. As also against the latter extremity, that all men may be truly said to have interest in the merits of Christ, as in a common, though all do not enjoy the benefit thereof, because they have no will to take it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, pp. 554-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-8bf94214ce" data-kw="">
<blockquote><p>Amyraut intended to soften the edges of the traditional Reformed view and thus to relieve difficulties in the controversy with Roman Catholics and facilitate a reunion of Protestants in which Reformed and Lutheran could join ranks… [it] tended to weaken the unity of Reformed thought and to open the door to increasing departures from Reformed orthodoxy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-r-nicole.html">Roger R. Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Amyraldism’ in eds. Sinclair B. Ferguson &amp; David F. Wright, New Dictionary of Theology</cite>, (Leicester: IVP, 1988), p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-65c6534128" data-kw="">
<blockquote><p>The doctrine of hypothetical universalism acted as a corrosive factor in the French Reformed Church. Tolerated at first because it was felt that an outright condemnation would lead to schism, it slowly undermined respect for the confessional standards and disrupted internal unity and cohesion… it did provide a bridge toward Arminianism and perhaps toward the Semi-Pelagian tendencies of the Church of Rome. The advantages that Amyraut had envisioned failed to materialize, and the dangers against which his opponents had warned did in fact eventuate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-nicole.html">Roger Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Standing Forth: Collected Writings of Roger Nicole</cite>, (Mentor, 2018), p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

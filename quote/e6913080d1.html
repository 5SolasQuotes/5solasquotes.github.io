<blockquote><p>Our justification means not only that our sins are forgiven and that we have been declared to be righteous by God Himself, not merely that we were righteous at the moment when we believed, but permanently righteous. For justification means this also, that we are given by God the positive righteousness of His own Son, the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-martyn-lloyd-jones.html">D. Martyn Lloyd-Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Depression – Its Causes and its Cures</cite>, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-as-a-one-time-act.html">Justification as a one-time act</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our justification means not only that our sins are forgiven and that we have been declared to be righteous by God Himself, not merely that we were righteous at the moment when we believed, but permanently righteous. For justification means this also, that we are given by God the positive righteousness of His own Son, the Lord Jesus Christ.”

— D. Martyn Lloyd-Jones, Spiritual Depression – Its Causes and its Cures, p. 74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+justification+means+not+only+that+our+sins+are+forgiven+and+that+we+have+been+declared+to+be+righteous+by+God+Himself%2C+not+merely+that+we+were+righteous+at+the+moment+when+we+believed%2C+but+permanently+righteous.+For+justification+means+this+also%2C+that+we+are+given+by+God+the+positive+righteousness+of+His+own+Son%2C+the+Lord+Jesus+Christ.%E2%80%9D%0A%0A%E2%80%94+D.+Martyn+Lloyd-Jones%2C+Spiritual+Depression+%E2%80%93+Its+Causes+and+its+Cures%2C+p.+74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe06d74f326.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e06d74f326.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-1d5f625a04" data-kw="">
<blockquote><p>Justification is therefore defined as: A gracious action of God, by His mercy toward the Elect, without any work or merit of their own, on account of the satisfaction of Christ, apprehended by true faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/franciscus-junius.html">Franciscus Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Justification</cite>, Thesis II</span></figcaption>

— Franciscus Junius, Theological Disputation on Justification, Thesis II">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+is+therefore+defined+as%3A+A+gracious+action+of+God%2C+by+His+mercy+toward+the+Elect%2C+without+any+work+or+merit+of+their+own%2C+on+account+of+the+satisfaction+of+Christ%2C+apprehended+by+true+faith.%E2%80%9D%0A%0A%E2%80%94+Franciscus+Junius%2C+Theological+Disputation+on+Justification%2C+Thesis+II&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d5f625a04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d5f625a04.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-94faf9202e" data-kw="">
<blockquote><p>Justification by faith is an answer to the greatest personal question ever asked by a human soul: “How shall I be right with God? How do I stand in God’s sight? With what favor does he look upon me?” There are those, I admit, who never raise that question. There are those who are concerned with the question of their standing before men but never with the question of their standing before God. There are those who are interested in what “people say” but not in the question of what God says. Such men, however, are not those who move the world. They are apt to go with the current. They are apt to do as others do. They are not the heroes who change the destinies of the race. The beginning of true nobility comes when a man ceases to be interested in the judgment of men and becomes interested in the judgment of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God Transcendent</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-7959f57f7c" data-kw="">
<blockquote><p>Justification is an act. It is not a work, or a series of acts. It is not progressive. The weakest believer and the strongest saint are alike equally justified. Justification admits no degrees. A man is either wholly justified or wholly condemned in the sight of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grace of Christ</cite>, p. 195</span></figcaption>

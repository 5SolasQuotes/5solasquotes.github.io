<blockquote><p>There is one department of this subject which is usually discussed under the head of the history of the text, and with which you ought to possess some acquaintance. It may be said to be occupied practically with the investigation of these questions, what is the origin and what is the value of that text of the Greek Testament which has been in most general use since the invention of printing, and from which most of the translations of the New Testament into modern languages have been made, and whether there be any other text which is upon the whole preferable to it.

The investigation of this subject has produced much interesting information as to the sources from which the first printed editions of the Greek Testament were derived, the number and value of the MSS. so far as they can be ascertained, which were employed by the original editors, the different editions professing to rest upon critical foundations, which have since been published, the additional light that has been cast upon the state of the text, and the decision of the litigated questions about particular various readings applied, with the view of settling as the practical result of all, what is upon the whole the best and purest text of the Greek Testament that is now accessible.

The text that long prevailed in Europe, and from which most of the existing translations were made, commonly known as the textus receptus, is based chiefly upon editions published by Stephens [Robert Estienne] and [Theodore] Beza from MSS., and very closely resembling each other. This continued to be in general use, though the correctness of some of its readings had been doubted and questioned, till the publication of [Johann Jakob] Griesbach’s New Testament, of which, in the second or complete edition of it, the first volume was published in 1796 and the second in 1806. Griesbach laboured to shew that the textus receptus had been derived from a very small number of MSS., and these of no great antiquity or value, and that now there were materials for producing a decidedly purer and more correct text.

Most of the editions of the Greek Testament which have since been published in this country or upon the Continent have been based mainly upon Griesbach’s, or at least have in some form or other exhibited the principal of his various readings. Most of those who have examined this subject with attention have been of opinion that, upon the whole, Griesbach’s text is more pure and correct, approaches nearer to the original text of the inspired authors than the textus receptus, and I am disposed to think that this opinion is correct. At the same time I do not know anything which is better fitted to give a distinct and vivid impression of the substantial identity of all MSS. of the New Testament, of the extremely narrow range within which the investigation of the various readings from the application of all existing materials lies, and of the insignificance of the results which have been derived from the researches of critics as distinguished from interpreters, than just to run the eye over the inner margin of Griesbach’s New Testament.

There you have at one view all the words and phrases which he has removed from the textus receptus to make room for his own emendations, and you cannot fail to be struck with their utter insignificance, both in number and importance. And you will thus be very decidedly confirmed in your convictions of the purity and integrity of the text of the New Testament. And while it may be admitted that upon the whole and in general Griesbach’s text is preferable to the textus receptus, this does not hold in the case of each particular reading with respect to which they differ. There are several cases, and these of considerable comparative importance, as for example, the two passages to which we referred in the preceding part of this lecture, in which Scholz, the author of the latest critical edition of the New Testament, prefers, and apparently upon satisfactory grounds, the reading of the textus receptus, and of our common version, to that which Griesbach has substituted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XLIV, pp 548-49 (emphasis added).</span></figcaption>

<blockquote><p>19. 4. Although the day be wholly to be dedicated to the ends of a sacred rest before insisted on, yet, 1. Duties in their performance drawn out to such a length as to beget wearisomeness and satiety, tend not to edification, nor do any way promote the sanctification of the name of God in the worship itself. Regard, therefore, in all such performances is to be had:

1. Unto the weakness of the natural constitution of some, the infirmities and indispositions of others, who are not able to abide in the outward part of duties, as others can. And there is no wise shepherd but will rather suffer the stronger sheep of his flock to lose somewhat of what they might reach to in his guidance of them, than to compel the weaker to keep pace with them to their hurt, and it may be their ruin. Better a great number should complain of the shortness of some duties, who have strength and desires for a longer continuance in them, than that a few who are sincere should be really discouraged by being overburdened, and have the service thereby made useless unto them. I always loved in sacred duties that observation of Seneca concerning the orations of Cassius Severus, when they heard him, ‘Timebamus ne desineret,’ ‘We were afraid that he would end.’

2. To the spiritual edge of the affections of men, which ought to be whetted, and not through tediousness in duties abated and taken off.</p></blockquote>

<blockquote><p>The non-conformist, non-separatist, puritan minister authors of this book: …were examples of holiness, so in this, that they have ever, not only forborne, but steadfastly opposed to their great reproach, damage and danger many ways, the corruptions in our [Anglican] Church government, worship and liturgy, and have been lights and leaders to these latter times therein, yet always in a peaceable and regular way, as not on the one side to subject themselves to suspicious inventions, so on the other, not sinfully to separate from the communion and true worship of churches, accounting it more agreeable to all rules of piety, charity and Christian prudence to tolerate for the time what they could not mend rather than to rent and tear all in pieces to an utter ruin.</p></blockquote>

<blockquote><p>13. God has by his Son Jesus and his apostles¹ instituted all that in doctrine, discipline, worship and conversation [conduct] which is obligatory or necessary universally to all the Church, over and above what is required by the Law of Nature. And no man or men have power to add anything of universal obligation.</p></blockquote>

<blockquote><p>THE main drift of the blessed apostle, the Holy Ghost’s penman, in this excellent epistle, is to set forth the pre-eminence of our Lord Jesus Christ, first, in his divine person, far above all angels, who are bid worship him, even when dwelling in man’s nature. If the god-head of our Lord Jesus Christ be hid from the readers of this epistle, it must be a special power of the God of this world on their unbelieving minds, 2 Cor. 4:3, 4. Will blinded men forbear to call the Son God, when the Father speaks so? chap. 1:8. Thy throne, O God, is for ever and ever. Then the apostle speaks of his incarnation, chap. 2:11, &amp;c. And therewith speaks of his priesthood, chap. 3. The apostle compares Christ with, and prefers him above Moses, chap. 2.; then above Aaron as a priest, chap. 7.; and compares him with Melchizedek, an eminent type of Christ.

By this epistle we may know what Paul’s reasonings with the Jews were, Acts 9:22 and 17:2, 3 and what is the right way of dealing with the Jews at this day. Till Christ’s divine person, and righteousness, and priesthood, have more room in the religion of the Gentiles, Christianity is not like to leaven the Jews. This doctrine of Christ’s priesthood, and of the sacrifice of himself he offered in that office, the apostle doth often intermix, with suitable exhortations from it; as in the context, ver. 14. Seeing then that we have a great high priest, (all the Old Testament high-priests were but types and shadows of him, and were but little high-priests), that is passed into the heavens, (no high-priest but Christ went farther than the holy of holies, for the people’s advantaged), Jesus the Son of God, let us hold fast our profession.</p></blockquote>

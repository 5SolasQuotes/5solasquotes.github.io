<blockquote><p>While that act stands unrepealed, or not annulled, it remains an act and rule of this Church still, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature.’ Now, as to the Brethren: [1] I cannot see any ground to say the sentenced anent them are not materially rescinded, seeing as the Assembly 1733 and their commission did cast them out from this Church, so the Assembly 1734 gave the synod of Perth power and full authority to restore and unite them again to the communion thereof, and to their ministerial charges, which accordingly was done by that synod: And this, in my opinion, was a material condemning of the sentences of the former Assembly and commission that had been pronounced against them. (2) But, whereas ’tis said the act of Assembly 1733 against them, while unrepealed, ‘It still remains an act and rule of this Church, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature,’ and therefore they cannot accede to the judicatories till that act is rescinded, lest they homologate that sinful deed or sentence. Now if this argument prove anything, it proves too much; for it says we are never to join with a Church which has made any unjust or sinful act till repealed: And so the Brethren could never be justified for joining formerly with the Church of Scotland when such unaccountable acts as that of the Assembly 1638, sessions 23-24, was unrepealed: which discharges all persons of whatever quality, ministers or others, to speak or write against that Assembly, or any act of that Assembly, under pain of the censures of the Church: A very bad precedent! And so the Assembly 1642, session 7, enjoins that every presbytery proceed against non-communicants, whether Papists or others, according to the act of parliament, which looks too like the English Sacramental Test: And also the above-cited act of Assembly 1648, anent deposing all suspended ministers who do not submit to the sentences of Church judicatories, and so of other bad acts of Assembly from 1638 to 1649 inclusive. And, if an act in a particular case is a rule in a way of precedent in similar cases, or cases of the like nature, then the instance of overturning the settlement made by the Commission at Auchtermuchty, and the repeated instances of our late General Assemblies in allowing the people of Stow, Troqueir, Dennie, etc. the privilege of sealing ordinances, are good precedents to plead in like cases where ministers are intruded upon Christian congregations. 4thly, They say: “Seeing an accession to a Church cannot be made but in the situation in which that Church is when the accession is made unto her; therefore any accession to her in that situation so far approves of her, as to submit it to her authority what is to be counted defections, and what not; and, if that Church maintain not that testimony which they that accede to her maintain, then they fall from their testimony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

all%20from%20their%20testimony" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Sect. XVII. It is lawful to separate from particular churches in all the degrees and cases following: 1. It is lawful to abate our esteem of any church or pastor as they are less worthy, or more corrupt or culpable, and to value more the more worthy. Sect. XVIII. 2. It is lawful to remove one’s dwelling from one city or parish to another, for the just reasons of our worldly affairs, and thereby to remove from other churches: And it is lawful to do the same for the good of our souls, when one minister is bad or less fit for our edification and one church more corrupt and culpable and others more sound and pure and their communion more conducible to our salvation. Sect. XIX. 3. Parish bounds being but human institutions for order sake, it is lawful to be of a church in a neighbor parish instead of one’s own parish church in case we have the allowance of the higher powers, or without that in cases of true necessity, or when consideratis considerandis, the benefit is evidently greater than any hurt that it is like to do. For no man has power to bind me to that which is to the danger or detriment of my soul unless (at least) some greater notorious interest of the community require it. If my parish have an ignorant, unsound teacher or a weak, dull, dangerous or unprofitable, careless or scandalous, vicious pastor, [and] yet tolerable rather than to have none, or judged tolerable by the rulers, and the next parish have an able, holy, faithful pastor, by whom I am more abundantly edified, I am not bound by man’s commands to trust the conduct of my soul with the former or to deny myself the benefit of the latter when I cannot remove my dwelling: For men’s power is not to destruction but to edification; and order is for the thing ordered and not against it. My soul is more Christ’s and my own than the rulers. And I am not unthankfully to neglect the helps offered me by Christ (who ascended to give gifts to men for the edifying of his Body) merely because a man commands me so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, … (London: Hancock, 1680), pt. 3, ‘Of Schism’, ch. 1, pp. 7-8</span></figcaption>

<blockquote><p>This was the constant judgment of the old non-conformists, which I shall transcribe from a grave author. ‘Those,’ says he: ‘that for many years together, during the reign of the three last princes [Edward VI, James I, Charles I], denied to come up to a full conformity to this [Anglican] Church, had a low oinion of the discipline then exercised (of which they have left behind them large evidences), yet how tender were they of the Church’s honour to keep Christians in communion? How zealous were they against separation? as may appear in the labours of Mr. [Robert] Parker, Mr. [John] Paget, Mr. [John] Ball. Mr. [Thomas] Brightman laid us low enough, when he [in his Commentary on Revelation] did not only parallel us with luke-warm Laodicea, but made that Church the type, and we the antitype, by reason of our discipline; yet how zealous is he against separation from these assemblers, and breaks out in these words: ‘Therefore their error is wicked and blasphemous, who so forsake the Church, as if Christ were altogether banished thence.”</p></blockquote>

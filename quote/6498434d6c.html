<blockquote><p>Something Composite to: the Ineffectible, Efficient Cause is Simple [see p. 72 of the Summary] . 54. Every composite depends on its parts as on a material cause; for the parts are the principles of which the composite consists. Hence parts are the material principle of a composite. Simple being is that which lacks parts. Composite being, on the other hand, is that which consists of parts united with each other. There is a physical composite if the thing consists of parts really distinct. There is a metaphysical composite if the thing consists of formalities that are united in such a way with each other that they have the idea of parts, as genus and difference. Formalities that do not have the idea of parts do not impede simplicity in a being, as science [knowledge] and will in God. 55. Every composite is an effect. This point follows from conclusion 21, because a composite is something that is matter-ed (see the preceding conclusion). 56. Every composite is composed ultimately of simple elements. From conclusion 16, we cannot proceed infinitely with respect to material causes essentially ordered. Therefore we must reach some matter-ing that is not matter-ed, that is, to a material cause that is not materially caused. But this non-matter-ed material cause is nothing other than a part that is not composed in its turn of other parts, which is the conclusion proposed. 57. An independent or uncausable being, because it is not an effect, is not composite; therefore such a being is simple. This follows from conclusion 55. 58. If there is something composite, there is something simple. This follows from conclusion 56 with respect to a first being in the order of material causality. But from the existence of the composite we can also infer the existence of a first being in the order of efficient causality. For if something is composite it is also an effect (from conclusion 55), and dependent (from conclusion 28). Therefore some ineffectible efficient cause is required (from conclusions 23 to 27). But every ineffectible being is simple (from conclusion 57). . Part 3, An Infinite, Perfect Being Imperfect Composites to Pure Perfections [see pp. 73-74 of the Summary] 59. Every composite consists of act and potency. For parts have in their formal concept the idea of mutual perfectibility, and so are in potency to the whole. 60. Hence composition is a mixed perfection. This follows from the preceding conclusion and also from the fact that a composite is caused and dependent on another; for being a dependent being involves some imperfection in the dependent being. Simplicity, on the contrary, involves no such imperfection. 61. Every mixed perfection can be reduced to one or several pure perfections that exist concretely in a limited degree. The reason is that the imperfection by virtue of which some perfection is said to [be] mixed is nothing other than the lack of being-ness. Therefore in itself formally, imperfection is something negative and not positive; for it is the negation of some positive perfection. Therefore it always involves something else, namely a positive being-ness of which there is a limitation. This positive being-ness in its formal concept either includes imperfection and hence is a mixed perfection, or does not include imperfection and hence is a pure perfection. If it is a pure perfection the conclusion is gained. If it is mixed, the same question will return: Is the positive perfection in which the imperfection of this mixed perfection inheres a pure perfection or a mixed one? So either there would be an infinite regress and so there would be no perfection, or a stand would be made in some pure perfection, which is the conclusion intended. So, for example, reasoning, which is formally a mixed perfection, can be reduced to understanding, which is a pure perfection. Likewise, the extension of parts beyond parts can be reduced to simples that have a definitive presence in space, etc. 62. No pure perfection is incompatible with another pure perfection. This is plain from the definition of pure perfection; for a pure perfection or a perfection simply is that whose formal idea does not involve limitation or imperfection. Therefore of itself such a perfection cannot limit the being-ness of the subject in which it is, and so neither can it exclude from its subject other perfections simply.</p></blockquote>

<blockquote><p>Instance 1: If the persons are really the same as the essence, they are really the same among themselves; the reason is, because things which are the same with one third thing are the same among themselves. Response: This axiom must be limited: Things which are the same with one third singular incommunicable thing are the same among themselves. But the divine essence is communicable to the three persons. Thus Becanus, Scholastic Theology, treatise 2, ch. 2, quest. 3. Nothing prevents also adding the commonplace limitation to that axiom: They are the same among themselves with respect to that third thing. And thus the persons are the same among themselves with respect to the one and same essence.</p></blockquote>

</figure><figure class="quote" id="q-e2e17d4f76" data-kw="">
<blockquote><p>The divine attributes are certain essential properties, which God is pleased in Scripture to ascribe or attribute unto Himself; they are also called the perfections of God, or divine predications or titles. They are not distinguished from the essence really, but notionally; that is, they are not distinguished at all in God, but only to us-ward, according to our manner of conceiving. All the attributes in God are one and the same perfection. It is better said of God that He is his attributes than that He has attributes: The attributes are not distinguished in God, but in our manner of understanding, who, being unable to comprehend that mere act at once, do conceive thereof after the manner of many acts. (Est inadequatus conceptus sed non falsus [It is an inadequate concept, but not false]. See Weems, Of the Image of God in Man, ch. 13) The sun, when it is perpendicular, had it an eye, would behold all that at once which we, by reason of the inadequateness and unproportionableness of our sight, are necessitated to view by parts. In God all things are one and the same, according to the nature of God; though out of God [they appear] many and diverse, according to their own proper and created nature. The same heat in the sun produces diverse effects according to the various disposition of the objects: hardness in clay, softness in wax, life in insects and plants, etc. The same lines are one in the center, but distinguished and multiplied in the circumference. Water that is the same in the sea, out of the sea is variously and diversely qualified: sweet, bitter, sulfureous, etc. The matter in the liver is the same but the four humors of blood, choller, melancholy and phlegm that proceed from thence are very diverse. The soul which is one and the same produces very differing effects, as appears in the operations of the understanding, will, and affections. The sum is: The attributes, as was said before, are not distinguished in God, that is, from the divine essence or one from another really, but only notionally or virtually in our conception and in their objects in respect of the various effects thereupon: For every and all the attributes are the divine essence itself, according to that received proposition, ‘Whatsoever is in God, is God.’ (Fenner, Theol., bk. 1, ch. 3; Alsted, Theol., sect. 3, locus 2; Zanchi, Of the Nature of God, bk. 2, ch. 5, quest. 2) And this is the reason why some well describe the attributes from the essence of God: which manner of description, besides many useful notions clearly intimated thereby, does in the describing of the relative attributes, principle and fortify the understanding against that perilous tenet of Arminianism concerning the decree passing upon good or bad foreseen, with the evil consequences following thereupon. The divine attributes, though they can neither exactly be numbered or distributed, yet for our better understanding we may consider of them as Negative, Relative, Positive. … That God is a pure and simple act without all composition, is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings.</p></blockquote>

hed in God, that is, from the divine essence or one from another really, but only notionally or virtually in our conception and in their objects in respect of the various effects thereupon: For every and all the attributes are the divine essence itself, according to that received proposition, ‘Whatsoever is in God, is God.’ (Fenner, Theol., bk. 1, ch. 3; Alsted, Theol., sect. 3, locus 2; Zanchi, Of the Nature of God, bk. 2, ch. 5, quest. 2) And this is the reason why some well describe the attributes from the essence of God: which manner of description, besides many useful notions clearly intimated thereby, does in the describing of the relative attributes, principle and fortify the understanding against that perilous tenet of Arminianism concerning the decree passing upon good or bad foreseen, with the evil consequences following thereupon. The divine attributes, though they can neither exactly be numbered or distributed, yet for our better understanding we may consider of them as Negative, Relative, Positive. … That God is a pure and simple act without all composition, is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings.”

— John Norton, The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 3-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+divine+attributes+are+certain+essential+properties%2C+which+God+is+pleased+in+Scripture+to+ascribe+or+attribute+unto+Himself%3B+they+are+also+called+the+perfections+of+God%2C+or+divine+predications+or+titles.+They+are+not+distinguished+from+the+essence+really%2C+but+notionally%3B+that+is%2C+they+are+not+distinguished+at+all+in+God%2C+but+only+to+us-ward%2C+according+to+our+manner+of+conceiving.+All+the+attributes+in+God+are+one+and+the+same+perfection.+It+is+better+said+of+God+that+He+is+his+attributes+than+that+He+has+attributes%3A+The+attributes+are+not+distinguished+in+God%2C+but+in+our+manner+of+understanding%2C+who%2C+being+unable+to+comprehend+that+mere+act+at+once%2C+do+conceive+thereof+after+the+manner+of+many+acts.+%28Est+inadequatus+conceptus+sed+non+falsus+%5BIt+is+an+inadequate+concept%2C+but+not+false%5D.+See+Weems%2C+Of+the+Image+of+God+in+Man%2C+ch.+13%29+The+sun%2C+when+it+is+perpendicular%2C+had+it+an+eye%2C+would+behold+all+that+at+once+which+we%2C+by+reason+of+the+inadequateness+and+unproportionableness+of+our+sight%2C+are+necessitated+to+view+by+parts.+In+God+all+things+are+one+and+the+same%2C+according+to+the+nature+of+God%3B+though+out+of+God+%5Bthey+appear%5D+many+and+diverse%2C+according+to+their+own+proper+and+created+nature.+The+same+heat+in+the+sun+produces+diverse+effects+according+to+the+various+disposition+of+the+objects%3A+hardness+in+clay%2C+softness+in+wax%2C+life+in+insects+and+plants%2C+etc.+The+same+lines+are+one+in+the+center%2C+but+distinguished+and+multiplied+in+the+circumference.+Water+that+is+the+same+in+the+sea%2C+out+of+the+sea+is+variously+and+diversely+qualified%3A+sweet%2C+bitter%2C+sulfureous%2C+etc.+The+matter+in+the+liver+is+the+same+but+the+four+humors+of+blood%2C+choller%2C+melancholy+and+phlegm+that+proceed+from+thence+are+very+diverse.+The+soul+which+is+one+and+the+same+produces+very+differing+effects%2C+as+appears+in+the+operations+of+the+understanding%2C+will%2C+and+affections.+The+sum+is%3A+The+attributes%2C+as+was+said+before%2C+are+not+distinguished+in+God%2C+that+is%2C+from+the+divine+essence+or+one+from+another+really%2C+but+only+notionally+or+virtually+in+our+conception+and+in+their+objects+in+respect+of+the+various+effects+thereupon%3A+For+every+and+all+the+attributes+are+the+divine+essence+itself%2C+according+to+that+received+proposition%2C+%E2%80%98Whatsoever+is+in+God%2C+is+God.%E2%80%99+%28Fenner%2C+Theol.%2C+bk.+1%2C+ch.+3%3B+Alsted%2C+Theol.%2C+sect.+3%2C+locus+2%3B+Zanchi%2C+Of+the+Nature+of+God%2C+bk.+2%2C+ch.+5%2C+quest.+2%29+And+this+is+the+reason+why+some+well+describe+the+attributes+from+the+essence+of+God%3A+which+manner+of+description%2C+besides+many+useful+notions+clearly+intimated+thereby%2C+does+in+the+describing+of+the+relative+attributes%2C+principle+and+fortify+the+understanding+against+that+perilous+tenet+of+Arminianism+concerning+the+decree+passing+upon+good+or+bad+foreseen%2C+with+the+evil+consequences+following+thereupon.+The+divine+attributes%2C+though+they+can+neither+exactly+be+numbered+or+distributed%2C+yet+for+our+better+understanding+we+may+consider+of+them+as+Negative%2C+Relative%2C+Positive.+%E2%80%A6+That+God+is+a+pure+and+simple+act+without+all+composition%2C+is+evident%2C+because+of+his+perfection%3B+all+composition+supposes+imperfection%2C+because+He+is+the+first+Being.+Were+there+any+composition+in+God%2C+it+would+follow+there+were+first+and+second+in+God%3A+Something+in+God+that+were+not+first%2C+or+that+there+were+more+first+Beings.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+3-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe2e17d4f76.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href

<main class="wrap"><figure class="quote" id="q-b63ecebc69" data-kw="">
<blockquote><p>As for those who refuse to take part in the worship of God altogether, as the Brownists and others, let them bear their shame before men. Their peace will be small while they sit at home with their own bare reading for their diet and scorn the best liberties of the preached word, prayer, and the sacraments in the public assemblies. For so they have confessed before the magistrate that having absented themselves from public meetings for the whole month or quarter, they sat at home and read by themselves. Let all judge by what spirit they are led.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-rogers.html">Richard Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holy Helps for a Godly Life</cite>, ed. Brian G. Hedges (1603; Grand Rapids, MI: Reformation Heritage Books, 2018), pp 31-32.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-71d73b837e" data-kw="">
<blockquote><p>But if we prove indeed that it [the Anglican Liturgy] is ‘defective and faulty, that you bring for an offering to God,’ when you [bishops] or your neighbors have a better, which you will not bring, nor suffer them that would (Mal. 1:13) and that you call evil good in justifying its blemishes, which in humble modesty we besought you to amend, or excuse us from offering, then God will better judge of the unlawful act than you [bishops] have done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leading English Presbyterian &amp; Independent Ministers</cite>, The Grand Debate between the most reverend Bishops &amp; the Presbyterian Divines appointed by His Sacred Majesty... (London, 1661), ‘The Papers’, p. 35 This was at the Savoy Conference (1661). About half the ministers were Westminster divines., p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-af95c11a73" data-kw="">
<blockquote><p>Look even to the Synod of Ulster. While that church was unfaithful to her Lord, and had allowed her standards to fall into disuse; error, it is admitted, crept into and devastated her borders. But fearless men arose within her to “contend for the faith,” and uplift again her ancient testimony, and now, having shaken off the incubus that prostrated her energies, she is walking forth over the land with brightening vision and buoyant tread, having favour with her Lord, and going forth to his help against the embattled hosts of the mighty.

Her past redemption from error she achieved, her present steadfastness in the truth she maintains, and all without the aid of a liturgy. How? By the blessing of God on the means she used, not the “conservative resource” of preaching merely, but the resumption of her ancient formularies, and the exercise of a discipline which the Presbyterianism of her government enabled her to wield.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-porter-goudy.html">Alexander Porter Goudy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse IV. Worship of the Presbyterian Church in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

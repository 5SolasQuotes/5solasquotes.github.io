<main class="wrap"><figure class="quote" id="q-cd6778a98d" data-kw="">
<blockquote><p>And are there not others, though I hope but a few, who being enlightened to see their misery, by reason of the guilt of sin, though not by reason of the filth of sin, and hearing of justification freely by grace, through the redemption which is in Jesus Christ, do applaud and magnify that doctrine, following them that do most preach and press the same, seeming to be, as it were, ravished with the hearing thereof, out of a conceit that they are by Christ freely justified from the guilt of sin, though still they retain the filth of sin? There are those that content themselves with a gospel knowledge, with mere notions in the head, but not in the heart; glorying and rejoicing in free grace and justification by faith alone; professing faith in Christ, and yet are not possessed of Christ; these are they that can talk like believers, and yet do not walk like believers; these are they that have language like saints, and yet do have conversation like devils; these are they that are not obedient to the law of Christ, and therefore ae justly called Antinomians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity, 41.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7610f0052e" data-kw="">
<blockquote><p>Therefore, “the law entered,” [Rom 5:20] that Adam’s offence and their own actual transgression might abound, so that now the Lord saw it needful, that there should be a new edition and publication of the covenant of works, the sooner to compel the elect unbelievers to come to Christ the promised seed, and that the grace of God in Christ to the elect believers might appear the more exceeding glorious. So that you see the Lord’s intention therein was, that they, by looking upon this covenant, might be put in mind what was their duty of old, when they were in Adam’s loins; yea and what was their duty still, if they would stand to that covenant, and so go the old and natural way to work; yea, and hereby they were also to see what was their present infirmity in not doing their duty:f that so they seeing an impossibility of obtaining life by that way of works, first appointed in Paradise, they might be humbled, and more heedfully mind the promise made to their father Abraham, and hasten to lay hold on the Messiah, or promised seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: An Explication of the Assembly’s Shorter Catechism, ed. Samuel M‘Millan, vol. 7 (Aberdeen: George and Robert King, 1850) 202–03. From Boston’s notes on The Marrow of Modern Divinity.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><figure class="quote" id="q-77b22516c1" data-kw="">
<blockquote><p>[About the Church of England:] She is the very eye of all the Churches, the peculiar of Christ, the refuge of the afflicted, the arsenal of the weak, the storehouse of the poor, the standard of better hope… [Diodati laments that] in the civil wars this illustrious fold of Christ should be torn in pieces, not by wild beasts indeed; and plundered, though not by robbers; but by the sheep themselves enraged against one another: A thing without example, and never heard of before in the Reformed Churches. We are all struck with horror when we hear of the battles that are fought by the people against their king; by brethren against brethren; by children against their parents; and by the flock of Christ against one another, and against the shepherds themselves.</p></blockquote>

ank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-16497d3565" data-kw="">
<blockquote><p>Let none of us be like the proud and hypocritical Pharisees, who thought to cloke their real impieties in neglecting works of mercy and peace by a pretence of zeal for the minute circumstances of external worship and discipline; but let us offer to God the sacrifices of a humble and contrite heart, and ‘not forget to do good and communicate, for with such sacrifices God is well pleased,’ (Heb. 13:16) and then He will accept our praises, and answer our prayers with a Misericordiam volo: ‘I will have mercy upon you, and heal your land.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Misericordiam Volo: or the Pharisees’ Lesson, showing the Impiety &amp; Unreasonableness of contending for Outward Forms &amp; Ceremonies to the Violation of Obedience, Charity &amp; the Public Peace 52 pp. in The Character of a Separatist, or Sensuality the Ground of Separation... (London: Kettilby, 1677)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><figure class="quote" id="q-dc76ba989f" data-kw="">
<blockquote><p>Zanchi: In things indifferent something is to be yielded to the weaker, and that for a time; namely, until they be taught the truth. For if after that the truth is sufficiently and clearly laide abroad unto them so as being convicted they have nothing more what they may object and yet will notwithstanding stick in doubt; sure their infirmity is not to be nourished by their dissembling with them or winking at them. For this is rather strong obstinacy then weakness; Of Redemption, ch. 17, fol. 493. Beza in a case of [the threat of] deprivation [of one’s office as minister] advises to conform; yet before they conform he thus counsels them: That both the pastor and the flock sin not against their conscience (presupposing the purity of doctrine to be left entire:) We persuade the pastors that after they have freed their conscience, both before the King’s Majesty and the bishops, by a modest (as it becomes Christians to be free from all tumult and sedition) and yet weighty protestation (according as the greatness of the case requires:) they then do openly press unto their flocks those things which do tend to take away the offence arising from conformity, and do withal discreetly and peaceably give diligent endeavor for the amendment of these abuses, as the Lord shall offer occasion (and so to conform); Epistle 12, fol. 99.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, p. 196</span></figcaption>

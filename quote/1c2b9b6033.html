<main class="wrap"><figure class="quote" id="q-1c2b9b6033" data-kw="">
<blockquote><p>First, all that belong to the covenant and church of God are to be baptized. But the children of christians, as well as adults, belong to the covenant and church of God. Therefore they are to be baptized as well as adults. The major proposition is proven from the command of Christ, which requires the whole church to be baptized. “Go, and teach all nations, baptizing them,” &amp;c. And Paul says: “By one Spirit are we all baptized into one body.” (1 Cor. 12:13.) The minor proposition is clear from the covenant itself in which God declares, “I will be a God unto thee and thy seed after thee:” and from what Christ says: “Suffer little children to come unto me; for of such is the kingdom of heaven.” (Gen. 17:7. Matt. 19:14.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Cincinnati, OH: Elm Street Printing Company, 1888), 366.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c0ff4ccae" data-kw="">
<blockquote><p>The subject of baptism is the faithful people of God, without any distinction of nation, sex, or age. Indeed, infants of the covenanted must be baptized as equally as the infants of the covenanted were once circumcised because the promise made to Abraham and His seed, Christ having been revealed, was not diminished but enlarged through the mouth of Peter: “The promise is yours and your children’s” (Acts 2:39). In this argument St. Peter commanded each one (ἕκαστον) to be baptized (Acts 2:38). Indeed, the Israelites, who once were “near,” and the faithful from the Gentiles, who once were “far off” (Acts 2:39), are held with no distinction under the New Testament (Gal. 3:28). For the children of the faithful Gentile, notwithstanding infidelity of the other parent, are “holy” (1 Cor. 7:14). Therefore, since baptism as equally as circumcision seals that covenant for those who believe, into which their children have been received as holy, in the same right baptism is administered to these as circumcision once was to those. For Christ commanded “to make disciples and to baptize the nations,” with no distinction of age (Matt. 28:19). Therefore, those who are born in the lap of the church are fit at the age of infant to begin the institution and must be baptized as equally as their parents. Therefore, the apostles baptized whole “households” (1 Cor. 1:16). (XXII–XXVI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-heidegger.html">J.H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, 24.9, trans. Casey Carmichael, Classic Reformed Theology (Reformation Heritage Books, 2019), 179.</span></figcaption>

</figure><figure class="quote" id="q-98803b87ac" data-kw="">
<blockquote><p>[responding to Art. 1 of the Schleitheim Confession]…But I reply, first of all, that infant baptism is not a recent introduction, nor are its origins traceable to the papal church. For I say that it has always been a holy ordinance observed in the Christian church. There is no doctor, however ancient, who does not attest that it has always been observed since the time of the apostles. I wanted to touch on this point in passing for the sole reason of informing the simple that it is an impudent slander for these fanatics [the Anabaptists] to make others believe that this ancient practice is a recently forged superstition and to feign that it derives from the pope. For the whole ancient church held to infant baptism long before one ever knew about the papacy or had ever heard of the pope. Besides, I do not ask antiquity to legitimate anything for us unless it is founded on the Word of God. I know that it is not human custom that gives authority to the sacrament, nor does its efficacy depend on how men regulate it. Let us come, therefore, to the true rule of God, of which we have spoken, that is to say, his Word, which alone ought to hold here. Their view is that one ought to administer baptism only to those who request it, to those who have made a profession of faith and repented. And thus infant baptism is the invention of man, opposed to the word of God. In order to prove this they cite the passage from Saint Matthew’s last chapter, where Jesus Christ says to his apostles,”Go and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Spirit.” To which they add this sentence from the 16th chapter of Mark: “Whoever believes and is baptized will be saved.” That to them seems an invincible foundation. … We see that our Lord acted the same way toward Abraham with regard to circumcision. For before he conferred this sign on him he received him into his covenant and instructed him in his Word. But we must now note that when a man is received of God into the fellowship of the faithful, the promise of salvation which is given to him is not for him alone but also for his children. For it is said to him: “I am thy God, and the God of thy children after thee.” Therefore the man who has not been received into the covenant of God from his childhood is as a stranger to the church until such time as he is led into faith and repentance by the doctrine of salvation. But at the same time his posterity is also made a part of the family of the church. And for this reason infants of believers are baptized by virtue of this covenant, made with their fathers in their name and to their benefit. Herein, thus, lies the mistake of the poor Anabaptists. For since this doctrine must precede the sacrament, we do not resist it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brief Instruction for Arming All the Good Faithful Against the Errors of the Common Sect of the Anabaptists in John Calvin: Treatises Against the Anabaptists and Against the Libertines</cite>, trans., Benjamin Wirt Farley (Grand Rapids: Baker, 1982), 44–47.</span></figcaption>

<blockquote><p>All ministers must be admonished to be more careful to instruct the ignorant than ready to satisfy their appetites; and more sharp in examination than indulgent, in admitting to that great mystery such as are ignorant of the use and virtue of the same. And therefore we think that the administration of the Table ought never to be without that examination pass before, especially of those whose knowledge is suspect. We think that none are apt to be admitted to that mystery who cannot formally say the Lord’s Prayer, the articles of the belief, and declare the sum of the law… Every master of household must be commanded either to instruct, or else cause [to] be instructed, his children, servants, and family, in the principles of the Christian religion; without the knowledge whereof ought none to be admitted to the Table of the Lord Jesus. For such as are so dull and so ignorant, that they can neither try themselves, neither yet know the dignity and mystery of that action, cannot eat and drink of that Table worthily. And therefore of necessity we judge it, that every year at least, public examination be had by the ministers and elders of the knowledge of every person within the church: to wit, that every master and mistress of household come themselves, and their family (so many as are come to maturity), before the ministers and elders, to give confession of their faith, and to answer to such chief points of religion as the ministers shall demand. Such as are ignorant in the articles of their faith; understand not, nor cannot rehearse the commandments of God; know not how to pray, neither whereinto their righteousness consists, ought not to be admitted to the Lord’s Table.</p></blockquote>

— Scottish First Book of Discipline, The Ninth Head, Concerning the Policy of the Church">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll+ministers+must+be+admonished+to+be+more+careful+to+instruct+the+ignorant+than+ready+to+satisfy+their+appetites%3B+and+more+sharp+in+examination+than+indulgent%2C+in+admitting+to+that+great+mystery+such+as+are+ignorant+of+the+use+and+virtue+of+the+same.+And+therefore+we+think+that+the+administration+of+the+Table+ought+never+to+be+without+that+examination+pass+before%2C+especially+of+those+whose+knowledge+is+suspect.+We+think+that+none+are+apt+to+be+admitted+to+that+mystery+who+cannot+formally+say+the+Lord%E2%80%99s+Prayer%2C+the+articles+of+the+belief%2C+and+declare+the+sum+of+the+law%E2%80%A6+Every+master+of+household+must+be+commanded+either+to+instruct%2C+or+else+cause+%5Bto%5D+be+instructed%2C+his+children%2C+servants%2C+and+family%2C+in+the+principles+of+the+Christian+religion%3B+without+the+knowledge+whereof+ought+none+to+be+admitted+to+the+Table+of+the+Lord+Jesus.+For+such+as+are+so+dull+and+so+ignorant%2C+that+they+can+neither+try+themselves%2C+neither+yet+know+the+dignity+and+mystery+of+that+action%2C+cannot+eat+and+drink+of+that+Table+worthily.+And+therefore+of+necessity+we+judge+it%2C+that+every+year+at+least%2C+public+examination+be+had+by+the+ministers+and+elders+of+the+knowledge+of+every+person+within+the+church%3A+to+wit%2C+that+every+master+and+mistress+of+household+come+themselves%2C+and+their+family+%28so+many+as+are+come+to+maturity%29%2C+before+the+ministers+and+elders%2C+to+give+confession+of+their+faith%2C+and+to+answer+to+such+chief+points+of+religion+as+the+ministers+shall+demand.+Such+as+are+ignorant+in+the+articles+of+their+faith%3B+understand+not%2C+nor+cannot+rehearse+the+commandments+of+God%3B+know+not+how+to+pray%2C+neither+whereinto+their+righteousness+consists%2C+ought+not+to+be+admitted+to+the+Lord%E2%80%99s+Table.%E2%80%9D%0A%0A%E2%80%94+Scottish+First+Book+of+Discip <blockquote><p>XI. (7) Because the fathers acknowledged the necessity of infant baptism and approved its propriety by their practice. Justin Martyr mentions it (“Quaestiones et Responsiones ad Orthodoxos,” Q. 56 in Opera quae feruntur omnia [ed. J.C.T. de Otto, 1881], v. 3, Pt. 2, p. 81); cf. Origen (Commentariorum in Epistolam … ad Romanos 5.8 [PG 14.1037–42]), Cyprian (Letter 58, “To Fidus” [ANF 5:353–54]), Jerome (Against the Pelagians 3.18 [NPNF2, 6:482]), Cyril of Alexandria (Glaphyrorum in Leviticum [PG 69.558–62]). Augustine, often, where he relates that the Pelagians had not dared to deny the baptism of infants because they saw too clearly that this would place them in opposition to the whole church (The Literal Meaning of Genesis 10.23 [ACW 42:127]; On Original Sin 2.44 [40] [NPNF1, 5:253–54]; On Forgiveness of Sins and Baptism 1.35 [25*] [NPNF1, 5:30]). The same thing was confirmed also by many decrees of Synods: of Carthage, in the year 418* (Hefele, 2:458); of Mileve, in the year 402* (cf. Canon 5, Hefele, 2:429); of Gerunda in the year 517* (cf. Canon 5, Hefele, 4:105) and of others which Pamelius in his notes to Cyprian notices (“Epistola LXIV,” Opera [1682], pp. 158–60).</p></blockquote>

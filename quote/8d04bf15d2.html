<main class="wrap"><figure class="quote" id="q-8d04bf15d2" data-kw="">
<blockquote><p>Enclosers; that pretend a distinction of possessions, a preservation of woods, indeed to make better and broader their own territories, and to steal from the poor commons; these are horrible thieves.

The poor man’s beast is his maintenance, his sustenance, his life, to take food from his beast, is to take the beasts food from his belly: so he that incloseth Commons is a monstrous thief, for he steals away the poor man’s living and life; hence many a Cottager, nay perhaps Farmer, is fain (as the Indians do to Devils) to sacrifice to the lord of the soil, a yearly bribe for a nenoceat.

For though the law forbids such enclosures: yet (quod fieri non debet, factum valet) when they are once ditched in, say the law what it will, I see no throwing out: force bears out, what fraud hath borne in: let them never open their mouths to plead the Common-wealth’s benefit: they intend it as much as Judas did, when he spake for the poor: no, they are thieves, the bane of the common good, the surfeit of the land, the scourge of the poor: good only to themselves; and that in opinion only: for they do it, to dwell alone, and they dwell alone indeed: for neither God nor good Angel keeps them company: and for a good conscience, it cannot get thorow their quick-sets.

These are thieves, though they have enclosed their theft, to keep the Law out, and their wickedness in: yet the day shall come, their lands shall be thrown out, their lives thrown out, their souls thrown out: their lands out of their possessions, their lives out of their bodies, their souls out of heaven; except repentance and restitution prevail with the great Judge for their pardon: mean time, they are thieves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The white devil, or The hypocrite uncased: In a sermon preached at Paul’s Cross, March 7. 1612</cite>, (London: Melchisedech Bradwood, 1613), pp 46-47.</span></figcaption>

</figure><figure class="quote" id="q-a97faecc2b" data-kw="">
<blockquote><p>Rutherford’s position is that God by creating rational creatures… at once creates the common principles of the natural law. Since they are part of the very constitution of the rational creature these are unable to be effaced… However, taking up Menchaca’s own Ockhamist position, Rutherford agrees that it would have been quite possible for God to have created another species of rational creature distinct from man to whom he gave a diverse natural law… Rutherford’s position is that the love of God and the subjection of the creature to the Creator is an essential part of any kind of natural law. Rutherford therefore concurs with the prominent Dutch Reformed theologian Gisbertus Voetius that the dependency of the rational creature on its Creator in morality and in order to right reason is so necessary that its opposite implies a contradiction… this law… is immutable and antecedent to every act of the divine will [stemming from the divine nature], forming the cornerstone of the natural law. What is left open to the divine decree is simply to select whether a particular act or its omission should be considered as due subjection and obedience to God, or not. Thus while the divine will establishes the moral status of a complex act, it always does so against the backdrop of God’s own nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

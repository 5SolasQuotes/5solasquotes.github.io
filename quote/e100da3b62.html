<main class="wrap"><figure class="quote" id="q-e100da3b62" data-kw="">
<blockquote><p>Some vows are no more worship for the matter of them (and that only is left unto choice, not the manner) than fighting in a lawful war upon the bond of an oath is religious worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), ch. 2, section 2, pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3aac0fad19" data-kw="">
<blockquote><p>Now if any pretense to liberty in mine own behalf or others does become an occasion of discontentedness, of strife, of murmurings and of sullenness of spirit, whereby I am discomposed so that I cannot serve all men freely in the duties of my calling, then I am a transgressor of the apostle’s rule, and walk not according to the law of liberty in the kingdom of Jesus Christ: because I suffer my conscience to be under the power of some other relations to liberty which I have not made subordinate unto the relations of Christianity, which nevertheless cannot be prejudged by any oaths of an inferior concernment, according to the rule, Quod in juramento semper jus superioris intelligitur exceptum [That in an oath the right of something superior is always excepted], and in our National [Solemn League &amp;] Covenant, the obligation towards the maintaining of the liberties of the kingdom is expressed to be only in order to our calling and place. Now if we do not reckon our spiritual calling as Christians, and our place in the ministry to be the rule according to which that Engagement and the endeavors which we owe to our civil freedoms are to be managed, I know not what it is in our sphere of the ministry that can be meant by the restriction of that performance to our calling and place. I say then, that by the express words of the Covenant, I am obliged not to make my plea for civil liberties (if infringed) such as may prejudge my Christian or ministerial liberties; as if it should be lawful for me to forgoe these for want [lack] of satisfaction in those, or think it unlawful for me to make use of these when I conceive my self deprived of those.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Objections Against the Taking of the Engagement Answered</cite>, … (London, 1650), p. 14</span></figcaption>

</figure><figure class="quote" id="q-7ca521123f" data-kw="">
<blockquote><p>Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations Divine &amp; Moral</cite>, … (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

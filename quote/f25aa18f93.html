<main class="wrap"><figure class="quote" id="q-f25aa18f93" data-kw="">
<blockquote><p>But beware that you take not decent or comely ceremonies for essential parts of worship. The apostle urging women in the Church of Corinth to be covered, 1 Cor. 11:6, that which they might think was too much preciseness in him (for we may be apt to suppose he discontented them that did otherwise) was decent in his eyes, and commanded to be done; but not making it a point of worship, nor pressing it upon them as part of God’s service, declares that ceremonies may be used in, but ought ever to be differenced from the worship performed. In brief, whatever Ceremony of what nature or kind soever that is enjoined, that is not contrary to the Word of God, and by the officers of the Church thought comely to be used, as tending to make that worship then used to be the more reverenced and esteemed by the performers, is not to be opposed. This age discovers, what a disrespect, contempt, undervaluinig thoughts most men have (even good men in a great measure) of the house of God, table of God, service of God and servants of God, since decent and comely ceremonies were banished from the Church of God: and where such ceremonies are enjoined, and thou separatest, thou art guilty of renting the seamless coat, there being no cause for making that separation justifiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-annand.html">William Annand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fides Catholica, or, The Doctrine of the Catholic Church in Eighteen Grand Ordinances</cite>, … (London, 1661), ch. 1, question 6, p. 82 Annand (1633–1689) was born and educated in Scotland (University of Aberdeen, 1649) and took another degree at Oxford in 1655. He was ordained by an Irish bishop and wrote the following as an Anglican minister against the English puritans upon the restoration of King Charles II. He then served as a Scottish minister from 1663-1689.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d68aa6d6c" data-kw="">
<blockquote><p>To those who, in a narrow spirit, insist on having divine prescription for the most insignificant details of religious life and public worship, this appeal to ‘nature itself,’ [v. 14] as a great guide in relation to the decencies of public worship, should read a wholesome lesson. Nature, though uniform in its essential features, varies in all that is subordinate in different regions and at different periods. In matters of feeling, taste, and decorum, as to the way in which the relation of the sexes should be expressed, eastern and western ideas notoriously and widely differ, and they should be allowed their natural and proper development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Cor. 11 in A Popular Commentary on the New Testament, ed. Philip Schaff, p. 203</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-17eeef07c0" data-kw="">
<blockquote><p>We must understand that in these civil things that might be decent and fit in one country (and consequently commanded of God) which in another country is utterly undecent, and consequently forbidden. It was a great sin among the Corinthians for a woman to come into the congregation with her head uncovered, that is, without a vail to cover her whole head, 1 Cor. 11:5. In our congregations (because it is undecent) it were a sin for a woman to come so attired. In which respect, though we have oft in the New Testament mention of fasts both public and private, of sackcloth used in them, we have no mention at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Fasting &amp; Prayer, &amp; Humiliation for Sin Delivered in Sundry Sermons</cite>, ... (London, 1633), Sermon 3 (1625), pp. 50-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-9201d7f829" data-kw="">
<blockquote><p>2nd Point. …whereby we have good light for the expounding of a place in Paul, 1 Cor. 11:10, saying, that the woman ought to have power over her head, that is, be covered, because of the angels. Whereby ‘angels’ may well be understood the preachers and ministers of the Gospel. And the reason of that precept may be this: Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection. And therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, according to the custom of their country in other assemblies, to signify their submission and reverence unto the ministry of the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation</cite>, … (d. 1602; London, 1606), ch. 1, pp. 69-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

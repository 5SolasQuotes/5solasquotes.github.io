<main class="wrap"><figure class="quote" id="q-c44925171f" data-kw="">
<blockquote><p>Rash prejudices engaging men in opposition, they will not own the truth when represented to them; having hated it without knowledge, they hate it against knowledge, and so are hardened against the ways of God; which is the case of many, who, in a blind zeal, have appeared against the public ministry and ordinances, and, being engaged, are loth to strike sail and lay down their defiance, when sufficient conviction is offered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a911fc282" data-kw="">
<blockquote><p>Fifthly, when you are to choose what minister or church you will statedly have your ordinary communion with, you should not prefer a less reformed church or a less worthy pastor, or one that is erroneous, before a better, but choose that which is most to your true edification. Sixthly, if you live under a worse and unreformed Church, or unprofitable minister, if necessity hinder not, you may remove your dwelling to a better. Seventhly, and where churches are near and there is no great hurt or disorder [that] will follow it, you may join with another church without removing your dwelling: But this you may not do when the hurt to the public is like to be greater than the good to you. Eighthly, and you must not conclude that the more faulty church and minister may not lawfully be communicated with though for your benefit you choose a better, for this is the true crime of sinful separation. But surely a man’s soul is so precious that all men should prefer the greatest helps for their salvation before the less; and think no just means too dear to purchase them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670) | pt. 1, Direction 36</cite>, p. 204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

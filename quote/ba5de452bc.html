<main class="wrap"><figure class="quote" id="q-ba5de452bc" data-kw="">
<blockquote><p>Adhere constantly, cordially, and honestly, to the covenanted principles of the church of Scotland, and to that testimony which hath been lifted up for them. I fear a generation is rising up, which will endeavour silently to let slip these matters, as if they were ashamed to hold them fast, or even to speak of them. May the Lord forbid, that any of you should ever enter into this confederacy against Jesus Christ and his cause! – This from a dying father and minister, and a witness for Christ.

JOHN BROWN</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Author s Dying Advice to His Younger Children’ in John Brown and Ebenezer Brown (eds), Select Remains of the Rev. John Brown, Late Minister of the Gospel at Haddington</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75aa907c5f" data-kw="">
<blockquote><p>V. When I can have better, caeteris paribus [other things being equal], without greater hurt than good, I prefer it; and only use occasional local communion with the [Anglican] liturgy-churches, as I would do with strangers were I in foreign lands.

VI. Where I can have no better without more hurt than good, I communicate constantly and only with the parish-church where I live, as to local-communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 225-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-43b91ea3d2" data-kw="">
<blockquote><p>Now, as formerly, I durst not but yield all true allegiance to the civil magistrate: so after this I durst not refuse any longer to hear the ministers of the presbyterian establishment who preach precious Christ, our dear Redeemer, to be the way, the truth, and the life… Under the ministry of some of which worthy minsiters I lived many years… …till… the much to be lamented death of the eminently religious, brave, and valiant William, Prince of Orange, King of Great Britain, our never to be forgotten kind and compassionate deliverer, who died, March 1702… Thus, from the time I left the dissenters, I wrestled through all the reign of great King William and Queen Anne, enjoying the gospel, clearly and faithfully preached by several worthy ministers, to the great edification and comfort of my soul, meditating frequently on the Scriptures, and repeating the Shorter Catechism to myself, all which I found much sweetness and satisfaction in…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted</cite>, (Edinburgh: Oliphant, 1827), pp. 240-42</span></figcaption>

</figure><figure class="quote" id="q-c84eca55da" data-kw="">
<blockquote><p>I had read the writings of those excellent men of God against Brownists, or Separation heretofore, who then were the Non-Conformists that did suffer so much for Reformation: He that will read what is written by Mr. John Paget, Mr. William Bradshaw, Mr. Gifford, Mr. Hildersham, Mr. Brightman, Mr. John Ball, Mr. Rathband, Dr. Ames, First and Second Manuduction, etc. and lately Mr. John Tombes, the pillar of the Anabaptists, and for [occasional] hearing by Mr. Philip Nye may see enough for just satisfaction, especially in Mr. Ball’s Trial of Separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, p. 230</span></figcaption>

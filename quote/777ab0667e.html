<main class="wrap"><figure class="quote" id="q-777ab0667e" data-kw="">
<blockquote><p>The worship that theology propounds is called “reasonable” (Rom. 12:1) because it has been arranged according to the laws of right reason.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6165730314" data-kw="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned; at least, we take it for granted in this inquiry that infallible inspirations in the discovery of things not before revealed are ceased in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-da2a25cf96" data-kw="">
<blockquote><p>We should, in our own churches, keep to apostolic precedent, and follow the rule of Christ in all things. No venerable name is sufficient authority for going aside from Holy Scripture. &quot;To the law and to the testimony;&quot; if a doctrine or a ceremony is not there, it is nowhere for you and for me. Our sole authority is the Word of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An All Around Ministry</cite>, ch. 12, The Minister in These Times, pp. 404–405</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/the-church/churchs-authority-and-power.html">Church&#x27;s Authority and Power</a></span></div>
<div class="actions"><button class="copy" data-copy="“We should, in our own churches, keep to apostolic precedent, and follow the rule of Christ in all things. No venerable name is sufficient authority for going aside from Holy Scripture. &quot;To the law and to the testimony;&quot; if a doctrine or a ceremony is not there, it is nowhere for you and for me. Our sole authority is the Word of the Lord.”

</figure><figure class="quote" id="q-0ca44fe101" data-kw="">
<blockquote><p>Paul says that all Scripture is inspired by God (πᾶσαν γραφὴν esse θεόπνευστον), and useful for teaching, reproof, correction, and training in righteousness, that the man of God may be complete, equipped for every good work (II Tim. 3:16–17). Here lie a number of arguments for the perfection of Scripture. First that the sacred writings can instruct for salvation (v. 15). Who would ask for more than that we be made capable of salvation? Second, it is useful for all purposes, theoretical and practical: for teaching faith, and for guiding conduct. Third, it can make the man of God complete for every good work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-51d6b04ae1" data-kw="">
<blockquote><p>The fact is, that the doctrine of Development has to encounter a great historical difficulty, which it can only remove by an enormous assumption. The doctrine is, that Christ&#x27;s original revelation contained seeds and germs of truths destined, under the Divine guidance, to expand to a certain definite form. If this be true, that expansion would take place wherever these germs were planted. It does not depend on where a tree is planted, whether it springs up a cedar or a bramble-bush, or whether it brings forth figs or grapes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture II</span></figcaption>

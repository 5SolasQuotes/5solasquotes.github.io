<main class="wrap"><figure class="quote" id="q-092a5ab41b" data-kw="">
<blockquote><p>Princes should do well to apply their power and authority to the extirpation and rooting out of Popes, Cardinals, Patriarchs, Primates, Archbishops, Bishops, Suffragans, Abbots, Deans, Vice-Deans, Priors, Arch-deacons, Subdeacons, Chancelors, Chantours, Subchantours, Exorcists, Monks, Eremits, Acolytes, and all the whole rabble of Popish orders which undo the Church and work more mischief in the earth than can be either soon seen or shortly told.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies... (1637), pt. 3, ch. 8, Digression 1, ‘Of the vocation of men of Ecclesiastical order’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84f6615a61" data-kw="angel power limits">
<blockquote><p>Whatever the power of the angels (the greatest of all created power) may be, still it is finite and circumscribed by certain limits, so that although they can do many things, still they cannot do all things (since this power to do all things belongs to the omnipotent God alone). Scripture calls them excelling in strength (Ps. 103:20) and mighty angels (2 Thess. 1:7), yet their power is created and limited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.5.2</span></figcaption>

</figure><figure class="quote" id="q-03ce32e19e" data-kw="">
<blockquote><p>We cannot expel demons with certain ceremonies and words, as Jesus Christ, the prophets, and the apostles did. All we can do is, in the name of Jesus Christ, to pray the Lord God, of his infinite mercy, to deliver the possessed persons. And if our prayer is offered up in full faith, we are assured by Christ himself (John 16:23) that it will be efficacious, and overcome all the devil’s resistance. I might mention many instances of this. But we cannot of ourselves expel the evil spirits, nor must we even attempt it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk (1556), ‘Of the Devil and His Works’, section 625</cite></span></figcaption>

</figure><figure class="quote" id="q-bbd51f384d" data-kw="fall of angels">
<blockquote><p>What was the sin of the angels by which they are said to have rebelled against God? Sin in particular is distinguished with regard to the subjects in which it inheres: the sin of the angels, who became devils by it; and the sin of men. To no purpose is it inquired how angels could sin. It is evident from Scripture that they did sin and reason persuades us that they could fall into sin since they were created capable of falling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.5.1–2</span></figcaption>

</figure><figure class="quote" id="q-369168cb1d" data-kw="">
<blockquote><p>When Rainer Decker was researching a sensational seventeenth-century German witchcraft trial, he discovered, much to his surprise, that in this case the papacy functioned as a force of skepticism and restraint. His curiosity piqued, he tried unsuccessfully to gain access to a secret Vatican archive housing the records of the Roman Inquisition that had been sealed to outsiders from its sixteenth-century beginnings. In 1996 Decker was one of the first of a small group of scholars allowed access… Witchcraft and the Papacy is based on these newly available materials and traces the role of the papacy in witchcraft prosecutions from medieval times to the eighteenth century. Decker found that although the medieval church did lay the foundation for witch hunts of the sixteenth to eighteenth centuries, the postmedieval papacy, and the Roman and Spanish Inquisitions, played the same kind of skeptical, restraining role during the height of the witch-hunting frenzy in Germany and elsewhere in Europe… Witchcraft and the Papacy overturns a large body of scholarship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rainer-decker.html">Rainer Decker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Witchcraft &amp; the Papacy: An Account Drawing on the Formerly Secret Records of the Roman Inquisition Ref (Univ. of Virginia Press, 2008) 262 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

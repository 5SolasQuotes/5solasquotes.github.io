<main class="wrap"><figure class="quote" id="q-3b72859a83" data-kw="">
<blockquote><p>The second conclusion pretended to be drawn from this [Rev. 2:21] is that the Lord has a universal will to have all men saved, seeing He gives her time to repent. This we say does not follow hence: For: … 4. It will not follow Christ wills persons to repent; therefore He wills their salvation: because He may be said to will them to repent when He requires it of them as their duty: and thus their duty of repenting is the immediate object of his revealed and preceptive will: but a person’s salvation is the proper object of his will of good-pleasure, or of his decreeing and purposing will. And no otherways can He be said to will such persons’ salvation (because He commands them to repent) than this, to wit, that in His Word He has signified repentance to be such a person’s duty, and that He has appointed a connection between repentance and salvation; which still relates to his revealed will: even as when God made the first Covenant with Adam, it might be said that He willed Adam to be holy, and that by that Covenant He had made a connection between holiness and life; yet it is not proper to say that the Lord willed life to Adam upon that condition, because that looks to the event and respects the Lord’s will of purpose: which cannot but be effectual. And if the Lord’s willing of men (at least such as are under his ordinances) to be saved be thus understood as including only the duty which God lays upon men and the connection that He has made between it and salvation in his Word, it may be admitted: but if it be extended to any antecedent will in God Himself, distinct from that which is called His revealed will, this place and such like will give no ground for such an assertion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), ch. 2, Lecture 6, on vv. 18-29, pp. 169-70</span></figcaption>

<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination</cite>, (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2, p. 357</span></figcaption>

</figure><figure class="quote" id="q-f529867863" data-kw="">
<blockquote><p>X. We may sometimes interchange the eudokian [good-purpose of decree] for the euarestia [good-pleasure or complacency of the revealed will], when it is spoken of those things with which God is pleased because there is in them some quality or condition which agrees with the nature of God and therefore conciliates his favor…

XI. Eurestia contradistinguished from eudokian in this connection means nothing else than the mere complacency by which God approves anything as just and holy and delights in it (and besides wills to prescribe it to the creature as his most just duty). Hence it does not properly include any decree or volition in God, but implies only the agreement of the thing with the nature of God (according to which He cannot but love what is agreeable to his holiness)… … XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>

</figure><figure class="quote" id="q-57db1848de" data-kw="">
<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, trans. Johnson &amp; Fentiman (RBO, 2019) | Section 20, ‘Whether because God amiably invites and by supplications solicits, entreats and calls upon reprobates, and as He mourns over them, is grieved by them and laments on account of the disobedient, whether He, therefore, intends the obedience of them?’, pp. 57-58, ch. 2, ‘On God’; pp. 57-58</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.”

— Samuel Rutherford, Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter trans. Johnson &amp; Fentiman (RBO, 2019) | Section 20, ‘Whether because God amiably invites and by supplications solicits, entreats and calls upon reprobates, and as He mourns over them, is grieved by them and laments on account of the disobedient, whether He, therefore, intends the obedience of them?’, pp. 57-58, ch. 2, ‘On God’; pp. 57-58">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Because+out+of+the+amiable+invitation%2C+this+only+is+concluded%3A+the+simple+obligation+of+the+creature+to+obedience%2C+an+earnest+approbation+and+complacency+which+God+has+with+respect+to+the+obedience%2C+inasmuch+as+the+thing+is+holy%2C+has+been+required+of+him%2C+is+morally+pleasing%2C+and+as+it+is+unto+the+convenience+and+salvation+of+a+man.+On+account+of+this+disposition+in+God%2C+nothing+is+further+added+by+the+simple+complacency+of+God+around+obedience+except+a+certain+quasi-intention+and+vehemency+of+divine+obligation+to+the+thing%2C+which+testifies+to+the+obedience+of+all+by+an+earnestness+from+the+precept+and+from+having+obliged+men+to+the+thing%3B+and+thus+it+is+to+Him+singularly+and+vehemently+pleasing+in+his+sight+inasmuch+as+salvation+is+made+glorious+to+men%3B+but+except+He+decree+it%2C+by+the+corruption+of+men%2C+it+will+not+come+to+be.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Rutherford%E2%80%99s+Examination+of+Arminianism%3A+The+Tables+of+Contents+with+Excerpts+from+Every+Chapter+trans.+Johnson+%26+Fentiman+%28RBO%2C+2019%29+%7C+Section+20%2C+%E2%80%98Whether+because+God+amiably+invites+and+by+supplications+solicits%2C+entreats+and+calls+upon+reprobates%2C+and+as+He+mourns+over+them%2C+is+grieved+by+them+and+laments+on+account+of+the+disobedient%2C+whether+He%2C+therefore%2C+intends+the+obedience+of+them%3F%E2%80%99%2C+pp.+57-58%2C+ch.+2%2C+%E2%80%98On+God%E2%80%99%3B+pp.+57-58&amp;url=https%3A%2F%2F5solasquotes

<blockquote><p>For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.</p></blockquote>

</figure><figure class="quote" id="q-06607c4dc4" data-kw="Temptation">
<blockquote><p>That which lusts against the spirit, and by lusting tempts, and in tempting entices and draws the heart to sin, is for nature sin itself: but concupiscence in the regenerate lusts against the spirit, Gal. 5. 17. … And therefore it is sin properly: such as the fruit is, such is the tree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, Of Original Sin</span></figcaption>

</figure><figure class="quote" id="q-215040d6fd" data-kw="Author of sin Justice Satan The Fall">
<blockquote><p>Just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-debrecen.html">Synod of Debrecen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Documents of the Synod of Debrecen</cite>, 1567</span></figcaption>

</figure><figure class="quote" id="q-85b10e50c5" data-kw="">
<blockquote><p>A soule acquainted with the Gospell, knowes that there is no Property of Christ rendred more glorious therein, than that of his patience; That he should beare with so many unkindnesses, so many causelesse breaches, so many neglects of his love, so many affronts done to his Grace, so many violations of ingagements, as he doth; it manifests his Gospell to be not only the word of his Grace, but also of his patience. He suffers also from them, in all the reproaches, they bring upon his name and wayes: and he suffers in them; for in all their Afflictions, he is afflicted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Temptation</cite>, Oxford, 1658, ch. 8, p. 145</span></figcaption>

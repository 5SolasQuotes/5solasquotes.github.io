<main class="wrap"><figure class="quote" id="q-6d2ec44acf" data-kw="">
<blockquote><p>If Christ were now speaking of the cause of our salvation, the Papists could not be blamed for inferring that we merit eternal life by good works; but as Christ had no other design than to exhort his people to holy and upright conduct, it is improper to conclude from his words what is the value of the merits of works. … But we have another reply to offer, which is still more clear; for we do not deny that a reward is promised to good works, but maintain that it is a reward of grace, because it depends on adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fdfd4585cb" data-kw="">
<blockquote><p>First, I differ from them in this, that they make eternal life the reward; … whereas Scripture uniformly proclaims that it is the inheritance which falls to us by no other right than that of free adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on ch. 16</span></figcaption>

</figure><figure class="quote" id="q-46c429a35e" data-kw="">
<blockquote><p>And hence in those very passages in which the Holy Spirit promises eternal glory as the reward of works, by expressly calling it an inheritance, he demonstrates that it comes to us from some other quarter. … You see how, as it were, in formal terms they carefully caution us to attribute eternal blessedness not to works, but to the adoption of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And hence in those very passages in which the Holy Spirit promises eternal glory as the reward of works, by expressly calling it an inheritance, he demonstrates that it comes to us from some other quarter. … You see how, as it were, in formal terms they carefully caution us to attribute eternal blessedness not to works, but to the adoption of God.”

— John Calvin, Institutes of the Christian Religion, 3.18.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd%20hence%20in%20those%20very%20passages%20in%20which%20the%20Holy%20Spirit%20promises%20eternal%20glory%20as%20the%20reward%20of%20works%2C%20by%20expressly%20calling%20it%20an%20inheritance%2C%20he%20demonstrates%20that%20it%20comes%20to%20us%20from%20some%20other%20quarter.%20%E2%80%A6%20You%20see%20how%2C%20as%20it%20were%2C%20in%20formal%20terms%20they%20carefully%20caution%20us%20to%20attribute%20eternal%20blessedness%20not%20to%20works%2C%20but%20to%20the%20adoption%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.18.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46c429a35e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46c429a35e.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-83223a61ea" data-kw="">
<blockquote><p>There is nothing in the term reward to justify the inference that our works are the cause of salvation. First, let it be a fixed principle in our hearts, that the kingdom of heaven is not the hire of servants, but the inheritance of sons (Eph. 1:18); an inheritance obtained by those only whom the Lord has adopted as sons, and obtained for no other cause than this adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.2</span></figcaption>

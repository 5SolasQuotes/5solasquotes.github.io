<main class="wrap"><figure class="quote" id="q-c3e0589a64" data-kw="">
<blockquote><p>Then the true state of the question is not whether the sword be a means of conversion of men to the true faith, nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [which is denied], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers, nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty. But whether or no ought the godly and Christian prince restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), Ch. 4, ‘The state of the question of compulsion of conscience and toleration’, p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-810bf8d936" data-kw="">
<blockquote><p>But we read not” (says Erastus) “where Christ has changed those laws in the New Testament.” It is true, Christ has not said in particular: “I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated till the evening;” nor has He said particularly of every carnal ordinance and judicial law: “it is abolished.” But we conceive the whole bulk of the Judicial Law, as judicial, and as it concerned the republic of the Jews only, is abolished, though the moral equity of all those be not abolished… … But sure Erastus errs who will have all such to be killed by the magistrate under the New Testament because they were killed by him in the Old: Why, but then the whole judicial law of God shall oblige us Christians as Carolostadius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them [the malefactors], so was it a mysterious teaching of us how God hated such and such sins; and mysteries of that kind are gone with other shadows.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-d34c7ca491" data-kw="">
<blockquote><p>…obstinate heretics… scandalous and incorrigible sinners, after one and another admonition are suspended from the use of the sacraments and if they persevere in their contumacy and rebellion, they are ejected from the church, so that it is not lawful for them to join with believers in the exercise of piety. This ought not to be extended to political society… or other things due and necessary from our vocation in the economic or political state, as the Romanists wish; as if wives should be prohibited from their husbands, children from parents, servants from masters, subjects from rendering obedience to excommunicated princes, to which they are bound by the law of nature. For excommunication cannot sever the natural and moral bonds by which men are mutually held together.</p></blockquote>

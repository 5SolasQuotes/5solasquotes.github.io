<main class="wrap"><figure class="quote" id="q-9094580a74" data-kw="">
<blockquote><p>If an Anabaptist were disputing with you, I think no other defence would avail you, than this, that they, with justice are received to Baptism whom God has adopted before they were born, and to whom He has promised to be a Father. For unless God transmit His grace from fathers to sons, to receive new-born infants into the Church [it] would be a mere profanation of Baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contra Westphal</cite>, p. 792, col. 2 as given and translated in Krauth, p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

0dissolving%20the%20bond%20of%20marriage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d32d893a76" data-kw="">
<blockquote><p>This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him… 2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (Edinburgh: Ogle &amp; Boyd), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

— Samuel Rutherford, Lex, Rex (Edinburgh: Ogle &amp; Boyd), p. 47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+title+by+conquest%2C+through+the+people%E2%80%99s+after+consent%2C+may+be+turned+into+a+just+title%2C+as+in+the+case+of+the+Jews+in+Caesar%E2%80%99s+time%2C+for+which+cause+our+Savior+commanded+to+obey+Caesar%2C+and+to+pay+tribute+unto+him%E2%80%A6+2.+Though+the+consent+be+some+way+over-awed+%5Bby+intimidation%5D%2C+yet+is+it+a+sort+of+contract+and+covenant+of+loyal+subjection+made+to+the+conqueror%2C+and+therefore+sufficient+to+make+the+title+just%3B+otherwise%2C+if+the+people+never+give+their+consent%2C+the+conqueror%2C+domineering+over+them+by+violence%2C+has+no+just+title+to+the+crown.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex%2C+Rex+%28Edinburgh%3A+Ogle+%26+Boyd%29%2C+p.+47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd32d893a76.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d32d893a76.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=This%20title%20by%20conquest%2C%20through%20the,no%20just%20title%20to%20the%20crown&amp;text=This%20title%20by%20conquest%2C%20through%20the%20people%E2%80%99s%20after&amp;text=violence%2C%20has%20no%20just%20title%20to%20the%20crown" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0d115b7eac" data-kw="">
<blockquote><p>The third [sort of Anabaptists, after the two from the Early Church] broached theirs in the year 1525, which was this, (3) that baptism ought to be administred to none, but such as can give a good account of their faith; and in case any have been baptized in their infancy, that they ought to be re-baptized after they come to years of discretion, before they are to be admitted to the church of Christ. … For the third sort of Anabaptists, they have sunk deeper in the former quagmire… For they not only nullify all baptism administered either by Romish priests, or orthodox Protestants, but condemn [the] baptizing of children simply, which neither the first nor the second sort of Anabaptists [in the Early Church] did; for both the Novatians and Donatists, yea, and Pelagians too, though they denied original sin, yet they all allowed and practised the baptism of infants. The author of this third and worst sect of Anabaptists, was, as some say Muncerus; as others, Balthasar Pacimontanus, against whom Zwingli wrote; as others, Carolstadius; but I subscribe to Melancthou, who lived in those times… And he affirms, as I said before, that Nicholas Stock was the first that broached Anabaptism in Germany. This Stock affirmed, that God spake to him by an angel, and revealed his will to him in dreams, promising him the place of the angel Gabriel: in this man’s school was Thomas Muncer bred…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged</cite>, … (London, 1645), pp. 25 &amp; 27</span></figcaption>

<blockquote><p>5. When we teach the perseverance of the saints in a state of justification once obtained, we do not deny that the quality, or exercise of the faithful or righteous man is mutable or may be lost, by reason of the subject matter; but we affirm that the special love of God does not permit, that he who by believing in Christ shall have been justified and adopted as a son of God, by losing that faith and holiness should cease to be a child of God and perish for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Regeneration &amp; the Final Perseverance of the Saints. A letter of</cite>, … Davenant… to Dr. Samuel Ward… tr. J. Allport (d. 1641; London: Macintosh, 1864) 30 pp.</span></figcaption>

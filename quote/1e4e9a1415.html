<main class="wrap"><figure class="quote" id="q-1e4e9a1415" data-kw="">
<blockquote><p>The Argument from Act. 2.38, 39. may be thus formed: To whom the promise is made, they may be baptized; but to the Infants of Believers the promise is made; therefore they may be baptized.

The Minor is proved from the words of vers. 39. for the promise is made to you and to your children.

That an answer may be fitted to this Argument:

With the 1. Observation of Master T. in this Answer we close, that the promise meant here, is that which was made to Abraham, hinted Gen. 12. Enlarged and confirmed, Gen. 17. Illustrated, Gen. 22. According to Act. 3, 25.26. Act. 13.32, 33. Rom. 15.8, 9. provided that Mr. [John] T[omes]. take the 26. Verse of Act. 33. duly according to the Exposition of the 25. Verse. The 26. v. is, Unto you first God having raised up his Son Jesus Christ, sent him to bless you, in turning away every one of you from his Iniquities. The due genuine sense of which words according to Verse 25. is this: These to whom the Apostle speaks were children of the Covenant which God made with their Fathers, saying unto Abraham, And in thy seed shall all kindreds of the Earth be blessed. According to Gen. 12.3. Gen. 17.7. Gen. 22.18. which Texts do write it as clearly as the sun beams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), pp 41-42.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c66017b6" data-kw="">
<blockquote><p>We must carefully remember this, for there are two extremes to which men are subject. Either they will fall into superstition or they will be irreverent and pay no attention to the worship of God. There are many today who think that baptism and the Lord’s Supper are nothing, and that they could easily bypass them, as though they were angels. […] While recognising the first extreme, let us be careful on the other hand not to fall into superstition, which we are too included to do by nature. We see how those who want to be devout always go too far: some have, for instance, attached the salvation of men to baptism, and have thought that the blood of Christ was now nothing, so to speak. They say that without the water of baptism, nothing happens, and have even added charism, spittle, and all these empty rites. By their foolish fantasies, men have invented this and that in order to avoid the firm and solid determination to hold to the will of God declared to us in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Samuel: chapters 1-13</cite>, trans. D. F. Kelly (Edinburgh, 1992), pp 271-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-9cbaa3a91f" data-kw="">
<blockquote><p>In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Baptism</span></figcaption>

</figure><figure class="quote" id="q-ff1f25b0d8" data-kw="">
<blockquote><p>When she was baptized. Hereby it appeareth how effectually God wrought in Lydia even in a short moment. For it is not to be doubted but that she received and embraced the faith of Christ sincerely, and gave him her name, before Paul would admit her unto baptism. This was a token of mere readiness; also, her holy zeal and godliness do therein show themselves, in that she doth also consecrate her family to God. And, surely, all the godly ought to have this desire, to have those who are under them to be partakers of the same faith.

For he is unworthy to be numbered among the children of God, and to be a ruler over others, whosoever is desirous to reign and rule in his own house over his wife, children, servants, and maids, and will cause them to give no place to Christ. Therefore, let every one of the faithful study to govern and order his house so, that it may be an image of the Church. I grant that Lydia had not in her hand the hearts of all those which were of her household, that she might turn unto Christ whomsoever she would; but the Lord did bless her godly desire, so that she had her household obedient.

The godly (as we have already said) must endeavour, with might and main, to drive from their houses all manner of superstition; secondly, that they have not profane families, but that they keep them under the fear of the Lord. So Abraham, the father of the faithful, was commanded to circumcise all his servants with him; and he is commanded for the care he had to govern his house, and to instruct his family. Furthermore, if this duty be required at the hands of the householder, much more of a prince, that he suffer not so much as in him lieth the name of God to be profaned in his realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 19a: 104-05.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

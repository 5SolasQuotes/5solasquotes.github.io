<main class="wrap"><figure class="quote" id="q-3781e40148" data-kw="">
<blockquote><p>Prestige finds Christological perichoresis is no more than a“verbal formality,” adding nothing, and positively tending to monophysitism. My purpose hereis to propose the opposite view: Contra Prestige, Christology in the Damascene is actually anti-monophysite by design. Prestige on perichoresis is no longer tenable on three crucial points: 1) the meaning of perichoresis, 2) the philosophic background of perichoresis, and 3) the provenance of trinitarian perichoresis. None of these contentions is new, yet the implications of them taken together have not been fully realized in regards to the Damascene’s Christology. Contra Prestige, 1) the meaning “interpenetration” is early, not late, 2) the philosophic milieu is predominantly Stoic, not Aristotelian, and 3) the progenitor of trinitarian perichoresis is John of Damascus, not Pseudo-Cyril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-ables.html">Scott Ables</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Anti-Monophysite Trinitarian Christology of John of Damascus’ a paper read at NAPS, Annual Meeting, Chicago</cite>, (2010), pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c36511e0ac" data-kw="Father unbegotten">
<blockquote><p>However, the Holy Spirit speaking in the Scriptures does not merely propose one God to us but also teaches us the way to approach God. Therefore, God is revealed to us in three persons, namely the Father, the Son, and the Holy Spirit, so that we may know the path by which God is accessible. For if you consider God absolutely as Lord and Judge, that terrifying majesty presents itself to the mind, whose brilliance dazzles the eye, and the most righteous tribunal whose aspect strikes the conscience of men with sheer terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VII</span></figcaption>

<blockquote><p>Helpful history of key figures and moves.” – Mark Jones . On the Medieval Church Articles Muller, Richard – pt. 1, ch. 1, ‘The Doctrine of the Trinity in the Christian Tradition: the Medieval Backgroun’ ToC in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725, vol. 4, The Triunity of God 2nd ed. (Baker Books, 2003), pp. 17-59 Butner, D. Glenn – ‘For &amp; Against [Theodore] de Regnon: Trinitarianism East &amp; West’ (2015) 13 pp. Abstract: “Modern systematic theologians frequently claim that Eastern trinitarianism begins with the persons while Western trinitarianism begins with the divine essence, and fails to truly differentiate the persons. This article explores the origins of this claim in the writing of Theodore de Régnon [1831-1893], noting recent criticism of his paradigm’s applicability to the patristic era. In response to these criticisms, I argue ﬁrst for the limited validity of the de Régnon paradigm by demonstrating its applicability in the Carolingian–Photian dispute surrounding the ﬁlioque. I then argue against the deployment of the paradigm as a controlling schema in systematic theology by pointing to problems this narrative has created in the theology of Robert Jenson and John Zizioulas.</p></blockquote>

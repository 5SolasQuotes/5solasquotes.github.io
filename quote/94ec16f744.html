<main class="wrap"><figure class="quote" id="q-94ec16f744" data-kw="">
<blockquote><p>There is in God a universal or common love by which he is inclined to do good to every creature, and so then also to man (Ps. 36:6; 1 Tim. 4:10), by external and common benefits (Ps. 17:14), and there is also a special, saving love by which he dispenses the benefits that accompany salvation, which have an unbreakable connection with salvation (Heb. 6:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, ed. J.R. Beeke, tr. T.M. Rester &amp; M.T. Spangler (Reformation Heritage Books, 2019), vol. 2, p. 365</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c358548691" data-kw="">
<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-f476704f37" data-kw="">
<blockquote><p>‘His strange work;’ the execution of his judgment against Israel, which He calls his strange work, to intimate either: … 2. That this work of bringing total and irrecoverable destruction upon Israel was contrary to the benignity of his own nature, and to the usual way of dealing with his people, whom He used and delighted to protect, and spare, and bless; and whom, even when He is angry with them, and punishes them, He handles more gently than He does other persons, in judgment remembering mercy to them, as was noted, Isa. 27:7-8; see also Isa. 26:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the Whole Bible</cite>, on Isaiah 28, verse 21</span></figcaption>

</figure><figure class="quote" id="q-25871be9fa" data-kw="">
<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, pp. 584-85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>2. We see also that though ministers are virtually both elders and deacons (as the apostles were), yet ought they to regulate their exercising of both these with respect to the former two. And, 3. that elders and deacons ought in governing and overseeing the poor to have special respect to keep ministers from being burdened or toiled with these, that they may have freedom to follow the ministry of the Word as the main thing: Yea, even to have much access to privacy and solitariness, which is both most necessary for and a well becoming duty to a minister; This is a special end of the appointment of these officers, and in reference to which they are helps, 1 Cor. 12:28, both to the people and to the ministers.</p></blockquote>

<blockquote><p>1. We bear the greater costs of sex and reproduction Females invest more biologically in reproduction, from egg production to pregnancy, birth, and lactation. This influences the design of our brain and body, even if we have no plans to have children. It shapes everything from our sexual psychology to the ways we compete.

2. Our hormones cycle Our sex hormones don’t stay static—they ebb and flow across the menstrual cycle, life stages (puberty, pregnancy, postpartum, perimenopause), and in response to environmental cues. These fluctuations impact our metabolism, immune system, brain, behavior, and emotions.

3. We Are Most Powerful When in a State of Balance The female body thrives on cycles of exertion and recovery. Whether it’s the menstrual cycle, exercise, cognition, or childbirth, we are wired to push and then restore. Chronic overdrive without repair leads to burnout and dysregulation.

4. Our Brains Are More Interconnected Compared to males, female brains show more crosstalk between hemispheres and between emotion-processing and executive areas. This contributes to greater emotional awareness, verbal fluency, and intuitive social reasoning.

5. We’re an Immunological Powerhouse…but More Inflammatory Estrogen ramps up immunological vigilance, giving us an edge in fighting infections. But this same immune sensitivity also makes us more prone to autoimmune and inflammatory conditions.

6. Our Physiology Prioritizes Safety and Energy Efficiency Above All Else Evolution has wired the female body to conserve resources and protect reproductive capacity. Under stress, scarcity, or social threat, it downshifts fertility, libido, and energy output. It also makes it easier for us to gain weight, harder to lose it, and makes us more likely to experience anxiety when we’re not in relationships.

7. We Are Built to Evolve Female brains undergo large-scale remodeling during puberty, pregnancy, postpartum, and menopause. These changes shift our priorities, cognition, and how we think, feel, and experience the world. Our brains adapt dramatically across life phases to meet new demands.

8. We’re Sensitive to the Social Our neurobiology makes us especially attuned to relationships, belonging, and emotional safety. This isn’t fragility; it’s adaptation. Our HPA axis (stress axis) is more sensitive than men’s. The female brain evolved in tight social ecosystems where connection was survival and failure to form groups would have led to their demise.

9. We’ve Been Seen Before We’ve Been Heard Because female fertility is transient and invisible, human cultures have long used appearance – youth, skin quality, body shape – as a proxy for a woman’s ability reproduce. This means that – as much as we might hate this to be true – women have evolved to monitor their appearance more vigilantly than men, and we’ve been taught to see our bodies through the eyes of others.

10. We Perceive More Research finds that women have greater sensitivity to touch, smell, and pain. This reflects different thresholds for detecting threat or opportunity – useful in parenting, mate choice, and social contexts. Our sensory systems are finely tuned – and can become sometimes overloaded.

11. Our Design Is Not a Disorder Being female isn’t a deviation from a male norm, it’s its own blueprint. When medicine ignores or pathologizes how we are built, it creates dysfunction and we think our body is the enemy. When we work with our biology instead of against it, we thrive. …</p></blockquote>

<blockquote><p>8. Concerning the 17th Proposition (which many will stumble at), I desire you to observe these things:

1. That as we avoid the titles of lay-elders and preaching-elders, so we do purposely avoid the determination of that controversy: Whether Christ has appointed ecclesiastical elders, distinct in office from teaching-elders, having no authority to preach, baptize or administer the Lord’s Supper, though they have gifts? I confess my own private opinion is that neither Scripture nor antiquity did know any such church-officers: But as I so much reverence and value the contrary minded, as not to expect that my judgment should stand in any competition with theirs, or in the least to sway any man to my opinion from theirs (though upon the concurrent judgment of so many learned men that are of the same opinion with me, I might reasonably expect that other men’s reputation should create no prejudice), so it is nothing to my brethren, nor the sense of our Agreement, what my private opinion is. We are not so unconscionably self-conceited or divisive as to think we must or may reject all those from our communion that differ in this point from us: or that it is a matter of so great moment that may hinder our fraternal and peaceable Association.

2. We have therefore agreed of the work of assisting-elders, and leave the discussion of their further authority and distinction of their office from teaching-elders, to others.

3. And that each party may well agree to this Proposition, without forsaking their principles, is beyond doubt. For the presbyterians and the congregational party, they both are for such elders as shall rule and not administer sacraments; and though some of one sort [congregationalists], say they may preach:

1. They say not that they must preach where the teaching-elders are well and present;

2. And perhaps it is because they would allow another gifted member to do the like. And for the episcopal divines, their practice and their writings prove what I say: For they have ever since the Reformation allowed great numbers of readers in England, of far lower abilities than we express in our Propositions; such as never preached, and some that were fain to labour for their livings in secular employments, as this country knows. And though they allowed them to baptise and administer the Lord’s Supper [by delegation], yet they never affirmed that they must do it when there was an abler minister of the same church to do it. And in their writings they do maintain the lawfulness of placing such reading ministers in chapels or parish churches under able pastors. So that it’s past doubt that we are all agreed that there may be such officers, or elders chosen to do the work that is here expressed. And if any think it a matter of so great necessity that we agree in our belief of these elders’ further power, as that we must not associate with those that agree not, I would intreat him to tell me why it is not in our Creed? or why it never was in the Creed of any Church? or whether no Church had ever a sufficient Creed so large as to contain all points of absolute necessity to salvation, or without which, we must avoid men’s society? or whether he dare yet put it in his Creed among fundamentals, or points of such necessity ‘I believe that lay or mere-ruling elders are, or are not Jure divino?’ Or whether he accuse not the Scripture itself of insufficiency for speaking so darkly of fundamentals themselves as that the most godly and learned are not able to understand it? And whether he lay not a ground of separation from multitudes of eminent learning and piety, yea from whole Churches which Christ Himself owns and will not allow us to separate from?

4. And observe further that the elders that we here speak of are only assistants to able preachers: we do not say that such may be allowed of alone where there is no other to preach (though what might be done in case of necessity, I will not determine). But if a great Church have one or two able men to preach publicly, and will moreover appoint some sober, godly, orthodox men to help them in private oversight, instruction, admonition and reproof; and if one call these ‘lay-elders’ or ‘ruling-elders,’ and another take them to be inferior ministers, as some sober chapel readers were, I would not quarrel about the notions or titles while we agree about the work to be done. Nor would I dare to reproach them with the name of dumb dogs on one side, or lay-elders (as dumb) on the other.

5. I thought meet also to tell you thus much of my own opinion; that it seems to me the best way (at our first ordering of our churches according to these Propositions) to take in none but school-masters, physicians, or other learned men to be elders (where such are to be had that are meet), and for those of our abler hearers that are unlearned, that it will be fittest first to try them in the office of deacons: both because the office of deacons is most unquestionable to all sorts and parties; and so it will avoid the reproaches of dissenters: and because the apostles made deacons before they ordained any fixed elders of particular churches; and they made abler men deacons than any of us are; and therefore none may think the office to be below him; and because it is orderly to ascend by degrees: and the apostles’ words, 1 Tim. 4:8-13, together with the constant expressions and practice of antiquity, do show that this is a degree to the eldership… And the danger of misguiding and dividing our congregations by men of weak judgments is so great that I think it much fitter to try them first in an office of known inferiority (for all confess that deacons should be guided by the elders) wherein they may be as serviceable to the Church than to begin them in an office of mere power, wherein they will think their votes to be of equal authority with the most judicious teachers [Baxter did not hold them to be equal], and so may breed contentions or foment errors or factions in the church; and yet be less capable of doing service than the deacons are (See Mr. Noyes, Temple Measured, of the Office of Deacons and Elders). This course therefore I have propounded to my brethren of this Association; and they think as I do… If any shall refuse the office of deacons as too mean for them, they shall thereby discover that pride that will prove them unfit to be either elders or deacons; and you will have cause to thank God that thereby a mischief to the Church is prevented, which might have followed if such unhumbled men had crept into authority.

6. But the great objection against this Proposition will be (by some) that we allow none to be elders but those that are ordained, and so overthrow mere-ruling elders. To which I answer:

1. These brethren must consider that we are forced for unity to speak indistinctly of all that are mere assisting elders and do not actually preach and administer sacraments, whether they take themselves to have authority to do more (as other ministers) or not: Now they will confess that such inferior or assisting ministers must be ordained: and we cannot now [formally] distinguish [them].

2. I never could learn that it is the judgment of presbyterians or congregational men that it is unlawful to ordain mere-ruling elders. And if they may do it, why should they not yield to it for peace, though they think not that they must do it?

3. I confess I know of no elders mentioned in Scripture without ordination and do despair of ever seeing it proved that the apostles did appoint two sorts of elders, one ordained and the other not ordained. The contrary I doubt not to prove by sufficient induction.

4. Deacons must be ordained that are inferior to elders; why then should not elders be ordained?

5. Let our brethren take heed lest they loose all their hold of that show they have in Scripture for mere-ruling elders (I mean quoad potestatem [as to the power], not quoad exercitium ordinarium [as to the ordinary exercise]), if they once disclaim all those as no such ruling elders who were ordained. It seems then that when the apostles ordained elders in every Church, and when Titus was left to ordain elders in every city, it was no mere-ruling elders that they ordained or were appointed to ordain!

6. I confess I am loath (without more reasons than I yet know) to give the intruders of the ministry so much encouragement as to tell them men may ordinarily be ruling elders without ordination? For doubtless a man may much more preach up and down in public occasionally without ordination: I mean, more may be said for it. Even some of the most learned episcopal divines think that by the bishop’s allowance private men may preach, and that it belongs more to the pastor to take care what doctrine is taught his people than that himself be the teacher. And most allow the preaching of probationers. And if you add to this that there is no need of ordination to the office of church-governing, I know partly what will follow.

7. Yet a greater doubt is behind, and that is: How we would have these men ordained? I answer:

1. We have not determined of that: We purposely avoid the point of ordination because the distance between the episcopal divines and others is well known in that point: and we resolve not to put such controverted points into our Agreement, lest thereby we necessarily exclude the dissenters. Our business is not now (as is said) to reconcile differences in judgment: much less to divide from those that differ from us: but to practice unanimously so much as we are agreed in.

2. We leave therefore every man in this to his own judgment. Those that are for bishops may be ordained by them with a presbytery, if they can obtain it. Those that are against them, may be ordained by the Associated pastors of that Association, the president performing the action. Those that fear danger from the law of the land if they ordain without authority, may send men to some neighbor county that has authority. Those that will not use the name of ordination may yet use the thing: which is nothing but the solemn designation or appointment of a fit person to the office, by competent men: which is most fitly accompanied with prayer and imposition of hands, where they may be had.

3. To avoid some of these contests, if deacons only be first ordained, as I before mentioned, it will prevent the quarrels that some may else be drawn to by difference of judgment. For many moderate episcopal men will allow presbyters to ordain deacons that will not allow them to ordain presbyters. As for those that will say, These are no true officers, nor to be acknowledged (whether deacons or presbyters) who were not ordained by a bishop, and thereupon will take occasion for a schism in our congregations, I shall speak more fully to their satisfaction anon.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“8. Concerning the 17th Proposition (which many will stumble at), I desire you to observe these things:

1. That as we avoid the titles of lay-elders and preaching-elders, so we do purposely avoid the determination of that controversy: Whether Christ has appointed ecclesiastical elders, distinct in office from teaching-elders, having no authority to preach, baptize or administer the Lord’s Supper, though they have gifts? I confess my own private opinion is that neither Scripture nor antiquity did know any such church-officers: But as I so much reverence and value the contrary minded, as not to expect that my judgment should stand in any competition with theirs, or in the least to sway any man to my opinion from theirs (though upon the concurrent judgment of so many learned men that are of the same opinion with me, I might reasonably expect that other men’s reputation should create no prejudice), so it is nothing to my brethren, nor the sense of our Agreement, what my private opinion is. We are not so unconscionably self-conceited or divisive as to think we must or may reject all those from our communion that differ in this point from us: or that it is a matter of so great moment that may hinder our fraternal and peaceable Association.

2. We have therefore agreed of the work of assisting-elders, and leave the discussion of their further authority and distinction of their office from teaching-elders, to others.

3. And that each party may well agree to this Proposition, without forsaking their principles, is beyond doubt. For the presbyterians and the congregational party, they both are for such elders as shall rule and not administer sacraments; and though some of one sort [congregationalists], say they may preach:

1. They say not that they must preach where the teaching-elders are well and present;

2. And perhaps it is because they would allow another gifted member to do the like. And for the episcopal divines, their practice and their writings prove what I say: For they have ever since the Reformation allowed great numbers of readers in England, of far lower abilities than we express in our Propositions; such as never preached, and some that were fain to labour for their livings in secular employments, as this country knows. And though they allowed them to baptise and administer the Lord’s Supper [by delegation], yet they never affirmed that they must do it when there was an abler minister of the same church to do it. And in their writings they do maintain the lawfulness of placing such reading ministers in chapels or parish churches under able pastors. So that it’s past doubt that we are all agreed that there may be such officers, or elders chosen to do the work that is here expressed. And if any think it a matter of so great necessity that we agree in our belief of these elders’ further power, as that we must not associate with those that agree not, I would intreat him to tell me why it is not in our Creed? or why it never was in the Creed of any Church? or whether no Church had ever a sufficient Creed so large as to contain all points of absolute necessity to salvation, or without which, we must avoid men’s society? or whether he dare yet put it in his Creed among fundamentals, or points of such necessity ‘I believe that lay or mere-ruling elders are, or are not Jure divino?’ Or whether he accuse not the Scripture itself of insufficiency for speaking so darkly of fundamentals themselves as that the most godly and learned are not able to understand it? And whether he lay not a ground of separation from multitudes of eminent learning and piety, yea from whole Churches which Christ Himself owns and will not allow us to separate from?

4. And observe further that the elders that we here speak of are only assistants to able preachers: we do not say that such may be allowed of alone where there is no other to preach (though what might be done in case of necessity, I will not determine). But if a great Church have one or two able men to preach publicly, and will moreover appoint some sober, godly, orthodox men to help them in private oversight, instruction, admonition and reproof; and if one call these ‘lay-elders’ or ‘ruling-elders,’ and another take them to be inferior ministers, as some sober chapel readers were, I would not quarrel about the notions or titles while we agree about the work to be done. Nor would I dare to reproach them with the name of dumb dogs on one side, or lay-elders (as dumb) on the other.

5. I thought meet also to tell you thus much of my own opinion; that it seems to me the best way (at our first ordering of our churches according to these Propositions) to take in none but school-masters, physicians, or other learned men to be elders (where such are to be had that are meet), and for those of our abler hearers that are unlearned, that it will be fittest first to try them in the office of deacons: both because the office of deacons is most unquestionable to all sorts and parties; and so it will avoid the reproaches of dissenters: and because the apostles made deacons before they ordained any fixed elders of particular churches; and they made abler men deacons than any of us are; and therefore none may think the office to be below him; and because it is orderly to ascend by degrees: and the apostles’ words, 1 Tim. 4:8-13, together with the constant expressions and practice of antiquity, do show that this is a degree to the eldership… And the danger of misguiding and dividing our congregations by men of weak judgments is so great that I think it much fitter to try them first in an office of known inferiority (for all confess that deacons should be guided by the elders) wherein they may be as serviceable to the Church than to begin them in an office of mere power, wherein they will think their votes to be of equal authority with the most judicious teachers [Baxter did not hold them to be equal], and so may breed contentions or foment errors or factions in the church; and yet be less capable of doing service than the deacons are (See Mr. Noyes, Temple Measured, of the Office of Deacons and Elders). This course therefore I have propounded to my brethren of this Association; and they think as I do… If any shall refuse the office of deacons as too mean for them, they shall thereby discover that pride that will prove them unfit to be either elders or deacons; and you will have cause to thank God that thereby a mischief to the Church is prevented, which might have followed if such unhumbled men had crept into authority.

6. But the great objection against this Proposition will be (by some) that we allow none to be elders but those that are ordained, and so overthrow mere-ruling elders. To which I answer:

2. I never could learn that it is the judgment of presbyterians or congregational men that it is unlawful to ordain mere-ruling elders. And if they may do it, why should they not yield to it for peace, though they think not that they must do it?

7. Yet a greater doubt is behind, and that is: How we would have these men ordained? I answer:

1. We have not determined of that: We purposely avoid the point of ordination because the distance between the episcopal divines and others is well known in that point: and we resolve not to put such controverted points into our Agreement, lest thereby we necessarily exclude the dissenters. Our business is not now (as is said) to reconcile differences in judgment: much less to divide from those that differ from us: but to practice unanimously so much as we are agreed in.

2. We leave therefore every man in this to his own judgment. Those that are for bishops may be ordained by them with a presbytery, if they can obtain it. Those that are against them, may be ordained by the Associated pastors of that Association, the president performing the action. Those that fear danger from the law of the land if they ordain without authority, may send men to some neighbor county that has authority. Those that will not use the name of ordination may yet use the thing: which is nothing but the solemn designation or appointment of a fit person to the office, by competent men: which is most fitly accompanied with prayer and imposition of hands, where they may be had.

3. To avoid some of these contests, if deacons only be first ordained, as I before mentioned, it will prevent the quarrels that some may else be drawn to by difference of judgment. For many moderate episcopal men will allow presbyters to ordain deacons that will not allow them to ordain presbyters. As for those that will say, These are no true officers, nor to be acknowledged (whether deacons or presbyters) who were not ordained by a bishop, and thereupon will take occasion for a schism in our congregations, I shall speak more fully to their satisfaction anon.”

dly+and+learned+are+not+able+to+understand+it%3F+And+whether+he+lay+not+a+ground+of+separation+from+multitudes+of+eminent+learning+and+piety%2C+yea+from+whole+Churches+which+Christ+Himself+owns+and+will+not+allow+us+to+separate+from%3F+4.+And+observe+further+that+the+elders+that+we+here+speak+of+are+only+assistants+to+able+preachers%3A+we+do+not+say+that+such+may+be+allowed+of+alone+where+there+is+no+other+to+preach+%28though+what+might+be+done+in+case+of+necessity%2C+I+will+not+determine%29.+But+if+a+great+Church+have+one+or+two+able+men+to+preach+publicly%2C+and+will+moreover+appoint+some+sober%2C+godly%2C+orthodox+men+to+help+them+in+private+oversight%2C+instruction%2C+admonition+and+reproof%3B+and+if+one+call+these+%E2%80%98lay-elders%E2%80%99+or+%E2%80%98ruling-elders%2C%E2%80%99+and+another+take+them+to+be+inferior+ministers%2C+as+some+sober+chapel+readers+were%2C+I+would+not+quarrel+about+the+notions+or+titles+while+we+agree+about+the+work+to+be+done.+Nor+would+I+dare+to+reproach+them+with+the+name+of+dumb+dogs+on+one+side%2C+or+lay-elders+%28as+dumb%29+on+the+other.+5.+I+thought+meet+also+to+tell+you+thus+much+of+my+own+opinion%3B+that+it+seems+to+me+the+best+way+%28at+our+first+ordering+of+our+churches+according+to+these+Propositions%29+to+take+in+none+but+school-masters%2C+physicians%2C+or+other+learned+men+to+be+elders+%28where+such+are+to+be+had+that+are+meet%29%2C+and+for+those+of+our+abler+hearers+that+are+unlearned%2C+that+it+will+be+fittest+first+to+try+them+in+the+office+of+deacons%3A+both+because+the+office+of+deacons+is+most+unquestionable+to+all+sorts+and+parties%3B+and+so+it+will+avoid+the+reproaches+of+dissenters%3A+and+because+the+apostles+made+deacons+before+they+ordained+any+fixed+elders+of+particular+churches%3B+and+they+made+abler+men+deacons+than+any+of+us+are%3B+and+therefore+none+may+think+the+office+to+be+below+him%3B+and+because+it+is+orderly+to+ascend+by+degrees%3A+and+the+apostles%E2%80%99+words%2C+1+Tim.+4%3A8-13%2C+together+with+the+constant+expressions+and+practice+of+antiquity%2C+do+show+that+this+is+a+degree+to+the+eldership%E2%80%A6+And+the+danger+of+misguiding+and+dividing+our+congregations+by+men+of+weak+judgments+is+so+great+that+I+think+it+much+fitter+to+try+them+first+in+an+office+of+known+inferiority+%28for+all+confess+that+deacons+should+be+guided+by+the+elders%29+wherein+they+may+be+as+serviceable+to+the+Church+than+to+begin+them+in+an+office+of+mere+power%2C+wherein+they+will+think+their+votes+to+be+of+equal+authority+with+the+most+judicious+teachers+%5BBaxter+did+not+hold+them+to+be+equal%5D%2C+and+so+may+breed+contentions+or+foment+errors+or+factions+in+the+church%3B+and+yet+be+less+capable+of+doing+service+than+the+deacons+are+%28See+Mr.+Noyes%2C+Temple+Measured%2C+of+the+Office+of+Deacons+and+Elders%29.+This+course+therefore+I+have+propounded+to+my+brethren+of+this+Association%3B+and+they+think+as+I+do%E2%80%A6+If+any+shall+refuse+the+office+of+deacons+as+too+mean+for+them%2C+they+shall+thereby+discover+that+pride+that+will+prove+them+unfit+to+be+either+elders+or+deacons%3B+and+you+will+have+cause+to+thank+God+that+thereby+a+mischief+to+the+Church+is+prevented%2C+which+might+have+followed+if+such+unhumbled+men+had+crept+into+authority.+6.+But+the+great+objection+against+this+Proposition+will+be+%28by+some%29+that+we+allow+none+to+be+elders+but+those+that+are+ordained%2C+and+so+overthrow+mere-ruling+elders.+To+which+I+answer%3A+1.+These+brethren+must+consider+that+we+are+forced+for+unity+to+speak+indistinctly+of+all+that+are+mere+assisting+elders+and+do+not+actually+preach+and+administer+sacraments%2C+whether+they+take+themselves+to+have+authority+to+do+more+%28as+other+ministers%29+or+not%3A+Now+they+will+confess+that+such+inferior+or+assisting+ministers+must+be+ordained%3A+and+we+cannot+now+%5Bformally%5D+distinguish+%5Bthem%5D.+2.+I+never+could+learn+that+it+is+the+judgment+of+presbyterians+or+congregational+men+that+it+is+unlawful+to+ordain+mere-ruling+elders.+And+if+they+may+do+it%2C+why+should+they+not+yield+to+it+for+peace%2C+though+they+think+not+that+they+must+do+it%3F+3.+I+confess+I+know+of+no+elders+mentioned+in+Scripture+without+ordination+and+do+despair+of+ever+seeing+it+proved+that+the+apostles+did+appoint+two+sorts+of+elders%2C+one+ordained+and+the+other+not+ordained.+The+contrary+I+doubt+not+to+prove+by+sufficient+induction.+4.+Deacons+must+be+ordained+that+are+inferior+to+elders%3B+why+then+should+not+elders+be+ordained%3F+5.+Let+our+brethren+take+heed+lest+they+loose+all+their+hold+of+that+show+they+have+in+Scripture+for+mere-ruling+elders+%28I+mean+quoad+potestatem+%5Bas+to+the+power%5D%2C+not+quoad+exercitium+ordinarium+%5Bas+to+the+ordinary+exercise%5D%29%2C+if+they+once+disclaim+all+those+as+no+such+ruling+elders+who+were+ordained.+It+seems+then+that+when+the+apostles+ordained+elders+in+every+Church%2C+and+when+Titus+was+left+to+ordain+elders+in+every+city%2C+it+was+no+mere-ruling+elders+that+they+ordained+or+were+appointed+to+ordain%21+6.+I+confess+I+am+loath+%28without+more+reasons+than+I+yet+know%29+to+give+the+intruders+of+the+ministry+so+much+encouragement+as+to+tell+them+men+may+ordinarily+be+ruling+elders+without+ordination%3F+For+doubtless+a+man+may+much+more+preach+up+and+down+in+public+occasionally+without+ordination%3A+I+mean%2C+more+may+be+said+for+it.+Even+some+of+the+most+learned+episcopal+divines+think+that+by+the+bishop%E2%80%99s+allowance+private+men+may+preach%2C+and+that+it+belongs+more+to+the+pastor+to+take+care+what+doctrine+is+taught+his+people+than+that+himself+be+the+teacher.+And+most+allow+the+preaching+of+probationers.+And+if+you+add+to+this+that+there+is+no+need+of+ordination+to+the+office+of+church-governing%2C+I+know+partly+what+will+follow.+7.+Yet+a+greater+doubt+is+behind%2C+and+that+is%3A+How+we+would+have+these+men+ordained%3F+I+answer%3A+1.+We+have+not+determined+of+that%3A+We+purposely+avoid+the+point+of+ordination+because+the+distance+between+the+episcopal+divines+and+others+is+well+known+in+that+point%3A+and+we+resolve+not+to+put+such+controverted+points+into+our+Agreement%2C+lest+thereby+we+necessarily+exclude+the+dissenters.+Our+business+is+not+now+%28as+is+said%29+to+reconcile+differences+in+judgment%3A+much+less+to+divide+from+those+that+differ+from+us%3A+but+to+practice+unanimously+so+much+as+we+are+agreed+in.+2.+We+leave+therefore+every+man+in+this+to+his+own+judgment.+Those+that+are+for+bishops+may+be+ordained+by+them+with+a+presbytery%2C+if+they+can+obtain+it.+Those+that+are+against+them%2C+may+be+ordained+by+the+Associated+pastors+of+that+Association%2C+the+president+performing+the+action.+Those+that+fear+danger+from+the+law+of+the+land+if+they+ordain+without+authority%2C+may+send+men+to+some+neighbor+county+that+has+authority.+Those+that+will+not+use+the+name+of+ordination+may+yet+use+the+thing%3A+which+is+nothing+but+the+solemn+designation+or+appointment+of+a+fit+person+to+the+office%2C+by+competent+men%3A+which+is+most+fitly+accompanied+with+prayer+and+imposition+of+hands%2C+where+they+may+be+had.+3.+To+avoid+some+of+these+contests%2C+if+deacons+only+be+first+ordained%2C+as+I+before+mentioned%2C+it+will+prevent+the+quarrels+that+some+may+else+be+drawn+to+by+difference+of+judgment.+For+many+moderate+episcopal+men+will+allow+presbyters+to+ordain+deacons+that+will+not+allow+them+to+ordain+presbyters.+As+for+those+that+will+say%2C+These+are+no+true+officers%2C+nor+to+be+acknowledged+%28whether+deacons+or+presbyters%29+who+were+not+ordained+by+a+bishop%2C+and+thereupon+will+take+occasion+for+a+schism+in+our+congregations%2C+I+shall+speak+more+fully+to+their+satisfaction+anon.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity%2C+%28London%3A+A.M.%2C+1653%29+%7C+An+Explication+of+Some+Passages+in+the+Propositions%2C+pp.+5-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bc9b3d8f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bc9b3d8f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=8.%20Concerning%20the%2017th%20Proposition%20%28which,more%20fully%20to%20their%20satisfaction%20anon&amp;text=8.%20Concerning%20the%2017th%20Proposition%20%28which%20many%20will&amp;text=shall%20speak%20more%20fully%20to%20their%20satisfaction%20anon" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now beside the apostles, prophets and evangelists, which were not ordained to be ordinary and perpetual offices in the Church, there are but two ecclesiastical orders or degrees instituted by Christ in the New Testament, viz. elders and deacons. Excellenter Canones d•…os tantum sacros ordines appellari censent, Diaconatus scilicet &amp; Presbyterat•…, quia hos solos primitiva Ecclesia legitur habuisse, &amp; de hi•… sol•… praeceptum Apostli habe•…, says the Master of Sentences (bk. 4, distinction [??])… Moreover, 1 Tim. 3, he gives order only for bishops and deacons, but says nothing of a third order. Wherefore it is manifest that beside those two orders of elders and deacons, there is no other ecclesiastical order which has any divine institution, or necessary use in the Church. And princes should do well to apply their power and authority to the extirpation and rooting out of Popes, Cardinals, Patriarches, Primates, Archbishops, Bishops, Suffragans, Abbots, Deanes, Vice-Deans, Priors, Archdeacons, Subdeacons, Chancellours, Chantours, Subchantours, Exorcists, Monks, Hermits, Acoluths, and all the whole rabble of Popish orders, which undo the Church, and work more mischief in the earth than can be either soon seene or shortly told. But contrary wise, princes ought to establish and mantain in the Church, elders and deacons, according to the apostolical institution. Now elders are either such as labor in the Word and doctrine, or else such as are appointed for discipline only…. And many more of our divines, who teach that the apostle 1 Tim. 5:17, directly implies that there were some elders who ruled well, and yet labored not in the Word and doctrine, and those elders he means by them that rule, Rom. 12:8 and by governments, 1 Cor. 12:28, where the apostle says not ‘helps in governements,’ as our new English translation corruptly reads, but ‘helps, governements,’ etc. plainly putting ‘governements’ for a different order from ‘helps’ or deacons… Deacons were instituted by the apostles for collecting, receiving, keeping, and distributing of ecclesiastical goods, which were given and dedicated for the maintenance of ministers, churches, schools, and for the help and relief of the poor, the stranger, the sick and the weak, also for furnishing of such things as are necessary to the ministration of the sacraments. Beside which employments, the Scripture has assigned neither preaching, nor baptizing, nor any other ecclesiastical function to ordinary deacons… And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well qualified men for those functions and offices. For the eighth head of the first book of discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominated to be in election, and that their names be publicly read to the whole Church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominated be noted with public infamy, he ought to be repelled: And that if any man know others of better qualities within the Church, then these that be nominated, they should be put in election, that the Church may have the choice.</p></blockquote>

e+were+some+elders+who+ruled+well%2C+and+yet+labored+not+in+the+Word+and+doctrine%2C+and+those+elders+he+means+by+them+that+rule%2C+Rom.+12%3A8+and+by+governments%2C+1+Cor.+12%3A28%2C+where+the+apostle+says+not+%E2%80%98helps+in+governements%2C%E2%80%99+as+our+new+English+translation+corruptly+reads%2C+but+%E2%80%98helps%2C+governements%2C%E2%80%99+etc.+plainly+putting+%E2%80%98governements%E2%80%99+for+a+different+order+from+%E2%80%98helps%E2%80%99+or+deacons%E2%80%A6+Deacons+were+instituted+by+the+apostles+for+collecting%2C+receiving%2C+keeping%2C+and+distributing+of+ecclesiastical+goods%2C+which+were+given+and+dedicated+for+the+maintenance+of+ministers%2C+churches%2C+schools%2C+and+for+the+help+and+relief+of+the+poor%2C+the+stranger%2C+the+sick+and+the+weak%2C+also+for+furnishing+of+such+things+as+are+necessary+to+the+ministration+of+the+sacraments.+Beside+which+employments%2C+the+Scripture+has+assigned+neither+preaching%2C+nor+baptizing%2C+nor+any+other+ecclesiastical+function+to+ordinary+deacons%E2%80%A6+And+as+for+the+other+sort+of+elders%2C+together+with+deacons%2C+we+judge+the+ancient+order+of+this+Church+%5Bof+Scotland%5D%2C+to+have+been+most+convenient+for+providing+of+well+qualified+men+for+those+functions+and+offices.+For+the+eighth+head+of+the+first+book+of+discipline%2C+touching+the+election+of+elders+and+deacons%2C+ordains+that+men+of+best+knowledge+and+cleanest+life%2C+be+nominated+to+be+in+election%2C+and+that+their+names+be+publicly+read+to+the+whole+Church+by+the+minister%2C+giving+them+advertisement%2C+that+from+among+them+must+be+chosen+elders+and+deacons%3A+that+if+any+of+these+nominated+be+noted+with+public+infamy%2C+he+ought+to+be+repelled%3A+And+that+if+any+man+know+others+of+better+qualities+within+the+Church%2C+then+these+that+be+nominated%2C+they+should+be+put+in+election%2C+that+the+Church+may+have+the+choice.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+ch.+8%2C+Digression+1%2C+%E2%80%98Of+the+Voca

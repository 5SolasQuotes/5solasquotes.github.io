<main class="wrap"><figure class="quote" id="q-d9caac3001" data-kw="">
<blockquote><p>For God, who made man, did himself prepare in his predestination, both the gift of illumination to believe, and the gift of perseverance to profit and persevere, and the gift of glorification to reign, tor such to whom he pleased to give it: who also doth not any otherways perform in deed than was ordained by his unchangeable will.

The truth of which predestination, whereby the apostle witnesseth we were predestinated in Christ before the foundation of the world, if any one refuse to receive with the belief of the heart, or to utter with the confession of the mouth, if, before the last day of this present life, he lay not aside the obstinacy of his impiety, whereby as a rebel he withstandeth the true and living God, it is manifest that he doth not belong to the number of those which God did before the foundation of the world freely choose in Christ, and predestinated unto the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Incarnatione et Gratia Christi</cite>, Quoted in William Beveridge, Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 346.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-625f719715" data-kw="">
<blockquote><p>Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate, but diligently to persevere in the use of means, and with ardent desires devoutly and humbly to wait for a season of richer grace.</p></blockquote>

</figure><figure class="quote" id="q-70e2ce4325" data-kw="">
<blockquote><p>First, whereas he troubleth himself with distinguishing the Supralapsarian and Sublapsarian Doctrine, calling them Supralapsarians who in ordering the eternal decrees of God concerning Election and Preterition or Reprobation place them before the consideration of the fall, and those Sublapsarians who place them after; this pains might well have been spared. For Priorities and Posteriorities in the eternal immanent decrees of God are but imaginations of man’s weak reason, and framed diversly (nay contrarily) as well by Schoolmen and Papists as by Protestants or those which are termed Calvinists; and finally they have little or no use in this controversy, as hath been formerly shewed.

Aquinas thought it no such matter of moment whether Predestination be considered before man’s fall and state of misery or after: Motus non accipit speciem à termino à quo, sed à termino ad quem. Nihil enim refert quantum ad rationem dealbationis, utrùm ille qui deal∣batur fuerit niger, aut pallidus, aut rubeus: &amp; similiter nihil refert ad rationem praedestinatio∣nis, utrùm aliquis praedestinetur in vitam aeter∣nam à statu miseriae vel non. [Motion does not take its form from the term to which it is, but from the term to which it is. For it has nothing to do with the reason of bleaching, whether he who is being whitened is black, or pale, or red: and likewise it has nothing to do with the reason of predestination, whether a person is predestined to eternal life from a state of misery or not.] And for Reprobation, he seemeth rather to incline to their opinion who place it in order of consideration before the fall in making it such a part of the Divine providence as permitteth some men deficere à fine [to fail at the end]. So that this Distinction of Supralapsarians and Sublapsarians hath served this Author to no other purpose but to the inculcating of the same objections again and again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise intitled God’s love to mankind</cite>, (Cambridge: Roger Daniel, 1641), pp 204-05.</span></figcaption>

</figure><figure class="quote" id="q-e5bd154d31" data-kw="">
<blockquote><p>But we are bound to give thanks to God always for you, brethren beloved by the Lord, because God from the beginning chose you for salvation through sanctification by the Spirit and belief in the truth (2 Thessalonians 2:13)

(2.) That these things are not causes of election, but fruits of election, and means of execution of God’s decree about our salvation. Sanctification is not a cause, but a subordinate end or means: Eph. i. 4, ‘He hath chosen us to be holy;’ not because we are holy, but that we might be holy. So 1 Peter i. 2, ‘Elect according to the foreknowledge of God, through the sanctification of the Spirit unto obedience.’ Not elected for it, but through it. When God had all mankind in his prospect and view, he freely chose out some to be sanctified and saved.

We come to the possession of it through sanctification, that is, by it as a means. So for the other; faith is a fruit of election, not a foreseen cause: Acts ii. 47, ‘The Lord added to the church daily such as should be saved.’ None cometh to the church but those whom God draweth, and they are actually added to the church by a profession of faith; and such as should be saved were as many as were ordained to salvation Acts xiii. 48, ‘And as many as were ordained to eternal life believed.’ The whole city were met together to hear, but as many as were ordained to eternal life believed. It is not said, as many as believed were ordained to eternal life, but the contrary; faith is not the cause of election, but election is the cause of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), 3: 106.</span></figcaption>

</figure><figure class="quote" id="q-8817d6b4d7" data-kw="">
<blockquote><p>This same election took place, not on the basis of foreseen faith, of the obedience of faith, of holiness, or of any other good quality and disposition, as though it were based on a prerequisite cause or condition in the person to be chosen, but rather for the purpose of faith, of the obedience of faith, of holiness, and so on. Accordingly, election is the source of every saving good. Faith, holiness, and the other saving gifts, and at last eternal life itself, flow forth from election as its fruits and effects. As the apostle says, “He chose us” (not because we were, but) “so that we should be holy and blameless before him in love” (Eph. 1:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7fcc491e11" data-kw="">
<blockquote><p>Wherever there is a choice between candidates, where one of those candidates, if elected, will clearly do more to uphold the moral law of God to protect the good and punish evil, you have a moral obligation before God to vote for that candidate. That is how you exercise your God-given authoritative position as voter, to protect the good and punish the evil… Now no one exercises authority perfectly: no parent, police officer, professor, or president. But when you are in any of these or other positions of authority, you are obligated, in every instance, to do what is most good and least evil…. the raison d’être of all authorities: punishing the evil and protecting the good…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ray-e-heiple-jr.html">Ray E. Heiple Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Biblical Case for the Christian Principles of Voting: Everyone in authority is accountable to God to do what they can, according to their power and position, to uphold the moral law of God’</cite>, (2024) at The Aquila Report</span></figcaption>

</figure><figure class="quote" id="q-81609f3c8d" data-kw="">
<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10). 2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6). 3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment. 4. No glory to God could arise from this but rather the dishonor of a tyrannical lord. 5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing. 2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself. 3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such. 4. We are permitted to kill innocent creatures. Reply. 1. Not rational ones. 2. Irrational ones (bruta) for our use (2 Pet. 2:12). 3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>

<blockquote><p>2. The civil corporation may: [1.] limit the major [an official] in regard of time, for a year and no longer; 2. they may make him half a tyrant, a dictator and absolute, or give him less power, that he shall rule none but with the consent of 12 assessors; but the people may not make him a pastor for a year and then lay him aside for no fault as a major is unofficed; nor may they limit him so as he shall not preach in season and out of season but by the consent of 12 men. 3. The corporation may erect itself in a kingdom or commonwealth and may create consuls, dictators, praetors, tribunos plebis, etc. as may most serve for the safety and peace of this State; but the Church may bring in no new officers but those appointed by Christ; nor may they alter the government, and metamorphose it into another than that which is according to the pattern showed in the mount.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, p. 278</span></figcaption>

<blockquote><p>…the Magistrate indeed forbids speaking of blasphemy and teaching of lies in the name of the Lord, but he forbids not teaching of lies, or abstinence from blaspheming, in a spiritual, but in a carnal, co-active, by force of the sword and external way, because he cannot punish the spiritual and internal ways and manner of external obedience, and therefore he cannot under pain of bodily censure command and forbid these ways of obedience; so the Magistrate forbids murder, but God, not the Magistrate, forbids murder, or commands abstinence from killing, out of mercy and love to our neighbor; for the Magistrate cannot punish heart-hatred of our neighbor, or rash anger, but insofar as it comes out to his senses, in striking, maiming, or opprobrious speeches; and these he can forbid and censure and punish. So we say [that] the Magistrate is but a piece, or a bit of an ordinance (though both lawful and necessary, Rom. 13, for our good [v. 4]) to reform the outside and to work outward reformation; and when he commands the outward man and says, ‘Swear not, blaspheme not, speak not lies in the name of the Lord, kill not, steal not under the pain of feeling the stroke of the sword’: he commands not sinning. For though he forbid only external abstinence from sins that troubles the outward man, without any spiritual and internal right way of abstaining, he commands not sin and hypocrisy, per se, and kindly [in its kind], and properly. 1. Because the Magistrate, as the Magistrate, should and ought, as the Minister of God, give commandments to the outward man under pain of corporal punishment, not to the soul or to the inward man. 2. Because that external obedience, not to kill, not to steal, not to speak lies, is good, lawful external obedience, to man, and profitable in the State for the end that God has appointed it, which is the peaceable conversing one with another; that same abstinence from killing in an unrenewed man, who abstains not from killing for fear of God and love to his brethren, is a sinful abstinence and carnal repentance, by accident, and in relation to the Law of God; but the Magistrate neither commands abstinence from killing from an inward spiritual principle, nor forbids he the contrary: he commands not abstinence from false doctrine out of the love that the messenger owes to him who purchased the flock with his blood, nor forbids he such abstinence, but only he commands abstinence from speaking lies to the people of God. 3. If we distinguish obedience, there is first a necessary and good and lawful obedience. 2. There is an obedience complete and entire, and full, and sincere. Outward obedience, which the Magistrate commands, is good and lawful and [is] necessary obedience, and is, in the kind of external and necessary obedience (I mean) necessary for its end, [namely] the safety of the society, not hypocritical, unlawful or sinful. In this notion only it is commanded by the Magistrate, and the omission of it [is] unlawful and punishable by the sword of the deputy and Minister of God. But if we speak of an obedience complete, full and sincere, which is required from the whole man in order to the Law of God, then the outward obedience that the Magistrate demands is not complete, entire, nor sincere, but in relation to the Law of God, which requires entire obedience from the whole man, soul and body, it is not full, not entire, not sincere obedience, but an outside of obedience; but in this sense the Magistrate does not demand obedience to the Law of God, for he has to do with the outward man only and as a Magistrate has nothing to do with the soul and conscience: so then, though the Magistrate command to preach sound doctrine, forbid to preach lies in the name of the Lord, yet he commands not hypocrisy and sin; for this argument may as well prove [that] the Magistrate should neither forbid nor punish murder, nor command abstinence from murder to an unrenewed man, for an unrenewed man cannot but abstain from murder in a sinful way, and his abstinence from murder, in order to the spiritual Law of God, is no better ‘than the oblation of swine’s blood, and the cutting off of a dog’s head to God,’ Isa. 66. 1:2, as is all external obedience of either Tables of the Law, First or Second, without faith and spiritual, inward, moral principles and heart-obedience; and Mr. Williams cannot answer this argument but by the principles of Anabaptists, Familists and Enthusiasts, who say [that] all outward ordinances, ministry, preaching, sacraments, yea preachers and magistrates who command outward obedience to God are unlawful now under the New Testament.</p></blockquote>

 an unrenewed man cannot but abstain from murder in a sinful way, and his abstinence from murder, in order to the spiritual Law of God, is no better ‘than the oblation of swine’s blood, and the cutting off of a dog’s head to God,’ Isa. 66. 1:2, as is all external obedience of either Tables of the Law, First or Second, without faith and spiritual, inward, moral principles and heart-obedience; and Mr. Williams cannot answer this argument but by the principles of Anabaptists, Familists and Enthusiasts, who say [that] all outward ordinances, ministry, preaching, sacraments, yea preachers and magistrates who command outward obedience to God are unlawful now under the New Testament.”

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience… (1649) | Ch. 27, ‘Whether our Darkness &amp; Incapacity to Believe…’, p. 323-5 (356-8)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Magistrate+indeed+forbids+speaking+of+blasphemy+and+teaching+of+lies+in+the+name+of+the+Lord%2C+but+he+forbids+not+teaching+of+lies%2C+or+abstinence+from+blaspheming%2C+in+a+spiritual%2C+but+in+a+carnal%2C+co-active%2C+by+force+of+the+sword+and+external+way%2C+because+he+cannot+punish+the+spiritual+and+internal+ways+and+manner+of+external+obedience%2C+and+therefore+he+cannot+under+pain+of+bodily+censure+command+and+forbid+these+ways+of+obedience%3B+so+the+Magistrate+forbids+murder%2C+but+God%2C+not+the+Magistrate%2C+forbids+murder%2C+or+commands+abstinence+from+killing%2C+out+of+mercy+and+love+to+our+neighbor%3B+for+the+Magistrate+cannot+punish+heart-hatred+of+our+neighbor%2C+or+rash+anger%2C+but+insofar+as+it+comes+out+to+his+senses%2C+in+striking%2C+maiming%2C+or+opprobrious+speeches%3B+and+these+he+can+forbid+and+censure+and+punish.+So+we+say+%5Bthat%5D+the+Magistrate+is+but+a+piece%2C+or+a+bit+of+an+ordinance+%28though+both+lawful+and+necessary%2C+Rom.+13%2C+for+our+good+%5Bv.+4%5D%29+to+reform+the+outside+and+to+work+outward+reformation%3B+and+when+he+commands+the+outward+man+and+says%2C+%E2%80%98Swear+not%2C+blaspheme+not%2C+speak+not+lies+in+the+name+of+the+Lord%2C+kill+not%2C+steal+not+under+the+pain+of+feeling+the+stroke+of+the+sword%E2%80%99%3A+he+commands+not+sinning.+For+though+he+forbid+only+external+abstinence+from+sins+that+troubles+the+outward+man%2C+without+any+spiritual+and+internal+right+way+of+abstaining%2C+he+commands+not+sin+and+hypocrisy%2C+per+se%2C+and+kindly+%5Bin+its+kind%5D%2C+and+properly.+1.+Because+the+Magistrate%2C+as+the+Magistrate%2C+should+and+ought%2C+as+the+Minister+of+God%2C+give+commandments+to+the+outward+man+under+pain+of+corporal+punishment%2C+not+to+the+soul+or+to+the+inward+man.+2.+Because+that+external+obedience%2C+not+to+kill%2C+not+to+steal%2C+not+to+speak+lies%2C+is+good%2C+lawful+external+obedience%2C+to+man%2C+and+profitable+in+the+State+for+the+end+that+God+has+appointed+it%2C+which+is+the+peaceable+conversing+one+with+another%3B+that+same+abstinence+from+killing+in+an+unrenewed+man%2C+who+abstains+not+from+killing+for+fear+of+God+and+love+to+his+brethren%2C+is+a+sinful+abstinence+and+carnal+repentance%2C+by+accident%2C+and+in+relation+to+the+Law+of+God%3B+but+the+Magistrate+neither+commands+abstinence+from+killing+from+an+inward+spiritual+principle%2C+nor+forbids+he+the+contrary%3A+he+commands+not+abstinence+from+false+doctrine+out+of+the+love+that+the+messenger+owes+to+him+who+purchased+the+flock+with+his+blood%2C+nor+forbids+he+such+abstinence%2C+but+only+he+commands+abstinence+from+speaking+lies+to+the+people+of+God.+3.+If+we+distinguish+obedience%2C+there+is+first+a+necessary+and+good+and+lawful+obedience.+2.+There+is+an+obedience+complete+and+entire%2C+and+full%2C+and+sincere.+Outward+obedience%2C+which+the+Magistrate+commands%2C+is+good+and+lawful+and+%5Bis%5D+necessary+obedience%2C+and+is%2C+in+the+kind+of+external+and+necessary+obedience+%28I+mean%29+necessary+for+its+end%2C+%5Bnamely%5D+the+safety+of+the+society%2C+not+hypocritical%2C+unlawful+or+sinful.+In+this+notion+only+it+is+commanded+by+the+Magistrate%2C+and+the+omission+of+it+%5Bis%5D+unlawful+and+punishable+by+the+sword+of+the+deputy+and+Minister+of+God.+But+if+we+speak+of+an+obedience+complete%2C+full+and+sincere%2C+which+is+required+from+the+whole+man+in+order+to+the+Law+of+God%2C+then+the+outward+obedience+that+the+Magistrate+demands+is+not+complete%2C+entire%2C+nor+sincere%2C+but+in+relation+to+the+Law+of+God%2C+which+requires+entire+obedience+from+the+whole+man%2C+soul+and+body%2C+it+is+not+full%2C+not+entire%2C+not+sincere+obedience%2C+but+an+outside+of+obedience%3B+but+in+this+sense+the+Magistrate+does+not+demand+obedience+to+the+Law+of+God%2C+for+he+has+to+do+with+the+outward+man+only+and+as+a+Magistrate+has+nothing+to+do+with+the+soul+and+conscience%3A+so+then%2C+though+the+Magistrate+command+to+preach+sound+doctrine%2C+forbid+to+preach+lies+in+the+name+of+the+Lord%2C+yet+he+commands+not+hypocrisy+and+sin%3B+for+this+argument+may+as+well+prove+%5Bthat%5D+the+Magistrate+should+neither+forbid+nor+punish+murder%2C+nor+command+abstinence+from+murder+to+an+unrenewed+man%2C+for+an+unrenewed+man+cannot+but+abstain+from+murder+in+a+sinful+way%2C+and+his+abstinence+from+murder%2C+in+order+to+the+spiritual+Law+of+God%2C+is+no+better+%E2%80%98than+the+oblation+of+swine%E2%80%99s+blood%2C+and+the+cutting+off+of+a+dog%E2%80%99s+head+to+God%2C%E2%80%99+Isa.+66.+1%3A2%2C+as+is+all+external+obedience+of+either+Tables+of+the+Law%2C+First+or+Second%2C+without+faith+and+spiritual%2C+inward%2C+moral+principles+and+heart-obedience%3B+and+Mr.+Williams+cannot+answer+this+argument+but+by+the+principles+of+Anabaptists%2C+Familists+and+Enthusiasts%2C+who+say+%5Bthat%5D+all+outward+ordinances%2C+ministry%2C+preaching%2C+sacraments%2C+yea+preachers+and+magistrates+who+command+outward+obedience+to+God+are+unlawful+now+under+the+New+Testament.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%E2%80%A6+%281649%29+%7C+Ch.+27%2C+%E2%80%98Whether+our+Darkness+%26+Incapacity+to+Believe%E2%80%A6%E2%80%99%2C+p.+323-5+%28356-8%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F15291052f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/15291052f3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=the%20Magistrate%20indeed%20forbids%20speaking%20of,unlawful%20now%20under%20the%20New%20Testament&amp;text=the%20Magistrate%20indeed%20forbids%20speaking%20of%20blasphemy%20and&amp;text=God%20are%20unlawful%20now%20under%20the%20New%20Testament" rel="noopener" target="_blank">Read it online

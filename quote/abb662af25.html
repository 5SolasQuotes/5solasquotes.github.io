<blockquote><p>The third matter to be noted in this [fourth] commandment is the added incentives. These are three in number.

(1) There is the example of God. God has created man after His image. This holy disposition of soul must also be manifested by man‘s deeds, and when he is thus active, he must be engaged in harmony with both God‘s commandment as well as His example. “Be ye therefore followers of God, as dear children” (Eph 5:1). God, after being engaged in the work of creation for six days, rested upon the seventh day, and by so doing has designated this as an example to be followed. Man must be motivated by this to do likewise.

(2) The second incentive is taken from that which is to our benefit. “Therefore the Lord blessed the sabbath day.” This does not imply that inherent efficacy was bestowed upon this day in order to render it profitable to man. Rather, it is a promise of blessing made to the conscientious observers of that day; that is, the receipt of comfort, joy, and holiness for the soul, and to render the physical labour of the six workdays to be more prosperous and profitable. For everything is dependent upon the blessing of the Lord, and without this all our labour is in vain (Ps 127:1-2).

(3) The third incentive is derived from God’s command and the appropriateness of obedience to it. He hallowed it. The Lord has set this day apart for sacred usage in order that man may solemnly and uniformly glorify and serve Him with a holy rest. No one may therefore make this day a common day by using it as other days and spending it by working. Rather, according to God’s command, we must acknowledge it as having been set apart and spend it in a fashion which is consistent with the purpose for which God has set it apart and designated it.</p></blockquote>

<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>

<blockquote><p>But the problem is that many people today do not read books with a desire to learn, whatever they may be about, but rather seek to find something to attack. And if they are able to quibble over a single word, it acts as a stumbling block that prevents them from benefiting in any way at all. Then ignoring all the good in the book, they pride themselves in a way that causes their downfall. Even worse, the most ignorant are the most outspoken and critical. Others are so finicky that a single detail can put them right off, so much so that a single sentence that is not to their taste turns them away from the book as a whole, even though it may contain a great deal that they would be well advised to dwell upon.

It is no doubt a trick of the devil to turn them aside and stop them from receiving sound doctrine presented them. So those who would reap any profit from this book should cultivate a teachable spirit, putting aside anything that is an obstacle to progress, so that they might advance on the straight path that leads towards the pure truth of God, the only thing we are called to hold to, using those human means to help us reach that goal.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But the problem is that many people today do not read books with a desire to learn, whatever they may be about, but rather seek to find something to attack. And if they are able to quibble over a single word, it acts as a stumbling block that prevents them from benefiting in any way at all. Then ignoring all the good in the book, they pride themselves in a way that causes their downfall. Even worse, the most ignorant are the most outspoken and critical. Others are so finicky that a single detail can put them right off, so much so that a single sentence that is not to their taste turns them away from the book as a whole, even though it may contain a great deal that they would be well advised to dwell upon.

It is no doubt a trick of the devil to turn them aside and stop them from receiving sound doctrine presented them. So those who would reap any profit from this book should cultivate a teachable spirit, putting aside anything that is an obstacle to progress, so that they might advance on the straight path that leads towards the pure truth of God, the only thing we are called to hold to, using those human means to help us reach that goal.”

y-of-purism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>10. Ye observe days. He adduces as an instance one description of “elements,” the observance of days. No condemnation is here given to the observance of dates in the arrangements of civil society. The order of nature out of which this arises, is fixed and constant. How are months and years computed, but by the revolution of the sun and moon? What distinguishes summer from winter, or spring from harvest, but the appointment of God, — an appointment which was promised to continue to the end of the world? (Genesis 8:22.) The civil observation of days contributes not only to agriculture and to matters of politics, and ordinary life, but is even extended to the government of the church. Of what nature, then, was the observation which Paul reproves? It was that which would bind the conscience, by religious considerations, as if it were necessary to the worship of God, and which, as he expresses it in the Epistle to the Romans, would make a distinction between one day and another. (Romans 14:5.)

When certain days are represented as holy in themselves, when one day is distinguished from another on religious grounds, when holy days are reckoned a part of divine worship, then days are improperly observed. The Jewish Sabbath, new moons, and other festivals, were earnestly pressed by the false apostles, because they had been appointed by the law. When we, in the present age, intake a distinction of days, we do not represent them as necessary, and thus lay a snare for the conscience; we do not reckon one day to be more holy than another; we do not make days to be the same thing with religion and the worship of God; but merely attend to the preservation of order and harmony. The observance of days among us is a free service, and void of all superstition.

11. Lest I have bestowed upon you labour in vain. The expression is harsh, and must have filled the Galatians with alarm; for what hope was left to them, if Paul’s labour had been in vain? Some have expressed astonishment that Paul should be so powerfully affected by the observance of days, as almost to designate it a subversion of the whole gospel. But if we carefully weigh the whole, we shall see that there was just reason; and that the false apostles not only attempted to lay the yoke of Jewish bondage on the neck of the church, but filled their minds with wicked superstitions. To bring back Christianity to Judaism, was in itself no light evil; but far more serious mischief was done, when, in opposition to the grace of Christ, they set up holidays as meritorious performances, and pretended that this mode of worship would propitiate the divine favour. When such doctrines were received, the worship of God was corrupted, the grace of Christ made void, and the freedom of conscience oppressed.

Do we wonder that Paul should be afraid that he had laboured in vain, that the gospel would henceforth be of no service? And since that very description of impiety is now supported by Popery, what sort of Christ or what sort of gospel does it retain? So far as respects the binding of consciences, they enforce the observance of days with not less severity than was done by Moses. They consider holidays, not less than the false apostles did, to be a part of the worship of God, and even connect with them the diabolical notion of merit. The Papists must therefore be held equally censurable with the false apostles; and with this addition in aggravation, that, while the former proposed to keep those days which had been appointed by the law of God, the latter enjoin days, rashly stamped with their own seal, to be observed as most holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles of Paul to the Galatians and Ephesians</cite>, trans. William Pringle (1548) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), xxi, 124-25.</span></figcaption>

<blockquote><p>The Scriptures, with equal explicitness, forbid travel upon the Sabbath-day. “Thy stranger that is within thy gates” is put down by name in the fourth commandment, and is as much required to keep the Sabbath holy as any other person. So in Ex. 23: 12, “the stranger” is required to “rest,” and the reason is given, that he “may be refreshed.”

Many and ingenious, but wicked are the pleas urged by men for disregarding the fourth commandment when on a journey; but they are “refuges of lies,” which will be swept away the moment man appears in the presence of God.

This is a great sin in our nation. Its influence is vastly mischievous. The traveller is seen by many, and sins openly. He requires the services of those who conduct the public conveyances; or, if travelling privately, he at least demands the services of keepers of public or private houses. The whole moral law, including the fourth commandment, was given from Sinai to a whole nation on a journey.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-057c8549ea" data-kw="">
<blockquote><p>Besides the moral law, God gave to Israel ceremonial and judicial laws; the two latter are of limited and temporary use; the former is of universal and perpetual obilgation. … 2. The judicial law respected the Jews in their political capacity, or as a nation, and consisted of those institutions which God prescribed to them for their civil government. This law, as far as the Jewish polity was peculiar, has also been entirely abolished; but as far as it contains any statute founded in the law of nature common to all nations, it is still obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Confession of Faith</cite>, 19.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-2ba957fe02" data-kw="">
<blockquote><p>The Law is natural to man. God has engraven it in his heart from creation (Rom 1:32; 2:14,15). When, a long time afterwards, God made and exhibited the two Tables of the Law, this was not to make a new law, but only to restore our first knowledge of the natural law which, because of the corruption of sin, was little by little becoming obliterated from the heart of man (Rom 7:8-9).</p></blockquote>

</figure><figure class="quote" id="q-8b1561376e" data-kw="">
<blockquote><p>It is not in men’s free will that they have government or no government, because it is not in their free will to obey or not to obey the acts of the court of nature, which is God’s court; and this court enacts that societies suffer not mankind to perish, which must necessarily follow if they appoint no government; also it is proved elsewhere, that no moral acts, in their exercises and use, are left indifferent to us…</p></blockquote>

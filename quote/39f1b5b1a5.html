<main class="wrap"><figure class="quote" id="q-39f1b5b1a5" data-kw="">
<blockquote><p>73. Q. What reason have you to believe in the mission and doctrine of Christ?

1. I believe in Christ, because in Him were fulfilled a great variety of prophecies, that were uttered some ages before He appeared; and by Him were wrought many miracles, or wonderful works, which “no man could do except God were with him.” (John iii. 2). This I know on the evidence of testimony more powerful than what was ever employed to establish the truth of any other fact – the testimony of a great number of witnesses, or irreproachable characters; who showed no symptoms of enthusiasm; who were capable of judging of what they saw and heard; whose declarations were consistent, although made at different times, in different language, and in different circumstances; whose evidence was contrary at once to their strongest prejudices and their worldly interest; who, notwithstanding, gave it boldly and distinctly; who maintained it by a life of danger and suffering; and who (many of them at least) sealed it with their blood, amidst tortures and in death.

2. I believe in the religion of Christ, because it is worth of God to promulgate, and every way suitable to the nature and circumstances of man; because it contains the sublimest truths and the purest system of morality that were ever taught; and because, with all this excellence, it was published not only at a time when the world around was grossly mistaken with respect to the very first principles of Religion and Morals, but also by men who were utterly unqualified of themselves for teaching mankind.

3. I believe in the religion of Christ, because, although it was universally resisted by interested priests and civil rulers, by bigoted Jews and idolatrous mobs: although it opposed the whole current of religious opinion, and condemned the most favourable practices that prevailed in those times; although it was preached by none almost but men of low birth, without force, without learning, and without influence; although the most effectual means that can be imagined were made use of to crush and destroy it: yet in spite of all these disadvantages, it made such a rapid and triumphant progress, that in the space of thirty years after the death of Christ it was diffused over the greatest part of the then known world; which astonishing success can be reasonably ascribed to nothing else than the power of God accompanying the labour of the Apostles.

4. Lastly, I believe in Christ, because He delivered several prophecies which were afterwards most exactly fulfilled:- one, in particular, of the destruction of Jerusalem, which was so circumstantially foretold, and so minutely accomplished, that we should consider the language of our Saviour rather as a history than a prediction of the event, were we not certainly informed on the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-thomson.html">Andrew Thomson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism for the Instruction of Communicants in the Nature and Uses of the Sacrament of our Lord’s Supper, and in the Doctrines and Duties connected with that Ordinance</cite>, (Edinburgh: William Ritchie, [1807]), pp 16-18.</span></figcaption>

</figure><figure class="quote" id="q-206407605a" data-kw="">
<blockquote><p>It cannot be necessary for the Author to disclaim hostility to the English Church. Differing as he does decidedly from that Establishment on some important points of ecclesiastical polity, he regards it with affectionate veneration as a Church of Christ. One object, indeed, of the following pages, is to show that, as a Body, the Church of England is not chargeable with holding the doctrines of the Oxford School.

They are not sanctioned by her Articles. They are opposed to the spirit of her Reformers. And although they have been advocated by some of her private Doctors since the beginning of the seventeenth century, the Church is not responsible for them otherwise than by tolerating their promulgation within her pale.

But should they now unfortunately acquire the ascendency, I am persuaded that every faithful minister of Christ in Scotland will respond to the words of the Genevese Reformer [John Calvin], when, contemplating such a disastrous result, he exclaims, — “Ah! we too, the Christians of the Continent, and of the whole world, shall clothe us in mourning, if this empire be brought low. We love her for the sake of Christ Jesus,—for His sake we pray for her. But if the apostacy already begun shall work itself out, we shall have nothing left for her but wailing, and sighs, and tears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the “Tracts for the Times.”</cite>, (Edinburgh: John Johnstone, 1843), iv.</span></figcaption>

They are not sanctioned by her Articles. They are opposed to the spirit of her Reformers. And although they have been advocated by some of her private Doctors since the beginning of the seventeenth century, the Church is not responsible for them otherwise than by tolerating their promulgation within her pale.

But should they now unfortunately acquire the ascendency, I am persuaded that every faithful minister of Christ in Scotland will respond to the words of the Genevese Reformer [John Calvin], when, contemplating such a disastrous result, he exclaims, — “Ah! we too, the Christians of the Continent, and of the whole world, shall clothe us in mourning, if this empire be brought low. We love her for the sake of Christ Jesus,—for His sake we pray for her. But if the apostacy already begun shall work itself out, we shall have nothing left for her but wailing, and sighs, and tears.”

<main class="wrap"><figure class="quote" id="q-6e4d73afe0" data-kw="">
<blockquote><p>We teach and define as a divinely revealed dogma that when the Roman pontiff speaks ex cathedra, that is, when, in the exercise of his office as shepherd and teacher of all Christians, in virtue of his supreme apostolic authority, he defines a doctrine concerning faith or morals to be held by the whole church, he possesses, by the divine assistance promised to him in blessed Peter, that infallibility which the divine Redeemer willed his church to enjoy in defining doctrine concerning faith or morals. Therefore, such definitions of the Roman pontiff are of themselves, and not by the consent of the church, irreformable. So then, should anyone, which God forbid, have the temerity to reject this definition of ours: let him be anathema.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-vatican-council.html">First Vatican Council</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Session 4, July 1870, chapter 4, “On the Infallible Teaching Authority of the Roman Pontiff”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bee4d8906f" data-kw="">
<blockquote><p>Those, though otherwise never so godly, that separate from true Churches, like Novatus and Lucifer, for a stricter course of discipline; like Donatus for some bad ones in the Church, as they supposed; like Andius for some lesser corruptions and abuses, they be schismatics. This is the judgment of ancient Churches, for which see at large, Mornay, On the Church, p. 35. But our late Separatists do divide themselves from us upon like grounds: for a more strict discipline with Novatus and Lucifer; for that good and bad are mixed together, with Donatus; and from lesser corruptions among us with Andius. Therefore are these also schismatics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical... (London: 1610) | 2nd Likelihood</cite>, p. 48</span></figcaption>

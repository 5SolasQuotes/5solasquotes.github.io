<main class="wrap"><figure class="quote" id="q-15a0b0e7a3" data-kw="mortification vivification">
<blockquote><p>Rather, it is used strictly for a real and internal renovation of man by which God delivers the man planted in Christ by faith and justified (by the ministry of the word and the efficacy of the Spirit) more and more from his native depravity and transforms him into his own image. Thus with separation from the world and sin and consecration to God, which is the killing of the old man and the vivifying of the new.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.1.2b</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Mortification of Sin in Believers</cite>, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>

</figure><figure class="quote" id="q-6f347f3ddc" data-kw="Mortification">

</figure><figure class="quote" id="q-e1ff0babb0" data-kw="Mortification">
<blockquote><p>The Apostle himself in Rom. 6 &amp; 7 shows quite openly that concupiscence is sin properly so called: for not only does he often call it sin, but not good, evil, to be held in hatred, fighting against the law of God, to be crucified, mortified, and destroyed, and rendering that man miserable in whom it resides.</p></blockquote>

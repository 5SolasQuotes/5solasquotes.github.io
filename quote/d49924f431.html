<main class="wrap"><figure class="quote" id="q-d49924f431" data-kw="">
<blockquote><p>I wish to say something, in the next place, about the Revised Version of the New Testament, which has justly excited so much interest during the last few months. I regard the work of the Revisers with deep thankfulness, and I believe that all English-speaking Christians ought to feel extremely grateful to them. In saying this, I ask you not to misunderstand me. I am not able to swell the chorus of unmixed praise with which some have received the Revised Version.

I cannot admit the correct­ness of all the new renderings of the Greek text. I think that, with an honest and conscientious desire to be strictly literal, the Revisers have sometimes made needless transpositions of words, and by so doing have not left the sense more plain. I think their English is occasionally more tame and prosaic than that of the Authorized Version, without being more faithful to the original Greek. I fail to see that in their praiseworthy effort to give the full force of the Greek article they have always been quite consistent. But, after all, this is only the opinion of one man, who may very possibly be mistaken. The things I have named are like spots in the face of the sun, and, if they are errors, they can be revised again. Taking it for all in all, the work is a great work, and deserves the thanks of all British Christians. It throws clearer light on many texts of Holy Scripture, and ought to be highly prized and diligently used by thousands.

But the main reason for thankfulness about the Revised Version, which I commend to the attention of my clergy, is the glorious testimony which it bears to the soundness of the whole doctrinal system of Christianity. After ten years of patient and diligent investigation, after careful examination of versions and manuscripts not known 250 years ago, after the united labour of the ablest committee of Biblical scholars that could be got together, after all this, the Revised Version comes forth from the crucible without the loss of a single doctrine of our most holy faith; let me rather say with every doctrine more fully established than ever. Who does not know that many of the enemies of Christianity in this land have made the alleged defects of our Authorized Version the chief ground of their attacks on the Gospel? ‘Give us a new translation,’ they have often cried, ‘and you will see what will become of your favourite dogmas.’

The Revised Version supplies a crushing answer to all these assailants. The New Testament has been translated once more by men whose competency none can dispute. And what is the result? Not a single stone in the fabric of Christian truth has been disturbed! The Trinity, the proper Deity of Christ, the personality of the Holy Ghost, and the atonement, remain just where they were, and are even more clearly brought out than before. For all this, I ask you to join me in thanking, blessing, and praising God. We may boldly say, ‘Thy Word is truth.’ ‘Thy Word is very pure: therefore thy servant loveth it.’ (John xvii. 17; Ps. cxix. 140.)

I cannot pass away from this subject without expressing a hope that none of my clergy will use the Revised Version, instead of the Authorized, in reading the lessons in Church until the practice is formally sanctioned by law. At present, however some may dispute it, the weight of evidence and opinion is most decidedly against it. Let there be no division among us on the subject. Let us not have the Diocese split into two parties—the readers of the new version and the readers of the old. ‘He that believeth shall not make haste.’ Let us be content at present to use the old version, which, with all its defects, has done such good service for 250 years, until further order is taken by authority. Give the results of the revision, if you please, in your pulpits, by way of commentary. But in the reading desk I strongly advise you to use the Authorized Version.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>For Doctrinal Christianity: A Charge at the Primary Visitation in Wigan, October 20, 1881 in Charges and Addresses</cite></span></figcaption>

</figure><figure class="quote" id="q-ee2387690c" data-kw="">
<blockquote><p>To deny the procession of the Holy Ghost from the Son, is a grievous error in divinity, and would have grated the foundation, if the Greek Church had so denied the procession of the Holy Ghost from the Son, as that they had made an inequality between the Persons. But since their form of speech is, ‘That the Holy Ghost proceeds from the Father by the Son, and is the Spirit of the Son,’ without making any difference in the consubstantiality of the Persons, it is a true, though an erroneous Church in this particular. Diverse learned men think, that a filio [by the Son] &amp; per filium [through the Son] in the sense of the Greek Church, was but a question in modo loquendi, ‘in manner of speech,’ and not fundamental.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, II.xvi</cite>, p. 214</span></figcaption>

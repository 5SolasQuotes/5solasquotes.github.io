<blockquote><p>That man’s glorification shifts [the Christian’s] participation [in grace] towards perichoresis, or theosis, seals the Eastern Orthodox emphasis… In this paper I will argue that, from a Reformed perspective, man’s glorification through his communion and participation in the Trinity does lead to a oneness that is not perichoretic but is still advanced and fuller than earthly communion.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6be95af5f6" data-kw="">
<blockquote><p>But in all the things that God has made… there is nothing which can properly be likened to the nature of God: neither are there any words in the mouths of men that can properly be spoken of it: neither are there any similitudes of man’s inuention that can rightly and squarely agree with the divine essence. And St. Basil, disputing De Ousia &amp; Hypostasi, says: ‘It cannot be that the comparisons of examples should in all points be like to those things, to the use whereof the examples do serve. Thou mayest say that injury is done to the majesty of God if it be compared with mortal things. But for because the holy scripture does not a little condescend and attemper itselfe to our infirmity, I will put a similitude, although in very deed much unlike, which is usually taken and commonly used. Behold the sun and the beams that come from it, and then the heat that proceedes from them both. As the sun is the head-spring of the light and the heat: so is the Father the headspring of the Son, who is light of light. And as of the sun and the beams together the heat does come, so of the Father and the Son together the holy Ghost proceeds. But now, put case, or imagine that the sun were such, as never had beginning, nor ever shall have ending, and should not then I pray you, ye beams of this everlasting sun be everlasting too? and should not the heat, which proceeds of them both, be everlasting as well as they? Finally, should not the Son be one still in essence or substance, and three by reason of the three subsistences or persons? This parable of the sun did Tertullian use (contra Praxeam.), whose words, which do also contain other similitudes, I will not be grieved to recite unto you. ‘I wil not doubt’ (says he) ‘to call both the stalk of a root, the brook of a springhead, and a beam of the sun, by the name of a son: for every original is a parent and every thing that issues of that original is a son: much more then the Word of God may be called a Son, which even properly has the name of Son, and yet neither is the stalk separated from the root, nor the brook from the springhead, nor the beam from the sun, no more is the Word separated from God. Therefore according to the fashion of these examples I profess that I say there are two, God &amp; his Word, the Father and his Son. For the root and the stalk are two things, but joined in one. And the springhead and the brook are two kinds, but undivided. And the sun and the beams are two forms, but both cleaving the one to the other. Everything that comes of anything must needs be second to that out of which it comes, and yet it is not separated from that from which it proceeds. But where a second is, there are two, and where a third is there are three. For the third is the spirit of God and the Son: even as the third from the root is the fruit of the stalk, the third from the springhead is the river of the brook, and the third from the sun is the heat of the beam: yet none of these is alienated from the matrix [womb] of which they take the properties that they have. So the Trinity descending by annexed and linked degrees from the Father, does not make against the monarchy, and does defend the economical state, that is, the mystery of the dispensation. Understand everywhere that I profess this rule wherein I testify, that the Father, the Son and the Holy Ghost are unseparated one from another, and so thou shalt know how everything is spoken.’ And so forth. For all these are the words of Tertullian, who flourished in Africa not long after the age of the apostles.</p></blockquote>

<blockquote><p>Every cause is a principle of some sort. So one must first explain the notion of principle so that the notion of cause may be understood. A principle is defined as that from which something in some way proceeds. That which proceeds is called the ‘principiate’, or what has been ‘principled’. Between principle and principled there must be some connection. If this connection is merely external and without any inflowing of the principle to the principled, the principle is better referred to as a ‘beginning’. If, on the other hand, the connection is internal and consists in a positive inflowing of one to the other, the first is properly called a principle. Dawn is the principle of a day in the sense of beginning, and likewise the point in respect of a line. Parents with respect to their children, on the contrary, are properly called principles. The positive inflowing between principle and principled can be either logical or real. An inflowing is logical if the principle is the reason that the principled is known. In this way the premises of a syllogism are principles with respect to the conclusion (of science). The inflowing is real or ontological if the principle gives being to the principled.¹ ¹ Among philosophers an ontological principle is the same as a cause. Theologians however distinguish between a principle that is a cause and one that is not a cause. A principle that is not a cause communicates its own proper being such that the nature of the giver and of the receiver is numerically the same. Thus in the Sacred Trinity the Father is the principle of the Son but is not the cause of the Son. A principle is called a cause only if it communicates an existence or being-ness that is numerically distinct from itself. A cause is defined as a principle that, by its positive inflowing, determines the existence of something else…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 4, p. 38</span></figcaption>

<blockquote><p>And as the Author, and fellow-Counsellor, and Framer of the things that are in formation, He begot the Word; and as He bears this Word in Himself, and that, too, as (yet) invisible to the world which is created, He makes Him visible; (and) uttering the voice first, and begetting Him as Light of Light, He set Him forth to the world as its Lord, (and) His own mind; and whereas He was visible formerly to Himself alone, and invisible to the world which is made, He makes Him visible in order that the world might see Him in His manifestation, and be capable of being saved. 11. And thus there appeared another beside Himself. But when I say another, I do not mean that there are two Gods, but that it is only as light of light, or as water from a fountain, or as a ray from the sun. For there is but one power, which is from the All; and the Father is the All, from whom comes this Power, the Word. And this is the mind which came forth into the world, and was manifested as the Son of God. All things, then, are by Him, and He alone is of the Father. Who then adduces a multitude of gods brought in, time after time? For all are shut up, however unwillingly, to admit this fact, that the All runs up into one.</p></blockquote>

<blockquote><p>VI. On the Personality of God. The use has spread among pantheists of denying God’s true and real personality, so that those who defend a personal God are accused by them of anthropomorphism, as if the notion of personality cannot apply to God without anthropomorphizing Him, or constituting Him in the image and likeness of humans. These views are widely disseminated in Hegelian philosophy, as can be seen in Vera’s Introduction à la philosophie de Hegel. Avant-propos, p. 20, and the following (2nd edition). However, to deny the existence of a personal God is tantamount to denying God Himself, nor does asserting the personal nature of God lead to anthropomorphism. Let us prove both assertions.

VII. The Admission of a Personal God. We defined elsewhere a suppositum, which is a perfectly subsistent substance, self-owned and incommunicable to another. From this it follows that since substantiality, by virtue of its subsistence, is the perfection by which substance exceeds accidents, a fortiori, perfect subsistence, by which a substance becomes self-owned and incommunicable to another, exhibits true and real perfection. And because a spiritual nature is the most perfect among beings, a subsisting complete subsistence (which is therefore called a person, as we stated in Ontology loc. cit.), implies something supremely perfect. Or, as St. Thomas says in STh. I, q. 29, a. 3, “Person signifies what is most perfect in all nature — that is, a subsistent individual of a rational nature.” We have indeed proved the truly and really existing First Efficient Cause of all substances, the Most Perfect Being, the Supreme Reason ordering all created things towards their end; therefore, the first Substance truly exists, most perfect in the notion of subsistence, and therefore fully self-owned and incommunicable, supremely intelligent, most notably endowed with the requisites for the notion of personality; and this first substance is called God. Consequently, God is truly a person, with a personality distinct from other things, as proven against pantheists. However, the term “person” is not applied to God in the same way as it is to creatures but in a more excellent manner, just as other names are attributed to God in a more excellent manner than to creatures. Those who wish to deny a personal God should indeed be considered atheists. For without a doubt, they either concede that God is a real substance, perfectly subsistent and intelligent in Himself, and by this admission, they must acknowledge God as personal, as is evident from what has been said, or they deny to God proper perfect substantiality and intelligence, and in this second hypothesis, God becomes something abstract or indeterminate, like every universal, as the adversaries indeed contend. However, what is abstract, as abstract, and what is indeterminate, as indeterminate, etc., exists not in reality outside the mind but in the mind itself, without its proper actions; for they do not act unless through singulars. Therefore, an impersonal God is merely a concept of reason, and thus by word only God is left, while in reality God is removed. Moreover, not only are the assertions about anthropomorphism absurd but also blatantly ridiculous. For they suppose that the notion of personality requires a body, or that real infinity is incompatible with personality; yet they fail to realize that if personality is a perfection derived uniquely from a spiritual nature, then to any subsisting substance, the notion of personality must correspond to the extent to which it is more spiritual, dissociated from and independent of the body, and possesses the most perfect nature. Now, God is in the highest degree of spirituality and infinite perfection. Therefore, He is in the highest degree of personality, so that personality in God not only does not imply anthropomorphism but essentially excludes it.</p></blockquote>

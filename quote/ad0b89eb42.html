<blockquote><p>1. The name and profession of a Christian and a Protestant, with going to church, and a heartless lip-service or saying their prayers, is the cloak of all ungodly Protestants. 2. Others, discerning the thinness of this cloak, do think to make themselves a better: and they take up the strictest opinions in religion, and own those which they account the strictest party, and own that which they esteem the purest and most spiritual worship: the cloak of these men is their opinions, party, and way of worship, while their carnal lives detect their hypocrisy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works, vol. 1</cite>, p. 177</span></figcaption>

</figure><figure class="quote" id="q-83bee89ed8" data-kw="">
<blockquote><p>And when the diet of the General Assembly came, having first done what they could for incapacitating all Brethren of differing judgment from these Resolutions, to sit in the Assembly, by citing them to the Assembly as guilty persons… did also make acts appointing and ordaining censures against all persons in this Church, whether Ministers or professors [professing Christians], that did not acknowledge the authority, and submit to the acts and constitutions of that Assembly concerning those Resolutions, and barring all such expectants [those training for the ministry] from entrance to the Ministry as should not acknowledge that authority, and submit to those constitutions; And in their Assembly of the next year at Edinburgh, do provide and ordain presbyteries to take special care, that upon the calling of any expectant to a particular charge of the ministry, before they admit him to his trials, they require him under his hand to pass from the Protestations and Declinators against this and the preceding General Assembly, if he has been accessory to the same; and to promise and give assurance that he shall abstain from holding up debates and controversies about matters of differences in this Kirk since the Assembly, 1650, in preaching, writing, or otherwise; upon the performance whereof, the presbytery shall proceed to his trials; If not, in that case the presbytery shall forbear to proceed, until the next General Assembly; leaving liberty to the presbytery or congregation for planting of the place otherwise: …By these proceedings and practices, the most unjust and irregular that we have known in this Church since we did begin to look at reformation in the year 1638, and which were indeed the great cause of the distempers and distractions that have since followed, malignant and disaffected men in congregations and presbyteries have got up the head, and having the advantage of the acts already mentioned, they do make a bar thereof to shut the door against the calling of able and godly men to the work of the Ministry, who cannot bring their consciences in bondage to these things;… …though yet the protesting Brethren have been tender even of these things [of order in due process], and have made conscience as to do nothing evil and sinful in itself, so to do nothing from contempt or disrespect to the least point of order; yea, they have been careful to keep within the bounds, warranted and allowed unto them of God; And, if it be fit to compare, we may truly say, that for all the noise our Brethren make against them, for the violation of order, and taking irregular courses, they have been more careful than themselves have been, and that they have more just and weighty grievance against them, even upon this accompt [account], than they have against the protesting Brethren:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them… (1658)</cite>, pp. 20-23</span></figcaption>

</figure><figure class="quote" id="q-d44527aed9" data-kw="">
<blockquote><p>First, that the iniquity of the Queen Regent and disorder ought in nowise to withdraw neither our hearts, neither yet the hearts of other subjects, from the obedience due unto our sovereign. Secondly, that if we deposed the said Queen Regent rather of malic and private envy, than for the preservation of the commonwealth, and for that her sins appeared uncurable, that we should not escape God’s just judgment, howsoever that she had deserved rejection from honors. And thirdly,” he required, “that no such sentence should be pronounced against her, but that upon known and open repentance, and upon her conversion to the commonwealth, and submission to the nobility, place shall be granted unto her of regress to the same honors from the which, for just causes, she justly might be deprived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

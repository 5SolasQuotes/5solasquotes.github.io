<main class="wrap"><figure class="quote" id="q-f4bd629bc5" data-kw="">
<blockquote><p>For Rom. 4:11, Abraham is there called the father of all them that believe, whether they were members of a particular visible Church or not. And for ought we find in the holy story, there might be some believers even in Abraham’s own time that were neither members of Abraham’s family, nor yet under the government or guidance of any particular church. If a son or bond-servant of Ephron the Hittite, or of any other Amorite or Canaanite were then brought unto the knowledge of the true God, and to wait for the promise, why might not the infant of such an one have then been circumcised, though not living in a visible Church? … 3. Those that for the present live not under the discipline and a particular Church, and yet make profession of true religion with the true visible Churches, and bring their children to them to be baptised, making solemn promise to bring up their children in the faith that is professed in those Churches; of which sort there are a great number in these Low-countries [the Netherlands], because none here are compelled to the sacraments, nor to subjection under the discipline: These in special are the persons that in our question are ‘without’ [the Church in a certain sense]. These parents, though in regard of that Church where they received their own baptism, and in regard of that Church whereunto they bring their infants to be baptized, they profess and practice some imperfect communion therewith, and therefore in some sense may be said to be of such Churches; yet because for the present they live not within the pale of any ecclesiastical government, neither are subject unto the discipline, either of one or other Church, in this regard are such here commonly said to be ‘without’. Now how Mr. Davenport will deduct and infer from the place alleged [1 Cor. 5:12] that these kind of parents are not to have the privilege of Christians, so far that their infants may be baptized, that cannot I comprehend: this remains to be manifested by him. Those only, according to the order of these Reformed Churches, are admitted for complete members of the Church, who bringing testimony of their good conversation, after examination and profession of their agreement with us in the same faith and religion, and after solemn covenant and promise of submission unto that discipline and government exercised amongst them, have their names published before the whole congregation the Lord’s-Day following, and when no just exception comes against them, are then received and confirmed for members of such particular churches. But that the children of these only are to be baptized, that is not made to appear from the sentence of Paul, 1 Cor. 5:12. For this third sort of persons without, though their fault be great in not joining unto some particular church when opportunity permits, though some through ignorance and error, and some for their carnal case and other sinister respects, do abstain from joining themselves unto the church: yet even among these also some have more knowledge of the truth and are more frequent in attending upon the public worship of God, and are otherwise more unblameable in their conversation than some of those…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paget.html">John Paget</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Unjust Complaints of William Best &amp; of such Other as have Subscribed Thereunto. Also an Answer to Mr. John Davenport [a congregationalist]… his Allegations of Scripture Against the Baptizing of Some Kind of Infants (Amsterdam, 1635), ‘An Answer to the Allegations of Scripture brought by Mr. Davenport, Against the Baptizing of such Infants whose Parents Appear to be Christians…’, p. 141 ff. Paget (c.1574–1638 or 1640) was an English puritan and presbyterian minister in Amsterdam, firmly opposed to the English separatistic and Independent churches that had magnetized to Amsterdam.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f3f8d866d3" data-kw="">
<blockquote><p>Doctrine: We must if occasion require commend good Christians to others. So does Paul Phoebe here, and many others in his epistles. So did the brethren at Lystra and Iconium commend Timothy to Paul, Acts 16:2. So did the Brethren commend Gaius to John, 3 Jn. v. 3, and John, Demetrius, 3 Jn. 12. And in the primative Church it was so ordinary to give Christians letters of commendations, that he which acknowledged them not, was taxed as if he had denyed the faith. And there is great reason for it: For first it concerns them which are requested to commend, that they may show their charity: Secondly, the commended, that they may bee holpen. Thirdly, them to whom, that they may do good to the worthy, and not be deceived by the unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Exposition upon the Whole Thirteenth, Fourteenth, Fifteenth &amp; Sixteenth Chapters of the Epistle of Saint Paul to the Romans… (London: Eld, 1622), on Rom. 16:1-2, p. 314 Parr makes letters of commendation a duty of common Christian charity.</cite></span></figcaption>

</figure><figure class="quote" id="q-a29675f5a3" data-kw="">
<blockquote><p>I confess, when persons are entered into a visible Church-society by baptism, if they will own that profession they were baptized into, and are not guilty either of plain ignorance of it, or manifest scandal, and demand as their right the other ordinances of the Gospel, I see not by what power they may be excluded. If we fix not in a serious visible profession as the ground of giving right, but require positive evidences of grace in every one to be admitted to ordinances as the only thing giving right, for my part, setting aside the many inconveniences besides which attend that in reference to the persons to be admitted, I see not how with a safe and good conscience ordinances can be administered by any. My reason is this: Every one, especially a minister, in that case ought to proceed upon certain grounds that the person admitted has right to the ordinance to be administered; but if positive signs of grace be required, a man’s conscience cannot proceed upon any certainty, without infallible knowledge of another’s spiritual state, which I suppose none will pretend to. My meaning is, that which gives right, must be something evident to the person admitting into it, if it be his duty to enquire after it; but if only positive signs of grace be looked on as giving right, the ground of right can never be so evident to another person, as to proceed with a good conscience, i.e. with a full persuasion of another’s right to the administration of any ordinance to him. If it be said that these are required only as tokens of a true visible profession, and it is that which gives the right, I reply, Our knowledge of, and assent to the conclusion can be no stronger, nor more certain than to the premises from whence it is inferred; if therefore true profession gives right, and our knowledge of that proceeds upon our knowledge of the work of grace, we are left at the same uncertainty we were at before. But if we say, that an outward profession of the Gospel (where there is nothing rendering men uncapable of owning it, which is ignorance, nor declaring they do not own it, which is scandal) is that which gives a visible right to the ordinances of the Church as visible, we have something to fix ourselves upon, and to bottom a persuasion of the right of persons to ordinances. Christ when He instituted Churches, did institute them as visible societies, that is, to have marks whereby to be known and distinguished, as other societies in the world are; now that which puts a difference between this and other societies, is an open profession of Christianity, which profession is looked upon as the outward expression of the internal consent of the soul to the doctrine and laws of the Gospel. Which outward evidence of consent, where there is nothing evidently and directly oppugning it, is that which the Church of God in admission of visible members is to proceed upon. I nowhere find that ever Christ or his apostles in making disciples, or admitting to Church-membership, did exact anymore than a professed willingness to adhere to the doctrine which they preached; nor that they refused any who did declare their desire to join with them. An owning Christianity is all we read of antecedent to admission of Church-members. And if anything else be further required as necessary, we must either say the Word of God is defective in institutions of necessity to the Church, which I suppose the assertors of it will not be so inconsistent to their own principles as to do; or else must produce where anything further is required by the Word of God. … 3. The reality of consent may be sufficiently manifested without an explicit [man-composed Church-] covenant, as in the joining with those who are under the same profession in the common acts of the society and acceptance of, and submission to the rulers of that society, which implicitly is that covenant which they would have expressed; and actions in this case, are as declarative and significative as words.</p></blockquote>

— Edward Stillingfleet, Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined... (London: Mortlock, 1662), pt. 1, ch. 7, pp. 137-39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+confess%2C+when+persons+are+entered+into+a+visible+Church-society+by+baptism%2C+if+they+will+own+that+profession+they+were+baptized+into%2C+and+are+not+guilty+either+of+plain+ignorance+of+it%2C+or+manifest+scandal%2C+and+demand+as+their+right+the+other+ordinances+of+the+Gospel%2C+I+see+not+by+what+power+they+may+be+excluded.+If+we+fix+not+in+a+serious+visible+profession+as+the+ground+of+giving+right%2C+but+require+positive+evidences+of+grace+in+every+one+to+be+admitted+to+ordinances+as+the+only+thing+giving+right%2C+for+my+part%2C+setting+aside+the+many+inconveniences+besides+which+attend+that+in+reference+to+the+persons+to+be+admitted%2C+I+see+not+how+with+a+safe+and+good+conscience+ordinances+can+be+administered+by+any.+My+reason+is+this%3A+Every+one%2C+especially+a+minister%2C+in+that+case+ought+to+proceed+upon+certain+grounds+that+the+person+admitted+has+right+to+the+ordinance+to+be+administered%3B+but+if+positive+signs+of+grace+be+required%2C+a+man%E2%80%99s+conscience+cannot+proceed+upon+any+certainty%2C+without+infallible+knowledge+of+another%E2%80%99s+spiritual+state%2C+which+I+suppose+none+will+pretend+to.+My+meaning+is%2C+that+which+gives+right%2C+must+be+something+evident+to+the+person+admitting+into+it%2C+if+it+be+his+duty+to+enquire+after+it%3B+but+if+only+positive+signs+of+grace+be+looked+on+as+giving+right%2C+the+ground+of+right+can+never+be+so+evident+to+another+person%2C+as+to+proceed+with+a+good+conscience%2C+i.e.+with+a+full+persuasion+of+another%E2%80%99s+right+to+the+administration+of+any+ordinance+to+him.+If+it+be+said+that+these+are+required+only+as+tokens+of+a+true+visible+profession%2C+and+it+is+that+which+gives+the+right%2C+I+reply%2C+Our+knowledge+of%2C+and+assent+to+the+conclusion+can+be+no+stronger%2C+nor+more+certain+than+to+the+premises+from+whence+it+is+inferred%3B+if+therefore+true+profession+gives+right%2C+and+our+knowledge+of+that+proceeds+upon+our+knowledge+of+the+work+of+grace%2C+we+are+left+at+the+same+uncertainty+we+were+at+before.+But+if+we+say%2C+that+an+outward+profession+of+the+Gospel+%28where+there+is+nothing+rendering+men+uncapable+of+owning+it%2C+which+is+ignorance%2C+nor+declaring+they+do+not+own+it%2C+which+is+scandal%29+is+that+which+gives+a+visible+right+to+the+ordinances+of+the+Church+as+visible%2C+we+have+something+to+fix+ourselves+upon%2C+and+to+bottom+a+persuasion+of+the+right+of+persons+to+ordinances.+Christ+when+He+instituted+Churches%2C+did+institute+them+as+visible+societies%2C+that+is%2C+to+have+marks+whereby+to+be+known+and+distinguished%2C+as+other+societies+in+the+world+are%3B+now+that+which+puts+a+difference+between+this+and+other+societies%2C+is+an+open+profession+of+Christianity%2C+which+profession+is+looked+upon+as+the+outward+expression+of+the+internal+consent+of+the+soul+to+the+doctrine+and+laws+of+the+Gospel.+Which+outward+evidence+of+consent%2C+where+there+is+nothing+evidently+and+directly+oppugning+it%2C+is+that+which+the+Church+of+God+in+admission+of+visible+members+is+to+proceed+upon.+I+nowhere+find+that+ever+Christ+or+his+apostles+in+making+disciples%2C+or+admitting+to+Church-membership%2C+did+exact+anymore+than+a+professed+willingness+to+adhere+to+the+doctrine+which+they+preached%3B+nor+that+they+refused+any+who+did+declare+their+desire+to+join+with+them.+An+owning+Christianity+is+all+we+read+of+antecedent+to+admission+of+Church-members.+And+if+anything+else+be+further+required+as+necessary%2C+we+must+either+say+the+Word+of+God+is+defective+in+institutions+of+necessity+to+the+Church%2C+which+I+suppose+the+assertors+of+it+will+not+be+so+inconsistent+to+their+own+principles+as+to+do%3B+or+else+must+produce+where+anything+further+is+required+by+the+Word+of+God.+%E2%80%A6+3.+The+reality+of+consent+may+be+sufficiently+manifested+without+an+explicit+%5Bman-composed+Church-%5D+covenant%2C+as+in+the+joining+with+those+who+are+under+the+same+profession+in+the+common+acts+of+the+society+and+acceptance+of%2C+and+submission+to+the+rulers+of+that+society%2C+which+implicitly+is+that+covenant+which+they+would+have+expressed%3B+and+actions+in+this+case%2C+are+as+declarative+and+significative+as+words.%E2%80%9D%0A%0A%E2%80%94+Edward+Stillingfleet%2C+Irenicum%2C+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+or+the+Divine+Right+of+Particular+Forms+of+Church-Government+Discussed+%26+Examined...+%28London%3A+Mortlock%2C+1662%29%2C+pt.+1%2C+ch.+7%2C+pp.+137-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa29675f5a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a29675f5a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=I%20confess%2C%20when%20persons%20are%20entered,as%20declarative%20and%20significative%20as%20words." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

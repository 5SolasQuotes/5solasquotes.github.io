<main class="wrap"><figure class="quote" id="q-d8166fb168" data-kw="">
<blockquote><p>Even pictures of Jesus can only hinder our understanding of God’s truth. For instance, no true picture of Jesus exists, so the ones artists do make merely reflect the artist’s own image of our Savior rather than what God has sovereignly revealed by his word. An image also cannot truly reflect the deity of Christ, only his humanity, which again serves only to limit our knowledge of Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Should Images of God Be Allowed in the Church?”</cite>, July 3rd, 2023</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>5. He that mistakingly thinks any thing is good or bad, duty or sin, which is not so, will be zealous in pursuit of his mistake, if he be serious for God: A good principle will hasten him on in a wrong way, whatever it cost him.

6. Ignorance and timerousness cause superstition, which is a conceit that God is [thought to be] pleased by overdoing in external things, and observances and laws of their own making, and so they that make part of their own religion superstitiously (as most good people do in some things through ignorance) will censure all others as good or bad, by the measure of their own mistakes.

7. He that thus mistakingly thinks that men sin when they do not, will have a proportionable dislike of them and aversation from them: And will be ready to speak as he thinks of them and so will be guilty of calumny and calling evil good, and good evil. …

18. And the Church will always have many hypocrites, who quiet their consciences by adhering to the strictest ministers and churches, instead of a mortified, holy and heavenly heart and conversation [conduct].

19. And lastly, persecution and hatred from others, and the due love of godly persons, tempts too many ministers to over-run their own judgments and follow the more censorious sort of persons further than they ought (at least by connivence) and to be ruled by those whom they should rule. And thus divisions are occasioned even by piety itself.</p></blockquote>

</figure><figure class="quote" id="q-52f6077798" data-kw="">
<blockquote><p>There is a twofold difference between God’s forgiveness of our sins and our forgiving of others. First, we may and ought in some cases to forgive others freely, without any satisfaction at all, but God has bound Himself to another way… Again secondly, we may and ought to forgive others though they do not repent and ask pardon of us; but God has declared his will [regarding his forgiving of others] otherwise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London, 1651), Lecture 14, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-5dd5cce50b" data-kw="">
<blockquote><p>Reformed moral philosophers in the period of early orthodoxy (ca. 1550–ca. 1650) continue a medieval tradition of engaging moral questions in conversation with Aristotle’s Nicomachean Ethics, and they often address the moral status of self-love in connection with the virtue of friendship. There is broad agreement among these authors that self-love is not only not necessarily sinful, but that some kinds of self-love are morally good and that self-love is the source and rule for love of one’s neighbor. Lambert Daneau’s Ethices Christianae, however, stands in a more complex relationship to this consensus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-mcginnis.html">Andrew McGinnis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Moral Status of Self-Love in Early Reformed Ethics’ in Journal of Early Modern Christianity Ref</cite>, (2023)</span></figcaption>

</figure><figure class="quote" id="q-fbaca9017f" data-kw="">
<blockquote><p>But I answer, the place 2 Cor. 2:10 is controverted, and we doubt not, but [that it is] of that same nature with the power of excommunicating, 1 Cor. 5:4. But for private forgiving, it is not the Church-forgiving here meant, because:

1. The private forgiving is a duty of charity commanded in the Law of Nature to all, even out[side] of [a] Church-state, and obliges the excommunicate[d], who, though they be cast out of the Church, are not exempted from the Law that binds all, Mt. 6:12,14-15; Mt. 5:44-45, but the Church-forgiving is an act of obedience to a positive Church-Law of Christ.

2. Private Christians are to forgive their enemies whether they repent or not, even as Christ forgave those who crucified Him, Col. 3:13; Lk. 23:34; and when the party repents not, this forgiveness is not ratified in Heaven, yet are we obliged to forgive and to commit vengeance to God; But the authoritative forgiving is a thing that the Church is not obliged unto, absolutely; nor may they, or can they forgive, except the offender repent: and if they see that he repents not, they cannot lawfully forgive; but, being in God’s room, must take vengeance on all disobedience, and their retaining of sin and forgiving is valid in Heaven, because they are in God’s place. Now any forgiving or retaining of sin but these two, together with God’s forgiving and retaining, we know not. But Peter’s forgiving his offending brother seventy times seven times, is common to all private Christians, even out[side] of [a] Church-state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1642), pt. 1, ch. 1, section 1, p. 16</span></figcaption>

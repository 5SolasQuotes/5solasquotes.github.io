<main class="wrap"><figure class="quote" id="q-64662973cc" data-kw="">
<blockquote><p>2. Are the primary-first motions of concupiscence sins? XXI. It is asked, second, whether actual concupiscence toward evil, with respect to its primary-first motion, is sin… The papists, so that they may keep safe the idea of a perfection of every sort in man, at least in the regenerate, since they observe that the primary-first motions obtain even in the most holy persons, conclude that they are not sins, because they are devoid of all consent of the will, that the secondary-first motions are only venial sins, because they lack the full consent of the will, and moreover that only the second motions are mortal sins, because they are perpetrated with full consent. In this sense Bellarmine (vol. 4, bk. 5, “On Sin,” ch. 5–7) upholds that concupiscence, in itself and from its own nature, the sort that is found even in the baptized and justified, is not properly sin. The Reformed on the contrary state that all the acts of concupiscence, even the primary-first, are sins, because the contrary opinion is: (1) contrary to the express words of the apostle (Rom. 7:7); (2) contrary to the express demand of the law (Ex. 20:17); (3) contrary to the force and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence. Finally, (4) it is also the cause of all sin (James 1:14–15). Therefore it is sin, for nothing is the cause of sin that does not sin, since the causation of sin, if it is permitted to speak this way, is a transgression of the law. Objections Accordingly, it is not valid to say: (1) it begets sin, therefore it is not sin. For a man, because he begets a man, does not cease to be a man; indeed, as we have said, it is sin by the very fact that it begets sin. And (2) that there is said to be no condemnation (κατάκριμα) in those who are in Christ Jesus (Rom. 8:1) does not argue that there is nothing in them that is condemnable, or sin, but that there is no actual condemnation, as its guilt has been transferred to Christ. Furthermore, (3) that in baptism concupiscence is taken away, as sin. I respond, It is taken away with respect to guilt and dominion… not with respect to its existence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3 | section 21, bk. 4, ch. 3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec4fee703a" data-kw="">
<blockquote><p>The design and end of this [10th] commandment is the internal obedience and regulation of all our affections towards God, and our neighbor and his goods… it is not superfluous, seeing that it is added to the other commandments, as a general rule and interpretation, according to which the internal obedience of all the other commandments must be understood, because this is spoken of the whole Decalogue generally. This commandment, therefore, enjoins original righteousness towards God and our neighbor, which consists in a true knowledge of God in the mind, with an inclination in the will to obey the will of God as known. It also forbids concupiscence, which is an inordinate desire or corrupt inclination, coveting those things which God has forbidden.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, (d. 1583; 1852; repr. P&amp;R), p. 606</span></figcaption>

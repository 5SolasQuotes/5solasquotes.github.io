<main class="wrap"><figure class="quote" id="q-894ef20c89" data-kw="">
<blockquote><p>John Jacob Breitinger, chairman of the Swiss delegates to the Synod of Dort, said, “We need to take particularly into account the viciousness wherewith the Remonstrants make the orthodox doctrine of Predestination hated by expectant women. Truly, there is hardly anything (according to experience) that can touch the parents, especially the female gender, more painfully—in both respects—than when they listen to discussions about the salvation or reprobation of their little one,” and therefore an article needed to be included about the salvation of the children of believers who die in infancy “as it will not only comfort the doubt of believing parents regarding their children but also the viciousness of their opponents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-hyde.html">Daniel Hyde</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, Grace Worth Fighting For: Recapturing the Vision of God’s Grace in the Canons of Dort</cite></span></figcaption>

</figure><figure class="quote" id="q-a2de629b3f" data-kw="">
<blockquote><p>Did God then before he made man, determine to save some, &amp; reject others?

Ans. Yes surely, before they had done either good or evil, God in his eternal counsel set some apart, upon whom he would in time shew the riches of his mercy, and determined to withhold the same from others, on whom he would shew the severity of his wrath.

What should move God to make this difference between Man and Man?

Ans. Only his own pleasure, whereby having purposed to create man for his own Glory, forasmuch as he was not bound to shew mercy unto any, and his Glory should appear as well in executing of justice, as in shewing mercy; It seemed good unto His Heavenly wisdom to chose out a certain number towards whom he would extend his undeserved mercy, leaving the rest to be spectacles of his justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Christian Religion Summarily set down according to the Word of God: together with A Brief Epitome of the Body of Divinity</cite>, (London: Geo. Badger, 1645), pp 58-60.</span></figcaption>

<blockquote><p>As Muller perceptively notes, however, the concept of Christ as fundamentum electionis became problematic only when the name Christ was no longer “loosely” applied after the fashion of Calvin, but “strictly” applied as the title of the elected mediator. (Christ &amp; the Decree, 156– 57) Later generations arose to further the basic christological and soteriological insights of the earliest Reformers in a “new language” with “a more strict theological method.” (Christ &amp; the Decree, 131)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-pomplun.html">Robert Pomplun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Predestined a Passible Redeemer</cite>, “Predestined a Passible Redeemer: Scientia Media in Early Modern Christologies” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 89</span></figcaption>

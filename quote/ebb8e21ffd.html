<main class="wrap"><figure class="quote" id="q-ebb8e21ffd" data-kw="">
<blockquote><p>14. What is the legitimate office of reason in the sphere of religion? 1st. Reason is the primary revelation God has made to man, necessarily presupposed in every subsequent revelation of whatever kind. 2d. Hence Reason, including the moral and emotional nature, and experience, must be the organ by means of which alone all subsequent revelations can be apprehended and received. A revelation addressed to the irrational would be as inconsequent as light to the blind. This is the usus organicus [organic use] of reason. 3d. Hence no subsequent revelation can contradict reason acting legitimately within its own sphere. For then (1) God would contradict Himself, and (2) faith would be impossible. To believe is to assent to a thing as true, but to see that it contradicts reason, is to see that it is not true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology 2nd ed., enlarged</cite>, (Bible Institute Colportage Association, 1878), ch. 3, ‘The Sources of Theology’, p. 62</span></figcaption>

<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’, section 6, pp. 45-56</span></figcaption>

</figure><figure class="quote" id="q-5075e29480" data-kw="">
<blockquote><p>‘But’ says he [Hussey, an Erastian], ‘may they not worship Christ as Mediator? Yes, doubtless they may.’ [Gillespie’s response:] No doubt He that is Mediator must be worshipped, because He is God; Christ God-man is the object of divine adoration, and his God-head is the cause of that adoration; but whether He is to be worshipped because He is Mediator, or under this formal consideration as Mediator; and whether the Mediator ought to be therefore adored with divine adoration, because He is Mediator, is res altioris indaginis [a thing for deeper investigation]. If Mr. Hussey please to read and consider what diverse Schoolmen have said upon that point, as: Aquinas, [Summa] third part, quest. 25, art. 1 &amp; 2; Alex. Alensis, Sum. Theol., part 3, quest. 30, member 2; Suarez in the third part of Thomas, disp. 53, sect. 1; Valentia, Comment on Thomas, tome 4, disp. 1, quest. 24, point 1; Tannerus, Scholastic Theology, tome 4, disp. 1, quest. 7, doubt 7. But much more if he please to read Disputatio de adoratione Christi, habita inter Faustum Socinum &amp; Christianum Francken: and above all Dr. Voetius, Select Disputations, pt. 2, disp. 14, Whether Christ is to be Adored as Mediator? Then I believe he will be more wary and cautious what he holds concerning that question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, … (London: 1646), bk. 2, ch. 6, p. 230</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>his [Descartes’] warning… that the main questions about God and the soul’s distinction from the body are among those that should be demonstrated by philosophy rather than theology (Descartes, Meditations on First Philosophy in The Philosophical Writings of Descartes, vol. 2, tr. John Cottingham, et al., Cambridge Univ. Press, 1984, p. 3)… In the branch of philosophy called first philosophy or metaphysics, he accomplished little, only explaining and defending two questions about God’s existence and the soul’s distinction from the body. For apart from those questions belonging to pneumatics and natural theology, he was so caught up in explaining them and defending them against objections that he revealed too clearly his weakness in understanding and judging metaphysical formalities and abstractions. I will not even [describe] how he went about proposing such lofty and difficult philosophical ideas in a methodical, precise, clear, and evident way, or how he dealt with similar things and hypotheses taken or assumed without proof, or the non-principles on which he built his own ideas. Finally, there are the contradictions, confusions, and evasions he typically resorted to when attacked by opponents, like a man who has fallen into water grasping at anything.</p></blockquote>

<blockquote><p>I subscribe to that of Clement of Alexandrinia: We ought not to swear allegiance to any sect of philosophers, whether Stoics, Epicures, Platonists, or Peripatetics, but we must select and embrace whatsoever is true and faithfully delivered concerning God by any sect; and the Truth selected out of all sects is not vain philosophy, but Natural Divinity.</p></blockquote>

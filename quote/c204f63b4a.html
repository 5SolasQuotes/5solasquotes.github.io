<main class="wrap"><figure class="quote" id="q-c204f63b4a" data-kw="">
<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, On the Lord&#x27;s Supper (the Mass)</span></figcaption>

</figure><figure class="quote" id="q-19a2e6f8a1" data-kw="">
<blockquote><p>What remains but for the blind to see, the deaf to hear, children even to perceive this abomination of the mass, which, held forth in a golden cup, has so intoxicated all the kings and nations of the earth, from the highest to the lowest; so struck them with stupor and giddiness, that, duller than the lower animals, they have placed the vessel of their salvation in this fatal vortex. Certainly Satan never employed a more powerful engine to assail and storm the kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.18.18</span></figcaption>

</figure><figure class="quote" id="q-a14377ed13" data-kw="">
<blockquote><p>That doctrine which maintains a change of the substance of bread and wine, into the substance of Christ&#x27;s body and blood (commonly called transubstantiation) by consecration of a priest, or by any other way, is repugnant, not to Scripture alone, but even to common sense, and reason; overthroweth the nature of the sacrament, and hath been, and is, the cause of manifold superstitions; yea, of gross idolatries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 29.6</span></figcaption>

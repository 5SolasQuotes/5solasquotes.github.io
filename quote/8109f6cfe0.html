<main class="wrap"><figure class="quote" id="q-8109f6cfe0" data-kw="">
<blockquote><p>Some think pure denotes the spirituality of the service, which is not to be celebrated as the Jews and Gentiles was, modo corporuli, by slaying of beasts and such like work, but in a spiritual manner, by putting up of prayers, giving of thanks, singing of Psalms, with other duties of that nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wilson.html">John Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>More on psalm singing</cite>, pp. 44-5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-077bfd575c" data-kw="">
<blockquote><p>…lest the evil one, making use of our natures, should pervert with lascivious and wanton songs; God Himself made us songs, wherein we might both profit and delight. Psalms are the angels’ exercise, the daily practice of blessed saints, the spiritual incense of the host of heaven: the sweet harbor in solitude: the ornament of celebrities, the medicine of sick minds, the mode ratour[?] of affections: an exercise becoming all degrees, all ages, all conditions, since none are either too grave, or too good to praise the Lord. I have not made so large a digression upon this point only to praise these spiritual hymns [God-given psalms], which beyond all commendations, praise themselves to every religious heart and care…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover</cite>, (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ., pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-ba0d0318fc" data-kw="">

</figure><figure class="quote" id="q-e7b83c6949" data-kw="">
<blockquote><p>Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology</cite>, (1697; RHB, 2019), Locus 23, ‘On the Grace of Sanctification’, section 14, p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

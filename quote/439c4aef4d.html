<main class="wrap"><figure class="quote" id="q-439c4aef4d" data-kw="">
<blockquote><p>XIII… And a little later: “As the soul is in the body, so Christians are in the world.” The soul, although dispersed throughout all the members of the body, is nonetheless present in it; likewise, Christians, though they dwell in the world, are not of the world. The invisible soul is established as if in a garrison within the visible body; similarly, Christians are recognized while they sojourn in the world, but their divine worship is invisible. And a little later: Although the soul is enclosed in the body, it still preserves the body; likewise, although Christians are detained in the world as if in custody, they also preserve the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1 (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eee29e7453" data-kw="">
<blockquote><p>I say that although things other than God are in fact contingent in respect of actual being, they are not so in respect of potential being. So things that are contingent with respect to actual existence are necessary with respect to possible existence, as that although it is contingent that man exists yet that his existence is possible is necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), Intro, p. 9 | This very evident proposition, although it is in itself a necessary one (as will be shown later), is yet a proposition that for us is purely contingent. Hence, in order to preserve the condition of Aristotelian science that the principles be necessary, we can infer something necessary from the contingent proposition ‘something is’, namely the proposition that ‘the existence of something is possible’ or that ‘there is no repugnance between something and existence’. For as Scotus well observes (Lectura 1)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-71b3abd7f2" data-kw="">
<blockquote><p>…the Scholastic view (which… committed as it is to an Aristotelian understanding of causation on which the connection between the mind and the world is not especially problematic)… Thus was invented [by the mechanical philosophy in the mid-1600’s with Descartes and others] the famous ‘mind-body problem&#x27;” It seems that mind cannot possibly be reduced to matter; and yet it also seems that the mind could not possibly interact with the material world in the way it does if it was not itself material. How to resolve the paradox? That’s the problem. It has appeared to some philosophers to be unsolvable; and it is unsolvable if one clings pathologically (as contemporary philosophers do) to the mechanistic assumptions that created the problem in the first place. The only way to solve it is to return to the Aristotelian-Thomistic conception of the soul as the form of the body, having certain immaterial operations but nevertheless ‘interacting’ with the material world as a formal rather than an efficient cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Inventing the Mind-Body Problem’ in The Last Superstition: a Refutation of the New Atheism (South Bend, Indiana: St. Augustine’s Press, 2008), pp. 184-99</cite>, pp. 198-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

0cause." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-00fdb6afba" data-kw="">
<blockquote><p>We call principles those things which are known per se by the light of nature, which are known immediately, and which are unmoved or immutable, such that from them at last definite knowledge arises. From these principles the faculty of reason deduces fixed processes, like rivulets from springs. It compares the principles of nature with the truth of reality or separates them from one another. It joins causes with effects and from these forms conclusions. It decides which things are common and which unique. Finally, it so orders everything that it acquires knowledge of all those things which the reason of a person can trace down and follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’</cite>, p. 146</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

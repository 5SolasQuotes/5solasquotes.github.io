<main class="wrap"><figure class="quote" id="q-0c0cac84f2" data-kw="">
<blockquote><p>I believe the doctrine of reprobation, in this view: that God intends to give saving grace, through Jesus Christ, only to a certain number, and that the rest of mankind, after the fall of Adam, being justly left of God to continue in sin, will at last suffer that eternal death which is its proper wages (Rom 6:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-whitefield.html">George Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whitefield’s Letter to Wesley on Election’</cite>, (1740), p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

— George Whitefield, ‘Whitefield’s Letter to Wesley on Election’ (1740), p. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+believe+the+doctrine+of+reprobation%2C+in+this+view%3A+that+God+intends+to+give+saving+grace%2C+through+Jesus+Christ%2C+only+to+a+certain+number%2C+and+that+the+rest+of+mankind%2C+after+the+fall+of+Adam%2C+being+justly+left+of+God+to+continue+in+sin%2C+will+at+last+suffer+that+eternal+death+which+is+its+proper+wages+%28Rom+6%3A23%29.%E2%80%9D%0A%0A%E2%80%94+George+Whitefield%2C+%E2%80%98Whitefield%E2%80%99s+Letter+to+Wesley+on+Election%E2%80%99+%281740%29%2C+p.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c0cac84f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c0cac84f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=I%20believe%20the%20doctrine%20of%20reprobation,is%20its%20proper%20wages%20%28Rom%206%3A23&amp;text=I%20believe%20the%20doctrine%20of%20reprobation%2C%20in%20this&amp;text=death%20which%20is%20its%20proper%20wages%20%28Rom%206%3A23" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c8a0ce7831" data-kw="">
<blockquote><p>II. Both you and I hold, and must hold, that God decrees to damn all that shall be damned. But it is false that we hold that He does it without any respect to foreseen sin. (Vasquez on Thomas, pt. 1, quest. 23, art. 3, p. 709, Conclusio (quod Deus aliquos reprobat) est de fide constat enim ex scriptura multos a Deo reprobari [The conclusion (that God reprobates some) is of the Faith, for it is evident from Scripture that many are reprobated by God.”]. See Ruiz, On Predestination, tract. 2 through the whole) For:

      1. He foresees this sin as the only meritorious cause of their damnation; what He does in time, that is it which He decreed to do from eternity: But in time He damns no man but for sin; therefore from eternity He decreed to damn no man but for sin: For sin, I say, as the cause of damnation, which Dr. Twisse does frequently profess.

      2. And though this sin can be no proper efficient cause of God’s volition or decree, yet it is a presupposed necessary qualification in the object, as foreseen in the mind of God, and so, as aforesaid, is an objective cause as foreseen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-6781601465" data-kw="">
<blockquote><p>Those of mankind that are predestinated unto life, God, before the foundation of the world was laid, according to his eternal and immutable purpose, and the secret counsel and good pleasure of his will, hath chosen, in Christ, unto everlasting glory, out of his mere free grace and love, without any foresight of faith, or good works, or perseverance in either of them, or any other thing in the creature, as conditions, or causes moving him thereunto; and all to the praise of his glorious grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 3.5</span></figcaption>

</figure><figure class="quote" id="q-a8ae778da8" data-kw="">
<blockquote><p>Before the foundation of the world, by sheer grace, according to the free good pleasure of his will, God chose in Christ to salvation a definite number of particular people out of the entire human race, which had fallen by its own fault from its original innocence into sin and ruin. Those chosen were neither better nor more deserving than the others, but lay with them in the common misery. God did this in Christ, whom he also appointed from eternity to be the mediator, the head of all those chosen, and the foundation of their salvation. And so God decreed to give to Christ those chosen for salvation, and to call and draw them effectively into Christ’s fellowship through the Word and Spirit. In other words, God decreed to grant them true faith in Christ, to justify them, to sanctify them, and finally, after powerfully preserving them in the fellowship of the Son, to glorify them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 7</span></figcaption>

</figure><figure class="quote" id="q-2d8a7a7284" data-kw="">
<blockquote><p>2. That the only moving and efficient cause of election and predestination unto life is the mere good pleasure and grace of God, not the consideration of any foreseen faith, perseverance, good works, good will, good endeavors, or any other quality or condition whatsoever in the persons elected.

3. That though sin be the only cause of damnation, yet the sole and primary cause of reprobation or non-election (that is, why God does pass by this man rather than another, why He rejected Esau, when He elected Jacob) is the mere freewill and pleasure of God: not the confideration or foresight of any actual sin, infidelity, or final impenitency in the persons rejected.</p></blockquote>

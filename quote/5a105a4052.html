<main class="wrap"><figure class="quote" id="q-5a105a4052" data-kw="">
<blockquote><p>Let us now see what theory of political society is deduced by [Thomas] Hobbes from his metaphysics, in his treatises of the Citizen, and “Leviathan.” We must remember that, according to him, there is no supreme uniform standard of moral obligation, and no conscience in man. The only motive of rational conduct is self- interest. Hence, Hobbes naturally infers that the original conception of right which the human being has, is of a natural right to appropriate whatever he sees will contribute to his pleasure, and to avoid whatever produces pain. By the same reason one man feels this right, every other feels the same. The natural state, then, is one in which each man tends to claim all things, and to resist the similar claims of all others.

But by the same natural right, each man is also resisted. Hence, the state of nature is “a war of all against all.” But self-interest cannot become enlightened by experience, without perceiving that this war of all against all tends, on the whole, to the reduction of natural enjoyments to a minimum, and to the universal destruction of persons. Hence, the first acquired desire of nature is for repose from this endless strife of warring wills. How shall that repose be sought? Obviously, only in some force strong enough to suppress the strife; for there is no moral principle in man which can become a regulative standard. The competing wills of individuals being all naturally equal, and all properly exorbitant, there is no reasonable umpire between them but the strong hand. Might makes right.

He who is able to overpower the assailant of his natural good, in the competition, if he chooses not to destroy him, has thereby a perfect property in the spared enemy. Slavery and violent conquest are legitimate; and in this way was actually originated the controlling force which calmed the universal warfare into political society. When a conqueror had compelled a sufficient number of subjugated persons to work and fight for him, to show himself practically superior to all others, he was recognized as the suitable ruler, by all the others whose self-interest taught them to desire repose. Hence in order to secure the peaceable enjoyment of some natural good, they submitted their claims to the remainder to the powerful man, and became willingly a part of his subjugated train.

The essence of political power, then, is force; and in order to gain the end of government, repose, it must be an irresistible force. Government, then, should be absolutely despotic. And it is much more consistent that it should be an absolute monarchy in the hands of one man. The ruler is absolute proprietor of the persons and property of all the citizens; he is wholly irresponsible to them, as to all earthly authority. For, in passing from the state of nature into the political state, each person surrendered his individual independence absolutely to the Ruler, and a surrender of this kind is final and beyond recall.

For, by this act, right of resistance is for the people annihilated; and they have reduced themselves, as holders of such a franchise, to non-existence. The entrance of the integer into political society is, as to his separate rights, final suicide. The Ruler is master, and the citizens are property: property has no appeal against its own proprietor. Any right of conscience against the Ruler’s fiat is, of course, out of the question: for Hobbes does not believe in any conscience that can have rights.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sensualistic Philosophy of the Nineteenth Century, Considered</cite>, (New York: Anson D. F. Randolph &amp; Company, 1875), pp 11-13.</span></figcaption>

<blockquote><p>Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men</cite>, 4th Decade, Case 1, ‘Whether the Marriage of a Son or Daughter without or against the Parents’ Consent may be Accounted Lawful?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 293-95</span></figcaption>

<blockquote><p>I might trace a little the time of faith’s first infusion and first operation in the heart, which is undoubtedly at the new birth, when ever it is. But how to prescribe, and when precisely to determine that, in the soul of a believer is more difficult than to state the quickening or animation of an embryo in the womb of her that is with child, or for any naturallist so set the moment of the first separation of night from day at the initiating crepusculum or ascent of the first atom of the morning rays of the sun’s body, or the primogenial fermentation of the vegetative soul in the seed-corn in the earth… It’s much more difficult to set down the first punctual workings of the Spirit in our hearts.</p></blockquote>

<blockquote><p>Assertion 2 – This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him, as Dr. Ferne [a royalist] confesses, (sec. vii, p. 30)… …2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>

<blockquote><p>Omitting many other passages that might be cited from the New Testament, in favour of capital punishment, I shall notice only two. “But we know that the law is good, if a man use it lawfully.” 1 Tim. i. 8. The law to which the apostle refers, is evidently what we call the judicial law; for it was not made for a righteous man, but for the lawless and disobedient. But this is not true of either the moral or ceremonial law, for they were made for righteous men: the Lord Jesus Christ obeyed them both. Now when we call a law good, we mean that the penalty is just. When the law of England hung people for stealing we called it a bad law, because the penalty was too severe; we call the law which hangs men for murder a good law, because the penalty is exactly proportioned to the crime. We see, then, that those laws which our modern illuminati call bloody laws, Paul calls good laws. In Hebrews ii. 2, it is said, “If the word spoken by angels* was steadfast, and every transgression and disobedience received a just recompense of reward.” The penalty inflicted on criminals by the Mosaic law, is called a just recompense of reward: it was neither too light, nor too severe – just such as infinite wisdom and goodness saw fit to appoint.

* Angels, (Messengers,) including Moses and the prophets.</p></blockquote>

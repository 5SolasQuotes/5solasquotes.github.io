<blockquote><p>The Free Church Magazine, which William M. Hetherington edited, gave the following summary of the debate at the 1847 Free Church General Assembly on the National Covenant of Scotland:

Those who read or heard the discussion in the Assembly would perceive that it turned chiefly on the difficult question respecting the permanent obligation of the National Covenant. The essential difficulty in this question was distinctly specified by Dr [William] Cunningham; but we intentionally abstain from even touching it at present, requesting our readers to re-peruse the debate, and do their best to appreciate clearly that point. Till they understand the very essence of the difficulty, they will neither perceive its importance, nor be in a condition to attempt a solution.

It was abundantly evident that those who argued against the adoption of the Testimony, chiefly because of its reference to the National Covenant, had no clear conception of what that covenant really was in itself, or of what is meant by its permanent obligation. One opponent, indeed, began by resting his objection against a testimony which referred to the Covenant on his ignorance of what amount or kind of obligation that might imply. This was honest, doubtless, as a confession of ignorance; but it was not very praise-worthy, the means of removing that ignorance being sufficiently accessible.

Another rested his opposition on a total misconception both of the Covenant itself, and on the principles and conduct of those by whom it was framed. It was painful to hear any minister or member of the Free Church declaring that the National Covenant contained the principles of persecution. Till that hour we have believed that a charge so offensive and unfounded could be urged against the National Covenant only by the prejudiced assailants of the Presbyterian Church; and we cannot adequately express how deeply we were grieved to hear it uttered in the General Assembly of the Free Church of Scotland.

It was not answered; it never will need any other answer than has been already furnished by Dr. [Thomas] McCrie. And the silence in which it was allowed to pass may be accounted for both on that ground, and also from the regretful respect which is willing to allow a good man’s mistake to pass unmarked. Perhaps even this gentle reference to it is too much. It is all, certainly, that we mean to make; and we do so only in defence of the memory of our noble ancestors, as implicated in the character of that important document to which they attached so much, even sacred, value.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Recent General Assembly of the Free Church in Free Church Magazine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>7. To wave a little that which concerns private and particular persons, we offer it to consideration whether inferior Kirk-judicatories are subordinate to the greater and superior simply and absolutely, because they are greater and superior, or, because the inferior have no intrinsical power given them by Jesus Christ, but in, and with subordination to the greater, because greater. If so, it would seem that all the inferior Judicatories of the Kirk, Congregational-Elderships, Presbyteries, and Provincial Synods must be fenced and act in the name, and by virtue of the authority derived from the General Assembly, as all those Civil Courts that have no intrinsic power in themselves, but in, and with subordination to the supreme Civil Magistrate are fenced in his name and act by virtue of his authority. Inferior Kirk-judicatories, being ordinances of Jesus Christ, have the promise made to them when they meet in His Name and do adhere to His Truth, Mt. 18:18-19. And if so, shall the sentence of the superior Judicatory, when wrong upon the matter, oblige them to submission? If a Presbytery, or a Synod with the consent of the Presbytery, do in an orderly way of procedure, cast out an heterodox and scandalous minister, must they, because the Synod or General Assembly does sustain his unjust appeal, be obliged in conscience again to receive him as a member of the Presbytery or Synod, and acknowledge him for a lawful minister of the Gospel; or, if they have in an orderly way of procedure, admitted an able orthodox godly man to the Ministry: Must they, because the superior Judicatory commands them so to do, cease to acknowledge him or own him for one of their number, or as a Minister of the Gospel? If so, it seems to be an ill-grounded truth that is commonly delivered by some divines writing of synods, that the power of synods is not corruptive, privative, or destructive to the power of classical presbyteries or single congregations, but perfective, acumulative, and conservative thereunto.

8. What is denied jure to ecomenic councils, and so lawfully called prophets and ministers of the Gospel, to Nathan, to David, to Paul, to an angel from heaven, Gal. 1:8, cannot warrantably be given to General Assemblies. If ecomenic councils, lawfully called ministers, if Nathan, if Samuel, if Paul, if an Angel teach or decree but according to the Word of the Lord, we are to counteract, and to contradict, Gal. 1:8. “But though we or an angel from heaven, preach to you, beside what we have preached, let him be accursed,” Gal. 1:8. Therefore, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (1658), pp. 107-108</span></figcaption>

<blockquote><p>Yet notwithstanding, I allow their constancy which strive for a just cause, being forced against their wills unto contention. I do worthily condemn frowardness which does hinder and stay the holy carefulness of reforming the Church. And as I behave myself gentle and tractable in mean [lowly] things (as external ceremonies), so do I not always judge it profitable to give place to their foolish stoutness which will forsake nothing of their old wonted [accustomed] custom.</p></blockquote>

rmed Books Online</a></div>

<blockquote><p>We further confess and acknowledge, that such persons as are placed in authority are to be loved, honored, feared, and holden in most reverend estimation, because they are the lieutenants of God, in whose session God Himself does sit and judge. And further, we affirm that whosoever deny unto them their aid, counsel and comfort, while the princes vigilantly travail in the executing of their office, that the same men deny their help, support and counsel to God, who, by the presence of his lieutenant, craves it of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>BY firmness and patience, I mean a resolute adherence to your duty, and laying your account with many difficulties as well as occasional disappointments. In a former part of this discourse, I have cautioned you against ostentation and vain glory. Be pleased further to observe, that extremes often beget one another, the same persons who exult extravagantly on success, are generally most liable to despondent timidity on every little inconsiderable defeat.

Men of this character are the bane and corruption of every society or party to which they belong, but they are especially the ruin of an army if suffered to continue in it. Remember the vicissitude of human things, and the usual course of providence. How often has a just cause been reduced to the lowest ebb, and yet when firmly adhered to, has become finally triumphant.</p></blockquote>

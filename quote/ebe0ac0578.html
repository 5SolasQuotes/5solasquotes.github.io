<main class="wrap"><figure class="quote" id="q-ebe0ac0578" data-kw="">
<blockquote><p>There is no necessity for any other proof of native depravity, than the aversion, which children early manifest to religious instruction and to spiritual exercises. From this cause it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6428ca8b93" data-kw="">
<blockquote><p>As for all other sins which we call actual, they are, as I said, natural only, and not supernatural; and therefore no man wants [lacks] liberty, as to do them, so to abstain from them; Only he wants a moral and spiritual liberty to abstain from them in a gracious manner, according to that of Aquinas (Summa, pt. 1, q. 23, art. 7, to the 3rd): Licet aliquis non possit gratiam adipisci qui reprobatur a Deo, tamen quod in hoc peccatum vel illud labatur, ex ejus libero arbitrio contingit. Though a man who is reprobated of God cannot obtain grace, yet that he falls into this or that sin, it comes to pass of his own free will. It is true also even in God’s providence concerning acts natural, there is a great mystery. For as God foretold David that his neighbor should lie with his wives (2 Sam. 12:11-12); and though he sinned secretly, yet the Lord would do this openly. So he foretold that upon that altar which Jeroboam erected, a child that should be born of the house of David, Josiah by name, should burn the prophets’ bones. And that Cyrus also should build him a city and let go his captives. (1 Kn. 13:2; Isa. 45:13; Ezra 1; 2 Kn. 23:16; 2 Sam. 16:22) Yet who doubts but that Cyrus did freely deliver the Jews out of Babylon? and Josiah did as freely burn the prophets’ bones upon the altar in Bethel, as ever they did [any] action in their lives? So Absalom did as freely defile his father’s concubines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind</cite>, … (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, sect. 7, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-f235079b36" data-kw="">
<blockquote><p>IV… Joined to these [the soul’s faculties, such as intellect and will] is free will, or, as others prefer, liberum arbitrium, which is to be considered strictly and generically, arising from the interaction of both faculties and acting according to a natural inclination and from an intrinsic principle, which alone is free in an uncoerced manner. This freedom applies not only to man but also to beasts and some inanimate objects that act uncoercedly, though not in a state of moral freedom as man does, where actions are performed both directly and by command, with premeditated consultation, deliberation, judgment, and from the will, which gives it liberty.</p></blockquote>

<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-wendelin.html">Marcus Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology, Secondary Attributes of God, pt</cite>, 1</span></figcaption>

</figure><figure class="quote" id="q-a6012a06a9" data-kw="">
<blockquote><p>From what has been said it is now easy to gather that liberty does survive in our choice, even after sin, a liberty that is essential to man’s nature, one by which all the worst men, whatever they do, do it freely; yet not such a liberty as is independent from the first cause, nor which is fitted with strength for spiritual good, to accomplish it spiritually, and in this respect it is rather called enslaved than free.</p></blockquote>

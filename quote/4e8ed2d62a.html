<blockquote><p>Things that are false will accomplish a great many useful things in the world. If I take a counterfeit coin and buy a dinner with it, the dinner is every bit as good as if the coin were a product of the mint. And what a very useful thing a dinner is! But just as I am on my way downtown to buy a dinner for a poor man, an expert tells me that my coin is a counterfeit. The miserable, heartless theorizer! While he is going into uninteresting, learned details about the primitive history of that coin, a poor man is dying for want of bread. So it is with faith. Faith is so very useful, they tell us, that we must not scrutinize its basis in truth. But, the great trouble is, such an avoidance of scrutiny itself involves the destruction of faith. For faith is essentially dogmatic. Despite all you can do, you cannot remove the element of intellectual assent from it. Faith is the opinion that some person will do something for you. If that person really will do that thing for you, then the faith is true. If he will not do it, then the faith is false. In the latter case, not all the benefits in the world will make the faith true. Though it has transformed the world from darkness to light, though it has produced thousands of glorious healthy lives, it remains a pathological phenomenon. It is false, and sooner or later it is sure to be found out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (1923), pp. 142-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>…the duels which have been fought between princes, which have determined their quarrels by the monomachy of man to man. The crown of England was sometimes in that sort disputed, between Edmund Iron-side, and Canute the Dane: Edward III offered as much to the king of France; the French king to the Emperor Charles V; and Henry the Great, father of our most illustrious queen, made offer to the Duke of Guise his competitor to put a period to their difference by point of spear, his person against his, six against six, or hundred against hundred. I will not say that it is lawful to a prince so to hazard the head of the commonwealth, and in his person, all the body of his estate, but when this way is permitted them, it is, because sovereign princes have not any judge above them who can do them right, so that to obtain reason from their hands who are elevated to as high a pitch of dignity as themselves, there is not any other way but by arms; and these their doings have an outward show of charity: for a prince will say, that he likes better to expose his own person to danger than to see a bloody war that should swallow up many thousands of men and give occasion of an infinite slaughter. And it may be that some people desirous to avoid a general conflict of nation against nation, have sometimes remitted their quarrel to a certain number of men, to be chosen by either side by them to be decided by combat. So three hundred Lacedemonians fought against a like number of the Argiens; three Romans against three Latins; and when David and Ishboseth stood competitors for the royalty, the two generals Joab and Abner caused a combat between twelve soldiers of the tribe of Judah against twelve of the tribe of Beniamin [2 Sam. 2:12-17]. This kind of duel is as it were an abridgement of the war, and yet not very justifiable. There is more appearance in this case than in any of the cases aforementioned: Two armies are ready to fight, he that has the right on his side finds himself inferior in forces, so that if they come to handy-strokes we must all die of necessity: The enemy makes an offer of a single fight, one to one, and offers to stand to the event of this duel; why should we all perish and not rather make legal of this way and expedient, which perchance may give us the victory, or at least will save six thousand men’s lives, and there can but one be slain? But this example has no correspondence with the [private] duel, whereof we now treat, and one may not draw into consequence particular actions which are exploited in war or in the consequence of war, especially in heat of battle…</p></blockquote>

<blockquote><p>1. The beatitude of God is the eternal condition in himself of absolute satisfaction and delight. That’s bound up with God’s fullness of glory as the Father, the Son, and the Holy Spirit. Now that’s a traditional understanding of God’s beatitude. This is not something that I’m just coming up with myself. We may not hear a lot about the attribute of God’s beatitude, but it is a tradition throughout church history. 2. The outward beauty of God is expressed and perceivable as an aesthetic quality of his glory in his work of creation, redemption, and consummation. It’s important here to call attention to the distinctive characteristic of beauty. Beauty as beauty is not desired as a means to another end. Pleasure or delight associated with beholding the beautiful is its own end. 3. That characteristic to communicate the delight as its own end is correlative to that absolute self that characterizes God’s own eternal, internal life as Father, Son, and Spirit. The uniqueness of beauty, as opposed to goodness or truth (we just talked about the transcendentals there), is that beauty evokes a delight, but you don’t use that delight to then do something more. It is its own end. 4. We talk about God’s beatitude. It is its own end. It is itself delight. He’s self-satisfied. Where I draw this all together is with a postulation that the beauty of God in his outward works as it is perceived and experienced by human beings is what most clearly can be traced to that perfection of beatitude and sense of delight that belongs to God in himself as Father, Son, and Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-king.html">Jonathan King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How can I see the Beauty of God?: Interview with Jonathan King’</cite>, (2019) at Desiring God</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. The beatitude of God is the eternal condition in himself of absolute satisfaction and delight. That’s bound up with God’s fullness of glory as the Father, the Son, and the Holy Spirit. Now that’s a traditional understanding of God’s beatitude. This is not something that I’m just coming up with myself. We may not hear a lot about the attribute of God’s beatitude, but it is a tradition throughout church history. 2. The outward beauty of God is expressed and perceivable as an aesthetic quality of his glory in his work of creation, redemption, and consummation. It’s important here to call attention to the distinctive characteristic of beauty. Beauty as beauty is not desired as a means to another end. Pleasure or delight associated with beholding the beautiful is its own end. 3. That characteristic to communicate the delight as its own end is correlative to that absolute self that characterizes God’s own eternal, internal life as Father, Son, and Spirit. The uniqueness of beauty, as opposed to goodness or truth (we just talked about the transcendentals there), is that beauty evokes a delight, but you don’t use that delight to then do something more. It is its own end. 4. We talk about God’s beatitude. It is its own end. It is itself delight. He’s self-satisfied. Where I draw this all together is with a postulation that the beauty of God in his outward works as it is perceived and experienced by human beings is what most clearly can be traced to that perfection of beatitude and sense of delight that belongs to God in himself as Father, Son, and Spirit.”

— Jonathan King, ‘How can I see the Beauty of God?: Interview with Jonathan King’ (2019) at Desiring God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+The+beatitude+of+God+is+the+eternal+condition+in+himself+of+absolute+satisfaction+and+delight.+That%E2%80%99s+bound+up+with+God%E2%80%99s+fullness+of+glory+as+the+Father%2C+the+Son%2C+and+the+Holy+Spirit.+Now+that%E2%80%99s+a+traditional+understanding+of+God%E2%80%99s+beatitude.+This+is+not+something+that+I%E2%80%99m+just+coming+up+with+myself.+We+may+not+hear+a+lot+about+the+attribute+of+God%E2%80%99s+beatitude%2C+but+it+is+a+tradition+throughout+church+history.+2.+The+outward+beauty+of+God+is+expressed+and+perceivable+as+an+aesthetic+quality+of+his+glory+in+his+work+of+creation%2C+redemption%2C+and+consummation.+It%E2%80%99s+important+here+to+call+attention+to+the+distinctive+characteristic+of+beauty.+Beauty+as+beauty+is+not+desired+as+a+means+to+another+end.+Pleasure+or+delight+associated+with+beholding+the+beautiful+is+its+own+end.+3.+That+characteristic+to+communicate+the+delight+as+its+own+end+is+correlative+to+that+absolute+self+that+characterizes+God%E2%80%99s+own+eternal%2C+internal+life+as+Father%2C+Son%2C+and+Spirit.+The+uniqueness+of+beauty%2C+as+opposed+to+goodness+or+truth+%28we+just+talked+about+the+transcendentals+there%29%2C+is+that+beauty+evokes+a+delight%2C+but+you+don%E2%80%99t+use+that+delight+to+then+do+something+more.+It+is+its+own+end.+4.+We+talk+about+God%E2%80%99s+beatitude.+It+is+its+own+end.+It+is+itself+delight.+He%E2%80%99s+self-satisfied.+Where+I+draw+this+all+together+is+with+a+postulation+that+the+beauty+of+God+in+his+outward+works+as+it+is+perceived+and+experienced+by+human+beings+is+what+most+clearly+can+be+traced+to+that+perfection+of+beatitude+and+sense+of+delight+that+belongs+to+God+in+himself+as+Father%2C+Son%2C+and+Spirit.%E2%80%9D%0A%0A%E2%80%94+Jonathan+King%2C+%E2%80%98How+can+I+see+the+Beauty+of+God%3F%3A+Interview+with+Jonathan+King%E2%80%9

<main class="wrap"><figure class="quote" id="q-1e7e9d5d74" data-kw="">
<blockquote><p>Wherefore, our Heavenly Master also says: “Watch and pray, that ye enter not into temptation.” Let every man, therefore, when fighting against his own concupiscence, pray that he enter not into temptation; that is, that he be not drawn aside and enticed by it. But he does not enter into temptation if he conquers his evil concupiscence by good will. And yet the determination of the human will is insufficient, unless the Lord grant it victory in answer to prayer that it enter not into temptation. What, indeed, affords clearer evidence of the grace of God than the acceptance of prayer in any petition?

If our Saviour had only said, “Watch that ye enter not into temptation,” He would appear to have done nothing further than admonish man’s will; but since He added the words, “and pray,” He showed that God helps us not to enter into temptation. It is to the free will of man that the words are addressed: “My son, remove not thyself from the chastening of the Lord.” And the Lord said: “I have prayed for thee, Peter, that thy faith fail not.” So that a man is assisted by grace, in order that his will may not be uselessly commanded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Grace and Free Will</cite>, (c. 427), 9 in Nicene and Post-Nicene Fathers 1, 5: 447.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-490e6f1284" data-kw="">
<blockquote><p>Prayer is the surest remedy against the devil and besetting sins. That sin will never stand firm which is heartily prayed against: that devil will never long keep dominion over us which we beseech the Lord to cast forth. But, then, we must spread out all our case before our Heavenly Physician, if he is to give us daily relief: we must drag our indwelling devils to the feet of Christ, and cry to him to send them back to the pit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), p. 72.</span></figcaption>

</figure><figure class="quote" id="q-0181e0f60e" data-kw="invocation of saints refuted memory not worship">
<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2b</span></figcaption>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-f3f8afa285" data-kw="">
<blockquote><p>Oh, all you who know and delight in this King, observe all this. Let it wound your heart; let your soul bleed; and for sorrow let your eyes cry rivers of tears by reason of the fact that this glorious King of His Church is thus despised and scorned. Pray continually for Him (Ps. 72:15) and to Him, that He would reveal Himself to His Church as King before the eyes of the entire world. ‘Give ear, O Shepherd of Israel, Thou that leadest Joseph like a flock; Thou that dwellest between the cherubims, shine forth. Before Ephraim and Benjamin and Manasseh stir up thy strength, and come and save us’ (Ps. 80:1-2).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.12</span></figcaption>

</figure><figure class="quote" id="q-3691a951d9" data-kw="">
<blockquote><p>They usurp the divinity and office of Christ. The effect is the same as if they said, &quot;I am Christ; I am a Savior. I save myself and others.&quot; This is the impression the monks give out. The Pope is the Antichrist, because he is against Christ, because he takes liberties with the things of God, because he lords it over the temple of God.</p></blockquote>

</figure><figure class="quote" id="q-e515d7fb38" data-kw="">

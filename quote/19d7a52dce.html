<main class="wrap"><figure class="quote" id="q-19d7a52dce" data-kw="">
<blockquote><p>Say what you will, it must needs be an Excellent thing wherewith Christ Jesus Himself was Filled, and that was with The Spirit of this Fear, Esai. 11.2. An excellent thing which God Himself so earnestly desires to be still in us, and that is this Fear. O (saith He) that there were such an Heart in them, that they would fear me, and keep my Commandments always, which is indeed the whole Duty of Man; without which (Saint Bernard concludes) Every man is Nothing. He is not a Man (reasons a Schoolman) but the Shadow of a Man; because He employs not his Soule to that noble End for which he had it, namely, to be squared and ruled by the fear of the Lord: without which no man can so much as Begin to be wise, because this Fear is the Beginning of wisdom, nor so much as Begin to Love God, because this Fear is the Beginning of the Love of God.

It is the Sale alludes Blesensis that must be in every Sacrifice, in every Work we do, so that there is no Serving God, no Rejoicing in Him, no hearty Repenting, no Chaste Conversing, no Perfecting Holiness, no Working out our Salvation, but with Fear and Trembling; nay there is no Salvation, no Blessedness without Continuing in this Fear, Prov. 28.14. Again, is not that Excellent, that will make us more Excellent than our Neighbours, that will Exalt us above them, that will keep our hearts from Hardening, our Houses from Overthrowing? but nothing can do this; but this Fear of the Lord. This fear (saith Paris.) can cause a spiritual Earth-quake in a man’s Heart, able to overthrow all the Devil’s strongest holds, any Bosom-sin, be it never so pleasing and profitable, by reason of that Contrariety and Opposition that is between Lying in any Sweet Sin, and Living in God’s Fear and Favour, as you may see, Levit. 25.36.

Lastly, this is an Excellent Fear, because it is A fountain of Life: wherefore? To drive away Sins, Sins which have been committed by Repentance (saith S. Bernard) and Sins whereto we are Tempted, by Resistance; and yet this is not all the Excellency of this Fear: For it is A fountain of life also: To Cause us to find favour at our Deaths; and which is more, Such an Excellent Fear as will make us Not fear, nor be afraid. Whereupon Saint Augustine concludes for my purpose: … Let him learn to fear, that would not fear: Let him be wary and cautelous [sic] for a time, that would be happy and secure for ever.

Tertullian gives the reason, because if We fear to Offend, by Fearing we will take heed, lest we Offend, and by Taking heed, we shall be in safety; otherwise if we presume and be not always watchful over our hearts lest they offend, we cannot be Saved, Jer. 4.14. He that is not over-hold on his own strength; but confident in Christ, and lives not securely in the minion-delight of any known sin; but stands in such continual awe of God’s Presence, Precepts, Promises, Threats, that he dare not so much as once make any offer of incurring his Displeasure by the impenitent Allowance of any sin in his heart, and studies to do every Good work as carefully, as if it were the Last he should do in this World, and as exactly, as if his whole Salvation depended upon it, such a Man in Ancient Tertullian’s judgement may be truly secure of Persevering in Grace here; and of being Glorified hereafter, 1 Thess. 5.15, 24.</p></blockquote>

<blockquote><p>‘Christ, who is our life, shall appear.’ There are two appearings, we know, of Christ; his first appearing and his second appearing. His first appearing was to work our salvation; his second shall be to accomplish and finish what he hath begun to work. His first appearing was to redeem our souls from death, and his second shall redeem our bodies from the corruption of the grave. So his second appearing shall be to accomplish all the good that he came to do and to work by his first. As verily, therefore, as Christ is come in his first appearing, so verily and certainly he shall appear the second time. And as it was the description of holy men before his first coming to wait for him, ‘to wait for the consolation of Israel,’ Luke 2:25, so Christians now. Those blessed souls that have the report of this, they wait for the coming of Christ.</p></blockquote>

</figure><figure class="quote" id="q-10f17955b5" data-kw="">
<blockquote><p>So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Augustine observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>

<blockquote><p>2. It is asked, Whether it be possible for a regenerated man always to retain this habitual intention of pleasing God in all things, although in the mean time he fails in many?

I answer; That not only is it possible, but necessary, if he wishes to retain faith and a good conscience: for these cannot consist, neither remain in the same heart with the design of sinning and of displeasing God. Therefore every believer constantly keeps in mind the purpose of pleasing God and of abstaining from sin, according to that saying of Paul, The good that I would I do not; but the evil which I would not, that I do. Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me, Rom. vii. 19. He who chooseth good, and not evil, retains the design of pleasing God, although, being allured by evil concupiscence, he sometimes does that through infirmity which displeases God, he makes it his main business to please in all things, whilst he studies to avoid every single sin.

Lastly, it is asked. Whether a believer retaining this design of pleasing God, is always acceptable and pleasing to him, notwithstanding those his failures and infirmities?

I answer, first. That the person of a godly and faithful man is always pleasing and acceptable to God, because he is regarded by God not as he is in himself, but as a member under Christ the head; But there is no condemnation to them who are in Christ Jesus, Rom. viii. 1. Secondly, The good works of the faithful, although imperfect, are nevertheless pleasing to God, because they are regarded by him as by a loving Father, not as an austere judge; as covered and adorned with the most perfect obedience of Christ, not as naked and alone. Lastly, The failings and sins of the faithful are indeed hateful and displeasing to God, but out of a simple hatred, not redounding upon the person. And therefore God hates sin in the regenerate, and for that reason declares war against it, through the Spirit of grace; but the regenerate themselves, in the mean time, are acceptable to him, and on that account he favours and blesses them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. It is asked, Whether it be possible for a regenerated man always to retain this habitual intention of pleasing God in all things, although in the mean time he fails in many?

I answer; That not only is it possible, but necessary, if he wishes to retain faith and a good conscience: for these cannot consist, neither remain in the same heart with the design of sinning and of displeasing God. Therefore every believer constantly keeps in mind the purpose of pleasing God and of abstaining from sin, according to that saying of Paul, The good that I would I do not; but the evil which I would not, that I do. Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me, Rom. vii. 19. He who chooseth good, and not evil, retains the design of pleasing God, although, being allured by evil concupiscence, he sometimes does that through infirmity which displeases God, he makes it his main business to please in all things, whilst he studies to avoid every single sin.

Lastly, it is asked. Whether a believer retaining this design of pleasing God, is always acceptable and pleasing to him, notwithstanding those his failures and infirmities?

I answer, first. That the person of a godly and faithful man is always pleasing and acceptable to God, because he is regarded by God not as he is in himself, but as a member under Christ the head; But there is no condemnation to them who are in Christ Jesus, Rom. viii. 1. Secondly, The good works of the faithful, although imperfect, are nevertheless pleasing to God, because they are regarded by him as by a loving Father, not as an austere judge; as covered and adorned with the most perfect obedience of Christ, not as naked and alone. Lastly, The failings and sins of the faithful are indeed hateful and displeasing to God, but out of a simple hatred, not redounding upon the person. And therefore God hates sin in the regenerate, and for that reason declares war against it, through the Spirit of grace; but the regenerate themselves, in the mean time, are acceptable to him, and on that account he favours and blesses them.”

— John Davenant, An Exposition of the Epistle of St. Paul to the Colossians, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 126-27.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+It+is+asked%2C+Whether+it+be+possible+for+a+regenerated+man+always+to+retain+this+habitual+intention+of+pleasing+God+in+all+things%2C+although+in+the+mean+time+he+fails+in+many%3F%0A%0AI+answer%3B+That+not+only+is+it+possible%2C+but+necessary%2C+if+he+wishes+to+retain+faith+and+a+good+conscience%3A+for+these+cannot+consist%2C+neither+remain+in+the+same+heart+with+the+design+of+sinning+and+of+displeasing+God.+Therefore+every+believer+constantly+keeps+in+mind+the+purpose+of+pleasing+God+and+of+abstaining+from+sin%2C+according+to+that+saying+of+Paul%2C+The+good+that+I+would+I+do+not%3B+but+the+evil+which+I+would+not%2C+that+I+do.+Now+if+I+do+that+I+would+not%2C+it+is+no+more+I+that+do+it%2C+but+sin+that+dwelleth+in+me%2C+Rom.+vii.+19.+He+who+chooseth+good%2C+and+not+evil%2C+retains+the+design+of+pleasing+God%2C+although%2C+being+allured+by+evil+concupiscence%2C+he+sometimes+does+that+through+infirmity+which+displeases+God%2C+he+makes+it+his+main+business+to+please+in+all+things%2C+whilst+he+studies+to+avoid+every+single+sin.%0A%0ALastly%2C+it+is+asked.+Whether+a+believer+retaining+this+design+of+pleasing+God%2C+is+always+acceptable+and+pleasing+to+him%2C+notwithstanding+those+his+failures+and+infirmities%3F%0A%0AI+answer%2C+first.+That+the+person+of+a+godly+and+faithful+man+is+always+pleasing+and+acceptable+to+God%2C+because+he+is+regarded+by+God+not+as+he+is+in+himself%2C+but+as+a+member+under+Christ+the+head%3B+But+there+is+no+condemnation+to+them+who+are+in+Christ+Jesus%2C+Rom.+viii.+1.+Secondly%2C+The+good+works+of+the+faithful%2C+although+imperfect%2C+are+nevertheless+pleasing+to+God%2C+because+they+are+regarded+by+him+as+by+a+loving+Father%2C+not+as+an+austere+judge%3B+as+covered+and+adorned+with+the+most+perfect+obedience+of+Christ%2C+not+as+naked+and+alone.+Lastly%2C+The+failings+and+sins+of+the+faithful+are+indeed+hateful+and+displeasing+to+God%2C+but+out+of+a+simple+hatred%2C+not+redounding+upon+the+person.+And+therefore+God+hates+sin+in+the+regenerate%2C+and+for+that+reason+declares+war+against+it%2C+through+the+Spirit+of+grace%3B+but+the+regenerate+themselves%2C+in+the+mean+time%2C+are+acceptable+to+him%2C+and+on+that+account+he+favours+and+blesses+them.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1831%29%2C+1%3A+126-27.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c43e251d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c43e251d3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/09/07/john-davenant-on-the-believers-sincere-but-imperfect-obedience/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law.

11. The end of the First Commandement is that God among his people will bear rule ouer all, and wholly enjoy his authority. And to the end that this may come to pass, He commands all impiety, and all false opinions concerning God to be far from us: and in like sort, He enjoins Himself to be worshipped and adored of us in the true practice of godliness.

12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>

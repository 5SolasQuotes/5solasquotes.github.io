<main class="wrap"><figure class="quote" id="q-b2c1af29f7" data-kw="">
<blockquote><p>Whenever I read this passage, I am forcibly reminded of a similar instance, resembling it indeed more closely than any other, that of Thomas More, who held the same office as Shebna; for it is well known that he was Lord Chancellor to the king of England. Having been a very bitter enemy of the gospel, and having persecuted good men by fire and sword, he wished that on this account his reputation should be extensive, and his wickedness and cruelty permanently recorded. He therefore ordered the praises of his virtue to be inscribed on a tomb which he had caused to be built with great cost and splendor, and sent his epitaph, which he had drawn up, to Basle, to Erasmus, along with a palfrey which he gave him as a present, to get it printed.

He was so desirous of renown, that he wished to obtain during his life the reputation and praises which he hoped to enjoy after his death. Among other applauses the most conspicuous was, that he had been a very great persecutor of the Lutherans, that is, of the godly. What happened? He was accused of treason, condemned, and beheaded; and thus he had a gibbet for his tomb. Do we ask more manifest judgments of God, by which he punishes the pride, the unbounded eagerness for renown, and the blasphemous vaunting, of wicked men? In this inveterate enemy of the people of God, not less than in Shebna, we ought undoubtedly to acknowledge and adore God’s overruling providence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 131-32.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8cdbb56aac" data-kw="">
<blockquote><p>Be wise then, dear child of God, and look upon your present affliction as a chastening. “What son is he whom the father chastens not?” “As many as I love, I rebuke and chasten.” There is not a more profitable instrument in all God’s house than the rod. No honey was sweeter than that which dropped from the end of Jonathan’s rod, but that is nothing compared to the sweetness of the consolation which comes through Jehovah’s rod.

Our brightest joys are the birth of our bitterest griefs. When the woman has her travail pangs, joy comes to the house because a child is born—and sorrow is to us also, full often, the moment of the birth of our graces. A chastened spirit is a gracious spirit—and how shall we obtain it unless we are chastened? Like our Lord Jesus, we learn obedience by the things which we suffer. God had one Son without sin, but He never had a son without sorrow—and He never will while the world stands. Let us, therefore, bless God for all His dealings and in a filial spirit confess, “You, Lord, have chastened me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gratitude for Deliverance from the Grace. A Sermon Intended for Reading on Lord s-Day, January 3rd, 1892’ in The Metropolitan Tabernacle Pulpit: Volume 38</cite></span></figcaption>

<blockquote><p>7th Conclusion. When the representative Church is universally apostatical, then may the prince use the help of the Church-essential of found believers, for a reformation; and if they also be apostatic (which cannot be, except the Lord utterly have removed his candlestick) we see not what he can do but hear witness against them, but if there be any secret seeker of God in whose persons the essence of a true Church is conserved. The king by a royal power, and the law of charity is obliged to reform the land, as the godly kings with a blessed success have hitherto done, Asa, Josiah, Jehoshaphat, in which case the power of reformation and of performing many acts, of due belonging to the Church officers, are warrantably performed by the king, as in a diseased body, in an extraordinary manner power recurs from the members to the politic head and Christian prince, who both, as a King, in an authoritative way is obliged to do more then ordinary, and as a Christian member of the Church, in a charitative and common way, is to care for the whole body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 419</span></figcaption>

</figure><figure class="quote" id="q-6a616d80ee" data-kw="">
<blockquote><p>No more baseless fantasy ever entered the mind of man than that the Church and State can be completely separate! […] In good sooth, I can look upon it as little less than a species of infatuation, to teach that Church and State must be entirely separated – because, if the Church cannot reform and Christianize the State, then, undoubtedly, the State will tyrannise over and persecute the Church! Does the British Constitution let the United Secession Church alone? Indeed it does no such thing! That Constitution binds down every minister and member of that Church to swear, if called upon, that Christ is not the Head of the Church, but that a man, a woman, or a child, is the Head of the Church! Does the constitution and government of the United States of America – where there is no Established Church – let the Church alone? Indeed it does not; for, in America the Sabbath is systematically profaned, so that ministers and church-goers can scarcely “hear their ears,” in some cases, so loud is the unholy din of the freebooters on the domain of the Fourth Commandment, who, intent on business or pleasure, tramp along the streets and highways!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), pp 20-1.</span></figcaption>

<blockquote><p>It is their [the magistrates’] duty therefore to remove all such things for which, as is before showed, the Lord sends the pestilence and other grievous diseases; they must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9): for it is greatly to be feared that there be many which never consider what are, or may be, the causes of any calamity, nor seek any means how to pacify God. The magistrates also at such times must make good laws and see them faithfully executed. They must remove all disorders whereby God has been offended, they must punish and suppress the wicked which are indeed the very botches and sores, and contagion of the commonwealth. They must as David speaks of himself ‘destroy betimes all the workers of iniquity, and cut off the wicked from the city of the Lord’ (Ps. 101:8). They must also have a diligent care to remove such things which impoverish the country, as wicked gaming, luxuriousness in meat, drink and apparel, and such like. Such [consuming] caterpillars must be looked unto before all be consumed, for then it will be too late to spare when such devourers have swallowed up all after such manner, and then must men be put to many very wicked shifts to maintain their [immoral] bravery and to feed their greedy paunch, whereof we have lamentable experience at this day. For what is the cause of such robbing and spoiling both by land and sea, and of such horrible oppression and extortion everywhere but only this, that men having been long acquainted with bravery and dainty morsels, can hardly forego it, they had rather put a thousand wicked shifts in practice, yea they had rather hazard their lives everyday than that they would abate anything of their stately port, which under a show of wealth and great substance (although but being beggars indeed) they have long maintained, and from hence has sprung all kind[s] of cousonage and devilish deceit, whereby men overreach one another daily in their bargains and contracts. In times past they had good laws, even among the heathen people, to bridle all idle expenses and such as lavished their goods willfully. It were to be wished that such laws were now in use to take away the wonderful prodigality of this time. Usurers also, brokers, badgers and hucksters, and such like locusts that eat up the poor and cause the markets to be inhaunted [infrequented] should be bridled to the end [that] the poor may have things better cheap, and to the end [that] magistrates may perform these things and all other duties that belong unto them in time of war, pestilence and famine. … …The common treasure of cities also must sometimes serve for the relieving of the poor, which thing has been done in many famous cities, etc., it were far better that it should be so employed, than as it is many times upon feasting and vain shows… These things, therefore, if magistrates carefully perform, they shall offer an acceptable sacrifice to God, as David did at this time.</p></blockquote>

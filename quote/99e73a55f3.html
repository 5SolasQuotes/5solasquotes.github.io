<main class="wrap"><figure class="quote" id="q-99e73a55f3" data-kw="intercession necessary">
<blockquote><p>Various arguments prove the necessity of his intercession. (1) The institution of God, who wished two parts to be in the priesthood—satisfaction and intercession; just as under the Old Testament the high priest was bound to do two things in virtue of his office—first, to offer a victim upon the altar of whole burnt offerings; second, to carry the blood of the offered victim into the holy place and to burn incense upon the altar of incense. Having finished his sacrifice on earth upon the cross, Christ must intercede in heaven. Hence Paul testifies if he were on earth, he should not be a priest (Heb. 8:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.15.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/intercession-of-christ.html">Intercession of Christ</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/intercession-of-christ/heavenly-intercession.html">Heavenly intercession</a></span></div>

</figure><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9 / on invocation</span></figcaption>

</figure><figure class="quote" id="q-a7f4afc517" data-kw="priesthood satisfaction intercession">
<blockquote><p>The priesthood of Christ is the function of the mediatorial office according to which he performs those things with God which must be performed for sinners; both by offering himself up once as a victim for them and by interceding for them always with the Father. The great excellence of this function appears from the fact that no mystery was either predicted by clearer prophecies or adumbrated by more frequent types.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-97718f5beb" data-kw="Mary|Mediator">
<blockquote><p>Nothing is more frequent among them than to call the blessed virgin a redemptress and deliverer from sins.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fecc17f84e" data-kw="Mary|Mediator|Invocation of saints|Idolatry">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/albert-barnes.html">Albert Barnes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on the Bible</cite>, 1 Timothy 2:5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/mary-as-mediatrix.html">Mary as mediatrix</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/invocation-of-saints.html">Invocation of saints</a></span><span class="t"><a href="../topics/the-mediator-prophet-and-king/the-mediator.html">The Mediator</a> › <a href="../topics/the-mediator-prophet-and-king/the-mediator/christ-as-the-only-mediator.html">Christ as the only mediator</a></span><span class="t"><a href="../topics/the-mediator-prophet-and-king/the-mediator.html">The Mediator</a> › <a href="../topics/the-mediator-prophet-and-king/the-mediator/mediation-in-both-natures-against-saints-and-mary-as-mediators.html">Mediation in both natures (against saints and Mary as mediators)</a></span></div>
<div class="actions"><button class="copy" data-copy="“It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.”

— Albert Barnes, Notes on the Bible, 1 Timothy 2:5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+may+be+added+also+that+the+doctrine+of+the+Papists+that+the+saints+or+the+Virgin+Mary+may+act+as+mediators+to+procure+blessings+for+us%2C+is+false.+There+is+but+%22one+Mediator%3B%22+and+but+one+is+necessary.+Prayer+offered+to+the+%22saints%2C%22+or+to+the+%22Virgin%2C%22+is+idolatry%2C+and+at+the+same+time+removes+the+one+great+Mediator+from+the+office+which+he+alone+holds%2C+of+making+intercession+with+God.%E2%80%9D%0A%0A%E2%80%94+Albert+Barnes%2C+Notes+on+the+Bible%2C+1+Timothy+2%3A5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffecc17f84e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fecc17f84e.html">Permalink</a><a class="src" href="https://ccel.org/ccel/barnes/ntnotes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-b48112252c" data-kw="Mary|Queen of Heaven|Mediator">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/mary-as-mediatrix.html">Mary as mediatrix</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/mary-is-not-the-queen-of-heaven.html">Mary is not the queen of heaven</a></span><span class="t"><a href="../topics/the-mediator-prophet-and-king/the-mediator.html">The Mediator</a> › <a href="../topics/the-mediator-prophet-and-king/the-mediator/mediation-in-both-natures-against-saints-and-mary-as-mediators.html">Mediation in both natures (against saints and Mary as mediators)</a></span></div>
<div class="actions"><button class="copy" data-copy="“In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.”

— Theodore Beza, The Christian Faith, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+brief%2C+there+is+scarcely+one+title+given+to+Jesus+Christ%2C+nor+one+which+prophesies+of+Him%2C+which+they+do+not+attribute+to+her%2C+calling+her+Queen+of+Heaven%2C+Porter+of+Paradise%2C+their+life%2C+their+sweetness%2C+treasurer+of+grace%2C+the+refuge+and+advocate+of+sinners%E2%80%94thus+dishonoring+Him+and+also+making+the+poor+people+understand+that+they+honor+her+contrary+to+the+whole+Word+of+God+and+the+writings+of+the+most+ancient+teachers.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Christian+Faith%2C+1560%2C+Point+7%2C+%C2%A74%3A+The+Papists+Abolish+the+True+Intercession+of+Jesus+Christ&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb48112252c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b48112252c.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary|Mediator|Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</span></figcaption>

</figure><figure class="quote" id="q-bf239b6292" data-kw="Mary|Queen of Heaven|Mediator|Idolatry|Invocation of saints">
<blockquote><p>Yes, they transform some of them into detestable idols, making them in truth mediators of redemption, especially the virgin Mary, whom they call &quot;a Lady, a Goddess, a Queen, whom Christ her Son obeys in heaven, a mediatress: or life, hope, the medicine of the diseased.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, An Advertisement to all Favorers of the Roman Religion</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-529d8f82c6" data-kw="">
<blockquote><p>Unless” (says Dr. [Jacob] Andreas [a Lutheran]) “regeneration be always united to baptism, and remains in such as are baptized, how should the troubled consciences of those be eased and comforted, who because they feel not in themselves any good motions of God’s Holy Spirit, find none other refuge but the Word and sacraments, especially the sacrament of baptism? Now this remedy would be of small force except it be opposed against those imaginations which the Devil casts into a troubled heart; yea, except it taught such that God is greater than our heart, who in baptism has not only offered us the adoption of sons, but hath indeed bestowed the same upon us: as it is said by Christ, ‘He that believeth and is baptized, shall be saved.’ And by Paul, ‘Ye which are baptized, have put on Christ.’ David being armed with the like comfort from his circumcision, feared not to join battle with that great giant Goliath: and if this were not so, it must needs follow that baptism were nothing else but an idle ceremony, and also the persons of the Trinity would be thought liars. Wherefore those afflicted men, when Satan assaults them, must resist him with these words: ‘Depart from me Satan, thou hast neither part nor portion in the inheritance of my soul, because I am baptized in the name of the holy Trinity, and so am truly made the son of God by adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Order which Mr. Theodore Beza used in Comforting Afflicted Consciences’ appended to William Perkins, A Golden Chain</cite>, … (Cambridge, 1600)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/529d8f82c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Unless%E2%80%9D%20%28says%20Dr.%20%5BJacob%5D%20Andreas%20%5Ba,the%20son%20of%20God%20by%20adoption&amp;text=Unless%E2%80%9D%20%28says%20Dr.%20%5BJacob%5D%20Andreas%20%5Ba%20Lutheran%5D%29%20%E2%80%9Cregeneration&amp;text=truly%20made%20the%20son%20of%20God%20by%20adoption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-77f8be7850" data-kw="">
<blockquote><p>III. Here therefore we think the question can be solved by distinguishing heretics. For there are some who corrupt the substance of baptism and omit or change the form of institution; such as were the ancient Arians, who denied a Trinity of persons in unity of essence, and the modern Socinians. Others, while they retain substantials and defend the true doctrine of the holy Trinity contained in the formula of baptism, ‘err on other heads of doctrine’; as the ancient Novatians and Donatists, and the modern Romanists and Arminians. As to the former, we judge that baptism administered by them is null, and so they are not properly to be rebaptized, but baptized, who have been baptized by such heretics, because they evidently corrupt the essential form of baptism, to which the invocation of the Trinity belongs. For this reason, the baptism of the Arians, who baptized ‘in the name of the Father, the only true God, in Jesus Christ, the Savior and a creature, and in the Holy Spirit, the servant of both’… was formerly rejected in the Nicene Council… Still a distinction must be made here again. For either the minister alone was infected with that heresy or the whole church with him. If the latter, we deny it to be true baptism. If the former (to wit, if the church thinks rightly, notwithstanding the error of the pastor, if he is a secret heretic), provided the formula of Christ be retained, we believe the baptism to be valid and that it is not necessary to rebaptize those who have been once baptized. The sacrament is the property of the church, which is administered in her name and in her faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 15, ‘Is Baptism Administered by Heretics Lawful? We Distinguish’ in Institutes (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, pp. 396-98</span></figcaption>

</figure><figure class="quote" id="q-d4a248405c" data-kw="">
<blockquote><p>‘Tis one thing to dispute of the absolute sovereign power of God, and what are the truths, without the belief whereof ’tis absolutely, and altogether impossible that one can be saved: Which question (I doubt) is hardly determinable by Scripture, nor do I know what edification there is in the canvassing of it; sure I am ’tis a question much abused. ‘Tis another thing to dispute what are these truths, which in a Church where the Gospel is truly preached, all and every one (come to years of knowledge and discretion) and having means and occasions to learn, are bound to know (and according to the revealed will and ordinary dispensation of God) must learn, as they desire or expect to have a true fellowship with Christ in the sacrament of the Lord’s Supper, or to be accepted of God, and saved eternally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 9. ‘What is Meant in Scripture by the Word ‘Heresies’…’</span></figcaption>

<blockquote><p>For we do not see it necessary to posit, or even possible to posit, actual faith in those infants (which some conjecture, others strongly assert), unless it is solidly proved from Scripture. For that extraordinary and miraculous motion of John the Baptist, Lk. 1:44, seems to contribute nothing to this matter. Since from a miracle no consequence is valid to the ordinary force, causality, disposition, act, or effect of any thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>

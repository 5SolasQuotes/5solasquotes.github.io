<main class="wrap"><figure class="quote" id="q-e64b53ec7e" data-kw="">
<blockquote><p>In two ways Almighty God wounds those whom he is concerned to restore to health. Sometimes he whips them outwardly on the flesh in order to cure the poison of sins. Sometimes, even if the outward blows seem to have stopped, he inflicts wounds inwardly because he strikes the hardness of our mind with desire for him. Yet by striking he heals because, when we have been pierced by the spear of fear of him, he recalls us to an upright frame of mind. For our hearts are sickly when stricken with no love for God, when unmindful of the woefulness of our pilgrimage, when apathetic with hardly any feeling at all toward the weakness of our neighbour. But they are wounded that they may be healed because God strikes unfeeling minds with the darts of love for him and soon makes them full of feeling through the burning heat of charity.

Hence here the Bride says: I have been wounded by love. For the soul that is sickly and in the state of this exile lies prostrate in blind security has neither seen God nor sought to see him. But when she is struck by the darts of his love, she is ‘wounded’ in her innermost recesses with tender devotion, burns with desire for contemplation, and marvellously is restored to life through her wound, though once she lay dead in health. She yearns, she pants, and she desires to see him whom she fled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Excerpts from the Books of Blessed Gregory on the Song of Songs. Compiled by William of Saint Thierry</cite>, (1692) in Gregory the Great on the Song of Songs (594-98), trans. Mark DelCogliano (Collegeville MN: Liturgical Press, 2012), pp 196-97.</span></figcaption>

<blockquote><p>The Covenanters saw that the only cure for Ireland’s ills was the Word of God, and that the darkness of Romanism and all the crime and misery attendant thereon could be banished only by the light of God’s truth. And so they bound themselves that they would “sincerely, really, and constantly, through the grace of God, endeavour the reformation of religion in the Kingdom of Ireland in doctrine, worship, discipline, and government, according to the Word of God and the example of the best reformed Churches.” Does not this show that they were prepared for missionary work, and that the fulfilment of the Covenants would have meant the giving of the Bible to Ireland, as Rome has ever been refusing to give it, and not to Ireland alone but to the heathen nations of the world?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ramsey.html">John Ramsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The British covenants suited to present-day needs</cite>, (Belfast, 1897), p. 17.</span></figcaption>

</figure><figure class="quote" id="q-18d4d3a7ca" data-kw="">
<blockquote><p>Both of you, take heed ye bring not your differences any more unto public, nor otherwise put them among the people: Keep them amongst yourselves, where they may abide with less hurt, Rom. 14:1 &amp; 22. Considering the mischiefs of evulgating them, it will evidently appear happy to bury them in silence or oblivion. If ye interest and engage the people therein, then are ye gone; and beside other inconvenients thereof, ye shall not get leave to unite again without their consent, which may be hard to gain. How long shall any affect popularity, and thereby subject their ministerial authority to the humors of men and women for drawing them to their side to strengthen their party? by which means people are taught to domineer over ministers and may fore-run you, and cast at yourselves next when ye begin to sit up and not go along with all their notions and inclinations. Ye may perhaps find no small difficulty to regulate and bridle their humors, being once aloft, Fortur equis auriga, non audit currus habenas. Moreover, what do ye by filling people’s heads with such entangling controversies but divert their minds and take them off the main thing? and turn religion into factions and debates? and wear them out of heart-tenderness, real exercise of conscience and the serious study of universal holiness? If any make it their work to kindle in religious hearers a factious, opinionative zeal, you may thereby trouble their heads, not better their hearts and may sooner make them firebrands to burn down the peace, purity and order of the Church than living polished stones for the New Jerusalem. Yea, likely you may unhinge them so as to tempt them to cast at all ministers, at all religion, and turn either atheists or Seekers and sectarians, as woeful experience has many times proved, even in our own days; so small a friend to the promoting of piety, is division. Avoid then carefully to discover your intestine jars and animosities before the people in public or private. Bear not your nakedness to their eyes. Teach them not to meddle with things above their sphere and beyond their line (Ps. 131:1-2) and turn them not aside unto vain janglings, Tit. 3:9; 2 Tim. 2:17-18; 1 Tim. 1:6-7; 4:7; 6:4-5. Make it rather your work to edify them in the substantials of religion and vitals of piety, such as faith and repentance, humility, sobriety, mortification, self-denial, love and new obedience, etc. How much better were it to fire their hearts with the love of God and man than to heat their heads with puzzling debates, which do but perplex, not edify, and are far out of the way of their salvation or duty, and does not at all concern their practice. What profit reap they by being inveighed into such quicksands? We have seen many unfleeced of their wool, yea torn in their flesh, by being involved in such thorns, but never any advantaged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London, 1681), pp. 152-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-bf446c742e" data-kw="">
<blockquote><p>If any person walk unworthy of the Gospel or commit any trespass, he is (unless the scandal be public and notorious) admonished first: secretly by one, next by two or three more. And thirdly, if he contemn both, then according to the order prescribed by our Savior (Matt 18), the matter is brought before the minister and elders where he is accused both of the trespass and of the contempt. If he cannot yet be brought to repentance, then is the matter in some measure made known unto the congregation and he is called before the greater presbytery, where, if he give signs of his repentance, he is remitted to satisfy his own session. But if he persist in his obstinacy, then by the ordinance of the presbytery, the particular eldership is to proceed against him with the censures of the church even to excommunication. The matter being thus heard, known and judged, and the whole process revised by the greater presbytery, the next Sabbath (without delay) the trespass and order of admonitions are declared to the congregation and the person (without specification of his name) is admonished yet to satisfy. Which, if he still refuse to do, the next Sabbath his name, with his offence and contempt, are published. If he yet continue obstinate, then on the next Sabbath (which is the third), he is charged publicly to satisfy for his offence and contempt under the pain of excommunication. If now he offer himself to the particular presbytery, then do they (at the appointment of the presbytery) give order for his public repentance, the removing of the scandal, and his reconcilement to the church. Otherwise the minister proceeds in this order: … As the presbytery excommunicates profane professors, so does it also depose preachers… … The subject and matters treated in the presbytery are all the ecclesiastical matters of weight which concern the particular churches there represented, as: the examination, ordination, suspension and deposition of ministers, scandals of ministers in doctrine, life, or any part of their calling, the decerning [decreeing] of excommunication…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government &amp; Order of the Church of Scotland</cite></span></figcaption>

— Alexander Henderson, The Government &amp; Order of the Church of Scotland">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+any+person+walk+unworthy+of+the+Gospel+or+commit+any+trespass%2C+he+is+%28unless+the+scandal+be+public+and+notorious%29+admonished+first%3A+secretly+by+one%2C+next+by+two+or+three+more.+And+thirdly%2C+if+he+contemn+both%2C+then+according+to+the+order+prescribed+by+our+Savior+%28Matt+18%29%2C+the+matter+is+brought+before+the+minister+and+elders+where+he+is+accused+both+of+the+trespass+and+of+the+contempt.+If+he+cannot+yet+be+brought+to+repentance%2C+then+is+the+matter+in+some+measure+made+known+unto+the+congregation+and+he+is+called+before+the+greater+presbytery%2C+where%2C+if+he+give+signs+of+his+repentance%2C+he+is+remitted+to+satisfy+his+own+session.+But+if+he+persist+in+his+obstinacy%2C+then+by+the+ordinance+of+the+presbytery%2C+the+particular+eldership+is+to+proceed+against+him+with+the+censures+of+the+church+even+to+excommunication.+The+matter+being+thus+heard%2C+known+and+judged%2C+and+the+whole+process+revised+by+the+greater+presbytery%2C+the+next+Sabbath+%28without+delay%29+the+trespass+and+order+of+admonitions+are+declared+to+the+congregation+and+the+person+%28without+specification+of+his+name%29+is+admonished+yet+to+satisfy.+Which%2C+if+he+still+refuse+to+do%2C+the+next+Sabbath+his+name%2C+with+his+offence+and+contempt%2C+are+published.+If+he+yet+continue+obstinate%2C+then+on+the+next+Sabbath+%28which+is+the+third%29%2C+he+is+charged+publicly+to+satisfy+for+his+offence+and+contempt+under+the+pain+of+excommunication.+If+now+he+offer+himself+to+the+particular+presbytery%2C+then+do+they+%28at+the+appointment+of+the+presbytery%29+give+order+for+his+public+repentance%2C+the+removing+of+the+scandal%2C+and+his+reconcilement+to+the+church.+Otherwise+the+minister+proceeds+in+this+order%3A+%E2%80%A6+As+the+presbytery+excommunicates+profane+professors%2C+so+does+it+also+depose+preachers%E2%80%A6+%E2%80%A6+The+subject+and+matters+treated+in+the+presbytery+are+all+the+ecclesiastical+matters+of+weight+which+concern+the+particular+churches+there+represented%2C+as%3A+the+examination%2C+ordination%2C+suspension+and+deposition+of+ministers%2C+scandals+of+ministers+in+doctrine%2C+life%2C+or+any+part+of+their+calling%2C+the+decerning+%5Bdecreeing%5D+of+excommunication%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Alexander+Henderson%2C+The+Government+%26+Order+of+the+Church+of+Scotland&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf446c742e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf446c742e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church/independent-churches-do-not-have-the-authority-for-greater-excommunication/#:~:text=If%20any%20person%20walk%20unworthy%20of,calling%2C%20the%20decerning%20%5Bdecreeing%5D%20of%20excommunication&amp;text=If%20any%20person%20walk%20unworthy%20of%20the%20Gospel&amp;text=of%20their%20calling%2C%20the%20decerning%20%5Bdecreeing%5D%20of%20excommunication" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-3dd2e3d3a1" data-kw="">
<blockquote><p>The Papists’ confession of the sufficiency of our Belief: Council of Basil, Oration of Ragus., Bin. p. 299: ‘The holy Scripture in the literal sense, soundly and well understood, is the infallible and most sufficient rule of faith.’ Bellarmine, Of the Word of God, bk. 4, ch. 11 ‘In the Christian doctrine both of Faith and manners, some things are simply necessary to salvation, to all, as the knowledge of the articles of the Apostles’ Creed, of the Ten Commandments and of some sacraments: The rest are not so necessary that a man cannot be saved without the explicit knowledge, belief and profession of them—These things that are simply necessary, and are profitable to all, the apostles preached to all— All things are written by the apostles which are necessary to all, and which they openly preached to all.’ (See the place.) Costenus, Enchiridion, ch. 1, p. 49 ‘Non inficiamur praecipua illa fidei capita quae omnibus Christians cognitu sunt ad salutem necessaria, perspicue satis esse apostolicis scriptis comprehensa.’ [We do not deny that those principal articles of faith which all Christians know and which are necessary for salvation are set forth quite clearly enough in the apostolic writings.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed</cite>, ... (London: 1660), ‘To fill up this vacant page’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ae5a421f4" data-kw="Rule of faith">
<blockquote><p>For unless scripture be a whole and perfect rule, it cannot be a rule at all; because there ought to be the exactest agreement between the rule and the thing to which it is applied. If, therefore, our faith be longer or broader than the scripture, then the scripture is not its rule; because a rule should be adequate to the thing measured by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 6, ch. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/unwritten-traditions.html">Unwritten traditions</a></span></div>

— William Whitaker, A Disputation on Holy Scripture, Question 6, ch. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+unless+scripture+be+a+whole+and+perfect+rule%2C+it+cannot+be+a+rule+at+all%3B+because+there+ought+to+be+the+exactest+agreement+between+the+rule+and+the+thing+to+which+it+is+applied.+If%2C+therefore%2C+our+faith+be+longer+or+broader+than+the+scripture%2C+then+the+scripture+is+not+its+rule%3B+because+a+rule+should+be+adequate+to+the+thing+measured+by+it.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+Question+6%2C+ch.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ae5a421f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ae5a421f4.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-6d00dcdf01" data-kw="">
<blockquote><p>That which is owned among Protestants in common is this: That the Holy Scriptures are the only, and sufficient guide and rule, in all matters of necessary belief and observance in order unto salvation; able to make us wise unto salvation; and therefore, whosoever does either derogate from this their perfection, or add any thing unto them, as necessary to be believed or done in order unto salvation, are certainly guilty of most presumptuous and unaccountable profaneness: and this we justly tax the Church of Rome withal, for enjoining of unwritten traditions and Papal determinations to be received with an equal reverence unto the holy Scriptures. But then it is not their meaning, by virtue of this declaration, to condemn all opinions, as false, and actions as unlawful, which the Holy Scripture prescribes not; or to extend the perfection of holy Scripture so far as the punctual determination of the circumstantials of divine worship. The perfection of God’s Word is judged by them with relation unto that special end whereto it is designed; viz. the instruction of men in all things necessary unto salvation; the knowledge whereof they could not otherwise attain unto than by divine revelation; for it was not aimed to destroy or extinguish the light of nature, but to help, advance and perfect it. It is not therefore any of God’s purpose in the holy Scriptures, to comprize all things which men may know, believe or practice, as if natural reason and discretion were no longer to continue it’s guidance; or to determine all rituals and circumstances appertaining to the external ordering of divine worship, so as to have nothing for ecclesiastical laws to be employed about. That, which they teach of the Scripture’s sufficiency is ever restrained to matters of necessary belief and duties of necessary observance in order unto salvation; and never enlarged to all things that may be believed or done by us in the general, or to particular circumstances, which have respect unto the good order, decency, and external regulation of divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-camfield.html">Benjamin Camfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Examination of the Independents’ Catechism &amp; therein of the Chief Principles of Non-Conformity to, &amp; Separation from the Church of England</cite>, (London: Redmayne, 1668), ch. 1, pp. 2-4 Camfield defended the Anglican ceremonies.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

</figure><figure class="quote" id="q-8317e796d9" data-kw="">
<blockquote><p>Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Romanist Theory of Development</cite>, p. 6</span></figcaption>

</figure><figure class="quote" id="q-39cdcf3c15" data-kw="">
<blockquote><p>We believe that the word, contained in these books, came from one God; of whom alone, and not of men, the authority thereof dependeth. … it is not lawful to oppose either antiquity, custom, multitude, man&#x27;s wisdom and judgment, or edicts, or any decrees, or councils, or visions, or miracles, unto this holy Scripture; but rather that all things ought to be examined and tried by the rule and square thereof.</p></blockquote>

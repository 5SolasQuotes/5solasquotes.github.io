<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>

<blockquote><p>Richard A. Muller, in his article, “Grace, Election and Contingent Choice…” deals with the historical myth that the classic reformed theology leads to metaphysical determinism. Quite the contrary to the charge, by analyzing the teachings of the major Reformed thinkers and confessions, Muller shows that the Reformed view of divine sovereignty and grace neither denies human free choice and future contingents nor undermines human responsibility.” – Jeongmo Yoo, John Edwards, p. 28 Mylius, R.A. [Richard Muller] – ‘In the Steps of Voetius: Synchronic Contingency &amp; the Significance of Cornelius Elleboogius’ Disputationes de Tetragrammato to the Analysis of his Life &amp; Work’ (2010) 10 pp. in ed. M. Wisse, M. Sarot &amp; W. Otten, Scholasticism Reformed: Essays in Honour of Willem J. Van Asselt Buy pp. 92-102 ‘God as Absolute &amp; Relative, Necessary, Free, &amp; Contingent: The Ad Intra-Ad Extra Movement of Seventeenth-Century Reformed Language About God’ in Always Reformed: Essays in Honor of W. Robert Godfrey Buy ed. R. Scott Clark &amp; Joel E. Kim, 2010, pp. 56-73 Sytsma, David – ‘The Specter of Necessitarianism’ in ch. 7, ‘From ‘Epicurean’ Physics to Ethics’ in Richard Baxter &amp; the Mechanical Philosophers (Oxford, 2017), pp. 233-39 . . Books 1600’s Strong, William – A Treatise Showing the Subordination of the Will of Man Unto the Will of God ToC (London, 1657) 335 pp. on Acts 21:14 This was recommended by Thomas Manton. Pages 197-278, especially, treat of the permissive will of God. Strong was an Independent puritan and Westminster divine. Sterry, Peter – A Discourse of the Freedom of the Will (London, 1675) 245 pp. Sterry (1613–1672) was an Independent, a Westminster divine and a chaplain to Cromwell. Sterry associated with the Cambridge Platonists prominent during the English Civil War era. Sterry had a mystical streak and was a millenarian; he expected the second advent of Christ, with the millennium on earth following, in the early 1650’s, and 1656 at the latest. This book has three parts. The first argues against “those arguments… in opposition to that liberty of the will, which [liberty] is placed in the determining of its power, received from the First Cause, unto a contrariety or contradiction in its actings, with an independency upon the First Cause, the order and connection of causes, and the understanding.</p></blockquote>

<blockquote><p>…the similarities and differences between the conclusions reached by Scotus and Aquinas. Though Scotus became the standard reference point for discussions of intuitive versus abstractive cognition, this does not mean his account of the beatific vision fundamentally differed from Thomas’s regarding the vision of the divine essence. Both affirmed that the intelligible species could not be creaturely or a created similitude to see the divine essence, both affirmed the necessity of the supernatural agent to elevate the created intellect, and both affirmed a sense in which the beatific vision is ‘natural’ in the creature. They disagreed on how to define such a natural desire (with Aquinas claiming it is elicited and Scotus it is innate), the status of obediential potency (Aquinas distinguishing it from natural potency and Scotus conflating the two), the necessity of the light of glory, and whether what is natural should be measured merely by passive potencies.</p></blockquote>

ncies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not. 2. Therefore to such the impossibility is not physical, but moral. 3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.) 4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations. 5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.) 6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not. 2. Therefore to such the impossibility is not physical, but moral. 3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.) 4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations. 5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.) 6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.”

<blockquote><p>It is asked, sixth, whether original sin consists only in the privation of original righteousness… The papists certainly acknowledge an original righteousness, but one which was not natural to man, but a supernatural gift, like a certain golden bridle, conferred upon natural man to restrain the conflict between the flesh and the spirit. So that they may obtain that the things natural to man, among which is free choice, have remained unwounded by the fall of our first parents, and likewise so that they may hold to this conflict between the flesh and the spirit, or the concupiscence of the flesh against the spirit, and thus that, such conflict notwithstanding, in this life man can be morally perfect, they state that original sin does not consist in anything but the privation of original righteousness, through which the spirit, in the conflict with the flesh, devoid of the assistance of original righteousness, contracted a languor through which it cannot as promptly and successfully repress the attacks of the flesh. The opinion of the Reformed with their reasons. The Reformed on the contrary, because they believe that original righteousness was natural, that is, owed to a morally intact nature, state that not only was original righteousness taken away on account of the fall, but by the same stroke the entire nature of man was so morally corrupted as regards the intellect, the will, the affections, that by nature he is blind in respect to all spiritual truth, likewise incompetent for any spiritual good, and prone to all evil in respect to his will.</p></blockquote>

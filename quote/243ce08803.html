<main class="wrap"><figure class="quote" id="q-243ce08803" data-kw="">
<blockquote><p>God hath made us for mutual society; He hath made us so that continual strain on body or mind without recreation is destructive to our health and usefulness. No enlightened conscience will see any inconsistency between healthful and happy recreation, on the one hand, and glorifying God, on the other. These very recreations, and whatsoever he doeth, the enlarged and free-hearted believer can do — to the glory of God.

Only let this principle really rule, — ‘How may I best and to the utmost degree glorify God?’ — and all narrow, creeping, bondage-ridden questions, and all symptoms of a timid, hampered, unmanly, faltering, unfree walk with God, will disappear. And without a free, holy, cordial, open, ingenuous walk with God, all minute and accurate and verbal and mechanical rules might most mechanically and accurately and minutely be observed, but the soul of man be not any more trained to the exalted dignity of a free companionship and unfettered friendship with Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prophet Jonah: His Character and Mission to Nineveh</cite>, (London: Alexander Strahan, 1866), p. 179.</span></figcaption>

<blockquote><p>Evan. In this commandment the Lord forbiddeth idleness or sleeping more on the Lord’s day in the morning, than is of necessity, (Matt 20:6); and he also forbiddeth us to labour in our particular callings, (Exo 16:28-30); and he also forbiddeth us to talk about our worldly affairs and business on that day, (Amos 8:5, Isa 58:13); and he also forbiddeth us to travel any journey about our worldly business on that day, (Matt 24:20); or keep any fairs or markest on that day, (Neh 13:16,17); or to labour in seed time and harvest on that day. In a word, the Lord on that day forbiddeth all worldly works and labours, except works of mercy and instant necessity, which were mentioned before. And thus have I also declared, both what the Lord requires and what he forbids in the fourth commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 418-19.</span></figcaption>

</figure><figure class="quote" id="q-548c0f4a16" data-kw="">
<blockquote><p>Or for the sins here forbidden:

Say first, hast thou not sometime spent the Lord’s day in idleness, or in worldly business, in vanities, or in sin? Secondly, hast thou not omitted publique duties, or comest in too late, or wentest out too soon? Thirdly, hast thou not on those days sold wares, carried burthens, brought in sheaves, or wrought in the harvest? Fourthly, hast thou not employed thy cattle, or servants, or children, or any other, though thou workest not thy self?

Fifthly, hast thou not profaned the Lord’s day, by needless works, words, or thoughts, about thy calling, or about thy recreation? Sixthly, have not the strict observance of the duties of that day been tedious unto thee, saying in thine heart, When will the day be gone? If in any of these thou hast transgressed, then hast thou broken this Commandment, Remember that thou keep holy the Sabbath day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prima, the first things, in reference to the middle and last things: or, the doctrine of regeneration, the new birth, the very beginning of a godly life</cite>, (London: Nathanael Webb and William Grantham, 1640), p. 54.</span></figcaption>

<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>

<blockquote><p>…as [John] Cameron notes, it is ordinary to call that necessary which is very profitable and expedient. Beside this (I say), we further maintain that in the use of things indifferent, that which we deliberate upon to do is never lawful to be done except it be also necessary, though not necessitate absoluta seu consequentis [by an absolute necessity, of the consequence], yet necessitate consequentiae seu ex supposition [by a necessity of the consequent, or from the supposition]. Paul’s circumcising of Timothy was lawful only because it was necessary, for he behooved by this means to win the goodwill of the people of Lystra who had once stoned him, otherwise he could not safely have preached the Gospel among them. Therefore he had done wrong if he had not circumcised Timothy, since the circumcising of him was according to the rules of the Word, and it was expedient to circumcise him and unexpedient to do otherwise. And (because de paribus idem est judicium [from the parts, so is the judgment]) whensoever the use of any indifferent thing is according to the rules of the Word, that is, when it is profitable for God’s glory and man’s edification, and the doer is persuaded of so much, I say, putting this case, then (for so much as not only it may, but ought to be done) the use of it is not only lawful, but necessary: and (for so much as not only it needs not, but ought not to be omitted) the omission of it is not only unnecessary, but also unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637) | pt. 4, ch. 3, ‘Whether there be anything indifferent in actu exercito [in the exercised act]’, p. 17 While Gillespie’s teaching here is not in the context of the Sabbath, it is very relevant.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…as [John] Cameron notes, it is ordinary to call that necessary which is very profitable and expedient. Beside this (I say), we further maintain that in the use of things indifferent, that which we deliberate upon to do is never lawful to be done except it be also necessary, though not necessitate absoluta seu consequentis [by an absolute necessity, of the consequence], yet necessitate consequentiae seu ex supposition [by a necessity of the consequent, or from the supposition]. Paul’s circumcising of Timothy was lawful only because it was necessary, for he behooved by this means to win the goodwill of the people of Lystra who had once stoned him, otherwise he could not safely have preached the Gospel among them. Therefore he had done wrong if he had not circumcised Timothy, since the circumcising of him was according to the rules of the Word, and it was expedient to circumcise him and unexpedient to do otherwise. And (because de paribus idem est judicium [from the parts, so is the judgment]) whensoever the use of any indifferent thing is according to the rules of the Word, that is, when it is profitable for God’s glory and man’s edification, and the doer is persuaded of so much, I say, putting this case, then (for so much as not only it may, but ought to be done) the use of it is not only lawful, but necessary: and (for so much as not only it needs not, but ought not to be omitted) the omission of it is not only unnecessary, but also unlawful.”

— George Gillespie, A Dispute Against the English-Popish Ceremonies, (1637) | pt. 4, ch. 3, ‘Whether there be anything indifferent in actu exercito [in the exercised act]’, p. 17 While Gillespie’s teaching here is not in the context of the Sabbath, it is very relevant.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6as+%5BJohn%5D+Cameron+notes%2C+it+is+ordinary+to+call+that+necessary+which+is+very+profitable+and+expedient.+Beside+this+%28I+say%29%2C+we+further+maintain+that+in+the+use+of+things+indifferent%2C+that+which+we+deliberate+upon+to+do+is+never+lawful+to+be+done+except+it+be+also+necessary%2C+though+not+necessitate+absoluta+seu+consequentis+%5Bby+an+absolute+necessity%2C+of+the+consequence%5D%2C+yet+necessitate+consequentiae+seu+ex+supposition+%5Bby+a+necessity+of+the+consequent%2C+or+from+the+supposition%5D.+Paul%E2%80%99s+circumcising+of+Timothy+was+lawful+only+because+it+was+necessary%2C+for+he+behooved+by+this+means+to+win+the+goodwill+of+the+people+of+Lystra+who+had+once+stoned+him%2C+otherwise+he+could+not+safely+have+preached+the+Gospel+among+them.+Therefore+he+had+done+wrong+if+he+had+not+circumcised+Timothy%2C+since+the+circumcising+of+him+was+according+to+the+rules+of+the+Word%2C+and+it+was+expedient+to+circumcise+him+and+unexpedient+to+do+otherwise.+And+%28because+de+paribus+idem+est+judicium+%5Bfrom+the+parts%2C+so+is+the+judgment%5D%29+whensoever+the+use+of+any+indifferent+thing+is+according+to+the+rules+of+the+Word%2C+that+is%2C+when+it+is+profitable+for+God%E2%80%99s+glory+and+man%E2%80%99s+edification%2C+and+the+doer+is+persuaded+of+so+much%2C+I+say%2C+putting+this+case%2C+then+%28for+so+much+as+not+only+it+may%2C+but+ought+to+be+done%29+the+use+of+it+is+not+only+lawful%2C+but+necessary%3A+and+%28for+so+much+as+not+only+it+needs+not%2C+but+ought+not+to+be+omitted%29+the+omission+of+it+is+not+only+unnecessary%2C+but+also+unlawful.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Dispute+Against+the+English-P

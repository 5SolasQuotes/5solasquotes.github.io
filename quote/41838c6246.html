<main class="wrap"><figure class="quote" id="q-41838c6246" data-kw="">
<blockquote><p>Q. How many ways does the Word of God teach us to come to the Kingdom of Heaven? Ans. Two.

Q. Which are they? A. The Law and the Gospel.

Q. What saith the Law? A. Do this and thou shalt live.

Q. What saith the Gospel? A. Believe in Jesus Christ, and thou shalt be saved.

Q. Can we come to the Kingdom of Heaven by the way of God’s Law? A. No.

Q. Why so? A. Because we cannot do it.

Q. Why can we not do it? A. Because we are all born in sin.

Q. What is it to be born in sin? A. To be naturally prone to evil, and untoward to that which is good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Catechetical Exposition of Christian Doctrine</cite>, (London, 1633), pp 3-4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b72ef7f2ea" data-kw="">
<blockquote><p>5. The moral law doth forever bind all, as well justified persons as others, to the obedience thereof; and that, not only in regard of the matter contained in it, but also in respect of the authority of God the Creator, who gave it. Neither doth Christ, in the gospel, any way dissolve, but much strengthen this obligation.

6. Although true believers be not under the law, as a covenant of works, to be thereby justified, or condemned; yet is it of great use to them, as well as to others; in that, as a rule of life informing them of the will of God, and their duty, it directs and binds them to walk accordingly; discovering also the sinful pollutions of their nature, hearts, and lives; so as, examining themselves thereby, they may come to further conviction of, humiliation for, and hatred against sin, together with a clearer sight of the need they have of Christ, and the perfection of his obedience. It is likewise of use to the regenerate, to restrain their corruptions, in that it forbids sin: and the threatenings of it serve to show what even their sins deserve; and what afflictions, in this life, they may expect for them, although freed from the curse thereof threatened in the law. The promises of it, in like manner, show them God’s approbation of obedience, and what blessings they may expect upon the performance thereof: although not as due to them by the law as a covenant of works. So as, a man’s doing good, and refraining from evil, because the law encourageth to the one, and deterreth from the other, is no evidence of his being under the law; and, not under grace.

7. Neither are the forementioned uses of the law contrary to the grace of the gospel, but do sweetly comply with it; the Spirit of Christ subduing and enabling the will of man to do that freely, and cheerfully, which the will of God, revealed in the law, requireth to be done.</p></blockquote>

</figure><figure class="quote" id="q-ac44ef0045" data-kw="judicial ends theocracy">
<blockquote><p>The forensic or judicial law concerned the civil government of the people of God under the Old Testament and contained a body of precepts concerning the form of that political rule. There were various ends of it. (1) The good order and legitimate constitution of the Jewish polity, which should be a true theocracy, as Josephus calls it. (2) The distinguishing of that state and nation from all other people and states and that that polity might be the seat of the church and the place for the manifestation of God. (3) The vindication of the moral and ceremonial law from contempt. (4) The adumbration of the spiritual kingdom of Christ.</p></blockquote>

<blockquote><p>The perpetuity and the universal obligation of the Sabbath, and consequently its appointment in the beginning of time, are distinctly indicated by the place assigned it in the Decalogue. It is acknowledged that the other nine precepts are of universal and perpetual obligation; and for this reason they were written on tables of stone by the finger of God. But why should a ceremonial institution, designed for only one nation, and destined to pass away, be incorporated in a law which is obligatory on all men, and is to continue in force to the end of time?

True, there is something of the nature of a positive command in it; but it is also clearly moral. All our time belongs to God. Six parts of it he allows to be devoted to ordinary pursuits and pleasures; but the seventh he retains, and requires it to be specially and exclusively devoted to spiritual duties. The obligation to employ our time, or any part of it, according to divine direction, is clearly moral. And no reason can be assigned for the placing of the command to hallow the Sabbath in the Decalogue, save that, like the other nine, it is of universal and perpetual obligation. And since the other commandments were in substance given in the beginning of time, so was the fourth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathan-l-rice.html">Nathan L. Rice</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Origin and History of the Sabbath in The Christian Sabbath: Its History, Authority, Duties, Benefits, and Civil Relations. A Series of Discourses</cite></span></figcaption>

</figure><figure class="quote" id="q-e0097125d6" data-kw="">
<blockquote><p>For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.’ If it was ‘by Promise,’ then it was ‘by faith,’ for faith only receives the Promise; if it was by the Law, then it was by works, for works only fulfil the Law. True, the Law was afterwards added to the Promise, but not to disannul or to supersede it; on the contrary, it was itself a dispensation of the covenant of grace, for it was proclaimed in the name of the ‘God of Abraham, and Isaac, and Jacob;’ and if it republished in all their rigour the original terms of the covenant of works, it was only ‘because of transgressions, till the seed should come to whom the Promise was made.’ It was for conviction of sin, for ‘the Law worketh wrath,’ and is a ‘ministration of death;’ but, as such, it was ‘our schoolmaster to bring us unto Christ, that we might be justified by faith.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification</cite>, (Edinburgh: T&amp;T Clark, 1867), 52–53.</span></figcaption>

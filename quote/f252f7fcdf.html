<main class="wrap"><figure class="quote" id="q-f252f7fcdf" data-kw="">
<blockquote><p>In verse 27 of chapter 3, after he dwells for a little while on the conclusion of the demonstration and has preached a little more fully about the righteousness of faith, he connects the two parts of the principal syllogism and gathers them into one, and after denying the contrary manner of justifying, which is by works, he concludes the manner of justifying that is true and singular, namely, which is by faith. He also concludes the universality of those justified by faith. For as he shows the universality of sinful men, so he also teaches the universality of men who are justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey Carmichael, Classic Reformed Theology Series vol. 5 (Reformation Heritage Books, 2021), 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-019380f2df" data-kw="">
<blockquote><p>Those who seek to be justified through the works of the Law not only fail to crucify their flesh but even increase its lusts—so far are they from being able to be justified. For the Law is the strength of sin (1 Corinthians 15:56) in that it stimulates lust and its contrary inclination even while forbidding it. But since faith in Christ loves the Law, which forbids lust, it now does the very thing the Law commands; it attacks and crucifies lust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Day by Day: 365 Devotional Readings with Martin Luther. Concordia Publishing House. Kindle Edition</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-1f18105752" data-kw="">
<blockquote><p>Desertion in sin is when, God withdrawing the assistance of his spirit, a man is left to fall into some actual and grievius sin. And for all this no man is to think that God is the author of sin, but only man that falls, and Satan. A resemblance of this truth we may see in a staff: which, if a man shall take and set upright upon the ground, so long as he holds it with his hand, it stands upright; but so soon as he withdraws his hand, though he never push it down, it falls of itself. In this desertion was the good king Hezekiah… God left him (namely, to the pride of his heart to exalt himself) in tempting him, that he might try out all that was in his heart. To this place appertain[s] Noah’s drunkenness, David’s adultery, Peter[‘s] denial of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine, or The Description of Theologie Containing the Order of the Causes of Salvation and Damnation</cite>, ... (Cambridge, 1600), A Declaration of Certain Spiritual Desertions…, p. 682</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47c06a0653" data-kw="">
<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 139</span></figcaption>

</figure><figure class="quote" id="q-5cbf7cd3e2" data-kw="">
<blockquote><p>The will of God is one and the same, but it is distinguished: 1. In respect of the object into voluntatem beneplaciti et placiti. God wills good things and good effects with the will of his good pleasure, approving them first of all, and by Himself, He intends their end and means, Eph. 1:5; but evil and evil effects as they are evil, he nils, disapproves and dislikes. Yet he voluntarily permits evil, and as there is a good end of it, He wills it with the will of his pleasure, for it is good that there should be evil, Ps. 81:12; Acts 14:16; 1 Cor. 10:5. Divines thus distinguish, there is volitio mala et mali [an evil volition and a volition of evil], to will sin to be, is not sinful; it had never come into the world if God had not willed it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 2, ch. 7, ‘Of God’s Understanding that He is Omniscient, and of his Will’, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

<blockquote><p>23. To imagine God either without providence, or with general only, not special, indeed also singular, concerning any entities whatsoever and any acts of entities, is impious and hurls God from his throne.

24. But this providence is either effective of all good, or permissive and directive of evil, nor idle concerning evil but efficacious, although not efficient.

25. Whence those who strive to ascribe to God the efficiency of evil reduplicatively as such to orthodox [Reformed] Churches, do what they do from mere either ignorance or malice, since they constantly teach that God can be neither the physical nor the ethical cause of ethical evil as such.

26. To imagine God also without predestination is both to detract the eternal direction of all things from God, and to establish an uncertain end of the creation of men, and to make primary causes from secondary, and to constitute man the craftsman and architect of his own salvation.

27. Yet the orthodox doctrine of the Reformed Churches concerning predestination neither removes the guilt of the fall from man, nor imputes it to God, nor establishes a necessity of the fall incompossible with the freedom of the one falling or fallen. Nor have those who oppose necessity in every way to freedom well-perceived the nature either of necessity or of freedom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>And this is a certain argument: All love is an act of the will. But faith is love: therefore it is an act of the will. The minor is proved: because true faith is that which credit in Deum, believes on God. But to believe on God is to love God. Augustine, on Ps. 130, This is to believe on Christ, to love Christ. On John, Tract 29, What is it to believe on God? By believing to love, etc.</p></blockquote>

</figure><figure class="quote" id="q-744915c510" data-kw="">
<blockquote><p>But now comes a greater question: If by justification our sins be forgiven us, what sins are forgiven I pray? sins past, or sins to come? We are taught that in the instant of justification all our sins past and to come are remitted; which is in my mind an unsound doctrine: for if we look narrowly into it, we shall find that in propriety of speech, remission of sins has relation to that which is past; it’s said therefore, Rom. 3:25: ‘Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past through the forbearance of God.’ And remission of sins has relation to those that are past, as appears by inevitable reason; for what is remission of sins, but sin covered? Now can a thing be covered before it be? ‘Blot out mine iniquities,’ etc. says David; can a thing be blotted out before it’s written? This is the thing [that] makes the Pope so ridiculous, that he will forgive sins for the time before they are committed; but what, do we get nothing for the time to come? Yes, yes, when the sin is past, by faith we have a new access unto God; and having risen by repentance, we get a new act, not of universal justification, but of a particular justification, from this and that particular sin. But if there be forgiveness of sins past already, and I know that I am justified, and my sins remitted: may I now pray for forgiveness of sins past? The Papists say it is active infidelity, and as absurd as to pray to God to create the world anew, or incarnate his Son again. But there is no conversion where there is no praying; and there is need of praying for the remission of sins past, and against sin for the time to come, as I shall show next time; as also consider whether there be any interruption of the act of justification by falling into great sins. There’s no man has a mind more against quirks and quillets than I; yet for the opening of these things, and staying and settling the mind, and clearing the understanding, give me leave the next time to clear these things unto you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 15th Sermon, on Rom. 5:1, pp. 402-3</span></figcaption>

</figure><figure class="quote" id="q-4ad73332b1" data-kw="">
<blockquote><p>With respect to the word juftification, we have already shown, I hope, that in the writings of St. Paul it signifies the action of God, as a judge, acquitting man, pronouncing him just, and conferring upon him the reward of eternal life. Concerning this there is no dispute… Faith then, to which justification is attributed by St. Paul, is not to be undertood as one single virtue, but denotes the whole condition of the gospel covenant, that is, comprehends in one word, all the works of Chriftian piety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-bull.html">George Bull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Harmonia Apostolica, or the Mutual Agreement of St. Paul &amp; St. James, comprising a Complete View of Christian Justification</cite>, … tr. Thomas Wilkinson (1669-1670; London: Rivington, 1801) 320 pp. ToC, p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

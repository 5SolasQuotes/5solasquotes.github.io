<blockquote><p>I have also no difficulty in conceding to you that there is nothing more perilous to our salvation than a distorted and perverse worship of God. The primary rudiments by which we are wont to train to piety those whom we wish to win as disciples to Christ, are these: not to frame any new worship of God for themselves at random and their own pleasure, but to know that the only legitimate worship is that which he himself approved from the beginning. For we maintain, what the sacred oracle declared, that obedience is more excellent than any sacrifice (1 Sam. 15:22). In short, we train them by every means to keep within the one rule of worship which they have received from his mouth, and bid farewell to all fictitious worship.</p></blockquote>

<blockquote><p>We see then how that the tithes which were contained in the law were especially for the people of Israel. And yet notwithstanding the tithes were very common amongst the Heathen, even for kings, princes and noblemen. We see likewise by profane histories, that they were also exacted, and that in some countries they exacted more than in other some… But be as be may, this word ‘Tithe’, or ‘Tenth’, has been a common and ordinary amongst all nations. And all Princes and great men as I have already said, sithens [since] the Gospel was received, have bestowed part of the tithes towards the maintenance of the Ministers of the word, as is very great reason, according to the saying of Saint Paul, “That they which ministered at the Altar in the old Testament were maintained, that they which at this day sacrifice unto God after a more excellent manner,” (1 Cor. 9:9-13) that is, which win souls unto Him, to make of them sacrifices unto his majesty, that they should also be as well provided for and maintained: and although God has not qualified how nor by what manner of revenue they should be maintained, yet is there a law for it. Now then, sith [since] God has been known through the preaching of the Gospel, a Christian order and law has been made for the giving and bestowing of one part of tithes [as opposed to other uses, such as giving to the poor, etc.]. And herein we may see the deceit of the Pope and of his shavelings [def: contemptuous epithet for a tonsured ecclesiastic, i.e. monk]: for, when they handle the law of tithes in their Canons, they take it as if it were transferred to them after that Jesus Christ had put an end unto the priesthood of Levi. All these are very leasings [lies], falsifying the holy scripture, and wickedly corrupting the same. For we see to the contrary, as has been before showed, that it is long ago sithence [since], that it was not known what the paying of tithes was by virtue of the law of Moses, and they were always paid either to the Emperor, or to some other particular great men. But now sith [since] the thing has been so ordained (so therein be no abuse, and to make men believe contrary to all truth, that it came from the holy scripture: but to be taken for a politic law). Let us hold that rule which Saint Paul sets down: to wit, “That we must not [muzzle] the mouth of the ox when he travels to feed us”: and therefore it stands with a far greater reason, that they which preach the doctrine of the gospel, ordained in so excellent an estate, should not be abridged and deprived of their maintenance, but be very well waged. Now as I have already said, when tithes and such like are bestowed unto a good use: we must not so straightly look into the matter, as to ask the cause of why it is so, as many fantastical fellows will, who at this day could be contented to turn the whole world upside down saying, O, it is no time now to pay tithes, for seeing the thing has been so long abused, it is no reason it should any longer continue. Then must we by their laying scrape out all: for they think that Christianity consists in changing the color of the sun and the moon. But if there be anything that is to be amended, as I have said, as if the Papists have brought in any false opinion, let that be utterly abolished. But in the meanwhile, let us hold unto all good ordinance: to wit, let the tithes and all such things that are for the maintenance of the poor, and the Ministers: let these things be reduced to their lawful use, and let not unsatiable wide gullets devour all. Let them not consume them upon their superfluities, in pomps, drunkeness, and other dissolutions: but let them know, that these are holy goods, which ought to be reserved for the use of the Church, as well for the maintenance of the poor as I have already said, as also for the feeding of those which serve God and his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Third Sermon of Melchisedech, wherein is treated of the use and right of tithes, and also of an oath’</cite>, pp. 64-68 on Gen. 14:20-24 in Sermons on Melchizedek &amp; Abraham, Justification, Faith &amp; Obedience (1592; rep. Old Paths Publications: 2000)</span></figcaption>

<blockquote><p>As for your [Gilbert Burnet’s] demand, why in your worship [that of the Scottish non-cponformists] do you not kiss one another with a holy kiss? Seing it is nowhere commanded in worship, as you seem boldly and ignorantly to suppose, and the Christian manner of the thing, in customary civility, is only recommended by the apostle, as an allay of chastity and kindnesse in civil rencounters, the question is but a petulant extravagancy of your vain imagination.</p></blockquote>

<blockquote><p>V. 2. …and keep the ordinances] By the word [Greek] in the original, which signifies traditions, he means… particular ordinances of comeliness, and good order, which belong to ecclesiastical policy, which afterward were called canons. … V. 10. power on her head] That is, a vail or covering, in token of her husband’s power and authority over her; or a kind of warrant or pass to go abroad with credit and honesty: for there was no necessity of vailing or covering their head within doors, but if they went abroad without their vail, they were counted light and wanderers, like unto run-away servants, or soldiers that have no passe to show from their masters or captains… because of the Angels] Some by the angels understand the pastors of the congregations, who are termed angels, Mal. 2:7 and Rev. 1:20, and that the apostle draws his reason to enforce women’s modest carriage from the reverend respect the women ought to show, especially in the Church, to these angels of the Churches. Others take angels here in the proper sense for the coelestial spirits, which always attend upon Christ their Head, and are present in the congregation of the faithful, and are offended at all disorders and uncomeliness which may be used there… … V. 16. if any man seem to be contentious, we have no such custom] Either the meaning is, We have no such custom for women to pray uncovered; or, we have no such custom or the Churches of God to contend about matters of this nature, but willingly and cheerful to obey those that have the oversight of us in the Lord.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“V. 2. …and keep the ordinances] By the word [Greek] in the original, which signifies traditions, he means… particular ordinances of comeliness, and good order, which belong to ecclesiastical policy, which afterward were called canons. … V. 10. power on her head] That is, a vail or covering, in token of her husband’s power and authority over her; or a kind of warrant or pass to go abroad with credit and honesty: for there was no necessity of vailing or covering their head within doors, but if they went abroad without their vail, they were counted light and wanderers, like unto run-away servants, or soldiers that have no passe to show from their masters or captains… because of the Angels] Some by the angels understand the pastors of the congregations, who are termed angels, Mal. 2:7 and Rev. 1:20, and that the apostle draws his reason to enforce women’s modest carriage from the reverend respect the women ought to show, especially in the Church, to these angels of the Churches. Others take angels here in the proper sense for the coelestial spirits, which always attend upon Christ their Head, and are present in the congregation of the faithful, and are offended at all disorders and uncomeliness which may be used there… … V. 16. if any man seem to be contentious, we have no such custom] Either the meaning is, We have no such custom for women to pray uncovered; or, we have no such custom or the Churches of God to contend about matters of this nature, but willingly and cheerful to obey those that have the oversight of us in the Lord.”

— Daniel Featley, The English Annotations (1645) on 1 Cor. 11 Featley wrote the comments on Paul’s epistles, and was an episcopalian, Westminster divine. This work was often known as The Westminster Annotations as 6 of the 11 contributors were Westminster divines.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+2.+%E2%80%A6and+keep+the+ordinances%5D+By+the+word+%5BGreek%5D+in+the+original%2C+which+signifies+traditions%2C+he+means%E2%80%A6+particular+ordinances+of+comeliness%2C+and+good+order%2C+which+belong+to+ecclesiastical+policy%2C+which+afterward+were+called+canons.+%E2%80%A6+V.+10.+power+on+her+head%5D+That+is%2C+a+vail+or+covering%2C+in+token+of+her+husband%E2%80%99s+power+and+authority+over+her%3B+or+a+kind+of+warrant+or+pass+to+go+abroad+with+credit+and+honesty%3A+for+there+was+no+necessity+of+vailing+or+covering+their+head+within+doors%2C+but+if+they+went+abroad+without+their+vail%2C+they+were+counted+light+and+wanderers%2C+like+unto+run-away+servants%2C+or+soldiers+that+have+no+passe+to+show+from+their+masters+or+captains%E2%80%A6+because+of+the+Angels%5D+Some+by+the+angels+understand+the+pastors+of+the+congregations%2C+who+are+termed+angels%2C+Mal.+2%3A7+and+Rev.+1%3A20%2C+and+that+the+apostle+draws+his+reason+to+enforce+women%E2%80%99s+modest+carriage+from+the+reverend+respect+the+women+ought+to+show%2C+especially+in+the+Church%2C+to+these+angels+of+the+Churches.+Others+take+angels+here+in+the+proper+sense+for+the+coelestial+spirits%2C+which+always+attend+upon+Christ+their+Head%2C+and+are+present+in+the+congregation+of+the+faithful%2C+and+are+offended+at+all+disorders+and+uncomeliness+which+may+be+used+there%E2%80%A6+%E2%80%A6+V.+16.+if+any+man+seem+to+be+contentious%2C+we+have+no+such+custom%5D+Either+the+meaning+is%2C+We+have+no+such+custom+for+women+to+pray+uncovered%3B+or%2C+we+have+no+such+custom+or+the+Churches+of+God+to+contend+about+matters+of+this+nature%2C+but+willingly+and+cheerful+to+obey+those+that+have+the+ov

<blockquote><p>Now there are two sorts of men especially, who may help, and who ought to help to swallow up and suppress the present flood of heresies and blasphemies.

1. You (Right Honourable!) and the rest who are Christian Magistrates. It was but the scornful speech of Tiberius, that the gods alone must remedy the injuries offered unto them: O no! you are custodes utriusque tabulae: you are designed to be Nursing Fathers: you have received the sword to be a terror to the devil. Pious and learned Amesius [William Ames], speaking to that question, Whether Heretiques are to be punished by the Civil Magistrate? Answers thus, Magistratus locus &amp; officiū postulat ut reprimat improbos turbatores gladio, vel potestate publica &amp; externa si opus fuerit: [“The position and duty of the magistrate demands that he repress shameless disturbers with the sword, or by public external power if there is need.”]

It is his place and duty to repress them, and restrain them, if they be noxious and turbulent: yea, and he adds more then every one will be patient to hear: namely, that if also they be manifestly blasphemous and pertinacious, they may be cut off supplicio capitali: according to that in Levit. 24. 15, 16. But I will not fall upon the discussion of that at this time: all that I would humbly suggest unto you, is this, That you may help against this dangerous flood 9. ways.

1. By a peremptory abhorring, and crushing of that flood-begetting maxim, viz. a Catholic liberty and toleration of all opinions: There was a Religion (as one once spake before you) omnium Deorum, of all God’s amongst the old Romans: and there is a Religion omnium Sanctorū, of all Saints now amongst the Papists: and if the Serpent could but wriggle in a Religion omnium opinionum, of all opinions amongst the English, he needs to desire no more: If men can step from one Religion to all, they will soon fall from all Religion to none.

2. By a public declaration against all heresies and blasphemies, known to be spoken and printed; When Ostorodius and Vaidovius started out their Socinian Heterodoxies in the Low-Countries, the States General packed away those seducers with exile, and publicly condemned and committed their pestiferous books to the fire.

3. By making some standing Laws against such opinions, which can be proved to be heretical and blasphemous; Serviunt reges terrae Christo (saith one) etiam leges ferendo pro Christo.

4. By setting up your Church-Discipline with full power, that so it may reach these heresies and blasphemies, which (if any sins) then they do plainly fall within the Verge of it: If the discipline were fully and generally established, you should not have an heresy or blasphemy, or any erroneous opinion creeping out in any part of the Kingdom, but there would be a timely discovery of it, and likewise a spiritual remedy to recovering persons, and to prevent their further spreading.

5. By encouraging and heartening the godly, orthodox painful Ministers of the Gospel, in their assertings and vindicatings of the truths of Christ: and in their oppugning of wicked, dangerous and damnable opinions: Not suffering (therefore) to be snubbed, abused, reviled, scorned, slandered, disturbed, hazarded, because they do oppose the adversaries of truth, and those Serpents which do cast out floods amongst us: why should the Shepherd be discouraged, because he keeps off Wolves from the sheep? or any man bee checked, because he would quench the flying fire?

6. By using your prudent Authority, in a timely causing to be sent forth faithful and able Ministers, such as are thoroughly tried, and well approved to be sound in the faith, and skilful to convince gain-sayers and seducers; The more you help truth, and the servants of truth, the more help do you therein contribute against errors, and the enemies of truth: No better help against darkness, then light.

7. By a tender and watchful eye unto the Universities, one of which is lately fallen into your possession: take care it may not fall into the possession of any seducers: you have heard (I doubt not) of a late Disputation in Oxford; where some body undertook to maintain (besides in private) divers strange and dangerous opinions in public; I humbly entreat you to take care, that the Serpent gets not in his body, before there be any planted to bruise his head: Truth by right is the first-born, and should first inherit: do not put the truth to play an after game with error; Other Garrisons, if lost, may easily be reduced: but that which is surprised fast by error, is not so easily recovered.

8. By enjoining a solemn day of Humiliation through all the Land, for the dishonours redounding to God, and Christ, and the Truth, by the present errors, heresies, blasphemies; You did so lately for the floods of rain which endangered the Corn: O that it might seem good unto you so to do, for the flood of errors which endanger souls! This humble request I presume to leave with your pious zeal and prudence.

9. By using your Coercive power with such methods and proportions [sic] the real safety of truth and souls doth require, and the repression of dangerous errors doth need: So managing the distributions thereof, that under the notion of restraining heresy, you by no means injure real sanctity, nor yet under the pretence of sanctity, you do not favour the growth of heresy: O what an happy people are they, amongst whom errors are losing, and truths are graining! where piety thrives, and wickedness blasts! where all who are good can join against all that is evil, and in lesser things, whereas yet they cannot (through weakness) clasp opinions; yet (for the truth and peace’s sake) can clasp hearts and hands to promote God’s glory, and the common salvation of souls!</p></blockquote>

<blockquote><p>[T]he [New Testament] dispensation would not come to a close till the religion of Messiah the Prince should be legally established in every nation under heaven, and till rulers and nations as such, should “kiss the Son,” and bow down under the sceptre of his power. Inspired prophecy foretels [sic] that “kings should be nursing fathers, and their queens nursing mothers” to the Church; that rulers shall bring their “glory and riches to Zion;” and that the “isles” shall submissively “wait for the Saviour’s law.” The Spirit of the Lord commands kings to be “wise and kiss the Son,” and expressly intimates that the command shall be, one day, universally obeyed. When Ethiopia shall stretch out her hands to God, “mighty princes shall come out of Egypt” to Mount Zion; the “saints of the Most High God shall take the kingdom, and possess it,” and the “kingdoms of this world” shall become “the kingdoms of our Lord and of his Christ.”

These declarations are sufficient to set aside all the vain reasonings of men of corrupt minds on this matter. In their plain and unsophisticated meaning, they do, beyond all question, warrant the opinion, that civil rulers have to do with the Church of Christ – are bound to cherish and support her, and act under a solemn responsibility to employ their influence and authority to promote her peace and prosperity. And, they, furthermore, as the voice of the Lord, assure us that the faithful witnesses of the Lamb, having regard to their Master’s honour, should in every age assert this part of his prerogative.</p></blockquote>

</figure><figure class="quote" id="q-d62591d9b1" data-kw="">
<blockquote><p>Since these principles which were demonstrated above concerning the origin of kings and other rulers have been established, it follows that they are not legitimate rulers who by force or deceit usurp that authority which by no right belongs to them. Of such tyrants there are two kinds: for some, in violation of the laws laid down and received, usurp tyranny over their fellow-citizens, as Julius Caesar under the feigned title of perpetual dictator took possession of the Roman commonwealth; and many other tyrants, particularly in Greece, crushed the liberty of their country.

Others however, not content with that absolute power which they rightfully acquire over their own people, extend their dominions at the cost of their neighbours’ liberty and increase them by means of fortified boundary-lines; for this reason have monarchies ever since the origin of the world achieved such wide dominions; of this the sacred writings offers us an example in Nimrod, as we also see that in this way the Israelites were generally oppressed by the neighbouring peoples.

Hence since those tyrants had no lawful right over the people of God, I maintain that the Israelites were free not merely to disobey the sinful commands of these peoples but even to set a just defense against their unjust violence, and that therefore the leaders of the tribes (of Israel) did a grievous wrong whenever they omitted to oppose the foreign foe with united courage and strength in defense of the liberty of their country, provided that the occasion for opposing him presented itself; for it admits of no doubt that even private individuals are bound by the law of both God and men to succour with all their power their country when oppressed and in distress, especially however when its religion and liberty are simultaneously endangered. For it was a true remark which the captive pirate dared to utter when he was dragged before Alexander; he declared that he differed in no way from (the king) but that the latter plundered the world with a multitude of ships whereas he did so with but a single vessel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), pp 110-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-5927571414" data-kw="">
<blockquote><p>Every person is engaged in his place and capacity to appear against vice, and to endeavor the extirpation of it; but here the Magistrate in a special manner is concerned, who is to see that all infected persons be shut up. The leper under the Law was to dwell alone without the camp, that he might not converse with those that were whole: now I have told you, that sin is the worst of plagues and leprosies. You therefore that are in public places and offices are to set a watch over notorious sinners, that they go not abroad to infect others: if they break out, you may shoot at them; if sinners will be bold and daring, you are bound to unsheath the sword of justice and strike at them; as indeed there are a sort of hardened sinners that stare justice in the face, and say she is blind, and laugh at her sword, and make their brag that they never felt the edge of it. Here you will do well to make them experience how sharp it is; that others too, beholding the punishment inflicted on them, may not presume to glory in their shame.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1a09d03e1c" data-kw="">
<blockquote><p>This fact of David [eating the showbread under natural and moral necessity] was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646) | Appendix, pp. 81-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-30a86616dc" data-kw="">
<blockquote><p>…yet in formal terms, they [the congregationalists] do deny the most gracious of their brethren to live beside them in New-England in the presbyterial way of the old non-conformists: yea, in print they avow that whoever refuses their tenet of Independency, were they otherwise never so orthodox and pious, they ought not to be admitted to the sacraments, nor enjoy any church privileges: as people who cannot be wholly, but at most are in part only converted: Yea, as such who must be taken for antichristian spirits, for enemies to Christ and his kingdom: Neither have I heard that any of them now for many years have either celebrated to others or received themselves the sacraments in any English church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), p. 105</span></figcaption>

</figure><figure class="quote" id="q-bccd173bb7" data-kw="">
<blockquote><p>The personal union also occurred ‘without division (adiairetos) and without separation (achoristos)’, in such a way that the one nature is not actually divided or segregated from the other (for at no time or place, not even in death, does He lose what once He had taken up and joined to Himself). But both natures forever remain so united in the person…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 25, ‘On the Incarnation of the Son of God &amp; the Personal Union of the Two Natures in Christ’ in Synopsis Puris Theologiae, Synopsis of Pure Theology: Latin Text &amp; English Translation</cite>, ed. Henk van den Belt, trans. Riemer A. Faber (1625; Leiden: Brill, 2016), vol. 2, pp. 81-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

— Anthony Thysius, Disputation 25, ‘On the Incarnation of the Son of God &amp; the Personal Union of the Two Natures in Christ’ in Synopsis Puris Theologiae, Synopsis of Pure Theology: Latin Text &amp; English Translation ed. Henk van den Belt, trans. Riemer A. Faber (1625; Leiden: Brill, 2016), vol. 2, pp. 81-83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+personal+union+also+occurred+%E2%80%98without+division+%28adiairetos%29+and+without+separation+%28achoristos%29%E2%80%99%2C+in+such+a+way+that+the+one+nature+is+not+actually+divided+or+segregated+from+the+other+%28for+at+no+time+or+place%2C+not+even+in+death%2C+does+He+lose+what+once+He+had+taken+up+and+joined+to+Himself%29.+But+both+natures+forever+remain+so+united+in+the+person%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Anthony+Thysius%2C+Disputation+25%2C+%E2%80%98On+the+Incarnation+of+the+Son+of+God+%26+the+Personal+Union+of+the+Two+Natures+in+Christ%E2%80%99+in+Synopsis+Puris+Theologiae%2C+Synopsis+of+Pure+Theology%3A+Latin+Text+%26+English+Translation+ed.+Henk+van+den+Belt%2C+trans.+Riemer+A.+Faber+%281625%3B+Leiden%3A+Brill%2C+2016%29%2C+vol.+2%2C+pp.+81-83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbccd173bb7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bccd173bb7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/#:~:text=The%20personal%20union%20also%20occurred%20%E2%80%98without,remain%20so%20united%20in%20the%20person&amp;text=The%20personal%20union%20also%20occurred%20%E2%80%98without%20division%20%28adiairetos&amp;text=natures%20forever%20remain%20so%20united%20in%20the%20person" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-181b24d352" data-kw="">
<blockquote><p>Question 9 [to objectors]: Should we not in doubtful cases take the safer side? And is it not safer to do as Christ and his apostles and his Church for many hundred years did, than to follow the novelties of later times? Is it not certain that where there is no law, there is no transgression? and I know of no law binding us to receive kneeling: therefore for my part I cannot fear that Christ will condemn me for following his own, his apostles’ and his Church’s example, when he never gave me a word to the contrary. Objection: If Christ’s example bind to sit, then you must also imitate Him in doing it in an upper room, and but to twelve, etc. Answer: 1. This objection is nothing to our question. For we be not affirming that sitting is necessary, but that it is certainly lawful, and that kneeling is not such a duty, as that men should refuse communion with a church for want of it. 2. Both the known reasons of the thing, and the after practices of the Church do assure us that Christ’s administering in an upper room, and but to twelve, and not to women, were all occasional and mutable; and the Churches did otherwise: But for a feasting gesture there is no such proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 91-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-8eb3be1fc7" data-kw="">
<blockquote><p>This sacrament, therefore, consists in the rite and the promise annexed to it, or in the signs and the things signified. The rite, or signs are the bread which is broken and eaten, and the wine which is poured out, and drunk. The things signified are the broken body, and shed blood of Christ, which are eaten and drunk, or our union with Christ by faith, by which we are made partakers of Christ and all his benefits, so that we derive from him everlasting life, as the branches draw their life from the vine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, (P&amp;R), pp. 378 &amp; 385</span></figcaption>

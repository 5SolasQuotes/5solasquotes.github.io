<main class="wrap"><figure class="quote" id="q-898d6eb1b3" data-kw="">
<blockquote><p>I very much question whether the whole history of human improvement can furnish the outline of an educational system, at once so comprehensive, so simple, and so much in advance of the age in which it was drawn up; and certainly, there is nothing which more strikingly shows what a heaven-wide difference there is between the genius of Protestantism and Popery. That men, who had themselves been taught to consider ‘ignorance as the mother of devotion,’ should all at once have such enlargement of views, in regard to education, as soon as the light of reformation dawned upon their minds, and that they should find time to mature so wise a plan, while they were obliged to dispute every inch of ground with the enemy, and while, as yet, the conflict between light and darkness hung in such awful suspense,—is truly wonderful. It would almost seem as if there must have been something supernatural in the illumination which guided them; for they could have derived but little assistance from the most enlightened nations, whether ancient or modern; and to this very day, no material improvement has been made upon their system. If we did not know that our Puritan forefathers brought it along with them to New-England, the similarity is so striking, that no one could doubt the Scottish origin, and the Prussian system of popular education, the most perfect and efficient, probably, which the world ever saw, is manifestly indebted to the same source for all its essential elements.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian.html">Reformed Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterian</cite>, Dec. 1837, pp 305-06</span></figcaption>

</figure><figure class="quote" id="q-0e31d655df" data-kw="">
<blockquote><p>Other two questions here are shortly to be discussed, as belonging to this purpose, as:

1. Whether discipline be a mark of the visible Church? Mr. [John] Robinson says [that] the power of censures is simply necessary for the being of the Church; sundry of our divines affirm it is. So the learned professors of Leiden, and Ursinus with Pareus. Great Junius says [that] it is a note belonging to the Church’s order, ad decorum; the [Lutheran] Augsburg Confession leaves it out from amongst the notes, and so does Calvin and Whittaker, making two notes only: Word and sacraments. Learned Beza makes only the preaching of the Word a note, not excluding the other two. I think distinctions may help the matter:

1. There is a power of discipline, and there is a care thereof. True Churches have a power given them of Christ, and this Robinson proves, and no more; yet the care to exercise the power may be wanting [lacking] in a true Church. 2nd Distinction: Right discipline is not necessary for the essence of a visible Church: [1.] All our divines condemn Anabaptists and Pelagians, who plead that righteous men only, and such societies as have right discipline, to be true Churches.

2. Novatians and Donatists came near to them in this also, as we may see in Augustine. So Richard Field, Parker [and] Cartwright make it necessary to the well-being of the Church:

1. Because it is not indifferent.

2. Because it is commanded in God’s Word.

3. Discipline in the substantial points is immutable.

4. It is necessary in respect of the end. And all this the learned Parker demonstrates to be true. But it is not necessary simply to the being of it: as a city may be without walls, a garden without an hedge. 3rd Distinction: The power and right to discipline is a propriety essential to the Church, and is not removed from it till God remove the candlestick and the Church cease to be a visible Church; but the exercise may be wanting and the Church a true visible Church, from which we are not to separate. 4th. Discipline is a necessary note and inseparable from a visible Church, whole, entire and not lame and imperfect. But a Church may retain the essence and being of a visible Church, and yet have no discipline in actual use, or little; and though want of discipline do leaven a Church, yet it does not (as Robinson says) evert the nature thereof and turn it into Babylon and a den of dragons. Robinson will have profaneness and impiety, by absolute necessity, rooted out by discipline; but he is too hasty. Nay, not by public preaching of a sent pastor through absolute [necessity], but only through ordinary and conditional necessity. You bind the Almighty too hard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), ch. 9, section 9, pp. 287-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-ed97c098ff" data-kw="">
<blockquote><p>Although Baillie was fundamentally disenchanted with episcopacy after years of religious upheaval for which he blamed the Laudian episcopate, he had not abandoned the argument that a temporary episcopate could effectively restore unity to a fragmented and church. It was Baillie’s overriding desire for a return to peace and normalcy that led him not to contest publicly Charles II’s reestablishment of episcopacy but this did not preclude Baillie from exhorting leading nobles and the new archbishop of Glasgow privately. Ironically, this suggests that one of the explanations for the widespread conformity to the Erastian settlement of the post-restoration kirk may be found through analysis of the writings of one of the most strident proponents of a jure divino presbyterian polity. Such a conclusion cases mid-century presbyterians in more moderate light than has hitherto been the case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 34</span></figcaption>

med Books Online</a></div>
</figure><figure class="quote" id="q-a031b28189" data-kw="">
<blockquote><p>Thomas Cartwright, the early Presbyterian Puritan, helps us to understand how to apply the judicial laws of the Old Testament today. The moral-judicials (i.e. punishment of idolaters) simply apply today, as they are natural laws that cannot expire and thus bind all men everywhere (cf. Westminster Confession 19:5). The moral-positive judicials do not literally apply: only the general equity of these judicials is still valid, while the positivistic aspect has expired (cf. WCF 19:4). Below, Cartwright explains the Presbyterian position in distinction to the Prelatic antagonism to the Mosaic judicials:

And as for the judicial law, for as much as there are some of them made in regard of the region where they were given, and of the people to whom they were given, the Prince and the Magistrate keeping the substance and equity of them (as it were the marrow) may change the circumstances of them, as the times, and places, and manners of the people shall require. But to say that any magistrate can save the life of blasphemers, contemptuous and stubborn idolaters, murderers, adulterers, incestuous persons, and such like, which God by his judicial law hath commanded to be put to death, I utterly deny, and am ready to prove, if that pertained to this question. And therefore although the judicial laws are permitted to the discretion of the prince and magistrate, yet not so generally as you seem to affirm, and as I have oftentimes said, that not only must it not be done against the word, but according to the word and by it.</p></blockquote>

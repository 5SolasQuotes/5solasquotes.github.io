<main class="wrap"><figure class="quote" id="q-99c6a105ab" data-kw="">
<blockquote><p>The Limbus Patrum. The Latin word limbus (fringe) was used in the Middle Ages to denote two places on the fringe or outskirts of hell, namely, the Limbus Patrum and the Limbus Infantum. The former is the place where, according to the teachings of Rome, the souls of the Old Testament saints were detained in a state of expectation until the Lord’s resurrection from the dead. After His death on the cross Christ is supposed to have descended into the abode of the fathers, to release them from their temporary confinement and to carry them in triumph to heaven. This is the Roman Catholic interpretation of Christ’s descent into hades. Hades is regarded as the dwelling place of the departed spirits, having two divisions, one for the righteous and one for the wicked. The division inhabited by the spirits of the righteous was the Limbus Patrum, known to the Jews as Abraham’s bosom, Luke 16:23, and paradise, Luke 23:43. It is maintained that heaven was not open to any man until Christ had actually made propitiation for the sin of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Wm. B. Eerdmans Publishing Co., 1938), 687.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05565fda67" data-kw="">
<blockquote><p>Life eternal is the highest degree of blessedness, in which we shall be made partakers of Christ’s glory, enjoying the sight of God, and heavenly joys forever and ever. The Rules: …

III. That eternal happiness consists in our freedom from all evil; in the variety, magnitude and eternity of joys…

IV. The variety of joys, is considered in the glorification of man, in the delights of heavenly mansions, in the blessed society of the saints, but chiefly in the union with God… … II. There shall be such a communion with God, that we shall see Him without end, love Him without tediousness, and praise Him without wearisomeness…

XII. So great shall be that joy, that neither our tongues can express it, nor our minds conceive it…

XIII. Neither shall any bounds be set to this happiness, nor shall we ever fall from it, but it shall continue forever…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (London, 1626), bk. 1, ch. 36, ‘Of the End of the World…’, pp. 305-8</span></figcaption>

</figure><figure class="quote" id="q-60b48f7971" data-kw="">
<blockquote><p>Believers shall be adjudged to everlasting life on account of Christ’s fulfillment of the law in their stead…and their sentence will correspond with the nature, though not with the merit of their gracious qualities and works, particularly their kindness to poor saints, which shall be publicly mentioned as a mark of their union with Christ, filial relation to God, gracious heirship and diligent seeking of his heavenly kingdom…. But, whether their sins will be publicly mentioned in the last judgment, is not so evident. On the one hand, None of their sins are mentioned in the judicial procedure…. God casts all their sins behind his back, into the depths of the sea, and remembers them no more…. Christ, their judge, being also their propitiation and advocate, would not mention their sins…. The public mention of their sins could not but affect them with shame; and could not consist with his presenting them without wrinkle… But on the other hand, Every work of men, whether good or bad, is represented as brought into judgment…. God’s justice seems to require, that both sides of a cause should be produced and heard…. Many of their sins are publicly marked in Scripture. By the public mentioning of their sins, the justifying virtue of Christ’s blood will be illustriously manifested…. Many of their sins are so connected with those of the wicked, that the one cannot be publicly mentioned without the other. The belief of such public manifestation of their sins may be of great use to render them circumspect in this life. Such public mention of their sins could not then affect them with disagreeable shame and confusion, as it is not their innocence, but Jesus and his righteousness, which are their comfort and glory….</p></blockquote>

</figure><figure class="quote" id="q-e12381ac27" data-kw="degrees of glory">
<blockquote><p>Will there be degrees of glory? And will the glory in heaven be equal or unequal and unlike? The Romanists assert the inequality of glory from the inequality of merits which they are accustomed to place under it as a foundation. Among the orthodox the question is problematic; yet the more common opinion asserts degrees of glory without founding them upon merit of works, but upon the free gift of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d3bbb51ec1" data-kw="">
<blockquote><p>…For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays (South End, IN: St. Augustine’s Press, 2015), ch. 16, ‘In Defense of the Perverted Faculty Argument’</cite>, pp. 385-86</span></figcaption>

<blockquote><p>Howbeit I think it not amiss to declare those ways and means which I have observed amongst the ecclestical writers [touching the propagation of original sin]: whose opinions touching this matter are four in number: The first is of those which thought that we receive of our parents the souls together with the bodies, that even as God by human seed creates the body, so also of the same creates He the soul… Whose arguments… I judge indeed probable: but yet not of necessity… [The second view is not labeled and might be another form of traducianism.] The third way is that God therfore creates the soul with such a sin or defect, for that it shall be the soul of a man now damned, and set under the curse. Such a soul say they, God creates as is required to such a man… this fond device is of every man rejected: lest we should seem to make God absolutely the author of sins. The fourth maner is by the consents of many men received, and seems very likely to be true: namely, that the soul is not created with some [sin], but straightway draws unto it sin so soon as ever it is adjoined unto the body derived from Adam…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Rom. 5:12, pp. 110-11 in Most Learned &amp; Fruitful Commentaries of Dr. Peter Martyr Vermilius... (d. 1562; London: 1568), Commentary on Romans, ch. 5</cite>, p. 111</span></figcaption>

%20not%20amiss,unto%20the%20body%20derived%20from%20Adam%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Human acts are the acts of the will directed by reason. They are either elicited, that is, produced by the will itself, or commanded, that is, produced by some other faculty under the influence of the will. Elicited acts are concerned either with the end or with the means. Three acts are concerned with the end: a) simple velleity, not yet efficacious; b) efficacious intention of the end; c) joy in the end attained. Two acts are concerned with means: a) consent, which accepts means; b) choice of a determined set of means. Each of these five acts of the will is preceded by a directive act of the intellect. Simple velleity, by the knowledge of the good in question; intention, by a judgment that this end should be attained; consent, by counsel; choice, by the last practical judgment which terminates deliberation. After voluntary choice there follows, in the intellect, the act called imperium, which directs the execution of the means chosen, ascending from lower means to those higher and nearer to the end to be obtained, in order inverse to that of intention, which descends from the desired end to the means which come first in execution. After the intellect’s imperium there follows in the will the act called active use, which sets the other faculties to work. These acts of the other faculties, called passive use, are, properly speaking, commanded acts of the will. And the will’s last act is that of joy in the possession of the end obtained. The end, which was first in the order of intention, is the last in the order of execution. … By the term ‘interior’ act St. Thomas often means an act which does not arise from a previous act, the first act, for example, of willing an end. By opposition, then, ‘exterior act’ often means not only the act of the corporeal members, but also an act of the will itself, if this act arises from a preceding act, as when, for example, we will the means because we already will the end. Here we must remark, further, that a human act, voluntary and free, is not necessarily preceded, if we speak precisely, by a discursive deliberation, but may be the fruit of a special inspiration, superior to human deliberation. But, even here, the act is free… because the will consents to follow the inspiration. Here lies the difference between the virtue of prudence, which presupposes discursive deliberation, and the gifts which make man prompt and docile to the inspirations of the Holy Ghost. These latter acts, free but not in the proper sense deliberate [deliberative], are the fruit, as we shall see later, not of co-operating grace, but of operating grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought (St. Louis: Herder, 1950), ch. 46, ‘Human Acts’, pp. 278-80 Lagrange was a Neo-Thomist.</cite></span></figcaption>

<blockquote><p>The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… Traditionally, the act of entertaining a concept is known as simple apprehension; the act of affirming or denying the truth of a proposition is known as judgment; and the act of inferring a proposition from other propositions is known as reasoning. Simple apprehension, judgment, and reasoning are the intellect’s basic operations. Being rational or capable of thought is essentially a matter of having the capacity for these operations of the intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024), ch. 3, ‘The Intellect’</cite>, p. 64</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… Traditionally, the act of entertaining a concept is known as simple apprehension; the act of affirming or denying the truth of a proposition is known as judgment; and the act of inferring a proposition from other propositions is known as reasoning. Simple apprehension, judgment, and reasoning are the intellect’s basic operations. Being rational or capable of thought is essentially a matter of having the capacity for these operations of the intellect.”

<blockquote><p>Definition [of Ontological Goodness] Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty or the will. Just as the former consists in the knowability of being, so the latter consists in being’s appetibility. Hence it is defined as the property of being whereby it is made appetible or willable or, more briefly, it is appetibility or willability. On other interpretations of ontological goodness see what I wrote elsewhere (Wolter, Transcendentals, p.199 ff.). On the Convertibility of Ontological Goodness Conclusion 29: Every being is good, or being and good convert. The appetite or will tends to its object either because the object is perfect for it, namely insofar as it has the being-ness and perfection due to it (love of benevolence), or because the object confers perfection on another (love of concupiscence). As far as God is concerned, it is plain that he is altogether perfect and so supremely appetible both to himself and to another. As far as creatures are concerned, one must say that they are truly loved or willed by God himself, otherwise they would not exist; therefore they are lovable or willable. Further, creatures are also good for other creatures; for example substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>

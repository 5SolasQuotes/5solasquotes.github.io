<blockquote><p>What is divinely willed, as regards his antecedent will, is known to us from the natural inclination itself. But what is willed by the consequent will he makes known to us either through a revelation or through his activity.</p></blockquote>

<blockquote><p>2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion (1560; London, 1563), The Tenth Precept</cite>, fol. 103.a – 104.a</span></figcaption>

</figure><figure class="quote" id="q-ec3ab1befd" data-kw="">
<blockquote><p>§6. The reasons of this are obvious and clear. Even because it is the office of the governors to determine of such circumstances: It is the pastor’s office to guide and oversee the flock. And so the determining of time and place of worship (that’s undetermined) belongs to his office: and the choice of the subject on which he shall preach, the leading them in prayer and praise, and choice of versions, translations and other ordinary helps in his work. And therefore when he determines these, he is but in his own way and does but his own work: and therefore he is therein the judge, if the case be controvertible. If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied. We are sure that God has commanded us to obey them that are over us in the Lord (1 Thess. 5:12; Heb. 13:7, 17, etc.), and therefore a certain duty may not be forborn upon uncertain conjectures, or upon every miscarriage in them that we owe it to. This would unchurch all Churches (as they are political societies). For if pastors be taken down, and the work of pastors, the Church is taken down; and if government and obedience be taken down, then pastors and their work is taken down, which will be the fruit of this disorder.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations on Church Government &amp; Worship (London, 1659) | ch. 12, ‘It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded’</cite>, pp. 461-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>…He is a visible Head in this sense, in that he reigns and rules, even in the external visible policy of his Church, through all the catholic, visible Church, in his officers, lawful synods, ordinances, giving them laws in all positive externals… I shall believe that Christ must in all positive things of external policy, give to them particular laws in the Scripture and rule them [civil magistrates in his Church]; and that they being members, not the Head, must as particularly be ruled in all externals-positive, by the will and Law of the Head Christ… 2. The positives of the policy of Christ’s house must be congruous to a supernatural end, the edification of souls…</p></blockquote>

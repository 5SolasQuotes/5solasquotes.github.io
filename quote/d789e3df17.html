<main class="wrap"><figure class="quote" id="q-d789e3df17" data-kw="">
<blockquote><p>If any should wrangle for the expressions that are used by Divines in this Mystery; we confess that many of the Schoolmen have exceeded, and have taken too much liberty in this wonderful Mystery; yet, it is the thing that we especially should be established into, and from Scripture that is clear, that there is but One God, and yet Three, who being denominated in the concrete, must imply three different real Relations, or Subsistences, or Persons: and this Essence being infinite and communicable, there is no warrant to bound it to the rules and properties of created beings, who are but finite; and in that respect also incommunicable:

And we conceive that the names here given (and elsewhere in Scripture) will amount clearly to the equivalent of Essence and Persons, which are most obviously made use of in this matter: for, what is that, I am Alpha and Omega, who was, is, and is to come, but that same, Exod. 3. I AM THAT I AM, which denoteth His Being or Essence, as that which is ever a Being: and Idols, being differenced from the true. God by this, that they are by Nature no gods, Gal. 4.8. it implies on the contrary, that by Nature He is God, and so God in respect of His Essence: and therefore that God may be essentially considered, and in that respect of His Essence.

Again, these expressions, that the one is called the Father, and the other the Son, and yet both One God, do clearly hold forth that there are real relations in that Godhead, subsisting in a distinct manner; and so there must be Persons, as Heb. 1. the Son, is called the express Image of the Father’s Person, which plainly says, that the Father, considered as distinguished from the Son, is a Person, and subsists; and that the Son, as distinguished from the Father, and as so lively and expressly representing His Person, must be a Person also, having this from the Father: and what is said of the Father and Son, must also be true of the holy Ghost, who is God equal with both, yet different from Them both, as They differ from each other, though not in respect of that same incommunicable property, yet he who proceedeth, must differ from those from whom he proceeds, as he who is begotten, must differ from him that begat him.

For Their operations, we may find here, that in some things They concur jointly, yet some way differently. Some things again are attributed to one, which cannot be to another, as their personal properties; the Son is begotten, and not the Father or the Spirit: therefore He is allanerly [only] the Son: the Father begets; and the Spirit proceeds. These are called Their personal properties, and Their works ad intra, or amongst, or in reference to Themselves: of this kind is the incarnation of the Son, which can neither be said of the Father, nor of the holy Ghost.

Again, in things ad extra, or that relate to the Creatures simply, whether in making, or governing of the World, They jointly concur: the Father createth all, so doth the Son and holy Ghost; the Son, from the Father, by the holy Ghost; the holy Ghost, from the Father and the Son, as those expressions of God, sending His Son, the Son’s sending the Spirit from the Father, &amp;c. do declare, Joh. 14.26. and 16.7. Gal. 4.6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), pp 7-8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7b0b8747b" data-kw="">
<blockquote><p>There are, indeed, very many other things that are taught and disputed about this doctrine of the Trinity, as: the manner of the eternal generation of the Son, of the essence of the Father, of the rocession of the Holy Ghost, and the difference of it from the generation of the Son, of the mutual in-being of the persons, by reason of their unity in the same substance or essence, the nature of their personal subsistence, with respect unto the properties whereby they are mutually distinguished; all which are true and defensible against all the sophisms of the adversaries of this truth. Yet, because the distinct apprehension of them, and their accurate expression, is not necessary unto faith, as it is our guide and principle in and unto religious worship and obedience, they need not here be insisted on. Nor are those brief explications themselves before mentioned so proposed as to be placed immediately in the same rank or order with the original revelations before insisted on, but only are pressed as proper expressions of what is revealed, to increase our light and farther our edification. And although they cannot rationally be opposed or denied, nor ever were by any, but such as deny and oppose the things themselves as revealed, yet they that do so deny or oppose them, are to be required positively, in the first place, to deny or disapprove the oneness of the Deity, or to prove that the Father, or Son, or Holy Ghost, in particular, are not God, before they be allowed to speak one word against the manner of the explication of the truth concerning them. For either they grant the revelation declared and contended for, or they do not. If they do, let that concession be first laid down, namely that the Father, Son, and Spirit, are one God; and then let it be debated, whether they are one in substance and three in persons, or how else the matter is to be stated. If they deny it, it is a plain madness to dispute of the manner of anything, and the way of expressing it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Trinity Explained &amp; Vindicated</cite>, pp. 407-8 in Works ed. William H. Goold (NY: Robert Carter, 1851), vol. 2</span></figcaption>

<blockquote><p>I. That there is one only God, distinct in three persons.

As we are taught therefore by the holy scriptures, which are his own word, we believe that there is only one God, that is, one simple, indivisible, eternal, living and most perfect essence in three existences, or (as the church useth to speak) persons, namely subsisting of the eternal Father, the eternal Son, and the eternal Holy spirit, truly distinct among themselves, yet without all division; being both beginning and cause of all things.

II. That so every person by it self is true God, that yet there be not three Gods.

For so we do believe and have learned out of the holy scriptures that the Father by himself is true and perfect God, the Son by himself is God and the Holie spirit by himself is God. And yet that they are not many, but one only God almighty, of whom all things, by whom all things, and for whom all things are.

III. One person to be distinct from another in personal proprieties, but in essential they differ from every creature.

And because the holy scriptures do so speak of God, that they attribute unto him many proprieties, both essential and personal, and they teach that in the essential he differeth from all things created, but in the personal one person to be distinguished from another, we therefore doe so believe, that as to beget the Son is such a propriety of the Father as can agree neither with the Son nor the Holy spirit, and again to be begotten can agree to none but the Son, and so of the rest; so likewise to be most pure, eternal, immeasurable, present every where, simply knowing all things, simply almighty, simply good and such like are in such sort the very proprieties of God, that they can by no means be communicated to any creature, so as it should be good (for example sake) in that immeasurable goodness or omnipotent in the same omnipotency, that God is.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>
<div class="actions"><button class="copy" data-copy="“I. That there is one only God, distinct in three persons.

As we are taught therefore by the holy scriptures, which are his own word, we believe that there is only one God, that is, one simple, indivisible, eternal, living and most perfect essence in three existences, or (as the church useth to speak) persons, namely subsisting of the eternal Father, the eternal Son, and the eternal Holy spirit, truly distinct among themselves, yet without all division; being both beginning and cause of all things.

II. That so every person by it self is true God, that yet there be not three Gods.

For so we do believe and have learned out of the holy scriptures that the Father by himself is true and perfect God, the Son by himself is God and the Holie spirit by himself is God. And yet that they are not many, but one only God almighty, of whom all things, by whom all things, and for whom all things are.

III. One person to be distinct from another in personal proprieties, but in essential they differ from every creature.

And because the holy scriptures do so speak of God, that they attribute unto him many proprieties, both essential and personal, and they teach that in the essential he differeth from all things created, but in the personal one person to be distinguished from another, we therefore doe so believe, that as to beget the Son is such a propriety of the Father as can agree neither with the Son nor the Holy spirit, and again to be begotten can agree to none but the Son, and so of the rest; so likewise to be most pure, eternal, immeasurable, present every where, simply knowing all things, simply almighty, simply good and such like are in such sort the very proprieties of God, that they can by no means be communicated to any creature, so as it should be good (for example sake) in that immeasurable goodness or omnipotent in the same omnipotency, that God is.”

— Jerome Zanchi, De religione christiana fides – Confession of Christian Religion, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), II.I-III, 1: 129, 131.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+That+there+is+one+only+God%2C+distinct+in+three+persons.%0A%0AAs+we+are+taught+therefore+by+the+holy+scriptures%2C+which+are+his+own+word%2C+we+believe+that+there+is+only+one+God%2C+that+is%2C+one+simple%2C+indivisible%2C+eternal%2C+living+and+most+perfect+essence+in+three+existences%2C+or+%28as+the+church+useth+to+speak%29+persons%2C+namely+subsisting+of+the+eternal+Father%2C+the+eternal+Son%2C+and+the+eternal+Holy+spirit%2C+truly+distinct+among+themselves%2C+yet+without+all+division%3B+being+both+beginning+and+cause+of+all+things.%0A%0AII.+That+so+every+person+by+it+self+is+true+God%2C+that+yet+there+be+not+three+Gods.%0A%0AFor+so+we+do+believe+and+have+learned+out+of+the+holy+scriptures+that+the+Father+by+himself+is+true+and+perfect+God%2C+the+Son+by+himself+is+God+and+the+Holie+spirit+by+himself+is+God.+And+yet+that+they+are+not+many%2C+but+one+only+God+almighty%2C+of+whom+all+things%2C+by+whom+all+things%2C+and+for+whom+all+things+are.%0A%0AIII.+One+person+to+be+distinct+from+another+in+personal+proprieties%2C+but+in+essential+they+differ+from+every+creature.%0A%0AAnd+because+the+holy+scriptures+do+so+speak+of+God%2C+that+they+attribute+unto+him+many+proprieties%2C+both+essential+and+personal%2C+and+they+teach+that+in+the+essential+he+differeth+from+all+things+created%2C+but+in+the+personal+one+person+to+be+distinguished+from+another%2C+we+therefore+doe+so+believe%2C+that+as+to+beget+the+Son+is+such+a+propriety+of+the+Father+as+can+agree+neither+with+the+Son+nor+the+Holy+spirit%2C+and+again+to+be+begotten+can+agree+to+none+but+the+Son%2C+and+so+of+the+rest%3B+so+likewise+to+be+most+pure%2C+eternal%2C+immeasurable%2C+present+every+where%2C+simply+knowing+all+things%2C+simply+almighty%2C+simply+good+and+such+like+are+in+such+sort+the+very+proprieties+of+God%2C+that+they+can+by+no+means+be+communicated+to+any+creature%2C+so+as+it+should+be+good+%28for+example+sake%29+in+that+immeasurable+goodness+or+omnipotent+in+the+same+omnipotency%2C+that+God+is.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+De+religione+christiana+fides+%E2%80%93+Confession+of+Christian+Religion%2C+ed.+Luca+Baschera+and+Christian+Moser%2C+Studies+in+the+History+of+Christian+Traditions%2C+vol.+135+%281585%3B+2+vols%2C+Leiden%3A+Brill%2C+2007%29%2C+II.I-III%2C+1%3A+129%2C+131.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf00f9cc84.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af00f9cc84.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/07/girolamo-zanchi-on-the-trinity-divine-simplicity-and-the-creator-creature-distinction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

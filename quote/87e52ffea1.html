<main class="wrap"><figure class="quote" id="q-87e52ffea1" data-kw="">
<blockquote><p>1. The Question is, Whether we shall oppose all the Lights of our Senses, which say, that the Signs of the Eucharist are Bread and Wine; and if we shall believe, that God doth continually offer Illusion to our Senses, which is opposite to his Verity and to his Purity.

2. The Question is, Whether we must suppose, that God doth every Moment, and without necessity violate the Laws of Nature, that are most inviolable, which is opposite to his Wisdom.

3. The Question is, Whether we shall receive a Theology, whereof the Consequences destroy all Christian Religion; a Theology which confounds Body and Soul, and takes away the Bounds that distinguish them. A Doctrine, which supposing the Flesh of Christ becomes Spiritual, Invisible, subsisting under a Point, confounds the Body with the Soul. For I know not how else we can define the Properties of the Soul, but in saying, She is Invisible, without Extension, without Space, and concluded under a Point.

This Doctrine also confounds Human Nature with the Divine; for it gives to the Flesh of Jesus Christ that which belongs only to his Divinity, that is, to be in many Places at once, and be able to fill Heaven and Earth. It destroys the Article of Ascension, and robs the Church of that Proof, which she made use of against those Heretics who denied the Truth of the Human Nature of Jesus Christ; so they opposed them by a Proof drawn from thence, That during the Life of the Lord, Men had always seen in him all the Actions, the Motions and Properties of Man. This Reasoning will be nothing worth, if a Body can be without its Properties, and if the Properties of a Body can be without a Body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-jurieu.html">Pierre Jurieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A preservative against the change of religion, or, A just and true idea of the Roman Catholick religion, opposed to the flattering portraictures made thereof, and particularly to that of my Lord of Condom</cite>, trans. Claudius Gilbert (London: Thomas Cockerill, 1683), pp 125-26.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7bb847ead4" data-kw="">
<blockquote><p>Christ is, after all, the only food for our souls. He is the substance and essence held forth in the Lord’s Supper. Not simply Christ in himself, however, but specifically as the one crucified for us and handed over unto death. In the words of institution—given for you, shed for you—lies the paramount and virtually entire power of the sacrament. If the body and blood had not been sacrificed once for our redemption and salvation, the distribution of the same would not impart any advantage to us.

We eat Christ, properly and redemptively, only when we eat him crucified and when we grasp the effectual working of his death with a lively awareness. Christ would not have been the bread of life for us if he had not been born for us and died for us; and he would not now be the bread of life if the effectual working and fruit of his birth, death, and resurrection were not eternal and immortal. Indeed, precisely for that reason he surrendered his body for us unto death, so that it would become for us bread for nourishing our spiritual life. The essence or substance of the Lord’s Supper, therefore, is Christ with his death and resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin s Doctrine of the Lord’s Supper’, trans. Nelson D. Kloosterman in Mid-American Journal of Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-0b00e0383d" data-kw="">
<blockquote><p>And this is one of the Effects which your Transubstantiation operates, destroying the most convincing Arguments you can offer the Infidels, and giving them an infallible means to defend themselves, and right to maintain, That if these Proofs be good, Transubstantiation is not a part of the Christian Religion; or if Transubstantiation be a part of the Christian Religion, these Proofs he of no validity.

It’s certain, if they be Men endued with sense, they will lay hold of the first of these Propositions. In effect it’s apparent, That Mr. Huet‘s Proof, are valid, and good in themselves; whereas ’tis not certain, That Transubstantiation is one of the Doctrines which Christianity teaches, not to say that it ought to be taken for granted, that it is not one of them.

It is so strange and offensive, and so little agrees with the whole Body of revealed Truths; either in general, or particular, that a Man needs only the use of his Senses, free from all prejudices, to perceive, That this comes not from the same Spring, and that the Author of Christianity is a very different Person from the Author of Transubstantiation.

Such Infidels then, that are discerning Men, will separate what’s offered to them jointly. They will embrace Christianity, and reject Transubstantiation: They will receive this Holy Religion, as coming from the Spirit of God, and put from them your Doctrine as a human Invention.

However ’tis not long of you, That they cast not themselves into the other aforementioned extremity: I mean, the persuading themselves that the Proofs of the Christian Religion be invalid. Yet you are for persuading them, not only That Transubstantiation is one of the Doctrines which the Gospel teaches, but moreover one of its principal ones; one of the most essential Points of Christian Religion, and that which can be least spared.

And consequently, if these Infidels be simple enough to believe this, and after such an Error have any reason left, they will only make use of it to persuade themselves, That that Religion which teaches such an incredible Doctrine, could not have been revealed by the Spirit of Truth; and that the Proofs which were made use of to establish the Divinity of it, are of no validity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six conferences concerning the Eucharist wherein is shewed, that the doctrine of transubstantiation overthrows the proofs of Christian religion</cite>, trans. Thomas Tenison (London: Richard Chiswell 1687), pp 7-9.</span></figcaption>

</figure><figure class="quote" id="q-724305aa3c" data-kw="">
<blockquote><p>In and by the lawful use of the Lord’s Supper, the sealing of grace will progress to its highest degree and will be certain and infallibly secure. (Matt. 26:26; 1 Cor. 10:16-17; Ps. 93:5).

It is therefore erroneous … that some, because they are so weak in the faith and have so little assurance of their salvation, at times abstain from partaking of the Lord’s Supper. They dare not partake because they lack assurance.

Instead, however, they should partake in order to attain such assurance. The Lord’s Supper is the pledge or wedding ring whereby it pleases Christ to enlarge our hearts in a more powerful and lively manner. If we were always emotionally engaged and always steadfast in our walk, the Lord’s Supper would not be needed. All the more reason for us to partake, for it is here that we most frequently fail. Who would refrain from eating because he is too weak? Precisely, then, one ought to eat in order to become stronger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guiljelmus-saldenus.html">Guiljelmus Saldenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children</cite>, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), pp 55-56.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

It is therefore erroneous … that some, because they are so weak in the faith and have so little assurance of their salvation, at times abstain from partaking of the Lord’s Supper. They dare not partake because they lack assurance.

Instead, however, they should partake in order to attain such assurance. The Lord’s Supper is the pledge or wedding ring whereby it pleases Christ to enlarge our hearts in a more powerful and lively manner. If we were always emotionally engaged and always steadfast in our walk, the Lord’s Supper would not be needed. All the more reason for us to partake, for it is here that we most frequently fail. Who would refrain from eating because he is too weak? Precisely, then, one ought to eat in order to become stronger.”

— Guiljelmus Saldenus, Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), pp 55-56.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+and+by+the+lawful+use+of+the+Lord%E2%80%99s+Supper%2C+the+sealing+of+grace+will+progress+to+its+highest+degree+and+will+be+certain+and+infallibly+secure.+%28Matt.+26%3A26%3B+1+Cor.+10%3A16-17%3B+Ps.+93%3A5%29.%0A%0AIt+is+therefore+erroneous+%E2%80%A6+that+some%2C+because+they+are+so+weak+in+the+faith+and+have+so+little+assurance+of+their+salvation%2C+at+times+abstain+from+partaking+of+the+Lord%E2%80%99s+Supper.+They+dare+not+partake+because+they+lack+assurance.%0A%0AInstead%2C+however%2C+they+should+partake+in+order+to+attain+such+assurance.+The+Lord%E2%80%99s+Supper+is+the+pledge+or+wedding+ring+whereby+it+pleases+Christ+to+enlarge+our+hearts+in+a+more+powerful+and+lively+manner.+If+we+were+always+emotionally+engaged+and+always+steadfast+in+our+walk%2C+the+Lord%E2%80%99s+Supper+would+not+be+needed.+All+the+more+reason+for+us+to+partake%2C+for+it+is+here+that+we+most+frequently+fail.+Who+would+refrain+from+eating+because+he+is+too+weak%3F+Precisely%2C+then%2C+one+ought+to+eat+in+order+to+become+stronger.%E2%80%9D%0A%0A%E2%80%94+Guiljelmus+Saldenus%2C+Efficacy+of+the+Lord%E2%80%99s+Supper+to+the+Comfort+and+Sanctification+of+God%E2%80%99s+Children%2C+%281664%29%2C+trans.+Bartel+Elshout+in+James+A.+De+Jong+%28ed.%29%2C+In+Remembrance+of+Him%3A+Profiting+from+the+Lord%E2%80%99s+Supper+%28Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+2012%29%2C+pp+55-56.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F724305aa3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/724305aa3c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/10/guiljelmus-saldenus-on-assurance-and-the-lords-supper/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-00576a4c2f" data-kw="">
<blockquote><p>Lord, thou knows I am weak in grace, thou seest my faith is feeble, my love cold, my desires faint, my obedience small; but thou hast all fulness of grace; thou art the Fountain, and this Fountain is opened here; thou art the Treasury, and this Treasury is here unlocked.

Those graces I have, though weak, thou begatst them, and wilt not thou now nourish them? From thee I had the being of grace, and from thee I must have the nourishing. Thou hast set up this Ordinance as a means to convey grace, and thou hast promised to remember them that are in thy way, therefore help,—&amp;c.

Besides, may faith say, Lord, thou hast been pleased to implant me into Christ, and shall I die for want of nourishment? thou hast made me a member of Christ, and shall I decay and wither for want of influence? Oh! never let it be said, that a branch in Christ shall wither and decay for want of nourishment, when there is so much in the root; let it never be said, that a member of Christ should wither and die for want of influence and life, seeing there is so much in the Head.

Thou camest, that I might have life; yea, &amp; have it in abundance; why Lord, my graces are weak, here are dying affections, dying dispositions, dying graces, Oh! come down before I die, strengthen the things that are ready to die in me. Thou hast raised me from the death of sin, let me not again drop into the same grave; thou hast wrought graces in me, let them not decay for want of life, when such abundance in thee.</p></blockquote>

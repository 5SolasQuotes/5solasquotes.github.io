<main class="wrap"><figure class="quote" id="q-3db040416a" data-kw="">
<blockquote><p>Only let our friends know, that, in setting up distinct congregations and judicatories, they not only withdraw from judicious and eminently godly ministers and private Christians, but do also consequentially go far towards a dooming them to Hell, as owning themselves to be in the communion of a Church that is no true Church, and with which (according to their principles) the Lord Jesus entertains no more any communion; for certainly their setting up separated judicatories and Churches will imply so much, or else they must say that they will have no fellowship with Churches with whom the Lord Jesus does entertain communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-debfb648a2" data-kw="">
<blockquote><p>…no doubt it was this party headed by Mr. Hamilton, who, as they violently pushed forward the country people to a rising, so by their indiscretion and want of conduct, evidently ruined the west country army, and effectually hindered the fair prospect there once was, that they might have been a mean of delivering the church and nation from the burdens they were under; and the upshot of all was, divisions came in, joint measures were not taken. A great many left them when they saw whither matters were going, and far more never joined them; and such as continued together could never do any thing of consequence: and when they came to be attacked, the high-flyers withdrew first, and left the poor country men to the mercy of the king’s army.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3</cite>, p. 65</span></figcaption>

</figure><figure class="quote" id="q-05764539d7" data-kw="">
<blockquote><p>In our Assemblies we were more to set up a state opposite to a state, more upon forms, citations, leading of witnesses, suspensions from benefices, than spiritually to persuade and work upon the conscience, with the meekness and gentleness of Christ; the glory and royalty of our princely Redeemer and King, was trampled on, as any might have seen in our Assemblies. What way the army and the sword, and the countenance of nobles and officers seemed to sway, that way were the censures carried: It had been better had there been more days of humiliation and fastings in Assemblies, synods, presbyteries, congregations, families, and far lass adjourning commissions, new peremptory summonses, and new drawn-up processes, and if the meekness and gentleness of our Master had got so much place in our hearts that we might have waited on gainsayers and parties contrary-minded, and we might have driven gently, as our Master Christ who loves not to overdrive, but carries the lambs in his bosom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-7a1a4f739d" data-kw="">
<blockquote><p>It is the complaint of not a few of such who were in Christ before me, that most of us inhabit and dwell in a parched land; the people of the Lord are like a land not rained upon. Though some dare not deny but this is the garden of the Beloved, and the vineyard which the Lord does keep and water every moment; Yet, O where are the sometimes quickening breathings and influences from Heaven that have refreshed his hidden ones! The causes of his withdrawings are unknown to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>Obj. 2. The covenant was occasional and temporary, being made upon the occasion of the prevalency and growing power of the enemy (as is mentioned in the narrative), which foundation being taken away the superstructure cannot stand.

Ans. 1. … Shall we therefore be no longer bound to obey and maintain good laws, because the evils which gave occasion to their making have ceased?

2. The covenant doth, in express words, oblige us constantly, and all the days of our lives, to pursue the ends therein expressed; so that to hold it but a temporary obligation is a breach of covenant.

3. There is not any one of the ends of the covenant which is yet fully attained. The very Directory of Worship is not observed in most places of the kingdom; neither is the abolition of prelacy, and of the Book of Common Prayer, yet established by act of parliament.

4. If we had attained the ends of the covenant (which we have not), yet non minor est virtus quam quorere parta tueri, and the recidivation may prove worse than the first disease.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, (1649; Edinburgh, 1844), pp 87-88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Writing to Queen Elizabeth I of England, Peter Martyr reminded her that it was the duty of the civil magistrate to put the advance of Christ’s kingdom before all other things:

For it behoveth that you restore again in this place the holy Gospel of Christ, which through injury of the times and importunity of the adversaries, hath lien some years past neglected, I will not say trodden under foot. This if you shall perform, all things shall happen prosperously unto you, no less than they did unto most godly king David. For it be said unto every Christian man, that he should first seek the kingdom of God, then other things should easily be supplied, shall we not think that the same is commanded unto kings? Certes, if it be commanded all men to worship God most sincerely, kings are not exempted from the precept: nay rather the greater estate they bear amongst men, the more are they bound to that law of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An epistle to the most renowned Princess Elizabeth by the grace of God Queen of England, France and Ireland, Grace and everlasting happyness from God the Father through Jesus Christ our Saviour (1558) in W. J. T. Kirby (ed.), The Zürich connection and Tudor political theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

t-the-kingdom-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-429dcffa50" data-kw="">
<blockquote><p>1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way.

2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years.

3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>

<blockquote><p>…in the use of all indifferencies, in our meals, in our feastings, and merry meetings, in our journeys, in our ordinary talk, and discourse, in our walks, in the actions of our ordinary vocations: Indeed the rule of God’s Word does not at all either command, or forbid the matter of such actions: but the manner of performing them comes under the rule: They are all to be done to the glory of God, in the name of Christ: every good creature is to be sanctified by the Word, and prayer: That command which God gave Abraham (to walk before Him [Gen. 17:1]) is not to be straitened unto the ordinances of God, but to be extended unto all deliberate acts of a man’s life and conversation, Gen. 17:1. Zechariah (in his prophecy of the general call or conversion of Jews, and gentiles) gives this for one character of such, as shall be converted, that they shall have a sacred and sanctified use of things common and indifferent: ‘In that day shall there be upon the bells of their horses, holiness unto the Lord, yea, every pot in Jerusalem and Judah shall be holiness unto the Lord of Hosts,’ Zech. 14:20-21. Not only acts of immediate worship, but all rationall actions, whatsoever, should be offered up as spiritual sacrifices acceptable unto God by Jesus Christ, 1 Pet. 2:5. The apostle exhorts the Romans to salute one another with a holy kiss, Rom. 16:16, this kiss was no religious rite in God’s worship, but a ceremony of civility; and therefore in itself a thing indifferent: And yet the apostle requires holiness for the qualification of it: All our civil actions ought to be such, as becomes saints; that is, so far forth holy for manner, that they be free from sin, and unto the glory of God: Indeed this is a strictness impossible unto lapsed man: But though we cannot exactly and perfectly observe it, yet we may sincerely and cordially endeavor it:</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8102a3770c" data-kw="">
<blockquote><p>For although it was on earth that He was made the Son of man, yet He did not deem it unworthy of that divinity, in which, although remaining in heaven, He came down to earth, to designate it by the name of the Son of man, as He dignified His flesh with the name of Son of God: that they might not be regarded as if they were two Christs,—the one God, the other man,—but one and the same God and man,—God, because “in the beginning was the Word, and the Word was with God, and the Word was God;” and man, inasmuch as “the Word was made flesh and dwelt among us.” By this means—by the difference between His divinity and His humiliation—He remained in heaven as Son of God, and as Son of man walked on earth; whilst, by that unity of His person which made His two natures one Christ, He both walked as Son of God on earth, and at the same time as the very Son of man remained in heaven.

Faith, therefore, in more credible things arises from the belief of such things as are more incredible. For if His divine nature, though a far more distant object, and more sublime in its incomparable diversity, had ability so to take upon itself the nature of man on our account as to become one Person, and whilst appearing as Son of man on earth in the weakness of the flesh, was able to remain all the while in heaven in the divinity which partook of the flesh, how much easier for our faith is it to suppose that other men, who are His faithful saints, become one Christ with the Man Christ, so that, when all ascend by His grace and fellowship, the one Christ Himself ascends to heaven who came down from heaven?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Merits and Forgiveness of Sins. And on the Baptism of Infants</cite>, (412), 1.60 in Nicene and Post-Nicene Fathers 1, 5: 39.</span></figcaption>

<blockquote><p>33. His office is rightly conceived as threefold: Prophetic, Priestly, and Royal, since salvation had to be announced to the sinner, and merited, and applied.

34. The instrument of pre-announcement indeed was the word of the Law, yet of announcement only the word of the Gospel.

35. The rule [ratio] of merit is to be sought in the entire obedience of Christ exhibiting full satisfaction both in order to the commandment of the law and in order to the penal sanction adjoined to it.

36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical.

37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in identical sense.

38. The instruments of producing this faith are the word and Sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace.

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.

40. The end of this sanctification, but the effect of justification, is glorification, consisting both in perfect vision of God and in perfect fruition of God seen, which is the sum of our hopes, the compendium of our vows, and the goal and complement of glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>

rding+to+parts%2C+although+not+according+to+degrees%2C+both+as+to+the+repurgation+of+faculties+corrupted+through+sin+and+as+to+the+convenient+subordination+of+them+inverted+through+sin.+40.+The+end+of+this+sanctification%2C+but+the+effect+of+justification%2C+is+glorification%2C+consisting+both+in+perfect+vision+of+God+and+in+perfect+fruition+of+God+seen%2C+which+is+the+sum+of+our+hopes%2C+the+compendium+of+our+vows%2C+and+the+goal+and+complement+of+glory.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima%2C+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3fb5d4add4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3fb5d4add4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-offices-of-christ#:~:text=33.%20His%20office%20is%20rightly%20conceived,the%20goal%20and%20complement%20of%20glory&amp;text=33.%20His%20office%20is%20rightly%20conceived%20as%20threefold&amp;text=vows%2C%20and%20the%20goal%20and%20complement%20of%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-77e1b5d95d" data-kw="">
<blockquote><p>Then I must tell you, that every Fear is not commendable. Not that Fear which is Hypocritical, for this is Superstition, when men fear the Fear of Idolaters. Not that fear which is Worldly, for this is wicked self-Love, when men fear Men Loss of Goods, Fire and faggot, more than God the Only Sovereign Commander of the Soul, the Only Dreadful Threatener of everlasting Burnings.

Nor that fear which is Servile or adulterate, for this is no Virtue proves Paris. when men fear the Evil of Punishment only; not the Evil of Sin, as an Adulteress fears the Coming home of her Husband; but fears not the Committing of Adultery. Nor is that fear commendable, which is Distrustful or Immoderate like Ruben as Gerson alludes grown great, and lying with Bilhah, for this is Infidelity when men tie God’s Grace to present deliverance out of danger, without a Believing and waiting Spirit for his Mercy, Esai. 28.16.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5345e00844" data-kw="">
<blockquote><p>It is divine law, jure divino, both by nature and Scripture, for the stronger to relinquish rights and privileges for the here and now to help the weaker, for the greater good (Ps. 40:6–8; Mt. 5:38–48; Mk. 15:3–5; Jn. 10:15–17; 1 Cor. 6:4–8; 9:4–23; Eph. 5:25–26; Phil. 2:6–9; 1 Pet. 2:19–25; WLC 99.5), especially when called by Christ to do so (Mt. 28:18–20; Acts 9:15–16). Ought not the stronger and more excellent parts of the body, rather than ignoring or forsaking the weaker and less comely parts, unite with, serve and benefit them, covering them over with greater honor, as we ourselves do and God does (1 Cor. 12:23–24), “that there should be no schism in the body”? (1 Cor. 12:25)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>But touching an erring conscience, the question is not whether an erroneous conscience does so tie that we must do nothing on the contrary, nor is the question whether the nearest, actually obliging rule, be conscience; the Arminians tell us [that] though the Word of God, of itself, and by itself, have power to oblige, yet it actually obliges no man except it be understood, and so is believed to be understood, after we use all possible diligence and prudence, for no man is obliged to follow the true sense of the Word against his conscience, though it be erroneous; But we think the Word of God is both the farest and nearest, and the only obliging rule, and that the ditement [judgment] of the conscience does neither bind potentially nor actually, but is a mere [in Greek], a messenger and an official relater of the will and mind to God to us, and all the obliging power is from the Word; [???] the messenger of a king and judge is not the obliging [???] that ties the subject, or the herald’s promulgation of the Law, is no obliging rule; for [the] promulgation of heralds is common both to just and to unjust laws, and certainly unjust laws from a just prince lay no band on the conscience or on the man, far less can the promulgation, as the promulgation, lay any bands on the conscience; the word of a messenger and herald is at the best but a condition, or the approximation of the obliging power to us, but all the obliging power is from the king and the judge. It is most false then, that these Libertines say that the Word does not actually oblige except it be understood, for the understanding, information and indictment of conscience does not add any actual obligation to the Word that it had not before, it only is a reporter, to carry both the Word and the actual obligation to the man; the herald promulgating the law adds no obligation, actual or potential, to the law that it had not before, only it makes an union in distance, and near application and conjunction between the actually obliging law and the understanding knowledge of the person or subject, who is obliged to keep the law; though it be true the fire cannot actually burn but as timber is cast to it, yet the fire has from its own nature both potential and actual burning, not from the act of casting the timber in the fire; Nor is this a concludent reason, ‘no man is obliged [to] follow how the true sense of the Word against his conscience, though erroneous, ergo [therefore] the erroneous conscience does oblige, or ergo, actual obligation to obedience is not from the Word, but from the conscience;’ no more than this is a good consequence: no man is obliged to obey the Law in itself, just contrary to the promulgation of an erring and mistaking herald, ergo, the mistaking herald’s promulgation gives to the Law actual obligation over the subject; for it only follows [that] we are not to do contrary to the actual indictment of an erroneous conscience, but not obliged to follow the erroneous conscience; Nor are we obliged to follow what our conscience says is true and good, because, or upon this formal reason and ground, that the conscience says so, more than we are to believe and practice what the Church or the conscience of others, [who are] the Church, the learned and godly, say; for we make not the word of the Church the formal object of our faith, but ‘thus saith the Lord’ only, because the Church is but a company of men and so our faith should depend upon men, even though holy and speaking ingenuously what their conscience dictates as true, which is absurd, ergo, by the same reason, what one man’s conscience, our own or others’ say, is not the formal object of our faith and practices, for so also our faith should depend on man, not on God. And we say the conscience, at its best, is but regula regulata [a rule being regulated] not, regula regulans [a regulating rule], nor ought it to have the throne of God, for God is only Regula Regulans. If it were a rule, it is to be ruled by God and his Word, yea, as we are to try all things and not believe with a blind faith what others say, or their conscience proposes to themselves and us, as truth, for then we make a Pope of the consciences of men under the notion of teachers and Church; so we are not to be ruled without trying, and absolutely [ruled] by our own conscience, but to try its dictates by the Word of God, otherwise we make a Pope and a God of our own conscience. … …an erroneous conscience must be a transgressing conscience, and it is a contradiction that a faculty sinning should oblige to obedience to the Law of God, in the same consideration, because it sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 11, ‘Of the Obliging Power of Conscience’, pp. 133-136. See the whole chapter for more.</span></figcaption>

ing+ingenuously+what+their+conscience+dictates+as+true%2C+which+is+absurd%2C+ergo%2C+by+the+same+reason%2C+what+one+man%E2%80%99s+conscience%2C+our+own+or+others%E2%80%99+say%2C+is+not+the+formal+object+of+our+faith+and+practices%2C+for+so+also+our+faith+should+depend+on+man%2C+not+on+God.+And+we+say+the+conscience%2C+at+its+best%2C+is+but+regula+regulata+%5Ba+rule+being+regulated%5D+not%2C+regula+regulans+%5Ba+regulating+rule%5D%2C+nor+ought+it+to+have+the+throne+of+God%2C+for+God+is+only+Regula+Regulans.+If+it+were+a+rule%2C+it+is+to+be+ruled+by+God+and+his+Word%2C+yea%2C+as+we+are+to+try+all+things+and+not+believe+with+a+blind+faith+what+others+say%2C+or+their+conscience+proposes+to+themselves+and+us%2C+as+truth%2C+for+then+we+make+a+Pope+of+the+consciences+of+men+under+the+notion+of+teachers+and+Church%3B+so+we+are+not+to+be+ruled+without+trying%2C+and+absolutely+%5Bruled%5D+by+our+own+conscience%2C+but+to+try+its+dictates+by+the+Word+of+God%2C+otherwise+we+make+a+Pope+and+a+God+of+our+own+conscience.+%E2%80%A6+%E2%80%A6an+erroneous+conscience+must+be+a+transgressing+conscience%2C+and+it+is+a+contradiction+that+a+faculty+sinning+should+oblige+to+obedience+to+the+Law+of+God%2C+in+the+same+consideration%2C+because+it+sins.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%2C+%E2%80%A6+%281649%29%2C+ch.+11%2C+%E2%80%98Of+the+Obliging+Power+of+Conscience%E2%80%99%2C+pp.+133-136.+See+the+whole+chapter+for+more.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb1565ce346.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b1565ce346.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-conscience/#:~:text=But%20touching%20an%20erring%20conscience%2C%20the,the%20same%20consideration%2C%20because%20it%20sins&amp;text=But%20touching%20an%20erring%20conscience%2C%20the%20question%20is&amp;text=God%2C%20in%20the%20same%20consideration%2C%20because%20it%20sins" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dec4427a0b" data-kw="">
<blockquote><p>At a public meeting held at Edinburgh in February 1840 on the church’s spiritual independence, Dr Thomas Chalmers claimed that the principles of the non-intrusionists during the Ten Years’ Conflict were those of their covenanting forefathers:

It is, in a season of unexampled difficulty, to declare what we hold to be clear and incumbent duty. It is to rally and reassure the Church’s friends, in this hour of danger and menace to the Church’s liberties. It is to tell the country that, though perplexed, we are not in despair; and that whatever the threats, or whatever the demonstrations of power may be, we are resolved to abide by the good old principles which we believe to be in the Word of God – (Cheers) – principles bequeathed to us by the founders of Scottish Presbytery, and sealed by the martyrdom of our Scottish forefathers. …

Persecution may change its forms from one age to another – from the boots, and the thumb-screws, and the scaffolds of the seventeenth, to the fines and imprisonments of the nineteenth century. May the spirit of our ancestors descend to their children, that if the contest must be entered on between the Church’s subjugation and the Church’s spiritual independence, we, on the glorious retrospect of their sufferings and their triumphs, may give back to our adversaries their own watchword, return their own battle cry that “what firmness has done before, it will do again.” …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 26 February 1840.</span></figcaption>

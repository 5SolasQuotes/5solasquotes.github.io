<main class="wrap"><figure class="quote" id="q-5225b0e28a" data-kw="against conjectural certainty">
<blockquote><p>Our controversy here is with the same adversaries who oppose perseverance. The Romanists teach that the believer has no certainty save a conjectural certainty of his own faith; nor can any believer be certain that he believes in Christ with a true and not a hypocritical, with a living and not a dead faith, since all can variously both be deceived and deceive themselves (and often do).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.17.2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0a69afd8a0" data-kw="">
<blockquote><p>The man comes from China acknowledging God in all his ways, as Abraham left his country, Gen. 12; if he be an idolater, they should not lodge him, 2 Jn. 10; he comes not as indifferent to be married to this or this church, or to none at all, as a man sins not if he marry none at all, 1 Cor. 7, but if he be a professor that joins to no church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 1, p. 283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ef8944025" data-kw="">
<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse, wherein is Proved that Prelatical Jurisdiction is Not of Divine Institution, but forbidden by Christ Himself</cite>, (1640), ch. 7. Prynne was a prominent Erastian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-5e1ef50379" data-kw="">
<blockquote><p>Nonetheless, there can be just causes for divorce: malicious desertion of the spouse (1 Cor. 7:15) and adultery (Deut. 24:1; Matt. 19:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-heidegger.html">Johann H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology</cite>, trans. Casey Carmichael (RHB, 2019), Locus 14, ‘On the Decalogue’, section 25, p. 102</span></figcaption>

</figure><figure class="quote" id="q-a23e1425fa" data-kw="">
<blockquote><p>§23. 15. In civil actions that are religious only finally, and by participation, and not any acts of special worship, it is lawful to use symbolical rites that are in their kind near of kin to sacraments in their kind, and may be called ‘civil sacraments’, such as: the sealing and delivery of indentures, or other covenant writings: and the delivery of possession of a house by a key, and of the temple by a book and bell-rope, and of land by a twig and turf; and of civil government by a crown, or scepter, or sword, etc. And such is the use of a ring in marriage. … §43. 3. And for the ring in marriage, I see no reason to scruple the lawfulness of it: For though the Papists make a sacrament of marriage, yet we have no reason to take it for any ordinance of divine worship anymore than the solemnizing of a contract between a prince and people. All things are sanctified and pure to the pure: but that does not confound the two Tables [of the Ten Commandments], nor makes all things to be parts of worship that are sanctified. The coronation of a king is sanctified as well as marriage, and is as much a sacrament as marriage, and the ceremonies of it might as well be scrupled: especially when God does seem to go before them by the example of anointing, as if He would confine them to that ceremony, which yet was none of his intent, nor is it much scrupled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 406 &amp; 411</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

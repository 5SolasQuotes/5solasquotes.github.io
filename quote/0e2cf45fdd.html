</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a539df8b1" data-kw="">
<blockquote><p>…or else they [Christians] must [on congregationalist principles] be fetched from places so far distant as must force them either to travel far from their several abodes to the same meeting place for worship winter and summer, or else many of them to be without all church-ordinances, or to enjoy them rarely: The former of which is oppressive to their bodies, the later injurious to their souls; neither of them seems suitable to the goodness and wisdom of God, who (as ’tis said of the Sabbath [Mk. 2:27]) has made Church-ordinances for man, not man for Church-ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644), ch. 2, p. 3, margin note. Rathband was an English puritan and Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f51fbde79a" data-kw="">
<blockquote><p>13. If a pastor preach some unsound doctrines or faultily perform the public worship, or neglect just discipline and receive the unworthy to the communion of the church, or reject the worthy, the presence of the innocent members (who make not the fault their own by consent, or by neglecting their duties to reform it), makes none of this to be their sin, nor is to be taken for a sign of their consent: Nor will the presence of the unworthy deprive the godly of the blessing or comfort of God’s ordinance: Nor are they bound to separate from that church because of these corruptions, unless they are so great as to unchurch that church or make their worship and communion such as God Himself rejects and will not accept: or unless by imposing sin upon them, or some other way, the church expel them, or they have accidentally some other reason to remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing: I. a Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians</cite>, … (London: Parkhurst, 1691), pt. 2, Question 2, p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…and while we took it [the Anglican Book of Common Prayer] to be a defective, disorderly and inconvenient mode of worship, it would be our sin to use it of choice while we may prefer a more convenient way, whatever we ought to do in case of necessity when we must worship God inconveniently or not at all.</p></blockquote>

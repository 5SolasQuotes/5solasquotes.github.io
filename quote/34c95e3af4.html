<blockquote><p>Therefore it is not wholly without reason that some have raised the question: “which is more to be feared or desired: an evil ruler with good counsel, or a good ruler with evil counsel?” For if the counsel of the ruler is evil and full of flatterers, ambitious, avaricious, thieves, debauchers, and tyrants (which is fairly standard for courts), the ruler will not govern, but those to whom the ruler and his name serve as a mask shall govern in his name. They shall establish their reign and tyranny by using the ruler as a decoy serves the huntsman in their chase, and as idols serve the priests in order to emphasize themselves, and bring themselves greater advantages by their use. And in this way the tyranny which is to be feared in a monarchy will be converted into what generally occurs in an aristocracy when it is perverted and altered into this tyrannical state which the Greeks call oligarchy—that is, the principality of a small number who reign tyrannical and not by true justice, instead of a great number and many people. … and among other dangers, there are customarily two great evils which bring great miseries and which often ruin nations. The first is the elections of the magistrates. The second is the judgment and executions of the things ordained by the laws. For where in elections devolve upon the community, it is very difficult to have governors and magistrates such as are required; and this happens chiefly for two reasons. The first is a desire which every man has of living in his own carnal liberty and fleshly pleasure without being subject to any laws. This desire is the reason why those to whom the elections belong prefer to have governors and magistrates elected according to their mold and devoted to them, under whom they can live in greater licentiousness, without rebuke or correction, than to have someone who fears God and who shall take them in hand and punish the wrongdoers according to every man’s deeds. The other reason is ambition and greed, which are the reasons why many take the offices of the country by intrigue, either for themselves or for their friends and consorts, And for those by whom they have been corrupted. And this is done not out of a desire to maintain God’s owner or the public good or to administer true justice, but is done merely for the honor and earthly profit of those who hoped to receive it and to rain above the others. …One further evil still remains, which is the negligence of judgments and the scorn of good laws and ordinances made for the preservation of the public good. For it often happens that the great alliances and relations which exist in the community prevent the right course of justice, and that the criminals are not brought to justice and punished according to the laws according to their wrongdoing, but to the contrary they are tolerated. The chief cause of this proceeds from the fear of the disfavor that those who govern might acquire of such allies who are joined to them if justice were administered as it ought to be, according to the commandments of God, whose Law so often and so expressly forbids having any respect of persons, and commands that just judgment be meted out. Furthermore, it almost always ordinarily happens that within these popular states certain flatterers (who know how to win the good favor of all) are very popular, and easily obtained all they desire. Four, seeing that the people are devoted to them, they easily condescend and consent to what pleases them. Seeing that there are so many drawbacks to all types of civil government, it is not possible that man could ever have justice and live with each other in a lasting peace and remain united unless they possess an authority and a lord who is greater and more excellent in power, wisdom, and goodness than all others combined. God, the Creator of all, shows us this very clearly both in the order which He has established among men and beasts, as well as in the various natures that he has placed within man by joining together the soul and body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-viret.html">Pierre Viret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“How Should Man Be Governed?” in The Christian and the Magistrate: Roles, Responsibilities, and Jurisdictions</cite>, trans. R. A. Sheats (Monticello, FL: Psalm 78 Ministries, 2015), 14–17.</span></figcaption>

<blockquote><p>Lastly, the question may be asked touching the daughter of a man given in marriage, the husband commandeth one thing, and the father another, whether of these is to be obeyed, the husband, or the father? I answer, the husband. For, as she must obey her husband before the father, so she is to love the husband better also, and God commandeth the man to leave father and mother and to cleave to his wife (Gen. 2:24), which is also a commandment unto the woman to leave parents, and to cleave to her husband, for they twain shall be one flesh, Mt. 19:5; Eph. 5:31; 1 Cor. 6:16: Therefore in this [latter] case the will of the husband is to be preferred before the will of the father. For as it is in the two great lights which God hath set in the firmament, the lesser evermore giveth place to the greater, and when the sun shineth, the light of the moon fadeth and vanisheth away: so when the greater authority of the husband commeth in place, the lesser power and authority of the father ceaseth. Besides, his giving of her in marriage to the husband is a giving away of his own right over her, as well as over that portion of goods which he bestoweth with her: so that now his authority is abridged, nay clean abolished.</p></blockquote>

<blockquote><p>A leading theory is that the increased risk for depression stems from an altered stress response among birth control pill users. Studies indicate that women on the pill have a blunted cortisol response: In acute stress tasks, they have a slow rise and a gradual fall of cortisol rather than the classic spike that signifies a healthy stress response. Despite the cortisol differences, these women report feeling at least as much stress as non–pill takers… women on the pill also tend to show differences in their inflammatory stress response, which occurs just before the cortisol spike.</p></blockquote>

<blockquote><p>Paul supplies the tenth argument in Galatians 4:4–5: “After the fullness of time came, God sent His Son, born from a woman, made subject to the Law, to redeem those who had been subject to the Law, that we might receive adoption.” The apostle teaches that Christians were redeemed from that bondage of the Law through Christ, who became subject to the Law by His voluntary humiliation, who by nature was not placed under the Law. [460b] For He was not subject to the Law for Himself, because, first, He became subject to the law, when He who by nature was free from the law voluntarily made Himself subject to the Law. He was not subject to the Law for Himself, second, because the apostle would not have so greatly preached that subjection, if Christ had been obligated to it for Himself, which would have been common to Him with us. Now what is common to Christ with us, why is it of concern to preach so greatly as something peculiar, singular, and great? Surely Paul alleges that Christ became subject to the law as a singular and great benefit, by which we were redeemed from the bondage of the law. He was not subject to the law for Himself, third, because the end of that subjection brought it about that it was done in our place. For Christ was made under the law for the sake of those to be redeemed. He truly subjected Himself to the law in their place. But indeed for the sake of redeeming us, Christ was made under the law. Therefore, He subjected Himself to the law in our place. This declares a similar example: when many debtors are bound to the same creditor for themselves, if one pays his debt, the others are not redeemed, because the one was held for himself and therefore paid for himself alone. But Christ, paying our debt to the law, has redeemed us. Therefore, Christ was not held to the law for Himself but for us, whom He has redeemed. Ambrose, in the first book On Faith to Gratianus Augustus, in the sixth chapter, in the exposition of this passage, says, “Christ made by woman through the taking up of the flesh, made under the law through the observance of the law. This very quotation is cited in the second volume of councils, in the first action of the Council of Chalcedon, page 81. Theodoretus, in the Epitome of the Divine Decrees, on the chapter on the dispensation or incarnation of the Savior, writes: “For as much as it applies to humanity, since subject to the law He fulfilled the law, He set those free from the curse who had transgressed the Law.” Hence, we argue in this way: The perfect conformity to the law of Him who became subject to the law for us is imputed to us for righteousness. But Christ was made subject to the law for us. Therefore, Christ’s perfect conformity to the law is imputed to us for righteousness…Therefore, Christ even for us became subject to the law and not for Himself.</p></blockquote>

<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>

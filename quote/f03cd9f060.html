<main class="wrap"><figure class="quote" id="q-f03cd9f060" data-kw="">
<blockquote><p>Let things and utensils, adiaphora and civil in themselves, yet used with some accessory, idolatrous usage and form which is not yet wiped out, chiefly, while the idolaters still live, not be carried around and employed.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08d8e4b231" data-kw="">
<blockquote><p>Objection: Be it true that crosses were purposely appointed to be adored, yet not so now. The Jews would not admit of the image of Caesar in the Church, yet they abolished it not, but admitted it in their coin… [Rutherford’s] Answer: 1. Though the cross were first framed for no adoration… … 5. We remove not crosses from coinage, no more than the Jews did the image of Caesar. But we agree with them [the Jews], [Richard] Hooker [an Anglican] being judge, in banishing them from the worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty</cite>, pp. 89-92 in The Divine Right of Church Government (London, 1646)</span></figcaption>

</figure><figure class="quote" id="q-ddf34f9955" data-kw="">
<blockquote><p>The many portentous idolatries by which the Church of God is deformed — the many defilements of superstitions — the many profanations of sacred things — the vast sink of errors must not be touched. There is to be no diminution of the tyrannical yoke of impious laws by which miserable consciences have been ensnared; but all who desire any change are to be judged heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</span></figcaption>

</figure><figure class="quote" id="q-fbc7626e71" data-kw="">
<blockquote><p>…it is added by the Rejoinder that Beza says of some that retain the cross, they may use their own liberty. But in the next words he adds: ‘If they have any just causes of retaining this sign in their churches.’ So that he limits that liberty unto such causes as he was not privy to; nay [not for any use] to such as they at Geneva found to be clean contrary. As for us, we have many necessary reasons why we do no way tolerate that sign, and their causes (alleged in the 8th Epistle) were not peculiar to any time or place, but pertain as well to England as to Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 7-8, 214, 232, 353, 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-789a0114c6" data-kw="">
<blockquote><p>Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal Son in whom dwells the fullness of the God head, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine Majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, Sermon on Deuteronomy, May 23, 1555</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

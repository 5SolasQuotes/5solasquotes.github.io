<main class="wrap"><figure class="quote" id="q-23a2ba3197" data-kw="">
<blockquote><p>It must not be omitted that princes are not only referred to in holy writings as deacons or ministers of God, but also as pastors. Ezekiel complained heavily of this, for these pastors cruelly and perversely fed the people [Ezekiel 34]. Homer called his king Agamemno, “shepherd of the people”. These pastors should not behave like soldiers or mercenaries, oppressing and skinning the people, but they should serve as shepherds. Princes are called fathers, for the Romans called their senators patres conscripti, “enlisted fathers.” Nor was there a greater or more ancient honour in the Commonwealth than to be called pater patriae, “father of the homeland.” Therefore, the divine commandment “Honour your father and your mother” must also apply to princes, who should give paternal adoration in return [Exodus 20:12]. Princes should never forget that they do not rule over beasts but over men, and that they themselves are also men. They should therefore be much better and superior to those men whom they rule. Otherwise, they are not fit to rule. We do not give any sheep command over the other sheep. It is given to a ram, and then to a shepherd above him. Just as a shepherd rules the sheep, so is a magistrate commissioned to rule his people. Therefore, magistrates should surpass their people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of a magistrate, and the difference between civil and ecclesiastical power (1561) in W. J. T. Kirby (ed.), The Zürich connection and Tudor political theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>X. …What is essential to the ministry cannot be changed without making another ministry. But the essence remaining untouched, it does not cease to be the same ministry, although a varied and manifold change as to the accidents may have taken place. The essence of the ministry is placed in this–that all saving truth pertaining to the conservation of faith and piety be retained and taught; that the true sacraments instituted by Christ may be administered; and that the people may be held under a legitimate government. The accidents make its state good or bad. The good is when the preaching of the Word is pure and entire without any mixture of error or superstition; when the sacraments are rightly celebrated according to the institution of Christ without addition, or detraction, or alteration; and the Christian people are governed in a holy manner according to the Word of God and not in a tyrannical manner. The bad on the other hand is when the truth preached is mixed with errors and superstitions; the sacraments are in different way altered and corrupted; and the government is either confused or unjust and tyrannical… But still it must not be thought that the ministry ought at once to cease and be extinguished on account of any corruption whatsoever and depraved state; as life is not at once extinguished, but can subsist in the midst of weakness and disease.</p></blockquote>

</figure><figure class="quote" id="q-32882f1932" data-kw="">
<blockquote><p>The reason why it is believed, that regeneration does not usually accompany baptism, is simply because no evidences of spiritual life appear in baptized children more than in those which remain unbaptized. The education of children should proceed on the principle that they are in an unregenerate state, until evidences of piety clearly appear, in which case, they should be sedulously cherished and nurtured. These are Christ’s lambs — ” little ones, who believe in Him” whom none should offend or mislead upon the peril of a terrible punishment. But though the religious education of children should proceed on the ground that they are destitute of grace, it ought ever to be used as a means of grace. Every lesson, therefore, should be accompanied with the lifting up of the heart of the instructer to God for a blessing on the means. “Sanctify them through thy truth; thy word is truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 26-27</span></figcaption>

</figure><figure class="quote" id="q-a9353d197e" data-kw="">
<blockquote><p>This is the sum of their answer, It is lawful for them, nay, they ought to prefer God before men. God commandeth us to bear witness of Christ; therefore it is in vain for you to command us to keep silence. But I have declared before in the third chapter, when this sentence taketh place, that we ought rather to obey God than men. God doth set men over us in such sort with power, that he keepeth still his own authority safe and sound. Therefore, we must obey rulers so far, that the commandment of God be not broken.

Whereas power and authority is lawfully used, then it is out of season to make comparison between God and man. If a faithful pastor do command or forbid out of the Word of God, it shall be in vain for men which are stubborn to object that we ought to obey God; for God will be heard by man. Yea, man is nothing else but an instrument of God. If a magistrate do his duty as he ought, a man shall in vain say that he is contrary to God, seeing that he dissenteth in nothing; yea, rather the contrary rule is then in force. We must obey God’s ministers and officers if we will obey him.

But so soon as rulers do lead us away from the obedience of God, because they strive against God with sacrilegious boldness, their pride must be abated, that God may be above all in authority. Then all smokes of honour vanish away. For God doth not vouchsafe to bestow honourable titles upon men, to the end they may darken his glory. Therefore, if a father, being not content with his own estate, do essay to take from God the chief honour of a father, he is nothing else but a man. If a king, or ruler, or magistrate, do become so lofty that he diminisheth the honour and authority of God, he is but a man.

We must thus think also of pastors. For he which goeth beyond his bounds in his office, (because he setteth himself against God:) must be despoiled of his honour, lest, under a colour or visor, he deceive. The office of a pastor is very excellent, the authority of the Church is great, yet so that no part of God’s power and Christ’s mastership be diminished. Whence we may easily gather that the pride of the Pope is ridiculous, who, when as he treadeth under foot the whole kingdom of Christ, and doth set himself openly against God, will yet, nevertheless, lie hid under the name of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 214-15.</span></figcaption>

But so soon as rulers do lead us away from the obedience of God, because they strive against God with sacrilegious boldness, their pride must be abated, that God may be above all in authority. Then all smokes of honour vanish away. For God doth not vouchsafe to bestow honourable titles upon men, to the end they may darken his glory. Therefore, if a father, being not content with his own estate, do essay to take from God the chief honour of a father, he is nothing else but a man. If a king, or ruler, or magistrate, do become so lofty that he diminisheth the honour and authority of God, he is but a man.

We must thus think also of pastors. For he which goeth beyond his bounds in his office, (because he setteth himself against God:) must be despoiled of his honour, lest, under a colour or visor, he deceive. The office of a pastor is very excellent, the authority of the Church is great, yet so that no part of God’s power and Christ’s mastership be diminished. Whence we may easily gather that the pride of the Pope is ridiculous, who, when as he treadeth under foot the whole kingdom of Christ, and doth set himself openly against God, will yet, nevertheless, lie hid under the name of Christ.”

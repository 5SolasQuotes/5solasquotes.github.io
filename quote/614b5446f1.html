<main class="wrap"><figure class="quote" id="q-614b5446f1" data-kw="">
<blockquote><p>Nor does it follow that they were dead in the guilt of that sin of ignorance, because they never repented of it. If they did not expressly and formally repent of it, yet they sought its pardon implicitly when they sought the pardon on all sins (even of secret sins). Nor was a special repentance to be exacted of them for this act more than for the other acts of which we do not read that they repented.

Otherwise we do not read that Noah repented of his drunkenness; or Lot of incest; or others for other sins. Still we do not doubt that they obtained the pardon of all their sins from God through faith in the Messiah. If many pious persons commit numerous sins out of ignorance and error (of which they never distinctly repent), this does not prevent their seeking and obtaining the pardon of them – saying with David, “cleanse thou me from secret faults” (Ps. 19:12). Why may we not say the same of the ancient polygamists?</p></blockquote>

</figure><figure class="quote" id="q-35317a98cc" data-kw="">
<blockquote><p>These things, beloved, we write unto you, not merely to admonish you of your duty, but also to remind ourselves. For we are struggling on the same arena, and the same conflict is assigned to both of us. Wherefore let us give up vain and fruitless cares, and approach to the glorious and venerable rule of our holy calling.

Let us attend to what is good, pleasing, and acceptable in the sight of Him who formed us. Let us look steadfastly to the blood of Christ, and see how precious that blood is to God, which, having been shed for our salvation, has set the grace of repentance before the whole world.

Let us turn to every age that has passed, and learn that, from generation to generation, the Lord has granted a place of repentance to all such as would be converted unto Him. Noah preached repentance, and as many as listened to him were saved. Jonah proclaimed destruction to the Ninevites; but they, repenting of their sins, propitiated God by prayer, and obtained salvation, although they were aliens [to the covenant] of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Epistle to the Corinthians</cite>, (90), 7 in Ante-Nicene Fathers, 1: 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-6e62898d0e" data-kw="">
<blockquote><p>But, whereas God is said to will the thing that he commands, here ariseth a question, how that can be said to be willed by God, which most commonly is not accomplished? For, albeit the will of command is accomplished, by the commanding of this or that, yet God’s will of the thing commanded seems not to be accomplished, unless the thing willed by God be sometimes brought to pass. The truth is, your opinion seems to be, That God not only willeth the salvation of the world, upon the condition of their repentance, (for that is no more to will their salvation, than their damnation) but that God willeth and desireth their salvation absolutely, in as much as he willeth and desireth their repentance.

I confess you do not in express terms profess as much; namely, that God willeth and desireth the repentance of Reprobates; yet hitherto you seem to tend, in this discourse of yours, though concerning this you say no more than this, That God gives means to help them to the performance of this obedience, so far as is meet for him: which while you profess, I doubt you understand not your own meaning; and therefore no marvel if others do not understand it: For, how far he doth help them, you express in a very uncertain manner; which is rather to conceal, than to discover and express your meaning. But I will endeavour to bolt it out.

These means you speak of are either moral only, consisting in instructing them wherein this obedience doth consist, and urging them by persuasion thereunto; or, in affording, besides this, some efficacious operation of God’s Spirit, to work them to this obedience. Now, this latter cannot be your meaning; for if this were afforded them, their obedience, certainly, would be wrought: but the world, of whom you speak, doe never perform this obedience. Now, in granting the other, there is not so much evidence of God’s will that they shall perform this obedience, as by the denying of this we have evidence, that his will is not that they shall perform this obedience.

Again, in respect of means moral, can any be saved without the means of true faith and true repentance? I think you will not say they can: Then consider, have all men sufficient instruction unto the performance of true faith and true repentance? How will you be able to make this good? Hand over head, you say, God gives means to help them to the performance of this obedience, so far as is meet for him to do: yet, I am persuaded, you are not able to make this good, taking it according to the confuse generality wherein you express it. For, is it not meet for God to afford any Nation or particular persons his word and Gospel, as well as it is meet for him to afford it us?

Nay, is it not as meet for God to afford any other person both the outward means, and the inward efficacious operation of his holy Spirit, to work them unto faith and true repentance, as well as by these means he hath been pleased to work us hereunto? This meetness, what is it but that which Schoolmen call, Justitia condecentiae, and which they profess doth accompany every action of God? So that had God afforded the same grace to others which he hath afforded unto us, he had carried himself therein meetly, that is, justly, justitia condecentiae.

Again, had he denied the same grace to us which he hath denied unto others, he had herein also carried himself meetly, or decently, that is, justly, justitia condecentiae. I am sorry to observe from such good men’s pens such illusions to have their course, to the obscuring of the grace of God, and his sovereignty of dispensing it to whom he will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), pp 98-100.</span></figcaption>

ng%3B+for+if+this+were+afforded+them%2C+their+obedience%2C+certainly%2C+would+be+wrought%3A+but+the+world%2C+of+whom+you+speak%2C+doe+never+perform+this+obedience.+Now%2C+in+granting+the+other%2C+there+is+not+so+much+evidence+of+God%E2%80%99s+will+that+they+shall+perform+this+obedience%2C+as+by+the+denying+of+this+we+have+evidence%2C+that+his+will+is+not+that+they+shall+perform+this+obedience.%0A%0AAgain%2C+in+respect+of+means+moral%2C+can+any+be+saved+without+the+means+of+true+faith+and+true+repentance%3F+I+think+you+will+not+say+they+can%3A+Then+consider%2C+have+all+men+sufficient+instruction+unto+the+performance+of+true+faith+and+true+repentance%3F+How+will+you+be+able+to+make+this+good%3F+Hand+over+head%2C+you+say%2C+God+gives+means+to+help+them+to+the+performance+of+this+obedience%2C+so+far+as+is+meet+for+him+to+do%3A+yet%2C+I+am+persuaded%2C+you+are+not+able+to+make+this+good%2C+taking+it+according+to+the+confuse+generality+wherein+you+express+it.+For%2C+is+it+not+meet+for+God+to+afford+any+Nation+or+particular+persons+his+word+and+Gospel%2C+as+well+as+it+is+meet+for+him+to+afford+it+us%3F%0A%0ANay%2C+is+it+not+as+meet+for+God+to+afford+any+other+person+both+the+outward+means%2C+and+the+inward+efficacious+operation+of+his+holy+Spirit%2C+to+work+them+unto+faith+and+true+repentance%2C+as+well+as+by+these+means+he+hath+been+pleased+to+work+us+hereunto%3F+This+meetness%2C+what+is+it+but+that+which+Schoolmen+call%2C+Justitia+condecentiae%2C+and+which+they+profess+doth+accompany+every+action+of+God%3F+So+that+had+God+afforded+the+same+grace+to+others+which+he+hath+afforded+unto+us%2C+he+had+carried+himself+therein+meetly%2C+that+is%2C+justly%2C+justitia+condecentiae.%0A%0AAgain%2C+had+he+denied+the+same+grace+to+us+which+he+hath+denied+unto+others%2C+he+had+herein+also+carried+himself+meetly%2C+or+decently%2C+that+is%2C+justly%2C+justitia+condecentiae.+I+am+sorry+to+observe+from+such+good+men%E2%80%99s+pens+such+illusions+to+have+their+course%2C+to+the+obscuring+of+the+grace+of+God%2C+and+his+sovereignty+of+dispensing+it+to+whom+he+will.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+treatise+of+Mr.+Cotton%E2%80%99s%2C+Clearing+certain+doubts+concerning+predestination.+Together+with+an+examination+thereof%2C+%28London%3A+Andrew+Crook%2C+1646%29%2C+pp+98-100.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e62898d0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e62898d0e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/08/william-twisse-does-god-desire-the-repentance-of-the-reprobate/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Repentance is a detestation of wicked life, and a turn to the better. Whence the parts of repentance are two: withdrawal from evil, and approach to the good, Psalm 34:14, depart from evil, and do good. It is evident that this repentance, insofar as it is saving conversion to God, that is, Sanctification begun or continued, pertains to the Gospel: (1.) Because it is an effect of evangelical doctrine. (2.) Because the baptism of repentance, which John preached, Mk. 1:4, is not a sacrament of the Law, but of the Gospel. (3.) Because the Gospel alone works that sorrow that is according to God, 2 Cor. 7:10. But the Law works wrath, Rom. 4:15. (4.) Because it immediately flows from the remission of sins, insofar as the Gospel is the preaching of the remission of sins and of repentance, Mk. 6:12.</p></blockquote>

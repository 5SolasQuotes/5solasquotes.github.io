<main class="wrap"><figure class="quote" id="q-40785982bc" data-kw="">
<blockquote><p>Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, (RHB), vol. 3, pp. 47-75</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-007cf12553" data-kw="">
<blockquote><p>There are two main views. One of them has come to be called corruptionism, and it holds that at death the human being ceases to exist (unless and until God resurrects him), even though the soul carries on. The other view is called survivalism, and it hold that the human being persists in existence after death and even before any resurrection, though only as constituted by his soul… …the position I favor is the survivalist one. For I have said that after death the human being persists, albeit in a severely reduced or incomplete state. Now the survivalist view is characterized as the view that after death but before the resurrection, the soul constitutes the human being… a form qua [as] form exists only together with the substance of which it is the form. However, since the substance of which the human soul is the form is not entirely coporeal, that substance subsists and continues beyond the death of the body because the death of the body involves the cessation of only the corporeal aspect of said substance, not the incorporeal aspect. Hence, because the substance that the human soul is the form of persists beyond the death of the body, the soul persists beyond the death of the body… this thing that exists beyond the death of the body is also a substance–albeit an incomplete one–and, since this incomplete substance just is the human being in a radically impaired state, it is quite natural to say that the soul that survives death just is the human being surviving death (again, in a radically incomplete state)… …For the corruptionist position holds, again, that at death the human being cease to exist, even though the soul carries on. Yet the human being is the substance of which the soul is a form. So, if the human being ceases to exist at death, then that means that the substance of which the soul is the form ceases to exist at death. And in that case, how could the soul carry on? How could a form exist apart from the substance of which it is the form?… There are two further important arguments for survivalism, one philosophical and one theological. The first is this… just as it is the human being who sees, and not the eye, it is the human being who thinks, and not the intellect. The eye sees only in a loose sense, and the intellect thinks only in a loose sense. Now, on both the survivalist view and the corruptionist view, the intellect survives the death of the body and thought occurs as well. But if thought occurs and if on Aquinas’s own principles it is strictly speaking only the human being, and not the intellect, which thinks, then it follows that there must be a sense in which the human being survives as well. The second, theological argument is this. Being a Christian theologian, Aquinas holds that, after death, the soul is rewarded, punished, or purged in light of the deeds of this present life. But it makes sense to reward, punish, or purge only perons, not mere parts of persons. It makes no sense, for example, to speak of rewarding or punishing Bob’s foot or hi pancreas for Bob’s good or bad deeds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, pp. 497-502 in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pt. 4, ch. 11</span></figcaption>

</figure><figure class="quote" id="q-ba6637706b" data-kw="">
<blockquote><p>What is ‘happiness’ after all? Is it a matter of ‘getting what you want’? Is it a matter of maximizing pleasure and minimizing pain, as Bentham and Mill held (albeit in different ways)? On these conceptions, happiness seems to be definable in terms of the subjective states of the agent. On an Aristotelian or classical natural law conception, though, it is something objective, a matter of living in accordance with one’s nature, understood as a fixed essence entailing a natural end or purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 15, ‘Self-ownership, Libertarianism, and Impartiality’, p. 368</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-088949c4d2" data-kw="">
<blockquote><p>If it be man’s chief end to glorify God and enjoy Him for ever, then man has attained his end, the sole purpose for which he was made, the entire object for which he exists, when he enters into communion with God, abides in His presence, streaming out to Him in all the emotions, I do not say appropriate to a creature in the presence of his Maker and Lord, apprehended by him as the Good Lord and Righteous Ruler of the souls of men, but appropriate to the sinner who has been redeemed by the blood of God’s own Son and is inhabited by His Spirit and apprehends his Maker as also his Saviour, his Governor as also his Lover, and knows the supreme joy of him that was lost and is found, was dead and is alive again,—and all, through the glory of God’s seeking and saving love. He who attains to this experience has attained all that is to be attained. He is absorbed in the beatific vision. He that sees God shall be like Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith &amp; Life: ‘Conferences’ in the Oratory of Princeton Seminary</cite>, (1916), “Prayer as a Practice”, p. 439</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“If it be man’s chief end to glorify God and enjoy Him for ever, then man has attained his end, the sole purpose for which he was made, the entire object for which he exists, when he enters into communion with God, abides in His presence, streaming out to Him in all the emotions, I do not say appropriate to a creature in the presence of his Maker and Lord, apprehended by him as the Good Lord and Righteous Ruler of the souls of men, but appropriate to the sinner who has been redeemed by the blood of God’s own Son and is inhabited by His Spirit and apprehends his Maker as also his Saviour, his Governor as also his Lover, and knows the supreme joy of him that was lost and is found, was dead and is alive again,—and all, through the glory of God’s seeking and saving love. He who attains to this experience has attained all that is to be attained. He is absorbed in the beatific vision. He that sees God shall be like Him.”

— B. B. Warfield, Faith &amp; Life: ‘Conferences’ in the Oratory of Princeton Seminary (1916), “Prayer as a Practice”, p. 439">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+it+be+man%E2%80%99s+chief+end+to+glorify+God+and+enjoy+Him+for+ever%2C+then+man+has+attained+his+end%2C+the+sole+purpose+for+which+he+was+made%2C+the+entire+object+for+which+he+exists%2C+when+he+enters+into+communion+with+God%2C+abides+in+His+presence%2C+streaming+out+to+Him+in+all+the+emotions%2C+I+do+not+say+appropriate+to+a+creature+in+the+presence+of+his+Maker+and+Lord%2C+apprehended+by+him+as+the+Good+Lord+and+Righteous+Ruler+of+the+souls+of+men%2C+but+appropriate+to+the+sinner+who+has+been+redeemed+by+the+blood+of+God%E2%80%99s+own+Son+and+is+inhabited+by+His+Spirit+and+apprehends+his+Maker+as+also+his+Saviour%2C+his+Governor+as+also+his+Lover%2C+and+knows+the+supreme+joy+of+him+that+was+lost+and+is+found%2C+was+dead+and+is+alive+again%2C%E2%80%94and+all%2C+through+the+glory+of+God%E2%80%99s+seeking+and+saving+love.+He+who+attains+to+this+experience+has+attained+all+that+is+to+be+attained.+He+is+absorbed+in+the+beatific+vision.+He+that+sees+God+shall+be+like+Him.%E2%80%9D%0A%0A%E2%80%94+B.+B.+Warfield%2C+Faith+%26+Life%3A+%E2%80%98Conferences%E2%80%99+in+the+Oratory+of+Princeton+Seminary+%281916%29%2C+%E2%80%9CPrayer+as+a+Practice%E2%80%9D%2C+p.+439&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F088949c4d2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/088949c4d2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=If%20it%20be%20man%E2%80%99s%20chief%20end,sees%20God%20shall%20be%20like%20Him&amp;text=If%20it%20be%20man%E2%80%99s%20chief%20end%20to%20glorify&amp;text=He%20that%20sees%20God%20shall%20be%20like%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

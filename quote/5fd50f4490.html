<main class="wrap"><figure class="quote" id="q-5fd50f4490" data-kw="">
<blockquote><p>But how does this oath, or the act of parliament requiring ministers to take this oath, make ministers dependent on the magistrate in the exercise of their ministry, when the oath only contains the duty of a subject, and speaks nothing either of the ministry or exercise of the ministry? ‘Yea, but the act enjoining it, makes it an essential requisite to a minister of this national Church.’ Answer: There is no such metaphysical term in the act as essential, but only that ministers of this national Church shall take it. The Church is considered not simply as a Church, but as national, having national and legal privileges, which they are deprived of that refuse this oath. It does not say he shall not be a minister if he take it not, but he shall not have the countenance and protection of civil authority, he shall not enjoy his benefice, shall not have allowance form the magistrate for, and encouragement in the exercise of his ministry. He shall not enjoy the peaceable public exercise of his ministry. And what wonder that the magistrate will not countenance them as ministers who will not bind themselves to him as subjects? that he will not let them preach to his subjects if he can hinder them, who will not promise and swear when required that they will not preach treason and rebellion against him, when they should teach them subjection and obedience to Christ? that he will not let them teach others what they call their duty to God who will not do their duty to their sovereign, but separate these things which God has conjoined, ‘Fear God, honor the king’? See more of this in the Seasonable Admonition and Exhortation of the Commission of the General Assembly, anno 1698, which you have neither obeyed neither yet given a reason of your disobedience; and in a Treatise against Separation, by Mr. Alexander Shields, one of your teachers, to whom you became his enemy, because he told you the truth… …But [the magistrate] shows by this act whom he will countenance and protect in the exercise of the ministry, to whom he will give or allow the stipends and legal maintenance to encourage them in the exercise of the ministry, whom he will suffer to pass and repass, and exercise their ministry without hazard or molestation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh] 1712) Hamilton was a Church of Scotland minister., p. 35</span></figcaption>

</figure><figure class="quote" id="q-87f1be735e" data-kw="">
<blockquote><p>This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Scandal</cite>, On how Circa Sacra flows out of the 4th Commandment: | The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal… (1659), pt. 3, ch. 13, pp. 241-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-9d7e6837e2" data-kw="">
<blockquote><p>Answer [of Rutherford]: It is a calumnious consequence: pastors and teachers will not be judged by the magistrate in things merely ecclesistical, to stand to his ecclesiastical decision, as if his lips, ex officio, should preserve knowledge; Therefore, pastors and doctors do exempt themselves from the lawful power of the magistrate in his civil judging by the sword; it is as if they would say, Churchmen refuse to submit to an usurped and unlawful power of the magistrate; Therefore, they refuse to submit to their lawful power.</p></blockquote>

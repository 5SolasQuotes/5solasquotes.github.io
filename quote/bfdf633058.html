<main class="wrap"><figure class="quote" id="q-bfdf633058" data-kw="">
<blockquote><p>Question: But why is God pleased to promise to give unto his people in Covenant spiritual blessings as well as temporal? … …Spiritual blessings are necessary for them in relation unto that eternal life… Heb. 12:13… Lo, here is a necessity of holiness and regeneration for salvation, and they are congruous, and fitting us for salvation, or eternal life… It is meet to enjoy grace before we come to enjoy glory; it is meet to have a conformity to Christ on his cross before we come to have a conformity to Christ in his crown, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bowels of Tender Mercy Sealed</cite>, ... (London, 1660), pt. 2, ch. 1, p. 337</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

<blockquote><p>712. It has also been said that God invites the sinner to the possession of these goods under the condition of faith which we described in chapter 14. This is the proposition of the covenant of grace.

713. But we have warned that God does not weigh this condition as being brought about by the sinner’s own power. Indeed, the sinner is a slave to sin, and inept to any spiritual good on his own.</p></blockquote>

</figure><figure class="quote" id="q-acfe48b0bc" data-kw="">
<blockquote><p>John Owen’s (1616–1683) four-volume commentary on the epistle to the Hebrews represents the apex of his literary career and exemplifies many of the exegetical methods of the post-Reformation. This thesis is the first detailed analysis of his introductory discourses, or “exercitations,” on Hebrews… this study is a descriptive analysis of the text and context of Owen’s discourses on the Messiah… Chapter 5 considers the nature of faith in the Old Testament, noting especially the importance of the Abrahamic covenant for what Owen calls “the oneness of the church.” In contrast, chapter 6 provides an extended analysis of the role of the law in the Mosaic covenant, considering in particular the highly problematic question of the recapitulation of the covenant of works and the nature of the old and new covenants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-w-tweeddale.html">John W. Tweeddale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sure Foundation</cite>, 2017</span></figcaption>

iv>
</figure><figure class="quote" id="q-a6876fd9dd" data-kw="">
<blockquote><p>It follows not that they [good works] are con-causes, or joint-causes with Christ, but only conditions; just as a man’s journeying on foot or horse, to a city, or a kingdom to inherit it, is the way, condition, of his entering the city; But it is not his charter, or law-title, or right to enjoy the crown, as his inheritance; any effective influence to the title of the crown of Heaven, I dare not ascribe to any works in us, or to any but to Christ; but undeniably, good works are not so much as conditions of justification, they follow a man justified, but go not before justification; no more than the apple goes before the tree, or the cistern before the fountain; nor are they the conditions of the Covenant of Grace: they are the conditions of covenanted ones, not of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, (London, 1648), pt. 2, ch. 48, ‘Antinomians hold that the believer cannot sin against God…’, p. 63, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

"_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6a77a27b91" data-kw="conditions">
<blockquote><p>Third, if the covenant be viewed in relation to the first sanction in Christ, it has no previous condition, but rests upon the grace of God and the merit of Christ alone. But if it is considered in relation to its acceptance and application to the believer, it has faith as a condition (uniting man to Christ and so bringing him into the fellowship of the covenant). If, however, in relation to its consummation with faith (obedience and the desire of holiness), it has the relation of condition and means because without them no one shall see God. Source of explanation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2c8917f261" data-kw="">
<blockquote><p>And forasmuch also as they have been so wonderfully abused within this Realm, to the high contumely and dishonour of God, and have been great cause of blindness, and of much contention among the king’s majesty’s loving subjects, and were like so to be still if they should remain, and chiefly seeing God’s word speaketh so much against them.

You may hereby right well consider, what great causes and grounds the king’s majesty had, to take them away within his Realm, following herein the example of the godly king Ezechias, who brake down the brazen serpent, when he saw it worshipped and was therefore greatly praised of God, not withstanding at the first, the same was made and set up by God’s commandment, and was not only a remembrance of God’s benefits, before received, but also a figure of Christ to come. And not only Ezechias, but also Manasses, and Josaphat and Josias the best kings that were of the Jews, did pull down images in the time of their Reign.

Consider than how Godly an act is this to take away so many images, not made by God’s commandments, whereunto contrary to God’s commandments and his honour were so many Idolatries committed. For unto Christ Prince’s office, and cure appertaineth the defence of God’s true word &amp; Christ[ian] religion, &amp; to take away all those things, which hinder or let true godliness and religion, or make trouble &amp; contention, within their realms.

So good children you have heard the true meaning of these words. Thou shalt make to thee no graven image, thou shalt not bow down &amp; worship the same, the which I pray you grave deeply in your memories, that when you be demanded, what is meant by the words heretofore rehearsed, you may answer. This commandment forbiddeth us all kind of idolatry as well bodily as ghostly, &amp; inhibiteth us to give the honour which is due unto God to any creature or image of creature, but to worship God alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechismus, that is to say, a short instruction into Christian religion for the singular commodity and profit of children and young people</cite>, (n.p., 1548), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43153d271d" data-kw="">
<blockquote><p>The argument of this paper is that Byzantine Iconoclasm was a response to the rise of Islam. This is an old-fashioned point of view. First advanced by the Byzantines themselves, the theory of Saracen influence was accepted by older scholarship on the subject, and long remained academically respectable. In the last generation, however, it has fallen out of favour. Contemporary literature on the subject, though far from agreed in other respects, is virtually unanimous that, whatever may have been the causes of Iconoclasm, Islam was not among them… the assumption that the Byzantines paid attention to what the successful Arabs believed is now deemed unproven, unnecessary or even incredible. Yet the case for Islam seems so effortless that the determination to exclude it must strike the outsider as an almost wilful exercise of professional scepticism… it is considerably simpler to assume that it was the role of Islam to make epidemic what had hitherto been merely endemic [in Christianity]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patricia-crone.html">Patricia Crone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 3, ‘Islam, Judeo Christianity &amp; Byzantine Iconoclasm’ in From Kavad to al-Ghazali: Religion, Law &amp; Political Thought in the Near East c. 600 – c. 1100 Pre (Ashgate, 2005), pp. 59-96, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

%20is,hitherto%20been%20merely%20endemic%20%5Bin%20Christianity&amp;text=The%20argument%20of%20this%20paper%20is%20that%20Byzantine&amp;text=what%20had%20hitherto%20been%20merely%20endemic%20%5Bin%20Christianity" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aebb1fc9b3" data-kw="">
<blockquote><p>Let no one seize my statements as an excuse for saying that it is lawful for images or pictures to be venerated, since at times God and Christ seem effectively to declare themselves to us there. For we have clear instruction not to make ourselves images to worship. But regarding scriptural words and sacraments, nothing prevents our worship in hearing or receiving them, because they are instituted by the word, will and command of God, so that we may be called to divine service, which consists of worship. Nor should you gather from this that the elements of the Eucharist are to be worshipped. For whatever strength the symbols have is from the Holy Spirit, the words of the Lord and his institution, which are nothing without the use of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), §51, p. 87.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-498d889bda" data-kw="">
<blockquote><p>‘The honor rendered to the image passes to the prototype,’ to the model or original… This is the locus classicus of the defenders of the images in the Byzantine Iconoclastic Controversy… The sentence just cited is taken from St. Basil’s late fourth century anti-Arian treatise On the Holy Spirit, where it had served to illustrate the unifying image relation of the Son to the Father in the Divine Trinity, a relation first expressed by St. Paul when he said that Christ was the Image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhart-b-ladner.html">Gerhart B. Ladner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Concept of the Image</cite>, vol. 7 (1953), pp. 3-34, p. 3</span></figcaption>

</figure><figure class="quote" id="q-1dff4e8341" data-kw="">
<blockquote><p>Your long labor in setting down the faults to be found in our Liturgy is to small purpose. The Nonconformists do except against many things appointed in the Book, as inconvenient at least, and such as should be taken away or reformed, as the reading of Apocryphal books under the title of holy Scripture, specially such parts as be corrupt for matter: The cross and surplice as idolothites by participation and signs of mystical signification: The corruptions in the translations: and some things in the forms of burial, matrimony, thanksgiving for women after child-bed, etc. But these they condemn not as idolatry, nor as that which makes the worship itself false and idolatrous. It is one thing to say such a rite is inconvenient, superstitious, scandalous borrowed from the Papists, not warranted by the Word of God, in the use will-worship, if the word be taken largely; another that the worship itself is false and idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 2, p. 29</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Your long labor in setting down the faults to be found in our Liturgy is to small purpose. The Nonconformists do except against many things appointed in the Book, as inconvenient at least, and such as should be taken away or reformed, as the reading of Apocryphal books under the title of holy Scripture, specially such parts as be corrupt for matter: The cross and surplice as idolothites by participation and signs of mystical signification: The corruptions in the translations: and some things in the forms of burial, matrimony, thanksgiving for women after child-bed, etc. But these they condemn not as idolatry, nor as that which makes the worship itself false and idolatrous. It is one thing to say such a rite is inconvenient, superstitious, scandalous borrowed from the Papists, not warranted by the Word of God, in the use will-worship, if the word be taken largely; another that the worship itself is false and idolatrous.”

<main class="wrap"><figure class="quote" id="q-33a31624e7" data-kw="">
<blockquote><p>The ancient emperor Justinian commanded that, in the holy administration, all things should be pronounced with a clear, loud, and treatable voice, that the people might receive some fruit thereby. These men, lest the people should understand them, mumble up all their service, not only with a drowned and hollow voice, but also in a strange and barbarous tongue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/latin.html">Latin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59d8e8b056" data-kw="">
<blockquote><p>For a memorial of this history, which had happened in the desert, that brazen serpent was preserved among the children of Israel for more than 700 years; and until the misuse of worship and adoration arose, they did not judge that they were sinning against the Law (Ex. 20:4) by preserving this image. However, when they began to burn incense to this image, Hezekiah judged that this militated against that law of God, and therefore he broke that serpent in pieces (2 Kings 18:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, Second Topic (Images), Sec. III</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/images.html">Images</a></span></div>

</figure><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking; that poor souls, which ought to have been ruled by the doctrine of Christ, are oppressed by cruel bondage; that nothing is seen in the Christian Church that is not deformed and debased; that the grace of Christ not only lies half-buried, but is partly torn to pieces, partly altogether extinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, p. 20</span></figcaption>

</figure><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a></span></div>

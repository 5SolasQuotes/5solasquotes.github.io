<main class="wrap"><figure class="quote" id="q-a29b9b4b09" data-kw="">
<blockquote><p>Ye know the civil magistrate, or church sessions, have much power about matters belonging to husband and wife, parents and children, so as to censure and punish them for their unnatural carriage towards each other and to see every one do duty to another; and yet neither the civil magistrate, nor church session has marital or husbandly power over the wife, or parental power over the children so as they might challenge the same duties from them to be done to themselves which the wife owes to her husband, or the children to the parents; the husband and parents only have that power…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors Toleration, Erastianism</cite>, … (d. 1667; Edinburgh, 1692), section 3, pp. 107-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-238a15e48c" data-kw="">
<blockquote><p>Conclusion III. We hold that the Church of God has power to prescribe ordinances rules, or traditions touching time and place of God’s worship and touching order and comeliness to be used in the same; and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general Councils or particular Synods, we have care to maintain and observe; these caveats being remembered: first that they prescribe nothing childish or absurd to be done; secondly that they be not imposed as any parts of God’s worship; thirdly, that they be severed from superstition or opinion of merit; lastly that the Church of God be not burdened with the multitude of them. And thus much we hold touching traditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic: or, A Declaration showing how near we may come to the present Church of Rome in sundry points of religion: and wherein we must forever depart from them</cite>, (1598), pp. 136-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>[The first time was when the ceremonial law was obliging under the Mosaic system.] The second time was from the ascension of Christ, till about the time of the destruction of the Temple and city: in which ceremonies ceased to bind conscience and remained indifferent. Hereupon Paul circumcised Timothy: the apostles after Christs ascension, as occasion was offered were present in the temple, Acts 3:1; And the council of Jerusalem tendering the weakness of some believers, decreed that the Church for a time should abstain from strangled [animals] and blood. And there was good reason of this, because the Church of the Jews was not yet sufficiently convicted that an end was put to the ceremonial law by the death of Christ. In the third time, which was after the publishing of the Gospel, ceremonies of the Jews Church became unlawful, and so shall continue to the world’s end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, (1596), pp. 21-22</span></figcaption>

</figure><figure class="quote" id="q-a45f6ee05b" data-kw="">
<blockquote><p>If it be asked, whether the consent of parents be essential to marriage? the common sentence will resolve it, Multa impediunt matrimonium contrahendum, quae non dirimunt contractum, so that consent is necessary, necessitate praecepti, sed non necessitate medii [by the necessity of precept, but not by a necessity of means]; though by human constitution such marriages may be disallowed, and the issue repute as unlawful, but the marriage cannot be annulled, l. 11. de stat. hom. l. 13 §. 6. de Adult, by which laws, not only the Issue of such marriages are excluded from succession, but the marriage itself insinuate to be null, which human constitutions cannot reach, though the magistrate or minister, celebrator of the marriage, may refuse to proceed without consent of the parents; as by the law and custom of Holland, Art. 3. Ord. Pol. It is statute that… where the parties are minor, they be not married without consent of their parents; and where they are both major, intimation must be made to the parents, and if they appear not, their consent is presumed; and if they do appear and dissent, they must condescend upon the reasons, that it may be cognosced whether they be sufficient or not: And if the marriage do otherways proceed, they account it null… neither do the civil constitutions of princes annul or dissolve marriage, whatever they may work as to the interest of the married persons… Yea, between Jews and Christians, for diversity of religion cannot annul it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Title 4, ‘Conjugal Obligations’ in The Institutions of the Law of Scotland Deduced from its Originals</cite>, … (Edinburgh: Anderson, 1681), pp. 28-44, p. 32</span></figcaption>

<blockquote><p>…to say [as the opponent does], that the Word teaches the Church to abstain from blood (Acts 15), is a part of the perfection of the Scripture, and yet the Scripture teaches that abstinence from blood, not as an eternal and unalterable Law, for we are not now tied to abstain from blood, therefore the Scripture may make the man of God perfect in some works that are alterable and changeable: This (I say) is no answer, for saying that God should now make abstinence from blood and things strangled indifferent (Acts 15), as He made them in that interval of time when the [Levitical] ceremonies were mortal [alive] but not deadly and unlawful, as is clear in that Paul circumcised Timothy (Acts 16:1-3), that rite being then indifferent; and yet he writes in another case when the Gospel is now fully promulgated, that to be circumcised makes a man a debtor in conscience to keep the whole Law of Moses, and so to abstain from eating of blood and things strangled must be a falling from the grace of Christ and an apostasy from the Gospel (Gal. 5:1-7). The like I say of observing of days (Rom. 14:5-6) which were indifferent and [yet] in another case (Gal. 4:9-10; Col. 2:16-17) [were] deadly, unlawful and not necessary. So the matter (Acts 15), which in the case of scandalizing the weak, is abstinence from things indifferent, say ‘that they are indifferent’ binds as a perpetual law to the end of the world, and binds us this same very day (Rom. 14:20) in the morality of it, as abstinence from murdering one for whom Christ died, (Rom. 14:15; 1 Cor. 8:12-13; 1 Cor. 10:26-28). And upon the ground laid by prelates, which is most false and untrue, to wit, that many positive things in Church government, such as are [by] prelates deemed to be warranted by apostolic, though not by Divine, right: ceremonies and crossing, kneeling to bread, altars, surplice, rochet, corner-cap, yea, and circumcision, a passover lamb, and all the Jewish ceremonies, though with another spirit and intention than to shadow forth Christ to come in the flesh, [are] imagined to be indifferent and alterable things, we hold that all these are to be abstained from as eating of blood and things strangled of old were. If you say they are as indifferent as blood and some meats were in the case (Acts 15; Rom. 14; 1 Cor. 8; 1 Cor. 10), its a most false principle as we shall hear, and therefore the Scripture, if it make the man of God perfect to every good work, as the apostle says, it must teach us to abstain from all these as scandalous [things], and must set down as perfect and particular directions for Church-Government as Paul does (Rom. 14) set down a particular platform, how we shall eschew murder for scandalizing our brethren in the use of things indifferent, is spiritual murder (Rom. 14:15,20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Introduction, p. 8-9</span></figcaption>

monies, though with another spirit and intention than to shadow forth Christ to come in the flesh, [are] imagined to be indifferent and alterable things, we hold that all these are to be abstained from as eating of blood and things strangled of old were. If you say they are as indifferent as blood and some meats were in the case (Acts 15; Rom. 14; 1 Cor. 8; 1 Cor. 10), its a most false principle as we shall hear, and therefore the Scripture, if it make the man of God perfect to every good work, as the apostle says, it must teach us to abstain from all these as scandalous [things], and must set down as perfect and particular directions for Church-Government as Paul does (Rom. 14) set down a particular platform, how we shall eschew murder for scandalizing our brethren in the use of things indifferent, is spiritual murder (Rom. 14:15,20).”

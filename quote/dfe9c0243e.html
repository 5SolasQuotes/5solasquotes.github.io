</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-780b169739" data-kw="">
<blockquote><p>It is the Lord, particularly Jesus Christ, who gave this law in the name of the Trinity. This is plain from the Scripture, Acts 7:38; Heb. 12:24-26. It was He that brought the people out of Egypt, and that appeared in the bush that burned with fire, and yet was not consumed, giving commission to Moses for their deliverance, Ex. 3:2-8.</p></blockquote>

</figure><figure class="quote" id="q-a6d63b8e1f" data-kw="">
<blockquote><p>It reproves and condemns the church of Rome, who from the Alpha of their religion to the Omega, are wholly idolatrous. They make images of God the Father,—painting him in their church windows as an old man,—and an image of Christ on the crucifix; and, because it is against the letter of this commandment, therefore they sacrilegiously blot out the second commandment out of their catechises, dividing the tenth commandment into two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, Second Commandment, p. 96</span></figcaption>

</figure><figure class="quote" id="q-034cea6e81" data-kw="">
<blockquote><p>…as Papists say, their unwritten traditions are agreeable to the Word, and though beside Scripture, yet not against it: and [are] the very will of God no less than the written Word; and let Formalists assure us that their positive additaments of surplice and cross are the same which God commands in the Scriptures by the prophets and apostles, and though beside, yet not contrary to the Word: But I pray you what better is the distinction of beside the Word, not contrary to the Word of God, out of the mouth of Papists, to maintain unwritten traditions, which to them is the express Word of God, than out of the mouth of Formalists, for their unwritten positives, which are worse than Popish traditions in that they are not the express Word of God, by their own grant?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), p. 40</span></figcaption>

</figure><figure class="quote" id="q-5f6717e9f4" data-kw="">
<blockquote><p>The worst men and the most superstitious will yet pretend the honoring of God. So it is again in regard of those days that men have set apart for God, and it is that which has settled men in the superstitious observation of them, that it is for the honor of Christ. ‘What’ (say they) ‘shall we not honor the birth of our blessed Savior?’ What a profaness, what a disrespect is this unto Jesus Christ? ‘Well let others do what they will, for our parts we will do it, for hereby we shall do honor unto our blessed Savior.’ So the Papists for the adoration of images, say they, ‘What not regard, not to reverence the image the picture of our blessed Savior and of the holy saints?’ And the truth is if it be duly weighed, there is the same reason of images of Christ and the saints, and of days set apart for the honor of Christ by man’s invention; and there is as fair a pretence of honoring Christ by setting up his image before me to put me in mind of Him as of honoring of Him by keeping a day of mine own appointment. There is (I say) the same reason of both, and whatsoever argument any man shall bring me against the one, I dare undertake to make it good to be against the other. As now, is not natural reason as strong to set up the picture of the King to honor him (and you do it for that end) is not this as much as to keep a day once a year to remember him? So the reason may be as strong to honor Christ by way of picture as to honor Him by observing any day set apart for that end by the inventions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea</cite>, … (London: Cole, 1650), on Hos. 5:6, pp. 408-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

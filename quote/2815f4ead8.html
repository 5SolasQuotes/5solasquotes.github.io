<main class="wrap"><figure class="quote" id="q-2815f4ead8" data-kw="">
<blockquote><p>Again, hereby all Popish corruptions and mixtures brought into this sacrament [of baptism] are confuted and condemned, as their cream, their tapers [candles], their crosses, their censers, their salt, their spittle, their holy-water, their exorcisings and conjurations, having also an opinion of salvation and worship annexed unto them… True it is, if all the other parts and actions be observed, these inventions and additions, which are so many abuses make not baptism void, neither bring a nullity therof…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), Ch. 5, ‘Of the third outward part of baptism’, pp. 146-7</span></figcaption>

<blockquote><p>Sitting we think not so necessary as that there could not be a sacrament without it, but to the due ministration of the sacrament we think a table-gesture necessary. … When as we only ground upon Christ and his apostles sitting, and other rites, the necessity of a table-gesture, not to the essence of a sacrament, but to the due ministration of that action… Sitting we think ought not to be changed, no not into standing, without some weighty consideration of some urgent occasion, because it was the gesture of Christ, his apostles, and the apostolical kirks; it is the ordinary gesture of guests at feasts, and resembles best the familiar access of the soul to the spiritual table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of our Arguments Against Kneeling in the Act of Receiving the Sacramental Elements of Bread &amp; Wine Impugned by Mr. Michelsone</cite>, (Amsterdam, 1620), ‘Answer to his Ten Arguments for Kneeling’, pp. 72 &amp; 74-75</span></figcaption>

<blockquote><p>That the very body of Christ is offered in the Lord’s Supper. For as we take the bread to be the body of Christ sacramentally by resemblance, and no otherwise, so the breaking of bread is sacramentally the sacrificing or offering of Christ upon the cross. And thus the fathers have termed the eucharist an immolation of Christ, because it is a commemoration of his sacrifice upon the cross. Augustine, Epistle 23, ‘Neither does he lie which says Christ was offered. For if sacraments had not the resemblance of things whereof they are sacraments, they should in no wise be sacraments. But from a resemblance, they often take their names.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-22d038a2e3" data-kw="">
<blockquote><p>Problem: Whether the Lord’s Supper can be said directly and proximately to seal the grace of regeneration? Response: It seals the continuation and excitation of it, or of its terminus, namely, faith (as it is an organ) primarily, and new obedience secondarily. But the grace of regeneration which is the cause of faith it designates consequently and mediately, as something presupposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Problem: Whether the Lord’s Supper can be said directly and proximately to seal the grace of regeneration? Response: It seals the continuation and excitation of it, or of its terminus, namely, faith (as it is an organ) primarily, and new obedience secondarily. But the grace of regeneration which is the cause of faith it designates consequently and mediately, as something presupposed.”

— Gisbertus Voetius, Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProblem%3A+Whether+the+Lord%E2%80%99s+Supper+can+be+said+directly+and+proximately+to+seal+the+grace+of+regeneration%3F+Response%3A+It+seals+the+continuation+and+excitation+of+it%2C+or+of+its+terminus%2C+namely%2C+faith+%28as+it+is+an+organ%29+primarily%2C+and+new+obedience+secondarily.+But+the+grace+of+regeneration+which+is+the+cause+of+faith+it+designates+consequently+and+mediately%2C+as+something+presupposed.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F22d038a2e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/22d038a2e3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=Problem%3A%20Whether%20the%20Lord%E2%80%99s%20Supper%20can,consequently%20and%20mediately%2C%20as%20something%20presupposed&amp;text=Problem%3A%20Whether%20the%20Lord%E2%80%99s%20Supper%20can%20be%20said&amp;text=it%20designates%20consequently%20and%20mediately%2C%20as%20something%20presupposed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4e9c0078fc" data-kw="">
<blockquote><p>23. In the words just recited, observe these four assertions of Cyril of Alexandria:

1. The flesh of Christ in the participants of the Eucharist is life-giving. (For those who approach unworthily do not partake of the flesh of Christ.)

2. This occurs not by the virtue of the flesh, as it is flesh, but by the virtue of the Deity with which this flesh is united in hypostasis. And the preservation of us and the wondrous effects related to the flesh are to be attributed to the glory of the Deity.

3. For the accomplishment of these things, the bodily presence of the flesh is neither required nor desired.

4. Christ, by the power of His Deity, accomplishes these things, being present with us through His ineffable Deity even though He has departed from us in the flesh.

24. Indeed, the power of Deity accomplishes that we can hold onto Him even when absent, by imitating faith in heaven. We partake of Him when absent by believing, as Augustine teaches. And even when absent in the flesh, He spiritually nourishes us with that same flesh, and His flesh becomes for us life-giving bread, as Cyril teaches here. For this spiritual nourishment is the operation of Deity and is not the least part of that preservation and those miraculous works, which Cyril says should be attributed not to the bodily presence of the flesh but to the glory of the Deity. Therefore, elsewhere, Cyril says the same: just as (he says) the root sends its quality to the branches, so the only-begotten Son of God, by giving the Spirit, bestows the affinity of the Father and His own nature (so to speak) on the saints connected to Him by faith and sanctity, nourishing them with piety and all kinds of virtue. He calls the Father the Farmer so that this might not seem to be the work of the Son alone, but rather a marvelous work of the entire Trinity. Therefore, He nourishes us with piety and faith through the Son in the Spirit, and the Farmer does the work, looking after and nurturing, and reducing everything to virtue, also through the Son in the Spirit. In my judgment, we understand this more correctly. Nor is this from the Father, nor that from the Son, nor both separated from the Spirit. For all things are from the Father through the Son in the Spirit. Neither will the Father be separated from cultivating us, nor will the Son be estranged from His care. Therefore, Christ holds the place of the vine, and we, hanging from it, draw the power and grace of the Spirit for our nourishment and spiritual fruit. This is what Cyril says in book 10 of the Gospel of John, chapter 13. Namely, as the Lord speaks in John, chapter 6, ‘It is the Spirit that gives life; the flesh is of no avail.’ The flesh of Christ is not life-giving from itself but by the power of the Deity dwelling corporeally within it. It is substantially life, and from itself, it gives life. He gave to the body in which He dwells the power of giving life, not by the confusion of the two natures in Christ or the operation of natural properties but by the hypostatic union of natures. So that the flesh of the Word becomes life-giving, for it is the flesh of God; and being spiritually united to this flesh, we are connected to God, and thus, being already connected to Him, we are infallibly given life: as Cyril teaches in book 4 of his Commentary on the Gospel of John, chapter 14, and the following chapters until the end of chapter 25, and in book 1, chapter 21. And the operation of Deity is so powerful that it unites us to His flesh by its consenting will, nourishes us, and allows us to draw from His fullness. Therefore, for the salutary eating of the flesh of Christ, the bodily presence of the flesh is not required with the one partaking, as we explained a little earlier from the same Cyril.

25. However, ignorantly or dishonestly, Bellarmine (in Book 2, On the Eucharist, chapter 25) abuses certain words of Cyril, attributing to them a meaning entirely alien to Cyril’s own mind, as if they favored transubstantiation and the bodily eating of the flesh of Christ. He first cites certain words from a letter of Cyril to Nestorius, intending to convey that Cyril meant nothing other than that the flesh of Christ, of which we are participants in the mysteries, is not common flesh, the mere flesh of a man or a sanctified man (as Nestorius deliriously claimed), but the proper flesh of the Word Himself. Read that letter of Cyril that contains twelve anathemas, and you will find nothing else there, not even in those very words that Bellarmine excerpts. Having discussed this at length, he promises us clearer passages from Cyril and adduces some from Cyril’s books on the Gospel of John, from which he draws three arguments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-forbes.html">John Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instructiones Historico Theologicae</cite>, (1645; Geneva: John Pictetum, 1680), pp. 590-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

25. However, ignorantly or dishonestly, Bellarmine (in Book 2, On the Eucharist, chapter 25) abuses certain words of Cyril, attributing to them a meaning entirely alien to Cyril’s own mind, as if they favored transubstantiation and the bodily eating of the flesh of Christ. He first cites certain words from a letter of Cyril to Nestorius, intending to convey that Cyril meant nothing other than that the flesh of Christ, of which we are participants in the mysteries, is not common flesh, the mere flesh of a man or a sanctified man (as Nestorius deliriously claimed), but the proper flesh of the Word Himself. Read that letter of Cyril that contains twelve anathemas, and you will find nothing else there, not even in those very words that Bellarmine excerpts. Having discussed this at length, he promises us clearer passages from Cyril and adduces some from Cyril’s books on the Gospel of John, from which he draws three arguments.”

— John Forbes, Instructiones Historico Theologicae, (1645; Geneva: John Pictetum, 1680), pp. 590-91">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C23.+In+the+words+just+recited%2C+observe+these+four+assertions+of+Cyril+of+Alexandria%3A+1.+The+flesh+of+Christ+in+the+participants+of+the+Eucharist+is+life-giving.+%28For+those+who+approach+unworthily+do+not+partake+of+the+flesh+of+Christ.%29+2.+This+occurs+not+by+the+virtue+of+the+flesh%2C+as+it+is+flesh%2C+but+by+the+virtue+of+the+Deity+with+which+this+flesh+is+united+in+hypostasis.+And+the+preservation+of+us+and+the+wondrous+effects+related+to+the+flesh+are+to+be+attributed+to+the+glory+of+the+Deity.+3.+For+the+accomplishment+of+these+things%2C+the+bodily+presence+of+the+flesh+is+neither+required+nor+desired.+4.+Christ%2C+by+the+power+of+His+Deity%2C+accomplishes+these+things%2C+being+present+with+us+through+His+ineffable+Deity+even+though+He+has+departed+from+us+in+the+flesh.+24.+Indeed%2C+the+power+of+Deity+accomplishes+that+we+can+hold+onto+Him+even+when+absent%2C+by+imitating+faith+in+heaven.+We+partake+of+Him+when+absent+by+believing%2C+as+Augustine+teaches.+And+even+when+absent+in+the+flesh%2C+He+spiritually+nourishes+us+with+that+same+flesh%2C+and+His+flesh+becomes+for+us+life-giving+bread%2C+as+Cyril+teaches+here.+For+this+spiritual+nourishment+is+the+operation+of+Deity+and+is+not+the+least+part+of+that+preservation+and+those+miraculous+works%2C+which+Cyril+says+should+be+attributed+not+to+the+bodily+presence+of+the+flesh+but+to+the+glory+of+the+Deity.+Therefore%2C+elsewhere%2C+Cyril+says+the+same%3A+just+as+%28he+says%29+the+root+sends+its+quality+to+the+branches%2C+so+the+only-begotten+Son+of+God%2C+by+giving+the+Spirit%2C+bestows+the+affinity+of+the+Father+and+His+own+nature+%28so+to+speak%29+on+the+saints+connected+to+Him+by+faith+and+sanctity%2C+nourishing+them+with+piety+and+all+kinds+of+virtue.+He+calls+the+Father+the+Farmer+so+that+this+might+not+seem+to+be+the+work+of+the+Son+alone%2C+but+rather+a+marvelous+work+of+the+entire+Trinity.+Therefore%2C+He+nourishes+us+with+piety+and+faith+through+the+Son+in+the+Spirit%2C+and+the+Farmer+does+the+work%2C+looking+after+and+nurturing%2C+and+reducing+everything+to+virtue%2C+also+through+the+Son+in+the+Spirit.+In+my+judgment%2C+we+understand+this+more+correctly.+Nor+is+this+from+the+Father%2C+nor+that+from+the+Son%2C+nor+both+separated+from+the+Spirit.+For+all+things+are+from+the+Father+through+the+Son+in+the+Spirit.+Neither+will+the+Father+be+separated+from+cultivating+us%2C+nor+will+the+Son+be+estranged+from+His+care.+Therefore%2C+Christ+holds+the+place+of+the+vine%2C+and+we%2C+hanging+from+it%2C+draw+the+power+and+grace+of+the+Spirit+for+our+nourishment+and+spiritual+fruit.+This+is+what+Cyril+says+in+book+10+of+the+Gospel+of+John%2C+chapter+13.+Namely%2C+as+the+Lord+speaks+in+John%2C+chapter+6%2C+%E2%80%98It+is+the+Spirit+that+gives+life%3B+the+flesh+is+of+no+avail.%E2%80%99+The+flesh+of+Christ+is+not+life-giving+from+itself+but+by+the+power+of+the+Deity+dwelling+corporeally+within+it.+It+is+substantially+life%2C+and+from+itself%2C+it+gives+life.+He+gave+to+the+body+in+which+He+dwells+the+power+of+giving+life%2C+not+by+the+confusion+of+the+two+natures+in+Christ+or+the+operation+of+natural+properties+but+by+the+hypostatic+union+of+natures.+So+that+the+flesh+of+the+Word+becomes+life-giving%2C+for+it+is+the+flesh+of+God%3B+and+being+spiritually+united+to+this+flesh%2C+we+are+connected+to+God%2C+and+thus%2C+being+already+connected+to+Him%2C+we+are+infallibly+given+life%3A+as+Cyril+teaches+in+book+4+of+his+Commentary+on+the+Gospel+of+John%2C+chapter+14%2C+and+the+following+chapters+until+the+end+of+chapter+25%2C+and+in+book+1%2C+chapter+21.+And+the+operation+of+Deity+is+so+powerful+that+it+unites+us+to+His+flesh+by+its+consenting+will%2C+nourishes+us%2C+and+allows+us+to+draw+from+His+fullness.+Therefore%2C+for+the+salutary+eating+of+the+flesh+of+Christ%2C+the+bodily+presence+of+the+flesh+is+not+required+with+the+one+partaking%2C+as+we+explained+a+little+earlier+from+the+same+Cyril.+25.+However%2C+ignorantly+or+dishonestly%2C+Bellarmine+%28in+Book+2%2C+On+the+Eucharist%2C+chapter+25%29+abuses+certain+words+of+Cyril%2C+attributing+to+them+a+meaning+entirely+alien+to+Cyril%E2%80%99s+own+mind%2C+as+if+they+favored+transubstantiation+and+the+bodily+eating+of+the+flesh+of+Christ.+He+first+cites+certain+words+from+a+letter+of+Cyril+to+Nestorius%2C+intending+to+convey+that+Cyril+meant+nothing+other+than+that+the+flesh+of+Christ%2C+of+which+we+are+participants+in+the+mysteries%2C+is+not+common+flesh%2C+the+mere+flesh+of+a+man+or+a+sanctified+man+%28as+Nestorius+deliriously+claimed%29%2C+but+the+proper+flesh+of+the+Word+Himself.+Read+that+letter+of+Cyril+that+contains+twelve+anathemas%2C+and+you+will+find+nothing+else+there%2C+not+even+in+those+very+words+that+Bellarmine+excerpts.+Having+discussed+this+at+length%2C+he+promises+us+clearer+passages+from+Cyril+and+adduces+some+from+Cyril%E2%80%99s+books+on+the+Gospel+of+John%2C+from+which+he+draws+three+arguments.%E2%80%9D%0A%0A%E2%80%94+John+Forbes%2C+Instructiones+Historico+Theologicae%2C+%281645%3B+Geneva%3A+John+Pictetum%2C+1680%29%2C+pp.+590-91&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4e9c0078fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4e9c0078fc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=23.%20In%20the%20words%20just%20recited,from%20which%20he%20draws%20three%20arguments&amp;text=23.%20In%20the%20words%20just%20recited%2C%20observe%20these&amp;text=of%20John%2C%20from%20which%20he%20draws%20three%20arguments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

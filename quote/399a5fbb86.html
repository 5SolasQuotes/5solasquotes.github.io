<main class="wrap"><figure class="quote" id="q-399a5fbb86" data-kw="">
<blockquote><p>Such expressions of pious and devout affections as to some may seem indecent and imprudent ought not to be hastily censured and condemned, much less ridiculed, because, if they come from an upright heart, God will accept the strength of the affection and excuse the weakness of the expressions of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 47, verse 1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fea30d9bc7" data-kw="">
<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London, 1657) | on Jn., 17:1</span></figcaption>

<blockquote><p>…yet it [Ps. 95:6] commends not kneeling except in a certain kind of worship only. And as for kneeling in the general nature of it, it is not of divine institution, but in itself indifferent, even as sitting, standing, etc. all which gestures are then only made good, or evil, when in actu exercito [having been being exercised in the act] they are actuated and individualized by particular circumstances.</p></blockquote>

</figure><figure class="quote" id="q-9977fa1737" data-kw="">
<blockquote><p>They [the three friends of Daniel] expressly refuse knee-bowing [to the idol], and the reason is, because if ye bow your knee religiously to a stock, it is not in your power or free choice to stay the flux and motion of religious honor off, or from, the stock; but because religious bowing does not convey honor to the thing before which ye bow by your free will, but by God and nature’s institution, even as weeping naturally expresses sorrow, laughing, gladnesse, so does religious bowing signify religious honoring, without any act of the free choice of the worshipped intervening. It is impossible to adore God in and through an image, and give no religious reverence to the image at all; as it is impossible to hear the Word and tremble at it, and yet none of that religious trembling be bounded and terminated upon the Word, as it is impossible to kneel to the king’s ambassador conveying all and whole that civil honor to the king, but some honor must redound to the ambassador; a father cannot love the doctor for his son’s cause, but some love he must confer really upon the doctor, if not absolute, yet relative, for his son’s cause. Jacob could not kiss Joseph his son’s coat, and yet refer that whole expressed affection to Joseph and nothing at all to the coat, for then should there be no reason why he should kiss the coat rather than the skin of the beast supposed to be the devourer of his son; If therefore the communicant should kiss the sacramental bread as he bows religiously before it, as the object of his sacramental worship, which he receives, I hope it would be thought very like the kissing of the calves of Samaria, and a religious expression of love to the bread; and by the same case, religious bowing to God, by the intervening of bread, a representative object, must be an expression of religious honoring of bread, but no religious honoring by religious bowing can be expressed, but [it is] adoration of bread…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Ch. 1; pp.147-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

ous+bowing+to+God%2C+by+the+intervening+of+bread%2C+a+representative+object%2C+must+be+an+expression+of+religious+honoring+of+bread%2C+but+no+religious+honoring+by+religious+bowing+can+be+expressed%2C+but+%5Bit+is%5D+adoration+of+bread%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+Ch.+1%3B+pp.147-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9977fa1737.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9977fa1737.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-veneration-as-distinguished-from-the-worship-of-adoration/#:~:text=They%20%5Bthe%20three%20friends%20of%20Daniel,but%20%5Bit%20is%5D%20adoration%20of%20bread&amp;text=They%20%5Bthe%20three%20friends%20of%20Daniel%5D%20expressly%20refuse&amp;text=be%20expressed%2C%20but%20%5Bit%20is%5D%20adoration%20of%20bread" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e3e039a49" data-kw="">
<blockquote><p>You [the episcopalian adversary] fall next to censure ‘the posture of sitting in time of public prayer, as very irreverent.’ Sir, not to detain you, I am not far from your opinion: For my own part, and I have many of our way assenting, I dislike sitting in prayer (if infirmity and other great inconveniences do not hinder it)… so I cannot but disagree from you in your overprizing and exacting the postures that you plead for: for though I am convinced that there is an indecency, and other inconveniences in sitting, for which I wish that wherever it may be, it were wholly disused, yet I am far from offending at, let be imposing upon these who of no intended irreverence, but for the most part from a just disgust of the too great weight has been laid upon such circumstances, do innocently practice it… So there are also upon record, such clear instances of an undetermined liberty in these matters, apparent enough in our Lord, his disciples and company, their ordinary sitting down to meat, and blessing and giving thanks in that posture, that I cannot but strange at your bringing any of these practices under an obligation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, pp. 70-71 of ‘The Second Dialogue’ in The True Non-Conformist (1671)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

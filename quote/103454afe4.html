<main class="wrap"><figure class="quote" id="q-103454afe4" data-kw="">
<blockquote><p>If we ‘stretch out our hands towards Him,’ we must ‘put iniquity far away from us’ (Job 11:13-14); the fruits of all service will else drop off to nothing. ‘Then shall the offering of Judah and Jerusalem be pleasant to the Lord;’ When? when the heart is ‘purged’ by Christ sifting as a ‘purifier of silver’. (Mal. 3:3-4)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682), ‘On the Holiness of God’, p. 564</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“If we ‘stretch out our hands towards Him,’ we must ‘put iniquity far away from us’ (Job 11:13-14); the fruits of all service will else drop off to nothing. ‘Then shall the offering of Judah and Jerusalem be pleasant to the Lord;’ When? when the heart is ‘purged’ by Christ sifting as a ‘purifier of silver’. (Mal. 3:3-4)”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72239b2dfd" data-kw="">
<blockquote><p>Superstition is an offering somewhat as pleasing to God, which is not pleasing to Him. All Christians have some degree of this in matter or manner; for we know but in part, and prophesy in part, etc. And so [it is the logical consequence of separatistic principles that] no Christians must join with others. But must they not give over all religious duty themselves, seeing their own defects more defile them than other men’s [defects]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-fbcbc6a03f" data-kw="">
<blockquote><p>12. Yet no man should prefer worse before better, if all things [be] set together it be better indeed to the person at that time. … 26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant,¹ which renounces profaneness, schism, and all that is contrary to godliness. …

28. So great is the peace and comfort of many parishes where the public ministers and all the religious people live together in love and amity that it loudly tells us how much better that is than to study to render each other odious, or vile and excommunicable.

29. Such use of godly public ministers [in the parish churches] may well stand with the best improvement we can make of the private help of others. … 34. Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest¹ minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers² and to be fined and lie in prison on no better a cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 2, pp. 9-14</span></figcaption>

<blockquote><p>26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant [1643] which renounces profaneness, schism and all that is contrary to godliness.

27. So much are Papists angry at Protestant ministers that keep them [non-conformists] out of the parish churches, [Papists] reviling them [such Protestant ministers] as trimmers, [Papists] supposing that conventicles [worship assemblies of non-conformists] can do them less harm, that all that love the Protestant religion should do their best to encourage† all such orthodox men and to strengthen the Protestant interest in the parish churches, and not join against them with the Papists (however it be with other intents and minds).</p></blockquote>

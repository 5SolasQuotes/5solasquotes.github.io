<main class="wrap"><figure class="quote" id="q-c61e996173" data-kw="">
<blockquote><p>The apostle delivered nothing as it were by a second hand to the Corinthians, but what he had formerly received from the Lord. Divine things are unto us deposited; we must first be receivers, before deliverers.

HERE then we see, first, both the absurdity and the wickedness of a will-worship; when the same man who is to perform the obedience, shall dare to appoint the laws, implying a peremptory purpose of no farther observance, than may consist with the allowance of his own judgement: whereas true obedience must be grounded on the majesty of that power that commands, not on the judgement of the subject, or benefit of the precept imposed.

Divine laws require obedience, not so much from the quality of the things commanded (though they be ever holy and good), as from the authority of him that institutes them. We are all the servants of God; and servants are but living instruments, whose property it is to be governed by the will of those, in whose possession they are. Will-worship, and services of superstition, well they may flatter God, they do not please him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 15-16.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1243ef538a" data-kw="">
<blockquote><p>A mean or medium, as it is such, is less than the end, though the thing materially that is a mean may be more excellent. Every mean, as a mean, under that reduplication, has all its goodness and excellency in relation to the end; yet an angel that is a mean (or medium) and a ministering spirit, ordained of God for an heir of life eternal (Heb. 1:13) considered materially, is more excellent than a man (Ps. 8:5; Heb. 2:6-8).</p></blockquote>

</figure><figure class="quote" id="q-84c4314c88" data-kw="">
<blockquote><p>Instrumental music in the religious worship of the Jews, belonged to the ceremonial law, which is now abolished. It is evident that it is contrary to the precept and rule of Paul, who (1 Cor. xiv.) wills that in Christian assemblies everything should be done for edification, that others may understand and be reformed; so even that of speaking in unknown tongues should be banished from the church; much less should that jarring organic music, which produceth a gabbling of many voices, be allowed, with its pipes and trumpets and whistles, making our churches re-sound, nay, bellow and roar. …

In some of the Reformed churches these musical instruments are retained, but they are not played until the congregation is dismissed, all the parts of divine worship being finished. And they are then used for a political [civil] purpose, to gratify those who seek pleasure from sound and harmony.</p></blockquote>

</figure><figure class="quote" id="q-74561d709a" data-kw="">
<blockquote><p>Thus he will have images adored with the same worship that is given to God: But I answer: 1. if he shall kiss that creature and direct religious bowing toward it, and through that external religious act, convey his worship to God, and give no other external adoration and sign of heart submission to God, then that which is tied and alligated of purpose to that fair creature, as Papists and Jews did of old, who kissed the calves and fell down before the images (as Isa. 44:17, which yet were but memorials of Jehovah teaching them of Iehovah, Isa. 40:18; 46:6-7; Hab. 2:18-19), such a one should also worship that fair creature.</p></blockquote>

</figure><figure class="quote" id="q-0442ce240f" data-kw="">
<blockquote><p>Our faithful Lord is our God, who hath fully, simply, and absolutely set down in his word his true religion and lawful kind of worship, which he hath taught all men to keep alone and for evermore: let all men therefore cleave fast unto it, and let them die in defence thereof, that mean to live eternally. They are punished from above, whosoever do add to, or take away anything from, the religion and kind of worship first ordained and appointed of God. Mark this, ye great men and princes of authority. For the keeping or not keeping of true religion is the root from whence abundant fruit of felicity, or else utter unhappiness, doth spring and bud out.</p></blockquote>

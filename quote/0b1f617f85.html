<main class="wrap"><figure class="quote" id="q-0b1f617f85" data-kw="">
<blockquote><p>Up to this time [1573], the prevailing practice was that only ministers signed the Belgic Confession. In 1574, however, the provincial Synod of Dordrecht decided that ‘it would be useful that the elders and deacons also subscribe to the Netherlands Confession, and to the articles of the [Emden] Synod.’ For this purpose, it was considered advisable that a copy of the confession and of the articles of the Emden Synod be kept by all consistories [sessions] or at least by all classes [presbyteries]. For the first time, schoolteachers were also required to sign the confession and to submit to the ‘discipline’ or articles of the Emden Synod. The idea of elders’ and deacons’ subscribing was not immediately accepted in all the churches. For example, at Delft the elders and deacons refused to sign the confession, while at Middelburg they did. Gaspar van der Heyden, pastor at Middelburg and president of the recent Dordrecht Synod, on 16 November 1574 wrote to Delft pastor Arent Cornelisz: ‘Our elders and deacons have signed the Confession of Faith and the articles of the [Emden] synod; I certainly wish that yours had done the same. How would they who now refuse to sign the Confession with ink seal it with their own blood?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

dbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Up%20to%20this%20time%20%5B1573%5D%2C%20the,seal%20it%20with%20their%20own%20blood&amp;text=Up%20to%20this%20time%20%5B1573%5D%2C%20the%20prevailing%20practice&amp;text=with%20ink%20seal%20it%20with%20their%20own%20blood" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e615a3ebe" data-kw="">
<blockquote><p>And all students in divinity are most expressly enjoined, upon pain of being declared unworthy of ever serving in the sacred ministry, to raise any stirs or debates about unnecessary questions, as concerning the order of God’s decrees, of universal grace by the preaching of nature, which may lead and bring men unto salvation, points only propounded and advanced by pure curiosity, and for the exercise of men’s wits. And all examiners of our proposans in order to the ministry, shall proceed in that business with very much charity, exacting from them nothing but what is demanded by the canons of our discipline; and provided they give that satisfaction which is requisite, by signing the Confession of Faith, the Liturgy of our Churches, and the Canons of Alez, Charenton, and Alenson, and this present act, they shall be approved and admitted.</p></blockquote>

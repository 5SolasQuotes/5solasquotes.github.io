<main class="wrap"><figure class="quote" id="q-1c4dc7d09a" data-kw="">
<blockquote><p>How large and extensive is the kingdom and authority of Christ! It is not limited to narrow confines. It extends over every creature, over all flesh, not one exempted; he hath a throne above the greatest monarchs; he is King of kings and Lord of lords. They cannot escape his iron rod who refuse to subject themselves to his gracious sceptre. All that are fallen under the power of the devil by sin are now under the dominion of Christ in grace or justice. All nations are subjected to him, as his inheritance and possession. Ps. ii. 8. …

The kingdom of Christ is by a divine authority. Thou hast given him power: Ps. ii. 8, ‘Ask of me and I will give thee.’ It is not usurped, but by an eternal grant, and perpetual. Whatsoever he doth in his kingdom, in order to the eternal life of believers, is ratified by God the Father, the donor of this power to him. …

The whole scene of the government of the world is for the promoting the eternal life of the elect. All the world is in the hands of Christ. He hath power over all flesh for this end, to give eternal life to those that God hath given to him. Every act of his government tends to this end. What is the end of his power is the true end of the exercise of that power, in every act of it in the world. It must needs be so by consequence; and how sweet will it be at last to see the whole combination; how unanimously every providence did conspire to this end, which our ignorant souls cannot now discern!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 9.</span></figcaption>

otes.github.io%2Fquote%2F1c4dc7d09a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1c4dc7d09a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/05/stephen-charnock-on-the-kingly-authority-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-1ebbe593af" data-kw="">
<blockquote><p>How can piety but promise to herself a zealous patron of your Highness, being the sole son and heir of so gracious and great a monarch, who is not only the defender of the faith by title, but also a defender of the faith in truth, as the Christian world hath taken notice, by his learned confuting of [Robert] Bellarmine’s overspreading heresies, and his suppressing in the blade of [Conrad] Vorstius’s Athean blasphemies? [1]

And how easy it is for your Highness to equal, if not exceed, all that were before you, in grace and greatness, if you do but set your heart to seek and to serve God, considering how religiously your Highness hath been educated by godly and virtuous governors and tutors; as also that you live in such a time, wherein God’s providence, and the King’s religious care, hath placed over this church, to the unspeakable comfort thereof, another venerable Jehoiada, that doth good in our Israel both towards God and towards his house; of whom your Highness at all times, in all doubts, may learn the sincerity of religion, for the salvation of your inward soul, and the wisest counsel for the direction of your outward state.

And to excite you the rather to the zealous practice of divine piety, often suppose with yourself, that your Highness hears your religious father James speaking unto you, as sometimes holy David spake to his son Solomon: and thou Charles my son know thou the God of thy father, and serve him with a perfect heart, and with a willing mind; for the Lord searcheth all hearts, and understandeth all the imaginations of the thoughts: if thou seek him, he will be found of thee; but if thou forsake him, he will cast thee off for ever.</p></blockquote>

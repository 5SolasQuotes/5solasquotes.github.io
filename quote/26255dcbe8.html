<blockquote><p>The knowledge of our religion and of the truth of things is independently manifest rather than in need of human teachers, for almost day by day it asserts itself by facts, and manifests itself brighter than the sun by the doctrine of Christ. Still, as you nevertheless desire to hear about it, Macarius, come let us as we may be able set forth a few points of the faith of Christ: able though you are to find it out from the divine oracles, but yet generously desiring to hear from others as well.

For although the sacred and inspired Scriptures are sufficient to declare the truth,—while there are other works of our blessed teachers compiled for this purpose, if he meet with which a man will gain some knowledge of the interpretation of the Scriptures, and be able to learn what he wishes to know,—still, as we have not at present in our hands the compositions of our teachers, we must communicate in writing to you what we learned from them,—the faith, namely, of Christ the Saviour; lest any should hold cheap the doctrine taught among us, or think faith in Christ unreasonable.

For this is what the Gentiles traduce and scoff at, and laugh loudly at us, insisting on the one fact of the Cross of Christ; and it is just here that one must pity their want of sense, because when they traduce the Cross of Christ they do not see that its power has filled all the world, and that by it the effects of the knowledge of God are made manifest to all.

For they would not have scoffed at such a fact, had they, too, been men who genuinely gave heed to His divine Nature. On the contrary, they in their turn would have recognised this man as Saviour of the world, and that the Cross has been not a disaster, but a healing of Creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Heathen</cite>, (c. 335), 1.1-4 in Nicene and Post-Nicene Fathers 2, 4: 4.</span></figcaption>

<blockquote><p>‘God be merciful unto us, and bless us; and cause His face to shine upon us. That Thy way may be known upon earth, Thy saving health among all nations.’ Psalm Ixvii. 1, 2

The royal Psalmist, in the spirit of inspiration, personating the Church of the redeemed in every age, and more especially under its last and most perfect dispensation, here offers up a sublime prayer for its inward prosperity, and outward universal extension. All is in the order of nature and of grace. Knowing full well that he who has not obtained mercy from the Lord, cannot be a fit bearer of it to others, — that he who has obtained no blessings himself, can dispense none,—that he who enjoys no light, can communicate none, — he first of all, with marked and beautiful propriety, begins with the supplication of personal and individual blessings: — ‘God be merciful unto us,’ forgiving and pardoning all our sins: ‘and bless us,’ conferring every gift and every grace really needful for time and eternity: ‘and lift up the light of thy countenance upon us,’ cheering us with the smile of reconciliation and love, and causing the Sun of Righteousness to arise on our darkened souls with healing in his beams.

But does the Psalmist stop here? Does he for a moment intend that he and his fellow-worshippers, as representatives of the visible Church of the living God, should absorb all the mercy, all the blessing, and all the light of Jehovah’s countenance? Oh no! Having thus fervently prayed for evangelical blessings to descend upon himself, and every member of the Church, he immediately superadds, in the true evangelistic or missionary spirit, ‘That thy way,’ or, as it is given in our metrical version, ‘That so thy way may be known upon earth, thy saving health among all nations.’

How significant the connection here established between the obtainment and the distribution of evangelical favours! ‘God be merciful unto us, and bless us.’ — Why? only that we ourselves may be pardoned and sanctified, and thereby attain to true happiness? No. There is another grand end in view, to the accomplishment of which our being blessed is but a means. ‘God be merciful unto us, and bless us, that so thy way may be known on earth,’ — that so — that thus — that in this way — that by our instrumentality — that by our being blessed, and having the light of thy countenance shining upon us, — ‘thy way’ — thy way of justification through the atoning righteousness of the Redeemer, — thy way of sanctification by his Holy Spirit, — ‘may be made known on earth, and thy saving health among all nations.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-duff.html">Alexander Duff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Missions. The Chief End of the Christian Church</cite>, (New edn, Edinburgh: Andrew Elliot, 1877), pp 7-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-f1428f6aba" data-kw="">
<blockquote><p>To the [citation of the] Confession of Wittenburg [by ‘good divines’] it is answered [by Ames’s opponents]: 1. That it does not so much as give any glance at Mark 7. Which, how true it is, may appear by these their words: ‘Nor is it lawful to restore either the old rites of the law, or to devise new in their place to signify the truth of the gospel now come to light, as for example, to use banners and crosses to sign Christ’s victory on the cross: of which kind of i […]ly devised representations is the whole furniture of Mass accontrements, which they say does set forth the whole passion of Christ and many such like things. Of which sacred ceremonies Christ preaches out of Isaiah: In vain they worship Me, teaching for doctrines the precepts of men.&#x27;</p></blockquote>

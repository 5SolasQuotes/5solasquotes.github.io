<blockquote><p>No consideration of flesh or human nature is necessary. Much to the contrary, it should be utterly removed from religious adoration of God and the divine nature, even in Christ Himself. Since this honor is owed to God alone (Deuteronomy 6[:14-15]; Matthew 4[:10]).</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

<blockquote><p>Q. 41.9. How often were the commandments written on tables of stone? A. The first being broken by Moses, on occasion of the idolatry of Israel, Exod 32:19, the Lord condescended to write on two other tables, the very same words that were on the former, Exod 34:1. Q. 41.10. Was there any difference between the first two tables and the second? A. The first two, which were entirely the work of God, (the polishing as well as the engraving,) were broken beneath the mount, Exod 32:16,19; but the second, which were hewed by Moses, the typical mediator, were put into the ark, Deut 10:3,5. Q. 41.11. What spiritual mystery was represented by this? A. That though the covenant of works, made with the first Adam, was broken and violated by him, yet it was fulfilled in every respect by Christ the true Mediator, who “restored that which he took not away,” Ps 69:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

<blockquote><p>Whereas they say that there is a double head of the church, one imperial, which is Christ alone, the other ministerial, which is the pope governing the whole church under Christ; I answer, this distinction robs Christ of His honor because in setting up their ministerial head, they are fain to borrow of Christ things proper unto Him, as the privilege to forgive sins properly and the power to govern the whole earth by making of laws that shall as truly bind conscience as the laws of God, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, “Of the Supremacy in Causes Ecclesiastical”</span></figcaption>

</figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King">
<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>

</figure><figure class="quote" id="q-078a512de3" data-kw="">
<blockquote><p>4. The intrinsical acts of God which do connote some habitude and respect to some thing that is out of the Godhead, are the will of God, or the essence of God considered after the manner of an act of his will, ‘essentia ex se actuosa’ (as the Schools speak) ‘concepta per modum actus volendi.’ If this act be considered in itself, it is nothing else but the will or essence of God, because it is an intrinsical and vital act. But now if this act be considered as relative, and as related to some thing that is out of God, we say this act is not necessary, but free in respect of all those things which God decrees to produce or permit in the world; for God does arbitrarily decree to permit or produce this, and not that, according to the counsel of his own will, it being as truly and fully in his power to permit or produce that, as this: both were alike possible, but this is made future, and will in the fullness of time be present in act by virtue of the free decree of God; for all creatures are produced and do exist by the will of God. It is most evident that the will of God is the same whether it act upon Himself or something that is out of the Godhead.

5. The relation which is between the will of God, and the creature, whether in futurition, or existence, is extrinsical.

6. The denominations grounded upon the termination, or relation of the will of God towards the creatures, is extrinsecal also.

7. These actions of God which are said to be rather from God, than in God, as to create, govern, redeem or the like, are called extrinsical, and therefore the denomination of God from them must needs be extrinsical.

8. We have no ground to conceive that the essence of God is compounded with extrinsical terminations, relations, or denominations.

9. Though the objects which God does will are very different, and their production is successive, yet the will of God is the self same, and is one single and pure act: the Power of willing and the act of willing are not distinct in God; nay God does will his own happiness necessarily, and the happiness of men and angels freely by the same will; necessity and liberty do not make distinct powers or wills in God.

10. There is no potentia executiva in God, and therefore all those conceits of Vorstius [an Arminian] concerning any change or composition in God by several acts or decrees are but mere dreams, and vain conceits, though they be now published to the world, not with less blasphemy than impudence in this licentious age. It is evident by what has been said that the eminent virtue of God (notwithstanding its several objects, egresses, terminations, relations, denominations and effects) is one single and infinite perfection. This will be the constant result and conclusion of all sober debates, and Christian discussions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity of the Father, Son &amp; Holy Spirit</cite>, … (London, 1650), pp. 129-32</span></figcaption>

inations%2C+relations%2C+or+denominations.+9.+Though+the+objects+which+God+does+will+are+very+different%2C+and+their+production+is+successive%2C+yet+the+will+of+God+is+the+self+same%2C+and+is+one+single+and+pure+act%3A+the+Power+of+willing+and+the+act+of+willing+are+not+distinct+in+God%3B+nay+God+does+will+his+own+happiness+necessarily%2C+and+the+happiness+of+men+and+angels+freely+by+the+same+will%3B+necessity+and+liberty+do+not+make+distinct+powers+or+wills+in+God.+10.+There+is+no+potentia+executiva+in+God%2C+and+therefore+all+those+conceits+of+Vorstius+%5Ban+Arminian%5D+concerning+any+change+or+composition+in+God+by+several+acts+or+decrees+are+but+mere+dreams%2C+and+vain+conceits%2C+though+they+be+now+published+to+the+world%2C+not+with+less+blasphemy+than+impudence+in+this+licentious+age.+It+is+evident+by+what+has+been+said+that+the+eminent+virtue+of+God+%28notwithstanding+its+several+objects%2C+egresses%2C+terminations%2C+relations%2C+denominations+and+effects%29+is+one+single+and+infinite+perfection.+This+will+be+the+constant+result+and+conclusion+of+all+sober+debates%2C+and+Christian+discussions.%E2%80%9D%0A%0A%E2%80%94+Francis+Cheynell%2C+The+Divine+Trinunity+of+the+Father%2C+Son+%26+Holy+Spirit%2C+%E2%80%A6+%28London%2C+1650%29%2C+pp.+129-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F078a512de3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/078a512de3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-two-operations-energies-of-the-mediator-divine-human-unto-the-same-effect-apotelesma/#:~:text=4.%20The%20intrinsical%20acts%20of%20God,all%20sober%20debates%2C%20and%20Christian%20discussions&amp;text=4.%20The%20intrinsical%20acts%20of%20God%20which%20do&amp;text=conclusion%20of%20all%20sober%20debates%2C%20and%20Christian%20discussions" rel="noopener" target="_blank">Read it online · Reformed Books Onl

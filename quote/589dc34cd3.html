<blockquote><p>XXI. Let us now lastly consider the threatenings, whether there be any such in this covenant. It cannot indeed be denied, but that, in the doctrine of Christ and the apostles, we frequently meet with very many comminations, which have their peculiar respect to the covenant of grace, and which could not have thus been set before us if there had been no such covenant. For instance,—whoever shall not believe in Christ—whoever shall despise the counsel of God against his own soul—whoever shall not obey the Gospel, shall be condemned. And these threatenings seem to be distinguished from those which are evidently legal; such as the following: “Cursed is he that continueth not in all things,” &amp;c. Yet, if we would weigh the matter narrowly, the covenant of grace has no threatenings so peculiar to itself, but what may well be referred to the law, from which every curse proceeds. XXII. Which I would explain thus: we no where hear of any threatenings which may and ought not to be deduced from that threatening, which doubtless is purely legal, “Cursed is every one that continueth not in all things,” &amp;c. In this most general threatening are included the other more particular ones. Moreover, when salvation by Christ alone is proposed, in the covenant of grace, as the principal truth, the law, which enjoins man to embrace with a firm faith every truth made known to him by God, obliges him to receive this truth in particular, and be delighted with the glory of God shining forth in it, and that his own salvation is connected with the glory of God. Should we deny that the law lays us under this obligation, we should then affirm that the law does not enjoin us to acknowledge God as true, and that there is a holy love of God and of ourselves which the law does not command; all which are most absurd. I go further: When man, as the law prescribes, receives the truth of the Gospel with a lively faith, then not the law, but the Gospel, promises salvation to him. For the law knows of no other promise, than what depends on the condition of perfect obedience. But should man slight and obstinately reject that truth proposed to him, he sins against the law, and so incurs its curse, according to the general rule so often inculcated. And since we have supposed the Gospel declaring that salvation flows from the faith of Christ alone, the law enjoins that all who desire salvation should seek it by the faith of Christ alone; and consequently it cannot but thunder the curse against those who, rejecting the Gospel, believe not on Christ. As, therefore, unbelief, or the rejecting the Gospel, is a sin against the law, which is the only perfect rule of all virtue (it can be called a sin against the Gospel, only objectively), so every threatening of the curse and of wrath against unbelievers and the despisers of the Gospel, must come from and be reduced to the law; but then it is to the law as now subservient to the covenant of grace. XXIII. In the discourses of the Prophets, Christ, and his apostles, there is a certain mixture of various doctrines, which, indeed, are closely connected, and mutually subservient; each of which ought to be reduced to their proper heads, so that the promises of grace be referred to the Gospel, all injunctions of duty and all threatenings against transgressors to the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, 2 vols. (London: Tegg &amp; Son, 1837), vol. 1, pp. 252–58; italics original. See also Herman Witsius, The Economy of the Covenants Between God &amp; Man, 2 vols. (1822; RHB, 2017), vol. 1, pp. 284–91</span></figcaption>

<blockquote><p>XLII. As for the name ‘catholic,’ most of our [Reformed] theologians say that it is common to both the visible and invisible Church, but the invisible Church is absolutely and simply to be called catholic, that is, universal, because it encompasses all the elect from the beginning of the world. However, the visible Church is to be considered catholic in a certain respect, as it encompasses all those who together profess the true and saving religion on earth and includes all particular churches scattered in various parts of the world. In my opinion, the name Catholic is a title of that part of the Church which now militates on earth under Christ, and this name is given to it:

1. Because it is spread throughout the whole world, not restricted to one nation as the Jewish Church was in ancient times.

2. Because it embraces the entire doctrine of the apostles, not admitting part and rejecting part like heretical sects. Finally, because it has persevered the same in all times, namely, through succession and continuation.</p></blockquote>

<blockquote><p>Now these members combining themselves into one body as they are such, do make or rather are actually a true visible church, one integral body, not continued but by aggregation… Further, this integral body for the well-being of it in exercising those operations which belong unto it and whereunto it serves, must become as we say organical, having members of diverse ranks, some as head, mouth and eyes, the pastor, teachers, and elders, some as hands, the deacons and helpers: whereupon arises another relation and form of accidental perfection, in state of government: which is complete or incomplete, freely exercising the power granted by Christ to his church, or else restrained or defective therein.</p></blockquote>

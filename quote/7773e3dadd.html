<main class="wrap"><figure class="quote" id="q-7773e3dadd" data-kw="">
<blockquote><p>I. Who are to be considered as the proper subjects of Christian baptism?

That baptism ought to be administered to all adult persons, who profess faith in Christ, and obedience to him, and who have not been baptized in their infancy, is not doubted by any. In this all who consider baptism as an ordinance at present obligatory are agreed. But it is well known that there is a large and respectable body of professing Christians among us who believe, and confidently assert, that baptism ought to be confined to adults; who insist, that when professing Christians bring their infant offspring, and dedicate them to God, and receive for them the washing of sacramental water in the name of the Father, and of the Son, and of the Holy Ghost, they entirely pervert and misapply an important Christian ordinance.

We highly respect the sincerity and piety of many who entertain these opinions; but we are perfectly persuaded that they are in error, nay in great and mischievous error; in error which cannot fail of exerting a most unhappy influence on the best interests of the church of God. We have no doubt that the visible church is made up, not only of those who personally profess the true religion, but also of their children; and that we are bound not only to confess Christ before men for ourselves, but also to bring our infant seed in the arms of faith and love, and present them before the Lord, in that ordinance which is at once a seal of God’s covenant with his people, and an emblem of those spiritual blessings which, as sinners, we and our children equally and indispensably need.

Our reasons for entertaining this opinion, with entire confidence, are the following:

1. Because in all Jehovah’s covenants with his professing people, from the earliest ages, and in all states of society, their infant seed have been included. That this was the case with regard to the first covenant made with Adam in paradise, is granted by all ­ certainly by all with whom we have any controversy concerning infant baptism. And indeed the consequences of the violation of that covenant to all his posterity, furnish a standing and a mournful testimony that it embraced them all. The covenant made with Noah, after the deluge, was, as to this point, of the same character. Its language was, “Behold, I establish my covenant with you and with your seed” (Gen. 9:9).

The covenant with Abraham was equally comprehensive. “Behold,” says Jehovah, “my covenant is with thee.” Behold, “I will establish my covenant between me and thee and thy seed after thee” (Gen. 17:4, 7).

The covenants of Sinai and of Moab, it is evident, also comprehended the children of the immediate actors in the passing scenes, and attached to them, as well as to their fathers, an interest in the blessings or the curses, the promises or the threatenings which those covenants respectively included. Accordingly, when Moses was about to take leave of the people, he addressed them as “standing before the Lord their God, with their little ones, and their wives, to enter into covenant with the LORD their God” (Deut. 29:10-12).

And when we come to the New Testament economy, still we find the same interesting feature not only retained, but more strikingly and strongly displayed. Still the promise, it is declared, is “to us and our children, even as many as the Lord our God shall call” (Acts 2:39).

Now, has this been a feature in all Jehovah’s covenants with his people in every age? And shall we admit the idea of its failing in that New Testament or Christian covenant, which, though the same in substance with those which preceded it, excels them all in the extent of its privileges, and in the glory of its promises? It cannot be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism Scriptural and Reasonable: And Baptism by Sprinkling or Affusion the Most Suitable and Edifying Mode: In Four Discourses</cite>, (Philadelphia: Joseph Whetman, 1835), pp 14-16.</span></figcaption>

<blockquote><p>Lastly we say again, that the reason why Christ gave his Disciples no express or peculiar command concerning baptizing infants, but included them in the general, was because the Apostles were so well acquainted with children’s reception into the Church-privileges, and sealing into the same, that they could not reasonably make any question of baptizing infants, having a general command to baptize all Nations, infants being under the Law circumcised; and knowing moreover that the grace of God was not more strict or restrained in the new Testament then in the old; but contrarywise, more diffused or large; and therefore a greater and more difficult question might have been concerning the baptism of women, there being neither analogy from circumcision, nor particular precept to induce them to baptize them; but that they knew that the general precept was authority sufficient, without specifying particulars in terminis.</p></blockquote>

</figure><figure class="quote" id="q-2977c12ab8" data-kw="">
<blockquote><p>Now that infants may and ought to be baptized, is proved from Matt, xxviii. 17, where Christ commands all to be baptized, and therefore infants; nor does it matter, that in this passage instruction is made to precede baptism, for instruction applies only to adults, who were the persons our Lord had in view, since the first churches were to be composed of adults. The parents were, therefore, first to be taught, but when they had been baptized, their children were to be baptized also.

Besides, the covenant of God, and the seals thereof, belong to infants, (Gen. xvii, 7,) and “the promise” is made unto them. (Acts ii. 39.) To infants also belong remission of sins, and regeneration; in short, “the kingdom of heaven;” therefore the signs of these blessings may be bestowed upon them. Moreover, the necessity of baptism is the same as that of circumcision, for the former succeeded into the place of the latter, and both are sacraments of initiation; now the Jews were in the habit of baptizing proselytes together with their children.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now that infants may and ought to be baptized, is proved from Matt, xxviii. 17, where Christ commands all to be baptized, and therefore infants; nor does it matter, that in this passage instruction is made to precede baptism, for instruction applies only to adults, who were the persons our Lord had in view, since the first churches were to be composed of adults. The parents were, therefore, first to be taught, but when they had been baptized, their children were to be baptized also.

Besides, the covenant of God, and the seals thereof, belong to infants, (Gen. xvii, 7,) and “the promise” is made unto them. (Acts ii. 39.) To infants also belong remission of sins, and regeneration; in short, “the kingdom of heaven;” therefore the signs of these blessings may be bestowed upon them. Moreover, the necessity of baptism is the same as that of circumcision, for the former succeeded into the place of the latter, and both are sacraments of initiation; now the Jews were in the habit of baptizing proselytes together with their children.”

— Benedict Pictet, Christian Theology, trans. Frederick Reyroux (1696; London, 1834), 11.4, p. 487.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+that+infants+may+and+ought+to+be+baptized%2C+is+proved+from+Matt%2C+xxviii.+17%2C+where+Christ+commands+all+to+be+baptized%2C+and+therefore+infants%3B+nor+does+it+matter%2C+that+in+this+passage+instruction+is+made+to+precede+baptism%2C+for+instruction+applies+only+to+adults%2C+who+were+the+persons+our+Lord+had+in+view%2C+since+the+first+churches+were+to+be+composed+of+adults.+The+parents+were%2C+therefore%2C+first+to+be+taught%2C+but+when+they+had+been+baptized%2C+their+children+were+to+be+baptized+also.%0A%0ABesides%2C+the+covenant+of+God%2C+and+the+seals+thereof%2C+belong+to+infants%2C+%28Gen.+xvii%2C+7%2C%29+and+%E2%80%9Cthe+promise%E2%80%9D+is+made+unto+them.+%28Acts+ii.+39.%29+To+infants+also+belong+remission+of+sins%2C+and+regeneration%3B+in+short%2C+%E2%80%9Cthe+kingdom+of+heaven%3B%E2%80%9D+therefore+the+signs+of+these+blessings+may+be+bestowed+upon+them.+Moreover%2C+the+necessity+of+baptism+is+the+same+as+that+of+circumcision%2C+for+the+former+succeeded+into+the+place+of+the+latter%2C+and+both+are+sacraments+of+initiation%3B+now+the+Jews+were+in+the+habit+of+baptizing+proselytes+together+with+their+children.%E2%80%9D%0A%0A%E2%80%94+Benedict+Pictet%2C+Christian+Theology%2C+trans.+Frederick+Reyroux+%281696%3B+London%2C+1834%29%2C+11.4%2C+p.+487.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2977c12ab8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2977c12ab8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/16/benedict-pictet-on-infant-baptism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

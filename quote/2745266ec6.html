<main class="wrap"><figure class="quote" id="q-2745266ec6" data-kw="">
<blockquote><p>When Christ humbled himself, he did not leave, he did not relinquish, he did not forego, his divine nature. He did not cease to be God when he became man. The foundation of it lay here: He was “in the form of God, and thought it not robbery to be equal with God,” Phil. ii. 6. He was “in the form of God.” God hath no innate form but his nature, his being, his essence; and therefore to be “in the form of God” is to be participant of the nature, essence, and being of God. What follows thereon? He “thought it not robbery to be equal with God” the Father, in dignity, power, and authority. Because he was “in the form of God,” partaking of the divine essence, therefore he was “equal with God,” in dignity, power, and authority: which nothing could give him but only his being in the form of God; for though there is an order in the persons of the Trinity, there is no distinction or inequality in the nature of God.

Every one who is partaker of that nature is equal in that nature, in dignity, power, and authority. This was the state of Christ. He had the same nature with God the Father, he was “in the form of God;” and had the same dignity, authority, and power, — “equal with God.” Here is the terminus a quo. This the apostle states. He “took upon him the form of a servant.” ἐκένωσεν, he did “empty himself, he did humble himself, and took upon him the form of a servant.” When? While he was God; when he abode “in the form of God;” and was “equal with God,” then he “took upon him the form of a servant.” This is that glorious condescension of Christ, which is the greatest of all gospel mysteries, which is the life and soul of the church.

He that is God can no more cease to be God, by any act of his own, or act upon him, than he that is not God can become God by any act of his own, or any act upon him. Christ could not cease to be God, — no more than a worm can make itself God. We say, Christ, being God, was made man for our sakes. The Socinians say, that, being a man, he was made a god for his own sake; he was made equal unto God, in the same authority, but never “in the form of God.” In brief, we say, “The Word was made flesh,” — that is, had glorious authority and power given him in this nature. But Jesus Christ did not forego his divine nature; that he could not do. The apostle speaks that with as much confidence as that God cannot cease to be God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Humiliation and Condescension of Christ. Preached November 9, 1681 in Posthumous Sermons: Series Published for the First Time in MDCCCLIV</cite></span></figcaption>

<blockquote><p>IX. Although the care of religion belongs to the magistrate, political and ecclesiastical power are not on this account confounded. They are concerned with it in a different way; some are the duties of that, others of this. The former is concerned only about extrinsic things, as to their external disposition and order (which belong to the worship of God); the latter, however, about internal things (to wit, the administration of those things which pertain to the worship of God). He does not exercise the ministry of the word who admonishes and corrects a minister erring in doctrine or delinquent in life and removes an obstinate or scandalous one. He does not baptize who prohibits the profanation of baptism, who takes care that holy things should be done in a holy manner.

X. As it is not lawful for bishops to draw the sword, so neither is it lawful for princes and civilians to handle the thurible [sic]; as to the preaching of the word, the administration of the sacraments and other things which formally belong to pastors and are of the essential reason of their office. But it does not thence follow that the other functions concerning the government of the church do not belong to the believing magistrate. Although it is not lawful for bishops to engage in politics or to plead in court, still it is lawful and incumbent upon them to admonish and to exhort magistrates to do their duty. And if they at any time fall in it, they are to rebuke and to denounce the judgment of God against them. So, in turn, although the preaching of the word does not pertain to magistrates, still it is lawful for them to admonish and rebuke bishops and pastors neglecting or wandering from their office; nay, also to bring to order transgressors and to take care that the ministry be not corrupted and religion to suffer no harm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), iii, 318-19.</span></figcaption>

<blockquote><p>Evangelicals responded similarly to the Scottish cholera epidemic of 1832, organizing weekly, and even nightly, prayer meetings in the hope of arresting the advance of the disease. These meetings supplemented the fast days called by the government at the request of the Church of Scotland… As a result, Evangelicals also saw these public prayer meetings as a suitable context in which to ask God to send religious revival. This latter purpose prevailed after the threat of the epidemic passed away, at least among groups in the parish of Kilsyth, which continued to meet during the remainder of the 1830’s, asking God ‘to awaken a spirit of earnest and vital religion among them, and throughout the Christian Church generally’ .</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-alan-currie.html">David Alan Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Growth of Evangelicalism in the Church of Scotland</cite>, 1793-1843 PhD diss. (Univ. of St. Andrews, 1991)</span></figcaption>

<blockquote><p>Verse 16. ‘Thine eyes did see my substance yet being unperfect,’ etc.] That is, so soon as ever I was conceived, whilst I was yet an imperfect embryo: and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them; that is, all those members of my body, which in continuance of time grew to have their perfect shape, were as clearly seen by thee, even when as yet there was none of them that had their shape and proportion, as those things are seen by men…</p></blockquote>

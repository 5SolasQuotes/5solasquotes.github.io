<blockquote><p>[If a man, etc.] The argument in this verse is as follows: “Even among yourselves you circumcise a child on the Sabbath day, when it happens to be the eighth day after his birth, in order that the law of circumcision, which your great lawgiver Moses sanctioned and re-ordained, should not be broken. You thus admit the whole principle that there is some work which may be done on the Sabbath day. Is it then just and fair to be angry with Me because I have done a far greater work to a man on the Sabbath than the work of circumcision? I have not wounded his body by circumcision but made him perfectly whole. I have not done a purifying work to one particular part of him but have restored his whole body to health and strength. I have not done a work of necessity to one single member only but a work of necessity and benefit to the whole man.”

I cannot see any ground for the idea suggested by Alford that our Lord implies in this verse that the law of the Sabbath is a mere Judaical practice and comparatively a modern ordinance, and that as such it properly gave way to the older and higher law of circumcision which was “of the Fathers.” It might be replied, firstly, that the Sabbath is so far from being a Judaical institution that it is actually older than circumcision and was appointed in Paradise. It might be replied, secondly, that our Lord seems purposely to guard against the idea by speaking of circumcision as “given by Moses” and as a part of “the law of Moses.” In fact, He does this twice with such curious particularity that one might think He meant to guard against anyone wresting this passage into an argument against the perpetual obligation of the Sabbath day.

He is pleased for the occasion to speak both of circumcision and the Sabbath as part of “the law of Moses.” He did this purposely because the minds of His hearers were full of Moses and the law at this particular period. And His argument amounts to this: that if they themselves allowed that the Mosaic law of the Sabbath must give way in a case of necessity to the Mosaic law of circumcision, they admitted that some works might be done on the Sabbath day, and therefore His work of healing an entire man on the Sabbath day could not be condemned as sinful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 27-28.</span></figcaption>

<blockquote><p>Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-richardson.html">John Richardson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Choice Observations &amp; Explanations upon the Old Testament</cite>, … which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.</span></figcaption>

<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.”

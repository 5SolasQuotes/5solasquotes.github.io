<main class="wrap"><figure class="quote" id="q-9aa27b38b9" data-kw="">
<blockquote><p>What is the end of our Justification? … Lastly, that we ourselves might be bettered and made righteous. Gal. 2:17, “If then while we seek to be made righteous by Christ, we ourselves are found sinners, is Christ therefore the minister of sin? God forbid.” For to this end are we justified by faith through Christ, that the old man being abolished by the power and efficacy of Christ crucified, Christ might live in us and that we should by our study and labor endeavor to bring forth good works, [and] show ourselves thankful to God for so great a benefit. And therefore it is that the apostle Paul almost in all his epistles derives the doctrine of sanctification, or good works, from the doctrine of faith or justification as the cause from the effect, or the necessary consequent from the antecedent. What are the adjuncts of Justification? … For saiys Augustine, good works do follow a man already justified, and do not go before a man that is to be justified, as good fruits are not before a good tree… The works accompanying or following it are… Moreover the adopting of us to be sons of God, our sanctification or newness of life, the fruits whereof are described, Gal. 5:22. For they that are made partakers of Christ through faith, they do with Him receive the Holy Ghost, the author of all holiness; from whence it is, that these two benefits are indeed distinguished one from another, but yet so linked together by an unseparable bond that they can never be plucked asunder; and the latter is the testimony of the former, both in the soul of the faithful man himself and to other men also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (London, 1606), ch. 31, ‘Justification’</cite>, pp. 354-56</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-315e5be683" data-kw="">
<blockquote><p>…Which comes to pass thus: 1. By habitual grace infused, the sanctified will is constantly determined to embrace all spiritual good. 2. By assisting grace the will is stirred up, provoked, allured and inclined to obedience, through the proposal of the promises and the heavenly suggestions of the Holy Spirit. 3. By the same assisting grace all contrary motions of concupiscence are subdued and kept under. So that nothing can hinder obedience to follow; because by grace the will is made willing to obey and by grace all impediments in obeying are taken away: now when all lets are removed, what can let a willing mind to do that which it desires?</p></blockquote>

</figure><figure class="quote" id="q-64238780e6" data-kw="">
<blockquote><p>XX. But, you might say, the apostle himself implies that some are perfect, and includes himself among them. For he adds, “All of us, then, who are mature should take such a view of things” (Phil. 3:15). And in 1 Cor. 2, he says, “We do, however, speak a message of wisdom among the mature.” Many holy men in Scripture are also testified to be perfect. Thus, it is said of Noah, “Noah was a righteous man, blameless among the people of his time, and he walked faithfully with God” (Gen. 6:9). And God Himself, speaking to Satan about Job, says, “Have you considered my servant Job? There is no one on earth like him; he is blameless and upright, a man who fears God and shuns evil” (Job 1:8). Indeed, David in Ps. 18 does not hesitate to attribute such perfection to himself. He says, “I have been blameless before him and have kept myself from sin. The Lord has rewarded me according to my righteousness, according to the cleanness of my hands in his sight.</p></blockquote>

</figure><figure class="quote" id="q-e3cb1665bd" data-kw="">
<blockquote><p>Now yet this might stand, if as learned Mr. [William] Pemble and others assert, sanctification does, in order of nature, precede justification, and which to me seems not remote from truth, or prejudicial to the grace of justification at all, and withal consonant to right reason, for if (as all grant) justification be upon an act of faith on Christ for justification, and that not until then we are justified, as all do and must acknowledge that hold justification by faith, according to the Scriptures, and that an act of faith must proceed from a principle of faith habitually wrought, then necessarily sanctification, taking it for the principles of habitual sanctification, must be in order of nature afore justification; for the seed and principle of faith is a part, and a principal part, of regeneration or sanctification, as taken in that sense, for the working the principles of all grace, and so is agreeable to that order and chain, Rom. 8:29, where ‘called’ is put before being ‘justified,’ as predestination is put before being called, understanding calling, of the working [of] the principles of regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Man’s Restoration by Grace, ch. 5 in Works (Edinburgh: James Nichol, 1861)</cite>, p. 537</span></figcaption>

ooks Online</a></div>
</figure><figure class="quote" id="q-f3489fda81" data-kw="">
<blockquote><p>First, in the Creation; his essence and attributes are clearly revealed, his absolute power, unerring wisdom, and infinite goodness are discovered to every capacity; therefore the apostle urges this as the most proper argument to convince the heathens, Acts 14:15, ‘That they should turn from their vanities, to the living God which made heaven and earth, and sea, and all things that are therein.’ To this they must naturally assent, as shadows represent the figure of those bodies from whence they are derived; so in the world there are such traces of the divine perfections that it is easy to infer there is a Sovereign being which is the cause of it; all the creatures and their various excellencies are as so many beams which reflect upon this Sun, or lines which direct to this Center; nay, the meanest being carries some impression of the first cause, as the image of a prince is stamped upon a penny, as well as upon greater money; the beasts will instruct, and the mute fishes teach the atheist there is a God; and though he is not discerned by the outward sight, yet the understanding will as certainly discover him as it does an invisible spirit in a living body…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in The Morning Exercise Methodized… by several Ministers of the City of London… (London: E.M. for Ralph Smith, 1660), Sermon 2, ‘God is’</cite>, p. 31</span></figcaption>

<div class="actions"><button class="copy" data-copy="“First, in the Creation; his essence and attributes are clearly revealed, his absolute power, unerring wisdom, and infinite goodness are discovered to every capacity; therefore the apostle urges this as the most proper argument to convince the heathens, Acts 14:15, ‘That they should turn from their vanities, to the living God which made heaven and earth, and sea, and all things that are therein.’ To this they must naturally assent, as shadows represent the figure of those bodies from whence they are derived; so in the world there are such traces of the divine perfections that it is easy to infer there is a Sovereign being which is the cause of it; all the creatures and their various excellencies are as so many beams which reflect upon this Sun, or lines which direct to this Center; nay, the meanest being carries some impression of the first cause, as the image of a prince is stamped upon a penny, as well as upon greater money; the beasts will instruct, and the mute fishes teach the atheist there is a God; and though he is not discerned by the outward sight, yet the understanding will as certainly discover him as it does an invisible spirit in a living body…”

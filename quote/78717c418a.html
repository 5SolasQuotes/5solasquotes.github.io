<blockquote><p>We therefore disallow all such things as are repugnant to this foresaid doctrine, confirmed by the scriptures, and chiefly these special points: .. 3. That the church does so consist of the elect and of true saints that in it should be contained no hypocrites, and that in the Scriptures they should never be comprehended under the Church’s name. …

7. So to bind the church to certain places and persons, as to say there only with them is the church.

8. Not to acknowledge those for Christ’s churches, which, although they hold the grounds of faith, yet in ceremonies or in some part of doctrine do not altogether jump with us.

9. To make a separation from the churches upon any error or for the ill life of some men. 10. …and contrariwise, that those are not true churches which, although they keep fast the true doctrine, right sacraments and pure discipline, yet cannot show a continuance and succession of bishops never broken.</p></blockquote>

<blockquote><p>Schism has ever proven exceeding hurtful to the Church, and has been an inlet and nursery to the greatest errors: It is most pressingly condemned in the Scriptures, even with as great weight as corrupt doctrine and heresy are; and it is attributed to that same original, to wit, the flesh, with witchcraft, idolatry, heresy, etc. Gal. 5:20. It has also proven most dangerous to those who have been engaged therein, and often has been a snare to bring on spiritual desertion, deadness of spirit, security, self-confidence, or some other spiritual evils of that kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

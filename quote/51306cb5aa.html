<main class="wrap"><figure class="quote" id="q-51306cb5aa" data-kw="">
<blockquote><p>John affirms that that part of the doctrine of Christ which is necessary and sufficient for true faith and salvation has been written. Therefore it is clear that though not everything … was written, nevertheless, whatever of the doctrine and miracles of Christ is necessary and sufficient for true faith and eternal life has been written.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3906a14668" data-kw="foreknowledge contingents">
<blockquote><p>Do all things fall under the knowledge of God, both singulars and future contingencies? We affirm against Socinus. He knows all things perfectly, undividedly, distinctly and immutably. Perfectly because he knows all things by himself or by his essence. Undividedly, because he knows all things intuitively and noetically, not discursively and dianoetically.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.12.1–2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

</figure><figure class="quote" id="q-dd70aeaad2" data-kw="scientia media">
<blockquote><p>Besides these two species of divine knowledge, a third was devised by the Jesuits, Fonseca, Lessius, Molina, which they called “middle knowledge.” Is there a middle knowledge in God between the natural and the free? We deny against the Jesuits, Socinians and Remonstrants. The free knowledge depends upon his will and decree by which things pass from a state of possibility to a state of futurition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.13.1–2</span></figcaption>

</figure><figure class="quote" id="q-5cdc07d4df" data-kw="Wisdom">
<blockquote><p>It is a marked proof of the wisdom of God that he can so direct all the affairs of the universe as, without need of special action, to accomplish all the events he chooses. All providence, therefore, is general, because operated through general laws. It is also special, because every individual event comes to pass under God&#x27;s own inspection, and through his own will and work.</p></blockquote>

</figure><figure class="quote" id="q-f2494a6812" data-kw="Contentment Wisdom">
<blockquote><p>We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (variety and order of providence)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-117f61ca3c" data-kw="">
<blockquote><p>Christ could not have warned men so frequently and earnestly as he did against “the fire that never shall be quenched,” and “the worm that dieth not,” had he known that there is no future peril fully corresponding to them. That omniscient Being who made the statements respecting the day of judgment, and the final sentence, that are recorded in Matthew 25:31-46, could neither have believed nor expected that all men without exception will eventually be holy and happy.

To threaten with “everlasting punishment” a class of persons described as “goats upon the left hand” of the Eternal Judge, while knowing at the same time that this class would ultimately have the same holiness and happiness with those described as “sheep upon the right hand” of the judge, would have been both falsehood and folly. The threatening would have been false.

For even a long punishment in the future world would not have justified Christ in teaching that this class of mankind are to experience the same retribution with “the devil and his angels;” for these were understood by the Jews, to whom he spoke, to be hopelessly and eternally lost spirits. And the threatening would have been foolish, because it would have been a brutum fulmen, an exaggerated danger, certainly in the mind of its author. And for the persons threatened, it would have been a terror only because they took a different view of it from what its author did — they believing it to be true, and he knowing it to be false!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), pp 13-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

es.github.io%2Fquote%2F117f61ca3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/117f61ca3c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/01/24/w-g-t-shedd-on-christs-threatenings-concerning-eternal-punishment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc149ce3ee" data-kw="">
<blockquote><p>And although there be many curious persons which think those times to be most happy, in the which God by so many ways spake unto the fathers, and doe affirm that they would more willingly believe the word of God, if so be it would please him to talk with them after that fashion. Notwithstanding, if we well consider of the matter, now that Christ is come, and hath published his Gospel throughout the whole world, we must needs confess, that the times are much more happy, than they were in times past. For God hath spoken with us, not by Angel, not by dreams, or visions, but by his own son our Lord, and Saviour Jesus Christ, who by his divine majesty excelleth all Angels. Whereupon in the Epistle to the Hebrews it is written. In these last days God hath spoken unto us by his son, whom he hath appointed heir of all things.

And Christ himself saith: Blessed are the eyes which see those things that ye see. And straight after he addeth saying: many have desired to see those things that ye see, and have not seen them. And the Apostle Paul saith: Now salvation is nearer unto us than it was then. For seeing that the son of God is commended unto us by the voice of God from heaven, saying: This is my beloved son, hear him. He is most happy which so heareth him by his Gospel, that by faith he comprehendeth the same, &amp; obeyeth his calling. For whosoever he be that believeth not this son of God, he will not believe, though all the Angels in heaven, all the Patriarchs, all the Prophets and fathers stood before him to testify of the word of God. Wherefore, let us not neglect the felicity and happiness of our time, but let us attend and give ear to the voice of the son of God, whereby we may obtain everlasting salvation.</p></blockquote>

</figure><figure class="quote" id="q-d616c94f53" data-kw="">
<blockquote><p>Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David B. MacKinnon</cite>, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).”

— Richard Sibbes, David B. MacKinnon, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHeaven+is+not+heaven+without+Christ.+It+is+better+to+be+in+any+place+with+Christ+than+to+be+in+heaven+itself+without+him.+Paul+loved+to+see+Christ%2C+to+embrace+him%2C+and+enjoy+him+that+had+done+so+much+and+suffered+so+much+for+his+soul.+To+be+with+Christ+is+to+be+at+the+springhead+of+all+happiness.+Every+creature+thinks+itself+best+in+its+own+element%2C+that+is+the+place+it+thrives+in%2C+and+enjoys+its+happiness+in%3B+now+Christ+is+the+element+of+a+Christian.+Again%2C+it+is+far+better%2C+because+to+be+with+Christ+is+to+have+the+marriage+consummated.+Is+not+marriage+better+than+the+contract%3F+Is+not+home+better+than+absence%3F+To+be+with+Christ+is+to+be+at+home.+Is+not+triumph+better+than+to+be+in+conflict%3F+But+to+be+with+Christ+is+to+triumph+over+all+enemies%2C+to+be+out+of+Satan%E2%80%99s+reach.+Is+not+perfection+better+than+imperfection%3F+Here+all+is+but+imperfect%2C+in+heaven+there+is+perfection.+Here+the+grace+in+a+man+is+with+combat+of+flesh+and+spirit%2C+but+in+heaven+there+is+pure+peace%2C+pure+joy%2C+pure+grace.+Grace+indeed+is+glory+here%2C+but+it+is+glory+with+conflict.+Is+it+not+much+far+better+to+die%2C+that+we+may+be+with+Christ%2C+than+to+live+a+conflicting+life+here%3F+Death+is+but+a+grim+sergeant+that+lets+us+into+a+glorious+palace%2C+that+takes+off+our+rags%2C+that+we+may+be+clothed+with+better+robes%2C+that+ends+all+our+misery%2C+and+is+the+beginning+of+all+our+happiness.+Why+should+we+be+afraid+of+death%3F+It+is+but+a+departure+to+a+better+condition.+It+is+but+as+Jordan+to+the+children+of+Israel%2C+by+which+they+passed+to+Canaan.+Of+itself+it+is+an+enemy+indeed%2C+but+now+it+is+harmless%2C+nay%2C+now+it+has+become+a+friend.+It+is+one+part+of+the+church%E2%80%99s+journey.+It+ends+all+our+misery+and+si

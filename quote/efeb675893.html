<main class="wrap"><figure class="quote" id="q-efeb675893" data-kw="liberty of decree">
<blockquote><p>The liberty of the divine decree does not hinder it from being God himself because it is free only terminatively and on the part of the thing, but not subjectively and on the part of God. It is free in the exercised act inasmuch as it resides in the liberty of God to decree this or that thing. It is not free in the signified act because to decree anything depends upon the internal constitution of God by which he understands and wills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1.13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/necessity-and-contingency.html">Necessity and Contingency</a> › <a href="../topics/the-decrees-of-god/necessity-and-contingency/the-decree-and-human-liberty.html">The decree and human liberty</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7be12b839e" data-kw="Author of sin Justice">
<blockquote><p>We teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.</p></blockquote>

</figure><figure class="quote" id="q-68e1533d1d" data-kw="">

</figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>

</figure><figure class="quote" id="q-360e80a51b" data-kw="Author of sin The Fall Permission">
<blockquote><p>To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)</span></figcaption>

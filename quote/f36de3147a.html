<main class="wrap"><figure class="quote" id="q-f36de3147a" data-kw="Author of sin|Satan">
<blockquote><p>Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed-churches.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The French Confession</cite>, 1559, Art. 8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2dfa75593b" data-kw="Author of sin|Satan">
<blockquote><p>Of the author of sin, we confess that our Lord God, though He is the creator and sustainer of all creatures, yet He is not the author of sin. It is rather the evil will, both in the Devil and in the godless human, that, when he does not obtain help from the Lord God, turns away from God, as Christ speaks in John 8, “When the Devil speaks a lie, he speaks of his own, for he is a liar and the father of lies” (v. 44).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bohemian-brethren.html">Bohemian Brethren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bohemian Confession</cite>, 1575/1609, Art. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>

</figure><figure class="quote" id="q-e710bbc718" data-kw="Author of sin">
<blockquote><p>Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).</p></blockquote>

</figure><figure class="quote" id="q-215040d6fd" data-kw="Author of sin|Justice|Satan|The Fall">
<blockquote><p>Just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-debrecen.html">Synod of Debrecen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Documents of the Synod of Debrecen</cite>, 1567</span></figcaption>

</figure><figure class="quote" id="q-c71e2bebb7" data-kw="Author of sin|Hardening|Justice|Depravity">
<blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-2b3f2cfaf8" data-kw="">
<blockquote><p>But we do exclude from baptism the children of those who clearly are strangers to the covenant, such as the children of heathens, Muslims, Jews, and of similar people… And for this reason we should leave them–like foreigners–to the judgement of God… unless they happen through lawful adoption or through the just and properly-designated status of slaves to be enrolled and taken up into the families of believers as though belonging to them.† For in this case many Reformed churches do baptize those children, because they deem that God has adopted them into the fellowship of his covenant in this manner, that is to say by the covenant of Genesis 17:12-13, which in the early church was so far beyond debate that from it Augustine on several occasions deduced a powerful argument against the Pelagians for election by grace. [On the Grace of Christ &amp; on Original Sin 2.35 in NPNF1 5.249-50] † This is a remarkable position, given the fact that the Synod of Dort had decided negatively on the issue in response to a question from East-India if it was allowed to baptize a child from pagan parents adopted into a Christian family. At the synod, the professors and the delegates from Zeeland, Friesland and Utrecht did not object to baptism, together with the majority of foreign delegates, but the delegates from Holland and Gelderland objected because human adoption does not imply divine adoption. Adopted children first had to profess faith and only then could be baptized, though as infants they could be commended to God’s gracious care by the laying-on of hands. See Acta of the Synod of Dordt, eds. Donald Sinnema, Christian Moser, and Herman Selderhuis (Gottingen: Vandenhoeck &amp; Ruprecht), 30-32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (1625; Brill, 2020), vol. 2, Disputation 44, ‘On the Sacrament of Baptism’, section 49, p. 165</span></figcaption>

<blockquote><p>III. Here therefore we think the question can be solved by distinguishing heretics. For there are some who corrupt the substance of baptism and omit or change the form of institution; such as were the ancient Arians, who denied a Trinity of persons in unity of essence, and the modern Socinians. Others, while they retain substantials and defend the true doctrine of the holy Trinity contained in the formula of baptism, ‘err on other heads of doctrine’; as the ancient Novatians and Donatists, and the modern Romanists and Arminians. As to the former, we judge that baptism administered by them is null, and so they are not properly to be rebaptized, but baptized, who have been baptized by such heretics, because they evidently corrupt the essential form of baptism, to which the invocation of the Trinity belongs. For this reason, the baptism of the Arians, who baptized ‘in the name of the Father, the only true God, in Jesus Christ, the Savior and a creature, and in the Holy Spirit, the servant of both’… was formerly rejected in the Nicene Council… Still a distinction must be made here again. For either the minister alone was infected with that heresy or the whole church with him. If the latter, we deny it to be true baptism. If the former (to wit, if the church thinks rightly, notwithstanding the error of the pastor, if he is a secret heretic), provided the formula of Christ be retained, we believe the baptism to be valid and that it is not necessary to rebaptize those who have been once baptized. The sacrament is the property of the church, which is administered in her name and in her faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 15, ‘Is Baptism Administered by Heretics Lawful? We Distinguish’ in Institutes (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, pp. 396-98</span></figcaption>

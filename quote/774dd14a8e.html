<main class="wrap"><figure class="quote" id="q-774dd14a8e" data-kw="">
<blockquote><p>4. Pride and contempt are only seen to God: Prelates have no place to punish heart-acts; they are to prove by two witnesses the malice, and pride, and contempt of authority; but this is invisible to men’s eyes. Refusal of obedience to canons touching indifferent things, the necessity whereof (as the doctor must say) comes only from man’s will, cannot be contempt: The neglect of a command of God is indeed a virtual contempt of the majesty, authority, power and justice of God, because a command of God has essentially, equity and justice in it, from God’s commanding Will: But a command of a thing indifferent, that may as well, without sin, be left undone, as done (as our doctor says of our ceremonies) can never have equity or goodness from human authority; and I never contemn human authority except I contemn the just laws made by human authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 655</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afc5f31ec4" data-kw="">
<blockquote><p>3. Suppose that the suffrage and voice of a pastor and of an elder be voices different only in diverse relations to diverse officers, to wit, the pastor and the elder; yet in the matter of bearing weight in the conscience from force of truth, and not from the authority of men, they are equal; and therefore ruling elders having knowledge and light, and withal authority of office, may well have voices [in Church courts]: But it follows not hence that these who have knowledge are formal canon-makers, because the decrees and constitutions of synods lay two obligations upon the people: [1.] One for the matter, and so in respect that in the moral part thereof they must be agreeable to the Word, they bind the consciences to an obedience of conscience. 2. They impose an ecclesiastical tie from the authority of the council and canon-makers, and so they require subjection or obedience of reverence for the authority-official that is in the canon-makers: The second command lays on the first bond or tie, and the first command lays on the other bond and tie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 19, pp. 290-1</span></figcaption>

</figure><figure class="quote" id="q-0c33103c99" data-kw="">
<blockquote><p>Second, there are means of a most indispensable kind to be employed in the way of explanation and instruction, counsel and persuasion, to secure the convictions and concurrence of the private members of the Church, in whatever act or declaration the rulers, in the exercise of their judicial, or legislative, or administrative functions, may find it necessary for them to perform or to adopt. Without the use of such means to carry the conscience and understanding of the members of the Church along with them in all that they do and declare, the office-bearers are not at liberty to use or enforce their peculiar power at all. And it is only when all such means have been employed and exhausted without effect, and when the members of the Church, so dealt with in the way of Christian persuasion and instruction, still refuse their concurrence, that it may be necessary and is lawful to use authority to strengthen the appeal, and to fall back upon the ultimate resource of all societies, — namely, the inherent right of the rulers to rule, and the no less inherent duty of the ruled to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, vol. 1 (Edinburgh, 1868), pp. 241-3</span></figcaption>

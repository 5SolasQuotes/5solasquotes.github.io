<blockquote><p>Finally, one thing merits serious consideration by all those who earnestly desire to have such schools and languages established and maintained in Germany. It is this: no effort or expense should be spared to provide good libraries or book repositories, especially in the larger cities which can well afford it.

For if the gospel and all the arts are to be preserved, they must be set down and held fast in books and writings (as was done by the prophets and apostles themselves, as I have said above).

This is essential, not only that those who are to be our spiritual and temporal leaders may have books to read and study, but also that the good books may be preserved and not lost, together with the arts and languages which we now have by the grace of God. St Paul too was concerned about this when he charged Timothy to give attention to reading [I Tim. 4:13], and bade him bring with him the parchments from Troas [II Tim. 4:13]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Councilmen of all Cities in Germany that they Establish and Maintain Christian Schools</cite>, (1524), trans. A. T. W. Steinhaeuser, rev. W. I. Brandt in Luther’s Works: The Christian in Cociety II, ed. W. I. Brandt (55 vols, Philadelphia PA: Fortress Press, 1962), 45: 373.</span></figcaption>

raries/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-792cfe5dde" data-kw="">
<blockquote><p>What shall it profit a man, if he gain the whole world, and lose his own soul? said our Saviour, who was to lay down a ransom for it, and knew well that it would cost infinitely more than the world was worth. Yet, the most of men value their own souls at a far lower rate than the whole world, losing them for broken morsels of it: yea, many times for vain hopes that are never accomplished. And as these men make a miserable bargain, so on the contrary, they that lose the world, or any thing worldly, yea, though it were the whole, to save their souls, make a profitable loss of it.

Nature teaches men to hazard and lose all for the life of the body rather than lose it, (although it proves many times very uncomfortable by the loss of these outward things,) and yet, the most part of men pass their whole life-time without one serious thought of the excellency and importance of their souls, whose life and happiness is of a higher nature, and neither consists in, nor depends upon, any thing here below. Hence it is, that while they use the helps of this present life, and the defences of it when it is in danger, and use them with so much diligence and attention, the means of that better life of their better part, their souls, they either use not at all, or so slightly and coldly that they never find salvation in them.

You may find it some way in yourselves: the threatenings and preparations of men against you, have awakened and roused you more to think upon means of your temporal safety; but how few are sensible and afraid of the wrath of God, who, as our Saviour tells us, can kill both body and soul, and cast them into hell! You want not frequent advertisement from the word of God, so plentifully preached, that many are perishing, one part in gross ignorance of God, another in profane and licentious living, and the greatest part in a formal and lifeless profession of religion, without the power of it; and yet, where are they who lay it to heart, and bestir themselves to rescue their souls from destruction?

Certainly, whatsoever men profess, it is unbelief that is the cause of impenitence. Men are not convinced of the purity of God’s nature, nor sensible of the impurity of their own; therefore they apply not themselves in good earnest to the work of repentance, and to reformation, the liveliest part of it. Labour, then, for a more active and practical knowledge of God and Divine truths, such as may humble and renew your souls; not only that you may be delivered from outward troubles that threaten you, but much more, that you may escape the wrath to come.

And because neither the word preached, nor judgments, nor mercies that are set before you, are sufficient to quicken a dead soul, or soften a hard heart, without the effectual concurrence of the Spirit of God, let us have recour.se to the throne of grace, by humble and earnest prayer, in the name and mediation of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 93-94.</span></figcaption>

</figure><figure class="quote" id="q-833306a171" data-kw="">
<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVIII Sermons on the Second Chapter of the 2nd Epistle to the Thessalonians</cite>, … (London, 1679), 340–42 [Spelling and punctuation modernized].</span></figcaption>

<blockquote><p>Vers. 10. We have an Altar, whereof they have no right to eat, which serve the Tabernacle.

Reas. 6. They that serve the Jewish Tabernacle after Christ’s coming, or they that pertinaciously cleave to Levitical Ceremonies, cannot be partakers of Christ, which is the thing signified to us by the Altar, and Sacrifices, and other Levitical shadows, and is the true body of them all: Therefore the Doctrine of Faith is to be preserved from the leaven of the Jewish Doctors, who thought that the observation of these Ceremonies was to be joined with the Gospel.

To which purpose the same Apostle saith, Gal. 5.2. If you be circumcised, Christ shall profit you nothing, The reason whereof is this, The observers of Legal Ceremonies, or they that receive shadows now abolished, do in the prescribed distinction of meats, observation of Altars, Feasts, Jubilees, Holy water, Priests garments, and the like Ceremonies, really shew forth that the Sun of Righteousness is not yet risen, that Christ is nor yet come, that the Ceremonial Pedagogy is not yet abolished; but that still the time of shadows and signs, which were instituted only to prefigure Christ, until the time of Reformation.

Vers. 11. For the bodies of these beasts, whose blood is brought into the Sanctuary by the High Priest for sin, are burnt without the Camp.

12. Wherefore Jesus also that he might sanctify the people with his own blood, suffered without the gate.

He proves that they are to be excluded from Christ, who seek righteousness, or part of righteousness, in the shadows or works of the Law; because God hath prefigured this in the type of the Expiatory Sacrifice; from Levit. 23.27. The blood of the Expiatory Sacrifice was brought by the High-Priest into the Sanctuary, but the flesh was wholly burnt with fire, neither did any thing thereof come to the Priests, as was given to them from the other Sacrifices. The Apostle affirms that this signified, that none of those who adhere to the Covenant of Works, could eat Christ, but were to be excluded from communion with them, as many as do not firmly adhere to Christ, but seek even the least part of righteousness in the Levitical shadows, or works.

Without the Camp] God signified by this; First, That Christ was to suffer without the gates of Jerusalem, and that is plainly come to pass; for Christ was crucified without the gate. Secondly, That true expiation was to be sought in the blood of the Messias, that suffered without Jerusalem, (or the place consecrated for the Levitical worship) And the Apostle also doth teach, that Christ himself intended this, (having by his providence so disposed of every thing, that he should suffer without the City) viz. that Christ going without the gates to offer up himself, would by that very thing signify, that there was no virtue of Justification or Sanctification to bee sought in any legal Rites, but only in his own blood, all those legal Rites being excluded.</p></blockquote>

<blockquote><p>You will reap both pleasure and profit from this Observation; that the true Protestant differs from all sorts of men and Religions, by making the three Persons in Trinity, according to their several properties, the foundation of all truth.

1. He distinguisheth himself from the Atheists, by worshipping the Father as the Fountain of truth.

2. He dissents from Mahumetans, Indians, Infidels, while he sets up Christ in himself, for the only Image of truth.

3. By seeking and embracing the discovery of truth in the Spirit, he differs from all sorts of Christians; especially three.

1. The Papists, a Faction of policy. These persuade us to receive the testimony, not of the Spirit, but of the Church, for a Touchstone of truth: And this Church is the Popes private Consistory, or General Council. Thus the Church’s Authority, not the Demonstration of the Holy Ghost shall be the light of Faith to Truth. Thus not content with an Antichrist, they set up their Consistory, or Council for an Anti-spirit. But we need no visible Judge on earth, to determine upon our consciences; What is Scripture; what is the sense of Scripture. We have an invisible Judge and Witness in our own breasts: He that believeth, hath the testimony in himself, 1 Joh. 5. chap. 10. v. for he hath the Spirit.

2. The Arminians, a Sect of Moralists, who give the over-persuading power of the Spirit, to strength of Rhetoric and Reason, inward or outward.

3. A Party of wit and worth: so far as the wit and worth of man can go; if they would submit the wit and worth of man to the Power and Wisdom of God: The Socinians; the Principles of Reason, are the pillars of Religion, and truth to these men. But Reason is a pillar of a Cloud; the Spirit only is the pillar of Fire, which hath light in it. Reason is that Gladius versatilis, that sword in that hand of the Cherubim, that kept Paradise; a sword that turns every way. It may keep men from the tree of Life, but can never bring them to it. Our faith is not in the wisdom of man, but power of God, 1 Cor. 2. chap. 5. verse.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-161db8e3b5" data-kw="">
<blockquote><p>I beseech you, once know and consider your estate, that you may open your hearts to this Redeemer, that you may be willing to be stripped naked of all your imaginary righteousness, to put on this, which will satisfy the Law fully. Will you die in your sins, because you will not come to Him to have life? Will you rather be condemned with sin, than saved with Christ’s righteousness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary… (d. 1653; Edinburgh: Swintown, 1670) | sermon 14, on Rom. 8:4</cite>, p. 113</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c519eef0e2" data-kw="">
<blockquote><p>A crucified Christ, with all his purchase, is offered to all the hearers of the gospel: for Christ in his Word, and by his ministers in the gospel-offer, speaks to all and every one of them; yea, speaks to every sinner, man and woman in particular, as though He called them by name and surname. And every man is bound to take the call and offer home to himself, as if he were so named, and believe that Christ stands at his door and knocks, saying, ‘If you, or any man, will open to me, I will come in.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-willison.html">John Willison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacramental Meditations, in The Whole Works of John Willison, 1816, vol. 3 | Meditation 25</cite>, pp. 286-88</span></figcaption>

</figure><figure class="quote" id="q-cbb697c9ed" data-kw="">
<blockquote><p>I answer briefly that God does always begin to us, and is beforehand with us in all dealings with ourselves. He gives us many motions, and never withdraws Himself from us but when He is despised and slighted first: therefore let us take heed that we labor to answer Christ’s call when He does call. If we slight it, then in a judicious course, He ceases to speak further to us, if we slight his beginnings of revelations… We would not yield to all the passages of salvation; but when He was beforehand with us, and offered many sweet motions, yet we loved our sins better then our souls, and so repelled all. Therefore I beseech you do not refuse the sweet messages from Heaven, the gracious and sweet motions of the spirit of Christ, make much of them. God has begun to you, be sure to answer. Learn it of Mary, when Christ began [after his resurrection], she set not her heart and infidelity against it, but she opened her heart, and said, ‘Rabboni’ [Jn. 20:16]; learn therefore the duty of spiritual obedience, when God speaks, ‘Speak Lord, for thy servant hears.’ Do not shut your ears to the motions of God’s blessed Spirit, do not harden your hearts against his voice, but open your hearts as she did, ‘Rabboni’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Heavenly Conference between Christ &amp; Mary after his Resurrection… (d. 1635; London: 1654)</cite>, pp. 21-22</span></figcaption>

</figure><figure class="quote" id="q-b36db8eea7" data-kw="">
<blockquote><p>Now the Son of the ever blessed God tenders Himself to you with many entreaties, goes after you up and down, night and day, knocking at the door of your heart, with all his graces, comforts, and fruits of his death, by the ministry of his word, the motions of his Spirit, multitudes of temporal and spiritual mercies; but you, unworthy wretch, slights both Him and his precious attendants, and esteems your shop and stock, your corn and carnal comforts, far before Him…</p></blockquote>

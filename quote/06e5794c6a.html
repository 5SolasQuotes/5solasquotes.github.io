<main class="wrap"><figure class="quote" id="q-06e5794c6a" data-kw="">
<blockquote><p>Bodies are in places circumscriptively bounded by their dimensions without penetration. Angels are in places definitively, that is, though they are not bounded by dimensions of height, breadth and depth, as bodies, yet they are not in two places at once; whilst they are in this place, they are not in another. God is in every place always.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3deccb32a6" data-kw="">
<blockquote><p>Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11), angels, by reason of the quickness and strength of their understanding, apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London, 1654), ch. 1, Of the Divine Essence, pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-5569676ec3" data-kw="ministry angels heirs">
<blockquote><p>No one can doubt that God uses the ministry of angels, since they are called “ministering spirits” (Heb. 1:14), “ministers of God” (Ps. 104:4), who continually stand before him and minister unto him (Dan. 7:10) and do his will (Ps. 103:21). He uses their help not from necessity and indigence, but from indulgence and love—for the good of the angels themselves and for the good of the heirs of salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8.1–2</span></figcaption>

</figure><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, p. 462</span></figcaption>

<blockquote><p>11. The angels, as touching their substance and nature, seeing they be spirits, cannot be expressed; yet is it lawful sometimes to picture them in such wise, as they have showed themselves unto men: for they be not, as God is, infinite; but are bounded and limited. Neither does the commandment of God forbid this, unless their pictures were made, to the intent they should be religiously and devoutly worshipped.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ea9900be34" data-kw="">
<blockquote><p>Therefore, in Psalm 22 (which was made for Christ when hanging on the cross, and speaks how his heart was taken up that while), he is brought in as putting forth such a faith as here we speak of, when he called God his God, ‘My God! my God!’ then, when as to his sense, he had forsaken him, ‘Why hast thou forsaken me?’ Yea, he helped his faith with the faith of the forefathers, whom upon their trust in him God had delivered; ‘Our fathers’, saith he, ‘trusted in thee; they trusted, and thou didst deliver them.’

Yea, at verse 5, we find him laying himself at God’s feet, lower than ever any man did, ‘I am a worm’, says he (which every man treads on, and counts it a matter of nothing for to kill), ‘and no man’, as it follows; and all this, because he bare our sins. Now his deliverance and justification from all these, to be given him at his resurrection, was the matter, the business he thus trusted in God for, even that he should rise again, and be acquitted from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Set Forth</cite>, (1642; Edinburgh: Banner of Truth, 2015), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

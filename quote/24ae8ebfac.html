<main class="wrap"><figure class="quote" id="q-24ae8ebfac" data-kw="">
<blockquote><p>From the remains of these two parts (faith and observance), two theologies sprang forth among some philosophers: metaphysics, and ethics. For metaphysics is the faith of the Aristotelians, and ethics is their observance. Hence, both these disciplines present that which teaches the supreme good of man. This is known to all concerning ethics. Moreover, concerning metaphysics, which they also call “theology,” this is what Suarez says, Disp. 1, Sect. 5, #43: “The blessedness of man consists in the most perfect act of metaphysics. It contemplates the supreme good and the last end of man simpliciter. Divine contemplation belongs to this science formally, or elicitively.” Therefore, when theology is rightly taught in these parts, their metaphysics and ethics disappears without hesitation, after brilliantly testifying to its distribution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla theologica (Amsterdam: Janson, 1634), bk. 1, ch. 2, ‘On the Distribution of Theology’, section 6, pp. 4-5 trans. Charles Johnson This section has been omitted from most English translations (e.g. London, 1642).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<main class="wrap"><figure class="quote" id="q-9e71713a47" data-kw="">
<blockquote><p>He then runs to the way of works by the law, and tries what he can do for his own salvation by his reformation, his prayers, years, vows, penances, and the like. When the man has wearied himself in pursuit of salvation in this way, and finds the law so holy, so spiritual and extensive, that it is impossible for him to obey it perfectly, then he will join Christ and the law together. I mean Christ and his law-works, and thinks with himself, ‘Now I cannot scale heaven, or make out salvation by my own obedience to it, I will rely upon Christ’s righteousness to supply my defects. Thus he takes the new cloth of righteousness to patch up [join together] his own filthy rags. And here it is that many a man stays, without going a step further, seeking salvation by Christ and the law together, which is the thing the apostle calls a ‘seeking righteousness, not directly, but as it were by works of the law.’ But when a sinner is brought really to trust in the Lord Jesus, he receives him, and rests upon him alone as he is offered in the gospel, disclaiming his own righteousness as filthy rags, saying with the apostle, ‘What things were gain to me, those I counted loss for Christ. Yea doubtless, I count all things loss, for the excellency of the knowledge of a Christ Jesus my Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Late Rev. Ebenezer Erskine</cite>, (Glasgow: Free Presbyterian Publications, repr. 2001), 414.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9fb981b913" data-kw="">
<blockquote><p>Here the question arises by what means are we justified? We answer with Paul, &quot;By faith only in Christ are we pronounced righteous, and not by works.&quot; Not that we reject good works. Far from it. But we will not allow ourselves to be removed from the anchorage of our salvation.</p></blockquote>

</figure><figure class="quote" id="q-6167a2af9c" data-kw="">
<blockquote><p>Redemption is a real deliverance from the evils of punishment, which is actually nothing but the carrying out of the sentence of justification. For in justification we are pronounced just and awarded the judgement of life. In glorification the life that results from the pronouncement and award is given to us: We have it in actual possession.</p></blockquote>

</figure><figure class="quote" id="q-239dfe3a91" data-kw="">
<blockquote><p>Now, to be justified is to be freed from the guilt of sin, or to have all our sins pardoned, and to have a righteousness wherewith to appear before God, so as to be accepted with him, and a right to the heavenly inheritance. Every believer hath other designs also, wherein he is equally concerned with this,—as, namely, the renovation of his nature, the sanctification of his person, and ability to live unto God in all holy obedience; but the things before mentioned are all that he aimeth at or designeth in his applications unto Christ, or his receiving of him unto justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, The Works of John Owen, 5:115.</span></figcaption>

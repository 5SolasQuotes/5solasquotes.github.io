<main class="wrap"><figure class="quote" id="q-b7f7f8b773" data-kw="">
<blockquote><p>They formerly asserted in their decrees that the righteousness of God was the only formal cause of Justification; now they anathematize those who say that we are formally righteous by the obedience of Christ. … if any one were to teach that we are righteous formally, i.e., not by quality but by imputation, meaning that our righteousness is in relation merely, there would be nothing worthy of censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on Canon 10</span></figcaption>

</figure><figure class="quote" id="q-a8c10b0015" data-kw="">
<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification through the Righteousness of Christ Alone</cite>, reply to the Anonymous Man’s Third Argument</span></figcaption>

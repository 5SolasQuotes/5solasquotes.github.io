<blockquote><p>VI. Episcopius, and with him the Remonstrants, deny that a covenant of nature was made with Adam (“Institutiones theologica,” 2.1 in Opera theologica [1678], p. 23); but it can be proved. (1) There are granted the essential parties of a covenant, God and man. God, who as the Creator of man, must also be his governor and from this, his legislator, and because good in his own nature, the rewarder also of those who seek him (Heb. 11:6), so that he would not only give him a law for his direction, but also hold forth a reward to him for keeping it (although bound by no right to that). Man who, because a creature, must also wholly depend upon God and, because upright, could keep the inscribed law, and because rational, ought not otherwise than in a rational manner (i.e., by the intellect and will) be governed, both by the prescription of a law, the promise of rewards and the threatening of punishment. Also since he was created after the image of divine holiness, he ought to have been led to a communion of that happiness also which is the inseparable attendant of holiness.

VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12).

VIII. Third, the passage in Hos. 6:7 seems not obscurely to intimate this: the Israelites are said to have “transgressed the covenant like Adam” (hmh k’dhm ‘bhrv bhryth). For although these words may also be explained of the inconstancy of men (that they may be said to have transgressed the covenant as men are wont to do, who are naturally false and fickle, and often deceive expectation), still nothing prevents their being referred also to Adam (that they may be said to have violated the covenant like Adam, their first parent, who miserably broke the covenant contracted with him by God). A similar locution occurs in Job 31:33: “If I covered,” says he, “my transgressions as Adam [k’dhm].” Here is a manifest reference to the fact of Adam’s endeavoring to excuse and hide his sin (Gen. 3:12).</p></blockquote>

<blockquote><p>This statement does not rest upon any express declaration of the Scriptures. It is, however, a concise and correct mode of asserting a plain Scriptural fact, namely, that God made to Adam a promise suspended upon a condition, and attached to disobedience a certain penalty. This is what in Scriptural language is meant by a covenant, and this is all that is meant by the term as here used. Although the word covenant is not used in Genesis, and does not elsewhere, in any clear passage, occur in reference to the transaction there recorded, yet inasmuch as the plan of salvation is constantly represented as a New Covenant, new, not merely in antithesis to that made at Sinai, but new in reference to all legal covenants whatever, it is plain that the Bible does represent the arrangement made with Adam as a truly federal transaction. The Scriptures know nothing of any other than two methods of attaining eternal life: the one that which demands perfect obedience, and the other that which demands faith. If the latter is called a covenant, the former is declared to be of the same nature. It is of great importance that the Scriptural form of presenting truth should be retained. Rationalism was introduced into the Church under the guise of a philosophical statement of the truths of the Bible free from the mere outward form in which the sacred writers, trained in Judaism, had presented them. On this ground the federal system, as it was called, was discarded. On the same ground the prophetic, priestly, and kingly offices of Christ were pronounced a cumbrous and unsatisfactory form under which to set forth his work as our Redeemer. And then the sacrificial character of his death, and all idea of atonement were rejected as mere Jewish drapery. Thus, by theory of accommodation, every distinctive doctrine of the Scriptures was set aside, and Christianity reduced to Deism. It is, therefore, far more than a mere matter of method that is involved in adhering to the Scriptural form of presenting Scriptural truths. God then did enter into a covenant with Adam. That covenant is sometimes called a covenant of life, because life was promised as the reward of obedience. Sometimes it is called the covenant of works, because works were the condition on which that promise was suspended, and because it is thus distinguished from the new covenant which promises life on condition of faith. …The condition of the covenant made with Adam is said in the symbols of our church to be perfect obedience. That that statement is correct may be inferred (1.) From the nature of the case and from the general principles clearly revealed in the word of God. Such is the nature of God, and such the relation which He sustains to his moral creatures, that sin, the transgression of the divine law, must involve the destruction of the fellowship between man and his Creator, and the manifestation of the divine displeasure. The Apostle therefore says, that he who offends in one point, who breaks one precept of the law of God, is guilty of the whole. (2.) It is everywhere assumed in the Bible, that the condition of acceptance under the law is perfect obedience. “Cursed is every one who continueth not in all things written in the book of the law to do them.” This is not a peculiarity of the Mosaic economy, but a declaration of a principle which applies to all divine laws. (3.) The whole argument of the Apostle in his epistles to the Romans and to the Galatians, is founded on the assumption that the law demands perfect obedience. If that be not granted, his whole argument falls to the ground. The specific command to Adam not to eat of a certain tree, was therefore not the only command he was required to obey. It was given simply to be the outward and visible test to determine whether he was willing to obey God in all things. Created holy, with all his affections pure, there was the more reason that the test of his obedience should be an outward and positive command; something wrong simply because it was forbidden, and not evil in its own nature. It would thus be seen that Adam obeyed for the sake of obeying. His obedience was more directly to God, and not to his own reason. The question whether perpetual, as well as perfect obedience was the condition of the covenant made with Adam, is probably to be answered in the negative. It seems to be reasonable in itself and plainly implied in the Scriptures that all rational creatures have a definite period of probation. If faithful during that period they are confirmed in their integrity, and no longer exposed to the danger of apostasy. Thus we read of the angels who kept not their first estate, and of those who did. Those who remained faithful have continued in holiness and in the favour of God. It is therefore to be inferred that had Adam continued obedient during the period allotted to his probation, neither he nor any of his posterity would have been ever exposed to the danger of sinning.</p></blockquote>

— Charles Hodge, Systematic Theology (repr. Oak Harbor, WA: Logos Research Systems, Inc., 1997), 2.117–18, 119–120.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+statement+does+not+rest+upon+any+express+declaration+of+the+Scriptures.+It+is%2C+however%2C+a+concise+and+correct+mode+of+asserting+a+plain+Scriptural+fact%2C+namely%2C+that+God+made+to+Adam+a+promise+suspended+upon+a+condition%2C+and+attached+to+disobedience+a+certain+penalty.+This+is+what+in+Scriptural+language+is+meant+by+a+covenant%2C+and+this+is+all+that+is+meant+by+the+term+as+here+used.+Although+the+word+covenant+is+not+used+in+Genesis%2C+and+does+not+elsewhere%2C+in+any+clear+passage%2C+occur+in+reference+to+the+transaction+there+recorded%2C+yet+inasmuch+as+the+plan+of+salvation+is+constantly+represented+as+a+New+Covenant%2C+new%2C+not+merely+in+antithesis+to+that+made+at+Sinai%2C+but+new+in+reference+to+all+legal+covenants+whatever%2C+it+is+plain+that+the+Bible+does+represent+the+arrangement+made+with+Adam+as+a+truly+federal+transaction.+The+Scriptures+know+nothing+of+any+other+than+two+methods+of+attaining+eternal+life%3A+the+one+that+which+demands+perfect+obedience%2C+and+the+other+that+which+demands+faith.+If+the+latter+is+called+a+covenant%2C+the+former+is+declared+to+be+of+the+same+nature.+It+is+of+great+importance+that+the+Scriptural+form+of+presenting+truth+should+be+retained.+Rationalism+was+introduced+into+the+Church+under+the+guise+of+a+philosophical+statement+of+the+truths+of+the+Bible+free+from+the+mere+outward+form+in+which+the+sacred+writers%2C+trained+in+Judaism%2C+had+presented+them.+On+this+ground+the+federal+system%2C+as+it+was+called%2C+was+discarded.+On+the+same+ground+the+prophetic%2C+priestly%2C+and+kingly+offices+of+Christ+were+pronounced+a+cumbrous+and+unsatisfactory+form+under+which+to+set+forth+his+work+as+our+Redeemer.+And+then+the+sacrificial+character+of+his+death%2C+and+all+idea+of+atonement+were+rejected+as+mere+Jewish+drapery.+Thus%2C+by+theory+of+accommodation%2C+every+distinctive+doctrine+of+the+Scriptures+was+set+aside%2C+and+Christianity+reduced+to+Deism.+It+is%2C+therefore%2C+far+more+than+a+mere+matter+of+method+that+is+involved+in+adhering+to+the+Scriptural+form+of+presenting+Scriptural+truths.+God+then+did+enter+into+a+covenant+with+Adam.+That+covenant+is+sometimes+called+a+covenant+of+life%2C+because+life+was+promised+as+the+reward+of+obedience.+Sometimes+it+is+called+the+covenant+of+works%2C+because+works+were+the+condition+on+which+that+promise+was+suspended%2C+and+because+it+is+thus+distinguished+from+the+new+covenant+which+promises+life+on+condition+of+faith.+%E2%80%A6The+condition+of+the+covenant+made+with+Adam+is+said+in+the+symbols+of+our+church+to+be+perfect+obedience.+That+that+statement+is+correct+may+be+inferred+%281.%29+From+the+nature+of+the+case+and+from+the+general+principles+clearly+revealed+in+the+word+of+God.+Such+is+the+nature+of+God%2C+and+such+the+relation+which+He+sustains+to+his+moral+creatures%2C+that+sin%2C+the+transgression+of+the+divine+law%2C+must+involve+the+destruction+of+the+fellowship+between+man+and+his+Creator%2C+and+the+manifestation+of+the+divine+displeasure.+The+Apostle+therefore+says%2C+that+he+who+offends+in+one+point%2C+who+breaks+one+precept+of+the+law+of+God%2C+is+guilty+of+the+whole.+%282.%29+It+is+everywhere+assumed+in+the+Bible%2C+that+the+condition+of+acceptance+under+the+law+is+perfect+obedience.+%E2%80%9CCursed+is+every+one+who+continueth+not+in+all+things+written+in+the+book+of+the+law+to+do+them.%E2%80%9D+This+is+not+a+peculiarity+of+the+Mosaic+economy%2C+but+a+declaration+of+a+principle+which+applies+to+all+divine+laws.+%283.%29+The+whole+argument+of+the+Apostle+in+his+epistles+to+the+Romans+and+to+the+Galatians%2C+is+founded+on+the+assumption+that+the+law+demands+perfect+obedience.+If+that+be+not+granted%2C+his+whole+argument+falls+to+the+ground.+The+specific+command+to+Adam+not+to+eat+of+a+certain+tree%2C+was+therefore+not+the+only+command+he+was+required+to+obey.+It+was+given+simply+to+be+the+outward+and+visible+test+to+determine+whether+he+was+willing+to+obey+God+in+all+things.+Created+holy%2C+with+all+his+affections+pure%2C+there+was+the+more+reason+that+the+test+of+his+obedience+should+be+an+outward+and+positive+command%3B+something+wrong+simply+because+it+was+forbidden%2C+and+not+evil+in+its+own+nature.+It+would+thus+be+seen+that+Adam+obeyed+for+the+sake+of+obeying.+His+obedience+was+more+directly+to+God%2C+and+not+to+his+own+reason.+The+question+whether+perpetual%2C+as+well+as+perfect+obedience+was+the+condition+of+the+covenant+made+with+Adam%2C+is+probably+to+be+answered+in+the+negative.+It+seems+to+be+reasonable+in+itself+and+plainly+implied+in+the+Scriptures+that+all+rational+creatures+have+a+definite+period+of+probation.+If+faithful+during+that+period+they+are+confirmed+in+their+integrity%2C+and+no+longer+exposed+to+the+danger+of+apostasy.+Thus+we+read+of+the+angels+who+kept+not+their+first+estate%2C+and+of+those+who+did.+Those+who+remained+faithful+have+continued+in+holiness+and+in+the+favour+of+God.+It+is+therefore+to+be+inferred+that+had+Adam+continued+obedient+during+the+period+allotted+to+his+probation%2C+neither+he+nor+any+of+his+posterity+would+have+been+ever+exposed+to+the+danger+of+sinning.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology+%28repr.+Oak+Harbor%2C+WA%3A+Logos+Research+Systems%2C+Inc.%2C+1997%29%2C+2.117%E2%80%9318%2C+119%E2%80%93120.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91df145c0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91df145c0c.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/charles-hodge-the-covenant-with-adam-before-the-fall-was-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-762b7e58fd" data-kw="">
<blockquote><p>We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 5 (Edinburgh: T&amp;T Clark, n.d.), 44–45.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-1d4fed99d8" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-45221490ee" data-kw="">
<blockquote><p>OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7–9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that doeth” these things “shall live in them.” (Gal. 3:12.) So likewise to the Romans: “Moses describeth the righteousness which is of the law, That the man who doeth those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cooper.html">William Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon VI: The Covenant of Works” in James Nichols</cite>, ed. Puritan Sermons (Wheaton, IL: Richard Owen Roberts, Publishers, 1981), 5.97.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<main class="wrap"><figure class="quote" id="q-eec7e7f542" data-kw="">
<blockquote><p>[Edward Leigh:] ‘God is patient, Psalm 103:8; Job. 21:7. God’s patience is that whereby He bears the reproach of sinners and defers their punishments; or it is the most bountiful will of God, whereby He doth long bear with sin which He hates, sparing sinners, not minding their destruction, but that He might bring them to repentance. See Acts 13:18.’¹ … It is, thus, ‘the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but He does warn them beforehand, lightly correct and seek to turn them unto Him.’² ¹ Leigh, Body of Divinity, II.xiii (p. 299), citing marginally Nahum 1:3 and Isa. 30:18; cf. Cocceius, Summa theol., III.x.67. ² Leigh, Treatise, II.xiii (p. 106).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker, 2003), vol. 3 | ch. 6.3, The Divine Affections and Virtues, C. Divine Grace and Favor, 2. The Reformed Orthodox doctrine of the gratia Dei, p. 574</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

"noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46d54d6e63" data-kw="">
<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians</cite>, … some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</span></figcaption>

</figure><figure class="quote" id="q-a6f09fda47" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker [a congregationalist] leaves out the chief word, wherein stands the force of my argument, he speaks nothing of God’s revealed intention and command to call in fools that they may be made wise, and he frames his answer, as if I had argued from the bare intention and hidden decree of God. But I find that Mr. Hooker utterly mistakes the distinction of God’s decree, and of his approving will, and therefore he takes for one and the same, the decree or intention of God (from which I bring not my argument) and the revealed intention of God, or his commanding will: the ignorance of which is a stumbling to Arminians, and Socinians, and to Mr. Hooker, who, as we shall hear, goes on with them, but I judge it one mistake in judgment in that godly man, but no heretical spirit, and therefore his defenders and followers would take heed to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Book 1, ch. 8, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-62c04b20e0" data-kw="">
<blockquote><p>‘Thou wilt say then unto me: why doth he yet complain? For who can resist his will?’… And forasmuch as not all which hear the Gospel are inwardly with efficacy moved of God, thereof it comes that Paul says to the Corinthians, that it is to some the savor of life to life, and to other some the savor of death to death. This is a plain and simple conciliation of that contrariety which appears to be in the will of God. And because that in these vocations and promises seems to be expressed some will of God which yet takes not effect, certain divines have not unskillfully said that there is one will of the sign, or of the antecedent: another will of efficacy, or of the consequent. For it oftentimes happens, that God either threatens or promises a thing, which yet shall not come to pass. And yet does not God therefore lie, or deceive. For He pronounces those things, either as nature was then ordered, or as through ill deserts it might come to pass, unless some change were had in the mean time. So was Ezekiel told that he should die: because that disease whereof he was sick was by nature deadly. Wherefore the prophet in those threats pronounced, God’s will of the sign: that is, so much as could be known by the force of nature. But the changing came of the will of God which is of efficacy, which they call the consequent. Nineveh also for the grievous sins thereof was worthy to be destroyed. Wherefore Jonah showed unto them the antecedent will of God, which they call the will of the sign: Wherefore when God calls Pharaoh or any other reprobate, by that vocation or outward promise we understand the antecedent will, or the will of the sign, but that other hidden will, which they call the will of efficacy, or the consequent, we understand not. Wherefore God cannot deny Himself, neither does He in these wills strive against Himself. But by his doctrine and promises being in differently and generally set forth, He stirs up the minds of the ministers of the Church, cheerfully to preach the word and that unto all men: which thing doubtless they would not do, if He had made them assured of his hidden will. For if they knew that they had to deal with men reprobate, they would utterly be discouraged, and give over.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans... (London: Daye, 1568), ch. 9, pp. 269-70</span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘Thou wilt say then unto me: why doth he yet complain? For who can resist his will?’… And forasmuch as not all which hear the Gospel are inwardly with efficacy moved of God, thereof it comes that Paul says to the Corinthians, that it is to some the savor of life to life, and to other some the savor of death to death. This is a plain and simple conciliation of that contrariety which appears to be in the will of God. And because that in these vocations and promises seems to be expressed some will of God which yet takes not effect, certain divines have not unskillfully said that there is one will of the sign, or of the antecedent: another will of efficacy, or of the consequent. For it oftentimes happens, that God either threatens or promises a thing, which yet shall not come to pass. And yet does not God therefore lie, or deceive. For He pronounces those things, either as nature was then ordered, or as through ill deserts it might come to pass, unless some change were had in the mean time. So was Ezekiel told that he should die: because that disease whereof he was sick was by nature deadly. Wherefore the prophet in those threats pronounced, God’s will of the sign: that is, so much as could be known by the force of nature. But the changing came of the will of God which is of efficacy, which they call the consequent. Nineveh also for the grievous sins thereof was worthy to be destroyed. Wherefore Jonah showed unto them the antecedent will of God, which they call the will of the sign: Wherefore when God calls Pharaoh or any other reprobate, by that vocation or outward promise we understand the antecedent will, or the will of the sign, but that other hidden will, which they call the will of efficacy, or the consequent, we understand not. Wherefore God cannot deny Himself, neither does He in these wills strive against Himself. But by his doctrine and promises being in differently and generally set forth, He stirs up the minds of the ministers of the Church, cheerfully to preach the word and that unto all men: which thing doubtless they would not do, if He had made them assured of his hidden will. For if they knew that they had to deal with men reprobate, they would utterly be discouraged, and give over.”

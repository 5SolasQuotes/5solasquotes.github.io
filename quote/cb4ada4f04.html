<main class="wrap"><figure class="quote" id="q-cb4ada4f04" data-kw="">
<blockquote><p>Mr. Robert Fleming ‘was settled minister in the Scots Congregation in Rotterdam [Netherlands]. He invited Mr. James Veitch, one of our Scots actually indulged, to preach with him, who was there occasionally.’ [Robert] M’Ward, Thomas Douglas, Walter Smith, and others, heard and conversed with him, on which account Robert Hamilton and Mr. Bogue withdrew from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, Written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825), p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Thus the difference and errors concerning Church-government by bishops, and in the congregational way, may, we conceive, in themselves be forborn in persons where they are not vented tothe shaking and drawing away of others; but if pressed in practice to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be forborn.</p></blockquote>

</figure><figure class="quote" id="q-f284521455" data-kw="">
<blockquote><p>We are no Brownists, to think a church can be perfect in this life and must be deserted for faults, but it is sin to be coagents with the errors of a church. Howbeit we lie in one bed with our mother kirk and touch her whole skin, yet it is a sinful society to lay our skin to her boils and scabs.</p></blockquote>

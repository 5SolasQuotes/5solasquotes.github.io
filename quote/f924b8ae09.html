<main class="wrap"><figure class="quote" id="q-f924b8ae09" data-kw="">
<blockquote><p>I come now to a second motive, to stir us up to look after heavenly treasure, and not immoderately to love the world, and worldly vanities, because we are pilgrims here, and therefore must leave them in our passage, so we are Citizens of heaven, the new Jerusalem: the Apostle saith, we having through Christ an entrance unto the father by one spirit, are now no more strangers and foreigners, but Citizens with the Saints, and of the household of God: and speaking of Abraham the father of the faithful, he saith, That he abode in the land of promise, as in a strange country, and as one that dwelt in tents, because he looked for a City not made with hands, having a foundation whose builder and maker is God; neither was this peculiar to him alone, but general to all his Children, who followed him in the saith: of whom it is said, that they have here no continuing City, but seek one to come, Heb. 11. 6, 9, 10.

And the reason is apparent, for we are Citizens, and subjects of that Kingdom, whereof our Lord Jesus Christ is King, but he himself hath plainly told us, that his kingdom is not of this world, but that he reigneth and ruleth in that kingdom of eternal glory: and therefore whosoever are subjects unto him, they cannot be free denizens of the world, but Citizens of heaven.

It is no marvel that heretofore we living in ignorance, did not esteem of those divine excellencies, but preferred before them these worldly vanities: because they are subject to our selves, for there is no desire of that which is not known, and that bright sunshine day is all alike to him, who is stark-blind unto the darkest night. But now after that the grace of God which bringeth salvation unto all men, hath appeared, and taught us that we should deny ungodliness and worldly lusts, and that we should live soberly, righteously, and godly in this present world, looking for the blessed hope and appearing of the glory of the mighty God, and of our Saviour Jesus Christ, Titus 2. 11, 12, 13.

It were more then madness, if we should suffer our selves still to be transported with worldly concupiscence, and prefer the present satisfying of our carnal desires before the eternal fruition of our heavenly joys: we should not be always children wanting wit and experience in heavenly affairs, it is time now to put away childish things.

Whilst we remained in the state of slaves, and were the devoted vassals of sin and Satan, our base desires did well agree with our base condition, whilst we were Citizens of the world, and children of the earth, it might suit with our calling to desire earthly commodities, and esteem the riches, pleasures, and preferments of the place whereof we were inhabitants at high rates, but now that God hath dignified us with most royal privileges, and made us Citizens of heaven; and of the slaves of Satan, hath made us his own children by adoption and grace, yea heirs apparent of his glorious kingdom:

O let us, remembering this high calling, for shame forsake our base desires, not suffering our hearts to lie grovelling on the earth, wallowing in carnal pleasures, and worldly delights, but raising them up to the height of our hopes, let us aim at no less then crowns and kingdoms, and those not momentary, and of this world, seeing they are vain and of little worth, but those which are most glorious and eternal in the world to come.</p></blockquote>

<blockquote><p>That, however, of which it now consists (for it must not be called immaterial) is corporeal substance. For it will be, and in part already is, the ordinary place of glorified bodies, Jn. 14:2-3; 17:24. It was visibly opened, Mt. 3:16; Acts 7:56, and was passed through by Christ ascending, Eph. 4:10. It also has its own magnitude, Jn. 14:2-3. Meanwhile, we maintain that this substance is most subtle, most lucid, and subject to no corruption, on the ground of the places: 1 Tim. 6:16; Rev. 21-22. The position of this heaven is uppermost and outermost, above all visible heavens, Dt. 4:39; Lk. 2:14; Eph. 4:10. Its circuit, moreover, is most capacious, Jn. 14:2-3.</p></blockquote>

</figure><figure class="quote" id="q-fc149ce3ee" data-kw="">
<blockquote><p>And although there be many curious persons which think those times to be most happy, in the which God by so many ways spake unto the fathers, and doe affirm that they would more willingly believe the word of God, if so be it would please him to talk with them after that fashion. Notwithstanding, if we well consider of the matter, now that Christ is come, and hath published his Gospel throughout the whole world, we must needs confess, that the times are much more happy, than they were in times past. For God hath spoken with us, not by Angel, not by dreams, or visions, but by his own son our Lord, and Saviour Jesus Christ, who by his divine majesty excelleth all Angels. Whereupon in the Epistle to the Hebrews it is written. In these last days God hath spoken unto us by his son, whom he hath appointed heir of all things.

And Christ himself saith: Blessed are the eyes which see those things that ye see. And straight after he addeth saying: many have desired to see those things that ye see, and have not seen them. And the Apostle Paul saith: Now salvation is nearer unto us than it was then. For seeing that the son of God is commended unto us by the voice of God from heaven, saying: This is my beloved son, hear him. He is most happy which so heareth him by his Gospel, that by faith he comprehendeth the same, &amp; obeyeth his calling. For whosoever he be that believeth not this son of God, he will not believe, though all the Angels in heaven, all the Patriarchs, all the Prophets and fathers stood before him to testify of the word of God. Wherefore, let us not neglect the felicity and happiness of our time, but let us attend and give ear to the voice of the son of God, whereby we may obtain everlasting salvation.</p></blockquote>

— Johannes Brenz, News from Ninive to England, brought by the prophet Jonas: which news in plainly published in the godly and learned exposition of Master John Brentius, trans. Thomas Tymme (London: Henry Denham, 1570), pp 2-3.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+although+there+be+many+curious+persons+which+think+those+times+to+be+most+happy%2C+in+the+which+God+by+so+many+ways+spake+unto+the+fathers%2C+and+doe+affirm+that+they+would+more+willingly+believe+the+word+of+God%2C+if+so+be+it+would+please+him+to+talk+with+them+after+that+fashion.+Notwithstanding%2C+if+we+well+consider+of+the+matter%2C+now+that+Christ+is+come%2C+and+hath+published+his+Gospel+throughout+the+whole+world%2C+we+must+needs+confess%2C+that+the+times+are+much+more+happy%2C+than+they+were+in+times+past.+For+God+hath+spoken+with+us%2C+not+by+Angel%2C+not+by+dreams%2C+or+visions%2C+but+by+his+own+son+our+Lord%2C+and+Saviour+Jesus+Christ%2C+who+by+his+divine+majesty+excelleth+all+Angels.+Whereupon+in+the+Epistle+to+the+Hebrews+it+is+written.+In+these+last+days+God+hath+spoken+unto+us+by+his+son%2C+whom+he+hath+appointed+heir+of+all+things.%0A%0AAnd+Christ+himself+saith%3A+Blessed+are+the+eyes+which+see+those+things+that+ye+see.+And+straight+after+he+addeth+saying%3A+many+have+desired+to+see+those+things+that+ye+see%2C+and+have+not+seen+them.+And+the+Apostle+Paul+saith%3A+Now+salvation+is+nearer+unto+us+than+it+was+then.+For+seeing+that+the+son+of+God+is+commended+unto+us+by+the+voice+of+God+from+heaven%2C+saying%3A+This+is+my+beloved+son%2C+hear+him.+He+is+most+happy+which+so+heareth+him+by+his+Gospel%2C+that+by+faith+he+comprehendeth+the+same%2C+%26+obeyeth+his+calling.+For+whosoever+he+be+that+believeth+not+this+son+of+God%2C+he+will+not+believe%2C+though+all+the+Angels+in+heaven%2C+all+the+Patriarchs%2C+all+the+Prophets+and+fathers+stood+before+him+to+testify+of+the+word+of+God.+Wherefore%2C+let+us+not+neglect+the+felicity+and+happiness+of+our+time%2C+but+let+us+attend+and+give+ear+to+the+voice+of+the+son+of+God%2C+whereby+we+may+obtain+everlasting+salvation.%E2%80%9D%0A%0A%E2%80%94+Johannes+Brenz%2C+News+from+Ninive+to+England%2C+brought+by+the+prophet+Jonas%3A+which+news+in+plainly+published+in+the+godly+and+learned+exposition+of+Master+John+Brentius%2C+trans.+Thomas+Tymme+%28London%3A+Henry+Denham%2C+1570%29%2C+pp+2-3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffc149ce3ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fc149ce3ee.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/08/johannes-brenz-on-the-blessedness-of-living-under-the-gospel/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>To the eternal death which awaits the damned, eternal life is opposed—the fulfillment and crown of all of Christ’s benefits. So great a good as neither eye has seen, nor ear heard, nor has it entered into the heart of anyone to conceive, and will not enter until we, obtaining our wish, ascend thither and know as we are known, and no longer walk by faith, but by sight.</p></blockquote>

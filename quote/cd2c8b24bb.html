<main class="wrap"><figure class="quote" id="q-cd2c8b24bb" data-kw="">
<blockquote><p>1. Worship of God is all that servitude, observancy, reverence and religion whereby as well inwardly in the heart, as outwardly in the work itself, we honor God and serve Him.

2. This, if it be rightly performed according unto the will of God, is termed true worship; but if contrariwise, it is called false and idolatrous worship.

3. True worship of God is every work, inward and outward, commanded by God, performed in faith, to this principal end, that God may be glorified.

4. And to worship God truly is so to worship Him as He has commanded in his Word how He would be worshipped.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 10, ‘Of the Worship of God…’, p. 65 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-4184c61452" data-kw="">
<blockquote><p>…that which these and the like [Scripture] testimonies unanimously speak unto us, is this, that the will of God is the sole rule of his worship, and all the concernment of it, and that his authority is the sole principle and cause of the relation of any thing to his worship, in a religious manner; and consequently that He never did, nor ever will allow that the wills of his creatures should be the rule or measure of his honor or worship, nor that their authority should cause any thing to hold a new relation unto Him, or any other but what it has by the law of its creation. As this is the sum and substance of the Second Commandment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London, 1662), ch. 7, p. 46</span></figcaption>

</figure><figure class="quote" id="q-9527c70aca" data-kw="">
<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), pp. 495-96</span></figcaption>

<main class="wrap"><figure class="quote" id="q-635649a888" data-kw="">
<blockquote><p>This weeping of Christ is deeply instructive. It shows us that it is not sinful to sorrow. Weeping and mourning are sadly trying to flesh and blood, and make us feel the weakness of our mortal nature. But they are not in themselves wrong. Even the Son of God wept.—It shows us that deep feeling is not a thing of which we need be ashamed. To be cold and stoical and unmoved in the sight of sorrow is no sign of grace. There is nothing unworthy of a child of God in tears.

Even the Son of God could weep.—It shows us, above all, that the Saviour in whom believers trust is a most tender and feeling Saviour. He is one who can be touched with sympathy for our infirmities. When we turn to Him in the hour of trouble, and pour out our hearts before Him, He knows what we go through and can pity. And He is One who never changes. Though He now sits at God’s right hand in heaven, His heart is still the same that it was upon earth. We have an Advocate with the Father, who, when He was upon earth, could weep.

Let us remember these things in daily life, and never be ashamed of walking in our Master’s footsteps. Let us strive to be men and women of a tender heart and a sympathizing spirit. Let us never be ashamed to weep with them that weep, and rejoice with them that rejoice. Well would it be for the Church and the world if there were more Christians of this stamp and character! The Church would be far more beautiful, and the world be far more happy. …

(e) Some think that He wept out of sympathy with the affliction of His friends at Bethany, in order to give an eternal proof to His Church that He can feel with us and for us. … We learn the great practical lesson, from this verse, that there is nothing unworthy of a Christian in tears. There is nothing unmanly, dishonourable, unwise, or feeble, in being full of sympathy with the afflicted, and ready to weep with them that weep. Indeed, it is curious to gather up the many instances we have in Scripture of great men weeping.

We may draw great comfort from the thought that the Saviour in whom we are bid to trust is one who can weep, and is as able to feel as He is able to save. We may learn the reality of our Lord’s humanity very strongly from this little verse. He was one who could hunger, thirst, sleep, eat, drink, speak, walk, groan, be wearied, wonder, feel indignant, rejoice, like any of ourselves, and yet without sin; and, above all, He could weep. I read that there is “joy in the presence of the angels of God,” (Luke xv.,) but I never read of angels weeping. Tears are peculiar to flesh and blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 304-05, 312.</span></figcaption>

<blockquote><p>Thirdly, the Lord makes use of this outward and common covenanting with all receivers of the offer, as a mean to draw the confederate in the letter, to be confederate in the spirit; for, the faith which he requires as the condition of the covenant, he works in the elect, if not before, or with the external covenanting, yet undoubtedly after, in a time acceptable, and that by the ordinary means, the use whereof is granted to all confederate externally: and so as common illumination is a mean to that special, spiritual and saving illumination; and dogmatic or historical faith, is a mean unto saving faith; and external calling, is a mean of effectual calling, So external covenanting in the letter, is a mean most fit, and accommodate to make a man a covenanter in the spirit.</p></blockquote>

<blockquote><p>3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.</p></blockquote>

<blockquote><p>I assume as admitted by all orthodox writers upon the subject, although it is not safe to pry too curiously into the secrets of the divine counsels or to draw too confident conclusions concerning the lot of those dying in infancy, that a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honoured with the saving fellowship of his covenant.

For it would be altogether wrong to suppose that the promise made to Abraham (“I will be thy God, and the God of thy seed after thee”) has been either revoked or brought within narrower limits by the introduction of the better dispensation, especially seeing that Peter, on the glorious day of Pentecost, impressed upon his hearers that the promise of the Spirit of grace was given not to themselves only but also to their children; and that the Lord Jesus took up in his arms the children of covenanted parents, blessed them, and, in a word, declared that of such is the kingdom of heaven …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-America Journal of Theology, 17 (2006), p. 127.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“I assume as admitted by all orthodox writers upon the subject, although it is not safe to pry too curiously into the secrets of the divine counsels or to draw too confident conclusions concerning the lot of those dying in infancy, that a distinguished privilege belongs to those infants whose benefit it is in divine providence to be born of parents whom the grace of the Most High has honoured with the saving fellowship of his covenant.

For it would be altogether wrong to suppose that the promise made to Abraham (“I will be thy God, and the God of thy seed after thee”) has been either revoked or brought within narrower limits by the introduction of the better dispensation, especially seeing that Peter, on the glorious day of Pentecost, impressed upon his hearers that the promise of the Spirit of grace was given not to themselves only but also to their children; and that the Lord Jesus took up in his arms the children of covenanted parents, blessed them, and, in a word, declared that of such is the kingdom of heaven …”

noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8857767c45" data-kw="">
<blockquote><p>It must be granted, however, that, altogether apart from the exegesis of these passages, some sort of reference of the atonement to every man may be affirmed; and inasmuch as this reference is a beneficial one, we are led to posit back of it a form of love equally comprehensive and effective, which will have to be coordinated with the three other forms of universal love previously distinguished [ (1) ‘this indiscriminate goodness in the sphere of nature,’ (2) ‘the collective love which embraces the world as an organism,’ (3) ‘the love of compassion which God retains for every lost sinner’]. The Bible gives us no right to say that Christ in His atoning work acted as the legal substitute of every individual human being. But certainly neither does it require us to assert that for the non-elect the atonement is void of all benefit or significance. Every man is indebted for great privileges to the cross of Christ. The continued existence of the race in spite of sin, but for it [the cross of Christ], would have been impossible. The atonement by its universal sufficiency renders the gospel a message which can be preached to every human being, and the offer of the gospel illumines the entire earthly existence of every one to whom it comes by the hope that he may find himself through faith one of the actual heirs of redemption. It makes an immense difference whether our present life be spent in the consciousness of this hope or without it. This may be best realized by making clear to ourselves what a tremendous change the withdrawal of the offer of the gospel would produce in the entire outlook upon life, even for those who do not accept its terms. On the other hand, the love from which these universal benefits of the atonement flow should never be so defined as to obscure the fact that it falls short of the intention to bestow efficacious grace. We must also remember that as it embodies itself in the offer of the gospel it can be called universal in a qualified sense only, since its field is circumscribed by the actual spread of the gospel at any given time.</p></blockquote>

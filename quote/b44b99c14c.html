<main class="wrap"><figure class="quote" id="q-b44b99c14c" data-kw="">
<blockquote><p>But there is not wanting evidence, and rational evidence, by means of which the great body of the people may be convinced that the Scriptures are indeed the Word of God. There is an evidence to this important truth contained within the Bible itself–and evidence for the full understanding of which, nothing more is necessary than just a natural conscience, and a susceptibility of emotions–which requires nothing more in the way of mental cultivation and acquired knowledge, in order to be understood and felt, than what is not only within the reach, but actually within the possession, of almost, if not altogether, every individual of the human race. This evidence consists chiefly in the correspondence between the principles and wants and desires of our nature, and the scriptural statements in regard to the Gospel scheme of salvation–a correspondence which is so complete and so striking, that it furnishes to all who feel and perceive it an abundant proof that the Bible comes from Him who made the heart, and who knows it best. But this evidence for the Divine origin and authority of the Scriptures, drawn from the correspondence between its statements and the principles and feelings of our hearts, rises to the highest degree of clearness and certainty in Believers. ‘He that believeth, hath this witness in himself.’ [1 Jn. 5:10] From the changes which he has experienced in his own heart and character, he has the firmest ground for believing that the Bible, whose statements were the immediate cause of those changes, must proceed from a higher than human source , must have come down from the Father of his spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>III. ‘What are the Scriptures’ on Jn. 5:39 in Sermons from 1828-1860</cite>, (rep. Still Waters Revival, n.d.), pp. 43-44</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bc72d8ac9" data-kw="">
<blockquote><p>XXVII. Regarding the acts of faith, many Reformed theologians usually distinguish three acts or parts of justifying faith. The first is knowledge by which we recognize and understand the Word of God, at least in terms of what is necessary for salvation. The second is assent that we give to all that has been revealed to us in the Word of God. The third is confidence by which the believer specifically applies the general promise of the word to themselves. This is the teaching of Ursinus and Pareus in the Catechetical Explanations, question 21; of Wendelinus in Christian Theology, book 2, chapter 24, Thesis 13, 14, &amp; 15; of Tilenus in a disputation on justifying faith, Thesis 20; and also of Trelcatius in the above-cited location. … XLVI. Moreover, many doctors of the Reformed school, as we saw above, count confidence among the acts of faith; but they want it to be the proper formal and specific act of faith, and its primary part. Yet, others seem to be of a different opinion; they teach that confidence is indeed an outcome and effect of faith, but not an act of faith properly said. This is among others the opinion of Garrissoles, a professor at Montauban Academy while he was alive. ‘If you ask whether faith is not confidence,’ he says: ‘I respond that confidence indeed adheres to faith with an indissoluble bond, yet, if we speak properly, it is not faith, but an effect, springing necessarily as it were from faith.’ (in the Explanation of the Catechism of Christian Religion, on the eighteenth section.) XLV. Beza held the same opinion, writing about Paul’s words in Eph. 3, where it says, ‘In whom we have boldness and access with confidence by the faith of him,’ deducing that confidence differs from faith as an effect from its cause. ‘From this passage,’ he says: ‘it is clearly apparent that confidence differs from faith as an effect from a cause, and therefore it is mistakenly substituted for faith by some, even though these two always coexist.’ Peter du Moulin also teaches the same in his Second Disputation on Justification and Justifying Faith, thesis 19 and subsequent. ‘We consider,’ he says, ‘faith and confidence to be different, and the latter to be the inseparable fruit and effect of the former.’ To which Anthony Faius adds, in Theses Disputed in Geneva, thesis 20: ‘The liberty through which access to God is easy, and the confidence through which we cry Abba Father, are effects of faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162</span></figcaption>

</figure><figure class="quote" id="q-3889c93033" data-kw="">
<blockquote><p>Protestants do not understand by justifying faith that which in any way prepares for justification… but that which actually justifies a person, or with which justification always and infallibly accompanies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Justifying Faith</cite></span></figcaption>

</figure><figure class="quote" id="q-78696e7bc2" data-kw="">
<blockquote><p>That God ‘requires of sinners faith in Christ that they may be saved,’ admits of no dispute. The part assigned to faith, however, has been much controverted. Many excellent divines, in consequence of the distinction which they made between the covenant of redemption and the covenant of grace, were led to speak of faith as the condition of the latter covenant. But the term, as used by them, signifies not a meritorious or procuring cause, but simply something which goes before, and without which the other cannot be obtained. They consider faith merely as a condition of order or connection, as it has been styled, and as an instrument or means of obtaining an interest in the salvation offered in the gospel. This is very different from the meaning attached to the term by Arminians and Neonomians, who represent faith as a condition on the fulfilment of which the promise is suspended. The Westminster Assembly elsewhere affirm, that God requires of sinners faith in Christ, “as the condition to interest them in him.” But this is very different from affirming that faith is the condition of the covenant of grace. That faith is indispensably necessary as the instrument by which we are savingly interested in Christ, and personally instated in the covenant, is a most important truth, and this is all that is intended by the Westminster Divines. They seem to have used the term condition as synonymous with instrument; for, while in one place they speak of faith as the condition to interest sinners in the Mediator, in other places they affirm, that ‘faith is the alone instrument of justification,’ and teach, that ‘faith justifies a sinner in the sight of God, only as it is an instrument by which he receiveth and applieth Christ and his righteousness.’ As the word condition is ambiguous, apt to be misunderstood, and is frequently employed in an unsound and dangerous sense, it is now disused by evangelical divines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Confession of Faith of the Westminster Assembly of Divines</cite>, 8th ed. (Glasgow: Blackie &amp; Son, 1857), pp. 91–92</span></figcaption>

+only+as+it+is+an+instrument+by+which+he+receiveth+and+applieth+Christ+and+his+righteousness.%E2%80%99+As+the+word+condition+is+ambiguous%2C+apt+to+be+misunderstood%2C+and+is+frequently+employed+in+an+unsound+and+dangerous+sense%2C+it+is+now+disused+by+evangelical+divines.%E2%80%9D%0A%0A%E2%80%94+Robert+Shaw%2C+An+Exposition+of+the+Confession+of+Faith+of+the+Westminster+Assembly+of+Divines%2C+8th+ed.+%28Glasgow%3A+Blackie+%26+Son%2C+1857%29%2C+pp.+91%E2%80%9392&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78696e7bc2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78696e7bc2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=That%20God%20%E2%80%98requires%20of%20sinners%20faith,is%20now%20disused%20by%20evangelical%20divines&amp;text=That%20God%20%E2%80%98requires%20of%20sinners%20faith%20in%20Christ&amp;text=sense%2C%20it%20is%20now%20disused%20by%20evangelical%20divines" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

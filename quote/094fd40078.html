<main class="wrap"><figure class="quote" id="q-094fd40078" data-kw="">
<blockquote><p>Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Rejection of Errors, ¶5</span></figcaption>

</figure><figure class="quote" id="q-16ec124bdb" data-kw="">
<blockquote><p>The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)</span></figcaption>

<blockquote><p>It is the worst of sins, because it keeps all sins: they are made sure and secure by hypocrisy. Indeed some vices are quarter-masters with it, and some Sovereigns over it: for the hypocrisy is but another sin … except to content some affected guest, we could never yield to this filthy Herodias. It is made a stalking horse for covetousness, under long prayers many a Pharisee devours the poor, houses, goods and all. It is a complexion for lust, who, were she not painted over with a religious shew, would appear as loathsome to the world, as she is indeed.

It is a sepulchre of rotten impostures, which would stink like a putrefied corpse, if hypocrisy were not their cover. It is a mask for treason, whose shop-full of poisons, pistols, daggers, gunpowder-trains, would easily be spied out, had hypocrisy left them bare-faced. Treachery under this vizard thrusts into Court-revels, nay, Court-counsels; and holds the torch to sports, nay the books to serious consultations; deviseth, adviseth, plots with those that provide best for the Common-wealth, Thus are all sins beholding to hypocrisy: she maintains them at her own proper costs and charges.

… It is the worst of sins, because it counterfeits all virtues: he that counterfeits the King’s coin, is liable to death, if hypocrisy find not death, and (mortem sine morte) death without death, for counterfeiting the king of heaven’s Seal manual of grace, it speeds better then it merits: vice is made virtues ape in an hypocrite’s practise. If he see Chusi run, this Ahimaaz will outrun him: he mends his pace, but not his path: the goodman goes slower, but will be at heaven before him: thus thriftiness in a Saint, is counterfeited by niggardliness in an hypocrite: be thou charitable, behold he is bountiful, but not except thou may behold him: his vainglorious pride shall emulate thy liberality: thou art good to the poor, he will be better to the rich: he follows the religious man a far of, as Peter did Christ, but when he comes to the cross, he will deny him. Thus hypocrisy can but put blood into your cheeks, (like the Aliptae) and better your colours; but you may be sick in your consciences, and almost dead at the heart, and (non est medicamen in hortis) there is no medicine in this drugster’s shop can cure you.

… An hypocrite is a kind of honest Atheist: for his own Good is his God: his heaven is upon earth, and that not the Peace of his conscience, or that kingdom of heaven, which may be in a soul living on earth, but the secure peace of a worldly estate: he stands in awe of no Judge, but man’s eye; that he observes with as great respect, as David did the eyes of God; if man takes notice, he cares not, yet laughs at him for that notice, and kills his soul by that laughter: so Pigmalion-like, he dotes on his own carved and painted peace: and perhaps dies Zeuxis death, who painting an old woman, and looking merrily on her, brake out into a laughter that killed him. if the world doth not praise his doings, he is ready to challenge it, as the Jews God, wherefore have we fasted, and thou seest it not? he crosseth Christ’s precept: the left hand must be privy to the right hands charity, he dares not trust God with a penny, except before a whole congregation of witnesses, lest perhaps, God should deny the receipt.</p></blockquote>

<blockquote><p>Of these two conflicting systems of religion, the one has its centre in the truth. The truth as it is in Jesus, is its sun. Around this, all revolves, and to this all is subordinated. It is essentially tolerant of diversities of form, where the truth is preserved and honoured. … The other system revolves around the form. It asks not simply is the truth held, but how it is held. Orders, rites, ceremonies, are the grand principles on which it rests the weightier matters of its law. And by a very natural consequence, one indeed which results from the laws of our being, this undue exaltation of the form, draws after it a corresponding depreciation of the spirit. The apotheosis of external religion, is the dethronement of the internal and the spiritual, and to a greater or less extent, this result is unvarying. Go where you will among the adherents of this system, and you find a latitudinarian tolerance of diversities of doctrine, prevailing in exact proportion to the rigidness of the demand for uniformity of practice in the observances of religion.

Not unfrequently this laxity of doctrine is boasted of, as an ornament and trusted in as a secret of strength. You may believe what you will, within certain very broad and somewhat dimly defined limits, provided the loved and cherished form is observed. The very Church that, avowedly, so framed its declarations of truth as to comprehend well nigh all shades of theological opinion, even inviting to her bosom those who held some of the grand distinguishing principles of the great anti-christian apostacy, takes its position with unflinching firmness on the ground of rites and ceremonies, and cuts off from Church relationship, and valid ordinances, and abandons to the uncovenanted mercies of God, all who do not use her Shibboleth. She drowns the voice of admitted truth and piety, pleading for Christian recognition and fellowship, with the deafening cry “great is Diana of the Ephesians.” Instead of seeking for the living spirit of Christianity, and recognizing it when found; this system of externalism is satisfied with the lifeless corpse, from which the animating spirit has fled, provided you give it

Before decay’s effacing fingers

Have swept the lines where beauty lingers.

Instead of giving free scope to the spirit, allowing it to develop itself, controlled by no laws save those God has given, it forms an encrustation around it, compelling all its growth, if it grow at all, to a conformity to its fossil mould. In short its body is more a mummy than a man.

Now between these two rival systems every man must make his choice. He cannot serve God and Mammon. He cannot have two supreme tests of the Church. These systems are antagonistic, and every man must array himself with the one or the other. And the gathering with one, is scattering abroad so far as the other is concerned. If his system is distinctively ritual, the spirit must be neglected. Dethroned from its rightful sovereignty, it will be confined in the cruel bondage of a prescribed and unalterable mould; and there is great danger that it will pine away and die in its captivity. But if the spiritual element be regnant, forms will not be despised as useless, or cumbersome; but they will be held in subordination to the truth, and if they attempt to bind and hinder its free exercise, they will be burst asunder, as will the cerements of the tomb when the life-giver shall bid the dead to come forth.</p></blockquote>

ess%2C+Delivered+before+the+Alumni%2C+and+the+Society+of+Inquiry+of+Union+Theological+Seminary%2C+Prince+Edward%2C+Va.+June%2C+1850+in+Southern+Presbyterian+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F744ddd16ab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/744ddd16ab.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/02/27/samuel-james-pierce-anderson-on-the-danger-of-ritualism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>5. A peaceable spirit must have a high esteem of peace, and be zealous for it, and industrious to obtain it. Only against ungodliness and unpeaceableness must he be unpeaceable. Many have a good wish and a good word for peace, as hypocrites have for godliness, but this will not serve the turn. He that is not for us is against us, and he that gathers not with us, and he that gathers not with us, scatters abroad. The wicked and unpeaceable are zealous and industrious against peace; and those that are for peace are cold and indifferent for the greater part; and the zealous and industrious are so few that their voices cannot be heard in the contentious crowd. The unpeaceable are commonly the loudest and are actuated by a fervent zeal, which nature agrees with and Satan cherishes and excites: such will even as the Quakers, go up and down from one assembly to another, and in the market-places and other places of concourse, revile and rail, and reproach the ministry, and speak as earnestly as if they were the agents of Christ. And others are busy in secret, that will not incur the disgrace of such visible impiety. And when the enemies of unity and peace are many, and hot and loud, and the friends of unity and peace are either few or cold and dull and silent, what’s like to be the issue, but even the mischiefs which we feel? Forsooth, some dare not be fervent for peace, lest they be censured for their fervor to be unpeaceable: These show how much they love the praise of men and stick yet in the power of self. There’s need of zeal for peace, as well as for other parts of holiness. All the resistance that the enemies of Hell and earth can make, will be made against it: And will it be carried on against all by sleepy wishes and sitting still? I am sure this agrees not with the precepts of the Spirit. ‘Follow peace with all men,’ Heb. 12:14. If it be possible, as much as in you lies, live peaceably with all men, Rom. 12:18. It’s a sorry surgeon, or physician that will think it enough to wish well to their patient: the House of God will be neither built, nor repaired without zeal and industry and patience in the work. If men’s hearts were set upon the Church’s peace, and they did but feel the disjoiting of her members, the breaking of her bones, and the smart of her wounds, as sensibly as they feel the like in their own bodies; and if ministers and other Christians were as sensible of the evil of divisions as they are of drunkenness, and whoredom, and such other sins, and if we were all awakened to quench the flames of the Church, as earnestly as we would do the fire in our houses, and would preach for peace and pray for peace, and plead and labor and suffer for peace, then some good might be done on it, against the rage and multitude of dividers. … 8. Another hindrance of unity and peace is a carnal zeal in matters of religion, which is frequently mistaken for the true zeal of the saints. When men are confident that their opinions are the truth, and overvalue them as to the necessity (because they are their own, though they observe not the reason), they presently think they must be hot against all the gainsayers of their opinions; and herein they place the most, or at least too much, of their religion. There’s not one of many that has this zeal but thinks it is of God and is part of their holiness, when as it is often from the Devil and the flesh, even when the doctrine is true which they contend for. You may know it from true zeal by these following marks:

1. It is more for controversies and speculations than for practical holiness.

2. It is selfish and kindled by an overvaluing their own conceits or ways.

3. It is private and would promote a lower truth to the loss of a greater, or a doubtful point, to the loss of undoubted truth; or a single truth, to the loss or hindrance of the body of common truth; and it is hotter for a party than for the catholic Church, and will promote the interest of an opinion or purity to the wrong of the common interest of the Church.

4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like.

5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.</p></blockquote>

22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f64231e22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-zeal/#:~:text=5.%20A%20peaceable%20spirit%20must%20have,grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace&amp;text=5.%20A%20peaceable%20spirit%20must%20have%20a%20high&amp;text=is%20a%20grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There were 3 things (most Honourable Sirs!) which Luther did fear would prove to be the Ruin of Religion.

1. Oblivion.

2. Security.

3. Carnal policy: The good God overthrow these in our Land, lest our land be overthrown by these: Though Ministers discover all sorts of sins, and though a Parliament discovers all sorts of plots and dangers, yet people are settled on their Lee’s, they will not see, nor fear, nor humble themselves, nor turn to the Lord at all; O pray, (said a dying man in the beginning of the German reformation) that God would preserve the Gospel … For the Pope and the Council of Trent are hatching of strange things: Ministers say as much and more to people, pray, be humbled, reform; For you see what the bloody Papists have done in Ireland, and you hear what they are plotting against England, we do thus speak and weep, but man will not hearken and obey; They who will not easily see their sins, will as hardly believe their dangers … O that God’s advises (so frequent, so earnest, so and more safe) to humbling and reforming might once be regarded and followed: we shall be safe, if we ever remain impenitent.</p></blockquote>

<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2cb6f80744" data-kw="">
<blockquote><p>Infants of believing parents are likewise to be baptized. The grounds of their baptism are these. First, the commandment of God, “Baptize all nations” (Matt. 28:19), in which words the baptism of infants is prescribed. For the apostles by virtue of this commission baptized whole families (Acts 16:15, 31–33). Again, circumcision of infants was commanded by God (Gen. 17:14), and baptism in the New Testament succeeds in the room of circumcision (Col. 2:11–12); therefore baptism of infants is likewise commanded. The second ground is this. Infants of believing parents are in the covenant of grace. For this is the tenor of the covenant: “I will be thy God, and the God of thy seed” (Gen. 17:7). It may be said that this promise was made in this sort only to Abraham, because he was to be the father of the faithful. Answer. It pertains to all believing parents. God promises “to show mercy to thousands of them that love Him” (Ex. 20). Peter says to the Jews that heard him preach, “The promises belong to you, and to your children” (Acts 2:39). Paul says, “If the parents believe, the children are holy” (1 Cor. 7:14). If holy, then are they in the covenant. Now they are holy because we are in the judgment of Christian charity to esteem them all as regenerate and sanctified, secret judgments (in the mean season) left to God. Now then because infants are in the covenant, they are to be baptized. For this is the reason of St. Peter. To whom the promises belong, to them belongs baptism. But to you and your children belong the promises. Therefore you and your children are to be baptized (Acts 2:38–39).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 230–31.</span></figcaption>

<blockquote><p>From this influx, it is not surprising that the doctrines of faith and, most especially, that of the new birth became so rapidly corrupted in the churches. With separation from the world spurned, there is no wonder that the sanctity and glory of the gospel was overshadowed, and superstitious practices flooded in along with the unconverted pagans, until, at length, Christian church discipline was remodeled on the fashion of the pagan secular state. Once hypocrites and other unregenerate people began, as it were, to swamp and overwhelm the believers, there soon emerged leaders who were pleased enough to accommodate spiritual doctrines to the prevailing systems of philosophy. And so it came about that faith was neglected, doctrine no longer studied, regeneration equated to the mechanical performance of the rite of baptism, truth and piety no longer defended by any great efforts in the assemblies and councils, the majorities at best indifferent, at worst bitterly hostile, to the total over-shadowing of these essential things. By that time, most of the world had taken up the Christian profession so, at most, everything that had been instituted by Christ had been basely transmuted into another gospel. Strange to tell, it was done without a protest or major split in the Church.</p></blockquote>

</figure><figure class="quote" id="q-df89eeafae" data-kw="">
<blockquote><p>Thus, some would have baptism to be regeneration itself, and that there is no other evangelical regeneration but that alone, with the profession which is made thereon. Every one who is baptized is thereby regenerated. The sign and figure of grace, they would have to be the grace itself. Nothing can be invented more pernicious unto the souls of men; for all sorts of persons may be brought to a ruinous security about their spiritual condition by it, and diverted from endeavours after that real internal work, in the change of their hearts and natures, without which none shall see God. This is to put that into it which God never placed there. Some suppose it to be such a distinguishing, or rather separating ordinance, that the administration of it in such a way or at such a season, is the fundamental rule of all church fellowship and communion; whereas God never designed it unto any such end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews in the Works of John Owen</cite>, (Edinburg: The Banner of Truth Trust, 1991), 22:39.</span></figcaption>

<blockquote><p>1. It is certain that it is the parents great duty to bring up their children in the nurture and admonition of the Lord. 2. It is certain that God has appointed this to be the means of their actual knowledge, faith and holiness. (Eph. 6:4-5; Col. 3:21; Gen. 18:19; Dt. 6:6-8 &amp; 11:18-20) 3. And God does not appoint such means unnecessarily or in vain: nor may we ordinarily expect his grace but in the use of the means of grace, which He has appointed us to use. 4. It is certain that God’s receiving the children of the faithful is an act of God’s love to the parents as well as the children, and promised as a part of his blessing on themselves. … 6. Even before children are capable of instruction, there are certain duties imposed by God on the parents for their sanctification, viz.: 1. That the parents pray earnestly and believingly for them. 2. That they themselves so live towards God as may invite Him still to bless their children for their sakes, as he did Abraham’s, and usually did to the faithful’s seed. (2nd Commandment; Prov. 20:7) 7. It is certain that the Church ever required parents not only to enter their children into the Covenant, and so to leave them, but to do their after duty for their good, and to pray for them, and educate them according to their Covenant. 8. It is plain that if there were none to promise so to educate them, the Church would not baptize them. And God Himself, who allowed the Israelites, and still allows us, to bring our children into his Covenant, does it on this supposition, that we promise also to go on to do our duty for them, and that we actually do it. 9. All this set together maketh it plain: 1. That God never promises the adult in baptism, though true believers, that He will work in them all graces further by his sanctifying Spirit, let them never so much neglect or resist Him: or that He will absolutely see that they never shall resist Him: nor that the Spirit shall still help them, though they neglect all his means; or that He will keep them from neglecting the means (election may secure this to the elect as such; but the Baptismal Covenant as such secures it not to the baptized, nor to believers as such). 2. And consequently… that the Holy Ghost as your Sanctifier will afford you all necessary help in the use of those means which He has appointed you to receive his help in. … 11. And how dangerously parents may make partial forfeitures of the Spirit’s assistance to their children, and operations on them, by their own sinful lives, and neglect of prayer, and of prudent and holy education, even in particular acts, I fear many believing parents never well considered. 12. Yet is not this forfeiture such as obliges God to deny his Spirit: For He may do with his own, as a free benefactor, as He list; and may have mercy freely, beyond his promise (though not against his Word) on whom He will have mercy. But I say that He that considers the woeful unfaithfulness and neglect of most parents, even the religious, in the great work of holy educating their children, may take the blame of their ungodliness on themselves, and not lay it on Christ or the Spirit who was in Covenant with them as their Sanctifier, seeing He promised but conditionally to give them the sanctifying heavenly influences of his life, light, and love, in their just use of his appointed means, according to their abilities. 13. Also as soon as children come to a little use of reason, they stand conjunctly on their parents’ wills and on their own. As their parents are bound to teach and rule them, so they are bound to learn of them and be ruled by them for their good. And though every sin of a parent or a child be not a total forfeiture of grace, yet both their notable actual sins may justly be punished with a denial of some further help of the Spirit which they grieve and quench.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673) | Question 43, ‘Is the right of the baptized (infants or adult) to the sanctifying operations of the Holy Ghost, now absolute, or suspended on further conditions?…’, pp. 821-22</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. It is certain that it is the parents great duty to bring up their children in the nurture and admonition of the Lord. 2. It is certain that God has appointed this to be the means of their actual knowledge, faith and holiness. (Eph. 6:4-5; Col. 3:21; Gen. 18:19; Dt. 6:6-8 &amp; 11:18-20) 3. And God does not appoint such means unnecessarily or in vain: nor may we ordinarily expect his grace but in the use of the means of grace, which He has appointed us to use. 4. It is certain that God’s receiving the children of the faithful is an act of God’s love to the parents as well as the children, and promised as a part of his blessing on themselves. … 6. Even before children are capable of instruction, there are certain duties imposed by God on the parents for their sanctification, viz.: 1. That the parents pray earnestly and believingly for them. 2. That they themselves so live towards God as may invite Him still to bless their children for their sakes, as he did Abraham’s, and usually did to the faithful’s seed. (2nd Commandment; Prov. 20:7) 7. It is certain that the Church ever required parents not only to enter their children into the Covenant, and so to leave them, but to do their after duty for their good, and to pray for them, and educate them according to their Covenant. 8. It is plain that if there were none to promise so to educate them, the Church would not baptize them. And God Himself, who allowed the Israelites, and still allows us, to bring our children into his Covenant, does it on this supposition, that we promise also to go on to do our duty for them, and that we actually do it. 9. All this set together maketh it plain: 1. That God never promises the adult in baptism, though true believers, that He will work in them all graces further by his sanctifying Spirit, let them never so much neglect or resist Him: or that He will absolutely see that they never shall resist Him: nor that the Spirit shall still — Richard Baxter, A Christian Directory... (London: 1673) | Question 43, ‘Is the right of the baptized (infants or adult) to the sanctifying operations of the Holy Ghost, now absolute, or suspended on further conditions?…’, pp. 821-22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+It+is+certain+that+it+is+the+parents+great+duty+to+bring+up+their+children+in+the+nurture+and+admonition+of+the+Lord.+2.+It+is+certain+that+God+has+appointed+this+to+be+the+means+of+their+actual+knowledge%2C+faith+and+holiness.+%28Eph.+6%3A4-5%3B+Col.+3%3A21%3B+Gen.+18%3A19%3B+Dt.+6%3A6-8+%26+11%3A18-20%29+3.+And+God+does+not+appoint+such+means+unnecessarily+or+in+vain%3A+nor+may+we+ordinarily+expect+his+grace+but+in+the+use+of+the+means+of+grace%2C+which+He+has+appointed+us+to+use.+4.+It+is+certain+that+God%E2%80%99s+receiving+the+children+of+the+faithful+is+an+act+of+God%E2%80%99s+love+to+the+parents+as+well+as+the+children%2C+and+promised+as+a+part+of+his+blessing+on+themselves.+%E2%80%A6+6.+Even+before+children+are+capable+of+instruction%2C+there+are+certain+duties+imposed+by+God+on+the+parents+for+their+sanctification%2C+viz.%3A+1.+That+the+parents+pray+earnestly+and+believingly+for+them.+2.+That+they+themselves+so+live+towards+God+as+may+invite+Him+still+to+bless+their+children+for+their+sakes%2C+as+he+did+Abraham%E2%80%99s%2C+and+usually+did+to+the+faithful%E2%80%99s+seed.+%282nd+Commandment%3B+Prov.+20%3A7%29+7.+It+is+certain+that+the+Church+ever+required+parents+not+only+to+enter+their+children+into+the+Covenant%2C+and+so+to+leave+them%2C+but+to+do+their+after+duty+for+their+good%2C+and+to+pray+for+them%2C+and+educate+them+according+to+their+Covenant.+8.+It+is+plain+that+if+there+were+none+to+promise+so+to+educate+them%2C+the+Church+would+not+baptize+them.+And+God+Himself%2C+who+allowed+the+Israelites%2C+and+still+allows+us%2C+to+bring+our+children+into+his+Covenant%2C+does+it+on+this+supposition%2C+that+we+promise+also+to+go+on+to+do+our+duty+for+them%2C+and+that+we+actually+do+it.+9.+All+this+set+together+maketh+it+plain%3A+1.+That+God+never+promises+the+adult+in+baptism%2C+though+true+believers%2C+that+He+will+work+in+them+all+graces+further+by+his+sanctifying+Spirit%2C+let+them+never+so+much+neglect+or+resist+Him%3A+or+that+He+will+absolutely+see+that+they+never+shall+resist+Him%3A+nor+that+the+Spirit+shall+still+help+them%2C+though+they+neglect+all+his+means%3B+or+that+He+will+keep+them+from+neglecting+the+means+%28election+may+secure+this+to+the+elect+as+such%3B+but+the+Baptismal+Covenant+as+such+secures+it+not+to+the+baptized%2C+nor+to+believers+as+such%29.+2.+And+consequently%E2%80%A6+that+the+Holy+Ghost+as+your+Sanctifier+will+afford+you+all+necessary+help+in+the+use+of+those+means+which+He+has+appointed+you+to+receive+his+help+in.+%E2%80%A6+11.+And+how+dangerously+parents+may+make+partial+forfeitures+of+the+Spirit%E2%80%99s+assistance+to+their+children%2C+and+operations+on+them%2C+by+their+own+sinful+lives%2C+and+neglect+of+prayer%2C+and+of+prudent+and+holy+education%2C+even+in+particular+acts%2C+I+fear+many+believing+parents+never+well+considered.+12.+Yet+is+not+this+forfeiture+such+as+obliges+God+to+deny+his+Spirit%3A+For+He+may+do+with+his+own%2C+as+a+free+benefactor%2C+as+He+list%3B+and+may+have+mercy+freely%2C+beyond+his+promise+%28though+not+against+his+Word%29+on+whom+He+will+have+mercy.+But+I+say+that+He+that+considers+the+woeful+unfaithfulness+and+neglect+of+most+parents%2C+even+the+religious%2C+in+the+great+work+of+holy+educating+their+children%2C+may+take+the+blame+of+their+ungodliness+on+themselves%2C+and+not+lay+it+on+Christ+or+the+Spirit+who+was+in+Covenant+with+them+as+their+Sanctifier%2C+seeing+He+promised+but+conditionally+to+give+them+the+sanctifying+heavenly+influences+of+his+life%2C+light%2C+and+love%2C+in+their+just+use+of+his+appointed+means%2C+according+to+their+abilities.+13.+Also+as+soon+as+children+come+to+a+little+use+of+reason%2C+they+stand+conjunctly+on+their+parents%E2%80%99+wills+and+on+their+own.+As+their+parents+are+bound+to+teach+and+rule+them%2C+so+they+are+bound+to+learn+of+them+and+be+ruled+by+them+for+their+good.+And+though+every+sin+of+a+parent+or+a+child+be+not+a+total+forfeiture+of+grace%2C+yet+both+their+notable+actual+sins+may+justly+be+punished+with+a+denial+of+some+further+help+of+the+Spirit+which+they+grieve+and+quench.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%28London%3A+1673%29+%7C+Question+43%2C+%E2%80%98Is+the+right+of+the+baptized+%28infants+or+adult%29+to+the+sanctifying+operations+of+the+Holy+Ghost%2C+now+absolute%2C+or+suspended+on+further+conditions%3F%E2%80%A6%E2%80%99%2C+pp.+821-22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F53e153ff97.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53e153ff97.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=1.%20It%20is%20certain%20that%20it,Spirit%20which%20they%20grieve%20and%20quench&amp;text=1.%20It%20is%20certain%20that%20it%20is%20the&amp;text=of%20the%20Spirit%20which%20they%20grieve%20and%20quench" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

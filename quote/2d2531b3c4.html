<blockquote><p>1 Pet. 2:13 ‘Submit yourselves to every ordinance of man for the Lord’s sake: whether it be to the king, as supreme…’ …But this creature, or ordinance, here is to be understood of the magistrate; (as appears by the following words), which is called human, not as if magistracy were not an ordinance of God, (for, Romans 13:1, ‘the powers that are are said to be ordained of God’) but either because it is only among men, and proper to them; or because it is of man secondarily and instrumentally, though of God primarily and originally, God making use of the ministry of men in bringing them into the magistracy… ‘For the Lord’s sake’; for God’s sake, who commands this obedience; and gave them the authority, and is represented by them, and honored by that obedience which is yielded to them in all things agreeable to his will. The phrase seems to be of the same import with that of being obedient in the Lord, Ephesians 6:1. ‘To the king’; to Caesar, the then supreme magistrate, under whose jurisdiction the Jewish Christians were; and this being a general command extending to all Christians, it follows, that obedience is due from them to those chief magistrates whose subjects respectively they are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations on the Holy Bible</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

e</a></div>
</figure><figure class="quote" id="q-445d4bb9b7" data-kw="">
<blockquote><p>As for such who not only withdraw from this Church [of Scotland] but also have disowned the [Scottish] civil government always since this late happy [Glorious] Revolution [of 1689], and yet take the name of presbyterians to themselves [such as the United Societies and later Reformed Presbyterians], it is to be feared some of them may be under some bad Influence of Jacobites [those loyal to the previous king, James II and the House of the Stuarts], or else to be so weak as not to discern the absurdity of such a practice: And it is more remarkable that since King William came to the throne, these people have neither had minister nor preacher under the name of a presbyterian to countenance them in their sinful courses. And, in the year 1688 and 1689 we were so far from giving any countenance to such courses that we encouraged the publishing the Prince of Orange’s Declaration at Glasgow before it was published in any other place of the kingdom; we prayed publicly for success to his enterprise even before his landing in England; we swore (in the National Covenant renewed at Lesmahagow, March 3, 1689) that we would stand to the defense of his Highness, his person and authority when lawfully chosen and established as king or supreme magistrate over us. The people we preached to, in consequence of this, went to Edinburgh with others and guarded the Convention of Estates, anno 1689, and mustered in one day 1,140 men as a regiment under the command of the right honorable, the late Earl of Angus, to fight for religion and liberty under the authority of King William of glorious memory. All which make it evident that our former testimony against tyranny was from no disloyal principle to magistracy; and consequently that these people never had any encouragement to live as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lining.html">Thomas Lining</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Epistle to the Reader’</cite>, p. vii in Alexander Shields, An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was Settled anno 1689 &amp; 1690… 2nd ed. (1706; Edinburgh: William Gray, 1747) Lining was one of the last three Cameronian ministers, all of whom joined the 1690 Church of Scotland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>3. We may allow passive subjection in some cases, even to tyrants; when the Lord lays on that yoke, and in effect says, He will have us to lie under it a while, as He commanded the Jews to be subject to Nebuchadnezzar: of which passage, adduced to prove subjection to tyrants universally, [George] Buchanan ubi supra infers that if all tyrants be to be subjected to, because God by His prophet commanded His people to be subject to one tyrant; then it must be likewise concluded that all tyrants ought to be killed, because Ahab’s house was commanded to be destroyed by Jehu. But passive subjection, when people are not in capacity to resist, is necessary. I do not say passive obedience, which is a mere chimera, invented in the brains of such sycophants as would make the world slaves to tyrants. Whosoever suffers if he can shun it, is an enemy to his own being: for every natural thing must strive to preserve itself against what annoys it; and also he sins against the order of God, who in vain has ordained so many lawful means for preservation of our being, if we must suffer it to be destroyed, having power to help it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hind let Loose</cite>, … (1687), pt. 3, Head 5, p. 582</span></figcaption>

oks Online</a></div>

<blockquote><p>Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>

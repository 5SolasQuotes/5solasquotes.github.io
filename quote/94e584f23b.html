</figure><figure class="quote" id="q-8c3bdd41af" data-kw="">
<blockquote><p>Sect. XVII. It is lawful to separate from particular churches in all the degrees and cases following:

1. It is lawful to abate our esteem of any church or pastor as they are less worthy, or more corrupt or culpable, and to value more the more worthy. Sect. XVIII.

2. It is lawful to remove one’s dwelling from one city or parish to another, for the just reasons of our worldly affairs, and thereby to remove from other churches: And it is lawful to do the same for the good of our souls, when one minister is bad or less fit for our edification and one church more corrupt and culpable and others more sound and pure and their communion more conducible to our salvation. Sect. XIX.

3. Parish bounds being but human institutions for order sake, it is lawful to be of a church in a neighbor parish instead of one’s own parish church in case we have the allowance of the higher powers, or without that in cases of true necessity, or when consideratis considerandis, the benefit is evidently greater than any hurt that it is like to do. For no man has power to bind me to that which is to the danger or detriment of my soul unless (at least) some greater notorious interest of the community require it. If my parish have an ignorant, unsound teacher or a weak, dull, dangerous or unprofitable, careless or scandalous, vicious pastor, [and] yet tolerable rather than to have none, or judged tolerable by the rulers, and the next parish have an able, holy, faithful pastor, by whom I am more abundantly edified, I am not bound by man’s commands to trust the conduct of my soul with the former or to deny myself the benefit of the latter when I cannot remove my dwelling: For men’s power is not to destruction but to edification; and order is for the thing ordered and not against it. My soul is more Christ’s and my own than the rulers. And I am not unthankfully to neglect the helps offered me by Christ (who ascended to give gifts to men for the edifying of his Body) merely because a man commands me so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, … (London: Hancock, 1680), pt. 3, ‘Of Schism’, ch. 1, pp. 7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

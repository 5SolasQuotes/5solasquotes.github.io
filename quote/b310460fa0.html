<main class="wrap"><figure class="quote" id="q-b310460fa0" data-kw="">
<blockquote><p>Two things are generally to be considered, the occasion of this [Galatians] epistle and the scope. The occasion that moved Paul to write this epistle was because certain false apostles slandered him both in respect of his calling as also in respect of his doctrine, teaching that he was no apostle and that his doctrine was false. And by this means they seduced the churches of Galatia, persuading them that justification and salvation was partly by Christ and partly by the law. The scope of the epistle is in three things. First, the apostle defends his calling in the first and second chapters. Secondly, he defends the truth of his doctrine, teaching justification by Christ alone. And upon this occasion he handles the greatest question in the world, namely, what is that justice whereby a sinner stands righteous before God, in the third and fourth and in the beginning of the fifth. Thirdly, he prescribes rules of good life in the fifth and sixth chapters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8bd6e9c392" data-kw="">
<blockquote><p>When Paul says: “He who does them, etc.,” he is comparing the righteousness of the Law and that of faith, as he also does in Romans 10:5 ff. It is as though he were saying: “It would indeed be fine if someone kept the Law.” But since no one does so, we must take refuge in Christ, who was put under the Law to redeem those who were under the Law (Gal. 4:4). Believing in Him, we receive the Holy Spirit and begin to keep the Law. Because of our faith in Christ what we do not keep is not imputed to us. But in the life to come believing will cease, and there will be a correct and perfect keeping and loving. For when faith ceases, it will be replaced by glory, by means of which we shall see God as He is (1 John 3:2). There will be a true and perfect knowledge of God, a right reason, and a good will, …heavenly, divine, and eternal. Meanwhile we must persevere here in faith that has the forgiveness of sins and the imputation of righteousness through Christ. Therefore no legalist keeps the Law. Since he is without faith, he is under a curse.” Thus Paul clearly distinguishes the worker of the Law from the man of faith. He is not speaking here about the believing doer of the Law; he is speaking about the doer of the Law who does not have the forgiveness of sins through Christ but wants to be justified solely through the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 274.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bd6e9c392.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bd6e9c392.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/09/since-no-one-does-so/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-fb7cd482f8" data-kw="">
<blockquote><p>. . . we must here observe the opposition between the law and the free promise of God in the justification of a sinner. “For if life come by the law, it comes not by the promise,” says Paul. And, “If they which are of the law are heirs, the promise is of none effect” (Rom. 4:14). By this we see the Church of Rome overturns and abrogates the free promise of God. For they of that church teach that the first justification is by mere mercy. And that the second is by the works of the law. But the law and the promise cannot be mixed together, more than fire and water. The law joined with the free promise disannuls the said promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 193.</span></figcaption>

</figure><figure class="quote" id="q-b86bb291ee" data-kw="">
<blockquote><p>The Reformation doctrine of justification helps us to see that our salvation is the work of Christ for us. It also delivers us from a life of doubt and fear that causes us to wonder how God could possibly love sinners like us. It shows us that we have peace with God objectively because Christ has satisfied the demands of God for us, and it shows us subjectively because we can know confidently that by faith in Christ we are right with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-robert-godfrey.html">W. Robert Godfrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tabletalk</cite>, April 2004, p. 18</span></figcaption>

</figure><figure class="quote" id="q-019380f2df" data-kw="">
<blockquote><p>Those who seek to be justified through the works of the Law not only fail to crucify their flesh but even increase its lusts—so far are they from being able to be justified. For the Law is the strength of sin (1 Corinthians 15:56) in that it stimulates lust and its contrary inclination even while forbidding it. But since faith in Christ loves the Law, which forbids lust, it now does the very thing the Law commands; it attacks and crucifies lust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Day by Day: 365 Devotional Readings with Martin Luther. Concordia Publishing House. Kindle Edition</cite></span></figcaption>

<blockquote><p>4. Another expression of this arrogant ignorance is, when men will not believe the several truths of God, because they are not able to reconcile them, and place each one in its own order, and see the method and body of truth in its true locations and proportion: Nay, perhaps they will believe none, because they cannot discern the harmony. …These self-conceited ignorant souls, do imagine all to be impossible which exceeds their knowledge; and because they cannot see[?] the sweet consent of Scripture, and how those places do suit, and fortify each other, which to them seemed to contradict each other, therefore they think that no one else can see it; no not God Himself… And upon this account many cast away particular truths, though they will not cast away all. Some cannot reconcile the efficiency of the Spirit, with that of the Word, in the Conversion and Confirmation of sinners; and therefore some exclude one, and some the other, or own by the empty names; some cannot reconcile the Law, and the Gospel: And too great a part of the teachers, in the Christian world, have been so troubled to reconcile God’s grace, with man’s free-will, that of old, many did too much exclude the natural liberty of the will, upon a supposition of the inconsistency; only the names of both were still owned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arrogancy of Reason Against Divine Revelations, Repressed. Or, Proud Ignorance the Cause of Infidelity, and of Men’s Quarrelling with the Word of God (1655; London)</cite>, pp. 21-24</span></figcaption>

olas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f393fe631.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=4.%20Another%20expression%20of%20this%20arrogant,names%20of%20both%20were%20still%20owned&amp;text=4.%20Another%20expression%20of%20this%20arrogant%20ignorance%20is&amp;text=only%20the%20names%20of%20both%20were%20still%20owned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The moral inability is not less because there is no want [lack] of natural ability, members, senses, or faculties in man. The need of a nature, principle, and disposition to act in a holy manner is as great an inability to it as if there was a want [lack] of members or faculties to operate in a natural manner. As the body cannot act without the soul, so the soul cannot do anything that is holy without the divine nature. 2 Peter 1:4. As the eye cannot behold any thing without the humor [transparent fluid in the eye], so the soul cannot act in a holy manner, though possessed of all the faculties, without a holy principle and disposition to do so. A spiritual life is as necessary to act in a holy manner, as natural life is for its actions…</p></blockquote>

<blockquote><p>…the Fall causes a damage or loss of moral and spiritual freedom (man can no longer do the good or love God); the natural freedom, by which man’s will can choose between opposites without being necessitated towards one of both, remains after the Fall. This natural freedom is essential to man, in the sense that without this freedom he would no longer be man as a rational and responsible creature. The Reformed authors treated in this volume [Zanchius, Junius, Gomarus, Voetius, Turretin, de Moore] take pains to combine the permanence of essential freedom (presupposing contingency in reality) with the disastrous slavery of sin by which man’s will s bound (accounting for the factual impossibility of doing the good, since we can only do the good by loving and obeying God). …human freedom does not go unqualified: man does not act out of nature, or contrary to the (ultimate) judgment of his intellect, or outside of God’s providence. Still, these forms of necessity obtain in terms of the necessity of the consequence by which the outcome (the consequent) is not made necessary in itself.</p></blockquote>

ary%20in%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VIII. Third, as to moral necessity arising from habits. For as the will can be called “free” if it is devoid of habit, so it can rightly be called “slavish” if by habit it has been determined to a certain manner of acting. Still this servitude by no means overthrows the true and essential nature of liberty. Otherwise it would follow that habits destroy the will (which they rather perfect and facilitate to operation). Hence moral habits are twofold: good and evil. A twofold servitude also is thence born: the one of righteousness in good; the other of sin in evil and misery. This belongs to man in a state of sin, of which John says, “Whosoever committeth sin is the servant of sin” (8:34); and “Ye were the servants of sin” (Rom. 6:17)… IX. Hence it is evident that the adversaries falsely charge our men with saying the will is a slave in the state of sin, as if its liberty were destroyed by that very thing. Scripture beforehand so calls it and indeed with a twofold limitation: (1) that “servant” should be understood not absolutely and physically, but relatively, after the fall in a state of sin; (2) not simply about every natural, civil, or externally moral object, but especially about a spiritual object good per se (in which manner inability to good is more strongly asserted, but the essence of liberty is not destroyed). Although the sinner is so enslaved by evil that he cannot but sin, still he does not cease to sin most freely and with the highest liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, Tenth Topic, ‘The Free Will of Man in a State of Sin’, Question 2. The reader is encouraged to see Turretin’s numerous discussions relating to the related issues throughout his Institutes, as he has a lot more to say.</cite>, p. 663</span></figcaption>

<blockquote><p>§XXXIV. Scotus and the Scotists, after Hales, Bonaventure, and Richard, also rightly state that the will, with respect to its acts, is more excellent than the intellect, for: 1. The Intellect is a merely natural and necessary faculty, which only represents and shows to the will things to be done and chosen, but does not command them; whereas the will determines the intellect to speculate on this or that, and often commands it to consider this and not that, and to judge in this way and not another. But it is more noble to command than to do or execute what is commanded. 2. Liberty, which is the highest perfection of an intellectual nature, inheres in the will, at whose nod the other faculties act or cease; from this, then, shines the nobility of the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Man’ (Frankfurt: Schwartz, 1712)</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“§XXXIV. Scotus and the Scotists, after Hales, Bonaventure, and Richard, also rightly state that the will, with respect to its acts, is more excellent than the intellect, for: 1. The Intellect is a merely natural and necessary faculty, which only represents and shows to the will things to be done and chosen, but does not command them; whereas the will determines the intellect to speculate on this or that, and often commands it to consider this and not that, and to judge in this way and not another. But it is more noble to command than to do or execute what is commanded. 2. Liberty, which is the highest perfection of an intellectual nature, inheres in the will, at whose nod the other faculties act or cease; from this, then, shines the nobility of the will.”

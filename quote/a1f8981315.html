<blockquote><p>Wherefore I say that by that place of the Acts of the Apostles ‘In the name of Jesus Christ,’ is meant, by the guiding, commandment, will and institution of Christ. Wherefore by these words rather it is known that the Apostles did altogether keep the form prescribed by Christ [in Mt. 28]. Otherwise they would not have baptized in the name of Christ, doing otherwise than He had commanded. Neither are we to think that the apostles who spread abroad religion with so great godliness and endeavor, rejected the form of baptizing delivered by Christ. Neither must we pass it over that the Schoolmen (as we read in Thomas) when they agree that the form of baptizing was in a manner changed by the apostles, write that this was done for a time by the dispensation of the Holy Ghost, to the intent the name of Christ might be made the more famous, and that therefore a perpetual law should not be drawn from thence… Neither is this doctrine to be suffered, that it is put in men’s authority to invert either the matter or the words of the Sacraments as these men have most impudently done: who not only have taken away the cup from the common people, but also the words spoken thereat, the which be very comfortable, and do more largely and significantly express the mysteries of our salvation than do the words which be uttered [by the papists at the Supper]…” (Common Places, pt. 4, ch. 11, p. 210) More research on the Reformed needs to be done. . Disagreements John’s Baptism Essentially the Same as Christ’s Turretin: “Was John’s baptism essentially the same as Christ’s baptism? We affirm against the Romanists [including Thomas, Summa, pt. 3, q. 38, art. 6].” (3.398) Voet: “Whether those baptized by John’s baptism afterward ought to have been baptized by Christ’s baptism? It is denied. Whether hence John’s baptism had the same efficacy with the baptism of Christ, the apostles and our baptism? It is affirmed.” (Syllabus, pt. 1, sect. 2, tract 5, appendix 1) . Only Ministers can Baptize, even in “Necessity</p></blockquote>

<blockquote><p>In general, Wittich tried to refute Spinoza’s monism by mobilizing Cartesian principles, which is particularly perspicuous in his discussion of God’s being. However, once he turned to the issue of the divine will, he openly contradicted Descartes’ teaching and approached Spinoza’s necessitarianism. He chose to do so to remain orthodox, evading the accusation of Socinian heresy, which the conservative theologian Petrus van Mastricht had made against his Theologia pacifica (1671). This paper concludes that the widespread fear concerning Socinianism deeply conditioned the way theologians reacted to the Cartesian philosophy in the Netherlands in the late seventeenth century.” – Abstract Sangiacomo, Andrea – ‘Divine Action &amp; God’s Immutability: a Historical Case Study on how to Resist Occasionalism’ European Journal of Philosophy of Religion, 7/4 (Summer 2015), pp. 115-135 Sangiacomo is an associate professor at the faculty of philosophy at the University of Groningen (NL). Abstract: “Today’s debates present ‘occasionalism’ as the position that any satisfying account of divine action must avoid. In this paper I discuss how a leading [French] Cartesian author of the end of the seventeenth century, Pierre-Sylvain Régis [1632–1707], attempted to avoid occasionalism. Régis’s case is illuminating because it stresses both the difficulties connected with the traditional alternatives to occasionalism (so-called ‘concurrentism’ and ‘mere-conservationism’) and also those aspects embedded in the occasionalist position that should be taken into due account. The paper focuses on Régis’s own account of secondary causation in order to show how the challenge of avoiding occasionalism can lead to the development of new accounts of divine action.</p></blockquote>

<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>

<blockquote><p>The greatest of the philosophers was John Duns Scotus, but there were others such as John Ireland, John Mair of Haddington and George Lokert of Ayr. Focusing on the concepts of will, intellect and faith… Broadie investigates the philosophy of these men and the relationships between their ideas. He places them within the framework of the medieval dispute between nominalists and realists which so characterised philosophy and theology in the Middle Ages. Scotus’ account of the primacy of will over intellect was demonstrably influenced by his Franciscan inheritance.” – Blurb . 2000’s A Companion to the Theology of John Mair eds. John T. Slotemaker &amp; Jeffrey C. Witt (Brill, 2015) 390 pp. ToC This work discusses the legacy of Scotus. . . In the Post-Reformation General Article Hoenen, Maarten J.F.M. – ‘Scotus &amp; the Scotist School: the Tradition of Scotist thought in the Medieval &amp; Early Modern Period’ in John Duns Scotus (1265/6–1308): Renewal of Philosophy, ed. Egbert P. Bos (Amsterdam: Rodopi, 1998), pp. 197-210 . Book Burton, Simon J.G. – Ramism &amp; the Reformation of Method: The Franciscan Legacy in Early Modernity in Oxford Studies in Historical Theology (Oxford Univ. Press, 2024) Blurb: “Reveals the deep roots of Ramism in medieval and Renaissance thought and its connection to a wider Franciscan reformation of method.</p></blockquote>

<blockquote><p>Thus, intellect and reason may not be considered as a basis for, as a rule to go by, or as a touchstone, in determining whether that which God reveals in His Word is truth. We believe this solely … because God declares it to be so. Reason must surrender itself to the Word; the Word must never surrender itself to reason. Reason is to Scripture what Hagar was to Sarah; it is the servant and not the master.</p></blockquote>

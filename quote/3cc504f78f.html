<main class="wrap"><figure class="quote" id="q-3cc504f78f" data-kw="">
<blockquote><p>Make much use of the Christian’s armour, recommended in Eph. vi. 11. As, 1st, The shield of faith. No fighting, no standing before the enemy without faith. God’s worthies, Heb. xi. “By faith turned to flight the armies of the aliens.”

2dly, Put on the helmet of salvation, a well-grounded hope of glory; this, like a helmet, will keep the head safe, when showers of darts are flying about you.

3dly, Get on the girdle of truth. The truth and faithfulness of God in his word, improven by faith, is like a girdle whereby the loins are made firm and strong in the day of battle. It is by the word of truth we are commanded to strengthen the weak hands, and to confirm the feeble knees.

4thly, Put on the breastplate of righteousness. By which we may either understand imputed righteousness, apprehended by faith, which, like a breastplate, fortifies the heart, and emboldens the believer against all accusers and accusations, and enables him to say, ”Who can lay any thing to my charge?” Or it may be understood of implanted righteousness and holiness, uprightness and integrity of heart and life, which, as I said, makes a man bold as a lion.

5thly, Make use of the sword of the Spirit, which is the word of God, both to offend the enemy and defend yourself. With this weapon Christ encountered and overthrew the enemy in the wilderness, “Thus and thus it is written.” With the same weapon all his soldiers are to fight. Lastly, Be much in prayer, wrestling with God upon your knees, calling for grace and mercy to help in time of need. Thus Jacob, like a prince, prevailed; “By his strength he had power with God, he had power with the angel, and prevailed; for he wept and made supplication unto him.</p></blockquote>

<blockquote><p>CANON 21. Concerning nature and grace. As the Apostle most truly says to those who would be justified by the law and have fallen from grace, “If justification were through the law, then Christ died to no purpose” (Gal. 2:21), so it is most truly declared to those who imagine that grace, which faith in Christ advocates and lays hold of, is nature: “If justification were through nature, then Christ died to no purpose.” Now there was indeed the law, but it did not justify, and there was indeed nature, but it did not justify. Not in vain did Christ therefore die, so that the law might be fulfilled by him who said, “I have come not to abolish them but to fulfill them” (Matt. 5:17), and that the nature which had been destroyed by Adam might be restored by him who said that he had come “to seek and to save the lost” (Luke 19:10).</p></blockquote>

<blockquote><p>23. This orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: …

2. Of the Pontificals:

1. Who interpret justification as justification [i.e., a making just] rather than justihabition [i.e., a holding just]; who press inherent righteousness and assail imputed righteousness as putative; who confound the righteousness of the cause and of the person, the legal and the evangelical, and weave a patchwork from both; and who thereby divide the business of justification between God and man, grace and free will. Who partition justification into a First and a Second: to the former they build up preparations and merits of congruity; to the latter they lay as foundation merits of condignity.

2. Who confound justifying faith with other species of faith; who deny that fiducial apprehension of Christ; who maintain it to be separable from charity, not only actual but also habitual; who contend that faith justifies only initially and incipiently, but good works completively.

3. Who deny either the perfection, or the stability, or the sense of justification in the justified, and heap up entire cartloads of errors in this place.</p></blockquote>

<blockquote><p>1. Because this is faith; and the Scripture says we are justified by faith.

2. We receive Christ by faith, Jn. 1:12. (3) We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them. 4. We are to believe without staggering, Rom. 4:19. (5) We have peace of conscience through faith, Rom. 5:1. (6) By faith we have access into this grace wherein wee stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but no where does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace, or pardon, but this they ascribe to faith.</p></blockquote>

<blockquote><p>This crass separation of sanctification from justification, as if it was merely an additional gift of grace to be sought and obtained for itself — instead of, as it is, an inseparable component part of the one salvation that belongs to all believers — lays the foundation, of course, for that circle of ideas which are summed up in the phrase, “the Second Blessing.” These are far from wholesome. Among them may be mentioned, for example, the creation of two different kinds of Christians, a lower and a higher variety.

With Mr. [Charles G.] Trumbull, these two classes of Christians are “merely saved people” and “real disciples of Christ.” “Thousands of saved people,” he says, are not following after Christ, are not bearing the cross, and therefore are not disciples. A Christian is one who is saved from the penalty of his sin; a disciple is one who, after being saved, becomes a learner, goes on learning more and more about Christ. This does not seem to be just Christ’s teaching (Mat. xvi. 24; Mark viii. 34; Luke ix. 23).

And one asks in amazement, What is the penalty of sin? And what is salvation from it? Is not our sinfulness the penalty above all other penalties of sin, and is not holiness just salvation from sin? Are we not to credit Paul when he tells us that “God chose us from the beginning unto salvation in sanctification of the Spirit?” (2 Thess. ii. 13), and in pursuance of this His primal purpose has called us in sanctification (1 Thess. iv. 7); and that therefore, saved by grace through faith, “we are His workmanship, created in Christ Jesus for good works, which God afore prepared that we should walk in them” (Eph. ii. 10)?

Mr. Trumbull’s distinction, however, is a necessary consequence of separating sanctification from justification, as a distinct blessing subsequently sought and obtained. As an inevitable result of it a most unpleasant note is sounded throughout the whole literature of this movement of what we cannot call anything else than spiritual pretension. These writers are always felicitating themselves upon not being as other men are — “ordinary Christians,” “average Christians”; and these “ordinary” or “average” Christians come in for a good deal of little-disguised scorn.

We are told by the tract called Subdued that not more than one in a thousand of converted men attain to “victory” — that is to say to the status of “disciples.” The rest are satisfied to live on a lower plane. “Where others are content with a meagre measure of piety and power, with an ambition merely to be saved as by fire,” we read in the tract called Victory, — “and you claim your full inheritance in Christ — an overcomer in order to reign with Him — that is victory.” It is possibly only the language employed here that reminds us of the incident recorded in Mat. xx. 20 ff. But it is not of humility that we especially are made to think as we read.</p></blockquote>

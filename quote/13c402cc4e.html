<main class="wrap"><figure class="quote" id="q-13c402cc4e" data-kw="">
<blockquote><p>We have here a full revelation of God’s favour to David and the kind intentions of that favour, the notices and assurances of which God sent him by Nathan the prophet… David’s purpose to build God a house is superseded. God took notice of that purpose, for he knows what is in man; and He was well pleased with it, as appears 1 Kings 8:18, Thou didst well that it was in thy heart; yet he forbade him to go on with his purpose (2 Sam. 7:5): “Shalt thou build me a house? No, thou shalt not (as it is explained in the parallel place, 1 Chron. 17:4)… That worship only is acceptable which is instituted; why should David therefore design what God never ordained? Let him wait for a warrant, and then let him do it. Better a tent of God’s appointing than a temple of his own inventing… God was not indebted to him for his good intentions, but, whatever he did for God’s honour, God was beforehand with him, 2 Samuel 7:8, 9… Blessings are entailed upon the family and posterity of David. David had purposed to build God a house, and, in requital, God promises to ‘build him a house,’2 Samuel 7:11. Whatever we do for God, or sincerely design to do though Providence prevents our doing it, we ‘shall in no wise lose our reward.’ He had promised to make him a name (2 Sam. 7:9); here he promises to make him a house, which should bear up that name… Though David came short of making good his purpose to build God a house, yet God did not come short of making good his promise to build him a house. Such is the tenour of the covenant we are under; though there are many failures in our performances, there are none in God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible</cite>, on 2 Samuel, ch. 7, vv. 4-17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4fbc8bf29" data-kw="">
<blockquote><p>Though God in mercy can distinguish between his own and ours, and does not count the whole worship to be in vain where any degree of superstition is mixed (for then most zealous persons were undone), yet the superstitious part of worship is always in vain; And all the rest is made as vain where that is the predominant and denominating part. Thus overdoing is undoing, and thus the superstitious are (materially) righteous overmuch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 58, p. 284</span></figcaption>

</figure><figure class="quote" id="q-c112d7d3a3" data-kw="">
<blockquote><p>Moses was not so well when he was in Midian, as if he had been in Canaan, yet better than when he was in Egypt: for though Jethro had not the worship of God pure in every respect, yet was not he an idolater. For then Moses would not have dwelt with him, nor yet have sacrificed with him, if he had offered to a strange God. Whence we learn two things: The first, that if we have the chief and principal points of religion with us although there may be some wants and defects, yet that we make much of God’s great blessing therein, and labor carefully and diligently to use them, showing ourselves thankful to God for them: so will the Lord in his due time bestow more blessings upon us, and minister that which is wanting unto us. Secondly, that the Lord will always have some to keep his truth, to the glory of his own name, and the condemnation of the wicked. Jethro’s religion may be tried by these notes:

1. That he rejoiced more for the deliverance of God’s people than for the promotion of his son.

2. Because he was careful to confirm his faith by the experience of them which had received greater graces.

3. Because his joy did break out into an open profession of sacrifice.

4. His divine speech and good counsel which he gave to Moses does testify that he was a pure worshipper of God: at the least he held the chiefest, and was not a novice in religion. By Jethro’s example we may learn to try our religion, if it be pure, then: [1.] It works in us a care to use all the means.

2. We take joy in them.

3. We express the fruits of it in our life.

4. We rejoice more at the prosperity of God’s people than at our own preferments or commodity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of</cite>, … Richard Greenham… (d. 1594?; London: Welby, 1612), pt. 4, ‘Godly Instructions’, ch. 66, ‘Of God’s Worship, &amp; of Religion True &amp; False’, p. 803</span></figcaption>

</figure><figure class="quote" id="q-c920bd6d5a" data-kw="">
<blockquote><p>…the spiritual worship of the inward man, and [that is] the very ground and foundation of all true worship of God: for God is a spirit and therfore must be worshipped in spirit [Jn. 4:24], that is, in the the mind, conscience, will, and affections. Indeed all the worship of God is spiritual, even that which we call outward; yet not of itself, but by virtue of the inward, from which it proceeds. The heads of inward worship are two: adoration of God and cleaving to God… The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22… Now we cleave unto God by four things: by faith, hope, love and inward invocation… we are to lift up our hearts unto God, upon every occasion, that by inward and holy motions and affections they may be (as it were) knit unto Him. Now to conclude this point touching inward worship, we must remember that it alone is properly, simply, and of itself the worship of God; and the outward is not simply the worship of God, but only so far forth as it is quickened by the inward, and grounded upon it. For God is a Spirit, and therefore the true worship that is done unto Him must be performed in spirit and truth, Jn. 4:24.</p></blockquote>

<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a817a3fce0" data-kw="">
<blockquote><p>Fourthly, it may inform us, if our God be so holy and pure, then his worship also must be pure. What should a pure God do with an impure and mixed worship? He will have no plowing with an ox and an ass… Dt. 22:10-11. There is no serving Him and idols too, Josh. 24:19. He tells these idolaters, ‘Ye cannot serve the Lord, for He is an holy and a jealous God’ that can endure no co-rival in his worship. He will have all done there according to the pattern; we must set up nothing in his worship without the warrant of his Word, Mt. 28:20. Whatsoever He commands, not whatsoever men command, must we observe to do. God’s courts are courts of holiness and therefore no uncleanness must be set up there, Isa. 62:9… Fifthly, it informs us that the persons must be pure: As the worship must be pure, so must the worshippers; The God of purity must have pure servants: the fountain of holiness will have none but holy followers. It is a disgrace to an eminent holy man to have a bastard lay claim to him. Ps. 50:16, To the wicked says God, ‘What hast thou to do to declare my statutes?’ Whenever we come to worship this glorious God, we must wash our hands in innocency, Ps. 26:6, and purge our families from sin, as Jacob did his from idols before he went to Bethel, Gen. 35:1-3. The people must be sanctified and prepared before the Lord will deliver his holy Law unto them; then and not tell then does God speak, Ex. 19:14-15 compared with 20:1. He will not take a wicked man by the hand. What communion has light with darkness, purity with impurity, virtue with vice, beauty with deformity, life with death, or the chiefest good with the foulest evil? There must be always a purging of our hearts from sin before we draw nigh to God in praying, hearing, sacraments, etc. else the Lord will abhor both us and our duties, and will answer us according to our idols, Eze. 14:3-4. Under the Law, if any man came to offer a sacrifice with his uncleanness on him, he must be cut off; there must be washing and cleansing before he came; so in all our approaches to God in duty there must be not only a habitual, but also an actual fitting and preparing of ourselves for the work. Therefore when James (4:8) had commanded us to draw nigh to God, he presently adds, ‘Cleanse your hands ye sinners, and purify your hearts.’ Our hearts are not fit to serve the living God till they be purged from dead works, Heb. 9:14; God will not vouchsafe to reason with us, nor to have any communion with us, till we have first washed ourselves and made us clean; Isa. 1:16-18, ‘Then come let us reason together.’ The Lord will be worshipped in the beauty of holiness or not at all, Ps. 96:9, there is no pleasing Him without it, and none that ever had it in truth but pleased him.</p></blockquote>

<blockquote><p>But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].</p></blockquote>

<blockquote><p>Distinction 2. If the sins be against the worship of God, as idolatry, or sins of a wicked conversation, the worship of God remaining pure and sound, at least in professed fundamentals. 3. If the idolatry be essential idolatry, as the adoring of the work of men’s hands, or only idolatry by participation, as Popish ceremonies, the surplice and cross, being as means of worship, but not adored, and so being idols by participation, as [William] Ames and Mr. [John] Ball do well distinguish (Fresh Suit Against Ceremonies [pt. 2, ch. 2, sect. 10-14, p. 207, says 107]; Answer to Mr. Cann, pt. 2, p. 23), and before them, so does the learned [John] Reynolds (De [romanae ecclesiae] idololatria, bk. 2, ch. 2) and [Thomas] Bilson (of Chri. Ar. Subject., part 4, pp. 321-22) make use of the distinction. … 5. Diverse degrees of separation are to be considered: hence these considerations: … 2. If the whole and most part of the Church turn idolatrous and worship idols (which is essential idolatry), we are to separate from that Church: the Levites and the two tribes did well, as Mr. Ball says, to make a separation from Jeroboam’s calves; and the godly, laudably, 2 Kings 16:11, did not separate from the Israel and Church of God because the altar of Damascus was set up, and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34 [vv. 14, 28], idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10 [v. 21]. Paul does not command separation from the Church of Corinth and the Table of the Lord there. … 5th Consideration. I see not but we may¹ separate from the Lord’s Supper where bread is adored and from baptism where the sign of the Cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the Word, and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church. ¹ [Note that Rutherford says we “may”, and not that it is a necessity. As Samuel Bolton says on this page, one might be physially forced to attend the mass, yet this is without guilt. Baxter, also on this page, argues that one may submit to one’s baby being baptized with the sign of the cross in certain necessary conditions.] 6. We may well hold that [Pseudo?] Ambrose says well that a Church wanting the foundation of the apostles, is to be forsaken (Commentary on Luke, bk. 6, ch. 1 [This work is not in Patrologia Latina vols. 14-17 and may not be rightly attributed, yet see this reference for it]). … 8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews though they rejected Christ, till they openly blasphemed, Acts 13:44-46; Acts 18:6. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean; from henceforth I will go to the Gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews who denied the Messiah and persecuted his servants, Acts 4; Acts 5, seeing there was a cleaner Church to which converts might join themselves, Acts 2:40-42. 9. There is no just cause to leave a less clean Church (if it be a true Church) and to go to a purer and cleaner, though one who is a member of no Church have liberty of election to join to that Church which he conceives to be purest and cleanest.</p></blockquote>

— Samuel Rutherford, The Due Right of Presbyteries… (1644) | pt. 2, ch. 4, sect. 5, pp. 252-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDistinction+2.+If+the+sins+be+against+the+worship+of+God%2C+as+idolatry%2C+or+sins+of+a+wicked+conversation%2C+the+worship+of+God+remaining+pure+and+sound%2C+at+least+in+professed+fundamentals.+3.+If+the+idolatry+be+essential+idolatry%2C+as+the+adoring+of+the+work+of+men%E2%80%99s+hands%2C+or+only+idolatry+by+participation%2C+as+Popish+ceremonies%2C+the+surplice+and+cross%2C+being+as+means+of+worship%2C+but+not+adored%2C+and+so+being+idols+by+participation%2C+as+%5BWilliam%5D+Ames+and+Mr.+%5BJohn%5D+Ball+do+well+distinguish+%28Fresh+Suit+Against+Ceremonies+%5Bpt.+2%2C+ch.+2%2C+sect.+10-14%2C+p.+207%2C+says+107%5D%3B+Answer+to+Mr.+Cann%2C+pt.+2%2C+p.+23%29%2C+and+before+them%2C+so+does+the+learned+%5BJohn%5D+Reynolds+%28De+%5Bromanae+ecclesiae%5D+idololatria%2C+bk.+2%2C+ch.+2%29+and+%5BThomas%5D+Bilson+%28of+Chri.+Ar.+Subject.%2C+part+4%2C+pp.+321-22%29+make+use+of+the+distinction.+%E2%80%A6+5.+Diverse+degrees+of+separation+are+to+be+considered%3A+hence+these+considerations%3A+%E2%80%A6+2.+If+the+whole+and+most+part+of+the+Church+turn+idolatrous+and+worship+idols+%28which+is+essential+idolatry%29%2C+we+are+to+separate+from+that+Church%3A+the+Levites+and+the+two+tribes+did+well%2C+as+Mr.+Ball+says%2C+to+make+a+separation+from+Jeroboam%E2%80%99s+calves%3B+and+the+godly%2C+laudably%2C+2+Kings+16%3A11%2C+did+not+separate+from+the+Israel+and+Church+of+God+because+the+altar+of+Damascus+was+set+up%2C+and+because+of+the+high+places.+Things+dedicated+unto+idols%2C+as+Lutheran+images%2C+may+be+called%2C+and+are+called%2C+1+Cor.+10%3A34+%5Bvv.+14%2C+28%5D%2C+idolatry%2C+yet+are+they+idolatry+by+participation%2C+and+so+the+cup+of+devils%2C+1+Cor.+10+%5Bv.+21%5D.+Paul+does+not+command+separation+from+the+Church+of+Corinth+and+the+Table+of+the+Lord+there.+%E2%80%A6+5th+Consideration.+I+see+not+but+we+may%C2%B9+separate+from+the+Lord%E2%80%99s+Supper+where+bread+is+adored+and+from+baptism+where+the+sign+of+the+Cross+is+added+to+Christ%E2%80%99s+ordinances%2C+and+yet+are+we+not+separated+from+the+Church%2C+for+we+professedly+hear+the+Word%2C+and+visibly+allow+truth+of+the+doctrine+maintained+by+that+Church%2C+which+do+pollute+the+sacraments%2C+and+we+are+ready+to+seal+it+with+our+blood%2C+and+it+is+an+act+of+visible+profession+of+a+Church+to+suffer+for+the+doctrine+mentioned+by+that+Church.+%C2%B9+%5BNote+that+Rutherford+says+we+%E2%80%9Cmay%E2%80%9D%2C+and+not+that+it+is+a+necessity.+As+Samuel+Bolton+says+on+this+page%2C+one+might+be+physially+forced+to+attend+the+mass%2C+yet+this+is+without+guilt.+Baxter%2C+also+on+this+page%2C+argues+that+one+may+submit+to+one%E2%80%99s+baby+being+baptized+with+the+sign+of+the+cross+in+certain+necessary+conditions.%5D+6.+We+may+well+hold+that+%5BPseudo%3F%5D+Ambrose+says+well+that+a+Church+wanting+the+foundation+of+the+apostles%2C+is+to+be+forsaken+%28Commentary+on+Luke%2C+bk.+6%2C+ch.+1+%5BThis+work+is+not+in+Patrologia+Latina+vols.+14-17+and+may+not+be+rightly+attributed%2C+yet+see+this+reference+for+it%5D%29.+%E2%80%A6+8.+There+may+be+causes+of+non-union+with+a+Church%2C+which+are+not+sufficient+causes+of+separation%3A+Paul+would+not+separate+from+the+Church+of+the+Jews+though+they+rejected+Christ%2C+till+they+openly+blasphemed%2C+Acts+13%3A44-46%3B+Acts+18%3A6.+And+when+they+opposed+themselves+and+blasphemed%2C+Paul+shook+his+raiment+and+said+unto+them%2C+%E2%80%98Your+blood+be+upon+your+own+heads%2C+I+am+clean%3B+from+henceforth+I+will+go+to+the+Gentiles.%E2%80%99+There+is+a+lawful+separation%2C+and+yet+before+the+Jews+came+to+this%2C+there+was+no+just+cause+why+any+should+have+joined+to+the+Church+of+the+Jews+who+denied+the+Messiah+and+persecuted+his+servants%2C+Acts+4%3B+Acts+5%2C+seeing+there+was+a+cleaner+Church+to+which+converts+might+join+themselves%2C+Acts+2%3A40-42.+9.+There+is+no+just+cause+to+leave+a+less+clean+Church+%28if+it+be+a+true+Church%29+and+to+go+to+a+purer+and+cleaner%2C+though+one+who+is+a+member+of+no+Church+have+liberty+of+election+to+join+to+that+Church+which+he+conceives+to+be+purest+and+cleanest.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%E2%80%A6+%281644%29+%7C+pt.+2%2C+ch.+4%2C+sect.+5%2C+pp.+252-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe61baa87e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe61baa87e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Distinction%202.%20If%20the%20sins%20be,conceives%20to%20be%20purest%20and%20cleanest&amp;text=Distinction%202.%20If%20the%20sins%20be%20against%20the&amp;text=which%20he%20conceives%20to%20be%20purest%20and%20cleanest" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Let every man walk within the compass of his calling. Whatsoever lies not in us to reform, it shall be our zeal and piety to tolerate, and with patience to forbear, especially in things of this nature, which concern not so much the outward communion with God or man, essentially required in a visible state, as the due ordering of business in the said communion, wherein there be many superfluities and defects, salva tamen Ecclesia; yea, and such a Church notwithstanding, as wherein the best and truest members (circumstances considered) may have more cause to rejoice than to grieve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians (d. 1617), ch. 2</cite>, pp. 297-98</span></figcaption>

</figure><figure class="quote" id="q-dc76ba989f" data-kw="">
<blockquote><p>Zanchi: In things indifferent something is to be yielded to the weaker, and that for a time; namely, until they be taught the truth. For if after that the truth is sufficiently and clearly laide abroad unto them so as being convicted they have nothing more what they may object and yet will notwithstanding stick in doubt; sure their infirmity is not to be nourished by their dissembling with them or winking at them. For this is rather strong obstinacy then weakness; Of Redemption, ch. 17, fol. 493. Beza in a case of [the threat of] deprivation [of one’s office as minister] advises to conform; yet before they conform he thus counsels them: That both the pastor and the flock sin not against their conscience (presupposing the purity of doctrine to be left entire:) We persuade the pastors that after they have freed their conscience, both before the King’s Majesty and the bishops, by a modest (as it becomes Christians to be free from all tumult and sedition) and yet weighty protestation (according as the greatness of the case requires:) they then do openly press unto their flocks those things which do tend to take away the offence arising from conformity, and do withal discreetly and peaceably give diligent endeavor for the amendment of these abuses, as the Lord shall offer occasion (and so to conform); Epistle 12, fol. 99.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, p. 196</span></figcaption>

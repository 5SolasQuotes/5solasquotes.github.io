<main class="wrap"><figure class="quote" id="q-aee029b880" data-kw="Author of sin|Free Will" data-pol="">
<blockquote><p>He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.</p></blockquote>
<figcaption>— <a href="../authors/william-ames.html">William Ames</a>, <cite>Bellarmine Disarmed</cite>, on the Cause of Sin, ch. 2</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4f7b0edf2" data-kw="Author of sin|Depravity" data-pol="">
<blockquote><p>The power of action is from God, but the viciousness of that action from our own nature. As when a clock or watch hath some fault in any of the wheels, the man that winds it up, or putting his hand upon the wheels moves them, he is the cause of the motion, but it is the flaw in it, or deficiency of something, is the cause of its erroneous motion. … Our motion is from God,—Acts 17:28, &#x27;In him we move&#x27;,—but not the disorder of that motion.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>A Treatise on Divine Providence</cite></figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a></div>

</figure><figure class="quote" id="q-8520e28d8b" data-kw="Author of sin|Free Will" data-pol="">
<blockquote><p>As there is a vast difference between the sun being the cause of the lightsomeness and warmth of the atmosphere, and the brightness of gold and diamonds, by its presence and positive influence; and its being the occasion of darkness and frost, in the night, by its motion, whereby it descends below the horizon. The motion of the sun is the occasion of the latter kind of events; but it is not the proper cause, efficient, or producer of them; though they are necessarily consequent on that motion, under such circumstances: no more is any action of the Divine Being the cause of the evil of men&#x27;s Wills.</p></blockquote>
<figcaption>— <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>Freedom of the Will</cite>, pt. 4, sec. 9</figcaption>

</figure><figure class="quote" id="q-dbd64be838" data-kw="Permission|Author of sin|Free Will" data-pol="">
<blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.6.8</figcaption>

</figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin" data-pol="">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>
<figcaption>— <a href="../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</figcaption>

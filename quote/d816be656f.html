<blockquote><p>…we must not separate ourselves from such a Church, except it err in the fundamental points of faith and true religion; but we must herein comfort ourselves that this schism is without heresy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-draxe.html">Thomas Draxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Armory</cite>, (London: Hall, 1611), bk. 2, ch. 6, p. 88</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-825af369d0" data-kw="">
<blockquote><p>The second means for healing divisions in the church is to have… some fundamental doctrines wherein all agree: this is the basis of unity and concord in the church. The ancients call it the rule of faith, seed of doctrine, the catholic faith, the character of the church, that which is common to small and great (Irenaeus, [Against Heresies] bk. 1, ch. 3; Nazianzen, Orations 14, 40; Augustine, Enchiridion, ch. 7; Tertullian, Of the Prescription, ch. 13–14; Of the Veiling of Virgins, ch. 1; Athanasian Creed; Irenaeus, bk. 1, ch. 1 [Preface]; Augustine, Epistle 57; see [Robert] Parker, Of the Descent [1611], bk. 4, §3. 1 Cor. 3:10–11; 2 Tim. 1:13; Col. 1:23; Eph. 4:13; 1 Tim. 3:16; Gal. 1:6; Rom. 6:17; 12:6; 2 Tim. 1:13–14; 1 Cor. 2:2; 1 Tim. 6:3; Tit. 1:1; Phil. 1:27; Rev. 14:1)… 2. Where there is this agreement in fundamentals, there ought to be mutual and fraternal affections, notwithstanding differences in other things; no reproaches, no exasperations, no individuous consequences, no odious imputations, no uncharitable digladiations; but an owning of one another as brethren and discussing and ventilating of the points in difference with the spirit of love and meekness, saying to one another, as Abraham to Lot, ‘Let there be no strife between thee and me, for we are brethren.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works</cite>, … (London: Holdsworth, 1826), sermon 14, “Brotherly Reconciliation” (1657/1659), pp. 155-57</span></figcaption>

et="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/825af369d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=The%20second%20means%20for%20healing%20divisions,and%20me%2C%20for%20we%20are%20brethren&amp;text=The%20second%20means%20for%20healing%20divisions%20in%20the&amp;text=between%20thee%20and%20me%2C%20for%20we%20are%20brethren" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1bbdab7c77" data-kw="">
<blockquote><p>As they that affect alienation from others make their differences as great and the adverse opinion or practice as odious as they can, thereby to further their desired victory over them and to harden themselves and their side against them: So on the contrary, they who desire peace and accord both interpret things in the best part that reasonably they can and seek how and where they may find any lawful door of entry into accord and agreement with others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Lawfulness of Hearing the Public Ministers in the Church of England</cite>, (1634) in The Lawfulness of Hearing the Public Ministers of the Church of England Proved, by Mr. Philip Nye &amp; Mr. John Robinson… (London, 1683), p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

— John Robinson, A Treatise of the Lawfulness of Hearing the Public Ministers in the Church of England (1634) in The Lawfulness of Hearing the Public Ministers of the Church of England Proved, by Mr. Philip Nye &amp; Mr. John Robinson… (London, 1683), p. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+they+that+affect+alienation+from+others+make+their+differences+as+great+and+the+adverse+opinion+or+practice+as+odious+as+they+can%2C+thereby+to+further+their+desired+victory+over+them+and+to+harden+themselves+and+their+side+against+them%3A+So+on+the+contrary%2C+they+who+desire+peace+and+accord+both+interpret+things+in+the+best+part+that+reasonably+they+can+and+seek+how+and+where+they+may+find+any+lawful+door+of+entry+into+accord+and+agreement+with+others.%E2%80%9D%0A%0A%E2%80%94+John+Robinson%2C+A+Treatise+of+the+Lawfulness+of+Hearing+the+Public+Ministers+in+the+Church+of+England+%281634%29+in+The+Lawfulness+of+Hearing+the+Public+Ministers+of+the+Church+of+England+Proved%2C+by+Mr.+Philip+Nye+%26+Mr.+John+Robinson%E2%80%A6+%28London%2C+1683%29%2C+p.+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1bbdab7c77.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1bbdab7c77.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=As%20they%20that%20affect%20alienation%20from,into%20accord%20and%20agreement%20with%20others&amp;text=As%20they%20that%20affect%20alienation%20from%20others%20make&amp;text=of%20entry%20into%20accord%20and%20agreement%20with%20others" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-7665cff6b5" data-kw="">
<blockquote><p>We say, furthermore, that these Reformed Churches do not dissent in the fundamentals of faith. For although they may dissent in some chapters of Doctrine, we nevertheless deny any dissension in the fundamentals of faith… We are not saying here that they do not dissent in rites and ceremonies, for not every such dissension, either by its own nature severs, or ought to sever, the union of the Reformed Churches, especially since none of the Reformed Churches retains rites that are repugnant to the Gospel or introduced with an opinion of worship… Augustine, in Epistle 86, wrote no less skillfully than holily: “Let the garment of the Church be so varied by different observances that it is not torn apart by adverse contentions.”… Furthermore, it should also be added that we do not say that the Reformed Churches do not likewise dissent in the external mode of administering ecclesiastical polity or discipline… Nevertheless, we also contend that, this discrepancy being admitted, there is still no dissension in the fundamentals of faith. Indeed, such diversity in external polity can and ought to be tolerated without injury to or rupture of fraternal unity, especially since all the reformed Churches retain those things which are absolutely necessary, namely, the pure preaching of the Word of God, the due administration of the Sacraments, the ordination of pastors by public authority, and finally, the censure of morals. It is not on account of a difference in external form in these matters, where there is consensus in the fundamentals of faith, that the Reformed Churches should fight among themselves and reject all external ecclesiastical union. … The Foundation of Faith denotes… The primary object of faith, which is Christ the Savior… An epitome of this doctrine of the prophets and apostles [Eph. 2:20], containing in itself the sum of the Law and the Gospel, can be and is accustomed to be most conveniently reduced to four heads. So Augustine in the Enchiridion. 1. The Apostles’ Creed. 2. The Decalogue. 3. The Lord’s Prayer. 4. The doctrine of the sacraments. … But neither do we say they dissent in the very many secondary and tertiary articles, which since they are sufficiently proposed to, revealed to, and understood by all the Reformed Churches, are asserted with unanimous consent by them against the old heresies of the Marcionites, Manichaeans, Arians, Eunomians, Nestorians, Eutychians, and Monothelites, and against the new heresies of the Romanists. In a very few secondary articles not sufficiently proposed to all, or certainly not well enough weighed by them, and in some tertiary ones whose clear deduction from the primary is still hidden from some Churches, let there be dissent… Yet that does not impede the harmony of faith (ὁμονοίαν πίστεως) nor does it, or should it, break the ecclesiastical unity of the said Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent in the Fundamentals of Faith’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 144-53, pp. 145-49</span></figcaption>

nd+reject+all+external+ecclesiastical+union.+%E2%80%A6+The+Foundation+of+Faith+denotes%E2%80%A6+The+primary+object+of+faith%2C+which+is+Christ+the+Savior%E2%80%A6+An+epitome+of+this+doctrine+of+the+prophets+and+apostles+%5BEph.+2%3A20%5D%2C+containing+in+itself+the+sum+of+the+Law+and+the+Gospel%2C+can+be+and+is+accustomed+to+be+most+conveniently+reduced+to+four+heads.+So+Augustine+in+the+Enchiridion.+1.+The+Apostles%E2%80%99+Creed.+2.+The+Decalogue.+3.+The+Lord%E2%80%99s+Prayer.+4.+The+doctrine+of+the+sacraments.+%E2%80%A6+But+neither+do+we+say+they+dissent+in+the+very+many+secondary+and+tertiary+articles%2C+which+since+they+are+sufficiently+proposed+to%2C+revealed+to%2C+and+understood+by+all+the+Reformed+Churches%2C+are+asserted+with+unanimous+consent+by+them+against+the+old+heresies+of+the+Marcionites%2C+Manichaeans%2C+Arians%2C+Eunomians%2C+Nestorians%2C+Eutychians%2C+and+Monothelites%2C+and+against+the+new+heresies+of+the+Romanists.+In+a+very+few+secondary+articles+not+sufficiently+proposed+to+all%2C+or+certainly+not+well+enough+weighed+by+them%2C+and+in+some+tertiary+ones+whose+clear+deduction+from+the+primary+is+still+hidden+from+some+Churches%2C+let+there+be+dissent%E2%80%A6+Yet+that+does+not+impede+the+harmony+of+faith+%28%E1%BD%81%CE%BC%CE%BF%CE%BD%CE%BF%CE%AF%CE%B1%CE%BD+%CF%80%CE%AF%CF%83%CF%84%CE%B5%CF%89%CF%82%29+nor+does+it%2C+or+should+it%2C+break+the+ecclesiastical+unity+of+the+said+Churches.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98The+Reformed+Churches+do+not+Dissent+in+the+Fundamentals+of+the+Faith%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%E2%80%A6+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+144-53%2C+pp.+145-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7665cff6b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7665cff6b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-

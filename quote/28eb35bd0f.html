<main class="wrap"><figure class="quote" id="q-28eb35bd0f" data-kw="">
<blockquote><p>The Mohammadan Theology of the Turks, Arabs, Persians, etc., has its name from Muhammad the Arab, a most cunning imposter, who began to put forth his own revelations in his fortieth year of age, in the year 612 of the common Era; while the time of the rise of Mohammadanism is reckoned to begin with the Hegira of the Arabs in the year 622 of the Dionysian Era, on the sixteenth day of July; namely, at which time Muhammad, who had begun to scatter the seeds of his new religion in Mecca, a chief city of the Arabian desert, being sought by the Magistrate of this city, secretly fled from Mecca to Medina, making use of a camel, with a multitude of his compatriots and dependents following. The principium and rule of the Mohammadan sect is the Alcoran [Koran].

The chief head of the Religion concerns Muhammad the Prophet, sent by God, who to the extent that he is greater than Christ, by so much he outshined Moses; while with the Holy Trinity they deny in particular the Deity of Christ, and His Satisfaction for the sins of His people. Now, Muhammad, so that he might propagate his new Religion all the more easily and successfully, astutely conflated it from various observances and rites; partly from the old Arabism and Gentilism, partly from Judaism, partly from the impure founts of the Gnostics, and other heresies distracting Christians at that time, Manichean, Arian, Nestorian: for in this manner he sought to capture the goodwill of the Arabs, Gentiles, Jews, and Heretics. The imposter died just over the age of sixty in the year of our Lord 632.

Among his followers, the names of the various sects are reckoned at seventy-two. Now, the principal Schism among the Mohammadans arose upon the occasion of a controversy concerning the right of succession in the principate: although Muhammad, bereft of male offspring, had designated his son-in-law Ali as successor; his three father-in-laws had first claimed the succession for themselves, who also were the first of the Caliphs before Ali, then about to succeed: hence in the following time some held Ali and his posterity as the legitimate successors of Muhammad, others otherwise: the Persians and even the Indians sided with the former; the Saracens, Egyptians, Turks, and Mongols sided with the latter …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ontinuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 6, pp 76-77.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c113c3d9d" data-kw="">
<blockquote><p>In a condition so awful, but, blessed be the God of their fathers, not absolutely exclusive of hope, Christians behold the present Jewish people; and, therefore, their bowels of compassion are moved towards them. That they possess some knowledge of Divine truth we deny not. This view of things, however, while it excites our wonder, increases our concern. We are grieved to see an unhappy people sinning against so much admitted light; and our indignation is roused, not merely against the subjects of this error and rebellion, but against the infernal deceiver, the author of delusion, the sacrilegious perverter of the truth, and of the right ways of the Lord.

At the sight of sacred truth abused, and of immortal souls deceived and led captive, our souls are set on fire; we feel the rising enmity which the original promise announces; and, while no hope is entertained for the author of evil, we wish to alarm and rescue his deluded captives, by putting energy into the truths they acknowledge, and by disjoining these truths from the uncongenial mass of error wherewith they have been loaded and contaminated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Modern Judaism Discriminate; or, A View of the Leading Differences of Sentiment between Christians and Jews: A Sermon, Delivered at Bury Street Meeting House, for the Instruction of the Jews in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, a</cite></span></figcaption>

</figure><figure class="quote" id="q-ec09ea65c9" data-kw="">
<blockquote><p>I have some parts of Mohammed’s Koran which in German might be called a book of sermons or doctrines of the kind that we call pope’s decretals. When I have time I must translate it into German so that everyone may see what a foul and shameful book it is.

In the first place, he greatly praises Christ and Mary as being the only ones without sin, and yet he believes nothing more of Christ than that he is a holy prophet, like Jeremiah or Jonah, and denies that he is God’s Son and true God. Furthermore, he does not believe that Christ is the Saviour of the world who died for our sins, but that he preached to his own time and completed his work before his death, just like any other prophet.

On the other hand, Mohammed highly exalts and praises himself and boasts that he has talked with God and the angels, and that since Christ’s office of prophet is now complete, he has been commanded to bring the world to his faith, and if the world is not willing to compel it or punish it with the sword; there is much glorification of the sword in it. Therefore the Turks think that their Mohammed is much higher and greater than Christ, for the office of Christ has come to an end and Mohammed’s office is still in force.

From this anyone can easily see that Mohammed is a destroyer of our Lord Christ and his kingdom, and if anyone denies the articles concerning Christ, that he is God’s Son, that he died for us and still lives and reigns at the right hand of God, what has he left of Christ? Father, Son, Holy Ghost, baptism, the sacrament, gospel, faith, and all Christian doctrine and life are gone, and instead of Christ only Mohammed with his doctrine of works and especially of the sword is left. That is the chief doctrines of the Turkish faith in which all abominations, all errors, all devils are piled up in one heap.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On War Against the Turk</cite>, (1528), trans. Charles M. Jacobs in Luther’s Works, 46: 176-77.</span></figcaption>

</figure><figure class="quote" id="q-160288216c" data-kw="">
<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].”

— Johannes Hoornbeeck, T’shuvah Yehudah, (Leiden, 1655), pp. 24-25 tr. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A717.+Now+to+the+Political+Means.+I.+Nothing+is+accomplished%2C+indeed%2C+things+are+done+badly%2C+by+persecuting%2C+harassing+or+oppressing+the+Jews%2C+driving+them+away%2C+or+killing+them.+That+is+to+say%2C+those+guilty+of+Judaism+alone+%5Bshould+not+be+harassed+or+oppressed%5D.+But+those+guilty+of+other+crimes+should+be+punished+equally+with+others.+Nevertheless%2C+they+should+not+be+treated+more+harshly+for+that+reason%2C+because+they+are+Jews.+We+do+not+wish+innocent+people+to+be+constrained+merely+because+they+are+Jews+or+Saracens.+Among+the+ancient+Sicilian+laws%2C+Emperor+Frederick+established+this+in+Constitutions+of+Sicily%2C+bk.+1%2C+title+17+%26+26%3A+%E2%80%98We+cannot+allow+Jews+and+Saracens%2C+whom+the+diversity+of+the+Christian+sect+makes+hostile%2C+and+who+are+deprived+of+every+other+assistance%2C+to+be+defrauded+of+the+power+of+our+protection.%E2%80%99+Christian+converts+from+Judaism+have+noted+that+this+perverse+practice+of+treating+Jews+more+harshly+is+a+great+hindrance+to+the+conversion+of+more+people.+For+it+is+entirely+foreign+to+the+nature+of+faith+to+employ+violence+in+order+to+produce+belief.+Petrus+Alphonsus+the+Spaniard%2C+in+The+Dialogue+of+Moses+%26+Peter%3A+%E2%80%98To+imprison+and+kill%2C+until+someone+either+believes+or+pays+a+tax%2C+is+not+among+the+works+of+God%3B+nor+did+any+of+the+prophets+command+anyone+to+be+compelled+to+believe.%E2%80%99+Likewise%2C+Stephanus+Isaacus+%28to+whom%2C+together+with+his+father+Johannes+Isaacus%2C+Cardinal+and+Papal+Legate+Franciscus+de+Mendoza+had+granted+authority+to+investigate+all+the+Jews+throughout+the+three+ecclesiastical+electorates%2C+and+to+rage+against+them+with+fire+and+sword%29+rightly+said+that+this+counsel+was+unjust+and+most+wicked%2C+and+that+more+is+accomplished+through+moderation+and+kindness+than+through+cruelty+or+savagery%2C+in+his+German+Apology%2C+p.+42.+The+same+was+noted+by+%5BJohannes%5D+Pfefferkorn+%5Bd.+1523%5D+and+others.+Therefore%2C+the+better+and+more+common+opinion%2C+both+among+theologians+and+among+jurists%2C+is+that+the+Jews+should+be+tolerated%E2%80%94not+indeed+enticed%2C+but%2C+where+they+are+found%2C+not+treated+more+harshly.+Thus%3A+%E2%80%A2+Baldus%2C+vol.+1%2C+Consil%2C+315-16+%E2%80%A2+Rolandus+a+Valle%2C+vol.+3%2C+Consil%2C+25+%E2%80%A2+Alexander+of+Hales%2C+Summa%2C+pt.+2%2C+Questions+179-80+%E2%80%A2+Vincent+of+Beauvais%2C+Spec.+Doctr.%2C+bk.+10%2C+ch.+38%2C+etc.+%E2%80%A2+Johannes+Gerhard%2C+Common+Places%2C+On+the+Magistrate%2C+p.+631+%E2%80%A2+Hottinger%2C+Thesaurus+Philologicus%2C+bk.+1%2C+ch.+1%2C+section+2%2C+question+1+And+the+one+who+treated+this+matter+learnedly+and+extensively+in+a+separate+book%2C+Georgius+Theodorus%2C+Counselor+of+Hesse%2C+De+jure+et+statu+Iud%C3%A6orum+in+Republica+Christianorum+%5BOn+the+Law+and+Status+of+the+Jews+in+the+Republics+of+Christians%5D.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+T%E2%80%99shuvah+Yehudah%2C+%28Leiden%2C+1655%29%2C+pp.+24-25+tr.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F160288216c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/160288216c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=17.%20Now%20to%20the%20Political%20Means,Jews%20in%20the%20Republics%20of%20Christians&amp;text=17.%20Now%20to%20the%20Political%20Means.%20I.%20Nothing&amp;text=of%20the%20Jews%20in%20the%20Republics%20of%20Christians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74a8c3b17a" data-kw="">
<blockquote><p>The common outcry is that it is the setting up of ‘altar against altar,’ which is not so, for at the most it is but altar by altar; and though I have often read of one Body, and one Spirit, and one Hope, and one Lord, and one Faith, and one Baptism, and one God and Father (Eph. 4:4-6), yet I could never find a word in all the New Testament of one altar, except Jesus Christ, Heb. 13:10, the Altar that sanctifies every gift, in whom we all centre. And if there be any of the dissenters who are schismatical, i.e. contentious, bitter, and uncharitable in their separation, let them bear their own burden; but by my presence with them I encourage that in them no more than I do too much of a like spirit in too many of those who are called the Church of England men, by my adherence to them. To conclude, by all this it is evident that unity of affection is the thing to be labored after more than uniformity in modes and ceremonies. We have been long enough trying to root schism out of the Church, vi et armis, by impositions, fines, and penalties, choking our brethren because their throats have not been so wide as ours; and it has been found ineffectual, even in the judgment of our great Sanhedrim, who have declared that giving ease to scrupulous consciences is the likeliest way to unite their Majesty’s protestant subjects in interest and affection. What if we should now try another method, and turn the stream of our endeavors into another channel? Hitherto we have been as it were striving which should hate one another most; what if we should now strive which should love one another best, and be most ready to do all offices of true charity and kindness, and bury all our little feuds and animosities in that blessed grave of Christian love and charity? What if we should every one of us of each party (as we have been too often called) set ourselves by our preaching to promote and propagate the Gospel of peace, and by our prayers to prevail with God for a more plentiful pouring out of the Spirit of peace, that the dividing names of Baalim may be taken out of our mouths, and that however it goes with uniformity of ceremony, we may keep the unity of the Spirit; and then I doubt not but we should soon see our English Jerusalem established a praise in the midst of the earth. And yet I am afraid even saints will be men; there will be remainders even of those corruptions which are the seed of schism, in the best, till we all come to the perfect man. And that is the comfort of my soul, that if we can but once get to heaven we shall be forever out of the noise and hurry of this quarrelsome, contentious, dividing world, and the Church Triumphant shall be no more militant; but that happy world of everlasting light will be a world of everlasting love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Enquiry into the True Nature of Schism: or a Persuasive to Christian Love &amp; Charity… (London: Parkhurst, 1690) 34 pp.</cite>, pp. 32-34</span></figcaption>

</figure><figure class="quote" id="q-8a629bf9c0" data-kw="">

</figure><figure class="quote" id="q-f0f6fa5789" data-kw="">
<blockquote><p>My light carried me to join with them that protested against these Resolutions, and the Assemblies that followed thereafter; and I was present at the first meeting of some of the Protesters in the West at Kilmarnock, and thereafter at several of their meetings: But indeed I was not satisfied in my mind that the Protesters kept so many meetings, so numerous, and of so long continuance, which I thought made the division wider, and the more conspicuous than otherwise it would have been; and therefore I stayed from many meetings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-cd9c648b65" data-kw="">
<blockquote><p>So that it would not be a sufficient reason for forsaking the communion of a Church, only to allege a general depravation of manners, even when it should be true, that it did reign therein: But it is no less certain, that when it falls out, that one party of the Church… should confirm itself in errors, and in practices contrary to the service of God, and the salvation of men; and that not only it rejects the instructions given it upon that occasion, but would even force all others to be of the same sentiments, and to practice the same worship, the separation of the other party is just, necessary and indispensable: It is just, for everywhere where there can be nothing else but an unjust communion, there is justice in a separation from it: But there can be nothing else, but unjust communion with a party, which essentially destroys the true worship of God, which shuts up itself in errors, directly contrary to men’s salvation, and which, through an intolerable tyrrany, would constrain all those who live in it, to make a profession of the same errors, it is then just for a man to separate himself from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

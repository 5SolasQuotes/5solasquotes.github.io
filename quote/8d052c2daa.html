<main class="wrap"><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-623aa7b562" data-kw="">
<blockquote><p>Now, the Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith</cite>, on ch. 1, §§ 9–10</span></figcaption>

</figure><figure class="quote" id="q-1219b1eb93" data-kw="">
<blockquote><p>Pedagogically the church is prior to Scripture. But in the logical order Scripture is the sole foundation (principium unicum) of church and theology. In case of conflict between them, the possibility of which can never be denied on a Reformational view, church and confession must yield to Scripture. … Nothing may be put on a level with Scripture. Church, confession, tradition—all must be ordered and adjusted by it and submit themselves to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-a9307165a8" data-kw="">
<blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, Book I, ch. 2, p. 51</span></figcaption>
